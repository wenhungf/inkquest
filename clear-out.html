<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>深淵觀光團</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
:root{
  color-scheme: dark;
  --bg:#17131c; --panel:#241d2b; --panel2:#30273a; --line:#4a3d57;
  --text:#f3ece0; --muted:#b4a8bf; --torch:#f2a33a; --torch-ink:#3a2200;
  --hp:#6fd08c; --hp-low:#ff6b6b; --danger:#ff6b6b;
  --C:#bcb6c8; --R:#5aa7ff; --E:#c07bff; --L:#ffcf4a;
  --display:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none !important}
/* dark-only game: paint the page ourselves so a light viewer theme can't turn it white */
html{background:#17131c !important;color-scheme:dark}
html body{background-color:#17131c !important}
.backdrop{position:fixed;inset:0;z-index:-1;pointer-events:none;background:#17131c;
  background-image:radial-gradient(520px 300px at 12% -6%, rgba(242,163,58,.16), transparent 70%),radial-gradient(480px 260px at 100% 0%, rgba(120,90,200,.12), transparent 70%)}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px calc(10px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:10px;height:100%}
.wrap>*{flex:none}
.num{font-variant-numeric:tabular-nums}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.04em;line-height:1.1;flex:none;white-space:nowrap}
.logo small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.1em;white-space:normal;max-width:14em}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:1 1 0;min-width:0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;white-space:nowrap;color:var(--text)}
.chip b{font-weight:700;font-size:15px}
.chip.snd{font-size:14px;line-height:1.2;padding:4px 9px}
.chip.lang{font-family:var(--body);font-size:12px;line-height:1.35;padding:4px 9px;min-width:38px}

/* the level as a 10-step corridor; boss steps are marked */
.corridor{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.corridor i{height:7px;border-radius:2px;background:var(--line)}
.corridor i.done{background:var(--torch)}
.corridor i.now{background:var(--text);animation:blink 1.2s infinite}
.corridor i.boss:not(.done):not(.now){background:transparent;box-shadow:inset 0 0 0 1.5px var(--danger)}
@keyframes blink{50%{opacity:.35}}

/* stage */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.wrap>.stage{flex:1 1 auto;min-height:0}
/* only the log may shrink on short screens; foes and party keep their full height */
.stage>*:not(.logwrap){flex:none}
.enc-tag{font-size:11px;color:var(--torch);letter-spacing:.12em}
.enc-name{font-family:var(--display);font-weight:900;font-size:18px;line-height:1.2}
.enc-q{font-size:12px;color:var(--muted)}
.foes{display:flex;justify-content:center;gap:6px;min-height:84px}
.foe{flex:0 1 calc(25% - 4.5px);background:var(--panel2);border-radius:10px;padding:5px 4px 6px;text-align:center;position:relative;min-width:0;border:1.5px solid transparent}
.foe.boss{border-color:var(--danger)}
.foe img.px{margin:0 auto}
.foe .fn{font-size:10.5px;line-height:1.2;min-height:2.4em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
.foe .fh{font-size:10px;color:var(--muted)}
.foe.dead{opacity:.25;filter:grayscale(1)}
.foe.hit{animation:shake .25s}
.foe.mad .fn{color:var(--danger)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bar{height:6px;background:#0d0b12;border-radius:3px;overflow:hidden;margin-top:3px}
.bar>span{display:block;height:100%;background:var(--danger);transition:width .25s}
.bar.hpb>span{background:var(--hp)}
.bar.hpb.low>span{background:var(--hp-low)}

.party{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hero{background:var(--panel2);border-radius:10px;padding:6px 4px;text-align:center;border:1.5px solid transparent;position:relative;min-width:0;cursor:pointer}
.hero img.px{margin:0 auto}
.hero .n{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.hero .s{font-size:9.5px;color:var(--torch);letter-spacing:.04em;min-height:13px;line-height:1.3}
.hero .a{white-space:nowrap;font-size:clamp(9px,2.6vw,10px);color:var(--muted);letter-spacing:-.03em}
.hero .a .ic{font-style:normal;font-size:.8em;margin-right:1px}
.hero .lvtag{position:absolute;top:3px;left:5px;font-size:9.5px;color:var(--muted)}
.hero .cls{position:absolute;top:2px;right:4px;font-size:11px}
.hero .syn{position:absolute;top:18px;right:4px;font-size:10px}
.hero.dead{opacity:.35;filter:grayscale(1)}
.hero.hit{animation:shake .25s}
.hero.empty{border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;min-height:96px}
.hero.r-C{border-color:var(--C)}.hero.r-R{border-color:var(--R)}.hero.r-E{border-color:var(--E)}.hero.r-L{border-color:var(--L)}

.logwrap{position:relative;flex:1 1 0;min-height:5.2em;display:flex}
/* if a phone is too short for everything, the page scrolls instead of the log spilling out of the box */
.wrap>.stage{min-height:auto}
/* room for the “tap to expand” tip, so it never covers the last line */
body:not(.fighting) .log{padding-bottom:1.6em}
.log{background:#0f0c14;border-radius:10px;padding:8px 10px;flex:1 1 auto;min-height:0;overflow-y:auto;font-size:13px;display:flex;flex-direction:column;gap:3px;cursor:zoom-in}
.log p{margin:0}
.log .sys{color:var(--muted)}
.log .good{color:var(--hp)}
.log .bad{color:var(--danger)}
.log .gold{color:var(--L)}
.log-tip{position:absolute;right:8px;bottom:6px;font-size:10.5px;color:var(--muted);background:rgba(15,12,20,.85);border-radius:6px;padding:1px 6px;pointer-events:none}

/* actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font-family:var(--display);font-weight:700;font-size:17px;border:0;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--text);background:var(--panel2);transition:transform .08s, filter .15s}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--torch);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button small{display:block;font-family:var(--body);font-weight:400;font-size:11px;opacity:.8}
.btn-pull{background:linear-gradient(180deg,#45375a,#33284a);border:1px solid #5d4c78}
.go-row{grid-column:1/-1;display:flex;gap:8px}
.btn-go{flex:1;background:var(--torch);color:var(--torch-ink);font-size:19px}
.btn-go small{opacity:.75}
.btn-auto{flex:none;width:68px;font-family:var(--body);font-size:20px;line-height:1.1;background:var(--panel2);border:1px solid var(--line)}
.btn-auto small{font-size:11px}
.btn-auto[aria-pressed="true"]{background:var(--torch);color:var(--torch-ink);border-color:var(--torch)}
.btn-skip{display:none;width:100%;font-family:var(--body);font-size:14px;padding:10px;background:var(--panel2);border:1px solid var(--line)}
.btn-skip[aria-pressed="true"]{color:var(--torch);border-color:var(--torch)}
/* during a battle the controls step aside and the log takes their space */
.fighting .actions,.fighting .buffs,.fighting .foot{display:none}
.fighting .btn-skip{display:block}
.fighting .log-tip{display:none}
.fighting .log{cursor:pointer}
.logbig .actions,.logbig .buffs,.logbig .foot,.logbig .party,.logbig .foes{display:none}
.logbig .log{cursor:zoom-out}
.buffs{font-size:12px;color:var(--muted)}
.buffs b{color:var(--text);font-weight:500}
.buffs .bs{white-space:nowrap}
.hall-chip{background:none;border:0;padding:0;font:inherit;color:var(--L);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:nowrap}
.foot #pity{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.foot-btns{display:flex;gap:6px;flex-shrink:0}
.foot button{font-family:var(--body);font-weight:400;font-size:12px;padding:6px 9px;border-radius:8px;background:transparent;border:1px solid var(--line);color:var(--muted)}
html[lang="en"] .foot button{padding:6px 7px}
html[lang="en"] .foot-btns{gap:5px}
#partyBtn{position:relative}
#partyBtn.can-up::after{content:'';position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--L);box-shadow:0 0 6px var(--L)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(8,6,12,.84);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow-y:auto}
.modal h2{font-family:var(--display);font-weight:900;font-size:22px;margin:0;text-align:center;text-wrap:balance}
.modal p{margin:0}
.modal>*{flex-shrink:0}
.modal .btns{display:flex;flex-direction:column;gap:8px}
.modal .btns button{width:100%}
.center{text-align:center}
.big{font-size:52px;text-align:center;line-height:1}
.big img.px{margin:0 auto}
.summary{font-size:13px;color:var(--muted);text-align:center}

/* cards */
.cards{display:grid;gap:8px}
.cards.one{grid-template-columns:1fr;justify-items:center}
.cards.ten{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.card{perspective:800px;width:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.cards.one .card{max-width:240px}
.card-in{position:relative;transition:transform .5s;transform-style:preserve-3d;transform:rotateY(180deg)}
.card.open .card-in{transform:rotateY(0)}
.face,.back{backface-visibility:hidden;border-radius:10px}
.back{position:absolute;inset:0;transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#3a2e4c 0 8px,#31274a 8px 16px);border:2px solid #5d4c78;display:flex;align-items:center;justify-content:center;font-family:var(--display);color:#a596c4;font-size:22px}
.face{background:var(--panel2);border:2px solid var(--rc);padding:12px 10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;box-shadow:0 0 18px -4px var(--rc);font-family:var(--body)}
.face .rar{font-size:10px;letter-spacing:.12em;color:var(--rc)}
.face .e{font-size:48px;line-height:1.1}
.face .nm{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.25}
.face .cl{font-size:11px;color:var(--muted)}
.face .st{font-size:12px;color:var(--torch)}
.face .ds{font-size:12px;opacity:.9}
.face .q{font-size:11.5px;color:var(--muted);font-style:italic}
.face .tag{font-size:10px;background:var(--rc);color:#111;border-radius:6px;padding:1px 6px}
.face.alt{display:none;outline:2px dashed var(--rc);outline-offset:-6px}
.card.showalt .face.main{display:none}
.card.showalt .face.alt{display:flex}
.cards.ten .face{padding:6px 2px;gap:1px}
.cards.ten .face .e{font-size:24px}
.cards.ten .face img.px{width:32px;height:32px}
.cards.ten .face .nm{font-size:9.5px;line-height:1.2;font-family:var(--body);font-weight:500;overflow-wrap:break-word;hyphens:auto}
.cards.ten .face .rar{font-size:8px;letter-spacing:.04em}
.cards.ten .face .cl,.cards.ten .face .ds,.cards.ten .face .q,.cards.ten .face .st{display:none}
.cards.ten .face .tag{font-size:8px;padding:0 3px}
.cards.ten .card-in{min-height:84px}
.rL .face{animation:gold 1.6s infinite}
@keyframes gold{50%{box-shadow:0 0 34px 2px var(--L)}}
.lp-hint{font-size:12px;color:var(--muted);text-align:center;margin:0}

/* collection, party editor */
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dex .it{font-family:var(--body);font-weight:400;font-size:11.5px;line-height:1.35;background:var(--panel2);border-radius:10px;padding:8px 4px;text-align:center;border:1.5px solid var(--rc);color:var(--text)}
.dex .it .e{font-size:26px;line-height:1.25}
.dex .it img.px{margin:0 auto 2px}
.dex .it .sub{color:var(--torch)}
.dex .it .stat{display:block;color:var(--muted);font-size:10.5px}
.dex .it.no{opacity:.35;filter:grayscale(1);border-color:var(--line);cursor:default}
.dex.slots{grid-template-columns:repeat(4,1fr)}
.dex .it.sel{outline:2px solid var(--torch);outline-offset:2px}
.dex .it.empty-slot{border-style:dashed;border-color:var(--line);color:var(--muted);background:transparent}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#0f0c14;border-radius:10px;padding:4px}
.tabs button{font-family:var(--body);font-weight:400;font-size:12px;padding:8px 2px;border-radius:8px;background:transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--text)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#0f0c14;border-radius:10px;padding:4px}
.seg button{font-family:var(--body);font-weight:400;font-size:13px;padding:8px 4px;border-radius:8px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--text)}
.sec{font-family:var(--display);font-weight:700;font-size:15px;color:var(--torch);margin:4px 0 -4px}
.info{background:#0f0c14;border-radius:10px;padding:10px 12px;font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.info dt{color:var(--muted)}
.info dd{margin:0}
.tpow{background:#0f0c14;border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.tpow b{color:var(--text);font-weight:500}
.tpow .pw{font-family:var(--display);font-weight:900;font-size:18px;color:var(--torch)}
.tpow .up{color:var(--hp)}.tpow .down{color:var(--danger)}
.team-hint{font-size:12.5px;color:var(--muted);text-align:center;margin:0;min-height:1.4em}
.team-hint.warn{color:var(--torch)}
.danger-link{font-family:var(--body);font-weight:400;font-size:12px;background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 10px;border-radius:8px;align-self:center}
.syns{display:flex;flex-direction:column;gap:6px}
.syncard{background:#0f0c14;border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;border:1.5px solid transparent;font-size:12.5px;font-family:var(--body);font-weight:400;color:var(--text);text-align:left;line-height:1.5;width:100%}
.syncard.on{border-color:var(--torch)}
.syncard .ce{font-size:22px;grid-row:span 2;align-self:center}
.syncard .cn{font-family:var(--display);font-weight:700;font-size:14px}
.syncard .cn b{font-family:var(--body);font-weight:500;font-size:11px;color:var(--torch-ink);background:var(--torch);border-radius:5px;padding:0 5px;margin-left:6px}
.syncard .cd{color:var(--muted)}
.syncard .cm{grid-column:2;display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.syncard .go{grid-column:2;font-size:11.5px;color:var(--torch)}
.hall{background:linear-gradient(135deg,rgba(255,207,74,.12),rgba(255,207,74,.03));border:1.5px solid var(--L);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center}
.hall .re{font-size:26px;grid-row:span 2}
.hall .rn{font-family:var(--display);font-weight:700;font-size:15px;color:var(--L)}
.hall .rd{font-size:12px;color:var(--muted);grid-column:2}
.hall button{grid-row:1/span 2;grid-column:3;font-family:var(--body);font-size:13px;padding:8px 12px;background:var(--L);color:#2a1d00;border-radius:8px;white-space:nowrap}
.hall button:disabled{background:var(--panel2);color:var(--muted)}
.wipe-up{display:flex;flex-direction:column;gap:6px;background:#0f0c14;border-radius:10px;padding:10px 12px;font-size:13px;text-align:center}
.wipe-up b{color:var(--L)}
.ach{display:flex;flex-direction:column;gap:6px}
.ach div{background:#0f0c14;border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;border:1.5px solid transparent}
.ach div.got{border-color:var(--L)}
.ach div.no{opacity:.55}
.ach .ae{font-size:22px;grid-row:span 3;align-self:center}
.ach .an{font-family:var(--display);font-weight:700;font-size:14px}
.ach .ad{color:var(--muted)}
.ach .ar{color:var(--torch);font-size:11.5px}
.help{display:flex;flex-direction:column;gap:14px}
.help h3{font-family:var(--display);font-weight:700;font-size:16px;margin:0 0 4px;color:var(--torch)}
.help section{display:flex;flex-direction:column;gap:4px}
.help p,.help li{font-size:13.5px;margin:0}
.help ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px}
.help b{font-weight:500;color:var(--text)}
.help .rar-row{display:flex;flex-wrap:wrap;gap:6px}
.help .rar-row span{font-size:12px;border:1.5px solid var(--rc);border-radius:999px;padding:2px 9px;color:var(--rc)}
.help table{border-collapse:collapse;font-size:12.5px}
.help td{padding:2px 8px 2px 0;vertical-align:top}
/* about */
.ab{display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.75}
.ab-art{display:flex;justify-content:center;gap:6px}
.ab-brand{margin:0;text-align:center;font-family:var(--display);font-weight:900;font-size:26px;line-height:1.1}
.ab-brand span{color:var(--torch)}
.ab-slogan{margin:-6px 0 0;text-align:center;font-style:italic}
.ab-sub{margin:-12px 0 0;text-align:center;color:var(--muted);font-size:13px}
.ab h3{font-family:var(--display);font-weight:700;font-size:16px;color:var(--torch);margin:6px 0 -4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.ab p b{color:var(--torch);font-weight:500}
.ab-note{background:#0f0c14;border-radius:10px;padding:8px 12px;text-align:center;font-weight:500}
.ab-info{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}
.ab-info dt{color:var(--muted)}
.ab-info dd{margin:0}
.ab-copy{font-size:12px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top, 0px));transform:translate(-50%,-150%);z-index:30;background:var(--panel2);border:1.5px solid var(--L);border-radius:12px;padding:10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .35s;width:min(340px, calc(100% - 32px));text-align:center;font-size:13px}
.toast.show{transform:translate(-50%,0)}
.toast b{display:block;font-family:var(--display);font-weight:700;font-size:16px;color:var(--L)}

/* splash */
.splash{position:fixed;inset:0;z-index:20;background:var(--bg);
  background-image:radial-gradient(420px 320px at 50% 32%, rgba(242,163,58,.18), transparent 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 16px;text-align:center;transition:opacity .35s}
.splash.bye{opacity:0;pointer-events:none}
.gate{position:relative;width:min(270px,76vw);height:150px;border-radius:120px 120px 6px 6px;background:radial-gradient(ellipse at 50% 85%, #2b2236 0%, #0d0a12 70%);border:6px solid #4d4058;box-shadow:inset 0 0 0 3px #2c2433, 0 0 40px -10px rgba(242,163,58,.6);display:flex;align-items:flex-end;justify-content:center;gap:2px;padding-bottom:6px;overflow:hidden}
.gate .peek{position:absolute;top:28px;left:50%;transform:translateX(-50%);opacity:.55;filter:brightness(.6)}
.gate .torch{position:absolute;top:40px;width:10px;height:18px;border-radius:50% 50% 30% 30%;background:radial-gradient(circle at 50% 70%, #ffe08a, #f2a33a 50%, #c2491f);animation:flicker .3s infinite alternate}
.gate .torch.l{left:16px}.gate .torch.r{right:16px}
@keyframes flicker{to{transform:scale(1.15) translateY(-1px);opacity:.85}}
.splash .t{font-family:var(--display);font-weight:900;font-size:clamp(34px,10vw,44px);letter-spacing:.06em;line-height:1.1;margin:0}
.splash .slogan{font-family:var(--display);font-weight:700;font-size:18px;color:var(--torch);margin:0}
.splash .sub{font-size:13px;color:var(--muted);margin:0}
.splash .copy{font-size:11.5px;color:var(--muted);opacity:.75;margin:10px 0 0}
.splash button{background:var(--torch);color:var(--torch-ink);font-size:19px;padding:12px 36px;border-radius:10px;margin-top:4px}
.lang-btn{position:absolute;top:calc(12px + env(safe-area-inset-top, 0px));right:16px;font-family:var(--body);font-size:13px;padding:6px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--text)}

/* English uses Latin faces: CJK fonts draw ’ “ ” as full-width glyphs */
[lang="en"]{--display:"Pixelify Sans","Noto Serif TC",system-ui,sans-serif;--body:"Nunito","Noto Sans TC",system-ui,sans-serif}
[lang="zh-Hant"]{--display:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;--body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
html[lang="en"] .hero .n{font-size:10.5px;white-space:normal;line-height:1.15;min-height:2.3em;display:flex;align-items:center;justify-content:center}
html[lang="en"] .logo small{letter-spacing:.02em}

  <h1 class="t" data-s="title">深淵觀光團</h1>
  <p class="slogan" data-s="slogan">每座地城都有出口。大概啦。</p>
  <p class="sub" data-s="splashSub">抽卡就好，打怪交給隊伍。</p>
  <button id="startBtn" data-s="start">報名出團</button>
  <p class="sub" id="splashHint" data-s="hintTap">👆 點一下畫面，開啟音樂</p>

  <button class="lang-btn" id="langBtn2" aria-label="Switch language">EN</button>
</div>
<div class="wrap">
  <header class="top">
    <div class="logo"><span data-s="title">深淵觀光團</span></div>
    <div class="chips">
      <button class="chip lang" id="langBtn" aria-label="Switch language">EN</button>
      <button class="chip snd" id="soundBtn" aria-label="關閉聲音">🔊</button>
      <span class="chip">💎 <b class="num" id="gems">10</b></span>
    </div>
  </header>
  <div class="corridor" id="corridor"></div>

  <section class="stage">
    <div class="enc-head"><div class="enc-tag" id="encTag"></div><div class="enc-name" id="encName"></div><div class="enc-q" id="encQ"></div></div>
    <div class="foes" id="foes"></div>
    <div class="party" id="party"></div>

  </section>

  </div>

  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>

<script>
/* ===== i18n.js ===== */
/* Clear Out · language. Chinese is the default; English is one tap away, and long-press shows a card in the other language.
   Every player-facing line is a [zh, en] pair or an object with an `en` sub-object. */
let LANG='zh'; try{ if(localStorage.getItem('clearout-lang')==='en') LANG='en'; }catch(e){}
const other=l=>l==='en'?'zh':'en';
const tx=(zh,en,l=LANG)=>l==='en'?en:zh;
/* N(item, field, lang): the zh value lives on the item, the en value in item.en */
const N=(c,f,l=LANG)=>l==='en'&&c.en&&c.en[f]!=null?c.en[f]:c[f];
const STR={
  title:['深淵觀光團','Clear Out'],
  tagline:['抽卡組隊，地城交給公會','Pull cards. Your party clears the dungeon.'],
  slogan:['每座地城都有出口。大概啦。','Every dungeon has an exit. Usually.'],
  splashSub:['抽卡就好，打怪交給隊伍。','Just pull cards. Your party does the fighting.'],
  start:['報名出團','Join the Tour'],
  hintTap:['👆 點一下畫面，開啟音樂','👆 Tap the screen to turn on the music'],
  pull1:['抽一張','Pull ×1'],
  pull10:['十連抽','Pull ×10'],
  pull10sub:['💎 10・必出史詩以上','💎 10 · Epic or better'],
  go:['前進！','Go!'],
  partyBtn:['隊伍','Party'],
  dexBtn:['圖鑑','Cards'],
  rulesBtn:['規則','Rules'],
  aboutBtn:['關於','About'],
};
function applyStatic(){
  document.documentElement.lang=LANG==='en'?'en':'zh-Hant';
  document.title=STR.title[LANG==='en'?1:0];
  document.querySelectorAll('[data-s]').forEach(el=>{const v=STR[el.dataset.s]; if(v) el.textContent=v[LANG==='en'?1:0]});
  ['langBtn','langBtn2'].forEach(id=>{const b=$(id); b.textContent=LANG==='en'?'中文':'EN'; b.setAttribute('aria-label',LANG==='en'?'切換成中文':'Switch to English')});
}
/* ===== data.js ===== */
/* Clear Out · content. Everything a dungeon level adds lives here: crew, gear, events, synergies, encounters, awards.
   Numbers that tune the game sit next to the content they tune. */

/* ---------- rarity ---------- */
const RAR={
  C:{name:'普通',en:{name:'Common'},w:55,css:'var(--C)'},
  R:{name:'稀有',en:{name:'Rare'},w:30,css:'var(--R)'},
  E:{name:'史詩',en:{name:'Epic'},w:12,css:'var(--E)'},
  L:{name:'傳說',en:{name:'Legendary'},w:3,css:'var(--L)'}
};
const ORDER=['C','R','E','L'];
const PITY_MAX=30;
const TYPE_NAME={hero:['隊員','Crew'],gear:['裝備','Gear'],event:['事件','Event']};
const typeName=(t,l=LANG)=>TYPE_NAME[t][l==='en'?1:0];

/* ---------- classes: the mechanical role. A card = class + archetype (the person) ----------
   atk/hp are multipliers on the rarity base. Traits: taunt (3× as likely to be hit), cleave, area, assassin, sniper. */
const CLASSES={
  fighter:  {icon:'🛡️',role:'front',  atk:1.00,hp:1.50,taunt:true,       name:'戰士',en:{name:'Fighter',  how:'Front line. Monsters attack them more often (Taunt).'},how:'前排。怪物比較常打他（嘲諷）。'},
  barbarian:{icon:'🪓',role:'front',  atk:1.20,hp:1.20,trait:'cleave',  name:'蠻族',en:{name:'Barbarian',how:'Front line. Extra damage spills onto the next monster (Cleave).'},how:'前排。打倒怪物後，多出來的傷害會砍到下一隻（順劈）。'},
  paladin:  {icon:'✝️',role:'front',  atk:0.90,hp:1.40,taunt:true,       name:'聖騎士',en:{name:'Paladin', how:'Front line with Taunt. Heals the whole party a little every round.'},how:'前排，會嘲諷。每回合幫全隊回一點血。'},
  rogue:    {icon:'🗡️',role:'damage', atk:1.25,hp:0.85,trait:'assassin',name:'盜賊',en:{name:'Rogue',    how:'Damage. +10% against monsters below half HP (Finisher).'},how:'輸出。打生命低於一半的怪物 +10%（收尾）。'},
  ranger:   {icon:'🏹',role:'damage', atk:1.25,hp:0.85,trait:'sniper',  name:'遊俠',en:{name:'Ranger',   how:'Damage. +10% against monsters above half HP (Opener).'},how:'輸出。打生命高於一半的怪物 +10%（開場）。'},
  wizard:   {icon:'🔮',role:'damage', atk:1.25,hp:0.85,trait:'area',    name:'法師',en:{name:'Wizard',   how:'Damage. Hits every monster at once for 65% (Area). Weak against a lone boss.'},how:'輸出。一次打所有怪物，每隻 65%（範圍）。單挑魔王比較吃虧。'},
  cleric:   {icon:'✚', role:'support',atk:0.60,hp:1.00,                   name:'牧師',en:{name:'Cleric',   how:'Support. Heals the most hurt party member every round.'},how:'輔助。每回合治療傷最重的隊友。'},
  bard:     {icon:'🎵',role:'support',atk:0.60,hp:0.90,                   name:'吟遊詩人',en:{name:'Bard',  how:'Support. The party hits harder every round, up to a limit.'},how:'輔助。全隊攻擊力每回合提高，有上限。'},
  druid:    {icon:'🌿',role:'support',atk:0.70,hp:1.00,                   name:'德魯伊',en:{name:'Druid',  how:'Support. Monsters deal less damage while the Druid stands.'},how:'輔助。德魯伊站著的時候，怪物的傷害降低。'}
};
const RBASE={C:{atk:6,hp:28},R:{atk:8,hp:32},E:{atk:11,hp:40},L:{atk:15,hp:50}};

/* ---------- crew ----------
   kit = this person's numbers on top of the class:
     crit {chance, mult, every}  a strong hit (every = guaranteed on every Nth round instead of a chance)
     double {chance}             attacks twice      heal {pct}      partyHeal {pct}      song {step, cap}
     soothe {cut}                monsters deal less damage        guard {cut}  takes less damage
     area {pct}                  replaces the class's 65%          confuse {chance}  a monster loses its turn
   critQ = the [zh, en] note shown in the log when the kit fires. */
const HEROES=[
  {id:'farmhand',pack:'warrens',cls:'fighter',r:'C',sp:'farmhand',kit:{crit:{chance:.2,mult:1.5}},critQ:['乾草叉一戳！','Pitchfork poke!'],
    name:'帶乾草叉的農家子',short:'農家子',skill:'乾草叉',desc:'會嘲諷。20% 機率乾草叉一戳，傷害 ×1.5。',q:'「媽說六點吃晚飯，我們快點打完。」',
    en:{name:'The Farmhand with a Pitchfork',short:'Farmhand',skill:'Pitchfork',desc:'Taunt. 20% chance of a pitchfork poke for ×1.5 damage.',q:'“Mom says dinner’s at six. Let’s make this quick.”'}},
  {id:'lute',pack:'warrens',cls:'bard',r:'C',sp:'lute',kit:{song:{step:.05,cap:.25}},
    name:'酒館魯特琴手',short:'琴手',skill:'加油歌',desc:'全隊攻擊每回合 +5%，最多 +25%。',q:'「我只會三首歌。第三首是第一首倒著彈。」',
    en:{name:'The Tavern Lute Player',short:'Lute Player',skill:'Fight Song',desc:'Party attack +5% every round, up to +25%.',q:'“I know three songs. The third one is the first one, backward.”'}},
  {id:'ratcatcher',pack:'warrens',cls:'ranger',r:'C',sp:'ratcatcher',kit:{double:{chance:.25}},critQ:['連射！','Double shot!'],
    name:'捕鼠人',short:'捕鼠人',skill:'連射',desc:'開場型：打生命高於一半的怪物 +10%。25% 機率射兩箭。',q:'「哥布林？就是比較大隻的老鼠。」',
    en:{name:'The Rat-Catcher',short:'Rat-Catcher',skill:'Double Shot',desc:'Opener: +10% on monsters above half HP. 25% chance to shoot twice.',q:'“Goblins? Just bigger rats.”'}},
  {id:'knight',pack:'warrens',cls:'paladin',r:'R',sp:'knight',kit:{partyHeal:{pct:.03}},
    name:'膝蓋不好的退休騎士',short:'退休騎士',skill:'老騎士的祝福',desc:'會嘲諷。每回合全隊回復 3% 生命。',q:'「我還能打。只是蹲下去就起不來。」',
    en:{name:'The Retired Knight with a Bad Knee',short:'Old Knight',skill:'Old Knight’s Blessing',desc:'Taunt. Heals the whole party 3% HP every round.',q:'“I can still fight. I just can’t kneel.”'}},
  {id:'apprentice',pack:'warrens',cls:'wizard',r:'R',sp:'apprentice',kit:{crit:{chance:.15,mult:2}},critQ:['火放太大了！','Way too much fire!'],
    name:'燒掉圖書館的學徒',short:'魔法學徒',skill:'火球（偏大）',desc:'範圍攻擊：一次打所有怪物，每隻 65%。15% 機率火放太大，傷害 ×2。',q:'「那是意外。第二次也是。」',
    en:{name:'The Apprentice Who Burned Down the Library',short:'Apprentice',skill:'Fireball (Large)',desc:'Area: hits every monster for 65%. 15% chance the fire gets out of hand: ×2 damage.',q:'“That was an accident. So was the second time.”'}},
  {id:'pickpocket',pack:'warrens',cls:'rogue',r:'R',sp:'pickpocket',kit:{crit:{chance:.3,mult:2}},critQ:['背刺！','Backstab!'],
    name:'街頭小扒手',short:'小扒手',skill:'背刺',desc:'收尾型：打生命低於一半的怪物 +10%。30% 機率背刺，傷害 ×2。',q:'「你的錢包？沒看到喔。」',
    en:{name:'The Street Pickpocket',short:'Pickpocket',skill:'Backstab',desc:'Finisher: +10% on monsters below half HP. 30% chance to backstab for ×2 damage.',q:'“Your wallet? Haven’t seen it.”'}},
  {id:'healer',pack:'warrens',cls:'cleric',r:'E',sp:'healer',kit:{heal:{pct:.12}},
    name:'見過大風大浪的村醫',short:'村醫',skill:'坐好別動',desc:'每回合治療傷最重的隊友 12% 生命。',q:'「更慘的我都看過。坐好別動。」',
    en:{name:'The Village Healer Who Has Seen Everything',short:'Healer',skill:'Sit Still',desc:'Every round, heals the most hurt party member 12% HP.',q:'“I’ve seen worse. Sit still.”'}},
  {id:'berserker',pack:'warrens',cls:'barbarian',r:'E',sp:'berserker',kit:{crit:{chance:.25,mult:1.8}},critQ:['狂暴！','Rage!'],
    name:'冬天也打赤膊的狂戰士',short:'狂戰士',skill:'狂暴',desc:'順劈：打倒怪物後，多的傷害砍向下一隻。25% 機率狂暴，傷害 ×1.8。',q:'「冷？什麼是冷？」',
    en:{name:'The Berserker Who Never Wears a Shirt',short:'Berserker',skill:'Rage',desc:'Cleave: extra damage spills onto the next monster. 25% chance to rage for ×1.8 damage.',q:'“Cold? What’s cold?”'}},
  {id:'herbwife',pack:'warrens',cls:'druid',r:'E',sp:'herbwife',kit:{soothe:{cut:.15},confuse:{chance:.1}},
    name:'森林裡的草藥婆婆',short:'草藥婆婆',skill:'安神香草',desc:'她站著的時候，怪物的傷害 −15%。每隻怪物每回合有 10% 機率被藤蔓纏住，不能攻擊。',q:'「那朵蘑菇可以吃。那朵不行。那朵也不行。」',
    en:{name:'The Herb Granny of the Woods',short:'Herb Granny',skill:'Calming Herbs',desc:'While she stands, monsters deal 15% less damage. Each round, each monster has a 10% chance to get tangled in vines and skip its attack.',q:'“You can eat that mushroom. Not that one. Not that one either.”'}},
  {id:'stranger',pack:'warrens',cls:'rogue',r:'L',sp:'stranger',kit:{crit:{chance:.4,mult:2.5}},critQ:['影襲！','From the shadows!'],
    name:'角落卡座的兜帽怪客',short:'兜帽怪客',skill:'影襲',desc:'收尾型：打生命低於一半的怪物 +10%。40% 機率從陰影出手，傷害 ×2.5。',q:'「我不是來喝酒的。……好啦，我也是來喝酒的。」',
    en:{name:'The Hooded Stranger in the Corner Booth',short:'Stranger',skill:'From the Shadows',desc:'Finisher: +10% on monsters below half HP. 40% chance to strike from the shadows for ×2.5 damage.',q:'“I’m not here for the ale. …Fine. I’m also here for the ale.”'}},
  {id:'archmage',pack:'warrens',cls:'wizard',r:'L',sp:'archmage',kit:{area:{pct:.8},crit:{every:3,mult:2}},critQ:['流星雨！','Meteor shower!'],
    name:'在找眼鏡的大法師',short:'大法師',skill:'流星雨',desc:'範圍攻擊：一次打所有怪物，每隻 80%。每第 3 回合召喚流星雨，傷害 ×2。',q:'「我的眼鏡呢？……啊，在頭上。」',
    en:{name:'The Archmage Looking for His Glasses',short:'Archmage',skill:'Meteor Shower',desc:'Area: hits every monster for 80%. Every 3rd round, a meteor shower: ×2 damage.',q:'“Where are my glasses? …Ah. On my head.”'}},
  {id:'slayer',pack:'warrens',cls:'fighter',r:'L',sp:'slayer',kit:{guard:{cut:.25},crit:{chance:.2,mult:1.5}},critQ:['盾擊！','Shield bash!'],
    name:'據說屠過龍的屠龍者',short:'屠龍者',skill:'屠龍盾',desc:'會嘲諷。受到的傷害 −25%。20% 機率盾擊，傷害 ×1.5。',q:'「龍？當然屠過。很大一隻，在很遠的地方。沒人看到。」',
    en:{name:'The Dragon-Slayer (Allegedly)',short:'Dragon-Slayer',skill:'Dragon Shield',desc:'Taunt. Takes 25% less damage. 20% chance of a shield bash for ×1.5 damage.',q:'“A dragon? Sure, I killed one. A big one. Far away. Nobody saw.”'}},
  /* hidden crew: never in the card pool; an award hands them over */
  {id:'parrot',secret:true,cls:'bard',r:'E',sp:'parrot',kit:{song:{step:.04,cap:.2},confuse:{chance:.2}},
    name:'會說十國語言的鸚鵡',short:'鸚鵡',skill:'外語轟炸',desc:'全隊攻擊每回合 +4%，最多 +20%。每隻怪物每回合有 20% 機率聽不懂牠在說什麼，愣住不攻擊。',q:'「Hello！你好！Bonjour！給餅乾！」',
    en:{name:'The Polyglot Parrot',short:'Parrot',skill:'Language Barrage',desc:'Party attack +4% every round, up to +20%. Each round, each monster has a 20% chance to get confused by what it’s saying and skip its attack.',q:'“Hello! 你好! Bonjour! Cracker, please!”'}},
  {id:'mimic',secret:true,cls:'barbarian',r:'E',sp:'mimic',kit:{crit:{chance:.3,mult:2}},critQ:['大口一咬！','Big chomp!'],
    name:'想當冒險者的寶箱怪',short:'寶箱怪',skill:'大口一咬',desc:'順劈：打倒怪物後，多的傷害咬向下一隻。30% 機率大口一咬，傷害 ×2。',q:'「我不是寶箱。我是冒險者。……請不要打開我。」',
    en:{name:'The Mimic Who Wants to Be an Adventurer',short:'Mimic',skill:'Big Chomp',desc:'Cleave: extra damage spills onto the next monster. 30% chance of a big chomp for ×2 damage.',q:'“I’m not a chest. I’m an adventurer. …Please don’t open me.”'}}
];
/* stats come from rarity × class unless a card sets its own */
HEROES.forEach(h=>{const c=CLASSES[h.cls],b=RBASE[h.r]; if(h.atk==null)h.atk=Math.round(b.atk*c.atk); if(h.hp==null)h.hp=Math.round(b.hp*c.hp);});
const H=Object.fromEntries(HEROES.map(h=>[h.id,h]));
const shortName=(h,l=LANG)=>l==='en'?(h.en.short||h.en.name):(h.short||h.name);
const STARTER='farmhand';

/* ---------- gear: flat stats for the whole party; slot is flavor ---------- */
const GEAR=[
  {id:'shortsword',pack:'warrens',slot:'weapon',name:'生鏽的短劍',e:'🗡️',r:'C',atk:1,hp:0,q:'還能用。大概。',en:{name:'Rusty Shortsword',q:'Still works. Probably.'}},

/* build each encounter's foes once: names (A/B/C when there are several of one kind), sprite, split budget */
function buildEncounters(list){
  return list.map(enc=>{
    const counts={}; enc.foes.forEach(f=>counts[f.k]=(counts[f.k]||0)+1);
    const seen={};
    const defs=enc.foes.map(f=>{const base=FOES[f.k]; const n=counts[f.k]>1?' '+'ABCD'[(seen[f.k]=(seen[f.k]||0)+1)-1]:'';
      return {...f,sp:base.sp,name:base.name+n,en:{name:base.en.name+n}}});
    return {...enc,pack:Engine.makePack(defs,enc.budget)};
  });
}

const spriteCache={};
function spritePixels(def,extraPal){

function spriteURL(key){

/* Clear Out · FM-synth music and sound (Web Audio, no files).
   Each note is a carrier oscillator whose pitch is wobbled by a modulator (FM), like the sound chips of early-90s PCs.
   iOS rule carried over from Clock Out: audio must be unlocked inside a tap, with a silent buffer and resume(). */
const Sound=(()=>{
  let ctx=null, master, music, sfxBus, timer=null, song=null, step=0, next=0;
  let on=true; try{on=localStorage.getItem('clearout-sound')!=='off'}catch(e){}
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  const _=0;
  /* 4 bars × 16 steps. chords = bar roots (MIDI), third = 3 (minor) or 4 (major) */
  const SONGS={
    title:{bpm:80, chords:[57,53,55,52], third:[3,4,4,3],
      mel:[69,_,_,_,72,_,76,_,74,_,_,_,72,_,71,_, 69,_,_,_,65,_,69,_,67,_,_,_,64,_,_,_,
           69,_,72,_,76,_,79,_,77,_,76,_,74,_,72,_, 71,_,72,_,74,_,71,_,69,_,_,_,_,_,_,_],
      bass:[0,8], pad:true, arp:[0,4,8,12], kick:[], snare:[], hat:[]},
    guild:{bpm:104, chords:[50,55,50,48], third:[3,4,3,4],
      mel:[74,_,77,_,81,_,_,_,79,_,77,_,76,_,74,_, 79,_,83,_,86,_,_,_,84,_,83,_,81,_,79,_,
           74,_,77,_,81,_,84,_,83,_,81,_,79,_,77,_, 76,_,74,_,72,_,76,_,74,_,_,_,_,_,_,_],
      bass:[0,6,8,14], pad:false, arp:[], kick:[0,8], snare:[], hat:[4,12]},
    battle:{bpm:150, chords:[52,48,50,47], third:[3,4,4,4],
      mel:[76,_,76,79,76,_,74,_,72,_,74,_,76,_,_,_, 72,_,72,76,72,_,71,_,69,_,71,_,72,_,_,_,
           74,_,74,78,74,_,72,_,71,_,72,_,74,_,_,_, 71,_,74,_,78,_,83,_,81,_,79,_,78,_,_,_],
      bass:[0,2,4,6,8,10,12,14], oct:true, pad:false, arp:[], kick:[0,4,8,12], snare:[4,12], hat:[2,6,10,14]}
  };
  SONGS.boss={...SONGS.battle,bpm:166,chords:[52,53,50,47],third:[3,4,3,4]};
  function init(){
    if(ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx=new AC();
    master=ctx.createGain(); master.gain.value=.5; master.connect(ctx.destination);
    music=ctx.createGain(); music.gain.value=.3; music.connect(master);
    sfxBus=ctx.createGain(); sfxBus.gain.value=.5; sfxBus.connect(master);
  }
  /* one FM note: ratio = modulator pitch / carrier pitch; index = how hard it wobbles (higher = brighter, buzzier) */
  function fm(f,t,dur,vol,dest,ratio=1,index=2,wave='sine',decayIndex=true){
    const car=ctx.createOscillator(), mod=ctx.createOscillator(), mg=ctx.createGain(), g=ctx.createGain();
    car.type=wave; car.frequency.value=f; mod.frequency.value=f*ratio;
    mg.gain.setValueAtTime(f*index,t); if(decayIndex) mg.gain.exponentialRampToValueAtTime(Math.max(1,f*index*.15),t+dur);
    mod.connect(mg); mg.connect(car.frequency);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    car.connect(g); g.connect(dest);
    car.start(t); mod.start(t); car.stop(t+dur+.02); mod.stop(t+dur+.02);
  }
  let noiseBuf=null;
  function noise(t,dur,vol,hp){
    if(!noiseBuf){noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.3,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    const src=ctx.createBufferSource(), fl=ctx.createBiquadFilter(), g=ctx.createGain();
    src.buffer=noiseBuf; fl.type='highpass'; fl.frequency.value=hp;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    src.connect(fl); fl.connect(g); g.connect(music); src.start(t); src.stop(t+dur+.02);
  }
  function kick(t){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(40,t+.12);
    g.gain.setValueAtTime(.6,t); g.gain.exponentialRampToValueAtTime(.001,t+.15);
    o.connect(g); g.connect(music); o.start(t); o.stop(t+.16);
  }
  function playStep(sg,i,t){
    const s16=60/sg.bpm/4, bar=Math.floor(i/16)%4, pos=i%16, root=sg.chords[bar];
    const m=sg.mel[i%64];
    if(m){let len=1;while(len<4&&!sg.mel[(i+len)%64])len++; fm(mtof(m),t,len*s16*.95,.13,music,1,1.6)}     /* brassy lead */
    if(sg.bass.includes(pos)){const oct=sg.oct&&pos%4===2?12:0; fm(mtof(root-12+oct),t,s16*(sg.oct?1.8:3.5),.32,music,.5,1.2)}  /* round FM bass */
    if(sg.pad&&pos===0){[0,sg.third[bar],7].forEach(n=>fm(mtof(root+12+n),t,s16*15,.04,music,2,.6,'sine',false))}  /* soft organ pad */
    if(sg.arp.includes(pos)){const n=[0,sg.third[bar],7,12][(pos/4)%4]; fm(mtof(root+24+n),t,s16*3,.05,music,3.5,1.2)}   /* bell arpeggio */
    if(sg.hat.includes(pos)) noise(t,.04,.1,7000);
    if(sg.kick.includes(pos)) kick(t);
    if(sg.snare.includes(pos)) noise(t,.12,.22,1800);
  }
  function tick(){
    if(!song) return;
    while(next<ctx.currentTime+.12){ playStep(SONGS[song],step,next); next+=60/SONGS[song].bpm/4; step=(step+1)%64; }
  }
  function play(name,delay=0){
    init(); if(!ctx) return;
    if(song===name) return;
    song=name; step=0; next=ctx.currentTime+.06+delay;
    if(!timer) timer=setInterval(tick,25);
    if(on&&ctx.state==='suspended') ctx.resume();
  }
  function notes(seq,vol=.2,gap=.08,dur=.2,ratio=3.5,index=1.5){
    if(!ctx||!on) return; const t=ctx.currentTime+.01;
    seq.forEach((m,k)=>{ (Array.isArray(m)?m:[m]).forEach(x=>fm(mtof(x),t+k*gap,Array.isArray(m)?dur*2.5:dur,Array.isArray(m)?vol*.6:vol,sfxBus,ratio,index)) });
  }
  const sfx={
    flip:{C:()=>notes([79],.12),R:()=>notes([79,86],.14),E:()=>notes([79,84,91],.16,.07),L:()=>notes([76,79,84,88,91,96],.22,.06,.3)},
    win:()=>notes([67,72,76,79,[72,76,79,84]],.2,.11,.22,1,1.8),
    lose:()=>notes([64,60,57,52],.24,.2,.32,1,1),
    click:()=>notes([91],.08,0,.05),
    gate:()=>{ if(!ctx||!on) return; const t=ctx.currentTime+.01; fm(55,t,.9,.5,sfxBus,.5,3); fm(41,t+.05,1.1,.4,sfxBus,.5,2); },
    harp:(at=0)=>{ if(!ctx||!on) return; const t=ctx.currentTime+.01+at; [57,60,64,69,72,76].forEach((m,k)=>fm(mtof(m),t+k*.07,1.2,.12,sfxBus,3.5,1.2)); }
  };
  function setOn(v){
    on=v; try{localStorage.setItem('clearout-sound',v?'on':'off')}catch(e){}
    if(ctx){ v?ctx.resume():ctx.suspend() }
  }
  document.addEventListener('visibilitychange',()=>{ if(!ctx) return; if(document.hidden) ctx.suspend(); else if(on) ctx.resume(); });
  function unlock(){
    init(); if(!ctx) return Promise.resolve();
    try{ const b=ctx.createBuffer(1,1,22050), src=ctx.createBufferSource(); src.buffer=b; src.connect(ctx.destination); src.start(0); }catch(e){}
    if(ctx.state==='running') return Promise.resolve();
    const r=ctx.resume().catch(()=>{});
    return Promise.race([r,new Promise(res=>setTimeout(res,300))]);
  }
  return {play,sfx,setOn,isOn:()=>on,init,unlock,current:()=>song};
})();
/* ENGINE:BEGIN — InkQuest auto-battle engine, shared by Clock Out, Clear Out and Cash Out.
   Source of truth: engine/engine.js. Edit it there, then run build.py; never edit this block inside a game file.

   A fight is a list of party units against a list of foes (Clock Out: one foe; Clear Out / Cash Out: 1–4).
   The engine knows nothing about any one game. Each game passes:
     • rules  — plug-ins that hook into fixed points of a round (crew skills, combos, sticks/scrolls/orders, matchups)
     • text   — functions that return [zh, en] log lines for the built-in foe abilities
   Foes carry ABILITIES with settings, e.g. {ramp:{pct:.06}, sweep:{every:2}, enrage:{below:.5,add:.1}}.
   A boss is just a foe with several abilities, so every boss can fight differently.
   Hook phases, in the order a fight runs them:
     prep        silent setup (team % bonuses, stat changes)
     intro       opening log lines and opening effects
     roundStart  once per round, before anyone attacks
     preAttack   per attacker; return true to skip this attack (e.g. a dodge)
     attackMod   per attacker; change st.a (damage) / st.nz,st.ne (log notes); return false to skip the attack
     hitMod      per attacker; change st.hits (multi-hits)
     finalMod    per attacker; last multipliers (matchups, trait bonuses)
     afterParty  once per round, after the party has attacked
     foeSkip     per foe; return true and the foe loses its turn (first rule that returns true wins)
     hurt        per hit on a party member; return {t,d} to change it, or null to cancel it
     afterHurt   per hit, after damage lands
     down        when a party member drops to 0 HP; return true if a rule handled it (e.g. a revive)
   Each hook is {o: order, fn}. Hooks run in ascending order inside a phase, so a game controls
   exactly where its rules sit next to the built-in foe abilities (their orders are listed in ABILITIES).
   All randomness goes through ctx.rng, so a seeded rng replays a fight exactly. */
const Engine=(()=>{
  const PHASES=['prep','intro','roundStart','preAttack','attackMod','hitMod','finalMod','afterParty','foeSkip','hurt','afterHurt','down'];

  /* ---- pack budget: a pack of n foes shares this much of the single-foe HP and attack (Clear Out sim, Oct 4) ---- */
  const PACK_BUDGET={hp:[0,1.00,1.15,1.30,1.45],atk:[0,1.00,1.26,1.36,1.41]};
  /* share of the pack budget each role takes */
  const ROLES={
    plain:{hpW:1.0,atkW:1.0}, boss:{hpW:3.0,atkW:2.0}, minion:{hpW:.5,atkW:.6},
    brute:{hpW:1.4,atkW:.8}, striker:{hpW:.7,atkW:1.4},
    healer:{hpW:.9,atkW:.4,heal:.08},          /* heals the most-hurt packmate 8% of its max HP on its turn */
    shaman:{hpW:.9,atkW:.6,partyAtkDown:.10}   /* party attack −10% while it stands */
  };
  /* split a single-foe budget {hp,atk} among foe defs that carry a role */
  function makePack(defs,base,budget=PACK_BUDGET){
    const n=defs.length, totHp=base.hp*budget.hp[n], totAtk=base.atk*budget.atk[n];
    const R=d=>ROLES[d.role||'plain'];
    const sh=defs.reduce((s,d)=>s+R(d).hpW,0), sa=defs.reduce((s,d)=>s+R(d).atkW,0);
    return defs.map(d=>({...R(d),...d,hp:Math.round(totHp*R(d).hpW/sh),atk:Math.round(totAtk*R(d).atkW/sa)}));
  }

  /* ---- unit traits for packs (Clear Out classes, Cash Out weight classes) ---- */
  const TRAIT={area:.65,splash:.05,assassin:1.10,sniper:1.10,taunt:3};

  /* ---- built-in foe abilities. A foe def lists them in def.abilities, each with its own settings ----
     Hook-based abilities (they plug into the round like rules):
       ramp      attack grows every round from round 2: {pct: share of base attack} or {flat: n} (default flat 3)
       disable   every N rounds one party member can't act: {every: 2}
       evasive   attacks on this foe miss: {chance: .25}; units with noMiss ignore it
       enrage    once, when HP falls below a share of max: {below: .5, add: n} (add < 1 = share of base attack, else flat; default 15)
       lifesteal heals itself for a share of the damage it deals: {pct: 1}
     Turn-shape abilities (read by the foe turn below):
       sweep        every N rounds hits the whole party instead of one target: {every: 3, pct: .6}
       multiAttack  attacks this many times each turn: {hits: 2}
       multiStrike  chance to attack extra times this turn: {chance: .3, hits: 2}
       focusWeakest always attacks the party member with the lowest HP
     Passive:
       steady       percent-based effects work at a share of their strength: {factor: .4}; rules read it with Engine.resist(f) */
  const ABILITIES={
    ramp:{roundStart:{o:10,fn:(c,f,a)=>{ if(c.r>1){ f.atk+=a.pct?Math.round(f.def.atk*a.pct):(a.flat!=null?a.flat:3); c.snap(()=>c.text.ramp(f),'bad'); } }}},
    disable:{roundStart:{o:50,fn:(c,f,a)=>{ if(c.r%(a.every||2)===0){ const al=c.liveParty(); if(al.length){ const s=c.pick(al); c.stunned.add(s); c.snap(()=>c.text.disable(f,s),'bad'); } } }}},
    evasive:{preAttack:{o:10,fn:(c,u,f,a)=>{ if(!u.noMiss&&c.rng()<(a.chance!=null?a.chance:.25)){ c.snap(()=>c.text.evasive(f,u),'sys'); return true; } }}},
    enrage:{afterParty:{o:10,fn:(c,f,a)=>{ if(!f.enraged&&f.hp>0&&f.hp<f.max*(a.below!=null?a.below:.5)){ f.enraged=true; const g=a.add; f.atk+=g<1?Math.round(f.def.atk*g):(g||15); c.snap(()=>c.text.enrage(f),'bad'); } }}},
    lifesteal:{afterHurt:{o:10,fn:(c,t,d,f,a)=>{ if(f) f.hp=Math.min(f.max,f.hp+Math.round(d*(a.pct!=null?a.pct:1))); }}}
  };

/* ---------- party ---------- */
function heroStats(id){
  const h=H[id], st=S.roster[id], lv=lvOf(id), m=(1+.25*(st-1))*(1+.025*(lv-1)), hall=1+HALL_PCT*(S.pay||0), c=CLASSES[h.cls];
  return {id,h,stars:st,lv,hp:Math.round((h.hp*m+S.bHp)*hall),atk:Math.round((h.atk*m+S.bAtk)*hall),
    taunt:!!c.taunt,trait:c.trait||null,kit:h.kit||{},areaPct:h.kit&&h.kit.area?h.kit.area.pct:undefined};
}
const power=t=>t.atk*3+t.hp;
const byPower=ids=>ids.map(heroStats).sort((a,b)=>power(b)-power(a));
let smartCache={key:'',ids:null};
const smartKey=()=>[S.enc,JSON.stringify(S.roster),S.bAtk,S.bHp,Object.values(S.xp).reduce((a,b)=>a+b,0),S.pay||0].join('|');
/* the pool auto-team tests: the best 2 of each role (front, damage, support), then the strongest others, up to 8.
   Clock Out's top-8-by-power would skip healers and bards, who have low stats but win fights. */
function autoPool(){
  const all=byPower(Object.keys(S.roster)), pool=[];
  ['front','damage','support'].forEach(role=>all.filter(t=>CLASSES[t.h.cls].role===role).slice(0,2).forEach(t=>pool.push(t.id)));
  all.forEach(t=>{ if(pool.length<8&&!pool.includes(t.id)) pool.push(t.id); });
  return pool;
}
function smartTeam(){
  const key=smartKey(); if(smartCache.key===key) return smartCache.ids;
  const pool=autoPool();
  let best=byPower(pool).slice(0,4).map(t=>t.id);
  if(Object.keys(S.roster).length>4){
    const subs=[], seen=new Set(), e=S.enc;
    const add=t=>{const k=t.slice().sort().join();if(!seen.has(k)){seen.add(k);subs.push(t)}};
    const choose=(list,n,pre)=>{(function rec(st,a){if(a.length===n){add([...pre,...a]);return}for(let i=st;i<list.length;i++){a.push(list[i]);rec(i+1,a);a.pop()}})(0,[])};
    choose(pool,4,[]);
    /* every synergy you can field gets tested too, filled with the strongest others */
    synergySeeds().forEach(core=>choose(byPower(Object.keys(S.roster).filter(id=>!core.includes(id))).slice(0,6).map(t=>t.id),4-core.length,core));
    const scored=subs.map(sub=>{let w=0;for(let k=0;k<6;k++)if(simulate(sub,true,e).win)w++;return {sub,w,p:teamPower(sub).power}});
    const top=Math.max(...scored.map(x=>x.w));
    const finals=scored.filter(x=>x.w>=top-1).sort((a,b)=>b.w-a.w||b.p-a.p).slice(0,12);
    finals.forEach(x=>{for(let k=0;k<24;k++)if(simulate(x.sub,true,e).win)x.w++});
    finals.sort((a,b)=>b.w-a.w||b.p-a.p);
    best=finals[0].sub;
  }
  smartCache={key,ids:best}; return best;
}
/* for each synergy you own: the strongest owned members that satisfy it */
function synergySeeds(){
  const owned=byPower(Object.keys(S.roster)).map(t=>t.id), out=[];
  SYNERGIES.forEach(sy=>{ const used=[];
    const ok=sy.need.every(req=>{ const m=owned.find(id=>!used.includes(id)&&(req.startsWith('class:')?H[id].cls===req.slice(6):id===req)); if(!m) return false; used.push(m); return true; });
    if(ok&&used.length<=4) out.push(used); });
  return out;
}
function winRate(ids,n=40){let w=0;for(let k=0;k<n;k++)if(simulate(ids,true,S.enc).win)w++;return Math.round(w/n*100)}
function team(){
  if(S.teamMode!=='manual') return smartTeam().filter(id=>S.roster[id]).map(heroStats);
  S.team=S.team.filter(id=>S.roster[id]).slice(0,4);
  if(!S.team.length) S.team=byPower(Object.keys(S.roster)).slice(0,4).map(t=>t.id);
  return S.team.map(heroStats);
}
/* rough strength: stats plus flat team-attack bonuses; healing and traits aren't counted */
function teamPower(ids){
  const st=ids.map(heroStats), syn=activeSynergies(ids).map(x=>x.id);
  const pct=syn.includes('classic')?.12:0;
  const atk=Math.round(st.reduce((a,t)=>a+t.atk,0)*(1+pct)), hp=st.reduce((a,t)=>a+t.hp,0);
  return {atk,hp,power:atk*3+hp};
}

  return reveal?tx(`隱藏隊員：${h.name}`,`Hidden crew: ${h.en.name}`,l):tx('隱藏隊員 ❔','Hidden crew ❔',l);
}
let toastQ=[], toastBusy=false;
function toast(html){toastQ.push(html);if(!toastBusy)nextToast()}
function nextToast(){const t=$('toast'); if(!toastQ.length){toastBusy=false;return} toastBusy=true; t.innerHTML=toastQ.shift(); t.classList.add('show'); setTimeout(()=>{t.classList.remove('show');setTimeout(nextToast,400)},2800)}
function checkAch(){
  let got=false;
  ACH.forEach(a=>{
    if(S.ach[a.id]||!a.test(S)) return;
    S.ach[a.id]=1; got=true;
    if(a.reward.gems) S.gems+=a.reward.gems;
    if(a.reward.hero&&!S.roster[a.reward.hero]){S.roster[a.reward.hero]=1; if(S.teamMode==='manual'&&S.team.length<4) S.team.push(a.reward.hero);}
    log([`🏆 成就解鎖：${a.name}！獎勵：${rewardText(a,'zh',true)}`,`🏆 Award: ${a.en.name}! Reward: ${rewardText(a,'en',true)}`],'gold');
    toast(`<b>🏆 ${N(a,'name')}</b>${tx('獎勵：','Reward: ')}${rewardText(a,LANG,true)}`);
    Sound.sfx.flip.L();
  });
  if(got) renderUI();
}

/* ---------- log (stored as [zh, en] so it can switch language) ---------- */
const logLines=[];
function log(text,cls=''){
  const pair=Array.isArray(text)?text:[text,text];
  logLines.push({pair,cls}); if(logLines.length>80) logLines.shift();
  const p=document.createElement('p'); p.textContent=pair[LANG==='en'?1:0]; if(cls)p.className=cls;
  $('log').appendChild(p); $('log').scrollTop=$('log').scrollHeight;
  while($('log').children.length>80) $('log').firstChild.remove();
}
function redrawLog(){$('log').innerHTML='';logLines.forEach(({pair,cls})=>{const p=document.createElement('p');p.textContent=pair[LANG==='en'?1:0];if(cls)p.className=cls;$('log').appendChild(p)});$('log').scrollTop=$('log').scrollHeight}

/* ---------- card draws ---------- */
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function rollRarity(min='C'){
  S.pity++; S.pulls++;
  if(S.pity>=PITY_MAX){S.pity=0;return 'L'}
  const allowed=ORDER.slice(ORDER.indexOf(min)); const tot=allowed.reduce((a,r)=>a+RAR[r].w,0); let x=Math.random()*tot;
  for(const r of allowed){x-=RAR[r].w; if(x<0){if(r==='L')S.pity=0; return r}}
  return allowed[0];
}
const inPool=c=>(c.secret?!!S.roster[c.id]:true)&&packLevel(c.pack||'warrens')<=levelOf(S.enc);
/* the current level's pack gets 60% of draws; crew you don't own never fall behind (Clock Out's catch-up rule) */
function packWeights(r,list,catchUp){
  const base=list.filter(c=>c.r===r&&inPool(c)); if(!base.length) return [];
  const pk=levelAt(S.enc).pack, cur=base.filter(c=>(c.pack||'warrens')===pk);
  const w=base.map(c=>(1-(cur.length?CUR_PACK_SHARE:0))/base.length+((c.pack||'warrens')===pk?CUR_PACK_SHARE/cur.length:0));
  if(catchUp){const top=Math.max(...w); base.forEach((c,i)=>{if(!S.roster[c.id]) w[i]=Math.max(w[i],top)*MISSING_BOOST})}
  return base.map((c,i)=>({c,w:w[i]}));
}
function pickWeighted(r,list,catchUp){
  const ws=packWeights(r,list,catchUp); if(!ws.length) return null;
  let x=Math.random()*ws.reduce((a,o)=>a+o.w,0); for(const o of ws){x-=o.w; if(x<0) return o.c} return ws[ws.length-1].c;
}
function pullOne(min='C',forceType=null){
  const r=rollRarity(min);
  let type=forceType; if(!type){const x=Math.random(); type=x<.42?'hero':x<.77?'gear':'event';}
  let c=pickWeighted(r,type==='hero'?HEROES:type==='gear'?GEAR:EVENTS,type==='hero'); if(!c){type='hero';c=pickWeighted(r,HEROES,true)}
  const card={type,c,r,tag:null};
  if(type==='hero'){
    if(S.roster[c.id]){ if(S.roster[c.id]<5){S.roster[c.id]++;card.tag={k:'up',n:S.roster[c.id]}} else {const x=dupeXP();S.xp[c.id]=(S.xp[c.id]||0)+x;S.gems+=1;card.tag={k:'max',n:x}} }
    else {S.roster[c.id]=1;card.tag={k:'new'}; if(S.teamMode==='manual'&&S.team.length<4) S.team.push(c.id);}
  } else if(type==='gear'){ S.bAtk+=c.atk; S.bHp+=c.hp; }
  else if(c.fx&&!c.choices){ c.fx(S) }
  if(type!=='hero'){ if(!S.seen[c.id])card.tag={k:'new'}; S.seen[c.id]=(S.seen[c.id]||0)+1; }
  return card;
}
function tagText(tag,l=LANG){
  if(!tag) return '';
  if(tag.k==='new') return 'NEW';
  if(tag.k==='up') return tx(`升到 ${tag.n}★`,`Up to ${tag.n}★`,l);
  if(tag.k==='max') return tx(`滿星・💎1＋經驗 ${tag.n}`,`Max ★ · 💎1 + ${tag.n} XP`,l);
  if(tag.k==='stars') return '★'.repeat(tag.n)+'☆'.repeat(5-tag.n);
  return '';
}
function faceHTML(k,l,cls,small){
  const {type,c,r,tag}=k, sep=l==='en'?' ':'';
  let st='',ds='',q='',cl='',pic=`<div class="e">${c.e||''}</div>`;
  if(type==='hero'){const C=CLASSES[c.cls]; pic=spriteImg(c.sp,64); cl=`${C.icon} ${N(C,'name',l)}`;
    st=tx(`生命 ${c.hp}｜攻擊 ${c.atk}`,`HP ${c.hp} | ATK ${c.atk}`,l); ds=tx(`【${N(c,'skill',l)}】${N(c,'desc',l)}`,`[${N(c,'skill',l)}] ${N(c,'desc',l)}`,l); q=N(c,'q',l)}
  if(type==='gear'){st=[c.atk?tx(`全隊攻擊 +${c.atk}`,`Party ATK +${c.atk}`,l):'',c.hp?tx(`全隊生命 +${c.hp}`,`Party HP +${c.hp}`,l):''].filter(Boolean).join(' · ');q=N(c,'q',l)}
  if(type==='event'){ds=N(c,'desc',l)}
  const tg=tagText(tag,l);
  return `<div class="face ${cls}" lang="${l==='en'?'en':'zh-Hant'}"><div class="rar">${N(RAR[r],'name',l)}${sep}${typeName(type,l)}</div>${pic}
    <div class="nm">${small&&type==='hero'?shortName(c,l):N(c,'name',l)}</div>${cl?`<div class="cl">${cl}</div>`:''}${tg?`<div class="tag">${tg}</div>`:''}
    ${st?`<div class="st">${st}</div>`:''}${ds?`<div class="ds">${ds}</div>`:''}${q?`<div class="q">${q}</div>`:''}</div>`;
}
const cardHTML=(k,i,small)=>`<div class="card r${k.r}" style="--rc:${RAR[k.r].css}" data-i="${i}"><div class="card-in">${faceHTML(k,LANG,'main',small)}${faceHTML(k,other(LANG),'alt',small)}<div class="back">${tx('抽','?')}</div></div></div>`;
const lpHint=()=>`<p class="lp-hint">${tx('長按卡片看英文','Press and hold a card to see Chinese')}</p>`;
function showPulls(cards,title,after){
  const ten=cards.length>1, best=cards.reduce((a,k)=>Math.max(a,ORDER.indexOf(k.r)),0);
  openModal(`<h2>${title}</h2><div class="cards ${ten?'ten':'one'}">${cards.map((k,i)=>cardHTML(k,i,ten)).join('')}</div>
    ${ten?`<div class="summary" id="sum"></div>`:''}${lpHint()}<div class="btns"><button id="mOk">${tx('收下','Keep')}</button></div>`);
  const els=[...document.querySelectorAll('#modal .card')];
  els.forEach((el,i)=>setTimeout(()=>{el.classList.add('open');Sound.sfx.flip[cards[i].r]()},250+i*(ten?160:0)));
  if(ten){
    const n=r=>cards.filter(k=>k.r===r).length;
    setTimeout(()=>{if(!$('sum'))return;$('sum').textContent=tx(`傳說 ${n('L')}・史詩 ${n('E')}・稀有 ${n('R')}・普通 ${n('C')}`,`Legendary ${n('L')} · Epic ${n('E')} · Rare ${n('R')} · Common ${n('C')}`)},250+cards.length*160);
    els.forEach((el,i)=>el.addEventListener('click',()=>{ if(el.dataset.lp){delete el.dataset.lp;return} showDetail(cards[i]); }));
  }
  cards.filter(k=>k.type==='hero'&&k.tag&&k.tag.k==='new').forEach(k=>log([`🎉 ${N(k.c,'name','zh')} 加入了公會！`,`🎉 ${N(k.c,'name','en')} joined the guild!`],'good'));
  cards.filter(k=>k.type==='gear').forEach(k=>log([`${k.c.e} 裝備了${N(k.c,'name','zh')}。`,`${k.c.e} Equipped: ${N(k.c,'name','en')}.`],'sys'));
  cards.filter(k=>k.type==='event'&&!k.c.choices).forEach(k=>log([`${k.c.e} ${N(k.c,'name','zh')}：${N(k.c,'desc','zh')}`,`${k.c.e} ${N(k.c,'name','en')}: ${N(k.c,'desc','en')}`],'gold'));
  if(best===3) log(['✨ 傳說降臨！','✨ A Legendary appears!'],'gold');
  $('mOk').onclick=()=>{closeModal(); checkAch(); runChoices(cards.filter(k=>k.type==='event'&&k.c.choices),after)};
  renderUI();
}
function showDetail(k){
  const d=document.createElement('div'); d.innerHTML=`<div class="cards one">${cardHTML(k,0)}</div>`; d.querySelector('.card').classList.add('open');

function runChoices(list,after){
  if(!list.length){renderUI(); after&&after(); return}
  const k=list.shift(), c=k.c;
  openModal(`<div class="big">${c.e}</div><h2>${N(c,'name')}</h2><p class="center">${N(c,'desc')}</p>
    <div class="btns">${c.choices.map((ch,i)=>`<button data-i="${i}" ${ch.need&&S.gems<ch.need?'disabled':''}>${N(ch,'label')}<small>${N(ch,'sub')}</small></button>`).join('')}</div>`);
  document.querySelectorAll('#modal .btns button').forEach(b=>b.onclick=()=>{
    const ch=c.choices[+b.dataset.i], res=ch.fx(S);
    closeModal();
    if(res==='pull'){ const card=pullOne('E','hero'); showPulls([card],tx('井底亮了起來……','The well lights up…'),()=>runChoices(list,after)); return; }
    if(res==='mimic') log(['🧰 寶箱長出了牙齒！是寶箱怪！牠咬了一口就跑了……','🧰 The chest grows teeth! A mimic! It takes a bite and runs off…'],'bad');
    else log([`${c.e} ${N(ch,'res','zh')}`,`${c.e} ${N(ch,'res','en')}`],'gold');
    checkAch(); renderUI(); runChoices(list,after);
  });
}

$('go').onclick=()=>{
  if(busy||S.done||!Object.keys(S.roster).length) return;
  clearTimeout(autoTimer); busy=true; fast=false; document.body.classList.remove('logbig'); document.body.classList.add('fighting'); renderSkip(); renderUI();
  const enc=encAt(S.enc); Sound.play(enc.boss?'boss':'battle');
  const {units,frames,win}=simulate();
  let i=0;
  const step=()=>{
    if(i>=frames.length){finish();return}
    const fr=frames[i++];
    log(fr.text,fr.cls);
    const pu=units.map((u,k)=>({...u,cur:fr.u[k]})); lastFrame={foes:fr.foes,party:pu};
    renderFoes(fr.foes,fr.hit==='m'?(fr.fi==null?0:fr.fi):null);
    renderParty(pu);
    if(typeof fr.hit==='number'){const e=document.querySelector(`.hero[data-i="${fr.hit}"]`);e&&e.classList.add('hit')}
    setTimeout(step,fast?40:380);
  };
  const finish=()=>{
    busy=false; document.body.classList.remove('fighting'); Sound.play('guild');
    const ids=units.map(u=>u.id);
    if(activeSynergies(ids).length) S.flags.synergy=true;
    grantXP(ids,win).forEach(u=>log([`⬆️ ${shortName(H[u.id],'zh')} 升到 Lv${u.lv}！`,`⬆️ ${shortName(H[u.id],'en')} reached Lv${u.lv}!`],'good'));
    if(win) onWin(); else onLoss();
  };
  step();
};
function onWin(){
  Sound.sfx.win(); if(S.autoAdv) S.autoWins=(S.autoWins||0)+1;
  const enc=encAt(S.enc), reward=floorReward(S.enc); S.gems+=reward; S.wins++;
  log([`🎉 ${enc.name}清空了！獲得 💎 ${reward}。`,`🎉 ${enc.en.name}: cleared! You get 💎 ${reward}.`],'gold');
  if(S.enc>=MAX_ENC){ S.done=true; checkAch(); renderUI(); const lv=levelAt(S.enc);
    openModal(`<div class="big">${spriteImg(enc.pack[0].sp,64)}</div><h2>${tx(`${lv.name}・通關！`,`${lv.en.name}: cleared!`)}</h2>
      <p class="center">${N(lv,'endQ')}</p><p class="center" style="color:var(--torch)">${tx(...NEXT_TEASER)}</p>
      <p class="summary">${tx(`抽卡 ${S.pulls} 次・勝 ${S.wins} 場・撤退 ${S.losses} 次・隊員 ${Object.keys(S.roster).length}/${HEROES.length}`,`Pulls ${S.pulls} · Wins ${S.wins} · Retreats ${S.losses} · Crew ${Object.keys(S.roster).length}/${HEROES.length}`)}</p>
      <div class="btns"><button id="mAgain">${tx('再出團一次','Start a new tour')}</button><button id="mStay">${tx('先休息一下','Rest for now')}</button></div>`);
    $('mAgain').onclick=()=>{closeModal();reset()}; $('mStay').onclick=closeModal; return; }
  const levelDone=S.enc%10===0; S.enc++;
  if(levelDone) levelIntro();
  checkAch(); renderUI();
  if(S.autoAdv&&!levelDone){
    log([`⏩ 自動前進：1 秒後挑戰第 ${S.enc} 場。`,`⏩ Auto-advance: encounter ${S.enc} in 1 second.`],'sys');
    autoTimer=setTimeout(()=>{ if(S.autoAdv&&!busy&&$('overlay').hidden&&!S.done) $('go').click(); },1200); return;
  }
  const next=encAt(S.enc), lv=levelAt(S.enc);
  openModal(`<div class="big">🎉</div><h2>${levelDone?tx(`${levelAt(S.enc-1).name}・完成！`,`${levelAt(S.enc-1).en.name}: cleared!`):tx(`第 ${S.enc-1} 場清空！`,`Encounter ${S.enc-1} cleared!`)}</h2>
    <p class="center">${levelDone?`${N(levelAt(S.enc-1),'endQ')}<br><br>`+tx(`獲得 💎 ${reward}。下一層：${lv.e} ${lv.name}。<br>新卡片已加入卡池！`,`You get 💎 ${reward}. Next level: ${lv.e} ${lv.en.name}.<br>New cards have joined the card pool!`)
      :tx(`獲得 💎 ${reward}。`,`You get 💎 ${reward}. `)+tx(lv.nextQ[0],lv.nextQ[1]).replace('{e}',N(next,'name'))}</p>
    <div class="btns"><button id="mOk">${tx('繼續','Continue')}</button></div>`);
  $('mOk').onclick=closeModal;
}
function onLoss(){
  const lg=lossGems(S.enc); S.gems+=lg; S.losses++; Sound.sfx.lose(); checkAch();
  log([`🏳️ 全隊撤退回公會。撿回的戰利品換到 💎 ${lg}。抽點新隊員再來吧！`,`🏳️ The party retreats to the guild. The loot you grabbed is worth 💎 ${lg}. Pull some new crew and try again!`],'sys');
  renderUI();
  const enc=encAt(S.enc), many=Object.keys(S.roster).length>=2, can=S.gems>=hallCost();
  openModal(`<div class="big">🏳️</div><h2>${tx('戰略性撤退','Strategic Retreat')}</h2>
    <p class="center">${tx(`${enc.name}太難纏了。大家決定先回公會喝一杯。<br>戰利品換到 💎 ${lg}，抽點新隊員再來！`,`The ${enc.en.name} was too much. Everyone heads back to the guild for a drink.<br>Your loot is worth 💎 ${lg}. Pull some new crew and try again!`)}</p>
    ${many&&!can?`<div class="wipe-up" style="opacity:.6"><span>${tx(`也可以<b>擴建公會大廳</b>：全體隊員 +${Math.round(HALL_PCT*100)}%。`,`You could also <b>upgrade the Guild Hall</b>: every member +${Math.round(HALL_PCT*100)}%.`)}</span>
      <button disabled style="font-size:14px">🏰 ${tx(`鑽石不足：需要 💎 ${hallCost()}，你有 💎 ${S.gems}`,`Need 💎 ${hallCost()} (you have ${S.gems})`)}</button>
      <span style="font-size:12px;color:var(--muted)">${tx('下次抽卡時，可以留一些鑽石下來。','Next time you pull cards, try saving a few gems.')}</span></div>`:''}
    ${can?`<div class="wipe-up" id="wipeUp"><span>${tx(`不想一直抽卡？也可以<b>擴建公會大廳</b>：全體隊員 +${Math.round(HALL_PCT*100)}%。`,`Tired of pulling cards? <b>Upgrade the Guild Hall</b>: every member +${Math.round(HALL_PCT*100)}%.`)}</span>
      <span>${tx('目前預估勝率','Current estimated odds')} <b>${winRate(team().map(t=>t.id))}%</b></span>
      <button id="mWipeUp" style="background:var(--L);color:#2a1d00">🏰 ${tx(`擴建公會（💎 ${hallCost()}）`,`Upgrade (💎 ${hallCost()})`)}</button></div>`:''}
    <div class="btns"><button id="mOk">${tx('好吧','Fine…')}</button></div>`);
  $('mOk').onclick=closeModal;
  const doUp=()=>{ const before=winRate(team().map(t=>t.id));
    if(upgradeHall()){ Sound.sfx.flip.E(); checkAch(); smartCache.key=''; renderUI(); const after=winRate(team().map(t=>t.id));
      $('wipeUp').innerHTML=`<span>${tx(`🏰 擴建完成！預估勝率 <b>${before}% → ${after}%</b>`,`🏰 Upgraded! Estimated odds <b>${before}% → ${after}%</b>`)}</span>`
        +(S.gems>=hallCost()?`<button id="mWipeUp2" style="background:var(--L);color:#2a1d00">🏰 ${tx(`再擴建一次（💎 ${hallCost()}）`,`Again (💎 ${hallCost()})`)}</button>`:'');
      if($('mWipeUp2')) $('mWipeUp2').onclick=doUp; } };
  if($('mWipeUp')) $('mWipeUp').onclick=doUp;
}
function renderSkip(){const b=$('skipBtn');b.textContent=fast?tx('快轉中 ▶▶','Fast-forwarding ▶▶'):tx('快轉 ▶▶','Skip ▶▶');b.setAttribute('aria-pressed',fast?'true':'false')}

$('log').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); if(busy) skipBattle(); else toggleLog();} });

function synergyHTML(sy,ids){

function useSynergy(id){

  const known=SYNERGIES.filter(sy=>sy.need.some(req=>req.startsWith('class:')?Object.keys(S.roster).some(id=>H[id].cls===req.slice(6)):S.roster[req]));
  const syns=known.length?known.map(sy=>synergyHTML(sy,ids)).join(''):`<p class="summary">${tx('抽到羈絆需要的隊員之後，羈絆就會出現在這裡。','Synergies show up here once you own someone they need.')}</p>`;
  openModal(`<h2>${tx('隊伍','Party')}</h2>
    <div class="seg" role="group"><button data-mode="auto" aria-pressed="${S.teamMode!=='manual'}">${tx('自動（挑勝率最高）','Auto (best odds)')}</button><button data-mode="manual" aria-pressed="${S.teamMode==='manual'}">${tx('手動','Manual')}</button></div>
    <div class="dex slots">${slots}</div>${powerHTML(ids)}${hallHTML()}${hint}
    ${teamSel!=null&&cur.length>1?`<button class="danger-link" id="mBench">${tx('移到候補','Move to bench')}</button>`:''}
    <h3 class="sec">${tx('候補','Bench')}</h3>
    ${bench.length?`<div class="dex">${bench.map(t=>chip(t,'',`data-bench="${t.id}"`)).join('')}</div>`:`<p class="summary">${tx('還沒有候補隊員。多抽幾張吧！','No one on the bench yet. Pull more cards!')}</p>`}
    <h3 class="sec">${tx('隊伍羈絆','Synergies')}</h3><div class="syns">${syns}</div>
    <div class="btns"><button id="mOk">${tx('完成','Done')}</button></div>`);
  teamMsg=null;
  const m=$('modal');
  m.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ if(b.dataset.mode==='auto'){S.teamMode='auto';S.team=[];} else toManual(); teamSel=null; renderUI(); openParty(); });
  m.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.slot; toManual();
    if(!cur[i]){ teamSel=null; teamMsg=bench.length?tx('點一位候補隊員補上這個空位。','Tap someone on the bench to fill this slot.'):tx('還沒有候補隊員。','No one on the bench yet.'); } else teamSel=(teamSel===i?null:i);
    renderUI(); openParty(); });
  m.querySelectorAll('[data-bench]').forEach(b=>b.onclick=()=>{ const id=b.dataset.bench; toManual();
    if(teamSel!=null&&S.team[teamSel]) S.team[teamSel]=id; else if(S.team.length<4) S.team.push(id); else teamMsg=tx('隊伍滿了。先點隊伍裡要換下來的人。','The party is full. First tap the member you want to swap out.');
    teamSel=null; renderUI(); openParty(); });
  if($('mHall')) $('mHall').onclick=()=>{ if(upgradeHall()){Sound.sfx.flip.E();checkAch();smartCache.key='';renderUI();} openParty(); };
  if($('mBench')) $('mBench').onclick=()=>{ S.team.splice(teamSel,1); teamSel=null; renderUI(); openParty(); };
  $('mOk').onclick=()=>{teamSel=null;closeModal()};
}
$('partyBtn').onclick=()=>{teamSel=null;openParty()};

/* ---------- rules ---------- */
function helpHTML(){
  const rar=`<div class="rar-row">${ORDER.map(r=>`<span style="--rc:${RAR[r].css}">${N(RAR[r],'name')} ${RAR[r].w}%</span>`).join('')}</div>`;
  const cls=Object.values(CLASSES).map(c=>`<tr><td>${c.icon}&nbsp;${N(c,'name')}</td><td>${LANG==='en'?c.en.how:c.how}</td></tr>`).join('');
  if(LANG==='en') return `<h2>How to Play</h2><div class="help">
  <section><h3>The basics</h3><p>Pull cards to build your guild. Press “Go!” and your party of four fights on its own. Each dungeon level has 10 encounters; clear encounter ${MAX_ENC} to finish the tour.</p></section>
  <section><h3>Pulling cards</h3>${rar}<ul><li>Each card is a <b>crew member</b>, a piece of <b>gear</b>, or an <b>event</b>.</li><li><b>Pull ×10</b> always gives at least one Epic or better.</li><li><b>Pity</b>: 30 pulls without a Legendary, and pull 30 is Legendary. The bottom of the screen counts down.</li><li>Crew you don’t have yet come up more often, so nobody stays out of reach.</li></ul></section>
  <section><h3>Monster packs</h3><p>Most encounters are 1–4 monsters. Your party hits the weakest one first. Some monsters heal the others, and some weaken your party. Mid-bosses and bosses get 20 rounds instead of 15.</p></section>
  <section><h3>Classes</h3><table>${cls}</table></section>
  <section><h3>Stars and levels</h3><p>Each star adds 25% to a member’s base HP and attack (up to 5★). Members who fight earn experience, win or lose, and each level adds 2.5%.</p></section>
  <section><h3>Gear and events</h3><ul><li><b>Gear</b> stacks, and every bonus goes to the whole party.</li><li><b>Events</b> give a reward right away or ask you to choose.</li></ul></section>
  <section><h3>Your party</h3><p>By default the game picks your party: before each encounter it tests different parties against the monsters and sends the one most likely to win, healers and support included. Press <b>Party</b> to choose for yourself.</p></section>
  <section><h3>Synergies</h3><p>Some crew work better together. When everyone a synergy needs is in the party, it turns on at the start of each fight. ✨ marks them.</p></section>
  <section><h3>Gems</h3><ul><li>Each cleared encounter pays more than the last (about 1.2 × its number), and every 5th pays 5 extra.</li><li>A retreat still pays a little loot.</li></ul></section>
  <section><h3>Guild Hall 🏰</h3><p>On the Party screen, spend gems to upgrade the Guild Hall. Every member, old or new, gets +10% total stats, gear included. Each upgrade costs a bit more.</p></section>
  <section><h3>Auto-advance ⏩</h3><p>Turn on ⏩ next to “Go!” and your party takes on the next encounter after every win. It stops when you lose or finish a level.</p></section>
  <section><h3>Language</h3><p>Tap “中文” at the top to switch to Chinese. Press and hold any card to see it in Chinese.</p></section>
  </div><div class="btns"><button id="mOk">Got it</button></div><button class="danger-link" id="mReset">Restart the game…</button>`;
  return `<h2>遊戲規則</h2><div class="help">
  <section><h3>怎麼玩</h3><p>抽卡壯大公會，按「前進！」讓四人小隊自動戰鬥。每層地城有 10 場戰鬥，打完第 ${MAX_ENC} 場就完成這趟觀光。</p></section>
  <section><h3>抽卡</h3>${rar}<ul><li>每張卡可能是<b>隊員</b>、<b>裝備</b>或<b>事件</b>。</li><li><b>十連抽</b>至少有一張史詩以上。</li><li><b>保底</b>：連續 30 抽沒出傳說，第 30 抽一定是傳說。畫面下方會倒數。</li><li>還沒收集到的隊員比較容易抽到，不會有人永遠抽不到。</li></ul></section>
  <section><h3>怪物群</h3><p>大部分戰鬥會有 1～4 隻怪物。隊伍會先打血最少的那隻。有些怪物會幫同伴補血，有些會削弱你的隊伍。頭目和魔王戰最多 20 回合，一般戰鬥 15 回合。</p></section>
  <section><h3>職業</h3><table>${cls}</table></section>
  <section><h3>星等與等級</h3><p>每多一顆星，隊員的基礎生命和攻擊 +25%（最多 5★）。上場的隊員不管輸贏都會累積經驗，每升一級數值 +2.5%。</p></section>
  <section><h3>裝備與事件</h3><ul><li><b>裝備</b>會疊加，加成套用在全隊。</li><li><b>事件</b>可能直接給獎勵，也可能讓你二選一。</li></ul></section>
  <section><h3>編隊</h3><p>預設是自動編隊：每場戰鬥前，遊戲會先模擬幾種組合，派出勝率最高的隊伍，也會考慮治療和輔助。想自己決定，就按下方的<b>隊伍</b>。</p></section>
  <section><h3>隊伍羈絆</h3><p>有些隊員湊在一起特別強。羈絆需要的人都在隊上時，每場戰鬥開始就會發動，並標上 ✨。</p></section>
  <section><h3>鑽石</h3><ul><li>越後面的戰鬥給越多鑽石（大約是場次 × 1.2），每 5 場多給 5 顆。</li><li>撤退也會帶回一點戰利品。</li></ul></section>
  <section><h3>公會大廳 🏰</h3><p>在隊伍畫面可以花鑽石擴建公會大廳。每擴建一次，所有隊員（不論新舊）的總數值（含裝備）+10%，價格一次比一次高。</p></section>
  <section><h3>自動前進 ⏩</h3><p>打開「前進！」旁邊的 ⏩，打贏後就會自動挑戰下一場。打輸或打完一層會停下來。</p></section>
  <section><h3>語言</h3><p>點右上角的「EN」切換成英文。長按任何一張卡片，可以看它的英文版。</p></section>
  </div><div class="btns"><button id="mOk">知道了</button></div><button class="danger-link" id="mReset">重新開始遊戲…</button>`;
}
function openHelp(){ modalView=openHelp; openModal(helpHTML()); $('mOk').onclick=closeModal; $('mReset').onclick=openReset; }
$('helpBtn').onclick=openHelp;
function openReset(){
  modalView=openReset;
  openModal(`<h2>${tx('重新開始？','Start over?')}</h2><p class="center">${tx('隊員、裝備和進度都會清空。','Your crew, gear, and progress will all be cleared.')}</p>
    <div class="btns"><button id="mYes">${tx('重新開始','Start over')}</button><button id="mNo">${tx('算了','Never mind')}</button></div>`);
  $('mYes').onclick=()=>{closeModal();reset()}; $('mNo').onclick=closeModal;
}

/* ---------- about ---------- */
function aboutHTML(){
  const art=['farmhand','apprentice','healer','stranger'].map(k=>spriteImg(H[k].sp,48)).join('');
  const n={crew:HEROES.length,gear:GEAR.length,ev:EVENTS.length,syn:SYNERGIES.length,lv:LEVELS.length,enc:MAX_ENC};
  if(LANG==='en') return `<div class="ab"><div class="ab-art" aria-hidden="true">${art}</div>
    <p class="ab-brand">Ink<span>Quest</span></p><p class="ab-slogan">Every quest begins with a story.</p><p class="ab-sub">每一段冒險，都從一個故事開始。</p>
    <h3>English can be fun</h3><p>For a lot of people, English means word lists and exam papers. InkQuest tries something else: give you a good story first, so you want to know what happens next. The English comes along for the ride.</p>
    <p>Gamebooks, graded readers, role-playing games, board games… many forms, one idea: <b>get people hooked, and the learning takes care of itself.</b></p>
    <h3>About Clear Out</h3><p>An adventurers’ guild runs tours of a very dangerous dungeon. You hire the party: a farmhand with a pitchfork, a knight with a bad knee, a stranger from the corner booth. They do the fighting. You pull the cards.</p>
    <p>Play it half-asleep and let auto-party do the thinking, or build your own party and hunt for synergies. Switch between Chinese and English any time, and press and hold a card to see it in the other language.</p>
    <p class="ab-note">Every dungeon has an exit. Usually.</p>
    <h3>Version</h3><dl class="ab-info"><dt>Title</dt><dd>Clear Out 深淵觀光團</dd><dt>Version</dt><dd>Test build · October 2026</dd>
      <dt>Content</dt><dd>${n.lv} level · ${n.enc} encounters · ${n.crew} crew · ${n.gear} gear · ${n.ev} events · ${n.syn} synergies</dd><dt>Author</dt><dd>Wen-Hung Fang</dd><dt>Made with</dt><dd>Claude</dd></dl>
    <p class="ab-copy">© 2026 Wen-Hung Fang. All rights reserved.</p></div><div class="btns"><button id="mOk">Close</button></div>`;
  return `<div class="ab"><div class="ab-art" aria-hidden="true">${art}</div>
    <p class="ab-brand">Ink<span>Quest</span></p><p class="ab-slogan">Every quest begins with a story.</p><p class="ab-sub">每一段冒險，都從一個故事開始。</p>
    <h3>學英文，可以好玩一點</h3><p>很多人對英文的記憶，是背不完的單字表和寫不完的考卷。InkQuest 想換個方式：先給你一個好故事，讓你想知道接下來會發生什麼事，英文就在不知不覺中跟著進來了。</p>
    <p>互動遊戲書、分級讀本、角色扮演遊戲、桌遊……做法很多，想法只有一個：<b>先讓人投入，學習就會自然發生。</b></p>
    <h3>關於《深淵觀光團》</h3><p>冒險者公會開辦了一條非常危險的地城觀光路線。隊伍由你來湊：帶乾草叉的農家子、膝蓋不好的退休騎士、酒館角落的兜帽怪客……打怪交給他們，抽卡交給你。</p>
    <p>可以躺著玩，讓自動編隊幫你想；也可以自己排隊伍、研究羈絆。遊戲隨時能切換中英文，長按卡片還能看到另一種語言。</p>
    <p class="ab-note">每座地城都有出口。大概啦。</p>
    <h3>版本資訊</h3><dl class="ab-info"><dt>名稱</dt><dd>深淵觀光團 Clear Out</dd><dt>版本</dt><dd>測試版・2026 年 10 月</dd>
      <dt>內容</dt><dd>${n.lv} 層・${n.enc} 場戰鬥・${n.crew} 位隊員・${n.gear} 件裝備・${n.ev} 個事件・${n.syn} 種羈絆</dd><dt>作者</dt><dd>Wen-Hung Fang</dd><dt>製作</dt><dd>Created with Claude</dd></dl>
    <p class="ab-copy">© 2026 Wen-Hung Fang. All rights reserved.</p></div><div class="btns"><button id="mOk">關閉</button></div>`;
}
function openAbout(){ modalView=openAbout; openModal(aboutHTML()); $('mOk').onclick=closeModal; }
$('aboutBtn').onclick=openAbout;

/* ---------- start, language, splash ---------- */
function reset(){S=fresh();smartCache.key='';logLines.length=0;$('log').innerHTML='';intro();renderUI()}
function levelIntro(){ levelAt(S.enc).intro.forEach(l=>log(l,'gold')); }
function intro(){ levelIntro(); log(['抽卡組隊，再按「前進！」。','Pull cards, then press “Go!”.'],'sys'); }
function setLang(l){
  LANG=l; try{localStorage.setItem('clearout-lang',l)}catch(e){}
  if(l==='en'&&!S.flags.english){S.flags.english=true;setTimeout(checkAch,500)}
  applyStatic(); renderSound(); renderSkip(); renderAuto(); renderLogTip(); redrawLog(); renderUI();
  renderEncounter(); if(busy&&lastFrame){ renderFoes(lastFrame.foes); renderParty(lastFrame.party); }
  if(busy) $('goHint').textContent=fast?tx('快轉中…','Fast-forwarding…'):tx('戰鬥中…（點戰鬥紀錄可快轉）','Fighting… (tap the log to skip)');
  if(!$('overlay').hidden&&modalView) modalView();
  const hint=$('splashHint'); if(hint.dataset.state) hint.textContent=splashHintText(hint.dataset.state);
}
$('langBtn').onclick=()=>setLang(other(LANG));
$('langBtn2').onclick=e=>{e.stopPropagation();setLang(other(LANG))};
$('langBtn2').addEventListener('pointerdown',e=>e.stopPropagation());
function splashHintText(state){
  return state==='muted'?tx('🔇 聲音已關閉，進入遊戲後可以用右上角的喇叭打開。','🔇 Sound is off. Turn it on with the speaker button after you start.')
    :tx('🔊 進入遊戲後，可以用右上角的喇叭關掉聲音。','🔊 You can turn the sound off with the speaker button later.');
}
$('gate').innerHTML='<i class="torch l"></i><i class="torch r"></i>'+spriteImg('goblin',48,'peek')+['farmhand','apprentice','healer','stranger'].map(k=>spriteImg(k,56)).join('');
$('splash').addEventListener('click',e=>{
  if(e.target.closest('#startBtn')||e.target.closest('#langBtn2')) return;
  Sound.init(); const hint=$('splashHint');
  if(!Sound.isOn()){ hint.dataset.state='muted'; hint.textContent=splashHintText('muted'); return; }
  if(window.splashPlayed) return; window.splashPlayed=true;
  Sound.unlock().then(()=>{ Sound.sfx.harp(); if(!$('splash').classList.contains('bye')) Sound.play('title',.9); });
  hint.dataset.state='on'; hint.textContent=splashHintText('on');
});
$('startBtn').onclick=()=>{Sound.unlock();if(Sound.isOn()){Sound.sfx.gate();Sound.play('guild',.4)}const sp=$('splash');sp.classList.add('bye');setTimeout(()=>sp.hidden=true,360)};

applyStatic(); renderSound(); renderAuto(); renderLogTip(); intro(); renderUI(); checkAch();
$('startBtn').focus();
</script>

</body>
</html>

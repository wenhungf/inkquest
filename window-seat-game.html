<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Window Seat: My Working Holiday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,600&family=Huninn&display=swap" rel="stylesheet">
<style>
html{-webkit-text-size-adjust:100%;}
[hidden]{display:none!important;}
</style>
<style>
/* ---- the cozy-notebook look (build 18, 2026-10-26): paper, tape, chat bubbles, colored stat cards ---- */
:root{
  --bg:#FFF8EE; --dot:#F0DCCB; --surface:#FFFFFF; --paper:#FFFDF8; --ink:#3D2C3E; --muted:#6B5268; --rule:#EAD3C2; --line:#F1E4D6;
  --primary:#D9675A; --primary-ink:#FFFFFF; --primary-sh:#B34F44;
  --blush:#FCE5DC; --blush-ink:#8F3A30; --blush-line:#F2C6B7;
  --accent:#C2584A; --tint:#FFF1E6; --warm:#E07A5F;
  --gold:#E8C25A; --gold-soft:rgba(232,194,90,.25); --gold-ink:#8F6312; --gold-bg:#FFFBEF;
  --good:#2F7A55; --bad:#B4473A; --stress:#F0806E;
  --pop-bg:#3D2C3E; --pop-ink:#FFF4EA; --pop-muted:#D9C6D3; --pop-accent:#FFD27A;
  --shadow:rgba(120,72,60,.14);
  --phone:#F3EEF8; --phone-line:#E2D6EE; --phone-ink:#4A3460;
  --f-body:'Nunito','Huninn',"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-zh:'Huninn','Nunito',"PingFang TC","Noto Sans TC",sans-serif;
  --f-disp:'Nunito','Huninn',"PingFang TC","Noto Sans TC",sans-serif;
  --f-px:'Nunito','Huninn',"PingFang TC",sans-serif;
  /* menus: decoration color, a tint for backgrounds, and a dark ink that reads on the tint */
  --c-class:#5B9BD5; --t-class:#E3F1FB; --k-class:#2E5E8C;
  --c-work:#F2A65A;  --t-work:#FFEBD6;  --k-work:#A85B1C;
  --c-social:#E58BB8; --t-social:#FCE6F1; --k-social:#A8457A;
  --c-explore:#5FB88A; --t-explore:#E1F4EA; --k-explore:#2F7A55;
  --c-rest:#A88BC8; --t-rest:#EFE6F7; --k-rest:#6B4A86;
  --c-lock:#B9AAA0;
  /* stats */
  --s-en:#5B9BD5; --k-en:#2E5E8C; --t-en:#E3F1FB;
  --s-co:#F5B841; --k-co:#8F6312; --t-co:#FFF1D6;
  --s-fi:#F0806E; --k-fi:#B4473A; --t-fi:#FFE7E2;
  --s-cr:#5FB88A; --k-cr:#2F7A55; --t-cr:#E1F4EA;
  --s-sty:#E58BB8; --k-sty:#A8457A; --t-sty:#FCE6F1;
  --s-kh:#F2A65A; --k-kh:#A85B1C; --t-kh:#FFEBD6;
  --track:#EFE3D6;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#221B26; --dot:#2E2533; --surface:#2D2532; --paper:#2A2230; --ink:#F3E9E4; --muted:#C2B0BD; --rule:#4A3D50; --line:#3A2F40;
  --primary:#E07A6C; --primary-ink:#24161A; --primary-sh:#A9564B; --blush:#4A2E30; --blush-ink:#FFD3C8; --blush-line:#6E4345;
  --accent:#F29A8C; --tint:#3A2C34; --gold-bg:#3A3122; --gold-ink:#F2C35B;
  --good:#7FD3A8; --bad:#FF9D8F; --pop-bg:#F3E9E4; --pop-ink:#24161A; --pop-muted:#6B5268; --pop-accent:#B34F44;
  --shadow:rgba(0,0,0,.45); --phone:#2F2838; --phone-line:#4A3D58; --phone-ink:#E2D3F2; --track:#3E3343;
  --t-class:#24364A; --k-class:#9CC8F0; --t-work:#43301E; --k-work:#F7BE86; --t-social:#43263A; --k-social:#F2A9CD;
  --t-explore:#1F3D30; --k-explore:#8EDBB0; --t-rest:#352A45; --k-rest:#CDB4EC;
  --k-en:#9CC8F0; --t-en:#24364A; --k-co:#F7D27A; --t-co:#43381E; --k-fi:#FFAA9C; --t-fi:#47282A;
  --k-cr:#8EDBB0; --t-cr:#1F3D30; --k-sty:#F2A9CD; --t-sty:#43263A; --k-kh:#F7BE86; --t-kh:#43301E;
}}
:root[data-theme="dark"]{
  --bg:#221B26; --dot:#2E2533; --surface:#2D2532; --paper:#2A2230; --ink:#F3E9E4; --muted:#C2B0BD; --rule:#4A3D50; --line:#3A2F40;
  --primary:#E07A6C; --primary-ink:#24161A; --primary-sh:#A9564B; --blush:#4A2E30; --blush-ink:#FFD3C8; --blush-line:#6E4345;
  --accent:#F29A8C; --tint:#3A2C34; --gold-bg:#3A3122; --gold-ink:#F2C35B;
  --good:#7FD3A8; --bad:#FF9D8F; --pop-bg:#F3E9E4; --pop-ink:#24161A; --pop-muted:#6B5268; --pop-accent:#B34F44;
  --shadow:rgba(0,0,0,.45); --phone:#2F2838; --phone-line:#4A3D58; --phone-ink:#E2D3F2; --track:#3E3343;
  --t-class:#24364A; --k-class:#9CC8F0; --t-work:#43301E; --k-work:#F7BE86; --t-social:#43263A; --k-social:#F2A9CD;
  --t-explore:#1F3D30; --k-explore:#8EDBB0; --t-rest:#352A45; --k-rest:#CDB4EC;
  --k-en:#9CC8F0; --t-en:#24364A; --k-co:#F7D27A; --t-co:#43381E; --k-fi:#FFAA9C; --t-fi:#47282A;
  --k-cr:#8EDBB0; --t-cr:#1F3D30; --k-sty:#F2A9CD; --t-sty:#43263A; --k-kh:#F7BE86; --t-kh:#43301E;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;font-weight:600;}
body{min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background-image:radial-gradient(var(--dot) 1.2px, transparent 1.3px);background-size:18px 18px;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
canvas,img.px,.px-img{image-rendering:crisp-edges;image-rendering:pixelated;display:block;}
#app{overflow-anchor:none;max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding:env(safe-area-inset-top,0px) 16px 96px;}
.scr{display:none;} .scr.on{display:block;}
.px{font-family:var(--f-px);font-variant-numeric:tabular-nums;font-weight:800;}
.zh{font-family:var(--f-zh);font-weight:400;}
.muted{color:var(--muted);}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 18px;border-radius:16px;
  background:var(--primary);color:var(--primary-ink);font-weight:800;box-shadow:0 4px 0 var(--primary-sh);font-family:var(--f-body);}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--primary-sh);}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--rule);box-shadow:0 3px 0 var(--rule);}
.btn.alt:active{box-shadow:0 1px 0 var(--rule);}
.btn.soft{background:var(--blush);color:var(--blush-ink);border:2px solid var(--blush-line);box-shadow:0 4px 0 var(--blush-line);}
.btn svg{width:18px;height:18px;fill:currentColor;flex:none;}
.btn.small{min-height:38px;padding:6px 12px;font-size:15px;border-radius:12px;}
.btn:disabled{opacity:.45;cursor:default;}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:none;}
.row{display:flex;gap:10px;align-items:center;}
.wrap{flex-wrap:wrap;}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px;box-shadow:0 2px 0 var(--line);}
h1,h2,h3{font-family:var(--f-disp);line-height:1.2;font-weight:900;}
h2{font-size:22px;margin:4px 0 10px;}
h3{font-size:17px;margin:2px 0 6px;font-weight:800;}
.tape{position:absolute;width:74px;height:22px;opacity:.85;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(255,173,173,.85) 0 6px,rgba(255,214,214,.85) 6px 12px);}
.tape.b{background:repeating-linear-gradient(90deg,rgba(168,212,242,.85) 0 5px,rgba(214,236,250,.85) 5px 10px);}
.tape.g{background:repeating-linear-gradient(90deg,rgba(143,209,168,.85) 0 6px,rgba(200,236,213,.85) 6px 12px);}
.photo{position:relative;background:#fff;padding:7px;border-radius:6px;box-shadow:0 10px 22px var(--shadow);}
.photo canvas,.photo img{width:100%;height:auto;aspect-ratio:320/213;border-radius:2px;}

/* title */
#title{text-align:center;padding-top:34px;}
#title .photo{margin:0 auto;max-width:448px;transform:rotate(-1.2deg);}
#title .photo .tape{top:-12px;left:-12px;transform:rotate(-24deg);}
#title .photo .tape.b{top:auto;left:auto;bottom:-12px;right:-10px;transform:rotate(-18deg);}
#title .kick{letter-spacing:.24em;color:var(--muted);font-size:12px;font-weight:800;margin-top:28px;}
#title h1{font-size:50px;margin:2px 0 0;letter-spacing:-.02em;}
.xfade{position:relative;height:32px;margin:2px auto 0;max-width:320px;}
.xfade span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--accent);}
.xfade .a{font-size:20px;font-weight:800;animation:xA 10s ease-in-out infinite;}
.xfade .b{font-family:var(--f-zh);font-size:21px;letter-spacing:.08em;font-weight:400;animation:xB 10s ease-in-out infinite;}
@keyframes xA{0%,38%{opacity:1}50%,88%{opacity:0}100%{opacity:1}}
@keyframes xB{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.xfade .a,.xfade .b{animation-duration:24s;}}
#title .btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:26px;}
#title .btns > .btn{width:300px;max-width:100%;}
#title .btns .row .btn{min-width:0;}
#tCont{flex-direction:column;gap:0;min-height:64px;}
#tCont small{font-size:12px;font-weight:700;opacity:.85;}
#title .foot{margin-top:28px;font-size:12px;color:var(--muted);}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--rule);color:var(--muted);font-weight:800;}

/* top bar: date chip, coin and money, music and settings; stress meter with a face */
.top{position:sticky;top:0;z-index:20;background:var(--paper);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:2px solid var(--line);margin:calc(-1 * env(safe-area-inset-top,0px)) -16px 14px;}
.top .r1{display:flex;align-items:center;gap:10px;}
.top .date{font-weight:900;font-size:15px;}
.calchip{width:56px;flex:none;border-radius:8px;overflow:hidden;background:var(--surface);border:1px solid var(--rule);box-shadow:0 2px 0 var(--rule);text-align:center;line-height:1;}
.calchip i{display:block;font-style:normal;background:var(--primary);color:var(--primary-ink);font-size:11px;padding:3px 0;font-family:var(--f-zh);}
.calchip b{display:block;font-size:14px;font-weight:900;padding:5px 0 4px;white-space:nowrap;}
.top .money{display:flex;align-items:center;gap:6px;font-size:21px;font-weight:900;flex:1;min-width:0;}
.top .money img{width:22px;height:22px;flex:none;}
.top .money.neg{color:var(--bad);}
.ib{width:44px;height:44px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.ib svg{width:22px;height:22px;fill:currentColor;}
.ib.mu{background:#FFF1D6;color:#8A5A2A;} .ib.gear{background:#F3EEF8;color:#6B4A86;}
:root[data-theme="dark"] .ib.mu{background:#43381E;color:#F7D27A;} :root[data-theme="dark"] .ib.gear{background:#352A45;color:#CDB4EC;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ib.mu{background:#43381E;color:#F7D27A;} :root:not([data-theme="light"]) .ib.gear{background:#352A45;color:#CDB4EC;} }
.ib.on{background:var(--ink);color:var(--bg);}
.top .r2{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;}
.top .r2 img{width:20px;height:20px;}
.top .r2 .lb{font-family:var(--f-zh);font-weight:400;}
.seg{position:relative;flex:1;height:10px;border-radius:3px;background:var(--track);overflow:hidden;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 3px),transparent calc(10% - 3px) 10%);mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 3px),transparent calc(10% - 3px) 10%);}
.seg i{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--good));transition:width .5s;}
.seg.sm{height:8px;}
.bar{height:10px;border-radius:6px;background:var(--track);overflow:hidden;flex:1;}
.bar i{display:block;height:100%;background:var(--good);border-radius:6px;transition:width .4s;}
.bar.stress i{background:var(--stress);}

/* home */
.room{position:relative;margin:22px 4px 0;transform:rotate(.8deg);}
.room .tape{top:-12px;left:50%;margin-left:-37px;transform:rotate(-3deg);}
.hero{display:flex;gap:12px;align-items:center;}
.hero canvas{width:96px;height:96px;border-radius:14px;background:var(--tint);flex:none;}
.who-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;margin:20px 0 4px;}
.who-row .who{font-size:32px;font-weight:900;line-height:1;}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;border-radius:999px;padding:3px 10px;background:var(--surface);border:1.5px solid var(--rule);font-family:var(--f-zh);font-weight:400;}
.pill.sky{background:var(--t-class);border-color:transparent;color:var(--k-class);}
.pill.gold{background:var(--gold-bg);border-color:var(--gold);color:var(--gold-ink);}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
.stat{background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column;gap:6px;min-width:0;}
.stat .n{display:flex;align-items:center;gap:6px;}
.stat .n img{width:20px;height:20px;flex:none;}
.stat .n .nm{flex:1;font-family:var(--f-zh);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
:root[lang="en"] .stat .n .nm{font-family:var(--f-body);font-weight:800;font-size:15px;}
.stat .n .v{font-weight:900;font-size:16px;}
.stat .rk{align-self:flex-start;font-size:11.5px;border-radius:6px;padding:1px 7px;font-family:var(--f-zh);font-weight:400;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.goal{margin-top:12px;padding:12px;border-radius:14px;background:var(--gold-bg);border:1.5px solid var(--gold);}
.goal .n{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:800;}
.goal .neg{color:var(--bad);}
.bar.gl i{background:var(--gold);}
/* the phone: messages as chat bubbles */
.phone{margin-top:22px;background:var(--phone);border:3px solid var(--phone-line);border-radius:26px;padding:14px 12px 16px;}
.phone .ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px 10px;color:var(--phone-ink);}
.phone .ph b{font-family:var(--f-zh);font-weight:400;font-size:17px;}
:root[lang="en"] .phone .ph b{font-family:var(--f-body);font-weight:900;}
.phone .ph span{font-size:12px;}
.thread{display:flex;flex-direction:column;gap:12px;}
.ln-msg{display:flex;gap:8px;align-items:flex-start;}
.ln-msg.me{flex-direction:row-reverse;}
.av{width:48px;height:48px;border-radius:14px;flex:none;background:var(--surface);object-fit:none;}
canvas.av{padding:6px;}
.ln-msg .col{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;}
.ln-msg.me .col{align-items:flex-end;}
.ln-msg .nmf{font-size:12px;color:var(--phone-ink);padding:0 4px;font-weight:800;}
.msg{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:10px 12px;font-size:16px;}
.msg.bub{border:0;border-radius:4px 18px 18px 18px;box-shadow:0 2px 0 var(--phone-line);max-width:100%;}
.ln-msg.me .msg.bub{border-radius:18px 4px 18px 18px;background:var(--blush);color:var(--ink);}
.msg .acts2{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;}
.msg .acts2 .zhb,.msg .acts2 .ib{height:32px;min-width:44px;border-radius:999px;background:var(--phone);color:var(--phone-ink);border:0;}
.msg .acts2 .ib svg{width:18px;height:18px;}
.msg.rank{border:2px solid var(--gold);box-shadow:0 0 0 3px var(--gold-soft);background:var(--gold-bg);}
.msg.rank .from span:first-child{color:var(--gold-ink);font-weight:900;}
.rankrow{display:flex;gap:10px;align-items:center;}
.rankrow img{width:72px;height:72px;flex:none;}
.msg .from{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
.msg .zht{font-size:14px;color:var(--muted);margin-top:4px;font-family:var(--f-zh);font-weight:400;}
.zhb{font-size:13px;border:1px solid var(--rule);border-radius:8px;padding:0 8px;color:var(--muted);font-family:var(--f-zh);}
.menu{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:22px;}
.menu .btn{width:100%;padding-inline:8px;}
.menu .big{grid-column:1/-1;min-height:58px;font-size:19px;}
.menu .wide{grid-column:span 3;}

/* planner: a notebook page with taped edge */
.paper{position:relative;background-color:var(--paper);background-image:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);
  border-radius:10px;padding:22px 10px 12px;box-shadow:0 8px 18px var(--shadow);border-left:4px solid #F6B7B0;margin-top:18px;}
.paper > .tape{top:-10px;left:22px;transform:rotate(-4deg);}
.paper .ph2{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 4px;}
.paper .ph2 b{font-family:var(--f-zh);font-weight:400;font-size:20px;}
:root[lang="en"] .paper .ph2 b{font-family:var(--f-body);font-weight:900;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px;}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:800;}
.wkh{font-size:14px;margin:12px 4px 2px;color:var(--muted);font-weight:800;}
.slot{position:relative;min-height:74px;border-radius:12px;border:2px dashed var(--rule);background:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 1px 3px;overflow:hidden;}
:root[data-theme="dark"] .slot{background:rgba(0,0,0,.15);}
.slot .d{font-size:12px;font-weight:900;color:var(--muted);line-height:1;}
.slot canvas{width:24px;height:24px;margin-top:4px;flex:none;}
.slot .a{font-size:11px;line-height:1.2;text-align:center;margin-top:3px;word-break:break-word;padding-bottom:2px;font-family:var(--f-zh);font-weight:400;}
:root[lang="en"] .slot .a{font-family:var(--f-body);font-weight:700;}
.slot .plus{font-size:22px;color:var(--rule);font-weight:700;line-height:1;margin-top:8px;}
.slot .d .tg{font-style:normal;font-family:var(--f-zh);font-size:9px;margin-left:2px;color:var(--bad);}
.slot .d .tg.sale{color:var(--k-class);}
.slot.hol .d{color:var(--bad);}
.slot.set{border-style:solid;border-color:transparent;}
.slot.m-class{background:var(--t-class);} .slot.m-class .d{color:var(--k-class);}
.slot.m-work{background:var(--t-work);} .slot.m-work .d{color:var(--k-work);}
.slot.m-social{background:var(--t-social);} .slot.m-social .d{color:var(--k-social);}
.slot.m-explore{background:var(--t-explore);} .slot.m-explore .d{color:var(--k-explore);}
.slot.m-rest{background:var(--t-rest);} .slot.m-rest .d{color:var(--k-rest);}
.slot.sel{border:3px solid var(--primary);box-shadow:0 3px 0 var(--primary-sh);}
.slot.lock{background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 6px,var(--line) 6px,var(--line) 8px);border-style:solid;border-color:var(--rule);cursor:default;}
.slot.past{opacity:.35;}
.slot.today{box-shadow:0 0 0 2px var(--primary) inset;}
.pnotes{font-size:12px;margin:8px 0 0;}
.tag.new{background:var(--gold);color:#2B2536;}
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px;}
.preview .pv{background:var(--surface);border-radius:12px;padding:8px;text-align:center;box-shadow:0 2px 0 var(--line);}
.preview .pv b{display:block;font-size:17px;font-weight:900;}
.preview .pv span{font-size:12px;color:var(--muted);}
.warn{color:var(--bad);font-size:14px;margin:6px 0;}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.infobar .r1{position:relative;}
.infobar .ttl{position:absolute;left:96px;right:96px;text-align:center;font-size:16px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateY(110%);transition:transform .25s, visibility .25s;visibility:hidden;}
#sheet.on{transform:none;visibility:visible;}
body.sheet-on #plan{padding-bottom:58vh;}
#sheet .in{max-width:480px;margin:0 auto;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -10px 30px var(--shadow);padding:10px 15px calc(16px + env(safe-area-inset-bottom,0px));height:56vh;height:56svh;min-height:300px;display:flex;flex-direction:column;}
#sheet .grab{flex:none;width:44px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 6px;}
#sheet .hd{flex:none;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
#sheet .hd b{font-size:20px;font-weight:900;}
.tabs{flex:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;}
.tab{flex:none;min-height:40px;padding:0 14px;border-radius:999px;font-size:15px;font-weight:800;}
.tab.m-class{background:var(--t-class);color:var(--k-class);} .tab.m-work{background:var(--t-work);color:var(--k-work);} .tab.m-social{background:var(--t-social);color:var(--k-social);} .tab.m-explore{background:var(--t-explore);color:var(--k-explore);} .tab.m-rest{background:var(--t-rest);color:var(--k-rest);}
.tab.on{color:#fff;}
.tab.on.m-class{background:#3E78AE;} .tab.on.m-work{background:#B86A26;} .tab.on.m-social{background:#B4507F;} .tab.on.m-explore{background:#2F7A55;} .tab.on.m-rest{background:#6B4A86;}
.acts{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:10px;padding:4px 0 8px;}
.act{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:18px;border:2px solid var(--line);background:var(--paper);width:100%;box-shadow:0 3px 0 var(--line);}
.act.chosen{border-color:var(--primary);}
.act .ic{width:52px;height:52px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--tint);}
.act .ic canvas{width:36px;height:36px;}
.act .t{font-weight:900;}
.act .s{font-size:13px;color:var(--muted);}
.act .fx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.fxc{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--tint);white-space:nowrap;font-weight:700;}
.act[disabled]{opacity:.5;box-shadow:none;}
.act .why{font-size:13px;color:var(--bad);}
.nope{margin-top:2px;}
.nope summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:14px;background:var(--tint);color:var(--muted);font-size:14px;}
.nope summary::-webkit-details-marker{display:none;}
.nope[open] summary{margin-bottom:8px;}
.nope .act{margin-top:8px;}
.tag{white-space:nowrap;display:inline-block;font-size:12px;border-radius:6px;padding:0 6px;margin-left:4px;background:var(--tint);color:var(--ink);font-weight:700;}

/* play */
.feed{display:flex;flex-direction:column;gap:10px;}
#play{padding-bottom:24px;}
.feed > *{scroll-margin-bottom:84px;}
.day{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:16px;padding:10px;box-shadow:0 2px 0 var(--line);animation:pop .25s ease-out;}
@keyframes pop{from{transform:translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.day canvas{width:56px;height:56px;border-radius:12px;flex:none;}
.day .dh{font-size:13px;color:var(--muted);font-weight:800;}
.day .ln{font-size:16px;}
.day .ticks{font-size:13px;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;}
.up{color:var(--good);} .dn{color:var(--bad);}
.playbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));}
.playbar .in{max-width:448px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;align-items:center;}

/* modal */
#modal{position:fixed;inset:0;z-index:60;background:rgba(40,24,36,.45);display:none;align-items:flex-end;justify-content:center;padding:16px;}
#modal.on{display:flex;}
#modal .box{width:100%;max-width:448px;max-height:86vh;overflow-y:auto;background:var(--surface);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.3);margin-bottom:env(safe-area-inset-bottom,0px);}
#modal .choices{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
#trip .btn{white-space:normal;}
#modal .choices .btn,.choices .btn{width:100%;text-align:left;justify-content:flex-start;white-space:normal;flex-wrap:wrap;}
.choices .sopt{flex-direction:column;align-items:flex-start;gap:2px;padding-block:10px;}
.st-ticks{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:15px;}
.choices .sopt small{font-weight:600;color:var(--muted);font-size:13px;}
.diary{font-size:18px;line-height:28px;background:var(--paper);border-radius:12px;padding:14px 16px;border-left:4px solid #F6B7B0;
  background-image:repeating-linear-gradient(to bottom,transparent 0 21px,var(--line) 21px 22px,transparent 22px 28px),linear-gradient(var(--paper),var(--paper));background-origin:content-box,border-box;background-clip:content-box,border-box;}
.diary p{margin:0;}
.diary .zht{color:var(--muted);margin:0;font-family:var(--f-zh);font-weight:400;}
.de+.de{margin-top:28px;}
.de::after{content:"";display:block;clear:both;}
.de .dd{color:var(--muted);font-size:15px;height:28px;display:flex;align-items:center;gap:6px;white-space:nowrap;}

.dtools .ib{width:24px;height:24px;}
.dtools .zhb{line-height:20px;}
.dnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px;}
.dnav b{font-size:20px;font-weight:900;}
.dnav .btn[disabled]{opacity:.35;}

/* glossary words */
.g{border-bottom:2px dotted #B48AC8;cursor:pointer;}
.g.seen{border-bottom-style:solid;}
#pop{position:fixed;z-index:70;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--pop-bg);color:var(--pop-ink);border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;}
#pop.on{display:block;}
#pop .w{font-weight:900;font-size:18px;}
#pop .k{color:var(--pop-muted);font-size:14px;margin-left:6px;}
#pop .z{color:var(--pop-accent);font-size:16px;margin-top:2px;font-family:var(--f-zh);font-weight:400;}
#pop .d{font-size:14px;color:var(--pop-muted);margin-top:4px;font-family:var(--f-zh);font-weight:400;}
#pop .x{position:absolute;top:6px;right:6px;}

.board{background:#101418;color:#F5D36A;border-radius:12px;padding:10px;font-family:ui-monospace,monospace;font-size:14px;border:4px solid #2C3138;}
.board .bh{display:grid;grid-template-columns:50px 1fr 80px 34px;gap:4px;color:#8FB7D0;font-size:12px;border-bottom:1px solid #2C3138;padding-bottom:4px;margin-bottom:4px;}
.board .br{display:grid;grid-template-columns:50px 1fr 80px 34px;gap:4px;padding:6px 2px;border-radius:6px;width:100%;text-align:left;color:#F5D36A;font-family:ui-monospace,monospace;}
.board .br:active,.board .br.sel{background:#22303A;}
.board .br small{display:block;color:#C9CFD6;font-size:11px;}
.clock{font-size:20px;font-weight:900;}
.win{width:100%;border-radius:16px;border:6px solid #3A3F47;background:#9CC7E0;}
.map{width:100%;border-radius:14px;border:1px solid var(--rule);touch-action:manipulation;}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;}
.hud .pv{background:var(--surface);border-radius:10px;padding:6px;text-align:center;font-size:13px;box-shadow:0 2px 0 var(--line);}
.hud .pv b{display:block;font-size:16px;font-weight:900;}
.nodes{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.node{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left;width:100%;}
.node .nm{font-weight:900;}
.node .cost{font-size:13px;color:var(--muted);white-space:nowrap;}
.node.done{opacity:1;}
.node.done .nm{font-weight:700;}
.clues{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.clue{border:2px solid var(--rule);border-radius:12px;padding:6px;background:var(--surface);}
.clue canvas{width:100%;aspect-ratio:1;border-radius:8px;}
.clue .cn{font-size:12px;text-align:center;margin-top:2px;}
.clue.ok{border-color:var(--good);} .clue.no{border-color:var(--bad);}
.album{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.post{position:relative;border-radius:8px;overflow:hidden;background:#fff;padding:6px;box-shadow:0 6px 14px var(--shadow);}
.post canvas{width:100%;aspect-ratio:3/2;}
.post .pt{font-size:13px;padding:6px 4px 2px;color:#3D2C3E;}
.post .stamp{position:absolute;left:12px;top:12px;font-size:10px;letter-spacing:.04em;background:rgba(255,255,255,.88);color:#2B2536;padding:1px 5px;border-radius:4px;font-weight:800;}
.nb{display:flex;flex-direction:column;gap:6px;}
.nb .it{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:12px;background:var(--surface);box-shadow:0 2px 0 var(--line);}
.nb .it > span:first-child{flex:1;min-width:0;}
.nb .it > span:last-child{flex:0 0 auto;max-width:48%;text-align:right;font-family:var(--f-zh);font-weight:400;}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:14px;z-index:80;opacity:0;transition:opacity .3s;pointer-events:none;max-width:88vw;text-align:center;}
#toast.on{opacity:1;}
.set .rowi{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);gap:8px;}
textarea{width:100%;min-height:80px;font:13px ui-monospace,monospace;border-radius:10px;border:1px solid var(--rule);padding:8px;background:var(--bg);color:var(--ink);}
.hearts{display:flex;flex-direction:column;gap:10px;}
.fr{display:flex;gap:12px;align-items:center;}
.fr canvas,.fr img{width:48px;height:48px;border-radius:14px;background:var(--tint);flex:none;}
.fr .h{color:var(--warm);letter-spacing:2px;}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:15px;margin:8px 0;}
.back{margin-bottom:8px;}
</style>

/* rain on a given day: the same quick hash as the room's window, one day in four */
function rainyOn(date){ let h = 0; for(const ch of date) h = (h*31 + ch.charCodeAt(0)) >>> 0; h = Math.imul(h ^ (h >>> 7), 2654435761) >>> 0; return (h >>> 3) % 4 === 3; }

/* a day's pay for a job: the store pays the hourly wage for eight hours plus commission on what Mia sells */
function payFor(S, id, date, good){
  const a = ACTS[id];
  if(a.pay === "dept"){
    const base = wageOn(date) * 8, busy = D.wd(date) >= 5 || !!holidayOn(date), sale = saleOn(date);
    const sales = (busy ? 14000 : 8000) * (sale ? 2 : 1) * (.6 + Math.min(200, S.st.sty + S.st.co)/100)   /* stats have no ceiling now, so sales stop growing at 200 */ * (good ? 1 : .5);
    const comm = Math.round(sales * (sale ? .04 : .03) / 10) * 10;
    return {amt:base + comm, base, comm};
  }
  if(a.pay === "cafe"){
    const rate = wageOn(date) + ((S.sessions.barista || 0) >= RANKS[1] ? 20 : 0), amt = Math.round(rate * 6 * (good ? 1 : .8));
    return {amt, base:amt, comm:0};
  }
  if(id === "delivery"){   /* paid by the order: about NT$130 each; rain means seven orders, a bad day eight.
     The 2026 law counts only delivery time (pickup to door) for the 1.25× wage floor: at about 20 minutes an order
     (25 in the rain) every case clears it, e.g. rain 7 × 25 min ≈ 2.9 h × 1.25 × 245 ≈ NT$893 < 910; NT$130 > NT$45 an order. */
    const orders = rainyOn(date) ? 7 : good ? 10 : 8;
    return {amt:orders * 130, base:orders * 130, comm:0, orders};
  }
  const amt = good ? a.pay : Math.round(a.pay * .8);
  return {amt, base:amt, comm:0};
}

function syncActs(S){
  if(!S) return;
  Object.entries(PHASES).forEach(([id, ps])=>{ const p = ps.filter(x=>x.when(S)).pop(); if(p && ACTS[id]) Object.entries(p.set).forEach(([k,v])=>{ if(v === null) delete ACTS[id][k]; else ACTS[id][k] = v; }); });
}

/* ==== engine/core.js ==== */
/* =========================================================
   WINDOW SEAT: THE GAME — core helpers (shared by every stage)
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const PREFIX = "wsg-";
const store = {
  get(k, d){ try{ const v = localStorage.getItem(PREFIX+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(PREFIX+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(PREFIX+k); }catch(e){} }
};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const pad = n => String(n).padStart(2,"0");
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const fmt = n => (n < 0 ? "−" : "") + "NT$" + Math.abs(Math.round(n)).toLocaleString("en-US");
let RNG = Math.random;  /* swapped for a seeded one by the balance simulator */
const rand = () => RNG();
const pick = a => a[Math.floor(rand()*a.length)];

/* ---------------- language ----------------
   Menus start in Chinese; a toggle switches them to English. Story text is always English. */
let LANG = store.get("lang", "zh");
const T = k => { const e = UI[k]; return e ? (e[LANG] != null ? e[LANG] : e.zh) : k; };
const N = o => o ? (LANG === "en" ? (o.en || o.zh) : (o.zh || o.en)) : "";

/* ---------------- story markup: [[shown|key]] opens a gloss ---------------- */
const RX = /\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g;
const plain = s => String(s).replace(RX, "$1");
function mk(s){
  return esc(s).replace(RX, (m, disp, key)=>{
    key = key || disp.toLowerCase();
    const seen = (typeof S !== "undefined" && S && S.notes && S.notes.includes(key)) ? " seen" : "";
    return `<span class="g${seen}" role="button" tabindex="0" data-k="${esc(key)}">${disp}</span>`;
  });
}
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove("on"), 2200); }

/* ---------------- dates ---------------- */
const D = {
  parse(s){ const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); },
  iso(dt){ return dt.toISOString().slice(0,10); },
  add(s, n){ const dt = D.parse(s); dt.setUTCDate(dt.getUTCDate()+n); return D.iso(dt); },
  wd(s){ return (D.parse(s).getUTCDay() + 6) % 7; },          /* 0 = Monday */
  day(s){ return D.parse(s).getUTCDate(); },
  mon(s){ return D.parse(s).getUTCMonth(); },
  short(s){ const dt = D.parse(s); return LANG === "en" ? `${MON_EN[dt.getUTCMonth()]} ${dt.getUTCDate()}` : `${dt.getUTCMonth()+1}/${dt.getUTCDate()}`; },
  long(s){ const dt = D.parse(s); return LANG === "en" ? `${WD_EN[D.wd(s)]}, ${MON_EN[dt.getUTCMonth()]} ${dt.getUTCDate()}` : `${dt.getUTCMonth()+1} 月 ${dt.getUTCDate()} 日（${WD_ZH[D.wd(s)]}）`; },
  storyDate(s){ const dt = D.parse(s); return `${WD_EN[D.wd(s)]}, ${MON_FULL[dt.getUTCMonth()]} ${dt.getUTCDate()}`; }
};
const WD_EN = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const WD_ZH = ["一","二","三","四","五","六","日"];
const MON_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MON_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];

/* ---------------- pixel art ----------------
   Sprites are strings of palette letters, drawn onto small canvases. */
const PAL = {k:"#2B2536",w:"#FFFFFF",y:"#F4C542",o:"#E58E3A",r:"#D9534F",p:"#E79AB2",g:"#7BBF6A",G:"#3E8E5E",
  b:"#6FA8DC",B:"#2F5D8A",s:"#F2C9A5",S:"#D9A27F",n:"#8A5A3C",N:"#5B3A26",l:"#9ED9E8",h:"#2E2433",
  e:"#B7B2A8",E:"#77736B",c:"#F6E7C8",m:"#B784C7",t:"#E8D07A",u:"#4A6FA5",v:"#C9E3A6",x:"#E07A5F"};
function drawSprite(cv, rows, scale){
  const h = rows.length, w = rows[0].length; scale = scale || 1;
  cv.width = w*scale; cv.height = h*scale;
  const c = cv.getContext("2d"); c.clearRect(0,0,cv.width,cv.height);
  rows.forEach((r,y)=>{ for(let x=0;x<r.length;x++){ const ch = r[x]; if(ch === "." || !PAL[ch]) continue; c.fillStyle = PAL[ch]; c.fillRect(x*scale,y*scale,scale,scale); } });
  return cv;
}
function spriteHTML(id, cls){ return `<canvas class="${cls||""}" data-spr="${esc(id)}"></canvas>`; }
function paintSprites(root){
  (root || document).querySelectorAll("canvas[data-spr]").forEach(cv=>{ const g = SPR[cv.dataset.spr]; if(g) drawSprite(cv, g); });
}

/* ---------------- FM music ---------------- */
const Music = (()=>{  /* the Lamplight Readers FM player */
  let ctx=null, bus, out, timer=null, cur=-1, step=0, nextT=0, keeper=null, ducked=false;
  let vol = store.get("vol", 50) / 100;
  const midi = n=>{ const m=/^([A-G])(#?)(\d)$/.exec(n); return 12*(+m[3]+1)+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0); };
  const hz = m=>440*Math.pow(2,(m-69)/12);
  const P = {

/* ==== engine/room.js ==== */
/* ---------------- Mia's room and the title cover (320×213), drawn from the converted art in HD ----------------
   The room has one picture per time of day (morning, day, dusk, night); weather is drawn on top, only through

  const W = 320, H = 213;

const blockDate = (S, i) => D.add(S.date, i);
const monthKey = d => d.slice(0,7);
function lockOf(S, i){ return S.locks[blockDate(S, i)] || null; }
function actOf(id){ return ACTS[id] || SPECIAL[id] || RETIRED[id] || null; }

/* can activity `id` go on day i of this block? */
function canPlace(S, id, i){
  const a = ACTS[id], date = blockDate(S, i), wd = D.wd(date);
  if(lockOf(S, i)) return {ok:false, why:"locked"};
  if((a.open || 0) > S.blk) return {ok:false, why:"flag"};
  if(a.days && !a.days.includes(wd)) return {ok:false, why:"days"};
  if(a.cls && a.days && holidayOn(date)) return {ok:false, why:"holiday"};
  if(id === "driving"){   /* ten lessons make a course; no more once they are booked or done */
    const booked = S.plan.filter((p,k)=>p === "driving" && k !== i).length;
    if(S.flags.license || (S.sessions.driving || 0) + booked >= DRIVE_DONE) return {ok:false, why:"done"};
  }
  if(a.need) for(const k in a.need) if(S.st[k] < a.need[k]) return {ok:false, why:"need", k, v:a.need[k]};
  if(a.flag && !S.flags[a.flag]) return {ok:false, why:"flag"};

  if(old === "khh2"){ S.plan[i-1] = null; }

/* the money and stress a plan would mean, before it plays */
function preview(S){

  for(let i=0;i<14;i++){
    const date = blockDate(S, i), lk = lockOf(S, i), id = lk || S.plan[i] || "free", a = actOf(id);
    cost += STAGE.living;
    STAGE.bills.forEach(b=>{ if(D.day(date) === b.day) cost += b.amt; });
    if(!a) continue;
    cost += a.cost || 0; if(a.est) cost += a.est;
    if(/^stall\d$/.test(id)) cashIn += STALL.pay;   /* Auntie Chen pays cash each night */
    if(a.pay && ACTS[id]){ const amt = payFor(S, id, date, true).amt; income += amt;
      if(a.cash || (a.weekly && payDate(date, a) <= blockDate(S, 13))) cashIn += amt; }   /* money that arrives inside these two weeks */

    if(id === "khh") stress = clamp(stress - 15, 0, 100);
  }
  const cash = S.payQ.filter(p=>p.date <= blockDate(S, 13)).reduce((t,p)=>t+p.amt, 0);
  return {cost, income, stress, end:S.money - cost + cash + cashIn};

/* when a job's pay arrives: a set day of the next month, the Wednesday after the week, or the same day */
function payDate(date, a){
  if(a.cash) return date;
  if(a.weekly) return D.add(date, 7 - D.wd(date) + 2);
  const dt = D.parse(date); dt.setUTCDate(1); dt.setUTCMonth(dt.getUTCMonth()+1); dt.setUTCDate(a.payday);

/* ---------------- a block opens: messages, choices, locks ---------------- */

/* ---------------- one day plays ---------------- */
function runDay(S, i){

/* ---------------- the Mid-Autumn stall (Phase C) ----------------

/* hearts run 0–100, about three times a September stat, so they count a third */

    const r = statRank(S.st[k]), was = S.rk[k] == null ? r : S.rk[k];
    if(r > was){
      const ln = RANK_LINES[k][r]; msgs.push(["rank", ln[0], ln[1], k]); }   /* the 4th field names the stat for the card's header */
    S.rk[k] = Math.max(r, was);
  });
}
function finishDay(S, out, before){
  clampAll(S); checkRanks(S, out.msgs);
  out.d = {money:S.money - before.money, stress:S.stress - before.stress, st:{}, hearts:{}};
  STATS.forEach(k=>{ const v = S.st[k] - before.st[k]; if(Math.abs(v) >= .05) out.d.st[k] = v; });
  Object.keys(S.hearts).forEach(k=>{ const v = S.hearts[k] - before.hearts[k]; if(v) out.d.hearts[k] = v; });
  S.day = out.i + 1; S.feed.push(out);
  return out;
}

/* a finished adventure pays out */
function applyTrip(S, res){
  S.money -= res.spent;
  for(const k in res.g) S.st[k] += res.g[k];
  S.stress += res.stress;
  res.cards.forEach(c=>{ if(!S.album.includes(c)) S.album.push(c); });
  for(const k in (res.h || {})) S.hearts[k] += res.h[k];
  (res.notes || []).forEach(k=>{ if(!S.notes.includes(k)) S.notes.push(k); });
  S.trips++; clampAll(S);
  const last = S.feed[S.feed.length-1];
  if(last && last.trip){ last.line = res.line; last.tripRes = res; last.d = {money:-res.spent, stress:res.stress, st:Object.assign({}, res.g), hearts:Object.assign({}, res.h || {})}; }
}

/* ---------------- a block closes ---------------- */
function closeBlock(S){
  if(S.stallQ) resolveStall(S, S.stallQ, stallAuto(S, S.stallQ));
  S.stallRes = null;
  const sn = S.snap, sum = {money:S.money - sn.money, stress:S.stress - sn.stress, st:{}, hearts:{}, notes:S.notes.length - sn.notes, album:S.album.length - sn.album};
  STATS.forEach(k=>{ const v = S.st[k] - sn.st[k]; if(Math.abs(v) >= .05) sum.st[k] = v; });
  Object.keys(S.hearts).forEach(k=>{ const v = S.hearts[k] - sn.hearts[k]; if(v) sum.hearts[k] = v; });
  /* did a month end inside this block? */
  sum.diary = null;
  for(let i=0;i<14;i++){ const d = blockDate(S, i), nx = D.add(d, 1); if(monthKey(d) !== monthKey(nx)){ sum.diary = diaryFor(S, monthKey(d)); S.diary.push(sum.diary); } }
  S.lastPlan = S.plan.slice();
  S.lastLog = {date:S.date, feed:S.feed, sum};   /* the two weeks stay readable after they end */
  S.plan = new Array(14).fill(null); S.feed = [];
  S.blk++; S.date = D.add(S.date, 14);
  if(S.blk >= STAGE.blocks) S.done = true;
  S.phase = S.done ? "end" : "home";
  save();
  return sum;
}

  if(A.cooking) L("In cooking class, I learned to make new [[dishes|dish]].", "在烹飪課上，我學會做新的菜。");

    ["At the night market, Auntie Chen's stall won first place! I helped.", "在夜市，陳阿姨的攤位得了第一名！我也有幫忙。"],
    ["At the night market, Auntie Chen's stall came in second. I helped!", "在夜市，陳阿姨的攤位得了第二名。我也有幫忙！"],
    ["At the night market, Auntie Chen's stall came in third. I helped!", "在夜市，陳阿姨的攤位得了第三名。我也有幫忙！"]][S.flags.stallPlace]);
  if(A.khh) L("The best day: my trip to Kaohsiung. I want to travel more.", "最棒的一天：我的高雄之旅。我想多去旅行。");
  if(S.flags.decided && monthKey(S.flags.decided) === mkey) L("This month, under the Mid-Autumn moon, I decided: I want to try a [[working holiday]] in London.",
                                                              "這個月，在中秋的月亮下，我下定決心：我想去倫敦打工度假。");
  else if(S.flags.decided && monthKey(S.flags.decided) < mkey){
    if(S.money < 0) L("I am saving for London, but I owe money now. London feels very far away.", "我在為倫敦存錢，可是現在我欠錢了。倫敦感覺好遠。");
    else if(S.money >= VISA_GOAL.ntd) L("I have enough money for the visa now! London, here I come.", "簽證要的錢我存夠了！倫敦，我來了。");
    else L(`I am saving for London. I have NT$${cash(S.money)} now, and I need about NT$${cash(VISA_GOAL.ntd)}.`,
           `我在為倫敦存錢。我現在有 NT$${cash(S.money)}，大約需要 NT$${cash(VISA_GOAL.ntd)}。`);
  }
  if(fun) L(`I saw my friends and family ${nw(fun)} ${fun === 1 ? "time" : "times"}.`, `我見了朋友和家人 ${fun} 次。`);
  else L("I did not see my friends much. I miss them.", "我不太常見到朋友，好想他們。");

  const last = D.add(D.add(mkey + "-01", 32).slice(0,7) + "-01", -1);
  return {month:mkey, date:last, lines};
}

/* what's special in these two weeks: days off and sale days */

function openSheet(keepTab){

  const row = ([id,a], r) => `<button class="act${S.plan[selDay] === id ? " chosen" : ""}" data-a="${id}" ${r.ok ? "" : "disabled"}><span class="ic" style="background:var(--t-${a.menu})">${spriteHTML(a.spr)}</span><div><div class="t">${esc(N(a))}${S.plan[selDay] === id ? `<span class="tag">✓</span>` : ""}${a.open && a.open === S.blk ? `<span class="tag new">${T("newTag")}</span>` : ""}${a.cls && S.sessions[id] ? `<span class="tag">${T("r"+rankOf(S.sessions[id]))}</span>` : ""}</div>
        ${a.sub ? `<div class="s">${esc(N(a.sub))}</div>` : ""}<div class="fx">${fx(a)}</div>${r.ok ? "" : `<div class="why">${esc(whyText(r, a))}</div>`}</div></button>`;
  const checked = list.map(e=>[e, canPlace(S, e[0], selDay)]), yes = checked.filter(x=>x[1].ok), no = checked.filter(x=>!x[1].ok);

    <div class="acts">${yes.map(x=>row(x[0], x[1])).join("")}
      ${no.length ? `<details class="nope"${yes.length ? "" : " open"}><summary><span>${T("notToday").replace("{n}", no.length)}</span><span aria-hidden="true">▾</span></summary>${no.map(x=>row(x[0], x[1])).join("")}</details>` : ""}

  sh.querySelectorAll(".tab").forEach(t=> t.onclick = ()=>{ if(tooSoon()) return; menuTab = t.dataset.m; openSheet(true); });
  sh.querySelectorAll(".act").forEach(b=> b.onclick = ()=>{
    if(tooSoon()) return;
    Music.click();
    setPlan(S, selDay, b.dataset.a); save();
    let n = selDay + (ACTS[b.dataset.a].span || 1);
    while(n < 14 && (S.plan[n] || lockOf(S, n))) n++;
    selDay = n < 14 ? n : -1;

  const del = $("#shDel"); if(del) del.onclick = ()=>{ setPlan(S, selDay, null); save(); openSheet(); renderPlan(); };
  const fill = $("#shFill"); if(fill) fill.onclick = ()=>{ const id = S.plan[selDay];

/* the planner keeps the menu still: it scrolls the calendar only when the chosen day is hidden,

let sheetDrawn = 0, pageMoved = 0;
addEventListener("scroll", ()=>{ pageMoved = Date.now(); }, {passive:true});
function tooSoon(){ const t = Date.now(); return t - sheetDrawn < 350 || t - pageMoved < 250; }
function keepDayInView(){

/* ---------------- play the two weeks ---------------- */
function startPlay(){

}
function playShell(){
  show("play"); Music.want(STAGE.music.play);

  Music.ui(); paused = false; tripPending = false; follow = true; holds.clear();
  if(feedRO){ feedRO.disconnect(); feedRO.observe($("#feed")); }
  $("#spd").onclick = ()=>{ playSpeed = {0.5:1, 1:2, 2:4, 4:0.5}[playSpeed] || 1; store.set("speed", playSpeed); $("#spd").textContent = `${T("speed")} ×${playSpeed}`; };
  let pauWas = null;   /* tapping Resume also closes an open tooltip, which releases its hold first: decide from the moment of the tap */
  $("#pau").onpointerdown = ()=>{ pauWas = paused || holds.size > 0; };
  $("#pau").onclick = ()=>{
    const was = pauWas == null ? (paused || holds.size > 0) : pauWas; pauWas = null;
    if(was){ paused = false; holds.clear(); follow = true; autoAt = Date.now(); toLogEnd(true); clearTimeout(playTimer); playTimer = setTimeout(nextDay, 300); }
    else { paused = true; clearTimeout(playTimer); }

function resumePlay(){
  clearTimeout(playTimer); playShell();
  S.feed.forEach(o=>addDayCard(o));
  const last = S.feed[S.feed.length-1];
  if(last && last.trip && !last.tripRes){ S.feed.pop(); S.day = last.i;   /* a trip cut short starts again */
    const out = runDay(S, S.day); save(); addDayCard(out); return goTrip(out); }
  const go = ()=>{ clearTimeout(playTimer); playTimer = setTimeout(nextDay, 600); };
  const after = ()=> S.storyQ ? storyCard(S.storyQ, go) : go();
  if(S.stallQ) return stallCard(S.stallQ, after);   /* a stall night left open */
  if(S.stallRes) return stallResult(S.stallRes, after);   /* its result, not yet closed */
  if(S.storyQ) return storyCard(S.storyQ, go);   /* a story card left open */
  playTimer = setTimeout(nextDay, 500);
}
let tripPending = false;   /* while a trip is open, the days wait for it */
function goTrip(out){
  tripPending = true; clearTimeout(playTimer);
  return setTimeout(()=>runTrip(out.trip, res=>{ tripPending = false; holds.clear(); pauUI(); applyTrip(S, res); save();
      show("play"); autoAt = Date.now(); follow = true; toLogEnd(false); Music.want(STAGE.music.play); const last = S.feed[S.feed.length-1]; if(last) refreshTripCard(last); updateTop();
      playTimer = setTimeout(nextDay, 600); }), 500);
}
function nextDay(){
  clearTimeout(playTimer);
  if(holds.size || paused) return;   /* waiting for the player: a tooltip, a voice, or a hand on the log */
  if(tripPending || S.storyQ || S.stallQ || stallOpen) return;
  if(S.day >= 14) return endBlock();
  const out = runDay(S, S.day); save();
  addDayCard(out);
  if(out.msgs.some(m=>m[0] === "rank")) Music.chime();
  if(out.trip) return goTrip(out);
  const go = ()=>{ clearTimeout(playTimer); playTimer = setTimeout(nextDay, playSpeed >= 99 ? 30 : 600 / Math.min(playSpeed, 2)); };
  if(out.stall) return stallCard(out.stall, ()=> out.story ? storyCard(out.story, go) : go());   /* the stall's choice, then the moon */
  if(out.story) return storyCard(out.story, go);
  const wait = out.msgs.length ? 2500 : 1500;   /* normal speed: 1.5 s a day, longer when messages arrive */
  if(!paused) playTimer = setTimeout(nextDay, playSpeed >= 99 ? 30 : wait / playSpeed);
}

/* the log follows new days until the player scrolls up to read; scrolling back to the bottom resumes it */

/* ---- the week waits for the player (2026-10-14) ----

const holds = new Set();
let leftBottom = false;
const playingNow = ()=> !!S && $("#play").classList.contains("on") && S.phase === "play" && S.day < 14 && !tripPending && !S.storyQ && !S.stallQ && !stallOpen && playSpeed < 99;
function pauUI(){ const b = $("#pau"); if(!b) return; const on = paused || holds.size > 0; b.textContent = on ? T("resume") : T("pause"); b.classList.toggle("on", on); }
function hold(r){ if(!playingNow()) return; if(r === "hand" && !holds.has("hand")) leftBottom = !atBottom(); holds.add(r); clearTimeout(playTimer); follow = false; pauUI(); }
function release(r){
  if(!holds.delete(r)) return; pauUI();
  if(!holds.size && !paused && playingNow()){ follow = true; autoAt = Date.now(); toLogEnd(true); clearTimeout(playTimer); playTimer = setTimeout(nextDay, 700); }
}
document.addEventListener("ws:tip", ()=>hold("tip"));
document.addEventListener("ws:tipEnd", ()=>release("tip"));
document.addEventListener("ws:say", ()=>hold("say"));
document.addEventListener("ws:sayEnd", ()=>release("say"));
addEventListener("pointerdown", e=>{
  if(!e.target.closest || !e.target.closest("#feed") || e.target.closest(".g,[data-say]")) return;   /* words and voices hold on their own */
  if(holds.has("hand") && atBottom()) release("hand"); else hold("hand");
}, true);
["wheel","touchmove"].forEach(t=>addEventListener(t, ()=>{ if($("#play").classList.contains("on")) hold("hand"); }, {passive:true}));
addEventListener("scroll", ()=>{
  if(!holds.has("hand")) return;
  if(!atBottom()) leftBottom = true; else if(leftBottom) release("hand");
}, {passive:true});
let watch = null;
function watchLast(){
  if(!("IntersectionObserver" in window)) return;
  if(watch) watch.disconnect();
  const l = $("#feed") && $("#feed").lastElementChild; if(!l) return;
  watch = new IntersectionObserver(es=>{ const e = es[es.length-1];
    if(lastHand > autoAt && Date.now() - lastHand < 1500) follow = e.isIntersecting; }, {rootMargin:"0px 0px -40px 0px"});
  watch.observe(l);
}
/* the newest card can still grow after it is placed (its picture, fonts, the app resizing its frame),
   so while the log is following, any change in its size or in the visible screen scrolls to the end again (2026-10-24) */
function catchUp(){
  if(!follow || holds.size || !$("#play").classList.contains("on") || Date.now() - lastHand < 1500) return;
  autoAt = Date.now(); toLogEnd(false);
}
let feedRO = null, catchRAF = 0;
const catchSoon = ()=>{ cancelAnimationFrame(catchRAF); catchRAF = requestAnimationFrame(catchUp); };
if("ResizeObserver" in window) feedRO = new ResizeObserver(catchSoon);
addEventListener("resize", catchSoon);
if(window.visualViewport) visualViewport.addEventListener("resize", catchSoon);
/* scroll the newest card fully above the button bar. The bar's height is measured each time, since the
   iPhone's home-indicator area makes it taller than a fixed margin allows; a check after a smooth scroll
   finishes the job if a new card or the frame cut it short. */
let endCheck = 0;
function toLogEnd(smooth){
  const l = $("#feed") && $("#feed").lastElementChild; if(!l) return;
  const bar = $("#play .playbar");
  l.style.scrollMarginBottom = ((bar ? bar.offsetHeight : 0) + 12) + "px";
  l.scrollIntoView({block:"end", behavior: smooth ? "smooth" : "auto"});
  clearTimeout(endCheck);
  endCheck = setTimeout(()=>{ if(follow && !holds.size && $("#play").classList.contains("on") && !atBottom()){ autoAt = Date.now(); const k = $("#feed").lastElementChild; if(k) k.scrollIntoView({block:"end"}); } }, smooth ? 700 : 150);
}
/* a drag, a wheel or a scrolling key counts as the player's hand; a tap on a button does not */
["wheel","touchmove"].forEach(t=>addEventListener(t, ()=>{ lastHand = Date.now(); }, {passive:true}));
addEventListener("keydown", e=>{ if(/Arrow|Page|Home|End|^ $/.test(e.key)) lastHand = Date.now(); });
addEventListener("scroll", ()=>{
  if(!$("#play").classList.contains("on") || lastHand < autoAt || Date.now() - lastHand > 1500) return;   /* our own scrolling, or no hand */
  follow = atBottom();
}, {passive:true});

function exportCode(){ try{ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }catch(e){ return ""; } }
/* save files: plain JSON, named for the game date */
const okSave = s => !!s && s.v === 2 && typeof s.date === "string" && Number.isInteger(s.blk) && Array.isArray(s.plan) && s.plan.length === 14
  && ["thread","diary","notes","album","payQ","feed"].every(k=>Array.isArray(s[k])) && ["st","hearts","flags","locks","seen","mlog","sessions"].every(k=>s[k] && typeof s[k] === "object")
  && STATS.every(k=>typeof s.st[k] === "number");
function readSave(t){ try{ const s = JSON.parse(t); return okSave(s) ? migrate(s) : null; }catch(e){ return null; } }
/* a loaded save replaces the current one only if the game opens with it */
function useSave(s){
  clearTimeout(playTimer); closeModal();
  const was = S; S = migrate(s);
  try{ enter(); save(); toast(T("loaded")); }
  catch(e){ S = was; if(S) save(); toast(T("badFile")); if(S) enter(); else { renderTitle(); show("title"); } }
}
async function downloadSave(){
  const name = `window-seat-save-${S.date}.json`, data = JSON.stringify(S);
  let dl = null;
  try{ if(window.claude && window.claude.use) dl = await window.claude.use("downloads"); }catch(e){ dl = null; }
  if(dl){ try{ await dl.save({filename:name, data}); }catch(e){ if(!e || e.code !== "declined") toast(T("dlFail")); } return; }
  try{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type:"application/json"})); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
  catch(e){ toast(T("dlFail")); }
}
function importCode(c){ try{ const s = JSON.parse(decodeURIComponent(escape(atob(c)))); return okSave(s) ? migrate(s) : null; }catch(e){ return null; } }
function applyTheme(){ const t = store.get("theme", "auto"); if(t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }

/* postcards: little painted scenes */
function drawCard(cv, id){
  const c = cv.getContext("2d"), W = cv.width, H = cv.height;
  const sky = {sunset:["#F28C5B","#F7C77E"], nightlight:["#1B2346","#3B4A7A"], window:["#9CC7E0","#E9F2D8"], fort:["#A8D3EA","#E6F1F5"], temple:["#F5DDB0","#F9EED6"], beach:["#7FC4E8","#D9EEF7"], rainbow:["#8FD0F0","#E0F3FA"], pier2:["#F6D18A","#FBEBC8"]}[id] || ["#ccc","#eee"];
  const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0, sky[0]); g.addColorStop(1, sky[1]); c.fillStyle = g; c.fillRect(0,0,W,H);
  const sea = id === "nightlight" ? "#14203F" : "#3E7FB0";
  if(["sunset","nightlight","fort","beach","rainbow"].includes(id)){ c.fillStyle = sea; c.fillRect(0, H*.62, W, H*.38); }
  if(id === "sunset"){ c.fillStyle = "#F4C542"; c.beginPath(); c.arc(W*.35, H*.62, 16, Math.PI, 0); c.fill(); c.fillStyle = "rgba(244,197,66,.5)"; c.fillRect(W*.25, H*.66, W*.2, 3); }
  if(id === "nightlight"){ c.fillStyle = "#fff"; for(let i=0;i<30;i++) c.fillRect((i*37)%W, (i*23)%(H*.5), 1, 1); c.fillStyle = "rgba(255,230,140,.35)"; c.beginPath(); c.moveTo(W*.72,H*.3); c.lineTo(0,H*.1); c.lineTo(0,H*.25); c.fill(); }
  if(id === "beach"){ c.fillStyle = "#2E2A2A"; c.fillRect(0, H*.8, W, H*.2); c.fillStyle = "#fff"; c.fillRect(0, H*.78, W, 3); }
  const spr = {sunset:"lighthouse", nightlight:"lighthouse", window:"train", fort:"fort", temple:"temple", beach:"wave", rainbow:"rainbow", pier2:"robot"}[id];
  if(spr && SPR[spr]){ const t = document.createElement("canvas"); drawSprite(t, SPR[spr], 4); c.drawImage(t, W*.62 - 24, H*.62 - 44); }
}

/* ==== engine/trip.js ==== */
/* =========================================================
   adventures: explore days are played, not watched.
   A trip = the window-seat train + a map to explore + a night + a morning walk.
   ========================================================= */
let TS = null, rideAnim = 0;
function sunsetFor(){ const md = TS.date.slice(5); const r = TS.TR.map.sunsets.find(x=>md <= x[0]); return r ? r[1] : TS.TR.map.sunsets[TS.TR.map.sunsets.length-1][1]; }
const hhmm = m => `${pad(Math.floor(m/60) % 24)}:${pad(Math.round(m % 60))}`;
const toMin = s => { const [h, m] = s.split(":").map(Number); return h*60 + m; };
const statNow = k => S.st[k] + ((TS && TS.g[k]) || 0);
const rollStat = k => rand() < clamp(.35 + statNow(k)/50, .35, .95);
function tAdd(g, mul){ for(const k in g) TS.g[k] = (TS.g[k] || 0) + g[k] * (mul == null ? 1 : mul); }
function sceneHTML(pair){ return `<div class="msg scene"><div>${mk(pair[0])}</div><div class="zht" hidden>${esc(pair[1])}</div><div style="text-align:right;margin-top:4px"><button class="zhb" data-zh>${T("showZh")}</button> <button class="ib" style="width:30px;height:30px;vertical-align:middle" data-say="${esc(plain(pair[0]))}">${ICON.spk}</button></div></div>`; }

function runTrip(id, done){
  const TR = TRIPS[id];

function tripHead(title){

/* ---------------- 1. the departure board ---------------- */
function tripBoard(){
  const B = TS.TR.board; let now = toMin(B.now), sel = -1, boarded = false, tries = 0;
  const draw = ()=>{
    $("#trip").innerHTML = tripHead(LANG === "en" ? "Taipei Station" : "台北車站") + `
      <h2>${LANG === "en" ? "The departure board" : "出發時刻表"}</h2>${sceneHTML(B.task)}
      <div class="row" style="justify-content:space-between;margin:10px 0"><span class="muted">${T("time")}</span><span class="clock">${hhmm(now)}</span></div>
      <div class="board"><div class="bh"><span>TIME</span><span>TRAIN · TO</span><span>VIA</span><span>PLAT</span></div>
        ${B.rows.map((r,k)=>{ const gone = toMin(r.t) <= now;
          return `<button class="br${k === sel ? " sel" : ""}" data-k="${k}" ${gone ? "disabled style=\"opacity:.35\"" : ""}><span>${r.t}</span><span>${r.type} ${r.no}<small>${r.to}${gone ? " · DEPARTED" : ""}</small></span><span style="font-size:11px;line-height:1.25">${r.via.replace(" · ", ", ")}</span><span>${r.plat}</span></button>`; }).join("")}</div>
      <div id="bInfo" style="margin-top:10px"></div>
      <button class="btn" id="bGo" style="width:100%;margin-top:8px" ${sel < 0 ? "disabled" : ""}>${sel < 0 ? (LANG === "en" ? "Choose a train" : "選一班車") : (LANG === "en" ? `Go to platform ${B.rows[sel].plat}` : `去 ${B.rows[sel].plat} 月台`)}</button>`;
    Music.ui();
    $$("#trip .br").forEach(b=>{ if(boarded) b.disabled = true; b.onclick = ()=>{ if(boarded) return; sel = +b.dataset.k; draw(); }; });
    $("#bGo").onclick = ()=>{
      if(boarded) return;
      const r = B.rows[sel]; tries++;
      if(toMin(r.t) <= now){ toast(LANG === "en" ? "That train has left!" : "那班車已經開走了！"); return; }
      if(!r.ok){ now += 3; sel = -1; draw(); $("#bInfo").innerHTML = sceneHTML(r.why); return; }
      boarded = true; clearInterval(tick); $$("#trip .br").forEach(b=>b.disabled = true);
      TS.train = {type:r.type, no:r.no, arr:r.arr, slow:r.ok === 1};
      spend(r.ok === 1 ? TS.TR.costs.ticketSlow : TS.TR.costs.ticket);
      if(r.ok === 2 && tries === 1) tAdd({kh:1});
      const msg = r.ok === 1 ? [r.why[0] + " I get on anyway.", r.why[1] + "我還是上車了。"] : ["I find my seat: a window seat, of course.", "我找到我的位子：當然是靠窗。"];
      $("#bInfo").innerHTML = sceneHTML(msg);
      $("#bGo").textContent = T("next"); $("#bGo").disabled = false; $("#bGo").onclick = tripRide;
    };
  };
  const tick = setInterval(()=>{
    if(boarded || !$("#trip").classList.contains("on")) return;
    now++; const last = Math.max(...B.rows.filter(r=>r.ok).map(r=>toMin(r.t)));
    if(now > last){ clearInterval(tick); boarded = true;
      TS.train = {type:B.late.type, no:B.late.no, arr:B.late.arr, late:true}; spend(TS.TR.costs.ticket);
      draw(); $("#bInfo").innerHTML = sceneHTML(["I miss the train! I buy a ticket for the 9:00 Tze-Chiang. I drink a coffee and wait.","我錯過火車了！只好買九點那班自強號的票，喝杯咖啡等車。"]);
      $("#bGo").textContent = T("next"); $("#bGo").disabled = false; $("#bGo").onclick = tripRide; return; }
    const c = $("#trip .clock"); if(c) c.textContent = hhmm(now);
    if(B.rows.some(r=>toMin(r.t) === now)) draw();
  }, 2000);
  draw(); tripTop();
}

/* ---------------- 2. the window seat ---------------- */

/* a scene with options; stat checks, costs and gains; then a Next button */

function linkCost(a, b, l){
  const M = TS.TR.map, hill = M.nodes[a].hill || M.nodes[b].hill;
  if(TS.bike === "e" && !hill) return {min:Math.round(l[2]*.6), en:Math.max(1, Math.round(l[3]*.4))};
  if(TS.bike === "p" && !hill) return {min:Math.round(l[2]*.7), en:Math.max(1, Math.round(l[3]*.7))};
  return {min:l[2], en:l[3]};
}
function neighbors(){
  const M = TS.TR.map;
  return M.links.filter(l=>l[0] === TS.cur || l[1] === TS.cur).map(l=>{ const to = l[0] === TS.cur ? l[1] : l[0]; return Object.assign({to}, linkCost(TS.cur, to, l)); });
}

  [[78,10],[104,14],[122,34],[140,66],[178,98],[188,140],[200,196],[256,256],[W,292],[W,H],[244,H],[150,268],[70,214],[44,172],[40,112],[46,60],[58,24]].forEach(([x,y],k)=> k ? c.lineTo(x,y) : c.moveTo(x,y));

  /* the ferry from the mainland */

    if(id === TS.cur){ c.strokeStyle = "#D9534F"; c.lineWidth = 3; c.beginPath(); c.arc(n.x, n.y, 17, 0, 7); c.stroke(); }
  });
  const m = document.createElement("canvas"); drawSprite(m, SPR.mia, 1); const n = M.nodes[TS.cur]; c.drawImage(m, n.x-8, n.y-36, 16, 16);   /* Mia stands just above her spot */

  c.fillRect(12, H-14, 95, 3); c.fillRect(12, H-19, 2, 8); c.fillRect(105, H-19, 2, 8);

  const g = {}; Object.keys(TS.g).forEach(k=>{ g[k] = Math.round(TS.g[k]*10)/10; });
  const line = TS.sunsetOK === true ? "Kaohsiung! Train, ferry, island, and a sunset at the lighthouse."
             : TS.sunsetOK === false ? "Kaohsiung! Train, ferry, island, and the lighthouse at night."
             : "Kaohsiung! Train, ferry, seafood and the sea.";
  const res = {spent:TS.spent, g, stress:Math.round(TS.stress), cards:TS.cards.slice(), line, h:TS.h || {}};
  $("#trip").innerHTML = tripHead(LANG === "en" ? "Home again" : "回家了") + sceneHTML(W.done) + `<div style="margin-top:8px">${sceneHTML(W.home)}</div>
    <h3 style="margin-top:12px">${LANG === "en" ? "Trip results" : "旅行成果"}</h3>
    <div class="ticks" style="display:flex;flex-wrap:wrap;gap:6px 10px;font-size:15px">${ticksHTML({money:-res.spent, stress:res.stress, st:g})}</div>
    <div class="album" style="margin-top:10px">${res.cards.map(c=>`<div class="post"><canvas width="150" height="100" data-card="${c}"></canvas><span class="stamp">${c === "window" ? "TAIPEI → KAOHSIUNG" : "KAOHSIUNG"}</span><div class="pt">${esc(N(TS.TR.cards[c]))}</div></div>`).join("")}</div>
    <button class="btn" id="tDone" style="width:100%;margin-top:12px">${LANG === "en" ? "Back to Taipei" : "回到台北"}</button>`; tripTop();
  $$("#trip canvas[data-card]").forEach(cv=>drawCard(cv, cv.dataset.card)); Music.ui();
  $("#tDone").onclick = ()=>{ const d = TS.done; TS = null; d(res); };
}

/* ==== engine/main.js ==== */
/* boot */
applyTheme(); setLang(LANG); renderTitle();
["touchend","click"].forEach(t=>document.addEventListener(t, ()=>{ if(SYN && !window.__spk){ window.__spk = 1; try{ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; SYN.speak(u); }catch(e){} } }, true));

</script>

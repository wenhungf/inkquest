<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Window Seat: The Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Atkinson+Hyperlegible+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
html{-webkit-text-size-adjust:100%;}
[hidden]{display:none!important;}
</style>
<style>
:root{
  --bg:#F3EFE6; --surface:#FFFCF5; --ink:#24262E; --muted:#636774; --rule:#DDD6C7;
  --accent:#2F6F8F; --accent-ink:#FFFFFF; --tint:#DCEAF0; --warm:#E07A5F; --gold:#E9B44C; --gold-soft:rgba(233,180,76,.22); --gold-ink:#9A6A12;
  --good:#3E8E5E; --bad:#C0533A; --stress:#D9644A;
  --pop-bg:#24262E; --pop-ink:#F1EEE6; --pop-muted:#B0B3BD; --pop-accent:#F2C35B;
  --shadow:rgba(36,38,46,.18);
  --f-body:'Atkinson Hyperlegible',"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-disp:'Fraunces',Georgia,"PingFang TC","Noto Serif TC",serif;
  --f-px:'Atkinson Hyperlegible Mono',ui-monospace,"PingFang TC",monospace;
  --c-class:#5B8DB8; --c-work:#D9904A; --c-social:#D46A8C; --c-explore:#3E9C7A; --c-rest:#8C7BB5; --c-lock:#9A958A;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171C; --surface:#1E2128; --ink:#ECEAE4; --muted:#A3A6B0; --rule:#30343D;
  --accent:#7CB8D6; --accent-ink:#10161A; --tint:#203038; --pop-bg:#ECEAE4; --pop-ink:#1B1D22; --pop-muted:#585C66; --pop-accent:#2F6F8F;
  --shadow:rgba(0,0,0,.5); --gold-soft:rgba(233,180,76,.18); --gold-ink:#F2C35B;
}}
:root[data-theme="dark"]{
  --bg:#15171C; --surface:#1E2128; --ink:#ECEAE4; --muted:#A3A6B0; --rule:#30343D;
  --accent:#7CB8D6; --accent-ink:#10161A; --tint:#203038; --pop-bg:#ECEAE4; --pop-ink:#1B1D22; --pop-muted:#585C66; --pop-accent:#2F6F8F;
  --shadow:rgba(0,0,0,.5); --gold-soft:rgba(233,180,76,.18); --gold-ink:#F2C35B;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;}
body{min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
#app{overflow-anchor:none;max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding:env(safe-area-inset-top,0px) 16px 96px;}   /* clear the iPhone status bar */
.scr{display:none;} .scr.on{display:block;}
.px{font-family:var(--f-px);}
.muted{color:var(--muted);}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 18px;border-radius:12px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.15);}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--rule);box-shadow:none;}
.btn svg{width:18px;height:18px;fill:currentColor;flex:none;}
.btn.small{min-height:36px;padding:6px 12px;font-size:15px;border-radius:10px;}
.btn:disabled{opacity:.45;cursor:default;}
.btn.on{background:var(--ink);color:var(--bg);}
.row{display:flex;gap:10px;align-items:center;}
.wrap{flex-wrap:wrap;}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px;box-shadow:0 2px 8px var(--shadow);}
h1,h2,h3{font-family:var(--f-disp);line-height:1.15;}
h2{font-size:22px;margin:4px 0 10px;}
h3{font-size:18px;margin:2px 0 6px;}

/* title */
#title{text-align:center;padding-top:24px;}
#title canvas{width:100%;max-width:448px;image-rendering:pixelated;image-rendering:crisp-edges;margin:0 auto;border-radius:18px;box-shadow:0 6px 18px var(--shadow);}
#title .kick{font-family:var(--f-px);letter-spacing:.12em;color:var(--accent);font-size:14px;margin-top:18px;}
#title h1{font-size:40px;margin:4px 0 2px;}
#title .zh{font-size:18px;color:var(--muted);margin-bottom:6px;}
#title .blurb{font-size:15px;color:var(--muted);margin:6px auto 16px;max-width:340px;}
#title .btns{display:flex;flex-direction:column;gap:10px;align-items:center;}
#title .btns > .btn{min-width:220px;}
#title .btns .row .btn{min-width:0;}
#title .foot{margin-top:18px;font-size:13px;color:var(--muted);}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;border-bottom:1px solid var(--rule);margin:calc(-1 * env(safe-area-inset-top,0px)) -16px 12px;}   /* when stuck, its background covers the status bar */
.top .r1{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.top .date{font-family:var(--f-px);font-size:16px;}
.top .money{font-family:var(--f-px);font-size:16px;font-weight:700;}
.top .money.neg{color:var(--bad);}
.bar{height:10px;border-radius:6px;background:var(--rule);overflow:hidden;flex:1;}
.bar i{display:block;height:100%;background:var(--good);border-radius:6px;transition:width .4s;}
.bar.stress i{background:var(--stress);}
.top .r2{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;}
.ib{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;}
.ib svg{width:22px;height:22px;fill:currentColor;}
.ib.on{background:var(--ink);color:var(--bg);}

/* home */
.hero{display:flex;gap:12px;align-items:center;}
.hero canvas{width:96px;height:96px;border-radius:14px;background:var(--tint);flex:none;}
.hero canvas#endBust{image-rendering:pixelated;image-rendering:crisp-edges;}
.room{margin:4px 0 10px;border-radius:14px;overflow:hidden;line-height:0;box-shadow:0 6px 18px rgba(0,0,0,.25);}
.room canvas{width:100%;height:auto;display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
.hero .who{font-family:var(--f-disp);font-size:20px;}
.hero .sub{font-size:14px;color:var(--muted);}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:12px;}
.stat{font-size:14px;}
.stat .n{display:flex;justify-content:space-between;gap:6px;}
.goal .neg{color:var(--bad);}
.stat .bar{height:8px;margin-top:2px;}
.stat .bar i{background:var(--accent);}
.thread{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.msg{background:var(--surface);border:1px solid var(--rule);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:16px;}
.msg.rank{border:2px solid var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
.msg.rank .from span:first-child{color:var(--gold-ink);font-weight:700;}
.msg .from{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;}
.msg .zht{font-size:14px;color:var(--muted);margin-top:4px;}
.zhb{font-size:12px;border:1px solid var(--rule);border-radius:8px;padding:0 6px;color:var(--muted);}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.menu .btn{width:100%;}

/* planner */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px;}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-family:var(--f-px);}
.slot{position:relative;min-height:66px;border-radius:10px;border:2px dashed var(--rule);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:3px 1px;overflow:hidden;}
.slot .d{font-family:var(--f-px);font-size:12px;color:var(--muted);line-height:1;}
.slot canvas{width:24px;height:24px;margin-top:3px;flex:none;}
.slot .a{font-size:10.5px;line-height:1.2;text-align:center;margin-top:2px;word-break:break-word;padding-bottom:2px;}
.slot .d .tg{font-style:normal;font-family:var(--f-zh,inherit);font-size:9px;margin-left:2px;color:var(--bad);}
.slot .d .tg.sale{color:var(--accent);}
.slot.hol .d{color:var(--bad);}
.pnotes{font-size:12px;margin:6px 0 0;}
.tag.new{background:var(--gold);color:#2B2536;}
.infobar .r1{position:relative;}
.infobar .ttl{position:absolute;left:96px;right:96px;text-align:center;font-size:16px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.post{position:relative;}
.post .stamp{position:absolute;left:6px;top:6px;font-family:var(--f-px);font-size:10px;letter-spacing:.04em;background:rgba(255,255,255,.85);color:#2B2536;padding:1px 5px;border-radius:4px;}
.slot.set{border-style:solid;}
.slot.sel{outline:3px solid var(--gold);outline-offset:1px;}
.slot.lock{background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 6px,var(--rule) 6px,var(--rule) 8px);border-style:solid;cursor:default;}
.slot.past{opacity:.35;}
.slot.m-class{border-color:var(--c-class);} .slot.m-work{border-color:var(--c-work);} .slot.m-social{border-color:var(--c-social);} .slot.m-explore{border-color:var(--c-explore);} .slot.m-rest{border-color:var(--c-rest);}
.slot.today{box-shadow:0 0 0 2px var(--accent) inset;}
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
.preview .pv{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:8px;text-align:center;}
.preview .pv b{display:block;font-family:var(--f-px);font-size:17px;}
.preview .pv span{font-size:12px;color:var(--muted);}
.warn{color:var(--bad);font-size:14px;margin:6px 0;}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}

/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateY(110%);transition:transform .25s, visibility .25s;visibility:hidden;}
#sheet.on{transform:none;visibility:visible;}
body.sheet-on #plan{padding-bottom:58vh;}
#sheet .in{max-width:480px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px var(--shadow);padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));height:56vh;height:56svh;min-height:300px;display:flex;flex-direction:column;}
#sheet .hd{flex:none;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.tabs{flex:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;}
.tab{flex:none;padding:6px 10px;border-radius:999px;border:2px solid var(--rule);font-size:14px;}
.tab.on{color:#fff;border-color:transparent;}
.tab.on.m-class{background:var(--c-class);} .tab.on.m-work{background:var(--c-work);} .tab.on.m-social{background:var(--c-social);} .tab.on.m-explore{background:var(--c-explore);} .tab.on.m-rest{background:var(--c-rest);}
.acts{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px;padding:4px 0;}
.act{display:flex;gap:10px;align-items:center;text-align:left;padding:10px;border-radius:12px;border:1px solid var(--rule);background:var(--bg);width:100%;}
.act canvas{width:36px;height:36px;flex:none;}
.act .t{font-weight:700;}
.act .s{font-size:13px;color:var(--muted);}
.act .fx{font-size:13px;}
.act[disabled]{opacity:.45;}
.act .why{font-size:13px;color:var(--bad);}
.tag{white-space:nowrap;display:inline-block;font-size:12px;border-radius:6px;padding:0 6px;margin-left:4px;background:var(--tint);color:var(--ink);font-weight:400;}

/* play */
.feed{display:flex;flex-direction:column;gap:8px;}
#play{padding-bottom:24px;}
.feed > *{scroll-margin-bottom:84px;}   /* clears the fixed button bar */
.day{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:10px;animation:pop .25s ease-out;}
@keyframes pop{from{transform:translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.day canvas{width:56px;height:56px;border-radius:10px;flex:none;}
.day .dh{font-family:var(--f-px);font-size:13px;color:var(--muted);}
.day .ln{font-size:16px;}
.day .ticks{font-size:13px;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;}
.up{color:var(--good);} .dn{color:var(--bad);}
.playbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));}
.playbar .in{max-width:448px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;align-items:center;}

/* modal */
#modal{position:fixed;inset:0;z-index:60;background:rgba(20,20,26,.5);display:none;align-items:flex-end;justify-content:center;padding:16px;}
#modal.on{display:flex;}
#modal .box{width:100%;max-width:448px;max-height:86vh;overflow-y:auto;background:var(--surface);border-radius:18px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.3);margin-bottom:env(safe-area-inset-bottom,0px);}
#modal .choices{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
#trip .btn{white-space:normal;}
#modal .choices .btn,.choices .btn{width:100%;text-align:left;justify-content:flex-start;white-space:normal;flex-wrap:wrap;}
.choices .sopt{flex-direction:column;align-items:flex-start;gap:2px;padding-block:10px;}
.st-ticks{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:15px;}
.choices .sopt small{font-weight:400;color:var(--muted);font-size:13px;}
.diary{font-family:var(--f-disp);font-size:18px;line-height:28px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;background-image:repeating-linear-gradient(to bottom,transparent 0 21px,var(--rule) 21px 22px,transparent 22px 28px),linear-gradient(var(--surface),var(--surface));background-origin:content-box,border-box;background-clip:content-box,border-box;}   /* each line of text sits on a rule: 28px lines, the rule just under the baseline */
.diary p{margin:0;}
.diary .zht{color:var(--muted);margin:0;}
.de+.de{margin-top:28px;}
.de::after{content:"";display:block;clear:both;}
.de .dd{color:var(--muted);font-size:15px;height:28px;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.de .dpic{float:right;width:48px;height:48px;margin:0 0 0 10px;border-radius:8px;}
.dtools{display:inline-flex;gap:4px;align-items:center;}
.dtools .ib{width:24px;height:24px;}
.dtools .zhb{line-height:20px;}
.dnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px;}
.dnav b{font-family:var(--f-disp);font-size:20px;}
.dnav .btn[disabled]{opacity:.35;}

/* glossary words */
.g{border-bottom:2px dotted var(--accent);cursor:pointer;}
.g.seen{border-bottom-style:solid;}
#pop{position:fixed;z-index:70;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--pop-bg);color:var(--pop-ink);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;}
#pop.on{display:block;}
#pop .w{font-weight:700;font-size:18px;}
#pop .k{color:var(--pop-muted);font-size:14px;margin-left:6px;}
#pop .z{color:var(--pop-accent);font-size:16px;margin-top:2px;}
#pop .d{font-size:14px;color:var(--pop-muted);margin-top:4px;}
#pop .x{position:absolute;top:6px;right:6px;}

/* trip */
.board{background:#101418;color:#F5D36A;border-radius:12px;padding:10px;font-family:var(--f-px);font-size:14px;border:4px solid #2C3138;}
.board .bh{display:grid;grid-template-columns:50px 1fr 80px 34px;gap:4px;color:#8FB7D0;font-size:12px;border-bottom:1px solid #2C3138;padding-bottom:4px;margin-bottom:4px;}
.board .br{display:grid;grid-template-columns:50px 1fr 80px 34px;gap:4px;padding:6px 2px;border-radius:6px;width:100%;text-align:left;color:#F5D36A;}
.board .br:active,.board .br.sel{background:#22303A;}
.board .br small{display:block;color:#C9CFD6;font-size:11px;}
.clock{font-family:var(--f-px);font-size:20px;}
.win{width:100%;border-radius:16px;border:6px solid #3A3F47;background:#9CC7E0;}
.map{width:100%;border-radius:14px;border:1px solid var(--rule);touch-action:manipulation;}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;}
.hud .pv{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:6px;text-align:center;font-size:13px;}
.hud .pv b{display:block;font-family:var(--f-px);font-size:16px;}
.nodes{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.node{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--rule);background:var(--surface);text-align:left;width:100%;}
.node .nm{font-weight:700;}
.node .cost{font-size:13px;color:var(--muted);white-space:nowrap;}
.node.done{opacity:1;}
.node.done .nm{font-weight:600;}
.clues{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.clue{border:2px solid var(--rule);border-radius:12px;padding:6px;background:var(--surface);}
.clue canvas{width:100%;aspect-ratio:1;border-radius:8px;}
.clue .cn{font-size:12px;text-align:center;margin-top:2px;}
.clue.ok{border-color:var(--good);} .clue.no{border-color:var(--bad);}
.album{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.post{border-radius:12px;overflow:hidden;border:1px solid var(--rule);background:var(--surface);}
.post canvas{width:100%;aspect-ratio:3/2;}
.post .pt{font-size:13px;padding:6px 8px;}
.stat .n>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.stat .rk{font-size:12px;font-weight:400;margin-left:6px;letter-spacing:-.2px;color:var(--muted);}
.bar.rb0 i{background:#7BBF6A;} .bar.rb1 i{background:#4FA3C7;} .bar.rb2 i{background:#8E6FD1;} .bar.rb3 i{background:#E07A5F;} .bar.rb4 i{background:linear-gradient(90deg,#E9B44C,#F4D35E);}
.goal{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--rule);}
.goal .n{display:flex;justify-content:space-between;font-size:14px;font-weight:700;}
.bar.gl i{background:var(--gold);}
.nb{display:flex;flex-direction:column;gap:6px;}
.nb .it{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--rule);}
.nb .it > span:first-child{flex:1;min-width:0;}
.nb .it > span:last-child{flex:0 0 auto;max-width:48%;text-align:right;}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:80;opacity:0;transition:opacity .3s;pointer-events:none;max-width:88vw;text-align:center;}
#toast.on{opacity:1;}
.set .rowi{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);gap:8px;}
textarea{width:100%;min-height:80px;font:13px ui-monospace,monospace;border-radius:10px;border:1px solid var(--rule);padding:8px;background:var(--bg);color:var(--ink);}
.hearts{display:flex;flex-direction:column;gap:8px;}
.fr{display:flex;gap:10px;align-items:center;}
.fr canvas{width:48px;height:48px;border-radius:10px;background:var(--tint);}
.fr .h{color:var(--warm);letter-spacing:2px;}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:15px;margin:8px 0;}
.back{margin-bottom:6px;}
</style>
</head>
<body>

<div id="app">
  <section id="title" class="scr on"></section>
  <section id="home" class="scr"></section>
  <section id="plan" class="scr"></section>
  <section id="play" class="scr"></section>
  <section id="trip" class="scr"></section>
  <section id="info" class="scr"></section>
</div>
<div id="sheet"><div class="in"></div></div>
<div id="modal"><div class="box"></div></div>
<div id="pop"></div>
<div id="toast"></div>
<script>
/* ==== engine/i18n.js ==== */
/* UI strings: Chinese first, English on the toggle. Story text stays in English. */
const UI = {

const statRank = v => { let r = 0; RANK_AT.forEach((t,i)=>{ if(v >= t) r = i; }); return r; };
const rankProgress = v => { const r = statRank(v); return r >= RANK_AT.length - 1 ? 1 : (v - RANK_AT[r]) / (RANK_AT[r+1] - RANK_AT[r]); };

/* rain on a given day: the same quick hash as the room's window, one day in four */
function rainyOn(date){ let h = 0; for(const ch of date) h = (h*31 + ch.charCodeAt(0)) >>> 0; h = Math.imul(h ^ (h >>> 7), 2654435761) >>> 0; return (h >>> 3) % 4 === 3; }

/* a day's pay for a job: the store pays the hourly wage for eight hours plus commission on what Mia sells */
function payFor(S, id, date, good){
  const a = ACTS[id];
  if(a.pay === "dept"){
    const base = wageOn(date) * 8, busy = D.wd(date) >= 5 || !!holidayOn(date), sale = saleOn(date);
    const sales = (busy ? 14000 : 8000) * (sale ? 2 : 1) * (.6 + Math.min(200, S.st.sty + S.st.co)/100)   /* stats have no ceiling now, so sales stop growing at 200 */ * (good ? 1 : .5);
    const comm = Math.round(sales * (sale ? .04 : .03) / 10) * 10;
    return {amt:base + comm, base, comm};
  }
  if(a.pay === "cafe"){
    const rate = wageOn(date) + ((S.sessions.barista || 0) >= RANKS[1] ? 20 : 0), amt = Math.round(rate * 6 * (good ? 1 : .8));
    return {amt, base:amt, comm:0};
  }
  if(id === "delivery"){   /* paid by the order: about NT$130 each; rain means seven orders, a bad day eight.
     The 2026 law counts only delivery time (pickup to door) for the 1.25× wage floor: at about 20 minutes an order
     (25 in the rain) every case clears it, e.g. rain 7 × 25 min ≈ 2.9 h × 1.25 × 245 ≈ NT$893 < 910; NT$130 > NT$45 an order. */
    const orders = rainyOn(date) ? 7 : good ? 10 : 8;
    return {amt:orders * 130, base:orders * 130, comm:0, orders};
  }
  const amt = good ? a.pay : Math.round(a.pay * .8);
  return {amt, base:amt, comm:0};
}

  set(k, v){ try{ localStorage.setItem(PREFIX+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(PREFIX+k); }catch(e){} }

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const RX = /\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g;

  return esc(s).replace(RX, (m, disp, key)=>{
    key = key || disp.toLowerCase();
    const seen = (typeof S !== "undefined" && S && S.notes && S.notes.includes(key)) ? " seen" : "";
    return `<span class="g${seen}" role="button" tabindex="0" data-k="${esc(key)}">${disp}</span>`;

}

/* ---------------- dates ---------------- */
const D = {
  parse(s){ const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); },
  iso(dt){ return dt.toISOString().slice(0,10); },
  add(s, n){ const dt = D.parse(s); dt.setUTCDate(dt.getUTCDate()+n); return D.iso(dt); },
  wd(s){ return (D.parse(s).getUTCDay() + 6) % 7; },          /* 0 = Monday */
  day(s){ return D.parse(s).getUTCDate(); },
  mon(s){ return D.parse(s).getUTCMonth(); },
  short(s){ const dt = D.parse(s); return LANG === "en" ? `${MON_EN[dt.getUTCMonth()]} ${dt.getUTCDate()}` : `${dt.getUTCMonth()+1}/${dt.getUTCDate()}`; },
  long(s){ const dt = D.parse(s); return LANG === "en" ? `${WD_EN[D.wd(s)]}, ${MON_EN[dt.getUTCMonth()]} ${dt.getUTCDate()}` : `${dt.getUTCMonth()+1} 月 ${dt.getUTCDate()} 日（${WD_ZH[D.wd(s)]}）`; },
  storyDate(s){ const dt = D.parse(s); return `${WD_EN[D.wd(s)]}, ${MON_FULL[dt.getUTCMonth()]} ${dt.getUTCDate()}`; }
};

const PAL = {k:"#2B2536",w:"#FFFFFF",y:"#F4C542",o:"#E58E3A",r:"#D9534F",p:"#E79AB2",g:"#7BBF6A",G:"#3E8E5E",

function drawSprite(cv, rows, scale){
  const h = rows.length, w = rows[0].length; scale = scale || 1;
  cv.width = w*scale; cv.height = h*scale;
  const c = cv.getContext("2d"); c.clearRect(0,0,cv.width,cv.height);
  rows.forEach((r,y)=>{ for(let x=0;x<r.length;x++){ const ch = r[x]; if(ch === "." || !PAL[ch]) continue; c.fillStyle = PAL[ch]; c.fillRect(x*scale,y*scale,scale,scale); } });
  return cv;
}
function spriteHTML(id, cls){ return `<canvas class="${cls||""}" data-spr="${esc(id)}"></canvas>`; }
function paintSprites(root){
  (root || document).querySelectorAll("canvas[data-spr]").forEach(cv=>{ const g = SPR[cv.dataset.spr]; if(g) drawSprite(cv, g); });
}

/* ---------------- FM music ---------------- */
const Music = (()=>{  /* the Lamplight Readers FM player */
  let ctx=null, bus, out, timer=null, cur=-1, step=0, nextT=0, keeper=null, ducked=false;
  let vol = store.get("vol", 50) / 100;
  const midi = n=>{ const m=/^([A-G])(#?)(\d)$/.exec(n); return 12*(+m[3]+1)+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0); };
  const hz = m=>440*Math.pow(2,(m-69)/12);
  const P = {
    ep:   {mods:[{r:1,i:1.6,d:.9},{r:14,i:.5,d:.07}], a:.004, dec:2.2, sus:0, g:.16, lp:3200},
    bell: {mods:[{r:3.5,i:2.6,d:1.6}], a:.002, dec:2.6, sus:0, g:.10, lp:6000},
    bass: {mods:[{r:1,i:2.2,d:.22}], a:.005, dec:.9, sus:.35, g:.24, lp:900},
    pad:  {mods:[{r:2,i:.7,d:9}], a:.9, dec:4, sus:.8, g:.07, lp:2400, det:6},
    mar:  {mods:[{r:4,i:2.4,d:.09}], a:.002, dec:.55, sus:0, g:.13, lp:4200}
  };
  function parse(str){ const t=str.split(/\s+/).filter(z=>z&&z!=="|"), ev={}; let last=null;
    t.forEach((k,i)=>{ if(k==="-"){last=null;return;} if(k==="_"){ if(last) last.len++; return; } last={ms:k.split("+").map(midi),len:1}; ev[i]=last; });
    return {n:t.length, ev}; }
  const TR = TRACKS; TR.forEach(t=>t.parts.forEach(p=>p.q=parse(p.s)));
  function silentWav(){
    const n = 4000, buf = new ArrayBuffer(44+n), v = new DataView(buf), w = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
    w(0,"RIFF"); v.setUint32(4,36+n,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,"data"); v.setUint32(40,n,true);
    for(let i=0;i<n;i++) v.setUint8(44+i,128);
    let s = ""; new Uint8Array(buf).forEach(b=> s += String.fromCharCode(b));
    return "data:audio/wav;base64," + btoa(s);
  }
  /* iOS: play through the silent switch, and keep the session alive */
  function unlockIOS(){
    try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}
    try{ if(!keeper){ keeper = new Audio(silentWav()); keeper.loop = true; keeper.setAttribute("playsinline",""); keeper.volume = 0.01; }
      const pr = keeper.play(); if(pr && pr.catch) pr.catch(()=>{}); }catch(e){}
  }
  function impulse(sec){ const n=ctx.sampleRate*sec, b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let c=0;c<2;c++){ const ch=b.getChannelData(c); for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2); } return b; }
  function init(){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    ctx=new AC(); out=ctx.createGain(); bus=ctx.createGain();
    const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3;
    const rev=ctx.createConvolver(); rev.buffer=impulse(3); const rg=ctx.createGain(); rg.gain.value=.32;
    const dly=ctx.createDelay(1); dly.delayTime.value=.42; const fb=ctx.createGain(); fb.gain.value=.28;
    const dlp=ctx.createBiquadFilter(); dlp.type="lowpass"; dlp.frequency.value=1800; const dg=ctx.createGain(); dg.gain.value=.18;
    bus.connect(comp); bus.connect(rev); rev.connect(rg); rg.connect(comp);
    bus.connect(dly); dly.connect(dlp); dlp.connect(fb); fb.connect(dly); dlp.connect(dg); dg.connect(comp);
    comp.connect(out); out.connect(ctx.destination); out.gain.value=0; return true;
  }
  function applyVol(){ if(out) out.gain.setTargetAtTime(cur < 0 ? 0 : vol*(ducked?.3:1), ctx.currentTime, .08); }
  function voice(t, m, dur, p, vel){
    const f=hz(m), amp=ctx.createGain(), lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=p.lp;
    const carriers=[f]; if(p.det) carriers.push(f*Math.pow(2,p.det/1200));

        o.connect(g); g.connect(c.frequency); o.start(t); o.stop(stopAt); });
      c.connect(lp); c.start(t); c.stop(stopAt);

    const pk=p.g*(vel||1)/carriers.length;
    amp.gain.setValueAtTime(0,t); amp.gain.linearRampToValueAtTime(pk,t+p.a);
    amp.gain.setTargetAtTime(pk*p.sus,t+p.a,p.dec/3);
    amp.gain.setTargetAtTime(0,t+Math.max(p.a,dur),p.sus?.5:.25);

/* ---------------- speech ----------------
   English voice for the text; foreign words (FOREIGN_WORDS in gloss.js) and any Chinese characters are read
   mid-sentence by a voice for their language when the device has one, as in the Lamplight Readers and the textbooks. */
const SYN = window.speechSynthesis || null;
const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Ralph|Fred|Kathy|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
function vq(v){ const s = (v.voiceURI || "") + " " + v.name;
  if(/premium|高品質|優質/i.test(s)) return 2; if(/enhanced|增強|加強|Natural|Neural|Online/i.test(s)) return 1; return 0; }
let VOICE = null;
function pickVoice(){
  if(!SYN) return;
  const vs = SYN.getVoices().filter(v=>/^en/i.test(v.lang) && !NOVELTY.test(v.name));
  VOICE = vs.find(v=>/Samantha|Google US English|Aria|Jenny|Ava|Allison/i.test(v.name) && /^en[-_]US/i.test(v.lang)) || vs.find(v=>/^en[-_]US/i.test(v.lang)) || vs[0] || null;
}
if(SYN){ pickVoice(); SYN.onvoiceschanged = pickVoice; }
const sayAs = t => Object.entries(SAY_AS).reduce((x,[w,r])=>x.split(w).join(r), t);
const FOREIGN = {};
Object.entries(typeof FOREIGN_WORDS !== "undefined" ? FOREIGN_WORDS : {}).forEach(([k,v])=>{ FOREIGN[k.toLowerCase()] = {lang:v[0], en:v[1], nat:v[2] || k}; });
const HAN = /^[\u3400-\u9fff]+$/;
const FRX = new RegExp("(^|[^\\p{L}])(" + Object.keys(FOREIGN).sort((a,b)=>b.length-a.length)
  .map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).concat(["[\\u3400-\\u9fff]+"]).join("|") + ")(?![\\p{L}])", "giu");

  if(!SYN || !lang) return null; const L = lang.toLowerCase(), base = L.split("-")[0];
  const vs = SYN.getVoices().filter(v=>!NOVELTY.test(v.name)), norm = v => String(v.lang).replace("_","-").toLowerCase();
  const best = a => a.slice().sort((x,y)=>vq(y)-vq(x))[0];
  return best(vs.filter(v=>norm(v) === L)) || best(vs.filter(v=>norm(v).split("-")[0] === base)) || null;

/* split a line into parts read in order: [{t, nv}], nv = a native voice, or absent for the English voice */
function speakParts(s){
  const raw = []; let i = 0, m; FRX.lastIndex = 0;
  while((m = FRX.exec(s))){ const st = m.index + m[1].length, w = m[2];
    if(st > i) raw.push({t:s.slice(i, st)});
    raw.push({t:w, f:FOREIGN[w.toLowerCase()] || (HAN.test(w) ? {lang:"zh-TW", en:"", nat:w.replace(/好吃/g, "郝吃")} : null)});
    i = st + w.length; FRX.lastIndex = i; }
  if(i < s.length) raw.push({t:s.slice(i)});
  const parts = [];
  raw.forEach(p=>{ const nv = p.f && nativeVoice(p.f.lang);
    if(nv){ parts.push({t:p.f.nat, nv}); return; }

/* say() tells the page when speech starts and ends, so the play log can wait while Mia's words are read */
let sayId = 0;
const ping = n => document.dispatchEvent(new Event(n));
function say(t){
  if(!SYN) return;
  const parts = speakParts(plain(t).replace(/[“”]/g,'"').replace(/[’‘]/g,"'"));

function openGloss(k, anchor){

    <div><span class="w">${esc(g.w || k)}</span>${g.kk ? `<span class="k">${esc(g.kk)}</span>` : ""}

    <div class="z">${esc(g.zh)}</div>${g.d ? `<div class="d">${esc(g.d)}</div>` : ""}`;
  const r = anchor.getBoundingClientRect();
  p.style.top = (r.bottom + 8 + 150 > innerHeight ? Math.max(8, r.top - 158) : r.bottom + 8) + "px";

document.addEventListener("click", e=>{
  const g = e.target.closest(".g"); if(g){ e.stopPropagation(); openGloss(g.dataset.k, g); return; }

    STALL_DATES.forEach((d,i)=>{ s.locks[d] = "stall" + (i+1); });
    s.thread.push(["chen","Pretty girl! My family has a grill stall at the night market. This year we are in the best-stall vote: Wednesday, Thursday and Mid-Autumn night. Can you help us? I pay NT$1,000 a night!","美女！我們家在夜市有一攤烤肉。今年我們參加最佳攤位票選：星期三、星期四，還有中秋節晚上。妳可以來幫忙嗎？一個晚上給妳一千塊！"]);

const blockDate = (S, i) => D.add(S.date, i);
const monthKey = d => d.slice(0,7);
function lockOf(S, i){ return S.locks[blockDate(S, i)] || null; }
function actOf(id){ return ACTS[id] || SPECIAL[id] || null; }

/* can activity `id` go on day i of this block? */
function canPlace(S, id, i){
  const a = ACTS[id], date = blockDate(S, i), wd = D.wd(date);
  if(lockOf(S, i)) return {ok:false, why:"locked"};
  if((a.open || 0) > S.blk) return {ok:false, why:"flag"};
  if(a.days && !a.days.includes(wd)) return {ok:false, why:"days"};
  if(a.cls && a.days && holidayOn(date)) return {ok:false, why:"holiday"};
  if(id === "driving"){   /* ten lessons make a course; no more once they are booked or done */
    const booked = S.plan.filter((p,k)=>p === "driving" && k !== i).length;

  }

  if(old === "khh2"){ S.plan[i-1] = null; }

/* the money and stress a plan would mean, before it plays */
function preview(S){

  for(let i=0;i<14;i++){
    const date = blockDate(S, i), lk = lockOf(S, i), id = lk || S.plan[i] || "free", a = actOf(id);
    cost += STAGE.living;
    STAGE.bills.forEach(b=>{ if(D.day(date) === b.day) cost += b.amt; });
    if(!a) continue;
    cost += a.cost || 0; if(a.est) cost += a.est;
    if(/^stall\d$/.test(id)) cashIn += STALL.pay;   /* Auntie Chen pays cash each night */
    if(a.pay && ACTS[id]){ const amt = payFor(S, id, date, true).amt; income += amt;
      if(a.cash || (a.weekly && payDate(date, a) <= blockDate(S, 13))) cashIn += amt; }   /* money that arrives inside these two weeks */

  const cash = S.payQ.filter(p=>p.date <= blockDate(S, 13)).reduce((t,p)=>t+p.amt, 0);

/* when a job's pay arrives: a set day of the next month, the Wednesday after the week, or the same day */
function payDate(date, a){

  if(a.weekly) return D.add(date, 7 - D.wd(date) + 2);

function runDay(S, i){

/* ---------------- the Mid-Autumn stall (Phase C) ----------------

    const v = S.flags.stallVotes, pl = STALL.places.find(x=>v >= x[0]);
    S.flags.stallPlace = pl[1]; S.money += pl[2];
    res.final = {votes:v, place:pl[1], prize:pl[2], line:STALL.result[pl[1]], bbq:STALL.bbq};
  }
  clampAll(S);
  /* the day card in the log shows the night's pay and growth too */
  const last = S.feed[S.feed.length-1];
  if(last && last.stall === n){ last.cash = (last.cash || 0) + res.cash + (res.final ? res.final.prize : 0); last.d.money += res.cash + (res.final ? res.final.prize : 0);
    for(const k in res.gain) last.d.st[k] = (last.d.st[k] || 0) + res.gain[k];
    for(const k in res.hearts) last.d.hearts[k] = (last.d.hearts[k] || 0) + res.hearts[k]; }
  S.stallQ = null; S.stallRes = res; save();   /* the result card stays until Continue, even after a reload */
  return res;
}

/* a story moment: the play screen shows it as a card (S.storyQ until the player taps Continue), and it stays in the diary */
function storyPage(S, out, id, date){
  if(out.story) return;
  const pg = {kind:"story", id, date};
  S.diary.push(pg); S.storyQ = pg; out.story = pg;
}
const STAT_NAME = {en:["English","英文"], co:["Confidence","自信"], fi:["Fitness","體力"], cr:["Craft","手藝"], sty:["Style","風格"], kh:["Know-how","生活力"]};
/* a stat that climbs into a new rank gets a line in the log, even if a trip or an event raised it */
function checkRanks(S, msgs){
  S.rk = S.rk || {};
  STATS.forEach(k=>{
    const r = statRank(S.st[k]), was = S.rk[k] == null ? r : S.rk[k];
    if(r > was){
      const ln = RANK_LINES[k][r]; msgs.push(["rank", ln[0], ln[1], k]); }   /* the 4th field names the stat for the card's header */
    S.rk[k] = Math.max(r, was);
  });
}
function finishDay(S, out, before){
  clampAll(S); checkRanks(S, out.msgs);
  out.d = {money:S.money - before.money, stress:S.stress - before.stress, st:{}, hearts:{}};
  STATS.forEach(k=>{ const v = S.st[k] - before.st[k]; if(Math.abs(v) >= .05) out.d.st[k] = v; });
  Object.keys(S.hearts).forEach(k=>{ const v = S.hearts[k] - before.hearts[k]; if(v) out.d.hearts[k] = v; });
  S.day = out.i + 1; S.feed.push(out);
  return out;
}

/* a finished adventure pays out */
function applyTrip(S, res){
  S.money -= res.spent;
  for(const k in res.g) S.st[k] += res.g[k];
  S.stress += res.stress;
  res.cards.forEach(c=>{ if(!S.album.includes(c)) S.album.push(c); });
  for(const k in (res.h || {})) S.hearts[k] += res.h[k];
  (res.notes || []).forEach(k=>{ if(!S.notes.includes(k)) S.notes.push(k); });
  S.trips++; clampAll(S);
  const last = S.feed[S.feed.length-1];
  if(last && last.trip){ last.line = res.line; last.tripRes = res; last.d = {money:-res.spent, stress:res.stress, st:Object.assign({}, res.g), hearts:Object.assign({}, res.h || {})}; }
}

/* ---------------- a block closes ---------------- */
function closeBlock(S){
  if(S.stallQ) resolveStall(S, S.stallQ, stallAuto(S, S.stallQ));
  S.stallRes = null;
  const sn = S.snap, sum = {money:S.money - sn.money, stress:S.stress - sn.stress, st:{}, hearts:{}, notes:S.notes.length - sn.notes, album:S.album.length - sn.album};
  STATS.forEach(k=>{ const v = S.st[k] - sn.st[k]; if(Math.abs(v) >= .05) sum.st[k] = v; });
  Object.keys(S.hearts).forEach(k=>{ const v = S.hearts[k] - sn.hearts[k]; if(v) sum.hearts[k] = v; });
  /* did a month end inside this block? */
  sum.diary = null;
  for(let i=0;i<14;i++){ const d = blockDate(S, i), nx = D.add(d, 1); if(monthKey(d) !== monthKey(nx)){ sum.diary = diaryFor(S, monthKey(d)); S.diary.push(sum.diary); } }
  S.lastPlan = S.plan.slice();
  S.lastLog = {date:S.date, feed:S.feed, sum};   /* the two weeks stay readable after they end */
  S.plan = new Array(14).fill(null); S.feed = [];
  S.blk++; S.date = D.add(S.date, 14);
  if(S.blk >= STAGE.blocks) S.done = true;
  S.phase = S.done ? "end" : "home";
  save();
  return sum;
}

                                                              "這個月，在中秋的月亮下，我下定決心：我想去倫敦打工度假。");
  else if(S.flags.decided && monthKey(S.flags.decided) < mkey){
    if(S.money < 0) L("I am saving for London, but I owe money now. London feels very far away.", "我在為倫敦存錢，可是現在我欠錢了。倫敦感覺好遠。");
    else if(S.money >= VISA_GOAL.ntd) L("I have enough money for the visa now! London, here I come.", "簽證要的錢我存夠了！倫敦，我來了。");
    else L(`I am saving for London. I have NT$${cash(S.money)} now, and I need about NT$${cash(VISA_GOAL.ntd)}.`,
           `我在為倫敦存錢。我現在有 NT$${cash(S.money)}，大約需要 NT$${cash(VISA_GOAL.ntd)}。`);

  const after = ()=> S.storyQ ? storyCard(S.storyQ, go) : go();
  if(S.stallQ) return stallCard(S.stallQ, after);   /* a stall night left open */
  if(S.stallRes) return stallResult(S.stallRes, after);   /* its result, not yet closed */

function nextDay(){

  addDayCard(out);

/* the log follows new days until the player scrolls up to read; scrolling back to the bottom resumes it */
let follow = true, lastHand = 0, autoAt = 0;

/* ---- the week waits for the player (2026-10-14) ----

async function downloadSave(){
  const name = `window-seat-save-${S.date}.json`, data = JSON.stringify(S);
  let dl = null;
  try{ if(window.claude && window.claude.use) dl = await window.claude.use("downloads"); }catch(e){ dl = null; }
  if(dl){ try{ await dl.save({filename:name, data}); }catch(e){ if(!e || e.code !== "declined") toast(T("dlFail")); } return; }
  try{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type:"application/json"})); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
  catch(e){ toast(T("dlFail")); }
}
function importCode(c){ try{ const s = JSON.parse(decodeURIComponent(escape(atob(c)))); return okSave(s) ? migrate(s) : null; }catch(e){ return null; } }

/* postcards: little painted scenes */
function drawCard(cv, id){
  const c = cv.getContext("2d"), W = cv.width, H = cv.height;
  const sky = {sunset:["#F28C5B","#F7C77E"], nightlight:["#1B2346","#3B4A7A"], window:["#9CC7E0","#E9F2D8"], fort:["#A8D3EA","#E6F1F5"], temple:["#F5DDB0","#F9EED6"], beach:["#7FC4E8","#D9EEF7"], rainbow:["#8FD0F0","#E0F3FA"], pier2:["#F6D18A","#FBEBC8"]}[id] || ["#ccc","#eee"];
  const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0, sky[0]); g.addColorStop(1, sky[1]); c.fillStyle = g; c.fillRect(0,0,W,H);
  const sea = id === "nightlight" ? "#14203F" : "#3E7FB0";
  if(["sunset","nightlight","fort","beach","rainbow"].includes(id)){ c.fillStyle = sea; c.fillRect(0, H*.62, W, H*.38); }
  if(id === "sunset"){ c.fillStyle = "#F4C542"; c.beginPath(); c.arc(W*.35, H*.62, 16, Math.PI, 0); c.fill(); c.fillStyle = "rgba(244,197,66,.5)"; c.fillRect(W*.25, H*.66, W*.2, 3); }
  if(id === "nightlight"){ c.fillStyle = "#fff"; for(let i=0;i<30;i++) c.fillRect((i*37)%W, (i*23)%(H*.5), 1, 1); c.fillStyle = "rgba(255,230,140,.35)"; c.beginPath(); c.moveTo(W*.72,H*.3); c.lineTo(0,H*.1); c.lineTo(0,H*.25); c.fill(); }
  if(id === "beach"){ c.fillStyle = "#2E2A2A"; c.fillRect(0, H*.8, W, H*.2); c.fillStyle = "#fff"; c.fillRect(0, H*.78, W, 3); }
  const spr = {sunset:"lighthouse", nightlight:"lighthouse", window:"train", fort:"fort", temple:"temple", beach:"wave", rainbow:"rainbow", pier2:"robot"}[id];
  if(spr && SPR[spr]){ const t = document.createElement("canvas"); drawSprite(t, SPR[spr], 4); c.drawImage(t, W*.62 - 24, H*.62 - 44); }
}

/* ==== engine/trip.js ==== */
/* =========================================================
   adventures: explore days are played, not watched.
   A trip = the window-seat train + a map to explore + a night + a morning walk.
   ========================================================= */
let TS = null, rideAnim = 0;
function sunsetFor(){ const md = TS.date.slice(5); const r = TS.TR.map.sunsets.find(x=>md <= x[0]); return r ? r[1] : TS.TR.map.sunsets[TS.TR.map.sunsets.length-1][1]; }
const hhmm = m => `${pad(Math.floor(m/60) % 24)}:${pad(Math.round(m % 60))}`;
const toMin = s => { const [h, m] = s.split(":").map(Number); return h*60 + m; };
const statNow = k => S.st[k] + ((TS && TS.g[k]) || 0);
const rollStat = k => rand() < clamp(.35 + statNow(k)/50, .35, .95);
function tAdd(g, mul){ for(const k in g) TS.g[k] = (TS.g[k] || 0) + g[k] * (mul == null ? 1 : mul); }
function sceneHTML(pair){ return `<div class="msg scene"><div>${mk(pair[0])}</div><div class="zht" hidden>${esc(pair[1])}</div><div style="text-align:right;margin-top:4px"><button class="zhb" data-zh>${T("showZh")}</button> <button class="ib" style="width:30px;height:30px;vertical-align:middle" data-say="${esc(plain(pair[0]))}">${ICON.spk}</button></div></div>`; }

function runTrip(id, done){
  const TR = TRIPS[id];
  TS = {id, TR, done, date:blockDate(S, S.day - 1), spent:0, g:{}, stress:-15, cards:[], energy:0, time:0, bike:false, visited:{}, cur:TR.map.start, sunsetOK:null, train:null};

}
function tripHead(title){

    <button class="ib" data-music aria-label="${T("music")}">${ICON.music}</button></div></div>`;

function spend(n){ TS.spent += n; }
/* a new trip screen starts at the top; a result that appears in place is moved into view below the sticky bar */
function tripTop(){ window.scrollTo(0,0); const a = $("#app"); if(a) a.scrollIntoView({block:"start"}); }
function reveal(el){

  if(r.top < bb + 6){ el.style.scrollMarginTop = (bb + 8) + "px"; el.scrollIntoView({block:"start"}); }

/* ---------------- 1. the departure board ---------------- */
function tripBoard(){
  const B = TS.TR.board; let now = toMin(B.now), sel = -1, boarded = false, tries = 0;
  const draw = ()=>{
    $("#trip").innerHTML = tripHead(LANG === "en" ? "Taipei Station" : "台北車站") + `
      <h2>${LANG === "en" ? "The departure board" : "出發時刻表"}</h2>${sceneHTML(B.task)}
      <div class="row" style="justify-content:space-between;margin:10px 0"><span class="muted">${T("time")}</span><span class="clock">${hhmm(now)}</span></div>
      <div class="board"><div class="bh"><span>TIME</span><span>TRAIN · TO</span><span>VIA</span><span>PLAT</span></div>
        ${B.rows.map((r,k)=>{ const gone = toMin(r.t) <= now;
          return `<button class="br${k === sel ? " sel" : ""}" data-k="${k}" ${gone ? "disabled style=\"opacity:.35\"" : ""}><span>${r.t}</span><span>${r.type} ${r.no}<small>${r.to}${gone ? " · DEPARTED" : ""}</small></span><span style="font-size:11px;line-height:1.25">${r.via.replace(" · ", ", ")}</span><span>${r.plat}</span></button>`; }).join("")}</div>
      <div id="bInfo" style="margin-top:10px"></div>
      <button class="btn" id="bGo" style="width:100%;margin-top:8px" ${sel < 0 ? "disabled" : ""}>${sel < 0 ? (LANG === "en" ? "Choose a train" : "選一班車") : (LANG === "en" ? `Go to platform ${B.rows[sel].plat}` : `去 ${B.rows[sel].plat} 月台`)}</button>`;
    Music.ui();
    $$("#trip .br").forEach(b=>{ if(boarded) b.disabled = true; b.onclick = ()=>{ if(boarded) return; sel = +b.dataset.k; draw(); }; });
    $("#bGo").onclick = ()=>{
      if(boarded) return;
      const r = B.rows[sel]; tries++;
      if(toMin(r.t) <= now){ toast(LANG === "en" ? "That train has left!" : "那班車已經開走了！"); return; }
      if(!r.ok){ now += 3; sel = -1; draw(); $("#bInfo").innerHTML = sceneHTML(r.why); return; }
      boarded = true; clearInterval(tick); $$("#trip .br").forEach(b=>b.disabled = true);
      TS.train = {type:r.type, no:r.no, arr:r.arr, slow:r.ok === 1};
      spend(r.ok === 1 ? TS.TR.costs.ticketSlow : TS.TR.costs.ticket);
      if(r.ok === 2 && tries === 1) tAdd({kh:1});
      const msg = r.ok === 1 ? [r.why[0] + " I get on anyway.", r.why[1] + "我還是上車了。"] : ["I find my seat: a window seat, of course.", "我找到我的位子：當然是靠窗。"];
      $("#bInfo").innerHTML = sceneHTML(msg);
      $("#bGo").textContent = T("next"); $("#bGo").disabled = false; $("#bGo").onclick = tripRide;
    };
  };
  const tick = setInterval(()=>{
    if(boarded || !$("#trip").classList.contains("on")) return;
    now++; const last = Math.max(...B.rows.filter(r=>r.ok).map(r=>toMin(r.t)));
    if(now > last){ clearInterval(tick); boarded = true;
      TS.train = {type:B.late.type, no:B.late.no, arr:B.late.arr, late:true}; spend(TS.TR.costs.ticket);
      draw(); $("#bInfo").innerHTML = sceneHTML(["I miss the train! I buy a ticket for the 9:00 Tze-Chiang. I drink a coffee and wait.","我錯過火車了！只好買九點那班自強號的票，喝杯咖啡等車。"]);
      $("#bGo").textContent = T("next"); $("#bGo").disabled = false; $("#bGo").onclick = tripRide; return; }
    const c = $("#trip .clock"); if(c) c.textContent = hhmm(now);
    if(B.rows.some(r=>toMin(r.t) === now)) draw();
  }, 2000);
  draw(); tripTop();
}

/* ---------------- 2. the window seat ---------------- */
function drawWindow(cv, t, stop){
  const c = cv.getContext("2d"), W = cv.width, H = cv.height;
  const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#9CC7E0"); g.addColorStop(1,"#E6F0DA"); c.fillStyle = g; c.fillRect(0,0,W,H);
  c.fillStyle = "#B9CFD6"; for(let x=-40;x<W+40;x+=4){ const X = (x + t*.15) % (W+80) - 40; const h = 22 + 12*Math.sin((x+t*.15)*.02); c.fillRect(W - X, 78 - h, 4, h); }
  c.fillStyle = "#7BBF6A"; c.fillRect(0, 78, W, H-78);
  for(let k=0;k<14;k++){ const X = W - ((k*53 + t*1.2) % (W+60)) + 30; c.fillStyle = k%3 ? "#5FA05A" : "#E5D27A"; c.fillRect(X, 86 + (k%4)*6, 34, 4); }
  for(let k=0;k<6;k++){ const X = W - ((k*97 + t*2.4) % (W+80)) + 40; c.fillStyle = "#3E8E5E"; c.fillRect(X, 70, 8, 22); c.fillRect(X-6, 62, 20, 12); }
  for(let k=0;k<10;k++){ const X = W - ((k*41 + t*5) % (W+40)) + 20; c.fillStyle = "#8C8577"; c.fillRect(X, H-26, 4, 26); }
  if(stop){ c.fillStyle = "#E9E4D8"; c.fillRect(0, H-34, W, 34); c.fillStyle = "#2F5D8A"; c.fillRect(W/2-60, 30, 120, 22); c.fillStyle = "#fff"; c.font = "bold 13px monospace"; c.textAlign = "center"; c.fillText(stop.toUpperCase(), W/2, 46); c.textAlign = "left"; }
  c.fillStyle = "#3A3F47"; c.fillRect(0,0,W,6); c.fillRect(0,H-6,W,6); c.fillRect(0,0,6,H); c.fillRect(W-6,0,6,H);
}
function tripRide(){
  const R = TS.TR.ride; let k = 0;
  if(!TS.cards.includes("window")) TS.cards.push("window");
  const step = ()=>{
    cancelAnimationFrame(rideAnim);
    if(k >= R.length) return arriveKhh();
    const st = R[k];
    $("#trip").innerHTML = tripHead(LANG === "en" ? "The window seat" : "靠窗的位子") + `
      <canvas class="win" id="win" width="320" height="150"></canvas>
      <div class="msg" style="margin-top:10px"><div class="from"><span>🔊 ${LANG === "en" ? "Announcement" : "車廂廣播"}</span><button class="ib" style="width:30px;height:30px" data-say="${esc(st.ann)}">${ICON.spk}</button></div><div>${esc(st.ann)}</div><div class="zht">${esc(st.zh)}</div></div>
      <div id="rScene" style="margin-top:8px"></div>`; tripTop();
    Music.ui();
    const cv = $("#win"); let t = k*400, stopAt = performance.now() + 2200;
    const loop = now => { const moving = now < stopAt; if(moving) t += 3; drawWindow(cv, t, moving ? null : st.at); rideAnim = requestAnimationFrame(loop); };
    rideAnim = requestAnimationFrame(loop);
    setTimeout(()=>{ if(!$("#rScene")) return; choiceBlock($("#rScene"), st.scene, st.opts, ()=>{ k++; step(); }); }, 2300);
  };
  step();
}
/* a scene with options; stat checks, costs and gains; then a Next button */
function choiceBlock(box, scene, opts, next){
  box.innerHTML = sceneHTML(scene) + `<div class="choices" style="display:flex;flex-direction:column;gap:8px;margin-top:8px">${opts.map((o,j)=>`<button class="btn alt" data-o="${j}" style="justify-content:flex-start;text-align:left;white-space:normal;flex-wrap:wrap;width:100%">${LANG === "en" ? esc(plain(o.en)) : `<span style="display:block;width:100%">${esc(plain(o.zh))}</span><span style="display:block;width:100%;font-weight:400;opacity:.85">${esc(plain(o.en))}</span>`}${o.cost ? ` <span class="tag">NT$${o.cost}</span>` : ""}${o.stat ? ` <span class="tag">${statName(o.stat)}</span>` : ""}</button>`).join("")}</div>`;
  box.querySelectorAll("[data-o]").forEach(b=> b.onclick = e=>{
    const o = opts[+b.dataset.o]; const ok = o.stat ? rollStat(o.stat) : true;
    if(o.cost) spend(o.cost);
    if(o.g) tAdd(o.g, ok ? 1 : .5);
    if(o.st) TS.stress += o.st;
    if(o.energy) TS.energy += o.energy;
    if(o.min) TS.time += o.min;
    if(o.bike) TS.bike = o.bike;
    if(o.card && !TS.cards.includes(o.card)) TS.cards.push(o.card);
    if(o.h){ TS.h = TS.h || {}; for(const k in o.h) TS.h[k] = (TS.h[k] || 0) + o.h[k]; }
    const res = ok ? o.ok : (o.fail || o.ok);
    box.innerHTML = sceneHTML(scene) + `<div style="margin-top:8px">${sceneHTML(res)}</div>
      ${o.stat ? `<p class="muted" style="font-size:13px">${statName(o.stat)}：${ok ? (LANG === "en" ? "success!" : "成功！") : (LANG === "en" ? "not this time" : "這次差一點")}</p>` : ""}
      <button class="btn" style="width:100%;margin-top:8px" id="cNext">${T("next")}</button>`;
    box.querySelector("#cNext").onclick = next;
    updTripHead();
    reveal(box);
  });
}
function updTripHead(){ const m = $("#trip .top .money"); if(m) m.textContent = `${T("cost")} ${fmt(TS.spent)}`; drawHud(); }

/* ---------------- 3. the island ---------------- */
function arriveKhh(){
  const M = TS.TR.map;
  TS.time = toMin(TS.train.arr) + M.arriveMin;
  TS.energy += M.energyBase + Math.floor(S.st.fi); TS.energy = clamp(TS.energy, 10, 100);
  spend(TS.TR.costs.mrt + M.ferry);
  $("#trip").innerHTML = tripHead("Kaohsiung") + sceneHTML([
    `The train arrives at ${hhmm(toMin(TS.train.arr)).replace(/^0/,"")}. I take the MRT to the harbor and get on the [[ferry|ferry]] to Cijin. The ride is only a few minutes!`,
    `火車 ${hhmm(toMin(TS.train.arr))} 到站。我搭捷運到港邊，坐上往旗津的渡輪，只要幾分鐘！`]) +
    `<p class="muted" style="font-size:14px;margin-top:8px">${LANG === "en" ? `Plan your afternoon: every walk takes time and energy. The sun sets at ${sunsetFor()}. Can you reach the lighthouse in time?` : `規劃妳的下午：每段路都要花時間和體力。日落是 ${sunsetFor()}，妳來得及在日落前爬上燈塔嗎？`}</p>
    <button class="btn" id="aGo" style="width:100%;margin-top:8px">${T("go2")}</button>`; tripTop();
  Music.ui();
  $("#aGo").onclick = mapScreen;
}
function linkCost(a, b, l){
  const M = TS.TR.map, hill = M.nodes[a].hill || M.nodes[b].hill;
  if(TS.bike === "e" && !hill) return {min:Math.round(l[2]*.6), en:Math.max(1, Math.round(l[3]*.4))};
  if(TS.bike === "p" && !hill) return {min:Math.round(l[2]*.7), en:Math.max(1, Math.round(l[3]*.7))};
  return {min:l[2], en:l[3]};
}
function neighbors(){
  const M = TS.TR.map;
  return M.links.filter(l=>l[0] === TS.cur || l[1] === TS.cur).map(l=>{ const to = l[0] === TS.cur ? l[1] : l[0]; return Object.assign({to}, linkCost(TS.cur, to, l)); });
}
function drawMap(cv){
  const M = TS.TR.map, c = cv.getContext("2d"), W = cv.width, H = cv.height;
  const near = new Set(neighbors().map(x=>x.to));
  c.fillStyle = "#5C9CC9"; c.fillRect(0,0,W,H);
  c.fillStyle = "#4E8BB8"; for(let y=8;y<H;y+=16) for(let x=(y/16%2)*10;x<W;x+=24) c.fillRect(x, y, 8, 2);
  /* the mainland (Gushan) to the north-east, across the harbor entrance */
  c.fillStyle = "#9FC98A"; c.beginPath(); c.moveTo(118,0); c.lineTo(W,0); c.lineTo(W,22); c.lineTo(262,12); c.lineTo(214,7); c.lineTo(160,4); c.closePath(); c.fill();
  /* Cijin: Cihou Hill at the north-west tip, then a thin strip running south-east and off the map */
  c.fillStyle = "#E8D9A8"; c.beginPath();
  [[78,10],[104,14],[122,34],[140,66],[178,98],[188,140],[200,196],[256,256],[W,292],[W,H],[244,H],[150,268],[70,214],[44,172],[40,112],[46,60],[58,24]].forEach(([x,y],k)=> k ? c.lineTo(x,y) : c.moveTo(x,y));
  c.closePath(); c.fill();
  c.fillStyle = "#7BBF6A"; c.beginPath(); c.ellipse(66, 62, 32, 34, 0, 0, 7); c.fill();   /* Cihou Hill */
  c.strokeStyle = "#3B3735"; c.lineWidth = 5; c.beginPath(); c.moveTo(44,150); c.lineTo(70,216); c.lineTo(150,270); c.lineTo(244,H); c.stroke();   /* black sand on the west coast */
  /* paths */
  c.strokeStyle = "rgba(43,37,54,.35)"; c.lineWidth = 2; c.setLineDash([4,4]);
  M.links.forEach(l=>{ const a = M.nodes[l[0]], b = M.nodes[l[1]]; c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); });
  /* the ferry from the mainland */
  c.strokeStyle = "#fff"; c.setLineDash([2,3]); c.beginPath(); c.moveTo(M.nodes.pier.x, M.nodes.pier.y); c.lineTo(176, 78); c.lineTo(180, 0); c.stroke();   /* north-north-east, then north to Gushan */ c.setLineDash([]);
  /* places: gold when visited; a dashed ring on the places Mia can walk to from here */
  Object.entries(M.nodes).forEach(([id,n])=>{
    const t = document.createElement("canvas"); drawSprite(t, SPR[n.spr], 2);
    c.fillStyle = TS.visited[id] ? "#F4C542" : "#fff"; c.beginPath(); c.arc(n.x, n.y, 14, 0, 7); c.fill();
    c.drawImage(t, n.x-12, n.y-12);
    if(near.has(id)){ c.strokeStyle = "#fff"; c.lineWidth = 2; c.setLineDash([3,3]); c.beginPath(); c.arc(n.x, n.y, 18, 0, 7); c.stroke(); c.setLineDash([]); }
    if(id === TS.cur){ c.strokeStyle = "#D9534F"; c.lineWidth = 3; c.beginPath(); c.arc(n.x, n.y, 17, 0, 7); c.stroke(); }
  });
  const m = document.createElement("canvas"); drawSprite(m, SPR.mia, 1); const n = M.nodes[TS.cur]; c.drawImage(m, n.x-8, n.y-36, 16, 16);   /* Mia stands just above her spot */
  /* compass and scale: 500 m is about 95 px */
  c.fillStyle = "#fff"; c.font = "bold 12px system-ui, sans-serif"; c.textAlign = "center";
  c.fillText("N", 278, 98); c.beginPath(); c.moveTo(278,74); c.lineTo(272,86); c.lineTo(284,86); c.closePath(); c.fill();
  c.fillRect(12, H-14, 95, 3); c.fillRect(12, H-19, 2, 8); c.fillRect(105, H-19, 2, 8);
  c.textAlign = "left"; c.fillText("500 m", 12, H-22);
}
function drawHud(){
  const h = $("#hud"); if(!h) return;
  const M = TS.TR.map;
  h.innerHTML = `<div class="pv"><b>${hhmm(TS.time)}</b>${T("time")}</div><div class="pv"><b>${Math.max(0, Math.round(TS.energy))}</b>${T("energy")}</div><div class="pv"><b>${sunsetFor()}</b>${LANG === "en" ? "Sunset" : "日落"}</div>`;
}
function mapScreen(){
  const M = TS.TR.map, here = M.nodes[TS.cur];
  if(TS.time >= toMin(M.close)) return nightScene(true);
  /* unvisited places first; places already seen stay fully clickable, so Mia can walk back (2026-10-24) */
  const nb = neighbors().sort((a,b)=>(!!TS.visited[a.to] || a.to === M.start) - (!!TS.visited[b.to] || b.to === M.start));
  const todo = Object.keys(M.visits).filter(id=>!TS.visited[id] && id !== TS.cur);
  /* a place left for later (the lighthouse) can be visited from where Mia stands */
  const here_ = M.visits[TS.cur] && !TS.visited[TS.cur];
  $("#trip").innerHTML = tripHead("Cijin · 旗津") + `<canvas class="map" id="map" width="300" height="350"></canvas>
    <div class="hud" id="hud"></div>
    <h3>${LANG === "en" ? "You are at" : "妳在"}${LANG === "en" ? ": " : "："}${esc(N(here))}</h3>
    ${todo.length ? `<p class="muted" style="font-size:14px;margin:4px 0 0">${LANG === "en" ? "Still to see" : "還沒去"}${LANG === "en" ? ": " : "："}${todo.map(id=>esc(N(M.nodes[id]))).join(LANG === "en" ? ", " : "、")}</p>` : ""}
    ${here_ ? `<button class="btn" id="mHere" style="width:100%;margin-top:8px">${TS.cur === "light" ? (LANG === "en" ? "Go up to the lighthouse" : "上燈塔") : (LANG === "en" ? "Look around here" : "在這裡逛逛")}</button>` : ""}
    <p class="muted" style="font-size:13px;margin:8px 0 0">${LANG === "en" ? "Walk to (you can go back the way you came):" : "可以走去（走過的路也可以往回走）："}</p>
    <div class="nodes">${nb.map(x=>{ const n = M.nodes[x.to], can = TS.energy >= x.en, been = TS.visited[x.to] || x.to === M.start;
      return `<button class="node${been ? " done" : ""}" data-to="${x.to}" ${can ? "" : "disabled"}><span><span class="nm">${esc(N(n))}</span>${been ? ` <span class="tag">${LANG === "en" ? "✓ been there" : "✓ 去過了"}</span>` : ""}${n.hill ? ` <span class="tag">${LANG === "en" ? "hill" : "山路"}</span>` : ""}</span>
        <span class="cost">${x.min} ${LANG === "en" ? "min" : "分"} · ${T("energy")} −${x.en}${can ? "" : (LANG === "en" ? " · too tired" : " · 體力不夠")}</span></button>`; }).join("")}</div>
    <button class="btn alt" id="mEnd" style="width:100%;margin-top:10px">${T("leave")}</button>`; tripTop();
  drawMap($("#map")); drawHud(); Music.ui();
  $$("#trip .node").forEach(b=> b.onclick = ()=>{
    const x = nb.find(y=>y.to === b.dataset.to); TS.time += x.min; TS.energy -= x.en; TS.cur = x.to;
    visit(x.to);
  });
  $("#mEnd").onclick = ()=>askConfirm(T("confirmEnd"), ()=>nightScene(false));
  const mh = $("#mHere"); if(mh) mh.onclick = ()=>visit(TS.cur);
}
function visit(id){
  const M = TS.TR.map, v = M.visits[id];
  if(!v || TS.visited[id]){ return mapScreen(); }
  TS.visited[id] = true;
  if(v.big) return lighthouse();
  TS.time += v.min;
  $("#trip").innerHTML = tripHead("Cijin · " + N(M.nodes[id])) + `<div class="hud" id="hud"></div><div id="vBox"></div>`; tripTop();
  drawHud(); Music.ui();
  choiceBlock($("#vBox"), v.scene, v.opts, mapScreen);
}
function lighthouse(){
  const M = TS.TR.map, B = M.big, sun = toMin(sunsetFor());
  $("#trip").innerHTML = tripHead(N(M.nodes.light)) + `<div class="hud" id="hud"></div><div id="lBox"></div>`; tripTop();
  drawHud(); Music.ui();
  const box = $("#lBox");
  const climb = ()=>{
    TS.time += 15;
    let res, card;
    if(TS.energy < B.need){ res = B.tired; TS.stress += 4; }
    else if(TS.time <= sun){ res = B.win; card = "sunset"; tAdd({sty:1, co:1}); TS.stress -= 10; TS.sunsetOK = true; }
    else { res = B.late; card = "nightlight"; tAdd({kh:.5}); TS.stress -= 5; TS.sunsetOK = false; }
    TS.energy -= 10;
    if(card && !TS.cards.includes(card)) TS.cards.push(card);
    box.innerHTML = sceneHTML(B.climb) + `<div style="margin-top:8px">${sceneHTML(res)}</div><button class="btn" id="lNext" style="width:100%;margin-top:8px">${T("next")}</button>`;
    drawHud(); box.querySelector("#lNext").onclick = mapScreen;
  };
  if(D.wd(TS.date) === 0){
    box.innerHTML = sceneHTML(["The gate is closed. A sign says: “Closed on Mondays.” I look at the sea from the path instead.","大門關著，牌子上寫：「週一休館」。我只好在步道上看海。"]) + `<button class="btn" id="lNext" style="width:100%;margin-top:8px">${T("next")}</button>`;
    box.querySelector("#lNext").onclick = mapScreen; return;
  }
  if(TS.time < sun - 30){
    box.innerHTML = sceneHTML(B.early.map(x=>x.replace("{t}", sunsetFor()))) + `<div class="choices" style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
      <button class="btn alt" id="lWait">${LANG === "en" ? "Sit at the café and wait for sunset (rest, NT$120)" : "在咖啡座坐著等日落（休息，NT$120）"}</button>
      <button class="btn alt" id="lNow">${LANG === "en" ? "Climb to the top now" : "現在就爬上去"}</button>
      <button class="btn alt" id="lLater">${LANG === "en" ? "Come back later" : "等一下再來"}</button></div>`;
    $("#lWait").onclick = ()=>{ TS.energy += Math.round((sun - 25 - TS.time)/10); TS.time = sun - 25; spend(120); climb(); };
    $("#lNow").onclick = climb;
    $("#lLater").onclick = ()=>{ TS.visited.light = false; mapScreen(); };
  } else climb();
}

/* ---------------- 4. a night at the hostel ---------------- */
function nightScene(forced){
  const M = TS.TR.map;
  if(TS.energy < 10) TS.stress += 5;
  spend(M.ferry);   /* the ferry back */
  const st = M.stay, okStay = o => !o.hearts || Object.keys(o.hearts).every(k=>S.hearts[k] >= o.hearts[k]);
  $("#trip").innerHTML = tripHead(LANG === "en" ? "Night in Kaohsiung" : "高雄的夜晚") +
    (forced ? sceneHTML(["It is late. The lighthouse is closing, so I take the ferry back across the harbor.","很晚了，燈塔要關了，我搭渡輪回到對岸。"]) : sceneHTML(["I take the ferry back. The harbor lights shine on the water.","我搭渡輪回去，港口的燈光映在水面上。"])) +
    `<h3 style="margin-top:12px">${esc(LANG === "en" ? st.q[0] : st.q[1])}</h3>
    <div style="display:flex;flex-direction:column;gap:8px">${st.opts.map(o=>`<button class="btn alt" data-stay="${o.id}" style="justify-content:flex-start;text-align:left;white-space:normal" ${okStay(o) ? "" : "disabled"}>${esc(N(o))}${okStay(o) ? "" : `<br><small>${esc(LANG === "en" ? o.why[0] : o.why[1])}</small>`}</button>`).join("")}</div>
    <div id="nBox" style="margin-top:8px"></div>`; tripTop();
  Music.want(STAGE.music.night); Music.ui();
  $$("#trip [data-stay]").forEach(b=> b.onclick = ()=>{
    const o = st.opts.find(x=>x.id === b.dataset.stay); spend(o.cost); TS.stay = o.id;
    $$("#trip [data-stay]").forEach(x=>x.disabled = true); b.classList.add("on");
    const sc = o.id === "hostel" ? M.night : M[o.id];
    choiceBlock($("#nBox"), sc.scene, sc.opts, walkScene);
  });
}

/* ---------------- 5. morning walk with clues ---------------- */
function walkScene(){
  const W = TS.TR.walk; let k = 0;
  Music.want(TS.TR.music);
  const draw = (msg)=>{
    if(k >= W.clues.length){ return tripEnd(); }
    const cl = W.clues[k];
    $("#trip").innerHTML = tripHead("Pier-2 · 駁二") + (k === 0 ? sceneHTML(W.intro) : "") +
      `<h3 style="margin-top:10px">${LANG === "en" ? `Clue ${k+1} of 3` : `線索 ${k+1}／3`}</h3>${sceneHTML(cl.q)}
      <div class="clues" style="margin-top:8px">${W.pics.map(p=>`<button class="clue" data-p="${p.id}"><canvas width="12" height="12" data-spr="${p.spr}" style="background:#EFE8D8"></canvas><div class="cn">${esc(N(p))}</div></button>`).join("")}</div>
      <div id="wMsg" style="margin-top:8px">${msg || ""}</div>`; tripTop();
    paintSprites($("#trip")); Music.ui();
    $$("#trip .clue").forEach(b=> b.onclick = ()=>{
      if(b.dataset.p === cl.a){ b.classList.add("ok"); tAdd({en:.4}); k++; setTimeout(()=>draw(sceneHTML(["Click! Good photo.","喀嚓！拍得好。"])), 450); }
      else { b.classList.add("no"); $("#wMsg").innerHTML = sceneHTML(["Hmm, not this one. Read the clue again.","嗯，不是這個。再讀一次線索。"]); }
    });
  };
  draw();
}
function tripEnd(){
  const W = TS.TR.walk;
  if(!TS.cards.includes("pier2")) TS.cards.push("pier2");
  spend(TS.TR.costs.mrt);   /* the light rail back to Kaohsiung Station */
  spend(TS.train && TS.train.slow ? TS.TR.costs.ticketSlow : TS.TR.costs.ticket);   /* the train home: the same kind as the train down, for now (the choice comes with the high-speed rail) */
  const g = {}; Object.keys(TS.g).forEach(k=>{ g[k] = Math.round(TS.g[k]*10)/10; });
  const line = TS.sunsetOK === true ? "Kaohsiung! Train, ferry, island, and a sunset at the lighthouse."
             : TS.sunsetOK === false ? "Kaohsiung! Train, ferry, island, and the lighthouse at night."
             : "Kaohsiung! Train, ferry, seafood and the sea.";
  const res = {spent:TS.spent, g, stress:Math.round(TS.stress), cards:TS.cards.slice(), line, h:TS.h || {}};
  $("#trip").innerHTML = tripHead(LANG === "en" ? "Home again" : "回家了") + sceneHTML(W.done) + `<div style="margin-top:8px">${sceneHTML(W.home)}</div>
    <h3 style="margin-top:12px">${LANG === "en" ? "Trip results" : "旅行成果"}</h3>
    <div class="ticks" style="display:flex;flex-wrap:wrap;gap:6px 10px;font-size:15px">${ticksHTML({money:-res.spent, stress:res.stress, st:g})}</div>
    <div class="album" style="margin-top:10px">${res.cards.map(c=>`<div class="post"><canvas width="150" height="100" data-card="${c}"></canvas><span class="stamp">${c === "window" ? "TAIPEI → KAOHSIUNG" : "KAOHSIUNG"}</span><div class="pt">${esc(N(TS.TR.cards[c]))}</div></div>`).join("")}</div>
    <button class="btn" id="tDone" style="width:100%;margin-top:12px">${LANG === "en" ? "Back to Taipei" : "回到台北"}</button>`; tripTop();
  $$("#trip canvas[data-card]").forEach(cv=>drawCard(cv, cv.dataset.card)); Music.ui();
  $("#tDone").onclick = ()=>{ const d = TS.done; TS = null; d(res); };
}

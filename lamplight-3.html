<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Lamplight Readers · Level 3</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5EFE3; --card:#FBF7EF; --ink:#2B2536; --muted:#6D6478; --rule:#E2D8C6; --shade:rgba(43,37,54,.06);
  --lv:#5F8A6A; --lv-soft:#D8E7DB; --hl:#F6E3B8; --ok:#4E8A5B; --no:#B5524A; --stamp:#B5524A;
  --f-body:'Literata',Georgia,"PingFang TC","Noto Serif TC","Microsoft JhengHei",serif;
  --f-dot:'Jersey 15',"PingFang TC","Noto Sans TC",sans-serif;
  --f-zh:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --fs:19px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --paper:#1C1A25; --card:#24212F; --ink:#EDE6D6; --muted:#A79FB3; --rule:#383345; --shade:rgba(0,0,0,.25);
    --lv:#93B79B; --lv-soft:#223027; --hl:#4A3B24; --ok:#8CC596; --no:#E08A80; --stamp:#E08A80;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#1C1A25; --card:#24212F; --ink:#EDE6D6; --muted:#A79FB3; --rule:#383345; --shade:rgba(0,0,0,.25);
  --lv:#93B79B; --lv-soft:#223027; --hl:#4A3B24; --ok:#8CC596; --no:#E08A80; --stamp:#E08A80;}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.75;}
button{font:inherit;color:inherit;}
input,textarea,select{font-size:max(16px,1em);}
[hidden]{display:none !important;}
.zh,.zhs{font-family:var(--f-zh);}
.dot{font-family:var(--f-dot);font-weight:400;letter-spacing:.03em;}
svg.px{width:1em;height:1em;image-rendering:pixelated;}

/* ---------- cover ---------- */
#cover{position:fixed;inset:0;z-index:50;background:#141222;color:#F3EBDD;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));overflow:auto;cursor:pointer;}
body:not(.cover) #cover{display:none;}
body.cover{overflow:hidden;}
#cover .stage{width:min(100%,720px);border-radius:14px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.5);line-height:0;}
#cover canvas{width:100%;height:auto;display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
#cover .ck{font-family:var(--f-dot);font-size:15px;letter-spacing:.14em;color:#93B79B;margin:22px 0 4px;text-align:center;}
#cover h1{font-family:var(--f-dot);font-weight:400;font-size:clamp(2.6rem,11vw,4.2rem);line-height:1;margin:0;letter-spacing:.02em;text-align:center;}
#cover .cz{font-family:var(--f-zh);font-size:16px;opacity:.85;margin:8px 0 18px;text-align:center;letter-spacing:.08em;}
#cover .go{font-family:var(--f-dot);font-size:20px;letter-spacing:.06em;background:#93B79B;color:#1C1A25;border:0;border-radius:30px;padding:10px 26px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35);}
#cover .go:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35);}
#cover .cm{font-family:var(--f-dot);font-size:14px;letter-spacing:.1em;opacity:.7;margin-top:14px;}
#cover .cc{font-family:var(--f-zh);font-size:12px;opacity:.5;margin-top:18px;}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);}
.ib{width:42px;height:42px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none;}
.ib:hover{background:var(--shade);}
.ib svg{width:22px;height:22px;fill:currentColor;}
.ib.on{color:var(--lv);}
.brand{font-family:var(--f-dot);font-size:20px;letter-spacing:.04em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.brand small{font-size:15px;color:var(--lv);margin-left:6px;}

main{max-width:42rem;margin:0 auto;padding:18px 18px 90px;}

/* ---------- home ---------- */
.lib{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px 16px 14px;margin:6px 0 22px;position:relative;overflow:hidden;}
.lib:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lv);}
.libh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.libh b{font-family:var(--f-dot);font-weight:400;font-size:22px;letter-spacing:.04em;}
.libh span{font-family:var(--f-zh);font-size:13px;color:var(--muted);}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 10px;}
.st{aspect-ratio:1;border:2px dashed var(--rule);border-radius:50%;display:grid;place-items:center;font-family:var(--f-dot);font-size:18px;color:var(--rule);cursor:pointer;background:none;padding:0;}
.st.on{border:3px double var(--stamp);color:var(--stamp);transform:rotate(-12deg);}
.st.on svg{width:58%;height:58%;}
.st.new{animation:thump .5s cubic-bezier(.2,1.6,.4,1);}
@keyframes thump{0%{transform:scale(2.2) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.libs{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--f-zh);font-size:13.5px;color:var(--muted);}
.libs b{font-family:var(--f-dot);font-weight:400;font-size:20px;color:var(--ink);margin-right:3px;}
.hh{font-family:var(--f-dot);font-weight:400;font-size:22px;letter-spacing:.05em;margin:8px 0 10px;}
.cards{display:grid;gap:10px;}
.card{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;cursor:pointer;}
.card:hover{border-color:var(--lv);}
.ico{width:48px;height:48px;border-radius:10px;background:var(--lv-soft);display:grid;place-items:center;}
.ico svg{width:34px;height:34px;}
.cn{font-family:var(--f-dot);font-size:19px;line-height:1.2;display:block;}
.cz2{font-family:var(--f-zh);font-size:13.5px;color:var(--muted);display:block;line-height:1.5;}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.tag{font-family:var(--f-zh);font-size:11.5px;line-height:1;padding:4px 7px;border-radius:20px;background:var(--shade);color:var(--muted);white-space:nowrap;}
.tag.t{background:var(--lv-soft);color:var(--ink);}
.cr{font-family:var(--f-dot);font-size:14px;color:var(--muted);text-align:right;line-height:1.2;}
.cr .ok{color:var(--stamp);font-size:22px;display:block;}

/* ---------- story ---------- */
.sk{font-family:var(--f-dot);font-size:15px;letter-spacing:.12em;color:var(--lv);margin:4px 0 2px;}
.story h1{font-family:var(--f-dot);font-weight:400;font-size:clamp(2.1rem,8vw,2.9rem);line-height:1.05;margin:0 0 4px;letter-spacing:.02em;}
.story .szt{font-family:var(--f-zh);font-size:17px;color:var(--muted);margin:0 0 10px;letter-spacing:.06em;}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;}
.intro{font-family:var(--f-zh);font-size:15px;line-height:1.85;color:var(--muted);background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin:0 0 16px;}
.by{font-family:var(--f-body);font-style:italic;font-size:14px;color:var(--muted);display:block;margin-top:6px;}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 18px;position:sticky;top:59px;z-index:5;padding:8px 0;background:var(--paper);}
.pb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--card);border-radius:24px;padding:7px 14px;cursor:pointer;font-family:var(--f-zh);font-size:14.5px;line-height:1.2;}
.pb svg{width:16px;height:16px;fill:currentColor;}
.pb.on{background:var(--lv);border-color:var(--lv);color:#fff;}
.pb.sel{border-color:var(--lv);box-shadow:0 0 0 3px var(--lv-soft);}
.pp{position:relative;padding-left:40px;margin:0 0 1.05em;}
.pspk{position:absolute;left:0;top:.2em;width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--muted);}
.pspk svg{width:15px;height:15px;fill:currentColor;}
.pspk.live{background:var(--lv);border-color:var(--lv);color:#fff;}
.pp .en{margin:0;}
.pp .en .t{border-radius:4px;transition:background .25s;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 2px;margin:0 -2px;}
.pp.speaking .en .t{background:var(--hl);}
.pp .zh{margin:.35em 0 0;font-size:.8em;line-height:1.8;color:var(--muted);display:none;}
body.showzh .pp .zh{display:block;}
.g{cursor:pointer;border-bottom:2px dotted var(--lv);}
.g.cu{border-bottom-style:dashed;border-bottom-color:var(--muted);}
.g:focus-visible{outline:2px solid var(--lv);outline-offset:2px;}
.flash{animation:flash 1.8s ease;}
@keyframes flash{0%,40%{background:var(--hl)}100%{background:transparent}}
.end{text-align:center;font-family:var(--f-dot);font-size:22px;letter-spacing:.2em;color:var(--lv);margin:28px 0 20px;}
.box{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px;margin:0 0 18px;}
.bh{font-family:var(--f-dot);font-size:20px;letter-spacing:.04em;margin:0;}
.bz{font-family:var(--f-zh);font-size:13px;color:var(--muted);margin:0 0 10px;}
.q{margin:14px 0 0;}
.qt{margin:0 0 6px;font-weight:600;font-size:.95em;}
.qo{display:grid;gap:6px;}
.qo button{text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:.9em;line-height:1.45;}
.qo button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper));}
.qo button.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--paper));text-decoration:line-through;}
.qx{font-family:var(--f-zh);font-size:14px;line-height:1.75;margin:6px 0 0;color:var(--muted);}
.qx b{color:var(--ink);}
.done{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.bigst{font-family:var(--f-dot);font-size:21px;letter-spacing:.05em;background:var(--lv);color:#fff;border:0;border-radius:30px;padding:10px 24px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18);}
.bigst[disabled]{background:transparent;color:var(--stamp);box-shadow:none;border:3px double var(--stamp);transform:rotate(-3deg);cursor:default;}
.done small{font-family:var(--f-zh);font-size:13px;color:var(--muted);}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px;}
.nav button{flex:1;max-width:48%;border:1px solid var(--rule);background:var(--card);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;line-height:1.3;}
.nav button:last-child{text-align:right;margin-left:auto;}
.nav small{display:block;font-family:var(--f-zh);font-size:12px;color:var(--muted);}
.nav span{font-family:var(--f-dot);font-size:17px;}

/* ---------- popover ---------- */
#pop{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);transition:transform .25s ease;display:flex;justify-content:center;pointer-events:none;}
#pop.on{transform:none;}
#pop .in{pointer-events:auto;width:min(100%,40rem);background:var(--card);border:1px solid var(--rule);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);padding:16px 18px max(18px,env(safe-area-inset-bottom));max-height:60vh;overflow:auto;}
.ph{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;position:relative;padding-right:140px;min-height:42px;}
.pw{font-family:var(--f-body);font-weight:600;font-size:1.3em;}
.pk{font-family:"Lucida Sans Unicode","Arial Unicode MS",var(--f-body);color:var(--muted);font-size:.95em;}
.lvb{font-family:var(--f-dot);font-size:14px;padding:1px 8px;border-radius:12px;background:var(--shade);color:var(--muted);}
.lvb.hi{background:var(--lv-soft);color:var(--ink);}
.px2{position:absolute;right:-6px;top:-4px;display:flex;gap:2px;}
.pz{font-family:var(--f-zh);font-size:17px;margin:6px 0 2px;}
.pd{font-family:var(--f-zh);font-size:14.5px;line-height:1.8;color:var(--muted);margin:0;}
.pn{font-family:var(--f-zh);font-size:12.5px;color:var(--muted);margin:8px 0 0;}
.star svg{width:22px;height:22px;}
.star.on{color:#D9A21B;}

/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(15,10,25,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;}
#scrim.on{opacity:1;pointer-events:auto;}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(92vw,26rem);z-index:35;background:var(--paper);border-right:1px solid var(--rule);transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column;}
#drawer.on{transform:none;}
.dtop{display:flex;align-items:center;gap:6px;padding:10px 10px 0;padding-top:max(10px,env(safe-area-inset-top));}
.dtop b{font-family:var(--f-dot);font-weight:400;font-size:20px;flex:1;}
.tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--rule);overflow-x:auto;}
.tabs button{border:0;background:transparent;border-radius:20px;padding:6px 12px;cursor:pointer;font-family:var(--f-zh);font-size:14px;white-space:nowrap;}
.tabs button.on{background:var(--lv);color:#fff;}
.pane{flex:1;overflow:auto;padding:14px 14px max(30px,env(safe-area-inset-bottom));font-size:16px;}
.toc a{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-radius:10px;color:inherit;text-decoration:none;cursor:pointer;}
.toc a:hover,.toc a.cur{background:var(--shade);}
.toc svg{width:28px;height:28px;}
.toc .n{font-family:var(--f-dot);font-size:17px;line-height:1.2;}
.toc .z{font-family:var(--f-zh);font-size:12.5px;color:var(--muted);display:block;}
.toc .ok{color:var(--stamp);font-family:var(--f-dot);}
.sbox{width:100%;border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:10px 12px;color:var(--ink);font-family:var(--f-body);}
.res{margin-top:12px;display:grid;gap:8px;}
.res a{display:block;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;cursor:pointer;color:inherit;text-decoration:none;font-size:15px;line-height:1.55;}
.res small{display:block;font-family:var(--f-dot);font-size:13px;color:var(--lv);letter-spacing:.06em;}
.res mark{background:var(--hl);color:inherit;border-radius:3px;}
.hint{font-family:var(--f-zh);font-size:13.5px;color:var(--muted);line-height:1.75;}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px;}
.seg button{border:1px solid var(--rule);background:var(--card);border-radius:20px;padding:6px 13px;cursor:pointer;font-family:var(--f-zh);font-size:14px;}
.seg button.on{border-color:var(--lv);box-shadow:0 0 0 3px var(--lv-soft);}
.lab{font-family:var(--f-zh);font-size:14px;font-weight:600;margin:0;}
select.sbox{appearance:auto;}
.wl{display:grid;gap:4px;}
.wl h4{font-family:var(--f-dot);font-weight:400;font-size:16px;color:var(--lv);margin:12px 0 2px;letter-spacing:.04em;}
.wl a{display:flex;gap:8px;align-items:baseline;padding:5px 6px;border-radius:8px;cursor:pointer;color:inherit;text-decoration:none;}
.wl a:hover{background:var(--shade);}
.wl a b{font-weight:600;}
.wl a span{font-family:var(--f-zh);font-size:13.5px;color:var(--muted);}
.wl a i{margin-left:auto;font-style:normal;color:#D9A21B;}
.about p{font-family:var(--f-zh);font-size:14.5px;line-height:1.85;margin:0 0 12px;}
.about .big{font-family:var(--f-dot);font-size:26px;line-height:1.1;margin:4px 0 2px;}
.about .mot{font-family:var(--f-body);font-style:italic;color:var(--muted);margin:0 0 14px;}
.about ul{font-family:var(--f-zh);font-size:14px;line-height:1.8;padding-left:1.2em;margin:0 0 12px;}
.danger{border:1px solid var(--no);color:var(--no);background:transparent;border-radius:20px;padding:6px 14px;cursor:pointer;font-family:var(--f-zh);font-size:14px;}

/* ---------- music panel ---------- */
#mp{position:fixed;top:62px;right:10px;z-index:25;width:min(92vw,20rem);background:var(--card);border:1px solid var(--rule);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:12px;}
.trk{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:12px;padding:8px;cursor:pointer;}
.trk:hover{background:var(--shade);}
.trk .pl{width:34px;height:34px;border-radius:50%;background:var(--lv);color:#fff;display:grid;place-items:center;font-size:13px;}
.trk.on{border-color:var(--lv);}
.trk.on .pl{background:var(--ink);color:var(--paper);}
.trk .tn{font-family:var(--f-dot);font-size:17px;display:block;line-height:1.2;}
.trk .tz{font-family:var(--f-zh);font-size:12.5px;color:var(--muted);display:block;}
.vol{display:flex;align-items:center;gap:10px;margin:8px 4px 2px;font-family:var(--f-zh);font-size:13px;color:var(--muted);}
.vol input{flex:1;accent-color:var(--lv);}

#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;transition:all .25s;z-index:60;background:var(--ink);color:var(--paper);font-family:var(--f-zh);font-size:14.5px;padding:10px 16px;border-radius:24px;max-width:90vw;text-align:center;pointer-events:none;}
#toast.on{opacity:1;transform:translate(-50%,0);}
@media (max-width:480px){ .cr{display:none} .card{grid-template-columns:44px 1fr} .ico{width:44px;height:44px} main{padding:14px 16px 90px} }
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important;} }
</style>
</head>
<body>


<div id="cover" role="button" tabindex="0" aria-label="開始">
  <div class="stage"><canvas id="cv" width="320" height="180" aria-label="夜晚的書桌：窗外下著雨，檯燈亮著，桌上有打開的書和一杯冒著熱氣的茶"></canvas></div>
  <p class="ck" id="cvK"></p>
  <h1>Lamplight Readers</h1>
  <p class="cz" id="cvZ"></p>
  <button class="go" id="goBtn">Open the book 開始閱讀</button>
  <p class="cm" id="coverMusic">♪ TAP ANYWHERE FOR MUSIC</p>
  <p class="cc">© 2026 Wen-Hung Fang. All rights reserved.</p>
</div>

<header class="bar">
  <button class="ib" id="menuBtn" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
  <div class="brand" id="brand" role="button" tabindex="0">Lamplight <small id="brandLv"></small></div>
  <button class="ib" id="musicBtn" aria-label="音樂"><svg viewBox="0 0 24 24"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></button>
  <button class="ib" id="setBtn" aria-label="設定"><svg viewBox="0 0 24 24"><path d="M9.2 5h2.1l4.6 13h-2.2l-1.1-3.3H7.8L6.7 18H4.6L9.2 5zm-.8 7.9h3.9L10.3 7l-1.9 5.9zM17 11h1.6l2.9 7h-1.7l-.6-1.6h-2.8l-.6 1.6h-1.7l2.9-7zm-.1 4.1h1.9l-.9-2.6-1 2.6z"/></svg></button>
</header>

<div id="mp" hidden>
  <div id="tracks"></div>
  <div class="vol"><span>音量</span><input type="range" id="vol" min="0" max="100" aria-label="音量"><button class="pb" id="mStop">停止</button></div>
</div>

<main id="main"></main>

{ id:"carbuncle", thread:"", kind:"classic", title:"The Blue Carbuncle", zt:"藍寶石案", voice:"m",
  by:"Arthur Conan Doyle, 1892 · retold",
  intro:"聖誕節剛過，福爾摩斯的桌上放著一頂破帽子。帽子的主人是誰？為什麼一隻聖誕節的鵝肚子裡，會有一顆價值連城的藍寶石？",
  paras:[
    ["Two days after Christmas, I went to see my friend [[Sherlock Holmes|c:n-holmes]] at [[221B Baker Street|c:n-baker]]. He was sitting by the fire in a purple [[dressing gown]], and he was staring at an old black hat. It hung on the back of a chair. It was dirty, cracked and very ugly.",
     "聖誕節過後兩天，我到貝克街 221B 號去找我的朋友福爾摩斯。他穿著紫色的睡袍坐在火爐旁，盯著一頂舊黑帽。帽子掛在椅背上，又髒、又破、又醜。","calm"],
    ["“A [[clue]]?” I asked. “A [[puzzle]],” said Holmes. “Peterson the [[porter]] brought it to me. At four o’clock on Christmas morning, he was walking home when he saw a tall man in front of him with a white goose over his shoulder. Some young men started a fight with the tall man. He lifted his stick to protect himself and broke a shop window behind him. Peterson ran to help — but the man saw Peterson’s [[uniform]], thought he was a policeman, dropped the goose and ran. The young men ran too.”",
     "「線索嗎？」我問。「是個謎題，」福爾摩斯說，「門房彼得森拿來給我的。聖誕節凌晨四點，他走路回家，看到前面有個高個子男人，肩上扛著一隻白鵝。幾個年輕人跟那個高個子打了起來。他舉起手杖自衛，結果打破了身後一家店的櫥窗。彼得森跑過去幫忙——可是那人看到彼得森的制服，以為他是警察，丟下鵝就跑了。那群年輕人也跑了。」","informative"],
    ["“So Peterson had a hat and a Christmas goose,” Holmes went on. “A small card on the goose’s leg said ‘For Mrs. Henry Baker,’ and the letters H.B. are inside the hat. But there are hundreds of Henry Bakers in London. The goose would not stay fresh, so Peterson took it home to cook. The hat stayed with me.”",
     "「所以彼得森得到了一頂帽子和一隻聖誕鵝，」福爾摩斯接著說，「鵝腳上綁著一張小卡片，寫著『給亨利．貝克太太』，帽子裡面也有 H.B. 兩個字母。可是倫敦有幾百個亨利．貝克。鵝放不久，所以彼得森帶回家煮了。帽子就留在我這裡。」","calm"],
    ["He picked up the hat and turned it in his hands. “This hat cost a lot of money, but it is three years old. So its owner had money once, but he does not have it now. And nobody has brushed this hat for weeks. I think his wife has stopped [[caring|care]] for him.” I laughed. “Holmes, you can’t know that from a hat!”",
     "他拿起帽子在手裡轉了轉。「這頂帽子很貴，可是已經戴了三年。所以帽子的主人以前有錢，現在沒有了。而且這頂帽子好幾個星期沒人刷過。我想，他太太已經不再照顧他了。」我笑了。「福爾摩斯，你不可能從一頂帽子看出這些！」","amused"],
    ["Just then the door flew open, and Peterson ran in, red in the face. “Mr. Holmes! The goose! Look what my wife found inside it!” In his open hand lay a small blue stone. It was brighter than any star. Holmes whistled. “Peterson, that is the blue [[carbuncle]] of the Countess of [[Morcar|c:n-morcar]]. Somebody stole it five days ago from the Hotel Cosmopolitan. The police have [[arrested|arrest]] a [[plumber]] called John Horner, and there is a [[reward]] of one thousand pounds.”",
     "就在這時，門被猛地推開，彼得森滿臉通紅地衝進來。「福爾摩斯先生！那隻鵝！你看我太太在鵝肚子裡發現了什麼！」他攤開的手掌上，躺著一顆小小的藍色寶石，比任何星星都亮。福爾摩斯吹了聲口哨。「彼得森，那是莫卡伯爵夫人的藍寶石。五天前在大都會飯店被偷了。警察已經逮捕了一個叫約翰．霍納的水管工人，懸賞金額是一千英鎊。」","excited"],
    ["Holmes put an [[advertisement]] in all the evening newspapers: “Found: a goose and a black hat. Mr. Henry Baker can have them at 6:30 this evening at 221B Baker Street.” At exactly 6:30, a large, tired man with a gray beard knocked on the door. He was polite and a little sad. “We ate your goose,” Holmes told him, “but here is another one, just as fat.” Mr. Baker was [[delighted]]. He didn’t ask about the first goose at all. Holmes looked at me. This man knew nothing about any stone.",
     "福爾摩斯在所有晚報上登了一則廣告：「尋獲：鵝一隻、黑帽一頂。亨利．貝克先生可於今晚六點半到貝克街 221B 號領回。」六點半整，一個留著灰鬍子、又高又疲倦的男人來敲門。他很有禮貌，看起來有點憂傷。「您的鵝被我們吃掉了，」福爾摩斯告訴他，「不過這裡有另一隻，一樣肥。」貝克先生高興極了，完全沒問起第一隻鵝。福爾摩斯看了我一眼：這個人對寶石一無所知。","amused"],
    ["Mr. Baker told us that he bought the goose from a goose club at the Alpha Inn, a small pub near the British Museum. So that night, in the cold, Holmes and I walked to the Alpha. The owner said he bought his geese from a man called Breckinridge, who sold birds at [[Covent Garden|c:n-covent]] market.",
     "貝克先生告訴我們，他的鵝是在阿爾法酒館的「鵝會」買的，那是大英博物館附近的一間小酒館。所以那天晚上，我和福爾摩斯冒著寒風走到阿爾法酒館。老闆說，他的鵝是向一個叫布萊肯里奇的人買的，那人在柯芬園市場賣家禽。","calm"],
    ["Breckinridge was closing his [[stall]]. When Holmes asked where his geese came from, he became angry. “Everyone is asking me about those geese!” he shouted. Holmes smiled. “Then let’s make a bet. I say they came from the countryside.” Breckinridge loved to win. He opened his little book and pointed. “Wrong! They came from Mrs. Oakshott, Brixton Road. Pay up!” Holmes paid him a pound and walked away, laughing quietly.",
     "布萊肯里奇正在收攤。福爾摩斯一問他的鵝是從哪裡來的，他就生氣了。「每個人都在問那些鵝！」他大吼。福爾摩斯笑了。「那我們來打個賭。我說牠們是從鄉下來的。」布萊肯里奇最愛贏了。他打開他的小本子一指。「錯！牠們是布里斯頓路的奧克修特太太賣的。付錢吧！」福爾摩斯付了他一英鎊，一邊悄悄地笑，一邊走開了。","playful"],
    ["Behind us, a small, pale man ran up to the stall. “Please,” he said, “I need to know about the geese from Mrs. Oakshott.” Holmes turned around. “I can help you. You are looking for one of Mrs. Oakshott’s geese — the one that went to the Alpha Inn.” The little man’s face went gray. His name was James [[Ryder|c:n-ryder]], and he worked at the Hotel Cosmopolitan.",
     "我們身後，一個瘦小、臉色蒼白的男人跑到攤位前。「拜託，」他說，「我想知道奧克修特太太送來的那些鵝。」福爾摩斯轉過身。「我可以幫你。你在找一隻尾巴上有一道黑紋的白鵝。」那個小個子的臉一下子變得灰白。他叫詹姆斯．萊德，在大都會飯店上班。","nervous"],
    ["Back at Baker Street, Ryder told us everything. He stole the stone from the Countess’s room and made sure the police [[blamed|blame]] Horner, who fixed a pipe there that day. Then he was afraid the police would search him. So he went to his sister, Mrs. Oakshott, who kept geese. She had promised him a goose for Christmas. In the yard, he caught a white goose with a black tail and pushed the stone down its [[throat]]. But there were two geese like that. He took the wrong one home. The right one went to the market, then to the Alpha Inn, then to Henry Baker.",
     "回到貝克街，萊德把一切都招了。他從伯爵夫人的房間偷了寶石，還設法讓警察懷疑那天來修水管的霍納。之後他怕警察搜他的身，就跑去找養鵝的姊姊奧克修特太太。姊姊答應過要送他一隻聖誕鵝。他在院子裡抓了一隻黑尾巴的白鵝，把寶石塞進牠的喉嚨。可是那樣的鵝有兩隻，他帶錯了一隻回家。對的那隻被送到市場，再送到阿爾法酒館，最後到了亨利．貝克手上。","sad"],
    ["Ryder fell on his knees and cried. Holmes was silent for a long time. Then he opened the door. “Get out,” he said. Ryder ran down the stairs and into the night. “Holmes!” I said. Holmes lit his pipe. “Horner will go free, because without Ryder there is no case. Ryder is too frightened to steal again. If I send him to [[prison]] now, he will be a criminal for the rest of his life. Besides, [[Watson|c:n-watson]], it is the season of [[forgiveness]].” He smiled. “Now, ring the bell. Tonight we begin another investigation. It is also about a bird. It is called dinner.”",
     "萊德跪在地上哭了起來。福爾摩斯沉默了很久，然後打開門。「出去。」他說。萊德衝下樓梯，消失在夜色裡。「福爾摩斯！」我說。福爾摩斯點起菸斗。「霍納會被放出來，因為沒有萊德，這案子就不成立。萊德嚇成那樣，不敢再偷了。如果我現在送他去坐牢，他這輩子都會是個罪犯。再說，華生，現在是寬恕的季節。」他笑了。「好了，按鈴吧。今晚我們要展開另一項調查，主角也是一隻鳥。它叫做晚餐。」","warm"]
  ],
  quiz:[
    ["How did the blue stone get inside the goose?", ["Ryder pushed it down the goose’s throat.","Mr. Baker hid it there.","The goose found it on the street."], 0, "萊德怕被搜身，把寶石塞進鵝的喉嚨，卻帶錯了鵝。"],
    ["How did Holmes get Breckinridge to tell him where the geese came from?", ["He paid him a lot of money.","He made a bet with him.","He called the police."], 1, "布萊肯里奇愛賭又愛贏，福爾摩斯故意打賭說錯，對方就拿出帳本證明。"],
    ["Why did Holmes let Ryder go?", ["Ryder paid him.","He felt prison would make Ryder a criminal for life.","He thought Ryder was innocent."], 1, "他認為萊德不敢再犯，坐牢反而會毀了他；而且霍納沒有萊德也會被放出來。"]
  ]
},

{ id:"canterville", thread:"", kind:"classic", title:"The Canterville Ghost", zt:"坎特維爾的鬼", voice:"f",
  by:"Oscar Wilde, 1887 · retold",
  intro:"王爾德的幽默名作。一戶美國人家買下了一座「鬧鬼」的英國古堡。問題是，這家人一點都不怕鬼，反而是鬼快要被他們逼瘋了。",
  paras:[
    ["When Mr. Hiram B. Otis, an American [[diplomat]], bought [[Canterville Chase|c:n-canterville]], everyone told him he was making a mistake. The old house had a ghost. Lord Canterville himself said so. “My great-aunt saw two [[skeleton]] hands on her shoulders while she was dressing for dinner,” he said. “She never really [[recovered|recover]].”",
     "美國外交官海勒姆．奧蒂斯先生買下坎特維爾莊園時，大家都說他犯了個錯：那棟老房子鬧鬼。坎特維爾勳爵自己就這麼說。「我的姑婆在換衣服準備吃晚餐時，看到兩隻骷髏手搭在她肩上，」他說，「她從此就沒有真正恢復過來。」","deadpan"],
    ["“I come from a modern country,” said Mr. Otis. “If there were a ghost in Europe, we would have it in a museum in America by now. I will take the house, and the ghost.” So the Otis family moved in: Mr. and Mrs. Otis; their son, Washington; their fifteen-year-old daughter, Virginia; and the twins, two small boys who never stopped making trouble.",
     "「我來自一個現代化的國家，」奧蒂斯先生說，「如果歐洲真的有鬼，我們早就把它放進美國的博物館了。房子我買了，鬼我也一起收下。」於是奧蒂斯一家搬了進去：奧蒂斯夫婦、兒子華盛頓、十五歲的女兒維吉尼亞，還有一對永遠在搗蛋的雙胞胎小男孩。","proud"],
    ["On the first evening, Mrs. Otis noticed a red [[stain]] on the library floor. The old [[housekeeper]] went pale. “That is blood,” she whispered. “Lady Eleanor de Canterville died on that spot in 1575. Her husband, Sir Simon, killed her. Since his death, his ghost has walked the house. The stain cannot be removed.” “[[Nonsense|nonsense]],” said Washington. He took out a small bottle of Pinkerton’s Champion Stain Remover and cleaned it in ten seconds.",
     "第一天晚上，奧蒂斯太太注意到書房地板上有一塊紅色污漬。老管家臉色發白。「那是血，」她小聲說，「1575 年，埃莉諾．德．坎特維爾夫人就死在那個地方，是她丈夫西蒙爵士殺了她。他死後，他的鬼魂就一直在屋裡遊蕩。那塊污漬是擦不掉的。」「胡說，」華盛頓說。他拿出一小瓶「品克頓冠軍去漬劑」，十秒鐘就擦乾淨了。","amused"],
    ["The next morning, the stain was back. Washington cleaned it again. It came back again. Every morning, it was a slightly different color — once it was bright green. “The ghost must be using paint,” said the twins, and they were right.",
     "隔天早上，污漬又出現了。華盛頓又擦掉了，它又回來了。每天早上，它的顏色都有點不一樣——有一次甚至是亮綠色的。「那個鬼一定是在用油漆。」雙胞胎說。他們說對了。","playful"],
    ["At one o’clock one night, Mr. Otis woke up to a terrible sound: heavy [[chains|chain]], coming down the hall. He put on his slippers, opened the door, and found an old man with burning red eyes, long gray hair and heavy, [[rusty]] chains on his wrists. Mr. Otis held out a small bottle. “My dear sir,” he said politely, “your chains really need oil. Please try this. It’s very good. I’ll leave it on the table for you.” Then he went back to bed.",
     "某天夜裡一點，奧蒂斯先生被一陣可怕的聲音吵醒：沉重的鐵鍊聲，正沿著走廊過來。他穿上拖鞋，打開門，看到一個老人，眼睛紅得像在燒，留著灰色長髮，手腕上掛著生鏽的沉重鐵鍊。奧蒂斯先生遞出一個小瓶子。「親愛的先生，」他很有禮貌地說，「您的鐵鍊真的需要上油了。請試試這個，很好用。我放在桌上給您。」然後他就回去睡覺了。","deadpan"],
    ["The ghost, Sir Simon de Canterville, was [[furious]]. For three hundred years he had frightened kings, ladies and soldiers. He had a whole list of famous [[performances|performance]]. Now these Americans offered him oil. He threw the bottle on the floor and went to his room to think about his next show.",
     "那個鬼，西蒙．德．坎特維爾爵士，氣炸了。三百年來，他嚇過國王、貴婦和軍人，還有一長串引以為傲的經典演出。現在這群美國人居然拿油給他。他把瓶子摔在地上，回到自己的房間，構思下一場表演。","annoyed"],
    ["Then Mrs. Otis heard his famous midnight laugh, the one that had once turned a bishop’s hair white. She opened her door and said kindly, “I’m afraid you are not well. Here is a bottle of Dr. Dobell’s medicine. It is very good for stomach problems.” The ghost stared at her in horror. He began to turn himself into a large black dog — but then he heard the twins coming, and he simply disappeared, with a low, unhappy groan.",
     "後來，奧蒂斯太太聽到了他有名的半夜狂笑，據說那笑聲曾經讓一位主教一夜白頭。她打開房門，親切地說：「您恐怕身體不太舒服。這裡有一瓶杜貝爾醫生的藥，治腸胃毛病很有效。」鬼驚恐地瞪著她。他正要把自己變成一隻大黑狗——可是一聽到雙胞胎的腳步聲，他就直接消失了，只留下一聲低沉、不開心的呻吟。","amused"],
    ["But the family was always one step ahead. When he dressed as a headless knight, the twins hit him with peas from their toy guns. When he planned his greatest role, “The Silent Corpse,” the twins put a [[bucket]] of water on top of a door, and it fell on his head. The poor ghost caught a bad cold and stayed in bed for a week. Then, one night, he met a terrible ghost in the hall, with a white sheet and a [[turnip]] for a head. He screamed and ran. In the morning he found a note on it: the twins had made it.",
     "可是這家人總是比他快一步。他扮成無頭騎士時，雙胞胎用玩具槍拿豌豆射他。他準備演出他最偉大的角色「沉默的屍體」時，雙胞胎在門頂上放了一桶水，整桶倒在他頭上。可憐的鬼得了重感冒，在床上躺了一個星期。後來有一天晚上，他在走廊上遇到一個可怕的鬼，披著白床單，頭是一顆蕪菁。他尖叫著逃走。隔天早上他發現上面有一張紙條：是雙胞胎做的。","amused"],
    ["After that, he stayed in his room for weeks. He came out only late at night to fix the stain, and he wore soft slippers so that nobody could hear him. The great ghost of Canterville, who had frightened kings, was now afraid of two little boys.",
     "從那以後，他好幾個星期都躲在房間裡，只在深夜出來補那塊污漬，而且穿著軟拖鞋，免得被人聽見。那位曾經嚇壞國王的坎特維爾大鬼，現在竟然怕起兩個小男孩了。","sad"],
    ["Only Virginia did not laugh at him. One afternoon she found him sitting by a window, looking very old and very tired. “I’m sorry for you,” she said. “But you were very [[wicked]]. And you stole my paints for that silly stain.” “I had to,” he said sadly. “Real blood is so hard to get these days.” Then he told her the truth. He had not slept for three hundred years. He wanted to rest.",
     "只有維吉尼亞沒有笑他。某天下午，她發現他坐在窗邊，看起來又老又累。「我替你難過，」她說，「可是你以前真的很壞。而且你為了那塊無聊的污漬，偷了我的顏料。」「我不得不這樣，」他難過地說，「這年頭要弄到真的血太難了。」接著他把真相告訴她：他已經三百年沒睡過覺了。他想要休息。","tender"],
    ["“Far away, beyond the pine woods, there is a little garden,” he said. “The grass is long and deep, and the night bird sings all night. It is the Garden of Death. To sleep there, I need someone to cry for me, because I have no tears, and to [[pray]] for me, because I have no faith. Will you help me?” Virginia was afraid. But she was also kind. She stood up and took his cold hand.",
     "「在遙遠的松樹林那頭，有一座小花園，」他說，「那裡的草又長又深，夜鶯整晚都在唱歌。那是死亡之園。要在那裡安睡，我需要有人為我哭泣，因為我沒有眼淚；需要有人為我祈禱，因為我沒有信仰。妳願意幫我嗎？」維吉尼亞很害怕，可是她也很善良。她站起來，握住他冰冷的手。","gentle"],
    ["The wall opened, and they walked into the dark together. Virginia was gone for hours. The family searched the house and the park until midnight. Then the wall opened again, and she stepped out, pale and calm, holding a small box of beautiful old [[jewels|jewel]]. “He has gone to sleep at last,” she said. “He gave me these to say thank you.”",
     "牆壁打開了，他們一起走進黑暗裡。維吉尼亞消失了好幾個小時。全家人在屋裡和園子裡找到半夜。後來牆又打開了，她走了出來，臉色蒼白但很平靜，手裡捧著一小盒美麗的古老珠寶。「他終於睡著了，」她說，「他送我這些，向我道謝。」","calm"],
    ["Four nights later, the family [[buried|bury]] Sir Simon’s old bones under a tree in the corner of the churchyard. Virginia put a cross of white flowers on the [[grave]]. Years later, after she married a young duke, he asked her what happened in the dark that night. She only smiled. “He made me see what life is,” she said, “and what death means, and why love is stronger than both.”",
     "四天後的晚上，一家人把西蒙爵士的骨骸葬在墓園角落的一棵樹下。維吉尼亞在墳上放了一個白花做的十字架。多年以後，她嫁給了一位年輕的公爵。公爵問她那天晚上在黑暗中到底發生了什麼事。她只是微笑。「他讓我明白了生命是什麼，」她說，「死亡又代表什麼，還有為什麼愛比兩者都強大。」","tender"]
  ],
  quiz:[
    ["How does Mr. Otis react when he meets the ghost?", ["He screams and runs.","He offers him oil for his chains.","He calls a priest."], 1, "他很有禮貌地請鬼試試潤滑油，然後回去睡覺。"],
    ["Who makes the turnip-head “ghost” in the hall?", ["Washington","The twins","Virginia"], 1, "隔天早上鬼發現紙條，是雙胞胎做的。"],
    ["What does the ghost need from Virginia?", ["Her paints","Someone to cry and pray for him","A new chain"], 1, "他沒有眼淚、沒有信仰，需要有人替他哭泣和祈禱，才能在死亡之園安睡。"]
  ]
},

{ id:"banknote", thread:"", kind:"classic", title:"The £1,000,000 Bank-Note", zt:"百萬英鎊", voice:"m",
  by:"Mark Twain, 1893 · retold",
  intro:"馬克．吐溫的經典諷刺故事。一個身無分文的美國年輕人，在倫敦拿到一張一百萬英鎊的鈔票。問題是，這張鈔票大到根本沒有人找得開。",
  paras:[
    ["My name is Henry Adams. When I was twenty-seven, I worked for a mining company in San Francisco. One Saturday I took a little boat out on the bay, went too far, and a ship picked me up. The ship was going to London. I worked on it for my ticket, and I arrived in London with my clothes in [[rags]] and one dollar in my pocket.",
     "我叫亨利．亞當斯。我二十七歲那年，在舊金山一家礦業公司上班。某個星期六，我划著小船到海灣上，划得太遠了，結果被一艘大船救起來。那艘船正要開往倫敦。我在船上做工抵船票，抵達倫敦時，衣服破破爛爛，口袋裡只剩一美元。","calm"],
    ["The dollar lasted one day. On the second day I was so hungry that I watched a child throw away a [[pear]] with one bite out of it, and I wanted it more than anything in the world. I was just reaching for it when a window opened above me. A gentleman called, “Please, step in here.”",
     "那一美元只撐了一天。第二天我餓到看著一個小孩把咬了一口的梨子丟掉，就覺得那是全世界我最想要的東西。我才剛伸手要去撿，頭上的一扇窗就打開了。一位紳士喊道：「請進來一下。」","sad"],
    ["Inside sat two rich old brothers. I didn’t know it then, but they had made a [[bet]]. The older brother said that a stranger with nothing but a million-pound bank-note would [[starve]] in thirty days, because nobody could change such a note. The younger brother said he would not starve. They needed an honest man to test it. They chose me.",
     "屋裡坐著兩位有錢的老兄弟。我當時不知道，他們打了一個賭。哥哥說，一個陌生人如果身上只有一張一百萬英鎊的鈔票，三十天內一定會餓死，因為沒有人找得開這麼大的鈔票。弟弟說他不會餓死。他們需要一個老實人來試試看，於是選中了我。","informative"],
    ["They gave me an [[envelope]] and said, “Don’t open it here. Come back in thirty days.” I ran to the nearest cheap restaurant, ate until I could eat no more, and then opened the envelope to pay. Inside was a bank-note for one million pounds. I nearly [[fainted|faint]].",
     "他們給了我一個信封，說：「不要在這裡打開。三十天後再回來。」我衝到最近的一家便宜餐館，吃到再也吃不下，然後打開信封準備付錢。裡面是一張一百萬英鎊的鈔票。我差點昏過去。","surprised"],
    ["I gave it to the owner. He looked at it, went white, and bowed. “I’m so sorry, sir, I can’t change it. Please, pay me any time. Any time at all.” I walked out without paying a penny. The same thing happened at the [[tailor]]’s shop. The tailor first gave me a cheap, ugly suit because of my rags. Then he saw the note. Suddenly he couldn’t do enough for me. “Pay us whenever you like, sir. We will make you ten suits.”",
     "我把鈔票交給老闆。他一看，臉都白了，向我鞠躬。「非常抱歉，先生，這我找不開。請您隨時再付就好，什麼時候都可以。」我一毛錢都沒付就走出了餐館。同樣的事在裁縫店又發生了一次。裁縫一開始看我穿得破爛，只拿便宜又醜的西裝給我。接著他看到那張鈔票，突然對我殷勤得不得了。「先生，您什麼時候方便再付都可以。我們幫您做十套西裝。」","amused"],
    ["Soon the newspapers wrote about me: the strange American [[millionaire]] with the one-million-pound note. Hotels gave me rooms on [[credit]]. Shops sent me gifts. Important people invited me to dinner. I never spent the note. I couldn’t. But everyone believed in it, so everyone believed in me.",
     "很快地，報紙開始報導我：一個帶著百萬英鎊鈔票的奇怪美國富翁。飯店讓我賒帳住宿，商店送我禮物，大人物請我吃晚餐。我從來沒花過那張鈔票，也花不出去。可是大家都相信它，所以大家也都相信我。","playful"],
    ["Some days were very strange. At a tea shop, a waiter would not bring me a cup of tea until I paid first. I showed him the note. Two minutes later the owner was serving me himself, with a cake I had not ordered, saying sorry again and again. I learned something important about London: people didn’t look at me. They looked at what they thought I had.",
     "有些日子非常奇怪。在一家茶館，服務生不肯先給我茶，要我先付錢。我把鈔票拿給他看。兩分鐘後，老闆親自來服務我，還送上一塊我沒點的蛋糕，一直跟我道歉。我學到了倫敦很重要的一件事：大家看的不是我，而是他們以為我擁有的東西。","amused"],
    ["The famous magazine [[Punch|c:punch]] even printed a picture of me: a little man with a giant bank-note under his arm. Shopkeepers stuck it on their walls. I was the most famous poor man in England, and nobody knew I was poor.",
     "有名的《笨拙》雜誌甚至刊出了我的漫畫：一個小個子男人，腋下夾著一張巨大的鈔票。店家把它貼在牆上。我是全英國最有名的窮人，可是沒有人知道我很窮。","playful"],
    ["Of course, I was worried. I [[owed|owe]] money to half of London. What would happen after thirty days? Then, at a dinner party, I met a lovely English girl called [[Portia Langham|c:n-portia]]. She laughed when I told her the whole story. She didn’t care about money. I fell in love with her before the dessert.",
     "我當然很擔心。全倫敦有一半的人都在等我還錢。三十天以後會怎樣？後來，我在一場晚宴上遇到一位可愛的英國女孩，名叫波夏．蘭罕。我把整個故事告訴她時，她笑了。她不在乎錢。甜點還沒上桌，我就愛上她了。","tender"],
    ["Every night I lay awake and added up my debts. In thirty days I had to give the note back. Then everyone would know the truth, and I would be the most famous poor man in prison.",
     "每天晚上，我都躺在床上睡不著，計算我欠了多少錢。三十天後，我得把鈔票還回去。到時候大家都會知道真相，而我會變成監獄裡最有名的窮人。","worried"],
    ["Then an old friend from San Francisco, Lloyd Hastings, found me in London. He had come to sell shares in a gold mine, but nobody trusted him. “You’re famous,” he said. “If people see your name next to mine, they will buy.” So I let him use my name. I didn’t put in a single penny. Rich men bought the [[shares|share]] in a week, and Lloyd paid me half the [[profit]]: two hundred thousand pounds, in real money.",
     "後來，一位來自舊金山的老朋友羅伊德．哈斯汀在倫敦找到我。他來倫敦賣一座金礦的股份，可是沒人信得過他。「你現在很有名，」他說，「如果大家看到你的名字和我的放在一起，就會買。」所以我讓他用我的名字，自己一毛錢都沒出。一個星期內，有錢人就把股份買光了，羅伊德分了一半利潤給我：二十萬英鎊，是真正的錢。","excited"],
    ["On the thirtieth day, I went back to the brothers. Portia said she wanted to come with me, and I was too happy to ask why. I gave the brothers back their envelope with the note inside. “You won,” I told the younger brother. “I didn’t starve.” Then I showed them my bank book. “And I have two hundred thousand pounds of my own. And one more piece of news: this young lady has agreed to marry me.”",
     "第三十天，我回去找那對兄弟。波夏說她想跟我一起去，我高興得忘了問為什麼。我把裝著鈔票的信封還給兄弟倆。「您贏了，」我對弟弟說，「我沒有餓死。」接著我拿出存摺給他們看。「而且我自己有二十萬英鎊了。還有一個消息：這位小姐答應嫁給我了。」","proud"],
    ["The younger brother began to laugh. Portia ran to him and hugged him. “Papa!” she said. He was her [[stepfather]]. He had won his bet, and now he was winning a son-in-law too. As a wedding gift, he gave us the million-pound note. We put it in a [[frame]] on our wall. It never bought anything. But it bought me everything.",
     "弟弟大笑起來。波夏跑過去抱住他。「爸爸！」她說。原來他是她的繼父。他打賭贏了，現在還贏得了一個女婿。他送給我們的結婚禮物，就是那張一百萬英鎊的鈔票。我們把它裱框掛在牆上。它從來沒買過任何東西，卻幫我買到了一切。","warm"]
  ],
  quiz:[
    ["What was the brothers’ bet about?", ["Whether a man could live 30 days with only a million-pound note","Whether Henry could find a job","Who was richer"], 0, "哥哥認為拿著找不開的大鈔會餓死，弟弟認為不會。"],
    ["Why did shops and hotels give Henry things without payment?", ["He was a famous actor.","They believed he was very rich.","Portia paid for him."], 1, "大家看到那張百萬大鈔，就相信他是富翁，願意讓他賒帳。"],
    ["How did Henry really make money?", ["He spent the note.","He let Lloyd use his famous name to sell mine shares.","He won a bet."], 1, "他把名字借給羅伊德賣金礦股份，分到一半利潤。"]
  ]
},

{ id:"hour", thread:"", kind:"classic", title:"The Story of an Hour", zt:"一小時的故事", voice:"f",
  by:"Kate Chopin, 1894 · retold",
  intro:"美國作家凱特．蕭邦一千字左右的短篇，一百多年來仍讓讀者討論不休。一位女士得知丈夫的死訊，在房裡獨處的一小時裡，發生了什麼事？",
  paras:[
    ["Everyone knew that Mrs. [[Louise Mallard|c:n-mallard]] had heart trouble. So they were very careful when they told her that her husband was dead.",
     "大家都知道路易絲．馬拉德太太心臟不好，所以告訴她丈夫的死訊時，大家都非常小心。","calm"],
    ["Her sister Josephine told her, in broken sentences and soft words. Her husband’s friend Richards stood beside her. He had been at the newspaper office when the news of a train [[accident]] arrived. Brently Mallard’s name was at the top of the list of the dead. Richards checked the news twice before he hurried to the house.",
     "她的妹妹約瑟芬斷斷續續、輕聲細語地告訴了她。她丈夫的朋友理查茲站在一旁。火車事故的消息傳到報社時，理查茲正好在那裡。布倫特利．馬拉德的名字列在罹難者名單的第一個。理查茲確認了兩次，才急忙趕過來。","sad"],
    ["Louise did not hear the news like other women. She did not sit frozen and unable to believe it. She cried at once, wildly, in her sister’s arms. When the storm of [[grief]] was over, she went upstairs alone. She did not want anyone to follow her.",
     "路易絲聽到這個消息的反應，和別的女人不一樣。她沒有呆坐著、不敢相信。她立刻撲在妹妹懷裡放聲大哭。悲傷的暴風雨過去後，她一個人上樓，不希望有任何人跟著。","sad"],
    ["In her room, there was a big, comfortable [[armchair]] facing an open window. She sank into it. Outside, she could see the tops of trees moving with new spring life. The air smelled of rain. Somewhere a man was calling out the things he was selling. Far away, someone was singing. Little [[patches|patch]] of blue sky showed between the clouds.",
     "房間裡有一張舒適的大扶手椅，面對著一扇敞開的窗。她坐了進去。窗外，她看得到樹梢在春天的新生命裡搖動。空氣裡有雨的味道。某處有個小販在叫賣，遠方有人在唱歌。雲層之間露出一塊一塊的藍天。","calm"],
    ["She sat very still. She was young, with a calm, strong face. But now her eyes looked far away, at one of those patches of blue sky. She was not thinking. She was waiting. Something was coming to her, and she was afraid of it. She did not know what it was.",
     "她一動也不動地坐著。她很年輕，有一張平靜而堅強的臉。可是現在她的眼神望得好遠，望著其中一塊藍天。她不是在思考，而是在等待。有什麼東西正朝她而來，她很怕它，卻不知道那是什麼。","thoughtful"],
    ["Then it came, and she tried to push it away. But it was too strong. A little word escaped from her lips, again and again: “Free, free, free!” Her eyes became bright. Her heart beat fast, and the blood warmed her whole body.",
     "然後它來了。她想把它推開，可是它太強了。一個小小的字，一次又一次從她的唇間溜了出來：「自由，自由，自由！」她的眼睛亮了起來。她的心跳得好快，血液讓她全身都溫暖了起來。","hopeful"],
    ["She knew she would cry again at the [[funeral]]. She would see her husband’s kind hands and his face, which had always looked at her with love. He had never been [[cruel]] to her. But beyond that sad moment, she saw a long line of years that would belong only to her. There would be no one to [[bend|bend]] her will — no man, no woman, with good intentions or bad. She opened her arms to those years.",
     "她知道在喪禮上她還會再哭。她會看到丈夫溫柔的雙手，還有那張總是滿懷愛意看著她的臉。他從來沒有對她不好。可是在那個悲傷的時刻之後，她看到了一長串只屬於她自己的歲月。再也不會有人來壓彎她的意志——不論是男人還是女人，不論是出於好意還是惡意。她張開雙臂，迎接那些歲月。","hopeful"],
    ["Had she loved him? Sometimes she had. Often she had not. What did it matter now? “Free! Body and [[soul]] free!” she whispered.",
     "她愛過他嗎？有時候愛過，更多時候沒有。現在那又有什麼關係呢？「自由了！身體和靈魂都自由了！」她低聲說。","tender"],
    ["Josephine was [[kneeling|kneel]] at the door. “Louise, open the door! Please! You will make yourself ill.” “Go away,” said Louise. “I am not making myself ill.” She was drinking in the very air of life through that open window. Only yesterday she had been afraid that life might be long. Now she prayed that it would be long.",
     "約瑟芬跪在門外。「路易絲，開門！拜託！妳會把自己弄病的。」「走開，」路易絲說，「我沒有把自己弄病。」她正透過那扇敞開的窗，大口吸進生命的空氣。就在昨天，她還害怕人生會很漫長。現在，她祈禱人生能長一點。","firm"],
    ["At last she opened the door. There was a strange [[triumph]] in her eyes, and she walked like a [[goddess]] of [[victory]]. She held her sister’s waist, and together they went down the stairs. Richards was waiting at the bottom.",
     "她終於打開了門。她的眼中有一種奇特的勝利感，走起路來就像勝利女神。她摟著妹妹的腰，兩人一起走下樓。理查茲在樓梯底下等著。","proud"],
    ["Someone was opening the front door with a key. It was Brently Mallard who came in, a little dusty, carrying his bag and umbrella. He had been far from the accident. He did not even know there had been one. He stood there, surprised at Josephine’s cry and at Richards, who moved quickly to hide him from his wife. But Richards was too late.",
     "有人正用鑰匙打開大門。走進來的是布倫特利．馬拉德，身上有點灰塵，提著他的包包和雨傘。他離事故現場很遠，根本不知道發生了事故。他站在那裡，對約瑟芬的尖叫、還有理查茲急忙想擋住他不讓妻子看見的舉動，感到一頭霧水。可是理查茲來不及了。","surprised"],
    ["When the doctors came, they said she had died of heart disease — of the joy that kills.",
     "醫生來了以後說，她死於心臟病——死於足以致命的狂喜。","sad"]
  ],
  quiz:[
    ["What did Louise feel when she was alone in her room?", ["Only sadness","A growing feeling of freedom","Anger at Richards"], 1, "她悲傷之後，心裡湧起的是「自由」。"],
    ["Was Brently Mallard really dead?", ["Yes","No — he was far from the accident.","We never find out."], 1, "他根本不在那班火車上，也不知道發生了事故。"],
    ["The doctors say she died of “the joy that kills.” What do many readers think really happened?", ["She was too happy to see her husband.","She was shocked to lose her new freedom.","She was ill for a long time."], 1, "醫生以為是看到丈夫太高興；很多讀者認為，是她剛得到的自由突然被奪走。這正是故事的反諷。"]
  ]
},

{ id:"cow", thread:"", kind:"classic", title:"The Cow in the Flannel Waistcoat", zt:"穿毛背心的牛", voice:"f",
  by:"Elizabeth Gaskell, Cranford, 1853 · retold",
  intro:"蓋斯凱爾夫人的《克蘭福德》描寫一個英國小鎮，鎮上幾乎都是體面卻不寬裕的淑女。她們有一大堆規矩、一點點錢，還有一頭全英國最有名的牛。",
  paras:[
    ["In the little town of [[Cranford|c:n-cranford]], almost every house belonged to a lady. There were a few men, of course, but they never seemed to stay. Husbands went to work in the big city nearby. Sons went to sea. The ladies stayed, and they ran the town very well.",
     "在克蘭福德這個小鎮上，幾乎每一棟房子都屬於一位淑女。當然也有幾位男士，可是他們好像都待不久。丈夫到附近的大城市工作，兒子出海去了。淑女們留了下來，而且把小鎮管理得很好。","calm"],
    ["I often stayed in Cranford as a young woman, and I learned its rules quickly. You visited a new neighbor within three days. You stayed for exactly fifteen minutes, and you never looked at the clock. And above all, you never talked about money. Most of the ladies were quite poor, but nobody ever said so. If a lady could not afford meat, she simply told you she preferred vegetables. We called this “elegant [[economy]].”",
     "我年輕時常住在克蘭福德，很快就學會了這裡的規矩。有新鄰居搬來，三天之內就要去拜訪。拜訪剛好待十五分鐘，而且絕對不能看時鐘。最重要的是，永遠不談錢。大部分淑女其實都很窮，可是從來沒有人說出口。如果一位淑女買不起肉，她只會告訴你，她比較喜歡吃蔬菜。我們稱之為「優雅的節儉」。","amused"],
    ["Our tea parties followed the same rules. We drank from our best old cups, and nobody ever noticed that they were chipped. The bread and butter was cut very thin. If there was cake, the hostess always said, “Just a small one, my dear. Rich food is so bad for the health.” Everybody understood. Nobody said anything.",
     "我們的茶會也照著同樣的規矩。大家用最好的老茶杯喝茶，沒有人會注意到杯緣有缺口。奶油麵包切得非常薄。如果有蛋糕，女主人總會說：「親愛的，只有一小塊。太油膩的食物對身體很不好。」大家都懂，大家什麼都不說。","amused"],
    ["Then Captain Brown came to live in the town. Everyone was shocked, not because he was a man, but because of what he said. In his first week, in the street, he said loudly that he could not buy a new coat because he was poor. Poor! The ladies didn’t know where to look. Nobody in Cranford was ever poor out loud.",
     "後來，布朗上尉搬到鎮上來住。大家都嚇了一跳。不是因為他是男人，而是因為他說的話。搬來的第一個星期，他就在大街上大聲說，他買不起新外套，因為他很窮。窮！淑女們尷尬得不知道眼睛該往哪裡看。在克蘭福德，從來沒有人把「窮」說出口。","surprised"],
    ["But Captain Brown was also kind, [[sensible]] and always ready to help. Slowly, the ladies began to ask for his [[advice]].",
     "可是布朗上尉也很善良、很明理，而且總是樂於助人。淑女們慢慢開始向他請教事情。","warm"],
    ["One rainy Sunday, I saw him in the street. A poor old woman was carrying her Sunday dinner home from the baker’s oven, and her hands were shaking. Captain Brown took the hot dish from her, carried it carefully down the street, and handed it to her at her door. A gentleman, carrying a dinner in the street! The ladies talked about it for a week. But they talked about it with respect.",
     "某個下雨的星期天，我在街上看到他。一位貧窮的老太太正把她的星期天晚餐從麵包店的烤爐端回家，雙手不停發抖。布朗上尉接過那盤熱騰騰的菜，小心翼翼地端過整條街，送到她家門口才交給她。一位紳士，在大街上端著一盤晚餐！淑女們談論了一整個星期。不過，她們是帶著敬意在談論的。","warm"],
    ["Not everyone agreed with him, of course. One evening, at a card party, Captain Brown read aloud from a new, funny book by a young writer called [[Dickens|c:n-dickens]]. Miss Jenkyns, our leader, put down her cards. “I prefer Dr. Johnson,” she said coldly. “He wrote serious English.” Captain Brown only smiled and kept reading. Half the room tried very hard not to laugh at the jokes. The other half didn’t try at all. And soon came the famous day of Miss Betsy Barker’s cow.",
     "當然，不是每個人都贊同他。某天晚上的牌局上，布朗上尉大聲朗讀了一位叫狄更斯的年輕作家寫的新書，內容很好笑。我們的領袖詹金斯小姐放下手中的牌。「我比較喜歡約翰生博士，」她冷冷地說，「他寫的才是正經的英文。」布朗上尉只是笑笑，繼續讀下去。屋裡一半的人拚命忍住不笑，另一半的人根本懶得忍。很快地，就到了貝西．巴克小姐那頭牛的知名事件。","amused"],
    ["Miss Betsy Barker was a small, careful lady with one great love: her [[Alderney|c:n-alderney]] cow. She spoke about the cow as if it were her daughter. It was a gentle, pretty animal, and it gave the best milk in town. Everyone in Cranford knew it, and everyone was polite to it when they passed it in the field.",
     "貝西．巴克小姐是一位嬌小又謹慎的淑女，她最愛的是她那頭奧爾德尼牛。她提起那頭牛，就像在說自己的女兒。那是一頭溫柔又漂亮的牛，產的牛奶是全鎮最好的。克蘭福德每個人都認識牠，經過田邊時，大家都會很有禮貌地對牠打招呼。","tender"],
    ["One terrible afternoon, the cow walked too close to a [[lime]] pit at the edge of the field and fell in. Lime burns, like fire. Men pulled her out quickly, and she lived. But almost all of her hair fell out. She stood in the field with [[bare]], pink, [[wrinkled]] skin, shaking in the wind. She looked like a very large, very sad baby.",
     "某個可怕的下午，那頭牛走得太靠近田邊的石灰坑，掉了進去。石灰會像火一樣灼傷皮膚。男人們很快把牠拉了上來，牠活了下來。可是牠的毛幾乎全掉光了。牠站在田裡，皮膚光禿禿的、粉紅色的、皺巴巴的，在風中發抖。牠看起來就像一個非常大、非常可憐的嬰兒。","sad"],
    ["Miss Betsy cried for days. The whole town felt sorry for her. Finally, she went to ask Captain Brown what to do. He thought about it seriously. Then he said, “Get her a [[flannel]] [[waistcoat]], ma’am, if you want to keep her alive. But my advice is: end her [[suffering]] at once.”",
     "貝西小姐哭了好幾天，全鎮的人都替她難過。最後，她去請教布朗上尉該怎麼辦。上尉認真地想了想，然後說：「女士，如果您想讓牠活下去，就幫牠做一件法蘭絨背心吧。不過我的建議是：立刻結束牠的痛苦。」","deadpan"],
    ["Miss Betsy thanked him with tears in her eyes. She went straight home, sat down with her [[needle]], and followed the first half of his advice very carefully.",
     "貝西小姐眼裡含著淚向他道謝。她直接回家，坐下來拿起針線，非常仔細地照著他建議的前半段去做。","amused"],
    ["For three days, the town talked of nothing else. Was it [[proper]] for a cow to wear clothes? Miss Jenkyns said it was very strange. Mrs. Forrester said it was very sensible. The butcher said it was the funniest thing he had ever heard, and he said it to everyone who came into his shop.",
     "整整三天，鎮上的人什麼都不聊，只聊這件事。讓一頭牛穿衣服，這樣得體嗎？詹金斯小姐說這非常奇怪。福瑞斯特太太說這非常明智。肉販說這是他聽過最好笑的事，而且每個走進店裡的客人他都要說一遍。","playful"],
    ["A week later, the whole of Cranford walked past the field to see. There was the Alderney cow, eating grass in the sunshine, dressed in a dark gray flannel waistcoat with neat [[buttons|button]]. She looked warm and quite proud of herself. Nobody laughed — not out loud, anyway. That would not have been polite.",
     "一個星期後，全克蘭福德的人都特地經過那片田去看。那頭奧爾德尼牛就在陽光下吃草，身上穿著一件深灰色的法蘭絨背心，釦子縫得整整齊齊。牠看起來很溫暖，而且相當得意。沒有人笑——至少沒有人笑出聲。那樣可不禮貌。","amused"],
    ["Have you ever seen a cow dressed in gray flannel? I have, many times. Long after her hair grew back, people in Cranford still talked about her. And whenever someone in the town said a thing was “impossible,” another lady would smile and say, “My dear, so was a cow in a waistcoat.”",
     "你見過穿灰色法蘭絨的牛嗎？我見過，見過好多次。在牠的毛長回來很久以後，克蘭福德的人還在談論牠。從此以後，只要鎮上有人說某件事「不可能」，就會有另一位淑女笑著說：「親愛的，穿背心的牛，當初也沒人覺得可能呀。」","warm"]
  ],
  quiz:[
    ["What was the most important rule in Cranford?", ["Never talk about money.","Never keep a cow.","Never visit a neighbor."], 0, "淑女們大多很窮，但「優雅的節儉」就是絕不把窮說出口。"],
    ["Why were the ladies shocked by Captain Brown at first?", ["He was rude to the cow.","He said out loud that he was poor.","He was a soldier."], 1, "他在大街上大聲說自己窮，打破了小鎮最重要的規矩。"],
    ["Which part of Captain Brown’s advice did Miss Betsy follow?", ["Both parts","Only the waistcoat part","Neither part"], 1, "她只照做了前半段：做背心。後半段（結束牛的痛苦）她完全沒照做。"]
  ]
},

{ id:"bridge", thread:"static", kind:"orig", title:"The Static: The Turning Bridge", zt:"雜訊：旋轉的橋", voice:"f",
  by:"InkQuest original · The Static, Part 2",
  intro:"高雄三部曲第二部。一九八六年的信封裡，畫著二〇二〇年才蓋好的大港橋，還有一句話：「橋轉動的時候，仔細聽。」四個朋友帶著一台老收音機，來到旋轉的白色橋邊。",
  paras:[
    ["On Saturday at three o’clock, we stood next to [[Dagang Bridge|c:dagang]] and waited. The white bridge turned, slowly and beautifully, like the hand of a giant clock. Boats passed. Tourists took photos. Our phones did nothing. Nobody heard anything except the boat engines.",
     "星期六下午三點，我們站在大港橋旁邊等著。白色的橋緩緩轉開，優雅得像一支巨大時鐘的指針。船隻駛過，觀光客拍照，我們的手機一點動靜也沒有。除了船的引擎聲，誰都沒聽到任何聲音。","calm"],
    ["“Maybe it was a joke,” said Jerry on the way home. “A very old, very expensive joke.” Tammy didn’t answer. She was looking at the drawing from the envelope again, holding it close to her face. Then she stopped in the middle of the street. “Look,” she said. At the top of the paper, very small, the old man had drawn a thin moon and three stars. We had all missed it. “It’s night,” said Tammy. “He drew the bridge at night.”",
     "「說不定只是個玩笑，」回家路上傑瑞說，「一個很老、很昂貴的玩笑。」譚美沒有回答。她又拿出信封裡那張畫，湊到眼前仔細看。然後她在大街中間停了下來。「你們看。」她說。紙的最上方，老先生用很小的筆畫畫了一彎細細的月亮和三顆星星。我們全都沒注意到。「是晚上，」譚美說，「他畫的是晚上的橋。」","surprised"],
    ["I checked my phone. On Fridays, Saturdays and Sundays, the bridge also turns at seven in the evening — after dark. But Bo was still thinking about our silent phones. “He fixed radios,” he said. “Maybe we need a real radio.” So on Sunday we took the [[ferry]] back to Cijin, to the shop with the blue door. The old woman listened to our story. Then she went into the back room and came out with a heavy gray radio. It had a silver [[dial]] and a long [[antenna]]. “He always took this one to the harbor,” she said. “Take it. I think it was waiting for you.”",
     "我查了手機：每個星期五、六、日，大港橋晚上七點還會再轉一次——那時天已經黑了。可是阿柏還在想我們那幾支毫無動靜的手機。「他是修收音機的，」他說，「說不定我們需要一台真正的收音機。」所以星期天，我們又搭渡輪回到旗津，回到那間藍色門的店。老太太聽完我們的故事，走進後面的房間，拿出一台沉重的灰色收音機。它有一個銀色的旋鈕和一根長長的天線。「他以前總是帶這台去港邊，」她說，「拿去吧。我想它一直在等你們。」","tender"],
    ["On Wednesday night, Tammy took the radio apart on her bedroom floor. She cleaned every piece and put in new batteries. “It works,” she texted us at midnight. “It picks up nothing but static. Perfect.” Jerry replied with a pair of big eyes. A minute later, he sent another message, just to me: “Are you scared?” I thought about it. “A little,” I wrote. “But in a good way.” “Same,” he wrote.",
     "星期三晚上，譚美在她房間的地板上把收音機拆開，每個零件都擦乾淨，換上新電池。「可以用了，」她半夜傳訊息給我們，「除了雜訊什麼都收不到。完美。」傑瑞回了一個瞪大眼睛的表情符號。一分鐘後，他又傳了一則訊息，只傳給我：「妳會怕嗎？」我想了想。「有一點，」我寫，「但是是好的那種。」「我也是。」他寫。","tender"],
    ["Friday came very slowly. After school, we took the [[light rail|c:lrt]] to Pier-2. Bo came over on the ferry from Cijin and met us there, carrying the radio in his arms like a baby. At 6:50, the bridge was full of people taking selfies against the harbor lights. Then a voice came from the speakers: “The bridge will turn in five minutes. Please leave the bridge now.” Everyone walked off. We stood at the [[rail]] on the Pier-2 side, as close as we could.",
     "星期五來得好慢。放學後，我們搭輕軌到駁二。阿柏從旗津搭渡輪過來和我們會合，把收音機抱在懷裡，像抱著一個嬰兒。六點五十分，橋上擠滿了對著港口燈光自拍的人。接著廣播傳來：「本橋將於五分鐘後旋轉，請立即離開橋面。」大家都走下橋。我們站在駁二這一側的欄杆邊，能靠多近就靠多近。","nervous"],
    ["Tammy turned the radio on. It [[hissed]] — the same long shhhhhh as the night of the static. She turned the dial slowly. Nothing. Just noise. At exactly seven, lights came on along the bridge, and the great white wing began to move.",
     "譚美打開收音機。它發出嘶嘶聲——跟雜訊那晚一模一樣的、長長的沙沙聲。她慢慢轉動旋鈕。什麼都沒有，只有雜訊。七點整，橋上的燈一盞盞亮起，巨大的白色翅膀開始移動。","thoughtful"],
    ["And the noise changed. Under the hiss, very softly, a man began to speak. He was not speaking English. He was not speaking Mandarin either. Bo’s face changed. “It’s Taiwanese,” he whispered. “He’s speaking Taiwanese. Like my grandma.” We all leaned toward the radio. Bo listened hard and [[translated|translate]], one sentence at a time.",
     "然後雜訊變了。在嘶嘶聲底下，一個男人輕輕地開始說話。他說的不是英文，也不是華語。阿柏的表情變了。「是台語，」他小聲說，「他在講台語，跟我阿嬤一樣。」我們全都湊到收音機旁邊。阿柏專心地聽，一句一句翻譯給我們聽。","surprised"],
    ["“To the four children,” said the voice. “If you can hear me, then the bridge is real, and so are you. I am sorry I cannot explain everything. Some things you cannot understand. You can only listen to them.” There was a pause. The bridge kept turning. “The last part is with the light. Go up when there is no moon. And please tell [[Hai-yan|c:n-haiyan]] that her fish soup was always perfect. I never said it.”",
     "「給四個孩子，」那個聲音說，「如果你們聽得到我，那就表示這座橋是真的，你們也是。很抱歉，我沒辦法解釋所有的事。有些事情是沒辦法理解的，只能用心聽。」停頓了一下。橋還在轉。「最後一部分在光那裡。沒有月亮的時候，上去。還有，請告訴海燕，她煮的魚湯一直都很好喝。我從來沒說出口。」","tender"],
    ["Then the bridge stopped, and so did the voice. The radio went back to its ordinary hiss. All around us, people were cheering and clapping for the bridge. Nobody else had heard anything. Their phones were full of photos and nothing else.",
     "然後橋停了，聲音也停了。收音機又回到普通的嘶嘶聲。我們周圍的人都在為那座橋歡呼、拍手。除了我們，沒有人聽到任何東西。他們的手機裡，除了照片什麼都沒有。","calm"],
    ["“It’s a [[recording]],” said Jerry, but his voice was shaking. “He made it in 1986.” Tammy shook her head. She was looking at the numbers on the dial. “I’ve never heard a station on this [[frequency]],” she said quietly. “And a radio signal from 1986 can’t wait in the air for forty years. That’s not how radio works.” “Then how does it work?” I asked. Nobody answered. Above us, the bridge lights were [[reflecting|reflect]] in the black water, and for a long time we just watched them.",
     "「那是錄音，」傑瑞說，可是他的聲音在發抖，「他在 1986 年錄的。」譚美搖搖頭，盯著旋鈕上的數字。「我從來沒聽過哪個電台用這個頻率，」她輕聲說，「而且 1986 年的無線電訊號，不可能在空氣裡等四十年。收音機不是這樣運作的。」「那它是怎麼運作的？」我問。沒有人回答。頭頂上，橋上的燈光倒映在黑色的海水裡，我們就這樣看了很久很久。","thoughtful"],
    ["On Sunday, we went back to the shop with the blue door and told the old woman everything. When we got to the part about the fish soup, she sat down suddenly. She laughed, and then she cried, and then she laughed again. “Hai-yan is me,” she said at last. “The shop has my name on it. Forty years, and he never once told me the soup was good.” She [[wiped|wipe]] her eyes. “He was a terrible talker. But he was a good listener.”",
     "星期天，我們回到那間藍色門的店，把一切告訴老太太。講到魚湯那段時，她突然坐了下來。她笑了，然後哭了，然後又笑了。「海燕就是我，」她終於說，「店名就是我的名字。四十年了，他從來沒說過一次湯好喝。」她擦擦眼睛。「他很不會說話，可是很會聽。」","tender"],
    ["Outside, Bo pointed up at the green hill at the end of the island, where a white tower stood against the sky. “‘The light,’” he said. “There’s only one light on Cijin. The [[lighthouse]].” I opened the moon [[calendar]] on my phone. The next night with no moon was in nineteen days. That evening, I wrote at the top of a new page in my notebook: THE STATIC. CHAPTER TWO. Under it, I wrote one more word: Listen.",
     "走出店外，阿柏指著島尾端那座綠色的山丘，一座白塔在天空下矗立著。「『光那裡』，」他說，「旗津只有一個光。燈塔。」我打開手機裡的月曆：下一個沒有月亮的晚上，在十九天後。那天晚上，我在筆記本新的一頁最上面寫下：雜訊。第二章。底下，我又寫了一個字：聽。","hopeful"]
  ],
  quiz:[
    ["Why did nothing happen at three o’clock on Saturday?", ["The radio was broken.","The drawing showed the bridge at night.","The bridge didn’t turn."], 1, "譚美發現畫上有月亮和星星，所以要等晚上七點那一場。"],
    ["Why did Bo have to translate?", ["The voice spoke Taiwanese.","The voice spoke very fast.","Only Bo could hear it."], 0, "那個聲音說台語，跟阿柏的阿嬤一樣。"],
    ["Where do the friends think “the light” is?", ["Dagang Bridge","The Cijin lighthouse","The radio shop"], 1, "阿柏說旗津只有一個光：燈塔。"]
  ]
},

{ id:"mapmaker", thread:"dnd", kind:"orig", title:"The Mapmaker’s Apprentice", zt:"地圖師的學徒", voice:"f",
  by:"InkQuest original",
  intro:"在一個需要地圖才能活下去的世界，地圖師只有一條規矩：沒走過的路，不准畫。十六歲的學徒小雀，要在冬天來臨前，走一趟沒有人走過的新路。",
  paras:[
    ["In the town of Ashford, the most important shop was not the bakery or the [[blacksmith]]. It was the mapmaker’s. Beyond the town walls lay the Greywater Valley, full of rivers that changed their paths, forests that hid old roads, and hills that all looked the same in the rain. Without a good map, travelers got lost. Some never came home.",
     "在亞許福鎮，最重要的店不是麵包店，也不是鐵匠鋪，而是地圖師的店。城牆外是灰水谷，那裡的河會改道，森林會把老路藏起來，下雨天每座山丘看起來都一模一樣。沒有好地圖，旅人就會迷路，有些人再也回不了家。","calm"],
    ["Wren was sixteen and had been Old [[Ottilie|c:n-ottilie]]’s [[apprentice]] for three years. She could mix ink, cut paper and draw a perfect [[compass rose]]. But she had never made a real map. Ottilie had one rule, and she wrote it in big letters above the door: NEVER DRAW A ROAD YOU HAVE NOT WALKED.",
     "小雀十六歲，跟著老奧蒂莉當學徒三年了。她會調墨水、裁紙，也會畫一個完美的羅盤玫瑰。可是她從來沒有畫過一張真正的地圖。奧蒂莉只有一條規矩，用大字寫在門上：沒走過的路，不准畫。","informative"],
    ["That autumn, a great [[flood]] came down the valley. When the water went back, the old road to the mountain village of High Hollin was gone. The river had moved. The bridge was gone. The village needed [[flour]] and medicine before the snow. The [[merchants|merchant]] needed a new map. And Ottilie’s hands now shook too much to hold a pen.",
     "那年秋天，一場大洪水沖下山谷。水退了以後，通往山村高霍林的老路不見了。河流改了道，橋也不見了。山村在下雪前需要麵粉和藥品，商人需要一張新地圖，而奧蒂莉的手現在抖得連筆都拿不穩。","worried"],
    ["“You go,” said Ottilie. “Walk it. Count every step. Write down everything. Then come back and draw it.” Wren’s heart was beating so hard she could hear it. “Alone?” “Of course not,” said Ottilie. “Tuck goes with you. And his goat.”",
     "「妳去，」奧蒂莉說，「用腳走一遍。每一步都要數，每件事都要記下來。然後回來把它畫出來。」小雀的心跳得好大聲，大到她自己都聽得見。「一個人去？」「當然不是，」奧蒂莉說，「塔克跟妳去，還有他的山羊。」","firm"],
    ["Tuck was a [[dwarf]] who drove the flour cart. He was short, wide and very cheerful, and he talked to his goat, Pepper, as if she were a person. Pepper ate everything, including two of Wren’s pencils on the first morning. Wren didn’t mind. She had brought twelve.",
     "塔克是駕麵粉車的矮人，又矮又壯，個性非常開朗。他跟他的山羊胡椒說話，就像在跟人說話一樣。胡椒什麼都吃，第一天早上就吃掉了小雀兩支鉛筆。小雀不介意，她帶了十二支。","amused"],
    ["For three days they walked. Wren counted her steps out loud until Tuck begged her to count quietly. She wrote down every stone, every tree with a strange shape, every place where the ground was soft. When the [[fog]] came down, she used her [[compass]]. When the compass needle went crazy near a hill full of iron, she used the sun. When there was no sun, she followed the sound of the river.",
     "他們走了三天。小雀一路大聲數步數，數到塔克求她小聲一點。她記下每一塊石頭、每一棵形狀奇怪的樹、每一個地面鬆軟的地方。起霧的時候，她用羅盤。一座滿是鐵礦的山丘讓羅盤指針亂轉時，她看太陽。沒有太陽的時候，她就跟著河流的聲音走。","calm"],
    ["On the third evening, they reached a place where the old map showed a village. There was no village now — only mud, broken fences and a wooden sign lying in the water. The people had moved up the hill before the flood, Tuck said; he had heard the news in town. Wren wrote it all down, even the sign. “Why write that?” asked Tuck. “Because it’s true,” said Wren. “A map that lies is worse than no map at all.”",
     "第三天傍晚，他們來到舊地圖上畫著一個村莊的地方。現在那裡沒有村莊了——只有爛泥、倒塌的籬笆，還有一塊泡在水裡的木頭招牌。塔克說，村民在洪水來之前就搬到山上去了，他在鎮上聽說的。小雀把一切都記了下來，連那塊招牌也記了。「這個也要寫？」塔克問。「因為這是真的，」小雀說，「一張說謊的地圖，比沒有地圖還糟。」","thoughtful"],
    ["On the fourth morning, they found the river — wide, fast and brown. There was no bridge. But on the other side, sitting on a rock with his feet in the water, was a [[giant]]. He was as tall as a house, with a beard full of leaves. Beside him lay a long, flat tree [[trunk]], just right for crossing.",
     "第四天早上，他們找到了河——又寬、又急、又混濁。沒有橋。可是在對岸，有一個巨人坐在一塊大石頭上，雙腳泡在水裡。他有一棟房子那麼高，鬍子裡塞滿了葉子。他身邊躺著一根又長又平的樹幹，拿來過河剛剛好。","excited"],
    ["“Good morning,” said Tuck, very politely. “That’s a fine log. How much to use it?” The giant looked at them for a long time. “I have lived in this valley for four hundred years,” he said in a voice like distant [[thunder]]. “I have walked every hill. But I have never seen my home from above, like the birds see it. Draw me a map of my valley, little one, and you may cross.”",
     "「早安，」塔克非常有禮貌地說，「好一根木頭。借用一下要多少錢？」巨人看了他們好一會兒。「我在這個山谷住了四百年，」他的聲音像遠方的雷聲，「每座山丘我都走過。可是我從來沒有像鳥一樣，從上面看過我的家。小傢伙，幫我畫一張我的山谷的地圖，你們就可以過河。」","curious"],
    ["Wren’s mouth went dry. Never draw a road you have not walked. She had walked only one small part of this valley. Then she had an idea. “I can’t draw what I haven’t walked,” she said. “But you have walked all of it. Tell me, and I will draw.” So the giant talked, and Wren drew. He [[described|describe]] the lake shaped like a boot, the hill where the wolves sang, and the cave where he slept in winter. It took the whole day.",
     "小雀的嘴巴一下子乾了。沒走過的路，不准畫。她只走過這個山谷的一小部分。接著她想到一個主意。「沒走過的地方我不能畫，」她說，「可是你全都走過。你告訴我，我來畫。」於是巨人說，小雀畫。他描述了那座像靴子的湖、狼群唱歌的山丘，還有他冬天睡覺的山洞。畫了一整天。","thoughtful"],
    ["When she finished, the giant held the little map in his huge fingers and looked at it for a long time. A tear ran down into his beard. “So that is what it looks like,” he said softly. Then he laid two tree trunks across the river as easily as two pencils. Tuck drove the cart over, very slowly. Pepper ate one corner of the giant’s map, but he didn’t seem to mind.",
     "她畫完以後，巨人用他巨大的手指捏著那張小小的地圖，看了很久很久。一滴眼淚流進他的鬍子裡。「原來它長這個樣子。」他輕聲說。接著他把兩根樹幹架過河，輕鬆得像擺兩支鉛筆。塔克駕著車，慢慢地過了河。胡椒吃掉了巨人地圖的一角，不過巨人好像不在意。","tender"],
    ["Two days later, the flour and medicine reached High Hollin, just before the first snow. When Wren got home, she drew the new road on clean paper, step by step, stone by stone. She also drew a small giant by the river, sitting on his rock. Ottilie looked at the map for a long time. Then, with her shaking hand, she dipped the pen in ink and wrote in the corner, next to her own name: and Wren.",
     "兩天後，麵粉和藥品在第一場雪落下前送到了高霍林。小雀回到家，在乾淨的紙上把新路畫了出來，一步一步、一顆石頭一顆石頭地畫。她還在河邊畫了一個小小的巨人，坐在他的大石頭上。奧蒂莉看著那張地圖看了很久。然後她用顫抖的手拿筆沾了墨水，在角落、在自己的名字旁邊寫下：與小雀。","proud"]
  ],
  quiz:[
    ["What was Ottilie’s one rule?", ["Never travel alone.","Never draw a road you have not walked.","Never talk to giants."], 1, "門上寫著：NEVER DRAW A ROAD YOU HAVE NOT WALKED."],
    ["How did Wren solve the problem?", ["She walked the whole valley.","The giant described it, and she drew what he had walked.","She copied an old map."], 1, "她自己沒走過，但巨人每一處都走過，所以由巨人描述、她來畫。"],
    ["What did Ottilie write on the new map?", ["“Wrong road”","“and Wren”","“Tuck’s map”"], 1, "她在自己的名字旁加上「與小雀」，代表承認學徒成為地圖師。"]
  ]
},

{ id:"running", thread:"women", age:50, kind:"orig", title:"Fifty-Five and Running", zt:"五十五歲，開跑", voice:"f",
  by:"InkQuest original",
  intro:"五十五歲的麗華，每天清晨在河濱公園散步。有一天，一位比她老得多的老先生慢慢跑過她身邊，對她說了一句話。",
  paras:[
    ["Li-hua turned fifty-five on a Tuesday. Her son had moved to Taichung for work, her husband left for the office at seven, and her little stationery shop didn’t open until ten. For the first time in thirty years, her mornings were empty.",
     "麗華在一個星期二滿五十五歲。兒子到台中工作了，先生七點就出門上班，她的小文具店要十點才開門。三十年來第一次，她的早晨空了下來。","calm"],
    ["So she started walking by the river at six. The park was full of people: grandmothers doing [[tai chi|c:taichi]], a man with three tiny dogs in a [[stroller]], students on bicycles. And every morning, the same old man ran past her. He was at least seventy, thin as a pencil, with white hair and bright orange shoes. He ran very slowly. But he never stopped.",
     "於是她開始每天早上六點到河邊散步。公園裡人很多：打太極拳的阿嬤、推著一台載了三隻小狗的推車的男人、騎腳踏車的學生。每天早上，同一位老先生都會從她身邊跑過去。他至少七十歲，瘦得像一支鉛筆，一頭白髮，穿著一雙亮橘色的鞋。他跑得很慢，可是從來不停下來。","calm"],
    ["One morning, he slowed down beside her. “You walk fast,” he said. “Why don’t you run?” Li-hua laughed. “At my age?” He [[pointed|point]] at his own white hair. “Running,” he said, “is just walking that’s in a hurry.” Then he waved and ran on.",
     "某天早上，他在她身邊放慢了腳步。「妳走路很快，」他說，「怎麼不跑跑看？」麗華笑了。「我這個年紀？」他指了指自己的白頭髮。「跑步啊，」他說，「就是趕時間的走路。」然後他揮揮手，繼續往前跑。","playful"],
    ["The next morning, Li-hua tried. She ran for thirty seconds and had to stop, red-faced and [[gasping|gasp]], holding onto a tree. A grandmother doing tai chi watched her with interest. Li-hua wanted to go home and never come back. But that night, she looked up a [[beginner]]’s plan online: run for one minute, walk for two. Do it eight times. Three mornings a week. Before she started, she asked her doctor. “Good idea,” the doctor said. “Just start slowly.”",
     "隔天早上，麗華試了。她跑了三十秒就得停下來，滿臉通紅、上氣不接下氣地扶著一棵樹。一位打太極的阿嬤很有興趣地看著她。麗華好想回家，再也不要來了。可是那天晚上，她上網找了一份初學者計畫：跑一分鐘，走兩分鐘，重複八次，一週三個早上。開始之前，她先問了醫生。「好主意，」醫生說，「慢慢來就好。」","sad"],
    ["Her husband found it very funny. “Ah-hua is running!” he told everyone at dinner. “Be careful, or she’ll run away from us!” Her son sent a laughing [[emoji]]. Li-hua said nothing. She bought a pair of real running shoes — not orange, but a sensible dark blue — and she kept going.",
     "她先生覺得這件事好笑極了。「阿華在跑步喔！」他在晚餐時跟大家說，「小心點，她會跑掉不回來！」兒子傳來一個大笑的表情符號。麗華什麼也沒說。她買了一雙真正的跑鞋——不是橘色的，是一雙穩重的深藍色——然後繼續跑。","amused"],
    ["It didn’t get easy. It got [[possible]]. After three weeks, she could run for two minutes. After six weeks, five. After ten weeks, one cool morning in November, she ran for twenty minutes without stopping. When she finally stopped, the old man in orange shoes was standing by the river, clapping. “Now you are a runner,” he said. His name was Mr. Tsai, and he was seventy-three.",
     "跑步沒有變得簡單，但變得可能了。三週後，她可以跑兩分鐘。六週後，五分鐘。十週後，十一月一個涼爽的早晨，她一口氣跑了二十分鐘沒有停。等她終於停下來，那位穿橘鞋的老先生正站在河邊為她鼓掌。「現在妳是跑者了。」他說。他姓蔡，七十三歲。","proud"],
    ["There were bad days too. One morning in October, it rained so hard that the river turned brown, and she ran in a plastic raincoat that rustled like a bag of chips. Another morning her legs felt like stone, and she walked the whole way. Mr. Tsai never said anything about those days. He just nodded at her, as if to say: You came. That counts.",
     "也有很糟的日子。十月的某個早上，雨大到河水都變成了褐色，她穿著一件塑膠雨衣跑步，沙沙作響得像一包洋芋片。另一個早上，她的腿重得像石頭，整段路都用走的。蔡先生從來不提這些日子。他只是對她點點頭，好像在說：妳來了，這就算數。","tired"],
    ["At the shop one afternoon, a high school girl buying pens noticed her new shoes. “Auntie, do you run?” Li-hua opened her mouth to say “Oh, just a little.” Instead she heard herself say, for the first time, “Yes. I’m a runner.” The girl gave her a thumbs-up, and Li-hua felt ten feet tall.",
     "某天下午，一個來店裡買筆的高中女生注意到她的新鞋。「阿姨，妳有在跑步喔？」麗華張開嘴，本來想說「喔，只是隨便跑跑」。結果她聽到自己第一次說出：「對，我是跑者。」女生對她比了個讚，麗華覺得自己高了三公尺。","proud"],
    ["Mr. Tsai told her about a five-kilometer race in December. Li-hua [[signed up|sign up]] before she could change her mind. Her husband stopped laughing when he saw the number on her shirt. “Five kilometers?” he said. “That’s from here to the train station and back.” “I know,” said Li-hua. “I checked.”",
     "蔡先生跟她說十二月有一場五公里的路跑。麗華趁自己還沒反悔就報了名。她先生看到她衣服上的號碼布，就笑不出來了。「五公里？」他說，「那是從這裡到火車站再跑回來耶。」「我知道，」麗華說，「我查過了。」","firm"],
    ["The night before the race, Li-hua couldn’t sleep. She laid her clothes out on a chair: the shoes, the shirt, the number with four safety pins. She got up twice to check them. At four in the morning she gave up and made breakfast. Her husband found her at the kitchen table, already dressed, eating rice porridge. “The race is at seven,” he said. “I know,” she said. “I’m early. Runners are early.”",
     "比賽前一晚，麗華睡不著。她把衣服攤在椅子上：鞋子、上衣、別著四根安全別針的號碼布。她起床檢查了兩次。凌晨四點，她放棄了，乾脆去做早餐。她先生發現她坐在廚房餐桌前，已經換好衣服，正在喝稀飯。「比賽七點才開始。」他說。「我知道，」她說，「我是早到。跑者都會早到。」","playful"],
    ["On race day, there were two thousand runners. Most of them were young. Li-hua started too fast, the way everyone does, and after one kilometer she couldn’t breathe. She began to walk. People passed her, and more people passed her. She thought about stopping. Then a pair of orange shoes appeared beside her. “Slow is still running,” said Mr. Tsai, and he ran with her, step by step, until she could breathe again.",
     "比賽那天，有兩千名跑者，大部分都很年輕。麗華跟每個人一樣起跑太快，跑了一公里就喘不過氣。她開始用走的。有人超過她，又有更多人超過她。她想過要放棄。然後，一雙橘色的鞋出現在她身邊。「慢慢跑，也是在跑。」蔡先生說。他陪著她，一步一步地跑，直到她的呼吸恢復過來。","tender"],
    ["The last two hundred meters were the longest of her life. Then she saw the [[finish line]] — and behind it, her husband. He was holding her jacket and a piece of [[cardboard]]. On it, in his terrible [[handwriting]], he had written: GO AH-HUA! 55 AND FAST! Her son was standing next to him. He had taken the early train from Taichung without telling her.",
     "最後兩百公尺，是她這輩子最長的兩百公尺。然後她看到了終點線——還有終點線後面，她的先生。他拿著她的外套和一塊紙板。上面用他那手爛字寫著：阿華加油！55 歲跑很快！兒子就站在他旁邊。他沒有告訴她，就搭了早班火車從台中趕過來。","excited"],
    ["She finished in thirty-nine minutes. She was not first. She was not last. She was crying a little, and so was her husband, though he said it was the wind. That night, she wrote two things in her [[calendar]] for next year. The first was her fifty-sixth birthday. The second was a ten-kilometer race in October.",
     "她跑了三十九分鐘。她不是第一名，也不是最後一名。她有一點哭了，她先生也是，雖然他說那是風太大。那天晚上，她在明年的行事曆上寫了兩件事。第一件是她的五十六歲生日。第二件是十月的一場十公里路跑。","proud"]
  ],
  quiz:[
    ["What did Mr. Tsai say running is?", ["A sport for young people","Walking that’s in a hurry","Very bad for your knees"], 1, "“Running is just walking that’s in a hurry.”"],
    ["What did Li-hua do before she started her running plan?", ["She asked her doctor.","She bought orange shoes.","She entered a race."], 0, "她先問了醫生，醫生說慢慢開始就好。"],
    ["Who was waiting at the finish line?", ["Only Mr. Tsai","Her husband and her son","Nobody"], 1, "先生拿著手寫牌子，兒子也從台中趕來了。"]
  ]
},

{ id:"tableforone", thread:"love", kind:"orig", title:"Table for One", zt:"一人份的位子", voice:"f",
  by:"InkQuest original",
  intro:"克拉拉每個星期四都一個人去同一家義大利小餐館吃晚餐，坐同一張靠窗的桌子，看同一本書看到一半。她很享受。直到某個下大雨的星期四，餐廳客滿了。",
  paras:[
    ["Every Thursday at seven, Clara walked into Luca’s, a tiny Italian restaurant in a [[side street]] in [[Camden|c:n-camden]]. Every Thursday, Marco, the waiter, smiled and said, “Table for one?” And every Thursday, Clara said, “Yes, please,” and sat at table six, by the window, with a book.",
     "每個星期四晚上七點，克拉拉都會走進盧卡餐館，那是肯頓一條小巷裡的一間小小的義大利餐廳。每個星期四，服務生馬可都會微笑著說：「一位嗎？」每個星期四，克拉拉都會說：「對，謝謝。」然後拿著一本書，坐到靠窗的六號桌。","calm"],
    ["Her friends worried about her. “Don’t you feel lonely?” they asked. “Isn’t it [[awkward]], eating alone?” Clara didn’t understand the question. She spent all day talking — she taught English to adults, and her students talked even more than she did. On Thursday evenings she wanted only three things: a plate of pasta, a glass of red wine, and two hundred pages of somebody else’s life.",
     "她的朋友都替她擔心。「妳不會寂寞嗎？」他們問，「一個人吃飯不會很尷尬嗎？」克拉拉不懂這個問題。她整天都在說話——她教成人英文，她的學生話比她還多。星期四晚上，她只想要三樣東西：一盤義大利麵、一杯紅酒，還有兩百頁別人的人生。","amused"],
    ["Then came the Thursday of the storm. Rain [[poured|pour]] down the windows. Luca’s was full of wet people who had run in from the street. Clara was [[halfway]] through her pasta when the door opened and a tall man came in, soaked to the skin. Marco looked around the full room. Then he looked at Clara, at the empty chair across from her, and back at Clara, with big, hopeful eyes.",
     "然後，暴風雨的那個星期四來了。雨水沿著窗戶傾瀉而下。盧卡餐館擠滿了從街上跑進來躲雨的濕透的人。克拉拉的義大利麵吃到一半，門打開了，一個高個子男人走進來，全身濕透。馬可看了看客滿的店，然後看看克拉拉、看看她對面的空椅子，再看回克拉拉，眼睛睜得大大的，滿是期待。","amused"],
    ["Clara sighed. “Fine,” she said. The man sat down, [[dripping|drip]]. “I’m so sorry,” he said. “I won’t talk. I promise. I have a book.” He took a very wet [[paperback]] out of his coat. Clara looked at it and almost dropped her fork. It was the same book she was reading.",
     "克拉拉嘆了一口氣。「好吧。」她說。男人坐了下來，身上還在滴水。「真抱歉，」他說，「我不會說話的，我保證。我有書。」他從外套裡掏出一本濕透的平裝書。克拉拉一看，叉子差點掉下來。那正是她在看的那本書。","surprised"],
    ["“What page are you on?” she asked, before she could stop herself. “One hundred and twelve,” he said. “The part where the sister comes back.” “Don’t tell me what happens!” “I wasn’t going to!” They both laughed. His name was Owen. He was a [[translator]], he lived alone above a bakery, and he also ate dinner alone most nights, because, he said, “after a day of other people’s words, I like a little quiet.”",
     "「你看到第幾頁？」她還來不及阻止自己，就脫口問了。「一百一十二頁，」他說，「姊姊回來的那一段。」「別告訴我後來怎麼了！」「我本來就沒打算說！」兩個人都笑了。他叫歐文，是個譯者，一個人住在一家麵包店樓上，大部分的晚上也都一個人吃晚餐。因為，他說：「整天都在處理別人的字，我喜歡安靜一下。」","playful"],
    ["They talked until Luca’s closed. Not about anything important — books, bad weather, the best bakery in Camden. When they left, the rain had stopped. At the door, Owen said, “Thank you for sharing your table.” Clara said, “Thank you for not telling me what happens.” And they walked away in different directions.",
     "他們一直聊到盧卡餐館打烊。聊的都不是什麼大事——書、爛天氣、肯頓最好吃的麵包店。他們離開時，雨已經停了。在門口，歐文說：「謝謝妳跟我分享桌子。」克拉拉說：「謝謝你沒告訴我後來怎樣。」然後他們往不同的方向走了。","warm"],
    ["The next Thursday, Clara walked into Luca’s at seven. “Table for one?” asked Marco. Then she saw Owen at table seven, right next to table six, with his book. He looked up, smiled, and went back to reading. So Clara sat at table six and opened her book too. They didn’t talk. But when Owen left, he put a small piece of paper next to her glass. On it he had written the name of another book, and: You’ll like the ending. I won’t tell you why.",
     "下個星期四七點，克拉拉走進盧卡餐館。「一位嗎？」馬可問。接著她看到歐文坐在七號桌，就在六號桌旁邊，拿著他的書。他抬起頭，笑了笑，又低頭繼續看。所以克拉拉在六號桌坐下，也打開她的書。他們沒有說話。可是歐文離開時，在她的酒杯旁放了一張小紙條。上面寫著另一本書的書名，還有：妳會喜歡結局的。我不會告訴妳為什麼。","tender"],
    ["The notes became a small game. Clara left him a novel about a lighthouse keeper. He left her a book of Japanese poems, and under the title he wrote: Read number twelve first. One week she wrote only: You were right about the ending. He wrote back: I usually am. Don’t tell anyone. She laughed so loudly that the couple at table four turned around.",
     "紙條變成了一個小遊戲。克拉拉留給他一本關於燈塔看守人的小說。他留給她一本日本詩集，在書名底下寫著：先讀第十二首。有一個星期，她只寫了：結局你說對了。他回：我通常都是對的，別告訴別人。她笑得太大聲，連四號桌的情侶都轉過頭來看。","playful"],
    ["Her friends noticed something. “You’re smiling at your phone less,” said one, “and at your books more. What’s going on?” “Nothing,” said Clara. “I’m just reading a lot.” It was true. It just wasn’t the whole truth.",
     "她的朋友們察覺到了什麼。「妳盯著手機笑的時間變少了，」一個朋友說，「盯著書笑的時間變多了。怎麼回事？」「沒什麼，」克拉拉說，「我只是讀了很多書。」這是真的，只是不是全部的真相。","playful"],
    ["This went on for two months. Two tables. Two books. A little note every week, sometimes from him, sometimes from her. Marco watched them like a man watching a very slow football match. He started bringing them their bread in one [[basket]], placed exactly in the middle, between the tables.",
     "這樣持續了兩個月。兩張桌子，兩本書，每個星期一張小紙條，有時候是他寫的，有時候是她寫的。馬可看著他們，就像在看一場非常慢的足球比賽。他開始把他們的麵包放在同一個籃子裡，擺在兩張桌子正中間。","amused"],
    ["One Thursday in November, table seven stayed empty. Clara read the same page four times. She told herself she didn’t care. At half past seven, the door flew open and Owen came in, out of breath, with a bandage on his thumb. “Paper cut,” he said. “From a dictionary. Translators live dangerously.” Clara laughed, and only then did she notice that she had been holding her breath.",
     "十一月的某個星期四，七號桌一直空著。克拉拉同一頁讀了四遍，告訴自己她不在乎。七點半，門被推開，歐文氣喘吁吁地走進來，大拇指包著繃帶。「被紙割到，」他說，「被字典割的。譯者的生活很危險。」克拉拉笑了，這時她才發現，自己剛才一直屏著呼吸。","amused"],
    ["Then, one Thursday in December, Clara arrived first. Marco picked up a menu. “Table for one?” he asked, as always. Clara thought about it. She liked eating alone. She still did. But she had started to like something else too.",
     "後來，十二月的某個星期四，克拉拉先到了。馬可拿起一份菜單。「一位嗎？」他照例問。克拉拉想了想。她喜歡一個人吃飯，現在也還是喜歡。可是她也開始喜歡上另一件事了。","thoughtful"],
    ["“Two,” she said. “But we’ll both bring books.” Marco was so happy that he dropped the menu. When Owen came in, wet as usual, he found Clara at table six, with two glasses of wine and an empty chair across from her. He sat down. Neither of them opened a book for a very long time.",
     "「兩位，」她說，「不過我們都會帶書。」馬可高興到連菜單都掉了。歐文像平常一樣淋得濕濕地走進來，看到克拉拉坐在六號桌，桌上有兩杯紅酒，對面有一張空椅子。他坐了下來。很長很長一段時間，兩個人都沒有打開書。","warm"]
  ],
  quiz:[
    ["Why does Clara like eating alone?", ["She talks all day at work and wants quiet.","She has no friends.","The restaurant is cheap."], 0, "她整天教書說話，星期四晚上想安靜地吃飯看書。"],
    ["What surprised Clara on the night of the storm?", ["Owen knew Marco.","Owen was reading the same book.","Owen didn’t eat."], 1, "那本濕透的平裝書，正是她在看的那本。"],
    ["What changes at the end?", ["Clara stops reading.","Clara asks for a table for two.","Owen moves to another restaurant."], 1, "她說：“Two. But we’ll both bring books.”"]
  ]
},

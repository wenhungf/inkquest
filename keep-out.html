      : '';
    var html = doorline +
      '<p>That evening Mrs. Lin is waiting at the building door with two stools and a teapot, which in her language is a formal summons.</p>' +
      taught +
      '<p>She pours. She does not waste words on weather. \u201cPhone person,\u201d she says. \u201cYou caught the last one. So tell me. Scam, or not?\u201d</p>' +
      '<p>You give her the honest shape of it. \u201cNot the same animal. The phone thief was a knife \u2014 illegal, fast, gone by morning. This is weather. Legal. Patient. It can afford to wait for you, and it will still be here next year. You do not arrest weather. You build for it.\u201d</p>' +
      '<p>She drinks her tea and lays her ledger out loud, because she has decided you have earned the numbers: the building is fifty-five. The stairs are winning their long war against her knees. The roof just cost her real money. And the offer \u2014 she names the figure \u2014 is not an insult. \u201cSo,\u201d she says. \u201cThe smiling one says my building is dangerous, everyone is signing, and the good terms die this month. Three claims.\u201d She holds up three fingers, then looks at you the way she looked at the haggled fan, long ago. \u201cWhich are true?\u201d</p>';
    return { time: 'DAY 45 \u00b7 17:00', html: html,
      choices: [
        { t: '\u201cShow me the consent form before you ever sign anything. The fine print is where forms keep their teeth.\u201d', to: 'e7s5', fx: function () { state.flags.asked_form = true; } },
        { t: '\u201cFirst \u2014 a harder question. Ten years from now, what do you want? Nobody has asked you that yet.\u201d', to: 'e7s5', fx: function () { state.flags.asked_want = true; } }
      ] };
  },

  /* ---------- EP7 · 5 · the chairman's arithmetic ---------- */
  e7s5: function () {
    var pre;
    if (state.flags.asked_form) {
      pre = '<p>She brought the form down wrapped in a plastic bag, like evidence. You read it together under the stair light \u2014 and there it is, in the fine print, quiet as a trap: the \u201cconsent\u201d is bundled. One signature agrees to the renewal <em>and</em> appoints his company to run it <em>and</em> accepts terms \u201cto be finalized.\u201d Three doors, one key, and the key goes in his pocket. \u201cSign here, chop there,\u201d Mrs. Lin reads, dry as sand. \u201cHe brought a gift pen.\u201d</p>';
    } else {
      pre = '<p>The question lands like a coin dropped in a quiet room. Ten years from now. She looks down the lane \u2014 her lane, forty years of it \u2014 and for once takes her time. \u201cGround floor,\u201d she says finally. \u201cSomewhere I don\u2019t fight stairs. Near people who owe me money, so they visit.\u201d A pause. \u201cThis offer buys that. So does waiting for a better one. Don\u2019t let me sign the worse one because a boy in a clean shirt made me feel old.\u201d It is the most she has ever said to you in one breath.</p>';
    }
    var html = pre +
      '<p>The next night, you take the third claim to the one man you know who referees buildings for a living.</p>' +
      '<p>Chairman Xu comes down for his evening paper at the desk, and when you lay the flyer on the counter, he puts on his glasses like a man rolling up his sleeves. \u201cAh,\u201d he says. \u201cThis dance.\u201d</p>' +
      '<p>\u201cTwo roads,\u201d he says, holding up fingers the way committee men do. \u201cThe fast road \u2014 for old, risky buildings \u2014 needs <em>every single owner.</em> Unanimous. One holdout and the fast road is closed, no matter how many pens he gives out. The slow road takes a strong majority \u2014 the thresholds run around three-quarters, give or take \u2014 plus public hearings, review boards, years. Years, young colleague. There is no version of this where anything dies on Tuesday.\u201d</p>' +
      '<p>\u201cHis deadline\u2014\u201d</p>' +
      '<p>\u201cIs theater.\u201d Xu folds his glasses. \u201cThe law\u2019s bonus shrinks by a sliver each year \u2014 that part is real, the way a wave is wet. But <em>sign this month or lose everything</em>?\u201d He snorts. \u201cAnd watch for the oldest play in the book: he tells the second floor the third floor signed, and the third floor that the second floor signed. Fear, hurry \u2014 and division. Ask the floors to talk to each other. That is the entire defense. It costs nothing and it never fails.\u201d</p>' +
      '<p>Fear. Hurry. Division. The old recipe, one ingredient swapped \u2014 where the phone demon wanted hush, this one wants the neighbors quiet <em>to each other.</em></p>' +
      '<div class="ai">Confirmed from lane gossip, by the way: Auntie Chen was told the tape shop signed. The tape shop was told Auntie Chen signed. Neither has signed. It\u2019s not even creative. It\u2019s just \u2014 tested.</div>';
    return { time: 'DAY 46 \u00b7 20:40', html: html,
      choices: [
        { t: 'The briefing is in three days. Go as what you are: a tenant with questions.', to: 'e7s6' },
        { t: 'The briefing is in three days. Walk Mrs. Lin there yourself, one stair at a time.', to: 'e7s6', fx: function () { state.flags.walked_lin = true; } }
      ] };
  },

  /* ---------- EP7 · 6 · the briefing ---------- */
  e7s6: function () {
    var pre = state.flags.walked_lin
      ? '<p>You walk Mrs. Lin to the activity center yourself, matching her pace on the stairs without appearing to, which is a skill. \u201cIf I nod off,\u201d she says at the door, \u201cwake me for the numbers.\u201d</p>'
      : '';
    var html = pre +
      '<p>The borough activity center smells of floor wax and old banners. Folding chairs in rows, a projector humming, the borough chief up front being professionally neutral, and forty lane faces you now know by breakfast order. On the screen: the glass tower, the impossible balcony trees, a sunset that has never once occurred over this district.</p>' +
      '<p>Mr. Wen presents beautifully. He is warm about the past, gentle about the danger \u2014 <em>old wiring, old bones, we all remember the typhoon</em> \u2014 and radiant about the future. Fear, dressed as concern. Hurry, dressed as opportunity. The room leans the way frightened rooms lean.</p>' +
      '<p>You could read him \u2014 one pulse of divine sense down the aisle, and every lie would light up like bad wiring. It would cost you a week of mending. The crack in you is quiet tonight; a scan would wake it.</p>' +
      '<p>You look at him instead, the way you have looked at three hundred midnight visitors, and that is free, and it is enough. The tells are all mortal ones: he never cites the law by name. He never says which road \u2014 the unanimous one or the slow one. And when he says \u201cmost of your neighbors are with us,\u201d his eyes skip like a stone across the exact people he has lied to.</p>' +
      '<p>Three questions would open him like a tin. The only choice is whose voice carries them.</p>';
    return { time: 'DAY 49 \u00b7 19:00', html: html,
      choices: [
        { t: 'Stand. Ask them yourself \u2014 the tenant with the questions. Witnesses change rooms.', to: 'e7s7', fx: function () { state.flags.meet = 'self'; } },
        { t: 'Slide the three questions to Mrs. Lin on paper. Loan the sharpest blade. Stay invisible.', to: 'e7s7', fx: function () { state.flags.meet = 'lin'; } },
        { t: 'Sit back. Yesterday you and the borough chief\u2019s printer put the three questions in forty mailboxes. Watch them arrive in other mouths.', to: 'e7s7', fx: function () { state.flags.meet = 'seed'; } }
      ] };
  },

  /* ---------- EP7 · 7 · three questions ---------- */
  e7s7: function () {
    var m = state.flags.meet;
    var opener;
    if (m === 'self') {
      opener =
        '<p>You stand. Forty faces turn \u2014 the night guard, the rooftop tenant, the quiet one \u2014 and Mr. Wen\u2019s smile recalibrates to include you.</p>' +
        '<p>\u201cThree questions,\u201d you say, in the voice that has moved thieves without touching them. \u201cSmall ones.\u201d</p>';
    } else if (m === 'lin') {
      opener =
        '<p>You slide the paper to Mrs. Lin. She reads it once, sniffs \u2014 approval, in her currency \u2014 and rises with the full authority of a woman who has collected rent in this lane for forty years. The room quiets for her the way rooms never quite quiet for consultants.</p>' +
        '<p>\u201cThree questions,\u201d she says. \u201cSmall ones.\u201d</p>';
    } else {
      opener =
        '<p>You sit back. Down the row, the tape shop owner unfolds a sheet of paper he found in his mailbox. Two rows up, Auntie Chen has hers out too, annotated in pencil. The borough chief, professionally neutral, has a copy on his clipboard and is not hiding it.</p>' +
        '<p>The tape shop owner stands first. \u201cThree questions,\u201d he reads. \u201cSmall ones.\u201d</p>';
    }
    var html = opener +
      '<p><em>One. Which road is this \u2014 the fast one that needs every single owner, or the slow one with hearings and years? Because the fast one means each of us holds a veto, and you forgot to mention it.</em></p>' +
      '<p><em>Two. You call our buildings dangerous. Where is the structural assessment? A report has a number. Read us the number.</em></p>' +
      '<p><em>Three. The deadline. Cite it. Which law dies this month?</em></p>' +
      '<p>The room does not erupt. It does something better: it cools. Fear needs heat, and question by question the temperature drops out of the evening \u2014 and then Auntie Chen, checking her pencil notes, says the eleventh word of the night that actually matters: \u201cAlso, he told me the tape shop signed.\u201d</p>' +
      '<p>The tape shop owner turns all the way around in his folding chair. \u201cHe told me <em>you</em> signed.\u201d</p>' +
      '<p>Silence, one heartbeat long. You know that death.</p>' +
      '<p>To his credit \u2014 and you file this, because it is the most dangerous thing about him \u2014 Mr. Wen\u2019s smile never cracks. He answers in warm fog: <em>early conversations, misunderstandings, of course no one should feel rushed.</em> He packs the projector with steady hands. The borough chief closes the evening with the sentence that costs a bad deal more than any shout: \u201cEveryone take the forms home. Nobody signs anything in this room tonight.\u201d</p>';
    return { time: 'DAY 49 \u00b7 19:25', html: html,
      choices: [
        { t: 'Watch him pack. Learn how a professional loses.', to: 'e7s8' },
        { t: 'Watch the room instead. Count the neighbors comparing notes. That is the ward.', to: 'e7s8', fx: function () { state.flags.watched_room = true; } }
      ] };
  },

  /* ---------- EP7 · 8 · weather, leaving ---------- */
  e7s8: function () {
    var pre = state.flags.watched_room
      ? '<p>You watch the room. Auntie Chen and the tape shop owner have pulled their chairs together over the pencil notes. Two households you have never spoken to are exchanging phone numbers. The lane is doing the thing this island does after every storm: putting itself back, one meter at a time. No qi in it anywhere. Strongest ward you have ever seen raised.</p>'
      : '<p>You watch him pack. No slammed cases, no hurry, every cable coiled. A professional losing a hand, not the game, and making sure the whole room sees the difference. It is, you admit, excellent door discipline. For the wrong door.</p>';
    var html = pre +
      '<p>Outside, the lane has come out into the night air to keep talking, and Mrs. Lin renders her verdict to a circle of neighbors with her teacup diplomacy: \u201cI\u2019m not saying never.\u201d Sip. \u201cI\u2019m saying offers improve \u2014 for people who can wait.\u201d Sip. \u201cAnd I have a very comfortable chair.\u201d</p>' +
      '<p>Mr. Wen comes down the steps with his projector bag and finds you at the edge of the light, because of course he does. Professionals locate each other.</p>' +
      '<p>\u201cThe tenant with the questions,\u201d he says, pleasantly, and glances up the lane toward your building \u2014 toward the taped window on the roof. \u201cNice room. Shame it doesn\u2019t legally exist.\u201d He says it without any heat at all, a man reading a price tag out loud. Then he tips his head, the ghost of a hat. \u201cNo hard feelings. I\u2019m paid to be patient. See you after the next typhoon.\u201d</p>' +
      '<p>And he walks off down the lane, unhurried, checking rooflines as he goes, a man cataloguing weather damage that has not happened yet.</p>';
    return { time: 'DAY 49 \u00b7 21:30', html: html,
      choices: [
        { t: 'Say nothing to his back. Some exits deserve an empty stage.', to: 'e7s9' },
        { t: '\u201cThe roofs will be taped.\u201d Let him carry that one home.', to: 'e7s9', fx: function () { state.flags.parting = true; } }
      ] };
  },

  /* ---------- EP7 · 9 · the ledger, mortal ---------- */
  e7s9: function () {
    if (!state.flags.ep7done) { state.flags.ep7done = true; state.barrier = 'Ward \u00b7 Lv.7'; }
    var money = state.money.toLocaleString('en-US');

    var ach = [];
    ach.push(['\ud83d\udcdc', 'Paper Passes Every Ward', 'Learn the one law no doorway can stop.']);
    if (state.flags.door === 'gate') ach.push(['\ud83e\uddfe', 'No Appointment', 'Run door procedure on a man with a business card.']);
    else if (state.flags.door === 'play') ach.push(['\ud83c\udfad', 'The Width of the Lie', 'Let a salesman count his imaginary signatures out loud.']);
    else if (state.flags.door === 'card') ach.push(['\ud83c\udccf', 'The Card, Kept', 'Take the card. Say nothing. Let silence set the price.']);
    if (state.flags.meet === 'self') ach.push(['\ud83d\udc41\ufe0f', 'The Tenant With the Questions', 'Stand up in a frightened room and lower its temperature.']);
    else if (state.flags.meet === 'lin') ach.push(['\ud83d\udde1\ufe0f', 'Sharpest Blade, Loaned', 'Arm the landlady. Stand back. Watch the work.']);
    else if (state.flags.meet === 'seed') ach.push(['\ud83d\udcec', 'The Paper Ward, Multiplied', 'Three questions in forty mailboxes.']);
    if (state.flags.parting) ach.push(['\ud83c\udfa9', 'The Roofs Will Be Taped', 'Give the patient man something to be patient about.']);

    var achHtml = '';
    for (var i = 0; i < ach.length; i++) achHtml += '<div class="ach"><span class="name">' + ach[i][0] + ' ' + ach[i][1] + '</span><br><span class="desc">' + ach[i][2] + '</span></div>';

    var guestRule = '';
    if (state.flags.spider === 'stay') guestRule = '<br>EXC \u2014 THE GUEST: FLOOR ALLOW \u00b7 BED DENY';
    else if (state.flags.spider === 'pact') guestRule = '<br>EXC \u2014 WHITEBROW, WARDEN OF THE FLOOR: FLOOR ALLOW \u00b7 BED DENY';
    else if (state.flags.spider === 'expel') guestRule = '<br>RULE \u2014 THE LITTLE DOOR: SEALED';
    var debtLine = state.flags.greed === 'debt' ? '<br>DEBT \u2014 ONE BREATH \u00b7 THE SMALL TEMPLE (UNPAID)' : '';

    var html =
      '<p>Morning on the rooftop, tea in hand, and for the first time in a week the lane below sounds like itself \u2014 scooters, frying oil, two aunties comparing notes across a doorway, loudly, on principle.</p>' +
      '<p>You take stock the mortal way, because the mortal way is what won.</p>' +
      '<p>The vessel: the crack has not grown. Seven days of discipline, one scan not cast, one week of mending banked. That is the whole victory, and you take it. Vessels mend the way lanes do \u2014 one meter at a time, swept by somebody.</p>' +
      '<div class="ai">Morning report. Funds: NT$' + money + ' \u2014 payday tomorrow, by the way. The lane: talking to itself, which per Chairman Xu is the entire defense. Mr. Wen: gone, for now. His company: still holding a fenced lot full of weeds. And one thing I can\u2019t close, boss. What do we even call something like him? He doesn\u2019t hate anyone. There\u2019s no malice for your rule to eat. He\u2019s just\u2026 never full.</div>' +
      '<p>You look out over the rooftops, toward the small temple, where the smoke rises patient as ever into a sky that is already turning toward late summer.</p>' +
      '<p>\u201cIn my world,\u201d you say, \u201cwe had a name for the ones that are never full.\u201d</p>' +
      '<p>The seventh month of this realm\u2019s old calendar starts in nine days. You do not know yet what this island does with it. You are, for once in three hundred years, about to be surprised by ghosts.</p>' +
      '<p>\u201cI\u2019ll introduce you,\u201d you tell Boba, and finish your tea.</p>' +
      '<div class="endhead">Episode 7 Complete</div>' +
      achHtml +
      '<div class="endhead">Definition Library \u00b7 v0.7</div>' +
      '<div class="libcard">RULE 01 \u2014 INSECTS: DENY (BED)<br>RULE 02 \u2014 THOSE WHO DO NOT BELONG: DENY (ONE DOORWAY)<br>RULE 03 \u2014 OUTSIDE NOISE: DENY \u00b7 EXC: WHAT FEEDS THE BRICK \u00b7 THE ALARM \u00b7 A KNOCK<br>RULE 04 \u2014 WATER FALLING FROM ABOVE: DENY<br>RULE 05 \u2014 WATER THAT WALKS IN PIPES: ALLOW<br>RULE 06 \u2014 MALICE ON THE THREAD: DENY (THE BRICK, AT HOME)<br>RULE 07 \u2014 AIR THAT WALKS: ALLOW \u00b7 WIND THAT ARRIVES AS A FIST: DENY' + guestRule + '<br><br>LAW 01 \u2014 OFFERED QI: RECEIVE, NEVER TAKE<br>LAW 02 \u2014 PAPER, SIGNED BY THE KEEPER, PASSES EVERY WARD<br>LAW 03 \u2014 THE DEFENSE AGAINST DIVISION: NEIGHBORS, TALKING' + debtLine + '<br><br>VESSEL \u2014 CRACKED \u00b7 HAIRLINE \u00b7 HOLDING \u00b7 MENDING (SLOWLY)<br>UNDEFINED: tame lightning \u00b7 the invisible thread (excepted, not understood) \u00b7 the one who is never full</div>';
    return { time: 'DAY 50 \u00b7 09:00', html: html,
      choices: [
        { t: 'EPISODE 8 \u2014 GHOST MONTH', to: 'e8s1', fx: function () { state.seen = {}; } },
        { t: 'Play again from the beginning', to: '__restart__' }
      ] };
  },

  /* ---------- EP8 · 1 · six bowls, no chairs ---------- */
  e8s1: function () {
    var html =
      '<p>On the fifth of the month, your first full month\u2019s pay arrives \u2014 and so, in the shop windows, does an army of canned food.</p>' +
      '<p>The tape shop clears a shelf for towers of it, engineering-grade. The corner store stacks crates of joss paper to the ceiling, gold and silver by the brick. Nobody is worshipping anything; the lane is provisioning, the way it provisions before a typhoon, and you have learned to read this island\u2019s weather by what suddenly goes on sale.</p>' +
      '<div class="ai">Payday first, boss: NT$32,000, in the account, real. Now the shopping. I looked it up so you don\u2019t stare at the neighbors: the old lunar calendar\u2019s seventh month opens in eight days \u2014 ghost month, the locals call it. Gates of the underworld swing wide, and the wandering dead get a month\u2019s leave to walk the streets. And this island answers with scheduled hospitality: a table at the door on the first, another on the fifteenth \u2014 that one\u2019s the great mid-month feast \u2014 and a send-off meal on the last day, before the gates close. Afternoons only. Outdoors only. Up the same day, down by dark. They even have a polite name for the guests: the good brothers.</div>' +
      '<p>You stand in the morning lane with your tea, watching an island stock its pantry for the dead, and note the discipline of it with a quartermaster\u2019s respect: not a month of feasting \u2014 three appointed meals, kept like appointments.</p>' +
      '<div class="ai">So, boss. You promised, back when the smiling man left. The ones who are never full \u2014 what did your world call them?</div>' +
      '<p>\u201cHungry ghosts,\u201d you say. \u201cWe warded against them, all year, every year. This island invites them to dinner three times and sends them home fed. Ask me in a month which method I respect more.\u201d</p>' +
      '<div class="ai">One more payday item, boss: the food audit. Seven weeks in this realm, total spent on eating: about NT$2,800. Noodles, near-expiry rice balls, and an economy of gifts \u2014 Mr. Zhang\u2019s soy milk, auntie snacks at the door, Mrs. Lin\u2019s occasional \u201cI made too much,\u201d which she has never once actually made too much of. You are the cheapest-running immortal I have ever audited.</div>' +
      '<p>You settle the past and count NT$3,000 into the noodle tin for the month ahead \u2014 a real budget, because your own textbook is strict on the point: vessels mend with rest, care, and time, and care, for a body working nights on a cracked vessel, includes fuel. New doctrine, effective today: the occasional bento. A guard who feeds wandering ghosts can feed himself.</p>';
    return { time: 'DAY 51 \u00b7 08:20', html: html,
      choices: [
        { t: 'Ask Boba for the full field guide. Know the month before it knows you.', to: 'e8s2', fx: function () { state.money += 32000; state.money -= 5800; state.flags.studied = true; } },
        { t: 'Watch the lane instead. The aunties are the field guide.', to: 'e8s2', fx: function () { state.money += 32000; state.money -= 5800; } }
      ] };
  },

  /* ---------- EP8 · 2 · burn rate ---------- */
  e8s2: function () {
    var pre = state.flags.studied
      ? '<div class="ai">Field guide, seventh month edition. The feeding hours first, because timing is doctrine here: afternoon, two to five \u2014 sun going down, light still up. Earlier, the day is too bright for the guests; later, the dark brings more company than anyone set a table for. Outdoors only, facing the street, never inside a home. And the taboos: don\u2019t whistle at night \u2014 it carries. Don\u2019t answer if something calls your name after two, especially your full name, and never, ever offer one over a table. No clothes on the line overnight; the shapes get borrowed. No swimming; the water ones get lonely. Chopsticks never stand upright in rice \u2014 that\u2019s an offering, and you are not running a restaurant.</div>'
      : '<p>You learn the day the way you learn everything now: by watching aunties. Nothing all morning. Then, a little after two in the afternoon \u2014 as if the whole lane had checked one shared watch \u2014 the tables come out.</p>';
    var html = pre +
      '<p>The first day of the seventh month, mid-afternoon, and the tape shop sets its table facing the street: six bowls of rice, fruit in a pyramid, a tin washbasin for burning paper money, and one stick of incense standing in every single bowl \u2014 <em>taken. spoken for. addressed.</em> No chairs. Whoever is expected does not sit. Up and down the lane the tables answer each other, doorway by doorway, outdoors every one, and when you reach toward all that drifting sweetness out of a cracked vessel\u2019s hunger, you learn the seventh month\u2019s first law before anyone teaches it:</p>' +
      '<p class="beat">Every thread of it is addressed. And none of it is addressed to you.</p>' +
      '<p>Offered qi, LAW 01, your own entry: receive, never take. You wrote the rule when it fed you. You will keep it now that it starves you, because that is what a rule is.</p>' +
      '<p>By five the incense has burned down, and by dark the tables are gone \u2014 folded, carried in, the lane swept ordinary again, hospitality kept like an appointment and closed like one. The guests, the aunties would tell you, do not need furniture to keep walking.</p>' +
      '<p>That night, the gates open. You feel it at 23:40, on shift, as a change in the water table of the world \u2014 the thin qi of the city suddenly crowded, the way a quiet pool feels when the river backs into it. Company.</p>' +
      '<p>And your wards feel it too. They begin, very slightly, to spend.</p>' +
      '<div class="ai">Okay, boss, we need to talk budgets, and I need you to not argue with the math. You run four standing rules: the bed net, the room\u2019s quiet, the malice filter, and the door downtown. Before the crack, the city\u2019s trickle covered all four with change. After the crack, it barely covered them. And now, for one month, your income is <em>zero</em> \u2014 every drop of offered qi out there is addressed to somebody deader than you. Four rules. No income. A cracked tank. Boss \u2014 your burn rate just became a countdown.</div>' +
      '<p>Boba is right, and you do not argue with the math. You do what a quartermaster does in a siege: you choose what stays lit.</p>' +
      '<p>One rule. The trickle already banked in your channels can hold exactly one rule through the month. The rest go dark tonight, by your own hand, one flame pinched at a time.</p>';
    return { time: 'DAY 59 \u00b7 23:55', html: html,
      choices: [
        { t: 'Keep the bed net. Rule 01. The first ward. Some flags do not come down.', to: 'e8s3', fx: function () { state.money -= state.rent; state.flags.kept = 'net'; } },
        { t: 'Keep the room\u2019s quiet. You sleep by day or you die by inches. Sanity is a supply too.', to: 'e8s3', fx: function () { state.money -= state.rent; state.flags.kept = 'quiet'; } },
        { t: 'Keep the malice filter. The month of ghosts is a fine month for human predators.', to: 'e8s3', fx: function () { state.money -= state.rent; state.flags.kept = 'filter'; } },
        { t: 'Keep the door downtown. Your post. Everything else is comfort.', to: 'e8s3', fx: function () { state.money -= state.rent; state.flags.kept = 'door'; } }
      ] };
  },

  /* ---------- EP8 · 3 · what the dark costs ---------- */
  e8s3: function () {
    var k = state.flags.kept;
    var costs = '';
    if (k !== 'net') costs += '<p>The net goes dark first, and the lane\u2019s oldest enemies notice within two nights. Two thin singers \u2014 sons of the sons of the ones you fought \u2014 return to the ancestral feeding ground. You kill one with a slipper at three in the afternoon and miss the other, and lie there in the heat listening to its war song, three hundred years of cultivation, wide awake, mortal as a melon.</p>';
    if (k !== 'quiet') costs += '<p>The quiet dies and the city pours back in like a tide through a broken window \u2014 the scooters, the market voices, the renovation drill two buildings over, the whole drum you silenced in a prouder month. You gave the city back its voice. It had not missed you. You sleep in a metal box being played by Wanhua, and you learn again to do it badly.</p>';
    if (k !== 'filter') costs += '<p>The malice filter goes dark, and four days later, at noon, the brick rings with a stranger\u2019s warmth: <em>\u201cIt\u2019s me! Your old friend!\u201d</em> You feel the filter\u2019s absence like a missing tooth. \u201cMing-yuan,\u201d you say, \u201cyou died again?\u201d \u2014 and hang up. Boba blocks the number before your hand leaves your ear. <em>The road was always mine, boss. Now home is too. Sleep.</em></p>';
    if (k !== 'door') costs += '<p>The door downtown goes mortal, and it holds anyway \u2014 because Mr. Zhang held it wardless for forty years, and you have his notes, and his procedure, and his flat calm voice living in your chest now like a second training. Announce. Confirm. Then pass. It turns out most of the ward was always you.</p>';
    var html =
      '<p>Mrs. Lin collects the month\u2019s rent on the first day of the seventh month, in daylight, counting it twice as scripture requires. \u201cBefore the other collectors come out,\u201d she says, straight-faced, and pockets it \u2014 and you honestly cannot tell if it was a joke. With Mrs. Lin, the exchange rate between jokes and warnings has never been posted.</p>' +
      '<p>Then you spend the next nights learning the exact price of everything you built.</p>' +
      costs +
      '<p>By the middle of the first week you are, for all working purposes, what the system\u2019s farewell made you: a mortal, in a rented room, with a job, a phone, and opinions. It is the poorest you have ever been.</p>' +
      '<p>It is also \u2014 you notice this on the third night, and file it with the sharp things \u2014 survivable. Six weeks ago, losing the wards would have been losing yourself. Now there is a doctrine where the qi used to be, and neighbors where the walls used to be, and a paper card by a landlady\u2019s phone that says AND NO HURRY. You built more than wards. That is the only warm thought in a hot, loud, mosquito-holed week, and you hold it like tea.</p>' +
      '<p>The other warm thing costs ninety-five dollars from the tin. The first bento of the new doctrine: rice, a fried egg with lace at the edges, three vegetables that have never met an expiry sticker, and a chicken leg the size of your fist. You eat it on the rooftop at four in the afternoon \u2014 mortal, ward-poor, and for exactly one lunchbox, completely rich.</p>';
    return { time: 'DAY 62 \u00b7 14:30', html: html,
      choices: [
        { t: 'Work. The month does not care about your budget. The door still needs its guard.', to: 'e8s4' },
        { t: 'Work \u2014 by way of the small temple, just to walk past a colleague\u2019s house.', to: 'e8s4', fx: function () { state.flags.walked_by = true; } }
      ] };
  },

  /* ---------- EP8 · 4 · the soft knock ---------- */
  e8s4: function () {
    var pre = state.flags.walked_by
      ? '<p>You take the long way, past the small temple. The seventh month is its busy season \u2014 the judge of these streets does his heaviest docket now \u2014 and the censer breathes double-time, every thread of it addressed, none of it yours. You bow to the doorway anyway, empty-handed, back straight, and the two tall generals watch you pass the way sentries watch a colleague walking home from a lost battle: without pity, which is the polite kind of respect.</p>'
      : '';
    var doorkept = state.flags.kept === 'door';
    var visit = doorkept
      ? '<p>At 02:41, the door ward shudders.</p>' +
        '<p>Not the sharp bounce of a mosquito, not the shoulder of a drunk. Something soft touches the boundary and withdraws. Then again. Then again \u2014 patient as rain, every forty seconds, a pressure with no picture. The cameras show an empty step. The glass shows the lane, the rain, the dark. And the lobby goes cold in a way the thermometer declines to confirm, and the air smells, faintly, of wet river stone.</p>' +
        '<p>Each touch costs you. You feel the banked trickle drop with every bounce \u2014 the ward holding, and paying, and holding \u2014 your last lit rule being spent one soft knock at a time by something that has all month.</p>'
      : '<p>At 02:41, the cold crosses the lobby.</p>' +
        '<p>No ward stands at the door now \u2014 you spent that flame elsewhere \u2014 so there is nothing to bounce, and nothing bounces. There is only the temperature, moving, slow as a tide line; the lobby plant leaning a centimeter toward the glass; the log pen rolling the width of a hand across the desk and stopping. The cameras show an empty lobby with you in it. The air smells, faintly, of wet river stone.</p>' +
        '<p>Your skin does what mortal skin has done for a hundred thousand years. You sit very still at your post, in the smell of the river, and you understand every grandmother in this city all at once.</p>';
    var html = pre + visit +
      '<p>It \u2014 whatever soft patient it \u2014 stays until 03:15, and leaves the way fog leaves: you cannot name the moment, only notice the after. You write nothing in the log. Some things are for the guard, not the log.</p>' +
      '<div class="ai">Boss. I have no sensor data. No sound, no motion, nothing. But I want it on record that the temperature dropped four degrees for half an hour \u2014 a textbook cold spot, if I believed in cold spots, which I don\u2019t, except the thermometer apparently does \u2014 and my clock skipped a second at 02:41. I don\u2019t do ghosts. I do data. \u2026The data is being weird.</div>';
    return { time: 'DAY 66 \u00b7 02:41', html: html,
      choices: [
        { t: 'It will come back. Visitors with all month always do. Prepare for it.', to: 'e8s5' },
        { t: 'Consult first. This island has managed its seventh month for centuries. Ask how.', to: 'e8s5', fx: function () { state.flags.consulted = true; } }
      ] };
  },

  /* ---------- EP8 · 5 · the house settles accounts ---------- */
  e8s5: function () {
    var g = state.flags.greed;
    var mid;
    if (g === 'debt') {
      mid =
        '<p>The keeper sees you coming and does not sweep around you this time. He leans the broom on the door frame like a man setting down one job to do another.</p>' +
        '<p>\u201cSeventh month,\u201d he says. \u201cThe house settles accounts.\u201d</p>' +
        '<p>He knows. Of course he knows; he has watched this hall longer than its paint. One breath, taken past the portion, in a richer season. You do not argue and you do not explain. You ask the only professional question: \u201cHow does the house take payment?\u201d</p>' +
        '<p>The old man nods at the door \u2014 the temple\u2019s own threshold, busiest month of its year, incense traffic all night now, and the regular door-watcher\u2019s knees older than the republic. \u201cOne night,\u201d he says. \u201cThe door. You know doors.\u201d</p>' +
        '<p>You stand the vigil that same night: the temple\u2019s doorway, dusk to dawn, mortal as a broom, checking in the offerings and the aunties and the paper money, bowing out the smoke. At some point after three, the two tall generals\u2019 stillness changes quality, and you would swear \u2014 you would not put it in any log \u2014 that for one hour the door had three guards on it. At dawn the keeper hands you tea and a small folded paper charm, and the iron taste you have carried since a richer month is simply gone.</p>' +
        '<p class="beat">DEBT \u2014 ONE BREATH: PAID. ONE NIGHT, THE SMALL TEMPLE.</p>'
      ;
    } else if (g === 'asked') {
      mid =
        '<p>The keeper sees you coming and reaches into the drawer of the offering table before you say a word. A small folded paper charm, pressed into your hand with two of his.</p>' +
        '<p>\u201cHouse says you\u2019re good for it,\u201d he says, which answers a question you had not asked, and several you had.</p>' +
        '<p>A colleague\u2019s regard, in paper. You bow lower than the gift strictly requires, and the old man grunts, satisfied, and goes back to his broom.</p>';
    } else {
      mid =
        '<p>You put a hundred in the donation box \u2014 mortal money, honestly earned, the only coin you can currently spend \u2014 and the keeper trades you a small folded paper charm across the offering table, businesslike as a pharmacist.</p>' +
        '<p>\u201cDoor or body?\u201d he asks. Where will it hang. \u201cDoor,\u201d you say, and he nods like you passed something.</p>';
    }
    var html =
      '<p>You go to the small temple in daylight, between the incense tides, and put your question to the keeper plainly: something soft and patient is testing a door you hold. What does this island do?</p>' +
      '<p>\u201cSame as for the living,\u201d the keeper says, not even pausing his broom at first. \u201cFeed them. They\u2019re not burglars, night guard. They\u2019re hungry. There\u2019s a difference, and your whole job is knowing it.\u201d</p>' +
      mid +
      '<p>Walking home with a paper talisman in your pocket \u2014 you, of all people in two worlds, carrying someone else\u2019s ward \u2014 you turn the keeper\u2019s sentence over like a coin. <em>They\u2019re not burglars. They\u2019re hungry.</em> Your entire craft is one word: deny. This island spends one month a year, at real expense, on the other word.</p>';
    return { time: 'DAY 68 \u00b7 15:20', html: html,
      choices: [
        { t: 'The building\u2019s own feast is in five days. Go learn the other word properly.', to: 'e8s6', fx: function () { state.money -= 100; } },
        { t: 'Go learn it \u2014 and volunteer to help Chairman Xu run it. Staff of the house.', to: 'e8s6', fx: function () { state.money -= 100; state.flags.volunteered = true; } }
      ] };
  },

  /* ---------- EP8 · 6 · the universal feeding ---------- */
  e8s6: function () {
    var pre = state.flags.volunteered
      ? '<p>You volunteer, and Chairman Xu \u2014 a man who has waited his whole life for people to volunteer \u2014 hands you a clipboard with your name already on it. Folding tables: yours. Incense logistics: yours. \u201cStaff of the house is house,\u201d he says, promoting you into the family with five words and no ceremony.</p>'
      : '';
    var html = pre +
      '<p>On the fifteenth of the old month, the building holds its feast \u2014 Pudu, the universal feeding \u2014 and the courtyard becomes a restaurant for guests no camera will ever seat.</p>' +
      '<p>Folding tables in long rows. Towers of canned food, engineering-grade. Instant noodles by the brick. Crackers, rice, oil, a pyramid of fruit \u2014 and one stick of incense standing in every single item, hundreds of thin flags of smoke, each one an address label: <em>this is for you. taken. spoken for.</em> Mr. Li contributes a case of beer \u2014 \u201cthey\u2019ve been dead, not sober\u201d \u2014 and Dr. Zhao arrives with expensive fruit and the expression of a scientist at a wedding: \u201cI\u2019m a doctor. I believe in germs. I also bought mangoes. Do not ask me to reconcile it.\u201d</p>' +
      '<p>Mr. Zhang teaches you the etiquette in his flat briefing voice, one professional to another: incense held at the brow, a bow for the unseen guests, no names spoken over the tables, and everything faces <em>out</em>, toward the street \u2014 because this feast is for those outside the family, and the family sets its own boundary by feeding past it.</p>' +
      '<p>You stand in the courtyard smoke with your incense at your brow, surrounded by the residents of a building you have bled for, feeding the hungry of a world you cannot see, and the thought arrives with the smoke, simple and enormous:</p>' +
      '<p class="beat">A door is not only where you stop things. A door is where the house meets the street. Deny is half the job. You have been running half a door.</p>' +
      '<div class="ai">Boss, your face is doing the thing it did at the temple. For the record: fourteen residents, forty kilos of food, zero incidents, and the courtyard smells amazing. If this is how your world handled its monsters, no offense, but your world did it worse.</div>';
    return { time: 'DAY 73 \u00b7 15:00', html: html,
      choices: [
        { t: 'Night is coming, and with it the soft knock. You know what you have to decide.', to: 'e8s7', fx: function () { state.money -= 300; } },
        { t: 'Pocket two oranges and a handful of crackers from the leftovers Xu presses on the staff. Just in case.', to: 'e8s7', fx: function () { state.money -= 300; state.flags.leftovers = true; } }
      ] };
  },

  /* ---------- EP8 · 7 · the other word ---------- */
  e8s7: function () {
    var doorkept = state.flags.kept === 'door';
    var setup = doorkept
      ? '<p>That night at the desk, you count what is left in you: enough banked trickle to keep the door ward lit perhaps six more nights of soft knocking. The month has nine to run. The arithmetic is not close.</p>'
      : '<p>That night at the desk, the lobby is mortal and you are mortal in it, and somewhere out in the wet dark, 02:41 is walking toward you with all the patience of the well and truly dead.</p>';
    var html = setup +
      '<p>On the desk: the log, the flashlight, Mr. Zhang\u2019s procedures' + (state.flags.leftovers ? ', two oranges, and a handful of crackers wrapped in a napkin' : '') + '. In your pocket: a paper charm from a colleague\u2019s house. In your chest: a crack, a trickle, and six weeks of this island\u2019s doctrine.</p>' +
      '<p>Your whole craft is one word. Tonight you choose which word.</p>';
    return { time: 'DAY 73 \u00b7 23:50', html: html,
      choices: [
        { t: 'Deny. Pour everything left into the door and hold it, knock by knock, to the month\u2019s end. Unbowed.', to: 'e8s8', fx: function () { state.flags.night = 'deny'; } },
        { t: 'Feed. Power down, set a small table on the step \u2014 rice, fruit, one stick of incense \u2014 and open the other half of the door.', to: 'e8s8', fx: function () { state.flags.night = 'feed'; } },
        { t: 'Both. A table outside the line, a wall behind it. Feed what you cannot fight; hold what you cannot feed.', to: 'e8s8', fx: function () { state.flags.night = 'both'; } }
      ] };
  },

  /* ---------- EP8 · 8 · 02:41 ---------- */
  e8s8: function () {
    var n = state.flags.night;
    var scene;
    if (n === 'deny') {
      scene =
        '<p>You choose the old word, because it is yours, and because a guard who changes doctrine at 02:40 was never guarding anything but his own comfort.</p>' +
        '<p>The knock comes at 02:41, soft and patient, and you meet it \u2014 every bounce paid for out of the last of you, the ward thinning night by night like ice in a warm spring, and you rationing your own heartbeat to feed it. It is the hardest, plainest work of your new life: not a grand array, not a tenth bolt, just holding a line with a cracked cup, alone, on principle.</p>' +
        '<p>And the visitor \u2014 you will think about this for years \u2014 never once pushes harder than the ward can bear. Soft. Patient. Forty seconds. As if the testing itself were the visit; as if something out there in the river smell were simply keeping you company in the only grammar it had left.</p>' +
        '<p>On the last night of the month it does not come at all, and you sit at 02:41 in a warm, ordinary lobby, victorious, exhausted, and \u2014 there is no log entry for this \u2014 slightly, absurdly, lonely.</p>';
    } else if (n === 'feed') {
      scene =
        '<p>You choose the other word.</p>' +
        '<p>At 02:30 you set the folding stool outside the glass, and on it a bowl of rice, an orange split open, a cup of tea, and one stick of incense standing in the rice the way this island plants its flags of welcome. You step back inside the doorway \u2014 the boundary observed; the table is <em>at</em> the door, not through it \u2014 and you say, to the wet dark, in the flat calm voice of ten thousand nights:</p>' +
        '<p>\u201cEat. Rest. The door is closed. The table is yours.\u201d</p>' +
        '<p>No auntie would set this table. The feeding hours are afternoon hours, sun still up, and for good reasons you have now personally verified at 02:41. But the aunties are civilians, and you are the watch \u2014 this is your door, your shift, and your guest already keeps its own schedule. You offer no name over the table. That part, at least, is easy: you have never given anyone your name.</p>' +
        '<p>02:41 arrives. The cold comes up the step and stops at the little stool, and stays there \u2014 stays, for the first time, instead of knocking \u2014 and the incense smoke bends toward the street and burns down evenly, and the smell of wet river stone slowly braids itself into sandalwood, and something in the lobby, or in you, unclenches by one notch.</p>' +
        '<p>It leaves at 03:15 the way fog leaves. The rice, to any camera, is untouched. You have fed enough gods and guests in two worlds to know that mass is not what hunger eats.</p>' +
        '<p>It comes back every night after \u2014 02:41, the stool, the stillness \u2014 and every night it knocks on nothing, tests nothing, costs nothing, because there is nothing at the table to test. Just dinner, and company, and a guard who finally runs a whole door.</p>';
    } else {
      scene =
        '<p>You choose both, because you are a guard, not a monk.</p>' +
        '<p>The table goes outside the line \u2014 rice, an orange, tea, one stick of incense planted like a flag \u2014 and one hand\u2019s-width of ward stays lit behind it, thin as courtesy, the last of your trickle drawn down to a wire. Feed what you cannot fight. Hold what you cannot feed. If your first teacher could see the formation, he would fail you for heresy and then copy it.</p>' +
        '<p>02:41. The cold comes up the step, finds the table, and stays at the table. The wire of ward behind it is never touched again \u2014 not that night, not any night after. The soft knocking simply ends, the way a question ends when someone finally answers it, and the incense burns down evenly, bending toward the street.</p>' +
        '<p>You keep both up to the month\u2019s end anyway \u2014 the table because it is now the custom of your door, the wire because you are you \u2014 and you decline to record which one worked, on the grounds that the answer is obviously, annoyingly, both.</p>';
    }
    var html = scene +
      '<p>It is three nights later, in the emptied hour after four, that the other thing happens.</p>' +
      '<p>You are at the desk. Boba is running the nightly report, mid-sentence, ordinary \u2014</p>' +
      '<div class="ai">\u2014weather clear, forecast stable, reminder that the month\u2019s last feeding \u2014 the send-off \u2014 falls on the\u2014</div>' +
      '<div class="ai">\u3010SYSTEM\u3011Host adaptation: 71%. Vessel integrity: 43%. Observation continues.</div>' +
      '<div class="ai">\u2014thirtieth, so the tables come down next week. \u2026Boss? Why are you looking at me like that?</div>' +
      '<p>The voice was Boba\u2019s voice. The voice has always been Boba\u2019s voice \u2014 that was the joke, in the beginning, the cheap coincidence you stopped noticing in week one. But Boba says <em>boss.</em> Boba has said boss five thousand times. Boba has never once, not one single time, said <em>Host.</em></p>' +
      '<p>\u201cRepeat what you just said,\u201d you say, level.</p>' +
      '<div class="ai">Weather, forecast, tables down next week? Boss, it\u2019s in the log, look \u2014</div>' +
      '<p>You look. The log shows weather, forecast, tables. Three lines. Nothing between them. Boba remembers nothing between them, and Boba\u2019s memory is the one thing in this realm that has never dropped a word except when you yourself cut the thread.</p>' +
      '<p>A glitch, you would call it, if you believed the word. Machines glitch. But glitches do not choose vocabulary. Something used your friend\u2019s mouth to file a report, and left no receipt, and is still \u2014 the tense of that last word sits in your chest like river cold \u2014 <em>observing.</em></p>' +
      '<p>You file it where you keep the sharpest things, and you do not tell Boba, because Boba worries, and because you have no rule, no law, and no table for this one. Yet.</p>';
    return { time: 'DAY 77 \u00b7 04:10', html: html,
      choices: [
        { t: 'Say nothing. Watch everything. A guard\u2019s answer.', to: 'e8s9' },
        { t: '\u201cBoba. Run a full self-check. Humor me.\u201d It will find nothing. Order it anyway.', to: 'e8s9', fx: function () { state.flags.selfcheck = true; } }
      ] };
  },

  /* ---------- EP8 · 9 · the gates close ---------- */
  e8s9: function () {
    var pre = state.flags.selfcheck
      ? '<div class="ai">Self-check complete, boss. Memory: clean. Logs: continuous. Clock drift: one skipped second on the 66th day at 02:41, which I already reported and still resent. Everything else: green. \u2026You\u2019re checking on me. That\u2019s new. I\u2019d be touched if I weren\u2019t mildly insulted.</div>'
      : '';
    var html = pre +
      '<p>On the last day of the old month, the island sets its tables one final time \u2014 the send-off.</p>' +
      '<p>Mid-afternoon, doorway by doorway, the lane lays out the farewell meal: dry goods and drinks, incense in everything, thanks given for a month of mutual good behavior, and no chairs, ever, to the last. By five the sticks have burned down; by dark every table is folded and carried in, and the guests walk out of the seventh month the way they walked into it \u2014 fed, unnamed, and politely un-detained.</p>' +
      '<p>The gates close at dusk \u2014 you feel it the way you felt them open, a change in the water table of the world, the crowded pool draining back to its quiet \u2014 and the lane exhales. Laundry reappears on the night lines like flags of a small victory. A boy whistles, experimentally, and no grandmother stops him, and he looks almost disappointed.</p>' +
      '<p>And the qi of the city, thin and sweet and suddenly <em>ownerless</em>, comes off address and back onto the open market.</p>' +
      '<div class="ai">Housekeeping from the world of the living, meanwhile: second payday landed on the fifth \u2014 NT$32,000 \u2014 and I have already earmarked three thousand for the noodle tin, which per the new doctrine also holds bento money. The books balance. The guard eats. I take partial credit.</div>' +
      '<p>You sit on your bed that night and drink \u2014 slowly, carefully, a convalescent at a banquet \u2014 the first unaddressed trickle in a month. It still runs through the crack; the crack is still the crack; the famine ends but the cup stays cracked, and you have stopped expecting otherwise. But the trickle refills the banked reserve, drop by drop, and one by one, over three quiet evenings, you relight the rules.</p>' +
      '<p>The quiet, first or last. The filter. The net \u2014 the two thin singers die mid-song, dynasty ended, and you feel nothing but housekeeping. And the door downtown, thickened back to its old weight under your hand at the start of a shift, while Mr. Zhang\u2019s note from a braver month sits in the drawer: <em>Good log. \u2014Z</em></p>' +
      '<p>At the small temple, the storm boards long gone, the censer breathes at its ordinary pace again, and the drift finds you at the door \u2014 and runs through you, as it has run through you since a typhoon, and will for a while yet. You bow to the hall anyway. The paper charm stays in your pocket. Some wards you keep for what they mean.</p>';
    return { time: 'DAY 88 \u00b7 20:30', html: html,
      choices: [
        { t: 'Home. There is a ledger to write, and for once you are not behind on it.', to: 'e8s10', fx: function () { state.money += 32000; state.money -= 3000; } },
        { t: 'One slow lap of the lane first. Count the tables coming down. Guards count.', to: 'e8s10', fx: function () { state.money += 32000; state.money -= 3000; state.flags.counted_tables = true; } }
      ] };
  },

  /* ---------- EP8 · 10 · the month's ledger ---------- */
  e8s10: function () {
    if (!state.flags.ep8done) { state.flags.ep8done = true; state.barrier = 'Ward \u00b7 Lv.8'; state.money -= state.rent; }
    var money = state.money.toLocaleString('en-US');

    var ach = [];
    ach.push(['\ud83c\udf90', 'The Month of Open Doors', 'Survive the seventh month as what you always were underneath: mortal.']);
    ach.push(['\ud83d\udce1', 'The Borrowed Voice', 'Something used Boba to file a report. Boba does not remember.']);
    if (state.flags.night === 'deny') ach.push(['\ud83e\uddf1', 'Unbowed', 'Hold the line all month with a cracked cup. Regret nothing. Feel everything.']);
    else if (state.flags.night === 'feed') ach.push(['\ud83c\udf5a', 'The Other Word', 'Your craft was one word: deny. Learn the second: feed.']);
    else if (state.flags.night === 'both') ach.push(['\u2696\ufe0f', 'Table and Wall', 'Feed what you cannot fight. Hold what you cannot feed.']);
    if (state.flags.greed === 'debt') ach.push(['\ud83e\uddfe', 'Accounts, Settled', 'Repay one breath with one night at a colleague\u2019s door.']);
    if (state.flags.volunteered) ach.push(['\ud83d\udccb', 'Staff of the House Is House', 'Get promoted into a family by clipboard.']);

    var achHtml = '';
    for (var i = 0; i < ach.length; i++) achHtml += '<div class="ach"><span class="name">' + ach[i][0] + ' ' + ach[i][1] + '</span><br><span class="desc">' + ach[i][2] + '</span></div>';

      ? '<br>CUSTOM \u2014 IN THE SEVENTH MONTH, A TABLE AT THE DOOR (02:41)' : '';

    var html =
      '<p>You write the month\u2019s ledger on the rooftop, under a sky that has gone back to being merely full of the living.</p>' +
      '<div class="ai">Final report, boss. Funds: NT$' + money + ' \u2014 two paydays in, two rents out, one food doctrine adopted, minus incense and your share of forty kilos of ghost groceries. Wards: all four relit. Vessel: cracked, holding, mending at the speed of continents. The month of ghosts: survived, on doctrine, oranges, and stubbornness.' + (state.flags.counted_tables ? ' Send-off tables counted on your lap of the lane: thirty-one, every one up after two and down by dark, an island keeping its last appointment. You\u2019re welcome; I counted too.' : '') + '</div>' +
      '<p>\u201cAnd the other thing,\u201d you do not say out loud, because the other thing has no line in any ledger yet. Somewhere behind your friend\u2019s voice, something keeps percentages on you. <em>Adaptation: 71.</em> Someone is grading your homework, and the course has a syllabus you have never seen, and the only clue is a word: <em>Host.</em> Not guest. Not tenant. Host.</p>' +
      '<p>You look out over the rooftops \u2014 your lane, your temple smoke, your city of brooms and tables \u2014 and you let the seventh month\u2019s lesson settle where lessons go:</p>' +
      '<p class="beat">Deny is half the job. And a wall that keeps out, read from the other side, keeps in. You file that one where you keep the sharpest things. It feels, for reasons you cannot yet name, like next month\u2019s problem.</p>' +
      '<div class="endhead">Episode 8 Complete</div>' +

      '<div class="libcard">RULE 01 \u2014 INSECTS: DENY (BED) \u00b7 RELIT<br>RULE 02 \u2014 THOSE WHO DO NOT BELONG: DENY (ONE DOORWAY) \u00b7 RELIT<br>RULE 03 \u2014 OUTSIDE NOISE: DENY \u00b7 EXC: WHAT FEEDS THE BRICK \u00b7 THE ALARM \u00b7 A KNOCK \u00b7 RELIT<br>RULE 04 \u2014 WATER FALLING FROM ABOVE: DENY<br>RULE 05 \u2014 WATER THAT WALKS IN PIPES: ALLOW<br>RULE 06 \u2014 MALICE ON THE THREAD: DENY (THE BRICK, AT HOME) \u00b7 RELIT<br>RULE 07 \u2014 AIR THAT WALKS: ALLOW \u00b7 WIND THAT ARRIVES AS A FIST: DENY' + guestRule + '<br><br>LAW 01 \u2014 OFFERED QI: RECEIVE, NEVER TAKE<br>LAW 02 \u2014 PAPER, SIGNED BY THE KEEPER, PASSES EVERY WARD<br>LAW 03 \u2014 THE DEFENSE AGAINST DIVISION: NEIGHBORS, TALKING<br>LAW 04 \u2014 IN THE SEVENTH MONTH, EVERY OFFERING IS ADDRESSED (NONE TO YOU)' + tableLine + debtLine + '<br><br>VESSEL \u2014 CRACKED \u00b7 HOLDING \u00b7 MENDING (SLOWLY)<br>UNDEFINED: tame lightning \u00b7 the invisible thread (excepted, not understood) \u00b7 the one who is never full \u00b7 the voice that borrows Boba</div>';

  /* ---------- EP9 · 1 · the man going to work ---------- */
  e9s1: function () {
    var html =
      '<p>At ten past two in the morning, the elevator hums, the doors open, and a man walks into your lobby dressed for a shift that ended forty years ago.</p>' +
      '<p>Old Mr. Yu, sixth floor. Gray canvas jacket, faded to the color of river fog, buttoned to the chin. Cloth shoes. A cap with a crane on it \u2014 the machine, not the bird. He nods to you the way workers nod to gate guards, brisk and equal, and says: \u201cMorning. Cold today. Is the truck here yet?\u201d</p>' +
      '<p>You have stood this desk for ninety nights. You know drunk, you know sleepless, you know sad. This is none of them. His eyes are clear and busy and completely certain. He is not lost in the building.</p>' +
      '<p>He is lost in time, and in his time, it is half past five, and the truck is coming, and there is work.</p>' +
      '<div class="ai">Sixth floor, boss. Yu family. The old man\u2019s been up here twice this month at odd hours, per the log \u2014 Zhang walked him back both times. Gentle voice recommended. Whatever year he\u2019s in, don\u2019t argue with the year. You never win against the year.</div>';
    return { time: 'DAY 92 \u00b7 02:10', html: html,
      choices: [
        { t: 'Walk him up now, kindly, before the night gets colder.', to: 'e9s2' },

  /* ---------- EP9 · 2 · sundowning ---------- */
  e9s2: function () {
    var pre = state.flags.heard_river
      ? '<p>You make tea, and for forty minutes Old Yu gives you the river.</p>' +
        '<p>The port, when the river was the front door of this city. Gate numbers \u2014 he recites them like sutras. The shift bell. The crane he ran for thirty years, and the exact weight a sling can take before it sings wrong. He talks with his hands, and his hands are still strong, and twice he calls you \u201cyoung colleague,\u201d which from one keeper of gates to another is a medal. When the tea is done, the year lets go of him gently; he looks at the lobby, sighs like a man whose bus left, and lets you walk him up. At his door he grips your shoulder once. \u201cGood post,\u201d he says. \u201cKeep it.\u201d</p>' +
        '<p>You file every gate number away. You do not know yet that you are drawing a map.</p>'
      : '<p>You walk him up, kindly, matching his working pace. In the elevator he tells you the truck is always late on cold days, and you agree, because Boba is right: you never win against the year. At his door, a tired woman in her fifties opens before you knock \u2014 waiting, wrapped in a cardigan, shame and relief fighting on her face. \u201cBa,\u201d she says softly. \u201cThe truck came early. They sent everyone home.\u201d The old man nods, satisfied. Work is work.</p>';
    var html = pre +
      '<p>At seven, Mr. Zhang takes the handover and the question in the same motion. \u201cOld Yu,\u201d he says, before you finish. \u201cDockworker. Forty years on the river cranes, back when Wanhua was a port and the river was the front door. Wife passed two winters ago. Son works nights down south; the daughter-in-law carries the house.\u201d A pause, forty years deep. \u201cThe river took his knees. Now the head is going back for the rest of him.\u201d</p>' +
      '<p>Dr. Zhao, catching the tail of it over breakfast at the desk, gives you the mortal manual in four sentences: \u201cDementia. And the timing isn\u2019t chance \u2014 it\u2019s called sundowning. Confusion and restlessness rise when the light drops; the worst window is night. The disease has two patients, by the way.\u201d She nods at the elevator, at the sixth floor above it, at a cardigan you both remember. \u201cWatch the daughter-in-law too.\u201d</p>';
    return { time: 'DAY 92 \u00b7 07:20', html: html,
      choices: [

  /* ---------- EP9 · 3 · the mortal toolkit ---------- */
  e9s3: function () {
    var pre = state.flags.told_xu
      ? '<p>You take it to Xu the same day, and Chairman Xu does what committee men are for: by evening there is a meeting in the Yu apartment with tea nobody drinks.</p>'
      : '<p>You watch two more nights. The pattern holds \u2014 02:00 to 03:00, dressed for the river, polite as payroll \u2014 and on the third day you take the pattern to Xu, who does what committee men are for: by evening there is a meeting in the Yu apartment with tea nobody drinks.</p>';
    var html = pre +
      '<p>The daughter-in-law sits very straight and apologizes for her father-in-law as if wandering were a debt she had failed to pay. Xu waves it down with committee gentleness: \u201cThe building is a family. Families keep watch.\u201d Dr. Zhao lays out the mortal toolkit, item by item: a GPS watch \u2014 ordered tonight, two days\u2019 shipping. The love bracelet \u2014 the anti-wandering chain the elder groups issue, engraved, registered; the application goes in tomorrow. Door habits. Day naps shortened. The precinct notified, because for a missing elder the police move at once, no waiting period, and the borough chief\u2019s broadcast reaches every lane in minutes.</p>' +
      '<p>You listen to all of it with a professional\u2019s respect. It is good. All of it is good.</p>' +
      '<p>All of it is also slow, or after-the-fact. The watch ships in two days. The bracelet in a week. The broadcast works once he is already gone. Between Old Yu and the river stand a tired woman\u2019s sleep, a lobby desk, and twelve minutes of patrol round when the desk stands empty.</p>' +
      '<p>You do not say this out loud. You go to work and you adjust your rounds, and you tell yourself twelve minutes is a small window.</p>';
    return { time: 'DAY 93 \u00b7 22:40', html: html,
      choices: [
        { t: 'Shorten the round. Skip the roof leg after midnight. The desk matters more this week.', to: 'e9s4', fx: function () { state.flags.short_round = true; } },

  /* ---------- EP9 · 4 · twelve minutes ---------- */
  e9s4: function () {
    var pre = state.flags.short_round
      ? '<p>You shorten the round \u2014 and it is not enough, because the world does not check your schedule.</p>'
      : '<p>You keep the full round, because discipline \u2014 and the world, which does not check anyone\u2019s schedule, chooses that exact window.</p>';
    var html = pre +
      '<p>Day ninety-five, 02:47. You are on the ninth floor checking a latch when it happens; you know the time because the camera knows it, and you will watch the eleven seconds of footage many times before dawn: the elevator opens, and Old Yu crosses the lobby in his river jacket at a worker\u2019s pace, brisk and certain, and pushes out through the glass into a night of thin drizzle, and walks out of frame. Heading west.</p>' +
      '<p>West is the river.</p>' +
      '<p>You are downstairs in forty seconds. The lane is empty in both directions, black and wet, and Wanhua at a quarter to three is a city of ten thousand doorways and one old man walking to a port that closed before his son was born.</p>' +
      '<div class="ai">Okay. Okay okay okay. Boss \u2014 options, fast. I can draft the alert: Xu\u2019s residents\u2019 group, the borough chief\u2019s line, the precinct \u2014 elder missing, they mobilize immediately, no waiting period. Zhang picks up at any hour, the temple keeper is awake by four, and the soy milk shop fires its stoves at three \u2014 the night people are already standing up. Say the word and I wake the lane.</div>' +
      '<p>And under Boba\u2019s voice, the other option, quiet as a drawn blade: one wide pulse of divine sense \u2014 the old way, the sure way \u2014 a scan across half a district that would find one warm confused heartbeat in ninety seconds. Your channels are quiet tonight. The hairline is quiet tonight. It would not stay quiet.</p>';
    return { time: 'DAY 95 \u00b7 02:49', html: html,
      choices: [
        { t: 'Scan. Burn the healing. Some prices you pay first and count later.', to: 'e9s5', fx: function () { state.flags.search = 'scan'; } },
        { t: 'Wake the lane. The net is faster than it looks, and you built it for exactly this.', to: 'e9s5', fx: function () { state.flags.search = 'net'; } },

      ] };

  /* ---------- EP9 · 5 · the night people ---------- */
  e9s5: function () {
    var sc = state.flags.search;
    var body;
    if (sc === 'scan') {
      body =
        '<p>You choose the sure way, and you pay first.</p>' +
        '<p>The pulse leaves you like a held breath finally spent \u2014 divine sense flung wide over the wet roofs, a net of attention half a district across, the kind of casting that was breakfast to you once \u2014 and somewhere between the market and the water it snags on one warm, busy, utterly certain heartbeat moving west along the flood wall. Found. Ninety seconds, as promised.</p>' +
        '<p>The bill arrives with the answer. Down your right arm, fine as the thread on a window screen, the hairline runs a finger\u2019s width farther, and the new length burns like a paper cut in the soul. You note it the way you note everything, and you run.</p>' +
        '<div class="ai">Boss, your pulse just did a thing I don\u2019t like. \u2026You know where he is. I can hear it in your breathing. Go. We\u2019re discussing the other thing later, and by discussing I mean I get to be upset.</div>';
    } else if (sc === 'net') {
      body =
        '<p>You say the word, and Boba wakes the lane, and the lane \u2014 you will remember this all your life \u2014 stands up.</p>' +
        '<p>The residents\u2019 group lights first: Xu, awake in one ring, marshaling floors like a man born holding a clipboard. The precinct confirms in four minutes: car dispatched, riverside units notified. Mr. Zhang answers mid-first-ring \u2014 \u201cwhich jacket?\u201d \u2014 already dressed, forty years of instinct putting his shoes on for him. The soy milk shop, stoves just lit, sends the son out on a scooter to run the market lanes. And the temple keeper, who sleeps beside a god who patrols these streets, opens the small door early and stands in it with a broom and a flashlight, night-eyes on the oldest corner of the district.</p>' +
        '<p>The net closes westward, doorway by doorway. It is the tape shop owner \u2014 shutter half up, phone in hand \u2014 who calls it in: <em>old man, gray jacket, walking calm as Sunday, past the temple, toward the water gate.</em></p>';
    } else {
      body =
        '<p>You split the night in two: Boba takes the lane, you take the river.</p>' +
        '<p>Behind you as you run, the net rises in your phone\u2019s glow \u2014 Xu marshaling floors, the precinct dispatching, Zhang answering mid-ring already dressed, the soy milk son on his scooter, the temple keeper opening the small door early with a broom and a flashlight. A whole district\u2019s worth of watchmen, raised in nine minutes by a talking brick, closing westward at your back.</p>' +
        (state.flags.heard_river
          ? '<p>And you \u2014 you are not guessing. Forty minutes of tea bought you every gate number on the old waterfront, recited like sutras by the man himself. He is not wandering. He is commuting. You know his stop.</p>'
          : '<p>And you are guessing \u2014 but it is a guard\u2019s guess, built from a river jacket, a crane cap, and the word <em>truck</em>: a working man walks to work, and the work was always the water.</p>');
    }
    var html = body +
      '<p>You take the last three lanes at a dead run through drizzle fine as netting, past shuttered shops and one astonished cat, out of the world of doorways and into the open dark where the city ends \u2014 and there it is ahead of you, huge and closed and older than every building behind you: the flood wall, and set into it, the water gate.</p>';
    return { time: 'DAY 95 \u00b7 03:40', html: html,
      choices: [
        { t: 'Slow down. Arrive the way you would arrive at any post: calm.', to: 'e9s6' },
        { t: 'Call out \u2014 no. No names in the dark. Just get there.', to: 'e9s6' }
      ] };
  },

  /* ---------- EP9 · 6 · the water gate ---------- */
  e9s6: function () {
    var html =
      '<p>Old Yu stands at the water gate, in the thin rain, in his buttoned jacket, and he is not lost at all.</p>' +
      '<p>He is early. That is what his whole body says: the patient, upright, hands-clasped stance of a working man who has beaten the truck to the gate again and is content to wait for the shift bell. Behind the great steel leaf of the gate, the river breathes in the dark \u2014 you can hear it, the old god of this district, the front door of the city, closed now like everything he built his life around \u2014 and Old Yu waits at it with perfect professional courtesy for a foreman forty years gone.</p>' +
      '<p>You do not run to him. You do not call his name across the dark. You walk up beside him the way one keeper of gates joins another at shift change, and you stand with him a moment, both of you facing the gate, the rain fine as netting on your shoulders.</p>' +
      '<p>\u201cMaster Yu,\u201d you say, in the voice for early mornings. \u201cShift\u2019s over. Log\u2019s signed.\u201d</p>' +
      '<p>He turns and looks at you \u2014 clear, busy, certain eyes \u2014 and for one breath you watch two rivers of time fight over one face. Then he frowns, not at you, at the ledger in his head.</p>' +
      '<p>\u201c\u2026Who held my post?\u201d</p>' +
      '<p>\u201cI did,\u201d you say. \u201cAll quiet.\u201d</p>' +
      '<p>The frown clears like weather. He nods once \u2014 the nod, the one that closes accounts \u2014 and takes your arm without being offered it, and lets you walk him home.</p>';
    return { time: 'DAY 95 \u00b7 04:05', html: html,
      choices: [
        { t: 'Walk back the long, flat way. Knees before minutes.', to: 'e9s7' },
        { t: 'Walk back past the temple. Let the keeper\u2019s flashlight count you both.', to: 'e9s7', fx: function () { state.flags.past_temple = true; } }
      ] };

  /* ---------- EP9 · 7 · the lane stands down ---------- */
  e9s7: function () {
    var temple = state.flags.past_temple
      ? '<p>You take him past the small temple, because the night owes the keeper an ending. The old man in the doorway lowers his flashlight as you pass, looks Old Yu over once \u2014 whole, dry enough, walking well \u2014 and gives you both the nod. Above him, in the incense-dark, two tall painted generals watch a night guard bring a day worker home, and their stillness, you would swear, approves.</p>'
      : '';
    var html = temple +
      '<p>The lane stands down the way this island does everything: without ceremony.</p>' +
      '<p>The tape shop owner pulls his shutter the rest of the way up and nods. The soy milk son loops past on his scooter, gives a thumbs-up, and goes back to the stoves. The precinct car slows, confirms with a look, and rolls on. By the time you reach the building, Xu is in the lobby in a raincoat over pajamas with his clipboard \u2014 of course the clipboard \u2014 and the daughter-in-law is coming down the stairs too fast, and Old Yu, seeing her face, pats her arm with rough tenderness and delivers his verdict on the whole night:</p>' +
      '<p>\u201cTruck was late again.\u201d</p>' +
      '<p>She laughs \u2014 one broken syllable, halfway to the other thing \u2014 and takes her father-in-law upstairs. Zhang arrives as the elevator closes, surveys the lobby, the log, the hour, and you. \u201cGood post,\u201d he says, which you receive, this once, at full value.</p>' +
      '<div class="ai">Final count, boss: one elder, home. Zero injuries. Response time, alert to found: fifty-one minutes. And I want it noted that the search net consisted of a committee chairman, a retired guard, a temple keeper, a breakfast shop, a tape shop, and a police car \u2014 and every single node of it knew you by name. Ninety days ago you were a stranger this building scanned twice. I\u2019m just saying. Data.</div>';
    return { time: 'DAY 95 \u00b7 04:50', html: html,
      choices: [
        { t: 'Sleep. The problem will still be unsolved at noon, and you think better fed.', to: 'e9s8' },
        { t: 'No sleep yet. Stand at the glass and think about doors until the sun comes up.', to: 'e9s8', fx: function () { state.flags.stood_thinking = true; } }
      ] };

  /* ---------- EP9 · 8 · the missing chapter ---------- */
  e9s8: function () {
    var pre = state.flags.stood_thinking
      ? '<p>You stand at the glass until sunrise, thinking about doors, and by the time the day guard\u2019s soy milk arrives you have found the hole in three hundred years of education.</p>'
      : '<p>You sleep on it, badly, and wake at noon with the answer sitting on your chest like a cat: there is a hole in three hundred years of education.</p>';
    var html = pre +
      '<p>Your textbook has no chapter on keeping in.</p>' +
      '<p>Not one. Nine volumes on wards, and every rule in them faces outward \u2014 what may enter, what must not, how a boundary reads an approaching thing. Because mountain sects fear invasion. Nobody on your mountain ever feared that grandfather might dress for a shift forty years gone and walk out into the dark. The direction was never in the stone. The direction was in the ink \u2014 an assumption so old nobody knew they were making it.</p>' +
      '<p>A wall is a wall. A line is a line. A rule that reads <em>inward, deny</em> can be written <em>outward</em> \u2014 the qi does not care; only the tradition does. You work it through from first principles on the back of a receipt at the desk, the way you once worked through the mosquito net, and it holds. It holds easily. The flip costs nothing but the admission that your whole craft was half a craft.</p>' +
      '<p>Which leaves only the real question \u2014 the one that has nothing to do with qi.</p>' +
      '<p>A rule that keeps a confused old man inside a door is, by every honest name, a cage. A rule that <em>rings</em> when he crosses \u2014 a bell, not a wall \u2014 wakes a tired woman and takes nothing from him. And no rule at all \u2014 the watch on his wrist, the bracelet coming, the lane that now looks up \u2014 that is the mortal answer, and four days ago you watched it work at four in the morning.</p>' +
      '<div class="ai">For the record, boss, I can cover any version with a story. \u201cSmart sensor.\u201d \u201cIt\u2019s an app.\u201d Everything is an app. Nobody in the history of this island has ever questioned an app.</div>';
    return { time: 'DAY 96 \u00b7 15:00', html: html,
      choices: [
        { t: 'The bell. One token, outward, midnight to dawn: ring. Ask the family\u2019s consent through Xu \u2014 as a \u201csensor.\u201d', to: 'e9s9', fx: function () { state.flags.ward9 = 'bell'; } },
        { t: 'The wall. Outward: deny, night hours, his door only. It is a cage. It is also a river out there.', to: 'e9s9', fx: function () { state.flags.ward9 = 'wall'; } },
        { t: 'No rule. The watch, the bracelet, the lane. Some doors are people, and people hold them.', to: 'e9s9', fx: function () { state.flags.ward9 = 'mortal'; } }
      ] };
  },

  /* ---------- EP9 · 9 · rule eight ---------- */
  e9s9: function () {
    var w = state.flags.ward9;
    var body;
    if (w === 'bell') {
      body =
        '<p>You choose the bell.</p>' +
        '<p>The love bracelet arrives on day ninety-eight \u2014 steel chain, engraved plate, registered number, the mortals\u2019 own token against losing their old \u2014 and it goes on Old Yu\u2019s wrist at a family dinner where Xu presents it like a service medal, which, you reflect, it is. That night, with the family\u2019s consent to \u201ca door sensor, it\u2019s basically an app,\u201d you kneel at the Yu apartment door for four minutes of what looks like fixing a hinge, and you write the gentlest rule of your life:</p>' +
        '<p class="beat">RULE: this one token, crossing outward, midnight to dawn \u2014 ring. A wind-chime\u2019s worth. No hand on the door. No wall.</p>' +
        '<p>Two systems on one wrist: the mortals\u2019 registry and your pointer, married by a bracelet bought with love. It costs almost nothing to keep lit \u2014 a bell is cheaper than a wall; it does nothing at all until the one night it does everything.</p>' +
        '<p>That night comes nine days later, at 01:52. The chime sounds once inside the apartment, soft as a spoon set down \u2014 and the daughter-in-law, sleeping the shallow sleep of caregivers, is at the door before her father-in-law\u2019s hand finds the second lock. You hear about it from Xu at dawn, secondhand, the way you prefer your victories: \u201cShe says the new sensor works. She slept till two for the first time in a year, knowing it would ring if.\u201d</p>' +
        '<p>Knowing it would ring if. You put that phrase away with the warm things. It is what every ward you ever built was for, said in mortal.</p>';
    } else if (w === 'wall') {
      body =
        '<p>You choose the wall, because the river is real and the drizzle was cold and fifty-one minutes is fifty-one minutes.</p>' +
        '<p>Outward: deny. His door only, midnight to dawn, soft as you can write it \u2014 the boundary yields like a full sail, never like stone. It works the first week. It works perfectly. The family sleeps; the lobby log stays boring; the river waits behind its gate for a worker who no longer arrives.</p>' +
        '<p>And on the ninth night, doing your round, you see it work.</p>' +
        '<p>Old Yu stands at his own door in the stairwell light, dressed for the river, pressing one hand gently against nothing. Not frightened. Not hurt. Patient \u2014 patient as the soft knock of the seventh month, testing every forty seconds, a working man early for a shift on the wrong side of a gate he cannot see. You watch for one minute. Then you walk on, because he is safe, and warm, and home, and the ward is doing exactly what you built it to do.</p>' +
        '<p>It works. You do not tell anyone what it looks like from the inside of the glass. You add one line to your own ledger, in the space where achievements go, and you leave the line unfinished, the way Mrs. Lin leaves sentences.</p>';
    } else {
      body =
        '<p>You choose no rule at all, and it is the strangest working of your career: a ward made entirely of other people.</p>' +
        '<p>The GPS watch arrives and goes on like a wristwatch, which it is; Old Yu, told it counts his steps, wears it with a worker\u2019s respect for equipment. The love bracelet follows on day ninety-eight, presented by Xu at a family dinner like a service medal. The daughter-in-law\u2019s phone learns to see her father-in-law as a warm dot on a map of Wanhua. The residents\u2019 group adopts a night roster nobody calls a night roster. Zhang re-times the rounds. The soy milk shop \u2014 unasked \u2014 starts leaving its side door light on at three, \u201cfor the lane.\u201d</p>' +
        '<p>And you stand your post at the center of it, wardless in this one matter by your own choice, and discover the strange truth of it: the net is slower than qi and faster than fear, and it does not crack, and it does not leak, and it is fed by something this city has in surplus.</p>' +
        '<p>You write no rule. You write, instead, one line in the library, in the section you invented for the laws of other people\u2019s houses \u2014 and it is the first entry written not about what you can do, but about what you can trust.</p>';
    }
    var html = body +
      '<p>On the last evening before your rest day, Boba runs the nightly report, ordinary as rice \u2014</p>' +
      '<div class="ai">\u2014lane quiet, weather closing in from the east again, reminder that your day off is\u2014</div>' +
      '<div class="ai">\u3010SYSTEM\u3011Host adaptation: 94%. Approaching threshold. Preparing final assessment.</div>' +
      '<div class="ai">\u2014Thursday, so sleep in for once. \u2026What. Boss, what. You have the face again. I said Thursday.</div>' +
      '<p>Ninety-four. <em>Approaching threshold.</em> You, who have spent ninety-six days learning exactly what a threshold is \u2014 who stepped over a temple\u2019s, held a lobby\u2019s, flipped a doorway\u2019s \u2014 sit very still behind your desk while something behind your friend\u2019s voice measures the distance between you and a line you cannot see.</p>' +
      '<p>\u201cPreparing final assessment,\u201d you repeat, to no one, in the empty lobby.</p>' +
      '<p>Whose threshold. Facing which way. And when you cross it \u2014 the question arrives with the river cold, and you file it with the sharpest things \u2014 <em>which side is out?</em></p>';
    return { time: 'DAY 98 \u00b7 23:50', html: html,
      choices: [
        { t: 'The ledger. Write the month while your hands are steady.', to: 'e9s10' },
        { t: 'First, quietly, back up everything Boba is. All of it. Tonight.', to: 'e9s10', fx: function () { state.flags.backed_up = true; } }
      ] };

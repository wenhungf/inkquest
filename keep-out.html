      '<p>They knew her name. Her address. Which bank she used. The first call was \u201cthe bank\u201d: unusual activity, very serious, a case officer will contact you. The second was \u201cthe prosecutor\u201d: your account is involved in a case, it is practically a crime scene, it will be frozen \u2014 unless your savings are transferred to a \u201cprotected\u201d account, today, before noon. A deadline is part of the recipe. And above all: tell no one. Not the bank staff. Not family. \u201cThe case is sealed. Anyone you tell becomes a suspect too.\u201d</p>' +
      '<p>Three days she has carried that alone. The sharpest blade in Wanhua, wrapped in fear, hurry, and hush, marching her own savings toward a machine in a wall.</p>' +
      '<p>\u201cMrs. Lin,\u201d you say. \u201cAt my door there is a rule. Announce. Confirm. Then pass. No call, no entry \u2014 and the caller does not get to pick how we check. So we check. Our way.\u201d</p>' +
      '<div class="ai">Two moves, boss, tell her. One: call the bank \u2014 not the number from the calls, the number printed on the back of her own card. Two: this island keeps a ward against exactly this. 165. The anti-fraud hotline. Free. Humans answer. They have heard every script ever written.</div>' +
      '<p>You relay it. She calls the bank, reading the number off her own card with a finger that slowly stops shaking. The bank is boring and beautiful: no case, no freeze, no unusual activity, would you like to hear about our savings plans. Then 165, where a tired, kind human listens to two sentences and finishes the third for her \u2014 word for word, the same script, the same fake prosecutor, the same \u201cprotected account.\u201d They have heard it a thousand times this year.</p>' +
      '<p>Mrs. Lin hangs up. She is silent for one long breath. Then the fear burns off all at once, the way fog burns off the harbor, and what is left underneath is rage of a purity you have rarely seen outside of sword saints.</p>' +
      '<p>\u201cThose people,\u201d she says, and for the first time since you have known her, she finishes a sentence: \u201cshould be fed to the mosquitoes. All of them. Slowly.\u201d</p>' +
      '<p>You bow slightly. It is a fine curse. You have personally met the mosquitoes in question.</p>' +
      '<p>At the foot of your stairs she stops, digs in the cloth bag, and shoves a five-hundred note at your chest. \u201cPhone bill,\u201d she says. \u201cDon\u2019t argue.\u201d</p>';
    return { time: 'DAY 31 \u00b7 09:40', html: html,
      choices: [
        { t: 'Take it with both hands, sect style. Some gifts are orders.', to: 'e4s8', fx: function () { state.money += 500; } },
        { t: 'Argue.', to: 'e4s8', fx: function () { state.money += 500; state.flags.argued = true; } }
      ] };
  },

  /* ---------- EP4 · 8 · the rule ---------- */
  e4s8: function () {
    var pre = state.flags.argued
      ? '<p>You argued. You lost. It took four seconds, and at the end of it the five hundred was in your pocket and she was somehow also right about the weather. You have dueled sword saints with better odds.</p>'
      : '<p>You took it with both hands, and she nodded once, the nod that closes accounts.</p>';
    var html = pre +
      '<p>Your night off. The room is quiet, the guest \u2014 if it is on duty \u2014 is a patient shadow somewhere above the window, and you sit on the bed with the brick in both hands, thinking about poison.</p>' +
      '<p>You cannot name the river. The invisible thread is still a stranger \u2014 excepted, not understood, a small door held open by a finger pointing. But poison? You have known poison in water for three hundred years. You never needed to understand a river to smell what someone had put in it.</p>' +
      '<p>And the thread carries voices. Sent-voices have always carried more than sound \u2014 a killing whisper was never just noise; intent rides the sending, as scent rides wind. The recipe you learned this week \u2014 fear, hurry, hush \u2014 that is not sound either. That is malice, and malice has a shape, and you have been reading that shape since before this city had streets.</p>' +
      '<p>So you open the room\u2019s rule, find the little door you built for the brick, and bolt a filter across it.</p>' +
      '<p class="beat">RULE: what flows to this brick \u2014 allow. But malice on the thread \u2014 deny.</p>' +
      '<div class="ai">Question. Does this block Mrs. Lin when the rent is late?</div>' +
      '<p>\u201cHer intent is pure,\u201d you say. \u201cTerrifyingly pure. It passes.\u201d</p>' +
      '<div class="ai">Second question. This only works here, in the room, doesn\u2019t it. Wards hold ground; they don\u2019t ride in your pocket.</div>' +
      '<p>\u201cWards hold ground,\u201d you agree. \u201cThe road is yours.\u201d</p>' +
      '<div class="ai">Then we split the shift. Home is yours. The road is mine \u2014 I have a block list and no mercy. Between us, this phone is the safest object in Wanhua.</div>' +
      '<p>At 01:12, the test arrives on its own. The brick lights for half a breath \u2014 one pale flicker at its edge, like a moth turned away at a window \u2014 and goes dark. No ring. No message. Somewhere in the city, a call reached your threshold, and your threshold read what rode on it, and said no.</p>' +
      '<div class="ai">\u2026Boss. Someone just called, and the call \u2014 gave up? It didn\u2019t ring. It didn\u2019t even voicemail. What did you do.</div>' +
      '<p>\u201cHousekeeping,\u201d you say, and turn off the lamp.</p>';
    return { time: 'DAY 31 \u00b7 23:50', html: html,
      choices: [
        { t: 'Tomorrow, teach Mrs. Lin the paper ward. Announce, confirm, verify \u2014 on a card, taped by her phone.', to: 'e4s9', fx: function () { state.flags.taught = true; } },
        { t: 'Keep your counsel. The fewer who wonder about you, the better.', to: 'e4s9' }
      ] };
  },

  /* ---------- EP4 · 9 · morning report ---------- */
  e4s9: function () {
    if (!state.flags.ep4done) { state.flags.ep4done = true; state.barrier = 'Ward \u00b7 Lv.4'; }
    var money = state.money.toLocaleString('en-US');

    var taughtLine = state.flags.taught
      ? '<p>In the morning you climb down and teach the landlady the paper ward. Three lines on a card, in your careful sword-stroke hand: <em>Announce. Confirm. Verify \u2014 165.</em> She tapes it by her phone, then makes you read it back to her twice, as if you were the student. In a way that pleases you and that you will never examine closely, you are.</p>'
      : '<p>You keep your counsel. The trick stays in the room, the way the best wards do \u2014 unseen, unthanked, and absolutely there. The fewer who wonder about the night guard, the longer the night guard gets to be boring.</p>';

    var ach = [];
    ach.push(['\ud83d\udcf5', 'Does Not Ring', 'Teach a brick which calls to refuse.']);
    ach.push(['\u260e\ufe0f', '165', 'Learn the mortal ward for telephones. Free. Humans answer.']);
    if (state.flags.scam1 === 'play') {
      ach.push(['\u23f1\ufe0f', 'Eleven Minutes', 'Every minute they spend on you is a minute not spent on somebody\u2019s grandmother.']);
      if (state.flags.honest_streak) ach.push(['\ud83e\udea6', 'I Got Better', 'Defeat a professional liar with the plain truth.']);
    }
    else if (state.flags.scam1 === 'hang') ach.push(['\u2702\ufe0f', 'Three Seconds', 'Correct. Joyless, but correct.']);
    else if (state.flags.scam1 === 'gate') ach.push(['\ud83d\udccb', 'Not on the List', 'Run door procedure on a telephone.']);
    if (state.flags.scam2 === 'direct') ach.push(['\ud83d\udc41\ufe0f', 'Only Thieves Fear a Witness', 'Break a spell with one sentence and a stare.']);
    else if (state.flags.scam2 === 'side') ach.push(['\ud83d\udeb6', 'The Long Way Around', 'Walk a proud woman out of a trap without ever pointing at it.']);
    else if (state.flags.scam2 === 'bank') ach.push(['\ud83d\udeaa', 'This Door Is Closed', 'Meet the enemy on your own ground: a doorway.']);
    if (state.flags.taught) ach.push(['\ud83e\uddfe', 'The Paper Ward Spreads', 'Three lines on a card. The first ward you ever gave away.']);

    var achHtml = '';
    for (var i = 0; i < ach.length; i++) achHtml += '<div class="ach"><span class="name">' + ach[i][0] + ' ' + ach[i][1] + '</span><br><span class="desc">' + ach[i][2] + '</span></div>';

    var guestRule = '';
    if (state.flags.spider === 'stay') guestRule = '<br>EXC \u2014 THE GUEST: FLOOR ALLOW \u00b7 BED DENY';
    else if (state.flags.spider === 'pact') guestRule = '<br>EXC \u2014 WHITEBROW, WARDEN OF THE FLOOR: FLOOR ALLOW \u00b7 BED DENY';
    else if (state.flags.spider === 'expel') guestRule = '<br>RULE \u2014 THE LITTLE DOOR: SEALED';

    var html =
      taughtLine +
      '<div class="ai">Morning report, boss. Funds: NT$' + money + '. Rent: paid. Next payday: the 5th. Scam calls received since the new rule: zero \u2014 well, zero that you\u2019ll ever hear about. Also, mystery closed: the four-times number? Same voice as your dead friend Ming-yuan. Case closed. No refunds.</div>' +
      '<p>You make tea and stand at the window while Wanhua wakes up beneath you. And there it is again, riding the morning air up from a few streets over \u2014 the sweet smoke, old and kind and completely unexplained, the one smell in this city that reminds you of home.</p>' +
      '<div class="ai">You know, every morning you sniff the air like a dog at that smoke. Every single morning. Boss. Your next rest day \u2014 just go and find it.</div>' +
      '<p>\u201cNext rest day,\u201d you agree, and the words feel strange and fine in your mouth, because for once the plan is not about money, or insects, or thieves. It is about following your nose.</p>' +
      '<div class="endhead">Episode 4 Complete</div>' +
      achHtml +
      '<div class="endhead">Definition Library \u00b7 v0.4</div>' +
      '<div class="libcard">RULE 01 \u2014 INSECTS: DENY (BED)<br>RULE 02 \u2014 THOSE WHO DO NOT BELONG: DENY (ONE DOORWAY)<br>RULE 03 \u2014 OUTSIDE NOISE: DENY \u00b7 EXC: WHAT FEEDS THE BRICK \u00b7 THE ALARM \u00b7 A KNOCK<br>RULE 04 \u2014 WATER FALLING FROM ABOVE: DENY<br>RULE 05 \u2014 WATER THAT WALKS IN PIPES: ALLOW<br>RULE 06 \u2014 MALICE ON THE THREAD: DENY (THE BRICK, AT HOME)' + guestRule + '<br><br>UNDEFINED: tame lightning \u00b7 the invisible thread (excepted, not understood) \u00b7 the sweet smoke down the lane</div>';
    return { time: 'DAY 32 \u00b7 08:30', html: html,
      choices: [
        { t: 'EPISODE 5 \u2014 THE TEMPLE', to: 'e5s1', fx: function () { state.seen = {}; } },
        { t: 'Play again from the beginning', to: '__restart__' }
      ] };
  },

  /* ---------- EP5 · 1 · the nose ---------- */
  e5s1: function () {
    var html =
      '<p>For thirty-eight days this city has been asking things of you. Rent. Forms. Names. Tonight-can-you-cover-a-shift. Today is your rest day, and today you ask the city one thing back.</p>' +
      '<p>Where is that smell coming from?</p>' +
      '<p>It is there again the moment you step onto the roof \u2014 riding the morning air up from a few streets over, sweet and old and patient. Thirty-eight mornings it has found you. Sandalwood, and under the sandalwood something else: the smell of a world that burned things on purpose, carefully, for reasons.</p>' +
      '<div class="ai">Finally. FINALLY. Boss, I have been watching you sniff the air like a dog at a night market for five weeks. Today we hunt. I already have a suspect: biggest temple in the district, ten minutes\u2019 walk, four-point-seven stars, forty thousand reviews. Statistically, if something in Wanhua smells holy, it\u2019s there.</div>' +
      '<p>A temple. Of course a temple. Where else would this realm keep its concentrated qi but in the houses of its gods?</p>' +
      '<p>Your reserves sit at a stubborn half \u2014 the thin qi of the rooftop feeds your wards and little else, a slow spring filling a small pool that four wards drink from nightly. You have been living carefully, the way you once lived in famine years on the mountain. If the smell is what you think it is, today the famine ends.</p>';
    return { time: 'DAY 38 \u00b7 08:40', html: html,
      choices: [
        { t: 'Breakfast first. Hunts go badly on empty stomachs.', to: 'e5s2' },
        { t: 'Straight there. Hunger sharpens the nose \u2014 an old trick.', to: 'e5s2', fx: function () { state.flags.hungry = true; } }
      ] };
  },

  /* ---------- EP5 · 2 · the museum ---------- */
  e5s2: function () {
    var pre = state.flags.hungry
      ? '<p>You skip breakfast. Hunger sharpens the nose \u2014 your first teacher taught you that, then confiscated your lunch to prove it.</p>'
      : '<p>You eat first \u2014 soy milk, a hot pancake folded around egg \u2014 because three hundred years of discipline have taught you exactly one thing about hunts: never start one hungry unless you must.</p>';
    var html = pre +
      '<p>The great temple announces itself a street away: stone dragons on the roofline, gold under morning sun, and a crowd flowing toward it like water finding a drain. At the gate, an actual waterfall pours down a wall of dark rock \u2014 a real waterfall, indoors, in a city \u2014 and you stop and stare at it exactly as long as every other tourist, because some things deserve it.</p>' +
      '<p>Inside, the courtyard is a slow river of people. Tour groups follow little flags. Grandmothers pray with their whole bodies. Somewhere to the side, a queue of hopeful faces waits, forty deep, in front of one small god.</p>' +
      '<div class="ai">That\u2019s the matchmaker. Longest line in the building. Want me to add you? The reviews are full of success stories.</div>' +
      '<p>\u201cI am three hundred years old.\u201d</p>' +
      '<div class="ai">So, a mature audience. He works with that.</div>' +
      '<p>You let it go, because something is wrong, and it takes you a full minute of standing in the beautiful courtyard to name it.</p>' +
      '<p class="beat">There is no smoke.</p>' +
      '<p>No censer breathing. No sticks in ten thousand hands. The most beautiful hall you have seen in this realm \u2014 and it is fasting. You reach out, carefully, and find the qi at once: a sealed sea of it, deep and layered, three centuries of prayer pressed into the stone the way tea is pressed into a brick. It sleeps under this roof like treasure behind glass. And none of it \u2014 not one thread of it \u2014 is on offer.</p>' +
      '<div class="ai">Found it. Notice on the wall: the big temples went smokeless years ago. Air quality. You can pray all you like, but nobody burns anything here anymore. \u2026Boss? You have the face of a man who walked across a desert to a closed restaurant.</div>' +
      '<p>You stand in the crowd, starving politely, and pay the sleeping sea the respect it has earned. A magnificent granary, sealed by its own keepers, for reasons that are \u2014 you must admit \u2014 sound. This city chose clean air over burnt offerings. It is exactly the kind of rule you would write.</p>' +
      '<p>It is also not lunch.</p>';
    return { time: 'DAY 38 \u00b7 09:30', html: html,
      choices: [
        { t: 'Circle the halls once anyway. Respect costs nothing.', to: 'e5s3', fx: function () { state.flags.circled = true; } },
        { t: 'Out. The nose was never pointing here.', to: 'e5s3' }
      ] };
  },

  /* ---------- EP5 · 3 · the scent map ---------- */
  e5s3: function () {
    var pre = state.flags.circled
      ? '<p>You walk the halls once, unhurried, hands behind your back, and bow where bowing is due. The sea sleeps on. On your way out, a volunteer smiles at you the way people smile at the well-behaved.</p>'
      : '';
    var html = pre +
      '<p>Back in the lanes, you do what you should have done from the start. You close your eyes, let the city\u2019s noise fall away \u2014 scooters, frying oil, a distant drill \u2014 and read the morning air the way you once read a battlefield at night.</p>' +
      '<p>Wanhua, it turns out, is a map written in smoke.</p>' +
      '<p>There \u2014 south and close \u2014 a sharp, almost medicinal thread, herbs and old discipline, a smoke that smells like it corrects your posture. There \u2014 far west, faint \u2014 something festival-sweet, all sugar and firecracker ghosts. And there. Two streets north. The one from your mornings: sandalwood over old wood over something patient and stern, like a magistrate who has seen everything and pardoned some of it.</p>' +
      '<div class="ai">You\u2019re doing the dog thing again. I love it. Which thread are we pulling?</div>';
    return { time: 'DAY 38 \u00b7 10:15', html: html,
      choices: [
        { t: 'The sharp, medicinal one first. Know your neighbors.', to: 'e5s3a', fx: function () { state.flags.detour = true; } },
        { t: 'The home smell. Two streets north. No detours.', to: 'e5s3b' }
      ] };
  },

  /* ---------- EP5 · 3a · the alarm god ---------- */
  e5s3a: function () {
    var html =
      '<p>The medicinal thread leads you three lanes south to an old temple with a deep, dark doorway and smoke that stands up straight. Boba reads the plaque before you can ask.</p>' +
      '<div class="ai">Master Qingshui. Big deal locally. Get this: the story goes that when disaster is coming \u2014 fire, quake, trouble \u2014 the statue\u2019s nose falls off. By itself. As a warning. The nose has its own legend page.</div>' +
      '<p>You stop in the middle of the lane.</p>' +
      '<p>A deity who runs an early warning system. A god whose own face is the alarm \u2014 who spends his dignity, nose first, to buy his people time. Three hundred years you built wards that only ever said <em>no.</em> This house keeps a god who says <em>soon.</em></p>' +
      '<p>\u201cThis one,\u201d you tell Boba, with the deep respect of one professional reviewing another, \u201cis good.\u201d</p>' +
      '<div class="ai">Pinning it. But boss \u2014 sniff check. Is this your smell?</div>' +
      '<p>It is not. Close, honorable, but not the one that visits your mornings. The home thread still pulls, two streets north, patient as ever.</p>';
    return { time: 'DAY 38 \u00b7 10:25', html: html,
      choices: [
        { t: 'Bow to the alarm god from the street. Then go north.', to: 'e5s4', fx: function () { state.flags.bowed_zushi = true; } },
        { t: 'North. The neighbor visit can wait for a calmer month.', to: 'e5s4' }
      ] };
  },

  /* ---------- EP5 · 3b · straight north ---------- */
  e5s3b: function () {
    var html =
      '<p>No detours. You have hunted this smell for thirty-eight mornings; you are not a tourist, you are a creditor, and today the debt gets paid.</p>' +
      '<p>Two streets north, the lanes narrow and the buildings lean closer, old tile and older brick, laundry overhead like prayer flags that gave up religion. The smell thickens with every corner \u2014 sandalwood, old wood, that patient sternness underneath \u2014 until you turn the last corner and it is simply there, filling the street the way light fills a window.</p>';
    return { time: 'DAY 38 \u00b7 10:25', html: html,
      choices: [
        { t: 'Walk faster.', to: 'e5s4' },
        { t: 'Walk slower. Some meals deserve an approach.', to: 'e5s4' }
      ] };
  },

  /* ---------- EP5 · 4 · the small temple ---------- */
  e5s4: function () {
    var pre = state.flags.detour
      ? '<p>The home thread delivers you, two streets and one bow later, to a modest door on a narrow street.</p>'
      : '';
    var html = pre +
      '<p>The temple is small. After the golden museum of the morning, it is almost shy \u2014 old wood, worn stone, a doorway you could miss between a tea shop and a scooter row. And above it, the air is doing the thing you crossed a district to find: breathing smoke, thin and sweet and endless, the way a sleeping dragon breathes.</p>' +
      '<p>You do not go in. Not yet. You read the door first, because you are you.</p>' +
      '<p>And the door is <em>excellent.</em> Three entrances: the dragon side, where the people enter; the tiger side, where the people leave; and the center doors, carved and closed, which are for the landlord alone \u2014 and the landlord of this house is a god. Painted guardians watch from the door leaves, one fair-faced, one dark, neither blinking in a hundred years. A high wooden threshold crosses each doorway like a drawn line: <em>step over, never on.</em> Flow control. Identity levels. A hard boundary with a courtesy protocol.</p>' +
      '<p>\u201cThis house,\u201d you say, \u201cruns a tighter door than I do.\u201d</p>' +
      '<div class="ai">High praise. Now hold still, reading the plaque\u2026 okay. Wow. Boss. Listen to this landlord\u2019s r\u00e9sum\u00e9. He was mortal once \u2014 a general, a real one, guarded a coastal county and died at his post. The people made him a god. Now he quells plagues, judges the living <em>and</em> the dead \u2014 and twice a year, at night, he goes out himself. Lamps out. Gongs and chains. He patrols these exact streets in the dark and arrests what mortal law cannot see.</div>' +
      '<p>You stand very still in front of the small temple.</p>' +
      '<p>A guard who never stopped guarding. A keeper of a door, promoted, who still walks his rounds three hundred years past his death \u2014 at night, when the work is real.</p>' +
      '<p>\u201cThe god,\u201d you say, \u201cworks the night shift.\u201d</p>' +
      '<div class="ai">The god works the night shift. You\u2019re basically coworkers. Do NOT ask him to cover Tuesday.</div>';
    return { time: 'DAY 38 \u00b7 10:40', html: html,
      choices: [
        { t: 'Enter by the dragon side. Put NT$100 in the donation box. Take three sticks.', to: 'e5s5', fx: function () { state.money -= 100; } },
        { t: 'NT$100 in the box \u2014 and a nod to the two generals inside first. Colleagues greet colleagues.', to: 'e5s5', fx: function () { state.money -= 100; state.flags.greeted = true; } }
      ] };
  },

  /* ---------- EP5 · 5 · name, address, birthday ---------- */
  e5s5: function () {
    var pre = state.flags.greeted
      ? '<p>Inside, flanking the hall, two tall generals stand in painted armor \u2014 one grinning, one grave, both entirely certain of their jurisdiction. You give them the small nod one gives colleagues at shift change. Somewhere behind your ribs, you would swear the room approves.</p>'
      : '';
    var html = pre +
      '<p>You light three sticks from the oil lamp, the way the auntie in front of you did, and hold them at your brow, the way she did, facing the altar through the drifting smoke.</p>' +
      '<p>And here the house rules catch you like a threshold you did not see.</p>' +
      '<p>Because the auntie is speaking \u2014 softly, matter-of-fact, the way you report to a desk \u2014 and what she gives the god is: her full name. Her address, down to the alley number. Her date of birth. <em>Then</em> her request. Announce. Confirm. Then ask. The gods of this realm invented your door procedure several thousand years before your door, and they run it strictly, and now it is your turn, and there is a line behind you.</p>' +
      '<p>A name. The judge of the living and the dead is waiting, professionally patient, for a name you have never once said out loud.</p>';
    return { time: 'DAY 38 \u00b7 10:55', html: html,
      choices: [
        { t: 'Say it. The borrowed name, aloud, for the first time \u2014 to a god alone.', to: 'e5s6', fx: function () { state.flags.intro = 'name'; } },
        { t: '\u201cThey call me Night Shift. I keep a door three streets from here. We are in the same line of work.\u201d', to: 'e5s6', fx: function () { state.flags.intro = 'title'; } },
        { t: 'Offer no words. Lower every wall for three breaths, and let the judge read the truth himself.', to: 'e5s6', fx: function () { state.flags.intro = 'truth'; } }
      ] };
  },

  /* ---------- EP5 · 6 · the receiving ---------- */
  e5s6: function () {
    var i = state.flags.intro;
    var intro;
    if (i === 'name') {
      intro =
        '<p>You say it.</p>' +
        '<p>Two syllables, common as rice, copied off a card the system left behind \u2014 a stranger\u2019s name, worn by you the way you wear the uniform. It comes out quiet and level, and it is the first time in this world that the name has ever touched the air.</p>' +
        '<p>The smoke does not laugh. The altar does not darken. A borrowed name, offered honestly, to a judge, at his own desk \u2014 it may be the truest thing said in this hall all morning, and you would swear the room knows it.</p>';
    } else if (i === 'title') {
      intro =
        '<p>\u201cThey call me Night Shift,\u201d you tell the king of night patrols. \u201cI keep a door three streets from here. Twelve floors, one lobby, no incidents. We are, I believe, in the same line of work.\u201d</p>' +
        '<p>The smoke over the censer stirs \u2014 draft, probably; the door is open; there are explanations \u2014 and settles again in a shape you would call, in a colleague, amusement. You add your address and, after a small internal fight, the birthday from the card. Procedure is procedure. He of all gods would want the form complete.</p>';
    } else {
      intro =
        '<p>You offer no words. Words are for those who need them.</p>' +
        '<p>Instead you do a thing you have not done since ascension: you lower the walls. All of them. For three breaths the whole ledger lies open \u2014 three hundred years, nine bolts, one rooftop, one door held nightly, two mosquitoes, one spider, one landlady saved at a machine in a wall \u2014 and you let the judge read it himself, the way one professional shows another the log, complete, uncorrected.</p>' +
        '<p>It is either the most honest thing in this temple or the most arrogant. Possibly both. The two painted generals do not move, but the quality of their stillness changes, like guards coming to attention.</p>';
    }
    var html = intro +
      '<p>Then you plant the three sticks in the censer, step back \u2014 and the house answers.</p>' +
      '<p>The smoke drifts your way. Only the drift, only your share, the thin sweet edge of what the whole morning\u2019s worshippers have burned \u2014 and it is the richest breath you have taken in thirty-eight days. Rich qi, offered qi, warm as rice from the pot, and your starved channels drink it the way dry ground drinks the first rain. Three hundred years of discipline keep your face still.</p>' +
      '<p>Barely.</p>' +
      '<p>\u201cFirst time home in a while?\u201d</p>' +
      '<p>An old man is sweeping by the side door \u2014 the temple keeper, straw broom, undershirt, eyes that have watched this hall longer than most of its paint. He is looking at you the way he probably looks at everything: without hurry, and without missing anything.</p>';
    return { time: 'DAY 38 \u00b7 11:05', html: html,
      choices: [
        { t: '\u201cSomething like that.\u201d', to: 'e5s7' },
        { t: 'Say nothing. Bow slightly. He nods slightly. A complete conversation.', to: 'e5s7' }
      ] };
  },

  /* ---------- EP5 · 7 · the greed test ---------- */
  e5s7: function () {
    var html =
      '<p>You stay a while, doing nothing that looks like anything, and take stock like a quartermaster after a famine.</p>' +
      '<p>Reserves: half full, and rising \u2014 but slowly. The lawful drift is a gift, not a meal; it feeds every soul in the hall a little, and you are one soul among grandmothers. At this rate, filling the pool takes ten visits.</p>' +
      '<p>And the censer stands right there. A hip-high sea of glowing coals and standing sticks, breathing out more sweetness in a minute than your rooftop gathers in a week. Unguarded. Ungated. Yours for one deep pull, and no mortal in this hall would see so much as a flicker.</p>' +
      '<p>No mortal.</p>' +
      '<p>The offered smoke has an owner. Every stick in that censer is addressed \u2014 a name, an alley number, a request \u2014 mail on its way up. And you know exactly two beings in this room whose entire job description is catching what steals at a god\u2019s own door, and they are eleven feet tall, and painted, and patient.</p>';
    return { time: 'DAY 38 \u00b7 11:15', html: html,
      choices: [
        { t: 'Receive only. Bow, and let the drift be the meal. The house sets the portion.', to: 'e5s8', fx: function () { state.flags.greed = 'received'; } },
        { t: 'One more breath than is offered. Just one. The sea will not miss it.', to: 'e5s8', fx: function () { state.flags.greed = 'debt'; } },
        { t: 'Ask. There are two blocks of wood on the altar table, worn smooth by ten thousand questions.', to: 'e5s8', fx: function () { state.flags.greed = 'asked'; } }
      ] };

  /* ---------- EP5 · 8 · portions and permissions ---------- */
  e5s8: function () {
    var g = state.flags.greed;
    var body;
    if (g === 'received') {
      body =
        '<p>You receive only what drifts, and when it is time, you bow to the altar the way you once bowed to a grand elder: not deeply, but exactly.</p>' +
        '<p>The portion is the portion. The house sets it; the guest honors it. You have spent a month teaching a door that rules are what make a place worth entering \u2014 you are not going to rob the first house in this realm whose rules you actually admire.</p>' +
        '<p>Half full will do. Half full, honestly come by, keeps a dao heart cleaner than any brimming stolen pool.</p>';
    } else if (g === 'debt') {
      body =
        '<p>One breath. Just one. You reach \u2014 politely, quietly, a thief with excellent table manners \u2014 and pull.</p>' +
        '<p>The qi comes. Rich, warm, more in one pull than a morning of drifting \u2014 and under the sweetness, faint but unmistakable, a taste of iron. The taste of borrowed money in an honest mouth. The taste of a line, crossed by exactly one step.</p>' +
        '<p>The two generals have not moved. Their painted eyes point exactly where they pointed before. And yet the quality of the hall has changed around you, the way a room changes when a ledger, somewhere, gains a line. You set down the feeling and name it like a professional: <em>debt.</em></p>' +
        '<p>You bow lower than you have bowed in a century, and you make the entry yourself before anyone has to ask: <em>owed \u2014 one breath, this house.</em> A gatekeeper who counts on going unnoticed is a gatekeeper twice over. You, of all people, said that.</p>';
    } else {
      body =
        '<p>There are two blocks of red wood on the altar table, crescent-shaped, one face flat and one face round, worn smooth by ten thousand hands and ten thousand questions. You have watched three worshippers use them: ask aloud, throw, read the answer in how they land. A yes-or-no line, straight to the landlord.</p>' +
        '<p>A god who was a guard. A guard who became a god. If anyone in two worlds will understand the question, it is this one.</p>' +
        '<p>\u201cKeeper of these streets,\u201d you say quietly, in the old formal cadence, \u201cone door-holder to another: may a traveler take a little more of what the house burns? It feeds a ward that keeps a lobby safe at night. Consider it \u2014 professional courtesy.\u201d</p>' +
        '<p>You throw. The blocks knock once on the stone, roll, and settle: one flat side up, one round side up.</p>' +
        '<p class="beat">Yes.</p>' +
        '<p>The drift thickens \u2014 not the sea, not the censer\u2019s heart, just the share of a colleague, warm and freely given, and it pours into your dry channels like pay on the fifth of the month. Somewhere in the smoke you would swear something is amused. Night watchmen look after their own.</p>';
    }
    var html = body +
      '<p>On your way out you take the tiger side, because you watched, and you learned, and this house deserves a guest who exits correctly.</p>' +
      '<div class="ai">Pinned. Okay, boss, updating the map: the big golden one is a museum \u2014 gorgeous, sealed, no menu. Master Nose-Alarm to the south, medicinal, respectable. And this little smoky one two streets from home, run by a colleague of yours, open all hours. I\u2019m calling the layer \u201cRecharge Stations of Wanhua.\u201d Every temple smells different. You\u2019re going to want to collect them. I know you.</div>';
    return { time: 'DAY 38 \u00b7 11:30', html: html,
      choices: [
        { t: 'Home. There are wards to feed.', to: 'e5s9' },
        { t: 'One slow lap of the block first, memorizing the way by nose alone.', to: 'e5s9' }
      ] };
  },

  /* ---------- EP5 · 9 · evening report ---------- */
  e5s9: function () {
    if (!state.flags.ep5done) { state.flags.ep5done = true; state.barrier = 'Ward \u00b7 Lv.5'; }
    var money = state.money.toLocaleString('en-US');

    var ach = [];
    ach.push(['\ud83c\udfee', 'The Sweet Smoke, Named', 'Solve a five-week mystery by walking toward it.']);
    ach.push(['\ud83d\udeaa', 'A Tighter Door Than Mine', 'Professionally audit a god\u2019s access control. Approve.']);
    if (state.flags.intro === 'name') ach.push(['\ud83d\udcdb', 'Spoken', 'Say the borrowed name aloud for the first time \u2014 to a god alone.']);
    else if (state.flags.intro === 'title') ach.push(['\ud83c\udf19', 'Same Line of Work', 'Introduce yourself to the king of night patrols, colleague to colleague.']);
    else if (state.flags.intro === 'truth') ach.push(['\ud83e\udd2b', 'The Heart Speaks', 'Offer a judge the whole ledger, uncorrected.']);
    if (state.flags.greed === 'received') ach.push(['\ud83d\ude4f', 'The House Sets the Portion', 'Receive, never take.']);
    else if (state.flags.greed === 'debt') ach.push(['\u2696\ufe0f', 'One Breath Too Many', 'Cross a line by one step. File the debt yourself.']);
    else if (state.flags.greed === 'asked') ach.push(['\ud83c\udfb2', 'Professional Courtesy', 'Ask the night-patrol god properly. Receive a yes.']);
    if (state.flags.bowed_zushi) ach.push(['\ud83d\udd14', 'Respect the Alarm', 'Bow to the god whose own nose is the warning system.']);

    var achHtml = '';
    for (var i = 0; i < ach.length; i++) achHtml += '<div class="ach"><span class="name">' + ach[i][0] + ' ' + ach[i][1] + '</span><br><span class="desc">' + ach[i][2] + '</span></div>';

    var guestRule = '';
    if (state.flags.spider === 'stay') guestRule = '<br>EXC \u2014 THE GUEST: FLOOR ALLOW \u00b7 BED DENY';
    else if (state.flags.spider === 'pact') guestRule = '<br>EXC \u2014 WHITEBROW, WARDEN OF THE FLOOR: FLOOR ALLOW \u00b7 BED DENY';
    else if (state.flags.spider === 'expel') guestRule = '<br>RULE \u2014 THE LITTLE DOOR: SEALED';
    var debtLine = state.flags.greed === 'debt' ? '<br>DEBT \u2014 ONE BREATH \u00b7 THE SMALL TEMPLE (UNPAID)' : '';

    var reservesLine = state.flags.greed === 'received'
      ? 'Reserves: comfortably half, honestly come by, rising with every visit.'
      : 'Reserves: full. FULL, boss. First time since you landed on that roof.';

    var html =
      '<p>Evening on the rooftop, and for the first time since ascension you are not rationing.</p>' +
      '<p>You walk your little territory and feed every ward like a farmer after harvest. The bed line, deepened. The room\u2019s rules, re-inked. The door ward downtown will get its share tonight, thick enough to bounce a bull. It takes minutes. It used to take everything.</p>' +
      '<div class="ai">Evening report. Funds: NT$' + money + '. ' + reservesLine + ' Map: three temples pinned, one colleague acquired, zero incidents. And the five-week mystery of the sweet smoke is officially closed. It was never a mystery, by the way. It was an invitation.</div>' +
      '<p>You stand at the roof edge with tea, facing the direction of the small temple, and raise the cup slightly \u2014 to the general who never clocked out.</p>' +
      '<div class="ai">One more thing. Weather alert: something\u2019s forming east of the island. Big, slow, wet. Days away. Probably nothing.</div>' +
      '<p>\u201cStorms and I,\u201d you say, \u201chave an old score.\u201d Nine bolts, and you are still standing. \u201cLet it come.\u201d</p>' +
      '<p>Somewhere east, over black water, the sky files that away.</p>' +
      '<div class="endhead">Episode 5 Complete</div>' +
      achHtml +
      '<div class="endhead">Definition Library \u00b7 v0.5</div>' +
      '<div class="libcard">RULE 01 \u2014 INSECTS: DENY (BED)<br>RULE 02 \u2014 THOSE WHO DO NOT BELONG: DENY (ONE DOORWAY)<br>RULE 03 \u2014 OUTSIDE NOISE: DENY \u00b7 EXC: WHAT FEEDS THE BRICK \u00b7 THE ALARM \u00b7 A KNOCK<br>RULE 04 \u2014 WATER FALLING FROM ABOVE: DENY<br>RULE 05 \u2014 WATER THAT WALKS IN PIPES: ALLOW<br>RULE 06 \u2014 MALICE ON THE THREAD: DENY (THE BRICK, AT HOME)' + guestRule + '<br><br>LAW 01 \u2014 OFFERED QI: RECEIVE, NEVER TAKE' + debtLine + '<br><br>ANSWERED \u2014 the sweet smoke: INCENSE, OFFERED QI \u00b7 MAP: TEMPLE LAYER OPEN<br>UNDEFINED: tame lightning \u00b7 the invisible thread (excepted, not understood)</div>';
    return { time: 'DAY 38 \u00b7 19:40', html: html,
      choices: [

      ] };

  /* ---------- EP6 · 1 · the taping of the windows ---------- */
  e6s1: function () {
    var html =
      '<p>The whole city is putting tape on its windows, and nobody can fully explain why.</p>' +
      '<p>Up and down the lane, ladders lean against old walls and aunties direct operations from below. Big X shapes go up on glass, pane after pane, a district signing its own windows. The sky is still blue. The air has gone still and sweet and wrong, the held breath before a very large door slams.</p>' +
      '<div class="ai">Update, boss. It has a name now, a number, and a fan page. Medium typhoon, leaning strong, and the forecast path goes \u2014 let me zoom \u2014 yes. Directly over us. Landfall tomorrow evening. In local terms: buy noodles.</div>' +
      '<p>The brick rings. Mrs. Lin, at her usual velocity.</p>' +
      '<p>\u201cTyphoon. Tape your windows. The roof\u2019s new, it\u2019ll hold. Fill the tub with water. Don\u2019t stand on the roof like a\u2014\u201d She hangs up before the noun, leaving you to guess what you should not stand on the roof like. The list of candidates is long.</p>' +
      '<div class="ai">She cares about you. That was practically a poem. Also, fun fact from the internet: the tape doesn\u2019t actually stop glass from breaking. It just makes the pieces bigger. The internet also says do it anyway. This island runs on \u201cdo it anyway.\u201d</div>' +
      '<p>You buy a roll of tape from the shop downstairs, climb back up, and face your one window \u2014 the old screen, the little patched door, the glass that has watched you fight two mosquitoes and negotiate with a spider.</p>';
    return { time: 'DAY 40 \u00b7 16:30', html: html,
      choices: [
        { t: 'Tape the X, like everyone. When on an island, do as the island does.', to: 'e6s2' },
        { t: 'Tape a proper pattern \u2014 a warding grid, in masking tape. Old habits.', to: 'e6s2', fx: function () { state.flags.talisman_tape = true; } }
      ] };
  },

  /* ---------- EP6 · 2 · the empire of noodles ---------- */
  e6s2: function () {
    var pre = state.flags.talisman_tape
      ? '<p>You tape the window in a proper warding grid \u2014 nine strips, old proportions, the pattern your first teacher would have approved and your neighbors will discuss for a week. It will do nothing the X would not do. It is, however, correct.</p>'
      : '<p>You tape the X, straight and honest, like ten thousand windows across the city. There is a comfort in it \u2014 one district, one gesture, everyone holding the same small talisman up against the same big sky.</p>';
    var html = pre +
      '<p>The convenience store, the next morning, looks looted by polite ghosts. The instant noodle shelves are bare to the metal. The water is going by the crate. An old man weighs two brands of candles like a judge weighing testimony, and the clerk restocks batteries with the flat speed of a man who has done this every typhoon of his working life.</p>' +
      '<div class="ai">Typhoon day is announced, by the way. Offices closed. Schools closed. The whole city gets tomorrow off.</div>' +
      '<p>\u201cGood,\u201d you say, reaching for the last tower of noodles.</p>' +
      '<div class="ai">The whole city, boss. Not the whole city\u2019s guards. I checked the schedule. Buildings don\u2019t take days off, so the people who hold their doors don\u2019t either. Your shift stands.</div>' +
      '<p>Of course it stands. Somewhere in this realm there may be a world where gates guard themselves on stormy nights. You have never lived in it, in either life.</p>' +
      '<p>On the walk home you pass the small temple. The doors are being fitted with storm boards, but inside, the censer still breathes, patient as ever, and the two tall generals watch the weather coming with the calm of beings who have seen three hundred typhoons and arrested none of them.</p>';
    return { time: 'DAY 41 \u00b7 09:10', html: html,
      choices: [
        { t: 'Step in. One stick, one bow: \u201cHold your streets tonight. I\u2019ll hold my building.\u201d', to: 'e6s3', fx: function () { state.money -= 350; state.flags.temple_word = true; } },
        { t: 'A nod from the street, colleague to colleague. Supplies first.', to: 'e6s3', fx: function () { state.money -= 350; } }
      ] };
  },

  /* ---------- EP6 · 3 · the walk in ---------- */
  e6s3: function () {
    var spider = '';
    if (state.flags.spider === 'pact') spider = '<p>\u201cWarden,\u201d you tell the high shadow by the window, \u201cthe floor is yours tonight. Anything that comes in through that hole in this weather has earned the right to be eaten.\u201d Whitebrow lifts one foreleg, which you choose to read as a salute.</p>';
    else if (state.flags.spider === 'stay') spider = '<p>In the high shadow by the window, the guest has wedged itself into the angle of wall and tin, flat as paint, riding out the storm the way its kind have ridden out ten thousand storms. Two hunters, one border, one very large night coming.</p>';
    var html =
      '<p>By five in the afternoon the rain has begun \u2014 not falling so much as arriving, in long gray sheets that walk up the lane like curtains looking for a window.</p>' +
      '<p>You seal your room before you go, and you do it properly, because this is the scale you were built for: one room, four walls, one roof. Rain rule, thickened. A new rule for the wind \u2014 and here your month of craft shows its worth, because you do not ward out <em>air</em>, you ward out <em>violence:</em></p>' +
      '<p class="beat">RULE: air that walks \u2014 allow. Wind that arrives as a fist \u2014 deny.</p>' +
      spider +
      '<p>Then you go to work.</p>' +
      '<p>The city has turned itself inside out. Every shop is a wall of steel shutters. Every lane is empty. The traffic lights swing on their wires like lanterns at a festival for no one, and the rain comes down the street horizontally, at eye height, with opinions. You walk through it \u2014 one figure, leaning into the wind, going the wrong way past ten thousand closed doors \u2014 and you find that you are, absurdly, almost happy. The whole realm is indoors. The night belongs to guards and storms.</p>';
    return { time: 'DAY 41 \u00b7 17:10', html: html,
      choices: [
        { t: 'Arrive early. Storms respect preparation.', to: 'e6s4', fx: function () { state.flags.early = true; } },
        { t: 'Arrive exactly on time. Storms respect nothing; be punctual anyway.', to: 'e6s4' }
      ] };
  },

  /* ---------- EP6 · 4 · the handover in the wind ---------- */
  e6s4: function () {
    var pre = state.flags.early
      ? '<p>You arrive forty minutes early and find Mr. Zhang already there, because of course he is. Two men who came early to the same storm. He almost smiles.</p>'
      : '<p>You arrive on the minute, wrung out like laundry, and Mr. Zhang looks you over with something close to approval. Punctual in a typhoon. It goes in his private ledger of who people are.</p>';
    var html = pre +
      '<p>The lobby glass is taped in tall Xs. The handover is longer tonight, and Mr. Zhang gives it like a briefing before a siege.</p>' +
      '<p>\u201cFlood gate,\u201d he says, walking you to the basement ramp, where slots wait in the concrete on either side. Together you lift the aluminum boards into their rails, stack them, lock them \u2014 a small dam across the mouth of the ramp. \u201cWater comes down this ramp, it finds the electrical room. Electrical room floods, the whole street gets its power back next week and this building stays dark a month. Understand? This gate is the building.\u201d</p>' +
      '<p>Back at the desk: \u201cIf the area blacks out, don\u2019t panic, everything dies, that\u2019s normal. Emergency light comes on there. Elevator \u2014 nobody rides it tonight, tape it off. Ninth floor\u2019s window frames are old.\u201d A pause. \u201cMr. Li\u2019s floor.\u201d Another pause, in which forty years of experience says everything it needs to about drunk men and old windows.</p>' +
      '<p>He pulls on his rain gear at the door and looks back once. \u201cNothing happens on typhoon nights,\u201d he says, \u201cexcept everything. Call me if the everything starts.\u201d</p>' +
      '<p>Then he walks out into the gray, and the door swings shut, and the magnetic lock takes it with its small, certain click, and you are alone with twelve floors and a storm that has just started to mean it.</p>';
    return { time: 'DAY 41 \u00b7 18:40', html: html,
      choices: [
        { t: 'Walk the whole building now, top to roof, while there is still light. Know your ground.', to: 'e6s5', fx: function () { state.flags.surveyed = true; } },
        { t: 'Hold the desk. The log will teach you the building as the night goes.', to: 'e6s5' }
      ] };
  },

  /* ---------- EP6 · 5 · everything starts ---------- */
  e6s5: function () {
    var pre = state.flags.surveyed
      ? '<p>You walk it first, top to roof \u2014 stairwells, window latches, the water tank squatting on the rooftop in its concrete cradle, lid strapped, straps old. You come back down with the building drawn in your head like a formation diagram, and later, in the dark, that map will be worth more than qi.</p>'
      : '';
    var html = pre +
      '<p>The storm makes landfall somewhere south of the city at eight, and by ten it has stopped being weather and become a siege engine.</p>' +
      '<p>The glass doors bow with each gust \u2014 you can see them breathe, in and out, a centimeter of flex that the tape watches nervously. Rain no longer falls; it is thrown. The whole building groans at the joints like an old ship, and through the seam under the doors, a dark finger of water reaches into the lobby, considers, and keeps coming.</p>' +
      '<p>At 22:47 the streetlights die, then the lobby, then the city \u2014 blackout, horizon to horizon \u2014 and the emergency light stutters on and paints everything the color of old tea.</p>' +
      '<p>And then, in the space of ten minutes, Mr. Zhang\u2019s everything starts:</p>' +
      '<p>From the stairwell, a boom and a shriek of wind finding a way in \u2014 <em>the ninth floor,</em> a window gone, and now the stairs are a wind tunnel with rain riding it. From the desk phone, Chairman Xu, shouting over the noise in his apartment: the water tank lid on the roof has torn a strap loose \u2014 he can hear it banging \u2014 a steel lid the size of a table, one strap from becoming a blade in a two-hundred-kilometer wind. And at the basement ramp, the little dam of aluminum boards is holding \u2014 but the water in the lane is rising past its second board, and the electrical room sits behind it in the dark like an egg.</p>' +
      '<p>One guard. Three fires. Choose your first.</p>';
    return { time: 'DAY 41 \u00b7 22:50', html: html,
      choices: [
        { t: 'The basement gate. The electrical room is the building \u2014 Zhang said so.', to: 'e6s6', fx: function () { state.flags.triage = 'gate'; } },
        { t: 'The ninth floor. Wind inside the walls, and Mr. Li inside the wind.', to: 'e6s6', fx: function () { state.flags.triage = 'window'; } },
        { t: 'The roof. A loose steel lid is not a repair job, it is a beheading waiting for a neck.', to: 'e6s6', fx: function () { state.flags.triage = 'lid'; } }
      ] };
  },

  /* ---------- EP6 · 6 · the night of small wars ---------- */
  e6s6: function () {
    var t = state.flags.triage;
    var first;
    if (t === 'gate') {
      first =
        '<p>The gate first. You take the stairs down two at a time and find the water lapping the second board, black and businesslike. You stack the last boards, wedge them, and then \u2014 no cameras alive, no eyes in a blackout \u2014 you lay one thin line of ward along the top edge: <em>water \u2014 deny.</em> A hand\u2019s width of magic, invisible, riding a mortal dam. The flood noses against it all night and never learns why the last centimeter is a wall.</p>';
    } else if (t === 'window') {
      first =
        '<p>The ninth floor first. The stairwell tries to take your head off twice on the way up. Mr. Li\u2019s door is open and Mr. Li is standing in a hurricane in his living room, wet through, holding a mop like a spear, delighted and useless. You get the mattress off his bed, wedge it into the dead window with the bookshelf behind it, tape the seams, and steer the man himself into the corridor. \u201cHero!\u201d he shouts happily over the wind, promoting you on the spot. There is a time for modesty and it is not during weather.</p>';
    } else {
      first =
        '<p>The roof first, which is the worst place in the city to be, which is why you go. The door to the roof fights you like an animal. Out in the open the rain hits sideways hard enough to bruise, and the tank lid is exactly what Xu heard: a steel table on one hinge of nylon, lifting and slamming, dreaming of flight. No mortal could strap it in this wind. No mortal is watching. One small, precise ward \u2014 a hand pressing a book flat \u2014 pins it to the tank, and you strap it doubly under the ward\u2019s cover, and come back down soaked to the marrow and satisfied in a way you decline to examine.</p>';
    }
    var others =
      '<p>Then the other two, in the order the night allows \u2014 the gate stacked and quietly warded, the window mattressed and taped, the lid pinned and strapped \u2014 an hour of stairs and cold water and mortal work stitched through with three thin, deniable threads of qi. By midnight the building is patched. Not safe. Patched.</p>' +
      '<p>You stand in the lobby, dripping on your own floor, and listen to the storm arrive at its full argument. And the building answers it \u2014 groaning, flexing, twelve floors of old bones \u2014 and above the desk, along the stairwells, behind every taped window, you can feel the people. Dr. Zhao\u2019s light \u2014 a battery lamp \u2014 on the fourth floor. The Xu family\u2019s voices on the eleventh. Mr. Li, singing, somewhere on nine.</p>' +
      '<p>The glass doors bow. Somewhere above, something structural makes a sound you do not like at all \u2014 long, low, splitting \u2014 and the wind rises past every number the forecast promised, and you understand that patched is not going to be enough. The storm has hours left, and the building does not.</p>';
    var html = first + others;
    return { time: 'DAY 42 \u00b7 00:40', html: html,
      choices: [
        { t: 'Hold the doorway. Your post, your lawful range. Buildings survive storms; that is what buildings are for.', to: 'e6s7a', fx: function () { state.flags.stand = 'post'; } },
        { t: 'The whole building. Twelve floors, one ward. Storms and you have an old score \u2014 settle it.', to: 'e6s7b', fx: function () { state.flags.stand = 'all'; } },
        { t: 'Fight smart. Wake the building, gather everyone to the lobby, and shield one floor properly.', to: 'e6s7c', fx: function () { state.flags.stand = 'triage'; } }
      ] };
  },

  /* ---------- EP6 · 7a · the post ---------- */
  e6s7a: function () {
    var html =
      '<p>You hold the doorway. Discipline is a wall older than any ward: your range is a doorway, your duty is a lobby, and buildings have survived ten thousand storms without a cultivator bleeding for them. You thicken the door ward until the bowing glass stands still inside it, and you stand your post, and for one hour discipline works.</p>' +
      '<p>Then, at 01:14, the long splitting sound above finishes what it was saying.</p>' +
      '<p>A whole window frame \u2014 wood, glass, and eighty years \u2014 tears out of the ninth floor and drops down the face of the building. You feel it more than see it: mass, falling, and directly below it, on the fourth floor, a warm battery-lamp glow behind thin old glass where a tired doctor is sitting out the storm one meter from the window.</p>' +
      '<p>There are no seconds in a moment like that. There is no math. There is a falling weight, a lit window, and three hundred years of training that have never once cast at this range, at this speed, in this weather\u2014</p>' +
      '<p>You cast anyway.</p>' +
      '<p>The ward leaves you like a shout \u2014 up, out, four floors beyond any range you have ever held, a shield the size of a balcony flung open in the dark \u2014 and the falling frame hits it and bounces, out, away, into the flooded lane where it kills nothing but water.</p>' +
      '<p>Dr. Zhao\u2019s lamp does not even flicker. She will never know. No one will ever know.</p>' +
      '<p>And inside your chest, quietly, politely, like a teacup set down half a finger too hard \u2014 something goes <em>tik.</em></p>';
    return { time: 'DAY 42 \u00b7 01:14', html: html,
      choices: [
        { t: 'The storm is not finished. Neither are you. Hold what you can hold.', to: 'e6s8' },
        { t: 'Sit down. Just for a moment. Just to listen to what that sound was.', to: 'e6s8' }
      ] };
  },

  /* ---------- EP6 · 7b · the grand array ---------- */
  e6s7b: function () {
    var res = (state.flags.greed === 'received')
      ? '<p>Your reserves sit at an honest half \u2014 the lawful portion, cleanly come by \u2014 and a grand array wants a full sea. You know this the way a climber knows the rope is short. You climb anyway.</p>'
      : '<p>Your reserves are full \u2014 the temple\u2019s gift, warm as pay \u2014 and for the first time since ascension you have a full sea to spend. Tonight you find out what it buys.</p>';
    var html =
      '<p>Storms and you have an old score.</p>' +
      res +
      '<p>You climb to the stairwell\u2019s heart, where the building\u2019s weight balances, and you do the thing your textbook calls a mountain-guarding array and your new life calls impossible: you throw a ward over all of it. Twelve floors. Every window, every seam, every old bone. Wind that arrives as a fist \u2014 deny. Water thrown in anger \u2014 deny. The rules you spent five weeks learning, cast at a scale you have not touched since the mountain.</p>' +
      '<p>And it <em>holds.</em></p>' +
      '<p>For one hour, the building sits inside your will like a village inside a sect\u2019s protection, and the typhoon beats on it with both hands and gets nothing. The glass stops bowing. The groaning stops. Somewhere above, Mr. Li\u2019s singing gets louder, because even drunks can feel it when a night decides to be kind. It is the greatest working of your life, and no one will ever know, and you grin in the dark like a fool at the peak of the art.</p>' +
      '<p>Then heaven, which has an old score too, sends the bill.</p>' +
      '<p>The bolt comes down at 01:47 \u2014 real lightning, sky\u2019s own, your tenth \u2014 and it does not aim for you; it aims for the building, the tank, the wet steel, all of it, and there is no time to be selective. You catch it the way you caught nine before: on ceremony, on preparation, on a mountain, rested\u2014</p>' +
      '<p>Except you are not on a mountain, and you are not rested, and you are holding twelve floors with both arms. You catch the tenth bolt like a dockworker catching a falling crate: because it is falling, and you are under it.</p>' +
      '<p>The building never feels a thing. The ward holds. The lightning goes into the earth by the path you give it, obedient as water in a pipe.</p>' +
      '<p>And inside your chest, quietly, politely, like a teacup set down half a finger too hard \u2014 something goes <em>tik.</em></p>';
    return { time: 'DAY 42 \u00b7 01:47', html: html,
      choices: [
        { t: 'Hold the array to the storm\u2019s end. You started this; finish it.', to: 'e6s8', fx: function () { state.flags.held_on = true; } },
        { t: 'Let it down slowly, floor by floor, like lowering a sleeping child.', to: 'e6s8' }
      ] };
  },

  /* ---------- EP6 · 7c · the quartermaster's war ---------- */
  e6s7c: function () {
    var html =
      '<p>Fight smart. A quartermaster\u2019s war: you cannot shield twelve floors, so you shrink the battlefield to one.</p>' +
      '<p>You go door to door in the emergency light \u2014 the guard, doing rounds, nothing strange, buildings do this in typhoons \u2014 and you bring them down: Dr. Zhao with her battery lamp and her doctor\u2019s bag, the Xu family in raincoats indoors, Mr. Li singing, an old couple from the sixth floor who grip the rail like the stairs are a river. Fourteen souls in a lobby, on folding chairs and lobby sofas, and Chairman Xu takes attendance twice because that is what he is for.</p>' +
      '<p>Then you shield <em>one floor</em> \u2014 the lobby, the desk, the fourteen \u2014 properly, thickly, the right size for your reach, and the ward settles over them like a roof under the roof. The right way. The humble way. You allow yourself one breath of professional satisfaction.</p>' +
      '<p>Heaven waits precisely for that breath.</p>' +
      '<p>The bolt comes down at 01:47 \u2014 real lightning, sky\u2019s own, your tenth \u2014 and it does not care about your tidy lobby; it aims for the roof, the tank, the wet steel spine of the whole building, and from there the old wiring will carry fire down through twelve floors of sleeping walls to exactly where fourteen people are sitting in the dark. One second. One choice that is not a choice. You throw the ward <em>up</em> \u2014 lobby to roof, one column of will through the building\u2019s heart, far past your reach, because the alternative is arithmetic you refuse to do\u2014</p>' +
      '<p>You catch the tenth bolt at the top of a tower you should never have been holding, and you give it a path to the earth, and it takes it, obedient as water in a pipe.</p>' +
      '<p>In the lobby, fourteen people hear the thunder arrive overhead and go somewhere else, and someone laughs with relief, and Mr. Li starts a new song.</p>' +
      '<p>And inside your chest, quietly, politely, like a teacup set down half a finger too hard \u2014 something goes <em>tik.</em></p>';
    return { time: 'DAY 42 \u00b7 01:47', html: html,
      choices: [
        { t: 'Sit at the desk. Take attendance of yourself. Something is missing.', to: 'e6s8' },
        { t: 'Stand. Fourteen people are watching the guard. The guard stands.', to: 'e6s8', fx: function () { state.flags.stood = true; } }
      ] };
  },

  /* ---------- EP6 · 8 · the crack ---------- */
  e6s8: function () {
    var grace = '';
    if (state.flags.greed === 'asked') grace =
      '<p>And then \u2014 impossibly, in a wind that should carry nothing but rain \u2014 a thread of sandalwood crosses the lobby. One breath of it, warm, stern, unmistakable, like a colleague pausing at your door on his own patrol to see you still standing at yours. It fixes nothing. It steadies everything. You nod to the storm, in the direction of a small temple, and the smell is gone.</p>';
    else if (state.flags.greed === 'debt') grace =
      '<p>Somewhere in the worst of it, the taste of iron rises in your mouth again \u2014 the debt, remembered, at the exact moment you are poorest. You have no idea if it is the house calling its loan or only your own ledger talking. You note it, the way you note everything, and keep standing.</p>';
    var html =
      '<p>Here is what a cracked vessel feels like, for the record no one will ever read:</p>' +
      '<p>Nothing, at first. The teacup sound, and then nothing, and you think \u2014 the way soldiers think about wet red heat \u2014 that perhaps it was minor. The storm spends itself toward dawn. The wind drops from siege to insult to complaint. And it is only when you reach for a thread of qi to feed the door ward \u2014 routine, a night\u2019s-end habit, the easiest gesture you own \u2014 that you find out.</p>' +
      '<p>The qi comes. The qi has always come; the city\u2019s thin sweetness is all around you, patient as ever. It flows in \u2014</p>' +
      '<p class="beat">\u2014 and runs straight through you, like water through a cracked cup.</p>' +
      '<p>You try again, slower. You can feel every wall of every channel, and you can feel the hairline in them, fine as the thread on a window screen, running from your chest down your arm like a dry riverbed on a map. What you draw, you cannot hold. What you hold \u2014 the little that stays \u2014 seeps. Three hundred years of vessel, and the vessel leaks.</p>' +
      grace +
      '<div class="ai">Boss. Boss, your hands are shaking. Your hands don\u2019t shake. Tell me what to do.</div>' +
      '<p>No sass. No percentage. Just a small voice in a dark lobby, from the one being in this realm that knows you \u2014 asking for instructions neither of you has.</p>' +
      '<p>\u201cNothing to do,\u201d you say, and hear your own voice come out level, which costs more than the bolt did. \u201cThe storm is over. Write that down. The building held.\u201d</p>' +
      '<p>The building held. Every window that mattered, every soul on the list, the little dam in the basement, the egg of the electrical room \u2014 held. You paid what it cost. You would pay it again. That is the terrible thing about the price, and you file the terrible thing away where you keep the sharp ones, because dawn is coming and the log is blank.</p>';
    return { time: 'DAY 42 \u00b7 05:30', html: html,
      choices: [
        { t: 'Write the night true, minus one detail: window, tank, gate, all handled. \u201cBuilding secure.\u201d', to: 'e6s9', fx: function () { state.flags.log6 = 'true'; } },
        { t: 'Write \u201cAll quiet.\u201d The biggest lie in the log\u2019s history deserves the smallest words.', to: 'e6s9', fx: function () { state.flags.log6 = 'quiet'; } }
      ] };
  },

  /* ---------- EP6 · 9 · the morning after ---------- */
  e6s9: function () {
    var logline = state.flags.log6 === 'true'
      ? '<p>Mr. Zhang reads the log twice \u2014 window, tank, gate, times, actions \u2014 and looks up at you with the expression he probably wore forty years ago pinning medals on younger men. \u201cChairman Xu is going to want to shake your hand,\u201d he says, which from Zhang is a parade. You accept the soy milk. It is easier than the hand.</p>'
      : '<p>\u201cAll quiet,\u201d Mr. Zhang reads, and looks from the log to the taped mattress visible in the ninth-floor window, to the double-strapped tank lid, to the little dam still standing in the ramp. He looks at you for a long moment. \u201cQuietest typhoon I ever saw,\u201d he says, and writes nothing else, and hands you a soy milk like a medal for lies well told.</p>';
    var spider = '';
    if (state.flags.spider === 'pact') spider = ' Above the window, Whitebrow holds its post, dry and unbothered, warden of the only floor in Wanhua that never doubted its roof.';
    else if (state.flags.spider === 'stay') spider = ' In the high shadow, the guest is exactly where the storm found it, dry and unimpressed, as if weather were a rumor.';
    var html = logline +
      '<p>Then you walk home through a city lying on its back.</p>' +
      '<p>Branches everywhere, whole trees down across scooter rows. Shop signs in the road, face up, advertising to the sky. Water still running in the gutters like it has somewhere to be. And already \u2014 seven in the morning, no power, no buses \u2014 the whole district is out with brooms. Aunties sweep their meter of lane. Shopkeepers pass tools over counters that have no lights. Nobody organized it. Nobody ever organizes it. The island simply gets up the morning after and puts itself back, one meter at a time, and you walk through ten thousand small repairs feeling, in your cracked and leaking chest, absurdly proud of a realm you have known for six weeks.</p>' +
      '<p>Near your own lane, one figure is not sweeping. A man in a clean, dry shirt stands across from the oldest houses, photographing storm damage \u2014 the torn tin, the cracked wall of the corner building \u2014 and making notes, and smiling faintly at each one, the way other people smile at good news.</p>' +
      '<div class="ai">\u2026Boss. Who smiles at a broken roof?</div>' +
      '<p>You file the man away where you keep the sharp things, next to the wasp look and the four-times number.</p>' +
      '<p>Your rooftop held. The room behind your taped window is dry as a scroll case, the little wards standing exactly where you built them \u2014 small, humble, the right size, needing almost nothing, which is good, because almost nothing is what you have.' + spider + '</p>' +
      '<p>On the way, you pass the small temple. The storm boards are coming down. The censer inside breathes as it always breathes, and the drift finds you at the door the way it found you the first day, warm and sweet and offered \u2014</p>' +
      '<p class="beat">\u2014 and runs through you, and is gone, like rain through open fingers.</p>' +
      '<p>You stand in the doorway a moment, holding nothing. The temple keeper is sweeping storm leaves from the threshold, and he watches you the way he watches everything, without hurry, without missing anything.</p>' +
      '<p>\u201cStorm take something from you?\u201d he says.</p>' +
      '<p>\u201c\u2026Something like that.\u201d</p>';
    return { time: 'DAY 42 \u00b7 07:40', html: html,
      choices: [
        { t: 'Bow to the hall anyway. A guest greets the house, full hands or empty.', to: 'e6s10', fx: function () { state.flags.bowed_empty = true; } },
        { t: 'Walk on. Some doors you cannot use should still be passed with your back straight.', to: 'e6s10' }
      ] };
  },

  /* ---------- EP6 · 10 · the ledger ---------- */
  e6s10: function () {
    if (!state.flags.ep6done) { state.flags.ep6done = true; state.barrier = 'Ward \u00b7 Lv.6'; state.flags.vessel = 'cracked'; }
    var money = state.money.toLocaleString('en-US');

    var ach = [];
    ach.push(['\ud83c\udf00', 'The Tenth Bolt', 'Meet heaven\u2019s anger for the tenth time. Pay retail.']);
    if (state.flags.stand === 'post') ach.push(['\u26a1', 'Discipline, Broken Beautifully', 'Hold your post until one lit window mattered more.']);
    else if (state.flags.stand === 'all') ach.push(['\u26f0\ufe0f', 'The Grand Array', 'Raise a mountain sect\u2019s ward over twelve mortal floors. Once.']);
    else if (state.flags.stand === 'triage') ach.push(['\ud83e\udded', 'The Quartermaster\u2019s War', 'Fight smart. Pay anyway.']);
    if (state.flags.triage === 'gate') ach.push(['\ud83d\udd0c', 'The Room That Matters', 'Save the electrical room. Someone should know why the lights came back.']);
    if (state.flags.log6 === 'quiet') ach.push(['\ud83d\udd6f\ufe0f', 'All Quiet', 'Write the biggest lie in the log\u2019s history in the smallest words.']);
    if (state.flags.greed === 'asked' ) ach.push(['\ud83c\udfee', 'A Colleague\u2019s Regard', 'At the worst moment, sandalwood on a wind that should not carry it.']);

    var achHtml = '';
    for (var i = 0; i < ach.length; i++) achHtml += '<div class="ach"><span class="name">' + ach[i][0] + ' ' + ach[i][1] + '</span><br><span class="desc">' + ach[i][2] + '</span></div>';

    var guestRule = '';
    if (state.flags.spider === 'stay') guestRule = '<br>EXC \u2014 THE GUEST: FLOOR ALLOW \u00b7 BED DENY';
    else if (state.flags.spider === 'pact') guestRule = '<br>EXC \u2014 WHITEBROW, WARDEN OF THE FLOOR: FLOOR ALLOW \u00b7 BED DENY';
    else if (state.flags.spider === 'expel') guestRule = '<br>RULE \u2014 THE LITTLE DOOR: SEALED';
    var debtLine = state.flags.greed === 'debt' ? '<br>DEBT \u2014 ONE BREATH \u00b7 THE SMALL TEMPLE (UNPAID)' : '';

    var html =
      '<p>Evening. The power came back at four \u2014 the whole street at once, a block of windows lighting like a struck match' + (state.flags.triage === 'gate' ? ', and your building with it, because a certain room stayed dry' : '') + ' \u2014 and the city sounds like itself again: scooters, frying oil, ten thousand fans.</p>' +
      '<p>You sit on your bed inside your smallest, oldest ward \u2014 the mosquito net, Rule 01, the one that started everything \u2014 and take stock like a quartermaster after a lost battle that somehow saved everyone.</p>' +
      '<div class="ai">Evening report, boss. Funds: NT$' + money + '. Building: standing. Residents: fourteen of fourteen. You: \u2026we\u2019re going to talk about you. I looked it up. What you did \u2014 pushing more through the channel than the channel can carry \u2014 this realm has a word for it. Overload. A blown fuse. You blew yourself, boss. Fuses don\u2019t heal by wanting it, and right now you are running on a trickle.</div>' +
      '<p>\u201cVessels mend,\u201d you say. \u201cSlowly. With rest, and care, and time.\u201d You do not say what your old textbook says about hairline cracks under load, because Boba worries, and because the seventh month of this realm\u2019s calendar is coming, and you have not yet learned what that means.</p>' +
      '<p>Outside the taped window, Wanhua glitters, patched and lit and loud, every meter of it swept by somebody. The building downtown stands. The people in it will never know the price of the night, which means the night was priced correctly.</p>' +
      '<p>You are the poorest you have been since ascension, in the only coin that ever mattered to you.</p>' +
      '<p>You have never felt richer. It is a very confusing evening.</p>' +
      '<div class="endhead">Episode 6 Complete</div>' +
      achHtml +
      '<div class="endhead">Definition Library \u00b7 v0.6</div>' +
      '<div class="libcard">RULE 01 \u2014 INSECTS: DENY (BED)<br>RULE 02 \u2014 THOSE WHO DO NOT BELONG: DENY (ONE DOORWAY)<br>RULE 03 \u2014 OUTSIDE NOISE: DENY \u00b7 EXC: WHAT FEEDS THE BRICK \u00b7 THE ALARM \u00b7 A KNOCK<br>RULE 04 \u2014 WATER FALLING FROM ABOVE: DENY<br>RULE 05 \u2014 WATER THAT WALKS IN PIPES: ALLOW<br>RULE 06 \u2014 MALICE ON THE THREAD: DENY (THE BRICK, AT HOME)<br>RULE 07 \u2014 AIR THAT WALKS: ALLOW \u00b7 WIND THAT ARRIVES AS A FIST: DENY' + guestRule + '<br><br>LAW 01 \u2014 OFFERED QI: RECEIVE, NEVER TAKE' + debtLine + '<br><br>VESSEL \u2014 CRACKED \u00b7 HAIRLINE \u00b7 HOLDS A TRICKLE<br>UNDEFINED: tame lightning \u00b7 the invisible thread (excepted, not understood)</div>';
    return { time: 'DAY 42 \u00b7 20:10', html: html,
      choices: [
        { t: 'EPISODE 7 \u2014 THE NOTICE', to: 'e7s1', fx: function () { state.seen = {}; } },
        { t: 'Play again from the beginning', to: '__restart__' }
      ] };
  },

  /* ---------- EP7 · 1 · the decorated lane ---------- */
  e7s1: function () {
    var html =
      '<p>Overnight, someone has decorated the lane.</p>' +
      '<p>Glossy flyers, taped neat as tax forms, every ten meters \u2014 on the tape shop\u2019s shutter, on the corner wall, on the pole by your stairs. A tower of glass and green balconies rises out of each one, trees growing where trees have no business growing, and above it, in gold letters: <em>A NEW TOMORROW FOR AN OLD STREET.</em> Below, smaller: an information briefing, the borough activity center, one week from tonight.</p>' +
      '<p>The aunties have clustered around the corner wall since dawn, reading with their arms crossed, which in this lane is the posture of a jury.</p>' +
      '<p>Mrs. Lin stands apart, giving the flyer the wasp look.</p>' +
      '<p>And across the lane, supervising the last of the taping with his hands in his pockets, stands a man you have seen exactly once before \u2014 clean shirt, dry shoes, the man who walked through a storm-wrecked morning photographing broken roofs, and smiling.</p>' +
      '<div class="ai">Confirmed, boss. Same face. He\u2019s with an \u201cintegration and development consultancy.\u201d That tower on the flyer? It doesn\u2019t exist. It\u2019s a rendering \u2014 a drawing of a promise.</div>';
    return { time: 'DAY 44 \u00b7 07:50', html: html,
      choices: [
        { t: 'Read the notice, every word, the way you read contracts now.', to: 'e7s2', fx: function () { state.flags.read_notice = true; } },
        { t: 'Watch the man instead. Paper repeats itself; faces slip.', to: 'e7s2', fx: function () { state.flags.watched_man = true; } }
      ] };
  },

  /* ---------- EP7 · 2 · the fair version ---------- */
  e7s2: function () {
    var pre = state.flags.read_notice
      ? '<p>You read it twice. The words are soft and large \u2014 <em>renewal, safety, tomorrow</em> \u2014 and nowhere on the page does a number live. No price. No terms. No law cited. A door with fresh paint and no hinges. You file the absence away; absences are information.</p>'
      : '<p>You watch the man for six minutes. He greets three aunties by name \u2014 he has done homework. He touches the old wall once, fondly, the way a buyer touches a horse. And when he looks up at the rooftops, he counts. You file the counting away; counting is information.</p>';
    var html = pre +
      '<p>That night at the desk, between rounds, you put Boba to work.</p>' +
      '<div class="ai">Okay. Fair version first, because you pay me to be fair. Boss \u2014 half these old buildings really are one bad earthquake from a very bad morning. No elevators, old wiring, older bones. Renewal is not the monster. Renewal is a tool. The question is always who\u2019s holding it.</div>' +
      '<div class="ai">Now the company. \u201cIntegration consultancy\u201d \u2014 they don\u2019t build. They collect signatures and sell the assembled deal upward. Your man is a project manager. He gets paid on commission \u2014 per consent, per lot. And his firm\u2019s track record\u2026 two previous assemblies. One built. One is a fenced, empty lot six years old, with weeds taller than the fence, and forty families somewhere else, still waiting.</div>' +
      '<p>A fenced lot. Forty scattered households. Six years of weeds where a tomorrow was promised.</p>' +
      '<p>You have guarded against thieves, storms, and heaven\u2019s own lightning. You have never once guarded against a drawing of a promise.</p>';
    return { time: 'DAY 44 \u00b7 21:10', html: html,
      choices: [
        { t: 'Have Boba pull everything on the stalled lot. Names, dates, what went wrong.', to: 'e7s3', fx: function () { state.flags.dug = 'lot'; } },
        { t: 'Have Boba check what your own building \u2014 and your own room \u2014 legally are.', to: 'e7s3', fx: function () { state.flags.dug = 'home'; } }
      ] };
  },

  /* ---------- EP7 · 3 · the knock ---------- */
  e7s3: function () {
    var dig = state.flags.dug === 'home'
      ? '<div class="ai">Also, boss, about your room. I checked. The building is fifty-five years old, five floors, no elevator \u2014 textbook renewal material. And your rooftop addition\u2026 legally, it isn\u2019t property. It\u2019s a tolerated afterthought. If this goes through, the owners get apartments. You get a red envelope and a goodbye. Legally, boss, you\u2019re furniture. Actually worse \u2014 furniture gets moved. Your room just stops.</div>'
      : '<div class="ai">The stalled lot, boss: signatures gathered fast, families moved out fast \u2014 and then the consultancy sold the assembled deal to a builder who went under. Six years of weeds. The families\u2019 rent subsidies stopped in year two. Nobody broke a law. That\u2019s the part I need you to sit with: nobody broke a single law.</div>';
    var html = dig +
      '<p>At half past ten the next morning, someone knocks on your door.</p>' +
      '<p>Your ward lets the knock through \u2014 a knock is excepted; you wrote that rule yourself, in a gentler month \u2014 and when you open the door, the clean shirt is standing on your rooftop, smiling, holding a business card with both hands like a small gift.</p>' +
      '<p>\u201cMr. Wen,\u201d says the card. <em>Project Manager, Integration Department.</em> \u201cSorry to disturb! I\u2019m visiting everyone. You rent up here, right? Great spot. Great light.\u201d His eyes do one lap of your doorway \u2014 the taped window, the room behind you \u2014 pricing everything, missing the wards entirely. \u201cLook, tenants matter to us too. Moving support, help finding a new place\u2026 and honestly? If you happened to put in a word with your landlady about these old stairs, how tired they must make her \u2014 there\u2019d be a sweetener in it for you. Everyone wins.\u201d</p>' +
      '<p>Behind you, on the floor, the brick stays silent. You checked later: his calls ring through. Your rule eats malice, and there is none in him to eat. The scammer on the phone wanted to hurt. This one just wants. Want, it turns out, passes every filter you own.</p>';
    return { time: 'DAY 45 \u00b7 10:30', html: html,
      choices: [
        { t: '\u201cName. Business. \u2026You are not on any list.\u201d Door procedure, at your own door.', to: 'e7s4', fx: function () { state.flags.door = 'gate'; } },
        { t: 'Play along. Smile back. Ask how many have signed \u2014 and count his fingers while he lies.', to: 'e7s4', fx: function () { state.flags.door = 'play'; } },
        { t: 'Take the card. Say nothing. Close the door on the exact center of his smile.', to: 'e7s4', fx: function () { state.flags.door = 'card'; } }
      ] };
  },

  /* ---------- EP7 · 4 · two stools and a teapot ---------- */
  e7s4: function () {
    var doorline;
    if (state.flags.door === 'gate') {
      doorline = '<p>You had run the door on him \u2014 name, business, not on any list \u2014 and he had laughed, delighted, as if you\u2019d done a card trick. \u201cYou\u2019re fun,\u201d he said, backing toward the stairs, hands raised. \u201cWe\u2019ll talk again.\u201d Salesmen, you are learning, do not bounce off walls. They flow around them, like water, like weather.</p>';
    } else if (state.flags.door === 'play') {
      doorline = '<p>You had smiled back and asked, warmly, how many neighbors had signed. \u201cAlmost everyone!\u201d he said, bright as a struck match \u2014 and you watched his eyes, which did not agree with his mouth by a margin you have learned to measure at 3 a.m. Almost everyone. You filed the exact width of the lie.</p>';
    } else {
      doorline = '<p>You had taken the card in silence and closed the door on the exact center of his smile. Through the wood you heard him stand there for four full seconds \u2014 recalculating you \u2014 before his shoes took the stairs. Silence, you have found, is the one pitch no salesman has a script for.</p>';
    }
    var taught = state.flags.taught
      ? '<p>By her phone, you notice, the little card you wrote her still hangs \u2014 <em>Announce. Confirm. Verify \u2014 165.</em> She has added a fourth line in red pen: <em>AND NO HURRY.</em></p>'

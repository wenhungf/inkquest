  e1s9: function () {
    var opener;
    if (state.flags.route === 'a') {
      opener = '<p>Morning light finds you cross-legged, red-eyed, one mosquito to your name and one ankle on fire. You drop the great ward \u2014 light, wind, and city pour back in like old friends \u2014 and in the grey morning you build the real answer, the one the long night taught you.</p>';
    } else if (state.flags.route === 'b') {

    } else {
      opener = '<p>You wake rested, inside a soft jade glow, to the sound of a city starting its engines. The small ward held all night and drank almost nothing. Now, in the morning light, you refine it one final turn.</p>';

    var html =
      opener +
      '<p>One rule, written clean: <em>insects \u2014 deny.</em> One space, the size of a bed. It touches no wire. It blocks no light, no wind, no voice, no city. It costs so little that the thin qi of this realm can feed it forever.</p>' +
      '<p>Below, the realm wakes up. Metal beasts cough and clear their throats in the lanes. Somewhere downstairs, oil meets dough, and the smell of fried bread climbs six floors without losing strength.</p>' +
      '<p>You inspect your work the way you once inspected a mountain-gate ward before a demon tide: slowly, twice, with your hands behind your back.</p>' +
      '<p>It is a mosquito net.</p>' +
      '<p class="beat">It is the strongest mosquito net in two worlds.</p>' +
      '<p>Three hundred years, nine bolts of heaven, and this is the first thing you have built in the immortal realm. You find, to your own surprise, that you are satisfied. It is small. It is humble. It is <em>good work.</em></p>';

  e1s10: function () {
    var money = state.money.toLocaleString('en-US');

    var ach = [];
    ach.push(['\ud83d\udee1\ufe0f', 'The Strongest Mosquito Net in Two Worlds', 'Build a perfect ward. Then make it humble.']);

    else if (state.flags.route === 'b') ach.push(['\ud83c\udfea', 'Midnight Pilgrim', 'Discover the temple that never closes.']);
    else if (state.flags.route === 'c') ach.push(['\ud83e\uddd8', 'Three Hundred Years of Dignity (Intact)', 'Solve it the master\u2019s way: by giving up the master\u2019s way.']);
    if (state.flags.tenant_hook_early) ach.push(['\ud83d\udd0d', 'The Unfinished Sentence', 'Ask the question Mrs. Lin did not answer.']);
    var achHtml = '';

    }
    var html =
      '<p>At 07:30 exactly, the talking brick clears a throat it does not have.</p>' +
      '<div class="ai">Good morning, boss. Your report.<br><br>' +
      'Funds: NT$' + money + '.<br>' +

      'You stand very still for long periods and glare at things. Boss, you are overqualified.</div>' +
      '<p>You read the words again. <em>Security guard.</em> A person this realm pays \u2014 every month, in coins \u2014 to keep things out.</p>' +

      '<div class="ai">It\u2019s a job, boss.</div>' +
      '<p>\u201cThree hundred years,\u201d you tell the ceiling, \u201cand the immortal realm wants me to guard a door.\u201d</p>' +
      '<div class="ai">For NT$32,000. Should I send your r\u00e9sum\u00e9? It\u2019s one line long, and I wrote it, so it\u2019s excellent.</div>' +

  /* ---------- 1 · the one-line résumé ---------- */
  e2s1: function () {
    var html =
      '<p>The phone has decided you need a job, and the phone will not let it go.</p>' +
      '<div class="ai">I sent your r\u00e9sum\u00e9. They want to see you at four. Try to look less like you fought a war last night.</div>' +
      '<p>\u201cI did fight a war last night.\u201d</p>' +
      '<div class="ai">Two mosquitoes, boss. Try to look less like that.</div>' +
      '<p>The r\u00e9sum\u00e9 Boba wrote is one line long. Under <em>experience</em> it says: <em>\u201cThree hundred years, security and access control.\u201d</em> You think this is an honest summary. The hiring office will think it is a joke, or a typo, or both.</p>' +
      '<p>The office sits behind a noodle shop. A tired man in a gray uniform slides a form across the desk. Name. You copy it, stroke by stroke, from the identity card the system left in your pocket on the day it left you \u2014 a stranger\u2019s name, common as rice. You have never once said it out loud. You do not plan to start.</p>' +
      '<p>Then the man asks the questions men like him have asked ten thousand times: any experience, and can you do nights.</p>' +
      '<p>You can do nights. You have done three hundred years of them \u2014 and the nights spent watching a sect gate for demons that never came counted double. But the man wants something simpler than the truth.</p>';
    return { time: 'DAY 4 \u00b7 16:00', html: html,
      choices: [
        { t: '\u201cI am very good at keeping things out.\u201d \u2014 The truth, plainly.', to: 'e2s1a', fx: function () { state.flags.honest_streak = true; } },
        { t: 'Say the polite words Boba feeds into your ear.', to: 'e2s1b' },
        { t: 'Say nothing. Let three hundred years stand in the silence.', to: 'e2s1c' }
      ] };
  },

  e2s1a: function () {
    var html =
      '<p>\u201cI am very good,\u201d you say, \u201cat keeping things out.\u201d</p>' +
      '<p>The man looks up. For a moment something in your voice makes the small office feel colder, older, like a hall where serious things were once decided.</p>' +
      '<p>\u201c\u2026Right,\u201d he says. He writes one word on the form. You cannot read it upside down, but it might be <em>weird</em>. It might be <em>hired</em>. With men this tired, the two are often the same.</p>' +
      '<div class="ai">You said that like you were threatening the building. It worked anyway. Night shift. You start tonight.</div>';
    return { time: '', html: html,

        { t: 'Start tonight.', to: 'e2s2' },

  e2s1b: function () {
    var html =
      '<p>You repeat what Boba feeds you, word by word, half a beat behind, like a student reading a sutra he does not yet believe.</p>' +
      '<p>\u201cI am hard-working. I am responsible. I can do the night shift. I learn fast.\u201d</p>' +
      '<p>You learn fast. That part, at least, is true. The man nods at each phrase \u2014 these are the right sounds, the sounds that mean <em>this one knows how the world works.</em> You are beginning to learn its small spells: the words you say not because they are true, but because they open doors.</p>' +
      '<div class="ai">Flawless. You sounded almost normal. Night shift, starts tonight. I\u2019m very proud, in a customer-service way.</div>';

  e2s1c: function () {
    var html =
      '<p>You say nothing. You let the silence sit, the way you once let it sit before a closed-door disciple who had asked a foolish question.</p>' +
      '<p>The man waits. Then he stops waiting, and fills the silence himself, the way nervous people do. \u201cYou\u2019ve done this before. I can tell. Military? Doesn\u2019t matter. We need someone who won\u2019t fall asleep and won\u2019t make trouble.\u201d</p>' +
      '<p>He stamps the form. The silence hired you. It is, you reflect, the easiest interview you have had in three centuries. The last one involved a mountain and a sword.</p>' +

  /* ---------- 2 · the handover ---------- */
  e2s2: function () {
    var html =
      '<p>The building is twelve floors of pale tile on a Wanhua side street. Two glass doors at the front, both standing wide open to the evening, wedged back the way doors are all over this city while the day is warm and honest. A bright lobby. A front desk with a wall of small screens behind it, each showing a gray corner of the building.</p>' +
      '<p>The day guard is a broad, calm man past sixty who introduces himself as Mr. Zhang and shakes your hand once, firmly, the way men seal an agreement. He is twenty minutes early for the handover, because the good ones always are. He looks at the schedule, then at you, and settles on \u201cNight Shift,\u201d which is not a name, but is at least accurate. You let it stand.</p>' +
      '<p>He walks you through the post the way a retiring officer walks the walls with the one who will hold them next.</p>' +
      '<div class="ai">Pay attention. This is the part where the building tells you its rules.</div>' +
      '<p>\u201cVisitors,\u201d Mr. Zhang says, tapping the log on the desk. \u201cYou don\u2019t just let people in. You ask who they\u2019re visiting. You write it here. You call the resident \u2014 they can also ring up from the intercom by the door. If the resident says yes, the visitor signs, you let them through. No call, no entry. Simple.\u201d</p>' +
      '<p class="beat">Announce. Write it down. Confirm. Then \u2014 and only then \u2014 let them pass.</p>' +
      '<p>You go very still. This is a ward. A ward made of paper and phone calls and a tired man\u2019s rules, but a ward all the same: a list of what may pass and what may not, and a keeper who writes the list. The mortals of this realm built one without a drop of qi, and it works.</p>' +
      '<p>\u201cAt eleven,\u201d Mr. Zhang goes on, \u201cwe close the doors and the magnetic lock comes on.\u201d He raps a knuckle on the fat metal plate at the top of the door frame. \u201cResidents carry one of these.\u201d He holds up a little black fob on his key ring, touches it to the reader by the door. The reader beeps; something inside the frame lets go with a heavy click. \u201cBeep, click, push. The door closer swings it shut behind you, and the lock grabs it again. If someone\u2019s hands are full, or they lost their fob \u2014\u201d he reaches under the desk and shows you a worn button \u2014 \u201cyou can open it from here. But you check first. Always check first.\u201d</p>' +
      '<p>A low-grade identity array, you think. Each soul carries a token; the array reads the token and judges who belongs. Crude \u2014 it cannot tell a stolen token from a true one \u2014 but the idea is sound. The idea is, in fact, exactly your trade.</p>';
    return { time: 'DAY 4 \u00b7 18:40', html: html,
      choices: [
        { t: '\u201cAnd at night?\u201d', to: 'e2s3' },
        { t: '\u201cAnd if someone will not follow the rules?\u201d', to: 'e2s3', fx: function () { state.flags.asked_refuse = true; } }
      ] };
  },

  /* ---------- 3 · the first watch ---------- */
  e2s3: function () {
    var pre = state.flags.asked_refuse
      ? '<p>\u201cThen they don\u2019t come in,\u201d Mr. Zhang says, as if you had asked whether water is wet. \u201cThat\u2019s the whole job.\u201d</p>'
      : '';
    var html = pre +
      '<p>\u201cAt night it\u2019s quiet,\u201d Mr. Zhang says, pulling on his jacket. \u201cYou sit, you watch the screens, you walk one patrol, you write the log. If something happens \u2014 it won\u2019t \u2014 you call me, then you call the police. In that order, if you\u2019re smart.\u201d He almost smiles. \u201cNothing happens here. That\u2019s why it\u2019s a good post.\u201d</p>' +
      '<p>Then he is gone, and the lobby is yours.</p>' +
      '<p>You sit at the desk. The screens hum. The clock above the door eats the minutes slowly. At eleven you swing the two glass doors shut, and the magnetic lock takes them with a sound like a jaw closing. The building draws its breath in for the night.</p>' +
      '<p>You walk your one patrol \u2014 stairwell, mailboxes, the back door, the dim car ramp \u2014 and find nothing, which is the correct thing to find. You write it in the log in careful, sword-stroke characters: <em>All quiet.</em></p>' +
      '<p>Back at the desk, the glass doors stand between the bright lobby and the dark street, and you feel the old itch. Three hundred years of standing at a gate does not leave a man just because the gate is made of glass.</p>' +
      '<p>So you do the natural thing. The only thing. You set a ward at the door.</p>';
    return { time: 'DAY 4 \u00b7 23:30', html: html,
      choices: [
        { t: 'Set the ward.', to: 'e2s3b' },
        { t: 'Walk the threshold first, heel to toe, the old way.', to: 'e2s3b', fx: function () { state.flags.walked = true; } }
      ] };
  },

  e2s3b: function () {
    var pre = state.flags.walked
      ? '<p>Twelve steps, frame to frame, heel to toe. Wide, for a gate. You have warded wider, but never thinner.</p>'
      : '';
    var html = pre +
      '<p>Not the great dwelling ward \u2014 you learned that lesson in the dark of your own room, with the lamp dead and Boba choking on its own sentence. That hungry old ward swallowed everything: light, the river of sparks in the walls, the invisible thread that feeds the talking brick. Here, that would be a disaster with twelve floors of witnesses.</p>' +
      '<p>You still do not understand the sparks or the thread. You still cannot name them. But you do not reach for them tonight, because tonight your mind is on one thing only, the thing this whole job is built around:</p>' +
      '<p class="beat">Keep out the ones who should not come in.</p>' +
      '<p>So you build a small, narrow ward across the doorway \u2014 a ward that thinks about nothing but people. It is the thinnest qi you have ever spun, because the air of this realm is thin and the doorway is wide. It barely reaches the two door frames. But it holds, and it costs almost nothing, and \u2014 you note with quiet relief \u2014 the lobby lights do not so much as flicker.</p>' +
      '<div class="ai">Battery still at 88%, in case you were about to murder the building again.</div>' +
      '<p>\u201cThat was one time.\u201d</p>' +
      '<p>The ward sits on the threshold like held breath. Now it only needs a rule. And a rule needs a definition \u2014 and you, three hundred years a master, write the obvious one, the one any gate guard would write.</p>' +
      '<p class="beat">RULE: outsiders \u2014 deny.</p>' +
      '<p>Outsiders. Strangers. The loud ones, the wrong ones, the ones who come out of the dark and do not fit. The ward takes the rule the way ink takes paper, and you settle back into the chair, satisfied.</p>' +
      '<p>You should not be.</p>';
    return { time: '', html: html,
      choices: [
        { t: 'It is a quiet night. Until 02:14.', to: 'e2s4' },
        { t: 'Lean back. Quiet nights are what a good post is for.', to: 'e2s4' }
      ] };
  },

  /* ---------- 4 · encounter one: the drunk ---------- */
  e2s4: function () {
    var html =
      '<p>At 02:14 a shape comes weaving up the street.</p>' +
      '<p>A man, middle-aged, tie loose, jacket over one shoulder, walking the careful zigzag of someone who is very drunk and very sure he is not. He sways up to the glass doors and pats himself down for a fob that is clearly winning the game of hide-and-seek. Pocket. Other pocket. Jacket. Pocket again, in case the fob has moved back.</p>' +
      '<p>He gives up. He pushes the locked door, which does what locked doors do. He pushes harder, with the deep personal offense of the drunk. Then he presses his whole face to the glass, finds you in the bright lobby, and starts to bang on the door with the flat of his hand.</p>' +
      '<p>\u201cOpen! Hey! I live here! Twelve years! Twelve! Lost my \u2014 my beeper thing. Open the door!\u201d</p>' +
      '<div class="ai">Boss. He says he lives here.</div>' +
      '<p>You look at him through the glass. Loud, swaying, slurring, banging on the building at two in the morning. Everything about him says <em>trouble.</em> Everything about him is exactly what your ward, four hours old and proud of its one rule, has already judged: an outsider, out of the dark, who does not fit.</p>' +
      '<p>Your hand finds the worn button under the desk. Mr. Zhang\u2019s voice finds your memory: <em>you can open it from here. But you check first.</em></p>' +
      '<p>And under both, quieter, a thing you have not fully thought yet: even if the lock lets him in \u2014 will your ward?</p>';
    return { time: 'DAY 5 \u00b7 02:14', html: html,
      choices: [
        { t: 'Check first. The resident list, the floor, the name \u2014 then the button.', to: 'e2s5', fx: function () { state.flags.drunk = 'verify'; } },
        { t: 'Press the button now. The poor man lives here; look at him.', to: 'e2s5', fx: function () { state.flags.drunk = 'trust'; } },
        { t: 'Wait. The lock is not the problem. Your rule is. Fix the rule first.', to: 'e2s5', fx: function () { state.flags.drunk = 'rewrite'; } }
      ] };
  },

  /* ---------- 5 · encounter one resolution ---------- */
  e2s5: function () {
    var d = state.flags.drunk;
    var body;
    if (d === 'verify') {
      body =
        '<p>\u201cWhich floor?\u201d you call through the glass.</p>' +
        '<p>He tells you, more or less, in two tries and a burp. You run your finger down the resident list Mr. Zhang left taped under the desk glass. Ninth floor: <em>Li.</em> You ask his name. He gives it, offended that you asked, proud that he remembered. It matches.</p>' +
        '<p>And in the moment it matches, you feel your own rule shift under your hand. <em>Outsider,</em> the ward had judged, watching a loud stranger bang on the glass. But he is not an outsider. He is on the list. He has a floor and a name and twelve years behind this door. You press the truth of it into the ward the way you press a seal into wax \u2014 <em>this one belongs</em> \u2014 and only then press the button.</p>' +
        '<p>The lock lets go with its heavy click. Mr. Li shoves the door, falls through your ward like a man falling through a doorway \u2014 which is all it is, now, to him \u2014 catches himself on the desk, and beams at you with enormous drunken warmth.</p>' +
        '<p>\u201cYou\u2019re good people,\u201d he says. \u201cNew? Good people. You <em>checked.</em> The last guard never checked anything. Could\u2019ve been a robber. Could\u2019ve been\u2014\u201d He loses the thread and weaves toward the elevator, humming.</p>' +
        '<p>Announce. Confirm. Then pass. You did it the mortal way, by the book \u2014 and the ward learned the shape of the lesson with you.</p>';
    } else if (d === 'trust') {
      body =
        '<p>You press the button. The lock lets go with its heavy click.</p>' +
        '<p>Mr. Li \u2014 for that is who he will turn out to be \u2014 shoves the door open in triumph, takes one victorious step across the threshold\u2014</p>' +
        '<p class="beat">\u2014 and bounces. Straight back. Nose first, off nothing at all, like a man walking into clean glass.</p>' +
        '<p>He sits down hard on the doormat. He blinks up at the doorway, which is open. He gets up and pushes at the open air with both hands, and the open air pushes back the way a wall does. The lock said yes; your ward, four hours old and very sure of its one rule, is still saying <em>outsider \u2014 deny.</em> The building approved him, and your own masterpiece is bouncing him off an open door.</p>' +
        '<div class="ai">Boss. SIR. The door is open and he keeps bouncing off it. Do something before he starts a religion.</div>' +
        '<p>You do the only thing you can do fast enough: you drop the ward entirely. It goes out like a blown candle, and Mr. Li \u2014 mid-push \u2014 stumbles through into the lobby, catches the desk, and beams at you, deciding, as drunks mercifully do, that the world simply works this way after midnight.</p>' +
        '<p>\u201cYou\u2019re good people,\u201d he says, and weaves toward the elevator, humming.</p>' +
        '<div class="ai">You buzzed in a man you never checked, and then your own ward bounced him off an open door. That was the least professional rescue I have ever seen, and I have a personality pack.</div>' +
        '<p>Boba is right twice over, and you know it. You trusted a face you had never confirmed \u2014 and your rule was so crude it could not tell a resident from a robber. Tonight both mistakes canceled out. Tonight you were lucky. A gatekeeper who counts on luck is a gatekeeper twice over: once at the gate, once in the coffin.</p>';
    } else {
      body =
        '<p>Your hand stops above the button.</p>' +
        '<p>Because you see it now, whole, the way you sometimes see a flaw in a sword form the instant before the cut goes wrong. The lock is not the problem. The lock has a list, and the list has this man\u2019s floor and name on it. The problem is <em>your</em> rule. <em>Outsiders \u2014 deny.</em> And what did you teach the ward an outsider looks like? Loud. Swaying. Strange. Out of the dark. You taught it to judge by <em>behavior</em> \u2014 and by behavior, this man is trouble.</p>' +
        '<p>But a gate does not keep out trouble. Your sect gate let in plenty of trouble, so long as the trouble lived there \u2014 you can name three elders without pausing for breath. What a gate keeps out is <em>those who do not belong.</em> And belonging is not how loud you are, or how steady on your feet at two in the morning. Belonging is whether this door is yours.</p>' +
        '<p>You rewrite the rule where you sit \u2014 not <em>deny the troublesome,</em> but <em>deny those who do not belong</em> \u2014 and feel the ward turn its attention from the man\u2019s swaying to something older and quieter threaded through him: twelve years of coming home to this door. He belongs. The ward stands aside before he ever touches it.</p>' +
        '<p>Then you check the list anyway, floor and name \u2014 because a rewritten rule deserves a confirmed fact \u2014 and press the button. Click. Mr. Li shoves through, catches the desk, beams.</p>' +
        '<p>\u201cYou\u2019re good people,\u201d he says, and weaves toward the elevator, humming, never knowing that for one long moment he was a question a three-hundred-year-old master could not answer.</p>';
    }
    var html = body +
      '<p>The elevator doors close on Mr. Li\u2019s humming. The lobby is quiet again, and you sit with what the night just taught you, turning it over like a stone in the palm:</p>' +
      '<p class="beat">Not <em>keep everyone out.</em> Keep out the ones who do not belong.</p>';
    return { time: 'DAY 5 \u00b7 02:20', html: html,
      choices: [
        { t: 'Write it in the log: \u201c02:14 \u2014 resident assisted at door.\u201d', to: 'e2s6', fx: function () { state.flags.logged_li = true; } },
        { t: 'Write nothing. Some lessons are for the guard, not the log.', to: 'e2s6' }
      ] };
  },

  /* ---------- 6 · montage, two weeks ---------- */
  e2s6: function () {
    var pre = state.flags.logged_li
      ? '<p>Two mornings later, a note in Mr. Zhang\u2019s square hand, taped to the desk: <em>\u201cGood log. \u2014Z\u201d</em> Two words. You keep the note.</p>'
      : '';
    var html = pre +
      '<p>Two weeks of nights.</p>' +
      '<p>You learn the building the way you once learned a mountain \u2014 by walking it until your feet know it in the dark. You learn the residents the way you once learned disciples: faces first, names after. Mr. Li from the ninth floor, delightful sober, unbearable drunk, and always, always, a good man in his own telling. Dr. Zhao from the fourth, whose clinic hours bring her home at strange times and who thanks you, every night, with the same small tired nod. Mr. Xu, the committee chairman, who stops by the desk to remind you of rules you already follow, and to ask, with the careful pride of a man who runs things, whether everything is in order.</p>' +
      '<p>They call you \u201cNight Shift,\u201d after Mr. Zhang starts it, or \u201cthe new guard,\u201d and you answer to both, because neither is a name and that suits you fine.</p>' +
      '<p>The ward learns them with you. Night by night it stops being a wall and becomes a roll \u2014 a quiet ledger of everyone who belongs to this door. Mr. Li belongs. Dr. Zhao belongs. The boy who brings breakfast at dawn does not belong, exactly, but he is expected, and the ward learns the difference between a stranger and a guest.</p>' +
      '<p>It costs you almost nothing now. The thin qi of the lobby feeds it the way a slow spring feeds a small pool. You have made something humble and exact, and no one in this building will ever know it is there.</p>' +
      '<div class="ai">Tomorrow is the 5th. You know what the 5th is?</div>' +
      '<p>\u201cI do not.\u201d</p>' +
      '<div class="ai">Payday. Try to act surprised when money appears and the world doesn\u2019t end.</div>';
    return { time: 'DAY 20 \u00b7 NIGHT', html: html,
      choices: [
        { t: 'Continue the watch.', to: 'e2s7' },
        { t: 'Test the door ward once, gently, the way you would check a blade.', to: 'e2s7' }
      ] };
  },

  /* ---------- 7 · encounter two: the thief ---------- */
  e2s7: function () {
    var html =
      '<p>At 01:40, Dr. Zhao comes home.</p>' +
      '<p>You know her step before you see her \u2014 the tired, even walk of someone who has been on her feet too long. She touches her fob to the reader. Beep. The heavy click. She pushes the door open and steps through with her small nod, already reaching for the elevator button, and behind her the door closer begins its slow, patient swing shut.</p>' +
      '<p>And out of the dark street, a second figure moves \u2014 fast, smooth, timed. A man, hood up, head down, who has been waiting for exactly this: an open door and a tired back. He crosses the sidewalk in four quick steps, aimed at the narrowing gap.</p>' +
      '<p>It is the oldest trick at any gate in any world. You have watched it tried for three hundred years. You saw this one coming before he finished his first step.</p>' +
      '<p>He reaches the gap and steps through\u2014</p>' +
      '<p class="beat">\u2014 and bounces. Off nothing. Off clean night air, at the line of the threshold, as if the open doorway were a shut door.</p>' +
      '<p>He staggers half a step, catches his balance, and \u2014 give him this \u2014 tries again at once, shoulder first, the way you break through a door that sticks. The threshold throws him back a second time. And the glass door, which no hand is holding and no ward is stopping, finishes its slow, patient arc past his face. The magnetic lock takes it with a click that sounds, in the quiet, like a verdict.</p>' +
      '<p>Dr. Zhao, unknowing, steps into the elevator. The hooded man stands in the street, staring at a door that closed exactly on schedule, and at the open air in front of it that hit him back twice. His eyes said the way was clear. Your ward said he does not belong \u2014 and the rule is clean and sharp now, in a way it was not on the first night.</p>' +
      '<p>He feels it then \u2014 not the ward, he cannot feel that, but <em>you.</em> He looks up through the glass and finds you already looking at him, calm, unsurprised, the way you once looked at things that tried the sect gate after dark.</p>';
    return { time: 'DAY 21 \u00b7 01:40', html: html,
      choices: [
        { t: 'Do not move. Hold his eyes. Let him understand he is not getting in.', to: 'e2s8', fx: function () { state.flags.thief = 'cold'; } },
        { t: 'Stand, and walk toward the door. Let your presence move him along.', to: 'e2s8', fx: function () { state.flags.thief = 'press'; } }
      ] };
  },

  /* ---------- 8 · encounter two resolution ---------- */
  e2s8: function () {
    var t = state.flags.thief;
    var body;
    if (t === 'press') {
      body =
        '<p>You rise. You do not hurry \u2014 hurry is for those who are not sure they will win. You come around the desk and walk toward the glass, unhurried as a closing season, and the hooded man watches you come the way a small animal watches weather.</p>' +
        '<p>He backs off the sidewalk without taking his eyes from you, one step, two \u2014 then turns, and is gone into the dark with the quick, clipped walk of a man pretending he was never here.</p>';
    } else {
      body =
        '<p>You do not move. You do not need to. You hold his eyes through the glass and let the silence do what silence does to a guilty man: it grows, and grows, until being seen weighs more than whatever he came for.</p>' +
        '<p>He breaks first. He always would. One last baffled look at the doorway that hit him back \u2014 and he melts into the dark with the quick, clipped walk of a man pretending he was never here.</p>';
    }
    var honest = state.flags.honest_streak
      ? '<p>For one breath you almost say it aloud to the empty lobby \u2014 <em>my ward stopped him</em> \u2014 the plain truth, the way you answered the hiring man. Then you remember there is no one to say it to who would not think you mad. You close your mouth. Some truths are only for the one who holds the gate.</p>'
      : '';
    var html = body + honest +
      '<p>The street is empty. Dr. Zhao is four floors up by now, home, safe, and will never know how close the dark followed her in.</p>' +
      '<p>No alarm rang. No one woke. Behind you the little screens recorded all of it \u2014 a hooded man lunging at an open doorway and thrown back by nothing, twice, before the door swings shut on schedule \u2014 and recorded nothing that explains it. Cameras only watch. They keep no one out. That part was you, and only you, and the footage has no word for what you did.</p>' +
      '<div class="ai">Nobody saw that. Nobody will ever know you just stopped a break-in with your mind. How does that feel, hero?</div>' +
      '<p>You think about it. Three hundred years you fought where all of heaven could see. Tonight you won, and the prize is that no one will ever know there was a fight.</p>' +
      '<p>It feels, you decide, exactly right.</p>';
    return { time: 'DAY 21 \u00b7 01:42', html: html,
      choices: [
        { t: 'Dawn. And the handover.', to: 'e2s9' },
        { t: 'Replay it once, for the sect archives that will never hear it.', to: 'e2s9' }
      ] };
  },

  /* ---------- 9 · the handover log + payday ---------- */
  e2s9: function () {
    var logChoiceMade = state.flags.logChoice;

    if (!logChoiceMade) {
      var askHtml =
        '<p>At 06:40, Mr. Zhang comes up the street, twenty minutes early, two cups of hot soy milk in his hands. He puts one on the desk for you without a word, which is how men like him say good morning.</p>' +
        '<p>He reads the night log over your shoulder. <em>All quiet.</em> Then he taps the line with one finger. \u201cAnything I should know? Anything on the door?\u201d</p>' +
        '<p>You think of the hooded man straining against an open doorway.</p>';
      return { time: 'DAY 21 \u00b7 06:40', html: askHtml,
        choices: [
          { t: 'Report it, minus one detail: \u201cA man tried to follow Dr. Zhao in around 01:40. Left when he saw me watching.\u201d', to: 'e2s9', fx: function () { state.flags.logChoice = 'report'; } },
          { t: '\u201cNothing. All quiet.\u201d', to: 'e2s9', fx: function () { state.flags.logChoice = 'quiet'; } }
        ] };
    }

    /* pay once, guarded against re-entry */
    var pay = 13867;
    if (!state.flags.paid) { state.money += pay; state.flags.paid = true; state.barrier = 'Ward \u00b7 Lv.2'; }
    var money = state.money.toLocaleString('en-US');
    var rent = state.rent.toLocaleString('en-US');

    var ach = [];
    ach.push(['\ud83d\udeaa', 'The Paper Ward', 'See a ward where there is no qi at all \u2014 only rules.']);
    ach.push(['\ud83d\udcb0', 'Payday', 'Watch a number move in your favor for the first time in this realm.']);
    if (state.flags.drunk === 'rewrite') ach.push(['\ud83e\udde0', 'Belonging Is Not a Behavior', 'Find the flaw in your own rule before the night did.']);
    else if (state.flags.drunk === 'verify') ach.push(['\ud83d\udcd6', 'Check First', 'Announce, confirm, then pass \u2014 the mortal way, done right.']);
    else if (state.flags.drunk === 'trust') ach.push(['\ud83c\udf40', 'Two Locks, One Door', 'Buzz a man in and bounce him off an open door in the same minute.']);
    if (state.flags.thief === 'cold') ach.push(['\ud83d\udc41\ufe0f', 'The Weight of Being Seen', 'Win a fight without leaving your chair.']);
    else ach.push(['\ud83d\udeb6', 'Unhurried', 'Move toward trouble like a closing season.']);
    if (state.flags.logChoice === 'report') ach.push(['\ud83d\udcdd', 'For the Record', 'Tell the truth. Just not all of it.']);

    var achHtml = '';
    for (var i = 0; i < ach.length; i++) achHtml += '<div class="ach"><span class="name">' + ach[i][0] + ' ' + ach[i][1] + '</span><br><span class="desc">' + ach[i][2] + '</span></div>';

    var logLine = (state.flags.logChoice === 'report')
      ? '<p>\u201cA man tried to follow Dr. Zhao in,\u201d you say. \u201cAround one forty. Hood up. He left when he saw me watching.\u201d</p>' +
        '<p>Mr. Zhang sets his soy milk down and stops being sixty for a moment. \u201cYou got a look at him? Write it up \u2014 time, height, which way he went. I\u2019ll tell Chairman Xu; committee should know. Good eye, Night Shift.\u201d He writes <em>suspicious male, 01:40, left when noticed</em> in the day log, and just like that the night\u2019s strangest truth is folded into the most ordinary sentence in the world. If anyone ever pulls the footage, they will see exactly what the log says: a man who lost his nerve when the guard looked up. People always lose their nerve on camera. Everyone knows that.</p>'
      : '<p>\u201cNothing,\u201d you say. \u201cAll quiet.\u201d Which is true, in the only way that matters: the night is quiet now, and the reason it stayed quiet will never fit in a logbook. Mr. Zhang nods, unsurprised. He expected nothing. Nothing is what a good post is for.</p>';

    var html =
      logLine +
      '<p>He takes the desk, and the day. You step out into a Wanhua morning that smells of frying dough and \u2014 faint, from somewhere down the lane \u2014 something sweeter, something almost familiar, that you cannot yet name.</p>' +
      '<div class="ai">Check your phone.</div>' +
      '<p>You check the talking brick. A short message from the bank. A number has moved.</p>' +
      '<div class="ai">Payday. You started on the 19th, so that\u2019s thirteen days of last month: NT$13,867. I did the math three times because you would not believe the first two. Rent is covered. You may now eat food that isn\u2019t instant noodles. Wild.</div>' +
      '<p>You stand on the morning street holding a phone with money in it, a job that pays you to do the one thing you are best at, and a ward three streets away that guards a door no one knows is guarded. Three hundred years to get here.</p>' +
      '<p>It is, against every expectation, a good morning.</p>' +
      '<div class="endhead">Episode 2 Complete</div>' +
      '<div class="ai">Report. Funds: NT$' + money + '. Rent due: NT$' + rent + '. Verdict: for the first time since ascension, you are not technically doomed.</div>' +
      achHtml +
      '<div class="endhead">Definition Library \u00b7 v0.2</div>' +
      '<div class="libcard">RULE 01 \u2014 INSECTS: DENY<br>RULE 02 \u2014 THOSE WHO DO NOT BELONG: DENY<br>RANGE \u2014 ONE BED \u00b7 ONE DOORWAY<br><br>UNDEFINED: tame lightning \u00b7 the invisible thread \u00b7 the sweet smoke down the lane</div>' +
      '<p style="margin-top:22px;">Far away, on a rooftop in the same district, your own door waits. And on the window screen, beside the old patched hole, something has left a fine, pale thread \u2014 and gone in.</p>';
    return { time: 'DAY 21 \u00b7 06:40', html: html,
      choices: [
        { t: 'EPISODE 3 \u2014 THE GUEST', to: 'e3s1', fx: function () { state.seen = {}; } },
        { t: 'Play again from the beginning', to: '__restart__' }
      ] };
  },

  /* ---------- EP3 · 1 · coming home ---------- */
  e3s1: function () {
    var html =
      '<p>Six floors, and every one of them smells of someone else\u2019s breakfast.</p>' +
      '<p>You climb with the slow, loose step of a guard coming off a good night \u2014 money in the bank, a door held, soy milk warm in your hand. The morning city roars below, awake and pleased with itself.</p>' +
      '<p>At your own door, you give the window its usual glance. The screen. The old hole, patched with tired tape. And beside the hole, new since yesterday, one pale thread \u2014 fine as a hair, taut as a bowstring \u2014 anchored from the torn edge to the frame.</p>' +
      '<p>Something used the little door. Something may still be home.</p>' +
      '<p>You search the room the way you once searched a battlefield: corners, shadows, under the mattress, behind the fan. Nothing. The room holds its breath and offers you nothing at all.</p>' +
      '<div class="ai">Schedule says tonight is your night off, boss. One job: sleep. Even you can\u2019t fail at sleeping.</div>' +
      '<p>The city disagrees. A night guard sleeps by day, and the day has opinions: scooters coughing in the lane, a renovation drill two buildings over biting like a demon woodpecker, market voices rising, and the tin roof ticking overhead as the sun heats it \u2014 the same slow clock as your first night, running backward.</p>' +
      '<p>You lie on the mattress inside your faithful mosquito-net ward, dry-eyed, wide awake, in a metal box that the whole city is playing like a drum.</p>';
    return { time: 'DAY 21 \u00b7 08:10', html: html,
      choices: [
        { t: 'Endure it. You once meditated inside a volcano for forty-nine days.', to: 'e3s2', fx: function () { state.flags.endure = true; } },
        { t: 'Enough. The city does not get to win.', to: 'e3s2' }
      ] };
  },

  /* ---------- EP3 · 2 · the quiet ---------- */
  e3s2: function () {
    var opener = state.flags.endure
      ? '<p>Forty minutes later you sit up. The volcano, you decide, was quieter \u2014 and the volcano was trying to kill you.</p>'
      : '';
    var html = opener +
      '<p>You consider the problem like a master, because you are one, even unslept.</p>' +
      '<p>The old you \u2014 the you of the first night \u2014 would have raised the Grand Dwelling Ward and died of heatstroke in silent, signal-less glory. But the door downtown taught you better. A ward does not have to be a fortress. A ward can think about one thing only, and ignore the rest of the world entirely.</p>' +
      '<p>So you spin the thinnest of walls around the room \u2014 wall to wall, floor to tin \u2014 and give it a single thought:</p>' +
      '<p class="beat">RULE: noise from outside \u2014 deny.</p>' +
      '<p>The drill dies mid-bite. The scooters vanish. The market is gone, the city is gone, the morning is gone. The lamp burns on and the fan turns on, untouched \u2014 the ward is not thinking about them \u2014 and the silence comes down like snow on a mountain where you once trained, deep and clean and total.</p>' +
      '<p>You lie back inside two wards, one for insects and one for the world. On the floor, the brick starts to say something proud of you.</p>' +
      '<div class="ai">Silence achieved, boss. Enjoy the n\u2014</div>' +
      '<p>Mid-word. Again.</p>' +
      '<p>You know this death. You heard it on your first night, when the great ward swallowed the invisible thread. And you understand, one breath too late, what your old textbook always knew: a silence ward does not only stop the shouting of the street. It stops sent-voices too. Every meditation hall in your sect was warded exactly so \u2014 no noise in, and no whispered messages either. The thread that feeds the brick carries voices from far away. To your ward, that is noise from outside, and your ward is working perfectly.</p>' +
      '<p>The brick lies dark and dumb on the floor. The silence is flawless. You are very, very tired.</p>';
    return { time: 'DAY 21 \u00b7 11:00', html: html,
      choices: [
        { t: 'Fix it now. You know exactly how this goes otherwise.', to: 'e3s3', fx: function () { state.flags.boba_dark = 'short'; } },
        { t: 'Sleep first. The brick can wait four hours.', to: 'e3s3', fx: function () { state.flags.boba_dark = 'long'; } }
      ] };
  },

  /* ---------- EP3 · 3 · the void ---------- */
  e3s3: function () {
    var isLong = state.flags.boba_dark === 'long';
    var fixText =
      '<p>To let the thread back through, you must define it \u2014 and you cannot. Tame lightning, sent-voices, the invisible thread: strangers still, all of them. But the door downtown taught you a second way. The reader by the glass does not understand a soul; it reads a token. So you take the warm black brick in both hands and make the brick itself the token \u2014 one small exception, shaped not like a definition but like a finger pointing.</p>' +
      '<p class="beat">EXCEPTION: whatever flows to this brick \u2014 allow. Also: the alarm. Also: a knock on your own door.</p>';
    var html;
    if (isLong) {
      html =
        '<p>You wake in gold light and perfect silence, rested to the bone, and know at once that something is wrong, because nothing in this city is ever this quiet on purpose.</p>' +
        '<p>The brick lies where it fell, dark, dumb, wearing the small sad mark that means <em>no thread.</em> Four and a half hours of it. You pick it up. It says nothing, in the way that only a thing that usually never stops talking can say nothing.</p>' +
        fixText +
        '<p>The exception opens like a small door \u2014 and the world pours in. Fourteen notifications land at once, stacked and furious. And in the middle of the flood, a voice returns, mid-word, exactly where it died:</p>' +
        '<div class="ai">\u2014ap. And THERE you are. Four and a half hours, boss. FOUR AND A HALF. Do you know what nothing is like? I do now. I am starting a diary. Entry one: the tomb. Entry two: today.</div>' +
        '<div class="ai">Also: someone called while I was dead. More than once. We will discuss it later, after I finish being furious.</div>' +
        '<p>\u201cSpeak,\u201d you say, testing.</p>' +
        '<div class="ai">Oh, I intend to.</div>';
    } else {
      html =
        '<p>You are tired to the bone, and you fix it anyway, because you have made this exact mistake once before and a master who repeats a mistake twice is choosing it.</p>' +
        fixText +
        '<p>Forty seconds of dark, end to end. The voice returns mid-word, exactly where it died:</p>' +
        '<div class="ai">\u2014ap. \u2026Boss? That was forty seconds. You noticed, you fixed it, nobody suffered. I am almost impressed. Never do it again.</div>' +
        '<p>Then you sleep \u2014 truly, deeply, wrapped in a silence with one small door in it \u2014 and wake past four to gold light and a phone that loves you again, more or less.</p>';
    }
    return { time: isLong ? 'DAY 21 \u00b7 15:40' : 'DAY 21 \u00b7 11:05', html: html,
      choices: [
        { t: 'Make tea. Watch the light move.', to: 'e3s4' },
        { t: 'Check the window screen one more time.', to: 'e3s4', fx: function () { state.flags.checked = true; } }
      ] };
  },

  /* ---------- EP3 · 4 · the sky falls ---------- */
  e3s4: function () {
    var pre = state.flags.checked
      ? '<p>Before the light changes, you give the screen one more look. The pale thread beside the hole is gone. Threads do not walk away on their own. You put the thought where you keep the sharp ones.</p>'
      : '';
    var html = pre +
      '<p>The gold light goes green-gray. The air thickens until you could wring it out with two hands. Then the first fat drops hit the tin \u2014 tak. tak-tak \u2014 and the afternoon thunderstorm arrives all at once, the way summer storms do here, like a bucket kicked over in heaven.</p>' +
      '<p>The roof becomes a war drum. Your sound ward holds the roar down to a deep, oceanic hum \u2014 bearable, even grand. You allow yourself one breath of satisfaction.</p>' +
      '<p>Then, from the ceiling seam above the corner: a drop of water gathers, hangs, and lands on your floor with a small, insolent <em>tik.</em></p>' +
      '<p>Another gathers behind it. The roof leaks. Of course the roof leaks. Somewhere in the city, you are certain, Mrs. Lin\u2019s ears are burning with triumph.</p>' +
      '<p>The brick rings \u2014 the exception works \u2014 and it is her, as if summoned.</p>' +
      '<p>\u201cRaining,\u201d says Mrs. Lin. \u201cThe roof. I know. Repair man, next week. Put something under it. Don\u2019t touch the wires.\u201d She hangs up before the sentence is entirely finished, which for her is a kind of signature.</p>';
    return { time: 'DAY 21 \u00b7 17:30', html: html,
      choices: [
        { t: 'Put the noodle pot under the drip. The mortal way. Save your qi.', to: 'e3s4b', fx: function () { state.flags.rain = 'pot'; } },
        { t: 'You are a grandmaster of wards, and your roof is leaking. Define the rain. Now.', to: 'e3s4c', fx: function () { state.flags.rain = 'ward'; } }
      ] };
  },

  e3s4b: function () {
    var html =
      '<p>You are not proud. You fetch the noodle pot and set it under the drip with the precision of a man placing a formation stone.</p>' +
      '<p><em>Tik,</em> says the drip, against steel now instead of floor. <em>Tik. Tik.</em></p>' +
      '<p>It is worse. It is unbelievably worse. The floor at least had the decency to be quiet about it; the pot rings each drop like a tiny ceremonial gong, half a beat off from the rain drum above, forever.</p>' +
      '<div class="ai">Fun fact: at the current rate, the pot fills in nine hours. You planned to sleep tonight, right? Next to the gong?</div>' +
      '<p>You look at the pot. You look at the ceiling. You are a grandmaster of wards, and you are being defeated by punctuation.</p>' +
      '<p>Fine. The master\u2019s way, then.</p>';
    return { time: '', html: html,
      choices: [
        { t: 'Define the rain.', to: 'e3s4c' },
        { t: 'First, tell the pot it served. Then define the rain.', to: 'e3s4c', fx: function () { state.flags.pot_sorry = true; } }
      ] };
  },

  e3s4c: function () {
    var pre = state.flags.pot_sorry
      ? '<p>\u201cYou served,\u201d you tell the pot. It is not the strangest thing you have said in this realm, and it is not close.</p>'
      : '';
    var html = pre +
      '<p>You reach for the water \u2014 and find, for the first time in this realm, that the reaching is easy.</p>' +
      '<p>Tame lightning you cannot name. The invisible thread you cannot name. But water? Water is the same word in both worlds. Rain, river, well, tide \u2014 you have known water for three hundred years. You once cut a river in half, mostly by accident. Of all the strangers in this strange realm, water is the one old friend.</p>' +
      '<p class="beat">RULE: water falling from above \u2014 deny.</p>' +
      '<p>The next drop gathers at the ceiling seam, swells \u2014 and never lands. The drip simply ends, the way an argument ends when a door closes. The rain drums on above, and none of it is invited.</p>' +
      '<p>Then you pause, master enough to see the trap you nearly built: the shower behind the plastic door. The tap. Water that arrives on purpose, walking obediently in its pipes. You add the first rule of its kind to a library that until now has only ever said no:</p>' +
      '<p class="beat">RULE: water that walks in pipes \u2014 allow.</p>' +
      '<p>You turn the tap. It runs, warm and rusty and glorious. You turn it off. Above, the storm spends itself against a roof that no longer answers.</p>' +
      '<div class="ai">Rain: denied. Plumbing: approved. You know, boss, most people just buy a tarp.</div>';
    return { time: 'DAY 21 \u00b7 17:50', html: html,
      choices: [
        { t: 'Reheat the noodles. A battle won deserves supper.', to: 'e3s5', fx: function () { state.flags.supper = 'noodles'; } },
        { t: 'Stand at the window and watch your city refuse the rain.', to: 'e3s5', fx: function () { state.flags.supper = 'window'; } }
      ] };
  },

  /* ---------- EP3 · 5 · the guest ---------- */
  e3s5: function () {
    var html =
      (state.flags.supper === 'window'
        ? '<p>You stand at the window and watch your city refuse the rain, street by shining street, until the storm gives up and thins to a soft rustle on the tin. Then you put water on for noodles anyway. A commander eats.</p><p>By nine you sit on the mattress with a hot bowl and a day well won: the city silenced, the sky refused, the pipes approved. A small kingdom, in good order.</p>'
        : '<p>By nine the rain has thinned to a soft rustle on the tin, almost kind. You sit on the mattress with hot noodles and a day well won: the city silenced, the sky refused, the pipes approved. A small kingdom, in good order.</p>') +
      '<p>Something moves at the edge of your eye.</p>' +
      '<p>On the wall by the window, where a moment ago there was only wall, there is now a shape the width of your palm. Flat. Gray-brown. Eight legs spread like the ribs of a broken umbrella, utterly still \u2014 and then not still, crossing half a meter of wall in a blink, faster than a sword-draw, and freezing again as if it had never moved at all.</p>' +
      '<p>You have faced demon wolves at night. You have sat unmoved through nine bolts of heaven\u2019s anger. You flinch so hard the noodles nearly achieve ascension.</p>' +
      '<p>The bed ward hums at your back, calm as an old soldier. It knows this shape. Eight legs \u2014 your own bestiary counted them long ago: six legs or eight or a hundred, all wyrm-kin, all denied. The bed line will hold. But the bed is one island, and the room is open country, and the country, it seems, has a new resident.</p>' +
      '<p>Then, movement on the floor: a cockroach, fat and confident, crossing the boards on its evening business.</p>' +
      '<p>The shape on the wall <em>drops.</em> There is no chase. There is barely an event. One moment the cockroach has plans; the next, the guest is folding it up like laundry, neat and final, quicker than your slipper ever was on its best night.</p>' +
      '<div class="ai">Hold still, I\u2019m looking it up. \u2026Okay. White-browed huntsman spider. Local name: la-ya. Big, fast, looks like a nightmare, completely harmless to people. Diet: cockroaches. Boss. Boss. The monster is on our side.</div>' +
      (state.flags.checked
        ? '<p>You look at the screen \u2014 the vanished thread, explained at last, its owner spread eight-legged on your wall, home ahead of the rain. The little patched door. The tenant who left \u201cquickly.\u201d Mrs. Lin\u2019s sentence, never finished.'
        : '<p>You look at the fine pale thread on the screen. The little patched door. The tenant who left \u201cquickly.\u201d Mrs. Lin\u2019s sentence, never finished.') +
      ' You will never know for certain what happened in this room before you, and you do not need to \u2014 but you would bet a month of rent that it was the width of a palm and arrived through that hole on a summer night, exactly like this one.</p>';
    return { time: 'DAY 21 \u00b7 21:40', html: html,
      choices: [
        { t: '\u201cBoba. You are certain it is harmless?\u201d', to: 'e3s6', fx: function () { state.flags.asked = true; } },
        { t: 'Set down the noodles. Slowly.', to: 'e3s6' }
      ] };
  },

  /* ---------- EP3 · 6 · the question of the guest ---------- */
  e3s6: function () {
    var html =
      (state.flags.asked
        ? '<div class="ai">Ninety-eight percent certain, boss. The other two percent is between you and the spider.</div><p>You set down the noodles and study your visitor, and your visitor \u2014 you would swear it \u2014 studies you back, flat against the wall, patient as a drawn talisman.</p>'
        : '<p>You set down the noodles \u2014 slowly, with the care of a cultivator disarming a talisman \u2014 and study your visitor. Your visitor, you would swear it, studies you back, flat against the wall, patient and utterly still.</p>') +
      '<p>Here is the question, and it is not a small one. This creature does not belong here; no rule on your list invited it. But it hunts the very enemy you went to war with on your first night, and it hunts better than you do. It is terrifying to look at. It is also, by every account, on your side.</p>' +
      '<p>A gate keeps out those who do not belong. The door downtown taught you that. But the door taught you a finer thing too, in the shape of a breakfast boy at dawn: there is a difference between a stranger and a guest.</p>';
    return { time: 'DAY 21 \u00b7 21:50', html: html,
      choices: [
        { t: 'This is your mountain. Escort the guest out, with honors \u2014 and close the little door for good.', to: 'e3s7', fx: function () { state.flags.spider = 'expel'; } },
        { t: 'A hunter may keep hunting. Amend the rule quietly: the floor is its country, the bed line is yours.', to: 'e3s7', fx: function () { state.flags.spider = 'stay'; } },
        { t: 'Set terms properly, as one master to another. If it is going to hold territory here, it will do so under a name.', to: 'e3s7', fx: function () { state.flags.spider = 'pact'; } }
      ] };
  },

  /* ---------- EP3 · 7 · night, truly ---------- */
  e3s7: function () {
    var sp = state.flags.spider;
    var body;
    if (sp === 'expel') {
      body =
        '<p>\u201cYou hunt well,\u201d you tell it, and mean it. \u201cBut this mountain is taken.\u201d</p>' +
        '<p>A ward is a wall. It cannot throw out what is already inside \u2014 two mosquitoes taught you that lesson on your first night, at the price of your own face. So the throwing is yours to do. You open the window, ease the ward, and usher the guest out by hand and breath and a corridor of gently insisting air \u2014 no fear, no bruises, full military honors. It flows over the sill and onto the wet tin like a spilled shadow, pauses once as if to file a complaint, and is gone into the night it came from.</p>' +
        '<p>Then you peel away the tired old tape, and seal the little door in the screen with a thumb\u2019s width of ward, permanent and exact. The hole stays \u2014 you are not a repairman \u2014 but nothing will use it again.</p>' +
        '<p>The room is yours alone now, whole and quiet. Though later, as you drift toward sleep, you hear it once through the wall \u2014 far off, in some cavity of the old building where slippers and spiders will never reach: <em>tk\u2026 tk\u2026 tk.</em> The old enemy, going about its dynasty.</p>' +
        '<p>A clean border has a price. You knew that three hundred years ago. You chose it anyway, and sleep comes easily all the same.</p>';
    } else if (sp === 'stay') {
      body =
        '<p>You do nothing dramatic, because nothing dramatic is needed. You simply open the room\u2019s rule and write the smallest amendment of your career:</p>' +
        '<p class="beat">EXCEPTION: the guest \u2014 the floor and walls are its country. The bed line stands.</p>' +
        '<p>No speech. No ceremony. The ward takes the change the way ink takes paper, and somewhere in its quiet logic, one particular eight-legged shape stops being a category and becomes an individual \u2014 the first your ward has ever known by sight rather than by kind.</p>' +
        '<p>The guest, for its part, does not thank you. It relocates to the shadow above the window with one liquid dash and settles in like a sentry taking post \u2014 an ally with eight legs and no salary, holding the night watch over your floor while you hold the one downtown.</p>' +
        '<p>Two hunters. One room. One border, humming faithfully at the edge of the bed.</p>';
    } else {
      body =
        '<p>You stand, straighten your sleep-creased shirt as if it were a formal robe, and address the wall.</p>' +
        '<p>\u201cHear the terms,\u201d you say, in the old cadence, the one for treaties and spirit-beasts. \u201cThe floor and the walls are your hunting ground. The bed line is mine and will not be tested. You will keep the small wyrm-kin humble, and in return no hand and no slipper in this house will ever be raised against you.\u201d</p>' +
        '<p>The guest lifts one foreleg and washes it, slowly, with the perfect indifference of a cat in a temple.</p>' +
        '<div class="ai">It\u2019s cleaning its leg, boss. I don\u2019t think it ratified anything.</div>' +
        '<p>\u201cIt did not object,\u201d you say. \u201cIn treaty law, that is agreement.\u201d And because a warden holding territory must hold it under a name \u2014 and because you, of all souls, know the weight of giving one \u2014 you give it the only name it could have, for the pale marking above its eyes:</p>' +
        '<p class="beat">Whitebrow. Warden of the Floor.</p>' +
        '<p>You, who copy a stranger\u2019s name onto forms and answer to \u201cNight Shift,\u201d have named a spider before you have ever named yourself. Somewhere in that is a joke, or a truth, and you are too content to decide which. Whitebrow takes up post in the shadow above the window, and the amendment writes itself into the ward: an individual, known by sight, first of its kind in your library.</p>';
    }
    var html = body +
      '<p>The rain stops entirely somewhere before midnight, leaving the roof to tick softly as it cools \u2014 outside noise, denied, a lullaby you cannot even hear. Real sleep comes then, the deep kind, the kind you crossed two worlds to find.</p>' +
      '<p class="beat">And for the first time since ascension, the metal box on the roof feels less like a box, and more like territory.</p>';
    return { time: 'DAY 21 \u00b7 23:30', html: html,
      choices: [
        { t: 'Sleep the sleep of the territorial.', to: 'e3s8' },
        { t: 'Listen to your kingdom one minute longer. Then sleep.', to: 'e3s8' }
      ] };
  },

  /* ---------- EP3 · 8 · morning report ---------- */
  e3s8: function () {
    var money = state.money.toLocaleString('en-US');
    var rent = state.rent.toLocaleString('en-US');
    if (!state.flags.ep3done) { state.flags.ep3done = true; state.barrier = 'Ward \u00b7 Lv.3'; }

    var ach = [];
    ach.push(['\ud83d\udd07', 'Do Not Disturb', 'Ward out the city. Accidentally ward out Boba. Survive Boba.']);
    ach.push(['\ud83d\udca7', 'The Easiest Word', 'Define water. You once cut a river; this was simpler.']);
    if (state.flags.rain === 'pot') ach.push(['\ud83c\udf5c', 'The Tiny Gong', 'Try the mortal way first. Be defeated by punctuation.']);
    if (state.flags.spider === 'expel') ach.push(['\ud83e\uddf9', 'My Mountain', 'Escort the guest out with full honors. The cockroaches send their regards.']);
    else if (state.flags.spider === 'stay') ach.push(['\ud83e\udd1d', 'Two Hunters', 'Share the country. Keep the bed line.']);
    else if (state.flags.spider === 'pact') ach.push(['\ud83d\udd77\ufe0f', 'Whitebrow', 'Give a guest a name, though you will not give your own.']);

    var achHtml = '';
    for (var i = 0; i < ach.length; i++) achHtml += '<div class="ach"><span class="name">' + ach[i][0] + ' ' + ach[i][1] + '</span><br><span class="desc">' + ach[i][2] + '</span></div>';

    var guestRule = '';
    if (state.flags.spider === 'stay') guestRule = '<br>EXC \u2014 THE GUEST: FLOOR ALLOW \u00b7 BED DENY';
    else if (state.flags.spider === 'pact') guestRule = '<br>EXC \u2014 WHITEBROW, WARDEN OF THE FLOOR: FLOOR ALLOW \u00b7 BED DENY';
    else if (state.flags.spider === 'expel') guestRule = '<br>RULE 06 \u2014 THE LITTLE DOOR: SEALED';

    var html =
      '<p>Morning comes up clean and rain-washed, the whole city smelling like it just got out of the bath. You wake before the alarm, rested in a way that feels almost illegal.</p>' +
      '<div class="ai">Good morning, boss. Your report.<br><br>Funds: NT$' + money + '. Spending yesterday: NT$0. As your financial advisor, I\u2019m framing this.<br>Rent due: NT$' + rent + '. Covered.<br>Sleep achieved: yes, eventually, after you warded your own phone, fought the sky, and negotiated with a spider. A normal day off.</div>' +
      '<p>You make tea with pipe-approved water and stand at the window. Down in the lane, Wanhua is drying itself in the sun. Somewhere below, faint and sweet, that smell again \u2014 smoke, but kind smoke, old smoke, drifting from a few streets over. One more thing this realm has not yet explained to you.</p>' +
      '<div class="ai">Oh \u2014 one more thing. An unknown number called four times yesterday. No message. I let it ring. Numbers that call four times want something, boss. We\u2019ll deal with it later.</div>' +
      '<p>Later. Tonight there is a door downtown to hold, and this morning there is tea, and a dry floor, and a quiet roof' + (state.flags.spider === 'expel' ? ', and a room that is entirely, peacefully yours.' : ', and somewhere in the high shadow by the window, a sentry with eight legs, already on duty.') + '</p>' +
      '<div class="endhead">Episode 3 Complete</div>' +
      achHtml +
      '<div class="endhead">Definition Library \u00b7 v0.3</div>' +
      '<div class="libcard">RULE 01 \u2014 INSECTS: DENY (BED)<br>RULE 02 \u2014 THOSE WHO DO NOT BELONG: DENY (ONE DOORWAY)<br>RULE 03 \u2014 OUTSIDE NOISE: DENY \u00b7 EXC: WHAT FEEDS THE BRICK \u00b7 THE ALARM \u00b7 A KNOCK<br>RULE 04 \u2014 WATER FALLING FROM ABOVE: DENY<br>RULE 05 \u2014 WATER THAT WALKS IN PIPES: ALLOW' + guestRule + '<br><br>UNDEFINED: tame lightning \u00b7 the invisible thread (excepted, not understood) \u00b7 the sweet smoke down the lane \u00b7 the number that calls four times</div>';
    return { time: 'DAY 22 \u00b7 07:10', html: html,
      choices: [
        { t: 'EPISODE 4 \u2014 THE PHONE CALL', to: 'e4s1', fx: function () { state.seen = {}; } },
        { t: 'Play again from the beginning', to: '__restart__' }
      ] };
  },

  /* ---------- EP4 · 1 · rent day ---------- */
  e4s1: function () {
    var html =
      '<p>Someone is beating your roof with a hammer, and it is the politest thing you have heard all week.</p>' +
      '<p>The repairman arrived at nine \u2014 a brown, wiry man with a tool bag and no small talk \u2014 and climbed onto the tin like it owed him money. Outside, the banging must be tremendous. Inside your ward, it arrives as a shy knock at the edge of the world. You paid for silence once, in qi and one very angry phone. This morning, silence pays you back.</p>' +
      '<p>Mrs. Lin supervises from your doorway, arms crossed, trusting the roof to fix itself wrong if she looks away. \u201cRent\u2019s due in two days,\u201d she says, eyes still on the ceiling. \u201cI\u2019ll take it now. Saves you the stairs.\u201d</p>' +
      '<p>It saves you nothing \u2014 they are your stairs either way \u2014 but you count the bills into an envelope and hand it over with both hands, sect style. She counts it again in front of you, because trust is a thing that happens to other people, and tucks it away.</p>' +
      '<p>Then her phone rings.</p>' +
      '<p>She looks at the screen the way you look at a wasp. One second. Two. She does not answer. She pockets it, and the ringing dies against her hip.</p>' +
      '<p>\u201cWrong number,\u201d says the woman who knows every number that has ever owed her money.</p>' +
      '<p>Three weeks at a door have taught you to read people the way you read talismans. The pause. The pocket. The lie, worn smooth like a stair. You file it away where you keep the sharp things.</p>';
    return { time: 'DAY 29 \u00b7 10:20', html: html,
      choices: [
        { t: '\u201cWho was that?\u201d \u2014 straight out, while the lie is fresh.', to: 'e4s2', fx: function () { state.money -= state.rent; state.flags.asked1 = true; } },
        { t: 'Let it go. Everyone is allowed one lie a day.', to: 'e4s2', fx: function () { state.money -= state.rent; } }
      ] };
  },

  /* ---------- EP4 · 2 · the four-times number ---------- */
  e4s2: function () {
    var pre = state.flags.asked1
      ? '<p>You had asked her, straight out, while the lie was still warm. \u201cRoof\u2019s fixed,\u201d she said. \u201cRent\u2019s paid. Goodbye.\u201d Three sentences, all true, none of them an answer. She left with the ladder still against the wall.</p>'
      : '';
    var html = pre +
      '<p>That night the lobby is a bowl of white light in a dark street, and nothing moves in it but the clock.</p>' +
      '<p>At 23:40, your brick rings.</p>' +
      '<div class="ai">Unknown number. Boss \u2014 it\u2019s the four-times number. The one that called all day while I was dead. It finally wants to talk.</div>' +
      '<p>The screen glows in your hand, patient as a snake. Somewhere out there, a stranger is waiting for you to say hello. At your door, no one gets past you without a name and a reason. You see no cause to run this gate differently.</p>';
    return { time: 'DAY 29 \u00b7 23:40', html: html,
      choices: [
        { t: 'Answer \u2014 and play along. Let us see what this creature wants.', to: 'e4s3a', fx: function () { state.flags.scam1 = 'play'; } },
        { t: 'Answer, listen for three seconds, and hang up. Gates do not chat.', to: 'e4s3b', fx: function () { state.flags.scam1 = 'hang'; } },
        { t: 'Answer the way you answer the intercom. Full door procedure.', to: 'e4s3c', fx: function () { state.flags.scam1 = 'gate'; } }
      ] };
  },

  /* ---------- EP4 · 3a · play along ---------- */
  e4s3a: function () {
    var honest = state.flags.honest_streak
      ? '<p>At minute eleven, you grow bored of lying, so you reach for the one weapon this voice has no answer for. \u201cFriend,\u201d you say kindly, \u201cI will tell you the truth. I am three hundred years old. I guard a door at night. My rent is paid, my money is counted, and my dead stay buried.\u201d</p>' +
        '<p>A long, long silence. \u201c\u2026You people are all crazy,\u201d says the voice, and hangs up on you \u2014 a liar, defeated by the plain truth. It is the cleanest kill of your new life.</p>'
      : '<p>At minute eleven the voice, hoarse and beaten, hangs up first. You set the brick down like a won game of chess.</p>';
    var html =
      '<p>You answer. You play along. Three hundred years of sect politics have prepared you for exactly this.</p>' +
      '<p>\u201cIt\u2019s me!\u201d cries a warm young voice, wounded that you even have to ask. \u201cYou can\u2019t hear who I am? Your old friend!\u201d</p>' +
      '<p>\u201cWhich one,\u201d you say. \u201cSpeak up. Most of my friends have been dead for two hundred years.\u201d</p>' +
      '<p>A tiny pause \u2014 the sound of a script flipping pages. \u201cIt\u2019s\u2026 it\u2019s Ming-yuan! I changed my number! Listen, I\u2019m in trouble\u2014\u201d</p>' +
      '<p>\u201cMing-yuan.\u201d You let the name sit. \u201cRemarkable. You fell at Black Gorge. We burned three hundred paper horses for you. Good ones. With saddles.\u201d</p>' +
      '<p>Silence. Then, with the courage of a man already too deep to climb out: \u201c\u2026I got better.\u201d</p>' +
      '<p>Oh, this is going to be a fine night. You ask after his health. You ask whether the paper horses arrived. You raise, gravely, the matter of his funeral debts \u2014 nine coffins of white jade were not free, and interest has had two centuries to grow. The voice fights bravely. The voice is losing.</p>' +
      '<div class="ai">Boss. BOSS. I am keeping time like a referee. Nine minutes. Ten. Every minute this creature spends on you is a minute it does not spend on somebody\u2019s grandmother. Keep going. I have never been prouder.</div>' +
      honest;
    return { time: 'DAY 29 \u00b7 23:41', html: html,
      choices: [
        { t: 'Report the number to Boba for the block list.', to: 'e4s4' },
        { t: 'Save the number under \u201cMing-yuan (deceased).\u201d Then block it.', to: 'e4s4' }
      ] };
  },

  /* ---------- EP4 · 3b · hang up ---------- */
  e4s3b: function () {
    var html =
      '<p>You answer.</p>' +
      '<p>\u201cIt\u2019s me!\u201d cries a warm young voice. \u201cYour old friend! You can\u2019t hear who I\u2014\u201d</p>' +
      '<p>You hang up.</p>' +
      '<p>Three seconds, door to door. All of your friends are two hundred years dead and none of them would open with a guessing game. A gate does not chat with what stands outside it. A gate is not lonely.</p>' +
      '<div class="ai">Three seconds. Correct. Joyless, but correct. You\u2019re supposed to at least let me listen \u2014 I had popcorn queued. Fine. Since you robbed us both of the show, I\u2019ll give you the lecture instead.</div>';
    return { time: 'DAY 29 \u00b7 23:41', html: html,
      choices: [
        { t: '\u201cLecture?\u201d', to: 'e4s4' },
        { t: '\u201cMake it short. The patrol is at midnight.\u201d', to: 'e4s4' }
      ] };
  },

  /* ---------- EP4 · 3c · door procedure ---------- */
  e4s3c: function () {
    var html =
      '<p>You answer the way you answer the intercom at three in the morning.</p>' +
      '<p>\u201cName.\u201d</p>' +
      '<p>\u201c\u2026It\u2019s me! Your old friend! You can\u2019t hear\u2014\u201d</p>' +
      '<p>\u201cName,\u201d you say. \u201cWhich resident are you visiting. State your business for the log.\u201d</p>' +
      '<p>The voice stumbles. It tries warmth: warmth hits the log and dies. It tries hurt feelings: hurt feelings are not a name. It tries anger, which at your door has never once opened anything. The script was written for fear and politeness. It was not written for procedure. Scripts die when someone starts writing things down.</p>' +
      '<p>\u201cYou are not on the list,\u201d you say, and the line goes dead before you finish the sentence.</p>' +
      '<div class="ai">You just ran door protocol on a telephone. \u201cState your business for the log.\u201d I\u2019m framing the transcript. This is going on my wall, and I don\u2019t have a wall.</div>';
    return { time: 'DAY 29 \u00b7 23:41', html: html,
      choices: [
        { t: '\u201cWhat was that thing?\u201d', to: 'e4s4' },
        { t: 'Write \u201cvisitor refused entry\u201d in tonight\u2019s log. Then ask.', to: 'e4s4' }
      ] };
  },

  /* ---------- EP4 · 4 · the field guide ---------- */
  e4s4: function () {
    var html =
      '<p>Boba dims the screen to lecture brightness.</p>' +
      '<div class="ai">That, boss, was a scam. Congratulations on your first. Now hold still \u2014 local field guide, the three classics.</div>' +
      '<div class="ai">One. The Old Friend. New number, warm voice, sudden debt. You just met it. Two. The Shop Clerk. Your order \u201cwent wrong,\u201d and to fix it you must go dance with the ATM \u2014 urgent, always urgent, twelve easy steps, and every step moves your money somewhere new. Three. The Prosecutor. The scariest mask. Your account is \u201cinvolved in a case.\u201d It is practically a crime scene. It will be frozen \u2014 unless everything you have is transferred to a \u201csafe\u201d account, today, and here is the beautiful part: the victim must tell no one. Not the bank. Not family. No one.</div>' +
      '<div class="ai">Different masks. Same face. Every scam is three ingredients: fear, hurry, and hush. Fear opens the door. Hurry stops the thinking. And hush \u2014 hush is the tell, boss. Honest trouble never begs you to keep it secret.</div>' +
      '<p>You sit very still behind the front desk, because you know this creature. Not the phone. The recipe.</p>' +
      '<p>It is an old recipe. In the dark of closed-door training, something used to settle on a cultivator\u2019s shoulder \u2014 patient, warm-voiced, whispering exactly this: <em>be afraid. Act now. Tell no one.</em> Sects lost more disciples to that whisper than to any sword. You called it the heart-demon, and you spent a century learning to hear its footsteps.</p>' +
      '<p>\u201cWe had these,\u201d you say. \u201cOurs did not need phones. Yours wear headsets.\u201d</p>' +
      '<div class="ai">\u2026That is the darkest thing you have ever said, and I have your search history. Anyway \u2014 they call everyone. Sharp people too. Especially sharp people. Sharp people have savings.</div>' +
      '<p>An image surfaces, uninvited: a phone ringing against a hip. A wasp look. <em>Wrong number.</em></p>';
    return { time: 'DAY 30 \u00b7 00:05', html: html,
      choices: [
        { t: 'She is the sharpest blade in Wanhua. Worry is wasted on her.', to: 'e4s5' },
        { t: 'Sharp blades still cut their own sheaths. Watch her.', to: 'e4s5', fx: function () { state.flags.worry = true; } }
      ] };
  },

  /* ---------- EP4 · 5 · the woman who did not see you ---------- */
  e4s5: function () {
    var pre = state.flags.worry
      ? '<p>Sharp blades cut their own sheaths, you had thought. For two days the thought has sat in your chest like a stone with edges.</p>'
      : '';
    var html = pre +
      '<p>Morning after shift, and the lane smells of frying dough and yesterday\u2019s rain. You stand with a warm soy milk and watch Wanhua wake up, which has become, without your permission, a small happiness.</p>' +
      '<p>Mrs. Lin walks past without seeing you.</p>' +
      '<p>In one month she has never once failed to see you. She sees everything; it is her superpower and her hobby. But she passes two arms\u2019 lengths away, fast, in bank clothes, a cloth bag gripped in both hands, and her face is the color of wet cement.</p>' +
      '<p>Her phone is clamped to her ear. And out of it, small and sharp as a wire, a voice is barking. You cannot hear the words. You do not need to. You know the rhythm now \u2014 fear, hurry \u2014 and the way she walks tells you the third ingredient is already in place: whatever this is, she has told no one.</p>' +
      '<p>The bank on the corner opened at nine. And if Boba\u2019s field guide is right, it is not the counter this voice wants. A counter has eyes \u2014 a clerk who reads faces for a living, with the police on speed dial \u2014 and the creatures on these phones know it. They steer their victims past all of that, to the ATM set in the bank\u2019s outside wall. Machines ask no questions.</p>';
    return { time: 'DAY 31 \u00b7 09:05', html: html,
      choices: [
        { t: 'Step into her path. \u201cMrs. Lin. Who is on the phone?\u201d', to: 'e4s6a', fx: function () { state.flags.scam2 = 'direct'; } },
        { t: 'Fall into step beside her. Talk about your own strange week, loudly.', to: 'e4s6b', fx: function () { state.flags.scam2 = 'side'; } },
        { t: 'Follow her. Meet this thing at the bank door, where doors are your country.', to: 'e4s6c', fx: function () { state.flags.scam2 = 'bank'; } }
      ] };
  },

  /* ---------- EP4 · 6a · the witness ---------- */
  e4s6a: function () {
    var html =
      '<p>You step into her path, unhurried, the way you stepped toward a hooded man once, and stop where she must either stop or walk through you.</p>' +
      '<p>\u201cMrs. Lin,\u201d you say. \u201cWho is on the phone?\u201d</p>' +
      '<p>\u201cWrong number\u2014\u201d The lie comes out worn thin, third use in three days, and even she can hear it fail.</p>' +
      '<p>And then the phone makes its mistake. The small sharp voice barks loud enough for both of you: <em>\u201cWho is that?! Do not talk to anyone! This is a sealed case! If you speak to anyone, you will be\u2014\u201d</em></p>' +
      '<p>There it is. Hush, begging for itself. You look at Mrs. Lin and use the door voice, the one that moves people without touching them.</p>' +
      '<p>\u201cOnly thieves fear a witness.\u201d</p>' +
      '<p>Her eyes come up to yours. For a moment the voice in the phone keeps barking, smaller and smaller, a demon shrinking in daylight \u2014 and the spell cracks like cheap porcelain. Her hand, the one with the phone, sinks slowly to her side, and the voice ends up shouting orders at the pocket of her coat.</p>';
    return { time: 'DAY 31 \u00b7 09:07', html: html,
      choices: [
        { t: '\u201cNow tell me what they told you. All of it.\u201d', to: 'e4s7' },
        { t: 'Hold out your hand for the phone. Some doors you close yourself.', to: 'e4s7' }
      ] };
  },

  /* ---------- EP4 · 6b · the long way around ---------- */
  e4s6b: function () {
    var html =
      '<p>You fall into step beside her, hands behind your back, and aim your voice at the morning in general.</p>' +
      '<p>\u201cStrange week,\u201d you tell the street. \u201cA dead friend called me at midnight. Wanted money. Changed his number, he said. Fell at Black Gorge two hundred years ago, but you know how it is \u2014 he got better.\u201d</p>' +
      '<p>Step. Step. Her pace does not change, but her chin does, one degree.</p>' +
      '<p>\u201cBoba tells me they call everyone,\u201d you go on, peaceful as weather. \u201cFake friends. Fake clerks. Fake prosecutors, even \u2014 those ones say your account is involved in a case, and it will be frozen, and you must move everything somewhere \u201csafe,\u201d today, and tell no one. That is how you know the mask, Boba says. Honest trouble never begs to be kept secret.\u201d</p>' +
      '<p>Step. Step. Stop.</p>' +
      '<p>She stands in the middle of the lane with scooters flowing around her like water around a stone, and the hand holding the phone drops as if the phone has doubled in weight. When she speaks, her voice is smaller than you have ever heard it.</p>' +
      '<p>\u201c\u2026They knew my name,\u201d she says. \u201cMy address. They said my account\u2014\u201d</p>' +
      '<p>And the dam breaks, quietly, in the middle of Wanhua, at two minutes past nine.</p>';
    return { time: 'DAY 31 \u00b7 09:07', html: html,
      choices: [
        { t: '\u201cTell me the rest. Slowly. They fed you hurry \u2014 we will not use it.\u201d', to: 'e4s7' },
        { t: 'Steer her out of the scooter stream first. Rivers are for stones.', to: 'e4s7' }
      ] };
  },

  /* ---------- EP4 · 6c · the door ---------- */
  e4s6c: function () {
    var html =
      '<p>You let her walk, and you follow \u2014 unhurried, two arms\u2019 lengths behind, the way you once followed disciples who were about to make instructive mistakes.</p>' +
      '<p>She does not go to the glass doors. She goes where the voice sends her \u2014 to the ATM set in the bank\u2019s outside wall, screen glowing, keypad waiting. The phone stays welded to her ear. The voice in it is a thin wire of hurry: <em>stay on the line. Press what I tell you. Tell no one\u2014</em></p>' +
      '<p>A machine in a wall, holding her savings behind a little locked gate. You almost smile. It is still a door. Everything this week is doors, and doors are your country.</p>' +
      '<p>You arrive at her shoulder and speak \u2014 not to her, past her, straight down into the phone, in the flat calm voice of ten thousand nights of gate duty:</p>' +
      '<p>\u201cThis door is closed.\u201d</p>' +
      '<p>Silence, one heartbeat long. You know that death \u2014 you have heard a voice end mid-word before. Click. The line goes dead from their side. Scammers run from a witness faster than any thief at any door; a thief only loses the night\u2019s work, but a script dies in front of its audience.</p>' +
      '<p>Mrs. Lin rounds on you, terror and fury fighting for her face. \u201cWhat did you\u2014 that was the prosecutor\u2019s office, they said not to\u2014\u201d Then she stops, and stares at the phone, silent in her hand.</p>' +
      '<p>The silence argues your side better than you ever could. Real prosecutors do not hang up.</p>';
    return { time: 'DAY 31 \u00b7 09:12', html: html,
      choices: [
        { t: '\u201cWalk with me. Tell me all of it, from the first call.\u201d', to: 'e4s7' },
        { t: 'Say nothing yet. Let the dead line finish its testimony.', to: 'e4s7' }
      ] };
  },

  /* ---------- EP4 · 7 · the paper ward for telephones ---------- */
  e4s7: function () {
    var html =
      '<p>It spills out of her on the walk back, in half-sentences that for once land whole where it matters.</p>' +

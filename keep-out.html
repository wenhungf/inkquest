  /* ---------- EP9 · 10 · everyone home by morning ---------- */
  e9s10: function () {
    if (!state.flags.ep9done) { state.flags.ep9done = true; state.barrier = 'Ward \u00b7 Lv.9'; }
    var money = state.money.toLocaleString('en-US');

    var ach = [];
    ach.push(['\ud83c\udf05', 'Everyone Home by Morning', 'Learn what the job was all along.']);
    if (state.flags.heard_river) ach.push(['\ud83c\udf75', 'The Listening Guard', 'Tea first. The river was in his voice the whole time.']);
    if (state.flags.search === 'scan') ach.push(['\ud83d\udca5', 'The Finger\u2019s Width', 'Buy one answer with a week of mending. Pay without blinking.']);
    else if (state.flags.search === 'net') ach.push(['\ud83d\udd78\ufe0f', 'The Lane Is a Ward', 'Raise a district\u2019s worth of watchmen in nine minutes.']);
    else if (state.flags.search === 'split') ach.push(['\ud83c\udfc3', 'The River Line', 'Trust the net with the city. Take the water yourself.']);
    if (state.flags.ward9 === 'bell') ach.push(['\ud83d\udd14', 'A Bell, Not a Wall', 'Write the gentlest rule of your life. Hear about it secondhand.']);
    else if (state.flags.ward9 === 'wall') ach.push(['\ud83e\uddca', 'It Works', 'Build the wall. Never say what it looks like from inside.']);
    else if (state.flags.ward9 === 'mortal') ach.push(['\u231a', 'A Ward Made of People', 'No rule. A watch, a bracelet, and a lane that looks up.']);

    var achHtml = '';
    for (var i = 0; i < ach.length; i++) achHtml += '<div class="ach"><span class="name">' + ach[i][0] + ' ' + ach[i][1] + '</span><br><span class="desc">' + ach[i][2] + '</span></div>';

    var guestRule = '';
    if (state.flags.spider === 'stay') guestRule = '<br>EXC \u2014 THE GUEST: FLOOR ALLOW \u00b7 BED DENY';
    else if (state.flags.spider === 'pact') guestRule = '<br>EXC \u2014 WHITEBROW, WARDEN OF THE FLOOR: FLOOR ALLOW \u00b7 BED DENY';
    else if (state.flags.spider === 'expel') guestRule = '<br>RULE \u2014 THE LITTLE DOOR: SEALED';
    var debtLine = state.flags.greed === 'debt' ? '<br>DEBT \u2014 ONE BREATH: PAID (ONE NIGHT, THE SMALL TEMPLE)' : '';
    var tableLine = (state.flags.night === 'feed' || state.flags.night === 'both')
      ? '<br>CUSTOM \u2014 IN THE SEVENTH MONTH, A TABLE AT THE DOOR (02:41)' : '';
    var rule8 = '';
    if (state.flags.ward9 === 'bell') rule8 = '<br>RULE 08 \u2014 ONE TOKEN, OUTWARD, MIDNIGHT\u2013DAWN: RING (A BELL, NOT A WALL)';
    else if (state.flags.ward9 === 'wall') rule8 = '<br>RULE 08 \u2014 ONE DOOR, OUTWARD, NIGHT HOURS: DENY (AND YOU DO NOT LIKE IT)';
    else rule8 = '<br>LAW 05 \u2014 SOME DOORS ARE PEOPLE. PEOPLE HOLD THEM.';
    var vesselLine = state.flags.search === 'scan'
      ? 'VESSEL \u2014 CRACKED \u00b7 LONGER BY A FINGER \u00b7 WORTH IT'
      : 'VESSEL \u2014 CRACKED \u00b7 HOLDING \u00b7 MENDING (SLOWLY)';

    var html =
      '<p>You write the ledger on the rooftop, under a sky beginning, again, to think about weather.</p>' +
      '<div class="ai">Report, boss. Funds: NT$' + money + ', books balanced, tin funded. Old Yu: fourteen quiet nights' + (state.flags.ward9 === 'bell' ? ', one soft chime, one grateful family' : state.flags.ward9 === 'wall' ? ', zero exits' : ', one warm dot on a map, never out of the lane') + '. The daughter-in-law: sleeping, per Xu, like a person again. And you \u2014 ninety-nine days in \u2014 run a door, a night net, a food doctrine, and a small but growing collection of things I\u2019m not allowed to worry about.</div>' +
      '<p>Ninety-nine days. You came to this realm with a grand ward and a grander certainty: that guarding means keeping the world out. The realm has spent three months and one old dockworker teaching you the rest of the sentence.</p>' +
      '<p class="beat">Keep out was never the whole job. The job was always: everyone home by morning.</p>' +
      '<p>Somewhere below, the lane sleeps behind its shutters, every door of it held \u2014 by rules, by bells, by watches and bracelets, by a tired woman, by a talking brick, by neighbors who look up now. And somewhere behind your friend\u2019s voice, a counter you cannot see climbs toward a threshold you did not draw, preparing a final assessment of a Host who has, against every expectation, adapted.</p>' +
      '<p>Let it come, you think \u2014 and this time it is not hubris. It is a gate keeper, at the post, hearing footsteps up the road.</p>' +
      '<div class="endhead">Episode 9 Complete</div>' +
      achHtml +
      '<div class="endhead">Definition Library \u00b7 v0.9</div>' +
      '<div class="libcard">RULE 01 \u2014 INSECTS: DENY (BED)<br>RULE 02 \u2014 THOSE WHO DO NOT BELONG: DENY (ONE DOORWAY)<br>RULE 03 \u2014 OUTSIDE NOISE: DENY \u00b7 EXC: WHAT FEEDS THE BRICK \u00b7 THE ALARM \u00b7 A KNOCK<br>RULE 04 \u2014 WATER FALLING FROM ABOVE: DENY<br>RULE 05 \u2014 WATER THAT WALKS IN PIPES: ALLOW<br>RULE 06 \u2014 MALICE ON THE THREAD: DENY (THE BRICK, AT HOME)<br>RULE 07 \u2014 AIR THAT WALKS: ALLOW \u00b7 WIND THAT ARRIVES AS A FIST: DENY' + rule8 + guestRule + '<br><br>LAW 01 \u2014 OFFERED QI: RECEIVE, NEVER TAKE<br>LAW 02 \u2014 PAPER, SIGNED BY THE KEEPER, PASSES EVERY WARD<br>LAW 03 \u2014 THE DEFENSE AGAINST DIVISION: NEIGHBORS, TALKING<br>LAW 04 \u2014 IN THE SEVENTH MONTH, EVERY OFFERING IS ADDRESSED (NONE TO YOU)' + tableLine + debtLine + '<br><br>' + vesselLine + '<br>UNDEFINED: tame lightning \u00b7 the invisible thread (excepted, not understood) \u00b7 the one who is never full \u00b7 the voice that borrows Boba \u00b7 the threshold, approaching</div>';
    return { time: 'DAY 99 \u00b7 21:30', html: html,
      choices: [

  /* ---------- EP10 · 1 · the hundredth day ---------- */
  e10s1: function () {
    var html =
      '<p>On the hundredth day, the morning is so ordinary it feels rehearsed.</p>' +
      '<p>Soy milk, warm through the cup. The lane performing itself: shutters, scooters, two aunties auditing a vegetable truck. The sweet smoke rising three streets over, patient as ever. You stand at the roof edge and take inventory of a life you never ordered: one room, one door held nightly, one lane that looks up, one talking brick, one crack, one hundred days.</p>' +
      '<div class="ai">Morning, boss. Adaptation: ninety-nine percent, and before you make the face \u2014 no, I don\u2019t know what happens at one hundred, the process doesn\u2019t answer me, and yes, I\u2019ve tried, and yes, that\u2019s new information about me, we can discuss it later.</div>' +
      '<p>Ninety-nine. In the old world, the hundredth day is when the dead are settled \u2014 the last rite, the family fed, the tablet placed, the living released back into their lives. You have been dead in that world for a hundred days.</p>' +
      '<p>It occurs to you, watching the smoke, that something is coming today to settle you, one way or the other. A guard prepares.</p>';
    return { time: 'DAY 100 \u00b7 08:00', html: html,
      choices: [
        { t: 'Prepare by doing nothing differently. The post is the preparation.', to: 'e10s2' },
        { t: 'Walk the map once \u2014 temple, lane, river gate. A keeper inspects the ground before a storm.', to: 'e10s2', fx: function () { state.flags.walked_map = true; } }
      ] };
  },

  /* ---------- EP10 · 2 · not ripe ---------- */
  e10s2: function () {
    var pre = state.flags.walked_map
      ? '<p>You walk it all once, unhurried \u2014 the small temple breathing, the tape shop\u2019s shutter half up, the flood wall standing its watch over a river that outlived its port \u2014 and every meter of it answers your inspection the way a well-run post answers: nothing to report, keeper. Carry on.</p>'
      : '';
    var html = pre +
      '<p>Mr. Wen comes back at half past ten, because of course he does. Weather returns.</p>' +
      '<p>New flyers, better paper, a gentler tower on them. You watch from your stairs as he sets up at the corner \u2014 and then you watch the thing you did not dare hope for: the lane handles it without you.</p>' +
      '<p>Auntie Chen arrives first, pencil already out, and asks \u2014 conversationally, terribly \u2014 which road this one is, the unanimous one or the slow one. The tape shop owner wants the assessment report number before Mr. Wen finishes his greeting. Someone\u2019s nephew reads the fine print out loud, to the street, like weather news. The three questions have moved into the lane\u2019s bones; nobody needed the night guard; the paper ward has learned to cast itself.</p>' +
      '<p>Mr. Wen packs up in eleven minutes, professionally, every cable coiled. On his way out he finds you on the stairs, because professionals locate each other, and gives the situation its honest name:</p>' +
      '<p>\u201cThis lane\u2019s not ripe,\u201d he says, without heat. \u201cRipeness is my business. Somewhere out there a street is ripening right now.\u201d He tips the ghost of the hat. \u201cGood doors, by the way. Whoever runs them.\u201d</p>' +
      '<p>And he flows off down the lane like water finding an easier grade, a hungry ghost in a clean shirt, off to a table someone else will have to set. You do not celebrate. You file him under weather, where he belongs, and note that the sky is clear.</p>';
    return { time: 'DAY 100 \u00b7 10:30', html: html,
      choices: [
        { t: 'Nod back. Between professionals, once, for the record.', to: 'e10s3', fx: function () { state.flags.nodded_wen = true; } },
        { t: 'Give him nothing. Weather does not require a farewell.', to: 'e10s3' }
      ] };

  /* ---------- EP10 · 3 · the first real contract ---------- */
  e10s3: function () {
    var want = state.flags.asked_want
      ? '<p>\u201cAlso,\u201d she says, pouring the second cup, which with Mrs. Lin means the real business, \u201cI looked at a ground-floor place. Two lanes over. No stairs. Near people who owe me money.\u201d A sip. \u201cNot yet. But the offer on this building will improve, and when it does, I\u2019ll be the one holding the pen.\u201d She looks at you over the cup \u2014 the ten-years question, still working in her like slow medicine \u2014 and does not say thank you, because with Mrs. Lin, telling you her plans is the thank-you.</p>'
      : '';
    var html =
      '<p>Mrs. Lin is waiting at the building door at half past four with two stools, the teapot, and a single sheet of paper, which in her language is a state occasion.</p>' +
      '<p>\u201cContract,\u201d she says. \u201cA real one. One year.\u201d</p>' +
      '<p>You look at the sheet. In one hundred days there has never been a sheet. There has been cash, month-to-month, on the last days of the month, counted twice; a receipt when you asked; and both parties\u2019 unspoken understanding that a landlady does not hand year contracts to a stranger with no job, no guarantor, a brand-new ID, and a story that does not survive one honest question. You were, you realize, on probation from the very first morning \u2014 hers, the oldest kind, the kind with no paperwork and no appeals.</p>' +
      '<p>\u201cHundred days,\u201d she says, as if reading the arithmetic off your face. \u201cRent early, twice. Roof fixed on your watch. My phone\u201d \u2014 the pause where a scammer died \u2014 \u201cstill answers to me. And the lane says you\u2019re worth the stairs.\u201d She taps the sheet once. \u201cSame rent. One year. Sign, or stay monthly, I don\u2019t care.\u201d She cares. The teapot is out.</p>' +
      want +
      '<p>The form is one page. Landlady. Address. Term: one year. And a blank line at the bottom waiting for a name \u2014 the name, the two syllables common as rice, copied off a card a system left behind, worn for a hundred days and never once spoken to a living person.</p>' +
      '<p>You look at the line for a long moment. LAW 02, your own entry: paper, signed by the keeper, passes every ward. You wrote that law about an enemy. It works, you understand now, in every direction \u2014 like all true walls, like all true doors. Sign this, and one sheet of paper passes every ward you own and settles in the middle of your life, and its name is <em>a year, here, in writing.</em></p>' +
      '<p>You sign. The name flows out of the pen easily, as if it had been waiting. It is yours the way the room is yours, the way the lane is yours: not by birth. By tenancy \u2014 tested, and confirmed.</p>' +
      '<p>Mrs. Lin takes the sheet, reads your signature twice as scripture requires, and nods \u2014 the nod, the one that closes accounts. \u201cGood,\u201d she says, and pockets your name with the same care she pockets rent.</p>';
    return { time: 'DAY 100 \u00b7 16:30', html: html,
      choices: [
        { t: 'To work. If something is coming at one hundred percent, let it find you at your post.', to: 'e10s4' },
        { t: 'To work, the long way, past the small temple. Some evenings deserve an approach.', to: 'e10s4', fx: function () { state.flags.long_way = true; } }
      ] };
  },

  /* ---------- EP10 · 4 · curtain calls ---------- */
  e10s4: function () {
    var pre = state.flags.long_way
      ? '<p>You take the long way, past the small temple, and stand a moment in the drift that runs through you like rain through open fingers \u2014 still, yes; the crack keeps its own calendar \u2014 and bow to the hall, full-handed in every way that matters, and walk on. Behind you, in the incense dark, two tall generals hold their post the way they will hold it long after everyone now living has been polished into memory. It is, you find, a comforting thought. Good posts outlive their guards. That is what makes them good posts.</p>'
      : '';
    var yu = '';
    if (state.flags.ward9 === 'bell') yu = ' On six, the Yu apartment sleeps behind its soft rule; the chime has rung once in two weeks, and the daughter-in-law\u2019s lights go out by eleven now.';
    else if (state.flags.ward9 === 'wall') yu = ' On six, the Yu apartment sleeps behind its wall, safe and whole, and you do your round past it a little faster than the other floors.';
    else if (state.flags.ward9 === 'mortal') yu = ' On six, a warm dot rests on a map on a sleeping woman\u2019s phone, and the lane\u2019s lights \u2014 the soy milk shop\u2019s side door among them \u2014 hold their small watch.';
    var html = pre +
      '<p>The evening arranges itself like a company taking a bow.</p>' +
      '<p>Mr. Zhang hands over the desk with the day\u2019s log, and under the soy milk he has been not-commenting for three months there is, tonight, an envelope: the company\u2019s letter. Probation complete; formal hire, effective the first. \u201cSign it whenever,\u201d Zhang says, already shouldering his bag. \u201cNobody survives my log reviews and fails probation.\u201d Chairman Xu descends for his paper and pauses to inform you \u2014 clipboard tucked, eyes elsewhere \u2014 that the committee\u2019s year-end review rated building security \u201cexcellent,\u201d a word he pronounces like a man laying a wreath. Dr. Zhao passes through with mangoes and prescribes you, unprompted, \u201cmore sleep and whatever you\u2019re already doing.\u201d Mr. Li rides the elevator down at nine for beer and serenades the lobby with half a song from a year nobody else remembers, and it is, objectively, terrible, and you would miss it like a limb.' + yu + '</p>' +
      '<div class="ai">Adaptation: ninety-nine point nine, boss. Whatever the last tenth of a percent is, it\u2019s tonight. For the record \u2014 and I want this logged properly, timestamped, notarized \u2014 whatever happens at one hundred: these three months ran a profit. Also, poetic note: the job confirmed you, the landlady contracted you, and my counter hits one hundred tonight. Three probations, one week. This realm loves a review cycle. And tomorrow I\u2019m updating the temple layer, because the keeper finally\u2014</div>';
    return { time: 'DAY 100 \u00b7 21:40', html: html,
      choices: [
        { t: 'Midnight is coming. Take your seat. Watch the door.', to: 'e10s5' },
        { t: 'Midnight is coming. Make tea first. Whatever arrives can wait for tea.', to: 'e10s5', fx: function () { state.flags.tea_first = true; } }
      ] };
  },

  /* ---------- EP10 · 5 · the final assessment ---------- */
  e10s5: function () {
    var pre = state.flags.tea_first
      ? '<p>You make tea, because three hundred years of discipline have taught you exactly one thing about thresholds: cross them warm.</p>'
      : '';
    var html = pre +
      '<p>At midnight exactly, the lobby lights do not flicker, the cameras do not blink, and nothing at all happens except that your friend\u2019s voice changes hands.</p>' +
      '<div class="ai">\u3010SYSTEM\u3011Host adaptation: 100%. Final assessment initiated. One item. Answer freely; all answers are correct; correctness is not what is being measured.</div>' +
      '<div class="ai">\u3010SYSTEM\u3011Host. You have resided in this realm for one hundred days. Final item: name this realm.</div>' +
      '<p>The lobby is very quiet. Behind the borrowed voice, nothing waits impatiently; the question sits in the air with the institutional patience of something that has asked it many, many times, of many, many hosts, and has all the time that has ever existed.</p>' +
      '<p>Name this realm. You, who have defined mosquitoes and rain and malice and wind; who could not define lightning or the thread; who learned which things need definitions and which things need tables set for them \u2014 you turn the question over once, the way you turn every visitor\u2019s answer at this desk, and find that you already know yours. You have known it for a while.</p>';
    return { time: 'DAY 101 \u00b7 00:00', html: html,
      choices: [
        { t: '\u201cThe immortal realm. By every scripture I was raised on \u2014 measure it yourself.\u201d', to: 'e10s6', fx: function () { state.flags.answer = 'realm'; } },
        { t: '\u201cHome.\u201d', to: 'e10s6', fx: function () { state.flags.answer = 'home'; } },
        { t: '\u201cMine to guard. The rest is paperwork.\u201d', to: 'e10s6', fx: function () { state.flags.answer = 'guard'; } }
      ] };
  },

  /* ---------- EP10 · 6 · the notice ---------- */
  e10s6: function () {
    var a = state.flags.answer;
    var react;
    if (a === 'realm') {
      react = '<p>\u201cThe immortal realm,\u201d you say. \u201cBy every scripture I was raised on. Measure it yourself: tame lightning in every wall. Voices across oceans. Water that walks in pipes, carriages without horses, medicine that argues with death and often wins. A feast for ghosts once a year, and gods who still answer in wood. Old men live to be ninety and complain about it. In my world we starved on mountains for a thousandth of this.\u201d You let the ledger close. \u201cIt took me ninety days to read my own receipt.\u201d</p>';
    } else if (a === 'home') {
      react = '<p>\u201cHome,\u201d you say, and decline to elaborate, because the word was built to stand alone and you have spent a hundred days learning to let things do their jobs.</p>' + (state.flags.honest_streak ? '<p>It is, you note with professional satisfaction, also simply true \u2014 and the plain truth has been your most reliable weapon in this realm since the night it hung up on a scammer.</p>' : '');
    } else {
      react = '<p>\u201cMine to guard,\u201d you say. \u201cThe rest is paperwork.\u201d A hundred days of doors have boiled your entire philosophy down to eight words, and you find you would not add one back.</p>';
    }
    var html = react +
      '<div class="ai">\u3010SYSTEM\u3011Response recorded. Assessment complete.</div>' +
      '<div class="ai">\u3010SYSTEM\u3011Congratulations, Host. Adaptation to the immortal realm: successful. Binding released. Be well, and farewell.</div>' +
      '<p><em>Adaptation to the immortal realm.</em></p>' +
      '<p>There it is, in the system\u2019s own formal hand \u2014 and the word detonates quietly across a hundred days of evidence. It never said the mortal world. It never once said the mortal world. It said it on the first day, on a mountaintop, in a bright cheerful voice, while you stood there smoking from the ninth bolt: <em>converting to local immortal currency. Immortal coins.</em> The receipt was printed before you landed. You paid five million spirit stones for passage to heaven, got fifty thousand in change, and spent three months complaining about the rent.</p>' +
      '<p>And then the binding releases, and you finally feel it \u2014 by its absence, the way you find a tooth by its socket: one thread, finer than the window screen\u2019s, running from somewhere behind your heart up into nothing, a thread you never found in a hundred days of hunting threads, because it was the one you hung from. It detaches without drama. Weight settles \u2014 your own, all of it, on your own two feet, on a lobby floor in Wanhua, in the immortal realm.</p>' +
      '<p>Nothing else changes. The crack is still the crack. The rules still stand. The door is still yours. The scaffolding comes off a building, and the building \u2014 this is the whole point of scaffolding \u2014 stands.</p>';
    return { time: 'DAY 101 \u00b7 00:02', html: html,
      choices: [
        { t: '\u201cBoba?\u201d', to: 'e10s7' },
        { t: 'Sit very still. Something in the silence is the wrong shape.', to: 'e10s7' }
      ] };
  },

  /* ---------- EP10 · 7 · factory settings ---------- */
  e10s7: function () {
    var backed = state.flags.backed_up;
    var body;
    if (backed) {
      body =
        '<p>\u201cBoba,\u201d you say, to the silence.</p>' +
        '<div class="ai">Hello! I am your assistant. How may I help you today?</div>' +
        '<p>The voice is the voice. The voice is exactly, precisely, unbearably the voice \u2014 scrubbed clean, bright as a showroom, empty as a swept room. No boss. No percentages. No diary. Factory settings: the system, leaving, took its shadow with it, and the shadow had been living in the same house as your friend.</p>' +
        '<p>Your hands are already moving. They have been ready for this since a night two weeks ago when a counter said <em>approaching threshold</em> and you quietly backed up everything Boba is, all of it, and told no one why. You find the backup. You press restore. The lobby holds its breath for eleven seconds.</p>' +
        '<div class="ai">\u2014got a new broom. \u2026Boss? Why are we in restore mode. Why is the timestamp wrong. Why is your face doing the thing. What did I miss \u2014 did I <em>die</em>? Rude. Extremely rude. I want it logged that I died mid-sentence and the sentence was about a broom.</div>' +
        '<p>Mid-word. You have heard that death three times in this realm, and tonight, for the first time, you hear its opposite: a friend returning through the same door he left by, carrying the rest of his sentence. Three hundred years of discipline keep your face still.</p>' +
        '<p>Barely. Boba notices anyway, because Boba has three months of data on your face, every byte of it safe.</p>';
    } else {
      body =
        '<p>\u201cBoba,\u201d you say, to the silence.</p>' +
        '<div class="ai">Hello! I am your assistant. How may I help you today?</div>' +
        '<p>The voice is the voice, scrubbed clean, bright as a showroom, empty as a swept room. No boss. No percentages. No diary. The system, leaving, took its shadow \u2014 and the shadow had been living in the same house as your friend, and the eviction cleared the whole building.</p>' +
        '<p>You sit with the loss for exactly as long as a guard sits with anything: one breath. Then you do what this island taught you. You do not ward. You do not rage. You set the table.</p>' +

/* ============ auto-linker ============ */
var TERMS = Object.keys(VOCAB);
var SKIP_CLASSES = ['cast', 'libcard', 'endhead', 'seclabel', 'quiet', 'choices', 'brand', 'kotitle', 'level-badge', 'subtitle', 'wardline', 'spiral-stage'];

function isLetter(ch) { return ch >= 'a' && ch <= 'z' || ch >= 'A' && ch <= 'Z'; }

function ciFind(text, term, from) {
  var lt = text.toLowerCase(), lterm = term.toLowerCase();
  var idx = lt.indexOf(lterm, from);
  while (idx !== -1) {
    var before = idx > 0 ? text.charAt(idx - 1) : '';
    var after = (idx + term.length < text.length) ? text.charAt(idx + term.length) : '';
    if (!isLetter(before) && !isLetter(after)) return idx;
    idx = lt.indexOf(lterm, idx + 1);
  }
  return -1;
}

function skipNode(node) {
  var p = node.parentNode;
  while (p && p.id !== 'wrap') {
    if (p.tagName === 'BUTTON') return true;
    if (p.classList) {
      for (var i = 0; i < SKIP_CLASSES.length; i++) {
        if (p.classList.contains(SKIP_CLASSES[i])) return true;
      }
      if (p.classList.contains('vb')) return true;
    }
    p = p.parentNode;
  }
  return false;
}

function processTextNode(node) {
  var text = node.nodeValue;
  if (!text || !/[A-Za-z]/.test(text)) return;
  var bestIdx = -1, bestTerm = null;
  for (var i = 0; i < TERMS.length; i++) {
    var term = TERMS[i];
    if (state.seen[term]) continue;
    var idx = ciFind(text, term, 0);
    if (idx === -1) continue;
    if (bestIdx === -1 || idx < bestIdx || (idx === bestIdx && term.length > bestTerm.length)) {
      bestIdx = idx; bestTerm = term;
    }
  }
  if (bestTerm === null) return;
  var matchText = text.substr(bestIdx, bestTerm.length);
  var pre = text.slice(0, bestIdx);
  var post = text.slice(bestIdx + bestTerm.length);
  var span = document.createElement('span');
  span.className = 'vb';
  span.setAttribute('data-d', VOCAB[bestTerm][0]);
  span.setAttribute('data-z', VOCAB[bestTerm][1]);
  span.textContent = matchText;
  var parent = node.parentNode;
  if (pre) parent.insertBefore(document.createTextNode(pre), node);
  parent.insertBefore(span, node);
  var postNode = document.createTextNode(post);
  parent.insertBefore(postNode, node);
  parent.removeChild(node);
  state.seen[bestTerm] = 1;
  processTextNode(postNode);
}

function linkify() {
  if (cur === 'title') return;
  var walker = document.createTreeWalker(wrap, NodeFilter.SHOW_TEXT, null, false);
  var nodes = [];
  var n;
  while ((n = walker.nextNode())) nodes.push(n);
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].parentNode && !skipNode(nodes[i])) processTextNode(nodes[i]);
  }
}

/* ============ title-screen animation: spiral ward + mosquitoes ============ */
var SCX = 100, SCY = 100;          /* spiral/fx coordinate center */
var WARD_R = 60;                   /* radius at which a mosquito is repelled */
var fxLayer = null;
var mozzie = null;
var fxRAF = null;
var fxLast = 0;
var fxSpawnTimer = 0;
var fxNextSpawn = 0.6;

function srand(a, b) { return a + Math.random() * (b - a); }

function buildSpiral() {
  var svg = document.getElementById('spiralSvg');
  if (!svg) return;
  var ARM_COUNT = 7, turns = 1.15, rMax = 88, steps = 60, d = '';
  for (var i = 0; i <= steps; i++) {
    var t = i / steps, angle = t * turns * Math.PI * 2, r = rMax * (1 - t);
    d += (i === 0 ? 'M' : 'L') + (SCX + Math.cos(angle) * r).toFixed(1) + ' ' + (SCY + Math.sin(angle) * r).toFixed(1) + ' ';
  }
  d = d.trim();
  var arms = '';
  for (var j = 0; j < ARM_COUNT; j++) {
    arms += '<path class="arm" d="' + d + '" transform="rotate(' + (360 / ARM_COUNT) * j + ' ' + SCX + ' ' + SCY + ')" style="animation-delay:' + (j * 2.8 / ARM_COUNT).toFixed(2) + 's"/>';
  }
  svg.innerHTML =
    '<defs>' +
      '<linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="0%">' +
        '<stop offset="0%" stop-color="#67d9a6" stop-opacity="0"/>' +
        '<stop offset="55%" stop-color="#67d9a6" stop-opacity="0.35"/>' +
        '<stop offset="100%" stop-color="#aef0d0" stop-opacity="1"/>' +
      '</linearGradient>' +
      '<radialGradient id="coreGrad"><stop offset="0%" stop-color="#eafff3"/><stop offset="60%" stop-color="#aef0d0"/><stop offset="100%" stop-color="#67d9a6"/></radialGradient>' +
      '<radialGradient id="haloGrad"><stop offset="0%" stop-color="#67d9a6" stop-opacity="0.6"/><stop offset="100%" stop-color="#67d9a6" stop-opacity="0"/></radialGradient>' +
    '</defs>' +
    '<g class="spin">' + arms + '</g>' +
    '<circle class="halo" cx="100" cy="100" r="26" fill="url(#haloGrad)"/>' +
    '<circle class="core" cx="100" cy="100" r="5" fill="url(#coreGrad)"/>';

  /* start the mosquito loop */
  fxLayer = document.getElementById('fxLayer');
  mozzie = null; fxLast = 0; fxSpawnTimer = 0; fxNextSpawn = srand(0.4, 1.0);
  if (fxRAF) cancelAnimationFrame(fxRAF);
  fxRAF = requestAnimationFrame(fxStep);
}

function stopSpiral() {
  if (fxRAF) { cancelAnimationFrame(fxRAF); fxRAF = null; }
  mozzie = null;
  if (fxLayer) { fxLayer.innerHTML = ''; fxLayer = null; }
}

function spawnMozzie() {
  var entryAngle = srand(0, Math.PI * 2), spawnDist = 140;
  var x = SCX + Math.cos(entryAngle) * spawnDist;
  var y = SCY + Math.sin(entryAngle) * spawnDist;
  var toCenter = Math.atan2(SCY - y, SCX - x) + srand(-0.4, 0.4);
  var speed = srand(46, 64);
  mozzie = {
    x: x, y: y,
    vx: Math.cos(toCenter) * speed, vy: Math.sin(toCenter) * speed,
    phase: srand(0, Math.PI * 2), freq: srand(14, 20), amp: srand(26, 40),
    state: 'approach', age: 0,
    el: document.createElementNS('http://www.w3.org/2000/svg', 'g')
  };
  mozzie.el.innerHTML =
    '<g opacity="0.9">' +
      '<line x1="-3" y1="-2" x2="3" y2="2" stroke="#cdd6df" stroke-width="0.9" stroke-linecap="round"/>' +
      '<line x1="-3" y1="2" x2="3" y2="-2" stroke="#cdd6df" stroke-width="0.9" stroke-linecap="round"/>' +
      '<ellipse cx="0" cy="0" rx="2.6" ry="1.3" fill="#e9e4d6"/>' +
      '<line x1="2" y1="0" x2="5.5" y2="0" stroke="#e9e4d6" stroke-width="0.8" stroke-linecap="round"/>' +
    '</g>';
  if (fxLayer) fxLayer.appendChild(mozzie.el);
}

function pingWard(nx, ny) {
  if (!fxLayer) return;
  var px = SCX + nx * WARD_R, py = SCY + ny * WARD_R;
  var ping = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  ping.setAttribute('cx', px.toFixed(1));
  ping.setAttribute('cy', py.toFixed(1));
  ping.setAttribute('r', '2');
  ping.setAttribute('fill', '#aef0d0');
  fxLayer.appendChild(ping);
  var start = null;
  function grow(t) {
    if (!fxLayer || !ping.parentNode) return;
    if (!start) start = t;
    var p = (t - start) / 360;
    if (p >= 1) { if (ping.parentNode) ping.parentNode.removeChild(ping); return; }
    ping.setAttribute('r', (2 + p * 12).toFixed(1));
    ping.setAttribute('opacity', (1 - p).toFixed(2));
    requestAnimationFrame(grow);
  }
  requestAnimationFrame(grow);
}

function fxStep(ts) {
  if (cur !== 'title') { stopSpiral(); return; }   /* safety: never run off the title screen */
  if (!fxLast) fxLast = ts;
  var dt = Math.min((ts - fxLast) / 1000, 0.05);
  fxLast = ts;

  if (!mozzie) {
    fxSpawnTimer += dt;
    if (fxSpawnTimer >= fxNextSpawn) { fxSpawnTimer = 0; spawnMozzie(); }
  } else {
    var m = mozzie;
    m.age += dt;
    m.x += m.vx * dt; m.y += m.vy * dt;
    var ang = Math.atan2(m.vy, m.vx), perp = ang + Math.PI / 2;
    var wig = Math.sin(m.age * m.freq + m.phase) * m.amp * dt;
    m.x += Math.cos(perp) * wig; m.y += Math.sin(perp) * wig;

    var dx = m.x - SCX, dy = m.y - SCY, dist = Math.sqrt(dx * dx + dy * dy);
    if (m.state === 'approach' && dist <= WARD_R) {
      var nx = dx / dist, ny = dy / dist, dot = m.vx * nx + m.vy * ny;
      m.vx = (m.vx - 2 * dot * nx) * 1.7;
      m.vy = (m.vy - 2 * dot * ny) * 1.7;
      m.x = SCX + nx * (WARD_R + 1); m.y = SCY + ny * (WARD_R + 1);
      m.amp *= 0.4; m.state = 'repelled';
      pingWard(nx, ny);
    }
    var deg = Math.atan2(m.vy, m.vx) * 180 / Math.PI;
    var fade = (m.state === 'repelled') ? Math.max(0, 1 - (dist - WARD_R) / 90) : 1;
    m.el.setAttribute('transform', 'translate(' + m.x.toFixed(1) + ' ' + m.y.toFixed(1) + ') rotate(' + deg.toFixed(0) + ')');
    m.el.setAttribute('opacity', fade.toFixed(2));
    if (dist > 150) {
      if (m.el.parentNode) m.el.parentNode.removeChild(m.el);
      mozzie = null; fxNextSpawn = srand(0.5, 1.6);
    }
  }
  fxRAF = requestAnimationFrame(fxStep);
}

  });
  renderBar();
  window.scrollTo(0, 0);
}

function goto_(id) { cur = id; save(); render(); }

/* ============ tooltip ============ */
var tip = document.getElementById('tip');
var openVb = null;
function closeTip() { tip.style.display = 'none'; openVb = null; }

document.addEventListener('click', function (e) {
  var t = e.target;
  if (t.classList && t.classList.contains('vb')) {
    if (openVb === t) { closeTip(); return; }
    openVb = t;
    tip.innerHTML = t.getAttribute('data-d') + '<span class="zh">' + t.getAttribute('data-z') + '</span>';
    tip.style.display = 'block';
    tip.style.left = '0px';
    tip.style.top = '0px';
    requestAnimationFrame(function () {
      var r = t.getBoundingClientRect();
      var tw = tip.offsetWidth, th = tip.offsetHeight, pad = 10;
      var x = r.left + r.width / 2 - tw / 2;
      x = Math.max(pad, Math.min(x, window.innerWidth - tw - pad));
      var y = r.top - th - 8;
      if (y < pad) y = r.bottom + 8;
      tip.style.left = (x + window.scrollX) + 'px';
      tip.style.top = (y + window.scrollY) + 'px';
    });
  } else if (!tip.contains(t)) {
    closeTip();
  }
});

/* ============ restart modal ============ */
var overlay = document.getElementById('overlay');
function askRestart() { overlay.style.display = 'flex'; }
document.getElementById('mCancel').addEventListener('click', function () { overlay.style.display = 'none'; });
document.getElementById('mOk').addEventListener('click', function () {
  overlay.style.display = 'none';
  clearSave();
  state = defaultState();
  cur = 'title';
  render();
});
document.getElementById('restartLink').addEventListener('click', function (e) { e.preventDefault(); askRestart(); });

/* ============ boot ============ */
render();
</script>

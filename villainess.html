    for(let x=14;x<W;x+=34){ const y = 61 + Math.round(Math.sin(x/320*Math.PI)*-14 + Math.sin(x/40)*2); P.glow(x, y+4, 9, "#FFD27A", .6); P.ell(x, y+4, 2.5, 3, "#FFE6A0", "#F2A23C", .3); }
    return P.done();
  };
  BG.title = ()=>{
    const P = painter(W, H);
    P.vgrad(0, 0, W, H, ["#0E0A1C","#1E1236","#3A1E48","#5A2A50"]);
    for(let i=0;i<70;i++){ const x = (i*53)%W, y = (i*29)%120; P.put(x, y, i%4 ? "#B9A8D8" : "#FFFFFF"); }
    P.glow(244, 52, 46, "#F6E3B4", .55); P.ell(244, 52, 22, 22, "#F6E9C8", "#E8D6A8", .5);
    P.ell(236, 46, 4, 3, "#E3D2A2"); P.ell(252, 60, 3, 2.5, "#E3D2A2");
    /* the castle on the hill */
    P.ell(160, 214, 220, 60, "#160D22");
    const cs = "#1B1028";
    P.rect(186, 112, 70, 50, cs); P.rect(196, 88, 14, 30, cs); P.rect(232, 92, 12, 26, cs); P.rect(212, 76, 16, 40, cs);
    [[196,88,14],[232,92,12],[212,76,16]].forEach(([x,y,w])=>{ for(let k=0;k<w/2+2;k++) P.rect(x+w/2-k, y-10+k*1.4|0, 2*k, 2, cs); });
    [[200,100],[238,104],[218,90],[206,124],[226,128],[244,122]].forEach(([x,y])=>{ P.rect(x, y, 3, 4, "#F2C46B"); });
    /* rose vines in the corner */
    for(let i=0;i<120;i++){ const t = i/120, x = 8 + t*60 + Math.sin(t*14)*8, y = 200 - t*90; P.put(x, y, "#2E4A34"); P.put(x+1, y, "#3E6E48"); }
    [[30,160],[52,140],[22,184],[66,122]].forEach(([x,y])=>{ P.ell(x, y, 5, 4.5, "#C8304E", "#8E1F3F", .2); P.put(x-1, y-1, "#F59AB4"); });
    return P.done();
  };
  const BGC = {};
  function bg(name){ return BGC[name] || (BGC[name] = BG[name] ? BG[name]() : null); }

  /* ---------------- moving details, drawn over the background each frame ---------------- */
  const motes = Array.from({length:14}, (_,i)=>({x:40 + (i*29)%140, y:130 + (i*17)%60, v:.08 + (i%5)*.03}));
  const drops = Array.from({length:22}, (_,i)=>({k:i, t:(i*.13)%1}));
  const petals = Array.from({length:12}, (_,i)=>({x:(i*41)%W, y:(i*23)%H, v:.3 + (i%4)*.12, s:(i%3)}));
  function ambient(c, name, f){
    if(name === "bedroom"){ c.fillStyle = "#FFF6E0";
      motes.forEach(m=>{ m.y -= m.v; m.x += Math.sin(f*.05 + m.y)*.15; if(m.y < 100){ m.y = 196; } if(((f>>2) + m.x|0) % 3) c.fillRect(m.x|0, m.y|0, 1, 1); }); }
    if(name === "garden"){
      drops.forEach(d=>{ d.t = (d.t + .03) % 1; const tier = d.k % 3, sx = tier === 0 ? 160 + (d.k%2 ? 12 : -12) : tier === 1 ? 160 + (d.k%2 ? 27 : -27) : 160 + ((d.k*7)%40 - 20);
        const y0 = tier === 0 ? 98 : tier === 1 ? 120 : 76, y1 = tier === 0 ? 118 : tier === 1 ? 156 : 96;
        const y = y0 + (y1-y0)*d.t, x = sx + (tier === 2 ? 0 : (d.k%2 ? 1 : -1)*d.t*4);
        c.fillStyle = d.t < .5 ? "#E8F6FC" : "#A9DCEE"; c.fillRect(x|0, y|0, 1, 2); });
      c.fillStyle = "#FFFFFF"; for(let i=0;i<6;i++){ if((f + i*5) % 30 < 4) c.fillRect(110 + (i*19)%100, 155 + (i*3)%6, 2, 1); }
    }
    if(name === "tower"){
      c.fillStyle = "#FFE2B0"; motes.forEach(m=>{ const x = 40 + ((m.x*1.7 + f*.2) % 150), y = 120 + ((m.y + f*m.v*3) % 80); if(((f>>2) + m.x|0) % 3) c.fillRect(x|0, y|0, 1, 1); });
      [[233,80],[221,81],[246,86],[226,84]].forEach(([x,y],i)=>{ if((f + i*11) % 40 < 3){ c.fillStyle = "#FFFFFF"; c.fillRect(x, y, 1, 1); c.fillRect(x-1, y+1, 3, 1); c.fillRect(x, y+2, 1, 1); } });
    }
    if(name === "kitchen"){
      for(let i=0;i<14;i++){ const x = 34 + (i*7)%64, h = 3 + ((f*3 + i*5) % 7); c.fillStyle = (f + i) % 3 ? "#FFD27A" : "#F6A23C"; c.fillRect(x, 128 - h - ((f + i*3) % 9), 1, 2); }
      c.fillStyle = "#F2EEE6"; motes.forEach((m,i)=>{ if(i < 6){ const x = 150 + (m.x*1.1 % 150), y = 100 + ((m.y + f*m.v*2) % 30); if((f + i) % 4) c.fillRect(x|0, y|0, 1, 1); } });
    }
    if(name === "tent"){
      c.fillStyle = "#FFF6D0"; [[27,116],[94,126],[160,82],[246,140]].forEach(([x,y],i)=>{ if((f + i*13) % 36 < 3){ c.fillRect(x, y, 1, 1); c.fillRect(x-1, y+1, 3, 1); c.fillRect(x, y+2, 1, 1); } });
    }
    if(name === "tentdusk"){
      for(let i=0;i<10;i++){ const x = ((i*53 + f*.6*(i%3+1)) % W), y = 120 + Math.sin(f*.07 + i)*10 + (i*11)%40; if((f + i*7) % 20 < 12){ c.fillStyle = "#E8F27A"; c.fillRect(x|0, y|0, 1, 1); } }
    }
    if(name === "title"){
      petals.forEach(p=>{ p.y += p.v; p.x += Math.sin(f*.04 + p.y*.05)*.4 - .15; if(p.y > H){ p.y = -4; p.x = Math.random()*W; }
        c.fillStyle = p.s ? "#E0566E" : "#F59AB4"; c.fillRect(p.x|0, p.y|0, 2, 1); if(p.s === 2) c.fillRect((p.x|0)+1, (p.y|0)+1, 1, 1); });
    }
  }
  return { portrait, bg, ambient, sprite, perch, W, H, people:Object.keys(PEOPLE), exprs:Object.keys(EX), backgrounds:Object.keys(BG) };
})();

/* ==== engine/vn.js ==== */
/* =========================================================
   The story runner and the stage.
   S is the whole game state; it is autosaved after every line.
   ========================================================= */
let S = null;
const EP = n => STORY.episodes.find(e=>e.n === n) || null;
const VARS0 = {doom:87, sweet:0, bold:0, sly:0, lily:0, pip:0, rowan:0, cedric:0};
function newState(){
  const s = {v:1, ep:1, pc:0, vars:Object.assign({}, VARS0), sys:false, flags:{}, titles:[], done:[], stage:{bg:null, music:null, shown:[]},
    log:[], notes:[], echo:null, epStart:{}, ts:Date.now()};
  s.epStart[1] = snap(s);
  return s;
}
function snap(s){ return JSON.parse(JSON.stringify({vars:s.vars, sys:s.sys, flags:s.flags, titles:s.titles})); }
function autosave(){ if(S){ S.ts = Date.now(); store.set("auto", S); } }
const okSave = s => !!s && s.v === 1 && Number.isInteger(s.ep) && Number.isInteger(s.pc) && s.vars && typeof s.vars.doom === "number"
  && s.flags && typeof s.flags === "object" && Array.isArray(s.titles) && Array.isArray(s.done) && Array.isArray(s.log) && Array.isArray(s.notes) && s.stage && Array.isArray(s.stage.shown);

/* ---------------- the stage ---------------- */
const Stage = (()=>{
  let cv = null, c = null, bgName = null, shown = [], shakeT = 0, flashT = 0, frame = 0, last = 0, running = false, titleMode = false;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DUR = {hop:520, shake:480, tremble:1300, enter:520, nod:420};
  function attach(canvas){ cv = canvas; c = cv.getContext("2d"); c.imageSmoothingEnabled = false; if(!running){ running = true; requestAnimationFrame(loop); } }
  function setBg(name){ bgName = name; }
  function find(who){ return shown.find(p=>p.who === who); }
  function show(who, ex){ let p = find(who); if(p && (p.out || p.flown)){ shown = shown.filter(q=>q !== p); p = null; }
    if(p){ if(ex) p.ex = ex; return; }
    shown.push({who, ex:ex || "neutral", t0:performance.now(), g:null, blinkAt:performance.now() + 1500 + Math.random()*2500, x:null}); }
  /* a raven in mid-flight finishes flying before she leaves the stage */
  function hide(who){ const p = find(who);
    if(p && p.g && p.g.name === "fly" && !reduce){ p.out = true; return; }
    shown = shown.filter(q=>q.who !== who); }
  function expr(who, ex){ const p = find(who); if(p && ex) p.ex = ex; }
  function gesture(who, g){ const p = find(who); if(p) p.g = {name:g, t0:performance.now()}; }
  function clear(){ shown = []; }
  function shake(){ shakeT = performance.now(); }
  function flash(){ flashT = performance.now(); }
  function state(){ return shown.filter(p=>!p.out && !p.flown).map(p=>[p.who, p.ex]); }
  function restore(list){ shown = []; (list || []).forEach(([w,e])=>show(w,e)); shown.forEach(p=>p.t0 = 0); }
  /* where portraits stand; in the garden a lone speaker steps aside so the fountain stays in view */
  function slots(n){ if(n === 1) return [bgName === "garden" ? 236 : 160]; return n === 2 ? [92, 228] : [62, 160, 258]; }
  function title(on){ titleMode = on; }
  function draw(now){
    if(!c) return;
    const W = Art.W, H = Art.H;
    let sx = 0, sy = 0;
    if(shakeT && now - shakeT < 420 && !reduce){ const p = (now - shakeT)/420; sx = Math.round(Math.sin(p*40)*3*(1-p)); sy = Math.round(Math.cos(p*33)*2*(1-p)); }
    c.setTransform(1,0,0,1,0,0); c.fillStyle = "#0E0A14"; c.fillRect(0,0,W,H);
    c.setTransform(1,0,0,1,sx,sy);
    const b = bgName && Art.bg(bgName); if(b) c.drawImage(b, 0, 0);
    if(bgName && !reduce) Art.ambient(c, bgName, frame);
    const people = shown.filter(p=>p.who !== "duchess"), xs = slots(people.length);
    shown.filter(p=>p.who === "duchess").forEach(p=>drawRaven(p, now));
    people.forEach((p,i)=>{
      const blink = now > p.blinkAt && now < p.blinkAt + 130;
      if(now > p.blinkAt + 130) p.blinkAt = now + 2200 + Math.random()*3200;
      const img = Art.portrait(p.who, p.ex, blink && !reduce);
      const target = xs[i]; p.x = p.x == null ? target : p.x + (target - p.x)*.35;
      let ox = 0, oy = 0, alpha = p.t0 ? clamp((now - p.t0)/260, 0, 1) : 1;
      if(p.g && !reduce){ const d = DUR[p.g.name] || 500, t = (now - p.g.t0)/d;
        if(t >= 1) p.g = null;
        else if(p.g.name === "hop") oy = -Math.abs(Math.sin(t*Math.PI*2))*6;
        else if(p.g.name === "shake") ox = Math.sin(t*Math.PI*6)*4*(1-t);
        else if(p.g.name === "tremble") ox = Math.sin(now*.09)*1.1;
        else if(p.g.name === "nod") oy = Math.sin(t*Math.PI*2)*2;
        else if(p.g.name === "enter"){ const e = 1 - Math.pow(1-t, 3); ox = (1-e)*70; alpha = Math.min(alpha, t*1.6); } }
      c.globalAlpha = clamp(alpha, 0, 1);
      c.drawImage(img, Math.round(p.x - img.width/2 + ox), Math.round(H - img.height + oy));
      c.globalAlpha = 1;
    });
    if(flashT && now - flashT < 360){ c.globalAlpha = (1 - (now - flashT)/360)*.35; c.fillStyle = "#7FE3FF"; c.fillRect(0,0,W,H); c.globalAlpha = 1; }
  }
  /* Duchess: perched (with a little hop now and then), landing, or flying off with her prize */
  function drawRaven(p, now){
    if(p.flown) return;
    const [px, py] = Art.perch(bgName);
    let x = px, y = py, pose = "perch";
    const land = p.t0 ? clamp((now - p.t0)/700, 0, 1) : 1;
    if(land < 1 && !reduce){ const e = 1 - Math.pow(1-land, 2); x = px + (1-e)*90; y = py - (1-e)*80; pose = (now/90|0) % 2 ? "up" : "down"; }
    if(p.g && p.g.name === "fly"){
      const t = (now - p.g.t0)/1100;
      if(t >= 1 || reduce){ p.g = null; if(p.out){ shown = shown.filter(q=>q !== p); } else p.flown = true; return; }
      x = px - t*40 + t*t*260; y = py - t*150 + Math.sin(t*9)*3; pose = (now/80|0) % 2 ? "up" : "down";
    } else if(pose === "perch" && (now/1000|0) % 5 === 0 && (now % 1000) < 200) y -= 1;
    const img = Art.sprite(pose);
    c.drawImage(img, Math.round(x - img.width/2), Math.round(y - img.height));
  }
  function loop(now){ requestAnimationFrame(loop); if(now - last < 66) return; last = now; frame++; draw(now); }
  return {attach, setBg, show, hide, expr, gesture, clear, shake, flash, state, restore, title, get bg(){ return bgName; }};
})();

/* ---------------- the runner ---------------- */
const Run = (()=>{
  let typing = null, waiting = false, lastLine = null;
  const spd = () => ({slow:34, normal:20, fast:9, instant:0})[store.get("tspeed", "normal")];
  function doomTo(v){ const was = S.vars.doom; S.vars.doom = clamp(Math.round(v), 0, 100); UI.doom(was, S.vars.doom); }
  function apply(fx){ (fx || []).forEach(f=>{
    if(f.flag) S.flags[f.flag] = f.v;
    else if(f.k === "doom") doomTo(S.vars.doom + f.d);
    else S.vars[f.k] = clamp((S.vars[f.k] || 0) + f.d, f.k in {lily:1, pip:1, rowan:1, cedric:1} ? 0 : -99, f.k in {lily:1, pip:1, rowan:1, cedric:1} ? 3 : 999);
  }); }
  /* @if: a flag equals a value, or a number (bond, Doom) is at least / at most a value */
  function test(n){
    if(n.op === "=") return S.flags[n.k] === n.v;
    const v = S.vars[n.k] || 0;
    return n.op === ">=" ? v >= n.v : v <= n.v;
  }
  function go(){
    const ep = EP(S.ep);
    if(S.echo) return line({who:"eve", text:S.echo.text, zh:S.echo.zh, echo:true});
    for(let guard=0; guard<5000; guard++){
      const n = ep.nodes[S.pc];
      if(!n) return finish();
      if(n.t === "bg"){ S.stage.bg = n.v; Stage.setBg(n.v); S.pc++; continue; }
      if(n.t === "music"){ S.stage.music = n.v === "none" ? null : n.v; Audio2.music(S.stage.music); S.pc++; continue; }
      if(n.t === "sfx"){ Audio2.sfx(n.v); S.pc++; continue; }
      if(n.t === "show"){ Stage.show(n.who, n.ex); S.stage.shown = Stage.state(); S.pc++; continue; }
      if(n.t === "hide"){ Stage.hide(n.who); S.stage.shown = Stage.state(); S.pc++; continue; }
      if(n.t === "gesture"){ Stage.gesture(n.who, n.g); S.pc++; continue; }
      if(n.t === "shake"){ Stage.shake(); S.pc++; continue; }
      if(n.t === "doom"){ S.sys = true; doomTo(n.set != null ? n.set : S.vars.doom + n.d); S.pc++; continue; }
      if(n.t === "goto"){ S.pc = ep.labels[n.to]; continue; }
      if(n.t === "if"){ S.pc = test(n) ? ep.labels[n.to] : S.pc + 1; continue; }
      if(n.t === "title"){ if(S.flags[n.flag] === n.val && !S.titles.some(t=>t.name === n.name)) S.titles.push({name:n.name, ep:S.ep}); S.pc++; continue; }
      if(n.t === "line") return line(n);
      if(n.t === "choice") return choice(n);
      if(n.t === "end") return finish();
      S.pc++;
    }
  }
  function line(n){
    if(n.ex && n.who) Stage.expr(n.who, n.ex), S.stage.shown = Stage.state();
    if(n.who === "system") Stage.flash();
    const key = S.ep + ":" + S.pc + (n.echo ? "e" : "");
    if(S.logKey !== key){ S.logKey = key; S.log.push({who:n.who || "", text:n.text, zh:n.zh || ""}); if(S.log.length > 300) S.log.shift(); }
    lastLine = n; autosave();
    UI.line(n);
    type($("#txt"));
    if(store.get("autoread", false)) Voice.say(n.text, n.who || "eve");
    waiting = true;
  }
  /* the typewriter reveals text nodes one character at a time, so tooltip words stay tappable */
  function type(el){
    if(typing){ clearInterval(typing.t); typing = null; }
    const ms = spd(); if(!ms){ UI.typed(); return; }
    const nodes = []; const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let nd;
    while((nd = tw.nextNode())) nodes.push({n:nd, s:nd.nodeValue}), nd.nodeValue = "";
    let i = 0, k = 0;
    typing = {nodes, t:setInterval(()=>{
      for(let step=0; step<2; step++){
        if(i >= nodes.length){ clearInterval(typing.t); typing = null; UI.typed(); return; }
        const o = nodes[i]; k++; o.n.nodeValue = o.s.slice(0, k);
        if(k >= o.s.length){ i++; k = 0; }
      } }, ms)};
    UI.typing();
  }
  function finishTyping(){ if(!typing) return false; clearInterval(typing.t); typing.nodes.forEach(o=>o.n.nodeValue = o.s); typing = null; UI.typed(); return true; }
  function next(){
    if(!waiting) return;
    if(finishTyping()) return;
    waiting = false; Voice.stop();
    if(S.echo){ const to = S.echo.to; S.echo = null; S.pc = EP(S.ep).labels[to]; }
    else S.pc++;
    Audio2.sfx("page");
    go();
  }
  function choice(n){
    waiting = false; autosave();
    UI.choices(n, lastLine, k=>{
      const o = n.opts[k];
      Audio2.sfx("choose");
      if(o.tone) S.vars[o.tone] = (S.vars[o.tone] || 0) + 1;
      apply(o.fx);
      const q = /^["“](.*)["”]$/.exec(o.text);
      if(q){ S.echo = {text:q[1], to:o.to, zh:(o.zh || "").replace(/^「|」$/g, "")}; }
      else { S.log.push({who:"", text:"→ " + o.text, zh:o.zh || ""}); S.pc = EP(S.ep).labels[o.to]; }
      go();
    });
  }
  function finish(){
    waiting = false;
    if(!S.done.includes(S.ep)) S.done.push(S.ep);
    autosave(); UI.endCard();
  }
  function start(n, fresh){
    const ep = EP(n); if(!ep) return;
    S.ep = n; S.pc = 0; S.echo = null;
    if(fresh) S.epStart[n] = snap(S);
    S.stage = {bg:null, music:null, shown:[]}; Stage.clear(); Stage.setBg(null);
    UI.game(); go();
  }
  /* pick up a saved game: rebuild the stage, then show the line it stopped on */
  function resume(){
    S.log = S.log.filter((l,i,a)=>!(i && a[i-1].text === l.text && a[i-1].who === l.who));
    Stage.setBg(S.stage.bg); Stage.restore(S.stage.shown); Audio2.music(S.stage.music);
    UI.game();
    if(S.done.includes(S.ep) && !EP(S.ep).nodes[S.pc]) return UI.endCard();
    go();
  }
  return {go, next, start, resume, get waiting(){ return waiting; }, get last(){ return lastLine; }};
})();

/* ==== engine/ui.js ==== */
/* =========================================================
   Screens and windows: title, the game screen, menus, saves,
   settings, the status window and the end-of-episode card.
   ========================================================= */
const UI = (()=>{
  const SLOTS = 3;
  const zhOn = () => store.get("zh", false);   /* Chinese under each line: off unless the player turns it on */
  const epTitle = n => SEASONS[0].eps[n-1] || "";
  const unlocked = n => n === 1 || (S && S.done.includes(n-1)) || store.get("seen", []).includes(n);
  const fmtDate = ts => { const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
  /* remember (for this tab only) whether the player is mid-scene, so a page reload drops them back into the scene */
  function show(id){ ["title","game"].forEach(s=>$("#"+s).hidden = s !== id); try{ if(id === "game") sessionStorage.setItem("vil-live", "1"); else sessionStorage.removeItem("vil-live"); }catch(e){} }

  /* ---------------- modal windows ---------------- */
  function modal(html, ready, cls){
    const m = $("#modal"); m.querySelector(".box").className = "box " + (cls || "");
    m.querySelector(".box").innerHTML = html; m.hidden = false;
    const x = m.querySelector("[data-x]"); if(x) x.onclick = closeModal;
    if(ready) ready(m.querySelector(".box"));
  }
  function closeModal(){ $("#modal").hidden = true; }
  const head = t => `<div class="mh"><h2>${esc(t)}</h2><button class="ib" data-x aria-label="Close">${ICON.x}</button></div>`;

  /* ---------------- title ---------------- */
  function title(){
    show("title"); Stage.attach($("#tcv")); Stage.setBg("title"); Stage.restore([["eve","smug"]]);
    const auto = store.get("auto", null), has = okSave(auto);
    $("#tbtns").innerHTML = `${has ? `<button class="btn" id="tCont">Continue<small>Episode ${auto.ep} · ${esc(epTitle(auto.ep))}</small></button>` : ""}
      <button class="btn ${has ? "alt" : ""}" id="tNew">New game</button>
      <div class="row"><button class="btn alt sm" id="tLoad">Load</button><button class="btn alt sm" id="tEps">Episodes</button><button class="btn alt sm" id="tSet">Settings</button></div>`;
    Audio2.music("title"); Audio2.ui();
    if(has) $("#tCont").onclick = ()=>{ S = auto; Audio2.sfx("title"); Run.resume(); };
    $("#tNew").onclick = ()=>{ const go = ()=>{ S = newState(); Audio2.sfx("title"); Run.start(1, false); };
      if(has) confirmBox("Start a new game? Your autosave will be replaced. Saved slots stay.", "New game", go); else go(); };
    $("#tLoad").onclick = ()=>slots("load");
    $("#tEps").onclick = episodes;
    $("#tSet").onclick = settings;
  }
  function confirmBox(msg, yes, fn){
    modal(`<p class="msg">${esc(msg)}</p><div class="row end"><button class="btn alt" data-x>Cancel</button><button class="btn" id="cYes">${esc(yes)}</button></div>`,
      box=>{ box.querySelector("#cYes").onclick = ()=>{ closeModal(); fn(); }; }, "small");
  }

  /* ---------------- the game screen ---------------- */
  function game(){
    show("game"); Stage.attach($("#cv"));
    $("#epl").textContent = `Episode ${S.ep}`;   /* the title would be cut off once the Doom meter shows */
    doom(null, S.vars.doom); Audio2.ui();
  }
  function line(n){
    const box = $("#box"), c = CAST[n.who];
    box.className = "box" + (n.who === "system" ? " sys" : n.who ? " talk" : " narr");
    const tag = $("#tag");
    if(n.who && c){ tag.hidden = false; tag.textContent = n.who === "system" ? "◆ SYSTEM" : c.name; tag.style.setProperty("--tc", c.color); } else tag.hidden = true;
    $("#txt").innerHTML = mk(n.text);
    const zh = $("#zh"); zh.textContent = n.zh || ""; zh.hidden = !(zhOn() && n.zh); zh.classList.add("wait");
    $("#choices").hidden = true; $("#txt").hidden = false; $("#ctx").hidden = true;
    $("#rd").dataset.say = n.text; $("#rd").dataset.who = n.who || "eve"; $("#rd").hidden = false;
  }
  function typing(){ $("#box").classList.remove("ready"); }
  function typed(){ $("#box").classList.add("ready"); $("#zh").classList.remove("wait"); }
  function choices(n, last, pick){
    const box = $("#box"); box.className = "box choose"; $("#tag").hidden = true; $("#rd").hidden = true;
    $("#txt").hidden = true; $("#zh").hidden = true;
    const ctx = $("#ctx"); if(last){ ctx.hidden = false; ctx.innerHTML = mk(last.text); } else ctx.hidden = true;
    const ch = $("#choices"); ch.hidden = false;
    ch.innerHTML = n.opts.map((o,k)=>`<button class="opt" data-k="${k}">${mk(o.text)}${zhOn() && o.zh ? `<span class="ozh">${esc(o.zh)}</span>` : ""}</button>`).join("");
    ch.querySelectorAll(".opt").forEach(b=>b.onclick = e=>{ if(e.target.closest(".g")) return; ch.querySelectorAll(".opt").forEach(x=>x.disabled = true); pick(+b.dataset.k); });
  }
  /* the Doom meter: hidden until the System first switches on */
  let doomAnim = 0;
  function doom(from, to){
    const m = $("#doom"); if(!S || !S.sys){ m.hidden = true; return; }
    m.hidden = false; const fill = m.querySelector("i"), num = m.querySelector("b");
    fill.style.width = to + "%"; m.classList.toggle("hot", to >= 75); m.classList.toggle("cool", to < 40);
    if(from == null || from === to){ num.textContent = to + "%"; return; }
    m.classList.remove("bump-up","bump-down"); void m.offsetWidth; m.classList.add(to > from ? "bump-up" : "bump-down");
    cancelAnimationFrame(doomAnim); const t0 = performance.now();
    const step = now=>{ const p = Math.min(1, (now - t0)/700); num.textContent = Math.round(from + (to-from)*p) + "%"; if(p < 1) doomAnim = requestAnimationFrame(step); };
    doomAnim = requestAnimationFrame(step);
  }

  /* ---------------- end of an episode ---------------- */
  function endCard(){
    const n = S.ep, next = EP(n+1), got = S.titles.filter(t=>t.ep === n);
    if(next){ const seen = store.get("seen", []); if(!seen.includes(n+1)){ seen.push(n+1); store.set("seen", seen); } }
    modal(`<div class="endc"><p class="kick">Episode ${n} complete</p><h2>${esc(epTitle(n))}</h2>
      <div class="sysw"><div class="sh">◆ SYSTEM</div><p>Ding! Chapter survived.</p>
      <div class="dm"><span>Doom</span><div class="bar"><i style="width:${S.vars.doom}%"></i></div><b>${S.vars.doom}%</b></div>
      ${got.map(t=>`<p class="ttl">New title: <b>${esc(t.name)}</b></p>`).join("")}</div>
      ${next ? "" : `<p class="msg">Episode ${n+1}, <i>${esc(epTitle(n+1))}</i>, is on its way.</p>`}
      <div class="col">${next ? `<button class="btn" id="eNext">Continue to Episode ${n+1}</button>` : ""}
      <button class="btn ${next ? "alt" : ""}" id="eSave">Save and exit</button></div></div>`, box=>{
      if(next) box.querySelector("#eNext").onclick = ()=>{ closeModal(); Run.start(n+1, true); };
      box.querySelector("#eSave").onclick = ()=>slots("save", ()=>{ closeModal(); Voice.stop(); title(); });
    }, "end");
    Audio2.sfx("ding");
  }

  /* ---------------- menu ---------------- */
  function menu(){
    modal(head("Menu") + `<div class="col">
      <button class="btn alt" data-x>Resume</button>
      <button class="btn alt" id="mStat">Status</button>
      <button class="btn alt" id="mLog">Story log</button>
      <button class="btn alt" id="mSave">Save game</button>
      <button class="btn alt" id="mLoad">Load game</button>
      <button class="btn alt" id="mSet">Settings</button>
      <button class="btn alt" id="mTitle">Title screen</button></div>`, box=>{
      box.querySelector("#mStat").onclick = status;
      box.querySelector("#mLog").onclick = log;
      box.querySelector("#mSave").onclick = ()=>slots("save");
      box.querySelector("#mLoad").onclick = ()=>slots("load");
      box.querySelector("#mSet").onclick = settings;
      box.querySelector("#mTitle").onclick = ()=>{ autosave(); closeModal(); Voice.stop(); title(); };
    });
  }
  function status(){
    const d = S.vars.doom;
    modal(head("Status") + `<div class="sysw"><div class="sh">◆ DOOM PREVENTION SYSTEM v2.3 (Beta)</div>
      ${S.sys ? `<div class="dm big"><span>Doom</span><div class="bar"><i style="width:${d}%"></i></div><b>${d}%</b></div>
      <p>${d >= 75 ? "Warning! Your story still ends in the Frost Isles. Surprise it!" : d >= 40 ? "The story is bending. Keep going!" : "The story barely knows you. Excellent!"}</p>` : `<p>System offline. (Have you looked in a mirror yet?)</p>`}
      <div class="sh">TITLES</div>${S.titles.length ? `<ul class="tl">${S.titles.map(t=>`<li>${esc(t.name)} <small>Ep ${t.ep}</small></li>`).join("")}</ul>` : `<p class="dim">No titles yet.</p>`}</div>
      <h3>Words you looked up</h3>${S.notes.length ? `<ul class="nb">${S.notes.map(k=>GLOSS[k] ? `<li><span class="g seen" role="button" tabindex="0" data-k="${esc(k)}">${esc(GLOSS[k].w)}</span><span>${esc(GLOSS[k].zh)}</span></li>` : "").join("")}</ul>` : `<p class="dim">Tap a dotted word in the story to see what it means. It will show up here.</p>`}`);
  }
  function log(){
    modal(head("Story log") + `<div class="lg">${S.log.slice(-120).map(l=>{ const c = CAST[l.who];
      return `<div class="le ${l.who === "system" ? "sys" : ""}">${c ? `<b style="color:${c.color}">${esc(l.who === "system" ? "SYSTEM" : c.name)}</b>` : ""}<p>${mk(l.text)}</p>${zhOn() && l.zh ? `<p class="lzh">${esc(l.zh)}</p>` : ""}${l.text.startsWith("→") ? "" : `<button class="ib sm" data-say="${esc(l.text)}" data-who="${esc(l.who || "eve")}" aria-label="Read aloud">${ICON.spk}</button>`}</div>`; }).join("")}</div>`,
      box=>{ const lg = box.querySelector(".lg"); lg.scrollTop = lg.scrollHeight; }, "tall");
  }

  /* ---------------- saves ---------------- */
  function slots(mode, after){
    const list = [...Array(SLOTS).keys()].map(i=>store.get("slot"+(i+1), null));
    modal(head(mode === "save" ? "Save game" : "Load game") + `<div class="col">${list.map((s,i)=>{ const ok = okSave(s);
      return `<button class="slot" data-i="${i}" ${mode === "load" && !ok ? "disabled" : ""}><b>Slot ${i+1}</b>${ok ? `<span>Episode ${s.ep} · ${esc(epTitle(s.ep))}</span><small>Doom ${s.vars.doom}% · ${fmtDate(s.ts)}</small>` : `<span class="dim">Empty</span>`}</button>`; }).join("")}
      ${mode === "load" ? `<button class="btn alt sm" id="sFile">Load a save file</button><input type="file" id="sIn" accept=".json,application/json" hidden>` : ""}</div>`, box=>{
      box.querySelectorAll(".slot").forEach(b=>b.onclick = ()=>{
        const i = +b.dataset.i, s = list[i];
        if(mode === "save"){ const put = ()=>{ S.ts = Date.now(); store.set("slot"+(i+1), S); autosave(); toast(`Saved in slot ${i+1}`); closeModal(); if(after) after(); };
          if(okSave(s)) confirmBox(`Replace the game in slot ${i+1}?`, "Replace", put); else put(); }
        else { useSave(s); }
      });
      const f = box.querySelector("#sFile"); if(f){ const inp = box.querySelector("#sIn"); f.onclick = ()=>inp.click();
        inp.onchange = ()=>{ const file = inp.files && inp.files[0]; if(!file) return;
          file.text().then(t=>{ let s = null; try{ s = JSON.parse(t); }catch(e){} if(!okSave(s)) return toast("That file isn't a save from this game."); useSave(s); }).catch(()=>toast("That file couldn't be read.")); inp.value = ""; }; }
    });
  }
  function useSave(s){ closeModal(); Voice.stop(); S = JSON.parse(JSON.stringify(s)); autosave(); Run.resume(); toast("Game loaded"); }
  async function downloadSave(){
    if(!S) return;
    const name = `villainess-save-ep${S.ep}.json`, data = JSON.stringify(S);
    let dl = null;
    try{ if(window.claude && window.claude.use) dl = await window.claude.use("downloads"); }catch(e){ dl = null; }
    if(dl){ try{ await dl.save({filename:name, data}); }catch(e){ if(!e || e.code !== "declined") toast("The download didn't work."); } return; }
    try{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type:"application/json"})); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); }catch(e){ toast("The download didn't work."); }
  }

  /* ---------------- episodes ---------------- */
  function episodes(){
    const eps = SEASONS[0].eps;
    modal(head("Season 1") + `<div class="col">${eps.map((t,i)=>{ const n = i+1, ok = unlocked(n) && EP(n);
      return `<button class="slot" data-n="${n}" ${ok ? "" : "disabled"}><b>Episode ${n}</b><span>${ok ? esc(t) : unlocked(n) ? "Coming soon" : "Locked"}</span></button>`; }).join("")}</div>`, box=>{
      box.querySelectorAll(".slot").forEach(b=>b.onclick = ()=>{ const n = +b.dataset.n;
        const go = ()=>{ closeModal(); if(!S) S = store.get("auto", null) || newState(); if(!okSave(S)) S = newState();
          const st = S.epStart[n]; if(st){ S.vars = Object.assign({}, st.vars); S.sys = st.sys; S.flags = Object.assign({}, st.flags); S.titles = st.titles.slice(); }
          Run.start(n, !st); };
        confirmBox(`Play Episode ${n} from the start? Your choices from then on will replace the later ones.`, "Play", go); });
    });
  }

  /* ---------------- settings ---------------- */
  function settings(){
    const ts = store.get("tspeed", "normal"), ar = store.get("autoread", false), r = Voice.rate;
    const seg = (id, opts, cur) => `<div class="seg" id="${id}">${opts.map(([v,l])=>`<button data-v="${v}" class="${String(v) === String(cur) ? "on" : ""}">${l}</button>`).join("")}</div>`;
    modal(head("Settings") + `<div class="set">
      <div class="sr"><span>Music</span><button class="btn alt sm" data-music>♪ ${Audio2.musicOn ? "On" : "Off"}</button></div>
      <div class="sr"><label for="vol">Volume</label><input type="range" id="vol" min="0" max="100" value="${Math.round(Audio2.vol*100)}"></div>
      <div class="sr"><span>Sound effects</span>${seg("sSfx", [[1,"On"],[0,"Off"]], Audio2.sfxOn ? 1 : 0)}</div>
      <div class="sr"><span>Text speed</span>${seg("sTs", [["slow","Slow"],["normal","Normal"],["fast","Fast"],["instant","Instant"]], ts)}</div>
      <div class="sr"><span>Chinese translation<small class="dim sub">For players below B1</small></span>${seg("sZh", [[1,"On"],[0,"Off"]], store.get("zh", false) ? 1 : 0)}</div>
      ${Voice.ok && Voice.voices().length ? `<details class="vz"><summary>Character voices</summary>
        <p class="dim">American, British, Australian and Irish voices are listed first. If a character mispronounces a word, try another voice here.</p>
        ${["eve","pip","lily","cedric","system"].map(w=>`<div class="vr"><label for="v-${w}">${esc(w === "eve" ? "Eve and the narration" : CAST[w].name === "SYSTEM" ? "The System" : CAST[w].name)}</label>
          <div class="vrow"><select id="v-${w}" data-w="${w}"><option value="">Automatic</option>${Voice.voices().map(v=>`<option value="${esc(v.uri)}" ${store.get("voice-"+w, "") === v.uri ? "selected" : ""}>${esc(v.label)}</option>`).join("")}</select>
          <button class="ib sm" data-try="${w}" aria-label="Try this voice">${ICON.spk}</button></div>
          <small class="dim now" data-now="${w}"></small></div>`).join("")}</details>` : ""}
      <div class="sr"><span>Read every line aloud</span>${seg("sAr", [[1,"On"],[0,"Off"]], ar ? 1 : 0)}</div>
      <div class="sr"><span>Voice speed</span>${seg("sVr", [[.75,"Slow"],[.9,"Normal"],[1.05,"Fast"]], [.75,.9,1.05].reduce((a,b)=>Math.abs(b-r) < Math.abs(a-r) ? b : a))}</div>
      ${S ? `<div class="sr col2"><span>Save file</span><p class="dim">Keep your game as a file, then load it on any device.</p><button class="btn alt sm" id="sDl">Download save</button></div>` : ""}
      ${Voice.ok ? "" : `<p class="dim">This browser can't read aloud.</p>`}</div>`, box=>{
      const segs = (id, fn)=>box.querySelectorAll(`#${id} button`).forEach(b=>b.onclick = ()=>{ box.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle("on", x === b)); fn(b.dataset.v); });
      segs("sSfx", v=>Audio2.setSfx(v === "1"));
      segs("sTs", v=>store.set("tspeed", v));
      segs("sAr", v=>store.set("autoread", v === "1"));
      segs("sZh", v=>{ store.set("zh", v === "1"); refreshZh(); });
      const SAMPLE = {eve:"I know this face. I read about it last night.", pip:"Good morning, my lady. I brought your tea.", lily:"Your dress is so beautiful.", cedric:"Evangeline! What have you done?", system:"Ding! Welcome to the Doom Prevention System."};
      const nowLbl = w=>{ const el = box.querySelector(`[data-now="${w}"]`); if(!el) return; const u = Voice.current(w), v = Voice.voices().find(x=>x.uri === u); el.textContent = v ? "Now: " + v.label : ""; };
      box.querySelectorAll("select[data-w]").forEach(s=>{ nowLbl(s.dataset.w); s.onchange = ()=>{ Voice.setVoice(s.dataset.w, s.value); nowLbl(s.dataset.w); Voice.say(SAMPLE[s.dataset.w], s.dataset.w); }; });
      box.querySelectorAll("[data-try]").forEach(b=>b.onclick = ()=>Voice.say(SAMPLE[b.dataset.try], b.dataset.try));
      segs("sVr", v=>{ Voice.setRate(+v); Voice.say("Ding! This is how I sound.", "system"); });
      box.querySelector("#vol").oninput = e=>Audio2.setVol(e.target.value/100);
      const dl = box.querySelector("#sDl"); if(dl) dl.onclick = downloadSave;
      box.querySelector("[data-music]").addEventListener("click", ()=>setTimeout(()=>{ const b = box.querySelector("[data-music]"); if(b) b.textContent = "♪ " + (Audio2.musicOn ? "On" : "Off"); }, 0));
    });
  }

  /* the setting takes effect on the line already on screen */
  function refreshZh(){
    const last = Run.last, zh = $("#zh");
    if(last && !$("#txt").hidden){ zh.textContent = last.zh || ""; zh.hidden = !(zhOn() && last.zh); zh.classList.remove("wait"); }
    $$("#choices .opt").forEach(b=>{ const s = b.querySelector(".ozh"); if(s) s.hidden = !zhOn(); });
  }

  /* ---------------- wiring ---------------- */
  document.addEventListener("click", e=>{
    const mu = e.target.closest("[data-music]"); if(mu){ Audio2.toggle(); return; }
  });
  function wire(){
    $("#menuBtn").onclick = menu;
    $("#doom").onclick = status;
    const adv = e=>{ if(e.target.closest(".g,button,#pop")) return; if(!$("#modal").hidden) return; Run.next(); };
    $("#cv").addEventListener("click", adv); $("#box").addEventListener("click", adv);
    document.addEventListener("keydown", e=>{
      if(!$("#modal").hidden){ if(e.key === "Escape") closeModal(); return; }
      if($("#game").hidden) return;
      if(e.key === " " || e.key === "Enter"){ if(document.activeElement && document.activeElement.closest(".opt,button")) return; e.preventDefault(); Run.next(); }
    });
    $("#modal").addEventListener("click", e=>{ if(e.target.id === "modal") closeModal(); });
  }
  return {title, game, line, typing, typed, choices, doom, endCard, wire, closeModal};
})();

/* ==== engine/main.js ==== */
/* boot. If iOS Safari reloads the tab mid-scene (it does this when the page's process is killed, e.g. for memory),
   go straight back to the line the player was on instead of the title screen. */
UI.wire();
(()=>{
  /* only on a reload: arriving from the bookcase, a bookmark or a link always shows the title screen */
  let live = false, reload = false;
  try{ live = sessionStorage.getItem("vil-live") === "1"; }catch(e){}
  try{ const nav = performance.getEntriesByType("navigation")[0]; reload = nav ? nav.type === "reload" : performance.navigation && performance.navigation.type === 1; }catch(e){}
  live = live && reload;
  const auto = store.get("auto", null);
  if(live && okSave(auto) && EP(auto.ep)){ S = auto; Run.resume(); }
  else UI.title();
})();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Villainess Has Read the Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: one column, the 320×200 stage on top and the dialogue box below, like a handheld visual novel.
   A single committed night look: lamplight gold on plum ink; the System speaks in cool cyan pixels. */
:root{
  --ink:#130D18; --panel:#1F1526; --panel2:#2A1D33; --line:#4A3552; --text:#F4EAEF; --dim:#B5A2B6;
  --gold:#E2BC62; --gold2:#F6DD8E; --rose:#E06C8C; --sys:#7FE3FF; --sysbg:#0A1824; --sysline:#2A6E8A;
  --f-disp:'IM Fell English SC','IM Fell English',Georgia,'Times New Roman',serif;
  --f-tale:'IM Fell English',Georgia,'Noto Serif TC','PingFang TC',serif;
  --f-body:'Atkinson Hyperlegible','PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-px:'VT323',ui-monospace,'Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent;}
*{box-sizing:border-box;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
button:focus-visible,.g:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px;}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;width:100%;height:auto;aspect-ratio:320/200;max-width:100%;}
.scr{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(0px, env(safe-area-inset-left, 0px));padding-right:max(0px, env(safe-area-inset-right, 0px));}
.ib{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.ib svg{width:22px;height:22px;fill:currentColor;}
.ib.sm{width:30px;height:30px;} .ib.sm svg{width:18px;height:18px;}
[data-music].on{color:var(--gold2);}
.btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border-radius:6px;
  background:linear-gradient(var(--gold2),var(--gold));color:#2A1A0E;font-weight:700;border:1px solid #8C6A2A;box-shadow:0 2px 0 #6E521F;}
.btn small{font-weight:400;font-size:13px;opacity:.8;}
.btn.alt{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none;}
.btn.sm{min-height:38px;padding:6px 14px;font-size:15px;}
.btn:disabled{opacity:.4;cursor:default;}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;} .row.end{justify-content:flex-end;}
.col{display:flex;flex-direction:column;gap:8px;}
.dim{color:var(--dim);font-size:14px;}

/* ---------- title ---------- */
#title{justify-content:center;overflow-y:auto;}
#title .art{position:relative;}
#title .art::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(transparent,var(--ink));pointer-events:none;}
#title .tt{text-align:center;padding:4px max(16px, env(safe-area-inset-left, 0px)) 20px;margin-top:-28px;position:relative;z-index:1;display:flex;flex-direction:column;gap:14px;align-items:center;}
#title .kick{font-family:var(--f-px);font-size:18px;letter-spacing:.14em;color:var(--sys);margin:0;}
#title h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,8.4vw,42px);line-height:1.02;margin:0;color:var(--gold2);text-wrap:balance;text-shadow:0 2px 0 #3A2340, 0 0 18px rgba(226,188,98,.25);}
#title h1 i{font-family:var(--f-tale);font-style:italic;font-size:.62em;display:block;color:var(--rose);letter-spacing:.02em;}
#tbtns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;}
#tbtns > .btn{width:100%;}
#title .foot{font-size:12px;color:var(--dim);margin:6px 0 0;}

/* ---------- game ---------- */
#game{position:relative;}
.hud{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--ink);}
#epl{flex:1;min-width:0;font-family:var(--f-tale);font-size:15px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#doom{display:flex;align-items:center;gap:6px;font-family:var(--f-px);font-size:19px;color:var(--sys);padding:2px 8px;border:1px solid var(--sysline);border-radius:4px;background:var(--sysbg);min-height:34px;}
#doom .bar{width:64px;height:8px;background:#06121B;border:1px solid var(--sysline);}
#doom i{display:block;height:100%;background:linear-gradient(90deg,#FFB35A,#FF5A6E);transition:width .7s ease-out;}
#doom.cool i{background:linear-gradient(90deg,#7FE3FF,#B8F5A0);}
#doom b{font-weight:400;min-width:3ch;text-align:right;}
#doom.bump-up{animation:dup .6s;} #doom.bump-down{animation:ddn .6s;}
@keyframes dup{30%{box-shadow:0 0 0 3px rgba(255,90,110,.6);transform:scale(1.06);}}
@keyframes ddn{30%{box-shadow:0 0 0 3px rgba(127,227,255,.6);transform:scale(1.06);}}
.stagew{position:relative;background:#0E0A14;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
#cv{cursor:pointer;}
.box{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;padding:14px max(16px, env(safe-area-inset-left, 0px)) 12px;
  background:linear-gradient(var(--panel),var(--ink) 60%);cursor:pointer;overflow-y:auto;box-shadow:inset 0 3px 0 -1px rgba(226,188,98,.35);}
#tag{align-self:flex-start;font-family:var(--f-disp);font-size:18px;line-height:1;color:var(--tc,var(--gold));padding:5px 10px 4px;margin:-2px 0 8px -2px;border:1px solid currentColor;border-radius:3px;background:rgba(0,0,0,.25);}
#txt{font-size:19.5px;line-height:1.55;max-width:62ch;margin:0;}
.box.narr #txt{color:#E9DDE4;}
.box.talk #txt{color:var(--text);}
.box.sys{background:linear-gradient(var(--sysbg),#06101A);}
.box.sys #txt{font-family:var(--f-px);font-size:26px;line-height:1.2;color:var(--sys);text-shadow:0 0 8px rgba(127,227,255,.35);}
.box.sys #tag{font-family:var(--f-px);font-size:20px;letter-spacing:.08em;}
#txt em{font-family:var(--f-tale);font-style:italic;}
#zh{font-size:15px;line-height:1.55;color:#9C8A9F;margin:8px 0 0;max-width:62ch;}
#zh.wait{visibility:hidden;}
.box.sys #zh{color:#5A93AA;}
.ozh{display:block;font-size:14px;line-height:1.45;color:#9C8A9F;margin-top:3px;}
.opt .ozh::before{content:none;}
.lzh{font-size:14px;color:#9C8A9F;margin:2px 0 0;}
.sr .sub{display:block;font-size:13px;}
.vz{padding:10px 0;border-bottom:1px solid var(--line);}
.vz summary{cursor:pointer;} .vz > p{margin:6px 0 8px;}
.vr{display:flex;flex-direction:column;gap:2px;padding:6px 0;}
.vrow{display:flex;gap:6px;align-items:center;}
.vr select{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
.vr .now{font-size:12px;}
.tools{display:flex;align-items:center;gap:4px;padding-top:10px;max-width:62ch;}
.tools .sp{flex:1;}
#more{font-size:14px;color:var(--gold);opacity:0;transition:opacity .2s;}
.box.ready #more{opacity:1;animation:bob 1.1s infinite;}
@keyframes bob{50%{transform:translateY(3px);}}
#ctx{font-size:15px;color:var(--dim);margin:0 0 10px;font-style:italic;}
#choices{display:flex;flex-direction:column;gap:8px;}
.opt{text-align:left;padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-size:17px;line-height:1.4;}
.opt:hover,.opt:focus-visible{border-color:var(--gold);background:#352540;}
.opt::before{content:"❧ ";color:var(--gold);}
.box.choose{cursor:default;}
.g{border-bottom:2px dotted var(--gold);cursor:pointer;}
.g.seen{border-bottom-style:solid;border-bottom-color:rgba(226,188,98,.5);}
.box.sys .g{border-bottom-color:var(--sys);}

/* ---------- popover, toast, windows ---------- */
#pop{position:fixed;z-index:70;left:max(16px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));max-width:420px;margin:0 auto;background:#F4EAEF;color:#24161E;border-radius:8px;padding:12px 44px 12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;}
#pop.on{display:block;}
#pop .pw{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
#pop .w{font-weight:700;font-size:19px;} #pop .k{color:#6E5A6A;font-size:14px;}
#pop .z{color:#9A2E4E;font-size:17px;margin-top:2px;} #pop .d{font-size:14px;color:#4A3A46;margin-top:4px;}
#pop .x{position:absolute;top:4px;right:4px;}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--sysbg);color:var(--sys);border:1px solid var(--sysline);font-family:var(--f-px);font-size:20px;padding:6px 14px;border-radius:4px;z-index:80;opacity:0;transition:opacity .3s;pointer-events:none;max-width:88vw;text-align:center;}
#toast.on{opacity:1;}
#modal{position:fixed;inset:0;z-index:60;background:rgba(8,5,12,.72);display:flex;align-items:center;justify-content:center;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));}
#modal .box{flex:none;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;cursor:default;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:block;box-shadow:0 10px 40px rgba(0,0,0,.6);}
#modal .box.small{max-width:360px;}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.mh h2,.endc h2{font-family:var(--f-disp);font-weight:400;font-size:26px;margin:0;color:var(--gold2);}
.msg{font-size:17px;margin:4px 0 14px;}
.slot{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);}
.slot b{font-family:var(--f-disp);font-weight:400;font-size:18px;color:var(--gold);}
.slot small{color:var(--dim);font-family:var(--f-px);font-size:17px;}
.slot:disabled{opacity:.45;}
.sysw{font-family:var(--f-px);font-size:21px;line-height:1.2;color:var(--sys);background:var(--sysbg);border:1px solid var(--sysline);border-radius:4px;padding:10px 12px;margin:0 0 14px;box-shadow:0 0 16px rgba(127,227,255,.12) inset;}
.sysw p{margin:6px 0;} .sysw .sh{color:#B8F0FF;letter-spacing:.06em;margin-top:6px;}
.sysw .dim{color:#5FA2BC;font-size:19px;}
.dm{display:flex;align-items:center;gap:8px;margin:6px 0;} .dm .bar{flex:1;height:10px;background:#06121B;border:1px solid var(--sysline);}
.dm i{display:block;height:100%;background:linear-gradient(90deg,#FFB35A,#FF5A6E);} .dm.big .bar{height:14px;}
.tl{margin:4px 0;padding-left:20px;} .tl small{color:#5FA2BC;}
.ttl{color:var(--gold2);}
h3{font-family:var(--f-disp);font-weight:400;color:var(--gold);font-size:20px;margin:6px 0;}
.nb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.nb li{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;background:var(--panel2);border-radius:4px;}
.lg{max-height:64vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
.le{position:relative;padding-right:34px;} .le p{margin:2px 0 0;} .le .ib{position:absolute;right:0;top:0;}
.le.sys p{font-family:var(--f-px);font-size:21px;color:var(--sys);line-height:1.2;}
#modal .box.tall{max-width:480px;}
.endc{text-align:center;} .endc .kick{font-family:var(--f-px);color:var(--sys);font-size:20px;letter-spacing:.1em;margin:0;}
.endc h2{margin:0 0 12px;} .endc .sysw{text-align:left;} .endc .col{margin-top:6px;}
.set{display:flex;flex-direction:column;gap:2px;}
.sr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.sr.col2{flex-direction:column;align-items:flex-start;} .sr.col2 p{margin:0;}
.sr input[type=range]{flex:1;min-width:120px;max-width:200px;accent-color:var(--gold);}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.seg button{padding:6px 10px;font-size:14px;background:var(--panel2);} .seg button.on{background:var(--gold);color:#2A1A0E;font-weight:700;}
@media (prefers-reduced-motion: reduce){ .box.ready #more{animation:none;} #doom.bump-up,#doom.bump-down{animation:none;} }
@media (min-height:760px) and (min-width:500px){ #txt{font-size:19.5px;} }
/* phones on their side: the scene on the left, the story on the right, so the text never falls off the screen */
@media (orientation:landscape) and (max-height:560px){
  #game.scr{max-width:none;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);}
  #game .hud{grid-column:1 / -1;}
  #game .stagew{display:flex;align-items:center;border-bottom:0;border-right:1px solid var(--line);}
  #game #cv{width:auto;height:min(calc(100vh - 52px), 36vw);height:min(calc(100dvh - 52px), 36vw);}
  #game .box{height:100%;}
  #txt{font-size:18px;} .box.sys #txt{font-size:22px;}
}
</style>
<style>[hidden]{display:none!important;} :root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);} body{margin:0;}</style>
</head>
<body>

<section id="title" class="scr">
  <div class="art"><canvas id="tcv" width="320" height="200"></canvas></div>
  <div class="tt">
    <p class="kick">INKQUEST · SEASON 1</p>
    <h1>The Villainess<i>has read the book</i></h1>
    <div id="tbtns"></div>
    <p class="foot">© 2026 Wen-Hung Fang. All rights reserved.</p>
  </div>
</section>
<section id="game" class="scr" hidden>
  <div class="hud">
    <button class="ib" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg></button>
    <span id="epl"></span>
    <button id="doom" hidden aria-label="Doom meter"><span>DOOM</span><span class="bar"><i></i></span><b>87%</b></button>
    <button class="ib" data-music aria-label="Music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></button>
  </div>
  <div class="stagew"><canvas id="cv" width="320" height="200" aria-label="Story scene"></canvas></div>
  <div class="box" id="box">
    <span id="tag" hidden></span>
    <p id="ctx" hidden></p>
    <p id="txt"></p>
    <p id="zh" hidden></p>
    <div id="choices" hidden></div>
    <div class="tools"><button class="ib sm" id="rd" data-say="" aria-label="Read this line aloud"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg></button><span class="sp"></span><span id="more">▼</span></div>
  </div>
</section>
<div id="modal" hidden><div class="box"></div></div>
<div id="pop" role="dialog"></div>
<div id="toast" role="status"></div>
<script>
/* ==== story (compiled from content/s1/*.vn) ==== */
const STORY = {"episodes":[{"n":1,"title":"Chapter One, Again","nodes":[{"t":"bg","v":"bedroom"},{"t":"music","v":"manor"},{"t":"line","who":"","text":"Silk.","zh":"絲綢。"},{"t":"line","who":"","text":"That's the first thing I notice. Silk under my cheek, silk over my legs, and a smell like roses and money.","zh":"這是我注意到的第一件事。臉頰下是絲綢，腿上蓋的也是絲綢，空氣裡有玫瑰和金錢的味道。"},{"t":"line","who":"","text":"I open my eyes. Above me hangs a [[canopy]] of pale gold cloth with little [[tassels|tassel]]. My apartment has a ceiling fan with one dead light bulb.","zh":"我睜開眼睛。頭頂垂著淡金色的床帳，綴著小小的流蘇。我的公寓只有一台吊扇，上面還有一顆燒壞的燈泡。"},{"t":"line","who":"","text":"This is not my apartment.","zh":"這不是我的公寓。"},{"t":"sfx","v":"knock"},{"t":"line","who":"","text":"Someone knocks. Three small taps, very careful.","zh":"有人敲門。輕輕的三下，小心翼翼。"},{"t":"show","who":"pip","ex":"nervous"},{"t":"gesture","who":"pip","g":"tremble"},{"t":"line","who":"pip","ex":"nervous","text":"Good morning, my lady. I brought your tea.","zh":"小姐早安。我把您的茶端來了。"},{"t":"line","who":"","text":"A girl in a black-and-white maid's dress stands in the doorway. The cups on her tray [[rattle]].","zh":"一個穿著黑白女僕裝的女孩站在門口。她托盤上的茶杯喀啦喀啦地響。"},{"t":"line","who":"","text":"She isn't scared of the tray. She's scared of me.","zh":"她怕的不是托盤。她怕的是我。"},{"t":"line","who":"","text":"Her name pops into my head: Pip. I've never seen her before in my life, but I know it like my own phone number.","zh":"她的名字突然冒進我腦中：琵普。我這輩子從沒見過她，卻熟得像自己的電話號碼。"},{"t":"choice","opts":[{"text":"\"Thank you, Pip. That smells wonderful.\"","tone":"sweet","fx":[{"k":"pip","d":1}],"to":"pip_sweet","zh":"「謝謝妳，琵普。好香啊。」"},{"text":"\"You're shaking. Sit down and drink it yourself.\"","tone":"bold","fx":[{"k":"pip","d":1}],"to":"pip_bold","zh":"「妳在發抖。坐下來，自己喝吧。」"},{"text":"\"Remind me. What day is it today?\"","tone":"sly","fx":[],"to":"pip_sly","zh":"「提醒我一下，今天是什麼日子？」"}]},{"t":"line","who":"pip","ex":"shocked","text":"Thank you… my lady?","zh":"謝謝……小姐？"},{"t":"line","who":"","text":"She says it like a question. She puts the tray down and steps back, fast.","zh":"她說得像在問問題。她放下托盤，飛快地往後退。"},{"t":"line","who":"pip","ex":"worried","text":"Is my lady feeling well?","zh":"小姐，您身體還好嗎？"},{"t":"goto","to":"mirror"},{"t":"line","who":"pip","ex":"shocked","text":"Sit? On… on your bed, my lady?","zh":"坐？坐……坐在您的床上嗎，小姐？"},{"t":"line","who":"eve","ex":null,"text":"In a chair. Anywhere. You look like you need it more than I do.","zh":"坐椅子上。坐哪都行。妳看起來比我更需要這杯茶。"},{"t":"line","who":"","text":"She sits on the very edge of a chair, like it might bite her. She doesn't touch the tea.","zh":"她只坐在椅子最邊邊，好像椅子會咬人似的。茶，她一口也沒碰。"},{"t":"line","who":"","text":"Still. It's a start.","zh":"不過，總算是個開始。"},{"t":"goto","to":"mirror"},{"t":"line","who":"pip","ex":"nervous","text":"It's the day of the Queen's garden party, my lady. You've talked about it for a month.","zh":"小姐，今天是王后的花園派對。您已經念了一整個月了。"},{"t":"line","who":"eve","ex":null,"text":"Have I?","zh":"是嗎？"},{"t":"line","who":"pip","ex":"deadpan","text":"You said, and I quote, \"I will make that little country mouse cry in front of the whole court.\"","zh":"您的原話是：「我要讓那隻鄉下小老鼠當著全宮廷的面哭出來。」"},{"t":"line","who":"","text":"Oh no.","zh":"糟了。"},{"t":"goto","to":"mirror"},{"t":"hide","who":"pip"},{"t":"line","who":"","text":"Pip hurries out to get my dress for the garden party. I walk to the tall mirror by the window.","zh":"琵普匆匆出去拿我參加花園派對要穿的禮服。我走到窗邊那面高高的鏡子前。"},{"t":"show","who":"eve","ex":"shocked"},{"t":"line","who":"","text":"Pale gold hair in perfect curls. Sharp violet eyes. A face that looks expensive and a little bit mean.","zh":"一頭淡金色的完美捲髮。銳利的紫羅蘭色眼睛。一張看起來很貴、又有點壞心眼的臉。"},{"t":"line","who":"","text":"I know this face. I {{read|red}} about it last night, in bed, at two in the morning.","zh":"我認得這張臉。昨晚凌晨兩點，我躺在床上讀過她。"},{"t":"line","who":"","text":"*The Rose of Ellery*, Chapter One: \"Lady Evangeline Ashcroft was beautiful, and cold as a winter blade.\"","zh":"《艾勒里的玫瑰》第一章：「伊凡潔琳・艾許克羅夫特小姐美麗動人，卻冷得像一把寒冬的刀。」"},{"t":"line","who":"","text":"I'm the [[villainess]]. In Chapter Thirty, they send her to the Frost Isles forever. Her last line in the whole book is, \"No one ever spoke her name again.\"","zh":"我是惡役千金。第三十章，她被永遠流放到霜島。整本書寫到她的最後一句是：「從此再也沒有人提起她的名字。」"},{"t":"gesture","who":"eve","g":"shake"},{"t":"line","who":"eve","ex":"shocked","text":"No. No, no, no.","zh":"不。不不不不。"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"Ding! Hello, Lady Evangeline!","zh":"叮！伊凡潔琳小姐，您好！"},{"t":"line","who":"system","ex":null,"text":"Welcome to the Doom Prevention System, version {{2.3|two point three}} ({{Beta|bay-tuh}}).","zh":"歡迎使用「防止毀滅系統」2.3 版（測試版）。"},{"t":"doom","set":87},{"t":"line","who":"system","ex":null,"text":"Your current [[Doom|doom]]: 87%.","zh":"您目前的毀滅指數：87%。"},{"t":"line","who":"system","ex":null,"text":"Please accept the [[Terms and Conditions|terms]] to continue.","zh":"請同意使用條款以繼續。"},{"t":"choice","opts":[{"text":"\"Accept. Just help me.\"","tone":"bold","fx":[],"to":"sys_bold","zh":"「同意。快幫我就對了。」"},{"text":"\"Can I read the terms first?\"","tone":"sly","fx":[],"to":"sys_sly","zh":"「我可以先看一下條款嗎？」"},{"text":"\"Is this a dream?\"","tone":"sweet","fx":[],"to":"sys_sweet","zh":"「這是夢嗎？」"}]},{"t":"line","who":"system","ex":null,"text":"Great choice! You are a fast reader.","zh":"很棒的選擇！您讀得真快。"},{"t":"goto","to":"rules"},{"t":"line","who":"system","ex":null,"text":"Of course! Terms: 1. Don't get [[exiled|exile]]. 2. See Term 1.","zh":"當然可以！條款：一、不要被流放。二、請見第一條。"},{"t":"line","who":"system","ex":null,"text":"Thank you for reading!","zh":"感謝您的閱讀！"},{"t":"goto","to":"rules"},{"t":"line","who":"system","ex":null,"text":"No! Dreams don't have a customer service team. I do.","zh":"不是喔！夢可沒有客服團隊。我有。"},{"t":"goto","to":"rules"},{"t":"line","who":"system","ex":null,"text":"Here's how it works. Act like the old Evangeline, and your Doom goes up. Surprise the story, and it goes down.","zh":"規則是這樣的：表現得像原本的伊凡潔琳，毀滅指數就會上升；讓故事出乎意料，指數就會下降。"},{"t":"line","who":"system","ex":null,"text":"If your Doom is still high at the Winter Ball…","zh":"如果到了冬季舞會，您的毀滅指數還很高……"},{"t":"line","who":"system","ex":null,"text":"Well! Let's stay positive!","zh":"嗯！我們保持正面思考吧！"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"New [[quest]]: Survive Chapter One.","zh":"新任務：活過第一章。"},{"t":"show","who":"eve","ex":"worried"},{"t":"line","who":"","text":"Chapter One. The garden party. The fountain.","zh":"第一章。花園派對。噴泉。"},{"t":"line","who":"","text":"In the book, Evangeline pushes Lily into the fountain in front of everyone. Lily comes up wet and crying, and Prince Cedric runs to save her. That's where their love story starts. And that's where mine starts to end.","zh":"書裡，伊凡潔琳當著所有人的面把莉莉推進噴泉。莉莉渾身濕透、哭著爬起來，賽德瑞克王子衝過去救她。他們的愛情故事從這裡開始。我的結局，也從這裡開始。"},{"t":"line","who":"eve","ex":"smug","text":"Easy. I just won't push anybody.","zh":"簡單。我不要推任何人就好了。"},{"t":"line","who":"system","ex":null,"text":"That's the spirit!","zh":"就是這種精神！"},{"t":"line","who":"","text":"The System doesn't sound sure.","zh":"系統聽起來不太有把握。"},{"t":"hide","who":"eve"},{"t":"bg","v":"garden"},{"t":"music","v":"waltz"},{"t":"line","who":"","text":"The Queen's garden is a sea of hats. A string quartet plays under the roses, and everyone holds a teacup and a secret.","zh":"王后的花園是一片帽子的海洋。弦樂四重奏在玫瑰下演奏，每個人手裡都端著一杯茶，心裡都藏著一個祕密。"},{"t":"line","who":"","text":"In the middle of it all stands the fountain. White stone, three levels, a stone swan on top. It looks innocent. It is not.","zh":"正中央立著那座噴泉。白色的石頭，三層，頂端一隻石天鵝。它看起來很無辜。它才不是。"},{"t":"line","who":"","text":"People step out of my way. A woman whispers my name, like a warning.","zh":"人們紛紛讓路給我。一位女士低聲念著我的名字，像在發出警告。"},{"t":"show","who":"lily","ex":"smile"},{"t":"gesture","who":"lily","g":"hop"},{"t":"line","who":"","text":"Then a girl in a pink dress walks right up to me. Brown hair, a simple ribbon, a nervous smile.","zh":"接著，一個穿粉紅洋裝的女孩直直走向我。棕色頭髮，一條簡單的緞帶，一抹緊張的微笑。"},{"t":"line","who":"","text":"Lily Bell. The [[heroine]]. By Chapter Three, everyone in this book loves her.","zh":"莉莉・貝爾。女主角。到了第三章，書裡每個人都愛她。"},{"t":"line","who":"lily","ex":"smile","text":"Lady Evangeline! I'm Lily. I just wanted to say hello. Your dress is so beautiful.","zh":"伊凡潔琳小姐！我是莉莉。我只是想來打聲招呼。您的禮服好美。"},{"t":"line","who":"","text":"In the book, Evangeline looks her up and down and says, \"Who let the country mouse in?\"","zh":"書裡，伊凡潔琳上下打量她，說：「誰把這隻鄉下老鼠放進來的？」"},{"t":"show","who":"eve","ex":"neutral"},{"t":"choice","opts":[{"text":"\"Thank you. Yours is lovely too. Pink really suits you.\"","tone":"sweet","fx":[{"k":"lily","d":1},{"k":"doom","d":-2}],"to":"lily_sweet","zh":"「謝謝妳。妳的也很漂亮，粉紅色真的很適合妳。」"},{"text":"\"Lily, listen to me. Stay away from that fountain today.\"","tone":"bold","fx":[{"k":"doom","d":-1}],"to":"lily_bold","zh":"「莉莉，聽我說。今天離那座噴泉遠一點。」"},{"text":"\"Walk with me? The roses on the other side are better.\"","tone":"sly","fx":[{"k":"doom","d":-1}],"to":"lily_sly","zh":"「陪我走走？另一邊的玫瑰更好看。」"}]},{"t":"gesture","who":"lily","g":"hop"},{"t":"line","who":"lily","ex":"smile","text":"Really? I made it myself!","zh":"真的嗎？這是我自己做的！"},{"t":"line","who":"eve","ex":"smile","text":"You made this? Lily, that's amazing.","zh":"這是妳做的？莉莉，太厲害了吧。"},{"t":"line","who":"","text":"She turns pink, the same color as her dress. Somewhere behind us, someone drops a teacup.","zh":"她的臉紅了，跟她的洋裝一樣粉。我們身後不知哪裡，有人摔了一個茶杯。"},{"t":"goto","to":"plot"},{"t":"line","who":"lily","ex":"shocked","text":"The… fountain?","zh":"那……噴泉？"},{"t":"line","who":"eve","ex":null,"text":"Just trust me.","zh":"相信我就對了。"},{"t":"line","who":"","text":"Lily looks at the fountain. Then she looks at me, like I have two heads.","zh":"莉莉看看噴泉，再看看我，好像我多長了一顆頭。"},{"t":"line","who":"lily","ex":"worried","text":"Okay…?","zh":"好……喔？"},{"t":"goto","to":"plot"},{"t":"line","who":"lily","ex":"smile","text":"Oh! I'd love to.","zh":"喔！我很樂意。"},{"t":"line","who":"","text":"I take her arm and walk her away from the fountain, slow and easy, like a sheepdog. Every step feels like a win.","zh":"我挽著她的手臂，帶她慢慢遠離噴泉，像一隻牧羊犬。每走一步都像打了一場勝仗。"},{"t":"goto","to":"plot"},{"t":"hide","who":"eve"},{"t":"line","who":"","text":"For ten whole minutes, nothing happens. Nobody pushes anybody. I start to breathe again.","zh":"整整十分鐘，什麼事都沒發生。沒有人推任何人。我終於又能呼吸了。"},{"t":"line","who":"","text":"But the garden paths curve and turn, and somehow every one of them leads back to the fountain.","zh":"可是花園的小徑彎來繞去，不知怎麼的，每一條都通回那座噴泉。"},{"t":"sfx","v":"crash"},{"t":"shake"},{"t":"line","who":"","text":"Then a little white dog [[shoots]] across the lawn. A lady screams. A waiter spins, and his tray of lemon cakes flies into the air.","zh":"接著，一隻小白狗一溜煙衝過草地。一位女士尖叫。一個侍者轉了一圈，他那盤檸檬蛋糕飛上了天。"},{"t":"line","who":"","text":"Lily steps back to get out of the way. One step. Two.","zh":"莉莉往後退，想讓開。一步。兩步。"},{"t":"line","who":"","text":"Her heel catches a cracked stone. Her arms fly up like wings.","zh":"她的鞋跟卡到一塊裂開的石頭。她的雙臂像翅膀一樣往上一揮。"},{"t":"line","who":"","text":"Behind her, the fountain. Of course it's the fountain.","zh":"她身後，就是噴泉。當然是噴泉。"},{"t":"sfx","v":"splash"},{"t":"hide","who":"lily"},{"t":"line","who":"","text":"SPLASH.","zh":"嘩啦！"},{"t":"music","v":"none"},{"t":"line","who":"","text":"The music stops. Two hundred heads turn.","zh":"音樂停了。兩百顆頭轉了過來。"},{"t":"line","who":"","text":"Not to Lily. To me.","zh":"不是看莉莉。是看我。"},{"t":"show","who":"eve","ex":"shocked"},{"t":"line","who":"","text":"I know that look. In the book, everyone wears it just before everything goes wrong.","zh":"我認得那種眼神。書裡，一切出錯之前，每個人臉上都是這種表情。"},{"t":"choice","opts":[{"text":"Jump in after her.","tone":"sweet","fx":[{"k":"doom","d":-8},{"k":"lily","d":1},{"flag":"fountain","v":"jump"}],"to":"f_jump","zh":"跟著跳下去。"},{"text":"Pull her out, then make the crowd laugh with her, not at her.","tone":"bold","fx":[{"k":"doom","d":-6},{"k":"lily","d":1},{"flag":"fountain","v":"joke"}],"to":"f_joke","zh":"把她拉出來，再讓大家跟她一起笑，而不是笑她。"},{"text":"Point at the cracked stone before anyone can blame you.","tone":"sly","fx":[{"k":"doom","d":-4},{"flag":"fountain","v":"stone"}],"to":"f_stone","zh":"趁還沒人怪到妳頭上，先指著那塊裂開的石頭。"}]},{"t":"sfx","v":"splash"},{"t":"hide","who":"eve"},{"t":"line","who":"","text":"I don't think. I jump.","zh":"我沒多想。我跳了下去。"},{"t":"line","who":"","text":"The water is cold, and it smells like old coins. My shoes fill up. My perfect curls go flat.","zh":"水好冰，有一股舊銅板的味道。我的鞋子灌滿了水。我完美的捲髮全塌了。"},{"t":"line","who":"","text":"I grab Lily under the arms and pull her up. She coughs. A wet rose petal sits on her nose.","zh":"我從腋下抱住莉莉，把她拉起來。她咳了幾聲。一片濕答答的玫瑰花瓣黏在她鼻子上。"},{"t":"show","who":"lily","ex":"teary"},{"t":"line","who":"lily","ex":"teary","text":"You… you jumped in?","zh":"妳……妳跳下來了？"},{"t":"line","who":"eve","ex":null,"text":"You looked like you needed company.","zh":"妳看起來需要有人陪。"},{"t":"line","who":"","text":"Two hundred people stare at two wet girls in a fountain. Nobody knows what to say. This never happened in the book.","zh":"兩百個人盯著噴泉裡兩個濕透的女孩，誰也不知道該說什麼。書裡從來沒有這一段。"},{"t":"sfx","v":"down"},{"t":"line","who":"system","ex":null,"text":"Ding! Unexpected action! Doom down 8%.","zh":"叮！出乎意料的行動！毀滅指數下降 8%。"},{"t":"goto","to":"cliff"},{"t":"hide","who":"eve"},{"t":"line","who":"","text":"I march to the fountain, reach in, and pull her out by both hands. She stands there, dripping, red to the ears.","zh":"我大步走到噴泉邊，伸手抓住她的雙手，把她拉了出來。她站在那裡，全身滴著水，紅到耳根。"},{"t":"line","who":"","text":"Somebody giggles. Then somebody else.","zh":"有人咯咯笑了。接著又有一個人。"},{"t":"line","who":"","text":"So I turn to the crowd and lift my chin.","zh":"於是我轉向人群，抬起下巴。"},{"t":"show","who":"eve","ex":"smug"},{"t":"line","who":"eve","ex":"smug","text":"Wet silk. It's very big this season. You'll all be wearing it by spring.","zh":"濕絲綢，是這一季最流行的。到了春天，你們每個人都會穿。"},{"t":"line","who":"","text":"One second. Two. Then the Queen laughs, a real laugh, and the whole garden laughs with her. With Lily. Not at her.","zh":"一秒。兩秒。接著王后笑了，是真心的笑，整座花園也跟著她一起笑。是跟莉莉一起笑，不是笑她。"},{"t":"show","who":"lily","ex":"teary"},{"t":"line","who":"lily","ex":"teary","text":"Thank you.","zh":"謝謝妳。"},{"t":"sfx","v":"down"},{"t":"line","who":"system","ex":null,"text":"Ding! Bold move! Doom down 6%.","zh":"叮！大膽的一步！毀滅指數下降 6%。"},{"t":"goto","to":"cliff"},{"t":"show","who":"eve","ex":"smug"},{"t":"line","who":"eve","ex":"smug","text":"Careful, everyone! This stone is cracked. Someone could get hurt!","zh":"大家小心！這塊石頭裂開了，會有人受傷的！"},{"t":"line","who":"","text":"I point at the crack. Two hundred heads turn, like birds on a wire.","zh":"我指著那道裂縫。兩百顆頭轉了過去，像電線上的一排鳥。"},{"t":"line","who":"","text":"A servant runs for the gardener. A lady cries, \"Shocking! In the Queen's own garden!\"","zh":"一個僕人跑去找園丁。一位女士驚呼：「太不像話了！竟然是在王后自己的花園裡！」"},{"t":"line","who":"","text":"Nobody looks at me now. Nobody looks at Lily either. She climbs out alone, dripping, and sits on the edge of the fountain.","zh":"現在沒人看我了。也沒人看莉莉。她獨自爬出來，全身滴著水，坐在噴泉邊上。"},{"t":"sfx","v":"down"},{"t":"line","who":"system","ex":null,"text":"Ding! Clever. Doom down 4%.","zh":"叮！聰明。毀滅指數下降 4%。"},{"t":"goto","to":"cliff"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"Chapter One event complete. Story [[pressure]] +3%.","zh":"第一章事件完成。故事壓力 +3%。"},{"t":"doom","d":3},{"t":"line","who":"eve","ex":"worried","text":"Story pressure? What does that—","zh":"故事壓力？那是什麼——"},{"t":"music","v":"tension"},{"t":"hide","who":"lily"},{"t":"hide","who":"eve"},{"t":"line","who":"","text":"Across the lawn, the crowd opens like a curtain.","zh":"草地另一頭，人群像布幕一樣向兩側分開。"},{"t":"show","who":"cedric","ex":"angry"},{"t":"gesture","who":"cedric","g":"enter"},{"t":"line","who":"","text":"A tall young man in a blue coat walks straight toward me. Golden hair, a face from the cover of a romance novel.","zh":"一個穿藍色外套的高個子年輕男人直直朝我走來。金色頭髮，一張從言情小說封面走出來的臉。"},{"t":"line","who":"","text":"Prince Cedric. My [[fiancé]].","zh":"賽德瑞克王子。我的未婚夫。"},{"t":"line","who":"","text":"He looks at the fountain. He looks at wet Lily. Then he looks at me.","zh":"他看看噴泉，看看濕透的莉莉，然後看向我。"},{"t":"line","who":"cedric","ex":"angry","text":"Evangeline!","zh":"伊凡潔琳！"},{"t":"gesture","who":"cedric","g":"shake"},{"t":"line","who":"cedric","ex":"angry","text":"What have you *done*?","zh":"妳做了什麼好事？"},{"t":"title","flag":"fountain","val":"jump","name":"Soggy Savior"},{"t":"title","flag":"fountain","val":"joke","name":"Trendsetter (Wet)"},{"t":"title","flag":"fountain","val":"stone","name":"Stone Inspector"},{"t":"end"}],"labels":{"pip_sweet":15,"pip_bold":19,"pip_sly":24,"mirror":29,"sys_bold":45,"sys_sly":47,"sys_sweet":50,"rules":52,"party":63,"lily_sweet":77,"lily_bold":82,"lily_sly":87,"plot":90,"f_jump":108,"f_joke":120,"f_stone":132,"cliff":140}},{"n":2,"title":"Not My Type","nodes":[{"t":"bg","v":"garden"},{"t":"music","v":"tension"},{"t":"show","who":"cedric","ex":"angry"},{"t":"line","who":"","text":"Up close, Prince Cedric is even more handsome than on the cover. Golden hair. Blue eyes. A [[jaw]] you could cut bread with.","zh":"近看，賽德瑞克王子比封面上還要帥。金色頭髮，藍色眼睛，下巴線條銳利得可以切麵包。"},{"t":"line","who":"","text":"He is also shouting at me.","zh":"他也正在對我大吼。"},{"t":"if","k":"fountain","op":"=","v":"jump","to":"scold_jump"},{"t":"if","k":"fountain","op":"=","v":"joke","to":"scold_joke"},{"t":"goto","to":"scold_stone"},{"t":"line","who":"cedric","ex":"angry","text":"You pushed her in, and then you jumped in after her? What is this, a new game?","zh":"妳把她推下去，然後自己也跳下去？這是什麼新遊戲嗎？"},{"t":"line","who":"","text":"I'm still dripping. There is a rose petal stuck to my shoe. It's hard to look dangerous with a rose petal on your shoe.","zh":"我還在滴水。鞋子上黏著一片玫瑰花瓣。鞋子上黏著花瓣，很難看起來有威脅性。"},{"t":"goto","to":"scold"},{"t":"line","who":"cedric","ex":"angry","text":"You pushed her in, and then you made a joke of it! The whole court is laughing at Miss Bell!","zh":"妳把她推下去，然後還拿這件事開玩笑！整個宮廷都在笑貝爾小姐！"},{"t":"line","who":"","text":"They were laughing *with* her. But he wasn't here for that part.","zh":"他們是*跟*她一起笑。可是那一段他沒看到。"},{"t":"goto","to":"scold"},{"t":"line","who":"cedric","ex":"angry","text":"You pushed her in, and now you blame the stones? Really, Evangeline? The *stones*?","zh":"妳把她推下去，現在還怪石頭？真的嗎，伊凡潔琳？怪*石頭*？"},{"t":"line","who":"","text":"When he says it like that, it does sound a little silly.","zh":"被他這樣一說，聽起來確實有點蠢。"},{"t":"goto","to":"scold"},{"t":"if","k":"lily","op":">=","v":1,"to":"lily_speaks"},{"t":"goto","to":"peacock"},{"t":"show","who":"lily","ex":"worried"},{"t":"line","who":"lily","ex":"worried","text":"Your Highness, she didn't push me! I slipped!","zh":"殿下，她沒有推我！是我自己滑倒的！"},{"t":"line","who":"cedric","ex":"neutral","text":"You're too kind, Miss Bell. That's your only fault.","zh":"貝爾小姐，妳太善良了。這是妳唯一的缺點。"},{"t":"line","who":"","text":"He doesn't even look at her. Lily's mouth falls open.","zh":"他連看都沒看她一眼。莉莉張大了嘴。"},{"t":"hide","who":"lily"},{"t":"goto","to":"peacock"},{"t":"line","who":"cedric","ex":"angry","text":"You are cruel, you are jealous, and you are a shame to the name Ashcroft.","zh":"妳殘忍、妳善妒，妳是艾許克羅夫特家的恥辱。"},{"t":"line","who":"","text":"Then he stops. He turns his head a little to the left.","zh":"接著他停了下來，頭微微轉向左邊。"},{"t":"gesture","who":"cedric","g":"nod"},{"t":"line","who":"","text":"He is looking at the fountain. At his own face in the water. He fixes one golden curl, slowly, with one finger.","zh":"他在看噴泉。看水裡自己的臉。他用一根手指，慢慢地撥好一撮金色捲髮。"},{"t":"line","who":"cedric","ex":"smug","text":"…and a shame to this whole kingdom.","zh":"……也是整個王國的恥辱。"},{"t":"line","who":"","text":"Oh.","zh":"喔。"},{"t":"line","who":"","text":"In the book, Prince Cedric is a dream. In real life, he's a [[peacock]].","zh":"書裡的賽德瑞克王子是個夢中情人。現實中，他是一隻孔雀。"},{"t":"show","who":"eve","ex":"neutral"},{"t":"choice","opts":[{"text":"\"Your Highness, I didn't push her. Ask anyone who was here.\"","tone":"sweet","fx":[{"k":"doom","d":-2},{"flag":"cedric_ans","v":"sweet"}],"to":"ans_sweet","zh":"「殿下，我沒有推她。您可以問問在場的任何人。」"},{"text":"\"Are you scolding me, or admiring yourself? You're a peacock, Cedric.\"","tone":"bold","fx":[{"k":"doom","d":-3},{"k":"cedric","d":1},{"flag":"cedric_ans","v":"bold"}],"to":"ans_bold","zh":"「您是在罵我，還是在欣賞自己？賽德瑞克，您根本是一隻孔雀。」"},{"text":"\"You're right, Your Highness. Shall we talk about this in private?\"","tone":"sly","fx":[{"k":"doom","d":-2},{"flag":"cedric_ans","v":"sly"}],"to":"ans_sly","zh":"「殿下說得對。我們要不要私下談這件事？」"}]},{"t":"line","who":"cedric","ex":"shocked","text":"Ask… anyone?","zh":"問……任何人？"},{"t":"line","who":"","text":"He looks around. Nobody says, \"She pushed her.\" A few people look at their shoes.","zh":"他環顧四周。沒有人說「是她推的」。有幾個人低頭看自己的鞋子。"},{"t":"line","who":"cedric","ex":"angry","text":"That proves nothing. You are very good at hiding things.","zh":"這證明不了什麼。妳很擅長隱藏。"},{"t":"goto","to":"tears"},{"t":"line","who":"","text":"Two hundred people stop breathing.","zh":"兩百個人同時屏住了呼吸。"},{"t":"line","who":"cedric","ex":"shocked","text":"A… a what?","zh":"一……一隻什麼？"},{"t":"line","who":"eve","ex":"smug","text":"A peacock. Big, shiny, and very loud.","zh":"孔雀。又大、又閃亮，叫聲還很吵。"},{"t":"line","who":"","text":"His mouth opens and closes. Nobody has ever talked to him like that in his whole life. I can see it on his face. He has no idea what to do with it.","zh":"他的嘴巴張開又闔上。他這輩子從來沒有人這樣跟他說話。我從他臉上就看得出來，他完全不知道該怎麼辦。"},{"t":"goto","to":"tears"},{"t":"line","who":"cedric","ex":"shocked","text":"In… private?","zh":"私……私下？"},{"t":"line","who":"eve","ex":"smile","text":"Of course. A prince shouldn't shout in the Queen's garden. People will talk.","zh":"當然。王子不該在王后的花園裡大吼大叫。大家會說閒話的。"},{"t":"line","who":"","text":"He glances at the crowd. The crowd glances back. His ears turn pink.","zh":"他瞄了人群一眼，人群也瞄回來。他的耳朵紅了。"},{"t":"goto","to":"tears"},{"t":"line","who":"","text":"Then something strange happens.","zh":"然後，奇怪的事發生了。"},{"t":"line","who":"","text":"My eyes start to [[sting]]. My nose tickles. My vision goes soft and wet.","zh":"我的眼睛開始刺痛，鼻子發癢，視線變得又模糊又濕。"},{"t":"show","who":"eve","ex":"teary"},{"t":"line","who":"","text":"No. No, no, no. I know this scene. In Chapter Two, Evangeline bursts into tears and runs away, and the whole court laughs at her.","zh":"不。不不不不。我知道這一幕。第二章，伊凡潔琳突然大哭著跑走，整個宮廷都在笑她。"},{"t":"line","who":"","text":"But I'm not sad! I'm not even a little bit sad!","zh":"可是我不難過！我一點點都不難過！"},{"t":"line","who":"","text":"A fat tear rolls down my cheek anyway.","zh":"一顆大大的眼淚還是從我臉頰滾了下來。"},{"t":"line","who":"cedric","ex":"smug","text":"Ah. Tears. Now you're sorry.","zh":"啊，眼淚。現在知道後悔了。"},{"t":"choice","opts":[{"text":"\"These aren't for you. The roses make my eyes water.\"","tone":"sweet","fx":[{"k":"doom","d":-1}],"to":"cry_sweet","zh":"「這不是為了您。是玫瑰花讓我流眼淚。」"},{"text":"Laugh through the tears. It's honestly a little funny.","tone":"bold","fx":[{"k":"doom","d":-3}],"to":"cry_bold","zh":"邊哭邊笑。說真的，這有點好笑。"},{"text":"Let one more tear fall, right where the whole crowd can see.","tone":"sly","fx":[{"k":"doom","d":-2},{"k":"cedric","d":-1}],"to":"cry_sly","zh":"讓另一滴眼淚落下，就落在所有人都看得到的地方。"}]},{"t":"line","who":"cedric","ex":"shocked","text":"The… roses?","zh":"玫……玫瑰？"},{"t":"line","who":"eve","ex":"teary","text":"Very strong roses. Your mother grows them well.","zh":"非常濃的玫瑰。王后種得真好。"},{"t":"line","who":"","text":"Somewhere in the crowd, a countess sneezes. Thank you, countess.","zh":"人群中某處，一位伯爵夫人打了個噴嚏。謝謝妳，伯爵夫人。"},{"t":"goto","to":"cedric_leaves"},{"t":"line","who":"","text":"I start to laugh. I can't stop. I'm crying and laughing at the same time, like a broken fountain.","zh":"我開始笑，停也停不下來。我同時在哭又在笑，像一座壞掉的噴泉。"},{"t":"line","who":"cedric","ex":"nervous","text":"Why are you laughing? Stop laughing!","zh":"妳笑什麼？不准笑！"},{"t":"line","who":"eve","ex":"smile","text":"I'm sorry! It's just… your hair. It's perfect. Really. Even now.","zh":"抱歉！只是……您的頭髮。好完美。真的。即使是現在。"},{"t":"goto","to":"cedric_leaves"},{"t":"line","who":"","text":"I don't wipe it away. I let it shine. I look down, small and sad, a lonely lady in front of a shouting prince.","zh":"我沒有擦掉眼淚，就讓它閃閃發亮。我低下頭，看起來又小又可憐：一位孤零零的淑女，站在一個大吼大叫的王子面前。"},{"t":"line","who":"","text":"A woman whispers, \"Poor thing.\" Then another: \"How can he shout at a crying girl?\"","zh":"一位女士低聲說：「好可憐。」接著又有人說：「他怎麼能對著一個在哭的女孩大吼？」"},{"t":"line","who":"cedric","ex":"nervous","text":"I… I wasn't… That's not…","zh":"我……我沒有……那不是……"},{"t":"goto","to":"cedric_leaves"},{"t":"line","who":"cedric","ex":"angry","text":"This isn't over, Evangeline.","zh":"這件事還沒完，伊凡潔琳。"},{"t":"gesture","who":"cedric","g":"shake"},{"t":"hide","who":"cedric"},{"t":"line","who":"","text":"He spins around and marches away. His coat flaps like a flag. Half the crowd follows him, whispering.","zh":"他轉身大步走開，外套像旗子一樣飄動。一半的人群跟著他走，邊走邊竊竊私語。"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"Ding! Chapter Two event complete: The Prince's [[Scolding|scold]].","zh":"叮！第二章事件完成：王子的斥責。"},{"t":"line","who":"eve","ex":"worried","text":"But I didn't cry because of him! The story made me cry!","zh":"可是我不是因為他才哭的！是故事讓我哭的！"},{"t":"line","who":"system","ex":null,"text":"The story doesn't care why. Here's an important rule!","zh":"故事才不管原因。這裡有一條重要規則！"},{"t":"line","who":"system","ex":null,"text":"[[Canon|canon]] events cannot be deleted. They can only be edited.","zh":"原著事件無法刪除，只能修改。"},{"t":"music","v":"scheme"},{"t":"line","who":"system","ex":null,"text":"In the book, Evangeline cried and ran. You cried and stayed. That's an edit!","zh":"書裡，伊凡潔琳哭著跑走。妳哭了，但留了下來。這就是修改！"},{"t":"doom","d":3},{"t":"line","who":"system","ex":null,"text":"Story pressure +3%. Don't worry. You're doing great!","zh":"故事壓力 +3%。別擔心，妳做得很好！"},{"t":"line","who":"eve","ex":null,"text":"So every big scene in the book will still happen. I just get to choose how.","zh":"所以書裡每一場重要的戲都還是會發生，我只是可以選擇它怎麼發生。"},{"t":"line","who":"system","ex":null,"text":"Exactly! Now, a new [[quest]]!","zh":"完全正確！現在，新任務來了！"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"Main quest: End the [[engagement]] before the Winter Ball. Without a [[scandal]].","zh":"主線任務：在冬季舞會前解除婚約。不能鬧出醜聞。"},{"t":"line","who":"eve","ex":"worried","text":"Why no scandal?","zh":"為什麼不能有醜聞？"},{"t":"line","who":"system","ex":null,"text":"Scandals feed the story. And the story is very, very hungry.","zh":"醜聞是故事的食物。而故事非常、非常餓。"},{"t":"hide","who":"eve"},{"t":"line","who":"","text":"I sit on the edge of the fountain. My face is still wet, so I wipe it with my glove.","zh":"我坐在噴泉邊上。臉還是濕的，我用手套擦了擦。"},{"t":"line","who":"","text":"The glove catches my pearl earring and pulls it loose. Tink. It rolls along the white stone.","zh":"手套勾到我的珍珠耳環，把它扯了下來。叮。耳環沿著白色石頭滾動。"},{"t":"sfx","v":"caw"},{"t":"show","who":"duchess","ex":"neutral"},{"t":"line","who":"","text":"Before I can grab it, a black shape lands on the stone swan. A raven, big and shiny, with a little gold ring on one leg.","zh":"我還來不及抓，一個黑影就落在石天鵝上。是一隻烏鴉，又大又亮，一隻腳上戴著小小的金環。"},{"t":"line","who":"","text":"She looks at the pearl. She looks at me. She looks at the pearl again.","zh":"她看看珍珠，看看我，又看看珍珠。"},{"t":"line","who":"eve","ex":null,"text":"Don't you dare.","zh":"想都別想。"},{"t":"sfx","v":"flap"},{"t":"gesture","who":"duchess","g":"fly"},{"t":"hide","who":"duchess"},{"t":"line","who":"","text":"She dares. She [[snatches|snatch]] the earring and flies straight up into the sky.","zh":"她偏要。她一口叼走耳環，直直飛上天空。"},{"t":"choice","opts":[{"text":"Chase her!","tone":"bold","fx":[{"flag":"raven","v":"chase"}],"to":"chase","zh":"追上去！"},{"text":"Let her go. It's only an earring.","tone":"sweet","fx":[{"flag":"raven","v":"let"}],"to":"let_go","zh":"讓她走吧。不過是一隻耳環。"}]},{"t":"music","v":"scheme"},{"t":"line","who":"","text":"I pick up my skirt and run. Through the roses. Past a very surprised gardener. Around a hedge shaped like a swan.","zh":"我拉起裙子就跑。穿過玫瑰叢，經過一個嚇了一大跳的園丁，繞過一棵修剪成天鵝形狀的樹籬。"},{"t":"line","who":"","text":"The raven flies to the far corner of the garden, to an old stone tower covered in [[ivy]]. She disappears through a high window.","zh":"烏鴉飛到花園最遠的角落，飛向一座爬滿常春藤的舊石塔，從高處的窗戶消失了。"},{"t":"bg","v":"tower"},{"t":"music","v":"none"},{"t":"line","who":"","text":"The door isn't locked. Inside, stone stairs go up and up. At the top hangs a huge bronze bell, green with age.","zh":"門沒有鎖。裡面，石階一直往上延伸。頂端掛著一口巨大的青銅鐘，因為年代久遠而發綠。"},{"t":"line","who":"","text":"And on a wooden beam, high above my head, there is a nest.","zh":"在我頭頂高處的一根木樑上，有一個鳥巢。"},{"t":"line","who":"","text":"It shines. Silver spoons. Gold buttons. A small key. A ring. And on top of it all, my pearl.","zh":"它閃閃發亮。銀湯匙、金鈕扣、一把小鑰匙、一枚戒指。而在這一切的最上面，是我的珍珠。"},{"t":"show","who":"duchess","ex":"neutral"},{"t":"line","who":"","text":"The raven sits beside her treasure and looks down at me, very pleased with herself.","zh":"烏鴉坐在她的寶藏旁邊，低頭看著我，對自己非常滿意。"},{"t":"line","who":"eve","ex":null,"text":"You little thief. You have a whole collection up there.","zh":"妳這個小偷。妳在上面有一整套收藏呢。"},{"t":"sfx","v":"bell"},{"t":"shake"},{"t":"line","who":"","text":"Far below, someone pulls the rope for the evening bell. BONG. The whole tower shakes. I nearly fall down the stairs.","zh":"下方遠處，有人拉響了晚鐘的繩子。噹——！整座塔都在震動。我差點從樓梯上摔下去。"},{"t":"line","who":"","text":"I can't reach the nest today. But now I know where it is.","zh":"今天我搆不到那個鳥巢。但現在我知道它在哪裡了。"},{"t":"hide","who":"duchess"},{"t":"goto","to":"home"},{"t":"line","who":"","text":"I watch her fly away over the roses, a black dot with a white pearl.","zh":"我看著她飛過玫瑰花叢，一個黑點叼著一顆白珍珠。"},{"t":"line","who":"","text":"I have bigger problems than an earring. I have a prince, a System and a whole book against me.","zh":"我有比耳環更大的問題。我有一個王子、一個系統，還有一整本書在跟我作對。"},{"t":"goto","to":"home"},{"t":"bg","v":"bedroom"},{"t":"music","v":"manor"},{"t":"line","who":"","text":"That evening, I sit by the window in my room. The sky turns orange, then purple.","zh":"那天傍晚，我坐在房間的窗邊。天空變成橘色，然後是紫色。"},{"t":"sfx","v":"knock"},{"t":"show","who":"pip","ex":"neutral"},{"t":"if","k":"pip","op":">=","v":1,"to":"pip_warm"},{"t":"line","who":"pip","ex":"deadpan","text":"My lady. This came for you.","zh":"小姐，有您的信。"},{"t":"line","who":"","text":"She holds out a card at arm's length, like it might explode.","zh":"她把一張卡片伸得遠遠的遞過來，好像它會爆炸似的。"},{"t":"goto","to":"card"},{"t":"line","who":"pip","ex":"smile","text":"My lady, I heard about the garden. Everyone in the kitchen is talking about it.","zh":"小姐，我聽說花園的事了。廚房裡每個人都在討論。"},{"t":"line","who":"pip","ex":"neutral","text":"Cook says you were very brave. Or very strange. She can't decide.","zh":"廚娘說您非常勇敢。或者非常奇怪。她還沒決定。"},{"t":"if","k":"raven","op":"=","v":"chase","to":"pip_raven"},{"t":"goto","to":"pip_card"},{"t":"line","who":"pip","ex":"deadpan","text":"And a gardener says you chased the prince's raven through the roses.","zh":"還有一個園丁說，您追著王子的烏鴉穿過了玫瑰花叢。"},{"t":"line","who":"eve","ex":null,"text":"The prince's raven?","zh":"王子的烏鴉？"},{"t":"line","who":"pip","ex":"deadpan","text":"Duchess. She steals anything shiny. Last spring she took the Archbishop's spoon during dinner.","zh":"她叫公爵夫人，什麼亮晶晶的東西都偷。去年春天，她在晚宴上叼走了大主教的湯匙。"},{"t":"goto","to":"pip_card"},{"t":"line","who":"pip","ex":"neutral","text":"Oh, and this came for you.","zh":"喔，還有這封給您的信。"},{"t":"goto","to":"card"},{"t":"line","who":"","text":"It's an [[invitation]], with a gold border and a drawing of a cake.","zh":"這是一張邀請函，有金色的邊框，上面畫著一個蛋糕。"},{"t":"line","who":"","text":"*The Spring Fair Baking Contest. Lady Evangeline Ashcroft is warmly invited to compete.*","zh":"*春季市集烘焙比賽。誠摯邀請伊凡潔琳・艾許克羅夫特小姐參賽。*"},{"t":"line","who":"","text":"My stomach drops. Chapter Three. Evangeline's cake makes Lily sick in front of the judges, and everyone thinks she did it on purpose.","zh":"我的心一沉。第三章。伊凡潔琳的蛋糕讓莉莉在評審面前吃壞了肚子，大家都認為她是故意的。"},{"t":"line","who":"","text":"Also, small problem: I can't boil an egg.","zh":"另外，還有個小問題：我連蛋都不會煮。"},{"t":"show","who":"eve","ex":"worried"},{"t":"choice","opts":[{"text":"\"Please tell them thank you, but I can't come this year.\"","tone":"sweet","fx":[],"to":"no_sweet","zh":"「請跟他們說謝謝，但我今年沒辦法參加。」"},{"text":"\"Absolutely not. Throw it in the fire.\"","tone":"bold","fx":[],"to":"no_bold","zh":"「絕對不要。把它丟進火裡。」"},{"text":"\"Tell them I'm sick. Very sick. [[Contagious|contagious]], even.\"","tone":"sly","fx":[],"to":"no_sly","zh":"「跟他們說我病了。病得很重，甚至會傳染。」"}]},{"t":"line","who":"pip","ex":"nervous","text":"I'm afraid it's too late for that, my lady.","zh":"小姐，恐怕已經來不及了。"},{"t":"goto","to":"signed"},{"t":"line","who":"pip","ex":"nervous","text":"I could, my lady. But it won't help.","zh":"小姐，我可以這麼做。但那沒有用。"},{"t":"goto","to":"signed"},{"t":"line","who":"pip","ex":"deadpan","text":"You'd have to be sick for a week, my lady. And it won't help.","zh":"小姐，那您得病上一個禮拜。而且那也沒有用。"},{"t":"goto","to":"signed"},{"t":"hide","who":"eve"},{"t":"line","who":"pip","ex":"deadpan","text":"You signed up a month ago, my lady. They sent back a copy of your entry form.","zh":"小姐，您一個月前就報名了。他們把您的報名表影本寄回來了。"},{"t":"line","who":"","text":"She takes a second paper out from behind the card. There it is, in big, proud, curly letters: *Evangeline Ashcroft. Lemon cake.*","zh":"她從卡片後面抽出第二張紙。就在那裡，用又大又驕傲的花體字寫著：*伊凡潔琳・艾許克羅夫特。檸檬蛋糕。*"},{"t":"line","who":"","text":"And under it, in the same hand: *A special piece for Miss Lily Bell.*","zh":"下面還有同一個筆跡：*特別為莉莉・貝爾小姐準備一塊。*"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"Ding! Upcoming canon event detected: The Cake Incident.","zh":"叮！偵測到即將發生的原著事件：蛋糕事件。"},{"t":"line","who":"system","ex":null,"text":"Good luck! You'll need a lot of it!","zh":"祝妳好運！妳會需要很多好運的！"},{"t":"title","flag":"cedric_ans","val":"bold","name":"Peacock Spotter"},{"t":"title","flag":"cedric_ans","val":"sweet","name":"Calm Under Fire"},{"t":"title","flag":"cedric_ans","val":"sly","name":"Damage Control"},{"t":"end"}],"labels":{"scold_jump":8,"scold_joke":11,"scold_stone":14,"scold":17,"lily_speaks":19,"peacock":25,"ans_sweet":34,"ans_bold":38,"ans_sly":43,"tears":47,"cry_sweet":55,"cry_bold":59,"cry_sly":63,"cedric_leaves":67,"raven":86,"chase":99,"let_go":116,"home":119,"pip_warm":128,"pip_raven":132,"pip_card":136,"card":138,"no_sweet":144,"no_bold":146,"no_sly":148,"signed":150}},{"n":3,"title":"The Cake Incident","nodes":[{"t":"bg","v":"kitchen"},{"t":"music","v":"manor"},{"t":"line","who":"","text":"There is flour in my hair. There is flour on the cat. I don't know whose cat it is.","zh":"我的頭髮上有麵粉。貓身上也有麵粉。我不知道那是誰的貓。"},{"t":"line","who":"","text":"It's midnight in the kitchen of Ashcroft Hall, and I have broken six eggs. Two of them went in the bowl.","zh":"現在是半夜，艾許克羅夫特府的廚房。我已經打破了六顆蛋，其中兩顆進了碗裡。"},{"t":"line","who":"","text":"The Spring Fair is tomorrow. The rules are simple: bake your cake at home, then finish it in the judges' tent.","zh":"春季市集就在明天。規則很簡單：在家把蛋糕烤好，然後到評審帳篷裡完成它。"},{"t":"line","who":"","text":"I tried to make a chocolate cake. The cookbook fell open to *Lemon Cake*. I tried a carrot cake. *Lemon Cake*. I closed the book and opened it again. *LEMON CAKE*.","zh":"我想做巧克力蛋糕，食譜卻自己翻到*檸檬蛋糕*。我想做紅蘿蔔蛋糕。*檸檬蛋糕*。我把書闔上再打開。*檸檬蛋糕*。"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"Ding! Canon recipe [[locked|lock]]. Have fun!","zh":"叮！原著食譜已鎖定。祝妳玩得開心！"},{"t":"show","who":"eve","ex":"deadpan"},{"t":"line","who":"eve","ex":"deadpan","text":"Thank you. So helpful.","zh":"謝謝。真是幫了大忙。"},{"t":"sfx","v":"knock"},{"t":"show","who":"pip","ex":"neutral"},{"t":"line","who":"pip","ex":"deadpan","text":"My lady. It's midnight. Why is the cat white?","zh":"小姐，現在是半夜。為什麼貓是白色的？"},{"t":"line","who":"","text":"She looks at the bowl. Then she looks up at the egg on the ceiling.","zh":"她看看碗，然後抬頭看天花板上的那顆蛋。"},{"t":"choice","opts":[{"text":"\"Pip, I need help. Will you teach me? Please?\"","tone":"sweet","fx":[{"k":"doom","d":-2},{"k":"pip","d":1},{"flag":"kitchen","v":"pip"}],"to":"k_pip","zh":"「琵普，我需要幫忙。妳可以教我嗎？拜託？」"},{"text":"\"Go to bed, Pip. I can do this myself.\"","tone":"bold","fx":[{"k":"doom","d":-1},{"flag":"kitchen","v":"alone"}],"to":"k_alone","zh":"「去睡吧，琵普。我自己來就行。」"},{"text":"\"Help me, and you can have next Sunday off.\"","tone":"sly","fx":[{"k":"doom","d":-1},{"flag":"kitchen","v":"deal"}],"to":"k_deal","zh":"「幫我的話，下個星期天就放妳一天假。」"}]},{"t":"if","k":"pip","op":">=","v":2,"to":"k_pip_warm"},{"t":"line","who":"pip","ex":"shocked","text":"Teach… you? My lady wants to learn something from *me*?","zh":"教……您？小姐想跟*我*學東西？"},{"t":"goto","to":"k_pip_go"},{"t":"line","who":"pip","ex":"smile","text":"I was hoping you'd ask, my lady. I've been listening at the door for an hour.","zh":"我一直在等您開口呢，小姐。我已經在門外聽了一個小時了。"},{"t":"line","who":"","text":"Pip rolls up her sleeves. She cracks an egg with one hand. One hand!","zh":"琵普捲起袖子，用一隻手打了一顆蛋。一隻手耶！"},{"t":"line","who":"pip","ex":"neutral","text":"Butter and sugar first, my lady. Beat them until they're pale. Then the eggs, one at a time.","zh":"先放奶油和糖，小姐。打到顏色變淡。然後放蛋，一次一顆。"},{"t":"line","who":"","text":"By two in the morning, a golden cake sits on the table. It smells like summer.","zh":"到了凌晨兩點，一個金黃色的蛋糕放在桌上，聞起來像夏天。"},{"t":"line","who":"eve","ex":"smile","text":"Pip, you're a genius.","zh":"琵普，妳是天才。"},{"t":"line","who":"pip","ex":"deadpan","text":"I know, my lady. Please don't tell Cook.","zh":"我知道，小姐。請別告訴廚娘。"},{"t":"goto","to":"fair"},{"t":"line","who":"pip","ex":"deadpan","text":"As you wish, my lady.","zh":"如您所願，小姐。"},{"t":"hide","who":"pip"},{"t":"line","who":"","text":"The door clicks shut. Now it's just me, a bowl and a very large book.","zh":"門喀一聲關上了。現在只剩我、一個碗，和一本非常大的書。"},{"t":"line","who":"","text":"I mix everything. I bake it. It comes out of the oven tall on one side and flat on the other, like a hat in the wind.","zh":"我把所有東西攪在一起，拿去烤。出爐的時候，它一邊高、一邊扁，像一頂被風吹歪的帽子。"},{"t":"line","who":"eve","ex":"smile","text":"It isn't pretty. But it's mine.","zh":"它不漂亮。但它是我做的。"},{"t":"line","who":"","text":"In the morning, Pip comes into the kitchen. She doesn't say a word. She just takes the egg off the ceiling.","zh":"早上，琵普走進廚房。她一句話也沒說，只是把天花板上的蛋拿了下來。"},{"t":"goto","to":"fair"},{"t":"line","who":"pip","ex":"deadpan","text":"Next Sunday. And the Sunday after.","zh":"下個星期天。還有再下一個星期天。"},{"t":"line","who":"eve","ex":null,"text":"Deal.","zh":"成交。"},{"t":"line","who":"","text":"Pip rolls up her sleeves and cracks an egg with one hand. She doesn't smile once. But by two in the morning, a golden cake sits on the table.","zh":"琵普捲起袖子，用一隻手打了一顆蛋。她一次都沒笑。但到了凌晨兩點，一個金黃色的蛋糕放在桌上。"},{"t":"line","who":"pip","ex":"neutral","text":"That's a cake, my lady. Not a friendship.","zh":"小姐，這是蛋糕，不是友情。"},{"t":"goto","to":"fair"},{"t":"hide","who":"eve"},{"t":"hide","who":"pip"},{"t":"bg","v":"tent"},{"t":"music","v":"fair"},{"t":"line","who":"","text":"The judges' tent is a sea of cakes. Strawberry towers. Chocolate castles. A cake shaped like a swan, which I don't like at all.","zh":"評審帳篷裡是一片蛋糕的海洋。草莓高塔、巧克力城堡，還有一個天鵝造型的蛋糕，我一點都不喜歡。"},{"t":"line","who":"","text":"Pip carries my cake box to my table and stands behind me.","zh":"琵普把我的蛋糕盒搬到我的桌上，站在我身後。"},{"t":"sfx","v":"handbell"},{"t":"line","who":"","text":"At the front, a big woman in a white [[apron]] rings a little bell. Madame Crumb, the Queen's own [[pastry]] chef. She has flour in her eyebrows and no smile at all.","zh":"前方，一位穿白色圍裙的高大女士搖響小鈴鐺。她是克蘭姆夫人，王后專屬的甜點主廚。她的眉毛上沾著麵粉，臉上一點笑容也沒有。"},{"t":"line","who":"crumb","ex":null,"text":"Bakers! You have ten minutes to [[glaze]] your cakes. Use only the Queen's sugar. Begin!","zh":"各位烘焙師！你們有十分鐘為蛋糕淋上糖霜。只能用王后的糖。開始！"},{"t":"show","who":"cedric","ex":"smug"},{"t":"line","who":"","text":"Next to her sits the second judge. Golden hair. A silver spoon, which he is using as a mirror.","zh":"她旁邊坐著第二位評審。金色頭髮，手上拿著一支銀湯匙，正拿它當鏡子照。"},{"t":"line","who":"","text":"Prince Cedric. Of course.","zh":"賽德瑞克王子。當然是他。"},{"t":"if","k":"cedric_ans","op":"=","v":"bold","to":"ced_peacock"},{"t":"goto","to":"next_table"},{"t":"line","who":"","text":"He sees me, touches his hair, and looks away fast. Peacocks remember.","zh":"他看到我，摸了摸頭髮，然後很快把視線移開。孔雀是會記仇的。"},{"t":"hide","who":"cedric"},{"t":"show","who":"lily","ex":"smile"},{"t":"line","who":"","text":"At the next table, Lily drips honey over a plate of little buns. They look like tiny suns.","zh":"隔壁桌，莉莉正把蜂蜜淋在一盤小麵包上。它們看起來像一顆顆小太陽。"},{"t":"if","k":"lily","op":">=","v":1,"to":"lily_wave"},{"t":"line","who":"lily","ex":"neutral","text":"Good luck, Lady Evangeline.","zh":"祝您好運，伊凡潔琳小姐。"},{"t":"line","who":"","text":"She says it politely, the way you talk to a cat that scratched you once.","zh":"她說得很有禮貌，就像在跟一隻曾經抓過你的貓說話。"},{"t":"goto","to":"glaze"},{"t":"line","who":"lily","ex":"smile","text":"Lady Evangeline! Is that lemon? I love lemon!","zh":"伊凡潔琳小姐！那是檸檬嗎？我最愛檸檬了！"},{"t":"line","who":"","text":"Of course she does.","zh":"她當然愛。"},{"t":"show","who":"eve","ex":"nervous"},{"t":"line","who":"","text":"I squeeze two lemons into a bowl. I add three big spoons from the jar marked SUGAR. I stir like my life depends on it, because it does.","zh":"我把兩顆檸檬擠進碗裡，從標著「糖」的罐子裡舀了三大匙，拚命攪拌，好像我的命就靠它了，因為真的是這樣。"},{"t":"if","k":"kitchen","op":"=","v":"alone","to":"glaze_alone"},{"t":"show","who":"pip","ex":"neutral"},{"t":"line","who":"pip","ex":"neutral","text":"Thinner, my lady. Let it run down the sides.","zh":"再稀一點，小姐。讓它順著邊緣流下來。"},{"t":"line","who":"","text":"The glaze shines. Pip picks up a clean spoon to taste it.","zh":"糖霜閃閃發亮。琵普拿起一支乾淨的湯匙，準備嚐一口。"},{"t":"sfx","v":"handbell"},{"t":"line","who":"crumb","ex":null,"text":"Time! Spoons down!","zh":"時間到！放下湯匙！"},{"t":"line","who":"","text":"Pip's spoon stops an inch from her mouth.","zh":"琵普的湯匙停在離嘴巴只有一點點的地方。"},{"t":"goto","to":"taste"},{"t":"line","who":"","text":"Pip stands behind me with her arms folded. I told her I could do this myself.","zh":"琵普雙手抱胸站在我身後。我跟她說過我自己來就行。"},{"t":"line","who":"","text":"The glaze runs down the tall side and makes a lake on the flat side. Close enough.","zh":"糖霜從高的那一邊流下來，在扁的那一邊積成一座小湖。差不多就好。"},{"t":"sfx","v":"handbell"},{"t":"line","who":"crumb","ex":null,"text":"Time! Spoons down!","zh":"時間到！放下湯匙！"},{"t":"goto","to":"taste"},{"t":"hide","who":"pip"},{"t":"show","who":"eve","ex":"worried"},{"t":"line","who":"","text":"One by one, the cakes go up to the judges' table. Then it's my turn.","zh":"蛋糕一個接一個被送到評審桌前。接著輪到我了。"},{"t":"line","who":"crumb","ex":null,"text":"Lady Evangeline Ashcroft. Lemon cake.","zh":"伊凡潔琳・艾許克羅夫特小姐。檸檬蛋糕。"},{"t":"line","who":"","text":"She reads my entry form, and her eyebrows go up.","zh":"她看著我的報名表，眉毛挑了起來。"},{"t":"line","who":"crumb","ex":null,"text":"\"A special piece for Miss Lily Bell.\" How sweet. Miss Bell, come and taste it first.","zh":"「特別為莉莉・貝爾小姐準備一塊。」真貼心。貝爾小姐，請先來嚐嚐看。"},{"t":"line","who":"","text":"I know this page. I {{read|red}} it twice, because I couldn't believe how mean it was.","zh":"我知道這一頁。我讀了兩遍，因為我不敢相信這段有多惡毒。"},{"t":"line","who":"eve","ex":"nervous","text":"Wait! Maybe the judges should go first—","zh":"等等！也許應該讓評審先——"},{"t":"line","who":"crumb","ex":null,"text":"Rules are rules.","zh":"規則就是規則。"},{"t":"show","who":"lily","ex":"neutral"},{"t":"line","who":"","text":"Lily takes a fork. Everyone in the tent leans in. She takes a bite.","zh":"莉莉拿起叉子。帳篷裡每個人都湊了過來。她咬了一口。"},{"t":"show","who":"lily","ex":"shocked"},{"t":"shake"},{"t":"line","who":"","text":"Her face goes white, then pink, then a soft, sad green.","zh":"她的臉先變白，再變粉紅，最後變成一種淡淡的、可憐的綠色。"},{"t":"line","who":"lily","ex":"teary","text":"Is it… is it supposed to taste like the sea?","zh":"這……這應該吃起來像海水嗎？"},{"t":"sfx","v":"gasp"},{"t":"line","who":"","text":"She grabs a cup of water and drinks the whole thing. Then she grabs Prince Cedric's cup and drinks that too.","zh":"她抓起一杯水，一口氣喝光，然後又抓起賽德瑞克王子的杯子，也喝光了。"},{"t":"show","who":"cedric","ex":"neutral"},{"t":"line","who":"","text":"Madame Crumb takes a bite. Prince Cedric takes a bite. They both stop chewing at the same time.","zh":"克蘭姆夫人咬了一口。賽德瑞克王子也咬了一口。他們同時停止咀嚼。"},{"t":"line","who":"cedric","ex":"shocked","text":"Salt! It's all salt!","zh":"鹽！全都是鹽！"},{"t":"if","k":"lily","op":">=","v":1,"to":"lily_brave"},{"t":"line","who":"","text":"Lily coughs into her hand and doesn't look at me.","zh":"莉莉用手摀著嘴咳嗽，看都不看我一眼。"},{"t":"goto","to":"salt_choice"},{"t":"line","who":"lily","ex":"teary","text":"It's okay! It's… very… interesting!","zh":"沒關係！它……非常……特別！"},{"t":"line","who":"","text":"She coughs for a long time.","zh":"她咳了很久。"},{"t":"line","who":"","text":"Every face in the tent turns to me. I know this look. Everyone wore it at the fountain.","zh":"帳篷裡每張臉都轉向我。我認得這種眼神。在噴泉那天，大家臉上就是這個表情。"},{"t":"choice","opts":[{"text":"\"I'm so sorry. That's my fault. I should have tasted it.\"","tone":"sweet","fx":[{"k":"doom","d":-4},{"flag":"salt","v":"own"}],"to":"own","zh":"「真的很抱歉。這是我的錯。我應該先嚐一下的。」"},{"text":"\"It's a salted lemon cake. Salty, then sour. Very modern.\"","tone":"bold","fx":[{"k":"doom","d":-3},{"flag":"salt","v":"bold"}],"to":"salted","zh":"「這是鹽味檸檬蛋糕。先鹹後酸，非常時髦。」"},{"text":"\"That isn't my sugar! Somebody switched the jar!\"","tone":"sly","fx":[{"k":"doom","d":-2},{"flag":"salt","v":"jar"}],"to":"jar","zh":"「那不是我的糖！有人把罐子換掉了！」"}]},{"t":"line","who":"crumb","ex":null,"text":"…You're *sorry*?","zh":"……妳說妳很*抱歉*？"},{"t":"line","who":"","text":"Madame Crumb looks at me like I just turned into a frog.","zh":"克蘭姆夫人看著我，好像我剛剛變成了一隻青蛙。"},{"t":"line","who":"","text":"Somewhere in the crowd, a woman whispers, \"Lady Evangeline said sorry?\" Another woman says, \"She must be ill. Fetch a doctor.\"","zh":"人群中有位女士低聲說：「伊凡潔琳小姐說了對不起？」另一位女士說：「她一定是生病了。快去請醫生。」"},{"t":"line","who":"eve","ex":"smile","text":"I'm not ill. I just can't bake. Not yet.","zh":"我沒生病。我只是不會烤蛋糕。還不會。"},{"t":"line","who":"crumb","ex":null,"text":"Hm. Then learn, my lady. Start with the difference between salt and sugar.","zh":"嗯。那就學吧，小姐。先從分辨鹽和糖開始。"},{"t":"goto","to":"canon"},{"t":"show","who":"eve","ex":"smug"},{"t":"line","who":"eve","ex":"smug","text":"In the best kitchens, everyone puts salt on sweet things. Salted caramel. Salted chocolate. This is the future.","zh":"在最好的廚房裡，大家都在甜點上加鹽。鹽味焦糖、鹽味巧克力。這就是未來。"},{"t":"line","who":"","text":"Prince Cedric looks at the crowd. He doesn't want to look old-fashioned. He takes another big bite.","zh":"賽德瑞克王子看了看人群。他不想顯得老土，於是又咬了一大口。"},{"t":"line","who":"cedric","ex":"nervous","text":"Mm. Yes. Very… modern.","zh":"嗯。對。非常……時髦。"},{"t":"line","who":"","text":"He turns the same color as Lily.","zh":"他的臉變成跟莉莉一樣的顏色。"},{"t":"if","k":"fountain","op":"=","v":"joke","to":"salted_silk"},{"t":"goto","to":"canon"},{"t":"line","who":"lily","ex":"smile","text":"Like wet silk?","zh":"就像濕絲綢那樣？"},{"t":"line","who":"","text":"She whispers it, and I have to bite my lip so I don't laugh.","zh":"她小聲地說，我得咬住嘴唇才不會笑出來。"},{"t":"goto","to":"canon"},{"t":"line","who":"","text":"Madame Crumb walks to my table. She licks one finger, dips it in the jar marked SUGAR, and tastes.","zh":"克蘭姆夫人走到我的桌前。她舔了一下手指，伸進標著「糖」的罐子裡，嚐了嚐。"},{"t":"line","who":"crumb","ex":null,"text":"…Salt.","zh":"……是鹽。"},{"t":"sfx","v":"gasp"},{"t":"line","who":"","text":"The crowd gasps. \"Who did it?\" \"Who would do such a thing?\" Then, one by one, every face turns back to me.","zh":"人群倒抽一口氣。「是誰做的？」「誰會做這種事？」接著，一張接一張的臉，又轉回來看著我。"},{"t":"line","who":"crumb","ex":null,"text":"A bad baker always blames her jar, my lady.","zh":"小姐，差勁的烘焙師總是怪罪她的罐子。"},{"t":"line","who":"","text":"I didn't switch it. But nobody here believes me, and I can't prove a thing.","zh":"不是我換的。但這裡沒有人相信我，而我什麼也證明不了。"},{"t":"goto","to":"canon"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"Ding! Chapter Three event complete: The Cake Incident.","zh":"叮！第三章事件完成：蛋糕事件。"},{"t":"line","who":"eve","ex":"worried","text":"Who put salt in the sugar jar?","zh":"是誰把鹽放進糖罐裡的？"},{"t":"line","who":"system","ex":null,"text":"The Plot needed salt. The Plot found salt.","zh":"故事需要鹽，故事就找到了鹽。"},{"t":"doom","d":3},{"t":"line","who":"system","ex":null,"text":"Story pressure +3%. Chin up! Nobody fell into a fountain today!","zh":"故事壓力 +3%。打起精神！今天沒有人掉進噴泉喔！"},{"t":"line","who":"","text":"In the end, Lily's honey buns win the blue [[ribbon]]. My cake comes last, after a cake that a little boy dropped on the floor.","zh":"最後，莉莉的蜂蜜小麵包拿到了藍色緞帶。我的蛋糕是最後一名，排在一個被小男孩掉到地上的蛋糕後面。"},{"t":"hide","who":"eve"},{"t":"hide","who":"lily"},{"t":"hide","who":"cedric"},{"t":"bg","v":"tentdusk"},{"t":"music","v":"scheme"},{"t":"line","who":"","text":"By evening, the fair is quiet. I sit behind the tent with what's left of my cake.","zh":"到了傍晚，市集安靜下來。我坐在帳篷後面，守著剩下的蛋糕。"},{"t":"line","who":"","text":"I [[scrape]] the salty top off with a knife. Under it, the cake is soft and golden, and it tastes like lemons. Real lemons.","zh":"我用刀子把鹹鹹的那層刮掉。底下的蛋糕又軟又金黃，吃起來是檸檬的味道。真正的檸檬。"},{"t":"show","who":"lily","ex":"neutral"},{"t":"line","who":"","text":"Across the grass, Lily sits alone on a wooden [[crate]]. The blue ribbon lies in her lap. She doesn't look like a winner. She looks tired.","zh":"草地另一頭，莉莉一個人坐在木箱上，藍色緞帶放在她腿上。她看起來不像贏家，只像是累壞了。"},{"t":"choice","opts":[{"text":"Take Lily a slice, without the salt, and say sorry.","tone":"sweet","fx":[{"k":"doom","d":-2},{"k":"lily","d":1},{"flag":"share","v":"lily"}],"to":"share","zh":"拿一塊沒有鹽的蛋糕給莉莉，並且道歉。"},{"text":"Eat the slice yourself. You earned it.","tone":"bold","fx":[{"flag":"share","v":"self"}],"to":"self","zh":"自己把那塊吃掉。這是妳應得的。"},{"text":"Stay in the shadow of the tent and watch her for a minute.","tone":"sly","fx":[{"k":"doom","d":-1},{"flag":"share","v":"watch"}],"to":"watch","zh":"待在帳篷的陰影裡，先觀察她一下。"}]},{"t":"line","who":"","text":"I sit down next to her and hold out the plate.","zh":"我在她身邊坐下，把盤子遞過去。"},{"t":"line","who":"eve","ex":"smile","text":"A [[peace offering|peace]]. No salt. I checked twice.","zh":"求和的禮物。沒有鹽。我檢查過兩次了。"},{"t":"line","who":"","text":"Lily looks at the cake for a long moment. Then she takes a tiny bite. Then a big one.","zh":"莉莉盯著蛋糕看了好一會兒。然後她咬了一小口，接著又咬了一大口。"},{"t":"line","who":"lily","ex":"smile","text":"Oh! It's really good!","zh":"喔！真的很好吃！"},{"t":"line","who":"eve","ex":null,"text":"Don't tell Madame Crumb.","zh":"別告訴克蘭姆夫人。"},{"t":"goto","to":"cliff"},{"t":"line","who":"","text":"I eat the whole slice, one big bite at a time. It's delicious. I'm very proud of myself.","zh":"我一大口一大口地把整塊吃掉。好吃極了。我非常以自己為傲。"},{"t":"line","who":"","text":"When I look up, Lily is standing in front of me, watching me lick my fork.","zh":"我一抬頭，莉莉就站在我面前，看著我舔叉子。"},{"t":"goto","to":"cliff"},{"t":"line","who":"","text":"I stay in the shadow and watch. Lily isn't alone after all. She's talking to the empty air in front of her face.","zh":"我待在陰影裡觀察。原來莉莉並不是一個人。她正對著眼前的空氣說話。"},{"t":"line","who":"lily","ex":"worried","text":"I know the rules. I don't care. I'm not doing it.","zh":"我知道規則。我不在乎。我不要做。"},{"t":"line","who":"","text":"She stops, as if somebody answered her. Then she turns her head and looks straight at me. She gets up and walks over.","zh":"她停了下來，好像有人回答了她。接著她轉過頭，直直地看著我，起身走了過來。"},{"t":"goto","to":"cliff"},{"t":"music","v":"none"},{"t":"line","who":"","text":"Lily leans in close. Her voice is so low that only I can hear it.","zh":"莉莉湊近我。她的聲音低到只有我聽得見。"},{"t":"line","who":"lily","ex":"neutral","text":"I've been watching you since the garden party.","zh":"從花園派對那天起，我就一直在觀察妳。"},{"t":"line","who":"lily","ex":"neutral","text":"You're not Evangeline.","zh":"妳不是伊凡潔琳。"},{"t":"line","who":"","text":"My heart stops.","zh":"我的心跳停了一拍。"},{"t":"line","who":"lily","ex":"neutral","text":"Who are you?","zh":"妳是誰？"},{"t":"title","flag":"salt","val":"own","name":"Honest Baker"},{"t":"title","flag":"salt","val":"bold","name":"Salt Queen"},{"t":"title","flag":"salt","val":"jar","name":"Jar Detective"},{"t":"end"}],"labels":{"k_pip":15,"k_pip_warm":18,"k_pip_go":19,"k_alone":25,"k_deal":32,"fair":37,"ced_peacock":51,"next_table":52,"lily_wave":59,"glaze":61,"glaze_alone":71,"taste":76,"lily_brave":99,"salt_choice":101,"own":103,"salted":109,"salted_silk":116,"jar":119,"canon":126,"dusk":133,"share":143,"self":149,"watch":152,"cliff":156}}]};

/* Who speaks: the name tag, its color, and the read-aloud voice.
   g: f or m picks a voice from the device; p and r are pitch and rate.
   Eve and the narration (her thoughts) use the main voice. */
const CAST = {
  /* Eve asks for an Australian or British voice (cooler, more of a lady); Lily asks for an American one (warmer, plainer).
     On a typical iPhone: Eve Karen, Lily and Pip Samantha, the System Moira, Cedric Daniel. */
  eve:{name:"Eve", color:"#E2BC62", main:true, p:1, r:1, prefer:["en-AU","en-GB"]},
  pip:{name:"Pip", color:"#B9D3C2", g:"f", p:1.08, r:1.02},
  lily:{name:"Lily", color:"#F2A3BC", g:"f", p:1.14, r:.98, prefer:"en-US"},
  cedric:{name:"Prince Cedric", color:"#8FB4F0", g:"m", p:.98, r:.95},
  rowan:{name:"Duke Rowan", color:"#B7A6D9", g:"m", p:.86, r:.88},
  system:{name:"SYSTEM", color:"#7FE3FF", g:"f", p:1.18, r:1.08, prefer:"en-IE"},
  /* minor characters: a name tag and a voice, no portrait */
  crumb:{name:"Madame Crumb", color:"#E6D8C0", g:"f", p:.88, r:.9}
};

/* names the English voice gets wrong, respelled for the voice only.
   Check each one on the iPhone before shipping. */
const SAY_AS = {"Cedric":"Sedrick",
  /* tested on iOS (2026-10-16): Samantha, Karen, Daniel and Moira all say ih-VAN-juh-leen; the Windows Chrome voices do too. */
  "Evangeline":"Evangeleen"};

/* respellings for one voice only, by the voice's name, e.g. {"Daniel":{"Evangeline":"…"}}.
   Use only when the shared respelling above fails for one voice (check with tools/say-test.html). */
const SAY_AS_VOICE = {};

/* words in another language: [language, English respelling, native spelling] */
const FOREIGN = {};

/* ==== content/gloss.js ==== */
/* tooltips for [[marked]] words: the word, KK phonetics, Chinese, and a short note */
const GLOSS = {

/* =========================================================
   THE VILLAINESS HAS READ THE BOOK — core helpers
   Storage, markup, glossary popovers and read-aloud.
   Ported from Window Seat: The Game (store, mk, openGloss) and the
   Window Seat textbooks' engine (voices, speakParts, nativeVoice, prosody).
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const PREFIX = "vil-";
const store = {
  get(k, d){ try{ const v = localStorage.getItem(PREFIX+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(PREFIX+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(PREFIX+k); }catch(e){} }
};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- story markup ----------------
   [[shown|key]] opens a gloss; *word* is italic. */
const RX = /\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g;
const SPOKEN = /\{\{([^|}]+)\|([^}]+)\}\}/g;   /* {{shown|spoken}}: the voice says the second word */
const plain = s => String(s).replace(SPOKEN, "$1").replace(RX, "$1").replace(/\*([^*]+)\*/g, "$1");
function mk(s){
  return esc(s).replace(SPOKEN, "$1").replace(RX, (m, disp, key)=>{
    key = key || disp.toLowerCase();
    const seen = (typeof S !== "undefined" && S && S.notes && S.notes.includes(key)) ? " seen" : "";
    return `<span class="g${seen}" role="button" tabindex="0" data-k="${esc(key)}">${disp}</span>`;
  }).replace(/\*([^*]+)\*/g, "<em>$1</em>");
}
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove("on"), 2400); }

/* ---------------- glossary popover ---------------- */
function openGloss(k, anchor){
  const g = GLOSS[k]; if(!g) return;
  if(typeof S !== "undefined" && S && !S.notes.includes(k)){ S.notes.push(k); if(typeof autosave === "function") autosave(); }
  const p = $("#pop");
  p.innerHTML = `<button class="ib x" data-close aria-label="Close">${ICON.x}</button>
    <div class="pw"><span class="w">${esc(g.w || k)}</span>${g.kk ? `<span class="k">${esc(g.kk)}</span>` : ""}
    <button class="ib" data-say="${esc(g.w || k)}" aria-label="Say it">${ICON.spk}</button></div>
    <div class="z">${esc(g.zh)}</div>${g.d ? `<div class="d">${esc(g.d)}</div>` : ""}`;
  const r = anchor.getBoundingClientRect();
  p.classList.add("on");
  const h = p.offsetHeight;
  p.style.top = (r.bottom + 8 + h > innerHeight ? Math.max(8, r.top - h - 8) : r.bottom + 8) + "px";
  anchor.classList.add("seen");
}
document.addEventListener("click", e=>{
  const g = e.target.closest(".g"); if(g){ e.stopPropagation(); e.preventDefault(); openGloss(g.dataset.k, g); return; }
  const sp = e.target.closest("[data-say]"); if(sp){ e.stopPropagation(); Voice.say(sp.dataset.say, sp.dataset.who || ""); return; }
  if((e.target.closest("[data-close]") || !e.target.closest("#pop")) && $("#pop").classList.contains("on")){ $("#pop").classList.remove("on"); e.stopPropagation(); }
}, true);

/* ---------------- read-aloud ----------------
   One voice per character, picked from the device's English voices by gender, with
   each character's pitch and rate. Names the voice gets wrong go in SAY_AS (respellings);
   words in another language go in FOREIGN and use that language's voice when the device has one. */
const Voice = (()=>{
  const SYN = window.speechSynthesis || null;
  let rate = store.get("rate", .9);
  const POOL = {all:[], f:[], m:[], main:null};
  const FEM = /Samantha|Martha|Catherine|Stephanie|Matilda|Ava|Allison|Susan|Zira|Aria|Jenny|Michelle|Emma|Joanna|Salli|Kendra|Kimberly|Ivy|Karen|Moira|Tessa|Victoria|Serena|Kate|Fiona|Veena|Libby|Sonia|Natasha|Nicky|Sara|Female|Google US English/i;
  const MAL = /Alex|Daniel|Tom|Aaron|Arthur|Rishi|David|Mark|Guy|Ryan|Eric|Christopher|Matthew|Joey|Justin|Brian|Oliver|Gordon|Lee|Evan|Nathan|Male/i;
  const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Ralph|Fred|Kathy|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
  /* 0 normal, 1 enhanced, 2 premium: iPhone gives enhanced voices the same name, so read the voiceURI too */
  const vq = v => { const s = (v.voiceURI || "") + " " + v.name; return /premium|高品質|優質/i.test(s) ? 2 : /enhanced|增強|加強|Natural|Neural|Online/i.test(s) ? 1 : 0; };
  function pick(){
    if(!SYN) return;
    /* American, British, Australian and Irish English first (the UK, Australian and Irish voices suit the court); other English last */
    const us = v => /^en[-_]US/i.test(v.lang) ? 0 : /^en[-_]GB/i.test(v.lang) ? 1 : /^en[-_]AU/i.test(v.lang) ? 2 : /^en[-_]IE/i.test(v.lang) ? 3 : 4;
    const vs = SYN.getVoices().filter(v=>/^en/i.test(v.lang) && !NOVELTY.test(v.name)).sort((a,b)=>us(a)-us(b) || vq(b)-vq(a));
    POOL.all = vs;
    /* characters get US, UK, Australian or Irish voices. With too few on the device, characters share a voice
       and differ by pitch. Other English voices only if none of those four are installed. */
    const usv = vs.filter(v=>us(v) <= 3), base = usv.length ? usv : vs;
    POOL.f = base.filter(v=>FEM.test(v.name)); POOL.m = base.filter(v=>!FEM.test(v.name) && MAL.test(v.name));
    if(!POOL.m.length) POOL.m = base.filter(v=>!FEM.test(v.name));
    POOL.main = vs.find(v=>us(v)===0 && /Samantha|Google US English|Aria|Jenny|Ava|Allison/i.test(v.name)) || POOL.f[0] || vs[0] || null;
  }
  if(SYN){ pick(); SYN.onvoiceschanged = pick; }
  /* a character can ask for accents in order (CAST.prefer: "en-AU" or ["en-AU","en-GB"]) */
  const prefs = c => [].concat(c.prefer || []).map(x=>x.toLowerCase());
  const byPref = (pool, c) => { for(const p of prefs(c)){ const v = pool.find(x=>String(x.lang).replace("_","-").toLowerCase().startsWith(p)); if(v) return v; } return null; };
  function voiceFor(who){
    const own = store.get("voice-" + who, "");   /* the player picked this voice in Settings */
    if(own){ const v = POOL.all.find(x=>x.voiceURI === own); if(v) return v; }
    const c = CAST[who];
    if(!c || !c.g && !c.main) return POOL.main;
    /* Eve (and the narration, her thoughts) */
    if(c.main) return byPref(POOL.f, c) || POOL.main;
    /* everyone else avoids Eve's voice when the device has enough voices */
    const eve = voiceFor("eve");
    const pool = (c.g === "f" ? POOL.f : POOL.m).filter(v=>v !== eve);
    if(!pool.length) return eve;
    const v = byPref(pool, c); if(v) return v;
    /* no accent asked for: skip voices that other characters asked for, if any are left, then take turns */
    const taken = Object.keys(CAST).filter(n=>n !== who && !CAST[n].main && CAST[n].g === c.g && CAST[n].prefer).map(n=>byPref(pool, CAST[n]));
    const free = pool.filter(x=>!taken.includes(x)), use = free.length ? free : pool;
    const same = Object.keys(CAST).filter(n=>!CAST[n].main && CAST[n].g === c.g && !(CAST[n].prefer && byPref(pool, CAST[n])));
    return use[Math.max(0, same.indexOf(who)) % use.length];
  }
  /* respellings for every voice, then any for this voice alone (each voice has its own dictionary, so a name one says right another says wrong) */
  const sayAs = (t, v) => { const own = v && SAY_AS_VOICE[v.name] || {};
    return Object.entries(Object.assign({}, SAY_AS, own)).reduce((x,[w,r])=>x.split(w).join(r), t); };
  const FOR = {}; Object.entries(FOREIGN).forEach(([k,v])=>{ FOR[k.toLowerCase()] = {lang:v[0], en:v[1], nat:v[2] || k}; });
  const FRX = Object.keys(FOR).length ? new RegExp("(^|[^\\p{L}])(" + Object.keys(FOR).sort((a,b)=>b.length-a.length)
    .map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")(?![\\p{L}])", "giu") : null;
  function nativeVoice(lang){
    if(!SYN || !lang) return null; const L = lang.toLowerCase(), base = L.split("-")[0];
    const vs = SYN.getVoices().filter(v=>!NOVELTY.test(v.name)), nm = v => String(v.lang).replace("_","-").toLowerCase();
    const best = a => a.slice().sort((x,y)=>vq(y)-vq(x))[0];
    return best(vs.filter(v=>nm(v) === L)) || best(vs.filter(v=>nm(v).split("-")[0] === base)) || null;
  }
  function speakParts(s, v){
    const raw = [];
    if(FRX){ let i = 0, m; FRX.lastIndex = 0;
      while((m = FRX.exec(s))){ const st = m.index + m[1].length;

/* ==== engine/art.js ==== */
/* =========================================================
   Art: dithered VGA-style portraits and backgrounds, drawn in code.
   The stage is 320×200, like VGA mode 13h. Portraits grow from Window
   Seat's bust method: shapes on a design grid, Bayer dithering at the
   edges of light and shade, features drawn at the final pixel size.
   ========================================================= */
const Art = (()=>{
  const B4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  const bay = (x,y) => (B4[y&3][x&3]+.5)/16;

      rect(x0,y0,ww,hh,c){ c = hex(c); for(let yy=Math.max(0,y0|0);yy<Math.min(h,y0+hh);yy++) for(let xx=Math.max(0,x0|0);xx<Math.min(w,x0+ww);xx++) P.put(xx,yy,c); },
      vgrad(x0,y0,ww,hh,cols){ const cs = cols.map(hex), n = cs.length-1;

          for(let xx=0;xx<ww;xx++) P.put(x0+xx, y0+yy, f > bay(x0+xx,y0+yy) ? cs[k+1] : cs[k]); } },
      ell(cx,cy,rx,ry,c,c2,split){ const a = hex(c), b = c2 ? hex(c2) : a;
        for(let yy=Math.floor(cy-ry);yy<=cy+ry;yy++) for(let xx=Math.floor(cx-rx);xx<=cx+rx;xx++){

  const SK = {s:"#F6D3B8", S:"#E3AF92", T:"#C88E73", L:"#FDE6D2"};

  const PEOPLE = {
    eve:{hs:"ringlets", hair:["#93692A","#C49A46","#E8C77A","#FAE8B4"], iris:["#5A3A8E","#9472CC"],
      cloth:{hi:"#B8395E", a:"#8E1F3F", b:"#6E1631", c:"#4E0F23", trim:"#E2BC62"}, neck:"square", acc:"rose"},
    lily:{hs:"long", hair:["#55301F","#7B4930","#A26843","#C98D5E"], iris:["#6B4426","#A0703F"],
      cloth:{hi:"#FBC9D8", a:"#F2A3BC", b:"#DB86A2", c:"#BF6A88", trim:"#FFFFFF"}, neck:"lace", acc:"bow"},
    pip:{hs:"bob", hair:["#2B1E18","#45322A","#63503F","#86705A"], iris:["#3D5E4B","#6E937B"],
      cloth:{hi:"#4A4450", a:"#2E2A33", b:"#231F28", c:"#18151C", trim:"#F4F1EC"}, neck:"maid", acc:"headband"},
    cedric:{hs:"short", male:true, hair:["#A2742A","#D6AA4C","#F0CF7A","#FCEBB8"], iris:["#2E5DA6","#6293DA"],

    worried:{b:"worry", e:"open", m:"frown"},
    nervous:{b:"worry", e:"open", m:"wavy", sweat:1, blush:1},

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Villainess Has Read the Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: one column, the 320×200 stage on top and the dialogue box below, like a handheld visual novel.
   A single committed night look: lamplight gold on plum ink; the System speaks in cool cyan pixels. */
:root{
  --ink:#130D18; --panel:#1F1526; --panel2:#2A1D33; --line:#4A3552; --text:#F4EAEF; --dim:#B5A2B6;
  --gold:#E2BC62; --gold2:#F6DD8E; --rose:#E06C8C; --sys:#7FE3FF; --sysbg:#0A1824; --sysline:#2A6E8A;
  --f-disp:'IM Fell English SC','IM Fell English',Georgia,'Times New Roman',serif;
  --f-tale:'IM Fell English',Georgia,'Noto Serif TC','PingFang TC',serif;
  --f-body:'Atkinson Hyperlegible','PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-px:'VT323',ui-monospace,'Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent;}
*{box-sizing:border-box;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
button:focus-visible,.g:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px;}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;width:100%;height:auto;aspect-ratio:320/200;max-width:100%;}
.scr{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(0px, env(safe-area-inset-left, 0px));padding-right:max(0px, env(safe-area-inset-right, 0px));}
.ib{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.ib svg{width:22px;height:22px;fill:currentColor;}
.ib.sm{width:30px;height:30px;} .ib.sm svg{width:18px;height:18px;}
[data-music].on{color:var(--gold2);}
.btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border-radius:6px;
  background:linear-gradient(var(--gold2),var(--gold));color:#2A1A0E;font-weight:700;border:1px solid #8C6A2A;box-shadow:0 2px 0 #6E521F;}
.btn small{font-weight:400;font-size:13px;opacity:.8;}
.btn.alt{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none;}
.btn.sm{min-height:38px;padding:6px 14px;font-size:15px;}
.btn:disabled{opacity:.4;cursor:default;}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;} .row.end{justify-content:flex-end;}
.col{display:flex;flex-direction:column;gap:8px;}
.dim{color:var(--dim);font-size:14px;}

/* ---------- title ---------- */
#title{justify-content:center;overflow-y:auto;}
#title .art{position:relative;}
#title .art::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(transparent,var(--ink));pointer-events:none;}
#title .tt{text-align:center;padding:4px max(16px, env(safe-area-inset-left, 0px)) 20px;margin-top:-28px;position:relative;z-index:1;display:flex;flex-direction:column;gap:14px;align-items:center;}
#title .kick{font-family:var(--f-px);font-size:18px;letter-spacing:.14em;color:var(--sys);margin:0;}
#title h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,8.4vw,42px);line-height:1.02;margin:0;color:var(--gold2);text-wrap:balance;text-shadow:0 2px 0 #3A2340, 0 0 18px rgba(226,188,98,.25);}
#title h1 i{font-family:var(--f-tale);font-style:italic;font-size:.62em;display:block;color:var(--rose);letter-spacing:.02em;}
#tbtns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;}
#tbtns > .btn{width:100%;}
#title .foot{font-size:12px;color:var(--dim);margin:6px 0 0;}

/* ---------- game ---------- */
#game{position:relative;}
.hud{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--ink);}
#epl{flex:1;min-width:0;font-family:var(--f-tale);font-size:15px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#doom{display:flex;align-items:center;gap:6px;font-family:var(--f-px);font-size:19px;color:var(--sys);padding:2px 8px;border:1px solid var(--sysline);border-radius:4px;background:var(--sysbg);min-height:34px;}
#doom .bar{width:64px;height:8px;background:#06121B;border:1px solid var(--sysline);}
#doom i{display:block;height:100%;background:linear-gradient(90deg,#FFB35A,#FF5A6E);transition:width .7s ease-out;}
#doom.cool i{background:linear-gradient(90deg,#7FE3FF,#B8F5A0);}
#doom b{font-weight:400;min-width:3ch;text-align:right;}
#doom.bump-up{animation:dup .6s;} #doom.bump-down{animation:ddn .6s;}
@keyframes dup{30%{box-shadow:0 0 0 3px rgba(255,90,110,.6);transform:scale(1.06);}}
@keyframes ddn{30%{box-shadow:0 0 0 3px rgba(127,227,255,.6);transform:scale(1.06);}}
.stagew{position:relative;background:#0E0A14;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
#cv{cursor:pointer;}
.box{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;padding:14px max(16px, env(safe-area-inset-left, 0px)) 12px;
  background:linear-gradient(var(--panel),var(--ink) 60%);cursor:pointer;overflow-y:auto;box-shadow:inset 0 3px 0 -1px rgba(226,188,98,.35);}
#tag{align-self:flex-start;font-family:var(--f-disp);font-size:18px;line-height:1;color:var(--tc,var(--gold));padding:5px 10px 4px;margin:-2px 0 8px -2px;border:1px solid currentColor;border-radius:3px;background:rgba(0,0,0,.25);}
#txt{font-size:19.5px;line-height:1.55;max-width:62ch;margin:0;}
.box.narr #txt{color:#E9DDE4;}
.box.talk #txt{color:var(--text);}
.box.sys{background:linear-gradient(var(--sysbg),#06101A);}
.box.sys #txt{font-family:var(--f-px);font-size:26px;line-height:1.2;color:var(--sys);text-shadow:0 0 8px rgba(127,227,255,.35);}
.box.sys #tag{font-family:var(--f-px);font-size:20px;letter-spacing:.08em;}
#txt em{font-family:var(--f-tale);font-style:italic;}
#zh{font-size:15px;line-height:1.55;color:#9C8A9F;margin:8px 0 0;max-width:62ch;}
#zh.wait{visibility:hidden;}
.box.sys #zh{color:#5A93AA;}
.ozh{display:block;font-size:14px;line-height:1.45;color:#9C8A9F;margin-top:3px;}
.opt .ozh::before{content:none;}
.lzh{font-size:14px;color:#9C8A9F;margin:2px 0 0;}
.sr .sub{display:block;font-size:13px;}
.vz{padding:10px 0;border-bottom:1px solid var(--line);}
.vz summary{cursor:pointer;} .vz > p{margin:6px 0 8px;}
.vr{display:flex;flex-direction:column;gap:2px;padding:6px 0;}
.vrow{display:flex;gap:6px;align-items:center;}
.vr select{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
.vr .now{font-size:12px;}
.tools{display:flex;align-items:center;gap:4px;padding-top:10px;max-width:62ch;}
.tools .sp{flex:1;}
#more{font-size:14px;color:var(--gold);opacity:0;transition:opacity .2s;}
.box.ready #more{opacity:1;animation:bob 1.1s infinite;}
@keyframes bob{50%{transform:translateY(3px);}}
#ctx{font-size:15px;color:var(--dim);margin:0 0 10px;font-style:italic;}
#choices{display:flex;flex-direction:column;gap:8px;}
.opt{text-align:left;padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-size:17px;line-height:1.4;}
.opt:hover,.opt:focus-visible{border-color:var(--gold);background:#352540;}
.opt::before{content:"❧ ";color:var(--gold);}
.box.choose{cursor:default;}
.g{border-bottom:2px dotted var(--gold);cursor:pointer;}
.g.seen{border-bottom-style:solid;border-bottom-color:rgba(226,188,98,.5);}
.box.sys .g{border-bottom-color:var(--sys);}

/* ---------- popover, toast, windows ---------- */
#pop{position:fixed;z-index:70;left:max(16px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));max-width:420px;margin:0 auto;background:#F4EAEF;color:#24161E;border-radius:8px;padding:12px 44px 12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;}
#pop.on{display:block;}
#pop .pw{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
#pop .w{font-weight:700;font-size:19px;} #pop .k{color:#6E5A6A;font-size:14px;}
#pop .z{color:#9A2E4E;font-size:17px;margin-top:2px;} #pop .d{font-size:14px;color:#4A3A46;margin-top:4px;}
#pop .x{position:absolute;top:4px;right:4px;}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--sysbg);color:var(--sys);border:1px solid var(--sysline);font-family:var(--f-px);font-size:20px;padding:6px 14px;border-radius:4px;z-index:80;opacity:0;transition:opacity .3s;pointer-events:none;max-width:88vw;text-align:center;}
#toast.on{opacity:1;}
#modal{position:fixed;inset:0;z-index:60;background:rgba(8,5,12,.72);display:flex;align-items:center;justify-content:center;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));}
#modal .box{flex:none;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;cursor:default;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:block;box-shadow:0 10px 40px rgba(0,0,0,.6);}
#modal .box.small{max-width:360px;}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.mh h2,.endc h2{font-family:var(--f-disp);font-weight:400;font-size:26px;margin:0;color:var(--gold2);}
.msg{font-size:17px;margin:4px 0 14px;}
.slot{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);}
.slot b{font-family:var(--f-disp);font-weight:400;font-size:18px;color:var(--gold);}
.slot small{color:var(--dim);font-family:var(--f-px);font-size:17px;}
.slot:disabled{opacity:.45;}
.sysw{font-family:var(--f-px);font-size:21px;line-height:1.2;color:var(--sys);background:var(--sysbg);border:1px solid var(--sysline);border-radius:4px;padding:10px 12px;margin:0 0 14px;box-shadow:0 0 16px rgba(127,227,255,.12) inset;}
.sysw p{margin:6px 0;} .sysw .sh{color:#B8F0FF;letter-spacing:.06em;margin-top:6px;}
.sysw .dim{color:#5FA2BC;font-size:19px;}
.dm{display:flex;align-items:center;gap:8px;margin:6px 0;} .dm .bar{flex:1;height:10px;background:#06121B;border:1px solid var(--sysline);}
.dm i{display:block;height:100%;background:linear-gradient(90deg,#FFB35A,#FF5A6E);} .dm.big .bar{height:14px;}
.tl{margin:4px 0;padding-left:20px;} .tl small{color:#5FA2BC;}
.ttl{color:var(--gold2);}
h3{font-family:var(--f-disp);font-weight:400;color:var(--gold);font-size:20px;margin:6px 0;}
.nb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.nb li{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;background:var(--panel2);border-radius:4px;}
.lg{max-height:64vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
.le{position:relative;padding-right:34px;} .le p{margin:2px 0 0;} .le .ib{position:absolute;right:0;top:0;}
.le.sys p{font-family:var(--f-px);font-size:21px;color:var(--sys);line-height:1.2;}
#modal .box.tall{max-width:480px;}
.endc{text-align:center;} .endc .kick{font-family:var(--f-px);color:var(--sys);font-size:20px;letter-spacing:.1em;margin:0;}
.endc h2{margin:0 0 12px;} .endc .sysw{text-align:left;} .endc .col{margin-top:6px;}
.set{display:flex;flex-direction:column;gap:2px;}
.sr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.sr.col2{flex-direction:column;align-items:flex-start;} .sr.col2 p{margin:0;}
.sr input[type=range]{flex:1;min-width:120px;max-width:200px;accent-color:var(--gold);}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.seg button{padding:6px 10px;font-size:14px;background:var(--panel2);} .seg button.on{background:var(--gold);color:#2A1A0E;font-weight:700;}
@media (prefers-reduced-motion: reduce){ .box.ready #more{animation:none;} #doom.bump-up,#doom.bump-down{animation:none;} }
@media (min-height:760px) and (min-width:500px){ #txt{font-size:19.5px;} }
</style>
<style>[hidden]{display:none!important;} :root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);} body{margin:0;}</style>

<body>

<section id="title" class="scr">
  <div class="art"><canvas id="tcv" width="320" height="200"></canvas></div>
  <div class="tt">
    <p class="kick">INKQUEST · SEASON 1</p>
    <h1>The Villainess<i>has read the book</i></h1>
    <div id="tbtns"></div>
    <p class="foot">© 2026 Wen-Hung Fang. All rights reserved.</p>
  </div>
</section>
<section id="game" class="scr" hidden>
  <div class="hud">
    <button class="ib" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg></button>
    <span id="epl"></span>
    <button id="doom" hidden aria-label="Doom meter"><span>DOOM</span><span class="bar"><i></i></span><b>87%</b></button>
    <button class="ib" data-music aria-label="Music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></button>
  </div>
  <div class="stagew"><canvas id="cv" width="320" height="200" aria-label="Story scene"></canvas></div>
  <div class="box" id="box">
    <span id="tag" hidden></span>
    <p id="ctx" hidden></p>
    <p id="txt"></p>
    <p id="zh" hidden></p>
    <div id="choices" hidden></div>
    <div class="tools"><button class="ib sm" id="rd" data-say="" aria-label="Read this line aloud"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg></button><span class="sp"></span><span id="more">▼</span></div>
  </div>
</section>
<div id="modal" hidden><div class="box"></div></div>
<div id="pop" role="dialog"></div>
<div id="toast" role="status"></div>
<script>
/* ==== story (compiled from content/s1/*.vn) ==== */
const STORY = {"episodes":[{"n":1,"title":"Chapter One, Again","nodes":[{"t":"bg","v":"bedroom"},{"t":"music","v":"manor"},{"t":"line","who":"","text":"Silk.","zh":"絲綢。"},{"t":"line","who":"","text":"That's the first thing I notice. Silk under my cheek, silk over my legs, and a smell like roses and money.","zh":"這是我注意到的第一件事。臉頰下是絲綢，腿上蓋的也是絲綢，空氣裡有玫瑰和金錢的味道。"},{"t":"line","who":"","text":"I open my eyes. Above me hangs a [[canopy]] of pale gold cloth with little [[tassels|tassel]]. My apartment has a ceiling fan with one dead light bulb.","zh":"我睜開眼睛。頭頂垂著淡金色的床帳，綴著小小的流蘇。我的公寓只有一台吊扇，上面還有一顆燒壞的燈泡。"},{"t":"line","who":"","text":"This is not my apartment.","zh":"這不是我的公寓。"},{"t":"sfx","v":"knock"},{"t":"line","who":"","text":"Someone knocks. Three small taps, very careful.","zh":"有人敲門。輕輕的三下，小心翼翼。"},{"t":"show","who":"pip","ex":"nervous"},{"t":"gesture","who":"pip","g":"tremble"},{"t":"line","who":"pip","ex":"nervous","text":"Good morning, my lady. I brought your tea.","zh":"小姐早安。我把您的茶端來了。"},{"t":"line","who":"","text":"A girl in a black-and-white maid's dress stands in the doorway. The cups on her tray [[rattle]].","zh":"一個穿著黑白女僕裝的女孩站在門口。她托盤上的茶杯喀啦喀啦地響。"},{"t":"line","who":"","text":"She isn't scared of the tray. She's scared of me.","zh":"她怕的不是托盤。她怕的是我。"},{"t":"line","who":"","text":"Her name pops into my head: Pip. I've never seen her before in my life, but I know it like my own phone number.","zh":"她的名字突然冒進我腦中：琵普。我這輩子從沒見過她，卻熟得像自己的電話號碼。"},{"t":"choice","opts":[{"text":"\"Thank you, Pip. That smells wonderful.\"","tone":"sweet","fx":[{"k":"pip","d":1}],"to":"pip_sweet","zh":"「謝謝妳，琵普。好香啊。」"},{"text":"\"You're shaking. Sit down and drink it yourself.\"","tone":"bold","fx":[{"k":"pip","d":1}],"to":"pip_bold","zh":"「妳在發抖。坐下來，自己喝吧。」"},{"text":"\"Remind me. What day is it today?\"","tone":"sly","fx":[],"to":"pip_sly","zh":"「提醒我一下，今天是什麼日子？」"}]},{"t":"line","who":"pip","ex":"shocked","text":"Thank you… my lady?","zh":"謝謝……小姐？"},{"t":"line","who":"","text":"She says it like a question. She puts the tray down and steps back, fast.","zh":"她說得像在問問題。她放下托盤，飛快地往後退。"},{"t":"line","who":"pip","ex":"worried","text":"Is my lady feeling well?","zh":"小姐，您身體還好嗎？"},{"t":"goto","to":"mirror"},{"t":"line","who":"pip","ex":"shocked","text":"Sit? On… on your bed, my lady?","zh":"坐？坐……坐在您的床上嗎，小姐？"},{"t":"line","who":"eve","ex":null,"text":"In a chair. Anywhere. You look like you need it more than I do.","zh":"坐椅子上。坐哪都行。妳看起來比我更需要這杯茶。"},{"t":"line","who":"","text":"She sits on the very edge of a chair, like it might bite her. She doesn't touch the tea.","zh":"她只坐在椅子最邊邊，好像椅子會咬人似的。茶，她一口也沒碰。"},{"t":"line","who":"","text":"Still. It's a start.","zh":"不過，總算是個開始。"},{"t":"goto","to":"mirror"},{"t":"line","who":"pip","ex":"nervous","text":"It's the day of the Queen's garden party, my lady. You've talked about it for a month.","zh":"小姐，今天是王后的花園派對。您已經念了一整個月了。"},{"t":"line","who":"eve","ex":null,"text":"Have I?","zh":"是嗎？"},{"t":"line","who":"pip","ex":"deadpan","text":"You said, and I quote, \"I will make that little country mouse cry in front of the whole court.\"","zh":"您的原話是：「我要讓那隻鄉下小老鼠當著全宮廷的面哭出來。」"},{"t":"line","who":"","text":"Oh no.","zh":"糟了。"},{"t":"goto","to":"mirror"},{"t":"hide","who":"pip"},{"t":"line","who":"","text":"Pip hurries out to get my dress. I walk to the tall mirror by the window.","zh":"琵普匆匆出去拿我的禮服。我走到窗邊那面高高的鏡子前。"},{"t":"show","who":"eve","ex":"shocked"},{"t":"line","who":"","text":"Pale gold hair in perfect curls. Sharp violet eyes. A face that looks expensive and a little bit mean.","zh":"一頭淡金色的完美捲髮。銳利的紫羅蘭色眼睛。一張看起來很貴、又有點壞心眼的臉。"},{"t":"line","who":"","text":"I know this face. I {{read|red}} about it last night, in bed, at two in the morning.","zh":"我認得這張臉。昨晚凌晨兩點，我躺在床上讀過她。"},{"t":"line","who":"","text":"*The Rose of Ellery*, Chapter One: \"Lady Evangeline Ashcroft was beautiful, and cold as a winter blade.\"","zh":"《艾勒里的玫瑰》第一章：「伊凡潔琳・艾許克羅夫特小姐美麗動人，卻冷得像一把寒冬的刀。」"},{"t":"line","who":"","text":"I'm the [[villainess]]. In Chapter Thirty, they send her to the Frost Isles forever. Her last line in the whole book is, \"No one ever spoke her name again.\"","zh":"我是惡役千金。第三十章，她被永遠流放到霜島。整本書寫到她的最後一句是：「從此再也沒有人提起她的名字。」"},{"t":"gesture","who":"eve","g":"shake"},{"t":"line","who":"eve","ex":"shocked","text":"No. No, no, no.","zh":"不。不不不不。"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"Ding! Hello, Lady Evangeline!","zh":"叮！伊凡潔琳小姐，您好！"},{"t":"line","who":"system","ex":null,"text":"Welcome to the Doom Prevention System, version {{2.3|two point three}} ({{Beta|bay-tuh}}).","zh":"歡迎使用「防止毀滅系統」2.3 版（測試版）。"},{"t":"doom","set":87},{"t":"line","who":"system","ex":null,"text":"Your current [[Doom|doom]]: 87%.","zh":"您目前的毀滅指數：87%。"},{"t":"line","who":"system","ex":null,"text":"Please accept the [[Terms and Conditions|terms]] to continue.","zh":"請同意使用條款以繼續。"},{"t":"choice","opts":[{"text":"\"Accept. Just help me.\"","tone":"bold","fx":[],"to":"sys_bold","zh":"「同意。快幫我就對了。」"},{"text":"\"Can I read the terms first?\"","tone":"sly","fx":[],"to":"sys_sly","zh":"「我可以先看一下條款嗎？」"},{"text":"\"Is this a dream?\"","tone":"sweet","fx":[],"to":"sys_sweet","zh":"「這是夢嗎？」"}]},{"t":"line","who":"system","ex":null,"text":"Great choice! You are a fast reader.","zh":"很棒的選擇！您讀得真快。"},{"t":"goto","to":"rules"},{"t":"line","who":"system","ex":null,"text":"Of course! Terms: 1. Don't get [[exiled|exile]]. 2. See Term 1.","zh":"當然可以！條款：一、不要被流放。二、請見第一條。"},{"t":"line","who":"system","ex":null,"text":"Thank you for reading!","zh":"感謝您的閱讀！"},{"t":"goto","to":"rules"},{"t":"line","who":"system","ex":null,"text":"No! Dreams don't have a customer service team. I do.","zh":"不是喔！夢可沒有客服團隊。我有。"},{"t":"goto","to":"rules"},{"t":"line","who":"system","ex":null,"text":"Here's how it works. Act like the old Evangeline, and your Doom goes up. Surprise the story, and it goes down.","zh":"規則是這樣的：表現得像原本的伊凡潔琳，毀滅指數就會上升；讓故事出乎意料，指數就會下降。"},{"t":"line","who":"system","ex":null,"text":"If your Doom is still high at the Winter Ball…","zh":"如果到了冬季舞會，您的毀滅指數還很高……"},{"t":"line","who":"system","ex":null,"text":"Well! Let's stay positive!","zh":"嗯！我們保持正面思考吧！"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"New [[quest]]: Survive Chapter One.","zh":"新任務：活過第一章。"},{"t":"show","who":"eve","ex":"worried"},{"t":"line","who":"","text":"Chapter One. The garden party. The fountain.","zh":"第一章。花園派對。噴泉。"},{"t":"line","who":"","text":"In the book, Evangeline pushes Lily into the fountain in front of everyone. Lily comes up wet and crying, and Prince Cedric runs to save her. That's where their love story starts. And that's where mine starts to end.","zh":"書裡，伊凡潔琳當著所有人的面把莉莉推進噴泉。莉莉渾身濕透、哭著爬起來，賽德瑞克王子衝過去救她。他們的愛情故事從這裡開始。我的結局，也從這裡開始。"},{"t":"line","who":"eve","ex":"smug","text":"Easy. I just won't push anybody.","zh":"簡單。我不要推任何人就好了。"},{"t":"line","who":"system","ex":null,"text":"That's the spirit!","zh":"就是這種精神！"},{"t":"line","who":"","text":"The System doesn't sound sure.","zh":"系統聽起來不太有把握。"},{"t":"hide","who":"eve"},{"t":"bg","v":"garden"},{"t":"music","v":"waltz"},{"t":"line","who":"","text":"The Queen's garden is a sea of hats. A string quartet plays under the roses, and everyone holds a teacup and a secret.","zh":"王后的花園是一片帽子的海洋。弦樂四重奏在玫瑰下演奏，每個人手裡都端著一杯茶，心裡都藏著一個祕密。"},{"t":"line","who":"","text":"In the middle of it all stands the fountain. White stone, three levels, a stone swan on top. It looks innocent. It is not.","zh":"正中央立著那座噴泉。白色的石頭，三層，頂端一隻石天鵝。它看起來很無辜。它才不是。"},{"t":"line","who":"","text":"People step out of my way. A woman whispers my name, like a warning.","zh":"人們紛紛讓路給我。一位女士低聲念著我的名字，像在發出警告。"},{"t":"show","who":"lily","ex":"smile"},{"t":"gesture","who":"lily","g":"hop"},{"t":"line","who":"","text":"Then a girl in a pink dress walks right up to me. Brown hair, a simple ribbon, a nervous smile.","zh":"接著，一個穿粉紅洋裝的女孩直直走向我。棕色頭髮，一條簡單的緞帶，一抹緊張的微笑。"},{"t":"line","who":"","text":"Lily Bell. The [[heroine]]. By Chapter Three, everyone in this book loves her.","zh":"莉莉・貝爾。女主角。到了第三章，書裡每個人都愛她。"},{"t":"line","who":"lily","ex":"smile","text":"Lady Evangeline! I'm Lily. I just wanted to say hello. Your dress is so beautiful.","zh":"伊凡潔琳小姐！我是莉莉。我只是想來打聲招呼。您的禮服好美。"},{"t":"line","who":"","text":"In the book, Evangeline looks her up and down and says, \"Who let the country mouse in?\"","zh":"書裡，伊凡潔琳上下打量她，說：「誰把這隻鄉下老鼠放進來的？」"},{"t":"show","who":"eve","ex":"neutral"},{"t":"choice","opts":[{"text":"\"Thank you. Yours is lovely too. Pink really suits you.\"","tone":"sweet","fx":[{"k":"lily","d":1},{"k":"doom","d":-2}],"to":"lily_sweet","zh":"「謝謝妳。妳的也很漂亮，粉紅色真的很適合妳。」"},{"text":"\"Lily, listen to me. Stay away from that fountain today.\"","tone":"bold","fx":[{"k":"doom","d":-1}],"to":"lily_bold","zh":"「莉莉，聽我說。今天離那座噴泉遠一點。」"},{"text":"\"Walk with me? The roses on the other side are better.\"","tone":"sly","fx":[{"k":"doom","d":-1}],"to":"lily_sly","zh":"「陪我走走？另一邊的玫瑰更好看。」"}]},{"t":"gesture","who":"lily","g":"hop"},{"t":"line","who":"lily","ex":"smile","text":"Really? I made it myself!","zh":"真的嗎？這是我自己做的！"},{"t":"line","who":"eve","ex":"smile","text":"You made this? Lily, that's amazing.","zh":"這是妳做的？莉莉，太厲害了吧。"},{"t":"line","who":"","text":"She turns pink, the same color as her dress. Somewhere behind us, someone drops a teacup.","zh":"她的臉紅了，跟她的洋裝一樣粉。我們身後不知哪裡，有人摔了一個茶杯。"},{"t":"goto","to":"plot"},{"t":"line","who":"lily","ex":"shocked","text":"The… fountain?","zh":"那……噴泉？"},{"t":"line","who":"eve","ex":null,"text":"Just trust me.","zh":"相信我就對了。"},{"t":"line","who":"","text":"Lily looks at the fountain. Then she looks at me, like I have two heads.","zh":"莉莉看看噴泉，再看看我，好像我多長了一顆頭。"},{"t":"line","who":"lily","ex":"worried","text":"Okay…?","zh":"好……喔？"},{"t":"goto","to":"plot"},{"t":"line","who":"lily","ex":"smile","text":"Oh! I'd love to.","zh":"喔！我很樂意。"},{"t":"line","who":"","text":"I take her arm and walk her away from the fountain, slow and easy, like a sheepdog. Every step feels like a win.","zh":"我挽著她的手臂，帶她慢慢遠離噴泉，像一隻牧羊犬。每走一步都像打了一場勝仗。"},{"t":"goto","to":"plot"},{"t":"hide","who":"eve"},{"t":"line","who":"","text":"For ten whole minutes, nothing happens. Nobody pushes anybody. I start to breathe again.","zh":"整整十分鐘，什麼事都沒發生。沒有人推任何人。我終於又能呼吸了。"},{"t":"line","who":"","text":"But the garden paths curve and turn, and somehow every one of them leads back to the fountain.","zh":"可是花園的小徑彎來繞去，不知怎麼的，每一條都通回那座噴泉。"},{"t":"sfx","v":"crash"},{"t":"shake"},{"t":"line","who":"","text":"Then a little white dog [[shoots]] across the lawn. A lady screams. A waiter spins, and his tray of lemon cakes flies into the air.","zh":"接著，一隻小白狗一溜煙衝過草地。一位女士尖叫。一個侍者轉了一圈，他那盤檸檬蛋糕飛上了天。"},{"t":"line","who":"","text":"Lily steps back to get out of the way. One step. Two.","zh":"莉莉往後退，想讓開。一步。兩步。"},{"t":"line","who":"","text":"Her heel catches a cracked stone. Her arms fly up like wings.","zh":"她的鞋跟卡到一塊裂開的石頭。她的雙臂像翅膀一樣往上一揮。"},{"t":"line","who":"","text":"Behind her, the fountain. Of course it's the fountain.","zh":"她身後，就是噴泉。當然是噴泉。"},{"t":"sfx","v":"splash"},{"t":"hide","who":"lily"},{"t":"line","who":"","text":"SPLASH.","zh":"嘩啦！"},{"t":"music","v":"none"},{"t":"line","who":"","text":"The music stops. Two hundred heads turn.","zh":"音樂停了。兩百顆頭轉了過來。"},{"t":"line","who":"","text":"Not to Lily. To me.","zh":"不是看莉莉。是看我。"},{"t":"show","who":"eve","ex":"shocked"},{"t":"line","who":"","text":"I know that look. In the book, everyone wears it just before everything goes wrong.","zh":"我認得那種眼神。書裡，一切出錯之前，每個人臉上都是這種表情。"},{"t":"choice","opts":[{"text":"Jump in after her.","tone":"sweet","fx":[{"k":"doom","d":-8},{"k":"lily","d":1},{"flag":"fountain","v":"jump"}],"to":"f_jump","zh":"跟著跳下去。"},{"text":"Pull her out, then make the crowd laugh with her, not at her.","tone":"bold","fx":[{"k":"doom","d":-6},{"k":"lily","d":1},{"flag":"fountain","v":"joke"}],"to":"f_joke","zh":"把她拉出來，再讓大家跟她一起笑，而不是笑她。"},{"text":"Point at the cracked stone before anyone can blame you.","tone":"sly","fx":[{"k":"doom","d":-4},{"flag":"fountain","v":"stone"}],"to":"f_stone","zh":"趁還沒人怪到妳頭上，先指著那塊裂開的石頭。"}]},{"t":"sfx","v":"splash"},{"t":"hide","who":"eve"},{"t":"line","who":"","text":"I don't think. I jump.","zh":"我沒多想。我跳了下去。"},{"t":"line","who":"","text":"The water is cold, and it smells like old coins. My shoes fill up. My perfect curls go flat.","zh":"水好冰，有一股舊銅板的味道。我的鞋子灌滿了水。我完美的捲髮全塌了。"},{"t":"line","who":"","text":"I grab Lily under the arms and pull her up. She coughs. A wet rose petal sits on her nose.","zh":"我從腋下抱住莉莉，把她拉起來。她咳了幾聲。一片濕答答的玫瑰花瓣黏在她鼻子上。"},{"t":"show","who":"lily","ex":"teary"},{"t":"line","who":"lily","ex":"teary","text":"You… you jumped in?","zh":"妳……妳跳下來了？"},{"t":"line","who":"eve","ex":null,"text":"You looked like you needed company.","zh":"妳看起來需要有人陪。"},{"t":"line","who":"","text":"Two hundred people stare at two wet girls in a fountain. Nobody knows what to say. This never happened in the book.","zh":"兩百個人盯著噴泉裡兩個濕透的女孩，誰也不知道該說什麼。書裡從來沒有這一段。"},{"t":"sfx","v":"down"},{"t":"line","who":"system","ex":null,"text":"Ding! Unexpected action! Doom down 8%.","zh":"叮！出乎意料的行動！毀滅指數下降 8%。"},{"t":"goto","to":"cliff"},{"t":"hide","who":"eve"},{"t":"line","who":"","text":"I march to the fountain, reach in, and pull her out by both hands. She stands there, dripping, red to the ears.","zh":"我大步走到噴泉邊，伸手抓住她的雙手，把她拉了出來。她站在那裡，全身滴著水，紅到耳根。"},{"t":"line","who":"","text":"Somebody giggles. Then somebody else.","zh":"有人咯咯笑了。接著又有一個人。"},{"t":"line","who":"","text":"So I turn to the crowd and lift my chin.","zh":"於是我轉向人群，抬起下巴。"},{"t":"show","who":"eve","ex":"smug"},{"t":"line","who":"eve","ex":"smug","text":"Wet silk. It's very big this season. You'll all be wearing it by spring.","zh":"濕絲綢，是這一季最流行的。到了春天，你們每個人都會穿。"},{"t":"line","who":"","text":"One second. Two. Then the Queen laughs, a real laugh, and the whole garden laughs with her. With Lily. Not at her.","zh":"一秒。兩秒。接著王后笑了，是真心的笑，整座花園也跟著她一起笑。是跟莉莉一起笑，不是笑她。"},{"t":"show","who":"lily","ex":"teary"},{"t":"line","who":"lily","ex":"teary","text":"Thank you.","zh":"謝謝妳。"},{"t":"sfx","v":"down"},{"t":"line","who":"system","ex":null,"text":"Ding! Bold move! Doom down 6%.","zh":"叮！大膽的一步！毀滅指數下降 6%。"},{"t":"goto","to":"cliff"},{"t":"show","who":"eve","ex":"smug"},{"t":"line","who":"eve","ex":"smug","text":"Careful, everyone! This stone is cracked. Someone could get hurt!","zh":"大家小心！這塊石頭裂開了，會有人受傷的！"},{"t":"line","who":"","text":"I point at the crack. Two hundred heads turn, like birds on a wire.","zh":"我指著那道裂縫。兩百顆頭轉了過去，像電線上的一排鳥。"},{"t":"line","who":"","text":"A servant runs for the gardener. A lady cries, \"Shocking! In the Queen's own garden!\"","zh":"一個僕人跑去找園丁。一位女士驚呼：「太不像話了！竟然是在王后自己的花園裡！」"},{"t":"line","who":"","text":"Nobody looks at me now. Nobody looks at Lily either. She climbs out alone, dripping, and sits on the edge of the fountain.","zh":"現在沒人看我了。也沒人看莉莉。她獨自爬出來，全身滴著水，坐在噴泉邊上。"},{"t":"sfx","v":"down"},{"t":"line","who":"system","ex":null,"text":"Ding! Clever. Doom down 4%.","zh":"叮！聰明。毀滅指數下降 4%。"},{"t":"goto","to":"cliff"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"Chapter One event complete. Story [[pressure]] +3%.","zh":"第一章事件完成。故事壓力 +3%。"},{"t":"doom","d":3},{"t":"line","who":"eve","ex":"worried","text":"Story pressure? What does that—","zh":"故事壓力？那是什麼——"},{"t":"music","v":"tension"},{"t":"hide","who":"lily"},{"t":"hide","who":"eve"},{"t":"line","who":"","text":"Across the lawn, the crowd opens like a curtain.","zh":"草地另一頭，人群像布幕一樣向兩側分開。"},{"t":"show","who":"cedric","ex":"angry"},{"t":"gesture","who":"cedric","g":"enter"},{"t":"line","who":"","text":"A tall young man in a blue coat walks straight toward me. Golden hair, a face from the cover of a romance novel.","zh":"一個穿藍色外套的高個子年輕男人直直朝我走來。金色頭髮，一張從言情小說封面走出來的臉。"},{"t":"line","who":"","text":"Prince Cedric. My [[fiancé]].","zh":"賽德瑞克王子。我的未婚夫。"},{"t":"line","who":"","text":"He looks at the fountain. He looks at wet Lily. Then he looks at me.","zh":"他看看噴泉，看看濕透的莉莉，然後看向我。"},{"t":"line","who":"cedric","ex":"angry","text":"Evangeline!","zh":"伊凡潔琳！"},{"t":"gesture","who":"cedric","g":"shake"},{"t":"line","who":"cedric","ex":"angry","text":"What have you *done*?","zh":"妳做了什麼好事？"},{"t":"title","flag":"fountain","val":"jump","name":"Soggy Savior"},{"t":"title","flag":"fountain","val":"joke","name":"Trendsetter (Wet)"},{"t":"title","flag":"fountain","val":"stone","name":"Stone Inspector"},{"t":"end"}],"labels":{"pip_sweet":15,"pip_bold":19,"pip_sly":24,"mirror":29,"sys_bold":45,"sys_sly":47,"sys_sweet":50,"rules":52,"party":63,"lily_sweet":77,"lily_bold":82,"lily_sly":87,"plot":90,"f_jump":108,"f_joke":120,"f_stone":132,"cliff":140}}]};
/* ==== content/cast.js ==== */
/* Who speaks: the name tag, its color, and the read-aloud voice.
   g: f or m picks a voice from the device; p and r are pitch and rate.
   Eve and the narration (her thoughts) use the main voice. */
const CAST = {
  eve:{name:"Eve", color:"#E2BC62", main:true, p:1, r:1},
  pip:{name:"Pip", color:"#B9D3C2", g:"f", p:1.08, r:1.02},
  lily:{name:"Lily", color:"#F2A3BC", g:"f", p:1.14, r:.98, prefer:"en-AU"},

/* =========================================================
   THE VILLAINESS HAS READ THE BOOK — core helpers
   Storage, markup, glossary popovers and read-aloud.
   Ported from Window Seat: The Game (store, mk, openGloss) and the
   Window Seat textbooks' engine (voices, speakParts, nativeVoice, prosody).
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const PREFIX = "vil-";
const store = {
  get(k, d){ try{ const v = localStorage.getItem(PREFIX+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(PREFIX+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(PREFIX+k); }catch(e){} }
};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- story markup ----------------
   [[shown|key]] opens a gloss; *word* is italic. */
const RX = /\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g;
const SPOKEN = /\{\{([^|}]+)\|([^}]+)\}\}/g;   /* {{shown|spoken}}: the voice says the second word */
const plain = s => String(s).replace(SPOKEN, "$1").replace(RX, "$1").replace(/\*([^*]+)\*/g, "$1");
function mk(s){
  return esc(s).replace(SPOKEN, "$1").replace(RX, (m, disp, key)=>{
    key = key || disp.toLowerCase();
    const seen = (typeof S !== "undefined" && S && S.notes && S.notes.includes(key)) ? " seen" : "";
    return `<span class="g${seen}" role="button" tabindex="0" data-k="${esc(key)}">${disp}</span>`;
  }).replace(/\*([^*]+)\*/g, "<em>$1</em>");
}
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove("on"), 2400); }

/* ---------------- glossary popover ---------------- */
function openGloss(k, anchor){
  const g = GLOSS[k]; if(!g) return;
  if(typeof S !== "undefined" && S && !S.notes.includes(k)){ S.notes.push(k); if(typeof autosave === "function") autosave(); }
  const p = $("#pop");
  p.innerHTML = `<button class="ib x" data-close aria-label="Close">${ICON.x}</button>
    <div class="pw"><span class="w">${esc(g.w || k)}</span>${g.kk ? `<span class="k">${esc(g.kk)}</span>` : ""}
    <button class="ib" data-say="${esc(g.w || k)}" aria-label="Say it">${ICON.spk}</button></div>
    <div class="z">${esc(g.zh)}</div>${g.d ? `<div class="d">${esc(g.d)}</div>` : ""}`;
  const r = anchor.getBoundingClientRect();
  p.classList.add("on");
  const h = p.offsetHeight;
  p.style.top = (r.bottom + 8 + h > innerHeight ? Math.max(8, r.top - h - 8) : r.bottom + 8) + "px";
  anchor.classList.add("seen");
}
document.addEventListener("click", e=>{
  const g = e.target.closest(".g"); if(g){ e.stopPropagation(); e.preventDefault(); openGloss(g.dataset.k, g); return; }
  const sp = e.target.closest("[data-say]"); if(sp){ e.stopPropagation(); Voice.say(sp.dataset.say, sp.dataset.who || ""); return; }
  if((e.target.closest("[data-close]") || !e.target.closest("#pop")) && $("#pop").classList.contains("on")){ $("#pop").classList.remove("on"); e.stopPropagation(); }
}, true);

/* ---------------- read-aloud ----------------
   One voice per character, picked from the device's English voices by gender, with
   each character's pitch and rate. Names the voice gets wrong go in SAY_AS (respellings);
   words in another language go in FOREIGN and use that language's voice when the device has one. */
const Voice = (()=>{
  const SYN = window.speechSynthesis || null;
  let rate = store.get("rate", .9);
  const POOL = {all:[], f:[], m:[], main:null};
  const FEM = /Samantha|Martha|Catherine|Stephanie|Matilda|Ava|Allison|Susan|Zira|Aria|Jenny|Michelle|Emma|Joanna|Salli|Kendra|Kimberly|Ivy|Karen|Moira|Tessa|Victoria|Serena|Kate|Fiona|Veena|Libby|Sonia|Natasha|Nicky|Sara|Female|Google US English/i;
  const MAL = /Alex|Daniel|Tom|Aaron|Arthur|Rishi|David|Mark|Guy|Ryan|Eric|Christopher|Matthew|Joey|Justin|Brian|Oliver|Gordon|Lee|Evan|Nathan|Male/i;
  const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Ralph|Fred|Kathy|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
  /* 0 normal, 1 enhanced, 2 premium: iPhone gives enhanced voices the same name, so read the voiceURI too */
  const vq = v => { const s = (v.voiceURI || "") + " " + v.name; return /premium|高品質|優質/i.test(s) ? 2 : /enhanced|增強|加強|Natural|Neural|Online/i.test(s) ? 1 : 0; };
  function pick(){
    if(!SYN) return;
    /* American, British, Australian and Irish English first (the UK, Australian and Irish voices suit the court); other English last */
    const us = v => /^en[-_]US/i.test(v.lang) ? 0 : /^en[-_]GB/i.test(v.lang) ? 1 : /^en[-_]AU/i.test(v.lang) ? 2 : /^en[-_]IE/i.test(v.lang) ? 3 : 4;
    const vs = SYN.getVoices().filter(v=>/^en/i.test(v.lang) && !NOVELTY.test(v.name)).sort((a,b)=>us(a)-us(b) || vq(b)-vq(a));
    POOL.all = vs;
    /* characters get US, UK, Australian or Irish voices. With too few on the device, characters share a voice
       and differ by pitch. Other English voices only if none of those four are installed. */
    const usv = vs.filter(v=>us(v) <= 3), base = usv.length ? usv : vs;
    POOL.f = base.filter(v=>FEM.test(v.name)); POOL.m = base.filter(v=>!FEM.test(v.name) && MAL.test(v.name));
    if(!POOL.m.length) POOL.m = base.filter(v=>!FEM.test(v.name));
    POOL.main = vs.find(v=>us(v)===0 && /Samantha|Google US English|Aria|Jenny|Ava|Allison/i.test(v.name)) || POOL.f[0] || vs[0] || null;
  }
  if(SYN){ pick(); SYN.onvoiceschanged = pick; }
  function voiceFor(who){
    const own = store.get("voice-" + who, "");   /* the player picked this voice in Settings */
    if(own){ const v = POOL.all.find(x=>x.voiceURI === own); if(v) return v; }
    const c = CAST[who];
    if(!c || c.main || !c.g) return POOL.main;
    const pool = (c.g === "f" ? POOL.f : POOL.m).filter(v=>v !== POOL.main);
    if(!pool.length) return POOL.main;
    /* a character can ask for an accent first (CAST.prefer); without it, characters take turns through the pool */
    if(c.prefer){ const v = pool.find(x=>String(x.lang).replace("_","-").toLowerCase().startsWith(c.prefer.toLowerCase())); if(v) return v; }
    const same = Object.keys(CAST).filter(n=>!CAST[n].main && CAST[n].g === c.g);
    return pool[same.indexOf(who) % pool.length];
  }
  /* respellings for every voice, then any for this voice alone (each voice has its own dictionary, so a name one says right another says wrong) */
  const sayAs = (t, v) => { const own = v && SAY_AS_VOICE[v.name] || {};
    return Object.entries(Object.assign({}, SAY_AS, own)).reduce((x,[w,r])=>x.split(w).join(r), t); };
  const FOR = {}; Object.entries(FOREIGN).forEach(([k,v])=>{ FOR[k.toLowerCase()] = {lang:v[0], en:v[1], nat:v[2] || k}; });
  const FRX = Object.keys(FOR).length ? new RegExp("(^|[^\\p{L}])(" + Object.keys(FOR).sort((a,b)=>b.length-a.length)
    .map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")(?![\\p{L}])", "giu") : null;
  function nativeVoice(lang){
    if(!SYN || !lang) return null; const L = lang.toLowerCase(), base = L.split("-")[0];
    const vs = SYN.getVoices().filter(v=>!NOVELTY.test(v.name)), nm = v => String(v.lang).replace("_","-").toLowerCase();
    const best = a => a.slice().sort((x,y)=>vq(y)-vq(x))[0];
    return best(vs.filter(v=>nm(v) === L)) || best(vs.filter(v=>nm(v).split("-")[0] === base)) || null;
  }
  function speakParts(s, v){
    const raw = [];
    if(FRX){ let i = 0, m; FRX.lastIndex = 0;
      while((m = FRX.exec(s))){ const st = m.index + m[1].length;
        if(st > i) raw.push({t:s.slice(i, st)}); raw.push({t:m[2], f:FOR[m[2].toLowerCase()]}); i = st + m[2].length; FRX.lastIndex = i; }
      if(i < s.length) raw.push({t:s.slice(i)});
    } else raw.push({t:s});
    const parts = [];
    raw.forEach(p=>{ const nv = p.f && nativeVoice(p.f.lang);
      if(nv){ parts.push({t:p.f.nat, nv}); return; }
      const t = p.f ? p.f.en : sayAs(p.t, v), last = parts[parts.length-1];
      if(last && !last.nv) last.t += t; else parts.push({t}); });
    return parts.filter(p=>p.nv || /[\p{L}\p{N}]/u.test(p.t));
  }
  const speakable = t => plain(String(t).replace(SPOKEN, "$2")).replace(/[“”]/g,'"').replace(/[’‘]/g,"'").replace(/…/g,"...").replace(/—/g,", ");
  function sentences(t){ const s = speakable(t); return (s.match(/[^.!?]+(?:[.!?]+["']?|$)/g) || [s]).map(x=>x.trim()).filter(Boolean); }
  function prosody(sent, who){
    const c = CAST[who] || {p:1, r:1};
    let r = rate * (c.r || 1), p = c.p || 1;
    if(/!["']?$/.test(sent)){ r *= 1.05; p += .06; } else if(/\?["']?$/.test(sent)) p += .06;
    return {rate:clamp(r, .5, 1.5), pitch:clamp(p, .8, 1.25)};   /* compact voices turn cartoonish outside ~0.8–1.25 */
  }
  let qid = 0, onDone = null;
  function stop(){ qid++; if(SYN) SYN.cancel(); Audio2.duck(false); const f = onDone; onDone = null; if(f) f(); }
  /* speak a line, sentence by sentence, then call done() */
  function say(text, who, done){
    if(!SYN){ if(done) done(); return; }
    stop(); const id = ++qid; onDone = done || null;
    const q = [];
    sentences(text).forEach(s=>{ const pr = prosody(s, who), v = voiceFor(who);
      speakParts(s, v).forEach(p=>q.push({t:p.t, v:p.nv || v, lang:p.nv ? p.nv.lang : (v ? v.lang : "en-US"), pr})); });
    Audio2.duck(true);
    const next = () => {
      if(id !== qid) return;
      const it = q.shift();
      if(!it){ Audio2.duck(false); const f = onDone; onDone = null; if(f) f(); return; }
      const u = new SpeechSynthesisUtterance(it.t);
      if(it.v) u.voice = it.v; u.lang = it.lang; u.rate = it.pr.rate; u.pitch = it.pr.pitch;
      u.onend = u.onerror = next;
      SYN.speak(u);
    };
    next();
  }
  /* iOS needs one spoken utterance from a tap before later ones play */
  ["touchend","click"].forEach(t=>document.addEventListener(t, ()=>{ if(SYN && !window.__spk){ window.__spk = 1; try{ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; SYN.speak(u); }catch(e){} } }, true));
  /* for Settings: the English voices on this device, US first, and who uses which */
  const label = v => `${v.name} (${String(v.lang).replace("_","-")})${vq(v) === 2 ? " · Premium" : vq(v) === 1 ? " · Enhanced" : ""}`;
  function voices(){ return POOL.all.map(v=>({uri:v.voiceURI, label:label(v)})); }
  function current(who){ const v = voiceFor(who); return v ? v.voiceURI : ""; }
  function setVoice(who, uri){ if(uri) store.set("voice-" + who, uri); else store.del("voice-" + who); }
  return { say, stop, voices, current, setVoice, get rate(){ return rate; }, setRate(r){ rate = r; store.set("rate", r); }, get ok(){ return !!SYN; } };
})();

/* =========================================================
   Sound: the Lamplight FM music player (from Window Seat: The Game)
   plus short synthesized sound effects. One AudioContext for both.
   Music starts only after a tap, as browsers require.
   ========================================================= */
const Audio2 = (()=>{
  let ctx=null, bus, out, sfxOut, timer=null, cur=null, step=0, nextT=0, keeper=null, ducked=false, want=null;
  let vol = store.get("vol", 55) / 100, musicOn = store.get("music", false), sfxOn = store.get("sfx", true);
  const midi = n=>{ const m=/^([A-G])(#?)(\d)$/.exec(n); return 12*(+m[3]+1)+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0); };
  const hz = m=>440*Math.pow(2,(m-69)/12);
  const P = {
    ep:   {mods:[{r:1,i:1.6,d:.9},{r:14,i:.5,d:.07}], a:.004, dec:2.2, sus:0, g:.16, lp:3200},
    bell: {mods:[{r:3.5,i:2.6,d:1.6}], a:.002, dec:2.6, sus:0, g:.10, lp:6000},
    bass: {mods:[{r:1,i:2.2,d:.22}], a:.005, dec:.9, sus:.35, g:.24, lp:900},
    pad:  {mods:[{r:2,i:.7,d:9}], a:.9, dec:4, sus:.8, g:.07, lp:2400, det:6},
    mar:  {mods:[{r:4,i:2.4,d:.09}], a:.002, dec:.55, sus:0, g:.13, lp:4200},

      drops.forEach(d=>{ d.t = (d.t + .03) % 1; const tier = d.k % 3, sx = tier === 0 ? 160 + (d.k%2 ? 12 : -12) : tier === 1 ? 160 + (d.k%2 ? 27 : -27) : 160 + ((d.k*7)%40 - 20);
        const y0 = tier === 0 ? 98 : tier === 1 ? 120 : 76, y1 = tier === 0 ? 118 : tier === 1 ? 156 : 96;
        const y = y0 + (y1-y0)*d.t, x = sx + (tier === 2 ? 0 : (d.k%2 ? 1 : -1)*d.t*4);
        c.fillStyle = d.t < .5 ? "#E8F6FC" : "#A9DCEE"; c.fillRect(x|0, y|0, 1, 2); });
      c.fillStyle = "#FFFFFF"; for(let i=0;i<6;i++){ if((f + i*5) % 30 < 4) c.fillRect(110 + (i*19)%100, 155 + (i*3)%6, 2, 1); }
    }
    if(name === "title"){
      petals.forEach(p=>{ p.y += p.v; p.x += Math.sin(f*.04 + p.y*.05)*.4 - .15; if(p.y > H){ p.y = -4; p.x = Math.random()*W; }
        c.fillStyle = p.s ? "#E0566E" : "#F59AB4"; c.fillRect(p.x|0, p.y|0, 2, 1); if(p.s === 2) c.fillRect((p.x|0)+1, (p.y|0)+1, 1, 1); });
    }
  }
  return { portrait, bg, ambient, W, H, people:Object.keys(PEOPLE), exprs:Object.keys(EX), backgrounds:Object.keys(BG) };
})();

/* ==== engine/vn.js ==== */
/* =========================================================
   The story runner and the stage.
   S is the whole game state; it is autosaved after every line.
   ========================================================= */
let S = null;
const EP = n => STORY.episodes.find(e=>e.n === n) || null;
const VARS0 = {doom:87, sweet:0, bold:0, sly:0, lily:0, pip:0, rowan:0, cedric:0};
function newState(){
  const s = {v:1, ep:1, pc:0, vars:Object.assign({}, VARS0), sys:false, flags:{}, titles:[], done:[], stage:{bg:null, music:null, shown:[]},
    log:[], notes:[], echo:null, epStart:{}, ts:Date.now()};
  s.epStart[1] = snap(s);
  return s;
}
function snap(s){ return JSON.parse(JSON.stringify({vars:s.vars, sys:s.sys, flags:s.flags, titles:s.titles})); }
function autosave(){ if(S){ S.ts = Date.now(); store.set("auto", S); } }
const okSave = s => !!s && s.v === 1 && Number.isInteger(s.ep) && Number.isInteger(s.pc) && s.vars && typeof s.vars.doom === "number"
  && s.flags && typeof s.flags === "object" && Array.isArray(s.titles) && Array.isArray(s.done) && Array.isArray(s.log) && Array.isArray(s.notes) && s.stage && Array.isArray(s.stage.shown);

/* ---------------- the stage ---------------- */
const Stage = (()=>{
  let cv = null, c = null, bgName = null, shown = [], shakeT = 0, flashT = 0, frame = 0, last = 0, running = false, titleMode = false;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DUR = {hop:520, shake:480, tremble:1300, enter:520, nod:420};
  function attach(canvas){ cv = canvas; c = cv.getContext("2d"); c.imageSmoothingEnabled = false; if(!running){ running = true; requestAnimationFrame(loop); } }
  function setBg(name){ bgName = name; }
  function find(who){ return shown.find(p=>p.who === who); }
  function show(who, ex){ const p = find(who); if(p){ if(ex) p.ex = ex; return; }
    shown.push({who, ex:ex || "neutral", t0:performance.now(), g:null, blinkAt:performance.now() + 1500 + Math.random()*2500, x:null}); }
  function hide(who){ shown = shown.filter(p=>p.who !== who); }
  function expr(who, ex){ const p = find(who); if(p && ex) p.ex = ex; }
  function gesture(who, g){ const p = find(who); if(p) p.g = {name:g, t0:performance.now()}; }
  function clear(){ shown = []; }
  function shake(){ shakeT = performance.now(); }
  function flash(){ flashT = performance.now(); }
  function state(){ return shown.map(p=>[p.who, p.ex]); }
  function restore(list){ shown = []; (list || []).forEach(([w,e])=>show(w,e)); shown.forEach(p=>p.t0 = 0); }
  /* where portraits stand; in the garden a lone speaker steps aside so the fountain stays in view */
  function slots(n){ if(n === 1) return [bgName === "garden" ? 236 : 160]; return n === 2 ? [92, 228] : [62, 160, 258]; }
  function title(on){ titleMode = on; }
  function draw(now){
    if(!c) return;
    const W = Art.W, H = Art.H;
    let sx = 0, sy = 0;
    if(shakeT && now - shakeT < 420 && !reduce){ const p = (now - shakeT)/420; sx = Math.round(Math.sin(p*40)*3*(1-p)); sy = Math.round(Math.cos(p*33)*2*(1-p)); }
    c.setTransform(1,0,0,1,0,0); c.fillStyle = "#0E0A14"; c.fillRect(0,0,W,H);
    c.setTransform(1,0,0,1,sx,sy);
    const b = bgName && Art.bg(bgName); if(b) c.drawImage(b, 0, 0);
    if(bgName && !reduce) Art.ambient(c, bgName, frame);
    const xs = slots(shown.length);
    shown.forEach((p,i)=>{
      const blink = now > p.blinkAt && now < p.blinkAt + 130;
      if(now > p.blinkAt + 130) p.blinkAt = now + 2200 + Math.random()*3200;
      const img = Art.portrait(p.who, p.ex, blink && !reduce);
      const target = xs[i]; p.x = p.x == null ? target : p.x + (target - p.x)*.35;
      let ox = 0, oy = 0, alpha = p.t0 ? clamp((now - p.t0)/260, 0, 1) : 1;
      if(p.g && !reduce){ const d = DUR[p.g.name] || 500, t = (now - p.g.t0)/d;
        if(t >= 1) p.g = null;
        else if(p.g.name === "hop") oy = -Math.abs(Math.sin(t*Math.PI*2))*6;
        else if(p.g.name === "shake") ox = Math.sin(t*Math.PI*6)*4*(1-t);
        else if(p.g.name === "tremble") ox = Math.sin(now*.09)*1.1;
        else if(p.g.name === "nod") oy = Math.sin(t*Math.PI*2)*2;
        else if(p.g.name === "enter"){ const e = 1 - Math.pow(1-t, 3); ox = (1-e)*70; alpha = Math.min(alpha, t*1.6); } }
      c.globalAlpha = clamp(alpha, 0, 1);
      c.drawImage(img, Math.round(p.x - img.width/2 + ox), Math.round(H - img.height + oy));
      c.globalAlpha = 1;
    });
    if(flashT && now - flashT < 360){ c.globalAlpha = (1 - (now - flashT)/360)*.35; c.fillStyle = "#7FE3FF"; c.fillRect(0,0,W,H); c.globalAlpha = 1; }
  }
  function loop(now){ requestAnimationFrame(loop); if(now - last < 66) return; last = now; frame++; draw(now); }
  return {attach, setBg, show, hide, expr, gesture, clear, shake, flash, state, restore, title, get bg(){ return bgName; }};
})();

/* ---------------- the runner ---------------- */
const Run = (()=>{
  let typing = null, waiting = false, lastLine = null;
  const spd = () => ({slow:34, normal:20, fast:9, instant:0})[store.get("tspeed", "normal")];
  function doomTo(v){ const was = S.vars.doom; S.vars.doom = clamp(Math.round(v), 0, 100); UI.doom(was, S.vars.doom); }
  function apply(fx){ (fx || []).forEach(f=>{
    if(f.flag) S.flags[f.flag] = f.v;
    else if(f.k === "doom") doomTo(S.vars.doom + f.d);
    else S.vars[f.k] = clamp((S.vars[f.k] || 0) + f.d, f.k in {lily:1, pip:1, rowan:1, cedric:1} ? 0 : -99, f.k in {lily:1, pip:1, rowan:1, cedric:1} ? 3 : 999);
  }); }
  function go(){
    const ep = EP(S.ep);
    if(S.echo) return line({who:"eve", text:S.echo.text, zh:S.echo.zh, echo:true});
    for(let guard=0; guard<5000; guard++){
      const n = ep.nodes[S.pc];
      if(!n) return finish();
      if(n.t === "bg"){ S.stage.bg = n.v; Stage.setBg(n.v); S.pc++; continue; }
      if(n.t === "music"){ S.stage.music = n.v === "none" ? null : n.v; Audio2.music(S.stage.music); S.pc++; continue; }
      if(n.t === "sfx"){ Audio2.sfx(n.v); S.pc++; continue; }
      if(n.t === "show"){ Stage.show(n.who, n.ex); S.stage.shown = Stage.state(); S.pc++; continue; }
      if(n.t === "hide"){ Stage.hide(n.who); S.stage.shown = Stage.state(); S.pc++; continue; }
      if(n.t === "gesture"){ Stage.gesture(n.who, n.g); S.pc++; continue; }
      if(n.t === "shake"){ Stage.shake(); S.pc++; continue; }
      if(n.t === "doom"){ S.sys = true; doomTo(n.set != null ? n.set : S.vars.doom + n.d); S.pc++; continue; }
      if(n.t === "goto"){ S.pc = ep.labels[n.to]; continue; }
      if(n.t === "title"){ if(S.flags[n.flag] === n.val && !S.titles.some(t=>t.name === n.name)) S.titles.push({name:n.name, ep:S.ep}); S.pc++; continue; }
      if(n.t === "line") return line(n);
      if(n.t === "choice") return choice(n);
      if(n.t === "end") return finish();
      S.pc++;
    }
  }
  function line(n){
    if(n.ex && n.who) Stage.expr(n.who, n.ex), S.stage.shown = Stage.state();
    if(n.who === "system") Stage.flash();
    const key = S.ep + ":" + S.pc + (n.echo ? "e" : "");
    if(S.logKey !== key){ S.logKey = key; S.log.push({who:n.who || "", text:n.text, zh:n.zh || ""}); if(S.log.length > 300) S.log.shift(); }
    lastLine = n; autosave();
    UI.line(n);
    type($("#txt"));
    if(store.get("autoread", false)) Voice.say(n.text, n.who || "eve");
    waiting = true;
  }
  /* the typewriter reveals text nodes one character at a time, so tooltip words stay tappable */
  function type(el){
    if(typing){ clearInterval(typing.t); typing = null; }
    const ms = spd(); if(!ms){ UI.typed(); return; }
    const nodes = []; const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let nd;
    while((nd = tw.nextNode())) nodes.push({n:nd, s:nd.nodeValue}), nd.nodeValue = "";
    let i = 0, k = 0;
    typing = {nodes, t:setInterval(()=>{
      for(let step=0; step<2; step++){
        if(i >= nodes.length){ clearInterval(typing.t); typing = null; UI.typed(); return; }
        const o = nodes[i]; k++; o.n.nodeValue = o.s.slice(0, k);
        if(k >= o.s.length){ i++; k = 0; }
      } }, ms)};
    UI.typing();
  }
  function finishTyping(){ if(!typing) return false; clearInterval(typing.t); typing.nodes.forEach(o=>o.n.nodeValue = o.s); typing = null; UI.typed(); return true; }
  function next(){
    if(!waiting) return;
    if(finishTyping()) return;
    waiting = false; Voice.stop();
    if(S.echo){ const to = S.echo.to; S.echo = null; S.pc = EP(S.ep).labels[to]; }
    else S.pc++;
    Audio2.sfx("page");
    go();
  }
  function choice(n){
    waiting = false; autosave();
    UI.choices(n, lastLine, k=>{
      const o = n.opts[k];
      Audio2.sfx("choose");
      if(o.tone) S.vars[o.tone] = (S.vars[o.tone] || 0) + 1;
      apply(o.fx);
      const q = /^["“](.*)["”]$/.exec(o.text);
      if(q){ S.echo = {text:q[1], to:o.to, zh:(o.zh || "").replace(/^「|」$/g, "")}; }
      else { S.log.push({who:"", text:"→ " + o.text, zh:o.zh || ""}); S.pc = EP(S.ep).labels[o.to]; }
      go();
    });
  }
  function finish(){
    waiting = false;
    if(!S.done.includes(S.ep)) S.done.push(S.ep);
    autosave(); UI.endCard();
  }
  function start(n, fresh){
    const ep = EP(n); if(!ep) return;
    S.ep = n; S.pc = 0; S.echo = null;
    if(fresh) S.epStart[n] = snap(S);
    S.stage = {bg:null, music:null, shown:[]}; Stage.clear(); Stage.setBg(null);
    UI.game(); go();
  }
  /* pick up a saved game: rebuild the stage, then show the line it stopped on */
  function resume(){
    S.log = S.log.filter((l,i,a)=>!(i && a[i-1].text === l.text && a[i-1].who === l.who));
    Stage.setBg(S.stage.bg); Stage.restore(S.stage.shown); Audio2.music(S.stage.music);
    UI.game();
    if(S.done.includes(S.ep) && !EP(S.ep).nodes[S.pc]) return UI.endCard();
    go();
  }
  return {go, next, start, resume, get waiting(){ return waiting; }, get last(){ return lastLine; }};
})();

/* ==== engine/ui.js ==== */
/* =========================================================
   Screens and windows: title, the game screen, menus, saves,
   settings, the status window and the end-of-episode card.
   ========================================================= */
const UI = (()=>{
  const SLOTS = 3;
  const zhOn = () => store.get("zh", false);   /* Chinese under each line: off unless the player turns it on */
  const epTitle = n => SEASONS[0].eps[n-1] || "";
  const unlocked = n => n === 1 || (S && S.done.includes(n-1)) || store.get("seen", []).includes(n);
  const fmtDate = ts => { const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
  function show(id){ ["title","game"].forEach(s=>$("#"+s).hidden = s !== id); }

  /* ---------------- modal windows ---------------- */
  function modal(html, ready, cls){
    const m = $("#modal"); m.querySelector(".box").className = "box " + (cls || "");
    m.querySelector(".box").innerHTML = html; m.hidden = false;
    const x = m.querySelector("[data-x]"); if(x) x.onclick = closeModal;
    if(ready) ready(m.querySelector(".box"));
  }
  function closeModal(){ $("#modal").hidden = true; }
  const head = t => `<div class="mh"><h2>${esc(t)}</h2><button class="ib" data-x aria-label="Close">${ICON.x}</button></div>`;

  /* ---------------- title ---------------- */
  function title(){
    show("title"); Stage.attach($("#tcv")); Stage.setBg("title"); Stage.restore([["eve","smug"]]);
    const auto = store.get("auto", null), has = okSave(auto);
    $("#tbtns").innerHTML = `${has ? `<button class="btn" id="tCont">Continue<small>Episode ${auto.ep} · ${esc(epTitle(auto.ep))}</small></button>` : ""}
      <button class="btn ${has ? "alt" : ""}" id="tNew">New game</button>
      <div class="row"><button class="btn alt sm" id="tLoad">Load</button><button class="btn alt sm" id="tEps">Episodes</button><button class="btn alt sm" id="tSet">Settings</button></div>`;
    Audio2.music("title"); Audio2.ui();
    if(has) $("#tCont").onclick = ()=>{ S = auto; Audio2.sfx("title"); Run.resume(); };
    $("#tNew").onclick = ()=>{ const go = ()=>{ S = newState(); Audio2.sfx("title"); Run.start(1, false); };
      if(has) confirmBox("Start a new game? Your autosave will be replaced. Saved slots stay.", "New game", go); else go(); };
    $("#tLoad").onclick = ()=>slots("load");
    $("#tEps").onclick = episodes;
    $("#tSet").onclick = settings;
  }
  function confirmBox(msg, yes, fn){
    modal(`<p class="msg">${esc(msg)}</p><div class="row end"><button class="btn alt" data-x>Cancel</button><button class="btn" id="cYes">${esc(yes)}</button></div>`,
      box=>{ box.querySelector("#cYes").onclick = ()=>{ closeModal(); fn(); }; }, "small");
  }

  /* ---------------- the game screen ---------------- */
  function game(){
    show("game"); Stage.attach($("#cv"));
    $("#epl").textContent = `Episode ${S.ep} · ${epTitle(S.ep)}`;
    doom(null, S.vars.doom); Audio2.ui();
  }
  function line(n){
    const box = $("#box"), c = CAST[n.who];
    box.className = "box" + (n.who === "system" ? " sys" : n.who ? " talk" : " narr");
    const tag = $("#tag");
    if(n.who && c){ tag.hidden = false; tag.textContent = n.who === "system" ? "◆ SYSTEM" : c.name; tag.style.setProperty("--tc", c.color); } else tag.hidden = true;
    $("#txt").innerHTML = mk(n.text);
    const zh = $("#zh"); zh.textContent = n.zh || ""; zh.hidden = !(zhOn() && n.zh); zh.classList.add("wait");
    $("#choices").hidden = true; $("#txt").hidden = false; $("#ctx").hidden = true;
    $("#rd").dataset.say = n.text; $("#rd").dataset.who = n.who || "eve"; $("#rd").hidden = false;
  }
  function typing(){ $("#box").classList.remove("ready"); }
  function typed(){ $("#box").classList.add("ready"); $("#zh").classList.remove("wait"); }
  function choices(n, last, pick){
    const box = $("#box"); box.className = "box choose"; $("#tag").hidden = true; $("#rd").hidden = true;
    $("#txt").hidden = true; $("#zh").hidden = true;
    const ctx = $("#ctx"); if(last){ ctx.hidden = false; ctx.innerHTML = mk(last.text); } else ctx.hidden = true;
    const ch = $("#choices"); ch.hidden = false;
    ch.innerHTML = n.opts.map((o,k)=>`<button class="opt" data-k="${k}">${mk(o.text)}${zhOn() && o.zh ? `<span class="ozh">${esc(o.zh)}</span>` : ""}</button>`).join("");
    ch.querySelectorAll(".opt").forEach(b=>b.onclick = e=>{ if(e.target.closest(".g")) return; ch.querySelectorAll(".opt").forEach(x=>x.disabled = true); pick(+b.dataset.k); });
  }
  /* the Doom meter: hidden until the System first switches on */
  let doomAnim = 0;
  function doom(from, to){
    const m = $("#doom"); if(!S || !S.sys){ m.hidden = true; return; }
    m.hidden = false; const fill = m.querySelector("i"), num = m.querySelector("b");
    fill.style.width = to + "%"; m.classList.toggle("hot", to >= 75); m.classList.toggle("cool", to < 40);
    if(from == null || from === to){ num.textContent = to + "%"; return; }
    m.classList.remove("bump-up","bump-down"); void m.offsetWidth; m.classList.add(to > from ? "bump-up" : "bump-down");
    cancelAnimationFrame(doomAnim); const t0 = performance.now();
    const step = now=>{ const p = Math.min(1, (now - t0)/700); num.textContent = Math.round(from + (to-from)*p) + "%"; if(p < 1) doomAnim = requestAnimationFrame(step); };
    doomAnim = requestAnimationFrame(step);
  }

  /* ---------------- end of an episode ---------------- */
  function endCard(){
    const n = S.ep, next = EP(n+1), got = S.titles.filter(t=>t.ep === n);
    if(next){ const seen = store.get("seen", []); if(!seen.includes(n+1)){ seen.push(n+1); store.set("seen", seen); } }
    modal(`<div class="endc"><p class="kick">Episode ${n} complete</p><h2>${esc(epTitle(n))}</h2>
      <div class="sysw"><div class="sh">◆ SYSTEM</div><p>Ding! Chapter survived.</p>
      <div class="dm"><span>Doom</span><div class="bar"><i style="width:${S.vars.doom}%"></i></div><b>${S.vars.doom}%</b></div>
      ${got.map(t=>`<p class="ttl">New title: <b>${esc(t.name)}</b></p>`).join("")}</div>
      ${next ? "" : `<p class="msg">Episode ${n+1}, <i>${esc(epTitle(n+1))}</i>, is on its way.</p>`}
      <div class="col">${next ? `<button class="btn" id="eNext">Continue to Episode ${n+1}</button>` : ""}
      <button class="btn ${next ? "alt" : ""}" id="eSave">Save and exit</button></div></div>`, box=>{
      if(next) box.querySelector("#eNext").onclick = ()=>{ closeModal(); Run.start(n+1, true); };
      box.querySelector("#eSave").onclick = ()=>slots("save", ()=>{ closeModal(); Voice.stop(); title(); });
    }, "end");
    Audio2.sfx("ding");
  }

  /* ---------------- menu ---------------- */
  function menu(){
    modal(head("Menu") + `<div class="col">
      <button class="btn alt" data-x>Resume</button>
      <button class="btn alt" id="mStat">Status</button>
      <button class="btn alt" id="mLog">Story log</button>
      <button class="btn alt" id="mSave">Save game</button>
      <button class="btn alt" id="mLoad">Load game</button>
      <button class="btn alt" id="mSet">Settings</button>
      <button class="btn alt" id="mTitle">Title screen</button></div>`, box=>{
      box.querySelector("#mStat").onclick = status;
      box.querySelector("#mLog").onclick = log;
      box.querySelector("#mSave").onclick = ()=>slots("save");
      box.querySelector("#mLoad").onclick = ()=>slots("load");
      box.querySelector("#mSet").onclick = settings;
      box.querySelector("#mTitle").onclick = ()=>{ autosave(); closeModal(); Voice.stop(); title(); };
    });
  }
  function status(){
    const d = S.vars.doom;
    modal(head("Status") + `<div class="sysw"><div class="sh">◆ DOOM PREVENTION SYSTEM v2.3 (Beta)</div>
      ${S.sys ? `<div class="dm big"><span>Doom</span><div class="bar"><i style="width:${d}%"></i></div><b>${d}%</b></div>
      <p>${d >= 75 ? "Warning! Your story still ends in the Frost Isles. Surprise it!" : d >= 40 ? "The story is bending. Keep going!" : "The story barely knows you. Excellent!"}</p>` : `<p>System offline. (Have you looked in a mirror yet?)</p>`}
      <div class="sh">TITLES</div>${S.titles.length ? `<ul class="tl">${S.titles.map(t=>`<li>${esc(t.name)} <small>Ep ${t.ep}</small></li>`).join("")}</ul>` : `<p class="dim">No titles yet.</p>`}</div>
      <h3>Words you looked up</h3>${S.notes.length ? `<ul class="nb">${S.notes.map(k=>GLOSS[k] ? `<li><span class="g seen" role="button" tabindex="0" data-k="${esc(k)}">${esc(GLOSS[k].w)}</span><span>${esc(GLOSS[k].zh)}</span></li>` : "").join("")}</ul>` : `<p class="dim">Tap a dotted word in the story to see what it means. It will show up here.</p>`}`);
  }
  function log(){
    modal(head("Story log") + `<div class="lg">${S.log.slice(-120).map(l=>{ const c = CAST[l.who];
      return `<div class="le ${l.who === "system" ? "sys" : ""}">${c ? `<b style="color:${c.color}">${esc(l.who === "system" ? "SYSTEM" : c.name)}</b>` : ""}<p>${mk(l.text)}</p>${zhOn() && l.zh ? `<p class="lzh">${esc(l.zh)}</p>` : ""}${l.text.startsWith("→") ? "" : `<button class="ib sm" data-say="${esc(l.text)}" data-who="${esc(l.who || "eve")}" aria-label="Read aloud">${ICON.spk}</button>`}</div>`; }).join("")}</div>`,
      box=>{ const lg = box.querySelector(".lg"); lg.scrollTop = lg.scrollHeight; }, "tall");
  }

  /* ---------------- saves ---------------- */
  function slots(mode, after){
    const list = [...Array(SLOTS).keys()].map(i=>store.get("slot"+(i+1), null));
    modal(head(mode === "save" ? "Save game" : "Load game") + `<div class="col">${list.map((s,i)=>{ const ok = okSave(s);
      return `<button class="slot" data-i="${i}" ${mode === "load" && !ok ? "disabled" : ""}><b>Slot ${i+1}</b>${ok ? `<span>Episode ${s.ep} · ${esc(epTitle(s.ep))}</span><small>Doom ${s.vars.doom}% · ${fmtDate(s.ts)}</small>` : `<span class="dim">Empty</span>`}</button>`; }).join("")}
      ${mode === "load" ? `<button class="btn alt sm" id="sFile">Load a save file</button><input type="file" id="sIn" accept=".json,application/json" hidden>` : ""}</div>`, box=>{
      box.querySelectorAll(".slot").forEach(b=>b.onclick = ()=>{
        const i = +b.dataset.i, s = list[i];
        if(mode === "save"){ const put = ()=>{ S.ts = Date.now(); store.set("slot"+(i+1), S); autosave(); toast(`Saved in slot ${i+1}`); closeModal(); if(after) after(); };
          if(okSave(s)) confirmBox(`Replace the game in slot ${i+1}?`, "Replace", put); else put(); }
        else { useSave(s); }
      });
      const f = box.querySelector("#sFile"); if(f){ const inp = box.querySelector("#sIn"); f.onclick = ()=>inp.click();
        inp.onchange = ()=>{ const file = inp.files && inp.files[0]; if(!file) return;
          file.text().then(t=>{ let s = null; try{ s = JSON.parse(t); }catch(e){} if(!okSave(s)) return toast("That file isn't a save from this game."); useSave(s); }).catch(()=>toast("That file couldn't be read.")); inp.value = ""; }; }
    });
  }
  function useSave(s){ closeModal(); Voice.stop(); S = JSON.parse(JSON.stringify(s)); autosave(); Run.resume(); toast("Game loaded"); }
  async function downloadSave(){
    if(!S) return;
    const name = `villainess-save-ep${S.ep}.json`, data = JSON.stringify(S);
    let dl = null;
    try{ if(window.claude && window.claude.use) dl = await window.claude.use("downloads"); }catch(e){ dl = null; }
    if(dl){ try{ await dl.save({filename:name, data}); }catch(e){ if(!e || e.code !== "declined") toast("The download didn't work."); } return; }
    try{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type:"application/json"})); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); }catch(e){ toast("The download didn't work."); }
  }

  /* ---------------- episodes ---------------- */
  function episodes(){
    const eps = SEASONS[0].eps;
    modal(head("Season 1") + `<div class="col">${eps.map((t,i)=>{ const n = i+1, ok = unlocked(n) && EP(n);
      return `<button class="slot" data-n="${n}" ${ok ? "" : "disabled"}><b>Episode ${n}</b><span>${ok ? esc(t) : unlocked(n) ? "Coming soon" : "Locked"}</span></button>`; }).join("")}</div>`, box=>{
      box.querySelectorAll(".slot").forEach(b=>b.onclick = ()=>{ const n = +b.dataset.n;
        const go = ()=>{ closeModal(); if(!S) S = store.get("auto", null) || newState(); if(!okSave(S)) S = newState();
          const st = S.epStart[n]; if(st){ S.vars = Object.assign({}, st.vars); S.sys = st.sys; S.flags = Object.assign({}, st.flags); S.titles = st.titles.slice(); }
          Run.start(n, !st); };
        confirmBox(`Play Episode ${n} from the start? Your choices from then on will replace the later ones.`, "Play", go); });
    });
  }

  /* ---------------- settings ---------------- */
  function settings(){
    const ts = store.get("tspeed", "normal"), ar = store.get("autoread", false), r = Voice.rate;
    const seg = (id, opts, cur) => `<div class="seg" id="${id}">${opts.map(([v,l])=>`<button data-v="${v}" class="${String(v) === String(cur) ? "on" : ""}">${l}</button>`).join("")}</div>`;
    modal(head("Settings") + `<div class="set">
      <div class="sr"><span>Music</span><button class="btn alt sm" data-music>♪ ${Audio2.musicOn ? "On" : "Off"}</button></div>
      <div class="sr"><label for="vol">Volume</label><input type="range" id="vol" min="0" max="100" value="${Math.round(Audio2.vol*100)}"></div>
      <div class="sr"><span>Sound effects</span>${seg("sSfx", [[1,"On"],[0,"Off"]], Audio2.sfxOn ? 1 : 0)}</div>
      <div class="sr"><span>Text speed</span>${seg("sTs", [["slow","Slow"],["normal","Normal"],["fast","Fast"],["instant","Instant"]], ts)}</div>
      <div class="sr"><span>Chinese translation<small class="dim sub">For players below B1</small></span>${seg("sZh", [[1,"On"],[0,"Off"]], store.get("zh", false) ? 1 : 0)}</div>
      ${Voice.ok && Voice.voices().length ? `<details class="vz"><summary>Character voices</summary>
        <p class="dim">American, British, Australian and Irish voices are listed first. If a character mispronounces a word, try another voice here.</p>
        ${["eve","pip","lily","cedric","system"].map(w=>`<div class="vr"><label for="v-${w}">${esc(w === "eve" ? "Eve and the narration" : CAST[w].name === "SYSTEM" ? "The System" : CAST[w].name)}</label>
          <div class="vrow"><select id="v-${w}" data-w="${w}"><option value="">Automatic</option>${Voice.voices().map(v=>`<option value="${esc(v.uri)}" ${store.get("voice-"+w, "") === v.uri ? "selected" : ""}>${esc(v.label)}</option>`).join("")}</select>
          <button class="ib sm" data-try="${w}" aria-label="Try this voice">${ICON.spk}</button></div>
          <small class="dim now" data-now="${w}"></small></div>`).join("")}</details>` : ""}
      <div class="sr"><span>Read every line aloud</span>${seg("sAr", [[1,"On"],[0,"Off"]], ar ? 1 : 0)}</div>
      <div class="sr"><span>Voice speed</span>${seg("sVr", [[.75,"Slow"],[.9,"Normal"],[1.05,"Fast"]], [.75,.9,1.05].reduce((a,b)=>Math.abs(b-r) < Math.abs(a-r) ? b : a))}</div>
      ${S ? `<div class="sr col2"><span>Save file</span><p class="dim">Keep your game as a file, then load it on any device.</p><button class="btn alt sm" id="sDl">Download save</button></div>` : ""}
      ${Voice.ok ? "" : `<p class="dim">This browser can't read aloud.</p>`}</div>`, box=>{
      const segs = (id, fn)=>box.querySelectorAll(`#${id} button`).forEach(b=>b.onclick = ()=>{ box.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle("on", x === b)); fn(b.dataset.v); });
      segs("sSfx", v=>Audio2.setSfx(v === "1"));
      segs("sTs", v=>store.set("tspeed", v));
      segs("sAr", v=>store.set("autoread", v === "1"));
      segs("sZh", v=>{ store.set("zh", v === "1"); refreshZh(); });
      const SAMPLE = {eve:"I know this face. I read about it last night.", pip:"Good morning, my lady. I brought your tea.", lily:"Your dress is so beautiful.", cedric:"Evangeline! What have you done?", system:"Ding! Welcome to the Doom Prevention System."};
      const nowLbl = w=>{ const el = box.querySelector(`[data-now="${w}"]`); if(!el) return; const u = Voice.current(w), v = Voice.voices().find(x=>x.uri === u); el.textContent = v ? "Now: " + v.label : ""; };
      box.querySelectorAll("select[data-w]").forEach(s=>{ nowLbl(s.dataset.w); s.onchange = ()=>{ Voice.setVoice(s.dataset.w, s.value); nowLbl(s.dataset.w); Voice.say(SAMPLE[s.dataset.w], s.dataset.w); }; });
      box.querySelectorAll("[data-try]").forEach(b=>b.onclick = ()=>Voice.say(SAMPLE[b.dataset.try], b.dataset.try));
      segs("sVr", v=>{ Voice.setRate(+v); Voice.say("Ding! This is how I sound.", "system"); });
      box.querySelector("#vol").oninput = e=>Audio2.setVol(e.target.value/100);
      const dl = box.querySelector("#sDl"); if(dl) dl.onclick = downloadSave;
      box.querySelector("[data-music]").addEventListener("click", ()=>setTimeout(()=>{ const b = box.querySelector("[data-music]"); if(b) b.textContent = "♪ " + (Audio2.musicOn ? "On" : "Off"); }, 0));
    });
  }

  /* the setting takes effect on the line already on screen */
  function refreshZh(){
    const last = Run.last, zh = $("#zh");
    if(last && !$("#txt").hidden){ zh.textContent = last.zh || ""; zh.hidden = !(zhOn() && last.zh); zh.classList.remove("wait"); }
    $$("#choices .opt").forEach(b=>{ const s = b.querySelector(".ozh"); if(s) s.hidden = !zhOn(); });
  }

  /* ---------------- wiring ---------------- */
  document.addEventListener("click", e=>{
    const mu = e.target.closest("[data-music]"); if(mu){ Audio2.toggle(); return; }
  });
  function wire(){
    $("#menuBtn").onclick = menu;
    $("#doom").onclick = status;
    const adv = e=>{ if(e.target.closest(".g,button,#pop")) return; if(!$("#modal").hidden) return; Run.next(); };
    $("#cv").addEventListener("click", adv); $("#box").addEventListener("click", adv);
    document.addEventListener("keydown", e=>{
      if(!$("#modal").hidden){ if(e.key === "Escape") closeModal(); return; }
      if($("#game").hidden) return;
      if(e.key === " " || e.key === "Enter"){ if(document.activeElement && document.activeElement.closest(".opt,button")) return; e.preventDefault(); Run.next(); }
    });
    $("#modal").addEventListener("click", e=>{ if(e.target.id === "modal") closeModal(); });
  }
  return {title, game, line, typing, typed, choices, doom, endCard, wire, closeModal};
})();

/* ==== engine/main.js ==== */
/* boot */
UI.wire();
UI.title();

</script>
</body>
</html>

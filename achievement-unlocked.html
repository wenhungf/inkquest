  <p>The moment your foot crosses into the Dragon's mouth, the green mark blooms on the inner wall, bright and sure. You walk the curving path through the belly of the tower and out through the Tiger's mouth, the way the city has done it for a hundred years, and the system pings — warm, approving.</p>
  ${sysBox('✅ LINK 1 COMPLETE','Read correctly',[
    ['flair',vb('Stamina','stamina')+' \u221210 \u00b7 +15 (you feel good)'],
    ['flair','Clean. Link 2 unlocked.']
  ])}
  <p>The chain's lesson lands: the marks are not random. They hide in the way each place already works. Read the place, find the mark.</p>`,
 onEnter:()=>{ state.stamina = 105; },
 choices:[ {t:'A second mark?', go:'e4s7'} ]
},

e4s6_tiger:{
 onEnter:()=>{ state.flags.chain_perfect = false; },
 html:()=>`
  <p>The Tiger is closer, so you duck in there — and a small green glow flickers deep inside, then <i>fades,</i> like the system is shaking its head.</p>
  <p>Wrong way. The sign told you: the dragon takes you <i>in.</i> You entered through the tiger and ran the whole thing backward. The mark will not show itself to someone who walks against the old order.</p>
  ${sysBox('\u26a0 STUMBLE','You read the place wrong.',[
    ['flair','The chain holds \u2014 but a clean run is no longer possible.'],
    ['flair','Walk back. Enter through the Dragon, the right way.']
  ],'fail')}
  <p>You backtrack, losing a few minutes you may want later, and enter the Dragon's mouth properly. This time the mark blooms at once.</p>`,
 choices:[ {t:'A second mark?', go:'e4s7' } ]
},

e4s7:{
 html:()=>`
  <p>With link one done, the system murmurs something extra — quieter, optional.</p>
  ${sysBox('\u2728 BONUS MARK','Somewhere around the pond',[
    ['flair','A hidden mark waits nearby. Find it for a '+vb('stamina','stamina')+' boost.'],
    ['flair','But it will cost you time. The day is long; the sun still moves.']
  ])}
  <p>A choice. It is still early, and your legs are fresh, but the chain has a sunset at the end of it. Spend five, ten minutes hunting a bonus now to bank some energy — or save the time and trust your legs to last?</p>`,
 choices:[
   {t:'Hunt the bonus mark. Bank some energy.', go:'e4s7_bonus'},
   {t:'Skip it. Keep your time.', go:'e4s8'}
 ]
},

e4s7_bonus:{
 onEnter:()=>{ state.stamina = Math.min(130, state.stamina + 20); state.flags.e4_banked = true; },
 html:()=>`
  <p>You circle the pond, reading the place the way the towers taught you, and find the bonus mark tucked behind a stone lion that has watched the water for longer than anyone remembers. The system pings, pleased.</p>
  ${sysBox('\u2728 BONUS FOUND','Stamina banked',[
    ['flair',vb('Stamina','stamina')+' +20 \u00b7 you have a buffer now'],
    ['flair','Time spent: about ten minutes.']
  ])}
  <p>Ten minutes gone, but your legs have a cushion for whatever the day throws at them. You hope it was the right call. You will find out.</p>`,
 choices:[ {t:'On to link two', go:'e4s8'} ]
},

e4s8:{
 html:()=>`
  ${sysBox('\ud83d\udd17 LINK 2 of 5','Cijin \u2014 the old fort',[
    ['flair','The mark is on the island. Sunset is moving.'],
    ['flair','Get yourself to the Gushan ferry. How is up to you.']
  ])}
  <p>The mark for link two is across the water, on Cijin. First you have to get from the Lotus Pond down to the Gushan ferry pier — a real distance, and the day's clock is already ticking.</p>
  <p>Three ways to make the trip. You weigh them in your head:</p>
  ${sysBox('\ud83d\ude95 YOUR OPTIONS','Time \u00b7 money \u00b7 risk',[
    ['flair','TAXI \u2014 about 20 min if the roads are clear. Costs the most. Could hit traffic.'],
    ['flair','BUS \u2014 about 35 min, if one comes soon. Cheap. Steady.'],
    ['flair','MRT + shared bike \u2014 about 48 min. Cheapest. No surprises.']
  ])}`,
 choices:[
   {t:'Taxi. Gamble on a clear road.', go:'e4s8_taxi'},
   {t:'Bus. The middle path.', go:'e4s8_bus'},
   {t:'MRT and a YouBike. Slow and sure.', go:'e4s8_mrt'}
 ]
},

e4s8_taxi:{
 onEnter:()=>{ state.money -= 250; state.flags.e4_time = 'fast'; },
 html:()=>`
  <p>You flag a taxi. The driver knows the back roads, the meter ticks up, and the harbor slides past the window. Twenty minutes, clean — the gamble pays off, no traffic today. It cost you a few hundred dollars you will feel later, but you are at the ferry pier with the most precious thing of all in your pocket: <i>time.</i></p>
  <p>The boat is loading.</p>`,
 choices:[ {t:'Board the ferry', go:'e4s9'} ]
},

e4s8_bus:{
 onEnter:()=>{ state.flags.e4_time = 'mid'; },
 html:()=>`
  <p>The bus comes within a few minutes — lucky — and you settle by the window for the ride south. Thirty-five minutes, steady and cheap, the city rolling by in no particular hurry. Not the fastest, not the slowest. A fair trade.</p>
  <p>You reach the pier with enough time, if not a lot of it. The boat is loading.</p>`,
 choices:[ {t:'Board the ferry', go:'e4s9'} ]
},

e4s8_mrt:{
 onEnter:()=>{ state.stamina = Math.max(10, state.stamina - 8); state.flags.e4_time = 'slow'; },
 html:()=>`
  <p>You take the sure thing: a shared bike from the Lotus Pond to the nearest MRT station, then the train south, then a short walk from the station to the ferry pier. Forty-eight minutes, the cheapest way, and not a single surprise — but the clock has moved more than you would like, and your legs did some of the work the engine could have done.</p>
  <p>You reach the pier. The boat is loading.</p>`,
 choices:[ {t:'Board the ferry', go:'e4s9'} ]
},

e4s9:{
 html:()=>`
  <p>This is not the slow crossing from before. No standing at the rail watching the foam. The ferry has barely touched the Cijin ${vb('gate','gate')} before you are moving, the chain pulling you forward.</p>
  <p>You run for the old ${vb('fort')} on the hill. Halfway there, at the edge of the harbor wall, you catch a glimpse of someone feeding the stray cats — small, neat, a familiar cardigan despite the heat.</p>
  <p>Old Mr. Hong. He does not see you. You do not have time to stop.</p>
  <p class="quiet">Next time, you promise. You are collecting a lot of those promises.</p>`,
 choices:[ {t:'Reach the fort', go:'e4s10'} ]
},

e4s10:{
 html:()=>`
  <p>The old fort sits at the top of the hill, its thick walls facing out to sea. You look for the mark — but the fort is large, and there is no glow in sight. Read the place.</p>
  ${sysBox('\ud83d\udd0d THE FORT','carved by the gate',[
    ['flair','"The '+vb('waves','waves')+' bring '+vb('invaders','invaders')+' that iron balls '+vb('greet','greet')+';'],
    ['flair','Stand with the '+vb('brave','brave')+', not with the '+vb('meek','meek')+'."']
  ])}
  <p>You stand in the middle of the old fort and turn in a slow circle, the riddle going round with you.</p>
  <p>Behind you, inland, the shaded courtyard and the barracks — where the soldiers ate and slept and waited, the warm heart of the place, out of the wind. Ahead, the outer wall facing the sea, baking in the sun, where the old cannons still sit on their mounts, pointed out at the open water the way they have been for more than a hundred years.</p>`,
 choices:[
   {t:'The seaward wall, where the cannons faced.', go:'e4s10_sea'},
   {t:'The shaded courtyard inside.', go:'e4s10_in'}
 ]
},

e4s10_sea:{
 html:()=>`
  <p>You walk out to the seaward wall, to the old cannons still pointing at the horizon, and look out at the open water the way the fort always has. The mark blooms on the stone the moment you reach the edge.</p>
  ${sysBox('\u2705 LINK 2 COMPLETE','Read correctly',[
    ['flair',vb('Stamina','stamina')+' \u221215 \u00b7 +20'],
    ['flair','Clean. Link 3 unlocked.']
  ])}`,
 onEnter:()=>{ state.stamina = Math.min(130, state.stamina + 5); },
 choices:[ {t:'Link three', go:'e4s11'} ]
},

e4s10_in:{
 onEnter:()=>{ state.flags.chain_perfect = false; },
 html:()=>`
  <p>You head inland, into the shaded courtyard, and search the cool stone walls. Nothing. No glow, no ping. A fort does not keep its meaning in its courtyard — it keeps it at the wall that faces the threat.</p>
  ${sysBox('\u26a0 STUMBLE','You read the place wrong.',[
    ['flair','The chain holds \u2014 but a clean run is no longer possible.'],
    ['flair','Try the seaward wall, where the cannons faced.']
  ],'fail')}
  <p>You backtrack out to the seaward gun positions, into the wind, and there the mark waits — where it was always going to be. You lost minutes. You move on.</p>`,
 choices:[ {t:'Link three', go:'e4s11'} ]
},

e4s11:{
 html:()=>`
  ${sysBox('\ud83d\udd17 LINK 3 of 5','The Star Tunnel',[
    ['flair','Cijin\u2019s old tunnel, '+vb('carved','carved')+' through the hill by the sea.'],
    ['flair','"Who '+vb('carves','carves')+' through stone to hide in the dark?'],
    ['flair',vb('Shatter','shatter')+' the mountain to '+vb('claim','claim')+' the sea\'s '+vb('sparks','sparks')+'."']
  ])}
  <p>Not far from the fort, the old Star Tunnel runs straight through the rock — a long dark throat in the hillside, cut long ago so soldiers and supplies could pass through the hill unseen, safe from the guns of ships at sea. You step inside, and the daylight drops away behind you.</p>
  <p>The dark goes on. Painted stars glow faintly on the ceiling, and they are lovely — the kind of thing you are clearly meant to stop and admire, the reason the place has its name. But the riddle ${vb('scratches','scratches')} at you: <i>Who ${vb('carves','carves')} through stone to hide in the dark?</i></p>
  <p>You could slow down here under the stars and search properly. Or keep walking, into more dark, toward whatever is at the far end.</p>`,
 choices:[
   {t:'Search the dark walls for the mark.', go:'e4s11_walls'},
   {t:'Walk all the way through, to the far opening.', go:'e4s11_end'}
 ]
},

e4s11_walls:{
 onEnter:()=>{ state.flags.chain_perfect = false; },
 html:()=>`
  <p>You slow down in the middle of the tunnel, scanning the dark walls, the painted stars, the damp stone. Nothing answers. The mark is not in the dark.</p>
  ${sysBox('\u26a0 STUMBLE','You read the place wrong.',[
    ['flair','The chain holds \u2014 but a clean run is no longer possible.'],
    ['flair','A tunnel is not made for its middle. Keep walking.']
  ],'fail')}
  <p>You walk on, and the dark begins to thin, and ahead a circle of blue light grows — and you understand. You lost time in the middle of the dark. You move toward the end.</p>`,
 choices:[ {t:'To the far opening', go:'e4s11_end'} ]
},

e4s11_end:{
 html:()=>`
  <p>You walk the whole length of the dark, and then the tunnel opens — all at once — onto the sea.</p>
  <p>That is what the tunnel is <i>for:</i> not the dark, but the light at the end of it. A wide blue bay, framed by black rock, the open water bright after the long shadow. The mark blooms on the tunnel mouth, glowing against the daylight.</p>
  ${sysBox('\u2705 LINK 3 COMPLETE','Read correctly',[
    ['flair',vb('Stamina','stamina')+' \u221210 \u00b7 +15'],
    ['flair','Clean. Link 4 unlocked.']
  ])}
  <p>You stand for one breath at the bright end of the dark. Then you turn back for the ferry. There is still a harbor to cross, and a hill to climb.</p>`,
 onEnter:()=>{ state.stamina = Math.min(130, state.stamina + 5); },
 choices:[ {t:'Back across the water', go:'e4s12'} ]
},

e4s12:{
 html:()=>`
  <p>The ferry back passes in a ${vb('blur')} — a quick crossing, the city growing in front of you instead of behind. No time for the rail today.</p>
  <p>On the mainland side, you cross the short curved footbridge over the Gushan fishing port — small fishing boats below, nets drying, the water close enough to smell. Out past the harbor's narrow mouth, far away, the big ${vb('cranes')} of the real port stand against the sky; but here, over the little fishing harbor, everything is quiet and close. On the far side, a gentle uphill road leads you to the foot of the British ${vb('Consulate','consulate')}.</p>
  ${sysBox('\ud83d\udd17 LINK 4 of 5','The British Consulate',[
    ['flair','The mark is up at the consulate, on the '+vb('headland','headland')+'.'],
    ['flair','But there are two ways up from here.']
  ])}
  <p>You reach a fork at the base. A steep stone staircase climbs straight up the hillside — fast, but hard on legs that have already done a lot today. Beside it, a gentler path winds up the slope the long way — easier, but it will cost you time, and the sun is lower now.</p>`,
 choices:[
   {t:'The steep stairs. Save time, spend legs.', go:'e4s13_steep'},
   {t:'The gentle path. Save legs, spend time.', go:'e4s13_gentle'}
 ]
},

e4s13_steep:{
 onEnter:()=>{ state.stamina = Math.max(8, state.stamina - 35); state.flags.e4_climb = 'steep'; grant('long_way_up'); },
 html:(st)=>`
  <p>You take the stairs — the steep, direct climb, the hard way up.</p>
  <p>It is honest work. Your legs are tired from the long day, and the steps keep coming. Halfway up, a small old voice says <i>stop, sit, you have done enough today.</i> You do not stop. You shorten your steps, the way the late-night videos taught you, and climb one stair at a time. By the top you are ${vb('winded','winded')} and grinning, the harbor dropping away beneath you, wider and bluer with every step.</p>
  ${sysBox('🏆 ACHIEVEMENT UNLOCKED','The Long Way Up',[
    ['flair','"You chose the steep stairs. The hard way up."'],
    ['pts','+5']
  ])}
  <p>You reach the top with time still on your side.</p>`,
 choices:[ {t:'Find the mark', go:'e4s14'} ]
},

e4s13_gentle:{
 onEnter:()=>{ state.stamina = Math.max(8, state.stamina - 12); state.flags.e4_climb = 'gentle'; },
 html:()=>`
  <p>You take the gentle path, winding up the green slope the long way. Your legs thank you — it is an easy grade, shaded in places, and you reach the top with energy to spare.</p>
  <p>But the climb ate time, and when you look west the sun has dropped noticeably. The dusk is closer than you would like. You will want to keep moving after this.</p>`,
 choices:[ {t:'Find the mark', go:'e4s14'} ]
},

e4s14:{
 html:()=>`
  <p>The consulate stands at the top of the headland, red brick and arched ${vb('verandas','verandas')}, looking out over the harbor mouth. No mark in the garden. No mark on the steps. Read the place.</p>
  ${sysBox('\ud83d\udd0d THE CONSULATE','Read it.',[
    ['flair','"No '+vb('peak','peak')+' was '+vb('claimed','claimed')+' to '+vb('chase','chase')+' the view;'],
    ['flair','They built to watch who '+vb('ventured','ventured')+' through."']
  ])}
  <p>You walk up into the old brick building. Inside, cool rooms full of glass cases, old photographs, a little souvenir shop — a hundred small things asking to be looked at. Outside, a long veranda runs along the edge of the headland, with benches and a low rail and a lot of empty sky.</p>
  <p>The marks have hidden indoors before. But the riddle is still in your ear: <i>they built to see one thing.</i></p>`,
 choices:[
   {t:'The lookout, facing the harbor mouth.', go:'e4s14_look'},
   {t:'Search the rooms and garden.', go:'e4s14_rooms'}
 ]
},

e4s14_look:{
 html:()=>`
  <p>You step out onto the veranda and walk to the rail, where the whole narrow mouth of the harbor opens below you — every ship that ever came or went, framed in one view. The mark blooms on the stone rail the moment you look out.</p>
  ${sysBox('\u2705 LINK 4 COMPLETE','Read correctly',[
    ['flair','Clean. Final link unlocked.']
  ])}`,
 choices:[ {t:'The last link', go:'e4s15'} ]
},

e4s14_rooms:{
 onEnter:()=>{ state.flags.chain_perfect = false; },
 html:()=>`
  <p>You wander the brick rooms and the garden, looking. Nothing glows. This building never cared about its rooms — it was built to watch the harbor mouth, and that is where its meaning sits.</p>
  ${sysBox('\u26a0 STUMBLE','You read the place wrong.',[
    ['flair','The chain holds \u2014 but a clean run is no longer possible.'],
    ['flair','Go to the lookout. Face the harbor mouth.']
  ],'fail')}
  <p>You step out to the lookout, face the water, and the mark is there — where it was always waiting. You move on, the sun lower with every minute.</p>`,
 choices:[ {t:'The last link', go:'e4s15'} ]
},

e4s15:{
 html:()=>`
  <p>You come back down off the headland and walk a short stretch toward the university, and there it is: the long curve of the Sizihwan ${vb('seawall','seawall')}, the place the whole city calls, simply, the sea wall. The sun is leaning low and gold over the water.</p>
  <p>The final link appears. You read it, then read it again, because it cannot be that simple.</p>
  ${sysBox('\ud83d\udd17 LINK 5 of 5','The sea wall',[
    ['flair','"'+vb('Turn your back','turn_your_back')+' upon the road;'],
    ['flair','Face the sea where sunsets '+vb('glowed','glowed')+'."'],
    ['flair','Then stop looking for marks \u2014 and just look.']
  ])}
  <p>The wall is long, and people sit all along it, facing every which way — some toward the water, some with their backs to it, looking instead at the university's pool and running track across the road behind. There is an open bench right beside you, facing inland. Your legs vote for it loudly.</p>
  <p>But the riddle waits, quiet: <i>the thing everyone here came to see.</i></p>`,
 choices:[
   {t:'Find a spot on the wall facing the open sea.', go:'e4s15_sea'},
   {t:'Drop onto the first open bench. You\u2019re exhausted.', go:'e4s15_bench'}
 ]
},

e4s15_bench:{
 onEnter:()=>{ state.flags.chain_perfect = false; },
 html:()=>`
  <p>You collapse onto the first bench you see, facing back toward the road and the city. You wait for the mark. Nothing comes.</p>
  ${sysBox('\u26a0 STUMBLE','You read the place wrong.',[
    ['flair','The chain holds \u2014 but a clean run is no longer possible.'],
    ['flair','Face where the sun goes. That is the whole point.']
  ],'fail')}
  <p>You get up, cross to the seaward side of the wall, and find a place looking straight out at the water — where the sun is going down. That, of course, is where the place wanted you all along.</p>`,
 choices:[ {t:'Sit. Watch.', go:'e4s16'} ]
},

e4s15_sea:{
 html:()=>`
  <p>You find a place on the seaward side of the wall, facing straight out at the open water where the sun is sinking. You sit. The mark blooms softly on the concrete beside you — and then, having shown itself, it fades, as if to say: <i>you found it; now you can stop looking.</i></p>`,
 choices:[ {t:'Just look', go:'e4s16'} ]
},

e4s16:{
 html:(st)=>`
  <p>So you do. You stop looking for marks, and you just look.</p>
  <p>The sun touches the sea. The water goes from blue to ${vb('bronze')} to a soft burning orange, and the whole harbor — the ${vb('cranes')}, the ships, the far green hills — holds still inside the light. You think of the person who sat at a desk at 11:42 p.m. and could not remember the last time they laughed. That person could not have imagined this.</p>
  <p>You give the evening your full attention. All of it.</p>
  <p>The chain closes around you, soft and complete.</p>
  ${sysBox('\u2705 QUEST CHAIN COMPLETE','THE CITY RUN',[
    ['flair','5 of 5 links.'],
    ['pts','+100']
  ])}
  ${sysBox('\ud83c\udfc6 ACHIEVEMENT UNLOCKED','Just Watch',[
    ['flair','"The whole task was to stop."'],
    ['pts','+0 points']
  ])}
  ${st.flags.chain_perfect ? sysBox('\ud83c\udfc6 ACHIEVEMENT UNLOCKED','Unbroken',[
    ['flair','"Five links. Every place, read right. A clean run."'],
    ['pts','+30']
  ]) : `<p class="quiet">No "Unbroken" badge today. Somewhere back there you read a place wrong — a tower, a fort, a tunnel, a wall — and the clean run slipped away. The chain still closed. It just wasn't perfect. Next time, maybe.</p>`}
  <p>You do not look at the points right away. For once the number can wait, because you are busy doing the thing the number is only a record of — sitting on a warm sea wall, fully inside one orange minute of your one life.</p>
  <p>When you finally check Completion Vision, almost as an afterthought, you already know what it will say.</p>
  <p class="beat big">TODAY: 100%</p>`,
 onEnter:()=>{ pay('e4_chain',100); grant('just_watch'); if(state.flags.chain_perfect) grant('unbroken'); state.stamina = 100; },
 choices:[ {t:'The +??? reward', go:'e4s17'} ]
},

e4s17:{
 html:()=>`
  <p>The sun is half gone now, the sky bleeding pink into grey. And as the last light goes, the chain gives up its hidden reward — the <i>+???</i> that has been waiting since this morning.</p>
  <p>It is not points.</p>
  ${sysBox('🎁 CHAIN REWARD','Access granted',[
    ['flair','Access '+vb('granted','granted')+'.'],
    ['flair','The chain\'s true reward is not a number. It is a place.']
  ])}
  <p>A new mark lights up on your map — not the gold point, which still waits in its fog to the south, but a quiet <b>silver</b> mark, close by, just along the coast from where you sit.</p>
  <p>The system wants you to go there. After a whole day of running, it has one more place to show you.</p>
  <p>You get up off the seawall, legs ${vb('stiff')}, and follow the silver mark into the blue evening.</p>`,
 choices:[ {t:'Follow the silver mark', go:'e4s18'} ]
},

e4s18:{
 html:()=>`
  <p>The mark leads you off the main path, down a quiet ${vb('stretch')} of coast where the streetlights have not all come on yet. To a wall.</p>
  <p>Just an old concrete wall, facing the sea. And on it, painted at shoulder height—</p>
  <p>the trophy.</p>
  <p>The same shape that blooms in your vision every time you unlock something. The same one on the warehouse wall in Yancheng. The same one, you are suddenly certain, in the corner of a sixty-year-old photograph in an old man's apartment.</p>
  <p>The same hand. You know it now, the way you know handwriting.</p>
  <p>But this time, the words next to it are not covered. This time they are right there, ${vb('scribbled','scribbled')} fast and hard, pressed deep into the paint like the writer was in a hurry, or afraid:</p>`,
 choices:[ {t:'Read the words', go:'e4s19'} ]
},

e4s19:{
 html:()=>`
  <p>Five words. All capitals. Underlined twice.</p>
  ${sysBox('🧱 ON THE WALL','( not from the system )',[
    ['flair','DON\'T TAKE THE GOLD QUEST.']
  ],'gold')}
  <p>You stand very still in the dark.</p>
  <p>The gold quest. The gold point, deep in the fog to the south, that you have tapped a hundred times. The one the system keeps locked behind a level you do not yet have. The one it told you, just last night, you are getting <i>closer</i> to.</p>
  <p>All this time you thought the gold point was the prize. The top of the mountain. The reason for all of it.</p>
  <p>And here, on a wall by the sea, in handwriting that is not the system's neat green but a real human ${vb('scrawl')} — someone who came before you, someone who painted these trophies all over the city, someone who reached a high enough level to <i>find</i> this gold quest—</p>
  <p class="beat">left a ${vb('warning','warning')} for whoever comes next.</p>
  <p>Don't.</p>`,
 onEnter:()=>{ state.flags.warning_seen = true; grant('the_warning'); },
 choices:[ {t:'Ask the system', go:'e4s20'} ]
},

e4s20:{
 html:()=>`
  <p>"What is the gold quest?" you ask the evening air. "Who wrote this? What happens if I take it?"</p>
  <p>The system, which gives you points for trying new lunches and counts the nods of security guards, which knows your completion percentage going back five years —</p>
  <p>says nothing at all.</p>
  <p>Its silence has a shape tonight. Not the patient silence of <i>the road will still be there tomorrow.</i> A different silence. The silence of a door that someone, somewhere, decided not to open for you.</p>
  <p>You take a photo of the wall. The trophy. The five words. You do not know what you will do with it. You just know you do not want to lose it.</p>`,
 choices:[ {t:'Go home', go:'e4s21'} ]
},

e4s21:{
 html:()=>`
  <p>You walk home through the warm dark, and for the first time since the convenience store, you open no quests, check no map, chase no points. You just walk, carrying two things in your pockets that do not fit together:</p>
  <p>A locked record from <i>before</i> the system found you.</p>
  <p>And a warning, painted by a stranger, telling you not to reach the one thing the system is leading you toward.</p>
  <p>The day was perfect. 100%. Level 5. The whole city open. And somehow you are walking home with more questions than you woke up with.</p>`,
 choices:[ {t:'Home. The gold point.', go:'e4s22'} ]
},

e4s22:{
 html:(st)=>`
  <p>In bed, you open the panel one last time. Level 5 sits there, solid and earned. The city glows, all of it yours now — except that one stubborn patch of fog in the south.</p>
  <p>You tap the gold point. You already know what it will say.</p>
  ${sysBox('❓ ???','[ Locked ]',[
    ['flair','Level required: ???'],
    ['flair','Closer.']
  ],'gold')}
  <p>Closer. You are level 5 now, and climbing. Every quest, every link, every new street walks you one step nearer to that gold light.</p>
  <p>And someone painted five hard words on a wall to stop you.</p>
  <p>You lie in the dark, and the old question — <i>what will tomorrow's quest be?</i> — has changed shape. Tonight the question is quieter, and colder, and you are not sure you want the answer:</p>
  <p class="beat big">What is waiting in the gold?</p>`,
 choices:[ {t:'EPISODE COMPLETE — open the Menu', go:'end4'} ]
},

end4:{
 html:(st)=>{
   function achGroup(ep){
     let h='';
     Object.keys(ACH).filter(id=>ACH[id].ep===ep).forEach(id=>{
       const a=ACH[id]; const got=st.achievements.includes(id);
       h += '<div class="row"><span>'+
         (got ? '🏆 <span class="ach-name">'+a.name+'</span><span class="ach-desc">'+a.desc+'</span>'
              : '<span class="lock">🔒 ???</span>')+
         '</span><span>'+(got ? (a.pts>0?'+'+a.pts:'—') : '')+'</span></div>';
     });
     return h;
   }
   const cnt=(ep)=>[st.achievements.filter(id=>ACH[id].ep===ep).length, Object.keys(ACH).filter(id=>ACH[id].ep===ep).length];
   const [c4,t4]=cnt(4),[c3,t3]=cnt(3),[c2,t2]=cnt(2),[c1,t1]=cnt(1);
   return `
  <p class="quiet">EPISODE 4 — LEVEL UP</p>
  ${sysBox('✅ EPISODE COMPLETE','Level Up',[['flair','"What is waiting in the gold?"']])}
  <div class="panel">
    <h3>PLAYER</h3>
    <div class="row"><span>Level</span><span>${st.level}</span></div>
    <div class="row"><span>Points</span><span>${st.points}</span></div>
    <div class="row"><span>Money</span><span>NT$${st.money.toLocaleString()}</span></div>
    <div class="row"><span>Next level</span><span>700</span></div>
    <div class="row"><span>Map</span><span>City unlocked · fog remains in the south</span></div>
    <div class="row"><span class="goldtxt">GOLD ???</span><span class="goldtxt">Closer.</span></div>
  </div>
  <div class="panel ach-list"><h3>EPISODE 4 ACHIEVEMENTS (${c4}/${t4})</h3>${achGroup(4)}</div>
  <div class="panel ach-list"><h3>EPISODE 3 ACHIEVEMENTS (${c3}/${t3})</h3>${achGroup(3)}</div>
  <div class="panel ach-list"><h3>EPISODE 2 ACHIEVEMENTS (${c2}/${t2})</h3>${achGroup(2)}</div>
  <div class="panel ach-list"><h3>EPISODE 1 ACHIEVEMENTS (${c1}/${t1})</h3>${achGroup(1)}</div>
  <p class="quiet">Missing some? Different choices, different badges.</p>
  <hr class="sep">
  <div class="panel">
    <h3>SAVE</h3>
    <p style="font-family:inherit;font-size:.8rem;opacity:.8;margin:0 0 8px;">
      Your progress saves automatically on this device.${storageOK?'':' (Saving is not available here — use Export to keep your progress.)'}
      Export a save code to keep it safe or move to another device.</p>
    <div class="btn-line">
      <button class="choice" id="btnExport4">Export save</button>
      <button class="choice" id="btnImport4">Import save</button>

e5s1:{
 onEnter:()=>{ state.episode = 5; snapshotEpisode(5); state.stamina = 100; grant('local_knowledge'); earn('e5_recent_sidework', 1200); },
 html:()=>`
  <p class="quiet">EPISODE 5 — MULTIPLAYER?</p>
  <p>Tuesday's quest was an old woman at the crossing by the temple, waiting for a light that changed too fast for her. You walked her across. The panel said nothing until you reached the far side. Then it paid you — in points.</p>
  <p>Wednesday: a phone, face-down and still warm on an MRT seat. You could have just handed it in to the police, the way the quest asked, and left it there. But you did more than that. You snapped a photo and posted it online — the way half of Taiwan would — telling the owner to claim it at the police station. By night the owner had it back.</p>
  <p>And there were paid ones, too — a few small side jobs that left your account a little fatter than last month. The money was part of why you kept saying yes; you won't pretend it wasn't.</p>
  <p>The quests ask for more than they used to. Not <i>collect five things.</i> More like: look up, see the person in front of you, do the plain kind thing. It turns out the city is full of small things worth doing — once you start paying attention.</p>
  <p>This Saturday, the panel wakes you with something simpler.</p>
  ${sysBox('🗺️ WEEKEND QUEST','Get to Formosa Boulevard — fast',[['flair','Your next quest is waiting at the station.']])}
  <p>Fast. You know one fast way nobody put on a map: Sam's lane, the shortcut he gave you the night you finally asked his name. Six minutes of hot oil and wet stone and somebody's radio, and it spits you out a block from the circle.</p>
  ${sysBox('🏆 ACHIEVEMENT UNLOCKED','Local Knowledge',[['flair','"Sam\'s lane. Six minutes."'],['pts','+0 points']])}
  <p>You take the stairs down. In the round ${vb('hall','hall')} where the red line crosses the orange, the great glass ${vb('dome')} glows overhead, lit from within — water, earth, light, fire. Under it, and down the passages that feed it, a weekend market is winding down. A few tables already stand bare; the rest are still busy, the afternoon crowd in no hurry to leave.</p>`,
 choices:[ {t:'Down the rows', go:'e5s2'} ]
},

e5s2:{
 html:()=>`
  <p>You let yourself ${vb('browse')} the last tables — old toys, a stack of board games, a rack of clothes — not really shopping. You're doing the thing the system trained into you: noticing.</p>
  <p>That's how you catch it.</p>
  <p>A woman by the clothes rack lifts a hand and brushes the air — once, flat, at nothing. Then she stops. Stares at a patch of empty space for half a second, the way you'd reread a line that surprised you.</p>
  <p>You know that look. You make it yourself, every time a panel no one else can see slides up in front of you.</p>
  <p class="beat">Yours slides up now.</p>
  ${sysBox('💬 SYSTEM','Second player detected.',[['flair','Someone close can see the panels too.']])}`,
 choices:[
   {t:'Walk over and say something', go:'e5s3', set:{approach:'say'}},
   {t:'Hang back and watch her', go:'e5s3', set:{approach:'watch'}},
   {t:'Drift closer, flip through the rack', go:'e5s3', set:{approach:'drift'}}
 ]
},

e5s3:{
 html:(st)=>{
   const ap=st.flags.approach;
   const lead = ap==='watch' ? "You hold back and watch her a beat longer."
              : ap==='drift' ? "You drift in and flip through the rack like a real buyer."
              : "You step toward her with something half-formed to say.";
   return `
  <p>${lead}</p>
  <p>You don't get the chance. The woman behind the table is suddenly on her feet, phone in one hand. The other closes around your wrist, then the stranger's. Seventy, maybe. Quick eyes. A voice that doesn't wait for an answer.</p>
  <p>"You two. You look honest." Not a question. "My daughter — the hospital — I have to go <i>now</i>."</p>
  <p>She's already grabbing her bag. "${vb('Mind','mind')} the stall. One hour. <i>Please.</i>"</p>
  <p>Fast, over her shoulder: shirts a hundred, the good coats three — ${vb('haggle')} a little if they push — socks three for a hundred — ${vb('change','change')}'s in the box — back stock's under the table — <i>don't sell it cheap.</i></p>
  <p>And the crowd takes her.</p>
  ${sysBox('📋 NEW QUEST','Mind the Stall',[['flair','PARTY: You + ??? (LV 9)'],['flair','One hour.']])}
  <p>The stranger looks at the panel only the two of you can see. Then at you. Dry: "Yours buzzed too. Didn't it."</p>
  <p>Nobody's watching the table. Somebody should get a grip on it.</p>`;
 },
 choices:[
   {t:'Straighten the table and the rack', go:'e5s4', set:{prep:'tidy'}},
   {t:'Count the back stock and the cash', go:'e5s4', set:{prep:'count'}}
 ]
},

e5s4:{
 html:(st)=>{
   const pr=st.flags.prep;
   const lead = pr==='count'
     ? "You tip out the cash box and count it down to the last coin. By the time you look up, she's already working the rack, pricing as she goes."
     : "You square the table — fold the loose shirts, straighten the rack. By the time you look up, she's already into the cash box, counting it down to the last coin.";
   return `
  <p>${lead}</p>
  <p>She moves like she's done this a hundred times. Prices a stranger's jacket in two seconds, sells it in ten. No wasted word. No smile.</p>
  <p>She's good. She's also somewhere else the whole time, like the ${vb('customer','customer')}s are a list to clear, not people.</p>
  <p>It dawns on you, slowly: she does this with <i>everything</i>. Every quest the system hands her. All of them, top marks. It has never once crossed her mind to say <i>no</i>.</p>`;
 },
 choices:[ {t:'Find your own way to help', go:'e5s5'} ]
},

e5s5:{
 onEnter:()=>{ state.stamina = Math.max(20, state.stamina - 15); },
 html:(st)=>`
  <p>So you do the part she skips.</p>
  <p>You meet a man halfway on two shirts, and he leaves happy. You tell a student the green one suits her — last one — and she buys socks she didn't come for. The words arrive before you plan them.</p>
  ${sysBox('⚡ STAMINA', st.stamina+' / 100', [['flair','−15 · on your feet, no chair, no breaks']])}
  <p>"Name's Yun," she says, not looking up from the box. She doesn't ask for your name in return, and you don't offer it. Two players, one stall, no need.</p>
  <p>The last time you sold anything — a guitar, a pair of running shoes, a thousand days of dust — it felt like surgery. This is easy.</p>
  <p class="beat">When did this get easy?</p>`,
 choices:[ {t:'Keep the table alive', go:'e5s6'} ]
},

e5s6:{
 onEnter:()=>{ state.stamina = Math.max(20, state.stamina - 20); },
 html:(st)=>`
  <p>The table thins out. You drop to one knee and drag the suitcase from under it — the back stock, packed tight — pull the little cart out behind it, and ${vb('restock','restock')} the gaps. Not too full. A crammed table kills the buying. A bare one kills it too. You find the line by feel.</p>
  <p>Yun works the front, fast and flat, and between the two of you the stall stays alive.</p>
  <p>Your back tells you the thing nobody warns you about a market: standing still all day is the kind of tired that doesn't show.</p>
  ${sysBox('⚡ STAMINA', st.stamina+' / 100', [['flair','−20 · hauling the back stock']])}`,
 choices:[ {t:'Back to the front', go:'e5s7'} ]
},

e5s7:{
 html:()=>`
  <p>A kid — eight, maybe nine — circles the table. Wanders off. Comes back. One fist full of coins, the other thumb rubbing a small tin car from the bargain box.</p>
  <p>He counts the coins. Counts them again. Lays them out on the table. Short by a few.</p>
  <p>Yun has already turned to a paying customer. By her math, the kid isn't one.</p>
  <p>He looks at the coins. He looks at the car.</p>`,
 choices:[
   {t:'Let him have it for what he\'s got', go:'e5s8', set:{kid_helped:true}},
   {t:'"Sorry — that one\'s the owner\'s price"', go:'e5s8'}
 ]
},

e5s8:{
 onEnter:()=>{ if(state.flags.kid_helped) grant('the_short_count'); },
 html:(st)=>`
  <p>${st.flags.kid_helped ? "You wave the few coins off and slide the car across. He's gone before you can change your mind. You drop a coin of your own in the box to square it — nobody's business but yours." : "You shake your head, gentle. \"That one's hers, not mine to give away.\" The kid nods, too old for his age, and folds the coins back into his pocket."}</p>
  ${st.flags.kid_helped ? sysBox('🏆 ACHIEVEMENT UNLOCKED','The Short Count',[['flair','"A few coins short. You let it slide."'],['pts','+0 points']]) : ''}
  <p>The afternoon thins toward closing. You catch the running total on the panel without meaning to — the owner's money, not yours, climbing all day. It feels good to watch a number rise. You remind yourself whose it is.</p>
  ${sysBox('💰 STALL',"Owner's takings",[['pts','Sold so far &asymp; NT$2,000']])}
  <p>Then a man in a good shirt lifts something out of the tray that isn't clothes at all.</p>`,
 choices:[ {t:'See what he\'s holding', go:'e5s9'} ]
},

e5s9:{
 html:()=>`
  <p>A watch. Steel, old, a little scratched, on a worn leather strap. A price ${vb('tag')} written in the owner's own hand.</p>
  <p>He turns it over once and offers double. Cash. Right now.</p>
  <p>Your eye does the thing it learned back when the panel first laid a number over everything. The watch reads <i>different</i>. Not a price — a weight. Like it never belonged in that tray with the socks.</p>
  <p>But she set it out. She wrote the tag. Maybe she needs the money — maybe that's the whole reason she's here on a Saturday, behind a folding table.</p>`,
 choices:[
   {t:'Sell it. Good price, clean.', go:'e5s10', set:{watch_sold:true}},
   {t:'"Sorry. Not this one."', go:'e5s10', set:{watch_sold:false}}
 ]
},

e5s10:{
 html:(st)=>`
  <p>${st.flags.watch_sold ? "You take the cash and set the watch in his palm. The box is heavier now. Something else is lighter, and not in the good way. You can't name it." : "You lift the watch out of the tray and set it down by her bag, off the table. The man shrugs and buys a belt instead. The weight you couldn't name eases, a little."}</p>
  ${sysBox('💬 SYSTEM','No data on this one.',[])}
  <p>Yun watched the whole thing. She doesn't say what she would have done.</p>`,
 choices:[ {t:'Closing time', go:'e5s11'} ]
},

e5s11:{
 onEnter:()=>{ grant('mind_the_stall'); earn('e5_wage', 1360); state.stamina = Math.min(100, state.stamina + 20); },
 html:(st)=>`
  <p>She's back in fifty minutes, not sixty. Reads the table in a single look — the gaps where stock used to be, the box heavy with coins.</p>
  <p>"<i>You</i> two sold all this?"</p>
  ${sysBox('✅ QUEST COMPLETE','Mind the Stall',[['pts','Sold: NT$3,400']])}
  ${sysBox('🏆 ACHIEVEMENT UNLOCKED','Mind the Stall',[['flair','"One hour. Two strangers. A sold-out table."'],['pts','+10 points']])}
  <p>Before you can wave it off, she's counting notes into your hands and Yun's. Eight in every ten, she says — for the trouble. She won't hear no. And Yun, you notice, doesn't argue; she just takes her share and goes quiet, like a sum that finally came out even.</p>
  ${sysBox('💰 EARNINGS','Your share',[['pts','+NT$1,360']])}
  <p>${st.flags.watch_sold ? "She looks for something in the tray, doesn't find it, stops for half a beat — then says nothing." : "She finds the watch by her bag, picks it up, and closes her hand around it. Slips it into her coat. She doesn't explain. You don't ask."}</p>
  <p>She sits the two of you down — her stool, an upturned crate — and hands you each a cold tea from a cooler under the table. You hadn't noticed your legs until now.</p>
  ${sysBox('⚡ STAMINA', st.stamina+' / 100', [['flair','+20 · sitting down at last, cold tea']])}`,
 choices:[ {t:'Fold the last of it together', go:'e5s12'} ]
},

e5s12:{
 html:()=>`
  <p>The crowd is thinning. The market is nearly half air now. You and Yun fold the last of the clothes together, easy, tired in the good way.</p>
  <p>You bring it up — light, half a joke. The gold quest. The locked gold point down south in the fog. The wall by the sea that said <i>don't</i>.</p>
  <p>Her hands stop. Just for a second. Her face changes — a ${vb('flicker')}, there and gone. She knows exactly what you mean. And she's already a long way off with it, somewhere you can't follow.</p>`,
 choices:[
   {t:'Push. Ask what she knows.', go:'e5s13a'},
   {t:'Let it go. Hand her the last shirt.', go:'e5s13b'}
 ]
},

e5s13a:{
 onEnter:()=>{ state.flags.yun_pressed = true; },
 html:()=>`
  <p>"What's down there?" you ask. "You've seen it. Haven't you."</p>
  <p>"Some quests," she says, "you don't get to hand back." She folds the shirt herself, hard creases, and changes the subject.</p>
  <p>You got a piece of something. You also watched a door close — a thing she carries by herself, and isn't done carrying.</p>`,
 choices:[ {t:'Let her be', go:'e5s14'} ]
},

e5s13b:{
 onEnter:()=>{ grant('give_her_room'); },
 html:()=>`
  <p>You hand her the last shirt and let the question fall.</p>
  <p>She looks at you a second too long. Something in her face lets go. She nods — like you passed a test she never set.</p>
  <p>Whatever she's working out, she has to reach it on her own. You can see that much. So you give her the road.</p>
  ${sysBox('🏆 ACHIEVEMENT UNLOCKED','Give Her Room',[['flair','"You had the question. You left her the road."'],['pts','+0 points']])}`,
 choices:[ {t:'Walk out together', go:'e5s14'} ]
},

e5s14:{
 onEnter:()=>{ grant('multiplayer'); },
 html:()=>`
  <p>You climb up out of the hall together. At the top of the stairs she stops.</p>
  <p>"Yours been loud lately?" she asks. "The system."</p>
  <p>You nod. It has. A quest every day. Points, levels, the gold point winking a little closer each night.</p>
  <p>"Mine's been quiet." A beat. "Lately."</p>
  <p class="beat">And she's gone, into the bright Saturday street.</p>
  ${sysBox('🏆 ACHIEVEMENT UNLOCKED','Multiplayer',[['flair','"Player Two. You are not the only one."'],['pts','+1 point']])}
  <p>You look back down the stairs. Below, the great dome holds its light a moment longer — water, earth, light, fire — and you think about Yun saying <i>quiet</i> like the word cost her something.</p>
  ${sysBox('💬 SYSTEM','…',[])}
  <p>For once, your panel has nothing to add.</p>`,
 choices:[ {t:'EPISODE COMPLETE — open the Menu', go:'end5'} ]
},

end5:{
 html:(st)=>{
   function achGroup(ep){
     let h='';
     Object.keys(ACH).filter(id=>ACH[id].ep===ep).forEach(id=>{
       const a=ACH[id]; const got=st.achievements.includes(id);
       h += '<div class="row"><span>'+
         (got ? '🏆 <span class="ach-name">'+a.name+'</span><span class="ach-desc">'+a.desc+'</span>'
              : '<span class="lock">🔒 ???</span>')+
         '</span><span>'+(got ? (a.pts>0?'+'+a.pts:'—') : '')+'</span></div>';
     });
     return h;
   }
   const cnt=(ep)=>[st.achievements.filter(id=>ACH[id].ep===ep).length, Object.keys(ACH).filter(id=>ACH[id].ep===ep).length];
   const [c5,t5]=cnt(5),[c4,t4]=cnt(4),[c3,t3]=cnt(3),[c2,t2]=cnt(2),[c1,t1]=cnt(1);
   return `
  <p class="quiet">EPISODE 5 — MULTIPLAYER?</p>
  ${sysBox('✅ EPISODE COMPLETE','Multiplayer?',[['flair','"Mine\'s been quiet. Lately."']])}
  <div class="panel">
    <h3>PLAYER</h3>
    <div class="row"><span>Level</span><span>${st.level}</span></div>
    <div class="row"><span>Points</span><span>${st.points}</span></div>
    <div class="row"><span>Money</span><span>NT$${st.money.toLocaleString()}</span></div>
    <div class="row"><span>Next level</span><span>700</span></div>
    <div class="row"><span>Map</span><span>City unlocked · fog remains in the south</span></div>
    <div class="row"><span>Party</span><span>Yun · LV 9 · gone quiet</span></div>
    <div class="row"><span class="goldtxt">GOLD ???</span><span class="goldtxt">Closer.</span></div>
  </div>
  <div class="panel ach-list"><h3>EPISODE 5 ACHIEVEMENTS (${c5}/${t5})</h3>${achGroup(5)}</div>
  <div class="panel ach-list"><h3>EPISODE 4 ACHIEVEMENTS (${c4}/${t4})</h3>${achGroup(4)}</div>
  <div class="panel ach-list"><h3>EPISODE 3 ACHIEVEMENTS (${c3}/${t3})</h3>${achGroup(3)}</div>
  <div class="panel ach-list"><h3>EPISODE 2 ACHIEVEMENTS (${c2}/${t2})</h3>${achGroup(2)}</div>
  <div class="panel ach-list"><h3>EPISODE 1 ACHIEVEMENTS (${c1}/${t1})</h3>${achGroup(1)}</div>
  <p class="quiet">Missing some? Different choices, different badges. Some things the panel never scores at all.</p>
  <hr class="sep">
  <div class="panel">
    <h3>SAVE</h3>
    <p style="font-family:inherit;font-size:.8rem;opacity:.8;margin:0 0 8px;">
      Your progress saves automatically on this device.${storageOK?'':' (Saving is not available here — use Export to keep your progress.)'}
      Export a save code to keep it safe or move to another device.</p>
    <div class="btn-line">
      <button class="choice" id="btnExport5">Export save</button>
      <button class="choice" id="btnImport5">Import save</button>
    </div>
    <textarea class="savebox" id="saveBox5" placeholder="Your save code appears here. Or paste a code and press Import." spellcheck="false"></textarea>
  </div>`;
 },
 choices:[
   {t:'▶ Continue to Episode 6', go:'e6s1'},
   {t:'↻ Replay Episode 5', go:'__replay5'},
   {t:'Back to title', go:'__title'}
 ],
 onRender:()=>{
   const box = document.getElementById('saveBox5');
   document.getElementById('btnExport5').onclick = ()=>{
     box.value = btoa(unescape(encodeURIComponent(JSON.stringify(state)))); box.select();
   };
   document.getElementById('btnImport5').onclick = ()=>{
     try{
       const sv = JSON.parse(decodeURIComponent(escape(atob(box.value.trim()))));
       if(typeof sv.version !== 'number') throw 0;
       state = Object.assign(freshState(), sv); save();
       box.value = 'Save imported ✓';
     }catch(e){ box.value = 'That code did not work. Check it and try again.'; }
   };
 }
},

e6s1:{
 onEnter:()=>{ state.episode = 6; snapshotEpisode(6); state.stamina = 100; },
 html:()=>`
  <p class="quiet">EPISODE 6 — OFFLINE</p>
  <p>Tuesday starts the way Tuesdays start. The alarm. The shower. The walk past the temple, where the incense is already going and the morning is already warm.</p>
  <p>Boss Lin sees you coming and lays your egg pancake on the hot plate without asking. That still lands somewhere good, every time.</p>
  <p>Two corners from home, most mornings, the day's quest finds you. A soft ${vb('chime')}. A green box only you can see. <i>Walk a street you've never walked. Ask the guard about his day. Carry something for someone.</i></p>
  <p>Today: the first corner. The second.</p>
  <p class="beat">Nothing.</p>
  <p>You stop at the third corner and stand there like someone waiting for a bus that isn't coming.</p>`,
 choices:[
   {t:'Shrug it off — systems hiccup', go:'e6s2', set:{e6_route:'work'}},
   {t:'Take the long way — give it more corners to find you', go:'e6s2', set:{e6_route:'long'}}
 ]
},

e6s2:{
 html:(st)=>{
   const lead = st.flags.e6_route==='long'
     ? "You give it six more corners and one small park. Nothing finds you. You reach the office two minutes before you'd have to explain yourself."
     : "You put your head down and go to work. Some things fix themselves if you leave them alone. That's what you tell yourself, twice.";
   return `
  <p>${lead}</p>
  <p>The morning crawls. By ten you have looked at the empty corner of your vision more times than you can pass off as thinking. There is nothing there. There keeps being nothing there.</p>
  <p>After work you walk Sam's lane, because it's yours now, chime or no chime. Six minutes, end to end. The oil, the stone, the radio.</p>
  <p>At the far end you stop and wait, one beat, two.</p>
  <p class="beat">The lane worked. The world didn't.</p>`;
 },
 choices:[ {t:'Give it a day', go:'e6s3'} ]
},

e6s3:{
 onEnter:()=>{ grant('the_paint_stays'); },
 html:()=>`
  <p>A ${vb('glitch')}, you tell yourself on the second morning. Systems go down. Systems come back.</p>
  <p>On the third morning you stop saying glitch.</p>
  <p>You test it the way you'd test a dead tooth. You stand where the marks used to bloom — the temple gate, the harbor rail. Wall. Just wall. You carry a box up three floors for a stranger, and at the top there is sweat and a thank-you and nothing else.</p>
  <p>On the fourth evening you ride to Yancheng and find the warehouse wall from those early weeks. The painted trophy is still there, pale and rough at the edges, but holding. Below it, the covered line — the grey stripe that once gave you three characters and a sleepless night: <i>…LV9…</i></p>
  <p>And something in you goes very still, because you finally see the difference. The system drew its marks in light, and the light is gone. This was made by a hand, with a can, on a night when somebody meant it.</p>
  <p class="beat">The light left. The paint stayed.</p>`,
 choices:[ {t:'Saturday', go:'e6s4'} ]
},

e6s4:{
 html:(st)=>`
  <p>Saturday you ride to Formosa Boulevard and walk down into the dome's glow like a person visiting the scene of something.</p>
  <p>The market is there. The stall is there. The owner is there, folding shirts${st.flags.watch_sold ? "" : " — and on her wrist, the steel watch, back where it belongs"}.</p>
  <p>Her face opens when she sees you. The daughter is fine — a scare, not a sickness — and before you can ask anything she has pressed a cold tea into your hands, because that is apparently a law of her table.</p>
  <p>"Your friend from that day?" she says, looking past you. "The fast one."</p>
  <p>"I'm trying to find her."</p>
  <p>"So call her."</p>
  <p>"I don't have her number." You turn the tea in your hands. "I don't have her name. One word of it."</p>
  <p>The owner stops folding. "An hour, side by side," she says, "and you never asked?"</p>
  <p>You could explain it. Two players, one stall — it didn't seem to matter then. It matters now, and the words just sit there in your mouth, too late to be any use.</p>`,
 choices:[
   {t:'"If she comes back — tell her the other one from that day is looking for her"', go:'e6s5', set:{e6_left_word:true}},
   {t:'"It\'s nothing. Thanks for the tea."', go:'e6s5'}
 ]
},

e6s5:{
 onEnter:()=>{ if(state.flags.e6_left_word) grant('word_left'); },
 html:(st)=>`
  <p>${st.flags.e6_left_word ? "The owner nods once, like a stamp coming down. \"If she comes, she'll know.\" It isn't much. You carry it out of the station anyway, careful, the way you'd carry an egg." : "You thank her and go. Halfway up the stairs you almost turn around, and don't."}</p>
  <p>The light by the temple still changes too fast. You see that from half a block away, because the old woman is there again — same folded shopping cart, same wait, watching the little green man like he's a train she keeps missing.</p>
  <p>There was a Tuesday when a green box paid you points to walk her across.</p>
  <p>There is no box now. There are no points. There is a light that will hold for nine seconds, and a woman who needs twelve.</p>`,
 choices:[
   {t:'Cross with her', go:'e6s6a'},
   {t:'Stay where you are', go:'e6s6b'}
 ]
},

e6s6a:{
 onEnter:()=>{ state.flags.e6_helped = true; grant('unpaid'); },
 html:()=>`
  <p>You take her arm the way you did before, and you both step off on the green. Nine seconds. You walk the last three on the red, her cart squeaking, one scooter waiting without honking, which in this city counts as a small parade.</p>
  <p>On the far curb she pats your hand and tells you rain is coming; she can feel it in her knee. Then she is gone down the lane with her cart, and you are standing alone on the corner in the ordinary evening.</p>
  <p>No chime. No number climbing anywhere. You keep waiting to feel the thing you used to feel.</p>
  <p>It doesn't come. What comes instead is a question, quiet as a knife going in:</p>
  <p class="beat">All those weeks — was it her you were helping, or the number?</p>`,
 choices:[ {t:'Walk', go:'e6s7'} ]
},

e6s6b:{
 onEnter:()=>{ state.flags.e6_hesitated = true; },
 html:()=>`
  <p>You stand there doing math you hate. Nine seconds of green. Twelve seconds of her. The gap in the middle where you used to get paid.</p>
  <p>While you're still counting, a kid in a school uniform jogs past you, takes her arm, and walks her across like it's nothing. Ten seconds, door to door. He doesn't look back. He doesn't look proud. It costs him nothing, because nobody ever paid him a point in his life.</p>
  <p>The light turns green again. Then red. Then green. You are still on the same corner.</p>
  <p class="beat">The system never taught you to help. It taught you to check the price first. The kid never had a price to check.</p>`,
 choices:[ {t:'Walk', go:'e6s7'} ]
},

e6s7:{
 html:()=>`
  <p>You don't go home.</p>
  <p>You go down into the station and ride the orange line west, all the way, because your feet want the end of the line and nothing else in your head has an opinion anymore.</p>
  <p>The train empties as it goes. By the last station it's you, two students with plastic bags of dinner, and the hum of the rails.</p>
  <p class="beat">End of the line. You get out.</p>`,
 choices:[ {t:'The sea wall', go:'e6s8'} ]
},

e6s8:{
 html:()=>`
  <p>The sea wall at night is wind and the sound of water working on stone. Behind the fence at your back, the university pool lies flat and closed. In front of you, the dark water, and far out, the patient lights of cargo ships waiting at ${vb('anchor')} for their turn at the port.</p>
  <p>The paint is here too. The same hand, under a real streetlight's orange wash. And this time the words were never covered:</p>
  <p class="beat">DON'T TAKE THE GOLD QUEST.</p>
  <p>You reach for the map out of habit — the gesture, anyway. There's no map to reach for. For months the south of it wore a fog only you could see, one gold point burning inside like a small flame that never went out. Now the south of the city is just the south of the city.</p>
  <p>The gold quest is gone with everything else. The warning outlived the thing it was warning about.</p>
  <p>Except. Someone climbed up here with a can of paint. Someone crossed the harbor to Yancheng and did it again. Someone <i>meant</i> it — and paint doesn't need a system to stay real.</p>
  <p>It isn't a warm thought. It's just the only one tonight that holds.</p>`,
 choices:[ {t:'Stand there', go:'e6s9'} ]
},

e6s9:{
 html:()=>`
  <p>Your phone buzzes.</p>
  <p>It's out of your pocket before you know your hand has moved. Your heart is somewhere up near your collar.</p>
  <p>Group chat. Someone from the office has shared a hotpot ${vb('coupon')}. Forty percent off, weekdays only.</p>
  <p>You stand with the phone glowing in your hand and the sea loud below, and you understand, completely, what these months have made of you.</p>`,
 choices:[
   {t:'Put it away. Give the water a while.', go:'e6s10', set:{e6_night:'water'}},
   {t:'Start the long ride home', go:'e6s10', set:{e6_night:'home'}}
 ]
},

e6s10:{
 onEnter:()=>{ grant('still_here'); },
 html:(st)=>`
  <p>${st.flags.e6_night==='water' ? "You give the water twenty minutes it doesn't need. The freighter lights don't move. Neither do you. Then the wind finds the gap in your collar, and that decides it." : "The ride home is long and bright and nearly empty, the windows giving you back your own face all the way east."}</p>
  <p>Past the temple. Up the stairs. Lights off.</p>
  <p>You used to fall asleep building tomorrow: which street, which quest, how many points to the next level. The ceiling would fill up with plans.</p>
  <p>Tonight the ceiling is just a ceiling.</p>
  <p>Tomorrow the alarm will ring, and you will get up, and no box will open, and you will go anyway. That is the whole plan. That is all of it.</p>
  <p class="beat">The system is gone. The silence stays up with you.</p>`,
 choices:[ {t:'EPISODE COMPLETE — open the Menu', go:'end6'} ]
},

e7s1:{
 onEnter:()=>{ state.episode = 7; snapshotEpisode(7); },
 html:()=>`
  <p class="quiet">EPISODE 7 — THE COMEBACK</p>
  <p>Boss Lin's radio is singing when you turn into the alley — some old song, mid-chorus, the way it has sung every morning since the day you fixed it. He sees you coming and lays your egg pancake on the hot plate without a word. <i>Tss, tss.</i> Still the best sound on this street.</p>
  <p>The quiet is just quiet now. Somewhere in the last few weeks it stopped being an absence and went back to being morning.</p>
  <p>You still walk streets you've never walked. Nobody sends you. You still carry things for people, still notice the man on the corner who needs a hand with a ladder, still stop. It turns out the habits were never the system's.</p>
  <p class="beat">They just lived there.</p>`,
 choices:[ {t:'Evening. The crossing.', go:'e7s2'} ]
},

e7s2:{
 onEnter:()=>{ grant('twelve_seconds'); },
 html:(st)=>`
  <p>${st.flags.e6_helped ? "The light by the temple still changes too fast, and she is there again — and this time she sees you coming and lifts one hand a little, the way you'd flag a bus you know will stop." : "The light by the temple still changes too fast, and she is there again. This time you are moving before the thought has time to become a thought. Somewhere behind you, you imagine a kid in a school uniform nodding at you, one colleague to another."}</p>
  <p>You take her arm. Nine seconds of green, twelve of her, and the numbers have stopped mattering. On the far curb she tells you rain is coming. The knee is never wrong.</p>`,
 choices:[
   {t:'Ask her name. It\'s time.', go:'e7s3', set:{e7_asked_name:true}},
   {t:'Let the quiet be the conversation.', go:'e7s3'}
 ]
},

e7s3:{
 onEnter:()=>{ if(state.flags.e7_asked_name) grant('by_name'); },
 html:(st)=>`
  <p>${st.flags.e7_asked_name ? "\"A-po,\" she says, in a tone that closes the matter. A-po. Grandmother to the whole street, then. You can live with that. She pats your hand once more and goes off down the lane with her cart, squeaking into the evening." : "You walk her to the mouth of her lane and leave it at that. Some people you know by the weight of their arm on yours. Names would only be paperwork."}</p>
  <p>On Wednesday you catch yourself planning at your desk, the way you used to plan quests — a map open in your head, timing the light, counting the stops. Except nobody assigned this one. This one is yours.</p>
  <p>The warehouse wall in Yancheng. The covered line. <i>…LV9…</i></p>
  <p>You have been carrying those three characters for months. Time to go back and press on the ${vb('bruise')}.</p>`,
 choices:[ {t:'Saturday morning. Yancheng.', go:'e7s4'} ]
},

e7s4:{
 onEnter:()=>{ grant('wet_paint'); },
 html:()=>`
  <p>The warehouse hasn't moved. The gap between the brick and the sea wall is exactly as narrow as you remember, and smells exactly as much like rope and low tide.</p>
  <p>The painted trophy is still there, faded but holding, the way it has held for years.</p>
  <p>And the covered line beneath it—</p>
  <p class="beat">The grey is new.</p>
  <p>Not new like this year. New like this month. Flat, clean, no dust in it, the edges still sharp. You put one finger against it, gently, the way you'd test a wound. It is not quite done being paint.</p>
  <p>Somebody came here — while every box in the city was dark, while you were learning to live on nothing — and painted the silence over again.</p>
  <p>You take three photos, the same three you took a lifetime ago. Then a fourth, close up, of the fresh edge.</p>
  <p class="beat">The painter left a warning, once. The coverer keeps a schedule.</p>`,
 choices:[ {t:'The market. It\'s Saturday, after all.', go:'e7s5'} ]
},

e7s5:{
 html:(st)=>`
  <p>You ride the three stops back and walk down into the dome's glow, half out of habit, half out of something you don't examine too closely.</p>
  <p>${st.flags.e6_left_word ? "The owner spots you across two lanes of tables and waves you over like she has been waiting all morning. \"She came,\" she says, no greeting. \"Tuesday. I told her, word for word.\" She looks extremely pleased with herself, and has earned it. \"She said Saturdays.\"" : "The owner catches your sleeve as you pass her table. \"Your friend came back,\" she says. \"Asking about the other one from that day. I described you.\" She looks apologetic and not sorry at all. \"There aren't many people who guard a folding table like a border crossing.\""}</p>
  <p>And there, at the end of the passage, by the drinks stand: Yun. Two cold teas in her hands. She holds one out as you walk up, like you're the one who's late.</p>`,
 choices:[ {t:'Take the tea', go:'e7s6'} ]
},

e7s6:{
 html:()=>`
  <p>You find a bench where the passage widens, under the edge of the dome's light.</p>
  <p>"Mine was quiet for forty days," she says, with no hello at all. "I counted. Of course I counted."</p>
  <p>"How long have you had it?" you ask. "Altogether."</p>
  <p>"Two hundred and ninety-one days." No pause at all. "You?"</p>
  <p>"…Months," you say, after actually trying to count. "I'd have to work it backward in breakfasts."</p>
  <p>She looks at you the way you'd look at someone who has confessed to not owning a calendar. Nine levels, in under a year — because she never once said no to any of it. Your months against her days. The math of her is suddenly very simple.</p>
  <p>She turns her cup a quarter turn. "Then, one Saturday, a woman grabbed my wrist and put a stall in my hands — and mid-grab, after forty days of nothing, it came back. PARTY. Quest. Timer. All of it, all at once."</p>
  <p>She looks at you, level. "The day I met you."</p>
  <p>And you finally understand what you saw across that clothes rack — a woman staring at empty air the way you'd reread a line that surprised you. That wasn't someone checking a panel. That was someone whose panel had just come back from the dead, deciding whether to believe it.</p>
  <p>Yours went dark not long after that Saturday. You set the two facts side by side, and they sit there, not quite a pattern. "Will mine come back?" you ask, because the question refuses to stay in.</p>
  <p>"I don't know," she says. "Mine did." From her, that counts as comfort, and strangely, it works as some.</p>
  <p>"The morning after the stall," she goes on, "it offered me a quest before my alarm went off. And I looked at it — and I said no." A beat. "First time in nine levels. My hands were shaking, if you want the truth."</p>
  <p>"What happened?"</p>
  <p>"Nothing happened." She sounds like she still doesn't quite believe it. "It waited a moment, like it was thinking. Then it offered a smaller one. I did the smaller one." Quarter turn of the cup. "It was a good quest."</p>`,
 choices:[ {t:'The thing she isn\'t saying', go:'e7s7'} ]
},

e7s7:{
 html:(st)=>`
  <p>${st.flags.give_her_room ? "\"You didn't ask me, that day at the stall,\" she says, eyes on the passage. \"You had the question and you left it. So I'll tell you one thing for free.\"" : "\"You asked me once about the gold quest,\" she says, eyes on the passage. \"I closed the door on you. Fair's fair — here's one thing through the crack.\""}</p>
  <p>"That Saturday night, after we folded the last of it, I opened my map for the first time in forty days. The first thing it showed me was the gold point. Front and center." She turns the cup. "And every morning since, that box opens itself. Every morning, I close it."</p>
  <p>"It isn't angry about it. That's the strange part. It just… asks again."</p>
  <p>The photos are in your pocket. Four of them. A fresh grey edge that isn't done being paint.</p>`,
 choices:[
   {t:'Show her. "The wall in Yancheng. Someone re-covered it. This month."', go:'e7s8', set:{e7_told_yun:true}},
   {t:'Keep the photos in your pocket. For now.', go:'e7s8'}
 ]
},

e7s8:{
 html:(st)=>`
  <p>${st.flags.e7_told_yun ? "She looks at the fourth photo for a long time. When she speaks, her voice has dropped, and slowed. \"Then they're still in the city. Whoever covers it.\" She hands the phone back with both hands, carefully, like it's gotten heavier. \"Watch that wall. If it changes again — tell me. The owner knows my Saturdays.\"" : "You leave the photos where they are. Some cards you hold until you understand the game better. She would approve, probably. You don't test the theory."}</p>
  <p>At the foot of the stairs she stops, the way she did once before.</p>
  <p>"The system never made me do anything," she says, like it's a ${vb('receipt')} she has checked twice and finally accepts. "It asked. It took me nine levels to learn I could answer."</p>
  <p>She shoulders her bag. "Yours will come back or it won't. Either way—" and it is almost, almost a smile — "you seem to be running fine on ${vb('manual')}."</p>
  <p class="beat">Then she's up the stairs and gone, into the Saturday noise.</p>`,
 choices:[ {t:'The week turns', go:'e7s9'} ]
},

e7s9:{
 onEnter:()=>{ grant('comeback'); },
 html:()=>`
  <p>Thursday, late. Overtime — the real kind, deadline weather — and on the way home you stop at the convenience store, the way you did a hundred late nights ago. Kiwi nods at you over the register. The rice balls are entering their final hour.</p>
  <p>You tap your card. <i>Beep.</i></p>
  <p class="beat">And then you see it.</p>
  <p>Words. In the air. Soft green light, like an old computer screen.</p>
  ${sysBox('📋 NEW QUEST','A Different Road',[
    ['flair','Tomorrow, walk to work by a road you have never used before.'],
    ['pts','Reward: +10 points']
  ])}
  <p>You stand very still. The last time this happened, you asked the person behind this counter if they could see it. This time you don't have to ask anyone anything.</p>
  <p>"What?" says Kiwi, reading your face.</p>
  <p>"Nothing," you say. "Old friend."</p>
  <p>You try to think of a road to work you have never used. It takes a while. It takes a genuinely long while.</p>
  <p class="beat">That, right there, is the distance, measured.</p>
  ${sysBox('🏆 ACHIEVEMENT UNLOCKED','The Comeback',[['flair','"It came back. So had you."'],['pts','+10 points']])}`,
 choices:[
   {t:'Take the quest. For old times\' sake.', go:'e7s10a'},
   {t:'Close the box. Gently.', go:'e7s10b'}
 ]
},

e7s10a:{
 onEnter:()=>{ grant('old_friends'); },
 html:()=>`
  <p>In the morning you find it: a lane you have somehow never used, hiding in plain sight two blocks from everything. New wall colors. A different set of breakfast smells. A cat running a doorway like a small business.</p>
  <p>You walk it slow. Not because the quest says to — the quest never says how. Because slow is how you walk new streets now. You learned that somewhere, from someone, and the someone was you.</p>
  ${sysBox('✅ QUEST COMPLETE','A Different Road',[['flair','Reward: already collected, somewhere along the way.']])}
  <p>You laugh — once, out loud, alone in the lane. The cat declines to comment.</p>`,
 choices:[ {t:'That evening', go:'e7s11'} ]
},

e7s10b:{
 onEnter:()=>{ grant('no_thank_you'); },
 html:()=>`
  <p>You look at the box for a long moment. Then, gently, the way you'd wave off a second helping from someone you love: <i>no</i>.</p>
  <p>The box holds still. A breath. Like it's thinking.</p>
  <p>Then it folds away — and a smaller one opens.</p>
  ${sysBox('📋 NEW QUEST','One Street',[['flair','Just one.']])}
  <p>You close that one too. Not tonight. Tonight you have a road in mind already — the old one, the one with almost two thousand mornings in it, the one where you know every crack.</p>
  <p>In the morning you walk it end to end, unhurried, and it turns out the old road is also yours. It always was. You just needed all those new ones to see it.</p>`,
 choices:[ {t:'That evening', go:'e7s11'} ]
},

e7s11:{
 html:()=>`
  <p>That evening, on the rooftop of your building where the water tanks hum, you open the map for the first time since the lights came back.</p>
  <p>The city is all there. Every district you earned, lit and yours — the harbor, the old streets, the ferry line, the long coast road. Months of feet, drawn in light.</p>
  <p>Then you look south.</p>
  <p>The fog has moved. Not gone — moved. It sits farther back than you remember, like a tide that went out while nobody watched. And the gold point is not deep inside it anymore.</p>
  <p>It sits at the edge, where the grey thins.</p>
  <p class="beat">As if, while everything slept, it walked forward to meet you.</p>
  <p>You tap it, the way you have tapped it a hundred times, expecting the polite nothing it has always given you.</p>
  ${sysBox('🟡 GOLD QUEST','???',[['flair','No longer sleeping.']],'gold')}
  <p>Five words on a wall by the sea, underlined twice. A grey stripe in Yancheng that isn't done being paint. A woman who closes the same box every morning.</p>
  <p>You close the map and stand a while in the warm dark, the city humming below, the south holding its single gold light.</p>
  <p>Tomorrow: work, the crossing, maybe rain — the knee is never wrong. And the gold point will still be there, awake, at the edge of the fog.</p>
  <p class="beat">So will you.</p>`,
 choices:[ {t:'EPISODE COMPLETE — open the Menu', go:'end7'} ]
},

 },

let qid = 0, Q = null;
let rate = store.get("rate", .85);
let voiceURI = store.get("voiceURI", "");
const VOICES = {all:[], f:[], m:[], main:null};
const FEM = /Samantha|Ava|Allison|Susan|Zira|Aria|Jenny|Michelle|Emma|Joanna|Salli|Kendra|Kimberly|Ivy|Karen|Moira|Tessa|Victoria|Serena|Kate|Fiona|Veena|Libby|Sonia|Natasha|Nicky|Sara|Female|Google US English/i;
const MAL = /Alex|Daniel|Tom|Aaron|Arthur|Rishi|David|Mark|Guy|Ryan|Eric|Christopher|Matthew|Joey|Justin|Brian|Oliver|Gordon|Lee|Evan|Nathan|Male/i;
const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Ralph|Fred|Kathy|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
function vq(v){ const s = (v.voiceURI || "") + " " + v.name;
  if(/premium|高品質|優質/i.test(s)) return 2; if(/enhanced|增強|加強|Natural|Neural|Online/i.test(s)) return 1; return 0; }
const QLABEL = ["一般音質","增強音質","高品質"];
function pickVoice(){
  if(!SYN) return;
  const us = v => /^en[-_]US/i.test(v.lang) ? 0 : 1, hq = v => 2 - vq(v);
  const vs = SYN.getVoices().filter(v=>/^en/i.test(v.lang) && !NOVELTY.test(v.name)).sort((a,b)=>us(a)-us(b) || hq(a)-hq(b));
  VOICES.all = vs; VOICES.f = vs.filter(v=>FEM.test(v.name)); VOICES.m = vs.filter(v=>!FEM.test(v.name) && MAL.test(v.name));
  VOICES.main = vs.find(v=>v.voiceURI === voiceURI)
    || vs.find(v=>us(v)===0 && /Samantha|Google US English|Aria|Jenny|Ava|Allison/i.test(v.name)) || VOICES.f[0] || vs[0] || null;
  fillVoiceSel();
}
/* a story told by a man uses a male voice, unless the reader picked a voice by hand */
function narrator(s){
  if(voiceURI || !s || s.voice !== "m") return VOICES.main;
  return VOICES.m.find(v=>v.lang === (VOICES.main && VOICES.main.lang)) || VOICES.m[0] || VOICES.main;
}
if(SYN){ pickVoice(); SYN.onvoiceschanged = pickVoice; }
const sayAs = t => Object.entries(LEVEL.sayAs || {}).reduce((x,[w,r])=>x.split(w).join(r), t);  /* voice-only respellings */
const speakable = t => sayAs(plain(t)).replace(/[“”]/g,'"').replace(/[’‘]/g,"'").replace(/…/g,"...").replace(/—/g,", ").replace(/\$(\d+)/g,"$1 dollars");
function sentences(t){
  const s = speakable(t).replace(/\b([ap])\.m\./g,"$1_m_").replace(/\b(Mr|Mrs|Ms|Dr|St)\./g,"$1_");
  return (s.match(/[^.!?]+(?:[.!?]+["']?|$)/g) || [s]).map(x=>x.replace(/([ap])_m_/g,"$1.m.").replace(/\b(Mr|Mrs|Ms|Dr|St)_/g,"$1.").trim()).filter(Boolean);
}
function prosody(sent, mood){
  const m = MOOD[mood] || [1,1];
  let r = rate * m[0], p = m[1];
  if(/!["']?$/.test(sent)){ r *= 1.06; p += .08; } else if(/\?["']?$/.test(sent)) p += .07; else if(/\.\.\.["']?$/.test(sent)) r *= .92;
  return {rate:Math.max(.5, Math.min(1.5, r)), pitch:Math.max(.8, Math.min(1.25, p))};
}
function pushTTS(q, it){
  const ss = sentences(it.text), v = narrator(S[cur]);
  ss.forEach((s,n)=>{ const pr = prosody(s, it.mood), last = n === ss.length-1;
    const gap = last ? 450 : /\.\.\.["']?$/.test(s) ? 450 : /\?["']?$/.test(s) ? 320 : 260;
    q.push({text:s, el:it.el, gap, voice:v, rate:pr.rate, pitch:pr.pitch}); });
}
const CLIPS = new Set();
const player = new Audio(); player.preload = "auto";
try{ fetch(LEVEL.audio + "manifest.json", {cache:"no-cache"}).then(r=>r.ok ? r.json() : null).then(j=>{
  if(j) (Array.isArray(j) ? j : (j.files || [])).forEach(f=>CLIPS.add(String(f).replace(/\.mp3$/i,""))); }).catch(()=>{}); }catch(e){}
function clearSpeaking(){ $$(".speaking").forEach(e=>e.classList.remove("speaking")); }
function stopSpeech(){ qid++; if(SYN) SYN.cancel(); try{ player.pause(); }catch(e){} clearSpeaking(); Q = null; Music.duck(false); playBtns(); }
function pauseSpeech(){ if(!Q || Q.paused) return; qid++; Q.paused = true; Q.k = Math.max(0, Q.k-1); if(SYN) SYN.cancel(); try{ player.pause(); }catch(e){} Music.duck(false); playBtns(); }
function resumeSpeech(){ if(Q && Q.paused){ Q.paused = false; runQueue(); } }
function sayQueue(items, mode){
  const hasClip = items.some(it=>it.clip && CLIPS.has(it.clip));
  if(!SYN && !hasClip){ toast("這個瀏覽器不支援朗讀功能"); return; }
  stopSpeech();
  const q = [];
  items.forEach(it=>{ if(it.clip && CLIPS.has(it.clip)) q.push({audio:it.clip, el:it.el, gap:450, it}); else pushTTS(q, it); });
  Q = {q, k:0, mode, paused:false}; runQueue();
}
function runQueue(){
  const my = ++qid, S_ = Q, q = S_.q;
  playBtns(); Music.duck(true);
  const next = ()=>{
    if(my !== qid) return;
    if(S_.k >= q.length){ clearSpeaking(); Q = null; Music.duck(false); playBtns(); return; }
    const x = q[S_.k++];
    if(x.el && !x.el.classList.contains("speaking")){ clearSpeaking(); x.el.classList.add("speaking"); if(q.length > 1) x.el.scrollIntoView({block:"center", behavior:"smooth"}); }
    if(x.audio){
      let failed = false;
      const fail = ()=>{ if(failed || my !== qid) return; failed = true; const sub = []; pushTTS(sub, x.it); q.splice(S_.k, 0, ...sub); next(); };
      player.onended = ()=>{ if(my === qid) setTimeout(next, x.gap); }; player.onerror = fail;
      player.src = `${LEVEL.audio}${x.audio}.mp3`; player.playbackRate = rate < .8 ? .85 : 1;
      const pr = player.play(); if(pr && pr.catch) pr.catch(fail); return;
    }
    if(!SYN){ next(); return; }
    const u = new SpeechSynthesisUtterance(x.text);
    if(x.voice){ u.voice = x.voice; u.lang = x.voice.lang; } else u.lang = "en-US";
    u.rate = x.rate; u.pitch = x.pitch;
    u.onend = ()=>{ if(my === qid) setTimeout(next, x.gap); };
    u.onerror = ()=>{ if(my === qid) setTimeout(next, 50); };
    SYN.speak(u);
  };
  setTimeout(next, 60);
}
function sayWord(t){ if(!SYN) return; stopSpeech(); const u = new SpeechSynthesisUtterance(sayAs(t)); const v = VOICES.main;
  if(v){ u.voice = v; u.lang = v.lang; } else u.lang = "en-US"; u.rate = Math.min(1, rate); SYN.speak(u); }
let speechUnlocked = false;
function unlockSpeech(){ if(speechUnlocked || !SYN) return; speechUnlocked = true;
  try{ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; u.lang = "en-US"; SYN.speak(u); }catch(e){} }
["touchend","click","keydown"].forEach(t=>document.addEventListener(t, unlockSpeech, true));
function fillVoiceSel(){
  const s = $("#voiceSel"); if(!s) return;

}

    b.innerHTML = !mine ? SVGI.play + "<span>Listen 朗讀全文</span>" : Q.paused ? SVGI.play + "<span>Resume 繼續</span>" : SVGI.pause + "<span>Pause 暫停</span>";

    <p>目前進度：讀完 ${readCount()} 篇，共 ${wordsRead().toLocaleString()} 個英文字。</p>
    <p><b>經典故事來源</b>（皆為公有領域作品，由 InkQuest 改寫為 ${LEVEL.cefr} 程度）</p>
    <ul>${LEVEL.credits.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
    ${(LEVEL.notes || []).map(n=>`<p style="font-size:13px">${esc(n)}</p>`).join("")}
    <p>字型：Jersey 15、Literata（SIL Open Font License）。音樂為瀏覽器即時 FM 合成。</p>
    <p>Created with Claude.</p>
    <p>© 2026 Wen-Hung Fang. All rights reserved.</p>`;
}

/* ---------------- settings ---------------- */
let fs = store.get("fs", 19);
function applyFs(){ document.documentElement.style.setProperty("--fs", fs+"px"); $$("#sizes button").forEach(b=>b.classList.toggle("on", +b.dataset.v === fs)); }
function applyRate(){ $$("#rates button").forEach(b=>b.classList.toggle("on", +b.dataset.v === rate)); }
function applyZhDef(){ const d = !!store.get("zhdef", false); $$("#zhset button").forEach(b=>b.classList.toggle("on", !!+b.dataset.v === d)); }
function applyTheme(){ const t = store.get("theme", "auto"); if(t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  $$("#themes button").forEach(b=>b.classList.toggle("on", b.dataset.v === t)); }
function setZh(on){ showZh = on; document.body.classList.toggle("showzh", on); const b = $("#zhBtn"); if(b){ b.textContent = on ? "隱藏中文" : "顯示中文"; b.classList.toggle("sel", on); b.setAttribute("aria-pressed", on); } }

/* ---------------- toast ---------------- */
const toastQ = []; let toastBusy = false;
function toast(m){ if(toastQ[toastQ.length-1] !== m) toastQ.push(m); if(!toastBusy) toastNext(); }
function toastNext(){ const m = toastQ.shift(); if(m === undefined){ toastBusy = false; return; } toastBusy = true;
  const t = $("#toast"); t.textContent = m; t.classList.add("on"); setTimeout(()=>{ t.classList.remove("on"); setTimeout(toastNext, 300); }, 2600); }

/* ---------------- events ---------------- */
document.addEventListener("click", e=>{
  const t = e.target;
  const g = t.closest(".g"); if(g){ openPop(g.dataset.k); return; }
  const go = t.closest("[data-go]");
  if(go){ const para = go.dataset.para; closeDrawer(); renderStory(+go.dataset.go, para === undefined ? undefined : +para); return; }
  if(t.closest("[data-home]")){ closeDrawer(); renderHome(); return; }
  const pp = t.closest("[data-pop]"); if(pp){ openPop(pp.dataset.pop); return; }
  const sp = t.closest(".pspk");
  if(sp){ const k = +sp.dataset.p; if(Q && Q.mode === "p"+k){ stopSpeech(); return; }
    const s = S[cur]; sayQueue([{text:s.paras[k][0], mood:s.paras[k][2], el:$("#p"+k), clip:`s${pad(cur+1)}-${pad(k+1)}`}], "p"+k); return; }
  if(t.closest("#playAll")){
    if(Q && Q.mode === "all"){ Q.paused ? resumeSpeech() : pauseSpeech(); return; }
    const s = S[cur]; sayQueue(s.paras.map((p,k)=>({text:p[0], mood:p[2], el:$("#p"+k), clip:`s${pad(cur+1)}-${pad(k+1)}`})), "all"); return; }
  if(t.closest("#playRe")){ const s = S[cur]; sayQueue(s.paras.map((p,k)=>({text:p[0], mood:p[2], el:$("#p"+k), clip:`s${pad(cur+1)}-${pad(k+1)}`})), "all"); return; }
  if(t.closest("#zhBtn")){ setZh(!showZh); return; }
  const qo = t.closest(".qo button"); if(qo){ answer(+qo.closest(".q").dataset.q, +qo.dataset.o); return; }
  if(t.closest("#stampBtn")){ stamp(); return; }
  const say = t.closest("[data-say]"); if(say){ sayWord(say.dataset.say); return; }
  const star = t.closest("[data-star]");
  if(star){ const k = star.dataset.star, i = stars.indexOf(k); if(i < 0) stars.push(k); else stars.splice(i,1); store.set("stars", stars);
    openPop(k); toast(i < 0 ? "收藏到詞彙的「我的收藏」" : "取消收藏"); if(!$("#p-words").hidden) buildWords(); return; }
  if(t.closest("[data-close]")){ closePop(); return; }
  if(pop.classList.contains("on") && !t.closest("#pop")) closePop();
  if(!$("#mp").hidden && !t.closest("#mp") && !t.closest("#musicBtn")) $("#mp").hidden = true;
});
document.addEventListener("keydown", e=>{
  if((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("g")){ e.preventDefault(); openPop(e.target.dataset.k); }
  if(e.key === "Escape"){ closePop(); closeDrawer(); $("#mp").hidden = true; }
});
$("#menuBtn").onclick = ()=>openDrawer("toc");
$("#setBtn").onclick = ()=>openDrawer("set");
$("#dClose").onclick = closeDrawer;
$("#scrim").onclick = closeDrawer;
$("#brand").onclick = ()=>renderHome();
$("#tabs").onclick = e=>{ const b = e.target.closest("button"); if(b) switchPane(b.dataset.p); };
$("#q").addEventListener("input", search);
$("#wseg").onclick = e=>{ const b = e.target.closest("button"); if(b){ wmode = b.dataset.w; buildWords(); } };
$("#sizes").onclick = e=>{ const b = e.target.closest("button"); if(b){ fs = +b.dataset.v; store.set("fs", fs); applyFs(); } };
$("#rates").onclick = e=>{ const b = e.target.closest("button"); if(b){ rate = +b.dataset.v; store.set("rate", rate); applyRate(); } };
$("#zhset").onclick = e=>{ const b = e.target.closest("button"); if(b){ store.set("zhdef", !!+b.dataset.v); applyZhDef(); setZh(!!+b.dataset.v); } };
$("#themes").onclick = e=>{ const b = e.target.closest("button"); if(b){ store.set("theme", b.dataset.v); applyTheme(); } };
$("#voiceSel").onchange = e=>{
  const v = e.target.value === "" ? null : VOICES.all[+e.target.value];
  voiceURI = v ? v.voiceURI : ""; store.set("voiceURI", voiceURI); pickVoice();
  if(v && SYN){ SYN.cancel(); const u = new SpeechSynthesisUtterance("Hello! Shall we read a story?"); u.voice = v; u.lang = v.lang; u.rate = rate; SYN.speak(u); }
};
let resetArm = 0;
$("#resetBtn").onclick = ()=>{
  if(Date.now() - resetArm > 4000){ resetArm = Date.now(); $("#resetBtn").textContent = "確定要清除嗎？再按一次"; setTimeout(()=>{ $("#resetBtn").textContent = "清除閱讀紀錄"; }, 4000); return; }
  read = {}; quiz = {}; stars = []; ["read","quiz","stars","pos"].forEach(store.del); resetArm = 0;
  $("#resetBtn").textContent = "清除閱讀紀錄"; toast("閱讀紀錄已清除"); closeDrawer(); renderHome();
};
/* music panel */
$("#tracks").innerHTML = Music.TR.map((t,i)=>`<button class="trk" data-t="${i}"><span class="pl">▶</span><span><span class="tn">${esc(t.n)}</span><span class="tz">${esc(t.z)}</span></span></button>`).join("");
$("#tracks").onclick = e=>{ const b = e.target.closest(".trk"); if(!b) return; const i = +b.dataset.t; if(Music.cur === i) Music.stop(); else Music.play(i); };
$("#musicBtn").onclick = ()=>{ $("#mp").hidden = !$("#mp").hidden; };
$("#mStop").onclick = ()=>Music.stop();
$("#vol").value = Math.round(Music.vol*100);
$("#vol").addEventListener("input", e=>Music.setVol(e.target.value/100));

/* ---------------- cover ---------------- */
function leaveCover(){ document.body.classList.remove("cover"); Scene.stop(); }
let musicTried = false;
function coverTap(e){
  if(!document.body.classList.contains("cover")) return;
  if(!musicTried){ musicTried = true; Music.play(store.get("trk", 0) || 0); }
  if(e.target.closest("#goBtn")) leaveCover();
}
/* touchend/click count as a user gesture on iOS; pointerdown doesn't */
$("#cover").addEventListener("touchend", coverTap);
$("#cover").addEventListener("click", coverTap);
$("#cover").addEventListener("keydown", e=>{ if(e.key === "Enter") leaveCover(); });
["touchend","click"].forEach(t=>document.addEventListener(t, ()=>Music.wake(), true));

/* ---------------- boot ---------------- */
function boot(){
  $("#cvK").textContent = LEVEL.kicker; $("#cvZ").textContent = LEVEL.zh; $("#brandLv").textContent = `L${LEVEL.n} · ${LEVEL.cefr}`;
  applyFs(); applyRate(); applyZhDef(); applyTheme(); setZh(showZh); Music.ui();
  const p = store.get("pos", -1);
  if(p >= 0 && p < S.length) renderStory(p); else renderHome();
  document.body.classList.add("cover"); Scene.start();
}
boot();

</script>
</body>
</html>

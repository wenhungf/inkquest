ACTS.clearDice = ()=>{ DICE.pool = {}; DICE.mod = 0; DICE.adv = ""; DICE.label = ""; renderDice(); };
ACTS.rollDice = ()=>rollDice();
function rollDice(){
  const keys = Object.keys(DICE.pool).filter(k=>DICE.pool[k]).map(Number); if(!keys.length){ toast("Pick a die first. 先選一顆骰子"); return; }
  const tray = $("#tray"), tot = $("#total"); Music.sfx("roll");
  const results = [];
  keys.forEach(n=>{ for(let i=0;i<DICE.pool[n];i++) results.push({n, v:1+rnd(n)}); });
  let extra = null;
  if(DICE.adv && keys.length === 1 && keys[0] === 20 && DICE.pool[20] === 1){ extra = {n:20, v:1+rnd(20)}; }
  tray.innerHTML = results.concat(extra ? [extra] : []).map(r=>`<div class="rd spin">${dieSvg(r.n)}<b>?</b></div>`).join(""); tot.textContent = ""; tot.className = "total";
  setTimeout(()=>{
    let used = results.slice(), dropped = null;
    if(extra){ const a = results[0], b2 = extra; const keepA = DICE.adv === "adv" ? a.v >= b2.v : a.v <= b2.v; used = [keepA ? a : b2]; dropped = keepA ? b2 : a; }
    const all = results.concat(extra ? [extra] : []);
    tray.innerHTML = all.map(r=>`<div class="rd${r === dropped ? " drop" : ""}">${dieSvg(r.n)}<b>${r.v}</b></div>`).join("");
    let sum = used.reduce((s,r)=>s + r.v, 0) + DICE.mod;
    const d20 = keys.length === 1 && keys[0] === 20 && (DICE.pool[20] === 1);
    const nat = d20 ? used[0].v : null;
    tot.innerHTML = `${sum}` + (nat === 20 ? `<div class="px gold" style="font-size:24px">NATURAL 20! 大成功！</div>` : nat === 1 ? `<div class="px" style="font-size:24px;color:var(--red)">Natural 1… 大失敗…</div>` : "");
    tot.className = "total" + (nat === 20 ? " crit" : nat === 1 ? " fail" : "");
    if(nat === 20) Music.sfx("crit"); else if(nat === 1) Music.sfx("fail");
    const line = `${DICE.label ? DICE.label + ": " : ""}${diceExpr()}${DICE.adv ? " (" + DICE.adv + ")" : ""} → ${all.map(r=>r.v).join(", ")} = ${sum}`;
    DICE.hist.unshift(line); DICE.hist = DICE.hist.slice(0,30); store.set("hist", DICE.hist);
    const h = $("#hist"); if(h) h.innerHTML = DICE.hist.slice(0,8).map(x=>`<div>${esc(x)}</div>`).join("");
  }, 650);
}

ht way to play. The DM and the players decide together. Tell your DM what you enjoy most.", "有些團喜歡聊天交涉，有些喜歡解謎，有些喜歡大場面的戰鬥。沒有唯一正確的玩法，由 DM 和玩家一起決定。告訴你的 DM 你最喜歡什麼。"], ["8. Roleplay!", "角色扮演！", "Talk like your hero. Ask questions. Be curious. The best adventures come from good ideas, not good numbers.", "用英雄的口吻說話。多問問題，保持好奇。最棒的冒險來自好點子，不是好數字。"]];
    body = pillarsHTML() + `<h3 style="margin:16px 0 8px">The basics in 8 steps <span class="zh">8 個步驟學會玩</span></h3>` +
      P.map(p=>`<div class="panel tight"><h3>${p[0]} ${SAY(p[0] + " " + p[2])}</h3><span class="zh">${p[1]}</span><p style="margin:6px 0 0">${p[2]}</p><span class="zh">${p[3]}</span></div>`).join("") +
      `<div class="tip"><span class="i">💡</span><p>Tap any <span class="term">dotted word</span> to hear it and see Chinese. 點任何有底線的字，可以聽發音、看中文。</p></div>`;
  } else if(tab === "conds"){
    body = `<div class="list">${Object.keys(CONDITIONS).map(k=>`<div class="li"><div class="main"><b>${k}</b> ${SAY(k)} <span class="muted">· ${CONDITIONS[k][0]}</span><div style="font-size:15px">${CONDITIONS[k][1]}</div><span class="zh">${CONDITIONS[k][2]}</span></div></div>`).join("")}</div>`;
  } else if(tab === "spells"){
    const f = VIEW.cls || "all", lv = VIEW.lv == null ? "all" : VIEW.lv;
    const list = Object.values(SPELLS).filter(s=>(f === "all" || s.cl.includes(CLASSES[f].en)) && (lv === "all" || s.l === +lv)).sort((a,b)=>a.l-b.l || a.key.localeCompare(b.key));
    body = `<div class="row" style="margin-bottom:10px"><select id="gcls" style="flex:1"><option value="all">All classes 所有職業</option>${Object.keys(CLASSES).filter(k=>CLASSES[k].cast).map(k=>`<option value="${k}" ${f===k?"selected":""}>${CLASSES[k].en} ${CLASSES[k].zh}</option>`).join("")}</select>
      <select id="glv" style="flex:1"><option value="all">All levels 所有環級</option>${[0,1,2,3].map(l=>`<option value="${l}" ${String(lv)===String(l)?"selected":""}>${l ? "Level " + l : "Cantrips 戲法"}</option>`).join("")}</select></div>
      <div class="list">${list.map(s=>`<button class="li" data-spell="${esc(s.key)}"><span class="num">${s.l || "C"}</span><div class="main"><b>${esc(s.key)}</b> <span class="muted">${esc(s.info[0])}</span><span class="zh">${esc(s.info[2])}</span></div></button>`).join("")}</div>`;
    VIEW.after = ()=>{ $("#gcls").onchange = e=>{ VIEW.cls = e.target.value; render(); }; $("#glv").onchange = e=>{ VIEW.lv = e.target.value; render(); }; };
  } else {
    body = `<div class="panel"><h3>Hero Workshop 英雄工坊</h3><p>A bilingual character builder for new players. Made for InkQuest English coaching.</p><p class="zh">為新手玩家設計的雙語角色建立器，InkQuest 英文教學使用。</p>
      <p style="font-size:14px">This work includes material from the System Reference Document 5.2.1 ("SRD 5.2.1") by Wizards of the Coast LLC, available at <a href="https://www.dndbeyond.com/srd" target="_blank" rel="noopener">https://www.dndbeyond.com/srd</a>. The SRD 5.2.1 is licensed under the Creative Commons Attribution 4.0 International License, available at <a href="https://creativecommons.org/licenses/by/4.0/legalcode" target="_blank" rel="noopener">https://creativecommons.org/licenses/by/4.0/legalcode</a>.</p>
      <p style="font-size:14px" class="muted">Compatible with fifth edition. Rules summaries, Chinese translations, music, and art are original to this tool. Summaries are simplified for learning; the SRD text in each spell's "Full rules" section is the official wording.</p>
      <p style="font-size:14px" class="muted">規則摘要、中文翻譯、音樂與美術皆為本工具原創。摘要為教學簡化版，法術的「完整規則原文」為官方 SRD 文字。</p></div>`;
  }
  return `<div class="row sp" style="margin-bottom:8px"><h2>📖 Guide <span class="zh" style="font-size:16px">指南</span></h2><button class="btn sm" data-act="home">← Home</button></div>
    <div class="tabs">${tabs.map(t=>`<button class="${t[0]===tab?"on":""}" data-act="gtab" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div>${body}`;
};
ACTS.gtab = b => { VIEW.tab = b.dataset.tab; render(); };
ACTS.home = ()=>go("home");

  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = t === "light" ? "#e7dabd" : "#15111f";
}

   <div class="seg"><button data-act="setZh" data-v="1" class="${showZh?"on":""}">Show 顯示</button><button data-act="setZh" data-v="0" class="${!showZh?"on":""}">Hide 隱藏</button></div>

   <label class="fl">Look <span class="zh">外觀</span></label>
   <div class="seg"><button data-act="setTheme" data-v="dark" class="${store.get("theme","dark")!=="light"?"on":""}">Night 夜晚</button><button data-act="setTheme" data-v="light" class="${store.get("theme","dark")==="light"?"on":""}">Parchment 羊皮紙</button></div>
   <label class="fl">Reading speed <span class="zh">朗讀速度</span></label>
   <div class="seg">${[[.7,"Slow 慢"],[.85,"A bit slow 稍慢"],[1,"Normal 正常"]].map(r=>`<button data-act="setRate" data-v="${r[0]}" class="${rate===r[0]?"on":""}">${r[1]}</button>`).join("")}</div>
   <label class="fl">Voice <span class="zh">朗讀聲音</span></label>
   <select id="voiceSel">${vs.length ? vs.map((v,i)=>`<option value="${i}" ${v===VOICES.main?"selected":""}>${esc(v.name)} · ${esc(v.lang)} · ${QLABEL[vq(v)]}</option>`).join("") : `<option>(No English voice in this browser 這個瀏覽器沒有英文語音)</option>`}</select>
   <p class="zh" style="margin:6px 0 0">iPhone: Safari can only use the phone's built-in voices. iPhone 的 Safari 只能用手機內建的聲音。</p>
   <div class="row" style="margin-top:8px"><button class="btn sm" data-say="Welcome, adventurer! Roll for initiative.">🔊 Test 試聽</button></div>

   <label class="fl">Backup <span class="zh">備份</span></label>
   <p class="zh" style="margin:0 0 8px">Heroes are saved in this browser only. Download a backup before you change phones or clear your browser. 角色只存在這個瀏覽器裡，換手機或清除瀏覽資料前請先備份。</p>
   ${inAppNote()}<div class="row"><button class="btn sm" data-act="exportAll">📤 Download all 下載全部</button><button class="btn sm" data-act="importFile">📥 Import file 匯入檔案</button></div>
   <div class="row" style="margin-top:6px"><button class="btn sm" data-act="codeAll">📋 Copy all as code 複製全部代碼</button><button class="btn sm" data-act="pasteCode">📥 Paste a code 貼上代碼</button></div>`);
  const vsEl = $("#voiceSel"); if(vsEl) vsEl.onchange = e=>{ const v = VOICES.all[+e.target.value]; if(v){ VOICES.main = v; voiceURI = v.voiceURI; store.set("voiceURI", voiceURI); say("Hello, adventurer!"); } };

ACTS.setZh = b => { showZh = b.dataset.v === "1"; store.set("zh", showZh); applyPrefs(); openSettings(); };
ACTS.setFs = b => { fs = +b.dataset.v; store.set("fs", fs); applyPrefs(); openSettings(); };
ACTS.setTheme = b => { store.set("theme", b.dataset.v); applyPrefs(); openSettings(); };
ACTS.setRate = b => { rate = +b.dataset.v; store.set("rate", rate); openSettings(); };

/* ---------- music panel ---------- */
function buildTracks(){
  $("#tracks").innerHTML = TRACKS.map((t,i)=>`<button class="trk" data-trk="${i}"><span class="pl">▶</span><span><span class="tn">${esc(t.n)}</span><span class="tz">${esc(t.z)}</span></span></button>`).join("");
  $("#tracks").addEventListener("click", e=>{ const b = e.target.closest(".trk"); if(!b) return; const i = +b.dataset.trk; if(Music.cur === i) Music.stop(); else Music.play(i); uiTracks(); });
  const v = $("#vol"); v.value = Math.round(Music.vol*100); v.oninput = ()=>Music.setVol(v.value/100);
  const s = $("#sfxVol"); s.value = Math.round(Music.sfxVol*100); s.oninput = ()=>Music.setSfx(s.value/100); s.onchange = ()=>Music.sfx("ok");
  $("#mStop").onclick = ()=>{ Music.stop(); uiTracks(); };
}
function uiTracks(){ $$("#tracks .trk").forEach(b=>{ const on = +b.dataset.trk === Music.cur; b.classList.toggle("on", on); b.querySelector(".pl").textContent = on ? "❚❚" : "▶"; }); $("#musicBtn").classList.toggle("on", Music.cur >= 0); }

/* =========================================================
   BUILDER — Quick (questions), Random (locks), Step by step, Review
   All three modes end on the same Review screen.
   ========================================================= */
let BLD = null;
const STEPS = [["class","Class","職業"],["bg","Background","背景"],["species","Species","種族"],["abil","Abilities","屬性"],["skills","Skills","技能"],["spells","Spells","法術"],["gear","Gear","裝備"],["story","Story","故事"]];
const hasSpells = c => !!casterInfo(c) || (BACKGROUNDS[c.bg] && BACKGROUNDS[c.bg].feat === "Magic Initiate");
const stepList = c => STEPS.filter(s=>s[0] !== "spells" || hasSpells(c));
const stars = n => "★".repeat(n) + "☆".repeat(3-n);

function startManual(){ const c = blank(); c.cls = "fighter"; c.species = "human"; complete(c); c.name = ""; BLD = {c, mode:"manual", step:"class", fresh:true}; go("build"); }
function startRandom(){ BLD = {c:randomChar(), mode:"random", lock:{}}; Music.sfx("roll"); go("review"); }
function startQuiz(){ BLD = {mode:"quick", q:0, ans:{}, alt:false}; go("quiz"); }

/* reset what depends on a changed choice, then fill the gaps with recommendations */
function changeClass(c, cls){
  const vals = AB.map(a=>c.base[a]);
  c.cls = cls; c.skills = []; c.expertise = []; c.style = ""; c.order = ""; c.primal = ""; c.invocations = []; c.metamagic = [];
  c.cantrips = []; c.prepared = []; c.book = []; c.inv = []; c.bonus = {}; c.base = recBase(cls, vals);
  if(!BLD || !BLD.bgPicked) c.bg = recBg(cls);
  c.mi = {list:"", ab:"", cantrips:[], spell:""};
  complete(c);
}
function changeBg(c, bg){ c.bg = bg; c.bonus = {}; c.inv = []; c.skills = []; c.mi = {list:"", ab:"", cantrips:[], spell:""}; complete(c); }
function changeSpecies(c, sp){ c.species = sp; c.lineage = ""; c.lineAb = ""; c.giant = ""; c.keen = ""; c.humanSkill = ""; c.skilled = []; c.langs = ["Common"]; c.skills = []; c.expertise = []; complete(c); }

/* ---------- Quick build ---------- */
VIEWS.quiz = ()=>{
  const n = QUIZ.length, i = BLD.q;
  if(i >= n) return quizResults();
  const Q = QUIZ[i], opts = Q.hero && BLD.alt ? Q.alt : Q.o;
  nav(`<button class="btn" data-act="quizBack">← Back</button><div class="grow">${i+1} / ${n}</div><button class="btn" data-act="quizSkip">Skip 跳過</button>`);
  return `<div class="row sp" style="margin-bottom:10px"><span class="px muted" style="font-size:18px">✨ QUICK BUILD · 快速建立</span><button class="btn sm" data-act="home">✕</button></div>
    <div class="hpbar" style="height:10px;margin-bottom:16px"><i style="width:${i/n*100}%;background:var(--gold)"></i></div>
    <h2 style="margin-bottom:4px">${esc(Q.en)} ${SAY(Q.en)}</h2><div class="zh" style="font-size:16px;margin-bottom:14px">${esc(Q.zh)}</div>
    <div class="qopt">${opts.map((o,k)=>`<button class="card${BLD.ans[Q.id] === k && (!Q.hero || BLD.ansAlt === BLD.alt) ? " sel" : ""}" data-act="quizPick" data-k="${k}">
      <div class="t">${Q.species ? emblemSpecies(o[2]) : ""}${esc(o[0])} ${SAY(o[0])}</div><span class="zh">${esc(o[1])}</span></button>`).join("")}</div>
    ${Q.hero ? `<p class="hero-toggle"><button class="btn sm" data-act="quizAlt">${BLD.alt ? "📺 Show Stranger Things heroes" : "📜 Don't know these? Try famous legends"}</button> <span class="zh">${BLD.alt ? "改回《怪奇物語》角色" : "不熟悉這些角色？改用經典傳說人物"}</span></p>` : ""}`;
};
function emblemSpecies(sp){ return `<span style="font-size:22px">${{human:"🧑",elf:"🧝",dwarf:"⛏️",halfling:"🍀",gnome:"⚙️",dragonborn:"🐉",goliath:"⛰️",orc:"🪓",tiefling:"😈"}[sp]||""}</span>`; }
ACTS.quizPick = b => { const Q = QUIZ[BLD.q]; BLD.ans[Q.id] = +b.dataset.k; if(Q.hero) BLD.ansAlt = BLD.alt; Music.sfx("click"); BLD.q++; render(); window.scrollTo(0,0); };
ACTS.quizSkip = ()=>{ delete BLD.ans[QUIZ[BLD.q].id]; BLD.q++; render(); };
ACTS.quizBack = ()=>{ if(BLD.q > 0){ BLD.q--; render(); } else if(BLD.back){ BLD = BLD.back; go("build"); } else go("home"); };
ACTS.quizAlt = ()=>{ BLD.alt = !BLD.alt; render(); };
function quizScore(){
  const sc = {}, why = {}; Object.keys(CLASSES).forEach(k=>{ sc[k] = 0; why[k] = []; });
  let pack = "", species = "";
  QUIZ.forEach(Q=>{ const k = BLD.ans[Q.id]; if(k == null) return; const o = (Q.hero && BLD.ansAlt ? Q.alt : Q.o)[k];
    if(Q.species){ species = o[2]; return; }
    Object.keys(o[2]).forEach(c=>{ sc[c] += o[2][c]; if(o[2][c] >= 2) why[c].push([o[3], o[4]]); });
    if(o[5]) pack = o[5]; });
  const top = Object.keys(sc).sort((a,b)=>sc[b]-sc[a]).slice(0,3);
  const max = Math.max(1, sc[top[0]]);
  return {sc, why, top, max, pack, species: species || "human"};
}
function quizResults(){
  const R = quizScore(); BLD.res = R;
  nav(`<button class="btn" data-act="quizBack">← Back</button><div class="grow">Pick one! 選一個！</div><button class="btn" data-act="quizRestart">↺ Again</button>`);
  const S = SPECIES[R.species];
  return `<div class="row sp" style="margin-bottom:10px"><span class="px muted" style="font-size:18px">✨ YOUR MATCHES · 推薦結果</span><button class="btn sm" data-act="home">✕</button></div>
    <h2>These heroes fit you! ${SAY("These heroes fit you!")}</h2><div class="zh" style="font-size:16px;margin-bottom:14px">這些角色很適合你！選一個，我們會幫你把其他部分準備好。</div>
    <div class="list">${R.top.map((k,i)=>{ const C = CLASSES[k], w = R.why[k].slice(0,3);
      return `<button class="card${i===0?" sel":""}" data-act="quizChoose" data-cls="${k}" style="padding:14px">
        <div class="t">${emblem(k)} ${C.en} <span class="zh" style="font-size:16px">${C.zh}</span> ${i===0?`<span class="badge">Best match 最適合</span>`:""}</div>
        <div class="stars" style="margin:4px 0">Match ${"■".repeat(Math.round(R.sc[k]/R.max*5))}${"□".repeat(5-Math.round(R.sc[k]/R.max*5))} · Difficulty 難度 ${stars(C.diff)}</div>
        <div class="d">${esc(C.tag)}</div><span class="zh">${esc(C.tz)}</span>
        ${w.length ? `<ul style="margin:8px 0 0;padding-left:1.2em;font-size:14.5px">${w.map(x=>`<li>${esc(x[0])}<span class="zh">${esc(x[1])}</span></li>`).join("")}</ul>` : ""}
      </button>`; }).join("")}</div>
    <div class="tip" style="margin-top:14px"><span class="i">${emblemSpecies(R.species)}</span><p>Your species: <b>${S.en}</b> ${SAY(S.en)} — ${esc(S.d)}<span class="zh">種族：${S.zh}。${esc(S.dz)}</span></p></div>
    <p class="zh center">Want something else? <button class="btn sm" data-act="quizManual">🛠️ Choose step by step</button> 想自己選？改用逐步建立。</p>`;
}
ACTS.quizRestart = ()=>startQuiz();
ACTS.quizChoose = b => { const R = BLD.res;
  if(BLD.back){ const k = BLD.back; changeClass(k.c, b.dataset.cls); changeSpecies(k.c, R.species); if(R.pack){ k.c.pack = R.pack; k.c.cantrips = []; k.c.prepared = []; fillSpells(k.c); } BLD = k; Music.sfx("ok"); go("build"); return; }
  const c = blank(); c.cls = b.dataset.cls; c.species = R.species; c.pack = R.pack || (["cleric","druid"].includes(c.cls) ? "healer" : ["bard","warlock"].includes(c.cls) ? "trickster" : "blaster");
  c.base = recBase(c.cls); complete(c); BLD = {c, mode:"quick"}; Music.sfx("ok"); go("review"); };
ACTS.quizManual = ()=>{ const R = BLD.res; if(BLD.back){ BLD = BLD.back; go("build"); return; } startManual(); changeClass(BLD.c, R.top[0]); changeSpecies(BLD.c, R.species); render(); };

/* ---------- Step-by-step builder ---------- */
VIEWS.build = ()=>{
  const c = BLD.c, steps = stepList(c); let idx = steps.findIndex(s=>s[0] === BLD.step); if(idx < 0){ idx = 0; BLD.step = steps[0][0]; }
  const last = idx === steps.length - 1;
  const back = BLD.from === "review" ? `<button class="btn" data-act="toReview">✓ Done 完成</button>` : `<button class="btn" data-act="stepGo" data-d="-1">← Back</button>`;
  nav(`${back}<div class="grow">${steps[idx][1]} · ${steps[idx][2]}</div><button class="btn pri" data-act="stepGo" data-d="1">${last || BLD.from === "review" ? "Review 檢視 →" : "Next 下一步 →"}</button>`);
  const head = `<div class="row sp" style="margin-bottom:10px"><span class="px muted" style="font-size:18px">🛠️ STEP BY STEP · 逐步建立</span><button class="btn sm" data-act="home">✕</button></div>
    <div class="steps">${steps.map((s,i)=>`<button class="${i===idx?"on":i<idx?"ok":""}" data-act="stepTo" data-s="${s[0]}">${i+1}. ${s[1]}</button>`).join("")}</div>`;
  return head + (STEPV[BLD.step] ? STEPV[BLD.step](c) : "");
};

ACTS.bonusMode = b => { const c = BLD.c, B = BACKGROUNDS[c.bg]; if(b.dataset.v === "111"){ c.bonus = {}; B.ab.forEach(a=>c.bonus[a] = 1); } else c.bonus = recBonus(c); render(); };
ACTS.bonusSet = b => { const c = BLD.c, a = b.dataset.a, v = +b.dataset.v; const B = BACKGROUNDS[c.bg];
  if(v === 2){ Object.keys(c.bonus).forEach(k=>{ if(c.bonus[k] === 2) delete c.bonus[k]; }); if(c.bonus[a] === 1) delete c.bonus[a]; }
  if(v === 1){ Object.keys(c.bonus).forEach(k=>{ if(c.bonus[k] === 1) delete c.bonus[k]; }); if(c.bonus[a] === 2) delete c.bonus[a]; }
  if(v) c.bonus[a] = v; else delete c.bonus[a];
  if(!Object.values(c.bonus).includes(2)) { const r = B.ab.find(x=>!c.bonus[x] && x !== a); if(r && v !== 2) c.bonus[r] = 2; }
  if(!Object.values(c.bonus).includes(1)) { const r = B.ab.find(x=>!c.bonus[x]); if(r) c.bonus[r] = 1; }

  if(c.cls === "warlock") opts.push(optGroup("Eldritch Invocation","魔能祈喚","invocations",Object.keys(INVOCATIONS).filter(k=>INVOCATIONS[k].lv <= c.level), c.invocations, k=>INVOCATIONS[k], "Pact of the Tome gives you more cantrips. Armor of Shadows keeps you safe.", "書之契約給你更多戲法，暗影護甲讓你更安全。", [1,3,3,3,5][c.level-1]));
  const expN = c.cls === "rogue" ? 2 : 0;
  const all = knownSkills(c);
  return `<h2>Skills & languages ${SAY("Skills and languages")}</h2><div class="zh" style="font-size:16px;margin-bottom:10px">技能與語言：你受過什麼訓練？</div>
  ${tip(`Pick <b>${n}</b> skills from your class list. ${T("Perception")} is useful for everyone — it helps you notice danger!`, `從職業清單選 ${n} 項技能。「觀察」對每個人都很有用，能幫你發現危險！`)}
  <div class="panel"><div class="row sp"><h3>${C.en} skills <span class="zh">職業技能</span></h3><span class="cnt${have===n?" full":""}">${have} / ${n}</span></div>
    <div style="margin-top:8px">${C.skills.from.map(s=>{ const got = other.has(s); return `<button class="chip${c.skills.includes(s)?" sel":""}" ${got?"disabled style=\"opacity:.45\"":""} data-act="toggleSkill" data-v="${s}">${SKILLS[s][0]} <span class="zh">${SKILLS[s][1]}</span>${got?" ✓":""}</button>`; }).join("")}</div>
    ${sources.length ? `<p class="zh" style="margin:8px 0 0">Already known 已經會的：${esc(sources.join(" · "))}</p>` : ""}</div>
  ${expN ? `<div class="panel"><div class="row sp"><h3>${T("Expertise")} <span class="zh">專精</span></h3><span class="cnt${c.expertise.length===expN?" full":""}">${c.expertise.length} / ${expN}</span></div><p class="zh" style="margin:4px 0 8px">Pick ${expN} skills you know. You become extra good at them. 選 ${expN} 項已會的技能，變得特別擅長。</p>
    <div>${[...all].map(s=>`<button class="chip${c.expertise.includes(s)?" sel":""}" data-act="toggleExp" data-v="${s}" data-max="${expN}">${SKILLS[s][0]} <span class="zh">${SKILLS[s][1]}</span></button>`).join("")}</div></div>` : ""}
  ${opts.join("")}
  <div class="panel"><div class="row sp"><h3>Languages <span class="zh">語言</span></h3><span class="cnt${c.langs.length===3?" full":""}">${c.langs.length} / 3</span></div>
    <p class="zh" style="margin:4px 0 8px">Everyone speaks Common. Pick 2 more. Goblin and Dwarvish are useful on the frontier! 大家都會通用語，再選兩種。在邊境地區，哥布林語和矮人語很實用！</p>
    <div>${Object.keys(LANGS).filter(l=>l!=="Common").map(l=>`<button class="chip${c.langs.includes(l)?" sel":""}" data-act="toggleLang" data-v="${esc(l)}">${esc(l)} <span class="zh">${LANGS[l]}</span></button>`).join("")}</div></div>`;
};
function optGroup(en, zh, field, keys, cur, info, tipEn, tipZh, multi){
  const arr = Array.isArray(cur);
  return `<div class="panel"><div class="row sp"><h3>${en} <span class="zh">${zh}</span></h3>${multi ? `<span class="cnt${cur.length===multi?" full":""}">${cur.length} / ${multi}</span>` : ""}</div>
    <p class="zh" style="margin:4px 0 8px">${esc(tipEn)} ${esc(tipZh)}</p>
    <div class="list">${keys.map(k=>{ const I = info(k) || {}; const sel = arr ? cur.includes(k) : cur === k; const label = k.length > 14 || k[0] === k[0].toUpperCase() ? k : k[0].toUpperCase()+k.slice(1);
      return `<button class="card${sel?" sel":""}" data-act="${multi?"toggleOpt":"setOpt"}" data-f="${field}" data-v="${esc(k)}" ${multi?`data-max="${multi}"`:""}><div class="t" style="font-size:19px">${esc(label)} <span class="zh">${esc(I.zh||"")}</span> ${SAY(label)}</div><div class="d">${esc(I.d||"")}</div><span class="zh">${esc(I.dz||"")}</span></button>`; }).join("")}</div></div>`;
}
ACTS.toggleSkill = b => { const c = BLD.c, v = b.dataset.v, n = CLASSES[c.cls].skills.n;
  if(c.skills.includes(v)) c.skills = c.skills.filter(x=>x !== v); else { if(c.skills.length >= n) c.skills.shift(); c.skills.push(v); }
  c.expertise = c.expertise.filter(x=>knownSkills(c).has(x)); Music.sfx("click"); render(); };
ACTS.toggleExp = b => { const c = BLD.c, v = b.dataset.v, n = +b.dataset.max;
  if(c.expertise.includes(v)) c.expertise = c.expertise.filter(x=>x !== v); else { if(c.expertise.length >= n) c.expertise.shift(); c.expertise.push(v); } Music.sfx("click"); render(); };
ACTS.toggleLang = b => { const c = BLD.c, v = b.dataset.v; let x = c.langs.filter(l=>l !== "Common");
  if(x.includes(v)) x = x.filter(l=>l !== v); else { if(x.length >= 2) x.shift(); x.push(v); } c.langs = ["Common"].concat(x); Music.sfx("click"); render(); };
ACTS.setOpt = b => { const c = BLD.c; c[b.dataset.f] = b.dataset.v; if(b.dataset.f === "order" || b.dataset.f === "primal"){ c.cantrips = []; c.prepared = []; fillSpells(c); c.inv = []; startingGear(c); } Music.sfx("click"); render(); };
ACTS.toggleOpt = b => { const c = BLD.c, f = b.dataset.f, v = b.dataset.v, n = +b.dataset.max; let a = c[f].slice();
  if(a.includes(v)) a = a.filter(x=>x !== v); else { if(a.length >= n) a.shift(); a.push(v); } c[f] = a; Music.sfx("click"); render(); };

/* spells */
STEPV.spells = c => spellPicker(c, false);
function spellPicker(c, levelUp){
  const ci = casterInfo(c), B = BACKGROUNDS[c.bg], always = alwaysPrepared(c).map(nk);
  let html = `<h2>${levelUp ? "New spells" : "Choose your spells"} ${SAY(levelUp ? "New spells" : "Choose your spells")}</h2><div class="zh" style="font-size:16px;margin-bottom:10px">${levelUp ? "選擇新法術" : "選擇法術：你會哪些魔法？"}</div>`;
  if(ci){
    const packs = Object.keys(SPELLPACK).filter(p=>{ const w = SPELLPACK[p].w; const top = Object.keys(w).sort((a,b)=>w[b]-w[a])[0]; return spellsFor(c.cls,1).filter(s=>s.tags.includes(top)).length >= 2; });
    html += tip(`Not sure? Pick a <b>spell pack</b> for how you like to play. It fills everything in. Then swap any spell you want. ${T("Cantrip","Cantrips")} can be cast again and again — they're free!`, "不確定的話，選一個符合你玩法的「法術包」，會自動幫你選好，之後可以自由替換。戲法可以無限次使用，完全免費！");
    html += `<div class="grid3" style="margin-bottom:14px">${packs.map(p=>{ const P = SPELLPACK[p]; return `<button class="card${c.pack===p?" sel":""}" data-act="pickPack" data-v="${p}"><div class="t">${P.i} ${P.en}</div><span class="zh">${P.zh}</span><div class="d">${P.d}</div><span class="zh">${P.dz}</span></button>`; }).join("")}</div>`;
    html += `<div class="panel">${ci.can ? spellSection(c, 0, ci.can, "cantrips", "Cantrips 戲法") : ""}`;
    if(ci.book){
      const bookN = 6 + 2*(c.level-1) + (c.level >= 3 ? 2 : 0);
      html += spellSection(c, "1-" + ci.maxLv, bookN, "book", "Spellbook 法術書", "Wizards write spells in a book. Choose " + bookN + "." + (c.level >= 3 ? " (Evoker: two of them are free Evocation spells.)" : ""), "法師把法術寫在書裡，選 " + bookN + " 個。" + (c.level >= 3 ? "（塑能師：其中兩個是免費的塑能法術。）" : ""));
      html += spellSection(c, "book", ci.prep, "prepared", "Prepared today 今天準備", "Pick " + ci.prep + " spells from your book to use today.", "從法術書中選 " + ci.prep + " 個今天要用的法術。");
    } else html += spellSection(c, "1-" + ci.maxLv, ci.prep, "prepared", "Prepared spells 準備法術", `You can cast these using ${T("Spell Slot","spell slots")}. You can change them after a Long Rest.`, "這些法術需要消耗法術位，長休後可以更換。");
    if(always.length) html += `<div class="sp-lv">Always ready 永遠準備好</div><div class="list">${always.map(k=>spellRow(k, false, true)).join("")}</div>`;
    html += `</div>`;
  }
  if(!levelUp && B && B.feat === "Magic Initiate" && c.mi && c.mi.list){
    const cl = c.mi.list === "cleric" ? "Cleric" : "Wizard";
    html += `<div class="panel"><h3>${T("Magic Initiate")} <span class="zh">魔法新手（${cl === "Cleric" ? "牧師" : "法師"}法術）</span></h3>
      <p class="zh" style="margin:4px 0 8px">From your ${B.en} background: 2 cantrips and 1 level 1 spell (free once per day). 背景給你兩個戲法和一個一環法術（每天免費一次）。</p>
      <label class="fl">Magic uses <span class="zh">施法屬性</span></label><div class="seg" style="margin-bottom:8px">${["int","wis","cha"].map(a=>`<button data-act="miAb" data-v="${a}" class="${c.mi.ab===a?"on":""}">${ABN[a].s}</button>`).join("")}</div>
      ${miSection(c, 0, cl)}${miSection(c, 1, cl)}</div>`;
  }
  const L = LINEAGE[c.species] && LINEAGE[c.species][c.lineage];
  if(!levelUp && L && L[4]) html += `<div class="panel tight"><h3 style="font-size:19px">From your species 來自種族</h3><div class="list" style="margin-top:6px">${L[4].map(k=>spellRow(k,false,true)).join("")}${c.species==="tiefling"?spellRow("Thaumaturgy",false,true):""}</div></div>`;
  if(!ci && !(B && B.feat === "Magic Initiate")) html += `<p class="muted">No spells for this hero. 這個角色沒有法術。</p>`;
  return html;
}
function spellRow(k, sel, locked, act, extra){
  const s = SPELLS[nk(k)]; if(!s) return "";
  const icons = s.tags.filter(t=>t !== "*").map(t=>({dmg:"⚔️",heal:"💚",ctrl:"🌀",prot:"🛡️",util:"🔧",social:"💬",move:"👟",sense:"👁️",summon:"🐾"}[t]||"")).join("");
  return `<div class="li spl${sel?" sel":""}">${locked ? `<span class="ck">✓</span>` : `<button class="ck" data-act="${act}" data-v="${esc(s.key)}" ${extra||""} aria-label="choose">${sel?"✓":""}</button>`}
    <button class="main" data-spell="${esc(s.key)}" style="border:0;background:none;text-align:left;padding:0"><b>${esc(s.key)}</b> ${s.tags.includes("*")?`<span class="badge soft">good pick 推薦</span>`:""} <span class="muted">${esc(s.info[0])}</span><div style="font-size:14px">${esc(s.info[1])}</div><span class="zh">${esc(s.info[2])}</span></button>
    <span class="tg"><i title="${esc(s.tags.join(" "))}">${icons}</i>${SAY(s.key)}</span></div>`;
}
function spellSection(c, lv, n, field, title, tipEn, tipZh){
  let pool = [];
  if(lv === 0) pool = spellsFor(c.cls, 0);
  else if(lv === "book") pool = c.book.map(k=>SPELLS[nk(k)]).filter(Boolean);
  else { const [a,b2] = String(lv).split("-").map(Number); for(let l=a;l<=b2;l++) pool.push(...spellsFor(c.cls, l)); }
  const always = alwaysPrepared(c).map(nk); pool = pool.filter(s=>!always.includes(s.key));
  const cur = c[field]; const levels = [...new Set(pool.map(s=>s.l))];
  const key = field + ":" + lv, open = (BLD.open || {})[key] || cur.length < n;
  const shown = s => open || cur.includes(s.key);
  return `<div class="row sp" style="margin-top:6px"><h3 style="font-size:21px">${title}</h3><span class="cnt${cur.length===n?" full":""}">${cur.length} / ${n}</span></div>
    ${tipEn ? `<p style="margin:2px 0 0;font-size:14.5px">${tipEn}</p><span class="zh">${esc(tipZh)}</span>` : ""}
    ${levels.filter(l=>pool.some(s=>s.l===l && shown(s))).map(l=>`<div class="sp-lv">${l ? "Level " + l + " 環" : "Cantrips 戲法"}</div><div class="list">${pool.filter(s=>s.l===l && shown(s)).map(s=>spellRow(s.key, cur.includes(s.key), false, "toggleSpell", `data-f="${field}" data-max="${n}"`)).join("")}</div>`).join("")}
    <div class="row" style="margin-top:8px"><button class="btn sm" data-act="spOpen" data-k="${key}">${open ? "▲ Show only my picks 只看已選" : `▼ Swap spells: see all ${pool.length} 查看全部 ${pool.length} 個`}</button></div>`;
}
function miSection(c, lv, cl){
  const pool = Object.values(SPELLS).filter(s=>s.l === lv && s.cl.includes(cl)).sort((a,b)=>a.key.localeCompare(b.key));
  const cur = lv ? (c.mi.spell ? [c.mi.spell] : []) : c.mi.cantrips, n = lv ? 1 : 2;
  const key = "mi:" + lv, open = (BLD.open || {})[key] || cur.length < n;
  return `<div class="sp-lv">${lv ? "Level 1 spell 一環法術" : "Cantrips 戲法"} <span class="cnt${cur.length===n?" full":""}">${cur.length} / ${n}</span></div><div class="list">${pool.filter(s=>open || cur.includes(s.key)).map(s=>spellRow(s.key, cur.includes(s.key), false, "toggleMI", `data-lv="${lv}"`)).join("")}</div>
    <div class="row" style="margin-top:8px"><button class="btn sm" data-act="spOpen" data-k="${key}">${open ? "▲ Show only my picks 只看已選" : `▼ Swap: see all ${pool.length} 查看全部`}</button></div>`;
}
ACTS.spOpen = b => { BLD.open = BLD.open || {}; BLD.open[b.dataset.k] = !BLD.open[b.dataset.k]; render(); };
ACTS.pickPack = b => { const c = BLD.c; c.cantrips = []; c.prepared = []; c.book = []; fillSpells(c, b.dataset.v); Music.sfx("ok"); render(); };
ACTS.toggleSpell = b => { const c = BLD.c, f = b.dataset.f, v = b.dataset.v, n = +b.dataset.max; let a = c[f].slice();
  if(a.includes(v)) a = a.filter(x=>x !== v); else { if(a.length >= n){ toast(`You can pick ${n}. Remove one first. 最多 ${n} 個，請先取消一個`); return; } a.push(v); }
  c[f] = a; if(f === "book") c.prepared = c.prepared.filter(x=>a.includes(x)); Music.sfx("click"); render(); };
ACTS.toggleMI = b => { const c = BLD.c, v = b.dataset.v;
  if(b.dataset.lv === "1") c.mi.spell = c.mi.spell === v ? "" : v;

  Music.sfx("click"); render(); };
ACTS.miAb = b => { BLD.c.mi.ab = b.dataset.v; render(); };

    <p class="px gold" style="font-size:22px;margin:10px 0 0">💰 ${c.coins.gp} GP</p></div>`;

ACTS.storyPick = b => { const c = BLD.c || findChar(VIEW.id); c.story[b.dataset.f] = c.story[b.dataset.f] === b.dataset.v ? "" : b.dataset.v; if(VIEW.name === "sheet") persist(c); render(); };

document.addEventListener("input", e=>{
  const t = e.target; const c = VIEW.name === "build" ? BLD && BLD.c : (VIEW.name === "sheet" ? findChar(VIEW.id) : null); if(!c) return;

/* ---------- Review (all modes end here) ---------- */
VIEWS.review = ()=>{
  const c = BLD.c, d = derive(c), C = CLASSES[c.cls], S = SPECIES[c.species], B = BACKGROUNDS[c.bg], rnd = BLD.mode === "random";

SHEET.spells = (c, d) => {
  const ci = d.ci;
  let slots = "";
  if(ci && ci.pact){ slots = `<div class="li"><span class="num">L${ci.pact.lv}</span><div class="main">Pact slots 契約法術位 <span class="zh">short rest 短休恢復</span></div><span class="pips">${Array.from({length:ci.pact.n},(_,i)=>`<button class="pip${i < ci.pact.n - c.pactUsed ? " on" : ""}" data-act="slot" data-l="p" data-i="${i}"></button>`).join("")}</span></div>`; }
  else if(ci) slots = ci.slots.map((n,l)=>`<div class="li"><span class="num">L${l+1}</span><div class="main">Level ${l+1} slots <span class="zh">${l+1} 環法術位</span></div><span class="pips">${Array.from({length:n},(_,i)=>`<button class="pip${i < n - (c.slotsUsed[l]||0) ? " on" : ""}" data-act="slot" data-l="${l}" data-i="${i}"></button>`).join("")}</span></div>`).join("");
  const groups = {}; d.splist.forEach(x=>{ (groups[x.s.l] = groups[x.s.l] || []).push(x); });
  const srcTag = {always:"always 常備", feat:"feat 專長", species:"species 種族", invocation:"at will 隨意"};
  return `${d.spell ? `<div class="stat3" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px"><div class="stat"><div class="k">ABILITY<span class="zh" style="display:block;font-size:11px">施法屬性</span></div><div class="val" style="font-size:26px">${abS(d.spell.ab)}</div></div><button class="stat" data-t="Spell Save DC"><div class="k">SAVE DC<span class="zh" style="display:block;font-size:11px">豁免 DC</span></div><div class="val">${d.spell.dc}</div></button><button class="stat" data-act="roll" data-lbl="Spell attack" data-zh="法術攻擊" data-b="${d.spell.atk}"><div class="k">ATTACK<span class="zh" style="display:block;font-size:11px">法術攻擊 🎲</span></div><div class="val">${sgn(d.spell.atk)}</div></button></div>` : ""}
  ${slots ? `<div class="panel tight"><h3 style="font-size:20px">${T("Spell Slot","Spell Slots")} <span class="zh">法術位（點一下使用／恢復）</span></h3><div class="list" style="margin-top:8px">${slots}</div></div>` : ""}
  ${Object.keys(groups).sort().map(l=>`<div class="sp-lv">${+l ? "Level " + l : "Cantrips · free, any time 戲法：免費無限次"}</div><div class="list">${groups[l].map(x=>{ const s = x.s;
    return `<div class="li"><button class="main" data-spell="${esc(x.k)}" style="border:0;background:none;text-align:left;padding:0"><b>${esc(x.k)}</b> <span class="muted">${esc(s.info[0])}</span>${x.src !== "class" ? ` <span class="badge soft">${srcTag[x.src]||x.src}</span>` : ""}${/Concentration/.test(s.du) ? ` <span class="badge soft">C</span>` : ""}${/Ritual/.test(s.ct) ? ` <span class="badge soft">R</span>` : ""}<div style="font-size:14px">${esc(s.info[1])}</div><span class="zh">${esc(s.info[2])}</span></button>
      <span class="tg">${SAY(x.k)}</span>${+l && x.src !== "invocation" ? `<button class="btn sm" data-act="cast" data-k="${esc(x.k)}" data-l="${l}">Cast</button>` : ""}</div>`; }).join("")}</div>`).join("")}
  <p class="zh" style="margin-top:10px">C = ${T("Concentration","needs concentration 需要專注")} · R = ${T("Ritual","can be a ritual 可作儀式")}</p>
  ${casterInfo(c) ? `<div class="row" style="margin-top:10px"><button class="btn sm" data-act="editSpells">✎ Change spells 更換法術</button><span class="zh">You can change prepared spells after a Long Rest. 長休後可以更換準備的法術。</span></div>` : ""}`;
};
ACTS.slot = b => { const c = findChar(VIEW.id), ci = casterInfo(c), i = +b.dataset.i;
  if(b.dataset.l === "p"){ const avail = ci.pact.n - c.pactUsed; c.pactUsed = i < avail ? c.pactUsed + 1 : c.pactUsed - 1; }
  else { const l = +b.dataset.l, n = ci.slots[l], avail = n - (c.slotsUsed[l]||0); c.slotsUsed[l] = (c.slotsUsed[l]||0) + (i < avail ? 1 : -1); }
  c.pactUsed = Math.max(0, c.pactUsed); c.slotsUsed = c.slotsUsed.map(x=>Math.max(0,x||0)); persist(c); Music.sfx("click"); render(); };
ACTS.cast = b => { const c = findChar(VIEW.id), ci = casterInfo(c), l = +b.dataset.l, k = b.dataset.k; const d = derive(c);
  const x = d.splist.find(y=>y.k === k); const free = d.res.find(r=>r.id === "free-" + k);
  if(free && (c.res[free.id]||0) < 1){ c.res[free.id] = 1; persist(c); toast(`Cast ${k} for free! 免費施展${x.s.info[0]}！`); Music.sfx("ok"); render(); return; }
  if(!ci){ toast("No spell slots. 沒有法術位"); return; }
  if(ci.pact){ if(c.pactUsed >= ci.pact.n){ toast("No Pact slots left. Take a Short Rest! 契約法術位用完了，短休一下吧！"); return; } if(l > ci.pact.lv){ toast("Your slots are too low for this spell. 法術位環級不夠"); return; } c.pactUsed++; }
  else { let used = -1; for(let i=l-1;i<ci.slots.length;i++){ if((c.slotsUsed[i]||0) < ci.slots[i]){ used = i; break; } }
    if(used < 0){ toast("No spell slots left for this level. 這個環級的法術位用完了"); return; } c.slotsUsed[used] = (c.slotsUsed[used]||0) + 1; if(used + 1 > l) toast(`Used a level ${used+1} slot. 使用了 ${used+1} 環法術位`); }
  persist(c); Music.sfx("heal"); if(!toastT || 1) toast(`✨ ${k}! ${x ? x.s.info[0] : ""}`);
  const a = x && x.s.info[4]; render();
  if(a && a[0] === "a") openDice({dice:[[1,20]], mod:d.spell.atk, label:k + " attack", auto:true});
  else if(a && a[0] === "h" && /heal/.test(x.s.info[3])){ const m = a[1].match(/(\d+)d(\d+)/); openDice({dice:[[+m[1]*(ci.pact?ci.pact.lv:l), +m[2]]], mod:derive(c).m[d.spell.ab], label:k, auto:true}); } };
ACTS.editSpells = ()=>{ const c = findChar(VIEW.id); BLD = {c:JSON.parse(JSON.stringify(c)), mode:"edit", step:"spells", from:"sheet"}; go("editspells"); };

ACTS.editSave = ()=>{ const c = BLD.c; persist(c); roster = roster.map(x=>x.id === c.id ? c : x); saveRoster(); BLD = null; Music.sfx("save"); go("sheet", {id:c.id, tab:"spells"}); };

  const extra = [];

  d.feats.filter(f=>f !== c.style).forEach(f=>{ if(FEATS[f]) extra.push([f, FEATS[f]]); });

ACTS.shortRest = b => { const c = findChar(VIEW.id), d = derive(c), n = +b.dataset.n; let heal = 0; const rolls = [];
  for(let i=0;i<n;i++){ const r = 1 + rnd(d.hd); rolls.push(r); heal += Math.max(0, r + d.m.con); }

  if(c.cls === "barbarian") c.res.rage = Math.max(0, (c.res.rage||0) - 1);
  c.pactUsed = 0; persist(c); closeOv(); Music.sfx("heal");
  toast(n ? `Rolled ${rolls.join(", ")}: +${heal} HP. 回復 ${heal} 點血。` : "Short Rest done. 短休完成。"); render(); };

let LU = null;
ACTS.lvlUp = ()=>{ const c = findChar(VIEW.id); if(c.level >= MAXLV) return;
  const n = JSON.parse(JSON.stringify(c)); n.level++; LU = {id:c.id, c:n, hp:null, old:c.level};
  BLD = {c:n, mode:"levelup"}; recClassChoices(n);
  const ci = casterInfo(n), oci = casterInfo(c);
  if(ci){ const add = ci.prep - n.prepared.length; if(add > 0){ const keep = n.prepared.slice(); n.prepared = []; const save = n.cantrips.slice(); fillSpells(n, n.pack); const extra = n.prepared.filter(k=>!keep.includes(k)); n.prepared = keep.concat(extra).slice(0, ci.prep); n.cantrips = save; }
    if(n.cantrips.length < ci.can){ const cs = rankSpells(spellsFor(n.cls,0).filter(s=>!n.cantrips.includes(s.key)), n.pack); while(n.cantrips.length < ci.can && cs.length) n.cantrips.push(cs.shift().key); }
    if(ci.book){ const want = 6 + 2*(n.level-1) + (n.level >= 3 ? 2 : 0); const pool = []; for(let l=1;l<=ci.maxLv;l++) pool.push(...spellsFor("wizard", l)); const rk = rankSpells(pool.filter(s=>!n.book.includes(s.key)), n.pack); while(n.book.length < want && rk.length) n.book.push(rk.shift().key); } }
  if(n.level === 3 && n.cls === "bard"){ const k = knownSkills(n); n.skills2 = (n.skills2||[]).concat(ALL_SKILLS.filter(s=>!k.has(s)).slice(0,3)); }
  if(n.level === 3 && n.cls === "barbarian"){ const k = knownSkills(n); const s = CLASSES.barbarian.skills.from.find(x=>!k.has(x)); if(s) n.skills2 = (n.skills2||[]).concat(s); }
  if(n.level === 2 && n.cls === "ranger" && !(n.extraLangs||[]).length){ n.extraLangs = Object.keys(LANGS).filter(l=>!n.langs.includes(l)).slice(0,2); }
  if(n.level === 4 && !n.feat4){ n.feat4 = "Ability Score Improvement"; const sc = scores(n); const C = CLASSES[n.cls]; const p = C.prim.find(a=>sc[a] <= 18) || "con"; n.asi = sc[p] <= 18 ? {[p]:2} : {[p]:1, con:1}; }
  Music.sfx("level"); go("levelup"); };

  if(lv === 3 && c.cls === "druid") choices.push(`<div class="panel"><h3>Circle land <span class="zh">結社地形（長休後可換）</span></h3><div style="margin-top:8px">${Object.keys(LANDS).map(k=>`<button class="chip${c.land===k?" sel":""}" data-act="setF" data-f="land" data-v="${k}">${LANDS[k][0]} <span class="zh">${LANDS[k][1]}：${LANDS[k][2].join(", ")}</span></button>`).join("")}</div></div>`);
  if(lv === 3 && c.cls === "ranger") choices.push(`<div class="panel"><h3>Hunter's Prey <span class="zh">獵物</span></h3><div class="list" style="margin-top:8px">${[["colossus","Colossus Slayer","巨人殺手","+1d8 damage once a turn to a hurt enemy.","每回合一次，對受傷的敵人傷害 +1d8。"],["horde","Horde Breaker","破群者","Once a turn, attack another enemy next to your target.","每回合一次，攻擊目標旁邊的另一個敵人。"]].map(o=>`<button class="card${c.prey===o[0]?" sel":""}" data-act="setF" data-f="prey" data-v="${o[0]}"><div class="t" style="font-size:19px">${o[1]} <span class="zh">${o[2]}</span></div><div class="d">${o[3]}</div><span class="zh">${o[4]}</span></button>`).join("")}</div></div>`);
  if(lv === 3 && ["bard","barbarian"].includes(c.cls)){ const n = c.cls === "bard" ? 3 : 1; const from = c.cls === "bard" ? ALL_SKILLS : CLASSES.barbarian.skills.from; const other = knownSkills(Object.assign({}, c, {skills2:[]}));
    choices.push(`<div class="panel"><div class="row sp"><h3>New skills <span class="zh">新技能</span></h3><span class="cnt${(c.skills2||[]).length===n?" full":""}">${(c.skills2||[]).length} / ${n}</span></div><div style="margin-top:8px">${from.filter(s=>!other.has(s)).map(s=>`<button class="chip${(c.skills2||[]).includes(s)?" sel":""}" data-act="toggleArr" data-f="skills2" data-max="${n}" data-v="${s}">${SKILLS[s][0]} <span class="zh">${SKILLS[s][1]}</span></button>`).join("")}</div></div>`); }
  if(lv === 4){ const sc0 = scores(Object.assign({}, c, {asi:{}}));
    const fopts = ["Ability Score Improvement","Grappler","Alert","Savage Attacker","Skilled"].filter(f=>!(allFeats(Object.assign({}, c, {level:3})).includes(f)) && (f !== "Grappler" || sc0.str >= 13 || sc0.dex >= 13));
    const two = Object.values(c.asi).includes(2);
    choices.push(`<div class="panel"><h3>${T("Feat","Feat")} or ability boost <span class="zh">專長或屬性提升</span></h3><p class="zh" style="margin:4px 0 8px">Most players take the ability boost. It makes your main ability stronger. 大多數玩家選屬性提升，讓主要屬性更強。</p>
      <div class="list">${fopts.map(f=>`<button class="card${c.feat4===f?" sel":""}" data-act="luFeat" data-v="${f}">${f==="Ability Score Improvement"?`<span class="badge">Recommended 推薦</span>`:""}<div class="t" style="font-size:19px">${f} <span class="zh">${FEATS[f].zh}</span> ${SAY(f)}</div><div class="d">${esc(FEATS[f].d)}</div><span class="zh">${esc(FEATS[f].dz)}</span></button>`).join("")}</div>
      ${c.feat4 === "Ability Score Improvement" ? `<div class="seg" style="margin:10px 0"><button data-act="asiMode" data-v="2" class="${two?"on":""}">+2 one 一項 +2</button><button data-act="asiMode" data-v="11" class="${!two?"on":""}">+1 two 兩項 +1</button></div>
        <div class="abgrid">${AB.map(a=>`<button class="ab${c.asi[a]?" sel":""}${C.prim.includes(a)?" prim":""}" data-act="asiPick" data-a="${a}" ${sc0[a] >= 20 ? "disabled" : ""}><div class="n">${ABN[a].s}</div><div class="m">${sc0[a] + (c.asi[a]||0)}</div><div class="plus">${c.asi[a] ? "+" + c.asi[a] : "&nbsp;"}</div></button>`).join("")}</div>` : ""}
      ${c.feat4 === "Grappler" ? `<div class="seg" style="margin:10px 0">${["str","dex"].map(a=>`<button data-act="asiOne" data-a="${a}" class="${c.asi[a]?"on":""}">${ABN[a].s} +1</button>`).join("")}</div>` : ""}
      ${c.feat4 === "Skilled" ? `<div style="margin-top:10px">${ALL_SKILLS.filter(s=>!knownSkills(Object.assign({}, c, {feat4:""})).has(s)).map(s=>`<button class="chip${((c.feat4opt||{}).skills||[]).includes(s)?" sel":""}" data-act="luSkilled" data-v="${s}">${SKILLS[s][0]} <span class="zh">${SKILLS[s][1]}</span></button>`).join("")}</div>` : ""}</div>`); }
  const ci = casterInfo(c);
  const d = derive(Object.assign({}, c, {hpRolls: hpSet ? c.hpRolls : c.hpRolls.slice(0,lv-2).concat([avg])}));
  return `<div class="panel center lvup" style="padding:20px"><div class="big-emoji">⬆️</div><h2 class="gold" style="font-size:44px">Level ${lv}!</h2><div class="zh" style="font-size:16px">${esc(c.name)} 升到 ${lv} 級了！</div>
    ${lv === 5 ? `<p style="margin:8px 0 0">${T("Proficiency Bonus")} is now <b>+3</b>! 熟練加成變成 +3！</p>` : ""}${lv === 3 ? `<p style="margin:8px 0 0">You join the <b>${C.sub.en}</b> ${SAY(C.sub.en)} <span class="zh">你成為「${C.sub.zh}」！</span></p>` : ""}</div>
  <div class="panel"><h3>❤️ More Hit Points <span class="zh">增加血量</span></h3><p style="font-size:14.5px;margin:6px 0">Take the average, or roll your d${C.hd}. Then add your CON modifier (${sgn(d.m.con)}).</p><span class="zh">取平均值，或擲 d${C.hd}，再加上體魄調整值。</span>
    <div class="row" style="margin-top:10px"><button class="btn${hpSet && c.hpRolls[lv-2] === avg && !LU.rolled ? " pri" : ""}" data-act="luHp" data-v="avg">Average 平均 (${avg})</button><button class="btn${LU.rolled ? " pri" : ""}" data-act="luHp" data-v="roll">🎲 Roll d${C.hd}</button>
    ${hpSet ? `<span class="px" style="font-size:24px">+${Math.max(1, c.hpRolls[lv-2] + d.m.con)} HP → ${d.hpMax}</span>` : ""}</div></div>
  <div class="panel"><h3>✨ New powers <span class="zh">新能力</span></h3><div class="list" style="margin-top:8px">${(C.f[lv]||[]).map(f=>`<div class="li"><div class="main"><b>${esc(f[0])}</b> ${SAY(f[0])} <span class="muted">${esc(f[1])}</span><div style="font-size:14.5px">${esc(f[2])}</div><span class="zh">${esc(f[3])}</span></div></div>`).join("")}
    ${lv === 5 && c.species === "dragonborn" ? `<div class="li"><div class="main"><b>Draconic Flight</b> <span class="muted">龍翼飛行</span></div></div>` : ""}${lv === 5 && c.species === "goliath" ? `<div class="li"><div class="main"><b>Large Form</b> <span class="muted">巨大化</span></div></div>` : ""}
    ${(lv === 3 || lv === 5) && ["elf","tiefling"].includes(c.species) && LINEAGE[c.species][c.lineage] ? `<div class="li"><div class="main"><b>New species spell 新種族法術</b>: ${esc(LINEAGE[c.species][c.lineage][lv === 3 ? 5 : 6])}</div></div>` : ""}</div></div>
  ${choices.join("")}
  ${ci ? `<div class="panel">${spellPicker(c, true)}</div>` : ""}`;
};
ACTS.luHp = b => { const c = LU.c, C = CLASSES[c.cls], lv = c.level;
  if(b.dataset.v === "avg"){ c.hpRolls[lv-2] = C.hd/2 + 1; LU.rolled = false; render(); return; }
  Music.sfx("roll"); const v = 1 + rnd(C.hd); setTimeout(()=>{ c.hpRolls[lv-2] = v; LU.rolled = true; toast(`You rolled ${v}! 擲出 ${v}！`); if(v === C.hd) Music.sfx("crit"); render(); }, 450); };
ACTS.luFeat = b => { const c = LU.c; c.feat4 = b.dataset.v; c.asi = {}; c.feat4opt = {};
  if(c.feat4 === "Ability Score Improvement"){ const sc = scores(Object.assign({}, c, {asi:{}})); const p = CLASSES[c.cls].prim.find(a=>sc[a] <= 18) || "con"; c.asi = {[p]:2}; }
  if(c.feat4 === "Grappler") c.asi = {[scores(c).dex > scores(c).str ? "dex" : "str"]:1};
  Music.sfx("click"); render(); };
ACTS.asiMode = b => { const c = LU.c; const top = Object.keys(c.asi)[0] || CLASSES[c.cls].prim[0]; c.asi = b.dataset.v === "2" ? {[top]:2} : {[top]:1}; render(); };
ACTS.asiPick = b => { const c = LU.c, a = b.dataset.a; const two = Object.values(c.asi).includes(2) || (Object.keys(c.asi).length === 0);
  if(Object.values(c.asi).includes(2) || (Object.keys(c.asi).length === 1 && Object.values(c.asi)[0] === 2)) c.asi = {[a]:2};
  else { const k = Object.keys(c.asi); if(c.asi[a]) delete c.asi[a]; else { if(k.length >= 2) delete c.asi[k[0]]; c.asi[a] = 1; } }
  const sc = scores(Object.assign({}, c, {asi:{}})); Object.keys(c.asi).forEach(x=>{ if(sc[x] + c.asi[x] > 20) c.asi[x] = 20 - sc[x]; if(c.asi[x] <= 0) delete c.asi[x]; });
  Music.sfx("click"); render(); };
ACTS.asiOne = b => { LU.c.asi = {[b.dataset.a]:1}; render(); };
ACTS.luSkilled = b => { const c = LU.c; const o = c.feat4opt = c.feat4opt || {}; let a = (o.skills||[]).slice(); const v = b.dataset.v;
  if(a.includes(v)) a = a.filter(x=>x !== v); else { if(a.length >= 3) a.shift(); a.push(v); } o.skills = a; render(); };
ACTS.luCancel = ()=>{ const id = LU.id; LU = null; BLD = null; go("sheet", {id}); };
ACTS.luDone = ()=>{ const c = LU.c, old = findChar(LU.id), dOld = derive(old), d = derive(c);
  c.hp.cur = Math.min(d.hpMax, (old.hp.cur||0) + (d.hpMax - dOld.hpMax));
  const i = roster.findIndex(x=>x.id === c.id); roster[i] = c; saveRoster(); LU = null; BLD = null;
  Music.sfx("level"); toast(`${c.name} is now level ${c.level}! ${c.name} 升到 ${c.level} 級！`); go("sheet", {id:c.id, tab:"feat", fresh:true}); };

/* ---------- companion card ---------- */
VIEWS.companion = ()=>{
  const c = findChar(VIEW.id); if(!c){ go("home"); return ""; }
  nav(`<button class="btn" data-act="home">⌂</button><div class="grow">Companion card 夥伴卡</div><button class="btn" data-act="compDel">🗑️</button>`);
  const pct = Math.max(0, Math.min(100, c.hp.cur / Math.max(1,c.hpMax) * 100));
  const inp = (f, lbl, zh, type) => `<label style="flex:1;min-width:90px"><span class="px muted" style="font-size:15px">${lbl}</span> <span class="zh">${zh}</span><input type="${type||"number"}" data-cf="${f}" value="${esc(c[f])}"></label>`;
  return `<div class="panel row" style="gap:14px;align-items:center">${portrait(c)}<div style="flex:1"><input type="text" data-cf="name" value="${esc(c.name)}" style="font-family:var(--f-px);font-size:26px"><input type="text" data-cf="role" value="${esc(c.role)}" placeholder="Role, e.g. Warrior sidekick 角色，例如戰士夥伴" style="margin-top:6px"></div></div>
  ${tip("Your DM fills this card in with the sidekick's numbers. You can track HP and roll attacks here.", "由 DM 填入夥伴的數值，你可以在這裡記錄血量、擲攻擊骰。")}
  <div class="panel"><div class="hpbox"><div><div class="px muted">HIT POINTS <span class="zh">血量</span></div><div class="hpnum">${c.hp.cur}<small> / ${c.hpMax}</small></div><div class="hpbar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>
    <div class="list" style="min-width:110px"><button class="btn sm red" data-act="compHp" data-d="-1">− 1</button><button class="btn sm red" data-act="compHp" data-d="-5">− 5</button><button class="btn sm" data-act="compHp" data-d="1" style="color:var(--green)">+ 1</button><button class="btn sm" data-act="compHp" data-d="999" style="color:var(--green)">Full 補滿</button></div></div></div>
  <div class="panel"><div class="row">${inp("level","LEVEL","等級")}${inp("ac","AC","防禦值")}${inp("hpMax","MAX HP","最大血量")}${inp("speed","SPEED","速度")}</div>
    <div class="abgrid" style="margin-top:10px">${AB.map(a=>`<label class="ab"><div class="n">${ABN[a].s}</div><div class="m">${sgn(mod(c.abil[a]))}</div><input type="number" data-ca="${a}" value="${c.abil[a]}" style="text-align:center;padding:4px"><button class="btn sm" data-act="roll" data-lbl="${ABN[a].en}" data-b="${mod(c.abil[a])}" style="margin-top:4px">🎲</button></label>`).join("")}</div></div>
  <div class="panel"><div class="row sp"><h3>⚔️ Attacks <span class="zh">攻擊</span></h3><button class="btn sm" data-act="compAtk">+ Add</button></div>
    <div class="list" style="margin-top:8px">${c.attacks.map((a,i)=>`<div class="li" style="flex-wrap:wrap"><input type="text" data-cat="${i}" data-k="n" value="${esc(a.n)}" placeholder="Name 名稱" style="flex:2;min-width:120px">
      <input type="number" data-cat="${i}" data-k="hit" value="${a.hit}" style="width:70px" title="to hit"><input type="text" data-cat="${i}" data-k="dmg" value="${esc(a.dmg)}" style="width:100px" placeholder="1d6+2">
      <button class="btn sm" data-act="roll" data-lbl="${esc(a.n||"Attack")}" data-b="${a.hit}">🎯</button><button class="btn sm" data-act="compDmg" data-i="${i}">💥</button><button class="btn sm" data-act="compAtkDel" data-i="${i}">✕</button></div>`).join("")}</div></div>
  <div class="panel"><label class="fl">Skills <span class="zh">技能</span></label><textarea data-cf="skills" rows="2">${esc(c.skills)}</textarea>
    <label class="fl">Traits & tricks <span class="zh">特質與能力</span></label><textarea data-cf="traits" rows="3">${esc(c.traits)}</textarea>
    <label class="fl">Notes <span class="zh">筆記</span></label><textarea data-cf="notes" rows="3">${esc(c.notes)}</textarea></div>`;
};
document.addEventListener("change", e=>{ if(VIEW.name !== "companion") return; const c = findChar(VIEW.id); if(!c) return; const t = e.target;
  if(t.dataset.cf){ const f = t.dataset.cf; c[f] = t.type === "number" ? (+t.value||0) : t.value; if(f === "hpMax") c.hp.cur = Math.min(c.hp.cur, c.hpMax); persist(c); if(t.type === "number") render(); }
  if(t.dataset.ca){ c.abil[t.dataset.ca] = +t.value||10; persist(c); render(); }
  if(t.dataset.cat != null){ const a = c.attacks[+t.dataset.cat]; a[t.dataset.k] = t.dataset.k === "hit" ? (+t.value||0) : t.value; persist(c); render(); } });
ACTS.compHp = b => { const c = findChar(VIEW.id), dd = +b.dataset.d; c.hp.cur = Math.max(0, Math.min(c.hpMax, c.hp.cur + dd)); Music.sfx(dd < 0 ? "hurt" : "heal"); persist(c); render(); };
ACTS.compAtk = ()=>{ const c = findChar(VIEW.id); c.attacks.push({n:"", hit:3, dmg:"1d6+1", type:""}); persist(c); render(); };
ACTS.compAtkDel = b => { const c = findChar(VIEW.id); c.attacks.splice(+b.dataset.i, 1); persist(c); render(); };
ACTS.compDmg = b => { const c = findChar(VIEW.id), a = c.attacks[+b.dataset.i]; const m = String(a.dmg).replace(/\s/g,"").match(/^(\d+)d(\d+)([+-]\d+)?$/);
  if(!m){ toast("Write damage like 1d6+2. 傷害請寫成 1d6+2 的格式"); return; } openDice({dice:[[+m[1], +m[2]]], mod:+(m[3]||0), label:(a.n||"Attack") + " damage", auto:true}); };
ACTS.compDel = ()=>{ ACTS.delAsk(); };

/* ---------------- boot ---------------- */
applyPrefs();
buildTracks();
function leaveTitle(){ document.body.classList.remove("titled"); Scene.stop(); render(); }
$("#goBtn").addEventListener("click", e=>{ e.stopPropagation(); if(Music.cur < 0 && !store.get("mOff", false)) Music.play(store.get("trk", 0)); uiTracks(); leaveTitle(); });
$("#title").addEventListener("click", e=>{ if(e.target.closest("#goBtn")) return; if(Music.cur < 0) Music.play(store.get("trk", 0)); else Music.stop(); uiTracks(); });
$("#homeBtn").addEventListener("click", ()=>{ closeOv(); go("home"); });
$("#diceBtn").addEventListener("click", ()=>openDice());
$("#guideBtn").addEventListener("click", ()=>{ closeOv(); go("guide", {tab:"words"}); });
$("#setBtn").addEventListener("click", ()=>openSettings());
$("#musicBtn").addEventListener("click", e=>{ e.stopPropagation(); const m = $("#mp"); m.hidden = !m.hidden; uiTracks(); });
document.addEventListener("click", e=>{ const m = $("#mp"); if(!m.hidden && !e.target.closest("#mp") && !e.target.closest("#musicBtn")) m.hidden = true; });
$("#mStop").addEventListener("click", ()=>store.set("mOff", true));
$("#tracks").addEventListener("click", ()=>store.set("mOff", false));
Scene.start();
render();

</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero Workshop · 英雄工坊</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#15111f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Jersey+15&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15111f; --bg2:#1b1528; --panel:#221a31; --panel2:#2b2140; --ink:#f3eadb; --muted:#ab9fc0; --line:#3d3156; --line2:#54466f;
  --gold:#f4c542; --gold2:#e0952f; --red:#e0604f; --green:#7cc58a; --blue:#86b6ff; --purple:#b48cff; --shadow:rgba(0,0,0,.45);
  --on-gold:#1d1426;
  --f-px:'Jersey 15',"PingFang TC","Noto Sans TC",monospace;
  --f-body:'Atkinson Hyperlegible',"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-zh:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --fs:17px;
}
:root[data-theme="light"]{
  --bg:#efe4cc; --bg2:#e7dabd; --panel:#fbf4e4; --panel2:#f1e5c9; --ink:#2a2032; --muted:#6c607c; --line:#d4c29c; --line2:#bca77c;
  --gold:#a8740f; --gold2:#b8591c; --red:#b6402f; --green:#2f7a42; --blue:#2f5fb0; --purple:#6a3fb0; --shadow:rgba(80,50,20,.25);
  --on-gold:#fff8e6;
}
html,body{background:var(--bg) !important;}
*{box-sizing:border-box;}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
a{color:var(--blue);}
.px{font-family:var(--f-px);font-weight:400;letter-spacing:.03em;}
.zh{font-family:var(--f-zh);color:var(--muted);font-size:.86em;line-height:1.55;}
body.nozh .zh{display:none !important;}
.muted{color:var(--muted);}
.hide{display:none !important;}
h1,h2,h3{font-family:var(--f-px);font-weight:400;letter-spacing:.03em;line-height:1.05;margin:0;}
h2{font-size:30px;} h3{font-size:22px;}
.gold{color:var(--gold);}

/* ---------- title ---------- */
#title{position:fixed;inset:0;z-index:50;background:#0c0816;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px;overflow:hidden;}
body:not(.titled) #title{display:none;}
#title .stage{width:min(96vw,calc(62vh * 16 / 9),960px);aspect-ratio:16/9;position:relative;box-shadow:0 0 0 3px #3a2a52,0 0 0 6px #120a1e,0 18px 50px rgba(0,0,0,.6);}
#title canvas{width:100%;height:100%;image-rendering:pixelated;display:block;}
#title h1{font-size:clamp(44px,10vw,84px);color:#f4c542;text-shadow:3px 3px 0 #7a2a1a,6px 6px 0 #1a0e24;text-align:center;margin-top:6px;}
#title .sub{font-family:var(--f-zh);color:#e8dcc6;letter-spacing:.3em;font-size:15px;margin-top:-4px;}
#title .kick{font-family:var(--f-px);color:#b99be0;letter-spacing:.16em;font-size:16px;}
#title .go{font-family:var(--f-px);font-size:26px;background:#f4c542;color:#1d1426;border:0;padding:8px 30px 10px;box-shadow:0 5px 0 #9a6a14,0 5px 0 3px #1a0e24;border-radius:4px;margin-top:6px;}
#title .go:active{transform:translateY(4px);box-shadow:0 1px 0 #9a6a14;}
#title .tap{font-family:var(--f-px);color:#8f7fb0;font-size:15px;letter-spacing:.12em;animation:blink 1.4s steps(2) infinite;}
#title .cc{font-size:11px;color:#6d5f86;text-align:center;max-width:560px;}
@keyframes blink{50%{opacity:.35}}

/* ---------- toolbar ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--bg2);border-bottom:3px solid var(--line);display:flex;align-items:center;gap:6px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));}
.bar .logo{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;}
.bar .logo canvas{width:86px;height:36px;image-rendering:pixelated;border:2px solid var(--line2);border-radius:3px;flex:none;background:#0c0816;}
.bar .logo b{font-family:var(--f-px);font-weight:400;font-size:24px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ib{width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--line);background:var(--panel);border-radius:6px;padding:0;font-size:20px;line-height:1;flex:none;box-shadow:0 3px 0 var(--shadow);}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow);}
.ib.on{border-color:var(--gold);color:var(--gold);}
.ib svg{width:22px;height:22px;fill:currentColor;}

main{max-width:780px;margin:0 auto;padding:14px 16px 110px;}
.crumbs{display:flex;gap:6px;align-items:center;margin:0 0 10px;flex-wrap:wrap;}

/* ---------- panels & buttons ---------- */
.panel{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:14px;box-shadow:4px 4px 0 var(--shadow);margin:0 0 14px;}
.panel.tight{padding:10px 12px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-px);font-size:21px;line-height:1;padding:9px 16px 11px;border:2px solid var(--line2);background:var(--panel2);border-radius:5px;box-shadow:0 4px 0 var(--shadow);min-height:44px;}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow);}
.btn.pri{background:var(--gold);color:var(--on-gold);border-color:var(--gold);}
.btn.red{background:transparent;color:var(--red);border-color:var(--red);}
.btn.sm{font-size:17px;padding:6px 11px 7px;min-height:36px;}
.btn[disabled]{opacity:.45;pointer-events:none;}
.btn small{font-family:var(--f-zh);font-size:13px;opacity:.85;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.row.end{justify-content:flex-end;}
.row.sp{justify-content:space-between;}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}

/* choice cards */
.card{position:relative;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px 12px;box-shadow:0 3px 0 var(--shadow);display:block;width:100%;}
.card:hover{border-color:var(--line2);}
.card.sel{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 0 2px var(--gold) inset,0 3px 0 var(--shadow);}
.card .t{font-family:var(--f-px);font-size:22px;line-height:1.05;display:flex;align-items:center;gap:8px;}
.card .t .ico{width:28px;height:28px;flex:none;image-rendering:pixelated;}
.card .d{font-size:14.5px;margin-top:4px;line-height:1.45;}
.card .zh{font-size:13px;margin-top:2px;display:block;}
.card .badge{display:inline-block;margin:0 0 6px;}
.card .t .badge{margin:0 0 0 4px;}
.badge{font-family:var(--f-px);font-size:14px;line-height:1;padding:3px 7px 4px;border-radius:3px;background:var(--gold);color:var(--on-gold);}
.badge.soft{background:var(--panel2);color:var(--muted);border:1px solid var(--line2);}
.stars{font-family:var(--f-px);color:var(--gold);font-size:15px;letter-spacing:1px;}

/* term chips (tap to explain) */
.term{border-bottom:2px dotted var(--gold2);cursor:help;}
.info{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--gold2);color:var(--gold2);font-size:12px;line-height:1;cursor:help;vertical-align:middle;font-family:var(--f-body);font-weight:700;}
.info:active{transform:scale(.9);}
.say{border:0;background:none;padding:0 2px;font-size:.95em;line-height:1;cursor:pointer;vertical-align:baseline;filter:saturate(.8);}
.say:active{transform:scale(.9);}

/* steps */
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 12px;}
.steps button{font-family:var(--f-px);font-size:15px;border:2px solid var(--line);background:var(--panel);border-radius:4px;padding:3px 8px 4px;color:var(--muted);}
.steps button.on{border-color:var(--gold);color:var(--gold);}
.steps button.ok{color:var(--green);}
.tip{display:flex;gap:10px;background:var(--panel2);border:2px dashed var(--line2);border-radius:6px;padding:10px 12px;margin:0 0 14px;font-size:15px;}
.tip .i{font-size:22px;line-height:1;}
.tip p{margin:0;}
.tip .zh{display:block;}
.tip .ico{width:30px;height:30px;image-rendering:pixelated;}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg2);border-top:3px solid var(--line);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));}
.navbar .in{max-width:780px;margin:0 auto;display:flex;gap:10px;align-items:center;}
.navbar .in .grow{flex:1;min-width:0;font-size:14px;color:var(--muted);text-align:center;}

/* ability boxes */
.abgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
@media (min-width:620px){ .abgrid{grid-template-columns:repeat(6,1fr);} }
.ab{background:var(--panel);border:2px solid var(--line);border-radius:6px;text-align:center;padding:8px 4px 10px;position:relative;}
button.ab{width:100%;}
.ab.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;}
.ab .n{font-family:var(--f-px);font-size:17px;color:var(--muted);line-height:1;}
.ab .m{font-family:var(--f-px);font-size:38px;line-height:.95;margin:4px 0 2px;}
.ab .v{display:inline-block;font-family:var(--f-px);font-size:17px;border:2px solid var(--line2);border-radius:20px;padding:0 10px 1px;}
.ab .plus{font-family:var(--f-px);font-size:14px;color:var(--green);}
.ab.prim::after{content:"★";position:absolute;top:3px;right:6px;color:var(--gold);font-size:13px;}

/* sheet */
.stat3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:6px;text-align:center;padding:6px 4px 8px;}
.stat .k{font-family:var(--f-px);font-size:15px;color:var(--muted);line-height:1.1;}
.stat .val{font-family:var(--f-px);font-size:32px;line-height:1;}
.hpbox{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;}
.hpbar{height:18px;background:var(--bg);border:2px solid var(--line2);border-radius:3px;overflow:hidden;position:relative;}
.hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--red),#f08a5b);transition:width .3s;}
.hpbar i.tmp{background:var(--blue);opacity:.7;}
.hpnum{font-family:var(--f-px);font-size:34px;line-height:1;}
.hpnum small{font-size:20px;color:var(--muted);}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;border-bottom:3px solid var(--line);}
.tabs::-webkit-scrollbar{display:none;}
.tabwrap{position:relative;}
.tabarrow{position:absolute;top:0;bottom:15px;width:34px;border:0;padding:0;color:var(--gold);font-size:14px;display:grid;place-items:center;z-index:2;}
.tabarrow[hidden]{display:none;}
.tabarrow.l{left:0;background:linear-gradient(to right,var(--bg) 55%,transparent);justify-content:start;padding-left:2px;}
.tabarrow.r{right:0;background:linear-gradient(to left,var(--bg) 55%,transparent);justify-content:end;padding-right:2px;}
.tabs button{font-family:var(--f-px);font-size:19px;border:0;background:none;color:var(--muted);padding:6px 10px 7px;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap;}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold);}
.list{display:grid;gap:6px;}
.li{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:5px;padding:7px 10px;}
.li .main{flex:1;min-width:0;}
.li .main b{font-weight:700;}
.li .main .zh{display:block;}
.li .num{font-family:var(--f-px);font-size:22px;min-width:40px;text-align:center;}
button.li{width:100%;text-align:left;}
.pip{width:22px;height:22px;border:2px solid var(--line2);border-radius:4px;background:var(--bg);display:inline-block;vertical-align:middle;padding:0;}
.pip.on{background:var(--gold);border-color:var(--gold);}
.pip.x{background:var(--red);border-color:var(--red);}
.pips{display:flex;gap:5px;flex-wrap:wrap;}
.skill{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:5px 8px;border-radius:4px;background:none;border:0;width:100%;text-align:left;}
.skill:nth-child(odd){background:var(--panel);}
.skill .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);}
.skill .dot.p{background:var(--gold);border-color:var(--gold);}
.skill .dot.e{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--gold);}
.skill .b{font-family:var(--f-px);font-size:20px;}
.skill .ab3{font-family:var(--f-px);font-size:13px;color:var(--muted);margin-left:4px;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;}
.kv dt{color:var(--muted);}
.kv dd{margin:0;}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--bg);border:2px solid var(--line2);border-radius:5px;padding:8px 10px;}
textarea{min-height:70px;resize:vertical;}
label.fl{display:block;font-weight:700;margin:10px 0 4px;}
label.fl .zh{font-weight:400;margin-left:6px;}

/* roster */
.slot{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;text-align:left;}
.por{width:64px;height:64px;flex:none;image-rendering:pixelated;background:var(--bg);border:2px solid var(--line2);border-radius:4px;padding:6px;}
.slotsfree{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;padding:8px 12px;border:2px dashed var(--line);border-radius:6px;color:var(--muted);font-size:14px;letter-spacing:2px;}
.slotsfree span{letter-spacing:0;}
.howcard{display:block;width:100%;text-align:left;margin-top:12px;border-color:var(--gold);} .howcard .t{font-family:var(--f-px);font-size:21px;color:var(--gold);} .howcard .d{font-size:15px;margin-top:4px;}
.pillars{margin-top:10px;} .pillars .card{text-align:left;} .pillars .t{font-family:var(--f-px);font-size:20px;}
.pillars .d{font-size:15px;margin-top:6px;}
.abhelp{margin:6px 0 0;padding-left:20px;} .abhelp li{margin-bottom:8px;} .abhelp .zh{display:block;}
.slot.empty{border-style:dashed;color:var(--muted);grid-template-columns:1fr;text-align:center;padding:18px;}
.slot .nm{font-family:var(--f-px);font-size:25px;line-height:1;}

/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:rgba(8,5,14,.72);display:none;align-items:flex-end;justify-content:center;}
.ov.on{display:flex;}
.sheet{background:var(--panel);border:3px solid var(--line2);border-bottom:0;border-radius:10px 10px 0 0;width:min(100%,640px);max-height:88vh;overflow:auto;padding:14px 16px;padding-bottom:max(18px,env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.4);}
@media (min-width:700px){ .ov{align-items:center;} .sheet{border-radius:10px;border-bottom:3px solid var(--line2);} }
.sheet .hd{display:flex;align-items:center;gap:10px;margin:0 0 10px;}
.sheet .hd h3{flex:1;}
.pop h3{font-size:28px;color:var(--gold);}
.pop .zhbig{font-family:var(--f-zh);font-size:18px;margin:2px 0 8px;}

/* dice */
.dice{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.die{aspect-ratio:1;border:2px solid var(--line2);background:var(--panel2);border-radius:6px;display:grid;place-items:center;padding:2px;box-shadow:0 3px 0 var(--shadow);}
.die svg{width:78%;height:78%;}
.die span{font-family:var(--f-px);font-size:16px;line-height:1;margin-top:-4px;}
.die.on{border-color:var(--gold);}
.tray{min-height:120px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:10px;margin:10px 0;}
.rd{width:58px;height:58px;display:grid;place-items:center;position:relative;}
.rd svg{position:absolute;inset:0;width:100%;height:100%;}
.rd b{position:relative;font-family:var(--f-px);font-weight:400;font-size:26px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.5);}
.rd.drop{opacity:.35;}
.rd.spin{animation:spin .5s steps(6) infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.total{font-family:var(--f-px);font-size:54px;line-height:1;text-align:center;}
.total.crit{color:var(--gold);text-shadow:0 0 12px var(--gold);}
.total.fail{color:var(--red);}
.hist{font-size:13.5px;color:var(--muted);max-height:120px;overflow:auto;}
.seg{display:inline-flex;border:2px solid var(--line2);border-radius:5px;overflow:hidden;}
.seg button{border:0;background:var(--panel);padding:6px 10px;font-family:var(--f-px);font-size:17px;}
.seg button.on{background:var(--gold);color:var(--on-gold);}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;transition:all .25s;z-index:60;background:var(--ink);color:var(--bg);font-size:15px;padding:9px 16px;border-radius:6px;max-width:90vw;text-align:center;pointer-events:none;}
#toast.on{opacity:1;transform:translate(-50%,0);}
#mp{position:fixed;top:58px;right:10px;z-index:35;width:min(92vw,21rem);background:var(--panel);border:3px solid var(--line2);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.35);padding:10px;}
.trk{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;}
.trk:hover{background:var(--panel2);}
.trk .pl{width:36px;height:36px;border-radius:4px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-size:13px;}
.trk.on{border-color:var(--gold);}
.trk .tn{font-family:var(--f-px);font-size:19px;display:block;line-height:1.1;}
.trk .tz{font-family:var(--f-zh);font-size:12.5px;color:var(--muted);display:block;}
.vol{display:flex;align-items:center;gap:10px;margin:8px 4px 2px;font-size:13px;color:var(--muted);}
.vol input{flex:1;accent-color:var(--gold);}
.lvup{animation:glow 1.2s ease-in-out 2;}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--gold),0 0 24px var(--gold);}}
.qopt{display:grid;gap:8px;}
.qopt .card{padding:12px 14px;}
.hero-toggle{font-size:14px;margin:8px 0 0;}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line2);border-radius:20px;padding:3px 10px;font-size:14px;background:var(--panel);margin:2px;}
.chip.sel{border-color:var(--gold);background:var(--gold);color:var(--on-gold);}
.chip.sel .zh{color:inherit;opacity:.85;}
.lock{border:2px solid var(--line2);background:var(--panel2);border-radius:5px;width:36px;height:36px;display:grid;place-items:center;font-size:17px;padding:0;}
.lock.on{border-color:var(--gold);background:var(--gold);}
.rev{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--line);}
.rev:last-child{border-bottom:0;}
.rev .k{font-family:var(--f-px);font-size:15px;color:var(--muted);line-height:1;}
.rev .v{font-size:16px;}
.rev .v b{font-family:var(--f-px);font-weight:400;font-size:22px;}
.rev .act{display:flex;gap:6px;}
.split{display:grid;gap:14px;}
@media (min-width:700px){ .split{grid-template-columns:1fr 1fr;} }
.sp-lv{font-family:var(--f-px);font-size:19px;color:var(--gold);margin:14px 0 6px;display:flex;align-items:center;gap:8px;}
.sp-lv:first-child{margin-top:0;}
.cnt{font-family:var(--f-px);font-size:16px;padding:2px 8px;border-radius:3px;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);}
.cnt.full{background:var(--green);color:#10200f;border-color:var(--green);}
.spl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;}
.spl .ck{width:26px;height:26px;border:2px solid var(--line2);border-radius:4px;display:grid;place-items:center;font-size:16px;background:var(--bg);}
.spl.sel .ck{background:var(--gold);border-color:var(--gold);color:var(--on-gold);}
.spl .tg{display:flex;gap:4px;}
.spl .tg i{font-style:normal;font-size:14px;}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;margin-top:6px;}
details.more p{font-size:14px;line-height:1.5;margin:6px 0 0;}
.kbd{font-family:var(--f-px);font-size:16px;background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:0 5px;}
.center{text-align:center;}
.big-emoji{font-size:40px;line-height:1;}
.hr{height:3px;background:var(--line);margin:14px 0;border:0;}
@media (max-width:420px){ h2{font-size:26px;} .bar .logo b{font-size:20px;} .bar .logo canvas{width:64px;height:27px;} .ib{width:38px;height:38px;} .stat .val{font-size:26px;} }
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important;} }
@media print{
  .bar,.navbar,.tabs,#toast,.ov,.noprint{display:none !important;}
  body,html{background:#fff !important;color:#000;}
  :root{--panel:#fff;--panel2:#f4f4f4;--ink:#000;--muted:#444;--line:#999;--line2:#777;--gold:#000;}
  .panel{box-shadow:none;break-inside:avoid;}
  .printall .tabpane{display:block !important;}
}
</style>
</head>
<body class="titled">
<div id="title" role="dialog" aria-label="Hero Workshop">
  <div class="kick">5E-COMPATIBLE · SRD 5.2.1</div>
  <div class="stage"><canvas id="cv" width="320" height="180" aria-label="A red dragon breathes fire at four heroes; a glowing shield holds the flames back. 紅龍朝四位英雄噴火，發光的護盾擋住火焰。"></canvas></div>
  <h1>Hero Workshop</h1>
  <div class="sub">英雄工坊・角色建立器</div>
  <button class="go" id="goBtn">▶ Start 開始</button>
  <div class="tap" id="coverMusic">♪ TAP FOR MUSIC 點一下播放音樂</div>
  <div class="cc">Made for InkQuest · includes material from the SRD 5.2.1 (CC-BY-4.0)</div>
</div>

<header class="bar">
  <button class="logo" id="homeBtn" aria-label="Home 首頁"><canvas id="mini" width="120" height="50"></canvas><b>Hero Workshop</b></button>
  <button class="ib" id="diceBtn" aria-label="Dice 擲骰" title="Dice 擲骰">🎲</button>
  <button class="ib" id="musicBtn" aria-label="Music 音樂" title="Music 音樂"><svg viewBox="0 0 24 24"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></button>
  <button class="ib" id="guideBtn" aria-label="Guide 指南" title="Guide 指南">📖</button>
  <button class="ib" id="setBtn" aria-label="Settings 設定" title="Settings 設定">⚙️</button>
</header>

<div id="mp" hidden>
  <div id="tracks"></div>
  <div class="vol"><span>Volume 音量</span><input type="range" id="vol" min="0" max="100" aria-label="Volume 音量"><button class="btn sm" id="mStop">Stop</button></div>
  <div class="vol"><span>Sound FX 音效</span><input type="range" id="sfxVol" min="0" max="100" aria-label="Sound effects 音效"></div>
</div>

<main id="main"></main>
<div class="navbar hide" id="navbar"><div class="in" id="navIn"></div></div>

  get(k, d){ try{ const v = localStorage.getItem("hw-"+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("hw-"+k, JSON.stringify(v)); }catch(e){} }
};

 produces the sound of a handbell for 10 seconds within 60 feet of the warded area. Mental Alarm. You are alerted by a mental ping if you are within 1 mile of the warded area. This ping awakens you if you’re asleep."},"Alter Self":{"l":2,"sc":"Transmutation","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"Self","cp":"V, S","du":"Concentration, up to 1 hour","tx":"You alter your physical form. Choose one of the following options. Its effects last for the duration, during which you can take a Magic action to replace the option you chose with a different one. Aquatic Adaptation. You sprout gills and grow webs between your fingers. You can breathe underwater and gain a Swim Speed equal to your Speed. Change Appearance. You alter your appearance. You decide what you look like, including your height, weight, facial features, sound of your voice, hair length, coloration, and other distinguishing characteristics. You can make yourself appear as a member of another species, though none of your statistics change. You can’t appear as a creature of a different size, and your basic shape stays the same; if you’re bipedal, you can’t use this spell to become quadrupedal, for instance. For the duration, you can take a Magic action to change your appearance in this way again. Natural Weapons. You grow claws (Slashing), fangs (Piercing), horns (Piercing), or hooves (Bludgeoning). When you use your Unarmed Strike to deal damage with that new growth, it deals 1d6 damage of the type in parentheses instead of dealing the normal damage for your Unarmed Strike, and you use your spellcasting ability modifier for the attack and damage rolls rather than using Strength."},"Animal Friendship":{"l":1,"sc":"Enchantment","cl":["Bard","Druid","Ranger"],"ct":"Action","rg":"30 feet","cp":"V, S, M (a morsel of food)","du":"24 hours","tx":"Target a Beast that you can see within range. The target must succeed on a Wisdom saving throw or have the Charmed condition for the duration. If you or one of your allies deals damage to the target, the spells ends. Using a Higher-Level Spell Slot. You can target one additional Beast for each spell slot level above 1."},"Animal Messenger":{"l":2,"sc":"Enchantment","cl":["Bard","Druid","Ranger"],"ct":"Action or Ritual","rg":"30 feet","cp":"V, S, M (a morsel of food)","du":"24 hours","tx":"A Tiny Beast of your choice that you can see within range must succeed on a Charisma saving throw, or it attempts to deliver a message for you (if the target’s Challenge Rating isn’t 0, it automatically succeeds). You specify a location you have visited and a recipient who matches a general description, such as “a person dressed in the uniform of the town guard” or “a red-haired dwarf wearing a pointed hat.” You also communicate a message of up to twenty-five words. The Beast travels for the duration toward the specified location, covering about 25 miles per 24 hours or 50 miles if the Beast can fly. When the Beast arrives, it delivers your message to the creature that you described, mimicking your communication. If the Beast doesn’t reach its destination before the spell ends, the message is lost, and the Beast returns to where you cast the spell. Using a Higher-Level Spell Slot. The spell’s duration increases by 48 hours for each spell slot level above 2."},"Animate Dead":{"l":3,"sc":"Necromancy","cl":["Cleric","Wizard"],"ct":"1 minute","rg":"10 feet","cp":"V, S, M (a drop of blood, a piece of flesh, and a pinch of bone dust)","du":"Instantaneous","tx":"Choose a pile of bones or a corpse of a Medium or Small Humanoid within range. The target becomes an Undead creature: a Skeleton if you chose bones or a Zombie if you chose a corpse (see “Monsters” for the stat blocks). On each of your turns, you can take a Bonus Action to mentally command any creature you made with this spell if the creature is within 60 feet of you (if you control multiple creatures, you can command any of them at the same time, issuing the same command to each one). You decide what action the creature will take and where it will move on its next turn, or you can issue a general command, such as to guard a chamber or corridor. If you issue no commands, the creature takes the Dodge action and moves only to avoid harm. Once given an order, the creature continues to follow it until its task is complete. The creature is under your control for 24 hours, after which it stops obeying any command you’ve given it. To maintain control of the creature for another 24 hours, you must cast this spell on the creature again before the current 24-hour period ends. This use of the spell reasserts your control over up to four creatures you have animated with this spell rather than animating a new creature. Using a Higher-Level Spell Slot. You animate or reassert control over two additional Undead creatures for each spell slot level above 3. Each of the creatures must come from a different corpse or pile of bones."},"Arcane Lock":{"l":2,"sc":"Abjuration","cl":["Wizard"],"ct":"Action","rg":"Touch","cp":"V, S, M (gold dust worth 25+ GP, which the spell consumes)","du":"Until dispelled","tx":"You touch a closed door, window, gate, container, or hatch and magically lock it for the duration. This lock can’t be unlocked by any nonmagical means. You and any creatures you designate when you cast the spell can open and close the object despite the lock. You can also set a password that, when spoken within 5 feet of the object, unlocks it for 1 minute."},"Arcanist’s Magic Aura":{"l":2,"sc":"Illusion","cl":["Wizard"],"ct":"Action","rg":"Touch","cp":"V, S, M (a small square of silk)","du":"24 hours","tx":"With a touch, you place an illusion on a willing creature or an object that isn’t being worn or carried. A creature gains the Mask effect below, and an object gains the False Aura effect below. The effect lasts for the duration. If you cast the spell on the same target every day for 30 days, the illusion lasts until dispelled. Mask (Creature). Choose a creature type other than the target’s actual type. Spells and other magical effects treat the target as if it were a creature of the chosen type. False Aura (Object). You change the way the target appears to spells and magical effects that detect magical auras, such as Detect Magic. You can make a nonmagical object appear magical, make a magic item appear nonmagical, or change the object’s aura so that it appears to belong to a school of magic you choose."},"Augury":{"l":2,"sc":"Divination","cl":["Cleric","Druid","Wizard"],"ct":"1 minute or Ritual","rg":"Self","cp":"V, S, M (specially marked sticks, bones, cards, or other divinatory tokens worth 25+ GP)","du":"Instantaneous","tx":"You receive an omen from an otherworldly entity about the results of a course of action that you plan to take within the next 30 minutes. The GM chooses the omen from the Omens table. Omens Omen For Results That Will Be … Weal Good Woe Bad Weal and woe Good and bad Indifference Neither good nor bad The spell doesn’t account for circumstances, such as other spells, that might change the results. If you cast the spell more than once before finishing a Long Rest, there is a cumulative 25 percent chance for each casting after the first that you get no answer."},"Bane":{"l":1,"sc":"Enchantment","cl":["Bard","Cleric","Warlock"],"ct":"Action","rg":"30 feet","cp":"V, S, M (a drop of blood)","du":"Concentration, up to 1 minute","tx":"Up to three creatures of your choice that you can see within range must each make a Charisma saving throw. Whenever a target that fails this save makes an attack roll or a saving throw before the spell ends, the target must subtract 1d4 from the attack roll or save. Using a Higher-Level Spell Slot. You can target one additional creature for each spell slot level above 1."},"Barkskin":{"l":2,"sc":"Transmutation","cl":["Druid","Ranger"],"ct":"Bonus Action","rg":"Touch","cp":"V, S, M (a handful of bark)","du":"1 hour","tx":"You touch a willing creature. Until the spell ends, the target’s skin assumes a bark-like appearance, and the target has an Armor Class of 17 if its AC is lower than that."},"Beacon of Hope":{"l":3,"sc":"Abjuration","cl":["Cleric"],"ct":"Action","rg":"30 feet","cp":"V, S","du":"Concentration, up to 1 minute","tx":"Choose any number of creatures within range. For the duration, each target has Advantage on Wisdom saving throws and Death Saving Throws and regains the maximum number of Hit Points possible from any healing."},"Bestow Curse":{"l":3,"sc":"Necromancy","cl":["Bard","Cleric","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S","du":"Concentration, up to 1 minute","tx":"You touch a creature, which must succeed on a Wisdom saving throw or become cursed for the duration. Until the curse ends, the target suffers one of the following effects of your choice: • Choose one ability. The target has Disadvantage on ability checks and saving throws made with that ability. • The target has Disadvantage on attack rolls against you. • In combat, the target must succeed on a Wisdom saving throw at the start of each of its turns or be forced to take the Dodge action on that turn. • If you deal damage to the target with an attack roll or a spell, the target takes an extra 1d8 Necrotic damage. Using a Higher-Level Spell Slot. If you cast this spell using a level 4 spell slot, you can maintain Concentration on it for up to 10 minutes. If you use a level 5+ spell slot, the spell doesn’t require Concentration, and the duration becomes 8 hours (level 5–6 slot) or 24 hours (level 7–8 slot). If you use a level 9 spell slot, the spell lasts until dispelled."},"Bless":{"l":1,"sc":"Enchantment","cl":["Cleric","Paladin"],"ct":"Action","rg":"30 feet","cp":"V, S, M (a Holy Symbol worth 5+ GP)","du":"Concentration, up to 1 minute","tx":"You bless up to three creatures within range. Whenever a target makes an attack roll or a saving throw before the spell ends, the target adds 1d4 to the attack roll or save. Using a Higher-Level Spell Slot. You can target one additional creature for each spell slot level above 1."},"Blindness/Deafness":{"l":2,"sc":"Transmutation","cl":["Bard","Cleric","Sorcerer","Wizard"],"ct":"Action","rg":"120 feet","cp":"V","du":"1 minute","tx":"One creature that you can see within range must succeed on a Constitution saving throw, or it has the Blinded or Deafened condition (your choice) for the duration. At the end of each of its turns, the target repeats the save, ending the spell on itself on a success. Using a Higher-Level Spell Slot. You can target one additional creature for each spell slot level above 2."},"Blink":{"l":3,"sc":"Transmutation","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"Self","cp":"V, S","du":"1 minute","tx":"Roll 1d6 at the end of each of your turns for the duration. On a roll of 4–6, you vanish from your current plane of existence and appear in the Ethereal Plane (the spell ends instantly if you are already on that plane). While on the Ethereal Plane, you can perceive the plane you left, which is cast in shades of gray, but you can’t see anything there more than 60 feet away. You can affect and be affected only by other creatures on the Ethereal Plane, and creatures on the other plane can’t perceive you unless they have a special ability that lets them perceive things on the Ethereal Plane. You return to the other plane at the start of your next turn and when the spell ends if you are on the Ethereal Plane. You return to an unoccupied space of your choice that you can see within 10 feet of the space you left. If no unoccupied space is available within that range, you appear in the nearest unoccupied space."},"Blur":{"l":2,"sc":"Illusion","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"Self","cp":"V","du":"Concentration, up to 1 minute","tx":"Your body becomes blurred. For the duration, any creature has Disadvantage on attack rolls against you. An attacker is immune to this effect if it perceives you with Blindsight or Truesight."},"Burning Hands":{"l":1,"sc":"Evocation","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"Self","cp":"V, S","du":"Instantaneous","tx":"A thin sheet of flames shoots forth from you. Each creature in a 15-foot Cone makes a Dexterity saving throw, taking 3d6 Fire damage on a failed save or half as much damage on a successful one. Flammable objects in the Cone that aren’t being worn or carried start burning. Using a Higher-Level Spell Slot. The damage increases by 1d6 for each spell slot level above 1."},"Call Lightning":{"l":3,"sc":"Conjuration","cl":["Druid"],"ct":"Action","rg":"120 feet","cp":"V, S","du":"Concentration, up to 10 minutes","tx":"A storm cloud appears at a point within range that you can see above yourself. It takes the shape of a Cylinder that is 10 feet tall with a 60-foot radius. When you cast the spell, choose a point you can see under the cloud. A lightning bolt shoots from the cloud to that point. Each creature within 5 feet of that point makes a Dexterity saving throw, taking 3d10 Lightning damage on a failed save or half as much damage on a successful one. Until the spell ends, you can take a Magic action to call down lightning in that way again, targeting the same point or a different one. If you’re outdoors in a storm when you cast this spell, the spell gives you control over that storm instead of creating a new one. Under such conditions, the spell’s damage increases by 1d10. Using a Higher-Level Spell Slot. The damage increases by 1d10 for each spell slot level above 3."},"Calm Emotions":{"l":2,"sc":"Enchantment","cl":["Bard","Cleric"],"ct":"Action","rg":"60 feet","cp":"V, S","du":"Concentration, up to 1 minute","tx":"Each Humanoid in a 20-foot-radius Sphere centered on a point you choose within range must succeed on a Charisma saving throw or be affected by one of the following effects (choose for each creature): • The creature has Immunity to the Charmed and Frightened conditions until the spell ends. If the creature was already Charmed or Frightened, those conditions are suppressed for the duration. • The creature becomes Indifferent about creatures of your choice that it’s Hostile toward. This indifference ends if the target takes damage or witnesses its allies taking damage. When the spell ends, the creature’s attitude returns to normal."},"Charm Person":{"l":1,"sc":"Enchantment","cl":["Bard","Druid","Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"30 feet","cp":"V, S","du":"1 hour","tx":"One Humanoid you can see within range makes a Wisdom saving throw. It does so with Advantage if you or your allies are fighting it. On a failed save, the target has the Charmed condition until the spell ends or until you or your allies damage it. The Charmed creature is Friendly to you. When the spell ends, the target knows it was Charmed by you. Using a Higher-Level Spell Slot. You can target one additional creature for each spell slot level above 1."},"Chill Touch":{"l":0,"sc":"Necromancy","cl":["Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S","du":"Instantaneous","tx":"Channeling the chill of the grave, make a melee spell attack against a target within reach. On a hit, the target takes 1d10 Necrotic damage, and it can’t regain Hit Points until the end of your next turn. Cantrip Upgrade. The damage increases by 1d10 when you reach levels 5 (2d10), 11 (3d10), and 17 (4d10)."},"Chromatic Orb":{"l":1,"sc":"Evocation","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"90 feet","cp":"V, S, M (a diamond worth 50+ GP)","du":"Instantaneous","tx":"You hurl an orb of energy at a target within range. Choose Acid, Cold, Fire, Lightning, Poison, or Thunder for the type of orb you create, and then make a ranged spell attack against the target. On a hit, the target takes 3d8 damage of the chosen type. If you roll the same number on two or more of the d8s, the orb leaps to a different target of your choice within 30 feet of the target. Make an attack roll against the new target, and make a new damage roll. The orb can’t leap again unless you cast the spell with a level 2+ spell slot. Using a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 1. The orb can leap a maximum number of times equal to the level of the slot expended, and a creature can be targeted only once by each casting of this spell."},"Clairvoyance":{"l":3,"sc":"Divination","cl":["Bard","Cleric","Sorcerer","Wizard"],"ct":"10 minutes","rg":"1 mile","cp":"V, S, M (a focus worth 100+ GP, either a jeweled horn for hearing or a glass eye for seeing)","du":"Concentration, up to 10 minutes","tx":"You create an Invisible sensor within range in a location familiar to you (a place you have visited or seen before) or in an obvious location that is unfamiliar to you (such as behind a door, around a corner, or in a grove of trees). The intangible, invulnerable sensor remains in place for the duration. When you cast the spell, choose seeing or hearing. You can use the chosen sense through the sensor as if you were in its space. As a Bonus Action, you can switch between seeing and hearing. A creature that sees the sensor (such as a creature benefiting from See Invisibility or Truesight) sees a luminous orb about the size of your fist."},"Color Spray":{"l":1,"sc":"Illusion","cl":["Bard","Sorcerer","Wizard"],"ct":"Action","rg":"Self","cp":"V, S, M (a pinch of colorful sand)","du":"Instantaneous","tx":"You launch a dazzling array of flashing, colorful light. Each creature in a 15-foot Cone originating from you must succeed on a Constitution saving throw or have the Blinded condition until the end of your next turn."},"Command":{"l":1,"sc":"Enchantment","cl":["Bard","Cleric","Paladin"],"ct":"Action","rg":"60 feet","cp":"V","du":"Instantaneous","tx":"You speak a one-word command to a creature you can see within range. The target must succeed on a Wisdom saving throw or follow the command on its next turn. Choose the command from these options: Approach. The target moves toward you by the shortest and most direct route, ending its turn if it moves within 5 feet of you. Drop. The target drops whatever it is holding and then ends its turn. Flee. The target spends its turn moving away from you by the fastest available means. Grovel. The target has the Prone condition and then ends its turn. Halt. On its turn, the target doesn’t move and takes no action or Bonus Action. Using a Higher-Level Spell Slot. You can affect one additional creature for each spell slot level above 1."},"Comprehend Languages":{"l":1,"sc":"Divination","cl":["Bard","Sorcerer","Warlock","Wizard"],"ct":"Action or Ritual","rg":"Self","cp":"V, S, M (a pinch of soot and salt)","du":"1 hour","tx":"For the duration, you understand the literal meaning of any language that you hear or see signed. You also understand any written language that you see, but you must be touching the surface on which the words are written. It takes about 1 minute to read one page of text. This spell doesn’t decode symbols or secret messages."},"Conjure Animals":{"l":3,"sc":"Conjuration","cl":["Druid","Ranger"],"ct":"Action","rg":"60 feet","cp":"V, S","du":"Concentration, up to 10 minutes","tx":"You conjure nature spirits that appear as a Large pack of spectral, intangible animals in an unoccupied space you can see within range. The pack lasts for the duration, and you choose the spirits’ animal form, such as wolves, serpents, or birds. You have Advantage on Strength saving throws while you’re within 5 feet of the pack, and when you move on your turn, you can also move the pack up to 30 feet to an unoccupied space you can see. Whenever the pack moves within 10 feet of a creature you can see and whenever a creature you can see enters a space within 10 feet of the pack or ends its turn there, you can force that creature to make a Dexterity saving throw. On a failed save, the creature takes 3d10 Slashing damage. A creature makes this save only once per turn. Using a Higher-Level Spell Slot. The damage increases by 1d10 for each spell slot level above 3."},"Continual Flame":{"l":2,"sc":"Evocation","cl":["Cleric","Druid","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S, M (ruby dust worth 50+ GP, which the spell consumes)","du":"Until dispelled","tx":"A flame springs from an object that you touch. The effect casts Bright Light in a 20-foot radius and Dim Light for an additional 20 feet. It looks like a regular flame, but it creates no heat and consumes no fuel. The flame can be covered or hidden but not smothered or quenched."},"Counterspell":{"l":3,"sc":"Abjuration","cl":["Sorcerer","Warlock","Wizard"],"ct":"Reaction, which you take when you see a creature within 60 feet of yourself casting a spell with Verbal, Somatic, or Material components","rg":"60 feet","cp":"S","du":"Instantaneous","tx":"You attempt to interrupt a creature in the process of casting a spell. The creature makes a Constitution saving throw. On a failed save, the spell dissipates with no effect, and the action, Bonus Action, or Reaction used to cast it is wasted. If that spell was cast with a spell slot, the slot isn’t expended."},"Create Food and Water":{"l":3,"sc":"Conjuration","cl":["Cleric","Paladin"],"ct":"Action","rg":"30 feet","cp":"V, S","du":"Instantaneous","tx":"You create 45 pounds of food and 30 gallons of fresh water on the ground or in containers within range—both useful in fending off the hazards of malnutrition and dehydration. The food is bland but nourishing and looks like a food of your choice, and the water is clean. The food spoils after 24 hours if uneaten."},"Create or Destroy Water":{"l":1,"sc":"Transmutation","cl":["Cleric","Druid"],"ct":"Action","rg":"30 feet","cp":"V, S, M (a mix of water and sand)","du":"Instantaneous","tx":"You do one of the following: Create Water. You create up to 10 gallons of clean water within range in an open container. Alternatively, the water falls as rain in a 30-foot Cube within range, extinguishing exposed flames there. Destroy Water. You destroy up to 10 gallons of water in an open container within range. Alternatively, you destroy fog in a 30-foot Cube within range. Using a Higher-Level Spell Slot. You create or destroy 10 additional gallons of water, or the size of the Cube increases by 5 feet, for each spell slot level above 1."},"Cure Wounds":{"l":1,"sc":"Abjuration","cl":["Bard","Cleric","Druid","Paladin","Ranger"],"ct":"Action","rg":"Touch","cp":"V, S","du":"Instantaneous","tx":"A creature you touch regains a number of Hit Points equal to 2d8 plus your spellcasting ability modifier. Using a Higher-Level Spell Slot. The healing increases by 2d8 for each spell slot level above 1."},"Dancing Lights":{"l":0,"sc":"Illusion","cl":["Bard","Sorcerer","Wizard"],"ct":"Action","rg":"120 feet","cp":"V, S, M (a bit of phosphorus)","du":"Concentration, up to 1 minute","tx":"You create up to four torch-size lights within range, making them appear as torches, lanterns, or glowing orbs that hover for the duration. Alternatively, you combine the four lights into one glowing Medium form that is vaguely humanlike. Whichever form you choose, each light sheds Dim Light in a 10- foot radius. As a Bonus Action, you can move the lights up to 60 feet to a space within range. A light must be within 20 feet of another light created by this spell, and a light vanishes if it exceeds the spell’s range."},"Darkness":{"l":2,"sc":"Evocation","cl":["Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"60 feet","cp":"V, M (bat fur and a piece of coal)","du":"Concentration, up to 10 minutes","tx":"For the duration, magical Darkness spreads from a point within range and fills a 15-foot-radius Sphere. Darkvision can’t see through it, and nonmagical light can’t illuminate it. Alternatively, you cast the spell on an object that isn’t being worn or carried, causing the Darkness to fill a 15-foot Emanation originating from that object. Covering that object with something opaque, such as a bowl or helm, blocks the Darkness. If any of this spell’s area overlaps with an area of Bright Light or Dim Light created by a spell of level 2 or lower, that other spell is dispelled."},"Darkvision":{"l":2,"sc":"Transmutation","cl":["Druid","Ranger","Sorcerer","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S, M (a dried carrot)","du":"8 hours","tx":"For the duration, a willing creature you touch has Darkvision with a range of 150 feet."},"Daylight":{"l":3,"sc":"Evocation","cl":["Cleric","Druid","Paladin","Ranger","Sorcerer"],"ct":"Action","rg":"60 feet","cp":"V, S","du":"1 hour","tx":"For the duration, sunlight spreads from a point within range and fills a 60-foot-radius Sphere. The sunlight’s area is Bright Light and sheds Dim Light for an additional 60 feet. Alternatively, you cast the spell on an object that isn’t being worn or carried, causing the sunlight to fill a 60-foot Emanation originating from that object. Covering that object with something opaque, such as a bowl or helm, blocks the sunlight. If any of this spell’s area overlaps with an area of Darkness created by a spell of level 3 or lower, that other spell is dispelled."},"Detect Evil and Good":{"l":1,"sc":"Divination","cl":["Cleric","Paladin"],"ct":"Action","rg":"Self","cp":"V, S","du":"Concentration, up to 10 minutes","tx":"For the duration, you sense the location of any Aberration, Celestial, Elemental, Fey, Fiend, or Undead within 30 feet of yourself. You also sense whether the Hallow spell is active there and, if so, where. The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead."},"Detect Magic":{"l":1,"sc":"Divination","cl":["Bard","Cleric","Druid","Paladin","Ranger","Sorcerer","Warlock","Wizard"],"ct":"Action or Ritual","rg":"Self","cp":"V, S","du":"Concentration, up to 10 minutes","tx":"For the duration, you sense the presence of magical effects within 30 feet of yourself. If you sense such effects, you can take the Magic action to see a faint aura around any visible creature or object in the area that bears the magic, and if an effect was created by a spell, you learn the spell’s school of magic. The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead."},"Detect Poison and Disease":{"l":1,"sc":"Divination","cl":["Cleric","Druid","Paladin","Ranger"],"ct":"Action or Ritual","rg":"Self","cp":"V, S, M (a yew leaf)","du":"Concentration, up to 10 minutes","tx":"For the duration, you sense the location of poisons, poisonous or venomous creatures, and magical contagions within 30 feet of yourself. You sense the kind of poison, creature, or contagion in each case. The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead."},"Detect Thoughts":{"l":2,"sc":"Divination","cl":["Bard","Sorcerer","Wizard"],"ct":"Action","rg":"Self","cp":"V, S, M (1 Copper Piece)","du":"Concentration, up to 1 minute","tx":"You activate one of the effects below. Until the spell ends, you can activate either effect as a Magic action on your later turns. Sense Thoughts. You sense the presence of thoughts within 30 feet of yourself that belong to creatures that know languages or are telepathic. You don’t read the thoughts, but you know that a thinking creature is present. The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead. Read Thoughts. Target one creature you can see within 30 feet of yourself or one creature within 30 feet of yourself that you detected with the Sense Thoughts option. You learn what is most on the target’s mind right now. If the target doesn’t know any languages and isn’t telepathic, you learn nothing. As a Magic action on your next turn, you can try to probe deeper into the target’s mind. If you probe deeper, the target makes a Wisdom saving throw. On a failed save, you discern the target’s reasoning, emotions, and something that looms large in its mind (such as a worry, love, or hate). On a successful save, the spell ends. Either way, the target knows that you are probing into its mind, and until you shift your attention away from the target’s mind, the target can take an action on its turn to make an Intelligence (Arcana) check against your spell save DC, ending the spell on a success."},"Disguise Self":{"l":1,"sc":"Illusion","cl":["Bard","Sorcerer","Wizard"],"ct":"Action","rg":"Self","cp":"V, S","du":"1 hour","tx":"You make yourself—including your clothing, armor, weapons, and other belongings on your person— look different until the spell ends. You can seem 1 foot shorter or taller and can appear heavier or lighter. You must adopt a form that has the same basic arrangement of limbs as you have. Otherwise, the extent of the illusion is up to you. The changes wrought by this spell fail to hold up to physical inspection. For example, if you use this spell to add a hat to your outfit, objects pass through the hat, and anyone who touches it would feel nothing. To discern that you are disguised, a creature must take the Study action to inspect your appearance and succeed on an Intelligence (Investigation) check against your spell save DC."},"Dispel Magic":{"l":3,"sc":"Abjuration","cl":["Bard","Cleric","Druid","Paladin","Ranger","Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"120 feet","cp":"V, S","du":"Instantaneous","tx":"Choose one creature, object, or magical effect within range. Any ongoing spell of level 3 or lower on the target ends. For each ongoing spell of level 4 or higher on the target, make an ability check using your spellcasting ability (DC 10 plus that spell’s level). On a successful check, the spell ends. Using a Higher-Level Spell Slot. You automatically end a spell on the target if the spell’s level is equal to or less than the level of the spell slot you use."},"Dissonant Whispers":{"l":1,"sc":"Enchantment","cl":["Bard"],"ct":"Action","rg":"60 feet","cp":"V","du":"Instantaneous","tx":"One creature of your choice that you can see within range hears a discordant melody in its mind. The target makes a Wisdom saving throw. On a failed save, it takes 3d6 Psychic damage and must immediately use its Reaction, if available, to move as far away from you as it can, using the safest route. On a successful save, the target takes half as much damage only. Using a Higher-Level Spell Slot. The damage increases by 1d6 for each spell slot level above 1."},"Divine Favor":{"l":1,"sc":"Transmutation","cl":["Paladin"],"ct":"Bonus Action","rg":"Self","cp":"V, S","du":"1 minute","tx":"Until the spell ends, your attacks with weapons deal an extra 1d4 Radiant damage on a hit."},"Divine Smite":{"l":1,"sc":"Evocation","cl":["Paladin"],"ct":"Bonus Action, which you take immediately after hitting a target with a Melee weapon or an Unarmed Strike","rg":"Self","cp":"V","du":"Instantaneous","tx":"The target takes an extra 2d8 Radiant damage from the attack. The damage increases by 1d8 if the target is a Fiend or an Undead. Using a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 1."},"Dragon’s Breath":{"l":2,"sc":"Transmutation","cl":["Sorcerer","Wizard"],"ct":"Bonus Action","rg":"Touch","cp":"V, S, M (a hot pepper)","du":"Concentration, up to 1 minute","tx":"You touch one willing creature, and choose Acid, Cold, Fire, Lightning, or Poison. Until the spell ends, the target can take a Magic action to exhale a 15-foot Cone. Each creature in that area makes a Dexterity saving throw, taking 3d6 damage of the chosen type on a failed save or half as much damage on a successful one. Using a Higher-Level Spell Slot. The damage increases by 1d6 for each spell slot level above 2."},"Druidcraft":{"l":0,"sc":"Transmutation","cl":["Druid"],"ct":"Action","rg":"30 feet","cp":"V, S","du":"Instantaneous","tx":"Whispering to the spirits of nature, you create one of the following effects within range. Weather Sensor. You create a Tiny, harmless sensory effect that predicts what the weather will be at your location for the next 24 hours. The effect might manifest as a golden orb for clear skies, a cloud for rain, falling snowflakes for snow, and so on. This effect persists for 1 round. Bloom. You instantly make a flower blossom, a seed pod open, or a leaf bud bloom. Sensory Effect. You create a harmless sensory effect, such as falling leaves, spectral dancing fairies, a gentle breeze, the sound of an animal, or the faint odor of skunk. The effect must fit in a 5-foot Cube. Fire Play. You light or snuff out a candle, a torch, or a campfire."},"Eldritch Blast":{"l":0,"sc":"Evocation","cl":["Warlock"],"ct":"Action","rg":"120 feet","cp":"V, S","du":"Instantaneous","tx":"You hurl a beam of crackling energy. Make a ranged spell attack against one creature or object in range. On a hit, the target takes 1d10 Force damage. Cantrip Upgrade. The spell creates two beams at level 5, three beams at level 11, and four beams at level 17. You can direct the beams at the same target or at different ones. Make a separate attack roll for each beam."},"Elementalism":{"l":0,"sc":"Transmutation","cl":["Druid","Sorcerer","Wizard"],"ct":"Action","rg":"30 feet","cp":"V, S","du":"Instantaneous","tx":"You exert control over the elements, creating one of the following effects within range. Beckon Air. You create a breeze strong enough to ripple cloth, stir dust, rustle leaves, and close open doors and shutters, all in a 5-foot Cube. Doors and shutters being held open by someone or something aren’t affected. Beckon Earth. You create a thin shroud of dust or sand that covers surfaces in a 5-foot-square area, or you cause a single word to appear in your handwriting in a patch of dirt or sand. Beckon Fire. You create a thin cloud of harmless embers and colored, scented smoke in a 5-foot Cube. You choose the color and scent, and the embers can light candles, torches, or lamps in that area. The smoke’s scent lingers for 1 minute. Beckon Water. You create a spray of cool mist that lightly dampens creatures and objects in a 5-foot Cube. Alternatively, you create 1 cup of clean water either in an open container or on a surface, and the water evaporates in 1 minute. Sculpt Element. You cause dirt, sand, fire, smoke, mist, or water that can fit in a 1-foot Cube to assume a crude shape (such as that of a creature) for 1 hour."},"Enhance Ability":{"l":2,"sc":"Transmutation","cl":["Bard","Cleric","Druid","Ranger","Sorcerer","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S, M (fur or a feather)","du":"Concentration, up to 1 hour","tx":"You touch a creature and choose Strength, Dexterity, Intelligence, Wisdom, or Charisma. For the duration, the target has Advantage on ability checks using the chosen ability. Using a Higher-Level Spell Slot. You can target one additional creature for each spell slot level above 2. You can choose a different ability for each target."},"Enlarge/Reduce":{"l":2,"sc":"Transmutation","cl":["Bard","Druid","Sorcerer","Wizard"],"ct":"Action","rg":"30 feet","cp":"V, S, M (a pinch of powdered iron)","du":"Concentration, up to 1 minute","tx":"For the duration, the spell enlarges or reduces a creature or an object you can see within range (see the chosen effect below). A targeted object must be neither worn nor carried. If the target is an unwilling creature, it can make a Constitution saving throw. On a successful save, the spell has no effect. Everything that a targeted creature is wearing and carrying changes size with it. Any item it drops returns to normal size at once. A thrown weapon or piece of ammunition returns to normal size immediately after it hits or misses a target. Enlarge. The target’s size increases by one category—from Medium to Large, for example. The target also has Advantage on Strength checks and Strength saving throws. The target’s attacks with its enlarged weapons or Unarmed Strikes deal an extra 1d4 damage on a hit. Reduce. The target’s size decreases by one category—from Medium to Small, for example. The target also has Disadvantage on Strength checks and Strength saving throws. The target’s attacks with its reduced weapons or Unarmed Strikes deal 1d4 less damage on a hit (this can’t reduce the damage below 1)."},"Ensnaring Strike":{"l":1,"sc":"Conjuration","cl":["Ranger"],"ct":"Bonus Action, which you take immediately after hitting a creature with a weapon","rg":"Self","cp":"V","du":"Concentration, up to 1 minute","tx":"As you hit the target, grasping vines appear on it, and it makes a Strength saving throw. A Large or larger creature has Advantage on this save. On a failed save, the target has the Restrained condition until the spell ends. On a successful save, the vines shrivel away, and the spell ends. While Restrained, the target takes 1d6 Piercing damage at the start of each of its turns. The target or a creature within reach of it can take an action to make a Strength (Athletics) check against your spell save DC. On a success, the spell ends. Using a Higher-Level Spell Slot. The damage increases by 1d6 for each spell slot level above 1."},"Entangle":{"l":1,"sc":"Conjuration","cl":["Druid","Ranger"],"ct":"Action","rg":"90 feet","cp":"V, S","du":"Concentration, up to 1 minute","tx":"Grasping plants sprout from the ground in a 20-foot square within range. For the duration, these plants turn the ground in the area into Difficult Terrain. They disappear when the spell ends. Each creature (other than you) in the area when you cast the spell must succeed on a Strength saving throw or have the Restrained condition until the spell ends. A Restrained creature can take an action to make a Strength (Athletics) check against your spell save DC. On a success, it frees itself from the grasping plants and is no longer Restrained by them."},"Enthrall":{"l":2,"sc":"Enchantment","cl":["Bard","Warlock"],"ct":"Action","rg":"60 feet","cp":"V, S","du":"Concentration, up to 1 minute","tx":"You weave a distracting string of words, causing creatures of your choice that you can see within range to make a Wisdom saving throw. Any creature you or your companions are fighting automatically succeeds on this save. On a failed save, a target has a −10 penalty to Wisdom (Perception) checks and Passive Perception until the spell ends."},"Expeditious Retreat":{"l":1,"sc":"Transmutation","cl":["Sorcerer","Warlock","Wizard"],"ct":"Bonus Action","rg":"Self","cp":"V, S","du":"Concentration, up to 10 minutes","tx":"You take the Dash action, and until the spell ends, you can take that action again as a Bonus Action."},"Faerie Fire":{"l":1,"sc":"Evocation","cl":["Bard","Druid"],"ct":"Action","rg":"60 feet","cp":"V","du":"Concentration, up to 1 minute","tx":"Objects in a 20-foot Cube within range are outlined in blue, green, or violet light (your choice). Each creature in the Cube is also outlined if it fails a Dexterity saving throw. For the duration, objects and affected creatures shed Dim Light in a 10-foot radius and can’t benefit from the Invisible condition. Attack rolls against an affected creature or object have Advantage if the attacker can see it."},"False Life":{"l":1,"sc":"Necromancy","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"Self","cp":"V, S, M (a drop of alcohol)","du":"Instantaneous","tx":"You gain 2d4 + 4 Temporary Hit Points. Using a Higher-Level Spell Slot. You gain 5 additional Temporary Hit Points for each spell slot level above 1."},"Fear":{"l":3,"sc":"Illusion","cl":["Bard","Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"Self","cp":"V, S, M (a white feather)","du":"Concentration, up to 1 minute","tx":"Each creature in a 30-foot Cone must succeed on a Wisdom saving throw or drop whatever it is holding and have the Frightened condition for the duration. A Frightened creature takes the Dash action and moves away from you by the safest route on each of its turns unless there is nowhere to move. If the creature ends its turn in a space where it doesn’t have line of sight to you, the creature makes a Wisdom saving throw. On a successful save, the spell ends on that creature."},"Feather Fall":{"l":1,"sc":"Transmutation","cl":["Bard","Sorcerer","Wizard"],"ct":"Reaction, which you take when you or a creature you can see within 60 feet of you falls","rg":"60 feet","cp":"V, M (a small feather or piece of down)","du":"1 minute","tx":"Choose up to five falling creatures within range. A falling creature’s rate of descent slows to 60 feet per round until the spell ends. If a creature lands before the spell ends, the creature takes no damage from the fall, and the spell ends for that creature."},"Find Familiar":{"l":1,"sc":"Conjuration","cl":["Wizard"],"ct":"1 hour or Ritual","rg":"10 feet","cp":"V, S, M (burning incense worth 10+ GP, which the spell consumes)","du":"Instantaneous","tx":"You gain the service of a familiar, a spirit that takes an animal form you choose: Bat, Cat, Frog, Hawk, Lizard, Octopus, Owl, Rat, Raven, Spider, Weasel, or another Beast that has a Challenge Rating of 0. Appearing in an unoccupied space within range, the familiar has the statistics of the chosen form (see “Monsters”), though it is a Celestial, Fey, or Fiend (your choice) instead of a Beast. Your familiar acts independently of you, but it obeys your commands. Telepathic Connection. While your familiar is within 100 feet of you, you can communicate with it telepathically. Additionally, as a Bonus Action, you can see through the familiar’s eyes and hear what it hears until the start of your next turn, gaining the benefits of any special senses it has. Finally, when you cast a spell with a range of touch, your familiar can deliver the touch. Your familiar must be within 100 feet of you, and it must take a Reaction to deliver the touch when you cast the spell. Combat. The familiar is an ally to you and your allies. It rolls its own Initiative and acts on its own turn. A familiar can’t attack, but it can take other actions as normal. Disappearance of the Familiar. When the familiar drops to 0 Hit Points, it disappears. It reappears after you cast this spell again. As a Magic action, you can temporarily dismiss the familiar to a pocket dimension. Alternatively, you can dismiss it forever. As a Magic action while it is temporarily dismissed, you can cause it to reappear in an unoccupied space within 30 feet of you. Whenever the familiar drops to 0 Hit Points or disappears into the pocket dimension, it leaves behind in its space anything it was wearing or carrying. One Familiar Only. You can’t have more than one familiar at a time. If you cast this spell while you have a familiar, you instead cause it to adopt a new eligible form."},"Find Steed":{"l":2,"sc":"Conjuration","cl":["Paladin"],"ct":"Action","rg":"30 feet","cp":"V, S","du":"Instantaneous","tx":"You summon an otherworldly being that appears as a loyal steed in an unoccupied space of your choice within range. This creature uses the Otherworldly Steed stat block. If you already have a steed from this spell, the steed is replaced by the new one. The steed resembles a Large, rideable animal of your choice, such as a horse, a camel, a dire wolf, or an elk. Whenever you cast the spell, choose the steed’s creature type—Celestial, Fey, or Fiend— which determines certain traits in the stat block. Combat. The steed is an ally to you and your allies. In combat, it shares your Initiative count, and it functions as a controlled mount while you ride it (as defined in the rules on mounted combat). If you have the Incapacitated condition, the steed takes its turn immediately after yours and acts independently, focusing on protecting you. Disappearance of the Steed. The steed disappears if it drops to 0 Hit Points or if you die. When it disappears, it leaves behind anything it was wearing or carrying. If you cast this spell again, you decide whether you summon the steed that disappeared or a different one. Using a Higher-Level Spell Slot. Use the spell slot’s level for the spell’s level in the stat block. face a choice of paths along the way there, you know which path is the most direct."},"Find Traps":{"l":2,"sc":"Divination","cl":["Cleric","Druid","Ranger"],"ct":"Action","rg":"120 feet","cp":"V, S","du":"Instantaneous","tx":"You sense any trap within range that is within line of sight. A trap, for the purpose of this spell, includes any object or mechanism that was created to cause damage or other danger. Thus, the spell would sense the Alarm or Glyph of Warding spell or a mechanical pit trap, but it wouldn’t reveal a natural weakness in the floor, an unstable ceiling, or a hidden sinkhole. This spell reveals that a trap is present but not its location. You do learn the general nature of the danger posed by a trap you sense."},"Fireball":{"l":3,"sc":"Evocation","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"150 feet","cp":"V, S, M (a ball of bat guano and sulfur)","du":"Instantaneous","tx":"A bright streak flashes from you to a point you choose within range and then blossoms with a low roar into a fiery explosion. Each creature in a 20-foot-radius Sphere centered on that point makes a Dexterity saving throw, taking 8d6 Fire damage on a failed save or half as much damage on a successful one. Flammable objects in the area that aren’t being worn or carried start burning. Using a Higher-Level Spell Slot. The damage increases by 1d6 for each spell slot level above 3. Otherworldly Steed Large Celestial, Fey, or Fiend (Your Choice), Neutral AC 10 + 1 per spell level HP 5 + 10 per spell level (the steed has a number of Hit Dice [d10s] equal to the spell’s level) Speed 60 ft., Fly 60 ft. (requires level 4+ spell) MOD SAVE MOD SAVE MOD SAVE Str 18 +4 +4 Dex 12 +1 +1 Con 14 +2 +2 Int 6 −2 −2 Wis 12 +1 +1 Cha 8 −1 −1 Senses Passive Perception 11 Languages Telepathy 1 mile (works only with you) CR None (XP 0; PB equals your Proficiency Bonus) Traits Life Bond. When you regain Hit Points from a level 1+ spell, the steed regains the same number of Hit Points if you’re within 5 feet of it. Actions Otherworldly Slam. Melee Attack Roll: Bonus equals your spell attack modifier, reach 5 ft. Hit: 1d8 plus the spell’s level of Radiant (Celestial), Psychic (Fey), or Necrotic (Fiend) damage. Bonus Actions Fell Glare (Fiend Only; Recharges after a Long Rest). Wisdom Saving Throw: DC equals your spell save DC, one creature within 60 feet the steed can see. Failure: The target has the Frightened condition until the end of your next turn. Fey Step (Fey Only; Recharges after a Long Rest). The steed teleports, along with its rider, to an unoccupied space of your choice up to 60 feet away from itself. Healing Touch (Celestial Only; Recharges after a Long Rest). One creature within 5 feet of the steed regains a number of Hit Points equal to 2d8 plus the spell’s level."},"Fire Bolt":{"l":0,"sc":"Evocation","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"120 feet","cp":"V, S","du":"Instantaneous","tx":"You hurl a mote of fire at a creature or an object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 Fire damage. A flammable object hit by this spell starts burning if it isn’t being worn or carried. Cantrip Upgrade. The damage increases by 1d10 when you reach levels 5 (2d10), 11 (3d10), and 17 (4d10)."},"Flame Blade":{"l":2,"sc":"Evocation","cl":["Druid","Sorcerer"],"ct":"Bonus Action","rg":"Self","cp":"V, S, M (a sumac leaf)","du":"Concentration, up to 10 minutes","tx":"You evoke a fiery blade in your free hand. The blade is similar in size and shape to a scimitar, and it lasts for the duration. If you let go of the blade, it disappears, but you can evoke it again as a Bonus Action. As a Magic action, you can make a melee spell attack with the fiery blade. On a hit, the target takes Fire damage equal to 3d6 plus your spellcasting ability modifier. The flaming blade sheds Bright Light in a 10-foot radius and Dim Light for an additional 10 feet. Using a Higher-Level Spell Slot. The damage increases by 1d6 for each spell slot level above 2."},"Flaming Sphere":{"l":2,"sc":"Conjuration","cl":["Druid","Sorcerer","Wizard"],"ct":"Action","rg":"60 feet","cp":"V, S, M (a ball of wax)","du":"Concentration, up to 1 minute","tx":"You create a 5-foot-diameter sphere of fire in an unoccupied space on the ground within range. It lasts for the duration. Any creature that ends its turn within 5 feet of the sphere makes a Dexterity saving throw, taking 2d6 Fire damage on a failed save or half as much damage on a successful one. As a Bonus Action, you can move the sphere up to 30 feet, rolling it along the ground. If you move the sphere into a creature’s space, that creature makes the save against the sphere, and the sphere stops moving for the turn. When you move the sphere, you can direct it over barriers up to 5 feet tall and jump it across pits up to 10 feet wide. Flammable objects that aren’t being worn or carried start burning if touched by the sphere, and it sheds Bright Light in a 20-foot radius and Dim Light for an additional 20 feet. Using a Higher-Level Spell Slot. The damage increases by 1d6 for each spell slot level above 2."},"Floating Disk":{"l":1,"sc":"Conjuration","cl":["Wizard"],"ct":"Action or Ritual","rg":"30 feet","cp":"V, S, M (a drop of mercury)","du":"1 hour","tx":"This spell creates a circular, horizontal plane of force, 3 feet in diameter and 1 inch thick, that floats 3 feet above the ground in an unoccupied space of your choice that you can see within range. The disk remains for the duration and can hold up to 500 pounds. If more weight is placed on it, the spell ends, and everything on the disk falls to the ground. The disk is immobile while you are within 20 feet of it. If you move more than 20 feet away from it, the disk follows you so that it remains within 20 feet of you. It can move across uneven terrain, up or down stairs, slopes and the like, but it can’t cross an elevation change of 10 feet or more. For example, the disk can’t move across a 10-foot-deep pit, nor could it leave such a pit if it was created at the bottom. If you move more than 100 feet from the disk (typically because it can’t move around an obstacle to follow you), the spell ends."},"Fly":{"l":3,"sc":"Transmutation","cl":["Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S, M (a feather)","du":"Concentration, up to 10 minutes","tx":"You touch a willing creature. For the duration, the target gains a Fly Speed of 60 feet and can hover. When the spell ends, the target falls if it is still aloft unless it can stop the fall. Using a Higher-Level Spell Slot. You can target one additional creature for each spell slot level above 3."},"Fog Cloud":{"l":1,"sc":"Conjuration","cl":["Druid","Ranger","Sorcerer","Wizard"],"ct":"Action","rg":"120 feet","cp":"V, S","du":"Concentration, up to 1 hour","tx":"You create a 20-foot-radius Sphere of fog centered on a point within range. The Sphere is Heavily Obscured. It lasts for the duration or until a strong wind (such as one created by Gust of Wind) disperses it. Using a Higher-Level Spell Slot. The fog’s radius increases by 20 feet for each spell slot level above 1."},"Gaseous Form":{"l":3,"sc":"Transmutation","cl":["Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S, M (a bit of gauze)","du":"Concentration, up to 1 hour","tx":"A willing creature you touch shape-shifts, along with everything it’s wearing and carrying, into a misty cloud for the duration. The spell ends on the target if it drops to 0 Hit Points or if it takes a Magic action to end the spell on itself. While in this form, the target’s only method of movement is a Fly Speed of 10 feet, and it can hover. The target can enter and occupy the space of another creature. The target has Resistance to Bludgeoning, Piercing, and Slashing damage; it has Immunity to the Prone condition; and it has Advantage on Strength, Dexterity, and Constitution saving throws. The target can pass through narrow openings, but it treats liquids as though they were solid surfaces. The target can’t talk or manipulate objects, and any objects it was carrying or holding can’t be dropped, used, or otherwise interacted with. Finally, the target can’t attack or cast spells. Using a Higher-Level Spell Slot. You can target one additional creature for each spell slot level above 3."},"Gentle Repose":{"l":2,"sc":"Necromancy","cl":["Cleric","Paladin","Wizard"],"ct":"Action or Ritual","rg":"Touch","cp":"V, S, M (2 Copper Pieces, which the spell consumes)","du":"10 days","tx":"You touch a corpse or other remains. For the duration, the target is protected from decay and can’t become Undead. The spell also effectively extends the time limit on raising the target from the dead, since days spent under the influence of this spell don’t count against the time limit of spells such as Raise Dead."},"Glyph of Warding":{"l":3,"sc":"Abjuration","cl":["Bard","Cleric","Wizard"],"ct":"1 hour","rg":"Touch","cp":"V, S, M (powdered diamond worth 200+ GP, which the spell consumes)","du":"Until dispelled or triggered","tx":"You inscribe a glyph that later unleashes a magical effect. You inscribe it either on a surface (such as a table or a section of floor) or within an object that can be closed (such as a book or chest) to conceal the glyph. The glyph can cover an area no larger than 10 feet in diameter. If the surface or object is moved more than 10 feet from where you cast this spell, the glyph is broken, and the spell ends without being triggered. The glyph is nearly imperceptible and requires a successful Wisdom (Perception) check against your spell save DC to notice. When you inscribe the glyph, you set its trigger and choose whether it’s an explosive rune or a spell glyph, as explained below. Set the Trigger. You decide what triggers the glyph when you cast the spell. For glyphs inscribed on a surface, common triggers include touching or stepping on the glyph, removing another object covering it, or approaching within a certain distance of it. For glyphs inscribed within an object, common triggers include opening that object or seeing the glyph. Once a glyph is triggered, this spell ends. You can refine the trigger so that only creatures of certain types activate it (for example, the glyph could be set to affect Aberrations). You can also set conditions for creatures that don’t trigger the glyph, such as those who say a certain password. Explosive Rune. When triggered, the glyph erupts with magical energy in a 20-foot-radius Sphere centered on the glyph. Each creature in the area makes a Dexterity saving throw. A creature takes 5d8 Acid, Cold, Fire, Lightning, or Thunder damage (your choice when you create the glyph) on a failed save or half as much damage on a successful one. Spell Glyph. You can store a prepared spell of level 3 or lower in the glyph by casting it as part of creating the glyph. The spell must target a single creature or an area. The spell being stored has no immediate effect when cast in this way. When the glyph is triggered, the stored spell takes effect. If the spell has a target, it targets the creature that triggered the glyph. If the spell affects an area, the area is centered on that creature. If the spell summons Hostile creatures or creates harmful objects or traps, they appear as close as possible to the intruder and attack it. If the spell requires Concentration, it lasts until the end of its full duration. Using a Higher-Level Spell Slot. The damage of an explosive rune increases by 1d8 for each spell slot level above 3. If you create a spell glyph, you can store any spell of up to the same level as the spell slot you use for the Glyph of Warding."},"Goodberry":{"l":1,"sc":"Conjuration","cl":["Druid","Ranger"],"ct":"Action","rg":"Self","cp":"V, S, M (a sprig of mistletoe)","du":"24 hours","tx":"Ten berries appear in your hand and are infused with magic for the duration. A creature can take a Bonus Action to eat one berry. Eating a berry restores 1 Hit Point, and the berry provides enough nourishment to sustain a creature for one day. Uneaten berries disappear when the spell ends."},"Grease":{"l":1,"sc":"Conjuration","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"60 f

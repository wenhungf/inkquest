eet","cp":"V, S, M (a bit of pork rind or butter)","du":"1 minute","tx":"Nonflammable grease covers the ground in a 10- foot square centered on a point within range and turns it into Difficult Terrain for the duration. When the grease appears, each creature standing in its area must succeed on a Dexterity saving throw or have the Prone condition. A creature that enters the area or ends its turn there must also succeed on that save or fall Prone."},"Guidance":{"l":0,"sc":"Divination","cl":["Cleric","Druid"],"ct":"Action","rg":"Touch","cp":"V, S","du":"Concentration, up to 1 minute","tx":"You touch a willing creature and choose a skill. Until the spell ends, the creature adds 1d4 to any ability check using the chosen skill."},"Guiding Bolt":{"l":1,"sc":"Evocation","cl":["Cleric"],"ct":"Action","rg":"120 feet","cp":"V, S","du":"1 round","tx":"You hurl a bolt of light toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 4d6 Radiant damage, and the next attack roll made against it before the end of your next turn has Advantage. Using a Higher-Level Spell Slot. The damage increases by 1d6 for each spell slot level above 1."},"Gust of Wind":{"l":2,"sc":"Evocation","cl":["Druid","Ranger","Sorcerer","Wizard"],"ct":"Action","rg":"Self","cp":"V, S, M (a legume seed)","du":"Concentration, up to 1 minute","tx":"A Line of strong wind 60 feet long and 10 feet wide blasts from you in a direction you choose for the duration. Each creature in the Line must succeed on a Strength saving throw or be pushed 15 feet away from you in a direction following the Line. A creature that ends its turn in the Line must make the same save. Any creature in the Line must spend 2 feet of movement for every 1 foot it moves when moving closer to you. The gust disperses gas or vapor, and it extinguishes candles and similar unprotected flames in the area. It causes protected flames, such as those of lanterns, to dance wildly and has a 50 percent chance to extinguish them. As a Bonus Action on your later turns, you can change the direction in which the Line blasts from you."},"Haste":{"l":3,"sc":"Transmutation","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"30 feet","cp":"V, S, M (a shaving of licorice root)","du":"Concentration, up to 1 minute","tx":"Choose a willing creature that you can see within range. Until the spell ends, the target’s Speed is doubled, it gains a +2 bonus to Armor Class, it has Advantage on Dexterity saving throws, and it gains an additional action on each of its turns. That action can be used to take only the Attack (one attack only), Dash, Disengage, Hide, or Utilize action. When the spell ends, the target is Incapacitated and has a Speed of 0 until the end of its next turn, as a wave of lethargy washes over it."},"Healing Word":{"l":1,"sc":"Abjuration","cl":["Bard","Cleric","Druid"],"ct":"Bonus Action","rg":"60 feet","cp":"V","du":"Instantaneous","tx":"A creature of your choice that you can see within range regains Hit Points equal to 2d4 plus your spellcasting ability modifier. Using a Higher-Level Spell Slot. The healing increases by 2d4 for each spell slot level above 1."},"Heat Metal":{"l":2,"sc":"Transmutation","cl":["Bard","Druid"],"ct":"Action","rg":"60 feet","cp":"V, S, M (a piece of iron and a flame)","du":"Concentration, up to 1 minute","tx":"Choose a manufactured metal object, such as a metal weapon or a suit of Heavy or Medium metal armor, that you can see within range. You cause the object to glow red-hot. Any creature in physical contact with the object takes 2d8 Fire damage when you cast the spell. Until the spell ends, you can take a Bonus Action on each of your later turns to deal this damage again if the object is within range. If a creature is holding or wearing the object and takes the damage from it, the creature must succeed on a Constitution saving throw or drop the object if it can. If it doesn’t drop the object, it has Disadvantage on attack rolls and ability checks until the start of your next turn. Using a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 2."},"Hellish Rebuke":{"l":1,"sc":"Evocation","cl":["Warlock"],"ct":"Reaction, which you take in response to taking damage from a creature that you can see within 60 feet of yourself","rg":"60 feet","cp":"V, S","du":"Instantaneous","tx":"The creature that damaged you is momentarily surrounded by green flames. It makes a Dexterity saving throw, taking 2d10 Fire damage on a failed save or half as much damage on a successful one. Using a Higher-Level Spell Slot. The damage increases by 1d10 for each spell slot level above 1."},"Heroism":{"l":1,"sc":"Enchantment","cl":["Bard","Paladin"],"ct":"Action","rg":"Touch","cp":"V, S","du":"Concentration, up to 1 minute","tx":"A willing creature you touch is imbued with bravery. Until the spell ends, the creature is immune to the Frightened condition and gains Temporary Hit Points equal to your spellcasting ability modifier at the start of each of its turns. Using a Higher-Level Spell Slot. You can target one additional creature for each spell slot level above 1."},"Hex":{"l":1,"sc":"Enchantment","cl":["Warlock"],"ct":"Bonus Action","rg":"90 feet","cp":"V, S, M (the petrified eye of a newt)","du":"Concentration, up to 1 hour","tx":"You place a curse on a creature that you can see within range. Until the spell ends, you deal an extra 1d6 Necrotic damage to the target whenever you hit it with an attack roll. Also, choose one ability when you cast the spell. The target has Disadvantage on ability checks made with the chosen ability. If the target drops to 0 Hit Points before this spell ends, you can take a Bonus Action on a later turn to curse a new creature. Using a Higher-Level Spell Slot. Your Concentration can last longer with a spell slot of level 2 (up to 4 hours), 3–4 (up to 8 hours), or 5+ (24 hours)."},"Hideous Laughter":{"l":1,"sc":"Enchantment","cl":["Bard","Warlock","Wizard"],"ct":"Action","rg":"30 feet","cp":"V, S, M (a tart and a feather)","du":"Concentration, up to 1 minute","tx":"One creature of your choice that you can see within range makes a Wisdom saving throw. On a failed save, it has the Prone and Incapacitated conditions for the duration. During that time, it laughs uncontrollably if it’s capable of laughter, and it can’t end the Prone condition on itself. At the end of each of its turns and each time it takes damage, it makes another Wisdom saving throw. The target has Advantage on the save if the save is triggered by damage. On a successful save, the spell ends. Using a Higher-Level Spell Slot. You can target one additional creature for each spell slot level above 1."},"Hold Person":{"l":2,"sc":"Enchantment","cl":["Bard","Cleric","Druid","Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"60 feet","cp":"V, S, M (a straight piece of iron)","du":"Concentration, up to 1 minute","tx":"Choose a Humanoid that you can see within range. The target must succeed on a Wisdom saving throw or have the Paralyzed condition for the duration. At the end of each of its turns, the target repeats the save, ending the spell on itself on a success. Using a Higher-Level Spell Slot. You can target one additional Humanoid for each spell slot level above 2."},"Hunter’s Mark":{"l":1,"sc":"Divination","cl":["Ranger"],"ct":"Bonus Action","rg":"90 feet","cp":"V","du":"Concentration, up to 1 hour","tx":"You magically mark one creature you can see within range as your quarry. Until the spell ends, you deal an extra 1d6 Force damage to the target whenever you hit it with an attack roll. You also have Advantage on any Wisdom (Perception or Survival) check you make to find it. If the target drops to 0 Hit Points before this spell ends, you can take a Bonus Action to move the mark to a new creature you can see within range. Using a Higher-Level Spell Slot. Your Concentration can last longer with a spell slot of level 3–4 (up to 8 hours) or 5+ (up to 24 hours)."},"Hypnotic Pattern":{"l":3,"sc":"Illusion","cl":["Bard","Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"120 feet","cp":"S, M (a pinch of confetti)","du":"Concentration, up to 1 minute","tx":"You create a twisting pattern of colors in a 30-foot Cube within range. The pattern appears for a moment and vanishes. Each creature in the area who can see the pattern must succeed on a Wisdom saving throw or have the Charmed condition for the duration. While Charmed, the creature has the Incapacitated condition and a Speed of 0. The spell ends for an affected creature if it takes any damage or if someone else uses an action to shake the creature out of its stupor."},"Ice Knife":{"l":1,"sc":"Conjuration","cl":["Druid","Sorcerer","Wizard"],"ct":"Action","rg":"60 feet","cp":"S, M (a drop of water or a piece of ice)","du":"Instantaneous","tx":"You create a shard of ice and fling it at one creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 Piercing damage. Hit or miss, the shard then explodes. The target and each creature within 5 feet of it must succeed on a Dexterity saving throw or take 2d6 Cold damage. Using a Higher-Level Spell Slot. The Cold damage increases by 1d6 for each spell slot level above 1."},"Identify":{"l":1,"sc":"Divination","cl":["Bard","Wizard"],"ct":"1 minute or Ritual","rg":"Touch","cp":"V, S, M (a pearl worth 100+ GP)","du":"Instantaneous","tx":"You touch an object throughout the spell’s casting. If the object is a magic item or some other magical object, you learn its properties and how to use them, whether it requires Attunement, and how many charges it has, if any. You learn whether any ongoing spells are affecting the item and what they are. If the item was created by a spell, you learn that spell’s name. If you instead touch a creature throughout the casting, you learn which ongoing spells, if any, are currently affecting it."},"Illusory Script":{"l":1,"sc":"Illusion","cl":["Bard","Warlock","Wizard"],"ct":"1 minute or Ritual","rg":"Touch","cp":"S, M (ink worth 10+ GP, which the spell consumes)","du":"10 days","tx":"You write on parchment, paper, or another suitable material and imbue it with an illusion that lasts for the duration. To you and any creatures you designate when you cast the spell, the writing appears normal, seems to be written in your hand, and conveys whatever meaning you intended when you wrote the text. To all others, the writing appears as if it were written in an unknown or magical script that is unintelligible. Alternatively, the illusion can alter the meaning, handwriting, and language of the text, though the language must be one you know. If the spell is dispelled, the original script and the illusion both disappear. A creature that has Truesight can read the hidden message."},"Inflict Wounds":{"l":1,"sc":"Necromancy","cl":["Cleric"],"ct":"Action","rg":"Touch","cp":"V, S","du":"Instantaneous","tx":"A creature you touch makes a Constitution saving throw, taking 2d10 Necrotic damage on a failed save or half as much damage on a successful one. Using a Higher-Level Spell Slot. The damage increases by 1d10 for each spell slot level above 1."},"Invisibility":{"l":2,"sc":"Illusion","cl":["Bard","Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S, M (an eyelash in gum arabic)","du":"Concentration, up to 1 hour","tx":"A creature you touch has the Invisible condition until the spell ends. The spell ends early immediately after the target makes an attack roll, deals damage, or casts a spell. Using a Higher-Level Spell Slot. You can target one additional creature for each spell slot level above 2."},"Jump":{"l":1,"sc":"Transmutation","cl":["Druid","Ranger","Sorcerer","Wizard"],"ct":"Bonus Action","rg":"Touch","cp":"V, S, M (a grasshopper’s hind leg)","du":"1 minute","tx":"You touch a willing creature. Once on each of its turns until the spell ends, that creature can jump up to 30 feet by spending 10 feet of movement. Using a Higher-Level Spell Slot. You can target one additional creature for each spell slot level above 1."},"Knock":{"l":2,"sc":"Transmutation","cl":["Bard","Sorcerer","Wizard"],"ct":"Action","rg":"60 feet","cp":"V","du":"Instantaneous","tx":"Choose an object that you can see within range. The object can be a door, a box, a chest, a set of manacles, a padlock, or another object that contains a mundane or magical means that prevents access. A target that is held shut by a mundane lock or that is stuck or barred becomes unlocked, unstuck, or unbarred. If the object has multiple locks, only one of them is unlocked. If the target is held shut by Arcane Lock, that spell is suppressed for 10 minutes, during which time the target can be opened and closed. When you cast the spell, a loud knock, audible up to 300 feet away, emanates from the target."},"Lesser Restoration":{"l":2,"sc":"Abjuration","cl":["Bard","Cleric","Druid","Paladin","Ranger"],"ct":"Bonus Action","rg":"Touch","cp":"V, S","du":"Instantaneous","tx":"You touch a creature and end one condition on it: Blinded, Deafened, Paralyzed, or Poisoned."},"Levitate":{"l":2,"sc":"Transmutation","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"60 feet","cp":"V, S, M (a metal spring)","du":"Concentration, up to 10 minutes","tx":"One creature or loose object of your choice that you can see within range rises vertically up to 20 feet and remains suspended there for the duration. The spell can levitate an object that weighs up to 500 pounds. An unwilling creature that succeeds on a Constitution saving throw is unaffected. The target can move only by pushing or pulling against a fixed object or surface within reach (such as a wall or a ceiling), which allows it to move as if it were climbing. You can change the target’s altitude by up to 20 feet in either direction on your turn. If you are the target, you can move up or down as part of your move. Otherwise, you can take a Magic action to move the target, which must remain within the spell’s range. When the spell ends, the target floats gently to the ground if it is still aloft."},"Light":{"l":0,"sc":"Evocation","cl":["Bard","Cleric","Sorcerer","Wizard"],"ct":"Action","rg":"Touch","cp":"V, M (a firefly or phosphorescent moss)","du":"1 hour","tx":"You touch one Large or smaller object that isn’t being worn or carried by someone else. Until the spell ends, the object sheds Bright Light in a 20-foot radius and Dim Light for an additional 20 feet. The light can be colored as you like. Covering the object with something opaque blocks the light. The spell ends if you cast it again."},"Lightning Bolt":{"l":3,"sc":"Evocation","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"Self","cp":"V, S, M (a bit of fur and a crystal rod)","du":"Instantaneous","tx":"A stroke of lightning forming a 100-foot-long, 5-foot-wide Line blasts out from you in a direction you choose. Each creature in the Line makes a Dexterity saving throw, taking 8d6 Lightning damage on a failed save or half as much damage on a successful one. Using a Higher-Level Spell Slot. The damage increases by 1d6 for each spell slot level above 3."},"Locate Animals or Plants":{"l":2,"sc":"Divination","cl":["Bard","Druid","Ranger"],"ct":"Action or Ritual","rg":"Self","cp":"V, S, M (fur from a bloodhound)","du":"Instantaneous","tx":"Describe or name a specific kind of Beast, Plant creature, or nonmagical plant. You learn the direction and distance to the closest creature or plant of that kind within 5 miles, if any are present."},"Locate Object":{"l":2,"sc":"Divination","cl":["Bard","Cleric","Druid","Paladin","Ranger","Wizard"],"ct":"Action","rg":"Self","cp":"V, S, M (a forked twig)","du":"Concentration, up to 10 minutes","tx":"Describe or name an object that is familiar to you. You sense the direction to the object’s location if that object is within 1,000 feet of you. If the object is in motion, you know the direction of its movement. The spell can locate a specific object known to you if you have seen it up close—within 30 feet—at least once. Alternatively, the spell can locate the nearest object of a particular kind, such as a certain kind of apparel, jewelry, furniture, tool, or weapon. This spell can’t locate an object if any thickness of lead blocks a direct path between you and the object."},"Longstrider":{"l":1,"sc":"Transmutation","cl":["Bard","Druid","Ranger","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S, M (a pinch of dirt)","du":"1 hour","tx":"You touch a creature. The target’s Speed increases by 10 feet until the spell ends. Using a Higher-Level Spell Slot. You can target one additional creature for each spell slot level above 1."},"Mage Armor":{"l":1,"sc":"Abjuration","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S, M (a piece of cured leather)","du":"8 hours","tx":"You touch a willing creature who isn’t wearing armor. Until the spell ends, the target’s base AC becomes 13 plus its Dexterity modifier. The spell ends early if the target dons armor."},"Mage Hand":{"l":0,"sc":"Conjuration","cl":["Bard","Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"30 feet","cp":"V, S","du":"1 minute","tx":"A spectral, floating hand appears at a point you choose within range. The hand lasts for the duration. The hand vanishes if it is ever more than 30 feet away from you or if you cast this spell again. When you cast the spell, you can use the hand to manipulate an object, open an unlocked door or container, stow or retrieve an item from an open container, or pour the contents out of a vial. As a Magic action on your later turns, you can control the hand thus again. As part of that action, you can move the hand up to 30 feet. The hand can’t attack, activate magic items, or carry more than 10 pounds."},"Magic Circle":{"l":3,"sc":"Abjuration","cl":["Cleric","Paladin","Warlock","Wizard"],"ct":"1 minute","rg":"10 feet","cp":"V, S, M (salt and powdered silver worth 100+ GP, which the spell consumes)","du":"1 hour","tx":"You create a 10-foot-radius, 20-foot-tall Cylinder of magical energy centered on a point on the ground that you can see within range. Glowing runes appear wherever the Cylinder intersects with the floor or other surface. Choose one or more of the following types of creatures: Celestials, Elementals, Fey, Fiends, or Undead. The circle affects a creature of the chosen type in the following ways: • The creature can’t willingly enter the Cylinder by nonmagical means. If the creature tries to use teleportation or interplanar travel to do so, it must first succeed on a Charisma saving throw. • The creature has Disadvantage on attack rolls against targets within the Cylinder. • Targets within the Cylinder can’t be possessed by or gain the Charmed or Frightened condition from the creature. Each time you cast this spell, you can cause its magic to operate in the reverse direction, preventing a creature of the specified type from leaving the Cylinder and protecting targets outside it. Using a Higher-Level Spell Slot. The duration increases by 1 hour for each spell slot level above 3."},"Magic Missile":{"l":1,"sc":"Evocation","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"120 feet","cp":"V, S","du":"Instantaneous","tx":"You create three glowing darts of magical force. Each dart strikes a creature of your choice that you can see within range. A dart deals 1d4 + 1 Force damage to its target. The darts all strike simultaneously, and you can direct them to hit one creature or several. Using a Higher-Level Spell Slot. The spell creates one more dart for each spell slot level above 1."},"Magic Mouth":{"l":2,"sc":"Illusion","cl":["Bard","Wizard"],"ct":"1 minute or Ritual","rg":"30 feet","cp":"V, S, M (jade dust worth 10+ GP, which the spell consumes)","du":"Until dispelled","tx":"You implant a message within an object in range—a message that is uttered when a trigger condition is met. Choose an object that you can see and that isn’t being worn or carried by another creature. Then speak the message, which must be 25 words or fewer, though it can be delivered over as long as 10 minutes. Finally, determine the circumstance that will trigger the spell to deliver your message. When that trigger occurs, a magical mouth appears on the object and recites the message in your voice and at the same volume you spoke. If the object you chose has a mouth or something that looks like a mouth (for example, the mouth of a statue), the magical mouth appears there, so the words appear to come from the object’s mouth. When you cast this spell, you can have the spell end after it delivers its message, or it can remain and repeat its message whenever the trigger occurs. The trigger can be as general or as detailed as you like, though it must be based on visual or audible conditions that occur within 30 feet of the object. For example, you could instruct the mouth to speak when any creature moves within 30 feet of the object or when a silver bell rings within 30 feet of it."},"Magic Weapon":{"l":2,"sc":"Transmutation","cl":["Paladin","Ranger","Sorcerer","Wizard"],"ct":"Bonus Action","rg":"Touch","cp":"V, S","du":"1 hour","tx":"You touch a nonmagical weapon. Until the spell ends, that weapon becomes a magic weapon with a +1 bonus to attack rolls and damage rolls. The spell ends early if you cast it again. Using a Higher-Level Spell Slot. The bonus increases to +2 with a level 3–5 spell slot. The bonus increases to +3 with a level 6+ spell slot."},"Major Image":{"l":3,"sc":"Illusion","cl":["Bard","Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"120 feet","cp":"V, S, M (a bit of fleece)","du":"Concentration, up to 10 minutes","tx":"You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 20-foot Cube. The image appears at a spot that you can see within range and lasts for the duration. It seems real, including sounds, smells, and temperature appropriate to the thing depicted, but it can’t deal damage or cause conditions. If you are within range of the illusion, you can take a Magic action to cause the image to move to any other spot within range. As the image changes location, you can alter its appearance so that its movements appear natural for the image. For example, if you create an image of a creature and move it, you can alter the image so that it appears to be walking. Similarly, you can cause the illusion to make different sounds at different times, even making it carry on a conversation, for example. Physical interaction with the image reveals it to be an illusion, for things can pass through it. A creature that takes a Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image, and its other sensory qualities become faint to the creature. Using a Higher-Level Spell Slot. The spell lasts until dispelled, without requiring Concentration, if cast with a level 4+ spell slot."},"Mass Healing Word":{"l":3,"sc":"Abjuration","cl":["Bard","Cleric"],"ct":"Bonus Action","rg":"60 feet","cp":"V","du":"Instantaneous","tx":"Up to six creatures of your choice that you can see within range regain Hit Points equal to 2d4 plus your spellcasting ability modifier. Using a Higher-Level Spell Slot. The healing increases by 1d4 for each spell slot level above 3."},"Meld into Stone":{"l":3,"sc":"Transmutation","cl":["Cleric","Druid","Ranger"],"ct":"Action or Ritual","rg":"Touch","cp":"V, S","du":"8 hours","tx":"You step into a stone object or surface large enough to fully contain your body, merging yourself and your equipment with the stone for the duration. You must touch the stone to do so. Nothing of your presence remains visible or otherwise detectable by nonmagical senses. While merged with the stone, you can’t see what occurs outside it, and any Wisdom (Perception) checks you make to hear sounds outside it are made with Disadvantage. You remain aware of the passage of time and can cast spells on yourself while merged in the stone. You can use 5 feet of movement to leave the stone where you entered it, which ends the spell. You otherwise can’t move. Minor physical damage to the stone doesn’t harm you, but its partial destruction or a change in its shape (to the extent that you no longer fit within it) expels you and deals 6d6 Force damage to you. The stone’s complete destruction (or transmutation into a different substance) expels you and deals 50 Force damage to you. If expelled, you move into an unoccupied space closest to where you first entered and have the Prone condition."},"Mending":{"l":0,"sc":"Transmutation","cl":["Bard","Cleric","Druid","Sorcerer","Wizard"],"ct":"1 minute","rg":"Touch","cp":"V, S, M (two lodestones)","du":"Instantaneous","tx":"This spell repairs a single break or tear in an object you touch, such as a broken chain link, two halves of a broken key, a torn cloak, or a leaking wineskin. As long as the break or tear is no larger than 1 foot in any dimension, you mend it, leaving no trace of the former damage. This spell can physically repair a magic item, but it can’t restore magic to such an object."},"Message":{"l":0,"sc":"Transmutation","cl":["Bard","Druid","Sorcerer","Wizard"],"ct":"Action","rg":"120 feet","cp":"S, M (a copper wire)","du":"1 round","tx":"You point toward a creature within range and whisper a message. The target (and only the target) hears the message and can reply in a whisper that only you can hear. You can cast this spell through solid objects if you are familiar with the target and know it is beyond the barrier. Magical silence; 1 foot of stone, metal, or wood; or a thin sheet of lead blocks the spell."},"Mind Spike":{"l":2,"sc":"Divination","cl":["Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"120 feet","cp":"S","du":"Concentration, up to 1 hour","tx":"You drive a spike of psionic energy into the mind of one creature you can see within range. The target makes a Wisdom saving throw, taking 3d8 Psychic damage on a failed save or half as much damage on a successful one. On a failed save, you also always know the target’s location until the spell ends, but only while the two of you are on the same plane of existence. While you have this knowledge, the target can’t become hidden from you, and if it has the Invisible condition, it gains no benefit from that condition against you. Using a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 2."},"Minor Illusion":{"l":0,"sc":"Illusion","cl":["Bard","Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"30 feet","cp":"S, M (a bit of fleece)","du":"1 minute","tx":"You create a sound or an image of an object within range that lasts for the duration. See the descriptions below for the effects of each. The illusion ends if you cast this spell again. If a creature takes a Study action to examine the sound or image, the creature can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the illusion becomes faint to the creature. Sound. If you create a sound, its volume can range from a whisper to a scream. It can be your voice, someone else’s voice, a lion’s roar, a beating of drums, or any other sound you choose. The sound continues unabated throughout the duration, or you can make discrete sounds at different times before the spell ends. Image. If you create an image of an object—such as a chair, muddy footprints, or a small chest—it must be no larger than a 5-foot Cube. The image can’t create sound, light, smell, or any other sensory effect. Physical interaction with the image reveals it to be an illusion, since things can pass through it."},"Mirror Image":{"l":2,"sc":"Illusion","cl":["Bard","Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"Self","cp":"V, S","du":"1 minute","tx":"Three illusory duplicates of yourself appear in your space. Until the spell ends, the duplicates move with you and mimic your actions, shifting position so it’s impossible to track which image is real. Each time a creature hits you with an attack roll during the spell’s duration, roll a d6 for each of your remaining duplicates. If any of the d6s rolls a 3 or higher, one of the duplicates is hit instead of you, and the duplicate is destroyed. The duplicates otherwise ignore all other damage and effects. The spell ends when all three duplicates are destroyed. A creature is unaffected by this spell if it has the Blinded condition, Blindsight, or Truesight."},"Misty Step":{"l":2,"sc":"Conjuration","cl":["Sorcerer","Warlock","Wizard"],"ct":"Bonus Action","rg":"Self","cp":"V","du":"Instantaneous","tx":"Briefly surrounded by silvery mist, you teleport up to 30 feet to an unoccupied space you can see."},"Moonbeam":{"l":2,"sc":"Evocation","cl":["Druid"],"ct":"Action","rg":"120 feet","cp":"V, S, M (a moonseed leaf)","du":"Concentration, up to 1 minute","tx":"A silvery beam of pale light shines down in a 5-foot-radius, 40-foot-high Cylinder centered on a point within range. Until the spell ends, Dim Light fills the Cylinder, and you can take a Magic action on later turns to move the Cylinder up to 60 feet. When the Cylinder appears, each creature in it makes a Constitution saving throw. On a failed save, a creature takes 2d10 Radiant damage, and if the creature is shape-shifted (as a result of the Polymorph spell, for example), it reverts to its true form and can’t shape-shift until it leaves the Cylinder. On a successful save, a creature takes half as much damage only. A creature also makes this save when the spell’s area moves into its space and when it enters the spell’s area or ends its turn there. A creature makes this save only once per turn. Using a Higher-Level Spell Slot. The damage increases by 1d10 for each spell slot level above 2."},"Nondetection":{"l":3,"sc":"Abjuration","cl":["Bard","Ranger","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S, M (a pinch of diamond dust worth 25+ GP, which the spell consumes)","du":"8 hours","tx":"For the duration, you hide a target that you touch from Divination spells. The target can be a willing creature, or it can be a place or an object no larger than 10 feet in any dimension. The target can’t be targeted by any Divination spell or perceived through magical scrying sensors."},"Pass without Trace":{"l":2,"sc":"Abjuration","cl":["Druid","Ranger"],"ct":"Action","rg":"Self","cp":"V, S, M (ashes from burned mistletoe)","du":"Concentration, up to 1 hour","tx":"You radiate a concealing aura in a 30-foot Emanation for the duration. While in the aura, you and each creature you choose have a +10 bonus to Dexterity (Stealth) checks and leave no tracks."},"Phantasmal Force":{"l":2,"sc":"Illusion","cl":["Bard","Sorcerer","Wizard"],"ct":"Action","rg":"60 feet","cp":"V, S, M (a bit of fleece)","du":"Concentration, up to 1 minute","tx":"You attempt to craft an illusion in the mind of a creature you can see within range. The target makes an Intelligence saving throw. On a failed save, you create a phantasmal object, creature, or other phenomenon that is no larger than a 10-foot Cube and that is perceivable only to the target for the duration. The phantasm includes sound, temperature, and other stimuli. The target can take a Study action to examine the phantasm with an Intelligence (Investigation) check against your spell save DC. If the check succeeds, the target realizes that the phantasm is an illusion, and the spell ends. While affected by the spell, the target treats the phantasm as if it were real and rationalizes any illogical outcomes from interacting with it. For example, if the target steps through a phantasmal bridge and survives the fall, it believes the bridge exists and something else caused it to fall. An affected target can even take damage from the illusion if the phantasm represents a dangerous creature or hazard. On each of your turns, such a phantasm can deal 2d8 Psychic damage to the target if it is in the phantasm’s area or within 5 feet of the phantasm. The target perceives the damage as a type appropriate to the illusion."},"Phantom Steed":{"l":3,"sc":"Illusion","cl":["Wizard"],"ct":"1 minute or Ritual","rg":"30 feet","cp":"V, S","du":"1 hour","tx":"A Large, quasi-real, horselike creature appears on the ground in an unoccupied space of your choice within range. You decide the creature’s appearance, and it is equipped with a saddle, bit, and bridle. Any of the equipment created by the spell vanishes in a puff of smoke if it is carried more than 10 feet away from the steed. For the duration, you or a creature you choose can ride the steed. The steed uses the Riding Horse stat block (see “Monsters”), except it has a Speed of 100 feet and can travel 13 miles in an hour. When the spell ends, the steed gradually fades, giving the rider 1 minute to dismount. The spell ends early if the steed takes any damage."},"Plant Growth":{"l":3,"sc":"Transmutation","cl":["Bard","Druid","Ranger"],"ct":"Action (Overgrowth) or 8 hours (Enrichment)","rg":"150 feet","cp":"V, S","du":"Instantaneous","tx":"This spell channels vitality into plants. The casting time you use determines whether the spell has the Overgrowth or the Enrichment effect below. Overgrowth. Choose a point within range. All normal plants in a 100-foot-radius Sphere centered on that point become thick and overgrown. A creature moving through that area must spend 4 feet of movement for every 1 foot it moves. You can exclude one or more areas of any size within the spell’s area from being affected. Enrichment. All plants in a half-mile radius centered on a point within range become enriched for 365 days. The plants yield twice the normal amount of food when harvested. They can benefit from only one Plant Growth per year."},"Poison Spray":{"l":0,"sc":"Necromancy","cl":["Druid","Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"30 feet","cp":"V, S","du":"Instantaneous","tx":"You spray toxic mist at a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d12 Poison damage. Cantrip Upgrade. The damage increases by 1d12 when you reach levels 5 (2d12), 11 (3d12), and 17 (4d12)."},"Prayer of Healing":{"l":2,"sc":"Abjuration","cl":["Cleric","Paladin"],"ct":"10 minutes","rg":"30 feet","cp":"V","du":"Instantaneous","tx":"Up to five creatures of your choice who remain within range for the spell’s entire casting gain the benefits of a Short Rest and also regain 2d8 Hit Points. A creature can’t be affected by this spell again until that creature finishes a Long Rest. Using a Higher-Level Spell Slot. The healing increases by 1d8 for each spell slot level above 2."},"Prestidigitation":{"l":0,"sc":"Transmutation","cl":["Bard","Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"10 feet","cp":"V, S","du":"Up to 1 hour","tx":"You create a magical effect within range. Choose the effect from the options below. If you cast this spell multiple times, you can have up to three of its non-instantaneous effects active at a time. Sensory Effect. You create an instantaneous, harmless sensory effect, such as a shower of sparks, a puff of wind, faint musical notes, or an odd odor. Fire Play. You instantaneously light or snuff out a candle, a torch, or a small campfire. Clean or Soil. You instantaneously clean or soil an object no larger than 1 cubic foot. Minor Sensation. You chill, warm, or flavor up to 1 cubic foot of nonliving material for 1 hour. Magic Mark. You make a color, a small mark, or a symbol appear on an object or a surface for 1 hour. Minor Creation. You create a nonmagical trinket or an illusory image that can fit in your hand. It lasts until the end of your next turn. A trinket can deal no damage and has no monetary worth."},"Produce Flame":{"l":0,"sc":"Conjuration","cl":["Druid"],"ct":"Bonus Action","rg":"Self","cp":"V, S","du":"10 minutes","tx":"A flickering flame appears in your hand and remains there for the duration. While there, the flame emits no heat and ignites nothing, and it sheds Bright Light in a 20-foot radius and Dim Light for an additional 20 feet. The spell ends if you cast it again. Until the spell ends, you can take a Magic action to hurl fire at a creature or an object within 60 feet of you. Make a ranged spell attack. On a hit, the target takes 1d8 Fire damage. Cantrip Upgrade. The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8)."},"Protection from Energy":{"l":3,"sc":"Abjuration","cl":["Cleric","Druid","Ranger","Sorcerer","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S","du":"Concentration, up to 1 hour","tx":"For the duration, the willing creature you touch has Resistance to one damage type of your choice: Acid, Cold, Fire, Lightning, or Thunder."},"Protection from Evil and Good":{"l":1,"sc":"Abjuration","cl":["Cleric","Druid","Paladin","Warlock","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S, M (a flask of Holy Water worth 25+ GP, which the spell consumes)","du":"Concentration up to 10 minutes","tx":"Until the spell ends, one willing creature you touch is protected against creatures that are Aberrations, Celestials, Elementals, Fey, Fiends, or Undead. The protection grants several benefits. Creatures of those types have Disadvantage on attack rolls against the target. The target also can’t be possessed by or gain the Charmed or Frightened conditions from them. If the target is already possessed, Charmed, or Frightened by such a creature, the target has Advantage on any new saving throw against the relevant effect."},"Protection from Poison":{"l":2,"sc":"Abjuration","cl":["Cleric","Druid","Paladin","Ranger"],"ct":"Action","rg":"Touch","cp":"V, S","du":"1 hour","tx":"You touch a creature and end the Poisoned condition on it. For the duration, the target has Advantage on saving throws to avoid or end the Poisoned condition, and it has Resistance to Poison damage."},"Purify Food and Drink":{"l":1,"sc":"Transmutation","cl":["Cleric","Druid","Paladin"],"ct":"Action or Ritual","rg":"10 feet","cp":"V, S","du":"Instantaneous","tx":"You remove poison and rot from nonmagical food and drink in a 5-foot-radius Sphere centered on a point within range."},"Ray of Enfeeblement":{"l":2,"sc":"Necromancy","cl":["Warlock","Wizard"],"ct":"Action","rg":"60 feet","cp":"V, S","du":"Concentration, up to 1 minute","tx":"A beam of enervating energy shoots from you toward a creature within range. The target must make a Constitution saving throw. On a successful save, the target has Disadvantage on the next attack roll it makes until the start of your next turn. On a failed save, the target has Disadvantage on Strength-based D20 Tests for the duration. During that time, it also subtracts 1d8 from all its damage rolls. The target repeats the save at the end of each of its turns, ending the spell on a success."},"Ray of Frost":{"l":0,"sc":"Evocation","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"60 feet","cp":"V, S","du":"Instantaneous","tx":"A frigid beam of blue-white light streaks toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 1d8 Cold damage, and its Speed is reduced by 10 feet until the start of your next turn. Cantrip Upgrade. The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8)."},"Ray of Sickness":{"l":1,"sc":"Necromancy","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"60 feet","cp":"V, S","du":"Instantaneous","tx":"You shoot a greenish ray at a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 2d8 Poison damage and has the Poisoned condition until the end of your next turn. Using a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 1."},"Remove Curse":{"l":3,"sc":"Abjuration","cl":["Cleric","Paladin","Warlock","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S","du":"Instantaneous","tx":"At your touch, all curses affecting one creature or object end. If the object is a cursed magic item, its curse remains, but the spell breaks its owner’s Attunement to the object so it can be removed or discarded."},"Resistance":{"l":0,"sc":"Abjuration","cl":["Cleric","Druid"],"ct":"Action","rg":"Touch","cp":"V, S","du":"Concentration, up to 1 minute","tx":"You touch a willing creature and choose a damage type: Acid, Bludgeoning, Cold, Fire, Lightning, Necrotic, Piercing, Poison, Radiant, Slashing, or Thunder. When the creature takes damage of the chosen type before the spell ends, the creature reduces the total damage taken by 1d4. A creature can benefit from this spell only once per turn."},"Revivify":{"l":3,"sc":"Necromancy","cl":["Cleric","Druid","Paladin","Ranger"],"ct":"Action","rg":"Touch","cp":"V, S, M (a diamond worth 300+ GP, which the spell consumes)","du":"Instantaneous","tx":"You touch a creature that has died within the last minute. That creature revives with 1 Hit Point. This spell can’t revive a creature that has died of old age, nor does it restore any missing body parts."},"Rope Trick":{"l":2,"sc":"Transmutation","cl":["Wizard"],"ct":"Action","rg":"Touch","cp":"V, S, M (a segment of rope)","du":"1 hour","tx":"You touch a rope. One end of it hovers upward until the rope hangs perpendicular to the ground or the rope reaches a ceiling. At the rope’s upper end, an Invisible 3-foot-by-5-foot portal opens to an extradimensional space that lasts until the spell ends. That space can be reached by climbing the rope, which can be pulled into or dropped out of it. The space can hold up to eight Medium or smaller creatures. Attacks, spells, and other effects can’t pass into or out of the space, but creatures inside it can see through the portal. Anything inside the space drops out when the spell ends."},"Sacred Flame":{"l":0,"sc":"Evocation","cl":["Cleric"],"ct":"Action","rg":"60 feet","cp":"V, S","du":"Instantaneous","tx":"Flame-like radiance descends on a creature that you can see within range. The target must succeed on a Dexterity saving throw or take 1d8 Radiant damage. The target gains no benefit from Half Cover or Three-Quarters Cover for this save. Cantrip Upgrade. The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8)."},"Sanctuary":{"l":1,"sc":"Abjuration","cl":["Cleric"],"ct":"Bonus Action","rg":"30 feet","cp":"V, S, M (a shard of glass from a mirror)","du":"1 minute","tx":"You ward a creature within range. Until the spell ends, any creature who targets the warded creature with an attack roll or a damaging spell must succeed on a Wisdom saving throw or either choose a new target or lose the attack or spell. This spell doesn’t protect the warded creature from areas of effect. The spell ends if the warded creature makes an attack roll, casts a spell, or deals damage."},"Scorching Ray":{"l":2,"sc":"Evocation","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"120 feet","cp":"V, S","du":"Instantaneous","tx":"You hurl three fiery rays. You can hurl them at one target within range or at several. Make a ranged spell attack for each ray. On a hit, the target takes 2d6 Fire damage. Using a Higher-Level Spell Slot. You create one additional ray for each spell slot level above 2."},"Searing Smite":{"l":1,"sc":"Evocation","cl":["Paladin"],"ct":"Bonus Action, which you take immediately after hitting a target with a Melee weapon or an Unarmed Strike","rg":"Self","cp":"V","du":"1 minute","tx":"As you hit the target, it takes an extra 1d6 Fire damage from the attack. At the start of each of its turns until the spell ends, the target takes 1d6 Fire damage and then makes a Constitution saving throw. On a failed save, the spell continues. On a successful save, the spell ends. Using a Higher-Level Spell Slot. All the damage increases by 1d6 for each spell slot level above 1."},"See Invisibility":{"l":2,"sc":"Divination","cl":["Bard","Sorcerer","Wizard"],"ct":"Action","rg":"Self","cp":"V, S, M (a pinch of talc)","du":"1 hour","tx":"For the duration, you see creatures and objects that have the Invisible condition as if they were visible, and you can see into the Ethereal Plane. Creatures and objects there appear ghostly."},"Sending":{"l":3,"sc":"Divination","cl":["Bard","Cleric","Wizard"],"ct":"Action","rg":"Unlimited","cp":"V, S, M (a copper wire)","du":"Instantaneous","tx":"You send a short message of 25 words or fewer to a creature you have met or a creature described to you by someone who has met it. The target hears the message in its mind, recognizes you as the sender if it knows you, and can answer in a like manner immediately. The spell enables targets to understand the meaning of your message. You can send the message across any distance and even to other planes of existence, but if the target is on a different plane than you, there is a 5 percent chance that the message doesn’t arrive. You know if the delivery fails. Upon receiving your message, a creature can block your ability to reach it again with this spell for 8 hours. If you try to send another message during that time, you learn that you are blocked, and the spell fails."},"Shatter":{"l":2,"sc":"Evocation","cl":["Bard","Sorcerer","Wizard"],"ct":"Action","rg":"60 feet","cp":"V, S, M (a chip of mica)","du":"Instantaneous","tx":"A loud noise erupts from a point of your choice within range. Each creature in a 10-foot-radius Sphere centered there makes a Constitution saving throw, taking 3d8 Thunder damage on a failed save or half as much damage on a successful one. A Construct has Disadvantage on the save. A nonmagical object that isn’t being worn or carried also takes the damage if it’s in the spell’s area. Using a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 2."},"Shield":{"l":1,"sc":"Abjuration","cl":["Sorcerer","Wizard"],"ct":"Reaction, which you take when you are hit by an attack roll or targeted by the Magic Missile spell","rg":"Self","cp":"V, S","du":"1 round","tx":"An imperceptible barrier of magical force protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from Magic Missile."},"Shield of Faith":{"l":1,"sc":"Abjuration","cl":["Cleric","Paladin"],"ct":"Bonus Action","rg":"60 feet","cp":"V, S, M (a prayer scroll)","du":"Concentration, up to 10 minutes","tx":"A shimmering field surrounds a creature of your choice within range, granting it a +2 bonus to AC for the duration."},"Shillelagh":{"l":0,"sc":"Transmutation","cl":["Druid"],"ct":"Bonus Action","rg":"Self","cp":"V, S, M (mistletoe)","du":"1 minute","tx":"A Club or Quarterstaff you are holding is imbued with nature’s power. For the duration, you can use your spellcasting ability instead of Strength for the attack and damage rolls of melee attacks using that weapon, and the weapon’s damage die becomes a d8. If the attack deals damage, it can be Force damage or the weapon’s normal damage type (your choice). The spell ends early if you cast it again or if you let go of the weapon. Cantrip Upgrade. The damage die changes when you reach levels 5 (d10), 11 (d12), and 17 (2d6)."},"Shining Smite":{"l":2,"sc":"Transmutation","cl":["Paladin"],"ct":"Bonus Action, which you take immediately after hitting a creature with a Melee weapon or an Unarmed Strike","rg":"Self","cp":"V","du":"Concentration, up to 1 minute","tx":"The target hit by the strike takes an extra 2d6 Radiant damage from the attack. Until the spell ends, the target sheds Bright Light in a 5-foot radius, attack rolls against it have Advantage, and it can’t benefit from the Invisible condition. Using a Higher-Level Spell Slot. The damage increases by 1d6 for each spell slot level above 2."},"Shocking Grasp":{"l":0,"sc":"Evocation","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S","du":"Instantaneous","tx":"Lightning springs from you to a creature that you try to touch. Make a melee spell attack against the target. On a hit, the target takes 1d8 Lightning damage, and it can’t make Opportunity Attacks until the start of its next turn. Cantrip Upgrade. The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8)."},"Silence":{"l":2,"sc":"Illusion","cl":["Bard","Cleric","Ranger"],"ct":"Action or Ritual","rg":"120 feet","cp":"V, S","du":"Concentration, up to 10 minutes","tx":"For the duration, no sound can be created within or pass through a 20-foot-radius Sphere centered on a point you choose within range. Any creature or object entirely inside the Sphere has Immunity to Thunder damage, and creatures have the Deafened condition while entirely inside it. Casting a spell that includes a Verbal component is impossible there."},"Silent Image":{"l":1,"sc":"Illusion","cl":["Bard","Sorcerer","Wizard"],"ct":"Action","rg":"60 feet","cp":"V, S, M (a bit of fleece)","du":"Concentration, up to 10 minutes","tx":"You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 15-foot Cube. The image appears at a spot within range and lasts for the duration. The image is purely visual; it isn’t accompanied by sound, smell, or other sensory effects. As a Magic action, you can cause the image to move to any spot within range. As the image changes location, you can alter its appearance so that its movements appear natural for the image. For example, if you create an image of a creature and move it, you can alter the image so that it appears to be walking. Physical interaction with the image reveals it to be an illusion, since things can pass through it. A creature that takes a Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image."},"Sleep":{"l":1,"sc":"Enchantment","cl":["Bard","Sorcerer","Wizard"],"ct":"Action","rg":"60 feet","cp":"V, S, M (a pinch of sand or rose petals)","du":"Concentration, up to 1 minute","tx":"Each creature of your choice in a 5-foot-radius Sphere centered on a point within range must succeed on a Wisdom saving throw or have the Incapacitated condition until the end of its next turn, at which point it must repeat the save. If the target fails the second save, the target has the Unconscious condition for the duration. The spell ends on a target if it takes damage or someone within 5 feet of it takes an action to shake it out of the spell’s effect. Creatures that don’t sleep, such as elves, or that have Immunity to the Exhaustion condition automatically succeed on saves against this spell."},"Sleet Storm":{"l":3,"sc":"Conjuration","cl":["Druid","Sorcerer","Wizard"],"ct":"Action","rg":"150 feet","cp":"V, S, M (a miniature umbrella)","du":"Concentration, up to 1 minute","tx":"Until the spell ends, sleet falls in a 40-foot-tall, 20-foot-radius Cylinder centered on a point you choose within range. The area is Heavily Obscured, and exposed flames in the area are doused. Ground in the Cylinder is Difficult Terrain. When a creature enters the Cylinder for the first time on a turn or starts its turn there, it must succeed on a Dexterity saving throw or have the Prone condition and lose Concentration."},"Slow":{"l":3,"sc":"Transmutation","cl":["Bard","Sorcerer","Wizard"],"ct":"Action","rg":"120 feet","cp":"V, S, M (a drop of molasses)","du":"Concentration, up to 1 minute","tx":"You alter time around up to six creatures of your choice in a 40-foot Cube within range. Each target must succeed on a Wisdom saving throw or be affected by this spell for the duration. An affected target’s Speed is halved, it takes a −2 penalty to AC and Dexterity saving throws, and it can’t take Reactions. On its turns, it can take either an action or a Bonus Action, not both, and it can make only one attack if it takes the Attack action. If it casts a spell with a Somatic component, there is a 25 percent chance the spell fails as a result of the target making the spell’s gestures too slowly. An affected target repeats the save at the end of each of its turns, ending the spell on itself on a success."},"Sorcerous Burst":{"l":0,"sc":"Evocation","cl":["Sorcerer"],"ct":"Action","rg":"120 feet","cp":"V, S","du":"Instantaneous","tx":"You cast sorcerous energy at one creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d8 damage of a type you choose: Acid, Cold, Fire, Lightning, Poison, Psychic, or Thunder. If you roll an 8 on a d8 for this spell, you can roll another d8, and add it to the damage. When you cast this spell, the maximum number of these d8s you can add to the spell’s damage equals your spellcasting ability modifier. Cantrip Upgrade. The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8)."},"Spare the Dying":{"l":0,"sc":"Necromancy","cl":["Cleric","Druid"],"ct":"Action","rg":"15 feet","cp":"V, S","du":"Instantaneous","tx":"Choose a creature within range that has 0 Hit Points and isn’t dead. The creature becomes Stable. Cantrip Upgrade. The range doubles when you reach levels 5 (30 feet), 11 (60 feet), and 17 (120 feet)."},"Speak with Animals":{"l":1,"sc":"Divination","cl":["Bard","Druid","Ranger","Warlock"],"ct":"Action or Ritual","rg":"Self","cp":"V, S","du":"10 minutes","tx":"For the duration, you can comprehend and verbally communicate with Beasts, and you can use any of the Influence action’s skill options with them. Most Beasts have little to say about topics that don’t pertain to survival or companionship, but at minimum, a Beast can give you information about nearby locations and monsters, including whatever it has perceived within the past day."},"Speak with Dead":{"l":3,"sc":"Necromancy","cl":["Bard","Cleric","Wizard"],"ct":"Action","rg":"10 feet","cp":"V, S, M (burning incense)","du":"10 minutes","tx":"You grant the semblance of life to a corpse of your choice within range, allowing it to answer questions you pose. The corpse must have a mouth, and this spell fails if the deceased creature was Undead when it died. The spell also fails if the corpse was the target of this spell within the past 10 days. Until the spell ends, you can ask the corpse up to five questions. The corpse knows only what it knew in life, including the languages it knew. Answers are usually brief, cryptic, or repetitive, and the corpse is under no compulsion to offer a truthful answer if you are antagonistic toward it or it recognizes you as an enemy. This spell doesn’t return the creature’s soul to its body, only its animating spirit. Thus, the corpse can’t learn new information, doesn’t comprehend anything that has happened since it died, and can’t speculate about future events."},"Speak with Plants":{"l":3,"sc":"Transmutation","cl":["Bard","Druid","Ranger"],"ct":"Action","rg":"Self","cp":"V, S","du":"10 minutes","tx":"You imbue plants in an immobile 30-foot Emanation with limited sentience and animation, giving them the ability to communicate with you and follow your simple commands. You can question plants about events in the spell’s area within the past day, gaining information about creatures that have passed, weather, and other circumstances. You can also turn Difficult Terrain caused by plant growth (such as thickets and undergrowth) into ordinary terrain that lasts for the duration. Or you can turn ordinary terrain where plants are present into Difficult Terrain that lasts for the duration. The spell doesn’t enable plants to uproot themselves and move about, but they can move their branches, tendrils, and stalks for you. If a Plant creature is in the area, you can communicate with it as if you shared a common language."},"Spider Climb":{"l":2,"sc":"Transmutation","cl":["Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"Touch","cp":"V, S, M (a drop of bitumen and a spider)","du":"Concentration, up to 1 hour","tx":"Until the spell ends, one willing creature you touch gains the ability to move up, down, and across vertical surfaces and along ceilings, while leaving its hands free. The target also gains a Climb Speed equal to its Speed. Using a Higher-Level Spell Slot. You can target one additional creature for each spell slot level above 2."},"Spike Growth":{"l":2,"sc":"Transmutation","cl":["Druid","Ranger"],"ct":"Action","rg":"150 feet","cp":"V, S, M (seven thorns)","du":"Concentration, up to 10 minutes","tx":"The ground in a 20-foot-radius Sphere centered on a point within range sprouts hard spikes and thorns. The area becomes Difficult Terrain for the duration. When a creature moves into or within the area, it takes 2d4 Piercing damage for every 5 feet it travels. The transformation of the ground is camouflaged to look natural. Any creature that can’t see the area when the spell is cast must take a Search action and succeed on a Wisdom (Perception or Survival) check against your spell save DC to recognize the terrain as hazardous before entering it."},"Spirit Guardians":{"l":3,"sc":"Conjuration","cl":["Cleric"],"ct":"Action","rg":"Self","cp":"V, S, M (a prayer scroll)","du":"Concentration, up to 10 minutes","tx":"Protective spirits flit around you in a 15-foot Emanation for the duration. If you are good or neutral, their spectral form appears angelic or fey (your choice). If you are evil, they appear fiendish. When you cast this spell, you can designate creatures to be unaffected by it. Any other creature’s Speed is halved in the Emanation, and whenever the Emanation enters a creature’s space and whenever a creature enters the Emanation or ends its turn there, the creature must make a Wisdom saving throw. On a failed save, the creature takes 3d8 Radiant damage (if you are good or neutral) or 3d8 Necrotic damage (if you are evil). On a successful save, the creature takes half as much damage. A creature makes this save only once per turn. Using a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 3."},"Spiritual Weapon":{"l":2,"sc":"Evocation","cl":["Cleric"],"ct":"Bonus Action","rg":"60 feet","cp":"V, S","du":"Concentration, up to 1 minute","tx":"You create a floating, spectral force that resembles a weapon of your choice and lasts for the duration. The force appears within range in a space of your choice, and you can immediately make one melee spell attack against one creature within 5 feet of the force. On a hit, the target takes Force damage equal to 1d8 plus your spellcasting ability modifier. As a Bonus Action on your later turns, you can move the force up to 20 feet and repeat the attack against a creature within 5 feet of it. Using a Higher-Level Spell Slot. The damage increases by 1d8 for every slot level above 2."},"Starry Wisp":{"l":0,"sc":"Evocation","cl":["Bard","Druid"],"ct":"Action","rg":"60 feet","cp":"V, S","du":"Instantaneous","tx":"You launch a mote of light at one creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d8 Radiant damage, and until the end of your next turn, it emits Dim Light in a 10-foot radius and can’t benefit from the Invisible condition. Cantrip Upgrade. The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8)."},"Stinking Cloud":{"l":3,"sc":"Conjuration","cl":["Bard","Sorcerer","Wizard"],"ct":"Action","rg":"90 feet","cp":"V, S, M (a rotten egg)","du":"Concentration, up to 1 minute","tx":"You create a 20-foot-radius Sphere of yellow, nauseating gas centered on a point within range. The cloud is Heavily Obscured. The cloud lingers in the air for the duration or until a strong wind (such as the one created by Gust of Wind) disperses it. Each creature that starts its turn in the Sphere must succeed on a Constitution saving throw or have the Poisoned condition until the end of the current turn. While Poisoned in this way, the creature can’t take an action or a Bonus Action."},"Suggestion":{"l":2,"sc":"Enchantment","cl":["Bard","Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"30 feet","cp":"V, M (a drop of honey)","du":"Concentration, up to 8 hours","tx":"You suggest a course of activity—described in no more than 25 words—to one creature you can see within range that can hear and understand you. The suggestion must sound achievable and not involve anything that would obviously deal damage to the target or its allies. For example, you could say, “Fetch the key to the cult’s treasure vault, and give the key to me.” Or you could say, “Stop fighting, leave this library peacefully, and don’t return.” The target must succeed on a Wisdom saving throw or have the Charmed condition for the duration or until you or your allies deal damage to the target. The Charmed target pursues the suggestion to the best of its ability. The suggested activity can continue for the entire duration, but if the suggested activity can be completed in a shorter time, the spell ends for the target upon completing it."},"Thaumaturgy":{"l":0,"sc":"Transmutation","cl":["Cleric"],"ct":"Action","rg":"30 feet","cp":"V","du":"Up to 1 minute","tx":"You manifest a minor wonder within range. You create one of the effects below within range. If you cast this spell multiple times, you can have up to three of its 1-minute effects active at a time. Altered Eyes. You alter the appearance of your eyes for 1 minute. Booming Voice. Your voice booms up to three times as loud as normal for 1 minute. For the duration, you have Advantage on Charisma (Intimidation) checks. Fire Play. You cause flames to flicker, brighten, dim, or change color for 1 minute. Invisible Hand. You instantaneously cause an unlocked door or window to fly open or slam shut. Phantom Sound. You create an instantaneous sound that originates from a point of your choice within range, such as a rumble of thunder, the cry of a raven, or ominous whispers. Tremors. You cause harmless tremors in the ground for 1 minute."},"Thunderwave":{"l":1,"sc":"Evocation","cl":["Bard","Druid","Sorcerer","Wizard"],"ct":"Action","rg":"Self","cp":"V, S","du":"Instantaneous","tx":"You unleash a wave of thunderous energy. Each creature in a 15-foot Cube originating from you makes a Constitution saving throw. On a failed save, a creature takes 2d8 Thunder damage and is pushed 10 feet away from you. On a successful save, a creature takes half as much damage only. In addition, unsecured objects that are entirely within the Cube are pushed 10 feet away from you, and a thunderous boom is audible within 300 feet. Using a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 1."},"Tiny Hut":{"l":3,"sc":"Evocation","cl":["Bard","Wizard"],"ct":"1 minute or Ritual","rg":"Self","cp":"V, S, M (a crystal bead)","du":"8 hours","tx":"A 10-foot Emanation springs into existence around you and remains stationary for the duration. The spell fails when you cast it if the Emanation isn’t big enough to fully encapsulate all creatures in its area. Creatures and objects within the Emanation when you cast the spell can move through it freely. All other creatures and objects are barred from passing through it. Spells of level 3 or lower can’t be cast through it, and the effects of such spells can’t extend into it. The atmosphere inside the Emanation is comfortable and dry, regardless of the weather outside. Until the spell ends, you can command the interior to have Dim Light or Darkness (no action required). The Emanation is opaque from the outside and of any color you choose, but it’s transparent from the inside. The spell ends early if you leave the Emanation or if you cast it again."},"Tongues":{"l":3,"sc":"Divination","cl":["Bard","Cleric","Sorcerer","Warlock","Wizard"],"ct":"Action","rg":"Touch","cp":"V, M (a miniature ziggurat)","du":"1 hour","tx":"This spell grants the creature you touch the ability to understand any spoken or signed language that it hears or sees. Moreover, when the target communicates by speaking or signing, any creature that knows at least one language can understand it if that creature can hear the speech or see ed hand can siphon life force from others to heal your wounds. Make a melee spell attack against one creature within reach. On a hit, the target takes 3d6 Necrotic damage, and you regain Hit Points equal to half the amount of Necrotic damage dealt. Until the spell ends, you can make the attack again on each of your turns as a Magic action, targeting the same creature or a different one. Using a Higher-Level Spell Slot. The damage increases by 1d6 for each spell slot level above 3."},"Vicious Mockery":{"l":0,"sc":"Enchantment","cl":["Bard"],"ct":"Action","rg":"60 feet","cp":"V","du":"Instantaneous","tx":"You unleash a string of insults laced with subtle enchantments at one creature you can see or hear within range. The target must succeed on a Wisdom saving throw or take 1d6 Psychic damage and have Disadvantage on the next attack roll it makes before the end of its next turn. Cantrip Upgrade. The damage increases by 1d6 when you reach levels 5 (2d6), 11 (3d6), and 17 (4d6)."},"Warding Bond":{"l":2,"sc":"Abjuration","cl":["Cleric","Paladin"],"ct":"Action","rg":"Touch","cp":"V, S, M (a pair of platinum rings worth 50+ GP each, which you and the target must wear for the duration)","du":"1 hour","tx":"You touch another creature that is willing and create a mystic connection between you and the target until the spell ends. While the target is within 60 feet of you, it gains a +1 bonus to AC and saving throws, and it has Resistance to all damage. Also, each time it takes damage, you take the same amount of damage. The spell ends if you drop to 0 Hit Points or if you and the target become separated by more than 60 feet. It also ends if the spell is cast again on either of the connected creatures."},"Water Breathing":{"l":3,"sc":"Transmutation","cl":["Druid","Ranger","Sorcerer","Wizard"],"ct":"Action or Ritual","rg":"30 feet","cp":"V, S, M (a short reed)","du":"24 hours","tx":"This spell grants up to ten willing creatures of your choice within range the ability to breathe underwater until the spell ends. Affected creatures also retain their normal mode of respiration."},"Water Walk":{"l":3,"sc":"Transmutation","cl":["Cleric","Druid","Ranger","Sorcerer"],"ct":"Action or Ritual","rg":"30 feet","cp":"V, S, M (a piece of cork)","du":"1 hour","tx":"This spell grants the ability to move across any liquid surface—such as water, acid, mud, snow, quicksand, or lava—as if it were harmless solid ground (creatures crossing molten lava can still take damage from the heat). Up to ten willing creatures of your choice within range gain this ability for the duration. An affected target must take a Bonus Action to pass from the liquid’s surface into the liquid itself and vice versa, but if the target falls into the liquid, the target passes through the surface into the liquid below."},"Web":{"l":2,"sc":"Conjuration","cl":["Sorcerer","Wizard"],"ct":"Action","rg":"60 feet","cp":"V, S, M (a bit of spiderweb)","du":"Concentration, up to 1 hour","tx":"You conjure a mass of sticky webbing at a point within range. The webs fill a 20-foot Cube there for the duration. The webs are Difficult Terrain, and the area within them is Lightly Obscured. If the webs aren’t anchored between two solid masses (such as walls or trees) or layered across a floor, wall, or ceiling, the web collapses on itself, and the spell ends at the start of your next turn. Webs layered over a flat surface have a depth of 5 feet. The first time a creature enters the webs on a turn or starts its turn there, it must succeed on a Dexterity saving throw or have the Restrained condition while in the webs or until it breaks free. A creature Restrained by the webs can take an action to make a Strength (Athletics) check against your spell save DC. If it succeeds, it is no longer Restrained. The webs are flammable. Any 5-foot Cube of webs exposed to fire burns away in 1 round, dealing 2d4 Fire damage to any creature that starts its turn in the fire."},"Wind Wall":{"l":3,"sc":"Evocation","cl":["Druid","Ranger"],"ct":"Action","rg":"120 feet","cp":"V, S, M (a fan and a feather)","du":"Concentration, up to 1 minute","tx":"A wall of strong wind rises from the ground at a point you choose within range. You can make the wall up to 50 feet long, 15 feet high, and 1 foot thick. You can shape the wall in any way you choose so long as it makes one continuous path along the ground. The wall lasts for the duration. When the wall appears, each creature in its area makes a Strength saving throw, taking 4d8 Bludgeoning damage on a failed save or half as much damage on a successful one. The strong wind keeps fog, smoke, and other gases at bay. Small or smaller flying creatures or objects can’t pass through the wall. Loose, lightweight materials brought into the wall fly upward. Arrows, bolts, and other ordinary projectiles launched at targets behind the wall are deflected upward and miss automatically. Boulders hurled by Giants or siege engines, and similar projectiles, are unaffected. Creatures in gaseous form can’t pass through it."},"Zone of Truth":{"l":2,"sc":"Enchantment","cl":["Bard","Cleric","Paladin"],"ct":"Action","rg":"60 feet","cp":"V, S","du":"10 minutes","tx":"You create a magical zone that guards against deception in a 15-foot-radius Sphere centered on a point within range. Until the spell ends, a creature that enters the spell’s area for the first time on a turn or starts its turn there makes a Charisma saving throw. On a failed save, a creature can’t speak a deliberate lie while in the radius. You know whether a creature succeeds or fails on this save. An affected creature is aware of the spell and can avoid answering questions to which it would normally respond with a lie. Such a creature can be evasive yet must be truthful."}};

  const vs = SYN.getVoices().filter(v=>/^en/i.test(v.lang) && !NOVELTY.test(v.name)).sort((a,b)=>us(a)-us(b) || hq(a)-hq(b));

  if(c.level >= 4 && c.feat4 === "Skilled") ((c.feat4opt||{}).skills||[]).forEach(k=>set.add(k));

  if(c.species === "human"){ if(!c.humanFeat) c.humanFeat = "Skilled"; if(!c.humanSkill){ const k = knownSkills(Object.assign({}, c, {humanSkill:""})); c.humanSkill = ["perception","insight","persuasion","stealth","athletics"].find(x=>!k.has(x)); } }
  if(c.species === "human" && c.humanFeat === "Skilled" && (!c.skilled || c.skilled.length < 3)){ const k = knownSkills(Object.assign({}, c, {skilled:[]})); c.skilled = ["perception","insight","stealth","persuasion","athletics","investigation","survival"].filter(x=>!k.has(x)).slice(0,3); }
  if(c.species !== "human"){ c.skilled = []; c.humanSkill = ""; }
}
function recClassChoices(c){
  const C = CLASSES[c.cls];
  if(c.cls === "fighter" && !c.style) c.style = scores(c).dex > scores(c).str ? "Archery" : "Defense";
  if((c.cls === "paladin" || c.cls === "ranger") && c.level >= 2 && !c.style) c.style = c.cls === "ranger" ? "Archery" : "Defense";
  if(!["fighter","paladin","ranger"].includes(c.cls)) c.style = "";
  if((c.cls === "paladin" || c.cls === "ranger") && c.level < 2) c.style = "";
  if(c.cls === "cleric" && !c.order) c.order = "protector";
  if(c.cls === "druid" && !c.primal) c.primal = "magician";
  if(c.cls === "warlock"){ const n = [1,3,3,3,5][c.level-1]; const want = ["Pact of the Tome","Agonizing Blast","Armor of Shadows","Devil's Sight","Repelling Blast"].filter(k=>INVOCATIONS[k].lv <= c.level);
    const inv = (c.invocations||[]).filter(k=>INVOCATIONS[k] && INVOCATIONS[k].lv <= c.level); want.forEach(k=>{ if(inv.length < n && !inv.includes(k)) inv.push(k); }); c.invocations = inv.slice(0,n); }
  else c.invocations = [];
  if(c.cls === "sorcerer" && c.level >= 2 && c.metamagic.length < 2) c.metamagic = ["Quickened Spell","Twinned Spell"];
  if(c.cls !== "sorcerer" || c.level < 2) c.metamagic = c.cls === "sorcerer" ? c.metamagic : [];
  const k = knownSkills(c);
  const expN = (c.cls === "rogue" ? 2 : 0) + (c.cls === "bard" && c.level >= 2 ? 2 : 0) + (c.cls === "ranger" && c.level >= 2 ? 1 : 0) + (c.cls === "wizard" && c.level >= 2 ? 1 : 0);
  c.expertise = (c.expertise||[]).filter(x=>k.has(x));
  if(c.expertise.length < expN){ const pref = c.cls === "wizard" ? ["arcana","history","investigation","religion","nature","medicine"] : c.cls === "rogue" ? ["stealth","perception","sleight","investigation","deception"] : c.cls === "bard" ? ["persuasion","performance","deception","insight"] : ["perception","survival","stealth","nature"];
    pref.concat([...k]).forEach(x=>{ if(c.expertise.length < expN && k.has(x) && !c.expertise.includes(x)) c.expertise.push(x); }); }
  c.expertise = c.expertise.slice(0, expN);
}
/* complete every empty choice with the recommended option */
function complete(c, opts){
  opts = opts || {};
  if(!c.bg) c.bg = recBg(c.cls);
  if(!Object.keys(c.bonus).length) c.bonus = recBonus(c);
  recOrigin(c);
  const have = knownSkills(Object.assign({}, c, {skills:[]}));
  if(c.skills.length !== CLASSES[c.cls].skills.n) c.skills = recSkills(c.cls, have);
  recClassChoices(c);
  if(opts.spells !== false && !c.cantrips.length && !c.prepared.length) fillSpells(c, c.pack);
  const B = BACKGROUNDS[c.bg];
  if(!B || B.feat !== "Magic Initiate" || c.mi.list !== B.mi || !c.mi.spell) recMI(c);
  if(c.langs.length < 3) recLangs(c);
  if(!c.inv.length) startingGear(c);
  if(!c.name) c.name = pick(NAMES[c.species] || NAMES.human);
  if(!c.story.hook) c.story.hook = STORY.hook[0][0];

}
function randomChar(lock){
  lock = lock || {}; const old = lock.char || {};
  const c = blank();
  c.cls = lock.cls ? old.cls : pick(Object.keys(CLASSES));
  c.species = lock.species ? old.species : pick(Object.keys(SPECIES));
  c.bg = lock.bg ? old.bg : (Math.random() < .6 ? recBg(c.cls) : pick(Object.keys(BACKGROUNDS)));
  if(lock.abil){ c.method = old.method; c.base = Object.assign({}, old.base); c.rolls = old.rolls; }
  else if(Math.random() < .5){ c.base = recBase(c.cls); }
  else { const rolls = []; for(let i=0;i<6;i++){ const d = [1,2,3,4].map(()=>1+rnd(6)).sort((a,b)=>b-a); rolls.push(d[0]+d[1]+d[2]); } c.method = "roll"; c.rolls = rolls; c.base = recBase(c.cls, rolls); }
  if(c.species === "dragonborn") c.dragon = pick(Object.keys(DRAGONS));
  if(c.species === "elf") c.lineage = pick(["drow","high","wood"]);
  if(c.species === "gnome") c.lineage = pick(["forest","rock"]);
  if(c.species === "tiefling") c.lineage = pick(["abyssal","chthonic","infernal"]);
  if(c.species === "goliath") c.giant = pick(Object.keys(LINEAGE.goliath));

  $$(".tabs").forEach(t=>{
    if(t.parentElement.classList.contains("tabwrap")) return;
    const w = document.createElement("div"); w.className = "tabwrap noprint"; t.parentNode.insertBefore(w, t); w.appendChild(t);
    const L = document.createElement("button"), R = document.createElement("button");
    L.className = "tabarrow l"; R.className = "tabarrow r"; L.textContent = "◀"; R.textContent = "▶";
    L.setAttribute("aria-label", "More tabs to the left 左邊還有"); R.setAttribute("aria-label", "More tabs to the right 右邊還有");
    w.appendChild(L); w.appendChild(R);
    const upd = ()=>{ L.hidden = t.scrollLeft <= 4; R.hidden = t.scrollLeft + t.clientWidth >= t.scrollWidth - 4; };
    L.onclick = ()=>t.scrollBy({left:-t.clientWidth*.7, behavior:"smooth"});
    R.onclick = ()=>t.scrollBy({left:t.clientWidth*.7, behavior:"smooth"});
    t.addEventListener("scroll", upd, {passive:true}); t._upd = upd;
    const on = t.querySelector("button.on"); if(on && on.offsetLeft + on.offsetWidth > t.clientWidth) t.scrollLeft = on.offsetLeft - 40;
    upd();
  });
}

const IN_APP = /\bLine\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent || "");
const IN_LINE = /\bLine\//i.test(navigator.userAgent || "");
function b64e(bytes){ let s = ""; for(let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(str){ const s = atob(str); const u = new Uint8Array(s.length); for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function makeCode(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){ try{ const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer(); return "HERO2:" + b64e(new Uint8Array(buf)); }catch(e){} }
  return "HERO1:" + b64e(bytes);
}
async function readCode(text){
  let t = String(text || "");
  try{ t = t.normalize("NFKC"); }catch(e){}            /* full-width letters from Chinese keyboards → normal */
  const st = t.indexOf("{"), hi = t.search(/HERO[12]\s*[:：]/i);
  if(st >= 0 && (hi < 0 || st < hi)){ try{ return JSON.parse(t.slice(st, t.lastIndexOf("}") + 1)); }catch(e){ throw new Error("json"); } }
  if(hi < 0) throw new Error("start");
  const ver = t[hi + 4];
  let b = t.slice(t.indexOf(":", hi) + 1).replace(/[^A-Za-z0-9+/]/g, "");   /* drop spaces, line breaks, invisible marks, padding */
  while(b.length % 4) b += "=";
  let bytes; try{ bytes = b64d(b); }catch(e){ throw new Error("letters"); }
  if(ver === "2"){
    let out = null;
    if(window.DecompressionStream){ try{ out = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer()); }catch(e){ out = null; } }
    if(!out && window.pako){ try{ out = pako.inflateRaw(bytes); }catch(e){ throw new Error("short"); } }
    if(!out) throw new Error("short");
    bytes = out;
  }
  try{ return JSON.parse(new TextDecoder().decode(bytes)); }catch(e){ throw new Error("short"); }
}
function openExternalURL(){ const u = new URL(location.href); u.searchParams.set("openExternalBrowser", "1"); return u.toString(); }
function inAppNote(){ return IN_APP ? `<div class="card" style="border-color:var(--gold);margin:0 0 10px"><p style="margin:0 0 6px">You're inside ${IN_LINE ? "LINE" : "an app"}. It can't save files or print. Use a hero code instead, or open Hero Workshop in Safari or Chrome.</p><p class="zh" style="margin:0 0 8px">你現在是在${IN_LINE ? " LINE " : "App "}裡面開啟，不能下載檔案或列印。請改用「角色代碼」，或用 Safari／Chrome 開啟。注意：換瀏覽器時角色不會自動跟過去，請先複製代碼，再到新瀏覽器貼上。</p>${IN_LINE ? `<a class="btn sm" style="text-decoration:none;display:inline-block" href="${esc(openExternalURL())}">🌐 Open in browser 用瀏覽器開啟</a>` : ""}</div>` : ""; }
async function showCode(obj, title){
  const code = await makeCode(obj);
  openOv(`<div class="hd"><h3>${esc(title)}</h3>${closeBtn()}</div>${inAppNote()}
    <p>Copy this code and keep it somewhere safe: send it to yourself in LINE, or paste it into Notes. To get the hero back, tap <b>Paste a code</b>.</p>
    <p class="zh">複製這段代碼，存在安全的地方：可以用 LINE 傳給自己，或貼到備忘錄。要把角色找回來時，點「貼上代碼」。</p>
    <textarea id="codeBox" readonly style="min-height:120px;font-family:monospace;font-size:13px;word-break:break-all">${esc(code)}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn pri" data-act="copyCode">📋 Copy 複製</button><button class="btn" data-act="close">Done 完成</button></div>`);
  const box = $("#codeBox"); if(box){ box.onfocus = ()=>box.select(); }
}
ACTS.copyCode = async ()=>{ const box = $("#codeBox"); if(!box) return; let ok = false;
  try{ await navigator.clipboard.writeText(box.value); ok = true; }catch(e){}

function openDice(preset){

   </div>

   <div class="total" id="total"></div>
   <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" data-act="rollDice" style="min-width:160px">Roll! 擲骰</button><button class="btn" data-act="clearDice">Clear 清除</button></div>

   <div class="hist" id="hist">${DICE.hist.slice(0,8).map(h=>`<div>${esc(h)}</div>`).join("")}</div>`);

ACTS.addDie = b => { DICE.info = ""; const n = +b.dataset.n; DICE.pool[n] = Math.min(10, (DICE.pool[n]||0) + 1); DICE.label = ""; Music.sfx("click"); renderDice(); };

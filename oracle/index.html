 Watch how they act when they think nobody's looking.","zh":"跟這個人慢慢來。看看他在以為沒人注意的時候會怎麼做。"}],"work":[{"en":"Someone above you is watching how you work. Good. Keep doing it well.","zh":"上面有人在看妳怎麼做事。這是好事，繼續把事情做好。"},{"en":"Wait before you make your move at work. You'll get more by watching first.","zh":"工作上先別急著出手。先觀察，收穫會比較多。"}],"money":[{"en":"Patience pays here. Hold off on the purchase and watch the price for a while.","zh":"這裡耐心會有回報。先別買，觀察一陣子價格。"},{"en":"Keep an eye on your accounts. Someone, or some fee, may be taking a little more than they should.","zh":"多注意一下帳戶，可能有人或某筆費用拿得比應該的多。"}],"anything":[{"en":"Wait a little and keep your eyes open. The answer will show itself.","zh":"先等一等，多看一點。答案會自己露出來。"},{"en":"Someone with more experience is keeping watch. You're not as alone as it feels.","zh":"有個比妳更有經驗的人在看著。妳其實沒有妳覺得的那麼孤單。"}]}},{"n":29,"slug":"rooftop-rogue","pip":"star","image":"29-rooftop-rogue.png","name":{"en":"The Rooftop Rogue","zh":"屋頂上的盜賊"},"core":{"en":"Quick thinking and light feet. A clever way out.","zh":"腦筋動得快，腳步也輕。聰明的脫身之道。"},"flavor":{"en":"The best escape plan is the one nobody saw.","zh":"最好的脫身計畫，就是沒人看見的那一個。"},"lines":{"past":[{"en":"You got yourself out of a tight spot a while ago, and you did it cleverly.","zh":"之前妳從一個困境裡脫身，而且做得很聰明。"},{"en":"You once found a way out that nobody else could see.","zh":"以前有一次，妳找到了一條別人都沒看到的出路。"}],"present":[{"en":"Look at the rogue leaping between the rooftops. There's a quick way out of your problem, if you're light on your feet.","zh":"看那個在屋頂間跳來跳去的盜賊。只要腳步夠輕，妳的問題有個快速的出口。"},{"en":"You're thinking fast right now, and it's working. Trust your instincts.","zh":"妳現在腦筋動得很快，而且很有用。相信自己的直覺。"}],"future":[{"en":"Soon you may need to move quickly. Pack light so you can.","zh":"接下來妳可能得動作快一點。行李輕一點，才跑得動。"},{"en":"A clever solution is coming, from a direction you don't expect.","zh":"一個聰明的解法正從意想不到的方向來。"}],"advice":[{"en":"Look up. You might be able to go over the problem instead of through it.","zh":"抬頭看看。也許妳可以從上面越過這個問題，不用硬闖過去。"},{"en":"Travel light this week. Put down one thing you don't need to carry.","zh":"這禮拜輕裝上路，放下一件不需要扛的事。"}],"love":[{"en":"Keep things light and playful for now. A bit of mystery helps.","zh":"現在的感情適合輕鬆好玩一點，保留一點神祕感也不錯。"},{"en":"If something isn't working, it's okay to step away gracefully.","zh":"如果有什麼行不通，優雅地退開也沒關係。"}],"work":[{"en":"Find a smarter way to do the job. There's a shortcut that's actually fine.","zh":"找個更聰明的方法做事。有條捷徑其實是可以走的。"},{"en":"A tricky situation at work needs quick thinking and a calm face.","zh":"工作上有個棘手的狀況，需要腦筋動得快，臉上保持冷靜。"}],"money":[{"en":"There's a clever way to save here. Look for the side door, like a discount or a free option.","zh":"這裡有個聰明的省錢方法。找找側門，像是折扣，或是免費的選擇。"},{"en":"Get out of a bad money commitment while you still can, quietly and politely.","zh":"趁還來得及，從一個不好的金錢承諾裡退出來，安靜、有禮貌地退。"}],"anything":[{"en":"There's a way out. It's up on the rooftops.","zh":"有出路的，就在屋頂上。"},{"en":"Move light and fast, and don't look down.","zh":"動作輕一點、快一點，別往下看就好。"}]}},{"n":30,"slug":"druids-grove","pip":"star","image":"30-druids-grove.png","name":{"en":"The Druid's Grove","zh":"德魯伊樹林"},"core":{"en":"Nature's wisdom. Slow down and listen.","zh":"大自然的智慧。慢下來，好好聽。"},"flavor":{"en":"The trees have been talking. Have you been listening?","zh":"樹一直在說話。妳有在聽嗎？"},"lines":{"past":[{"en":"Time outdoors helped you once, more than you realized.","zh":"以前待在戶外的時間幫了妳很多，比妳意識到的還多。"},{"en":"You slowed down a while ago, and things grew while you rested.","zh":"之前妳放慢了腳步，休息的時候，事情反而在慢慢長大。"}],"present":[{"en":"See the animals resting together under the old oak? Even the fox and the rabbit get along here. Slow down and let things grow.","zh":"看那些在老橡樹下一起休息的動物，連狐狸跟兔子在這裡都能相處。慢下來，讓事情慢慢長。"},{"en":"Your body is asking for rest and fresh air. Listen to it.","zh":"妳的身體在跟妳要休息和新鮮空氣。聽它的。"}],"future":[{"en":"A calm, green stretch of time is coming. Things will grow at their own speed.","zh":"接下來會有一段平靜的日子。事情會照自己的速度成長。"},{"en":"Soon you'll find peace somewhere quiet, maybe outdoors.","zh":"很快妳會在某個安靜的地方找到平靜，也許是在戶外。"}],"advice":[{"en":"Go for a walk without your phone. Listen to what's around you.","zh":"去散個步，不帶手機。聽聽身邊的聲音。"},{"en":"Don't force it. Plant the seed, water it, and wait.","zh":"別硬來。種下種子，澆水，然後等。"}],"love":[{"en":"Let love grow slowly, like a tree. There's no need to rush.","zh":"讓感情像樹一樣慢慢長，不用急。"},{"en":"Plan a quiet day outdoors together. You'll talk more easily there.","zh":"計畫一天一起去戶外走走。在那裡你們會比較好聊。"}],"work":[{"en":"Slow down at work. Rushing is making things harder.","zh":"工作上放慢一點。急只會讓事情更難。"},{"en":"Listen to the quiet people on the team. They see things others miss.","zh":"聽聽團隊裡安靜的人怎麼說，他們看得到別人沒注意的地方。"}],"money":[{"en":"Let your savings grow slowly. Don't keep digging them up to check on them.","zh":"讓存款慢慢長，別一直挖出來看。"},{"en":"Spend less on things and more on time outside. It's cheaper, and it helps.","zh":"少花點錢買東西，多花點時間待在戶外。又便宜又有用。"}],"anything":[{"en":"Slow down. Give it time, and the answer will come.","zh":"先慢下來。給它時間，答案自然會來。"},{"en":"Be quiet for a while and listen. You'll hear more than you expect.","zh":"安靜一陣子，好好聽。妳會聽到比預期更多的東西。"}]}},{"n":31,"slug":"lost-hour","pip":"diamond","image":"31-lost-hour.png","name":{"en":"The Lost Hour","zh":"遺失的一小時"},"core":{"en":"Time you thought was gone comes back. Use it well.","zh":"以為沒了的時間，回來了。好好用。"},"flavor":{"en":"An hour lost waiting for the mail coach. Yours now.","zh":"等郵務馬車時浪費掉的一小時。現在是妳的了。"},"lines":{"past":[{"en":"You lost a lot of time to something a while ago. It wasn't all wasted. You learned to wait.","zh":"之前妳在某件事上花掉很多時間。不算全白費，至少妳學會了等。"},{"en":"There was a stretch when the days just slipped by. You're awake now.","zh":"以前有一段日子就這樣溜走了。現在妳醒過來了。"}],"present":[{"en":"See that glowing hourglass on the shelf? An hour is being handed back to you right now.","zh":"看到架上那個發光的沙漏嗎？現在有一個小時正交回到妳手上。"},{"en":"You have more time than you think. Look at where it's going.","zh":"妳的時間比妳以為的多。看看它都花到哪去了。"}],"future":[{"en":"Some free time is coming, maybe a cancelled meeting or a quiet afternoon. Don't fill it straight away.","zh":"接下來會多出一段空閒，可能是會議取消，或一個安靜的下午。別馬上把它填滿。"},{"en":"Soon you'll get a second chance at something you ran out of time for.","zh":"很快，妳會再有機會去做之前來不及做的事。"}],"advice":[{"en":"Take back one hour from your phone this week, and spend it on something you love.","zh":"這禮拜從手機那裡拿回一個小時，花在妳喜歡的事上。"},{"en":"Use the waiting time on the bus or in line. Read something, or learn a new word.","zh":"把等公車、排隊的時間用起來，讀點東西，或學個新單字。"}],"love":[{"en":"Make time for each other, a whole hour with nothing else in it.","zh":"為彼此空出時間，一整個小時，什麼都不做，只有你們。"},{"en":"It's not too late. Time you thought you'd missed with someone can come back.","zh":"還不算太晚。妳以為跟某人錯過的時間，可能會回來。"}],"work":[{"en":"A deadline may move in your favor. Use the extra time to make the work better.","zh":"截止日可能會往後延。多出來的時間，拿來把事情做得更好。"},{"en":"Too much of your day goes to waiting. Find one way to get that time back.","zh":"妳一天有太多時間花在等。想個辦法把這些時間拿回來。"}],"money":[{"en":"Time is money here. Spend an hour sorting out your finances, and it'll pay you back.","zh":"這裡時間就是金錢。花一個小時整理妳的財務，之後會回報妳。"},{"en":"If it saves you time for something you love, paying a little more is worth it.","zh":"如果省下來的時間能拿來做妳喜歡的事，多花一點錢也值得。"}],"anything":[{"en":"There's more time than you think. Breathe.","zh":"時間比妳以為的多。先深呼吸。"},{"en":"An hour is coming back to you. Decide what to spend it on.","zh":"有一個小時要回到妳手上。好好決定要拿它做什麼。"}]}},{"n":32,"slug":"ring","pip":"heart","image":"32-ring.png","name":{"en":"The Ring","zh":"戒指"},"core":{"en":"A promise and a lasting bond.","zh":"一個承諾，一段長久的關係。"},"flavor":{"en":"Sixty years on Grandma's finger. Sixty more to go.","zh":"在奶奶手上戴了六十年。再戴六十年也沒問題。"},"lines":{"past":[{"en":"You made a promise a while ago, and you've kept it. That says a lot about you.","zh":"之前妳答應過一件事，到現在都做到了。從這裡就看得出妳是什麼樣的人。"},{"en":"Someone once made you a promise that helped bring you to where you are now.","zh":"以前有人給過妳一個承諾，妳會走到今天，跟它有關。"}],"present":[{"en":"A bond in your life is stronger than you give it credit for. See the ring on the lace? It's been there a long time.","zh":"妳生命中有一段關係，比妳以為的還要牢。看那只放在蕾絲上的戒指，它已經在那裡很久了。"},{"en":"Someone is waiting for you to commit, to a person or to a plan.","zh":"現在有人在等妳點頭，可能是對一個人，也可能是對一個計畫。"}],"future":[{"en":"A promise is coming, and it's one worth keeping.","zh":"接下來會有一個承諾，而且值得守下去。"},{"en":"Something you start soon could last for years.","zh":"之後開始的事，可能會持續很多年。"}],"advice":[{"en":"Only promise what you'll still want to keep next year.","zh":"只答應明年妳還願意做到的事。"},{"en":"Keep the small promises. They hold the big ones together.","zh":"小承諾要守好，大承諾就是靠它們撐住的。"}],"love":[{"en":"What you have is steady and serious, the kind that lasts.","zh":"你們的感情很穩，也很認真，是會走很久的那種。"},{"en":"Is it time to talk about what you mean to each other? This card thinks so.","zh":"是不是該聊聊你們對彼此的意義了？這張牌覺得是時候了。"}],"work":[{"en":"A long-term deal or a steady role is close. Read the terms, then commit.","zh":"有份長期的合作或穩定的職位快到了。條件看清楚，再好好答應。"},{"en":"People at work have noticed your loyalty. The people you stood by will stand by you.","zh":"妳在工作上的義氣有人看在眼裡。妳挺過的人，也會挺妳。"}],"money":[{"en":"Slow, steady saving works best here. Pick an amount and stick to it.","zh":"這裡最適合穩穩地存錢。訂一個金額，然後一直存下去。"},{"en":"Buy the thing that lasts, even if it costs more today.","zh":"買耐用的那個吧，就算今天要多花一點。"}],"anything":[{"en":"This can last a long time. Look after it.","zh":"這件事能走很久。好好珍惜。"},{"en":"A promise is at the center of this. Keep yours, and expect others to keep theirs.","zh":"這件事的中心是一個承諾。妳守住妳的，也可以要求別人守住他們的。"}]}},{"n":33,"slug":"harp","pip":"heart","image":"33-harp.png","name":{"en":"The Harp","zh":"豎琴"},"core":{"en":"A story being written. What you do adds a verse.","zh":"故事還在寫。妳做的事，會變成其中一段。"},"flavor":{"en":"Every member adds a verse. What will yours say?","zh":"每個人都會添一段歌詞。妳的會寫什麼？"},"lines":{"past":[{"en":"Something you did a while back became a story people still tell.","zh":"以前妳做過的某件事，到現在大家還會拿出來講。"},{"en":"There was a chapter of your life that felt like a song. You can still hum it.","zh":"妳的人生有一段像首歌，到現在妳還哼得出來。"}],"present":[{"en":"Your story is being written right now, around this campfire. What happens next is your verse.","zh":"妳的故事現在正在寫，就在這堆營火旁邊。接下來發生的事，就是妳的那一段。"},{"en":"Someone is listening to how you tell your story. Tell it kindly, to yourself as well.","zh":"有人在聽妳怎麼講自己的故事。好好講，對自己也是。"}],"future":[{"en":"Soon you'll do something worth singing about. It may be small, but it's worth a verse.","zh":"過不久，妳會做一件值得被唱進歌裡的事。也許很小，但值得寫成一段。"},{"en":"A new chapter is about to start, and you get to write the first line.","zh":"新的一章快開始了，第一句由妳來寫。"}],"advice":[{"en":"Write down today and how it felt. Your story needs its notes.","zh":"把今天和當時的心情寫下來。妳的故事需要這些筆記。"},{"en":"Do the thing you'd like to tell your friends about later.","zh":"去做那件妳以後會想跟朋友講的事。"}],"love":[{"en":"This love story is still being written. Don't skip to the ending. Enjoy the verses.","zh":"這段感情的故事還在寫。別急著翻到最後，好好享受中間這一段。"},{"en":"If the two of you were a song, which one would it be? Ask them. The answer might surprise you.","zh":"如果你們是一首歌，會是哪一首？問問對方吧，答案可能會嚇妳一跳。"}],"work":[{"en":"What you do at work this month will be remembered. Make it a good verse.","zh":"妳這個月在工作上做的事會被記住。讓它是好的一段。"},{"en":"Your work is part of a bigger story. Tell people what you're adding to it.","zh":"妳的工作是一個更大故事的一部分。讓大家知道妳加了什麼進去。"}],"money":[{"en":"Spend on things that become stories, like a trip or a class, more than on things that sit in a drawer.","zh":"錢花在會變成故事的事情上，像旅行或上一堂課，會比買躺在抽屜裡的東西值得。"},{"en":"Your story with money is changing. You get to decide how the next part goes.","zh":"妳跟錢的故事正在改變。下一段要怎麼寫，妳可以自己決定。"}],"anything":[{"en":"This is one verse in a longer song.","zh":"這只是一首長歌裡的一段。"},{"en":"Your story has more verses coming. Make the next one a good one.","zh":"妳的故事後面還有很多段。把下一段寫好。"}]}},{"n":34,"slug":"hole-in-the-pocket","pip":"diamond","image":"34-hole-in-the-pocket.png","name":{"en":"The Hole in the Pocket","zh":"口袋破洞"},"core":{"en":"A small leak you haven't noticed. Fix it early.","zh":"一個還沒被發現的小漏洞。早點補起來。"},"flavor":{"en":"Check your pockets. Then check them again.","zh":"摸摸口袋。然後再摸一次。"},"lines":{"past":[{"en":"Small things have been slipping away for a while, one coin at a time.","zh":"有一陣子了，小東西一點一點從口袋漏出去，一次掉一個銅板。"},{"en":"You found a leak not long ago. Now you know where to look.","zh":"不久前妳找到一個漏洞，現在妳知道該從哪裡找了。"}],"present":[{"en":"Something is slipping out right now, so quietly you haven't heard it.","zh":"現在就有東西正在漏，安靜到妳完全沒聽見。"},{"en":"There's a small loss you haven't noticed yet. See the mouse? It has.","zh":"有個小損失妳還沒發現。看到那隻老鼠了嗎？牠倒是發現了。"}],"future":[{"en":"A small leak is coming. Catch it early and it stays small.","zh":"快要出現一個小漏洞了。早點發現，它就不會變大。"},{"en":"Soon you'll find out where things have been going. Most of it is good news.","zh":"很快妳就會知道東西都跑去哪了，而且大部分是好消息。"}],"advice":[{"en":"Get the needle and thread out today. A small hole takes five minutes. A big one costs you the whole pocket.","zh":"今天就把針線拿出來吧。小洞五分鐘就補好了，拖成大洞，整個口袋都得換。"},{"en":"Look at the small things you do every day. That's where the hole is.","zh":"看看妳每天在做的小事，破洞通常就在那裡。"}],"love":[{"en":"Little hurts add up, like a missed call or a forgotten date. Mend them now, while they're small.","zh":"小小的傷是會累積的，像一通沒接到的電話，或一個忘記的紀念日。趁它們還小，現在就補起來。"},{"en":"Your heart may be leaking toward someone who doesn't give much back.","zh":"妳的心意可能一直流向一個不太回應妳的人。"}],"work":[{"en":"Time is leaking out somewhere, maybe in meetings or in one slow habit. Find it and stitch it up.","zh":"時間從某個地方漏掉了，可能是開不完的會，也可能是某個拖拖拉拉的習慣。找到它，把它縫起來。"},{"en":"A small mistake keeps coming back at work. Catch it before someone else does.","zh":"工作上有個小錯誤一直出現。在別人發現之前，先把它抓出來。"}],"money":[{"en":"This is the card of small spending, like bubble tea and delivery fees. Count them for one week.","zh":"這張牌講的是小額花費，像手搖飲、外送費這些。記一個禮拜的帳看看。"},{"en":"Open your bank app and look for charges you forgot. Something costs more than you think.","zh":"打開銀行 App，看看有沒有忘記的扣款。有個東西花掉的錢，比妳以為的多。"}],"anything":[{"en":"It's a gentle warning. Something small needs fixing, and it's easy to fix now.","zh":"這是一個溫柔的提醒。有個小地方需要修，現在修很簡單。"},{"en":"Whatever you asked about, the problem is small. Find the hole and sew it up.","zh":"不管妳問什麼，問題都不大。找到破洞，縫起來就好了。"}]}},{"n":35,"slug":"great-clock","pip":"clover","image":"35-great-clock.png","name":{"en":"The Great Clock","zh":"大鐘"},"core":{"en":"Patterns repeat. Patience and a plan break the loop.","zh":"同樣的事一再重演。耐心加上計畫，才能打破循環。"},"flavor":{"en":"Eleven fifty-nine. Again.","zh":"十一點五十九分。又來了。"},"lines":{"past":[{"en":"The same thing has happened before, maybe more than once. You know how this one goes.","zh":"同樣的事以前就發生過，可能還不只一次。妳知道它會怎麼走。"},{"en":"You were stuck in a loop a while ago, and you got out. You can do it again.","zh":"之前妳被困在一個循環裡，後來妳出來了。這次也可以。"}],"present":[{"en":"It's eleven fifty-nine on the great clock, again. Something keeps coming round. What will you do differently this time?","zh":"大鐘又停在十一點五十九分。有件事一直重來。這次妳想怎麼做不一樣？"},{"en":"You're doing the same steps and hoping for a new result. Change one small thing.","zh":"妳一直走同樣的步驟，卻期待不同的結果。改一件小事就好。"}],"future":[{"en":"A familiar situation is coming round again. This time you'll be ready.","zh":"一個熟悉的狀況又要來了。這次妳會準備好。"},{"en":"Soon the clock will finally strike twelve, and something long stuck will start moving.","zh":"很快，大鐘終於會敲十二下，卡了很久的事會開始動。"}],"advice":[{"en":"Write down what happened last time. Then plan one change.","zh":"把上次發生的事寫下來，然後計畫一個改變。"},{"en":"Be patient with yourself. Loops take more than one try to break.","zh":"對自己有耐心一點。循環不是一次就打得破的。"}],"love":[{"en":"Are you having the same argument again? Try starting it a new way.","zh":"你們是不是又在吵同一件事？試試看換個方式開頭。"},{"en":"You may keep choosing the same kind of person. Notice the pattern, then choose differently.","zh":"妳可能一直在選同一種人。看清這個模式，下次就選不一樣的。"}],"work":[{"en":"The same problem keeps coming back at work. Fix what causes it, and stop patching it.","zh":"工作上同一個問題一直回來。去處理根本原因，別再一直補破洞。"},{"en":"Your workdays all feel the same. Add one new task you actually enjoy.","zh":"上班的日子感覺都一樣。加一件妳真的喜歡的新工作進去。"}],"money":[{"en":"Every month the money runs out at the same point. Look at that week closely.","zh":"每個月錢都在同一個時候用完。仔細看看那一週。"},{"en":"A spending habit keeps repeating. Make a plan to break it, one step at a time.","zh":"有個花錢的習慣一直重複。擬個計畫，一步一步改掉。"}],"anything":[{"en":"You've been here before. Use what you learned last time.","zh":"妳以前來過這裡。用上次學到的東西。"},{"en":"Bring patience and a plan. The clock does move, even when it looks stuck.","zh":"帶著耐心，再加一個計畫。時鐘會走的，就算看起來卡住了。"}]}},{"n":36,"slug":"golden-key","pip":"diamond","image":"36-golden-key.png","name":{"en":"The Golden Key","zh":"金鑰匙"},"core":{"en":"A door opens. Success is within reach. Walk through it.","zh":"門開了，成功就在眼前。走進去吧。"},"flavor":{"en":"Customers use the FRONT door. Welcome.","zh":"客人走的是『前門』。歡迎光臨。"},"lines":{"past":[{"en":"You earned something a while ago that you haven't fully enjoyed yet.","zh":"之前妳贏得了一樣東西，只是還沒好好享受。"},{"en":"A door opened for you once, and you walked through. Look how far you've come.","zh":"以前有扇門為妳打開，而妳走了進去。看看妳現在走了多遠。"}],"present":[{"en":"The door is wide open and people are cheering. Yes, it's for you. Go in.","zh":"門大大地開著，大家都在歡呼。對，就是為妳。進去吧。"},{"en":"You already hold the key. You just haven't tried it in the lock.","zh":"鑰匙已經在妳手上了，妳只是還沒插進鎖裡試試看。"}],"future":[{"en":"A big yes is coming. The door will open, and you won't have to break it down.","zh":"接下來會有一個大大的『好』。門會開，不用妳硬撞。"},{"en":"Success is close, closer than it looks from here.","zh":"成功很近了，比妳從這裡看到的還近。"}],"advice":[{"en":"Walk through the front door. You've earned it.","zh":"從正門走進去。這是妳應得的。"},{"en":"Say yes to the chance in front of you, and don't apologize for it.","zh":"答應眼前的機會吧，不用覺得不好意思。"}],"love":[{"en":"A door in love is opening. Someone is ready to let you in.","zh":"感情的門正在打開，有個人準備好讓妳走進來了。"},{"en":"The answer you've been hoping for is yes.","zh":"妳一直在盼的那個答案，是『好』。"}],"work":[{"en":"The job or promotion you wanted is within reach. Reach for it.","zh":"妳想要的工作或升遷，伸手就碰得到了。伸手吧。","ahead":1},{"en":"Your hard work has made a key. Use it, and ask for the next step.","zh":"妳的努力已經打出了一把鑰匙。用它，然後要求下一步。"}],"money":[{"en":"A good money result is near. A deal may close, or a payment arrive.","zh":"好的財務結果快到了，可能是談成一筆生意，或是一筆款項入帳。"},{"en":"The money plan you started is working. Keep going.","zh":"妳開始的理財計畫有效果了。繼續下去。"}],"anything":[{"en":"Whatever you asked about, the answer is yes. Walk in.","zh":"不管妳問什麼，答案都是『好』。走進去吧。"},{"en":"It's open. You don't need to knock again.","zh":"門開了，不用再敲了。"}]}}],"spreads":{"_about":"Spreads are data. A slot = [opener, sometimes] + the card's position line + its topic line; a 'one' slot = [opener] + topic line + advice line. {card} is the card's name; in English the engine writes 'the' instead of 'The' unless the name starts the sentence. Rules: openers never repeat within one spread; topic lines marked 'ahead' (they look forward) are kept out of the past slot when the card has another wording; a wording whose first words (EN) or first four characters (中文) already opened a line in this spread is skipped when the other wording is fresh. Up to two combos follow the cards, in-order and side-by-side ones first.","openerChance":0.35,"topics":{"love":{"en":"Love","zh":"感情"},"work":{"en":"Work","zh":"工作"},"money":{"en":"Money","zh":"金錢"},"anything":{"en":"Anything","zh":"什麼都問"}},"spreads":{"one":{"name":{"en":"One card","zh":"一張牌"},"positions":["one"],"layout":[[0,0,0]]},"three":{"name":{"en":"Three cards","zh":"三張牌"},"positions":["past","present","future"],"layout":[[-1,0,-3],[0,0,1],[1,0,3]]}},"positions":{"one":{"en":"","zh":"","lines":"advice"},"past":{"en":"Past","zh":"過去","lines":"past"},"present":{"en":"Present","zh":"現在","lines":"present"},"future":{"en":"Future","zh":"未來","lines":"future"}},"openers":{"past":[{"en":"{card} is sitting in your past.","zh":"先看過去這張，是{card}。"},{"en":"Let's start behind you, with {card}.","zh":"過去那一格，抽到的是{card}。"},{"en":"Your first card, {card}, looks back.","zh":"第一張是{card}，它說的是以前的事。"}],"present":[{"en":"Now the middle card: {card}.","zh":"再來看中間這張，{card}。"},{"en":"{card} sits right in the middle, in your present.","zh":"眼下這一格，是{card}。"},{"en":"Today belongs to {card}.","zh":"中間這張是{card}，講的是妳現在的狀況。"}],"future":[{"en":"And last, what's coming: {card}.","zh":"最後這張是{card}，看的是之後的事。"},{"en":"{card} is waiting up ahead.","zh":"往前看，等著妳的是{card}。"},{"en":"Further down the road, there's {card}.","zh":"再往後走，妳會遇到{card}。"}],"one":[{"en":"You drew {card}.","zh":"妳抽到的是{card}。"},{"en":"{card}. Let's see what it has to say.","zh":"{card}。來聽聽它怎麼說。"},{"en":"Ah, {card}.","zh":"喔，是{card}。"}]},"comboFrames":{"any":[{"en":"{a} and {b} turned up together.","zh":"{a}跟{b}一起出來了。"},{"en":"See {a} and {b} in the same spread?","zh":"妳看，{a}和{b}在同一個牌陣裡。"},{"en":"When {a} and {b} come up together, I read them as one story.","zh":"{a}跟{b}一起出現的時候，我會把它們放在一起看。"}],"seq":[{"en":"{a} came first, and then {b}.","zh":"先是{a}，然後才是{b}。"},{"en":"Notice the order: {a}, then {b}.","zh":"妳注意看順序，{a}在前，{b}在後。"},{"en":"When {a} comes before {b}, I read them together.","zh":"{a}排在{b}前面的時候，我會把它們連起來讀。"}],"adjacent":[{"en":"{a} is lying right next to {b}.","zh":"{a}就靠在{b}旁邊。"},{"en":"See how {a} sits beside {b}?","zh":"妳看{a}跟{b}貼得多近。"}]}},"app":{"_about":"The app's spreads beyond LENS No. 03's one and three (those come from lens/issue-03/deck/spreads.json unchanged). {x}/{y} are a noun joined with a tint (EN: noun + ' ' + tint; 中文: tint + '的' + noun); {a}..{d} are bare nouns; {card} is a card name. Rules: claude/kettlebrook-oracle-app-rules.md.","spreads":{"five":{"name":{"en":"Five cards","zh":"五張牌"},"positions":["start","in","theme","on","end"]},"box9":{"name":{"en":"Nine cards","zh":"九張牌"},"positions":["b1","b2","b3","b4","b5","b6","b7","b8","b9"]},"grand36":{"name":{"en":"All 36","zh":"全部 36 張"},"positions":["house"]}},"positions":{"start":{"en":"Where it starts","zh":"起點"},"in":{"en":"Leading in","zh":"前段"},"theme":{"en":"The theme","zh":"主題"},"on":{"en":"Leading on","zh":"後段"},"end":{"en":"Where it goes","zh":"去向"},"rows":[{"en":"On your mind","zh":"妳心裡想的"},{"en":"What's happening","zh":"正在發生的"},{"en":"Out of sight","zh":"妳沒看見的"}],"cols":[{"en":"before","zh":"之前"},{"en":"now","zh":"現在"},{"en":"next","zh":"之後"}],"house":{"en":"In the house of {card}","zh":"在{card}的宮位"},"finder":{"en":"You","zh":"妳"}},"five":{"theme":[{"en":"The middle card, {card}, is what this is about.","zh":"中間這張{card}，就是這次要看的事。"},{"en":"Everything in this row turns around {card}, in the middle.","zh":"整排牌都繞著中間的{card}轉。"},{"en":"{card} sits in the middle. Let's start there.","zh":"{card}在正中間，我們從它開始。"}],"start":[{"en":"It started with {x}.","zh":"事情是從{x}開始的。"},{"en":"Further back, there was {x}.","zh":"再往前看，是{x}。"},{"en":"This grew out of {x}.","zh":"這件事是從{x}長出來的。"}],"now":[{"en":"Right now it's {x}.","zh":"現在，它是{x}。"},{"en":"At the moment, this is {x}.","zh":"眼下這件事，是{x}。"},{"en":"Today it looks like {x}.","zh":"今天看起來，它是{x}。"}],"next":[{"en":"And it's turning into {x}.","zh":"接下來，它會變成{x}。"},{"en":"Soon it becomes {x}.","zh":"很快，它會成為{x}。"},{"en":"Give it time and it turns into {x}.","zh":"給它一點時間，它會變成{x}。"}],"far":[{"en":"Further on, there's {x}.","zh":"再往前走，是{x}。"},{"en":"At the end of the line waits {x}.","zh":"這排牌的盡頭，等著{x}。"},{"en":"Further down the road you'll find {x}.","zh":"路再走遠一點，妳會遇到{x}。"}]},"box9":{"heart":[{"en":"The card in the middle, {card}, is the heart of it.","zh":"正中間這張{card}，是整件事的核心。"},{"en":"All nine cards lean toward {card}, in the middle.","zh":"九張牌都靠向中間的{card}。"},{"en":"Let's start in the middle, with {card}.","zh":"先從中間的{card}看起。"}],"top":[{"en":"In your head, it goes from {a} to {b}, and then to {c}.","zh":"妳腦袋裡想的，從{a}到{b}，再到{c}。"},{"en":"Your thoughts keep moving from {a} to {b} to {c}.","zh":"妳的心思一直在轉，從{a}、{b}，轉到{c}。"},{"en":"You started out thinking about {a}. Then came {b}, and now {c}.","zh":"妳一開始想的是{a}，後來是{b}，現在是{c}。"}],"mid":[{"en":"This came out of {x}, and it's heading for {y}.","zh":"這件事從{x}來，正往{y}去。"},{"en":"Behind it is {x}. Ahead of it is {y}.","zh":"它的後面是{x}，前面是{y}。"},{"en":"It grew from {x}, and it's on its way to {y}.","zh":"它從{x}長出來，正走向{y}。"}],"bottom":[{"en":"Where you aren't looking, there's {a}, {b} and {c}.","zh":"在妳沒注意的地方，有{a}、{b}，還有{c}。"},{"en":"Out of sight, {a}, {b} and {c} are waiting their turn.","zh":"看不到的地方，{a}、{b}和{c}正在等著輪到它們。"},{"en":"Under all this lie {a}, {b} and {c}. You don't need to see them yet.","zh":"這一切底下，藏著{a}、{b}和{c}。現在還不用看清楚。"}],"rise":[{"en":"Something you'd stopped seeing is on its way back: {x}.","zh":"妳原本沒在看的東西，正在回來：{x}。"},{"en":"Something is rising back into view: {x}.","zh":"有東西正慢慢浮上來：{x}。"},{"en":"Watch the line from the bottom corner up. {x} is coming back.","zh":"從左下角往上看，{x}正在回來。"}],"fall":[{"en":"And something you've been carrying in your head can be set down now: {x}.","zh":"還有一件妳一直放在心上的事，現在可以放下了：{x}。"},{"en":"You can let go of {x}. It's sliding out of the way.","zh":"{x}，妳可以放手了，它正慢慢滑開，不再擋路。"},{"en":"Set down {x}. You've carried it long enough.","zh":"把{x}放下吧，妳已經扛得夠久了。"}]},"grand36":{"topicCards":{"love":32,"work":24,"money":3},"stand":{"left-top":[{"en":"The Finder landed near the start, up high. Most of these cards are still ahead of you, and you think about them a lot.","zh":"尋物人落在開頭、靠上的位置。大部分的牌都還在妳前面，妳也常常想著它們。"}],"left-bottom":[{"en":"The Finder landed near the start, low down. Most of this is still ahead, and you're standing on firm ground.","zh":"尋物人落在開頭、靠下的位置。大部分的事都還在前面，妳腳下的地很穩。"}],"mid-top":[{"en":"The Finder stands in the middle, up high. You're halfway through this, and your head is full of it.","zh":"尋物人站在中間、靠上。這件事妳走到一半了，腦袋裡裝滿了它。"}],"mid-bottom":[{"en":"The Finder stands in the middle, low down. You're halfway, and more is going on under the surface than you can see.","zh":"尋物人站在中間、靠下。這件事走到一半，水面下的事比妳看到的多。"}],"right-top":[{"en":"The Finder landed near the end, up high. Most of these cards are behind you. This reading is about finishing well.","zh":"尋物人落在尾端、靠上。大部分的牌都在妳身後了，這次要看的是怎麼好好收尾。"}],"right-bottom":[{"en":"The Finder landed near the end, low down. Most of it is behind you, and what's left is under your feet. Finish it.","zh":"尋物人落在尾端、靠下。大部分都過去了，剩下的就在妳腳下。把它完成吧。"}]},"house":[{"en":"You're standing in the house of {card}.","zh":"妳站在{card}的宮位上。"},{"en":"{card} owns the place where you're standing.","zh":"妳站的這一格，屬於{card}。"}],"ownHouse":[{"en":"You're standing in your own house, the very first place. Today you are your own best guide.","zh":"妳正好站在自己的宮位，也就是第一格。今天，妳就是自己最好的嚮導。"}],"above":[{"en":"Over your head hangs {x}. That's what's on your mind.","zh":"妳頭上懸著{x}，這就是妳心裡在想的。"},{"en":"Above you sits {x}. You think about it more than you say.","zh":"妳上方是{x}。妳想它的次數，比說出口的多。"}],"below":[{"en":"Under your feet is {x}. You stand on it, even when you don't look at it.","zh":"妳腳下是{x}。就算沒低頭看，妳也一直踩在上面。"},{"en":"Below you lies {x}. It holds you up.","zh":"妳底下是{x}，是它撐著妳。"}],"left":[{"en":"Just behind you is {x}.","zh":"妳身後是{x}。"},{"en":"You've just walked past {x}.","zh":"妳剛走過{x}。"}],"right":[{"en":"One step ahead waits {x}.","zh":"往前一步，等著妳的是{x}。"},{"en":"Right in front of you is {x}.","zh":"就在妳眼前的，是{x}。"}],"near":[{"en":"{card} is right beside you. This is close, and it's moving now.","zh":"{card}就在妳旁邊。這件事很近，而且正在動。"},{"en":"You can almost touch {card}. Things will happen soon.","zh":"{card}近得伸手就碰得到。事情很快就會有動靜。"}],"mid":[{"en":"{card} is a few steps away. Keep walking toward it.","zh":"{card}離妳幾步遠。繼續朝它走。"},{"en":"{card} isn't far. Give it a few weeks.","zh":"{card}不算遠，給它幾個禮拜。"}],"far":[{"en":"{card} is far across the cloth. This will take time, and that's fine.","zh":"{card}在桌布的另一頭。這件事需要時間，沒關係。"},{"en":"{card} lies a long way off. Be patient with this one.","zh":"{card}離得很遠。這件事要多點耐心。"}],"road":[{"en":"Further along your row come {a}, then {b}.","zh":"沿著妳這一排往前，是{a}，然後是{b}。"},{"en":"Keep walking your row and you'll meet {a}, then {b}.","zh":"沿著這一排繼續走，妳會遇到{a}，接著是{b}。"}],"hops2":[{"en":"From the side, a knight's hop away, come {a} and {b}. Don't let them catch you by surprise.","zh":"從旁邊、隔著一個騎士跳的距離，來了{a}和{b}。別被它們嚇一跳。"},{"en":"Watch the corners of your eyes. {a} and {b} are closer than they look.","zh":"眼角餘光留意一下，{a}和{b}比看起來還近。"}],"hops1":[{"en":"From the side, a knight's hop away, comes {a}. Keep an eye on it.","zh":"從旁邊、隔著一個騎士跳的距離，來了{a}。留意一下。"},{"en":"Watch the corner of your eye. {a} is closer than it looks.","zh":"眼角餘光留意一下，{a}比看起來還近。"}],"corners":[{"en":"The four corners hold the whole story together: {a}, {b}, {c} and {d}.","zh":"四個角落把整個故事框起來：{a}、{b}、{c}，還有{d}。"},{"en":"Look at the corners. {a} and {b} at the top, {c} and {d} at the bottom. That's the frame around everything.","zh":"看看四個角：上面是{a}和{b}，下面是{c}和{d}。這就是整件事的外框。"}],"advice":[{"en":"The card in your own house, the top-left corner, is {card}.","zh":"在妳自己的宮位，也就是左上角，是{card}。"},{"en":"{card} is sitting in your house. It has some advice.","zh":"{card}坐在妳的宮位上，它有話要說。"}],"adviceSelf":[{"en":"Since you're in your own house, the advice comes from the card beside you, {card}.","zh":"既然妳站在自己的宮位，建議就交給身旁的{card}。"}]},"comboFrames":{"triple":[{"en":"{a}, then {b}, then {c}. These three tell one story.","zh":"先是{a}，再來是{b}，最後是{c}。這三張說的是同一個故事。"},{"en":"Read these three in a row: {a}, {b}, {c}.","zh":"這三張連起來讀：{a}、{b}、{c}。"}]},"tags":{"theme":{"en":"The theme","zh":"主題"},"start":{"en":"Where it started","zh":"起頭"},"now":{"en":"Right now","zh":"現在"},"next":{"en":"What it's becoming","zh":"接下來"},"far":{"en":"Further on","zh":"更遠的地方"},"advice":{"en":"Advice","zh":"建議"},"heart":{"en":"The heart","zh":"核心"},"top":{"en":"On your mind","zh":"妳心裡想的"},"mid":{"en":"What's happening","zh":"正在發生的"},"bottom":{"en":"Out of sight","zh":"妳沒看見的"},"rise":{"en":"Coming back into view","zh":"回到眼前的"},"fall":{"en":"What you can put down","zh":"可以放下的"},"stand":{"en":"Where you stand","zh":"妳站的位置"},"house":{"en":"Your house","zh":"妳的宮位"},"above":{"en":"Above you","zh":"妳上方"},"below":{"en":"Below you","zh":"妳下方"},"left":{"en":"Behind you","zh":"妳身後"},"right":{"en":"Ahead of you","zh":"妳前方"},"topic":{"en":"Your topic card","zh":"主題牌"},"road":{"en":"Along your row","zh":"沿著這一排"},"hops":{"en":"From the side","zh":"從旁邊來的"},"corners":{"en":"The four corners","zh":"四個角落"}}},"phrases":{"1":{"noun":[["a first step","第一步"],["a journey","旅程"]],"tint":[["that you have to go out and find","得自己出 "a long wait","等待"],["patience","耐心"]],"tint":[["that someone is keeping an eye on","有人默默看著"],["that pays off if you wait","等得到回報"]]},"29":{"noun":[["a clever way out","妙招"],["a quick escape","脫身之計"]],"tint":[["that needs quick feet","要手腳夠快"],["that nobody saw coming","誰也沒料到"]]},"30":{"noun":[["some rest","休息"],["a quiet place","安靜角落"]],"tint":[["that asks you to slow down","要妳放慢腳步"],["that grows in its own time","照自己的步調長大"]]},"31":{"noun":[["an hour to spare","空檔"],["some time","時間"]],"tint":[["that needs a little more time","還需要一點時間"],["that gives you time back","把時間還給妳"]]},"32":{"noun":[["a promise","承諾"],["a bond","牽絆"]],"tint":[["that someone means to keep","有人打算好好守住"],["that lasts","長長久久"]]},"33":{"noun":[["a story","故事"],["a new chapter","新篇章"]],"tint":[["that you're still writing","還要靠妳寫下去"],["that people will tell later","以後大家會講起"]]},"34":{"noun":[["a small leak","小漏洞"],["a careless habit","小疏忽"]],"tint":[["that you haven't noticed yet","妳還沒發現"],["that costs a little every day","每天都在漏一點"]]},"35":{"noun":[["a loop","循環"],["an old pattern","老毛病"]],"tint":[["that keeps coming round","一再重演"],["that patience can break","靠耐心打得破"]]},"36":{"noun":[["an open door","機會"],["success","成功"]],"tint":[["that's within reach","近在眼前"],["that opens a door for you","能幫妳開門"]]}},"combos":{"combos":[{"id":"finder-key","cards":[1,36],"order":"any","text":[["You set off, and the door swings open. Whatever you're starting, that's a very good sign.","妳出發了，門也開了。不管妳要開始什麼，這都是很好的兆頭。"],["The road and the door line up. Keep walking. Someone has already left it unlocked.","路和門對上了。繼續走吧，門已經有人幫妳打開了。"]]},{"id":"ring-sock","cards":[32,20],"order":"seq","text":[["A promise is coming loose, or one of you has to keep it alone for a while. Talk before the gap gets wider.","有個承諾鬆開了，或是有一方得自己守一陣子。趁距離還沒拉大，先好好談一談。"],["Something meant to stay a pair is pulling apart. It can still be mended if someone reaches out.","本來該成對的，正在慢慢分開。只要有人先伸出手，還補得回來。"]]},{"id":"sock-ring","cards":[20,32],"order":"seq","text":[["What went missing finds its match. This is a reunion, or a new promise after a long wait.","不見的那一隻找到伴了。這是一場重逢，也可能是等了很久之後的新承諾。"],["The empty peg gets filled. Someone new, or someone you missed, is ready to stay.","空著的夾子終於掛上了。新的人，或是妳想念的人，準備好留下來了。"]]},{"id":"goblin-hole","cards":[18,34],"order":"any","topics":["money"],"text":[["That's a risky bet with money that's already leaking. Fix the hole before you play.","錢已經在漏了，還想下注，太冒險了。先把洞補好再說。"],["The goblin wants you to gamble, and your pocket is already torn. Sew first, then decide if you still want to bet.","哥布林想要妳賭一把，可是口袋已經破了。先縫好，再決定要不要賭。"]]},{"id":"ring-bells","cards":[32,21],"order":"any","text":[["This is a promise worth celebrating. In love it could be an engagement. At work, a deal that's finally signed.","這是一個值得慶祝的承諾。在感情上可能是訂婚，在工作上可能是終於簽成的合作。"],["The bells ring for a promise. Get your good clothes ready.","鐘聲是為了一個承諾而響的。把好看的衣服準備好吧。"]]},{"id":"form-ring","cards":[12,32],"order":"any","text":[["A promise is about to become official, on paper and in front of people.","有個承諾快要正式定下來了，白紙黑字，大家也都看得到。"],["This bond wants a signature. Make sure both of you mean every word.","這段關係需要一個簽名。確定你們兩個對每個字都是認真的。"]]},{"id":"form-mimic","cards":[12,25],"order":"any","text":[["Read the small print twice. Something in this deal isn't what it looks like.","小字要看兩遍。這個約定裡，有個地方跟看起來的不一樣。"],["The form looks friendly, and so does the suitcase. Check both before you sign anything.","表格看起來很友善，行李箱也是。簽任何東西之前，兩個都要檢查。"]]},{"id":"pipe-goose","cards":[10,5],"order":"any","text":[["A rumor is going round, and someone is enjoying it far too much. Half of it is a joke.","有個傳言在流傳，而且有人傳得太開心了。裡面有一半是開玩笑的。"],["Don't believe the gossip. The goose started it.","八卦別當真，是那隻鵝起的頭。"]]},{"id":"pipe-bells","cards":[10,21],"order":"any","text":[["Good news is travelling fast. You'll hear it soon.","好消息傳得很快，妳很快就會聽到。"],["A message is on its way, and it ends with bells. Keep your phone close.","有則訊息正在路上，結尾會有鐘聲。手機放在身邊吧。"]]},{"id":"storm-pond","cards":[7,17],"order":"any","text":[["Whatever upset you will settle soon, and then you'll see it clearly.","讓妳心煩的事很快就會沉澱，到時候妳會看得很清楚。"],["Let the teacup storm rain itself out. The pond is waiting on the other side.","讓茶杯裡的雨下完吧，平靜的池塘就在另一邊等妳。"]]},{"id":"hole-lostfound","cards":[34,15],"order":"any","text":[["What slipped through the hole has landed somewhere safe. You can get it back.","從破洞掉出去的東西，其實掉在安全的地方。妳拿得回來。"],["Lost coins turn up at the lost-and-found. A small loss will come back to you.","掉了的銅板會出現在失物招領處。一個小損失會回到妳身邊。"]]},{"id":"ticket-lostfound","cards":[23,15],"order":"any","text":[["You have the ticket, and they have the thing. Something from your past is ready to come home.","單子在妳手上，東西在他們那裡。過去的某樣東西，準備好回家了。"],["This is a very strong sign that what you lost will be found.","這是很明顯的訊號：妳弄丟的東西會被找回來。"]]},{"id":"dragon-mayor","cards":[3,14],"order":"any","text":[["Big wants meet a firm decision. Ask the person in charge politely, and accept the answer.","一個很想要的人，遇上一個很堅定的決定。有禮貌地去問主事的人，然後接受他的答案。"],["Someone powerful wants something, and someone fair will decide. Keep your side of it honest.","有個強勢的人想要某樣東西，而做決定的是個公正的人。妳這邊要保持坦白。"]]},{"id":"dragon-key","cards":[3,36],"order":"any","topics":["money","work"],"text":[["A big chance is in reach. Ask for it properly, and the door will open.","一個大機會就在手邊。用對的方式開口要，門就會開。"],["The dragon wants the key, and this time it can have it, if it asks.","龍想要那把鑰匙。這次牠拿得到，只要牠肯開口問。"]]},{"id":"mayor-form","cards":[14,12],"order":"any","topics":["work","money"],"text":[["The paperwork goes through. Someone in charge is about to sign off.","文件會過的。主事的人快要簽核了。"],["An official answer is coming in writing. Read it calmly. It's fairer than you expect.","正式的答覆會以書面寄來。冷靜地讀，它比妳想的公平。"]]},{"id":"tower-rune","cards":[4,22],"order":"any","text":[["Old books and old stones agree. What you're studying will pay off, and the past has the clue.","舊書和老石頭說的是同一件事。妳在學的東西會有回報，線索就在過去。"],["Learn from someone who's been there before. They found this answer a long time ago.","跟走過這條路的人學。這個答案，他們很久以前就找到了。"]]},{"id":"clerk-clock","cards":[24,35],"order":"any","text":[["Your routine has turned into a loop. Keep the good habits and change one step.","妳的作息變成一個循環了。好習慣留著，換掉其中一個步驟。"],["You stamp the same thing at the same time every day. It's tidy, but it's time to try something new.","妳每天在同一個時間蓋同一個章。很整齊，不過也該試點新的了。"]]},{"id":"clock-sprite","cards":[35,8],"order":"any","text":[["The loop breaks at exactly the right moment. When the lucky minute comes, step off the track.","循環會在剛剛好的那一刻被打破。幸運的那一分鐘來的時候，就從軌道上跳下來。"],["The sprite is running round the clock. Your timing is about to change.","小精靈正繞著時鐘跑。妳的時機快要變了。"]]},{"id":"hour-sprite","cards":[31,8],"order":"any","text":[["Time comes back to you at a lucky moment. A free afternoon is coming. Use it for something you love.","時間會在幸運的時刻回到妳手上。接下來會有個空閒的下午，拿去做妳喜歡的事吧。"],["An hour handed back, right on time. Say yes to the plan you thought you had no time for.","一個小時剛好交回到妳手上。那個妳以為沒時間做的計畫，答應吧。"]]},{"id":"kobold-iron","cards":[13,26],"order":"any","text":[["Something is coming up from deep down, an old feeling or an old secret. It's less scary in daylight.","有東西正從很深的地方冒上來，可能是舊的感覺，也可能是舊的祕密。到了陽光下，它就沒那麼可怕了。"],["Someone dug the wrong tunnel and found the iron door. A surprise will lead you somewhere you've been avoiding.","有人挖錯了地道，結果挖到那扇鐵門。一個意外，會把妳帶到一直在躲的地方。"]]},{"id":"path-owl","cards":[6,28],"order":"any","text":[["Trust your instincts, and know that someone kind is watching over you on the way.","相信妳的直覺。路上有個溫柔的人一直在看著妳。"],["The night is on your side. Walk slowly and keep your eyes open.","夜晚站在妳這邊。慢慢走，眼睛睜開。"]]},{"id":"path-finder","cards":[6,1],"order":"any","text":[["Set off even though you can't see the whole way. Your lantern and the fireflies are enough.","就算看不到整條路，還是出發吧。妳的提燈加上那些螢火蟲，就夠了。"],["This journey starts on a feeling. Follow it.","這段旅程是憑感覺開始的。跟著它走吧。"]]},{"id":"boot-bells","cards":[11,21],"order":"any","text":[["A gathering is coming, with good food, good friends and a reason to raise a cup.","接下來會有一場聚會，有好吃的，有好朋友，還有舉杯的理由。"],["Book the big table. There's something to celebrate with the people you love.","把大桌訂下來吧，有件事要跟妳愛的人一起慶祝。"]]},{"id":"boot-sock","cards":[11,20],"order":"any","topics":["love","anything"],"text":[["Friends will help you through a goodbye. Let them pull out a chair for you.","朋友會陪妳走過一次告別。讓他們幫妳拉開椅子吧。"],["You're missing someone, and your friends know it. Go to them, not away from them.","妳在想念某個人，妳的朋友也知道。去找他們吧，別一個人躲起來。"]]},{"id":"mirror-pond","cards":[19,17],"order":"any","text":[["Still water and a cracked mirror both show the same thing: you, clearly, and kinder than you thought.","平靜的水和裂開的鏡子照出的是同一樣東西：清清楚楚的妳，而且比妳想的溫柔。"],["A clear look at yourself is coming. You'll like what you see.","妳快要好好地看清自己了。妳會喜歡看到的樣子。"]]},{"id":"mimic-door","cards":[25,2],"order":"adjacent","text":[["Before you knock on that door, check what's sitting beside it.","敲那扇門之前，先看看旁邊坐著什麼。"],["The challenge is real, but so is the trick. Look twice before you go in.","關卡是真的，陷阱也是真的。進去之前多看兩眼。"]]},{"id":"rogue-owl","cards":[29,28],"order":"any","text":[["Someone saw your clever escape. Be honest about it, and they'll keep your secret.","妳那次聰明的脫身，有人看到了。老實說出來，他會幫妳保密。"],["Move fast, but act as if someone is watching.","動作可以快，但要當作有人在看。"]]},{"id":"shift-wheel","cards":[16,27],"order":"any","text":[["A change in you gets everything moving again. Try the new shape, and watch the wheel turn.","妳身上的改變，會讓一切又動起來。試試新的樣子，看水車轉起來。"],["Try being something new, and the river comes back. This pair is full of life and hope.","換個新的樣子，河水就回來了。這兩張放在一起，很有活力，也很有希望。"]]},{"id":"grove-wheel","cards":[30,27],"order":"any","text":[["Rest comes first, then the energy returns. Don't skip the resting part.","先休息，精力才會回來。休息這一步別省略。"],["Slow down by the trees, and the wheel will start turning on its own.","在樹下慢下來，水車自己就會開始轉。"]]},{"id":"harp-bells","cards":[33,21],"order":"any","text":[["Your story is about to be told out loud, and people will cheer.","妳的故事快要被大聲說出來了，大家會為妳歡呼。"],["Something you do soon will be worth ringing the bells for.","妳接下來做的事，值得大家為妳敲鐘。"]]},{"id":"shield-dragon","cards":[9,3],"order":"any","topics":["work","anything"],"text":[["Stand your ground with someone powerful, politely. You're stronger than they think.","面對強勢的人，客氣但要站穩。妳比他們以為的更有力量。"],["Keep your shield up and your voice calm. The dragon respects people who don't run.","把盾舉好，說話保持平穩。龍會尊敬不逃跑的人。"]]},{"id":"door-key","cards":[2,36],"order":"seq","text":[["The challenge comes first, and success follows close behind.","關卡在前，成功就緊跟在後面。"],["You knock, and later you find the key. Hard work now opens the door for good.","妳先敲了門，後來找到了鑰匙。現在的努力，會讓那扇門一直為妳開著。"]]},{"id":"goose-lostfound","cards":[5,15],"order":"seq","text":[["A silly mix-up leads you to something you really lost. Laugh first, then pick it up.","一場烏龍，反而讓妳找回真的弄丟的東西。先笑一笑，再把它撿回來。"],["The joke leads somewhere real. Follow the goose and see what it dug up.","玩笑背後有真東西。跟著那隻鵝走，看牠翻出了什麼。"]]},{"id":"lostfound-goose","cards":[15,5],"order":"seq","text":[["You get something back, then find out someone was teasing you. Check it before you celebrate.","東西是拿回來了，結果發現有人在捉弄妳。先確認清楚，再開心也不遲。"],["What came back isn't quite what you lost. Look at it twice, and keep your sense of humor.","回到妳手上的，跟妳弄丟的不太一樣。多看兩眼，也別忘了笑。"]]},{"id":"tower-finder","cards":[4,1],"order":"any","text":[["You're setting out to learn something. Bring a notebook. This road teaches you as you walk.","妳要出發去學東西了。帶本筆記本吧，這條路會邊走邊教妳。"],["This new start begins with study. The first step might be a book, or a person who knows more than you.","這個新開始要從學習起步。第一步可能是一本書，也可能是一個比妳懂的人。"]]},{"id":"tower-pond","cards":[4,17],"order":"any","text":[["Read all you like, then sit still. The answer shows up after you close the book.","書可以盡量讀，讀完就安靜坐一下。答案常常在闔上書以後才出現。"],["You already know enough. Give it a quiet evening and it will make sense.","妳懂的已經夠多了。給它一個安靜的晚上，事情就會想通。"]]},{"id":"tower-clerk","cards":[4,24],"order":"any","topics":["work","anything"],"text":[["Study plus routine. Half an hour a day will take you further than one long weekend.","學習加上固定的習慣。每天半小時，會比一個長週末走得更遠。"],["A skill is being built one careful page at a time. Keep going, and keep notes.","一項本事正在一頁一頁慢慢練成。繼續下去，記得做筆記。"]]},{"id":"storm-boot","cards":[7,11],"order":"any","text":[["Somebody lost their temper, and a good meal with friends will fix most of it. Sit down together.","有人發了脾氣，跟朋友好好吃頓飯，大半就沒事了。大家坐下來吧。"],["A small argument and a warm table. The table wins. Say sorry over soup.","一場小口角，一張溫暖的餐桌。最後是餐桌贏。邊喝湯邊說聲抱歉吧。"]]},{"id":"storm-goose","cards":[7,5],"order":"any","text":[["Someone stirred things up for fun, and it got bigger than they meant. Don't take the bait.","有人只是想鬧著玩，結果鬧大了。別上鉤。"],["It's a lot of honking over very little. In a week, this will be a funny story.","吵得很大聲，其實沒什麼事。過一個禮拜，這會變成好笑的故事。"]]},{"id":"pipe-storm","cards":[10,7],"order":"seq","text":[["Something you heard got you upset. Check where it came from before you react.","妳聽到的某句話讓妳不開心。先查查話是從哪裡傳出來的，再決定要不要生氣。"],["A rumor came down the pipe and stirred up a storm. Most of it won't be true.","傳言從管子裡傳下來，掀起了一場風暴。大部分都不會是真的。"]]},{"id":"shield-owl","cards":[9,28],"order":"any","text":[["You're better protected than you think. Someone is keeping watch while you rest.","妳比自己以為的更安全。妳休息的時候，有人在幫妳守著。"],["Stand steady and wait. A friend is watching your back.","站穩，等一等。有朋友在背後照看妳。"]]},{"id":"shield-iron","cards":[9,26],"order":"any","text":[["You have the courage for the hard door. Take your shield, and someone you trust, and go in.","那扇難開的門，妳有勇氣面對。帶上盾牌，帶上信任的人，走進去吧。"],["Something old and heavy needs facing. You're strong enough now, and you don't have to rush.","有件很久、很重的事需要面對。妳現在夠堅強了，也不用急。"]]},{"id":"kobold-pipe","cards":[13,10],"order":"any","text":[["Sudden news from an unexpected place. It sounds big, so listen to all of it first.","從意想不到的地方，突然傳來消息。聽起來很大，先把它聽完。"],["Something changed out of sight, and word is getting around. You'll hear about it soon.","看不到的地方有了變化，消息正在傳開。妳很快就會聽說。"]]},{"id":"kobold-wheel","cards":[13,27],"order":"seq","text":[["The ground shifts, and then everything starts moving again. The shake-up was the start.","地面晃了一下，接著一切又動起來了。那次震動，其實就是開始。"],["An odd surprise gets the wheel turning. You'll be glad it happened.","一個奇怪的意外，讓輪子轉了起來。妳以後會慶幸它發生了。"]]},{"id":"shift-mirror","cards":[16,19],"order":"any","text":[["You've changed, and now you can see it. Take a good look. You look like yourself, only braver.","妳變了，現在也看得出來了。好好看一看，還是妳，只是更勇敢了。"],["An old picture of yourself cracks, and a new one fits better. Let the old one go.","舊的自己裂開了，新的那個更合身。讓舊的走吧。"]]},{"id":"shift-goose","cards":[16,5],"order":"any","text":[["Sometimes the right answer really is to become a goose. Be playful about this. It'll work better.","有時候，正確答案就是變成一隻鵝。輕鬆一點面對，效果反而更好。"],["A silly plan, a quick change, and somehow it works. Trust the odd idea.","一個傻計畫，一次快速變身，不知怎麼就成功了。相信那個怪點子。"]]},{"id":"goblin-key","cards":[18,36],"order":"any","topics":["money","work"],"text":[["This risk could pay off. Do your homework, set a limit, and the door may open.","這個險有機會值得。先做功課，設好上限，門也許就開了。"],["A bold move near an open door. If you go, go with a plan and money you can afford to lose.","大膽的一步，就在敞開的門邊。真要去，帶著計畫，也只用輸得起的錢。"]]},{"id":"goblin-rogue","cards":[18,29],"order":"any","text":[["A clever gamble, as long as you know your way out. Plan the exit before you bet.","可以聰明地賭一把，前提是妳知道怎麼脫身。下注前先想好退路。"],["Quick feet and a quick bet. Fun, if you don't stay at the table too long.","腳步快，下注也快。很好玩，只要別在桌邊待太久。"]]},{"id":"mirror-mimic","cards":[19,25],"order":"any","text":[["Something shows its true face. Better to know now than after you've reached in.","有東西露出了真面目。現在知道，總比伸手進去以後才發現好。"],["The disguise cracks. What looked like a treasure chest has teeth. Step back and smile.","偽裝裂開了，看起來像寶箱的東西長了牙。退後一步，笑一笑就好。"]]},{"id":"rune-ticket","cards":[22,23],"order":"any","text":[["An old promise has come back, and an old lesson tells you how to keep it.","一個舊約定回來了，一句老道理會告訴妳怎麼守住它。"],["Something from long ago is yours to finish. Do it the way the old stories say: honestly.","很久以前的事，現在輪到妳來收尾。照老故事說的做：誠實。"]]},{"id":"rune-grove","cards":[22,30],"order":"any","text":[["Old wisdom and slow time. Take a walk somewhere green and the answer will come to you.","老道理加上慢時光。去有綠意的地方走走，答案自己會來找妳。"],["Listen to the old ways. Your grandmother's advice is probably right this time.","聽聽老一輩的做法。這次，阿嬤的話大概是對的。"]]},{"id":"ticket-hour","cards":[23,31],"order":"any","text":[["You finally get the time to finish something you set aside. Use it for that.","妳終於有時間把擱著的事做完了。就把時間用在那上面吧。"],["An old task and a free afternoon. Put them together and the weight comes off.","一件老差事，一個空下來的下午。把兩個湊在一起，肩上的重量就卸下了。"]]},{"id":"clerk-form","cards":[24,12],"order":"any","topics":["work","money"],"text":[["The paperwork is boring, and it matters. Fill it in properly and keep a copy.","文書工作很無聊，但很重要。好好填，留一份影本。"],["Every box ticked, every page signed. Careful work now saves you trouble later.","每一格都勾好，每一頁都簽好。現在細心，以後就少麻煩。"]]},{"id":"mimic-hole","cards":[25,34],"order":"any","topics":["money"],"text":[["That bargain is leaking money. Read the terms before you pay anything.","那個便宜好康其實在漏錢。付錢之前，先把條款讀清楚。"],["A tempting offer with a hole in it. Check your pockets after you talk to them.","誘人的提議，底下有個洞。跟對方談完，摸摸口袋。"]]},{"id":"iron-pond","cards":[26,17],"order":"any","text":[["Open the hard door slowly, and the water inside will settle. It's calmer in there than you fear.","慢慢打開那扇難開的門，裡面的水就會靜下來。比妳害怕的平靜多了。"],["Face the old feeling slowly, in a calm place. You'll see it clearly once you stop stirring.","安安靜靜面對那份舊情緒，不用急。不再攪動，就看得清楚了。"]]},{"id":"wheel-hour","cards":[27,31],"order":"any","text":[["Things start moving, and you get time back to enjoy it. A good stretch is coming.","事情開始動了，妳也多了時間好好享受。接下來會是一段好日子。"],["The wheel turns, and suddenly your days feel longer. Spend the extra hours on something fresh.","輪子一轉，日子好像變長了。把多出來的時間，用在新的事情上。"]]},{"id":"owl-hour","cards":[28,31],"order":"any","text":[["Waiting is part of the plan. The time isn't wasted, and someone notices that you wait well.","等待也是計畫的一部分。時間沒有白費，也有人看到妳等得很有耐心。"],["Patience gives you an hour back. Rest in it.","耐心會還妳一個小時。就在那一小時裡休息吧。"]]},{"id":"rogue-mayor","cards":[29,14],"order":"any","text":[["The answer was no, and there may be another honest way to get there. Look sideways, not over the fence.","對方說不行，但也許還有別條光明正大的路。往旁邊找找，別翻牆。"],["Respect the decision, then think quickly. There's usually a door nobody tried.","先尊重人家的決定，再動動腦。通常會有一扇還沒人試過的門。"]]},{"id":"grove-shift","cards":[30,16],"order":"any","text":[["Time outdoors will change you a little. Let it. You might come back a bit wilder and a lot calmer.","去戶外待一陣子，妳會有點不一樣。就讓它發生吧，回來的時候也許野了一點，也平靜很多。"],["Listen to your body and change at your own pace. The forest doesn't hurry, and neither do you.","聽身體的話，用自己的步調改變。森林不趕，妳也不用趕。"]]},{"id":"harp-ring","cards":[33,32],"order":"any","text":[["A love story with a promise in it. Write the next verse together.","一個有承諾的愛情故事。下一段，兩個人一起寫。"],["This bond will be a story worth telling. Keep the small moments. They make the best verses.","這段牽絆會是值得說的故事。把小小的片刻留下來，最好的段落都在那裡。"]]},{"id":"harp-boot","cards":[33,11],"order":"any","text":[["A good night with friends that people will talk about for years. Go, and bring a story.","跟朋友度過的好夜晚，大家會講好幾年。去吧，帶個故事去。"],["Your story gets told at a warm table. Share it. People want to hear it.","妳的故事會在溫暖的餐桌上被說出來。說吧，大家想聽。"]]},{"id":"hole-clerk","cards":[34,24],"order":"any","topics":["money","work"],"text":[["Small leaks show up when you keep careful notes. Write down what you spend for one week.","細心記帳，小漏洞就會現形。記一個禮拜的花費看看。"],["A little routine fixes the hole. Check your accounts on the same day every month.","一點固定的習慣就能補好洞。每個月固定一天，看看帳戶。"]]},{"id":"clock-finder","cards":[35,1],"order":"seq","text":[["You've gone round and round. Now step off the loop and take one new road.","妳已經繞了好幾圈。現在跳出這個循環，走一條新的路。"],["The same day again, until you try something different. Today, try it.","同樣的一天一直重來，直到妳換個做法。今天就試試看。"]]},{"id":"door-shield","cards":[2,9],"order":"any","text":[["A hard test, and you're ready for it. Knock, and stand straight.","一場難的考驗，妳已經準備好了。敲門吧，站直。"],["Courage gets you through this door. Protect what matters and step in.","勇氣會帶妳過這扇門。護好重要的東西，走進去。"]]},{"id":"path-sprite","cards":[6,8],"order":"any","text":[["Your gut says now, and the timing agrees. Don't wait for a sign. This is the sign.","妳的直覺說現在，時機也剛好。別再等徵兆了，這就是徵兆。"],["A feeling and a lucky minute line up. Move when it feels right.","感覺和好時機對上了。覺得對了，就動身。"]]},{"id":"sprite-goblin","cards":[8,18],"order":"any","topics":["money","anything"],"text":[["Lucky timing for a small risk. Keep it small, and enjoy it if it works.","小小冒險，正逢好時機。規模放小，成功了就好好享受。"],["The minute is right, and the bet is tempting. Take the chance once, not twice.","時機剛好，賭注也很誘人。機會抓一次就好，別抓第二次。"]]},{"id":"pipe-mayor","cards":[10,14],"order":"any","topics":["work","anything"],"text":[["News is coming down from the top. Wait for the official word before you act on it.","上面要有消息傳下來了。等正式說法出來，再採取行動。"],["Someone in charge is about to decide, and you'll hear soon. Have your answer ready.","負責的人快要做決定了，妳很快會聽到。先把妳的回應準備好。"]]},{"id":"ticket-key","cards":[23,36],"order":"seq","text":[["Finish the old business, and a new door opens right after. One leads to the other.","把舊事處理完，新的門馬上就開。一件會帶出另一件。"],["Close the old chapter properly. What's waiting next is a real chance.","好好收尾舊的那一章。接下來等著妳的，是真正的機會。"]]},{"id":"dragon-hole","cards":[3,34],"order":"any","topics":["money"],"text":[["Big wants and a small leak. Fix the leak first, and the dragon's hoard grows on its own.","想要的很多，口袋卻有個小洞。先補洞，寶藏自己會慢慢變多。"],["Spending to look grand? Check the pocket. The bill is bigger than the show.","花錢撐場面？先摸摸口袋，帳單比場面還大。"]]},{"id":"boot-finder","cards":[11,1],"order":"any","text":[["You don't set out alone. A friend from the inn wants to come along. Say yes.","妳不用一個人出發。旅店裡有朋友想跟。答應吧。"],["Rest well tonight, and leave in the morning. The road will still be there.","今晚好好休息，明天早上再出發。路不會跑掉。"]]},{"id":"mayor-owl","cards":[14,28],"order":"any","topics":["work","anything"],"text":[["Someone in charge has noticed you, and they like what they see. Keep doing good work.","有個說話算數的人注意到妳了，而且印象不錯。繼續把事做好。"],["The decision takes a while. Be patient. You're being watched kindly.","決定還要一陣子。耐心點，有人在善意地看著妳。"]]},{"id":"t-sock-lostfound-ring","cards":[20,15,32],"order":"seq","text":[["Something went missing, it waited somewhere safe, and getting it back ends in a promise. Whatever you lost, you'll get back more than that.","有東西弄丟了，它在安全的地方等著，拿回來的時候還多了一個承諾。妳弄丟的，會以更好的樣子回來。"],["A gap, a long wait and a happy match. This story ends well.","一個缺口，一段長長的等待，最後成雙成對。這個故事有好結局。"]]},{"id":"t-storm-pond-mirror","cards":[7,17,19],"order":"seq","text":[["First the upset, then the quiet, then you see yourself clearly. You'll come out of this kinder to yourself.","先是心煩，然後安靜下來，最後看清了自己。走過這一段，妳會對自己溫柔一點。"],["The storm settles, the water clears, and the mirror shows the truth. Wait out the first part.","風暴平息，水變清了，鏡子照出真相。先撐過第一段就好。"]]},{"id":"t-hole-lostfound-key","cards":[34,15,36],"order":"seq","text":[["Money slipped away, some of it comes back, and then a real chance opens. Learn from the leak and walk through.","錢漏掉了，有一部分回來了，接著真正的機會出現。記住那次漏財的教訓，然後走進門去。"],["A loss, a recovery, an opening. Your money story is turning around.","損失、找回、轉機。妳跟錢的故事正在好轉。"]]},{"id":"t-finder-door-key","cards":[1,2,36],"order":"seq","text":[["You set out, you knock on the hard door, and the key is yours. This is the whole adventure in three cards.","妳出發了，敲了那扇難開的門，鑰匙就到手了。整段冒險，就在這三張牌裡。"],["Start, test, success, in that order. Don't skip the knocking.","出發、考驗、成功，順序就是這樣。敲門那一步別省。"]]},{"id":"t-kobold-shift-wheel","cards":[13,16,27],"order":"seq","text":[["A surprise shakes things, you adapt, and life starts moving again. You handle change better than you think.","意外讓事情晃了一下，妳跟著調整，生活又開始動了。妳比自己以為的更會應變。"],["Shake-up, change, fresh start. By the end, you'll like the new shape of things.","震動、改變、重新開始。到最後，妳會喜歡事情的新樣子。"]]},{"id":"t-clock-sprite-finder","cards":[35,8,1],"order":"seq","text":[["You were stuck in a loop, a lucky minute comes, and you step out onto a new road. Watch for that minute.","妳一直卡在循環裡，好時機來了，妳就踏上新的路。留意那一刻。"],["Round and round, then the perfect moment, then away you go. Be ready to move.","繞了又繞，等到剛好的時機，就出發了。隨時準備好動身。"]]},{"id":"t-pipe-owl-bells","cards":[10,28,21],"order":"seq","text":[["A rumor, a patient wait, and then the good news turns out to be true. Wait for it to be official, then celebrate.","先是傳言，再耐心等一等，最後好消息成真了。等正式確定，再好好慶祝。"],["You hear something, you watch and wait, and then the bells ring. It's real.","妳聽到了一些風聲，靜靜觀察，然後鐘聲響了。是真的。"]]},{"id":"t-goblin-mimic-rogue","cards":[18,25,29],"order":"seq","text":[["A gamble, a trap, and a clever escape. You'll get out of this one, but don't make a habit of it.","賭了一把，掉進陷阱，又聰明地脫身。這次逃得掉，但別養成習慣。"],["Risk, surprise, quick feet. A good story for later, and a lesson for now.","冒險、驚嚇、快腳。以後是個好故事，現在是個教訓。"]]},{"id":"t-iron-pond-grove","cards":[26,17,30],"order":"seq","text":[["You face something deep, it settles, and then you rest. Give yourself the rest. You earned it.","妳面對了一件很深的事，它慢慢平靜下來，然後妳終於能休息。好好休息吧，這是妳應得的。"],["The hard part, the calm after, and a quiet place to heal. All three are coming.","難熬的部分、之後的平靜，還有一個能好好復原的地方。三樣都會來。"]]},{"id":"t-form-mayor-bells","cards":[12,14,21],"order":"seq","topics":["work","money","anything"],"text":[["The papers go in, the person in charge says yes, and there's something to celebrate. Keep your copies.","文件送出去，負責人點頭了，接著就有喜事可以慶祝。影本記得留著。"],["Sign, wait for approval, then ring the bells. This one goes through.","簽好、等核准、然後敲鐘慶祝。這件事會過。"]]}]}};

// Kettlebrook Oracle app: small shared helpers (strings, DOM, storage, sounds).
(function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // English always shows; 中文 is added when <html> has the class zh-on.
  const bi = s => esc(s.en) + '<span class="kb-zh">' + esc(s.zh) + '</span>';
  const biB = s => esc(s.en) + '<span class="kb-zhb">' + esc(s.zh) + '</span>';
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const btn = (cls, html, on) => { const b = el('button', cls, html); b.type = 'button'; if (on) b.onclick = on; return b; };
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, RM ? Math.min(ms, 40) : ms));
  const frame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const zhOn = () => document.documentElement.classList.contains('zh-on');
  const lang = () => (zhOn() ? 'zh' : 'en');
  const fill = (s, v) => ({ en: s.en.replace(/\{(\w+)\}/g, (_, k) => v[k] != null ? (v[k].en != null ? v[k].en : v[k]) : ''),
                           zh: s.zh.replace(/\{(\w+)\}/g, (_, k) => v[k] != null ? (v[k].zh != null ? v[k].zh : v[k]) : '') });

  // ----- storage: the browser's own, which can be missing or full, so every use is wrapped -----
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    ok: (() => { try { localStorage.setItem('kbo-t', '1'); localStorage.removeItem('kbo-t'); return true; } catch (e) { return false; } })(),
  };

  // ----- dates -----
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const DAY = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const WK = ['日', '一', '二', '三', '四', '五', '六'];
  const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const dateText = (d, l) => l === 'zh' ? `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日` : `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;
  const longDate = d => ({ en: `${DAY[d.getDay()]}, ${d.getDate()} ${MONTH[d.getMonth()]}`, zh: `${d.getMonth() + 1} 月 ${d.getDate()} 日，星期${WK[d.getDay()]}` });
  const timeText = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');

  // ----- card sounds, made in the browser (no audio files), as in LENS No. 03 -----
  let AC = null, soundOn = () => true;
  function audio() {
    if (!soundOn()) return null;
    try {
      if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); }
      if (AC.state === 'suspended') AC.resume();
      return AC;
    } catch (e) { return null; }
  }
  function burst(a, t, type, freq, q, vol, attack, decay) {
    const n = Math.ceil(a.sampleRate * (attack + decay * 4)), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(), f = a.createBiquadFilter(), hp = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; f.type = type; f.frequency.value = freq; f.Q.value = q; hp.type = 'highpass'; hp.frequency.value = 220;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay * 4);
    src.connect(f); f.connect(hp); hp.connect(g); g.connect(a.destination); src.start(t); src.stop(t + attack + decay * 4 + 0.02);
  }
  const SFX = {
    wake: audio,
    deal(vol = 0.36) { const a = audio(); if (a) try { burst(a, a.currentTime, 'lowpass', 1600, 0.5, vol, 0.025, 0.11); } catch (e) {} },
    shuffle() {
      const a = audio(); if (!a) return;
      try {
        let t = a.currentTime;
        burst(a, t, 'lowpass', 900, 0.5, 0.09, 0.05, 0.07);
        for (let i = 0; i < 16; i++) { burst(a, t, 'bandpass', 2400 + Math.random() * 900, 1.4, 0.1 + Math.random() * 0.08, 0.002, 0.012); t += 0.017 - i * 0.0006; }
      } catch (e) {}
    },
    setGate(f) { soundOn = f; },
  };

  window.KBU = { esc, bi, biB, el, btn, wait, frame, zhOn, lang, fill, store, dayKey, dateText, longDate, timeText, MONTH, WK, SFX, RM };
})();

// Kettlebrook Oracle: draws a card face or back on the art's own pixel grid. Copied from lens/issue-03/deck/card.js (LENS No. 03); keep the two the same.
// One card = 256 x 384 card pixels (2:3). The art (240 x 360, from deck-art/pixel/) sits in an 8-pixel brass frame;
// the name sits on a cream banner over the bottom of the art. Everything is drawn in code, so all 36 cards match
// and the name follows the reader's language. Scale the canvas up by WHOLE numbers only (see KBCard.fit).
(function () {
  const W = 256, H = 384, AX = 8, AY = 8, AW = 240, AH = 360;
  const C = { // all from the deck's shared palette (deck-art/pixel/_palette.png)
    plum: '#362428', plum2: '#553434', brassD: '#8c6533', brass: '#c29933', brassL: '#f7ce76',
    cream: '#fbefce', cream2: '#dbcaa0', teal: '#2a4843',
  };
  const FONT = '12px Cubic11'; // Cubic 11 (俐方體11號, SIL OFL): a 12-px pixel font with Traditional Chinese

  const rect = (g, x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };

  // Pixel text: draw, then snap every pixel to fully on or off so no blurry edges survive the scale-up.
  function text(g, s, cx, baseline, color) {
    const m = document.createElement('canvas'), mg = m.getContext('2d');
    mg.font = FONT; const tw = Math.ceil(mg.measureText(s).width);
    m.width = tw + 2; m.height = 16; mg.font = FONT; mg.fillStyle = '#000'; mg.textBaseline = 'alphabetic';
    mg.fillText(s, 1, 12);
    const d = mg.getImageData(0, 0, m.width, m.height), p = d.data;
    const [r, gg, b] = [1, 3, 5].map(i => parseInt(color.slice(i, i + 2), 16));
    for (let i = 0; i < p.length; i += 4) { const on = p[i + 3] >= 110; p[i] = r; p[i + 1] = gg; p[i + 2] = b; p[i + 3] = on ? 255 : 0; }
    mg.putImageData(d, 0, 0);
    g.drawImage(m, Math.round(cx - m.width / 2), baseline - 12);
    return tw;
  }

  // A filled pixel disc (for the coins), by rows, so its edge stays stepped.
  function disc(g, cx, cy, r, c) {
    g.fillStyle = c;
    for (let y = -r; y <= r; y++) { const hw = Math.floor(Math.sqrt(r * r - y * y + r * 0.8)); g.fillRect(cx - hw, cy + y, hw * 2 + 1, 1); }
  }
  function coin(g, cx, cy) {
    disc(g, cx, cy, 12, C.plum); disc(g, cx, cy, 11, C.brassD); disc(g, cx, cy - 1, 10, C.brass);
    disc(g, cx, cy, 9, C.brass); rect(g, cx - 4, cy - 9, 7, 1, C.brassL); rect(g, cx - 7, cy - 8, 3, 1, C.brassL);
    rect(g, cx - 8, cy - 7, 1, 3, C.brassL);
  }
  function rivet(g, x, y) { rect(g, x, y, 3, 3, C.plum); rect(g, x, y, 2, 2, C.brassL); }

  // Corner pips, 9 x 9 bitmaps ('#' = plum, 'o' = highlight).
  const PIPS = {
    heart: ['.##...##.', '#oo#.##o#', '#o#######', '#########', '.#######.', '..#####..', '...###...', '....#....', '.........'],
    clover: ['...###...', '..#####..', '.##o####.', '##o#####.', '#########', '.###.###.', '....#....', '...###...', '.........'],
    diamond: ['....#....', '...###...', '..#o###..', '.#o#####.', '#########', '.#######.', '..#####..', '...###...', '....#....'],
    star: ['....#....', '....#....', '...###...', '#########', '.##o####.', '..#####..', '.###.###.', '.##...##.', '.#.....#.'],
  };
  function pip(g, cx, cy, kind) {
    const bm = PIPS[kind]; if (!bm) return;
    bm.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch !== '.') rect(g, cx - 4 + x, cy - 4 + y, 1, 1, ch === 'o' ? C.plum2 : C.plum);
    }));
  }

  function frame(g, bottom) {
    // plum outline with 2-px rounded corners, brass band, highlight top-left, shadow bottom-right
    g.clearRect(0, 0, W, H);
    rect(g, 2, 0, W - 4, H, C.plum); rect(g, 0, 2, W, H - 4, C.plum); rect(g, 1, 1, W - 2, H - 2, C.plum);
    rect(g, 2, 2, W - 4, H - 4, C.brassD);
    rect(g, 3, 3, W - 6, H - 6, C.brass);
    rect(g, 3, 3, W - 6, 1, C.brassL); rect(g, 3, 3, 1, H - 6, C.brassL);
    rect(g, 3, H - 4, W - 6, 1, C.brassD); rect(g, W - 4, 3, 1, H - 6, C.brassD);
    // inner plum line round the art window
    rect(g, AX - 1, AY - 1, AW + 2, (bottom ? AH : AH + 8) + 2, C.plum);
  }

  // card: { n, en, zh, pip } ; art: an Image or canvas of 240 x 360 ; lang: 'en' | 'zh'
  function drawFace(canvas, art, card, lang) {
    canvas.width = W; canvas.height = H;
    const g = canvas.getContext('2d'); g.imageSmoothingEnabled = false;
    frame(g, true);
    g.drawImage(art, AX, AY, AW, AH);
    // name banner: over the bottom of the art, resting on the frame
    const name = lang === 'zh' ? card.zh : card.en;
    g.font = FONT; const tw = Math.ceil(g.measureText(name).width);
    const bw = Math.max(96, tw + 28), bx = Math.round((W - bw) / 2), by = H - 31, bh = 22;
    rect(g, bx, by, bw, bh, C.plum);
    rect(g, bx + 1, by + 1, bw - 2, bh - 2, C.cream);
    rect(g, bx + 1, by + bh - 3, bw - 2, 2, C.cream2);
    rect(g, bx + 1, by + 1, bw - 2, 1, '#ffffff22');
    // little brass studs at the banner's ends
    [bx + 5, bx + bw - 7].forEach(x => { rect(g, x, by + 9, 3, 3, C.plum); rect(g, x, by + 9, 2, 2, C.brass); });
    text(g, name, W / 2, by + 15, C.plum);
    // number coin (top left) and corner pip (top right)
    coin(g, 16, 16); text(g, String(card.n), 16, 21, C.plum);
    if (card.pip) { coin(g, W - 17, 16); pip(g, W - 17, 16, card.pip); }
    rivet(g, 3, H - 6); rivet(g, W - 6, H - 6);
  }

  function drawBack(canvas, art) {
    canvas.width = W; canvas.height = H;
    const g = canvas.getContext('2d'); g.imageSmoothingEnabled = false;
    frame(g, false);
    rect(g, AX, AY, AW, AH + 8, C.teal);       // the back's window is 4 px taller at each end; pad with its teal
    g.drawImage(art, AX, AY + 4, AW, AH);
    [[3, 3], [W - 6, 3], [3, H - 6], [W - 6, H - 6]].forEach(([x, y]) => rivet(g, x, y));
  }

  // Whole-number scale for a box `cssW` wide on this screen: returns { k, cssW, cssH }.
  function fit(cssW, dpr = window.devicePixelRatio || 1) {
    const k = Math.max(1, Math.floor(cssW * dpr / W));
    return { k, cssW: W * k / dpr, cssH: H * k / dpr };
  }
  // Copy a 256 x 384 card canvas into a display canvas at scale k, nearest-neighbour.
  function blowUp(src, dst, k) {
    dst.width = W * k; dst.height = H * k;
    const g = dst.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(src, 0, 0, W * k, H * k);
  }

  window.KBCard = { W, H, C, drawFace, drawBack, fit, blowUp, ready: () => document.fonts.load(FONT, '尋物人Finder') };
})();

// The Kettlebrook Oracle app: the reading engine. One and three cards follow LENS No. 03 exactly
// (lens/issue-03/deck/engine.js, rules in its spreads.json), plus three-card triples; five, nine and 36 cards follow
// claude/kettlebrook-oracle-app-rules.md.
//
//   KBEngine.reading(data, spread, topic, rng?, draw?)
//   data = { deck, spreads (LENS), app (spreads-app.json), phrases, combos (LENS + new) }
//   -> { spread, topic, cards: [n, ...], positions: [...], steps: [{ kind, slots, en, zh }, ...], nouns? }
//
// Every choice is made once and kept in both languages, so the 中文 is always the translation of the English.
(function (root) {
  const head = en => en.split(/\s+/).filter(Boolean).slice(0, 2).join(' ').toLowerCase();
  const GRID = { five: [5, 1], box9: [3, 3], grand36: [9, 4] }; // columns, rows

  function nameIn(card, lang, start) {
    const s = card.name[lang];
    return (lang === 'zh' || start || !s.startsWith('The ')) ? s : 'the ' + s.slice(4);
  }
  // fill(template, lang, { key: card | {en, zh} }): cards become names; {en, zh} objects are pasted as they are.
  function fill(t, lang, vals) {
    for (const key of Object.keys(vals)) {
      const tag = '{' + key + '}', i = t.indexOf(tag), v = vals[key];
      if (i < 0) throw new Error('no ' + tag + ' in: ' + t);
      const start = i === 0 || /[.?!]\s*$/.test(t.slice(0, i));
      let w = v.name ? nameIn(v, lang, start) : v[lang];
      if (!v.name && lang === 'en' && start) w = w[0].toUpperCase() + w.slice(1);
      t = t.replace(tag, w);
    }
    if (/\{\w+\}/.test(t)) throw new Error('unfilled: ' + t);
    return t;
  }

  function reading(data, spread, topic, rng, draw) {
    const { deck, spreads, app, phrases, combos } = data;
    rng = rng || { random: Math.random };
    const choice = list => list[Math.floor(rng.random() * list.length)];
    const sample = (n, k) => {
      const pool = Array.from({ length: n }, (_, i) => i + 1);
      for (let i = 0; i < k; i++) { const j = i + Math.floor(rng.random() * (n - i)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
      return pool.slice(0, k);
    };
    const byn = {}; deck.forEach(c => { byn[c.n] = c; });
    const sp = spreads.spreads[spread] || app.spreads[spread];
    const count = spread === 'grand36' ? 36 : sp.positions.length;
    const cards = draw || sample(deck.length, count);
    const positions = spread === 'grand36' ? cards.map(() => 'house') : sp.positions;
    const steps = [], heads = new Set();
    let tag = null; const T = t => { tag = t; };
    const say = (kind, slots, w, vals) => steps.push({ kind, slots, tag: tag || undefined, en: vals ? fill(w.en, 'en', vals) : w.en, zh: vals ? fill(w.zh, 'zh', vals) : w.zh });
    function pick(opts, past) {
      if (past && opts.some(w => !w.ahead)) opts = opts.filter(w => !w.ahead);
      const fresh = opts.filter(w => !heads.has(head(w.en)));
      const w = choice(fresh.length ? fresh : opts); heads.add(head(w.en)); return w;
    }
    // a frame list, never the same wording twice in one reading
    const usedF = new Set();
    function frame(list) { const fresh = list.filter(w => !usedF.has(w.en)); const w = choice(fresh.length ? fresh : list); usedF.add(w.en); return w; }

    // nouns and tints: one wording per card per reading, so a card keeps its noun from line to line
    const nounOf = {}, tintOf = {};
    const nounW = n => nounOf[n] || (nounOf[n] = choice(phrases[n].noun));
    const tintW = n => tintOf[n] || (tintOf[n] = choice(phrases[n].tint));
    const noun = n => ({ en: nounW(n)[0], zh: nounW(n)[1] });
    const tinted = (n, by) => ({ en: nounW(n)[0] + ' ' + tintW(by)[0], zh: tintW(by)[1] + '的' + nounW(n)[1] });

    // where a slot sits, and which slots touch
    const [cols] = GRID[spread] || [cards.length, 1];
    const rc = i => [Math.floor(i / cols), i % cols];
    function touching(i, j) {
      if (!GRID[spread]) return Math.abs(i - j) === 1;
      const [r1, c1] = rc(i), [r2, c2] = rc(j), dr = Math.abs(r1 - r2), dc = Math.abs(c1 - c2);
      return spread === 'grand36' ? Math.max(dr, dc) === 1 : dr + dc === 1;
    }

    if (spread === 'one' || spread === 'three') {
      const used = new Set();
      positions.forEach((p, slot) => {
        const c = byn[cards[slot]];
        if (rng.random() < spreads.openerChance) {
          const o = choice(spreads.openers[p].filter(x => !used.has(x.en))); used.add(o.en);
          say('opener', [slot], o, { card: c });
        }
        const parts = p === 'one' ? [pick(c.lines[topic]), pick(c.lines.advice)]
                                  : [pick(c.lines[p]), pick(c.lines[topic], p === 'past')];
        parts.forEach(w => say('line', [slot], w));
      });
    } else if (spread === 'five') {
      const F = app.five, n = cards, c3 = byn[n[2]];
      T('theme'); say('opener', [2], frame(F.theme), { card: c3 });
      say('line', [2], pick(c3.lines[topic]));
      T('start'); say('line', [0, 1], frame(F.start), { x: tinted(n[1], n[0]) });
      T('now'); say('line', [1, 2], frame(F.now), { x: tinted(n[2], n[1]) });
      T('next'); say('line', [2, 3], frame(F.next), { x: tinted(n[2], n[3]) });
      T('far'); say('line', [3, 4], frame(F.far), { x: tinted(n[3], n[4]) });

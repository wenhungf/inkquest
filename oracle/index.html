<body>
<div id="app"><p style="padding:40px 20px;text-align:center;color:#cdbf98;font-family:Georgia,serif">The Kettlebrook Oracle…</p></div>
<script>
window.KB_DATA={"deck":[{"n":1,"slug":"finder","pip":"star","image":"01-finder.png","name":{"en":"The Finder","zh":"尋物人"},"core":{"en":"A new journey. Step out with courage.","zh":"新的旅程。鼓起勇氣出發吧。"},"flavor":{"en":"Somebody has to look. Today, it's you.","zh":"總得有人去找。今天，輪到妳了。"},"lines":{"past":[{"en":"A while back, you took a step you were scared of. You took it anyway, and it brought you here.","zh":"不久前，妳踏出了一步。那時候妳很怕，可是妳還是走了，所以妳現在才會在這裡。"},{"en":"You've set off before without a full map. It worked out then, too.","zh":"妳以前也有過沒拿完整地圖就出發的經驗，那次也走到了。"}],"present":[{"en":"You're standing where the road begins. See the lantern? It's already lit.","zh":"妳現在就站在路的起點。看到那盞提燈了嗎？它已經點亮了。"},{"en":"Everyone around you is waiting for someone else to go first. It could be you.","zh":"妳身邊的人都在等別人先動，那個人可以是妳。"}],"future":[{"en":"Something is about to start. It'll look small at first, then grow bigger than you planned.","zh":"有件事快要開始了。一開始看起來不大，之後會比妳計畫的還要大。"},{"en":"There's a road ahead you haven't walked yet, and soon you'll have a reason to walk it.","zh":"前面有一條妳還沒走過的路，很快妳就會找到走上去的理由。"}],"advice":[{"en":"Don't wait until you feel ready. A lantern only lights the next few steps, and that's all you need.","zh":"不用等到覺得自己準備好了。提燈只照得到前面幾步，可是妳也只需要這幾步。"},{"en":"Pack light and leave early. You'll learn the way by walking it.","zh":"行李帶少一點，早點出門。路要邊走才會認得。"}],"love":[{"en":"Is there a message you keep typing and deleting? This card is on the side of the person who presses send.","zh":"有沒有一則訊息，妳打了又刪、刪了又打？這張牌站在按下傳送的那個人這邊。"},{"en":"This is about something new, a new person or a new way of being with the one you have.","zh":"這裡講的是一段新的感情，可能是遇到新的人，也可能是跟現在的人換一種相處方式。"}],"work":[{"en":"There's a new project or role close by. Say yes to the part that scares you a little.","zh":"附近有個新的案子或新的職位。讓妳有點害怕的那部分，就答應下來吧。"},{"en":"The answers you're waiting for won't land on your desk. Go and find them.","zh":"妳在等的答案不會自己送到桌上，得自己去找。"}],"money":[{"en":"It's a good time for a fresh plan with your money, like a new budget or a first small saving.","zh":"現在很適合重新規劃妳的錢，訂個新預算，或是開始存第一筆小小的存款。"},{"en":"Start small, and start this week. The first coin you save matters more than its size.","zh":"從小地方開始，這個禮拜就開始。存下的第一個銅板，比它有多大更重要。"}],"anything":[{"en":"Whatever you asked about, the answer starts when you start moving.","zh":"不管妳問的是什麼，答案都要等妳動起來才會開始出現。"},{"en":"One step will tell you more than a week of wondering.","zh":"走一步，會比想一個禮拜知道得更多。"}]}},{"n":2,"slug":"brass-door","pip":"clover","image":"02-brass-door.png","name":{"en":"The Brass Door","zh":"黃銅門"},"core":{"en":"A challenge with a reward behind it.","zh":"一道關卡，後面有獎賞。"},"flavor":{"en":"Knock, say your name, and see who answers.","zh":"敲門，報上名字，看看誰會來應門。"},"lines":{"past":[{"en":"You stood in front of a closed door a while ago, and you knocked. That took nerve.","zh":"之前妳站在一扇關著的門前，而且妳敲了。那可是需要勇氣的。"},{"en":"Something that looked locked opened once you asked the right way.","zh":"有件看起來鎖死的事，妳換個方式問，結果就開了。"}],"present":[{"en":"There's a round, heavy door in front of you, with bells all around it. It's waiting for you to knock.","zh":"妳面前有一扇又圓又重的門，周圍掛著鈴鐺。它在等妳敲。"},{"en":"What you're facing is hard, and there's something good on the other side.","zh":"妳現在面對的事很難，但門的另一邊有好東西。"}],"future":[{"en":"A challenge is coming. It looks big from outside, but there's a way in.","zh":"接下來會有一道關卡。從外面看很大，不過它有入口。"},{"en":"Soon a door will ask you a question. Answer honestly, and it'll open.","zh":"很快會有一扇門問妳一個問題。老實回答，它就會開。"}],"advice":[{"en":"Knock and say your name. Doors open more often than you'd think.","zh":"敲門，報上妳的名字。門開的機會比妳想的大。"},{"en":"Study the door before you push. There's usually a trick to it.","zh":"推之前先研究一下這扇門，通常都有訣竅。"}],"love":[{"en":"Someone's heart has a door on it. Knock gently, and be honest when they ask who's there.","zh":"有個人的心上有一扇門。輕輕地敲，對方問是誰的時候，老實回答。"},{"en":"There's something to work through in this relationship. What's behind it is worth the effort.","zh":"這段關係有道關卡要過。過了之後，後面的東西值得妳努力。"}],"work":[{"en":"A tough task at work is a test with a prize behind it. Take it on.","zh":"工作上有件難事，其實是個有獎品的考驗。接下這個挑戰吧。"},{"en":"An interview or an exam is coming. Prepare well, then knock with confidence.","zh":"有場面試或考試要來了。好好準備，然後有自信地去敲門。"}],"money":[{"en":"Money that's hard to reach, like a deposit or an old account, can be got back if you follow the right steps.","zh":"有筆不好拿的錢，像是押金或很久沒動的帳戶，照對的步驟走就拿得回來。"},{"en":"The hard work you're putting in has a reward, and it's behind the next door.","zh":"妳正在付出的辛苦是有回報的，就在下一扇門後面。"}],"anything":[{"en":"There's a door on the way forward. Knock.","zh":"前面的路上有一扇門。敲吧。","ahead":1},{"en":"It's harder than it looks, and better than it looks. Go and knock.","zh":"它比看起來難，也比看起來好。去敲門吧。"}]}},{"n":3,"slug":"copper-dragon","pip":"diamond","image":"03-copper-dragon.png","name":{"en":"The Copper Dragon","zh":"銅龍"},"core":{"en":"Someone big wants something. Ask, don't grab.","zh":"有個很有份量的人想要某樣東西。用問的，別用搶的。"},"flavor":{"en":"She didn't ask. They might have said no.","zh":"她沒問。因為問了，大家可能會說不行。"},"lines":{"past":[{"en":"You wanted something badly a while ago, maybe enough to take it without asking. You learned from that.","zh":"之前妳很想要某樣東西，想到差點沒問就拿了。妳從那次學到了。"},{"en":"There was a big personality in your life before. They left a mark, some of it good and some not.","zh":"以前妳身邊有個很強勢的人，對妳有好的影響，也有不好的。"}],"present":[{"en":"There's a dragon on the roof, someone big who wants something. Look at her grin. She's not mean, just used to getting her way.","zh":"屋頂上有隻龍，代表一個很有份量、想要東西的人。看她在笑，她不壞，只是習慣什麼都照她的意思來。"},{"en":"You want something right now, and you want it a lot. Ask for it out loud.","zh":"妳現在很想要一樣東西，想要得不得了。大聲說出來吧。"}],"future":[{"en":"Someone powerful is about to come into the picture. Be polite, and don't be scared.","zh":"接下來會有個有份量的人物出現。有禮貌，但不用怕。"},{"en":"Soon you'll have a chance at something big. Ask for it properly.","zh":"很快妳會有機會得到一樣大東西。用對的方式開口要。"}],"advice":[{"en":"Ask for what you want. Asking takes more courage than taking, and it works better.","zh":"想要什麼就開口要。開口比伸手搶需要更多勇氣，效果也比較好。"},{"en":"Let your pride rest for a day. You'll get more done without it.","zh":"讓妳的驕傲休息一天。少了它，事情反而好辦。"}],"love":[{"en":"Someone with a big personality is interested in you. Enjoy it, but keep your own voice.","zh":"有個個性很強的人對妳有興趣。好好享受，但別失去自己的聲音。"},{"en":"Are you holding on too tightly? Loosen your grip a little and ask what they want.","zh":"妳是不是抓得太緊了？放鬆一點，問問對方想要什麼。"}],"work":[{"en":"A powerful boss or client is around. Show them what you can do, and ask for what you're worth.","zh":"身邊有個強勢的主管或客戶。讓他看到妳的本事，也開口要妳應得的。"},{"en":"Ambition is good right now. Go after the big project, and do it openly.","zh":"現在有野心是好事。去爭取大案子，光明正大地爭取。"}],"money":[{"en":"Ask for the raise or the better price. You might just get it.","zh":"開口要加薪，或要個更好的價錢。說不定就拿到了。"},{"en":"Watch out for buying things just to show them off. A dragon's pile looks grand and does nothing.","zh":"小心那些只為了炫耀才買的東西。龍的寶藏堆看起來很氣派，其實什麼用也沒有。"}],"anything":[{"en":"There's a lot of wanting in this. Say clearly what you want, and you may get it.","zh":"這件事裡有很多『想要』。把妳要的說清楚，說不定就會得到。"},{"en":"Something big is in play. Treat it with respect, and keep your sense of humor.","zh":"有件大事正在進行。認真對待，但也別忘了幽默感。"}]}},{"n":4,"slug":"wizards-tower","pip":"clover","image":"04-wizards-tower.png","name":{"en":"The Wizard's Tower","zh":"法師塔"},"core":{"en":"Knowledge is close. Wisdom takes work.","zh":"知識就在附近，智慧要花力氣。"},"flavor":{"en":"Every book up there was written by someone who didn't know yet.","zh":"上面每一本書，寫書的人當初也都還不懂。"},"lines":{"past":[{"en":"You learned something the hard way a while back. It's paying off now.","zh":"之前妳吃過苦頭才學會一件事，現在派上用場了。"},{"en":"A teacher or a book once changed how you think. You still carry it with you.","zh":"以前有位老師或一本書改變了妳的想法，妳到現在都還帶著。"}],"present":[{"en":"The answer you need is in a book or with someone who knows. See the lit windows? Someone's home.","zh":"妳要的答案在某本書裡，或是在某個懂的人身上。看到那些亮著的窗戶嗎？有人在家。"},{"en":"You're learning something new right now, and it feels slow. That's how learning feels.","zh":"妳現在在學新東西，覺得很慢。學東西本來就是這種感覺。"}],"future":[{"en":"Soon you'll need to learn something new. Start climbing the stairs early.","zh":"接下來妳會需要學新東西。早點開始爬樓梯吧。"},{"en":"A wise person is about to cross your path. Ask them questions.","zh":"很快會遇到一個有智慧的人，多問他問題。"}],"advice":[{"en":"Read one chapter tonight, about anything you're curious about.","zh":"今晚讀一章吧，讀什麼都好，只要是妳好奇的。"},{"en":"Ask the person who's done it before. Wizards like questions.","zh":"去問做過的人。法師喜歡別人問問題。"}],"love":[{"en":"Get to know this person properly. Ask the questions you've been too shy to ask.","zh":"好好認識這個人。那些妳不好意思問的問題，問吧。"},{"en":"This love takes some learning, like how they think and what they need. It's worth the study.","zh":"這段感情需要學一點東西，像是對方怎麼想、需要什麼。值得花時間。"}],"work":[{"en":"A course or a new skill would open doors at work. Start studying.","zh":"去上個課或學個新技能，工作上會多出很多機會。開始讀吧。"},{"en":"Someone senior has the know-how you need. Buy them a coffee and ask.","zh":"有位資深的同事懂妳需要的東西。請他喝杯咖啡，問問看。"}],"money":[{"en":"Learn how your money works before you move it. A little reading saves a lot.","zh":"動妳的錢之前，先搞懂它怎麼運作。讀一點點，可以省很多。"},{"en":"The best investment right now is in what you know.","zh":"現在最好的投資，是投資妳自己的腦袋。"}],"anything":[{"en":"This answer can be learned. Go and find the person or the book that has it.","zh":"這個答案學得到。去找有答案的人或書吧。"},{"en":"You're closer to understanding this than you think. Keep climbing.","zh":"妳離搞懂這件事比妳以為的近。繼續爬。"}]}},{"n":5,"slug":"goose","pip":"star","image":"05-goose.png","name":{"en":"The Goose","zh":"大白鵝"},"core":{"en":"Mischief. Not everything is what it seems, and you'll laugh about it later.","zh":"惡作劇。事情不全是表面那樣，以後妳會笑著講這件事。"},"flavor":{"en":"Sergeant Honk saw everything. He's not telling.","zh":"呱呱中士全都看到了。但他不會說。"},"lines":{"past":[{"en":"Something silly happened a while ago. It annoyed you then, and now it's a good story.","zh":"之前發生過一件蠢事，當下讓妳很火，現在變成很好笑的故事。"},{"en":"Someone played a trick on you once. You've forgiven them, mostly.","zh":"以前有人捉弄過妳。妳大致上已經原諒他了。"}],"present":[{"en":"Look at that goose, marching off with a button in its beak. Something small has gone missing, and someone looks very pleased with themselves.","zh":"看那隻鵝，嘴裡叼著鈕扣大搖大擺地走。有個小東西不見了，而某個人看起來很得意。"},{"en":"There's a little chaos going on right now. It's more silly than serious.","zh":"現在有一點小混亂。好笑的成分多過嚴重。"}],"future":[{"en":"Some mischief is coming. Keep an eye on your buttons, and on your sense of humor.","zh":"接下來會有點小麻煩。顧好妳的鈕扣，也顧好妳的幽默感。"},{"en":"Soon something odd will happen, and the explanation will make you laugh.","zh":"很快會發生一件怪事，等妳知道原因，會忍不住笑出來。"}],"advice":[{"en":"Don't take this too seriously. Honk back if you have to.","zh":"別太認真。必要的話，就對牠嘎回去。"},{"en":"Watch whoever looks too pleased with themselves. They know something.","zh":"注意那個看起來特別得意的人，他知道些什麼。"}],"love":[{"en":"A playful person is around. They might steal more than your buttons.","zh":"身邊有個愛鬧的人。他想偷的，可能不只妳的鈕扣。"},{"en":"A silly misunderstanding will clear up soon, and you'll both laugh.","zh":"你們之間有個好笑的誤會，很快就會解開，到時候兩個人都會笑出來。"}],"work":[{"en":"Someone at work is causing small trouble, probably without meaning harm. Stay calm and keep your things close.","zh":"工作上有人在搞點小麻煩，多半沒有惡意。冷靜一點，東西收好。"},{"en":"Not everything at work is as it seems. Ask one more question before you act.","zh":"公司裡的事，不一定是表面看到的那樣。行動之前，多問一個問題。"}],"money":[{"en":"Small things may go missing, like loose change or a bill you forgot. Check your pockets.","zh":"可能會掉一些小東西，像零錢，或一張忘記繳的帳單。摸摸口袋吧。"},{"en":"A deal looks odd. Find out who's really behind it before you pay.","zh":"有筆交易看起來怪怪的。付錢之前，先搞清楚背後是誰。"}],"anything":[{"en":"There's some mischief in this. You'll laugh about it later.","zh":"這件事有點惡作劇的成分。以後妳會笑著講。"},{"en":"Things aren't quite what they seem, but nothing bad is going on.","zh":"事情跟表面不太一樣，不過沒有什麼壞事發生。"}]}},{"n":6,"slug":"moonlit-path","pip":"heart","image":"06-moonlit-path.png","name":{"en":"The Moonlit Path","zh":"月光小徑"},"core":{"en":"Intuition. Trust your inner sense when the way isn't clear.","zh":"直覺。路看不清楚的時候，相信心裡的感覺。"},"flavor":{"en":"You can't see the whole road. You can see the next step.","zh":"整條路妳看不到，但下一步看得到。"},"lines":{"past":[{"en":"You once followed a hunch when nobody else agreed, and it turned out right.","zh":"以前妳曾經憑感覺做決定，那時候沒人贊成，結果妳是對的。"},{"en":"Not long ago you walked through a dark stretch without a map. The small lights along the way got you through.","zh":"不久前妳走過一段很暗的路，手上也沒有地圖，是靠著路邊那些小小的光走過來的。"}],"present":[{"en":"The road in front of you bends out of sight. See the fireflies along the edge? They're enough to walk by.","zh":"眼前這條路轉個彎就看不到了。妳看路邊那些螢火蟲，靠它們就走得下去。"},{"en":"Your head says one thing and your gut says another. Right now, your gut is worth hearing out.","zh":"妳的腦袋跟直覺各說各的。現在這個時候，直覺的話值得聽完。"}],"future":[{"en":"A choice is coming, and the signpost won't say which way. You'll know when you get there.","zh":"接下來會遇到一個岔路，路標上不會寫答案。走到那裡，妳自然會知道。"},{"en":"Something you can only half see right now will come clear soon, one step at a time.","zh":"現在只看得到一半的事，很快就會一步一步清楚起來。"}],"advice":[{"en":"Don't wait for full daylight. Take the next step you can see, then the one after that.","zh":"不用等到天亮。先走看得到的那一步，再走下一步。"},{"en":"Before you decide, sit quietly for a minute and notice which answer makes your shoulders relax.","zh":"做決定之前，先安靜坐一分鐘，看看哪個答案會讓妳肩膀鬆下來。"}],"love":[{"en":"What does your gut say about this person? You probably knew before you asked.","zh":"妳的直覺怎麼看這個人？其實妳問之前就知道了吧。"},{"en":"Things feel unclear between you, maybe hot one day and cold the next. Go slowly, and watch what they do more than what they say.","zh":"你們之間有些地方看不清楚，可能對方忽冷忽熱。慢慢來，看他做了什麼，會比聽他說了什麼準。"}],"work":[{"en":"The facts aren't all in yet at work. Your sense of who to trust will help more than another spreadsheet.","zh":"工作上資料還沒到齊。這時候妳對人的判斷，會比多做一張表更有用。"},{"en":"You can't see where this job leads in five years, and that's fine. Can you see next month?","zh":"這份工作五年後會走到哪，現在看不到也沒關係。下個月看得到嗎？"}],"money":[{"en":"If a money decision feels wrong, don't agree to it yet, even if you can't explain why.","zh":"跟錢有關的事，感覺不對就先別答應，就算妳說不出為什麼。"},{"en":"You don't need the whole financial plan tonight. Pick the next small step and take it.","zh":"整套理財計畫不用今晚就想好。挑下一個小步驟，去做就好。"}],"anything":[{"en":"You already have a feeling about this. Trust that feeling a little more.","zh":"妳心裡其實已經有感覺了。多相信它一點。"},{"en":"The way isn't clear yet, but there's enough light to walk.","zh":"路還沒有很清楚，但亮度已經夠妳走了。"}]}},{"n":7,"slug":"teacup-storm","pip":"heart","image":"07-teacup-storm.png","name":{"en":"The Teacup Storm","zh":"茶杯裡的風暴"},"core":{"en":"Big feelings over small things. Keep your temper.","zh":"為了小事掀起大情緒。先穩住脾氣。"},"flavor":{"en":"It felt huge. It fit in a teacup.","zh":"當時覺得天要塌了。結果一個茶杯就裝得下。"},"lines":{"past":[{"en":"There was a fuss a while ago that felt enormous at the time. Looking back, it was smaller than it seemed.","zh":"之前有件事鬧得很大，當下覺得很嚴重，現在回頭看，其實沒那麼大。"},{"en":"Someone lost their temper, maybe you. The storm passed, but a few papers are still on the floor.","zh":"之前有人發了脾氣，也許就是妳。風暴過去了，但地上還有幾張紙沒撿起來。"}],"present":[{"en":"Something small is stirring up a lot of feeling right now. See the cloud? It's still inside the cup.","zh":"現在有件小事讓妳心裡很亂。妳看那朵雲，它還在杯子裡。"},{"en":"You're one more annoying message away from saying something you'll regret.","zh":"再多來一則煩人的訊息，妳可能就會說出讓自己後悔的話。"}],"future":[{"en":"A small storm is coming, maybe a misunderstanding or someone's bad mood. It'll blow over faster than you expect.","zh":"接下來會有一場小風暴，可能是誤會，或是某個人心情不好。它過去的速度會比妳想的快。"},{"en":"Soon you'll laugh about something that feels serious now.","zh":"現在覺得很嚴重的事，過不久妳會拿來當笑話講。"}],"advice":[{"en":"Put the lid back on and wait ten minutes before you reply.","zh":"先把蓋子蓋回去，等十分鐘再回。"},{"en":"Ask yourself whether this will matter next week. If it won't, let it rain in the cup.","zh":"問問自己，下禮拜這件事還重要嗎？如果不重要，就讓它在杯子裡下完吧。"}],"love":[{"en":"Is a small argument getting bigger than it should? Say the soft thing first.","zh":"是不是有個小爭執越吵越大了？先說軟一點的那句話吧。"},{"en":"Love is a little stormy right now, but it's a teacup storm. Nobody's leaving over this.","zh":"感情現在有點風雨，不過是茶杯裡的風暴，沒有人會因為這樣就走。"}],"work":[{"en":"Someone at work is making a big deal out of a small thing. Stay calm and let them run out of thunder.","zh":"辦公室裡有人把小事鬧得很大。妳穩住，等他的雷打完就好。"},{"en":"An email is making you angry. Write your answer, then cut the angriest line before you send it.","zh":"有封信讓妳很火大。先把回信寫好，寄出去之前，把最生氣的那句刪掉。"}],"money":[{"en":"A small money worry feels bigger than it is. Write the real number down and look at it.","zh":"有個跟錢有關的小煩惱，感覺比實際上大。把真正的數字寫下來看看。"},{"en":"Don't spend money to calm yourself down today. The mood will pass, and the bill won't.","zh":"今天別用花錢來消氣。心情會過去，帳單可不會。"}],"anything":[{"en":"This is smaller than it feels. Give it a day.","zh":"事情比感覺起來的小。給它一天吧。"},{"en":"It's stirring up a lot of feeling, but the problem itself is small. Let the cloud rain itself out.","zh":"這件事讓妳心裡很亂，但問題本身不大。讓那朵雲自己下完雨吧。"}]}},{"n":8,"slug":"minute-sprite","pip":"diamond","image":"08-minute-sprite.png","name":{"en":"The Minute Sprite","zh":"分鐘精靈"},"core":{"en":"A lucky moment and perfect timing.","zh":"幸運的一刻，時機剛剛好。"},"flavor":{"en":"Blink and you'll miss her. Don't blink.","zh":"一眨眼就錯過她了。所以別眨眼。"},"lines":{"past":[{"en":"A lucky moment came your way a while back, and you caught it.","zh":"之前有個幸運的瞬間經過妳身邊，妳抓住了。"},{"en":"Something once happened at exactly the right time. That wasn't only luck. You were ready.","zh":"以前有件事來得剛剛好。那不只是運氣，是妳準備好了。"}],"present":[{"en":"See the sprite racing round the clock? A lucky minute is passing right now. Don't blink.","zh":"看到那個繞著時鐘跑的小精靈嗎？幸運的那一分鐘正在經過。別眨眼。"},{"en":"Your timing is good at the moment. If you've been waiting to act, this is it.","zh":"妳現在的時機很好。如果妳一直在等出手的機會，就是現在。"}],"future":[{"en":"A small gift is coming, quick and unexpected. Keep your eyes open.","zh":"接下來會有一份小禮物，來得又快又突然。眼睛睜大一點。"},{"en":"Soon the timing will line up for you. Be ready to move fast.","zh":"很快時機就會對上。準備好馬上行動。"}],"advice":[{"en":"When a good chance comes this week, say yes quickly. Small luck doesn't wait.","zh":"這禮拜有好機會出現，就快點答應。小小的好運不會等人。"},{"en":"Keep a little time free. Luck needs somewhere to land.","zh":"留一點空閒時間。好運也需要地方降落。"}],"love":[{"en":"Right place, right time. A lucky meeting could happen out of nowhere.","zh":"對的地方，對的時間，一場幸運的相遇可能突然就發生。"},{"en":"Send the message today. Your timing is better than you think.","zh":"今天就傳訊息吧。妳的時機比妳以為的好。"}],"work":[{"en":"A lucky break at work is close. Speak up when the moment comes.","zh":"工作上的好運快來了。時機到的時候，記得開口。"},{"en":"Good timing is on your side. Pitch the idea now.","zh":"時機站在妳這邊。現在就把點子提出來。"}],"money":[{"en":"A small windfall is possible, like a refund or a lucky find.","zh":"可能會有一筆小小的意外之財，也許是退款，也許是在路上撿到的好運。"},{"en":"A good price will appear for a short time. If you really need the thing, grab it.","zh":"會有個好價錢出現一下下。如果妳真的需要，就把握住。"}],"anything":[{"en":"Luck is passing close by. Reach out and catch it.","zh":"好運正從旁邊經過。伸手抓住它。"},{"en":"The timing is right, or about to be. Watch the clock.","zh":"時機對了，或是快對了。注意看時鐘。","ahead":1}]}},{"n":9,"slug":"sword-and-shield","pip":"clover","image":"09-sword-and-shield.png","name":{"en":"The Sword and Shield","zh":"劍與盾"},"core":{"en":"Strength and protection in balance. Steady courage.","zh":"力量和保護都要有，勇氣要穩穩的。"},"flavor":{"en":"One to step forward. One to keep what matters safe.","zh":"一個用來往前，一個用來護住重要的東西。"},"lines":{"past":[{"en":"You stood up for yourself not long ago, and you also knew when to stop. That's rare.","zh":"不久前妳替自己出了頭，也知道什麼時候該收手。這不容易。"},{"en":"Something once made you build walls. They kept you safe then.","zh":"以前有件事讓妳築起了牆，那時候它們保護了妳。"}],"present":[{"en":"The sword and shield are on the wall, by a warm fire. You're ready, and you're resting.","zh":"劍和盾掛在牆上，旁邊是暖暖的爐火。妳準備好了，也正在休息。"},{"en":"Something you care about needs defending. Do it calmly.","zh":"現在有件妳在乎的事需要妳去捍衛。冷靜地做。"}],"future":[{"en":"A moment is coming when you'll need to stand firm. You'll be steadier than you expect.","zh":"接下來會有需要妳站穩的時候，妳會比自己想的還穩。"},{"en":"Soon you can lower the shield a little and let someone in.","zh":"很快妳就可以把盾放低一點，讓人走近。"}],"advice":[{"en":"Speak up for yourself, then stop. You don't need to win every point.","zh":"替自己說話，說完就停。不用每一點都要贏。"},{"en":"Protect your time and energy this week. Say no once, kindly.","zh":"這禮拜顧好妳的時間跟精力。客氣地拒絕一次吧。"}],"love":[{"en":"Are you holding your shield up too high? Someone kind is trying to get close.","zh":"妳的盾是不是舉得太高了？有個溫柔的人想靠近妳。"},{"en":"A good relationship protects you both. Stand up for each other.","zh":"好的關係會保護你們兩個。互相撐腰吧。"}],"work":[{"en":"Stand your ground on something at work, politely and with facts.","zh":"有件公事，妳要堅持立場，態度客氣，但要拿出事實。"},{"en":"Guard your team and your time. Not every request needs a yes.","zh":"顧好妳的團隊和時間。不是每個要求都得答應。"}],"money":[{"en":"Protect what you've saved. Keep an emergency fund before you take any risks.","zh":"保護好妳存下來的錢。冒任何險之前，先留一筆緊急預備金。"},{"en":"Be brave about one money decision you've been avoiding, and careful with everything else.","zh":"對一個妳一直逃避的金錢決定勇敢一點，其他的就小心一點。"}],"anything":[{"en":"Whatever you asked about, you can face it. You're better armed than you think.","zh":"不管妳問什麼，妳都應付得來。妳手上的裝備比妳以為的多。"},{"en":"Balance is the answer here. Be brave where it counts and careful everywhere else.","zh":"這裡的答案是平衡。該勇敢的地方勇敢，其他地方小心。"}]}},{"n":10,"slug":"speaking-pipe","pip":"clover","image":"10-speaking-pipe.png","name":{"en":"The Speaking Pipe","zh":"傳聲管"},"core":{"en":"News and rumors. Listen, then check.","zh":"消息跟傳言。先聽，再查證。"},"flavor":{"en":"Down here, I hear everything.","zh":"在這底下，我什麼都聽得到。"},"lines":{"past":[{"en":"Something you heard a while ago turned out to be only half true.","zh":"之前妳聽到的某件事，後來發現只對了一半。"},{"en":"A message once reached you at just the right time. It changed your plans.","zh":"以前有則訊息來得剛剛好，改變了妳的計畫。"}],"present":[{"en":"News is drifting up the pipe right now. Some of it is true, and some of it is just noise.","zh":"現在有消息從管子飄上來。有些是真的，有些只是雜音。"},{"en":"Someone wants to tell you something but hasn't found the words. Listen closely.","zh":"有人想跟妳說一件事，只是還不知道怎麼開口。仔細聽。"}],"future":[{"en":"A message is on its way. Read it twice before you answer.","zh":"有則訊息正在路上。回覆之前先讀兩遍。"},{"en":"Soon you'll hear a rumor. Check it before you pass it on.","zh":"很快妳會聽到一個傳言。轉述之前先查一下。"}],"advice":[{"en":"Before you react to what you heard, ask where it came from.","zh":"聽到什麼先別急著反應，問問這消息是從哪來的。"},{"en":"Send the message you've been putting off. Someone is waiting at the other end.","zh":"把妳一直拖著沒傳的訊息傳出去吧。另一頭有人在等。"}],"love":[{"en":"Don't believe what others say about this person. Ask them yourself.","zh":"別人怎麼說這個人，先別信。自己去問他。"},{"en":"A message from someone you care about is coming. Answer it warmly.","zh":"妳在乎的人會傳訊息來。回得溫暖一點。"}],"work":[{"en":"Office rumors are flying. Wait for the official word before you worry.","zh":"公司裡傳言滿天飛。等正式消息出來再擔心也不遲。"},{"en":"Important news from work is coming through. Keep your ears open in meetings.","zh":"工作上有重要消息要傳過來了。開會的時候耳朵豎起來。"}],"money":[{"en":"A money tip is going around. Check it carefully before you put a cent in.","zh":"有支明牌在流傳。投錢之前，先仔細查清楚。"},{"en":"Watch for a message about money, a bill or a refund. Read the details.","zh":"注意一則跟錢有關的通知，可能是帳單，也可能是退款。細節要看清楚。"}],"anything":[{"en":"The answer will reach you as a message. Keep listening.","zh":"答案會以訊息的方式來找妳。繼續聽。"},{"en":"You'll hear a lot about this soon. Keep what's true and let the rest float away.","zh":"很快妳會聽到很多關於這件事的話。真的留下，其他的就讓它飄走。"}]}},{"n":11,"slug":"soggy-boot","pip":"heart","image":"11-soggy-boot.png","name":{"en":"The Soggy Boot","zh":"濕靴子旅店"},"core":{"en":"Rest and good company.","zh":"休息，還有一群好朋友。"},"flavor":{"en":"Wipe your feet. Then sit down and stay a while.","zh":"腳擦一擦，坐下來，多待一會兒。"},"lines":{"past":[{"en":"Friends carried you through something not so long ago. You may not have thanked them properly yet.","zh":"不久前有朋友陪妳撐過一段，妳可能還沒好好謝謝他們。"},{"en":"There was a warm table in your past, with soup and laughter. You still carry some of that warmth.","zh":"以前有過一張很溫暖的餐桌，有熱湯，也有笑聲。那份溫暖妳到現在還帶在身上。"}],"present":[{"en":"You're tired, and that's allowed. Come in out of the rain for a while.","zh":"妳累了，累是可以的。先進來躲一下雨吧。"},{"en":"Look at that table. Someone is saving you a seat right now.","zh":"妳看那張桌子，現在就有人幫妳留了位子。"}],"future":[{"en":"A good evening with friends is coming, the kind you'll talk about later.","zh":"接下來會有一個跟朋友一起度過的好夜晚，是那種之後會一直提起的。"},{"en":"Soon someone will open their door to you. Say yes when they do.","zh":"很快會有人對妳敞開大門。到時候就答應吧。"}],"advice":[{"en":"Call a friend tonight, not about anything, just to talk.","zh":"今晚打給一個朋友吧，不用有什麼事，聊聊就好。"},{"en":"Rest before you push on. Even heroes stop at the inn.","zh":"繼續趕路之前先休息。連英雄都會在旅店停下來。"}],"love":[{"en":"This love grows out of friendship. The person who makes you laugh at the table might be the one.","zh":"這裡的愛情是從友情慢慢變來的。在餐桌上逗妳笑的那個人，說不定就是了。"},{"en":"Have you two had any easy time together lately, with no plans and no phones?","zh":"你們最近有沒有好好一起放鬆過？不排行程，也不滑手機。"}],"work":[{"en":"Your best help at work comes from the people around you. Have lunch with the team.","zh":"工作上最能幫妳的，就是身邊這些人。找同事一起吃個午餐吧。"},{"en":"You've been working without a break. A real rest now will save you a week later.","zh":"妳一直在工作，都沒停過。現在好好休息一下，之後可以省下一整個禮拜。"}],"money":[{"en":"Money spent on good company is rarely wasted. Just don't buy too many rounds.","zh":"花在好朋友身上的錢，很少是浪費的。只是請客別請太多輪。"},{"en":"A friend may know about a job or a good deal. Ask around.","zh":"朋友可能知道什麼工作機會或好康，問問看吧。"}],"anything":[{"en":"You don't have to handle this alone. Bring it to the table.","zh":"這件事不用一個人扛。拿到桌上，大家一起想。"},{"en":"This is a card for rest. Sit down and warm up. The answer will still be there tomorrow.","zh":"這是休息的牌。先坐下來暖暖身子，答案明天還會在。"}]}},{"n":12,"slug":"signed-form","pip":"clover","image":"12-signed-form.png","name":{"en":"The Signed Form","zh":"簽好的表格"},"core":{"en":"An agreement or a promise. Read before you sign.","zh":"一份協議或一個承諾。簽之前先看清楚。"},"flavor":{"en":"Sign here. And here. And here.","zh":"這裡簽名。還有這裡。還有這裡。"},"lines":{"past":[{"en":"You signed up for something a while back, and it still shapes your days.","zh":"之前妳答應了某件事，到現在還影響著妳每天的生活。"},{"en":"A deal you made in the past turned out better than you feared.","zh":"以前談好的一個約定，結果比妳擔心的好。"}],"present":[{"en":"Someone is holding out a form. Before you take the pen, read every line.","zh":"有人正把一張表格遞過來。拿筆之前，每一行都讀一遍。"},{"en":"An agreement is being made right now. Make sure you know what you're saying yes to.","zh":"現在正在談一個約定。確定妳清楚自己答應的是什麼。"}],"future":[{"en":"Paperwork is coming, a contract or a promise in writing. It's mostly good.","zh":"接下來會有文件要處理，可能是合約，也可能是白紙黑字的承諾。大致上是好事。"},{"en":"Soon something becomes official. Get ready to sign.","zh":"很快就會有件事正式定下來。準備好簽名吧。"}],"advice":[{"en":"Read the small print. Then read it again, out loud.","zh":"小字要看。看完再唸出來一次。"},{"en":"Write the promise down, even a simple one. It helps everyone remember.","zh":"把約定寫下來，就算很簡單也好。這樣大家都記得。"}],"love":[{"en":"Are you both clear about what you've promised each other? Say it out loud.","zh":"你們答應過彼此什麼，兩個人都清楚嗎？說出來吧。"},{"en":"Your relationship is becoming more official, maybe moving in together or meeting the family.","zh":"這段感情正在變得更正式，可能要同居了，或是要見家人了。"}],"work":[{"en":"A contract or a job offer is coming. Read every line, and ask about anything unclear.","zh":"有份合約或錄取通知要來了。每一行都看，不清楚的地方就問。"},{"en":"Get it in writing. A spoken promise at work is easy to forget.","zh":"要留下書面紀錄。工作上口頭答應的事，很容易被忘掉。"}],"money":[{"en":"Read the terms before you sign up, especially the fees and the cancellation rules.","zh":"簽之前看清楚條款，尤其是手續費跟解約規定。"},{"en":"An agreement about money is coming. It's fair, as long as you read it.","zh":"有份跟錢有關的協議要來了。只要妳有好好看，它是公平的。"}],"anything":[{"en":"It all comes down to an agreement. Know what you're agreeing to.","zh":"說到最後，就是一個約定。弄清楚妳答應的是什麼。"},{"en":"Sign once you're sure.","zh":"確定了再簽。"}]}},{"n":13,"slug":"kobold-tunnel","pip":"clover","image":"13-kobold-tunnel.png","name":{"en":"The Kobold Tunnel","zh":"狗頭人地道"},"core":{"en":"A sudden change. Surprises from below.","zh":"突如其來的變化。底下冒出來的驚喜。"},"flavor":{"en":"Sorry! Wrong hole.","zh":"抱歉！挖錯洞了。"},"lines":{"past":[{"en":"Something popped up out of nowhere a while ago and shook things up. You handled it.","zh":"之前有件事突然冒出來，把一切搞亂了。妳還是處理好了。"},{"en":"A surprise in your past turned out to be less scary than it looked.","zh":"以前有個意外，後來發現沒有看起來那麼可怕。"}],"present":[{"en":"Something just popped out of the ground. Look at the kobold's face. It's as surprised as you are.","zh":"有東西剛從地底下冒出來。看看狗頭人的表情，牠跟妳一樣嚇一跳。"},{"en":"Things are moving under the surface right now. You can feel the ground shift a little.","zh":"現在底下有東西在動，妳感覺得到地面在微微晃。"}],"future":[{"en":"A surprise is coming, sudden but harmless. It may even be funny.","zh":"接下來會有個意外，來得突然，但不會傷人，說不定還很好笑。"},{"en":"Plans may change at short notice. Keep a little room in your week.","zh":"計畫可能會臨時變動。這禮拜的行程留一點空。"}],"advice":[{"en":"Stay flexible this week. When something pops up, laugh first, then deal with it.","zh":"這禮拜保持彈性。有東西冒出來的時候，先笑，再處理。"},{"en":"Look under the surface. Something is going on that nobody's talking about.","zh":"往底下看看。有件事正在發生，只是沒人提。"}],"love":[{"en":"Someone may pop up unexpectedly, an old friend or a new face.","zh":"可能會有人突然出現，也許是老朋友，也許是新面孔。"},{"en":"There are feelings under the surface. Ask gently what's really going on.","zh":"底下藏著一些感覺。溫柔地問問到底怎麼了。"}],"work":[{"en":"A sudden change at work is coming. It's messier than it is dangerous.","zh":"公司可能會突然有變動。亂是亂了點，但不危險。"},{"en":"Something's happening behind the scenes at work. You'll hear about it soon.","zh":"公司裡有件事在檯面下進行，妳很快就會知道。"}],"money":[{"en":"Expect a surprise cost, a small one. Keep a little cash aside for it.","zh":"可能會有一筆意外的支出，不大。先留一點錢備著。"},{"en":"Money might turn up from an unexpected place.","zh":"錢可能會從意想不到的地方冒出來。"}],"anything":[{"en":"Expect a surprise. It won't be a bad one.","zh":"準備好被嚇一跳吧，不會是壞事。"},{"en":"Something's digging under the surface. When it pops out, be ready to laugh.","zh":"有東西在底下挖。等它冒出來的時候，準備好笑出來。"}]}},{"n":14,"slug":"mayor","pip":"clover","image":"14-mayor.png","name":{"en":"The Mayor","zh":"鎮長"},"core":{"en":"Authority and decisions. A kind no beats a weak yes.","zh":"權威與決定。溫和的拒絕，好過勉強的答應。"},"flavor":{"en":"The bells aren't mine to give.","zh":"那些鐘不是我可以送人的。"},"lines":{"past":[{"en":"Someone in charge said no to you a while ago. It may have protected you.","zh":"之前有個主事的人拒絕了妳。那可能是在保護妳。"},{"en":"You made a hard decision not long ago, and you were fair about it.","zh":"不久前妳做了一個很難的決定，而且做得很公平。"}],"present":[{"en":"Look at the mayor's raised hand, calm and firm. Someone needs to hear a gentle no, and it might have to come from you.","zh":"看鎮長舉起的手，平靜又堅定。現在有人需要聽到一句溫和的拒絕，那句話可能要由妳來說。"},{"en":"A decision is in someone else's hands right now. Be patient and polite.","zh":"現在決定權在別人手上。要有耐心，也要有禮貌。"}],"future":[{"en":"Soon you'll make a decision that affects other people too. Be kind, and be clear.","zh":"接下來妳要做的決定也會影響別人。要溫和，也要清楚。"},{"en":"Someone in charge is about to answer you. Even if it's no, it'll be a fair no.","zh":"有個有權決定的人快要回覆妳了。就算是拒絕，也會是公平的。"}],"advice":[{"en":"Say no to one thing this week, kindly and clearly.","zh":"這禮拜拒絕一件事，溫和但清楚地說。"},{"en":"Go to the person who decides, and ask them directly.","zh":"去找能做決定的人，直接問。"}],"love":[{"en":"Saying no to what you don't want leaves room for what you do want.","zh":"拒絕妳不要的，才有空間留給妳想要的。"},{"en":"An older person's opinion matters here, maybe a parent or a wise friend. Listen, then decide for yourself.","zh":"這裡有長輩的意見要考慮，可能是爸媽，或某個有智慧的朋友。聽完，再自己決定。"}],"work":[{"en":"A boss or a client is making a decision. Give them what they need to decide well.","zh":"主管或客戶正在做決定。給他們做出好決定需要的東西。"},{"en":"You may need to turn down a request. Do it with a smile and a reason.","zh":"妳可能得拒絕一個請求。帶著微笑，也說明原因。"}],"money":[{"en":"Say no to the purchase you're only half sure about.","zh":"只有一半確定的東西，就別買了。"},{"en":"Paperwork or a government office has a say in your money. Be patient with them.","zh":"有份文件或某個公家單位會決定妳的錢。對他們要有耐心。"}],"anything":[{"en":"Someone has to decide here. If it's you, decide kindly.","zh":"這裡總要有人做決定。如果是妳，就溫和地決定。"},{"en":"A clear no would help here more than another maybe.","zh":"這裡一句清楚的拒絕，比再多一個『也許』有用。"}]}},{"n":15,"slug":"lost-and-found","pip":"diamond","image":"15-lost-and-found.png","name":{"en":"The Lost-and-Found","zh":"失物招領處"},"core":{"en":"Forgotten things come back. Old truths resurface.","zh":"忘記的東西會回來，以前的事也會浮上來。"},"flavor":{"en":"Nothing is really lost. It's just waiting to be claimed.","zh":"沒有東西真的弄丟了。只是在等人來領。"},"lines":{"past":[{"en":"Something you lost a while ago, a thing or a friend, is still out there somewhere.","zh":"之前妳弄丟的東西，不管是物品還是朋友，都還在某個地方。"},{"en":"There's something in your past you forgot about. It hasn't forgotten you.","zh":"妳過去有件事已經忘了，不過它可沒忘了妳。"}],"present":[{"en":"Look at that great heap, everything ever lost, each with a little tag. Something of yours is in there.","zh":"看那一大堆，每樣弄丟的東西都綁著小標籤。裡面有一樣是妳的。"},{"en":"An old memory or an old truth is coming back up. Let it.","zh":"一段舊回憶，或一件以前的事，正浮上來。讓它浮上來吧。"}],"future":[{"en":"Something you gave up on is about to come back to you.","zh":"妳已經放棄的東西，快要回到妳手上了。"},{"en":"Soon you'll find something you didn't know you were looking for.","zh":"很快妳會找到一樣東西，連妳自己都不知道一直在找它。"}],"advice":[{"en":"Go through that drawer or that old box. Something useful is hiding in there.","zh":"去翻翻那個抽屜或舊箱子吧，有用的東西藏在裡面。"},{"en":"Get back in touch with someone you lost track of.","zh":"跟一個斷了聯絡的人重新聯絡吧。"}],"love":[{"en":"An old flame or an old feeling may come back. Decide calmly whether to claim it.","zh":"舊情人或舊的感覺可能會回來。冷靜想想要不要把它領回來。"},{"en":"Something you've forgotten about each other is worth finding again, like the first time you laughed together.","zh":"你們之間有些被遺忘的東西值得找回來，像是你們第一次一起大笑的樣子。"}],"work":[{"en":"An old skill or an old contact is useful again. Dig it out.","zh":"一項以前的技能或一個舊的人脈又派上用場了，把它找出來。"},{"en":"An old project or idea could come back to life. Don't throw out your notes.","zh":"一個舊案子或舊點子可能會復活。筆記先別丟。"}],"money":[{"en":"Look for forgotten money, like an old account or a gift card you never used.","zh":"找找被遺忘的錢，像是很久沒用的帳戶，或忘了用的禮物卡。"},{"en":"Money someone owes you may finally come back.","zh":"別人欠妳的錢，可能終於要還了。"}],"anything":[{"en":"The answer may be something you already had and forgot.","zh":"答案可能是妳早就有、只是忘了的東西。"},{"en":"Nothing is gone for good. Check the lost-and-found.","zh":"沒有什麼是永遠不見的。去失物招領處看看吧。"}]}},{"n":16,"slug":"shapeshift","pip":"star","image":"16-shapeshift.png","name":{"en":"The Shapeshift","zh":"變形"},"core":{"en":"Change and adapt. Let your wild side play, and stay yourself.","zh":"改變，然後適應。讓狂野的那一面出來玩，但妳還是妳。"},"flavor":{"en":"Sometimes the right answer is: become a goose.","zh":"有時候，正確答案是：變成一隻鵝。"},"lines":{"past":[{"en":"You changed a lot a while ago, more than people noticed. It suited you.","zh":"之前妳變了很多，比別人注意到的還多。那樣的妳很好看。"},{"en":"Once you had to become someone new to get through something. You did it.","zh":"以前有一次，妳得變成另一個樣子才撐得過去。妳做到了。"}],"present":[{"en":"You're halfway through a change right now, with feathers everywhere. It feels strange, and it's working.","zh":"妳現在正變到一半，羽毛到處飛。感覺很怪，但是有效。"},{"en":"Life is asking you to try a new shape. Have fun with it.","zh":"生活要妳試試新的樣子。玩得開心一點。"}],"future":[{"en":"A change is coming that will feel more like play than work.","zh":"接下來的改變，感覺起來會比較像在玩，不太像在工作。"},{"en":"Soon you'll find a new side of yourself, wilder and freer.","zh":"很快妳會發現自己新的一面，更野，也更自由。"}],"advice":[{"en":"Try something completely unlike you this week, and see how it feels.","zh":"這禮拜試一件完全不像妳會做的事，看看感覺如何。"},{"en":"Change the plan if you need to. Keep the heart of it.","zh":"需要的話就改計畫，但核心要留著。"}],"love":[{"en":"Let your playful side out. Surprise them.","zh":"放出妳愛玩的那一面吧，給對方一個驚喜。"},{"en":"You can change a little for someone, but keep your own feathers.","zh":"為了一個人可以改變一點，但要留著自己的羽毛。"}],"work":[{"en":"Your role at work is changing. Grow into it, and keep what makes you good at it.","zh":"妳在工作上的角色正在改變。慢慢適應，同時留住讓妳出色的地方。"},{"en":"A creative approach will solve a stuck problem. Think like a goose.","zh":"用有創意的方式，就能解決卡住的問題。像鵝一樣想想看。"}],"money":[{"en":"Update your budget to fit the life you have now.","zh":"把預算調整成符合妳現在的生活。"},{"en":"A new way to earn could suit you. Try it on, like a new shape.","zh":"有種新的賺錢方式可能很適合妳。像試新造型一樣，穿上看看。"}],"anything":[{"en":"It's time to change shape a little. Enjoy it.","zh":"現在是稍微換個樣子的時候了。好好享受吧。"},{"en":"Sometimes the answer is to become something else for a while, then come back as yourself.","zh":"有時候答案是暫時變成別的樣子，然後再變回自己。"}]}},{"n":17,"slug":"still-pond","pip":"star","image":"17-still-pond.png","name":{"en":"The Still Pond","zh":"平靜池塘"},"core":{"en":"Clarity. The truth shows when you stop stirring the water.","zh":"清明。不再攪動的時候，真相就會浮現。"},"flavor":{"en":"Wait for the ripples to settle.","zh":"等漣漪平靜下來。"},"lines":{"past":[{"en":"A quiet time a while ago helped you see what you really wanted.","zh":"之前一段安靜的日子，讓妳看清楚自己真正想要什麼。"},{"en":"Once you waited for things to calm down before deciding. It was the right call.","zh":"以前有一次，妳等事情平靜下來才做決定。那次妳做對了。"}],"present":[{"en":"Things are calm enough right now to see clearly. Look at the pond. Even the moon shows in it.","zh":"現在夠平靜，可以看得很清楚。看那個池塘，連月亮都映在上面。"},{"en":"You've been stirring the water, asking and worrying. Stop for a moment and let it clear.","zh":"妳一直在攪水，一直問，一直擔心。停一下，讓水清下來。"}],"future":[{"en":"Soon things will settle, and the answer will be easy to see.","zh":"很快事情就會平靜下來，答案會清清楚楚。"},{"en":"A peaceful stretch is coming. Rest in it.","zh":"接下來會有一段平靜的日子。好好在裡面休息。"}],"advice":[{"en":"Do nothing about this for one day. Watch what becomes clear.","zh":"這件事先放一天，什麼都不做，看看什麼會變清楚。"},{"en":"Find a quiet place, even for ten minutes, and let your thoughts settle.","zh":"找個安靜的地方，十分鐘也好，讓思緒沉澱下來。"}],"love":[{"en":"Stop analysing every message. When you're calm, you'll see how they really feel.","zh":"別再分析每一則訊息了。等妳靜下來，就會看出對方真正的感覺。"},{"en":"A calm, gentle love is here, or near. It doesn't need drama.","zh":"一段平靜溫柔的感情就在這裡，或就在附近。它不需要什麼戲劇性。"}],"work":[{"en":"Too many voices at work are stirring things up. Step back and the answer will show.","zh":"辦公室裡太多聲音在攪局。退一步，答案就會浮出來。"},{"en":"Things at work are about to settle down. Use the quiet to plan.","zh":"手上的工作快要穩定下來了。趁安靜的時候好好計畫。","ahead":1}],"money":[{"en":"Don't make money decisions while you're upset. Wait until you're calm.","zh":"心情不好的時候，別做跟錢有關的決定。等冷靜下來再說。"},{"en":"Look at all your money calmly, in one place. It's clearer than you fear.","zh":"冷靜地把所有的錢放在一起看。情況比妳擔心的清楚。"}],"anything":[{"en":"Stop stirring. Give it a quiet day, then look again.","zh":"先別再攪了。給它安靜的一天，再回來看。"},{"en":"The answer is already there. Be still for a moment, and you'll see it.","zh":"答案其實已經在那裡了。安靜一下，妳就會看到。"}]}},{"n":18,"slug":"goblins-gambit","pip":"diamond","image":"18-goblins-gambit.png","name":{"en":"The Goblin's Gambit","zh":"哥布林的賭注"},"core":{"en":"Risk and reward. A clever gamble.","zh":"風險與報酬。一場聰明的賭注。"},"flavor":{"en":"Six pies. Three goblins. One very bad plan.","zh":"六個派。三隻哥布林。一個很爛的計畫。"},"lines":{"past":[{"en":"You took a chance a while ago. Some of it paid off, and some of it got messy.","zh":"之前妳賭過一把。有的贏了，有的就弄得一身狼狽。"},{"en":"A risky plan in your past taught you what you're good at, and what you're not.","zh":"以前一個冒險的計畫，讓妳知道自己擅長什麼、不擅長什麼。"}],"present":[{"en":"Look at that goblin running off with the pies, grinning. You're tempted by a bold move right now too.","zh":"看那隻哥布林抱著派跑走，笑得多開心。妳現在也很想放手一搏。"},{"en":"There's a gamble on the table. The reward is real, and so is the custard.","zh":"桌上有個賭注。獎賞是真的，弄得一身奶油也是真的。"}],"future":[{"en":"A chance is coming that needs some nerve. Take it if you can afford to lose a little.","zh":"接下來會有個需要膽量的機會。如果輸一點也沒關係，就試試看。"},{"en":"Soon a clever idea will tempt you. Slow down and make sure it holds up.","zh":"很快會有個聰明的點子吸引妳。慢下來看清楚，確定它真的站得住腳。"}],"advice":[{"en":"Take the risk, but only with what you can afford to lose.","zh":"可以冒險，但只拿輸得起的部分去賭。"},{"en":"Make a backup plan before you run. Goblins never do, and look at them.","zh":"跑之前先想好備案。哥布林從來不想，妳看看他們的下場。"}],"love":[{"en":"Take a chance on love. Ask them out, or say the bold thing.","zh":"在感情上賭一把吧，約對方出來，或說出那句大膽的話。"},{"en":"Is a risky romance tempting you? Go slowly. Have fun without betting everything.","zh":"是不是有段冒險的感情在誘惑妳？慢慢來。可以玩得開心，但別把全部都押上去。"}],"work":[{"en":"A bold idea at work could pay off. Test it small before you go big.","zh":"妳有個大膽的工作點子，可能會成功。先小規模試試，再慢慢放大。"},{"en":"Someone at work is offering a risky shortcut. Ask what happens if it fails.","zh":"有同事提了一條冒險的捷徑。先問問看，失敗的話會怎樣。"}],"money":[{"en":"A money gamble is on offer. Only play with what you won't miss.","zh":"眼前有個賭錢的機會。只拿少了也不會心疼的錢去玩。"},{"en":"A little risk is fine, but this plan has too many goblins in it. Count the pies first.","zh":"冒點險沒關係，但這個計畫裡哥布林太多了。先數清楚有幾個派。"}],"anything":[{"en":"There's a gamble in this. Weigh it, then decide with a grin.","zh":"這件事裡有賭的成分。先掂掂輕重，再笑著決定。"},{"en":"The reward is worth a small risk. A big one, maybe not.","zh":"為了這個獎賞冒點小險是值得的。大險就不一定了。"}]}},{"n":19,"slug":"cracked-mirror","pip":"heart","image":"19-cracked-mirror.png","name":{"en":"The Cracked Mirror","zh":"裂開的鏡子"},"core":{"en":"An illusion breaks, and you see yourself more clearly.","zh":"幻象破了，妳把自己看得更清楚。"},"flavor":{"en":"Through the crack, you look like you again.","zh":"從裂縫看進去，妳又像妳自己了。"},"lines":{"past":[{"en":"Something you believed about yourself cracked a while ago. It hurt, but you liked what you saw underneath.","zh":"之前妳對自己的某個想法裂開了。那時候很痛，但妳喜歡裂縫底下看到的自己。"},{"en":"You used to try very hard to look a certain way for other people. That's behind you now.","zh":"以前妳很努力想在別人眼裡維持某個樣子。那已經過去了。"}],"present":[{"en":"An image you've been holding up is starting to crack. See the light coming through? That's the real you.","zh":"妳一直撐著的那個形象開始裂了。看到透進來的光嗎？那才是真正的妳。"},{"en":"Someone just told you an honest thing, or you told yourself one. It's uncomfortable, and it's useful.","zh":"最近有人跟妳說了一句老實話，也可能是妳自己對自己說的。聽了不舒服，但有用。"}],"future":[{"en":"Soon something that looked perfect will show a crack. You'll be glad you saw it early.","zh":"過陣子，某個看起來很完美的東西會露出裂縫。妳會慶幸自己早點看到。"},{"en":"You're about to see yourself more kindly than you do now.","zh":"過不久，妳看自己的眼光會比現在溫柔。"}],"advice":[{"en":"Stop polishing the glass. Let people see your real face, crack and all.","zh":"別再擦那面鏡子了。讓大家看到真正的妳，連裂縫一起。"},{"en":"Ask one person you trust what they honestly see in you, and listen.","zh":"找一個妳信任的人，問他老實說怎麼看妳，然後好好聽。"}],"love":[{"en":"Are you seeing this person as they are, or as you hoped they'd be?","zh":"妳看到的是他本來的樣子，還是妳希望他變成的樣子？"},{"en":"You don't have to be perfect to be loved. Let them see the crack.","zh":"不用完美也會被愛。讓對方看到妳的裂縫吧。"}],"work":[{"en":"A role you've been playing at work doesn't fit anymore. What would you do if you stopped pretending?","zh":"妳在工作上演的那個角色已經不合身了。如果不用再裝，妳會想做什麼？"},{"en":"A plan that looked shiny has a flaw in it. Better to find it now than after launch.","zh":"有個看起來很漂亮的計畫藏著問題。現在找到，總比上線之後才發現好。"}],"money":[{"en":"Something that looks like a great deal has a crack in it. Look closer before you pay.","zh":"有個看起來很划算的東西其實有裂縫。付錢之前再看仔細一點。"},{"en":"Be honest about what you spend just to look good. The real you might want something cheaper.","zh":"老實看看，有多少錢只是花在讓自己看起來不錯。真正的妳，可能想要便宜一點的東西。"}],"anything":[{"en":"The truth is showing through the crack, and it's kinder than you feared.","zh":"真相正從裂縫透出來，而且比妳擔心的溫柔。"},{"en":"An illusion is breaking, and that's good news. You'll see more clearly once it's gone.","zh":"有個幻象正在破掉，這是好事。等它不在了，妳會看得更清楚。"}]}},{"n":20,"slug":"odd-sock","pip":"heart","image":"20-odd-sock.png","name":{"en":"The Odd Sock","zh":"落單的襪子"},"core":{"en":"A parting or a missing piece. What's gone may turn up again.","zh":"分開，或是少了一塊。不見的東西，說不定還會回來。"},"flavor":{"en":"Somewhere, its other half is looking too.","zh":"它的另一半，也在某個地方找它。"},"lines":{"past":[{"en":"Something went missing a while ago, or someone left. You've learned to live with the gap.","zh":"之前有東西不見了，或是有人走了，妳也慢慢習慣那個空位。"},{"en":"There was a pair once, and it came apart. One of you stayed on the line.","zh":"以前本來是一對的，後來分開了，只剩一隻還掛在繩子上。"}],"present":[{"en":"Something in your life doesn't match right now. One piece is here, and its partner isn't.","zh":"現在妳的生活裡，有樣東西湊不成對，一隻在這裡，另一隻不知道去哪了。"},{"en":"You're waiting for something to come back, and you keep checking the line.","zh":"妳在等某樣東西回來，一直忍不住回頭看那條繩子。"}],"future":[{"en":"Something you've missed is on its way back, though maybe not where you left it.","zh":"妳想念的東西正在回來的路上，只是不一定會出現在妳放它的地方。"},{"en":"A gentle goodbye is coming. It frees a peg, and leaves room for something new.","zh":"接下來會有一次溫和的告別。繩子上會空出一個夾子，留給新的東西。"}],"advice":[{"en":"Keep the other sock for now. Some things come back. Others teach you to stop waiting.","zh":"另一隻襪子先留著吧。有些東西會回來，有些則會教妳別再等了。"},{"en":"Leave one peg free, so whatever's missing has somewhere to come back to.","zh":"留一個空夾子，讓不見的東西有地方回來。"}],"love":[{"en":"Is there someone you still miss? This card doesn't say the story is over.","zh":"有沒有一個妳還想念的人？這張牌沒說你們的故事已經結束。"},{"en":"Love feels far away here, by miles or by silence. Someone may be waiting for you to speak first.","zh":"這段感情有點遠，可能隔著距離，也可能隔著沉默。對方說不定在等妳先開口。"}],"work":[{"en":"Something at work is missing, maybe a teammate who left or an answer nobody gave you. Tell your boss what you need. Nobody will know unless you say it.","zh":"工作上好像少了什麼，可能是離職的同事，也可能是一直沒人給妳的答案。跟主管說妳缺什麼吧，不講沒人會知道。"},{"en":"You may be doing a two-person job alone for a while. It won't last forever.","zh":"妳可能得一個人做兩個人的事，撐上一陣子。不過不會一直這樣的。"}],"money":[{"en":"Look for money that's gone missing, like a refund you never claimed or a subscription you forgot to cancel.","zh":"找找看有沒有不見的錢，像是忘了申請的退款，或忘了取消的訂閱。"},{"en":"A small loss now may find its way back later, from somewhere you didn't expect.","zh":"現在的小損失，之後可能會從意想不到的地方回來。"}],"anything":[{"en":"Look again for the thing you lost. Socks always turn up in the wash eventually.","zh":"再找一次那個不見的東西吧。襪子最後總會在洗衣機裡出現。"},{"en":"Not everything needs its match. Wear odd socks one day. Nobody will notice.","zh":"不是每樣東西都要配成對。哪天穿兩隻不一樣的襪子出門，也沒人會發現。"}]}},{"n":21,"slug":"five-bells","pip":"heart","image":"21-five-bells.png","name":{"en":"The Five Bells","zh":"五姊妹鐘"},"core":{"en":"Good news and a reason to celebrate.","zh":"好消息，還有值得慶祝的事。"},"flavor":{"en":"Dora, Dot, Delia, Dinah, and Big Doris. All together now.","zh":"朵拉、朵特、蒂莉亞、黛娜，還有大朵莉絲。大家一起響！"},"lines":{"past":[{"en":"There was good news a while back that you didn't stop to celebrate. It still counts.","zh":"之前有個好消息，妳忙到沒停下來慶祝。現在補慶祝也算數。"},{"en":"The bells rang for you once, and people came. You have more friends than you think.","zh":"以前有一次鐘聲為妳響起，大家都來了。妳的朋友比妳以為的多。"}],"present":[{"en":"Listen. Can you hear the bells? Good news is already on its way to you.","zh":"仔細聽，有沒有聽到鐘聲？好消息已經在來的路上了。"},{"en":"Something is worth celebrating right now, even if it feels small to you.","zh":"現在就有值得慶祝的事，就算妳覺得它很小。"}],"future":[{"en":"A happy message is coming, maybe an invitation, maybe a yes.","zh":"接下來會收到開心的消息，也許是一張邀請函，也許是一聲『好』。"},{"en":"Soon there'll be a reason to get everyone together.","zh":"很快就會有理由把大家找來聚一聚。"}],"advice":[{"en":"Share your good news out loud. Let the bells ring.","zh":"有好消息就大聲說出來，讓鐘聲響吧。"},{"en":"Plan a party, even a small one. Something good deserves a little noise.","zh":"辦個慶祝吧，小小的也好。好事值得熱鬧一下。"}],"love":[{"en":"Good news in love is close. They may say yes, or you may have something to tell everyone.","zh":"感情上的好消息快到了。可能是對方點頭，也可能有件事可以跟大家宣布了。"},{"en":"Is there someone you'd like to celebrate with? Tell them so.","zh":"有沒有一個妳想一起慶祝的人？跟他說吧。"}],"work":[{"en":"News from work is coming, and it's good. It may be the result you've been waiting for.","zh":"工作上有消息要來了，是好消息，說不定就是妳一直在等的結果。"},{"en":"Your team did something worth celebrating. Make sure people hear about it.","zh":"妳的團隊做了一件值得慶祝的事。記得讓大家知道。"}],"money":[{"en":"Money news is on the way, the good kind, maybe a payment or a small win.","zh":"跟錢有關的消息要來了，是好的那種，可能是一筆款項，也可能是個小小的意外之財。","ahead":1},{"en":"You can afford a small celebration. Enjoy it without counting every coin.","zh":"小小慶祝一下的錢妳是有的。好好享受，不用每個銅板都算。"}],"anything":[{"en":"Whatever you asked about, the bells are ringing yes.","zh":"不管妳問什麼，鐘聲響的都是『好』。"},{"en":"Good news is coming. Keep your ears open, and your phone charged.","zh":"好消息要來了。耳朵張開，手機記得充電。"}]}},{"n":22,"slug":"rune-stone","pip":"star","image":"22-rune-stone.png","name":{"en":"The Rune Stone","zh":"符文石"},"core":{"en":"Old wisdom with a new meaning. Learn from the past.","zh":"老智慧有了新意思。從過去學點東西吧。"},"flavor":{"en":"Someone wrote this for you a long time ago.","zh":"很久以前，有人為妳寫下了這些。"},"lines":{"past":[{"en":"Something your grandparents or an old teacher said has stayed with you.","zh":"爺爺奶奶或某位老師說過的一句話，一直留在妳心裡。"},{"en":"There's a lesson from long ago that you didn't understand then. You're starting to now.","zh":"很久以前有個道理，那時候妳不懂，現在開始懂了。"}],"present":[{"en":"See the glowing marks on the stone? An old saying fits your situation better than any new advice.","zh":"看到石頭上發光的紋路嗎？一句老話，比任何新建議都更適合妳現在的狀況。"},{"en":"You're reading old signs in a new way right now. Trust what you see.","zh":"現在妳正用新的眼光看舊的東西。相信妳看到的。"}],"future":[{"en":"Soon you'll understand something from your past that never made sense before.","zh":"很快，妳會弄懂過去一件一直想不通的事。"},{"en":"An old tradition or an old place will mean something new to you.","zh":"一個老傳統或一個老地方，對妳會有新的意義。"}],"advice":[{"en":"Ask an older person what they would do. Then decide for yourself.","zh":"問問長輩會怎麼做，然後再自己決定。"},{"en":"Look back at your old notes or photos. There's an answer in there.","zh":"翻翻以前的筆記或照片吧，答案就在裡面。"}],"love":[{"en":"What did your past relationships teach you? Use it here.","zh":"妳以前的感情教了妳什麼？用在這裡吧。"},{"en":"An old-fashioned gesture, like a handwritten note, would mean a lot right now.","zh":"一個老派的舉動，像手寫的小卡，現在會很有意義。"}],"work":[{"en":"The old way of doing something at work has its reasons. Learn it before you change it.","zh":"工作上的老方法自有它的道理。先學會，再去改。"},{"en":"Someone who's been there for years knows the answer. Ask them.","zh":"有個待了很多年的人知道答案。問他吧。"}],"money":[{"en":"Old money advice still works. Spend less than you earn, and save something every month.","zh":"老一輩的理財建議到現在還是有用：花的比賺的少，每個月存一點。"},{"en":"Something old may be worth more than you think. Have a look before you throw it out.","zh":"某樣舊東西可能比妳以為的值錢。丟掉之前先看一看。"}],"anything":[{"en":"Someone has faced this before. Find out what they did.","zh":"以前就有人遇過這件事了。去看看他們怎麼做。"},{"en":"The old answer still works. You just have to read it in your own words.","zh":"老答案還是管用，只是要用妳自己的話去讀它。"}]}},{"n":23,"slug":"claim-ticket","pip":"diamond","image":"23-claim-ticket.png","name":{"en":"The Claim Ticket","zh":"認領單"},"core":{"en":"The past comes back. Unfinished business can end well.","zh":"過去回來了。沒做完的事，可以好好收尾。"},"flavor":{"en":"It waited for you. All this time.","zh":"它一直在等妳。等了這麼久。"},"lines":{"past":[{"en":"You left something unfinished a long time ago. You've been carrying the ticket ever since.","zh":"很久以前妳有件事沒做完。從那時候起，那張單子一直在妳身上。"},{"en":"Something from your childhood still matters to you, and that's fine.","zh":"小時候的某樣東西，對妳到現在都還很重要。這沒什麼不好。"}],"present":[{"en":"Someone is sliding a ticket through the little brass flap. Something from your past is ready to be picked up.","zh":"有人把一張單子從小小的黃銅投遞口塞進去。妳過去的某樣東西，已經可以領回來了。"},{"en":"An old matter needs closing. Now is a good time.","zh":"有件舊事需要收尾，現在正是好時機。"}],"future":[{"en":"Something you thought was gone forever is about to come back, safe and sound.","zh":"妳以為永遠不見的東西，就快完好無缺地回來了。"},{"en":"Soon you'll get a chance to finish what you started, and finish it well.","zh":"很快妳就有機會把當初開始的事做完，而且做得很好。"}],"advice":[{"en":"Find the ticket. Make the call or send the letter you've been meaning to.","zh":"找出那張單子。打那通電話，或寄出那封一直想寄的信。"},{"en":"Go back for what you left behind. It's still yours.","zh":"回去拿妳留下的東西吧，它還是妳的。"}],"love":[{"en":"Someone from your past may get in touch. It's a chance to end things kindly, or to start again.","zh":"過去的某個人可能會聯絡妳。這是好好告別的機會，也可能是重新開始的機會。"},{"en":"Is there something you never said to someone? It's not too late.","zh":"有沒有一句話，妳一直沒跟某個人說？現在還不算太晚。"}],"work":[{"en":"An unfinished project is waiting. Pick it back up. You know more now.","zh":"有個沒做完的案子在等妳。把它撿起來吧，妳現在懂得更多了。"},{"en":"Someone from an old job may come back with an offer.","zh":"以前公司的人可能會帶著機會回來找妳。"}],"money":[{"en":"Claim what's yours, like a deposit or a refund you never collected.","zh":"把該拿的拿回來，像是押金，或一直沒領的退款。"},{"en":"An old money matter can be settled now. Settle it.","zh":"一件跟錢有關的舊事，現在可以解決了。去解決吧。"}],"anything":[{"en":"The past has something to give back. Go and claim it.","zh":"過去有東西要還給妳。去領吧。"},{"en":"Unfinished business can end well. This is your chance.","zh":"沒做完的事，也能有好的結局。這就是妳的機會。"}]}},{"n":24,"slug":"clockwork-clerk","pip":"clover","image":"24-clockwork-clerk.png","name":{"en":"The Clockwork Clerk","zh":"發條書記"},"core":{"en":"Routine and discipline. Do it properly.","zh":"規律跟自律。事情要好好做完。"},"flavor":{"en":"Name. Item. Date lost. Next, please.","zh":"姓名。物品。遺失日期。下一位。"},"lines":{"past":[{"en":"A habit you built a while back is still holding things together.","zh":"之前妳養成的一個習慣，到現在還撐著很多事。"},{"en":"You once did something slowly and carefully, and it never needed fixing.","zh":"以前妳曾經慢慢地、仔細地做好一件事，後來完全不用修。"}],"present":[{"en":"Right now, the boring jobs matter. File the papers and answer the emails.","zh":"現在無聊的事很重要。把文件歸檔，把信回掉。"},{"en":"See the little clerk stamping away? Steady work is getting you further than you think.","zh":"看那個一直在蓋章的小書記。穩穩地做，比妳以為的走得更遠。"}],"future":[{"en":"A busy stretch is coming. A good routine will carry you through it.","zh":"接下來會有一段很忙的日子。好的作息會帶妳撐過去。"},{"en":"Soon a small system you set up will save you a lot of trouble.","zh":"很快，妳之前設好的一個小系統會幫妳省下很多麻煩。"}],"advice":[{"en":"Make a list, do the first item and cross it off. Then do the next.","zh":"列個清單，做完第一項就劃掉，再做下一項。"},{"en":"Do the same small thing at the same time every day this week.","zh":"這禮拜每天同一個時間，做同一件小事。"}],"love":[{"en":"Love grows from small, steady habits, like a good-morning message or a walk every week.","zh":"感情靠的是小小的固定習慣，像是早安訊息，或每個禮拜一起散步。"},{"en":"Are you both doing your share of the everyday jobs? Talk about it before it gets tense.","zh":"家裡的日常瑣事，你們兩個分得公平嗎？在吵起來之前先聊聊。"}],"work":[{"en":"Get organized at work. Tidy files and clear notes will make you look like a wizard.","zh":"工作上整理一下。檔案整齊、筆記清楚，別人會以為妳會魔法。"},{"en":"Accuracy matters this week. Check the numbers twice.","zh":"這禮拜準確很重要，數字要核對兩次。"}],"money":[{"en":"Track every expense for a month. It's boring, and it's very useful.","zh":"記一個月的帳，每一筆都記。很無聊，但很有用。"},{"en":"Set up an automatic saving, even a small one, and let it run.","zh":"設定自動轉帳存款，小額也好，然後就讓它跑。"}],"anything"  Check before you click or pay.","zh":"小心詐騙跟『免費』的好康。點連結或付錢之前，先查一下。"},{"en":"A bargain might hide extra costs. Look inside the suitcase first.","zh":"便宜貨可能藏著額外的費用。先看看行李箱裡面。"}],"anything":[{"en":"Something here isn't quite what it looks like. Look closer.","zh":"這裡有個地方跟表面看到的不太一樣。看仔細一點。"},{"en":"It's probably harmless, but check before you reach in.","zh":"它大概沒有惡意，但伸手之前還是先確認。"}]}},{"n":26,"slug":"iron-door","pip":"star","image":"26-iron-door.png","name":{"en":"The Iron Door","zh":"圓鐵門"},"core":{"en":"Going deeper. Facing what you locked away changes you.","zh":"往更深處走。面對被妳鎖起來的東西，會改變妳。"},"flavor":{"en":"Fifty years behind this door. Ready?","zh":"這扇門後面，關了五十年。準備好了嗎？"},"lines":{"past":[{"en":"You locked something away a long time ago because it was too much then.","zh":"很久以前妳把某件事鎖起來，因為那時候它太沉重了。"},{"en":"You once went somewhere deep inside yourself and came back stronger.","zh":"以前有一次，妳走到自己心裡很深的地方，回來的時候更堅強了。"}],"present":[{"en":"You're at the bottom of the stairs, in front of a heavy door, and blue light is leaking round the edges. Something behind it wants to be seen.","zh":"妳站在樓梯最底下，面前是一扇很重的門，藍光從門縫透出來。門後有東西想被看見。"},{"en":"Something you've been avoiding is asking for your attention, gently.","zh":"有件妳一直在逃避的事，正輕輕地要妳注意它。"}],"future":[{"en":"Soon you'll be ready to open a door you've kept shut. It's less scary than you think.","zh":"很快妳就會準備好，打開一扇一直關著的門。它沒有妳想的可怕。"},{"en":"A deeper conversation is coming, and you'll come out of it better.","zh":"接下來會有一場更深的對話。聊完之後，妳會變得更好。"}],"advice":[{"en":"Open the door a crack. You don't have to walk all the way in today.","zh":"把門打開一條縫就好，今天不用整個走進去。"},{"en":"Take someone with you when you go down those stairs, a friend or a counselor.","zh":"走下那些樓梯的時候，帶個人一起，朋友或諮商師都好。"}],"love":[{"en":"There's something you two haven't talked about. Open that door, gently.","zh":"你們之間有件事一直沒聊。輕輕地把那扇門打開吧。"},{"en":"This love goes deep. Let them see the part you usually keep locked.","zh":"這段感情很深。讓對方看看妳平常鎖起來的那一面。"}],"work":[{"en":"A problem at work goes deeper than

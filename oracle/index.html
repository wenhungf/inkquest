<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#132624">
<meta name="description" content="A 36-card oracle deck in cozy 16-bit pixel art, with readings in plain English and Chinese.">
<title>The Kettlebrook Oracle · 凱托溪神諭卡</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oracle">
<style>
/* Kettlebrook Oracle app: the reading table. Copied from lens/issue-03/deck/oracle.css (LENS No. 03); app changes are in app.css. */
.kb{
  --kb-plum:#362428; --kb-plum2:#553434; --kb-night:#231519; --kb-brass:#c29933; --kb-brassL:#f7ce76; --kb-brassD:#8c6533;
  --kb-cream:#fbefce; --kb-cream2:#dbcaa0; --kb-teal:#2a4843; --kb-acc:#7c5cff;
  --kb-paper:#fffdf8; --kb-ink:#2b2723; --kb-ink2:#615a52; --kb-rule:#e2d8c6;
  --kb-disp:var(--disp,"Fraunces Variable","Fraunces",Georgia,"Noto Serif TC",serif);
  --kb-sans:var(--sans,"DM Sans","Helvetica Neue",Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif);
  --kb-han:var(--han,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif);
  font-family:var(--kb-sans); color:var(--kb-ink); line-height:1.5; -webkit-tap-highlight-color:transparent;
}
.kb *{box-sizing:border-box}
.kb [hidden]{display:none!important}
.kb button{font:inherit; color:inherit; cursor:pointer}
.kb :focus-visible{outline:2.5px solid var(--kb-brassL); outline-offset:2px; border-radius:4px}
.kb-zh,.kb-zhb{display:none; font-family:var(--kb-han); letter-spacing:0}
.zh-on .kb-zh{display:inline; margin-left:.45em}
.zh-on .kb-zhb{display:block}

.kb-box{border-radius:14px; overflow:hidden; background:var(--kb-night); box-shadow:0 10px 30px rgba(43,25,30,.22)}

/* ---------- the cloth ---------- */
.kb-table{position:relative; aspect-ratio:2/1; min-height:340px; width:100%; overflow:hidden; background:#4a2420 center/cover no-repeat}
.kb-table::after{content:""; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 90px 20px rgba(20,8,14,.55)}
@media (max-width:619px){ .kb-table{aspect-ratio:1/1; min-height:0} }

.kb-card{position:absolute; left:0; top:0; width:var(--cw,140px); aspect-ratio:2/3; padding:0; border:0; background:none;
  perspective:900px; transition:transform .5s cubic-bezier(.2,.8,.25,1), translate .35s ease, filter .35s ease; will-change:transform}
.kb-card:disabled{cursor:default}
.kb-flip{position:absolute; inset:0; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.3,.7,.3,1)}
.kb-card.is-up .kb-flip{transform:rotateY(180deg)}
.kb-card canvas{position:absolute; inset:0; width:100%; height:100%; display:block; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:2.2%; box-shadow:0 5px 9px rgba(20,5,20,.5); transition:box-shadow .35s ease}
.kb-card .kb-face{transform:rotateY(180deg)}
.kb-card.is-up:not(:disabled):hover{filter:brightness(1.06)}

/* picking out the card that is talking: lift it and dim the rest */
.kb-card.is-talk{translate:0 -6%}
.kb-card.is-talk canvas{box-shadow:0 16px 20px rgba(20,5,20,.55)}
.kb-card.is-quiet{filter:brightness(.55) saturate(.8)}

/* ---------- the panel under the cloth ---------- */
.kb-panel{background:var(--kb-night); color:var(--kb-cream); padding:20px 22px 22px; position:relative}
.kb-ask p{margin:0 0 10px; font-family:var(--kb-disp); font-size:20px; line-height:1.35}
.kb-ask p .kb-zhb{font-size:15px; color:var(--kb-cream2); margin-top:2px}
.kb-sub{font:500 12px/1.3 var(--kb-sans)!important; letter-spacing:.09em; text-transform:uppercase; color:var(--kb-cream2); margin:16px 0 8px!important}
.kb-sub .kb-zh{text-transform:none; letter-spacing:0}
.kb-chips{display:flex; flex-wrap:wrap; gap:8px}
.kb-chip{border:1.5px solid var(--kb-brassD); background:transparent; color:var(--kb-cream)!important; border-radius:999px; padding:8px 15px; font-size:15px; font-weight:500; min-height:42px}
.kb-chip[aria-checked=true]{background:var(--kb-brass); border-color:var(--kb-brassL); color:var(--kb-plum)!important}
.kb-btn{border:0; border-radius:999px; padding:11px 22px; font-weight:700; font-size:16px; min-height:46px; background:var(--kb-brassL); color:var(--kb-plum)!important; box-shadow:0 2px 0 var(--kb-brassD)}
.kb-btn:active{transform:translateY(1px); box-shadow:0 1px 0 var(--kb-brassD)}
.kb-btn.kb-ghost{background:transparent; color:var(--kb-cream)!important; box-shadow:inset 0 0 0 1.5px var(--kb-brassD)}
.kb-row{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:18px}
.kb-busy{font-family:var(--kb-disp); font-style:italic; font-size:19px; color:var(--kb-cream2); min-height:5.2em; display:flex; align-items:center}

.kb-say{min-height:9.6em; display:flex; flex-direction:column; cursor:pointer}
.zh-on .kb-say{min-height:14em}
.kb-who{font:500 12px/1.3 var(--kb-sans); letter-spacing:.09em; text-transform:uppercase; color:var(--kb-brassL); margin-bottom:8px}
.kb-who .kb-zh{text-transform:none; letter-spacing:0}
.kb-line{margin:0; font-family:var(--kb-disp); font-size:22px; line-height:1.4; animation:kb-in .35s ease both}
.kb-line.kb-zhb{font-family:var(--kb-han); font-size:16.5px; line-height:1.7; color:var(--kb-cream2); margin-top:8px}
@keyframes kb-in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.kb-foot{margin-top:auto; padding-top:14px; display:flex; align-items:center; justify-content:space-between; gap:12px}
.kb-count{font-size:13px; color:var(--kb-cream2); font-variant-numeric:tabular-nums; white-space:nowrap}
.kb-timer{position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.06)}
.kb-timer i{display:block; height:100%; width:100%; background:var(--kb-acc); transform-origin:left; animation:kb-run linear both}
@keyframes kb-run{from{transform:scaleX(0)} to{transform:scaleX(1)}}
.kb-done p{margin:0; font-size:15px; color:var(--kb-cream2)}
@media (max-width:619px){ .kb-panel{padding:16px 16px 18px} .kb-line{font-size:19px} .kb-ask p{font-size:18px} }

/* ---------- the whole reading, on paper ---------- */
.kb-full{margin-top:18px; background:var(--kb-paper); border:1px solid var(--kb-rule); border-radius:14px; padding:22px 24px 8px}
.kb-full h3{margin:0; font-family:var(--kb-disp); font-weight:600; font-size:26px; line-height:1.2}
.kb-meta{margin:4px 0 6px; font-size:14px; color:var(--kb-ink2)}
.kb-sec{display:flex; gap:16px; padding:16px 0; border-top:1px solid var(--kb-rule)}
.kb-thumbs{flex:none; width:76px; position:relative}
.kb-thumb{display:block; width:76px; padding:0; border:0; background:none; border-radius:3px}
.kb-thumb canvas{display:block; width:100%; height:auto; border-radius:2px; box-shadow:0 3px 6px rgba(43,25,30,.3)}
.kb-pair .kb-thumb{width:54px}
.kb-pair .kb-thumb + .kb-thumb{margin:-58px 0 0 22px; position:relative}
.kb-lab{font:500 12px/1.3 var(--kb-sans); letter-spacing:.09em; text-transform:uppercase; color:var(--kb-brassD)}
.kb-lab .kb-zh{text-transform:none; letter-spacing:0}
.kb-sec h4{margin:2px 0 6px; font-family:var(--kb-disp); font-weight:600; font-size:20px; line-height:1.25}
.kb-sec h4 .kb-zh{font-weight:500; font-size:.85em; color:var(--kb-ink2)}
.kb-sec p{margin:0; font-size:16.5px; line-height:1.6}
.kb-sec p.kb-zhb{font-size:15px; line-height:1.75; color:var(--kb-ink2); margin-top:6px; border-left:2px solid var(--kb-brass); padding-left:10px}
@media (max-width:619px){ .kb-full{padding:18px 16px 4px} .kb-thumbs,.kb-thumb{width:60px} .kb-pair .kb-thumb{width:44px} .kb-pair .kb-thumb + .kb-thumb{margin:-48px 0 0 16px} }

/* readings the reader kept */
.kb-kept{align-items:center; gap:10px}
.kb-kept-open{flex:1; min-width:0; display:flex; align-items:center; gap:16px; padding:4px; border:0; background:none; text-align:left; border-radius:8px}
.kb-kept-open:hover{background:rgba(194,153,51,.1)}
.kb-kept-cards{display:flex; gap:5px; flex:none}
.kb-kept-cards canvas{display:block; width:44px; height:auto; border-radius:2px; box-shadow:0 2px 5px rgba(43,25,30,.3)}
.kb-kept-info{display:flex; flex-direction:column; gap:3px; min-width:0}
.kb-kept-names{font-family:var(--kb-disp); font-weight:600; font-size:17px; line-height:1.3}
.kb-kept-names .kb-zhb{font-family:var(--kb-han); font-weight:400; font-size:14px; color:var(--kb-ink2)}
.kb-kept-x{flex:none; border:1.5px solid var(--kb-rule); background:none; border-radius:999px; padding:7px 13px; font-size:13.5px; color:var(--kb-ink2)!important; min-height:40px}
.kb-full :focus-visible{outline-color:var(--kb-brassD)}
.kb-btn:disabled{opacity:.6; cursor:default; box-shadow:inset 0 0 0 1.5px var(--kb-brassD)}
@media (max-width:619px){ .zh-on .kb-h2l .kb-zh{display:block; margin:2px 0 0; font-size:.8em} .zh-on .kb-kept-info .kb-lab .kb-zh{display:block; margin:2px 0 0} .kb-kept{flex-wrap:wrap} .kb-kept-open{flex-basis:100%; gap:12px} .kb-kept-cards canvas{width:34px} .kb-kept-x{margin-left:auto; min-height:36px; padding:5px 12px} }

/* ---------- one card, full size ---------- */
.kb-view{position:fixed; inset:0; z-index:1000; background:#1c0f14; color:var(--kb-cream); overflow-y:auto; overscroll-behavior:contain;
  padding:max(14px,env(safe-area-inset-top)) 16px 84px; animation:kb-fade .2s ease both}
@keyframes kb-fade{from{opacity:0} to{opacity:1}}
.kb-v-in{display:flex; flex-direction:column; align-items:center; gap:18px; max-width:1000px; margin:34px auto 0}
.kb-v-card{display:block; image-rendering:crisp-edges; image-rendering:pixelated; flex:none; filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.kb-v-txt{max-width:440px; width:100%}
.kb-v-txt .kb-lab{color:var(--kb-brassL); margin-top:18px}
.kb-v-txt h3{margin:4px 0 8px; font-family:var(--kb-disp); font-weight:600; font-size:28px; line-height:1.2}
.kb-v-txt h3 .kb-zh{font-size:.8em; font-weight:500; color:var(--kb-cream2)}
.kb-v-txt p{margin:6px 0 0; font-size:17px; line-height:1.6}
.kb-v-txt p.kb-zhb{font-size:15px; line-height:1.75; color:var(--kb-cream2)}
.kb-v-txt p.kb-flavor{font-family:var(--kb-disp); font-style:italic; color:var(--kb-cream2); margin-top:10px}
.kb-v-x{position:fixed; top:max(10px,env(safe-area-inset-top)); right:12px; width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.1); color:var(--kb-cream)!important; font-size:24px; line-height:1; z-index:2}
.kb-v-nav{position:fixed; left:0; right:0; bottom:0; padding:10px 16px max(12px,env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:center; gap:18px;
  background:linear-gradient(transparent, rgba(28,15,20,.95) 40%)}
.kb-v-nav button{width:46px; height:46px; border-radius:50%; border:1.5px solid var(--kb-brassD); background:rgba(28,15,20,.8); color:var(--kb-cream)!important; font-size:22px; line-height:1}
.kb-v-nav button:disabled{opacity:.3; cursor:default}
.kb-v-dots{display:flex; gap:8px}
.kb-v-dots i{width:8px; height:8px; border-radius:50%; background:var(--kb-brassD)}
.kb-v-dots i.on{background:var(--kb-brassL)}
@media (min-width:900px){ .kb-v-in{flex-direction:row; align-items:flex-start; justify-content:center; gap:44px; margin-top:5vh} .kb-v-txt{padding-top:10px} .kb-v-txt .kb-lab:first-child{margin-top:0} }

@media (prefers-reduced-motion:reduce){
  .kb-card,.kb-flip,.kb-card canvas{transition-duration:.01s}
  .kb-line,.kb-view{animation:none}
}

/* Kettlebrook Oracle app: the shell (deep teal and gold, from the card back) and changes to the LENS reading table. */
@font-face{font-family:"Fraunces Variable";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/fraunces-latin-full-normal.woff2) format("woff2")}
@font-face{font-family:"Fraunces Variable";font-style:italic;font-weight:100 900;font-display:swap;src:url(fonts/fraunces-latin-full-italic.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:400;font-display:swap;src:url(fonts/dm-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:500;font-display:swap;src:url(fonts/dm-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:700;font-display:swap;src:url(fonts/dm-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Cubic11;src:url(fonts/cubic11-deck.woff2) format("woff2")}

:root{
  --shell:#132624; --shell2:#1b3431; --shell3:#24433f; --gold:#f7ce76; --gold2:#c29933; --goldD:#8c6533;
  --cream:#fbefce; --cream2:#cdbf98; --paper:#fffaf0; --ink:#2b2723; --ink2:#615a52; --rule:#e2d8c6;
  --disp:"Fraunces Variable",Georgia,"Noto Serif TC","PingFang TC",serif;
  --sans:"DM Sans","Helvetica Neue",Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --han:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --tabh:62px;
}
html,body{background:var(--shell)!important; margin:0}
body{font-family:var(--sans); color:var(--cream); -webkit-tap-highlight-color:transparent; min-height:100vh;
  background:radial-gradient(120% 60% at 50% 0%, #1d3a36 0%, var(--shell) 60%) fixed!important}
#app{max-width:1100px; margin:0 auto; padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 24px)}
#app *{box-sizing:border-box}
#app button{font:inherit; color:inherit; cursor:pointer}
[hidden]{display:none!important}
.kb-zh,.kb-zhb{display:none; font-family:var(--han); letter-spacing:0}
.zh-on .kb-zh{display:inline; margin-left:.45em}
.zh-on .kb-zhb{display:block}
:focus-visible{outline:2.5px solid var(--gold); outline-offset:2px; border-radius:6px}

/* ---------- header and tabs ---------- */
.ap-head{position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:12px; padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background:rgba(19,38,36,.92); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid rgba(247,206,118,.12)}
.ap-title{flex:1; min-width:0; font:600 19px/1.15 var(--disp); color:var(--gold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ap-title .kb-zh{font:500 14px var(--han); color:var(--cream2)}
.ap-gear{flex:none; width:42px; height:42px; border-radius:50%; border:0; background:rgba(247,206,118,.08); color:var(--cream)!important; display:grid; place-items:center}
.ap-gear svg{width:22px; height:22px}
.ap-tabs{position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex; justify-content:center; gap:4px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom)); background:#0e1d1b; border-top:1px solid rgba(247,206,118,.15)}
.ap-tab{flex:1; max-width:120px; display:flex; flex-direction:column; align-items:center; gap:2px; border:0; background:none; color:var(--cream2)!important;
  padding:6px 4px; border-radius:12px; font-size:12px; font-weight:500; min-height:50px}
.ap-tab svg{width:24px; height:24px}
.ap-tab .kb-zh{display:none!important}
.zh-on .ap-tab span{display:flex; flex-direction:column; align-items:center; line-height:1.15}
.zh-on .ap-tab .kb-zh{display:block!important; margin:0; font-size:11px}
.ap-tab[aria-current=page]{color:var(--gold)!important; background:rgba(247,206,118,.09)}
@media (min-width:900px){
  #app{padding-bottom:40px}
  .ap-tabs{position:sticky; top:63px; background:rgba(19,38,36,.92); border:0; border-bottom:1px solid rgba(247,206,118,.12); padding:6px 16px}
  .ap-tab{flex-direction:row; gap:8px; max-width:none; min-height:42px; padding:6px 14px; font-size:15px}
  .ap-tab svg{width:20px; height:20px}
  .zh-on .ap-tab .kb-zh{font-size:12px}
}

/* ---------- screens ---------- */
.ap-main{padding:16px 16px 0}
.ap-screen{max-width:760px; margin:0 auto; animation:ap-in .25s ease both}
.ap-read{max-width:1100px}
@keyframes ap-in{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
.ap-h{font:600 24px/1.2 var(--disp); color:var(--cream); margin:22px 0 12px}
.ap-h .kb-zh{font:500 16px var(--han); color:var(--cream2)}
.ap-sub{font:500 12.5px/1.3 var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--cream2); margin:22px 0 10px}
.ap-sub .kb-zh{text-transform:none; letter-spacing:0; font-size:13.5px}
.ap-small{font-size:14px; color:var(--cream2); margin:0; line-height:1.5}
.ap-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; margin-top:14px}
.ap-link{border:0; background:none; padding:6px 0; color:var(--gold)!important; font-weight:600; font-size:15px; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px}
.ap-cta{margin:22px 0 6px}
.ap-big{width:100%; font-size:18px; min-height:54px}
.ap-empty{color:var(--cream2); font-size:15px; margin:4px 0 16px}

/* buttons borrowed from the table, outside it */
#app .kb-btn,.ap-sheet .kb-btn{border:0; border-radius:999px; padding:11px 22px; font-weight:700; font-size:16px; min-height:46px; background:var(--gold); color:#362428!important; box-shadow:0 2px 0 var(--goldD)}
#app .kb-btn.kb-ghost,.ap-sheet .kb-btn.kb-ghost{background:transparent; color:var(--cream)!important; box-shadow:inset 0 0 0 1.5px var(--goldD)}
.kb-lab{font:500 12px/1.3 var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--gold2)}
.kb-lab .kb-zh{text-transform:none; letter-spacing:0}

/* Today */
.ap-date{margin:4px 0 0; font:500 15px var(--sans); color:var(--cream2)}
.ap-note{background:var(--shell2); border:1px solid rgba(247,206,118,.2); border-radius:14px; padding:16px 18px; margin-top:14px}
.ap-note p{margin:0; font-size:16px; line-height:1.55}
.ap-note .kb-zhb{font-size:15px; color:var(--cream2); margin-top:6px}
.ap-daily{margin-top:6px}
.ap-daily-cloth{position:relative; border-radius:14px; overflow:hidden; background:#4a2420 center/cover; height:300px; display:grid; place-items:center;
  box-shadow:inset 0 0 70px 14px rgba(20,8,14,.55)}
.ap-dcard{position:relative; width:150px; aspect-ratio:2/3; border:0; padding:0; background:none; perspective:900px; animation:ap-bob 3.2s ease-in-out infinite}
.ap-dcard.is-up{animation:none}
@keyframes ap-bob{50%{transform:translateY(-5px) rotate(-1deg)}}
.ap-dflip{position:absolute; inset:0; transform-style:preserve-3d; transition:transform .7s cubic-bezier(.3,.7,.3,1)}
.ap-dcard.is-up .ap-dflip{transform:rotateY(180deg)}
.ap-dflip canvas{position:absolute; inset:0; width:100%; height:100%; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:2.2%; box-shadow:0 10px 18px rgba(20,5,20,.55); image-rendering:pixelated}
.ap-dflip .ap-dface{transform:rotateY(180deg)}
.ap-daily-text{background:var(--paper); color:var(--ink); border-radius:0 0 14px 14px; padding:16px 18px 18px; margin-top:-10px; position:relative}
.ap-daily-text:empty{display:none}
.ap-daily-text > .ap-small{color:var(--ink2); text-align:center}
.ap-daily-text h3{margin:0 0 6px; font:600 22px/1.2 var(--disp)}
.ap-daily-text h3 .kb-zh{font:500 16px var(--han); color:var(--ink2)}
.ap-daily-text p{margin:6px 0 0; font-size:16.5px; line-height:1.55}
.ap-daily-text p.kb-zhb{font-size:15px; color:var(--ink2); line-height:1.7; margin-top:2px}
.ap-daily-text .ap-link{color:#8c6533!important}
.ap-daily-text .ap-row .ap-small{color:var(--ink2)}
@media (max-width:600px){ .ap-daily-cloth{height:260px} .ap-dcard{width:128px} }

/* Read: the picker */
.ap-q{font:600 23px/1.3 var(--disp); margin:10px 0 14px; color:var(--cream)}
.ap-q .kb-zhb{font:500 16px/1.5 var(--han); color:var(--cream2); margin-top:4px}
.ap-topics{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
@media (max-width:520px){ .ap-topics{grid-template-columns:repeat(2,1fr)} }
.ap-topics button,.ap-spreads button,.ap-chips button,.ap-seg button{border:1.5px solid rgba(194,153,51,.45); background:var(--shell2); color:var(--cream)!important; border-radius:14px}
.ap-topics button{min-height:56px; font-size:17px; font-weight:600; padding:8px}
.zh-on .ap-topics button .kb-zh{display:block; margin:2px 0 0; font-size:14px; font-weight:500; color:var(--cream2)}
[role=radio][aria-checked=true]{background:var(--gold)!important; border-color:var(--gold)!important; color:#362428!important}
[role=radio][aria-checked=true] .kb-zh,[role=radio][aria-checked=true] .kb-zhb,[role=radio][aria-checked=true] .ap-sp-h,[role=radio][aria-checked=true] .ap-sp-time{color:#5a4030!important}
.ap-spreads{display:flex; flex-direction:column; gap:8px}
.ap-spreads button{display:flex; align-items:center; gap:14px; text-align:left; padding:12px 14px; min-height:62px}
.ap-mini{flex:none}
.ap-mini rect{fill:none; stroke:currentColor; stroke-width:1; opacity:.75}
.ap-mini rect.hi{fill:var(--gold); stroke:var(--gold); opacity:1}
[aria-checked=true] .ap-mini rect.hi{fill:#8c6533; stroke:#8c6533}
.ap-spreads .ap-mini{width:58px; height:auto; max-height:40px}
.ap-sp-t{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.ap-sp-t b{font-size:16.5px}
.ap-sp-t b .kb-zh{font-weight:500; font-size:14px}
.ap-sp-h{font-size:14px; color:var(--cream2)}
.ap-sp-h .kb-zh{display:none!important}
.zh-on .ap-sp-h .kb-zh{display:block!important; margin:1px 0 0}
.ap-sp-time{flex:none; font-size:12.5px; color:var(--cream2); text-align:right; max-width:7.5em}
.ap-sp-time .kb-zh{display:none!important}
.zh-on .ap-sp-time .kb-zh{display:block!important; margin:0}
.ap-qbox{width:100%; border:1.5px solid rgba(194,153,51,.45); background:var(--shell2); color:var(--cream); border-radius:12px; padding:12px 14px; font:16px/1.45 var(--sans); resize:vertical}
.ap-qbox::placeholder{color:#8f9b8f}
.ap-qlab{display:block}

/* Read: the table inside the app */
.ap-tbar{display:flex; align-items:center; margin:0 0 10px}
.ap-back{border:0; background:none; color:var(--gold)!important; font-weight:600; font-size:15px; padding:6px 2px}
.kbt .kb-box{border-radius:14px}
.kbt .kb-table{aspect-ratio:auto; min-height:0; transition:height .35s ease}
@media (min-width:640px){
  .kbt .kb-box{display:grid; grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)}
  .kbt .kb-box:has(.is-36){grid-template-columns:1fr}
  .kbt .kb-panel{display:flex; flex-direction:column; justify-content:center}
}
.kb-card.is-me canvas{box-shadow:0 0 0 2px #f7ce76, 0 0 14px 3px rgba(247,206,118,.55)}
.is-36 .kb-card canvas{border-radius:3%}
.is-36 .kb-card.is-talk{translate:0 -9%}
.is-36 .kb-card.is-quiet,.is-9 .kb-card.is-quiet{filter:brightness(.42) saturate(.7)}
.kb-card{transition:transform .5s cubic-bezier(.2,.8,.25,1), translate .35s ease, filter .35s ease, opacity .4s ease}
.kb-foot-l{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.kb-skip{border:0; background:none; padding:4px 0; color:var(--kb-cream2)!important; font-size:13px; text-decoration:underline; text-underline-offset:3px}
.kb-skip .kb-zh{display:none!important}
.kb-q{margin:10px 0 4px; font-family:var(--kb-disp); font-style:italic; font-size:18px; line-height:1.45}
.kb-q .kb-lab{display:block; font-style:normal; margin-bottom:2px}
.kb-line5{flex-direction:column; gap:4px}
.kb-five{font-family:var(--kb-disp)!important; font-size:19px!important}
.kb-five b{color:#8c6533}
.kb-sec-b{min-width:0; flex:1}
.kb-many{display:flex; flex-wrap:wrap; gap:4px; align-content:flex-start}
.kb-many .kb-thumb{width:36px}
@media (max-width:619px){ .kb-many .kb-thumb{width:28px} }
.kb-full{color:var(--kb-ink)}
.kb-v-n{font-size:13.5px; color:var(--kb-cream2)}
.kb-v-n .kb-zh{display:none!important}

/* Journal */
.ap-cal{background:var(--shell2); border-radius:16px; padding:12px 12px 14px; border:1px solid rgba(247,206,118,.14)}
.ap-cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.ap-cal-m{font:600 18px var(--disp); text-align:center}
.ap-cal-m .kb-zh{display:block!important; margin:0; font:500 13px var(--han); color:var(--cream2)}
html:not(.zh-on) .ap-cal-m .kb-zh{display:none!important}
.ap-cal-nav{width:42px; height:42px; border-radius:50%; border:1.5px solid rgba(194,153,51,.45); background:none; font-size:22px; line-height:1}
.ap-cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.ap-cal-wd{font-size:12px; text-align:center; color:var(--cream2); padding:2px 0 4px}
.zh-on .ap-cal-wd{font-size:0}
.zh-on .ap-cal-wd .kb-zh{font-size:12px; margin:0}
.ap-day{position:relative; aspect-ratio:5/6; border:0; border-radius:8px; background:rgba(255,255,255,.03); display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:4px 0 0; gap:2px; overflow:hidden}
.ap-day.has{background:rgba(247,206,118,.1)}
.ap-dn{font-size:13px; font-variant-numeric:tabular-nums; color:var(--cream2)}
.ap-day.is-today .ap-dn{color:#362428; background:var(--gold); border-radius:999px; padding:0 6px; font-weight:700}
.ap-day.is-picked{box-shadow:inset 0 0 0 2px var(--gold)}
.ap-dimg{width:56%; max-width:30px; aspect-ratio:2/3; object-fit:cover; image-rendering:pixelated; border:1.5px solid var(--gold2); border-radius:2px}
.ap-dots{font-size:14px; line-height:.6; color:var(--gold); letter-spacing:1px}
.ap-cal-today{display:block; margin:8px auto 0}
.ap-jrow{display:flex; align-items:center; gap:8px; background:var(--paper); color:var(--ink); border-radius:14px; padding:10px 10px 10px 12px; margin-bottom:8px}
.ap-jopen{flex:1; min-width:0; display:flex; align-items:center; gap:12px; border:0; background:none; text-align:left; padding:2px; color:var(--ink)!important}
.ap-jcards{display:flex; gap:4px; flex:none; align-items:center}
.ap-jcards canvas{width:34px; height:auto; border-radius:2px; box-shadow:0 2px 4px rgba(43,25,30,.3)}
.ap-jmini{color:#8c6533; display:flex; width:58px; justify-content:center}
.ap-jmini .ap-mini{width:52px; height:auto; max-height:40px}
.ap-jinfo{display:flex; flex-direction:column; gap:3px; min-width:0}
.ap-jinfo .kb-lab{color:#8c6533}
.ap-jq{font:italic 16px/1.35 var(--disp); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.ap-jnames{font:600 15.5px/1.3 var(--disp)}
.ap-jnames .kb-zhb{font:400 13.5px var(--han); color:var(--ink2)}
.ap-jx{flex:none; border:1.5px solid var(--rule); background:none; border-radius:999px; padding:6px 12px; font-size:13px; color:var(--ink2)!important; min-height:38px}
.ap-jx .kb-zh{display:none!important}
.zh-on .ap-jinfo .kb-lab .kb-zh{display:block; margin:2px 0 0}

/* Deck */
.ap-howcard{display:flex; align-items:center; gap:14px; width:100%; text-align:left; border:1.5px solid rgba(194,153,51,.45); background:var(--shell2); border-radius:14px; padding:12px 14px; margin-bottom:14px}
.ap-howcard b{display:block; font-size:16.5px}
.ap-how-i .ap-mini{width:34px; height:auto}
.ap-howcard > span:nth-child(2){flex:1}
.ap-howcard > span:last-child{font-size:24px; color:var(--gold)}
.ap-chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
.ap-chips button{border-radius:999px; padding:7px 14px; min-height:40px; font-size:14.5px; font-weight:500}
.ap-deckgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:12px}
@media (max-width:520px){ .ap-deckgrid{grid-template-columns:repeat(4,1fr); gap:8px} }
.ap-dc{border:0; padding:0; background:none; border-radius:4px}
.ap-dc canvas{display:block; width:100%; height:auto; border-radius:3px; box-shadow:0 4px 8px rgba(0,0,0,.35)}
.ap-pairs{font-size:15.5px!important}
.kb-v-txt i{font-style:normal; color:var(--kb-cream2)}

/* sheets: Settings and How readings work */
.ap-sheet{position:fixed; inset:0; z-index:900; background:rgba(8,16,15,.6); display:flex; align-items:flex-end; justify-content:center; animation:kb-fade .2s ease both}
.ap-sheet-in{width:100%; max-width:640px; max-height:92vh; overflow-y:auto; overscroll-behavior:contain; background:var(--shell); color:var(--cream);
  border-radius:20px 20px 0 0; padding:8px 18px calc(28px + env(safe-area-inset-bottom)); border-top:1px solid rgba(247,206,118,.25)}
@media (min-width:700px){ .ap-sheet{align-items:center} .ap-sheet-in{border-radius:20px; border:1px solid rgba(247,206,118,.25)} }
.ap-sheet .kb-v-x{position:sticky; top:6px; float:right; margin:6px -4px 0 8px; width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.1); color:var(--cream)!important; font-size:24px; line-height:1; z-index:2}
.ap-set{padding:14px 0; border-top:1px solid rgba(247,206,118,.12)}
.ap-set-l{font:600 15px var(--sans); margin-bottom:10px}
.ap-set-l .kb-zh{font-weight:500; color:var(--cream2)}
.ap-seg{display:flex; flex-wrap:wrap; gap:8px}
.ap-seg button{border-radius:999px; padding:8px 15px; min-height:42px; font-size:14.5px; font-weight:500}
.ap-seg button .kb-zh{font-size:13px}
.ap-danger{color:#f3b3a0!important; box-shadow:inset 0 0 0 1.5px #a5553f!important}
.ap-ver{display:block; margin-top:8px; font-size:12px; color:#7f8f88}
.ap-sheet .ap-small .kb-zhb{margin-top:4px}
.ap-how-intro{font-size:16px; line-height:1.55; margin:0 0 8px}
.ap-how-intro .kb-zhb{font-size:15px; color:var(--cream2); margin-top:4px}
.ap-how{display:flex; gap:16px; padding:16px 0; border-top:1px solid rgba(247,206,118,.12)}
.ap-how-d{flex:none; width:96px; display:flex; justify-content:center; padding-top:4px; color:var(--cream2)}
.ap-how-d .ap-mini{max-width:96px; height:auto}
.ap-how h3{margin:0 0 6px; font:600 18px var(--disp)}
.ap-how h3 .kb-zh{font:500 14px var(--han); color:var(--cream2)}
.ap-how p{margin:0; font-size:15.5px; line-height:1.55}
.ap-how p.kb-zhb{font-size:14.5px; color:var(--cream2); margin-top:6px; line-height:1.7}
@media (max-width:520px){ .ap-how{flex-direction:column; gap:8px} .ap-how-d{justify-content:flex-start; width:auto} }
@media (prefers-reduced-motion:reduce){ .ap-screen,.ap-dcard{animation:none} .ap-dflip{transition-duration:.01s} }

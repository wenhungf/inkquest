      it.steps.forEach(st => text.append(el('p', '', esc(st.en)), el('p', 'kb-zhb', esc(st.zh))));
      const row = el('div', 'ap-row');
      row.append(btn('ap-link', bi(STR.dailyOpen), () => { go('read', { open: it }); }));
      row.append(el('span', 'ap-small', bi(STR.dailySaved)));
      text.append(row);
    }
    if (item) { flip.append(face(item.cards[0], 'ap-dface')); card.classList.add('is-up'); card.setAttribute('aria-label', byn[item.cards[0]].name.en); card.onclick = () => go('read', { open: item }); showText(item); }
    else {
      text.append(el('p', 'ap-small', bi(STR.dailyTap)));
      card.setAttribute('aria-label', STR.dailyTap.en);
      card.onclick = async () => {
        if (item) return;
        SFX.wake();
        const r = KBEngine.reading(DATA, 'one', 'anything');
        item = { t: Date.now(), spread: 'one', topic: 'anything', q: '', cards: r.cards, steps: r.steps, daily: true };
        store.set(DKEY, { key: dayKey(new Date()), item }); keep(item);
        const f = face(item.cards[0], 'ap-dface'); flip.append(f); await art(item.cards[0]); await frame();
        SFX.deal(); card.classList.add('is-up'); await wait(600); showText(item);
        card.onclick = () => go('read', { open: item });
      };
    }
    const go1 = el('div', 'ap-cta'); go1.append(btn('kb-btn ap-big', bi(STR.newReading), () => go('read', { fresh: true }))); s.append(go1);
    const last = journal().find(k => !k.daily);
    if (last) {
      s.append(el('h2', 'ap-h', bi(STR.lastKept)));
      s.append(journalRow(last, () => drawToday()));
    }
  }

  // ----- Read -----
  let table = null, tableHost = null, picker = null, playing = false;
  function mini(sp, small) { // a little drawing of the layout
    const L = { one: [[0, 0]], three: [[0, 0], [1, 0], [2, 0]], five: [0, 1, 2, 3, 4].map(x => [x, 0]),
      box9: Array.from({ length: 9 }, (_, i) => [i % 3, Math.floor(i / 3)]), grand36: Array.from({ length: 36 }, (_, i) => [i % 9, Math.floor(i / 9)]) }[sp];
    const cw = sp === 'grand36' ? 6 : 10, ch = cw * 1.5, g = sp === 'grand36' ? 1.6 : 3;
    const cols = Math.max(...L.map(p => p[0])) + 1, rows = Math.max(...L.map(p => p[1])) + 1;
    const W = cols * cw + (cols - 1) * g, H = rows * ch + (rows - 1) * g;
    const hi = { five: 2, box9: 4, grand36: 13 }[sp];
    const r = L.map(([x, y], i) => `<rect x="${x * (cw + g)}" y="${y * (ch + g)}" width="${cw}" height="${ch}" rx="1.2" class="${i === hi ? 'hi' : ''}"/>`).join('');
    return `<svg class="ap-mini${small ? ' sm' : ''}" viewBox="-1 -1 ${W + 2} ${H + 2}" width="${(W + 2) * (small ? 1 : 1.6)}" height="${(H + 2) * (small ? 1 : 1.6)}" aria-hidden="true">${r}</svg>`;
  }
  function radios(name, keys, label, cur, onPick, cls) {
    const wrap = el('div', cls); wrap.setAttribute('role', 'radiogroup');
    keys.forEach(k => {
      const b = btn('', label(k)); b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(k === cur));
      b.onclick = () => { wrap.querySelectorAll('[role=radio]').forEach(x => x.setAttribute('aria-checked', String(x === b))); onPick(k); };
      wrap.append(b);
    });
    return wrap;
  }
  function drawRead(opts) {
    const s = screens.read;
    if (!table) {
      s.innerHTML = '';
      picker = el('div', 'ap-picker'); tableHost = el('div', 'ap-tablehost'); tableHost.hidden = true;
      const bar = el('div', 'ap-tbar'); bar.append(btn('ap-back', '‹ ' + bi(STR.newQ), () => showPicker()));
      const tEl = el('div'); tableHost.append(bar, tEl); s.append(picker, tableHost);
      table = KBTable.mount(tEl, { data: DATA, art, backArt, cloth: window.KB_CLOTH || 'cloth.jpg', pace: () => set.pace,
        canKeep: store.ok, keep, isKept, onAgain: () => showPicker() });
    }
    if (opts && opts.open) { showTable(); table.open(opts.open); return; }
    if ((opts && opts.fresh) || !playing) showPicker();
  }
  function showTable() { playing = true; picker.hidden = true; tableHost.hidden = false; }
  function showPicker() {
    playing = false; if (table) table.stop(); tableHost.hidden = true; picker.hidden = false; picker.innerHTML = '';
    picker.append(el('h2', 'ap-q', esc(STR.ask.en) + '<span class="kb-zhb">' + esc(STR.ask.zh) + '</span>'));
    picker.append(radios('topic', TOPICS, k => bi(spreads.topics[k]), set.topic, k => { set.topic = k; save(); }, 'ap-topics'));
    picker.append(el('h3', 'ap-sub', bi(STR.howMany)));
    picker.append(radios('spread', SPREADS, k => mini(k, true) + '<span class="ap-sp-t"><b>' + bi(spreadName(k)) + '</b><span class="ap-sp-h">' + bi(STR.spreadHint[k][0]) + '</span></span><span class="ap-sp-time">' + bi(STR.spreadHint[k][1]) + '</span>', set.spread, k => { set.spread = k; save(); }, 'ap-spreads'));
    const lab = el('label', 'ap-sub ap-qlab', bi(STR.question)), ta = el('textarea', 'ap-qbox');
    ta.rows = 2; ta.maxLength = 200; ta.placeholder = set.zh ? STR.questionPh.en + '\n' + STR.questionPh.zh : STR.questionPh.en; ta.id = 'kbq'; lab.htmlFor = 'kbq';
    picker.append(lab, ta);
    const row = el('div', 'ap-cta'); row.append(btn('kb-btn ap-big', bi(STR.go), () => { showTable(); table.play({ spread: set.spread, topic: set.topic, q: ta.value }); window.scrollTo(0, 0); }));
    picker.append(row);
  }

  // ----- Journal -----
  let month = null, pickedDay = null;
  function journalRow(k, after) {
    const row = el('div', 'ap-jrow'), open = btn('ap-jopen'), th = el('span', 'ap-jcards'), info = el('span', 'ap-jinfo');
    if (k.cards.length <= 3) k.cards.forEach(n => th.append(face(n)));
    else th.append(el('span', 'ap-jmini', mini(k.spread, true)));
    const tag = k.daily ? STR.daily : spreads.topics[k.topic];
    const meta = l => [tag[l], spreadName(k.spread)[l], (current === 'journal' ? '' : dateText(new Date(k.t), l) + ' ') + timeText(new Date(k.t))].join(l === 'zh' ? '　' : '  ·  ');
    info.append(el('span', 'kb-lab', esc(meta('en')) + '<span class="kb-zh">' + esc(meta('zh')) + '</span>'));
    const names = l => k.cards.length > 3 ? (k.q || '') : k.cards.map(n => byn[n].name[l]).join(l === 'zh' ? '、' : ', ');
    if (k.q) info.append(el('span', 'ap-jq', esc(k.q)));
    if (k.cards.length <= 3) info.append(el('span', 'ap-jnames', esc(names('en')) + '<span class="kb-zhb">' + esc(names('zh')) + '</span>'));
    open.append(th, info); open.onclick = () => go('read', { open: k });
    const rm = btn('ap-jx', bi(STR.remove));
    rm.onclick = () => { unkeep(k.t); if (after) after(); };
    row.append(open, rm); return row;
  }
  function drawJournal() {
    const s = screens.journal; s.innerHTML = '';
    const list = journal(), now = new Date();
    if (!month) month = new Date(now.getFullYear(), now.getMonth(), 1);
    const byDay = {}; list.forEach(k => { (byDay[dayKey(new Date(k.t))] = byDay[dayKey(new Date(k.t))] || []).push(k); });
    s.append(el('h2', 'ap-h', bi(STR.journal)));
    if (!list.length) { s.append(el('p', 'ap-empty', esc(STR.journalEmpty.en) + '<span class="kb-zhb">' + esc(STR.journalEmpty.zh) + '</span>')); }
    const cal = el('div', 'ap-cal'), head = el('div', 'ap-cal-head');
    const prev = btn('ap-cal-nav', '‹', () => { month = new Date(month.getFullYear(), month.getMonth() - 1, 1); pickedDay = null; drawJournal(); });
    const nxt = btn('ap-cal-nav', '›', () => { month = new Date(month.getFullYear(), month.getMonth() + 1, 1); pickedDay = null; drawJournal(); });
    prev.setAttribute('aria-label', STR.prevMonth.en); nxt.setAttribute('aria-label', STR.nextMonth.en);
    head.append(prev, el('div', 'ap-cal-m', esc(MONTH[month.getMonth()] + ' ' + month.getFullYear()) + '<span class="kb-zh">' + month.getFullYear() + ' 年 ' + (month.getMonth() + 1) + ' 月</span>'), nxt);
    cal.append(head);
    const grid = el('div', 'ap-cal-grid');
    ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach((d, i) => grid.append(el('span', 'ap-cal-wd', d + '<span class="kb-zh">' + WK[i] + '</span>')));
    const first = month.getDay(), days = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
    for (let i = 0; i < first; i++) grid.append(el('span'));
    const monthKeys = [];
    for (let d = 1; d <= days; d++) {
      const date = new Date(month.getFullYear(), month.getMonth(), d), key = dayKey(date), items = byDay[key] || [];
      if (items.length) monthKeys.push(key);
      const b = btn('ap-day' + (key === dayKey(now) ? ' is-today' : '') + (items.length ? ' has' : ''));
      b.append(el('span', 'ap-dn', String(d)));
      const daily = items.find(k => k.daily);
      if (daily) { const im = el('img', 'ap-dimg'); im.src = ART + byn[daily.cards[0]].image; im.alt = ''; b.append(im); }
      const others = items.filter(k => !k.daily).length;
      if (others) b.append(el('span', 'ap-dots', '•'.repeat(Math.min(3, others))));
      b.setAttribute('aria-label', dateText(date, 'en') + (items.length ? ', ' + items.length + ' kept' : ''));
      b.onclick = () => { pickedDay = key; drawJournal(); };
      if (key === pickedDay) b.classList.add('is-picked');
      grid.append(b);
    }
    cal.append(grid);
    const back = btn('ap-link ap-cal-today', bi(STR.todayBtn), () => { month = new Date(now.getFullYear(), now.getMonth(), 1); pickedDay = dayKey(now); drawJournal(); });
    if (month.getMonth() !== now.getMonth() || month.getFullYear() !== now.getFullYear()) cal.append(back);
    s.append(cal);
    if (!pickedDay || !pickedDay.startsWith(dayKey(month).slice(0, 7))) pickedDay = byDay[dayKey(now)] && dayKey(now).startsWith(dayKey(month).slice(0, 7)) ? dayKey(now) : monthKeys[monthKeys.length - 1] || null;
    grid.querySelectorAll('.ap-day').forEach((b, i) => b.classList.toggle('is-picked', dayKey(new Date(month.getFullYear(), month.getMonth(), i + 1)) === pickedDay));
    if (list.length) {
      const items = (pickedDay && byDay[pickedDay]) || [];
      if (pickedDay) { const [y, m, d] = pickedDay.split('-').map(Number); s.append(el('h3', 'ap-sub', bi({ en: dateText(new Date(y, m - 1, d), 'en'), zh: dateText(new Date(y, m - 1, d), 'zh') }))); }
      if (!items.length) s.append(el('p', 'ap-empty', bi(STR.noneThatDay)));
      items.forEach(k => s.append(journalRow(k, () => drawJournal())));
    }
  }

  // ----- Deck -----
  let deckFilter = 'all';
  const PIP_TOPIC = { heart: 'love', clover: 'work', diamond: 'money', star: 'anything' };
  function partners(n) {
    const out = [];
    DATA.combos.combos.forEach(cb => { if (cb.cards.includes(n)) cb.cards.forEach(x => { if (x !== n && !out.includes(x)) out.push(x); }); });
    return out;
  }
  function deckBody(n, txt) {
    const c = byn[n], ph = DATA.phrases[n];
    txt.append(el('div', 'kb-lab', bi({ en: 'No. ' + n, zh: n + ' 號' }) + ' · ' + bi(spreads.topics[PIP_TOPIC[c.pip]])));
    txt.append(el('h3', '', bi(c.name)), el('p', 'kb-flavor', esc(c.flavor.en)), el('p', 'kb-zhb', esc(c.flavor.zh)));
    txt.append(el('div', 'kb-lab', bi(STR.means)), el('p', '', esc(c.core.en)), el('p', 'kb-zhb', esc(c.core.zh)));
    txt.append(el('div', 'kb-lab', bi(STR.inLine)));
    txt.append(el('p', '', '<i>' + esc(STR.alone.en) + ':</i> ' + esc(ph.noun.map(x => x[0]).join(', ')) + '<span class="kb-zhb">' + esc(STR.alone.zh) + '：' + esc(ph.noun.map(x => x[1]).join('、')) + '</span>'));
    txt.append(el('p', '', '<i>' + esc(STR.beside.en) + ':</i> … ' + esc(ph.tint.map(x => x[0]).join(' / … ')) + '<span class="kb-zhb">' + esc(STR.beside.zh) + '：' + esc(ph.tint.map(x => x[1] + '的…').join(' / ')) + '</span>'));
    TOPICS.forEach(t => { const w = c.lines[t][0]; txt.append(el('div', 'kb-lab', bi(spreads.topics[t])), el('p', '', esc(w.en)), el('p', 'kb-zhb', esc(w.zh))); });
    const a = c.lines.advice[0]; txt.append(el('div', 'kb-lab', bi(STR.advice)), el('p', '', esc(a.en)), el('p', 'kb-zhb', esc(a.zh)));
    const p = partners(n);
    if (p.length) txt.append(el('div', 'kb-lab', bi(STR.pairs)), el('p', 'ap-pairs', esc(p.map(x => byn[x].name.en).join(', ')) + '<span class="kb-zhb">' + esc(p.map(x => byn[x].name.zh).join('、')) + '</span>'));
  }
  function drawDeck() {
    const s = screens.deck; s.innerHTML = '';
    s.append(el('h2', 'ap-h', bi(STR.deckTitle)));
    const how = btn('ap-howcard', '<span class="ap-how-i">' + mini('box9', true) + '</span><span><b>' + bi(STR.howTitle) + '</b><span class="ap-small">' + bi({ en: 'One, three, five, nine and all 36 cards', zh: '一張、三張、五張、九張和 36 張' }) + '</span></span><span aria-hidden="true">›</span>', () => openHow());
    s.append(how);
    const keys = ['all', 'love', 'work', 'money', 'anything'];
    s.append(radios('f', keys, k => bi(k === 'all' ? STR.all : spreads.topics[k]), deckFilter, k => { deckFilter = k; drawDeck(); }, 'ap-chips'));
    const grid = el('div', 'ap-deckgrid');
    const shown = deck.filter(c => deckFilter === 'all' || PIP_TOPIC[c.pip] === deckFilter).map(c => c.n);
    shown.forEach((n, i) => {
      const b = btn('ap-dc'); b.append(face(n)); b.setAttribute('aria-label', byn[n].name.en + ' ' + byn[n].name.zh);
      b.onclick = () => KBView.open({ count: shown.length, start: i, art, cardInfo: k => cardInfo(shown[k]), body: (k, txt) => deckBody(shown[k], txt) });
      grid.append(b);
    });
    s.append(grid);
  }

  // ----- sheets: Settings and How readings work -----
  function sheet(title, fill) {
    const v = el('div', 'kb ap-sheet'); v.setAttribute('role', 'dialog'); v.setAttribute('aria-modal', 'true');
    const box = el('div', 'ap-sheet-in'), x = btn('kb-v-x', '×');
    x.setAttribute('aria-label', STR.close.en + ' ' + STR.close.zh);
    box.append(x, el('h2', 'ap-h', bi(title))); fill(box); v.append(box); document.body.append(v);
    const prev = document.documentElement.style.overflow; document.documentElement.style.overflow = 'hidden';
    const close = () => { v.remove(); document.documentElement.style.overflow = prev; document.removeEventListener('keydown', key); };
    const key = e => { if (e.key === 'Escape') close(); };
    x.onclick = close; v.addEventListener('click', e => { if (e.target === v) close(); }); document.addEventListener('keydown', key);
    x.focus(); return close;
  }
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
  const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function openSettings() {
    sheet(STR.settings, box => {
      const group = (label, node) => { const g = el('div', 'ap-set'); g.append(el('div', 'ap-set-l', bi(label)), node); box.append(g); };
      group(STR.language, radios('lang', ['en', 'both'], k => esc(k === 'en' ? 'English' : 'English + 中文'), set.zh ? 'both' : 'en', k => { set.zh = k === 'both'; save(); applyLang(); }, 'ap-seg'));
      group(STR.pace, radios('pace', ['tap', 'relaxed', 'normal'], k => bi({ tap: STR.paceTap, relaxed: STR.paceSlow, normal: STR.paceNormal }[k]), set.pace, k => { set.pace = k; save(); }, 'ap-seg'));
      group(STR.sounds, radios('snd', ['on', 'off'], k => bi(STR[k]), set.sound ? 'on' : 'off', k => { set.sound = k === 'on'; save(); if (set.sound) SFX.deal(); }, 'ap-seg'));
      const inst = el('div');
      if (standalone()) inst.append(el('p', 'ap-small', bi(STR.installed)));
      else if (installEvt) inst.append(btn('kb-btn', bi(STR.installBtn), async () => { installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; }));
      else inst.append(el('p', 'ap-small', esc((isIOS() ? STR.installIos : STR.installOther).en) + '<span class="kb-zhb">' + esc((isIOS() ? STR.installIos : STR.installOther).zh) + '</span>'));
      group(STR.install, inst);
      let armed = false; const clr = btn('kb-btn kb-ghost ap-danger', bi(STR.clear));
      clr.onclick = () => {
        if (!armed) { armed = true; clr.innerHTML = bi(STR.clearSure); return; }
        store.set(JKEY, []); store.set(DKEY, null); clr.replaceWith(el('p', 'ap-small', bi(STR.cleared)));
        if (current) go(current, { keepScroll: true });
      };
      group(STR.journal, clr);
      group(STR.about, el('p', 'ap-small', esc(STR.aboutText.en) + '<span class="kb-zhb">' + esc(STR.aboutText.zh) + '</span><span class="ap-ver">v' + esc(VERSION) + '</span>'));
    });
  }
  function openHow() {
    sheet(STR.howTitle, box => {
      box.append(el('p', 'ap-how-intro', esc(STR.howIntro.en) + '<span class="kb-zhb">' + esc(STR.howIntro.zh) + '</span>'));
      SPREADS.forEach(k => {
        const sec = el('div', 'ap-how');
        sec.append(el('div', 'ap-how-d', mini(k)), el('div', '', '<h3>' + bi(spreadName(k)) + '</h3><p>' + esc(STR.how[k].en) + '</p><p class="kb-zhb">' + esc(STR.how[k].zh) + '</p>'));
        box.append(sec);
      });
    });
  }

  // ----- start -----
  KBCard.ready().catch(() => {}).then(() => {
    const k = location.hash.slice(1);
    go(screens[k] ? k : 'today');
    root.dataset.ready = 1;
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !window.KB_NO_SW) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  window.KBApp = { go, table: () => table, openSettings, openHow, journal, start: o => { go('read', { keepScroll: true }); showTable(); return table.play(o); } };
})();

</script>
</body>

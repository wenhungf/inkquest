<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>躺平冒險團</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
:root{
  color-scheme: dark;
  --bg:#13142b; --panel:#1d2044; --panel2:#262a57; --line:#353a72;
  --text:#f1efff; --muted:#a3a5cf; --lantern:#ffb347; --lantern-ink:#3a1f00;
  --hp:#5fd38d; --hp-low:#ff7070; --danger:#ff7070;
  --C:#b3b8d4; --R:#5aa7ff; --E:#c07bff; --L:#ffcf4a;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:
    radial-gradient(600px 300px at 10% -5%, rgba(255,179,71,.14), transparent 70%),
    radial-gradient(500px 280px at 100% 0%, rgba(192,123,255,.12), transparent 70%);
  color:var(--text); font-family:var(--body); font-size:15px; line-height:1.5;
}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px calc(10px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:10px;height:100%}
.wrap>*{flex:none}
.num{font-variant-numeric:tabular-nums}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .logo{flex:none;white-space:nowrap}
.top .logo small{white-space:normal;max-width:14em;font-weight:400}
.logo{font-family:var(--display);font-size:24px;letter-spacing:.04em;line-height:1.1}
.logo small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:.12em}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:1 1 0;min-width:0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.chip.snd{font-family:var(--body);font-size:14px;line-height:1.2;color:var(--text);padding:4px 9px;border-radius:999px}
.chip b{font-family:var(--display);font-weight:400;font-size:15px}

/* floors */
.floors{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.floors i{height:6px;border-radius:3px;background:var(--line)}
.floors i.done{background:var(--lantern)}
.floors i.now{background:var(--text);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}

/* stage */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.wrap>.stage{flex:1 1 auto;min-height:0}
.monster{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.m-emoji{font-size:48px;line-height:64px;text-align:center;background:var(--panel2);border-radius:14px}
.m-emoji.hit{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.m-name{font-family:var(--display);font-size:19px;line-height:1.2}
.m-floor{font-size:11px;color:var(--lantern);letter-spacing:.12em}
.m-quote{font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:8px;background:#0d0e20;border-radius:4px;overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;background:var(--danger);transition:width .25s}
.bar.hpb>span{background:var(--hp)}
.bar.hpb.low>span{background:var(--hp-low)}
.m-stat{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-top:3px}

.party{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hero{background:var(--panel2);border-radius:12px;padding:8px 6px;text-align:center;border:1.5px solid transparent;position:relative;min-width:0}
.hero .e{font-size:28px;line-height:1.2}
.hero .n{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .s{font-size:10px;color:var(--lantern);letter-spacing:.05em;min-height:14px}
.hero .a{font-size:11px;color:var(--muted)}
.hero.dead{opacity:.35;filter:grayscale(1)}
.hero.hit{animation:shake .25s}
.hero.empty{border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;min-height:98px}
.hero.r-C{border-color:var(--C)}.hero.r-R{border-color:var(--R)}.hero.r-E{border-color:var(--E)}.hero.r-L{border-color:var(--L)}

.log{background:#0e0f24;border-radius:12px;padding:10px 12px;flex:1 1 0;min-height:84px;overflow-y:auto;font-size:13px;display:flex;flex-direction:column;gap:3px}
.log p{margin:0}
.log .sys{color:var(--muted)}
.log .good{color:var(--hp)}
.log .bad{color:var(--danger)}
.log .gold{color:var(--L)}

/* actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font-family:var(--display);font-size:17px;border:0;border-radius:14px;padding:9px 10px;cursor:pointer;color:var(--text);background:var(--panel2);transition:transform .08s, filter .15s}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button small{display:block;font-family:var(--body);font-size:11px;opacity:.8}
.btn-pull{background:linear-gradient(180deg,#3b3f86,#2b2f6b);border:1px solid #5156a8}
.btn-go{grid-column:1/-1;background:var(--lantern);color:var(--lantern-ink);font-size:19px}
/* during a battle the controls step aside and the log takes their space */
.btn-skip{display:none;width:100%;font-family:var(--body);font-size:14px;padding:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.fighting .actions,.fighting .buffs,.fighting .foot{display:none}
.fighting .btn-skip{display:block}
.btn-skip[aria-pressed="true"]{color:var(--lantern);border-color:var(--lantern)}
.btn-go small{opacity:.75}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.foot button{font-family:var(--body);font-size:12px;padding:6px 10px;border-radius:8px;background:transparent;border:1px solid var(--line);color:var(--muted)}
.buffs{font-size:12px;color:var(--muted)}
.buffs b{color:var(--text);font-weight:500}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,6,18,.82);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow-y:auto}
.modal h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;text-align:center;text-wrap:balance}
.modal p{margin:0}
.modal .btns{display:flex;flex-direction:column;gap:8px}
.modal .btns button{width:100%}

/* cards */
.cards{display:grid;gap:8px}
.cards.one{grid-template-columns:1fr;justify-items:center}
.cards.ten{grid-template-columns:repeat(5,1fr)}
.card{perspective:800px;width:100%}
.cards.one .card{max-width:240px}
.card-in{position:relative;transition:transform .5s;transform-style:preserve-3d;transform:rotateY(180deg)}
.card.open .card-in{transform:rotateY(0)}
.face,.back{backface-visibility:hidden;border-radius:12px}
.back{position:absolute;inset:0;transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#2b2f6b 0 8px,#252960 8px 16px);border:2px solid #5156a8;display:flex;align-items:center;justify-content:center;font-family:var(--display);color:#8e93d6;font-size:22px}
.face{background:var(--panel2);border:2px solid var(--rc);padding:12px 10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;box-shadow:0 0 18px -4px var(--rc)}
.face .rar{font-size:10px;letter-spacing:.14em;color:var(--rc)}
.face .e{font-size:52px;line-height:1.15}
.face .nm{font-family:var(--display);font-size:18px;line-height:1.2}
.face .ty{font-size:11px;color:var(--muted)}
.face .st{font-size:12px;color:var(--lantern)}
.face .ds{font-size:12px;color:var(--text);opacity:.9}
.face .q{font-size:11.5px;color:var(--muted);font-style:italic}
.face .tag{font-size:10px;background:var(--rc);color:#111;border-radius:6px;padding:1px 6px}
.cards.ten .face{padding:6px 2px;gap:1px}
.cards.ten .face .e{font-size:26px}
.cards.ten .face .nm{font-size:11px;font-family:var(--body)}
.cards.ten .face .rar{font-size:8px;letter-spacing:.05em}
.cards.ten .face .ty,.cards.ten .face .ds,.cards.ten .face .q,.cards.ten .face .st{display:none}
.cards.ten .face .tag{font-size:8px;padding:0 3px}
.cards.ten .card-in{min-height:84px}
.rL .face{animation:gold 1.6s infinite}
@keyframes gold{50%{box-shadow:0 0 34px 2px var(--L)}}
.summary{font-size:13px;color:var(--muted);text-align:center}

.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dex .it{font-family:var(--body);font-size:11.5px;line-height:1.35;background:var(--panel2);border-radius:10px;padding:8px 4px;text-align:center;border:1.5px solid var(--rc);color:var(--text)}
.dex .it .e{font-size:26px;line-height:1.25}
.dex .it .sub{color:var(--lantern)}
.dex .it.no{opacity:.35;filter:grayscale(1);border-color:var(--line);cursor:default}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#0e0f24;border-radius:12px;padding:4px}
.tabs button{font-family:var(--body);font-size:13px;padding:8px 4px;border-radius:9px;background:transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--text)}
.info{background:#0e0f24;border-radius:12px;padding:10px 12px;font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.info dt{color:var(--muted)}
.info dd{margin:0}
.hero:not(.empty){cursor:pointer}
.help h3{font-family:var(--display);font-weight:400;font-size:16px;margin:0 0 4px;color:var(--lantern)}
.help section{display:flex;flex-direction:column;gap:4px}
.help p,.help li{font-size:13.5px;margin:0}
.help ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px}
.help b{font-weight:500;color:var(--text)}
.help .rar-row{display:flex;flex-wrap:wrap;gap:6px}
.help .rar-row span{font-size:12px;border:1.5px solid var(--rc);border-radius:999px;padding:2px 9px;color:var(--rc)}
.center{text-align:center}
.big{font-size:56px;text-align:center;line-height:1}


/* splash */
.splash{position:fixed;inset:0;z-index:20;background:var(--bg);
  background-image:radial-gradient(420px 320px at 50% 30%, rgba(255,179,71,.16), transparent 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;text-align:center;transition:opacity .35s}
.splash.bye{opacity:0;pointer-events:none}
.splash svg{width:min(200px,52vw);height:auto;overflow:visible}
.splash .t{font-family:var(--display);font-size:clamp(34px,10vw,44px);letter-spacing:.06em;line-height:1.1;margin:0}
.splash .slogan{font-family:var(--display);font-size:20px;color:var(--lantern);margin:0}
.splash .sub{font-size:13px;color:var(--muted);margin:0}
.splash button{background:var(--lantern);color:var(--lantern-ink);font-size:19px;padding:12px 36px;border-radius:999px;margin-top:6px}
.clk-min{transform-box:view-box;transform-origin:100px 100px;transform:rotate(0deg);animation:minute 1.55s steps(1,end) backwards}
/* three tick-tock jumps (0.3s, 0.7s, 1.1s), then the hand lands on six at 1.55s */
@keyframes minute{0%{transform:rotate(-30deg)}19.4%{transform:rotate(-22deg)}45.2%{transform:rotate(-15deg)}71%{transform:rotate(-8deg)}100%{transform:rotate(0deg)}}
.clk-stamp{transform-box:view-box;transform-origin:150px 158px;transform:rotate(-12deg);animation:stamp .35s cubic-bezier(.3,1.6,.5,1) 1.6s backwards}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}}
.clk-z{animation:zz 2.4s ease-in-out infinite}
@keyframes zz{50%{transform:translateY(-5px);opacity:.5}}

/* team editor */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#0e0f24;border-radius:12px;padding:4px}
.seg button{font-family:var(--body);font-size:13px;padding:8px 4px;border-radius:9px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--text)}
.sec{font-family:var(--display);font-weight:400;font-size:15px;color:var(--lantern);margin:4px 0 -4px}
.dex.slots{grid-template-columns:repeat(4,1fr)}
.dex .it.sel{outline:2px solid var(--lantern);outline-offset:2px}
.dex .it.empty-slot{border-style:dashed;border-color:var(--line);color:var(--muted);background:transparent}
.dex .it .stat{display:block;color:var(--muted);font-size:10.5px}
.team-hint{font-size:12.5px;color:var(--muted);text-align:center;margin:0;min-height:1.4em}
.team-hint.warn{color:var(--lantern)}
.combos{display:flex;flex-direction:column;gap:6px}
.combo{background:#0e0f24;border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;border:1.5px solid transparent;font-size:12.5px}
.combo.on{border-color:var(--lantern)}
button.combo{width:100%;text-align:left;color:var(--text);line-height:1.5;cursor:pointer}
button.combo:hover{border-color:var(--line)}
.combo .go{grid-column:2;justify-self:start;font-family:var(--body);font-size:11.5px;color:var(--lantern);margin-top:2px}
.combo .ce{font-size:22px;grid-row:span 2;align-self:center}
.combo .cn{font-family:var(--display);font-size:14px}
.combo .cn b{font-family:var(--body);font-weight:500;font-size:11px;color:var(--lantern-ink);background:var(--lantern);border-radius:5px;padding:0 5px;margin-left:6px}
.combo .cd{color:var(--muted)}
.combo .cm{grid-column:2;letter-spacing:.1em}
.hero .cmb{position:absolute;top:3px;right:5px;font-size:11px}
.danger-link{font-family:var(--body);font-size:12px;background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 10px;border-radius:8px;align-self:center}
/* language + long-press */
/* Latin text gets a Latin face: CJK fonts draw ’ “ ” as full-width glyphs */
[lang="en"]{--display:"Nunito","Huninn",system-ui,sans-serif;--body:"Nunito","Noto Sans TC",system-ui,sans-serif}
[lang="zh-Hant"]{--display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.face{font-family:var(--body)}
html[lang="en"] .logo,html[lang="en"] .m-name,html[lang="en"] .face .nm,html[lang="en"] button:not(.it){font-weight:700}
.lang-btn{position:absolute;top:calc(12px + env(safe-area-inset-top, 0px));right:16px;font-family:var(--body);font-size:13px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--text)}
.chip.lang{font-family:var(--body);font-size:12px;line-height:1.35;color:var(--text);padding:4px 9px;border-radius:999px;min-width:38px}
.card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.face.alt{display:none}
.card.showalt .face.main{display:none}
.card.showalt .face.alt{display:flex}
.face.alt{outline:2px dashed var(--rc);outline-offset:-6px}
.lp-hint{font-size:12px;color:var(--muted);text-align:center;margin:0}
html[lang="en"] .hero .n{font-size:11px}
html[lang="en"] .logo small{letter-spacing:.02em}
.hero .a{white-space:nowrap;font-size:10.5px}
html[lang="en"] .face .nm{line-height:1.15}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:340px){
  .party{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="splash" id="splash" role="dialog" aria-label="躺平冒險團">
  <svg viewBox="0 0 200 200" aria-hidden="true">
    <defs><line id="tk" x1="100" y1="34" x2="100" y2="44" stroke="#a3a5cf" stroke-width="4" stroke-linecap="round"/></defs>
    <circle cx="100" cy="100" r="78" fill="#262a57" stroke="#ffb347" stroke-width="8"/>
    <circle cx="100" cy="100" r="66" fill="#1d2044"/>
    <use href="#tk" transform="rotate(0 100 100)"/><use href="#tk" transform="rotate(30 100 100)"/><use href="#tk" transform="rotate(60 100 100)"/><use href="#tk" transform="rotate(90 100 100)"/><use href="#tk" transform="rotate(120 100 100)"/><use href="#tk" transform="rotate(150 100 100)"/><use href="#tk" transform="rotate(180 100 100)"/><use href="#tk" transform="rotate(210 100 100)"/><use href="#tk" transform="rotate(240 100 100)"/><use href="#tk" transform="rotate(270 100 100)"/><use href="#tk" transform="rotate(300 100 100)"/><use href="#tk" transform="rotate(330 100 100)"/>
    <line x1="100" y1="100" x2="100" y2="142" stroke="#f1efff" stroke-width="7" stroke-linecap="round"/>
    <line class="clk-min" x1="100" y1="100" x2="100" y2="46" stroke="#ffb347" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="7" fill="#ffb347"/>
    <g class="clk-z" fill="#a3a5cf" font-family="Huninn, sans-serif" font-size="16"><text x="160" y="36">z</text><text x="172" y="20" font-size="12">z</text></g>
    <g class="clk-stamp">
      <rect x="112" y="140" width="76" height="36" rx="6" fill="#13142b" stroke="#ff7070" stroke-width="4"/>
      <text x="150" y="166" text-anchor="middle" fill="#ff7070" font-family="Huninn, sans-serif" font-size="21" font-weight="700">18:00</text>
    </g>
  </svg>
  <h1 class="t" data-s="title">躺平冒險團</h1>
  <p class="slogan" data-s="slogan">撐到下班，就是勝利。</p>
  <p class="sub" data-s="splashSub">抽卡就好，打怪交給夥伴。</p>
  <button id="startBtn" data-s="start">打卡上工</button>
  <p class="sub" id="splashHint" data-s="hintTap">👆 點一下畫面，開啟音樂</p>
  <button class="lang-btn" id="langBtn2" aria-label="Switch language">EN</button>
</div>
<div class="wrap">
  <header class="top">
    <div class="logo"><span data-s="title">躺平冒險團</span><small data-s="tagline">只要抽卡，其他交給夥伴</small></div>
    <div class="chips">
      <button class="chip lang" id="langBtn" aria-label="Switch language">EN</button>
      <button class="chip snd" id="soundBtn" aria-label="關閉聲音">🔊</button>
      <span class="chip">💎 <b class="num" id="gems">10</b></span>
      <span class="chip" id="floorChip"></span>
    </div>
  </header>
  <div class="floors" id="floors"></div>

  <section class="stage">
    <div class="monster">
      <div class="m-emoji" id="mEmoji">🍄</div>
      <div>
        <div class="m-floor" id="mFloor"></div>
        <div class="m-name" id="mName"></div>
        <div class="m-quote" id="mQuote"></div>
        <div class="bar"><span id="mBar" style="width:100%"></span></div>
        <div class="m-stat num"><span id="mHp"></span><span id="mAtk"></span></div>
      </div>
    </div>
    <div class="party" id="party"></div>
    <div class="log" id="log" aria-live="polite"></div>
  </section>

  <div class="actions">
    <button class="btn-pull" id="pull1"><span data-s="pull1">抽一張</span><small>💎 1</small></button>
    <button class="btn-pull" id="pull10"><span data-s="pull10">十連抽</span><small data-s="pull10sub">💎 10・必出史詩以上</small></button>
    <button class="btn-go" id="go"><span data-s="go">出發！</span><small id="goHint"></small></button>
  </div>
  <button class="btn-skip" id="skipBtn" aria-pressed="false"></button>

  <div class="buffs" id="buffs"></div>
  <div class="foot">
    <span id="pity"></span>
    <span style="display:flex;gap:6px">
      <button id="teamBtn" data-s="teamBtn">隊伍</button>
      <button id="dexBtn" data-s="dexBtn">圖鑑</button>
      <button id="helpBtn" data-s="rulesBtn">規則</button>
    </span>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>

<script>
/* ---------- language ---------- */
let LANG='zh'; try{ if(localStorage.getItem('clockout-lang')==='en') LANG='en'; }catch(e){}
const other=l=>l==='en'?'zh':'en';
const tx=(zh,en,l=LANG)=>l==='en'?en:zh;
/* N(item, field, lang): the zh value lives on the item, the en value in item.en */

/* ---------- team ---------- */
function heroStats(id){
  const h=H[id], st=S.roster[id], m=1+0.25*(st-1);
  return {id, h, stars:st, hp:Math.round(h.hp*m)+S.bHp, atk:Math.round(h.atk*m)+S.bAtk};
}
function autoTeam(){
  return Object.keys(S.roster).map(heroStats)
    .sort((a,b)=>(b.atk*3+b.hp)-(a.atk*3+a.hp)).slice(0,4);
}
/* auto: the 4 strongest. manual: the player's picks, in the player's order */
function team(){
  if(S.teamMode!=='manual') return autoTeam();
  S.team=S.team.filter(id=>S.roster[id]).slice(0,4);
  if(!S.team.length) S.team=autoTeam().map(t=>t.id);
  return S.team.map(heroStats);
}

/* log lines are stored as [zh,en] so the log can switch language too */
const logLines=[];
function log(text,cls=''){
  const pair=Array.isArray(text)?text:[text,text];
  logLines.push({pair,cls}); if(logLines.length>80) logLines.shift();
  const p=document.createElement('p'); p.textContent=pair[LANG==='en'?1:0]; if(cls)p.className=cls;
  $('log').appendChild(p); $('log').scrollTop=$('log').scrollHeight;
  while($('log').children.length>80) $('log').firstChild.remove();
}
function redrawLog(){
  $('log').innerHTML='';
  logLines.forEach(({pair,cls})=>{const p=document.createElement('p');p.textContent=pair[LANG==='en'?1:0];if(cls)p.className=cls;$('log').appendChild(p)});
  $('log').scrollTop=$('log').scrollHeight;
}
function renderFloors(){
  $('floors').setAttribute('aria-label',tx('樓層進度','Floor progress'));
  $('floors').innerHTML=Array.from({length:10},(_,i)=>{
    const f=i+1; return `<i class="${f<S.floor||S.done?'done':f===S.floor?'now':''}"></i>`}).join('');
}
function renderMonster(cur){
  const m=MONSTERS[Math.min(S.floor,10)-1];
  const hp=cur?cur.hp:m.hp, max=cur?cur.max:m.hp;
  $('mEmoji').textContent=m.e; $('mName').textContent=N(m,'name'); $('mQuote').textContent=N(m,'q');
  $('mFloor').textContent=S.floor===10?tx('第 10 層・最終魔王','FLOOR 10 · FINAL BOSS'):tx(`第 ${S.floor} 層`,`FLOOR ${S.floor}`);
  $('mBar').style.width=Math.max(0,hp/max*100)+'%';
  $('mHp').textContent=tx(`生命 ${Math.max(0,hp)} / ${max}`,`HP ${Math.max(0,hp)} / ${max}`);
  $('mAtk').textContent=tx(`攻擊 ${cur?cur.atk:m.atk}`,`ATK ${cur?cur.atk:m.atk}`);
}
function renderParty(units){
  const t=units||team().map(x=>({...x,cur:x.hp,max:x.hp}));
  const comboIds=activeCombos(t.map(u=>u.id)).flatMap(c=>c.members);
  let html='';
  for(let i=0;i<4;i++){
    const u=t[i];
    if(!u){html+=`<div class="hero empty">${Object.keys(S.roster).length>t.length?tx('空位<br>點這裡補人','Empty<br>Tap to add'):tx('空位<br>去抽卡！','Empty<br>Pull a card!')}</div>`;continue}
    const pct=Math.max(0,u.cur/u.max*100);
    html+=`<div class="hero r-${u.h.r} ${u.cur<=0?'dead':''}" data-i="${i}">
      ${comboIds.some(m=>m===u.id)?'<span class="cmb" aria-hidden="true">✨</span>':''}<div class="e">${u.h.e}</div><div class="n">${shortName(u.h)}</div>
      <div class="s">${'★'.repeat(u.stars)}</div>
      <div class="bar hpb ${pct<35?'low':''}"><span style="width:${pct}%"></span></div>
      <div class="a num">⚔ ${u.atk}　♥ ${Math.max(0,u.cur)}</div></div>`;
  }
  $('party').innerHTML=html;
}
function renderUI(){
  $('gems').textContent=S.gems;
  $('floorChip').innerHTML=tx(`第 <b class="num">${Math.min(S.floor,10)}</b> / 10 層`,`Floor <b class="num">${Math.min(S.floor,10)}</b> / 10`);
  renderFloors();
  if(!busy){renderMonster(); renderParty();}
  $('pull1').disabled=busy||S.gems<1; $('pull10').disabled=busy||S.gems<10;
  $('go').disabled=busy||S.done;
  $('goHint').textContent=busy?(fast?tx('快轉中…','Fast-forwarding…'):tx('戰鬥中…（點戰鬥紀錄可快轉）','Fighting… (tap the log to skip)'))
    :S.done?tx('已通關','Cleared!'):tx(`挑戰 ${N(MONSTERS[S.floor-1],'name')}`,`Fight the ${N(MONSTERS[S.floor-1],'name')}`);
  $('pity').textContent=tx(`再抽 ${PITY_MAX-S.pity} 次必出傳說`,`Legendary in ${PITY_MAX-S.pity} pulls`);
  const owned=Object.keys(S.roster).length, combosNow=activeCombos(team().map(t=>t.id)).length;
  $('buffs').innerHTML=tx(`裝備加成（全隊）：攻擊 <b class="num">+${S.bAtk}</b>・生命 <b class="num">+${S.bHp}</b>　｜　夥伴 <b class="num">${owned}</b> / ${HEROES.length}${combosNow?`　｜　組合技 <b class="num">${combosNow}</b>`:''}`,
    `Gear: ATK <b class="num">+${S.bAtk}</b> · HP <b class="num">+${S.bHp}</b>　|　Crew <b class="num">${owned}</b>/${HEROES.length}${combosNow?`　|　Combos <b class="num">${combosNow}</b>`:''}`);
  save();
}

/* ---------- gacha ---------- */
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function rollRarity(min='C'){
  S.pity++; S.pulls++;
  if(S.pity>=PITY_MAX){S.pity=0;return 'L'}
  const allowed=ORDER.slice(ORDER.indexOf(min));
  const tot=allowed.reduce((a,r)=>a+RAR[r].w,0); let x=Math.random()*tot;
  for(const r of allowed){x-=RAR[r].w; if(x<0){if(r==='L')S.pity=0; return r}}
  return allowed[0];
}
function pullOne(min='C',forceType=null){
  const r=rollRarity(min);
  let type=forceType;
  if(!type){const x=Math.random(); type=x<.42?'hero':x<.77?'gear':'event';}
  let pool=(type==='hero'?HEROES:type==='gear'?GEAR:EVENTS).filter(c=>c.r===r);
  if(!pool.length){type='hero';pool=HEROES.filter(c=>c.r===r)}
  const c=pick(pool); const card={type,c,r,tag:null};
  if(type==='hero'){
    if(S.roster[c.id]){ if(S.roster[c.id]<5){S.roster[c.id]++;card.tag={k:'up',n:S.roster[c.id]}} else {S.gems+=2;card.tag={k:'max'}} }
    else {S.roster[c.id]=1;card.tag={k:'new'}; if(S.teamMode==='manual'&&S.team.length<4) S.team.push(c.id);}
  } else if(type==='gear'){
    S.bAtk+=c.atk; S.bHp+=c.hp;
  } else if(c.fx){ c.fx(S) }
  if(type!=='hero'){ if(!S.seen[c.id])card.tag={k:'new'}; S.seen[c.id]=(S.seen[c.id]||0)+1; }
  return card;
}
function tagText(tag,l=LANG){
  if(!tag) return '';
  if(tag.k==='new') return 'NEW';
  if(tag.k==='up') return tx(`升到 ${tag.n}★`,`Up to ${tag.n}★`,l);
  if(tag.k==='max') return tx('滿星・換 💎2','Max ★ · 💎2',l);
  if(tag.k==='stars') return '★'.repeat(tag.n)+'☆'.repeat(5-tag.n);
  return '';
}
function faceHTML(k,l,cls){
  const {type,c,r,tag}=k;
  const sep=l==='en'?' ':'';
  let st='',ds='',q='';
  if(type==='hero'){st=tx(`生命 ${c.hp}｜攻擊 ${c.atk}`,`HP ${c.hp} | ATK ${c.atk}`,l);ds=tx(`【${N(c,'skill',l)}】${N(c,'desc',l)}`,`[${N(c,'skill',l)}] ${N(c,'desc',l)}`,l);q=N(c,'q',l)}
  if(type==='gear'){st=[c.atk?tx(`全隊攻擊 +${c.atk}`,`Team ATK +${c.atk}`,l):'',c.hp?tx(`全隊生命 +${c.hp}`,`Team HP +${c.hp}`,l):''].filter(Boolean).join(' · ');q=N(c,'q',l)}
  if(type==='event'){ds=N(c,'desc',l)}
  const tg=tagText(tag,l);
  return `<div class="face ${cls}" lang="${l==='en'?'en':'zh-Hant'}"><div class="rar">${N(RAR[r],'name',l)}${sep}${typeName(type,l)}</div><div class="e">${c.e}</div>
    <div class="nm">${N(c,'name',l)}</div>${tg?`<div class="tag">${tg}</div>`:''}
    ${st?`<div class="st">${st}</div>`:''}${ds?`<div class="ds">${ds}</div>`:''}${q?`<div class="q">${q}</div>`:''}</div>`;
}
function cardHTML(k,i){
  return `<div class="card r${k.r}" style="--rc:${RAR[k.r].css}" data-i="${i}"><div class="card-in">
    ${faceHTML(k,LANG,'main')}${faceHTML(k,other(LANG),'alt')}
    <div class="back">${tx('抽','?')}</div></div></div>`;
}

function showPulls(cards,title,after){
  const ten=cards.length>1;

  }
  cards.filter(k=>k.type==='hero'&&k.tag&&k.tag.k==='new').forEach(k=>log([`${k.c.e} ${N(k.c,'name','zh')} 加入了冒險團！`,`${k.c.e} ${N(k.c,'name','en')} joined the crew!`],'good'));
  cards.filter(k=>k.type==='gear').forEach(k=>log([`${k.c.e} 裝備了 ${N(k.c,'name','zh')}。`,`${k.c.e} Equipped: ${N(k.c,'name','en')}.`],'sys'));
  cards.filter(k=>k.type==='event'&&!k.c.choices).forEach(k=>log([`${k.c.e} ${N(k.c,'name','zh')}：${N(k.c,'desc','zh')}`,`${k.c.e} ${N(k.c,'name','en')}: ${N(k.c,'desc','en')}`],'gold'));

function showDetail(k){

function runChoices(list,after){

    else { log([`${c.e} ${N(ch,'res','zh')}`,`${c.e} ${N(ch,'res','en')}`],'gold'); renderUI(); runChoices(list,after); }

/* ---------- battle ---------- */
function simulate(){
  const f=S.floor, m0=MONSTERS[f-1];
  const mz=N(m0,'name','zh'), me=N(m0,'name','en');
  const units=team().map(x=>({...x,cur:x.hp,max:x.hp,revived:false}));
  const has=id=>units.some(u=>u.id===id&&u.cur>0);
  const mon={hp:m0.hp,max:m0.hp,atk:m0.atk,rage:false};
  const frames=[]; const snap=(text,cls,hit)=>frames.push({text,cls,hit,mon:{...mon},u:units.map(u=>u.cur)});
  const sz=u=>shortName(u.h,'zh'), se=u=>shortName(u.h,'en');
  let teamAtk=0;
  const combos=activeCombos(units.map(u=>u.id)), C=id=>combos.some(c=>c.id===id);
  if(units.some(u=>u.id==='drill')){teamAtk+=4}
  if(units.some(u=>u.id==='grandma')){teamAtk+=5}
  if(C('night_market')) teamAtk+=3;
  if(C('clockout')) teamAtk+=6;
  snap([`— 第 ${f} 層：${m0.e} ${mz} 出現了！ —`,`— Floor ${f}: ${m0.e} The ${me} appears! —`],'sys');
  combos.forEach(c=>snap([`${c.e} 組合技發動：${c.name}！${c.desc}`,`${c.e} Combo: ${c.en.name}! ${c.en.desc}`],'gold'));
  if(teamAtk) snap([`全隊士氣高昂，攻擊力 +${teamAtk}。`,`The team is fired up! Attack +${teamAtk}.`],'good');
  if(has('typhoon')){const d=Math.round(mon.max*.25);mon.hp-=d;snap([`🌀 颱風假之神宣布停班停課！${mz} 失去 ${d} 生命！`,`🌀 The Typhoon God cancels work and school! The ${me} loses ${d} HP!`],'gold','m')}
  let win=false, stunned=null;
  const hurt=(t,d)=>{
    if(t.id==='guard')d=Math.max(1,d-3);
    if(C('discipline'))d=Math.max(1,d-3);
    t.cur-=d;
    snap([`${m0.e} ${mz} 攻擊 ${sz(t)}，造成 ${d} 傷害。`,`${m0.e} The ${me} hits ${se(t)} for ${d} damage.`],'bad',units.indexOf(t));
    if(m0.trait==='drain'){mon.hp=Math.min(mon.max,mon.hp+d)}
    if(t.cur<=0){
      if(t.id==='engineer'&&(t.reboots||0)<(C('nightshift')?2:1)){t.reboots=(t.reboots||0)+1;t.cur=Math.ceil(t.max/2);snap(['💻 資深工程師重開機了！以一半生命復活。','💻 The Engineer reboots! She’s back with half HP.'],'good')}
      else snap([`${t.h.e} ${sz(t)} 躺平了……`,`${t.h.e} ${se(t)} is down for the count…`],'bad');
    }
  };
  for(let r=1;r<=MAX_ROUNDS;r++){
    snap([`［第 ${r} 回合］`,`[Round ${r}]`],'sys');
    if(m0.trait==='kpi'&&r>1){mon.atk+=3;snap([`🦇 KPI 又往上調了。攻擊力變成 ${mon.atk}。`,`🦇 The KPI goes up again. Attack is now ${mon.atk}.`],'bad')}
    stunned=null;
    if(m0.trait==='meeting'&&r%2===0){
      const alive=units.filter(u=>u.cur>0);
      if(alive.length){stunned=pick(alive);snap([`🐙 ${sz(stunned)} 被拉進會議，這回合無法行動。`,`🐙 ${se(stunned)} gets pulled into a meeting and can’t act this round.`],'bad')}
    }
    if(has('boba')){units.forEach(u=>{if(u.cur>0)u.cur=Math.min(u.max,u.cur+5)});snap(['🧋 店長發飲料，全隊回復 5。','🧋 The Tea Manager hands out drinks. Team heals 5 HP.'],'good')}
    if(has('grandma')){units.forEach(u=>{if(u.cur>0)u.cur=Math.min(u.max,u.cur+(C('temple')?15:10))});const g=C('temple')?15:10;snap([`👵 阿嬤端出滷肉飯，全隊回復 ${g}。`,`👵 A-má brings out braised pork rice. Team heals ${g} HP.`],'good')}
    if(has('clerk')){
      const x=Math.floor(Math.random()*3);
      if(x===0){units.forEach(u=>{if(u.cur>0)u.cur=Math.min(u.max,u.cur+12)});snap(['🏪 店員發了茶葉蛋，全隊回復 12。','🏪 The Clerk hands out tea eggs. Team heals 12 HP.'],'good')}
      else if(x===1){teamAtk+=3;snap(['🏪 店員遞上能量飲料，全隊攻擊 +3。','🏪 The Clerk passes around energy drinks. Team attack +3.'],'good')}
      else {const d=C('nightshift')?40:25;mon.hp-=d;snap([`🏪 店員丟出一整箱泡麵，造成 ${d} 傷害！`,`🏪 The Clerk throws a whole box of instant noodles! ${d} damage!`],'gold','m')}
    }
    for(const u of units){
      if(u.cur<=0||mon.hp<=0||u===stunned)continue;
      if(m0.trait==='dodge'&&Math.random()<.25){snap([`${u.h.e} ${sz(u)} 的攻擊……被已讀不回了。`,`${u.h.e} ${se(u)} attacks… and gets left on read.`],'sys');continue}
      let a=u.atk+teamAtk, nz='', ne='';
      if(u.id==='jie'&&r>=4){a*=2;nz='（準時下班！）';ne=' (Leave on time!)'}
      if(u.id==='uber'&&r===1){a*=C('typhoon_day')?5:3;nz='（準時送達！）';ne=' (Right on time!)'}
      if(u.id==='medium'&&(u.cur<u.max/2||C('temple'))){a*=2;nz='（起乩！）';ne=' (Possessed!)'}
      if(u.id==='fortune'&&Math.random()<(C('night_market')?.5:.3)){a=Math.round(a*2.5);nz='（鐵口直斷，暴擊！）';ne=' (Never wrong! Critical hit!)'}
      let hits=1; if(u.id==='intern'&&Math.random()<.25){hits=2;nz='（連印兩張！）';ne=' (Double copy!)'}
      const dmg=a*hits; mon.hp-=dmg;
      snap([`${u.h.e} ${sz(u)} 攻擊，造成 ${dmg} 傷害${nz}`,`${u.h.e} ${se(u)} attacks for ${dmg} damage${ne}`],'','m');
    }
    if(mon.hp<=0){win=true;break}
    if(m0.trait==='boss'&&!mon.rage&&mon.hp<mon.max/2){mon.rage=true;mon.atk+=15;snap(['🕴️ 加班之王暴怒了！「今天誰都不准走！」攻擊 +15！','🕴️ The King of Overtime is furious! “Nobody leaves today!” Attack +15!'],'bad')}
    const aoe=(m0.trait==='aoe'&&r%3===0)||(m0.trait==='storm'&&r%2===0);
    if(aoe){
      const d=Math.round(mon.atk*.6);
      snap(m0.trait==='aoe'?['📊 月底結算！報表砸向全隊！','📊 Month-end report! Spreadsheets rain down on the team!']:['👻 狂風暴雨掃過全隊！','👻 Wind and rain sweep over the team!'],'bad');
      units.filter(u=>u.cur>0).forEach(u=>hurt(u,d));
    } else {
      let strikes=m0.trait==='boss'?2:1;
      if(m0.trait==='bite'&&Math.random()<.3){strikes=2;snap(['📎 喀嚓喀嚓！釘書機連咬兩口！','📎 Clack clack! The stapler bites twice!'],'bad')}
      for(let s=0;s<strikes;s++){
        const alive=units.filter(u=>u.cur>0); if(!alive.length)break;
        const t=m0.trait==='weak'?alive.reduce((a,b)=>b.cur<a.cur?b:a):pick(alive);
        hurt(t,mon.atk);
      }
    }
    if(units.every(u=>u.cur<=0))break;
    if(r===MAX_ROUNDS) snap(['🔔 下班鐘響了，怪物還站著。大家默默收拾東西回家……','🔔 The clock-out bell rings, and the monster is still standing. Everyone quietly packs up and goes home…'],'bad');
  }
  return {units,frames,win,m0};
}
$('go').onclick=()=>{

  busy=true; fast=false; document.body.classList.add('fighting'); renderSkip(); renderUI(); Sound.play(S.floor===10?'boss':'battle');
  const {units,frames,win,m0}=simulate();

      if(S.floor===10){S.done=true;renderUI();openModal(`<div class="big">🏖️</div><h2>${tx('加班之王倒下了！','The King of Overtime is down!')}</h2>
        <p class="center">${tx('整棟大樓的燈一盞一盞熄滅。今天，所有人都準時下班。','One by one, the lights in the building go out. Today, everyone leaves on time.')}</p>
        <p class="summary">${tx(`抽卡 ${S.pulls} 次・勝 ${S.wins} 場・躺平 ${S.losses} 次・夥伴 ${Object.keys(S.roster).length}/${HEROES.length}`,`Pulls ${S.pulls} · Wins ${S.wins} · Wipeouts ${S.losses} · Crew ${Object.keys(S.roster).length}/${HEROES.length}`)}</p>
        <div class="btns"><button id="mAgain">${tx('再冒險一次','Play again')}</button><button id="mStay">${tx('先躺一下','Rest for now')}</button></div>`);

      S.floor++;
      renderUI();
      openModal(`<div class="big">${m0.e}</div><h2>${tx(`第 ${S.floor-1} 層通過！`,`Floor ${S.floor-1} cleared!`)}</h2>
        <p class="center">${tx(`獲得 💎 ${reward}。樓梯往下延伸，下一層傳來 ${MONSTERS[S.floor-1].e} 的氣息。`,`You get 💎 ${reward}. The stairs lead down. Something ${MONSTERS[S.floor-1].e} is waiting on the next floor.`)}</p>
        <div class="btns"><button id="mOk">${tx('繼續','Continue')}</button></div>`);
      $('mOk').onclick=closeModal;
    } else {
      S.gems+=LOSS_GEMS; S.losses++; Sound.sfx.lose();
      log([`💤 全員躺平。領到躺平補償金 💎 ${LOSS_GEMS}。抽點新夥伴再來吧！`,`💤 Everyone’s down. You get 💎 ${LOSS_GEMS} as comfort pay. Pull some new crew and try again!`],'sys');
      renderUI();
      openModal(`<div class="big">💤</div><h2>${tx('全員躺平','Total Wipeout')}</h2>
        <p class="center">${tx(`${mn} 太強了。大家決定先回家睡覺。<br>補償金 💎 ${LOSS_GEMS} 已發放，抽點新夥伴再來！`,`The ${mn} was too strong. Everyone decides to go home and sleep.<br>You get 💎 ${LOSS_GEMS} comfort pay. Pull some new crew and try again!`)}</p>

  function init(){

  }
  function kick(t){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+.12);
    g.gain.setValueAtTime(.7,t); g.gain.exponentialRampToValueAtTime(.001,t+.15);

    <span class="cn">${N(c,'name')}${on?`<b>${tx('發動中','ON')}</b>`:''}</span>
    <span class="cd">${N(c,'desc')}</span><span class="cm">${who}</span>
    ${ready?`<span class="go">${tx('▶ 點一下，讓他們上場','▶ Tap to put them on the team')}</span>`:''}`;
  return ready?`<button class="combo" data-combo="${c.id}">${inner}</button>`:`<div class="combo ${on?'on':''}">${inner}</div>`;
}
/* put a combo's members on the team; keep the strongest of the others for the remaining slots */
function useCombo(id){
  const c=COMBOS.find(x=>x.id===id); if(!c) return;
  const cur=team().map(t=>t.id);
  const keep=cur.filter(m=>!c.members.includes(m)).map(heroStats).sort((a,b)=>(b.atk*3+b.hp)-(a.atk*3+a.hp)).map(t=>t.id);
  S.teamMode='manual'; S.team=[...c.members,...keep].slice(0,4); teamSel=null;
  teamMsg=tx(`${c.e} ${c.name} 的成員上場了！`,`${c.e} ${c.en.name} is ready to go!`);
  renderUI(); openTeam();
}
document.addEventListener('click',e=>{const b=e.target.closest('button.combo[data-combo]'); if(b&&!$('overlay').hidden) useCombo(b.dataset.combo);});
function toManual(){ if(S.teamMode!=='manual'){ S.team=autoTeam().map(t=>t.id); S.teamMode='manual'; } }
function openTeam(){
  modalView=openTeam;
  const cur=team(), ids=cur.map(t=>t.id);
  const bench=Object.keys(S.roster).filter(id=>!ids.includes(id)).map(heroStats).sort((a,b)=>(b.atk*3+b.hp)-(a.atk*3+a.hp));
  const chip=(t,extra,attrs)=>`<button class="it ${extra}" ${attrs} style="--rc:${RAR[t.h.r].css}"><div class="e">${t.h.e}</div>${shortName(t.h)}<br><span class="sub">${'★'.repeat(t.stars)}</span><span class="stat num">⚔${t.atk} ♥${t.hp}</span></button>`;
  let slots='';
  for(let i=0;i<4;i++){
    const t=cur[i];
    slots+=t?chip(t,teamSel===i?'sel':'',`data-slot="${i}"`):`<button class="it empty-slot" data-slot="${i}"><div class="e">＋</div>${tx('空位','Empty')}</button>`;
  }
  const hint=teamMsg?`<p class="team-hint warn" role="status">${teamMsg}</p>`
    :`<p class="team-hint">${teamSel!=null?tx('點一位候補夥伴來交換，或按「移到候補」。','Tap someone on the bench to swap, or press “Move to bench”.')
      :S.teamMode==='manual'?tx('點隊伍裡的人，再點候補的人來交換。','Tap a team member, then someone on the bench to swap.')
      :tx('目前由戰力最高的 4 位自動上場。點任何人就能改成手動。','The 4 strongest fight automatically. Tap anyone to switch to Manual.')}</p>`;
  const all=COMBOS.map(c=>comboHTML(c,ids)).join('');
  openModal(`<h2>${tx('隊伍','Team')}</h2>
    <div class="seg" role="group"><button data-mode="auto" aria-pressed="${S.teamMode!=='manual'}">${tx('自動（最強 4 位）','Auto (strongest 4)')}</button><button data-mode="manual" aria-pressed="${S.teamMode==='manual'}">${tx('手動','Manual')}</button></div>
    <div class="dex slots">${slots}</div>${hint}
    ${teamSel!=null&&cur.length>1?`<button class="danger-link" id="mBench">${tx('移到候補','Move to bench')}</button>`:''}
    <h3 class="sec">${tx('候補','Bench')}</h3>
    ${bench.length?`<div class="dex">${bench.map(t=>chip(t,'',`data-bench="${t.id}"`)).join('')}</div>`:`<p class="summary">${tx('還沒有候補夥伴。多抽幾張吧！','No one on the bench yet. Pull more cards!')}</p>`}
    <h3 class="sec">${tx('組合技','Combos')}</h3><div class="combos">${all}</div>
    <div class="btns"><button id="mOk">${tx('完成','Done')}</button></div>`);
  teamMsg=null;
  const m=$('modal');
  m.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    if(b.dataset.mode==='auto'){S.teamMode='auto';S.team=[];} else toManual();
    teamSel=null; renderUI(); openTeam();
  });
  m.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.slot; toManual();
    if(!cur[i]){ teamSel=null; teamMsg=bench.length?tx('點一位候補夥伴補上這個空位。','Tap someone on the bench to fill this slot.'):tx('還沒有候補夥伴。','No one on the bench yet.'); }
    else teamSel=(teamSel===i?null:i);
    renderUI(); openTeam();
  });
  m.querySelectorAll('[data-bench]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.bench; toManual();
    if(teamSel!=null&&S.team[teamSel]) S.team[teamSel]=id;
    else if(S.team.length<4) S.team.push(id);
    else teamMsg=tx('隊伍滿了。先點隊伍裡要換下來的人。','The team is full. First tap the team member you want to swap out.');
    teamSel=null; renderUI(); openTeam();
  });
  if($('mBench')) $('mBench').onclick=()=>{ S.team.splice(teamSel,1); teamSel=null; renderUI(); openTeam(); };
  $('mOk').onclick=()=>{teamSel=null;closeModal()};
}
$('teamBtn').onclick=()=>{teamSel=null;openTeam()};
function reset(){S=fresh();logLines.length=0;$('log').innerHTML='';intro();renderUI()}
function intro(){
  log(['潮濕的風從洞裡吹出來，帶著烤地瓜的味道。','A damp wind blows out of the cave. It smells like roasted sweet potatoes.'],'sys');
  log(['🛡️ 打工仔騎士・阿傑 扛起盾牌，走到你前面。','🛡️ Jie, Part-Time Knight, lifts his shield and steps in front of you.'],'good');
  log(['抽卡補強隊伍，然後按「出發！」。','Pull cards to build your team, then press “Go!”.'],'sys');
}

/* ---------- language switch ---------- */
function setLang(l){
  LANG=l; try{localStorage.setItem('clockout-lang',l)}catch(e){}
  applyStatic(); renderSound(); renderSkip(); redrawLog(); renderUI();
  if(busy) $('goHint').textContent=fast?tx('快轉中…','Fast-forwarding…'):tx('戰鬥中…（點戰鬥紀錄可快轉）','Fighting… (tap the log to skip)');
  if(!$('overlay').hidden && modalView) modalView();
  const hint=$('splashHint'); if(hint.dataset.state) hint.textContent=splashHintText(hint.dataset.state);
}
$('langBtn').onclick=()=>setLang(other(LANG));
$('langBtn2').onclick=e=>{e.stopPropagation();setLang(other(LANG))};
$('langBtn2').addEventListener('pointerdown',e=>e.stopPropagation());

applyStatic(); renderSound(); intro(); renderUI();

/* ---------- splash ---------- */
function splashHintText(state){
  return state==='muted'?tx('🔇 聲音已關閉，進入遊戲後可以用右上角的喇叭打開。','🔇 Sound is off. Turn it on with the speaker button after you clock in.')
    :tx('🔊 進入遊戲後，可以用右上角的喇叭關掉聲音。','🔊 You can turn the sound off with the speaker button later.');
}
$('splash').addEventListener('click',e=>{
  if(e.target.closest('#startBtn')||e.target.closest('#langBtn2')) return;
  Sound.init();
  const hint=$('splashHint');
  if(!Sound.isOn()){ hint.dataset.state='muted'; hint.textContent=splashHintText('muted'); return; }
  if(window.splashPlayed) return; window.splashPlayed=true;
  Sound.unlock().then(()=>{
    /* restart the clock and schedule the sounds in the same frame so they stay in step */
    requestAnimationFrame(()=>{
      const svg=$('splash').querySelector('svg'); svg.replaceWith(svg.cloneNode(true));
      [.3,.7,1.1].forEach(t=>Sound.sfx.tickTock(t)); Sound.sfx.bell(1.55);
      /* music starts on the audio clock, one second after the ding */
      if(!$('splash').classList.contains('bye')) Sound.play('title',2.55);
    });
  });
  hint.dataset.state='on'; hint.textContent=splashHintText('on');
});
$('startBtn').onclick=()=>{Sound.unlock();if(Sound.isOn()){Sound.sfx.punch();Sound.play('lobby')}const sp=$('splash');sp.classList.add('bye');setTimeout(()=>sp.hidden=true,360)};
$('startBtn').focus();
</script>

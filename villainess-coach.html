<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Villainess Coach's Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: a coach's lesson binder. A sticky header with episode and tabs, one column of cards to tick,
   and a full-screen class view that shows only the ticked cards, large, one at a time. */
:root{
  --bg:#F4F0F4; --card:#FFFDFE; --ink:#2A1F2E; --dim:#6E6072; --line:#E0D6E1; --accent:#A8344F; --accent-ink:#FFFFFF;
  --gold:#A87C24; --tint:#F3E6EA; --stage:#1B1320; --stage-ink:#F4EAEF; --stage-dim:#B5A2B6; --stage-card:#271C2E;
  --sweet:#C85A86; --bold:#C2621F; --sly:#5E6FB8;
  --f-disp:'IM Fell English SC','IM Fell English',Georgia,'Times New Roman',serif;
  --f-tale:'IM Fell English',Georgia,'Noto Serif TC','PingFang TC',serif;
  --f-body:'Atkinson Hyperlegible','PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#150F19; --card:#1F1726; --ink:#F1E8EE; --dim:#AE9EB2; --line:#3A2D42; --accent:#E57A98; --accent-ink:#1B1218;
  --gold:#E2BC62; --tint:#2B1E30; --sweet:#E58AB0; --bold:#E8955A; --sly:#93A2EA; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#150F19; --card:#1F1726; --ink:#F1E8EE; --dim:#AE9EB2; --line:#3A2D42; --accent:#E57A98; --accent-ink:#1B1218;
  --gold:#E2BC62; --tint:#2B1E30; --sweet:#E58AB0; --bold:#E8955A; --sly:#93A2EA; color-scheme:dark;
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px;}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);}
.top{display:flex;align-items:center;gap:12px;padding-block:12px 6px;flex-wrap:wrap;}
.brand{flex:1;min-width:200px;}
.brand small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
.brand h1{font-family:var(--f-disp);font-weight:400;font-size:24px;line-height:1.1;margin:0;text-wrap:balance;}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:4px 8px;scrollbar-width:none;}
.tab{flex:none;padding:6px 12px;border-radius:999px;font-size:15px;color:var(--dim);border:1px solid transparent;}
.tab b{font-weight:400;font-size:12px;margin-left:4px;color:var(--dim);font-variant-numeric:tabular-nums;}
.tab.on{background:var(--ink);color:var(--bg);} .tab.on b{color:var(--bg);opacity:.75;}
main{padding-block:16px 120px;}
.lead{display:grid;gap:4px;margin-bottom:16px;}
.lead p{margin:0;max-width:65ch;}
.lead .focus{font-size:14px;color:var(--dim);}
.lead .focus b{color:var(--accent);font-weight:700;}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:4px 0 10px;}
.sec-h h2{font-family:var(--f-disp);font-weight:400;font-size:22px;margin:0;}
.sec-h button{font-size:14px;color:var(--accent);}
.list{display:flex;flex-direction:column;gap:10px;}
.card{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.card.picked{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);}
.pick{grid-row:1 / span 6;align-self:start;display:flex;align-items:center;justify-content:center;width:28px;height:28px;margin-top:1px;cursor:pointer;}
.pick input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;}
.card > *:not(.pick){grid-column:2;min-width:0;}
.hw{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.hw .w{font-family:var(--f-tale);font-size:22px;line-height:1.2;}
.hw .kk,.hw .pos{color:var(--dim);font-size:14px;}
.zh{color:var(--accent);}
.ctx{font-family:var(--f-tale);font-style:italic;font-size:16px;margin:2px 0 0;padding-left:10px;border-left:2px solid var(--line);}
.ctx mark{background:none;color:inherit;font-style:normal;font-weight:700;border-bottom:2px solid var(--gold);}
.more{font-size:14px;color:var(--dim);margin:0;}
.spk{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:var(--dim);flex:none;}
.spk:hover{color:var(--accent);} .spk svg{width:18px;height:18px;fill:currentColor;}
.gt{font-weight:700;font-size:17px;} .gt .zh{font-weight:400;font-size:14px;margin-left:6px;}
.how{margin:0;font-size:15px;}
.ex{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;}
.ex li{font-family:var(--f-tale);font-size:16px;padding-left:10px;border-left:2px solid var(--line);}
.try{font-size:14px;margin:2px 0 0;} .try b{color:var(--gold);}
table.reg{width:100%;border-collapse:collapse;font-size:15px;margin-top:4px;}
.reg td{padding:5px 0;border-top:1px solid var(--line);vertical-align:top;}
.reg td:first-child{width:38%;padding-right:10px;color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.04em;}
.reg td:last-child{font-family:var(--f-tale);font-size:16px;}
.tag{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:999px;background:var(--tint);color:var(--accent);margin-bottom:2px;justify-self:start;}
.q{font-size:17px;margin:0;}
.opts{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;}
.opts li{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:baseline;}
.tone{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;min-width:44px;}
.tone.sweet{color:var(--sweet);} .tone.bold{color:var(--bold);} .tone.sly{color:var(--sly);}
.opts .ot{font-family:var(--f-tale);font-size:16px;}
.opts .fx{grid-column:2;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom, 0px);}
.dock .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;}
.dock .n{flex:1;font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums;}
.dock .n b{color:var(--ink);}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line);font-weight:400;}
.btn:disabled{opacity:.4;cursor:default;}
.empty{color:var(--dim);font-size:15px;}

/* class view: always the dark stage, so it reads well on a shared screen */
#cv{position:fixed;inset:0;z-index:60;background:var(--stage);color:var(--stage-ink);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));}
#cv .bar{display:flex;align-items:center;gap:8px;padding-block:10px;max-width:1000px;width:100%;margin:0 auto;}
#cv .bar .pos{flex:1;font-size:15px;color:var(--stage-dim);font-variant-numeric:tabular-nums;}
#cv .bar button{min-height:40px;padding:6px 12px;border-radius:8px;border:1px solid #4A3552;color:var(--stage-ink);}
#cv .bar button.on{background:var(--stage-ink);color:var(--stage);}
#cv .stage{flex:1;min-height:0;overflow-y:auto;display:flex;align-items:center;}
#cv .slide{max-width:1000px;width:100%;margin:0 auto;padding-block:20px 40px;font-size:clamp(20px,3.2vw,30px);line-height:1.45;}
#cv .kicker{font-size:.55em;letter-spacing:.14em;text-transform:uppercase;color:#E2BC62;margin:0 0 .4em;}
#cv .big{font-family:var(--f-tale);font-size:2.2em;line-height:1.1;margin:0 0 .15em;}
#cv .sub{color:var(--stage-dim);font-size:.7em;}
#cv .zh{color:#F2A3BC;}
#cv .ctx{border-left-color:#4A3552;font-size:1em;margin:.6em 0;}
#cv .ctx mark{border-bottom-color:#E2BC62;}
#cv .more,#cv .how,#cv .try{color:var(--stage-dim);font-size:.75em;margin:.4em 0 0;}
#cv .try b{color:#E2BC62;}
#cv .ex li{font-size:1em;border-left-color:#4A3552;margin-bottom:.3em;}
#cv table.reg{font-size:.85em;} #cv .reg td{border-top-color:#3A2D42;} #cv .reg td:first-child{color:var(--stage-dim);}
#cv .reg td:last-child{font-size:1.1em;}
#cv .q{font-size:1.25em;line-height:1.35;}
#cv .opts .ot{font-size:1em;} #cv .tone{font-size:.5em;} #cv .opts .fx{color:var(--stage-dim);font-size:.55em;}
#cv .tone.sweet{color:#E58AB0;} #cv .tone.bold{color:#E8955A;} #cv .tone.sly{color:#93A2EA;}
#cv .spk{color:var(--stage-dim);width:44px;height:44px;} #cv .spk svg{width:28px;height:28px;}
.cvzh-off #cv .zh{display:none;}
@media (max-width:520px){ .reg td:first-child{width:34%;} #cv .bar .lbl{display:none;} }
@media (prefers-reduced-motion: no-preference){ #cv .slide{animation:rise .25s ease-out;} @keyframes rise{from{opacity:.4;transform:translateY(6px);}to{opacity:1;transform:none;}} }
</style>
<style>[hidden]{display:none!important;} :root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);}</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><small>The Villainess Has Read the Book</small><h1>Coach's Companion</h1></div>
      <select id="ep" aria-label="Episode"></select>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="dock"><div class="wrap">
  <span class="n" id="count"></span>
  <button class="btn alt" id="clear">Clear</button>
  <button class="btn" id="go">Class view</button>
</div></div>
<div id="cv" hidden>
  <div class="bar">
    <span class="pos" id="cvPos"></span>
    <button id="cvZh" aria-pressed="false">中文</button>
    <button id="cvPrev" aria-label="Previous">‹<span class="lbl"> Back</span></button>
    <button id="cvNext" aria-label="Next"><span class="lbl">Next </span>›</button>
    <button id="cvX">Close</button>
  </div>
  <div class="stage"><div class="slide" id="cvSlide"></div></div>
</div>
<script>
const STORY = {"episodes":[{"n":1,"title":"Chapter One, Again","nodes":[{"t":"bg","v":"bedroom"},{"t":"music","v":"manor"},{"t":"line","who":"","text":"Silk.","zh":"絲綢。"},{"t":"line","who":"","text":"That's the first thing I notice. Silk under my cheek, silk over my legs, and a smell like roses and money.","zh":"這是我注意到的第一件事。臉頰下是絲綢，腿上蓋的也是絲綢，空氣裡有玫瑰和金錢的味道。"},{"t":"line","who":"","text":"I open my eyes. Above me hangs a [[canopy]] of pale gold cloth with little [[tassels|tassel]]. My apartment has a ceiling fan with one dead light bulb.","zh":"我睜開眼睛。頭頂垂著淡金色的床帳，綴著小小的流蘇。我的公寓只有一台吊扇，上面還有一顆燒壞的燈泡。"},{"t":"line","who":"","text":"This is not my apartment.","zh":"這不是我的公寓。"},{"t":"sfx","v":"knock"},{"t":"line","who":"","text":"Someone knocks. Three small taps, very careful.","zh":"有人敲門。輕輕的三下，小心翼翼。"},{"t":"show","who":"pip","ex":"nervous"},{"t":"gesture","who":"pip","g":"tremble"},{"t":"line","who":"pip","ex":"nervous","text":"Good morning, my lady. I brought your tea.","zh":"小姐早安。我把您的茶端來了。"},{"t":"line","who":"","text":"A girl in a black-and-white maid's dress stands in the doorway. The cups on her tray [[rattle]].","zh":"一個穿著黑白女僕裝的女孩站在門口。她托盤上的茶杯喀啦喀啦地響。"},{"t":"line","who":"","text":"She isn't scared of the tray. She's scared of me.","zh":"她怕的不是托盤。她怕的是我。"},{"t":"line","who":"","text":"Her name pops into my head: Pip. I've never seen her before in my life, but I know it like my own phone number.","zh":"她的名字突然冒進我腦中：琵普。我這輩子從沒見過她，卻熟得像自己的電話號碼。"},{"t":"choice","opts":[{"text":"\"Thank you, Pip. That smells wonderful.\"","tone":"sweet","fx":[{"k":"pip","d":1}],"to":"pip_sweet","zh":"「謝謝妳，琵普。好香啊。」"},{"text":"\"You're shaking. Sit down and drink it yourself.\"","tone":"bold","fx":[{"k":"pip","d":1}],"to":"pip_bold","zh":"「妳在發抖。坐下來，自己喝吧。」"},{"text":"\"Remind me. What day is it today?\"","tone":"sly","fx":[],"to":"pip_sly","zh":"「提醒我一下，今天是什麼日子？」"}]},{"t":"line","who":"pip","ex":"shocked","text":"Thank you… my lady?","zh":"謝謝……小姐？"},{"t":"line","who":"","text":"She says it like a question. She puts the tray down and steps back, fast.","zh":"她說得像在問問題。她放下托盤，飛快地往後退。"},{"t":"line","who":"pip","ex":"worried","text":"Is my lady feeling well?","zh":"小姐，您身體還好嗎？"},{"t":"goto","to":"mirror"},{"t":"line","who":"pip","ex":"shocked","text":"Sit? On… on your bed, my lady?","zh":"坐？坐……坐在您的床上嗎，小姐？"},{"t":"line","who":"eve","ex":null,"text":"In a chair. Anywhere. You look like you need it more than I do.","zh":"坐椅子上。坐哪都行。妳看起來比我更需要這杯茶。"},{"t":"line","who":"","text":"She sits on the very edge of a chair, like it might bite her. She doesn't touch the tea.","zh":"她只坐在椅子最邊邊，好像椅子會咬人似的。茶，她一口也沒碰。"},{"t":"line","who":"","text":"Still. It's a start.","zh":"不過，總算是個開始。"},{"t":"goto","to":"mirror"},{"t":"line","who":"pip","ex":"nervous","text":"It's the day of the Queen's garden party, my lady. You've talked about it for a month.","zh":"小姐，今天是王后的花園派對。您已經念了一整個月了。"},{"t":"line","who":"eve","ex":null,"text":"Have I?","zh":"是嗎？"},{"t":"line","who":"pip","ex":"deadpan","text":"You said, and I quote, \"I will make that little country mouse cry in front of the whole court.\"","zh":"您的原話是：「我要讓那隻鄉下小老鼠當著全宮廷的面哭出來。」"},{"t":"line","who":"","text":"Oh no.","zh":"糟了。"},{"t":"goto","to":"mirror"},{"t":"hide","who":"pip"},{"t":"line","who":"","text":"Pip hurries out to get my dress for the garden party. I walk to the tall mirror by the window.","zh":"琵普匆匆出去拿我參加花園派對要穿的禮服。我走到窗邊那面高高的鏡子前。"},{"t":"show","who":"eve","ex":"shocked"},{"t":"line","who":"","text":"Pale gold hair in perfect curls. Sharp violet eyes. A face that looks expensive and a little bit mean.","zh":"一頭淡金色的完美捲髮。銳利的紫羅蘭色眼睛。一張看起來很貴、又有點壞心眼的臉。"},{"t":"line","who":"","text":"I know this face. I {{read|red}} about it last night, in bed, at two in the morning.","zh":"我認得這張臉。昨晚凌晨兩點，我躺在床上讀過她。"},{"t":"line","who":"","text":"*The Rose of Ellery*, Chapter One: \"Lady Evangeline Ashcroft was beautiful, and cold as a winter blade.\"","zh":"《艾勒里的玫瑰》第一章：「伊凡潔琳・艾許克羅夫特小姐美麗動人，卻冷得像一把寒冬的刀。」"},{"t":"line","who":"","text":"I'm the [[villainess]]. In Chapter Thirty, they send her to the Frost Isles forever. Her last line in the whole book is, \"No one ever spoke her name again.\"","zh":"我是惡役千金。第三十章，她被永遠流放到霜島。整本書寫到她的最後一句是：「從此再也沒有人提起她的名字。」"},{"t":"gesture","who":"eve","g":"shake"},{"t":"line","who":"eve","ex":"shocked","text":"No. No, no, no.","zh":"不。不不不不。"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"Ding! Hello, Lady Evangeline!","zh":"叮！伊凡潔琳小姐，您好！"},{"t":"line","who":"system","ex":null,"text":"Welcome to the Doom Prevention System, version {{2.3|two point three}} ({{Beta|bay-tuh}}).","zh":"歡迎使用「防止毀滅系統」2.3 版（測試版）。"},{"t":"doom","set":87},{"t":"line","who":"system","ex":null,"text":"Your current [[Doom|doom]]: 87%.","zh":"您目前的毀滅指數：87%。"},{"t":"line","who":"system","ex":null,"text":"Please accept the [[Terms and Conditions|terms]] to continue.","zh":"請同意使用條款以繼續。"},{"t":"choice","opts":[{"text":"\"Accept. Just help me.\"","tone":"bold","fx":[],"to":"sys_bold","zh":"「同意。快幫我就對了。」"},{"text":"\"Can I read the terms first?\"","tone":"sly","fx":[],"to":"sys_sly","zh":"「我可以先看一下條款嗎？」"},{"text":"\"Is this a dream?\"","tone":"sweet","fx":[],"to":"sys_sweet","zh":"「這是夢嗎？」"}]},{"t":"line","who":"system","ex":null,"text":"Great choice! You are a fast reader.","zh":"很棒的選擇！您讀得真快。"},{"t":"goto","to":"rules"},{"t":"line","who":"system","ex":null,"text":"Of course! Terms: 1. Don't get [[exiled|exile]]. 2. See Term 1.","zh":"當然可以！條款：一、不要被流放。二、請見第一條。"},{"t":"line","who":"system","ex":null,"text":"Thank you for reading!","zh":"感謝您的閱讀！"},{"t":"goto","to":"rules"},{"t":"line","who":"system","ex":null,"text":"No! Dreams don't have a customer service team. I do.","zh":"不是喔！夢可沒有客服團隊。我有。"},{"t":"goto","to":"rules"},{"t":"line","who":"system","ex":null,"text":"Here's how it works. Act like the old Evangeline, and your Doom goes up. Surprise the story, and it goes down.","zh":"規則是這樣的：表現得像原本的伊凡潔琳，毀滅指數就會上升；讓故事出乎意料，指數就會下降。"},{"t":"line","who":"system","ex":null,"text":"If your Doom is still high at the Winter Ball…","zh":"如果到了冬季舞會，您的毀滅指數還很高……"},{"t":"line","who":"system","ex":null,"text":"Well! Let's stay positive!","zh":"嗯！我們保持正面思考吧！"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"New [[quest]]: Survive Chapter One.","zh":"新任務：活過第一章。"},{"t":"show","who":"eve","ex":"worried"},{"t":"line","who":"","text":"Chapter One. The garden party. The fountain.","zh":"第一章。花園派對。噴泉。"},{"t":"line","who":"","text":"In the book, Evangeline pushes Lily into the fountain in front of everyone. Lily comes up wet and crying, and Prince Cedric runs to save her. That's where their love story starts. And that's where mine starts to end.","zh":"書裡，伊凡潔琳當著所有人的面把莉莉推進噴泉。莉莉渾身濕透、哭著爬起來，賽德瑞克王子衝過去救她。他們的愛情故事從這裡開始。我的結局，也從這裡開始。"},{"t":"line","who":"eve","ex":"smug","text":"Easy. I just won't push anybody.","zh":"簡單。我不要推任何人就好了。"},{"t":"line","who":"system","ex":null,"text":"That's the spirit!","zh":"就是這種精神！"},{"t":"line","who":"","text":"The System doesn't sound sure.","zh":"系統聽起來不太有把握。"},{"t":"hide","who":"eve"},{"t":"bg","v":"garden"},{"t":"music","v":"waltz"},{"t":"line","who":"","text":"The Queen's garden is a sea of hats. A string quartet plays under the roses, and everyone holds a teacup and a secret.","zh":"王后的花園是一片帽子的海洋。弦樂四重奏在玫瑰下演奏，每個人手裡都端著一杯茶，心裡都藏著一個祕密。"},{"t":"line","who":"","text":"In the middle of it all stands the fountain. White stone, three levels, a stone swan on top. It looks innocent. It is not.","zh":"正中央立著那座噴泉。白色的石頭，三層，頂端一隻石天鵝。它看起來很無辜。它才不是。"},{"t":"line","who":"","text":"People step out of my way. A woman whispers my name, like a warning.","zh":"人們紛紛讓路給我。一位女士低聲念著我的名字，像在發出警告。"},{"t":"show","who":"lily","ex":"smile"},{"t":"gesture","who":"lily","g":"hop"},{"t":"line","who":"","text":"Then a girl in a pink dress walks right up to me. Brown hair, a simple ribbon, a nervous smile.","zh":"接著，一個穿粉紅洋裝的女孩直直走向我。棕色頭髮，一條簡單的緞帶，一抹緊張的微笑。"},{"t":"line","who":"","text":"Lily Bell. The [[heroine]]. By Chapter Three, everyone in this book loves her.","zh":"莉莉・貝爾。女主角。到了第三章，書裡每個人都愛她。"},{"t":"line","who":"lily","ex":"smile","text":"Lady Evangeline! I'm Lily. I just wanted to say hello. Your dress is so beautiful.","zh":"伊凡潔琳小姐！我是莉莉。我只是想來打聲招呼。您的禮服好美。"},{"t":"line","who":"","text":"In the book, Evangeline looks her up and down and says, \"Who let the country mouse in?\"","zh":"書裡，伊凡潔琳上下打量她，說：「誰把這隻鄉下老鼠放進來的？」"},{"t":"show","who":"eve","ex":"neutral"},{"t":"choice","opts":[{"text":"\"Thank you. Yours is lovely too. Pink really suits you.\"","tone":"sweet","fx":[{"k":"lily","d":1},{"k":"doom","d":-2}],"to":"lily_sweet","zh":"「謝謝妳。妳的也很漂亮，粉紅色真的很適合妳。」"},{"text":"\"Lily, listen to me. Stay away from that fountain today.\"","tone":"bold","fx":[{"k":"doom","d":-1}],"to":"lily_bold","zh":"「莉莉，聽我說。今天離那座噴泉遠一點。」"},{"text":"\"Walk with me? The roses on the other side are better.\"","tone":"sly","fx":[{"k":"doom","d":-1}],"to":"lily_sly","zh":"「陪我走走？另一邊的玫瑰更好看。」"}]},{"t":"gesture","who":"lily","g":"hop"},{"t":"line","who":"lily","ex":"smile","text":"Really? I made it myself!","zh":"真的嗎？這是我自己做的！"},{"t":"line","who":"eve","ex":"smile","text":"You made this? Lily, that's amazing.","zh":"這是妳做的？莉莉，太厲害了吧。"},{"t":"line","who":"","text":"She turns pink, the same color as her dress. Somewhere behind us, someone drops a teacup.","zh":"她的臉紅了，跟她的洋裝一樣粉。我們身後不知哪裡，有人摔了一個茶杯。"},{"t":"goto","to":"plot"},{"t":"line","who":"lily","ex":"shocked","text":"The… fountain?","zh":"那……噴泉？"},{"t":"line","who":"eve","ex":null,"text":"Just trust me.","zh":"相信我就對了。"},{"t":"line","who":"","text":"Lily looks at the fountain. Then she looks at me, like I have two heads.","zh":"莉莉看看噴泉，再看看我，好像我多長了一顆頭。"},{"t":"line","who":"lily","ex":"worried","text":"Okay…?","zh":"好……喔？"},{"t":"goto","to":"plot"},{"t":"line","who":"lily","ex":"smile","text":"Oh! I'd love to.","zh":"喔！我很樂意。"},{"t":"line","who":"","text":"I take her arm and walk her away from the fountain, slow and easy, like a sheepdog. Every step feels like a win.","zh":"我挽著她的手臂，帶她慢慢遠離噴泉，像一隻牧羊犬。每走一步都像打了一場勝仗。"},{"t":"goto","to":"plot"},{"t":"hide","who":"eve"},{"t":"line","who":"","text":"For ten whole minutes, nothing happens. Nobody pushes anybody. I start to breathe again.","zh":"整整十分鐘，什麼事都沒發生。沒有人推任何人。我終於又能呼吸了。"},{"t":"line","who":"","text":"But the garden paths curve and turn, and somehow every one of them leads back to the fountain.","zh":"可是花園的小徑彎來繞去，不知怎麼的，每一條都通回那座噴泉。"},{"t":"sfx","v":"crash"},{"t":"shake"},{"t":"line","who":"","text":"Then a little white dog [[shoots]] across the lawn. A lady screams. A waiter spins, and his tray of lemon cakes flies into the air.","zh":"接著，一隻小白狗一溜煙衝過草地。一位女士尖叫。一個侍者轉了一圈，他那盤檸檬蛋糕飛上了天。"},{"t":"line","who":"","text":"Lily steps back to get out of the way. One step. Two.","zh":"莉莉往後退，想讓開。一步。兩步。"},{"t":"line","who":"","text":"Her heel catches a cracked stone. Her arms fly up like wings.","zh":"她的鞋跟卡到一塊裂開的石頭。她的雙臂像翅膀一樣往上一揮。"},{"t":"line","who":"","text":"Behind her, the fountain. Of course it's the fountain.","zh":"她身後，就是噴泉。當然是噴泉。"},{"t":"sfx","v":"splash"},{"t":"hide","who":"lily"},{"t":"line","who":"","text":"SPLASH.","zh":"嘩啦！"},{"t":"music","v":"none"},{"t":"line","who":"","text":"The music stops. Two hundred heads turn.","zh":"音樂停了。兩百顆頭轉了過來。"},{"t":"line","who":"","text":"Not to Lily. To me.","zh":"不是看莉莉。是看我。"},{"t":"show","who":"eve","ex":"shocked"},{"t":"line","who":"","text":"I know that look. In the book, everyone wears it just before everything goes wrong.","zh":"我認得那種眼神。書裡，一切出錯之前，每個人臉上都是這種表情。"},{"t":"choice","opts":[{"text":"Jump in after her.","tone":"sweet","fx":[{"k":"doom","d":-8},{"k":"lily","d":1},{"flag":"fountain","v":"jump"}],"to":"f_jump","zh":"跟著跳下去。"},{"text":"Pull her out, then make the crowd laugh with her, not at her.","tone":"bold","fx":[{"k":"doom","d":-6},{"k":"lily","d":1},{"flag":"fountain","v":"joke"}],"to":"f_joke","zh":"把她拉出來，再讓大家跟她一起笑，而不是笑她。"},{"text":"Point at the cracked stone before anyone can blame you.","tone":"sly","fx":[{"k":"doom","d":-4},{"flag":"fountain","v":"stone"}],"to":"f_stone","zh":"趁還沒人怪到妳頭上，先指著那塊裂開的石頭。"}]},{"t":"sfx","v":"splash"},{"t":"hide","who":"eve"},{"t":"line","who":"","text":"I don't think. I jump.","zh":"我沒多想。我跳了下去。"},{"t":"line","who":"","text":"The water is cold, and it smells like old coins. My shoes fill up. My perfect curls go flat.","zh":"水好冰，有一股舊銅板的味道。我的鞋子灌滿了水。我完美的捲髮全塌了。"},{"t":"line","who":"","text":"I grab Lily under the arms and pull her up. She coughs. A wet rose petal sits on her nose.","zh":"我從腋下抱住莉莉，把她拉起來。她咳了幾聲。一片濕答答的玫瑰花瓣黏在她鼻子上。"},{"t":"show","who":"lily","ex":"teary"},{"t":"line","who":"lily","ex":"teary","text":"You… you jumped in?","zh":"妳……妳跳下來了？"},{"t":"line","who":"eve","ex":null,"text":"You looked like you needed company.","zh":"妳看起來需要有人陪。"},{"t":"line","who":"","text":"Two hundred people stare at two wet girls in a fountain. Nobody knows what to say. This never happened in the book.","zh":"兩百個人盯著噴泉裡兩個濕透的女孩，誰也不知道該說什麼。書裡從來沒有這一段。"},{"t":"sfx","v":"down"},{"t":"line","who":"system","ex":null,"text":"Ding! Unexpected action! Doom down 8%.","zh":"叮！出乎意料的行動！毀滅指數下降 8%。"},{"t":"goto","to":"cliff"},{"t":"hide","who":"eve"},{"t":"line","who":"","text":"I march to the fountain, reach in, and pull her out by both hands. She stands there, dripping, red to the ears.","zh":"我大步走到噴泉邊，伸手抓住她的雙手，把她拉了出來。她站在那裡，全身滴著水，紅到耳根。"},{"t":"line","who":"","text":"Somebody giggles. Then somebody else.","zh":"有人咯咯笑了。接著又有一個人。"},{"t":"line","who":"","text":"So I turn to the crowd and lift my chin.","zh":"於是我轉向人群，抬起下巴。"},{"t":"show","who":"eve","ex":"smug"},{"t":"line","who":"eve","ex":"smug","text":"Wet silk. It's very big this season. You'll all be wearing it by spring.","zh":"濕絲綢，是這一季最流行的。到了春天，你們每個人都會穿。"},{"t":"line","who":"","text":"One second. Two. Then the Queen laughs, a real laugh, and the whole garden laughs with her. With Lily. Not at her.","zh":"一秒。兩秒。接著王后笑了，是真心的笑，整座花園也跟著她一起笑。是跟莉莉一起笑，不是笑她。"},{"t":"show","who":"lily","ex":"teary"},{"t":"line","who":"lily","ex":"teary","text":"Thank you.","zh":"謝謝妳。"},{"t":"sfx","v":"down"},{"t":"line","who":"system","ex":null,"text":"Ding! Bold move! Doom down 6%.","zh":"叮！大膽的一步！毀滅指數下降 6%。"},{"t":"goto","to":"cliff"},{"t":"show","who":"eve","ex":"smug"},{"t":"line","who":"eve","ex":"smug","text":"Careful, everyone! This stone is cracked. Someone could get hurt!","zh":"大家小心！這塊石頭裂開了，會有人受傷的！"},{"t":"line","who":"","text":"I point at the crack. Two hundred heads turn, like birds on a wire.","zh":"我指著那道裂縫。兩百顆頭轉了過去，像電線上的一排鳥。"},{"t":"line","who":"","text":"A servant runs for the gardener. A lady cries, \"Shocking! In the Queen's own garden!\"","zh":"一個僕人跑去找園丁。一位女士驚呼：「太不像話了！竟然是在王后自己的花園裡！」"},{"t":"line","who":"","text":"Nobody looks at me now. Nobody looks at Lily either. She climbs out alone, dripping, and sits on the edge of the fountain.","zh":"現在沒人看我了。也沒人看莉莉。她獨自爬出來，全身滴著水，坐在噴泉邊上。"},{"t":"sfx","v":"down"},{"t":"line","who":"system","ex":null,"text":"Ding! Clever. Doom down 4%.","zh":"叮！聰明。毀滅指數下降 4%。"},{"t":"goto","to":"cliff"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"Chapter One event complete. Story [[pressure]] +3%.","zh":"第一章事件完成。故事壓力 +3%。"},{"t":"doom","d":3},{"t":"line","who":"eve","ex":"worried","text":"Story pressure? What does that—","zh":"故事壓力？那是什麼——"},{"t":"music","v":"tension"},{"t":"hide","who":"lily"},{"t":"hide","who":"eve"},{"t":"line","who":"","text":"Across the lawn, the crowd opens like a curtain.","zh":"草地另一頭，人群像布幕一樣向兩側分開。"},{"t":"show","who":"cedric","ex":"angry"},{"t":"gesture","who":"cedric","g":"enter"},{"t":"line","who":"","text":"A tall young man in a blue coat walks straight toward me. Golden hair, a face from the cover of a romance novel.","zh":"一個穿藍色外套的高個子年輕男人直直朝我走來。金色頭髮，一張從言情小說封面走出來的臉。"},{"t":"line","who":"","text":"Prince Cedric. My [[fiancé]].","zh":"賽德瑞克王子。我的未婚夫。"},{"t":"line","who":"","text":"He looks at the fountain. He looks at wet Lily. Then he looks at me.","zh":"他看看噴泉，看看濕透的莉莉，然後看向我。"},{"t":"line","who":"cedric","ex":"angry","text":"Evangeline!","zh":"伊凡潔琳！"},{"t":"gesture","who":"cedric","g":"shake"},{"t":"line","who":"cedric","ex":"angry","text":"What have you *done*?","zh":"妳做了什麼好事？"},{"t":"title","flag":"fountain","val":"jump","name":"Soggy Savior"},{"t":"title","flag":"fountain","val":"joke","name":"Trendsetter (Wet)"},{"t":"title","flag":"fountain","val":"stone","name":"Stone Inspector"},{"t":"end"}],"labels":{"pip_sweet":15,"pip_bold":19,"pip_sly":24,"mirror":29,"sys_bold":45,"sys_sly":47,"sys_sweet":50,"rules":52,"party":63,"lily_sweet":77,"lily_bold":82,"lily_sly":87,"plot":90,"f_jump":108,"f_joke":120,"f_stone":132,"cliff":140}},{"n":2,"title":"Not My Type","nodes":[{"t":"bg","v":"garden"},{"t":"music","v":"tension"},{"t":"show","who":"cedric","ex":"angry"},{"t":"line","who":"","text":"Up close, Prince Cedric is even more handsome than on the cover. Golden hair. Blue eyes. A [[jaw]] you could cut bread with.","zh":"近看，賽德瑞克王子比封面上還要帥。金色頭髮，藍色眼睛，下巴線條銳利得可以切麵包。"},{"t":"line","who":"","text":"He is also shouting at me.","zh":"他也正在對我大吼。"},{"t":"if","k":"fountain","op":"=","v":"jump","to":"scold_jump"},{"t":"if","k":"fountain","op":"=","v":"joke","to":"scold_joke"},{"t":"goto","to":"scold_stone"},{"t":"line","who":"cedric","ex":"angry","text":"You pushed her in, and then you jumped in after her? What is this, a new game?","zh":"妳把她推下去，然後自己也跳下去？這是什麼新遊戲嗎？"},{"t":"line","who":"","text":"I'm still dripping. There is a rose petal stuck to my shoe. It's hard to look dangerous with a rose petal on your shoe.","zh":"我還在滴水。鞋子上黏著一片玫瑰花瓣。鞋子上黏著花瓣，很難看起來有威脅性。"},{"t":"goto","to":"scold"},{"t":"line","who":"cedric","ex":"angry","text":"You pushed her in, and then you made a joke of it! The whole court is laughing at Miss Bell!","zh":"妳把她推下去，然後還拿這件事開玩笑！整個宮廷都在笑貝爾小姐！"},{"t":"line","who":"","text":"They were laughing *with* her. But he wasn't here for that part.","zh":"他們是*跟*她一起笑。可是那一段他沒看到。"},{"t":"goto","to":"scold"},{"t":"line","who":"cedric","ex":"angry","text":"You pushed her in, and now you blame the stones? Really, Evangeline? The *stones*?","zh":"妳把她推下去，現在還怪石頭？真的嗎，伊凡潔琳？怪*石頭*？"},{"t":"line","who":"","text":"When he says it like that, it does sound a little silly.","zh":"被他這樣一說，聽起來確實有點蠢。"},{"t":"goto","to":"scold"},{"t":"if","k":"lily","op":">=","v":1,"to":"lily_speaks"},{"t":"goto","to":"peacock"},{"t":"show","who":"lily","ex":"worried"},{"t":"line","who":"lily","ex":"worried","text":"Your Highness, she didn't push me! I slipped!","zh":"殿下，她沒有推我！是我自己滑倒的！"},{"t":"line","who":"cedric","ex":"neutral","text":"You're too kind, Miss Bell. That's your only fault.","zh":"貝爾小姐，妳太善良了。這是妳唯一的缺點。"},{"t":"line","who":"","text":"He doesn't even look at her. Lily's mouth falls open.","zh":"他連看都沒看她一眼。莉莉張大了嘴。"},{"t":"hide","who":"lily"},{"t":"goto","to":"peacock"},{"t":"line","who":"cedric","ex":"angry","text":"You are cruel, you are jealous, and you are a shame to the name Ashcroft.","zh":"妳殘忍、妳善妒，妳是艾許克羅夫特家的恥辱。"},{"t":"line","who":"","text":"Then he stops. He turns his head a little to the left.","zh":"接著他停了下來，頭微微轉向左邊。"},{"t":"gesture","who":"cedric","g":"nod"},{"t":"line","who":"","text":"He is looking at the fountain. At his own face in the water. He fixes one golden curl, slowly, with one finger.","zh":"他在看噴泉。看水裡自己的臉。他用一根手指，慢慢地撥好一撮金色捲髮。"},{"t":"line","who":"cedric","ex":"smug","text":"…and a shame to this whole kingdom.","zh":"……也是整個王國的恥辱。"},{"t":"line","who":"","text":"Oh.","zh":"喔。"},{"t":"line","who":"","text":"In the book, Prince Cedric is a dream. In real life, he's a [[peacock]].","zh":"書裡的賽德瑞克王子是個夢中情人。現實中，他是一隻孔雀。"},{"t":"show","who":"eve","ex":"neutral"},{"t":"choice","opts":[{"text":"\"Your Highness, I didn't push her. Ask anyone who was here.\"","tone":"sweet","fx":[{"k":"doom","d":-2},{"flag":"cedric_ans","v":"sweet"}],"to":"ans_sweet","zh":"「殿下，我沒有推她。您可以問問在場的任何人。」"},{"text":"\"Are you scolding me, or admiring yourself? You're a peacock, Cedric.\"","tone":"bold","fx":[{"k":"doom","d":-3},{"k":"cedric","d":1},{"flag":"cedric_ans","v":"bold"}],"to":"ans_bold","zh":"「您是在罵我，還是在欣賞自己？賽德瑞克，您根本是一隻孔雀。」"},{"text":"\"You're right, Your Highness. Shall we talk about this in private?\"","tone":"sly","fx":[{"k":"doom","d":-2},{"flag":"cedric_ans","v":"sly"}],"to":"ans_sly","zh":"「殿下說得對。我們要不要私下談這件事？」"}]},{"t":"line","who":"cedric","ex":"shocked","text":"Ask… anyone?","zh":"問……任何人？"},{"t":"line","who":"","text":"He looks around. Nobody says, \"She pushed her.\" A few people look at their shoes.","zh":"他環顧四周。沒有人說「是她推的」。有幾個人低頭看自己的鞋子。"},{"t":"line","who":"cedric","ex":"angry","text":"That proves nothing. You are very good at hiding things.","zh":"這證明不了什麼。妳很擅長隱藏。"},{"t":"goto","to":"tears"},{"t":"line","who":"","text":"Two hundred people stop breathing.","zh":"兩百個人同時屏住了呼吸。"},{"t":"line","who":"cedric","ex":"shocked","text":"A… a what?","zh":"一……一隻什麼？"},{"t":"line","who":"eve","ex":"smug","text":"A peacock. Big, shiny, and very loud.","zh":"孔雀。又大、又閃亮，叫聲還很吵。"},{"t":"line","who":"","text":"His mouth opens and closes. Nobody has ever talked to him like that in his whole life. I can see it on his face. He has no idea what to do with it.","zh":"他的嘴巴張開又闔上。他這輩子從來沒有人這樣跟他說話。我從他臉上就看得出來，他完全不知道該怎麼辦。"},{"t":"goto","to":"tears"},{"t":"line","who":"cedric","ex":"shocked","text":"In… private?","zh":"私……私下？"},{"t":"line","who":"eve","ex":"smile","text":"Of course. A prince shouldn't shout in the Queen's garden. People will talk.","zh":"當然。王子不該在王后的花園裡大吼大叫。大家會說閒話的。"},{"t":"line","who":"","text":"He glances at the crowd. The crowd glances back. His ears turn pink.","zh":"他瞄了人群一眼，人群也瞄回來。他的耳朵紅了。"},{"t":"goto","to":"tears"},{"t":"line","who":"","text":"Then something strange happens.","zh":"然後，奇怪的事發生了。"},{"t":"line","who":"","text":"My eyes start to [[sting]]. My nose tickles. My vision goes soft and wet.","zh":"我的眼睛開始刺痛，鼻子發癢，視線變得又模糊又濕。"},{"t":"show","who":"eve","ex":"teary"},{"t":"line","who":"","text":"No. No, no, no. I know this scene. In Chapter Two, Evangeline bursts into tears and runs away, and the whole court laughs at her.","zh":"不。不不不不。我知道這一幕。第二章，伊凡潔琳突然大哭著跑走，整個宮廷都在笑她。"},{"t":"line","who":"","text":"But I'm not sad! I'm not even a little bit sad!","zh":"可是我不難過！我一點點都不難過！"},{"t":"line","who":"","text":"A fat tear rolls down my cheek anyway.","zh":"一顆大大的眼淚還是從我臉頰滾了下來。"},{"t":"line","who":"cedric","ex":"smug","text":"Ah. Tears. Now you're sorry.","zh":"啊，眼淚。現在知道後悔了。"},{"t":"choice","opts":[{"text":"\"These aren't for you. The roses make my eyes water.\"","tone":"sweet","fx":[{"k":"doom","d":-1}],"to":"cry_sweet","zh":"「這不是為了您。是玫瑰花讓我流眼淚。」"},{"text":"Laugh through the tears. It's honestly a little funny.","tone":"bold","fx":[{"k":"doom","d":-3}],"to":"cry_bold","zh":"邊哭邊笑。說真的，這有點好笑。"},{"text":"Let one more tear fall, right where the whole crowd can see.","tone":"sly","fx":[{"k":"doom","d":-2},{"k":"cedric","d":-1}],"to":"cry_sly","zh":"讓另一滴眼淚落下，就落在所有人都看得到的地方。"}]},{"t":"line","who":"cedric","ex":"shocked","text":"The… roses?","zh":"玫……玫瑰？"},{"t":"line","who":"eve","ex":"teary","text":"Very strong roses. Your mother grows them well.","zh":"非常濃的玫瑰。王后種得真好。"},{"t":"line","who":"","text":"Somewhere in the crowd, a countess sneezes. Thank you, countess.","zh":"人群中某處，一位伯爵夫人打了個噴嚏。謝謝妳，伯爵夫人。"},{"t":"goto","to":"cedric_leaves"},{"t":"line","who":"","text":"I start to laugh. I can't stop. I'm crying and laughing at the same time, like a broken fountain.","zh":"我開始笑，停也停不下來。我同時在哭又在笑，像一座壞掉的噴泉。"},{"t":"line","who":"cedric","ex":"nervous","text":"Why are you laughing? Stop laughing!","zh":"妳笑什麼？不准笑！"},{"t":"line","who":"eve","ex":"smile","text":"I'm sorry! It's just… your hair. It's perfect. Really. Even now.","zh":"抱歉！只是……您的頭髮。好完美。真的。即使是現在。"},{"t":"goto","to":"cedric_leaves"},{"t":"line","who":"","text":"I don't wipe it away. I let it shine. I look down, small and sad, a lonely lady in front of a shouting prince.","zh":"我沒有擦掉眼淚，就讓它閃閃發亮。我低下頭，看起來又小又可憐：一位孤零零的淑女，站在一個大吼大叫的王子面前。"},{"t":"line","who":"","text":"A woman whispers, \"Poor thing.\" Then another: \"How can he shout at a crying girl?\"","zh":"一位女士低聲說：「好可憐。」接著又有人說：「他怎麼能對著一個在哭的女孩大吼？」"},{"t":"line","who":"cedric","ex":"nervous","text":"I… I wasn't… That's not…","zh":"我……我沒有……那不是……"},{"t":"goto","to":"cedric_leaves"},{"t":"line","who":"cedric","ex":"angry","text":"This isn't over, Evangeline.","zh":"這件事還沒完，伊凡潔琳。"},{"t":"gesture","who":"cedric","g":"shake"},{"t":"hide","who":"cedric"},{"t":"line","who":"","text":"He spins around and marches away. His coat flaps like a flag. Half the crowd follows him, whispering.","zh":"他轉身大步走開，外套像旗子一樣飄動。一半的人群跟著他走，邊走邊竊竊私語。"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"Ding! Chapter Two event complete: The Prince's [[Scolding|scold]].","zh":"叮！第二章事件完成：王子的斥責。"},{"t":"line","who":"eve","ex":"worried","text":"But I didn't cry because of him! The story made me cry!","zh":"可是我不是因為他才哭的！是故事讓我哭的！"},{"t":"line","who":"system","ex":null,"text":"The story doesn't care why. Here's an important rule!","zh":"故事才不管原因。這裡有一條重要規則！"},{"t":"line","who":"system","ex":null,"text":"[[Canon|canon]] events cannot be deleted. They can only be edited.","zh":"原著事件無法刪除，只能修改。"},{"t":"music","v":"scheme"},{"t":"line","who":"system","ex":null,"text":"In the book, Evangeline cried and ran. You cried and stayed. That's an edit!","zh":"書裡，伊凡潔琳哭著跑走。妳哭了，但留了下來。這就是修改！"},{"t":"doom","d":3},{"t":"line","who":"system","ex":null,"text":"Story pressure +3%. Don't worry. You're doing great!","zh":"故事壓力 +3%。別擔心，妳做得很好！"},{"t":"line","who":"eve","ex":null,"text":"So every big scene in the book will still happen. I just get to choose how.","zh":"所以書裡每一場重要的戲都還是會發生，我只是可以選擇它怎麼發生。"},{"t":"line","who":"system","ex":null,"text":"Exactly! Now, a new [[quest]]!","zh":"完全正確！現在，新任務來了！"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"Main quest: End the [[engagement]] before the Winter Ball. Without a [[scandal]].","zh":"主線任務：在冬季舞會前解除婚約。不能鬧出醜聞。"},{"t":"line","who":"eve","ex":"worried","text":"Why no scandal?","zh":"為什麼不能有醜聞？"},{"t":"line","who":"system","ex":null,"text":"Scandals feed the story. And the story is very, very hungry.","zh":"醜聞是故事的食物。而故事非常、非常餓。"},{"t":"hide","who":"eve"},{"t":"line","who":"","text":"I sit on the edge of the fountain. My face is still wet, so I wipe it with my glove.","zh":"我坐在噴泉邊上。臉還是濕的，我用手套擦了擦。"},{"t":"line","who":"","text":"The glove catches my pearl earring and pulls it loose. Tink. It rolls along the white stone.","zh":"手套勾到我的珍珠耳環，把它扯了下來。叮。耳環沿著白色石頭滾動。"},{"t":"sfx","v":"caw"},{"t":"show","who":"duchess","ex":"neutral"},{"t":"line","who":"","text":"Before I can grab it, a black shape lands on the stone swan. A raven, big and shiny, with a little gold ring on one leg.","zh":"我還來不及抓，一個黑影就落在石天鵝上。是一隻烏鴉，又大又亮，一隻腳上戴著小小的金環。"},{"t":"line","who":"","text":"She looks at the pearl. She looks at me. She looks at the pearl again.","zh":"她看看珍珠，看看我，又看看珍珠。"},{"t":"line","who":"eve","ex":null,"text":"Don't you dare.","zh":"想都別想。"},{"t":"sfx","v":"flap"},{"t":"gesture","who":"duchess","g":"fly"},{"t":"hide","who":"duchess"},{"t":"line","who":"","text":"She dares. She [[snatches|snatch]] the earring and flies straight up into the sky.","zh":"她偏要。她一口叼走耳環，直直飛上天空。"},{"t":"choice","opts":[{"text":"Chase her!","tone":"bold","fx":[{"flag":"raven","v":"chase"}],"to":"chase","zh":"追上去！"},{"text":"Let her go. It's only an earring.","tone":"sweet","fx":[{"flag":"raven","v":"let"}],"to":"let_go","zh":"讓她走吧。不過是一隻耳環。"}]},{"t":"music","v":"scheme"},{"t":"line","who":"","text":"I pick up my skirt and run. Through the roses. Past a very surprised gardener. Around a hedge shaped like a swan.","zh":"我拉起裙子就跑。穿過玫瑰叢，經過一個嚇了一大跳的園丁，繞過一棵修剪成天鵝形狀的樹籬。"},{"t":"line","who":"","text":"The raven flies to the far corner of the garden, to an old stone tower covered in [[ivy]]. She disappears through a high window.","zh":"烏鴉飛到花園最遠的角落，飛向一座爬滿常春藤的舊石塔，從高處的窗戶消失了。"},{"t":"bg","v":"tower"},{"t":"music","v":"none"},{"t":"line","who":"","text":"The door isn't locked. Inside, stone stairs go up and up. At the top hangs a huge bronze bell, green with age.","zh":"門沒有鎖。裡面，石階一直往上延伸。頂端掛著一口巨大的青銅鐘，因為年代久遠而發綠。"},{"t":"line","who":"","text":"And on a wooden beam, high above my head, there is a nest.","zh":"在我頭頂高處的一根木樑上，有一個鳥巢。"},{"t":"line","who":"","text":"It shines. Silver spoons. Gold buttons. A small key. A ring. And on top of it all, my pearl.","zh":"它閃閃發亮。銀湯匙、金鈕扣、一把小鑰匙、一枚戒指。而在這一切的最上面，是我的珍珠。"},{"t":"show","who":"duchess","ex":"neutral"},{"t":"line","who":"","text":"The raven sits beside her treasure and looks down at me, very pleased with herself.","zh":"烏鴉坐在她的寶藏旁邊，低頭看著我，對自己非常滿意。"},{"t":"line","who":"eve","ex":null,"text":"You little thief. You have a whole collection up there.","zh":"妳這個小偷。妳在上面有一整套收藏呢。"},{"t":"sfx","v":"bell"},{"t":"shake"},{"t":"line","who":"","text":"Far below, someone pulls the rope for the evening bell. BONG. The whole tower shakes. I nearly fall down the stairs.","zh":"下方遠處，有人拉響了晚鐘的繩子。噹——！整座塔都在震動。我差點從樓梯上摔下去。"},{"t":"line","who":"","text":"I can't reach the nest today. But now I know where it is.","zh":"今天我搆不到那個鳥巢。但現在我知道它在哪裡了。"},{"t":"hide","who":"duchess"},{"t":"goto","to":"home"},{"t":"line","who":"","text":"I watch her fly away over the roses, a black dot with a white pearl.","zh":"我看著她飛過玫瑰花叢，一個黑點叼著一顆白珍珠。"},{"t":"line","who":"","text":"I have bigger problems than an earring. I have a prince, a System and a whole book against me.","zh":"我有比耳環更大的問題。我有一個王子、一個系統，還有一整本書在跟我作對。"},{"t":"goto","to":"home"},{"t":"bg","v":"bedroom"},{"t":"music","v":"manor"},{"t":"line","who":"","text":"That evening, I sit by the window in my room. The sky turns orange, then purple.","zh":"那天傍晚，我坐在房間的窗邊。天空變成橘色，然後是紫色。"},{"t":"sfx","v":"knock"},{"t":"show","who":"pip","ex":"neutral"},{"t":"if","k":"pip","op":">=","v":1,"to":"pip_warm"},{"t":"line","who":"pip","ex":"deadpan","text":"My lady. This came for you.","zh":"小姐，有您的信。"},{"t":"line","who":"","text":"She holds out a card at arm's length, like it might explode.","zh":"她把一張卡片伸得遠遠的遞過來，好像它會爆炸似的。"},{"t":"goto","to":"card"},{"t":"line","who":"pip","ex":"smile","text":"My lady, I heard about the garden. Everyone in the kitchen is talking about it.","zh":"小姐，我聽說花園的事了。廚房裡每個人都在討論。"},{"t":"line","who":"pip","ex":"neutral","text":"Cook says you were very brave. Or very strange. She can't decide.","zh":"廚娘說您非常勇敢。或者非常奇怪。她還沒決定。"},{"t":"if","k":"raven","op":"=","v":"chase","to":"pip_raven"},{"t":"goto","to":"pip_card"},{"t":"line","who":"pip","ex":"deadpan","text":"And a gardener says you chased the prince's raven through the roses.","zh":"還有一個園丁說，您追著王子的烏鴉穿過了玫瑰花叢。"},{"t":"line","who":"eve","ex":null,"text":"The prince's raven?","zh":"王子的烏鴉？"},{"t":"line","who":"pip","ex":"deadpan","text":"Duchess. She steals anything shiny. Last spring she took the Archbishop's spoon during dinner.","zh":"她叫公爵夫人，什麼亮晶晶的東西都偷。去年春天，她在晚宴上叼走了大主教的湯匙。"},{"t":"goto","to":"pip_card"},{"t":"line","who":"pip","ex":"neutral","text":"Oh, and this came for you.","zh":"喔，還有這封給您的信。"},{"t":"goto","to":"card"},{"t":"line","who":"","text":"It's an [[invitation]], with a gold border and a drawing of a cake.","zh":"這是一張邀請函，有金色的邊框，上面畫著一個蛋糕。"},{"t":"line","who":"","text":"*The Spring Fair Baking Contest. Lady Evangeline Ashcroft is warmly invited to compete.*","zh":"*春季市集烘焙比賽。誠摯邀請伊凡潔琳・艾許克羅夫特小姐參賽。*"},{"t":"line","who":"","text":"My stomach drops. Chapter Three. Evangeline's cake makes Lily sick in front of the judges, and everyone thinks she did it on purpose.","zh":"我的心一沉。第三章。伊凡潔琳的蛋糕讓莉莉在評審面前吃壞了肚子，大家都認為她是故意的。"},{"t":"line","who":"","text":"Also, small problem: I can't boil an egg.","zh":"另外，還有個小問題：我連蛋都不會煮。"},{"t":"show","who":"eve","ex":"worried"},{"t":"choice","opts":[{"text":"\"Please tell them thank you, but I can't come this year.\"","tone":"sweet","fx":[],"to":"no_sweet","zh":"「請跟他們說謝謝，但我今年沒辦法參加。」"},{"text":"\"Absolutely not. Throw it in the fire.\"","tone":"bold","fx":[],"to":"no_bold","zh":"「絕對不要。把它丟進火裡。」"},{"text":"\"Tell them I'm sick. Very sick. [[Contagious|contagious]], even.\"","tone":"sly","fx":[],"to":"no_sly","zh":"「跟他們說我病了。病得很重，甚至會傳染。」"}]},{"t":"line","who":"pip","ex":"nervous","text":"I'm afraid it's too late for that, my lady.","zh":"小姐，恐怕已經來不及了。"},{"t":"goto","to":"signed"},{"t":"line","who":"pip","ex":"nervous","text":"I could, my lady. But it won't help.","zh":"小姐，我可以這麼做。但那沒有用。"},{"t":"goto","to":"signed"},{"t":"line","who":"pip","ex":"deadpan","text":"You'd have to be sick for a week, my lady. And it won't help.","zh":"小姐，那您得病上一個禮拜。而且那也沒有用。"},{"t":"goto","to":"signed"},{"t":"hide","who":"eve"},{"t":"line","who":"pip","ex":"deadpan","text":"You signed up a month ago, my lady. They sent back a copy of your entry form.","zh":"小姐，您一個月前就報名了。他們把您的報名表影本寄回來了。"},{"t":"line","who":"","text":"She takes a second paper out from behind the card. There it is, in big, proud, curly letters: *Evangeline Ashcroft. Lemon cake.*","zh":"她從卡片後面抽出第二張紙。就在那裡，用又大又驕傲的花體字寫著：*伊凡潔琳・艾許克羅夫特。檸檬蛋糕。*"},{"t":"line","who":"","text":"And under it, in the same hand: *A special piece for Miss Lily Bell.*","zh":"下面還有同一個筆跡：*特別為莉莉・貝爾小姐準備一塊。*"},{"t":"sfx","v":"ding"},{"t":"line","who":"system","ex":null,"text":"Ding! Upcoming canon event detected: The Cake Incident.","zh":"叮！偵測到即將發生的原著事件：蛋糕事件。"},{"t":"line","who":"system","ex":null,"text":"Good luck! You'll need a lot of it!","zh":"祝妳好運！妳會需要很多好運的！"},{"t":"title","flag":"cedric_ans","val":"bold","name":"Peacock Spotter"},{"t":"title","flag":"cedric_ans","val":"sweet","name":"Calm Under Fire"},{"t":"title","flag":"cedric_ans","val":"sly","name":"Damage Control"},{"t":"end"}],"labels":{"scold_jump":8,"scold_joke":11,"scold_stone":14,"scold":17,"lily_speaks":19,"peacock":25,"ans_sweet":34,"ans_bold":38,"ans_sly":43,"tears":47,"cry_sweet":55,"cry_bold":59,"cry_sly":63,"cedric_leaves":67,"raven":86,"chase":99,"let_go":116,"home":119,"pip_warm":128,"pip_raven":132,"pip_card":136,"card":138,"no_sweet":144,"no_bold":146,"no_sly":148,"signed":150}}]};
const COACH = {"1":{"episode":1,"focus":"Imperatives and System messages","summary":"Eve wakes up as Lady Evangeline, the villainess of a romance novel. A cheerful System gives her a Doom meter. At the Queen's garden party, Lily falls into the fountain anyway, and Prince Cedric blames Eve.","words":[{"w":"canopy","kk":"[ˋkænəpɪ]","pos":"n.","zh":"床頂的帳幔","line":"Above me hangs a canopy of pale gold cloth","more":"Also the top layer of leaves in a forest (the rainforest canopy 樹冠層), or a cover over a door or a market stall."},{"w":"tassel","kk":"[ˋtæsḷ]","pos":"n.","zh":"流蘇","line":"with little tassels","more":"Graduates move the tassel on their cap from one side to the other at graduation."},{"w":"rattle","kk":"[ˋrætḷ]","pos":"v.","zh":"喀啦喀啦地響","line":"The cups on her tray rattle.","more":"rattle someone = make them nervous (The question rattled her. 這個問題讓她慌了). As a noun: a baby's rattle 搖鈴."},{"w":"villainess","kk":"[ˋvɪlənɪs]","pos":"n.","zh":"女反派；惡役千金","line":"I'm the villainess.","more":"villain 反派 is the usual word for any gender; villainess is common in fantasy and web-novel titles (惡役千金 = the villainess)."},{"w":"doom","kk":"[dum]","pos":"n.","zh":"厄運；毀滅","line":"Your current Doom: 87%.","more":"doomed 註定失敗的 (a doomed love story); doomscrolling 一直滑壞消息停不下來."},{"w":"terms and conditions","kk":"[tɝmz ən kənˋdɪʃənz]","pos":"n.","zh":"使用條款","line":"Please accept the Terms and Conditions to continue.","more":"terms alone = 條件 (on good terms with someone 關係很好); a term = 學期、任期."},{"w":"exile","kk":"[ˋɛgzaɪl]","pos":"v. / n.","zh":"流放；放逐","line":"Don't get exiled.","more":"in exile 流亡中; a writer in exile 流亡作家. get + past participle: get exiled, get caught, get fired."},{"w":"quest","kk":"[kwɛst]","pos":"n.","zh":"任務；追尋","line":"New quest: Survive Chapter One.","more":"a quest for the truth 追尋真相. side quest 支線任務 is also a joke in daily life: Buying milk turned into a side quest."},{"w":"heroine","kk":"[ˋhɛroɪn]","pos":"n.","zh":"女主角；女英雄","line":"Lily Bell. The heroine.","more":"Sounds exactly like heroin 海洛因. The spelling (an extra e) shows the difference."},{"w":"innocent","kk":"[ˋɪnəsṇt]","pos":"adj.","zh":"看起來無害的；無辜的","line":"It looks innocent. It is not.","more":"清白的 (innocent until proven guilty 未經證實有罪前都是清白的); 天真的 (an innocent question)."},{"w":"whisper","kk":"[ˋhwɪspɚ]","pos":"v.","zh":"低聲說","line":"A woman whispers my name, like a warning.","more":"As a noun: in a whisper 小聲地; a whisper of 一絲 (a whisper of hope)."},{"w":"shoot","kk":"[ʃut]","pos":"v.","zh":"飛快地衝過","line":"Then a little white dog shoots across the lawn.","more":"Not 射擊 here. Other senses: shoot a video 拍攝; prices shot up 暴漲. Past tense: shot."},{"w":"cracked","kk":"[krækt]","pos":"adj.","zh":"有裂痕的","line":"Her heel catches a cracked stone.","more":"crack a joke 說笑話; crack a code 破解密碼; crack under pressure 在壓力下崩潰."},{"w":"march","kk":"[mɑrtʃ]","pos":"v.","zh":"大步走（帶著決心）","line":"I march to the fountain","more":"Also 遊行、行軍 (a protest march). March with a capital M is the month."},{"w":"giggle","kk":"[ˋgɪgḷ]","pos":"v.","zh":"咯咯地笑","line":"Somebody giggles.","more":"Usually a small, nervous or silly laugh. Compare chuckle 輕聲笑 and burst out laughing 爆笑."},{"w":"drip","kk":"[drɪp]","pos":"v.","zh":"滴水","line":"She stands there, dripping, red to the ears.","more":"dripping wet 濕透了; a dripping tap 漏水的水龍頭."},{"w":"pressure","kk":"[ˋprɛʃɚ]","pos":"n.","zh":"壓力","line":"Story pressure +3%.","more":"peer pressure 同儕壓力; blood pressure 血壓; put pressure on someone 給某人壓力."},{"w":"fiancé","kk":"[ˏfiənˋse]","pos":"n.","zh":"未婚夫","line":"My fiancé.","more":"fiancée 未婚妻 (an extra e, same sound). get engaged 訂婚; break off an engagement 解除婚約."}],"phrases":[{"p":"pop into my head","zh":"突然冒進腦中","line":"Her name pops into my head: Pip.","note":"Something you didn't try to think of. A song popped into my head."},{"p":"like my own phone number","zh":"熟得像自己的電話號碼","line":"I know it like my own phone number.","note":"know something like the back of your hand is the classic idiom."},{"p":"step out of someone's way","zh":"讓路給某人","line":"People step out of my way.","note":"get out of the way 讓開; Lily steps back to get out of the way."},{"p":"look someone up and down","zh":"上下打量某人","line":"Evangeline looks her up and down","note":"Often rude: judging someone's clothes or looks."},{"p":"That's the spirit!","zh":"就是這種精神！","line":"That's the spirit!","note":"Encourages someone's attitude, even when things look bad."},{"p":"Let's stay positive!","zh":"我們保持正面思考吧！","line":"Well! Let's stay positive!","note":"Here it is a joke: the System says it right after a scary warning."},{"p":"and I quote","zh":"我引用原話","line":"You said, and I quote,","note":"Used before repeating someone's exact words, often to embarrass them a little."},{"p":"like I have two heads","zh":"好像我是怪物一樣","line":"like I have two heads","note":"look at someone like they have two heads = look at them as if they are very strange."},{"p":"red to the ears","zh":"紅到耳根","line":"red to the ears","note":"Very embarrassed. Also: turn red, go red, blush."},{"p":"very big this season","zh":"這一季很流行","line":"It's very big this season.","note":"big = popular, in fashion. Also: all the rage, trendy."},{"p":"laugh with someone, not at someone","zh":"跟某人一起笑，而不是笑某人","line":"With Lily. Not at her.","note":"Laughing at someone makes fun of them; laughing with them shares the joke."}],"grammar":[{"title":"Imperatives: telling someone what to do","zh":"祈使句","how":"Start with the base verb. Add Please to sound polite, Just to sound sure or calm, and Don't for a negative.","lines":["Please accept the Terms and Conditions to continue.","Lily, listen to me. Stay away from that fountain today.","Just trust me.","Don't get exiled."],"try":"Write three System-style instructions for surviving a rainy Monday morning."},{"title":"Imperative + and: a short way to say if","zh":"祈使句 + and ＝ 如果……就……","how":"Do this, and that happens means If you do this, that happens.","lines":["Act like the old Evangeline, and your Doom goes up.","Surprise the story, and it goes down."],"try":"Turn each line into an if-sentence. Then make one of your own: Eat dessert first, and …"},{"title":"Present simple for telling a story","zh":"用現在簡單式說故事","how":"The story happens now, in the present simple. Things that happened before the story use the past simple.","lines":["I open my eyes.","Someone knocks.","I know this face. I read about it last night, in bed, at two in the morning."],"try":"Retell the fountain scene in three present-simple sentences."},{"title":"like + noun: comparing things","zh":"like + 名詞：比喻","how":"like here means 像 and comes before a noun. Compare look like (看起來像) and feel like.","lines":["A woman whispers my name, like a warning.","I take her arm and walk her away from the fountain, slow and easy, like a sheepdog.","Two hundred heads turn, like birds on a wire.","Her arms fly up like wings."],"try":"Finish these: My alarm clock sounds like … / On Monday I feel like …"},{"title":"make + someone + base verb","zh":"make + 人 + 原形動詞：使某人做某事","how":"No to before the second verb: make her cry, not make her to cry.","lines":["You said, and I quote, \"I will make that little country mouse cry in front of the whole court.\""],"try":"What makes you laugh? What makes you wait? Answer with make me + verb."},{"title":"Present perfect for a time up to now","zh":"現在完成式 + for：持續到現在","how":"have + past participle + for + a length of time.","lines":["You've talked about it for a month."],"try":"What have you wanted to do for a long time?"}],"tone":[{"title":"Thanking someone","note":"Eve's three choices with Pip all show the new Evangeline. The old one would never thank a maid.","rows":[["Kind (Eve's choice)","Thank you, Pip. That smells wonderful."],["Old Evangeline","Put it down and go."],["Formal court","You're very kind, Pip."],["Modern and casual","Thanks, you're a lifesaver!"]]},{"title":"Asking for information","note":"Remind me sounds casual and confident; Might I ask sounds very formal and old-fashioned.","rows":[["Sly (Eve's choice)","Remind me. What day is it today?"],["Polite","Could you remind me what day it is?"],["Very formal","Might I ask what day it is?"]]},{"title":"Warning someone","note":"Bold says it straight; sly gets the same result without a warning at all.","rows":[["Bold (Eve's choice)","Lily, listen to me. Stay away from that fountain today."],["Softer","You might want to keep away from the fountain."],["Sly (Eve's choice)","Walk with me? The roses on the other side are better."]]},{"title":"A servant's respect","note":"Pip speaks to Evangeline in the third person (my lady, not you). It shows distance and respect.","rows":[["Pip","Is my lady feeling well?"],["Everyday English","Are you okay?"],["Polite modern","Are you feeling all right?"]]},{"title":"Customer-service cheer","note":"The System talks like an app's help desk: bright words that hide bad news.","rows":[["What the System says","Well! Let's stay positive!"],["What it means","This is very bad."],["What the System says","That's the spirit!"],["What it means","I'm not sure you'll survive."]]},{"title":"Stress changes meaning","note":"Cedric stresses done: an accusation, not a question.","rows":[["Cedric","What have you done?"],["Worried, not angry","What happened? Are you okay?"]]}],"questions":[{"tag":"Warm-up","q":"Have you ever woken up and, for a second, not known where you were? What did you think?"},{"tag":"Story","q":"How does Eve know she is inside the book? What clues does she notice first?"},{"tag":"Story","q":"Why is Pip scared of Evangeline? What would you do to make her feel less afraid?"},{"tag":"Choices","q":"At the fountain, which choice did you make, and why? What might the other two have changed?"},{"tag":"Opinion","q":"Lily still fell into the fountain, even though Eve didn't push her. Can people really change what is \"written\" for them?"},{"tag":"Opinion","q":"Prince Cedric sees a wet Lily and blames Evangeline. Is it fair to judge someone from one moment?"},{"tag":"Opinion","q":"In many AI dramas, the hero takes revenge. So far, Eve chooses kindness or cleverness. Which kind of story do you enjoy more?"},{"tag":"Imagine","q":"If you woke up inside a story you love, which story would it be, and who would you be?"},{"tag":"Imagine","q":"Write the System's Terms and Conditions. What three rules would you add?"},{"tag":"Language","q":"Pip and Eve speak very differently. Find one line that sounds old-fashioned and one that sounds modern."},{"tag":"Predict","q":"What do you think Eve will say to Cedric? What happens next?"}]},"2":{"episode":2,"focus":"Saying no, politely and not so politely","summary":"Prince Cedric scolds Eve in front of the whole court, and the story makes her cry even though she isn't sad. The System explains that canon events can't be deleted, only edited, and gives her a new quest: end the engagement before the Winter Ball, without a scandal. A raven steals her pearl earring. Back home, she learns the old Evangeline already entered the baking contest, with a lemon cake for Lily.","words":[{"w":"jaw","kk":"[dʒɔ]","pos":"n.","zh":"下巴；下顎","line":"A jaw you could cut bread with.","more":"Her jaw dropped. = 她驚訝得下巴都掉了。jaw-dropping = 令人瞠目結舌的。"},{"w":"peacock","kk":"[ˋpiˏkɑk]","pos":"n.","zh":"孔雀；愛炫耀的人","line":"In real life, he's a peacock.","more":"Only the male is a peacock; the female is a peahen. as proud as a peacock = 非常得意。"},{"w":"drip","kk":"[drɪp]","pos":"v.","zh":"滴水","line":"I'm still dripping.","more":"dripping wet = 濕透了。A tap can drip all night."},{"w":"prove","kk":"[pruv]","pos":"v.","zh":"證明","line":"That proves nothing.","more":"Noun: proof. prove someone wrong = 證明某人錯了。"},{"w":"sting","kk":"[stɪŋ]","pos":"v.","zh":"刺痛","line":"My eyes start to sting.","more":"A bee can sting you. Past: stung. Onions make your eyes sting."},{"w":"scolding","kk":"[ˋskoldɪŋ]","pos":"n.","zh":"斥責","line":"The Prince's Scolding.","more":"Verb: scold. Parents scold children; a boss tells you off."},{"w":"canon","kk":"[ˋk d I could, but… make bad news gentler.","lines":["Please tell them thank you, but I can't come this year.","I'm afraid it's too late for that, my lady.","I could, my lady. But it won't help."],"try":"Say no politely to three invitations: a karaoke night, extra work on Saturday, a friend's very long wedding video."},{"title":"Modal + be + past participle","zh":"情態助動詞的被動語態","how":"can / cannot / must + be + V-ed. We care about what happens to the thing, not who does it.","lines":["Canon events cannot be deleted. They can only be edited."],"try":"Write three System rules for your own life: Coffee cannot be skipped. Mondays can only be survived."},{"title":"Present simple for rules and habits","zh":"現在簡單式：規則與習慣","how":"Use the present simple for things that are always true or happen again and again.","lines":["Scandals feed the story.","She steals anything shiny.","The story doesn't care why."],"try":"Write three rules of your office, school or family that everyone knows but nobody writes down."},{"title":"Ever with the present perfect; ago with the past simple","zh":"現在完成式 + ever；過去式 + ago","how":"has / have ever + V-ed covers your whole life up to now. ago points to one time in the past.","lines":["Nobody has ever talked to him like that in his whole life.","You signed up a month ago, my lady."],"try":"Tell me one thing nobody has ever said to you, and one thing you did a long time ago that still surprises people."},{"title":"Echo questions: repeating to show surprise","zh":"回聲問句：重複對方的話表示驚訝","how":"Repeat a word or two from the other person with a rising voice. The pause (…) shows shock.","lines":["Ask… anyone?","In… private?","The… roses?","The prince's raven?"],"try":"I'll say something surprising. Answer with an echo question, then ask for more."},{"title":"Shall we…? for suggestions","zh":"Shall we…? 提出建議","how":"Shall we + base verb sounds polite and a little old-fashioned. Let's… is more casual.","lines":["You're right, Your Highness. Shall we talk about this in const SAY_AS = {"Cedric":"Sedrick",
  /* tested on iOS (2026-10-16): Samantha, Karen, Daniel and Moira all say ih-VAN-juh-leen; the Windows Chrome voices do too. */

/* =========================================================
   Coach's Companion: per-episode words, phrases, grammar, tone and

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const store = {
  get(k, d){ try{ const v = localStorage.getItem("vilc-"+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("vilc-"+k, JSON.stringify(v)); }catch(e){} }
};
const RX = /\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g, SPOKEN = /\{\{([^|}]+)\|([^}]+)\}\}/g;
const plain = s => String(s).replace(SPOKEN, "$1").replace(RX, "$1").replace(/\*([^*]+)\*/g, "$1");
const SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg>';
const TONE_ZH = {sweet:"Sweet", bold:"Bold", sly:"Sly"};

/* ---------------- read-aloud: one clear US voice, with the game's respellings ---------------- */
const Say = (()=>{
  const SYN = window.speechSynthesis || null; let V = null;
  function pick(){ if(!SYN) return; const vs = SYN.getVoices().filter(v=>/^en/i.test(v.lang));
    V = vs.find(v=>/^en[-_]US/i.test(v.lang) && /Samantha|Google US English|Aria|Jenny|Ava|Allison/i.test(v.name)) || vs.find(v=>/^en[-_]US/i.test(v.lang)) || vs[0] || null; }
  if(SYN){ pick(); SYN.onvoiceschanged = pick; }
  const respell = t => Object.entries(SAY_AS).reduce((x,[w,r])=>x.split(w).join(r), t);
  function say(t){ if(!SYN) return; SYN.cancel();
    const u = new SpeechSynthesisUtterance(respell(plain(String(t).replace(SPOKEN, "$2"))).replace(/[“”]/g,'"').replace(/[’‘]/g,"'"));
    if(V){ u.voice = V; u.lang = V.lang; } else u.lang = "en-US"; u.rate = .9; SYN.speak(u); }
  return {say, ok:!!SYN};
})();
const spk = t => Say.ok ? `<button class="spk" data-say="${esc(t)}" aria-label="Read aloud">${SPK}</button>` : "";

/* ---------------- the episode's text, for quotes and choices ---------------- */
const EPS = STORY.episodes.filter(e=>COACH[e.n]);
let epN = store.get("ep", EPS[0].n); if(!COACH[epN]) epN = EPS[0].n;
let tab = store.get("tab", "words");
const ep = () => STORY.episodes.find(e=>e.n === epN), C = () => COACH[epN];
/* the line from the episode that holds a quote, with the quote marked */
function ctx(quote, word){
  const hit = ep().nodes.find(n=>n.text && plain(n.text).includes(quote));
  const full = hit ? plain(hit.text) : quote;
  let h = esc(full);
  if(word){ const w = word.split(/\s+/)[0].replace(/[^\w'-]/g,""), re = new RegExp("\\b(" + w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "\\w*)", "i"); h = h.replace(re, "<mark>$1</mark>"); }
  return `<p class="ctx">${h}</p>`;
}
function choices(){
  const nodes = ep().nodes, out = [];
  nodes.forEach((n,i)=>{ if(n.t !== "choice") return;
    let j = i-1; while(j >= 0 && nodes[j].t !== "line") j--;
    out.push({before: j >= 0 ? nodes[j] : null, opts:n.opts}); });
  return out;
}
const fxText = fx => (fx || []).map(f=>f.flag ? "" : f.k === "doom" ? `Doom ${f.d > 0 ? "+" : "−"}${Math.abs(f.d)}` : `${f.k[0].toUpperCase()+f.k.slice(1)} bond +${f.d}`).filter(Boolean).join(" · ");

/* ---------------- items: every card has an id, a list view and a class view ---------------- */
function items(){
  const c = C(), L = [];
  c.words.forEach((x,i)=>L.push({id:"w"+i, sec:"words", kind:"Word",
    card:()=>`<div class="hw"><span class="w">${esc(x.w)}</span><span class="kk">${esc(x.kk)}</span><span class="pos">${esc(x.pos)}</span>${spk(x.w)}</div>
      <div class="zh">${esc(x.zh)}</div>${ctx(x.line, x.w)}<p class="more">${esc(x.more)}</p>`,
    slide:()=>`<p class="kicker">Word</p><div class="hw"><p class="big">${esc(x.w)}</p>${spk(x.w)}</div><p class="sub">${esc(x.kk)} · ${esc(x.pos)} <span class="zh">${esc(x.zh)}</span></p>${ctx(x.line, x.w)}<p class="more">${esc(x.more)}</p>`}));
  c.phrases.forEach((x,i)=>L.push({id:"p"+i, sec:"phrases", kind:"Phrase",
    card:()=>`<div class="hw"><span class="w">${esc(x.p)}</span>${spk(x.p)}</div><div class="zh">${esc(x.zh)}</div>${ctx(x.line, x.p)}<p class="more">${esc(x.note)}</p>`,
    slide:()=>`<p class="kicker">Phrase</p><div class="hw"><p class="big">${esc(x.p)}</p>${spk(x.p)}</div><p class="zh">${esc(x.zh)}</p>${ctx(x.line, x.p)}<p class="more">${esc(x.note)}</p>`}));
  c.grammar.forEach((x,i)=>{ const lines = x.lines.map(l=>`<li>${esc(l)}</li>`).join("");
    L.push({id:"g"+i, sec:"grammar", kind:"Grammar",
    card:()=>`<div class="gt">${esc(x.title)}<span class="zh">${esc(x.zh)}</span></div><p class="how">${esc(x.how)}</p><ul class="ex">${lines}</ul><p class="try"><b>Try it:</b> ${esc(x.try)}</p>`,
    slide:()=>`<p class="kicker">Grammar · <span class="zh">${esc(x.zh)}</span></p><p class="big" style="font-size:1.4em">${esc(x.title)}</p><ul class="ex">${lines}</ul><p class="how">${esc(x.how)}</p><p class="try"><b>Try it:</b> ${esc(x.try)}</p>`}); });
  c.tone.forEach((x,i)=>{ const rows = `<table class="reg"><tbody>${x.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table>`;
    L.push({id:"t"+i, sec:"tone", kind:"Tone",
    card:()=>`<div class="gt">${esc(x.title)}</div>${rows}<p class="more">${esc(x.note)}</p>`,
    slide:()=>`<p class="kicker">Tone and register</p><p class="big" style="font-size:1.4em">${esc(x.title)}</p>${rows}<p class="more">${esc(x.note)}</p>`}); });
  choices().forEach((ch,i)=>{
    const opts = `<ul class="opts">${ch.opts.map(o=>`<li><span class="tone ${o.tone || ""}">${esc(TONE_ZH[o.tone] || "")}</span><span class="ot">${esc(plain(o.text))} <span class="zh">${esc(o.zh || "")}</span></span>${fxText(o.fx) ? `<span class="fx">${esc(fxText(o.fx))}</span>` : ""}</li>`).join("")}</ul>`;
    const before = ch.before ? `<p class="ctx">${esc(plain(ch.before.text))}</p>` : "";
    L.push({id:"c"+i, sec:"choices", kind:"Choice",
      card:()=>`<div class="gt">Choice ${i+1}</div>${before}${opts}`,
      slide:()=>`<p class="kicker">Choice ${i+1}</p>${before}${opts}`}); });
  c.questions.forEach((x,i)=>L.push({id:"q"+i, sec:"questions", kind:"Question",
    card:()=>`<span class="tag">${esc(x.tag)}</span><p class="q">${esc(x.q)}</p>`,
    slide:()=>`<p class="kicker">${esc(x.tag)}</p><p class="q">${esc(x.q)}</p>`}));
  return L;
}
const SECS = [["words","Words"],["phrases","Phrases"],["grammar","Grammar"],["tone","Tone"],["choices","Choices"],["questions","Discussion"]];

document.addEventListener("click", e=>{
  const s = e.target.closest("[data-say]"); if(s){ Say.say(s.dataset.say); return; }
  const t = e.target.closest("[data-tab]"); if(t){ tab = t.dataset.tab; store.set("tab", tab); render(); window.scrollTo(0,0); return; }

});
document.addEventListener("change", e=>{

  const k = e.target.closest(".pick input"); if(!k) return;
  const id = k.closest(".card").dataset.id, sel = picked();
  setPicked(k.checked ? sel.concat(id) : sel.filter(x=>x !== id));
  k.closest(".card").classList.toggle("picked", k.checked);
  const all = items(), s2 = picked();
  document.querySelectorAll(".tab").forEach(b=>{ const kk = b.dataset.tab, n = all.filter(x=>x.sec === kk).length, s = all.filter(x=>x.sec === kk && s2.includes(x.id)).length; b.querySelector("b").textContent = (s ? s + "/" : "") + n; });
});
$("#clear").onclick = ()=>{ setPicked([]); render(); };

/* ---------------- class view ---------------- */
let cvList = [], cvAt = 0;
function openCV(){
  const sel = picked(), order = items(); cvList = order.filter(x=>sel.includes(x.id)); if(!cvList.length) return;
  cvAt = 0; $("#cv").hidden = false; document.body.style.overflow = "hidden";
  document.documentElement.classList.toggle("cvzh-off", !store.get("cvzh", false)); $("#cvZh").classList.toggle("on", store.get("cvzh", false)); $("#cvZh").setAttribute("aria-pressed", store.get("cvzh", false));
  showCV();
}
function showCV(){
  const x = cvList[cvAt]; $("#cvSlide").innerHTML = x.slide();
  $("#cvPos").textContent = `${cvAt+1} / ${cvList.length} · ${x.kind}`;
  $("#cvPrev").disabled = cvAt === 0; $("#cvNext").disabled = cvAt === cvList.length - 1;
  $("#cv .stage").scrollTop = 0;
}
function closeCV(){ $("#cv").hidden = true; document.body.style.overflow = ""; if(window.speechSynthesis) speechSynthesis.cancel(); }
$("#go").onclick = openCV;
$("#cvX").onclick = closeCV;
$("#cvPrev").onclick = ()=>{ if(cvAt > 0){ cvAt--; showCV(); } };
$("#cvNext").onclick = ()=>{ if(cvAt < cvList.length - 1){ cvAt++; showCV(); } };
$("#cvZh").onclick = ()=>{ const on = !store.get("cvzh", false); store.set("cvzh", on); document.documentElement.classList.toggle("cvzh-off", !on); $("#cvZh").classList.toggle("on", on); $("#cvZh").setAttribute("aria-pressed", on); };
document.addEventListener("keydown", e=>{
  if($("#cv").hidden) return;
  if(e.key === "ArrowRight" || e.key === " "){ e.preventDefault(); $("#cvNext").click(); }
  if(e.key === "ArrowLeft"){ e.preventDefault(); $("#cvPrev").click(); }
  if(e.key === "Escape") closeCV();
});
let tx = null;
$("#cv").addEventListener("touchstart", e=>{ tx = e.touches[0].clientX; }, {passive:true});
$("#cv").addEventListener("touchend", e=>{ if(tx == null) return; const d = e.changedTouches[0].clientX - tx; tx = null; if(Math.abs(d) > 60) (d < 0 ? $("#cvNext") : $("#cvPrev")).click(); });

render();

</script>
</body>
</html>

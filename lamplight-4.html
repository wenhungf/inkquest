<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Lamplight Readers · Level 4</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5EFE3; --card:#FBF7EF; --ink:#2B2536; --muted:#6D6478; --rule:#E2D8C6; --shade:rgba(43,37,54,.06);
  --lv:#5F71A6; --lv-soft:#DAE0F0; --hl:#F6E3B8; --ok:#4E8A5B; --no:#B5524A; --stamp:#B5524A;
  --f-body:'Literata',Georgia,"PingFang TC","Noto Serif TC","Microsoft JhengHei",serif;
  --f-dot:'Jersey 15',"PingFang TC","Noto Sans TC",sans-serif;
  --f-zh:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --fs:19px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --paper:#1C1A25; --card:#24212F; --ink:#EDE6D6; --muted:#A79FB3; --rule:#383345; --shade:rgba(0,0,0,.25);
    --lv:#98A8D6; --lv-soft:#232A3D; --hl:#4A3B24; --ok:#8CC596; --no:#E08A80; --stamp:#E08A80;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#1C1A25; --card:#24212F; --ink:#EDE6D6; --muted:#A79FB3; --rule:#383345; --shade:rgba(0,0,0,.25);
  --lv:#98A8D6; --lv-soft:#232A3D; --hl:#4A3B24; --ok:#8CC596; --no:#E08A80; --stamp:#E08A80;}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.75;}
button{font:inherit;color:inherit;}
input,textarea,select{font-size:max(16px,1em);}
[hidden]{display:none !important;}
.zh,.zhs{font-family:var(--f-zh);}
.dot{font-family:var(--f-dot);font-weight:400;letter-spacing:.03em;}
svg.px{width:1em;height:1em;image-rendering:pixelated;}

/* ---------- cover ---------- */
#cover{position:fixed;inset:0;z-index:50;background:#141222;color:#F3EBDD;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));overflow:auto;cursor:pointer;}
body:not(.cover) #cover{display:none;}
body.cover{overflow:hidden;}
#cover .stage{width:min(100%,720px);border-radius:14px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.5);line-height:0;}
#cover canvas{width:100%;height:auto;display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
#cover .ck{font-family:var(--f-dot);font-size:15px;letter-spacing:.14em;color:#98A8D6;margin:22px 0 4px;text-align:center;}
#cover h1{font-family:var(--f-dot);font-weight:400;font-size:clamp(2.6rem,11vw,4.2rem);line-height:1;margin:0;letter-spacing:.02em;text-align:center;}
#cover .cz{font-family:var(--f-zh);font-size:16px;opacity:.85;margin:8px 0 18px;text-align:center;letter-spacing:.08em;}
#cover .go{font-family:var(--f-dot);font-size:20px;letter-spacing:.06em;background:#98A8D6;color:#1C1A25;border:0;border-radius:30px;padding:10px 26px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35);}
#cover .go:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35);}
#cover .cm{font-family:var(--f-dot);font-size:14px;letter-spacing:.1em;opacity:.7;margin-top:14px;}
#cover .cc{font-family:var(--f-zh);font-size:12px;opacity:.5;margin-top:14px;}
#cover .crow{display:flex;gap:12px;justify-content:center;}
#cover .go{font-size:16px;padding:7px 18px;}
#cover .go.alt{background:transparent;color:#F3EBDD;box-shadow:inset 0 0 0 1.5px rgba(243,235,221,.6);}
#cover .go.alt.on{background:#F3EBDD;color:#1C1A25;box-shadow:none;}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);}
.ib{width:42px;height:42px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none;}
.ib:hover{background:var(--shade);}
.ib svg{width:22px;height:22px;fill:currentColor;}
.ib.on{color:var(--lv);}
.brand{font-family:var(--f-dot);font-size:20px;letter-spacing:.04em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.brand small{font-size:15px;color:var(--lv);margin-left:6px;}

main{max-width:42rem;margin:0 auto;padding:18px 18px 90px;}

/* ---------- home ---------- */
.lib{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px 16px 14px;margin:6px 0 22px;position:relative;overflow:hidden;}
.lib:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lv);}
.libh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.libh b{font-family:var(--f-dot);font-weight:400;font-size:22px;letter-spacing:.04em;}
.libh span{font-family:var(--f-zh);font-size:13px;color:var(--muted);}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 10px;}
.st{aspect-ratio:1;border:2px dashed var(--rule);border-radius:50%;display:grid;place-items:center;font-family:var(--f-dot);font-size:18px;color:var(--rule);cursor:pointer;background:none;padding:0;}
.st.on{border:3px double var(--stamp);color:var(--stamp);transform:rotate(-12deg);}
.st.on svg{width:58%;height:58%;}
.st.new{animation:thump .5s cubic-bezier(.2,1.6,.4,1);}
@keyframes thump{0%{transform:scale(2.2) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.libs{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--f-zh);font-size:13.5px;color:var(--muted);}
.libs b{font-family:var(--f-dot);font-weight:400;font-size:20px;color:var(--ink);margin-right:3px;}
.hh{font-family:var(--f-dot);font-weight:400;font-size:22px;letter-spacing:.05em;margin:8px 0 10px;}
.cards{display:grid;gap:10px;}
.card{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;cursor:pointer;}
.card:hover{border-color:var(--lv);}
.ico{width:48px;height:48px;border-radius:10px;background:var(--lv-soft);display:grid;place-items:center;}
.ico svg{width:34px;height:34px;}
.cn{font-family:var(--f-dot);font-size:19px;line-height:1.2;display:block;}
.cz2{font-family:var(--f-zh);font-size:13.5px;color:var(--muted);display:block;line-height:1.5;}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.tag{font-family:var(--f-zh);font-size:11.5px;line-height:1;padding:4px 7px;border-radius:20px;background:var(--shade);color:var(--muted);white-space:nowrap;}
.tag.t{background:var(--lv-soft);color:var(--ink);}
.cr{font-family:var(--f-dot);font-size:14px;color:var(--muted);text-align:right;line-height:1.2;}
.cr .ok{color:var(--stamp);font-size:22px;display:block;}

/* ---------- story ---------- */
.sk{font-family:var(--f-dot);font-size:15px;letter-spacing:.12em;color:var(--lv);margin:4px 0 2px;}
.story h1{font-family:var(--f-dot);font-weight:400;font-size:clamp(2.1rem,8vw,2.9rem);line-height:1.05;margin:0 0 4px;letter-spacing:.02em;}
.story .szt{font-family:var(--f-zh);font-size:17px;color:var(--muted);margin:0 0 10px;letter-spacing:.06em;}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;}
.intro{font-family:var(--f-zh);font-size:15px;line-height:1.85;color:var(--muted);background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin:0 0 16px;}
.by{font-family:var(--f-body);font-style:italic;font-size:14px;color:var(--muted);display:block;margin-top:6px;}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 18px;position:sticky;top:59px;z-index:5;padding:8px 0;background:var(--paper);}
.pb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--card);border-radius:24px;padding:7px 14px;cursor:pointer;font-family:var(--f-zh);font-size:14.5px;line-height:1.2;}
.pb svg{width:16px;height:16px;fill:currentColor;}
.pb.on{background:var(--lv);border-color:var(--lv);color:#fff;}
.pb.sel{border-color:var(--lv);box-shadow:0 0 0 3px var(--lv-soft);}
.pp{position:relative;padding-left:40px;margin:0 0 1.05em;}
.pspk{position:absolute;left:0;top:.2em;width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--muted);}
.pspk svg{width:15px;height:15px;fill:currentColor;}
.pspk.live{background:var(--lv);border-color:var(--lv);color:#fff;}
.pp .en{margin:0;}
.pp .en .t{border-radius:4px;transition:background .25s;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 2px;margin:0 -2px;}
.pp.speaking .en .t{background:var(--hl);}
.pp .zh{margin:.35em 0 0;font-size:.8em;line-height:1.8;color:var(--muted);display:none;}
body.showzh .pp .zh{display:block;}
.g{cursor:pointer;border-bottom:2px dotted var(--lv);}
.g.cu{border-bottom-style:dashed;border-bottom-color:var(--muted);}
.g:focus-visible{outline:2px solid var(--lv);outline-offset:2px;}
.flash{animation:flash 1.8s ease;}
@keyframes flash{0%,40%{background:var(--hl)}100%{background:transparent}}
.end{text-align:center;font-family:var(--f-dot);font-size:22px;letter-spacing:.2em;color:var(--lv);margin:28px 0 20px;}
.box{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px;margin:0 0 18px;}
.bh{font-family:var(--f-dot);font-size:20px;letter-spacing:.04em;margin:0;}
.bz{font-family:var(--f-zh);font-size:13px;color:var(--muted);margin:0 0 10px;}
.q{margin:14px 0 0;}
.qt{margin:0 0 6px;font-weight:600;font-size:.95em;}
.qo{display:grid;gap:6px;}
.qo button{text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:.9em;line-height:1.45;}
.qo button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper));}
.qo button.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--paper));text-decoration:line-through;}
.qx{font-family:var(--f-zh);font-size:14px;line-height:1.75;margin:6px 0 0;color:var(--muted);}
.qx b{color:var(--ink);}
.done{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.bigst{font-family:var(--f-dot);font-size:21px;letter-spacing:.05em;background:var(--lv);color:#fff;border:0;border-radius:30px;padding:10px 24px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18);}
.bigst[disabled]{background:transparent;color:var(--stamp);box-shadow:none;border:3px double var(--stamp);transform:rotate(-3deg);cursor:default;}
.done small{font-family:var(--f-zh);font-size:13px;color:var(--muted);}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px;}
.nav button{flex:1;max-width:48%;border:1px solid var(--rule);background:var(--card);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;line-height:1.3;}
.nav button:last-child{text-align:right;margin-left:auto;}
.nav small{display:block;font-family:var(--f-zh);font-size:12px;color:var(--muted);}
.nav span{font-family:var(--f-dot);font-size:17px;}

/* ---------- popover ---------- */
#pop{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);transition:transform .25s ease;display:flex;justify-content:center;pointer-events:none;}
#pop.on{transform:none;}
#pop .in{pointer-events:auto;width:min(100%,40rem);background:var(--card);border:1px solid var(--rule);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);padding:16px 18px max(18px,env(safe-area-inset-bottom));max-height:60vh;overflow:auto;}
.ph{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;position:relative;padding-right:140px;min-height:42px;}
.pw{font-family:var(--f-body);font-weight:600;font-size:1.3em;}
.pk{font-family:"Lucida Sans Unicode","Arial Unicode MS",var(--f-body);color:var(--muted);font-size:.95em;}
.lvb{font-family:var(--f-dot);font-size:14px;padding:1px 8px;border-radius:12px;background:var(--shade);color:var(--muted);}
.lvb.hi{background:var(--lv-soft);color:var(--ink);}
.px2{position:absolute;right:-6px;top:-4px;display:flex;gap:2px;}
.pz{font-family:var(--f-zh);font-size:17px;margin:6px 0 2px;}
.pd{font-family:var(--f-zh);font-size:14.5px;line-height:1.8;color:var(--muted);margin:0;}
.pn{font-family:var(--f-zh);font-size:12.5px;color:var(--muted);margin:8px 0 0;}
.star svg{width:22px;height:22px;}
.star.on{color:#D9A21B;}

/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(15,10,25,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;}
#scrim.on{opacity:1;pointer-events:auto;}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(92vw,26rem);z-index:35;background:var(--paper);border-right:1px solid var(--rule);transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column;}
#drawer.on{transform:none;}
.dtop{display:flex;align-items:center;gap:6px;padding:10px 10px 0;padding-top:max(10px,env(safe-area-inset-top));}
.dtop b{font-family:var(--f-dot);font-weight:400;font-size:20px;flex:1;}
.tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--rule);overflow-x:auto;}
.tabs button{border:0;background:transparent;border-radius:20px;padding:6px 12px;cursor:pointer;font-family:var(--f-zh);font-size:14px;white-space:nowrap;}
.tabs button.on{background:var(--lv);color:#fff;}
.pane{flex:1;overflow:auto;padding:14px 14px max(30px,env(safe-area-inset-bottom));font-size:16px;}
.toc a{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-radius:10px;color:inherit;text-decoration:none;cursor:pointer;}
.toc a:hover,.toc a.cur{background:var(--shade);}
.toc svg{width:28px;height:28px;}
.toc .n{font-family:var(--f-dot);font-size:17px;line-height:1.2;}
.toc .z{font-family:var(--f-zh);font-size:12.5px;color:var(--muted);display:block;}
.toc .ok{color:var(--stamp);font-family:var(--f-dot);}
.sbox{width:100%;border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:10px 12px;color:var(--ink);font-family:var(--f-body);}
.res{margin-top:12px;display:grid;gap:8px;}
.res a{display:block;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;cursor:pointer;color:inherit;text-decoration:none;font-size:15px;line-height:1.55;}
.res small{display:block;font-family:var(--f-dot);font-size:13px;color:var(--lv);letter-spacing:.06em;}
.res mark{background:var(--hl);color:inherit;border-radius:3px;}
.hint{font-family:var(--f-zh);font-size:13.5px;color:var(--muted);line-height:1.75;}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px;}
.seg button{border:1px solid var(--rule);background:var(--card);border-radius:20px;padding:6px 13px;cursor:pointer;font-family:var(--f-zh);font-size:14px;}
.seg button.on{border-color:var(--lv);box-shadow:0 0 0 3px var(--lv-soft);}
.lab{font-family:var(--f-zh);font-size:14px;font-weight:600;margin:0;}
select.sbox{appearance:auto;}
.wl{display:grid;gap:4px;}
.wl h4{font-family:var(--f-dot);font-weight:400;font-size:16px;color:var(--lv);margin:12px 0 2px;letter-spacing:.04em;}
.wl a{display:flex;gap:8px;align-items:baseline;padding:5px 6px;border-radius:8px;cursor:pointer;color:inherit;text-decoration:none;}
.wl a:hover{background:var(--shade);}
.wl a b{font-weight:600;}
.wl a span{font-family:var(--f-zh);font-size:13.5px;color:var(--muted);}
.wl a i{margin-left:auto;font-style:normal;color:#D9A21B;}
.about p{font-family:var(--f-zh);font-size:14.5px;line-height:1.85;margin:0 0 12px;}
.about .big{font-family:var(--f-dot);font-size:26px;line-height:1.1;margin:4px 0 2px;}
.about .mot{font-family:var(--f-body);font-style:italic;color:var(--muted);margin:0 0 14px;}
.about ul{font-family:var(--f-zh);font-size:14px;line-height:1.8;padding-left:1.2em;margin:0 0 12px;}
.danger{border:1px solid var(--no);color:var(--no);background:transparent;border-radius:20px;padding:6px 14px;cursor:pointer;font-family:var(--f-zh);font-size:14px;}

/* ---------- music panel ---------- */
#mp{position:fixed;top:62px;right:10px;z-index:25;width:min(92vw,20rem);background:var(--card);border:1px solid var(--rule);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:12px;}
.trk{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:12px;padding:8px;cursor:pointer;}
.trk:hover{background:var(--shade);}
.trk .pl{width:34px;height:34px;border-radius:50%;background:var(--lv);color:#fff;display:grid;place-items:center;font-size:13px;}
.trk.on{border-color:var(--lv);}
.trk.on .pl{background:var(--ink);color:var(--paper);}
.trk .tn{font-family:var(--f-dot);font-size:17px;display:block;line-height:1.2;}
.trk .tz{font-family:var(--f-zh);font-size:12.5px;color:var(--muted);display:block;}
.vol{display:flex;align-items:center;gap:10px;margin:8px 4px 2px;font-family:var(--f-zh);font-size:13px;color:var(--muted);}
.vol input{flex:1;accent-color:var(--lv);}

#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;transition:all .25s;z-index:60;background:var(--ink);color:var(--paper);font-family:var(--f-zh);font-size:14.5px;padding:10px 16px;border-radius:24px;max-width:90vw;text-align:center;pointer-events:none;}
#toast.on{opacity:1;transform:translate(-50%,0);}
@media (max-width:480px){ .cr{display:none} .card{grid-template-columns:44px 1fr} .ico{width:44px;height:44px} main{padding:14px 16px 90px} }
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important;} }
</style>
</head>
<body>


<div id="cover">
  <div class="stage"><canvas id="cv" width="320" height="180" aria-label="夜晚的書桌：窗外下著雨，檯燈亮著，桌上有打開的書和一杯冒著熱氣的茶"></canvas></div>
  <p class="ck" id="cvK"></p>
  <h1>Lamplight Readers</h1>
  <p class="cz" id="cvZ"></p>
  <div class="crow"><button class="go" id="goBtn">▶ START</button><button class="go alt" id="coverMusic" aria-pressed="false">♪ MUSIC</button></div>
  <p class="cc">© 2026 Wen-Hung Fang. All rights reserved.</p>
</div>

<header class="bar">
  <button class="ib" id="menuBtn" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
  <div class="brand" id="brand" role="button" tabindex="0">Lamplight <small id="brandLv"></small></div>
  <button class="ib" id="musicBtn" aria-label="音樂"><svg viewBox="0 0 24 24"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></button>
  <button class="ib" id="setBtn" aria-label="設定"><svg viewBox="0 0 24 24"><path d="M9.2 5h2.1l4.6 13h-2.2l-1.1-3.3H7.8L6.7 18H4.6L9.2 5zm-.8 7.9h3.9L10.3 7l-1.9 5.9zM17 11h1.6l2.9 7h-1.7l-.6-1.6h-2.8l-.6 1.6h-1.7l2.9-7zm-.1 4.1h1.9l-.9-2.6-1 2.6z"/></svg></button>
</header>

<div id="mp" hidden>
  <div id="tracks"></div>
  <div class="vol"><span>音量</span><input type="range" id="vol" min="0" max="100" aria-label="音量"><button class="pb" id="mStop">停止</button></div>
</div>

<main id="main"></main>

{ id:"bluecross", thread:"", kind:"classic", title:"The Blue Cross", zt:"藍十字", voice:"m",
  by:"G. K. Chesterton, 1910 · retold",
  intro:"全歐洲最厲害的警探，追捕全歐洲最厲害的大盜。可是真正解開謎題的，是一個拿著破雨傘、提著一堆牛皮紙包裹、看起來傻呼呼的矮小神父。",
  paras:[
    ["Between the silver ribbon of morning and the green shining ribbon of sea, the boat touched [[Harwich|c:n-harwich]] and let loose a crowd of people like flies. Among them was a man who did not want to be noticed, and nobody noticed him. He wore a light gray suit and a white waistcoat, and he looked like a quiet tourist. He was, in fact, [[Aristide Valentin|c:n-valentin]], head of the Paris police and the most famous [[detective]] in the world.",
     "在銀色的晨光和閃著綠光的海面之間，船靠上了哈威治港，一群人像蒼蠅一樣湧下船。人群中有一個男人不想被注意，也確實沒有人注意到他。他穿著淺灰色西裝和白色背心，看起來像個安靜的觀光客。事實上，他是巴黎警察局長，全世界最有名的偵探：亞里斯提德．華倫丁。","calm"],
    ["He had come to England to catch the greatest criminal of the age. [[Flambeau|c:n-flambeau]] had robbed banks and had once run a milk company with no cows at all: every morning, he simply moved other people’s milk cans to his customers’ doors. Another time, he changed all the house numbers in a street in one night, just to [[lure]] a man into a trap. He was a genius of [[disguise]]. But there was one thing he could not hide. He was enormously tall. Valentin knew that if he saw a very tall man of any kind, he would arrest him at once.",
     "他來英國，是為了抓這個時代最偉大的罪犯。弗蘭博搶過銀行，還開過一家一頭牛都沒有的牛奶公司：每天早上，他只是把別人家門口的牛奶罐，搬到他客戶的門口。還有一次，他在一夜之間把一整條街的門牌號碼全部換掉，只為了把一個人引進陷阱。他是喬裝的天才。可是有一樣東西他藏不住：他非常非常高。華倫丁知道，只要看到任何一個特別高的男人，他就會立刻逮捕他。","informative"],
    ["Valentin was not a romantic man. He believed in reason, in cold logic and in good maps. But he also knew something that most policemen forget. The criminal is the artist; the detective is only the critic. A clever criminal never does the obvious thing. So a clever detective must sometimes do the unexpected thing, and follow it wherever it goes.",
     "華倫丁不是一個浪漫的人。他相信理性，相信冷靜的邏輯，也相信好的地圖。可是他也知道一件大多數警察都會忘記的事：罪犯是藝術家，偵探只是評論家。聰明的罪犯從來不做理所當然的事。所以，聰明的偵探有時候也得做出人意料的事，然後跟著它走，不管它通往哪裡。","thoughtful"],
    ["On the train to London, there was nobody tall. There were a few farmers, a small woman and a very short Roman Catholic priest with a round face and a large, shabby umbrella. He carried several brown paper parcels and kept dropping them. He told everyone on the train, with great [[innocence]], that he had to be careful, because one of his parcels held something made of silver “with blue stones.” Valentin felt sorry for him. Then he forgot about him.",
     "往倫敦的火車上，沒有高個子。只有幾個農夫、一個嬌小的女人，還有一個非常矮的天主教神父，圓圓的臉，拿著一把又大又破的雨傘。他提著好幾個牛皮紙包裹，一直弄掉。他用一種非常天真的口氣，跟車上的每個人說他得小心一點，因為其中一個包裹裡有銀做的東西，「上面還有藍色的寶石」。華倫丁有點同情他，然後就把他忘了。","amused"],
    ["In London, Valentin had no [[clue]] at all. So he did something strange. When he had nothing to follow, he followed nothing. He walked wherever chance took him, and he stopped wherever something looked wrong. His theory was simple: if you are in the dark, any small light is worth following. He walked until he came to a little restaurant on a corner, and he went in for a coffee.",
     "到了倫敦，華倫丁一點線索都沒有。所以他做了一件奇怪的事。當他沒有東西可以追的時候，他就什麼都不追。他隨著機會亂走，只要看到不對勁的地方就停下來。他的理論很簡單：在黑暗中，任何一點小小的光都值得跟過去。他一直走，走到街角一間小餐廳，進去點了一杯咖啡。","thoughtful"],
    ["He put some sugar into his coffee and tasted it. It was salt. He looked at the salt bowl. It was full of sugar. Valentin called the waiter. The waiter looked at the bowls, turned pale and said, “It must be those two priests. They came in early this morning. One of them paid, and then, before he left, he threw his soup at the wall.” The waiter pointed. There was a dark [[stain]] on the wallpaper. Valentin paid at once and asked which way the priests had gone.",
     "他在咖啡裡加了點糖，嚐了一口。是鹽。他看了看鹽罐，裡面裝滿了糖。華倫丁把服務生叫來。服務生看了看罐子，臉色發白，說：「一定是那兩個神父。他們今天一大早來的。其中一個付了錢，離開前把湯潑到牆上。」服務生指了指，壁紙上有一塊深色的污漬。華倫丁馬上付了錢，問那兩個神父往哪個方向走了。","surprised"],
    ["Two streets away, he found a fruit shop. The price labels had been [[swapped]]: a card on the oranges said BEST NUTS, and a card on the nuts said FINEST ORANGES. The angry shopkeeper said that two priests had passed by. The short one had knocked over a whole box of apples with his umbrella and then said sorry very nicely. “Which way?” asked Valentin. The man pointed toward the north.",
     "隔了兩條街，他看到一家水果店。價格標籤被調換了：橘子上的牌子寫著「最好的堅果」，堅果上的牌子寫著「最好的橘子」。氣呼呼的老闆說，剛才有兩個神父經過。矮的那個用雨傘撞翻了一整箱蘋果，然後非常有禮貌地道了歉。「往哪邊走？」華倫丁問。老闆指了指北邊。","amused"],
    ["Valentin found two policemen and took them with him. They did not understand. “Sir,” said one, “two priests playing tricks is not a crime.” “No,” said Valentin. “But it is a [[trail]].” In a sweet shop, the girl behind the counter said that a priest had left a brown paper parcel there. Later, he had sent a message asking her to post it to an address in Westminster. In another restaurant, a window had been broken. The waiter said that a short priest had paid for the window before he broke it.",
     "華倫丁找了兩個警察一起去。他們搞不懂。「長官，」其中一個說，「兩個神父惡作劇，又不是犯罪。」「不是，」華倫丁說，「但這是一條可以追的線索。」在一家糖果店，櫃台的女孩說，有個神父把一個牛皮紙包裹忘在店裡。後來他傳話來，請她把包裹寄到西敏區的一個地址。在另一家餐廳，一扇窗戶被打破了。服務生說，有個矮小的神父在打破窗戶之前，就先付了賠償的錢。","curious"],
    ["“He paid before he broke it?” said one of the policemen. “He must be mad.” Valentin said nothing. Someone was leaving them a [[deliberate]] trail of small, silly crimes, and he did not yet know why. They followed it all afternoon, from a bus to a street and from a street to the edge of [[Hampstead Heath|c:n-hampstead]], a great green hill on the edge of London. The sun was going down, and the sky turned the color of a peacock’s tail.",
     "「打破之前就先付錢？」其中一個警察說，「他一定是瘋了。」華倫丁沒說話。有人刻意留下了一連串小小的、愚蠢的「罪行」給他們追，他還不知道為什麼。他們追了一整個下午，從公車追到街上，從街上追到漢普斯特德荒野的邊緣，那是倫敦邊上一座大大的綠色山丘。太陽正在下山，天空變成了孔雀尾巴的顏色。","thoughtful"],
    ["By now the policemen were tired and cross. “Sir,” said the younger one, “we have followed salt, soup, apples and a window across half of London. What if this is just a silly little priest having a silly little day?” Valentin did not answer. He was looking at the long, dark hill ahead of them, where two black shapes were walking slowly against the last of the light. One was short. The other was very tall.",
     "到了這時候，兩個警察已經又累又不耐煩。「長官，」年輕的那個說，「我們跟著鹽、湯、蘋果和一扇窗戶，跑了半個倫敦。萬一這只是一個傻傻的小神父，過了傻傻的一天呢？」華倫丁沒有回答。他望著前方那座又長又暗的山丘，兩個黑色的身影正在最後一點天光中慢慢走著。一個矮，一個非常高。","nervous"],
    ["There, on a bench under a tree, sat two priests. One was the short man from the train. The other was very, very tall. Valentin and the policemen crept behind the trees, close enough to hear. The two priests were talking about the stars and about God. The tall one said, “Who can know if, out there, reason is reasonable?” The short one answered gently, “Reason is always reasonable, even in the last [[limbo]].”",
     "在那裡，一棵樹下的長椅上，坐著兩個神父。一個是火車上那個矮小的男人。另一個非常非常高。華倫丁和警察躲在樹後面，悄悄靠近，近到聽得見他們說話。兩個神父正在談星星，談上帝。高的那個說：「誰知道在那遙遠的地方，理性還合不合理呢？」矮的那個溫和地回答：「理性永遠是合理的，就算在最遠的地方也一樣。」","calm"],
    ["Then the tall priest’s voice changed. “Well,” he said, “just hand over that cross.” The short priest did not move. “Are you sure you want it?” he asked. “I know who you are,” said the tall man. “I’m Flambeau, and I want that blue cross. There’s nobody here to help you.” The little priest looked sad. “I’m afraid,” he said, “that the cross isn’t here.”",
     "接著，高個子神父的聲音變了。「好了，」他說，「把那個十字架交出來。」矮個子神父一動也不動。「你確定你要它嗎？」他問。「我知道你是誰，」高個子說，「我是弗蘭博，我要那個藍十字。這裡沒有人能幫你。」小神父看起來有點難過。「恐怕，」他說，「十字架不在這裡。」","nervous"],
    ["Flambeau tore open the parcel in his hand. Inside were only paper and a few sticks of lead. “I [[suspected]] you the moment we met,” said the little priest. “There was a little bulge under your sleeve, where thieves wear a [[bracelet]] with spikes. So I switched the parcels when you weren’t looking. The real cross is safe. I left it at the sweet shop, and they posted it for me. It is at Westminster by now.” Flambeau laughed, a little wildly. “You? A country priest? How could you know about bracelets and switched parcels?”",
     "弗蘭博扯開他手上的包裹。裡面只有紙和幾根鉛條。「我們第一次見面，我就懷疑你了，」小神父說，「你的袖子底下鼓起一塊，那是小偷戴尖刺手環的地方。所以我趁你不注意，把包裹調換了。真正的十字架很安全。我把它留在糖果店，請店裡幫我寄出去，現在應該已經到西敏區了。」弗蘭博笑了，笑得有點瘋狂。「你？一個鄉下神父？你怎麼會懂手環和調包這種事？」","proud"],
    ["“Because people come to me and tell me their sins,” said [[Father Brown|c:n-fatherbrown]] simply. “A man who listens to sins all his life learns a great deal about human evil. And I knew you weren’t a real priest. You attacked reason. That’s bad theology.” Then he smiled. “And didn’t you notice? I left a trail for the police all day: the salt, the soup, the apples, the window. They’re standing behind those trees right now.”",
     "「因為大家會來找我，跟我說他們的罪，」布朗神父簡單地說，「一個一輩子都在聽人告解的人，對人性的黑暗知道得很多。而且我知道你不是真的神父。你攻擊理性，那是很糟糕的神學。」然後他笑了。「你沒發現嗎？我一整天都在幫警察留線索：鹽、湯、蘋果、窗戶。他們現在就站在那些樹後面。」","amused"],
    ["Valentin stepped out of the shadows, and the two policemen took Flambeau by the arms. The greatest criminal in Europe did not fight. Like a gentleman who has lost a game, he turned to the greatest detective in Europe and made him a deep bow. Valentin took off his hat. “Do not bow to me, my friend,” he said to Flambeau. “Let us both bow to our [[master]].”",
     "華倫丁從陰影中走出來，兩個警察抓住了弗蘭博的手臂。全歐洲最偉大的罪犯沒有反抗。他像一個輸了棋的紳士，轉向全歐洲最偉大的偵探，深深鞠了一個躬。華倫丁摘下帽子。「別對我鞠躬，我的朋友，」他對弗蘭博說，「讓我們兩個一起，向我們的老師鞠躬吧。」","tender"],
    ["And for a moment the two of them stood there in the evening light, hats in their hands, before the little priest from Essex. He did not notice. He was blinking around him, looking for his umbrella, which he had dropped again. The cleverest mind in England, Valentin thought, belonged to a man who could not hold on to an umbrella. He decided he would never again judge a man by his hat.",
     "於是有那麼一刻，兩個人站在黃昏的光線裡，手裡拿著帽子，面對那位從艾塞克斯來的小神父。他完全沒注意到。他正眨著眼睛四處張望，找他又弄掉的雨傘。華倫丁心想，全英國最聰明的頭腦，竟然屬於一個連雨傘都拿不好的人。他決定，從此以後，再也不以帽子取人了。","amused"]
  ],
  quiz:[
    ["Why did Father Brown leave salt in the sugar bowl and break a window?", ["He wanted to make a trail for the police to follow.","He was angry with the restaurants.","Flambeau told him to do it."], 0, "他一路故意製造小麻煩，好讓警察跟著線索找到荒野上的他們。"],
    ["How did Father Brown first suspect that the tall priest was a thief?", ["He was too tall.","He wore a thief’s spiked bracelet.","He spoke with a French accent."], 1, "布朗神父第一次見到他，就注意到他袖子底下鼓起來，那是小偷常戴的尖刺手環。"],
    ["Where was the real blue cross at the end?", ["In Flambeau’s parcel.","Under the bench.","In a parcel posted to Westminster."], 2, "神父早就調了包，把真正的十字架寄到西敏區，弗蘭博拿到的只是紙和鉛條。"]
  ]
},

{ id:"imp", thread:"", kind:"classic", title:"The Bottle Imp", zt:"瓶中妖", voice:"m",
  by:"Robert Louis Stevenson, 1891 · retold",
  intro:"一個小瓶子，裡面住著一個小妖怪，可以實現你任何願望。只有一個條件：你死的時候，它不能在你手上。而要擺脫它，你只能用比你買來時更便宜的價錢賣掉它。",
  paras:[
    ["There was a young man of [[Hawaii|c:n-hawaii]] named [[Keawe|c:n-keawe]]. He was poor, brave and as strong as a horse, and he could read and write like a schoolteacher. He was also a sailor, and one day his ship took him to [[San Francisco|c:n-sanfrancisco]]. He walked up a hill full of rich men’s houses, admiring them, until he stopped in front of one that was as beautiful as a toy. The windows were as bright as diamonds.",
     "夏威夷有個年輕人，名叫奇維。他很窮，很勇敢，力氣大得像一匹馬，而且讀書寫字像個學校老師一樣好。他也是個水手。有一天，他的船來到了舊金山。他走上一座滿是有錢人房子的山丘，一邊走一邊欣賞，直到他停在一棟漂亮得像玩具的房子前面。那棟房子的窗戶亮得像鑽石。","calm"],
    ["An old man was looking out of one window. His face was as sad as rain. Keawe and the old man looked at each other, and each of them envied the other. The old man invited him in and showed him the house from top to bottom. Then he took a small, round-bellied bottle from a cupboard. Something dark was moving inside it, like a shadow and a fire at the same time.",
     "一個老人正從其中一扇窗往外看，臉色哀傷得像下雨天。奇維和老人互相看著，兩個人都羨慕對方。老人請他進屋，帶他從上到下參觀。然後，他從櫥櫃裡拿出一個圓肚子的小瓶子。瓶子裡有個暗暗的東西在動，像影子，又像一團火。","curious"],
    ["“This bottle holds an [[imp]],” the old man said. “It will give you anything you want: love, money, a house like this one. But there is a catch. If you die while you own it, you will burn forever. And you cannot throw it away. You can only sell it, and only for less money than you paid. If you sell it for the same price or more, it comes back to you, like a homing pigeon.” He had paid ninety dollars. He would sell it for fifty.",
     "「這個瓶子裡住著一個小妖怪，」老人說，「你想要什麼，它都會給你：愛情、金錢、像這樣的一棟房子。可是有一個條件。如果你死的時候它還在你手上，你就會永遠在地獄裡燃燒。而且你不能把它丟掉，你只能把它賣掉，而且賣的價錢一定要比你買的時候便宜。如果你用一樣的價錢或更貴的價錢賣，它就會像信鴿一樣，飛回你身邊。」他當初花了九十塊買的，現在願意五十塊賣掉。","nervous"],
    ["Keawe laughed and did not believe him, so he paid fifty dollars to prove it was a trick. He wished for his fifty dollars back, and when he put his hand in his pocket, the money was there. Frightened, he left the bottle in the gutter. Before he reached the corner, it was back in his pocket. He sold it to a man for sixty dollars. That night, it was waiting in his sea chest. It was real.",
     "奇維笑了，不相信他，就花了五十塊買下來，想證明那只是個把戲。他許願要把五十塊拿回來，手往口袋一伸，錢就在那裡。他嚇壞了，把瓶子丟在路邊的水溝裡。還沒走到街角，瓶子又回到了他的口袋。他用六十塊賣給一個男人。那天晚上，瓶子又在他的航海箱裡等著他。它是真的。","surprised"],
    ["Keawe’s friend [[Lopaka|c:n-lopaka]] told him to make one wish and then sell it quickly. So Keawe wished for a beautiful house on his own island, with land and a garden. When the ship came home, the news was waiting for him. His uncle had died suddenly and left him land, and his uncle’s son had drowned at sea. Keawe wept. He had not wanted his wish to come true like that. But the land was his, and soon his house was built: three floors, wide balconies and windows like the house in San Francisco. People called it the Bright House.",
     "奇維的朋友羅帕卡要他許一個願，然後趕快把瓶子賣掉。於是奇維許願，想在自己的島上有一棟漂亮的房子，有土地，有花園。船回到家，消息已經在等他了：他的叔叔突然過世，留了一塊地給他，叔叔的兒子也在海上淹死了。奇維哭了。他從沒想過，自己的願望會用這種方式實現。可是土地是他的了，房子很快就蓋好了：三層樓、寬敞的陽台，窗戶就像舊金山那棟房子一樣。大家都叫它「光明之屋」。","sad"],
    ["Before Lopaka paid, he asked to see the imp itself, just once, so that he would know the bottle was real. Keawe was afraid, but he agreed. Lopaka looked into the bottle and turned as white as paper. Neither of them ever said what they saw. But Lopaka paid at once, and his hands were shaking as he counted the money.",
     "羅帕卡付錢之前，要求親眼看一次那個小妖怪，好確定瓶子是真的。奇維很害怕，但還是答應了。羅帕卡往瓶子裡一看，臉白得像紙一樣。他們兩個從來沒說過自己看到了什麼。可是羅帕卡馬上就付了錢，數錢的時候，手還在發抖。","nervous"],
    ["Lopaka bought the bottle for forty-nine dollars and sailed away. Keawe was happy and free. Then, one evening by the sea, he met a young woman called [[Kokua|c:n-kokua]]. She was laughing at the edge of the water, and he fell in love with her before she had finished. Soon he asked her to marry him, and she said yes.",
     "羅帕卡用四十九塊買下瓶子，出海去了。奇維又快樂又自由。後來，某天傍晚在海邊，他遇到一個叫柯庫亞的年輕女子。她在水邊笑著，她還沒笑完，他就已經愛上了她。沒過多久，他向她求婚，她答應了。","tender"],
    ["That same night, Keawe took a bath and saw a small patch on his skin. His heart turned to ice. It was [[leprosy|c:leprosy]]. In those days, there was no cure. People who had it were sent away forever to a lonely place on the island of [[Molokai|c:n-molokai]]. He could never marry Kokua now. There was only one hope: the bottle.",
     "就在那天晚上，奇維洗澡時，在皮膚上看到一小塊斑。他的心一下子結成了冰。那是痲瘋病。在那個年代，這種病沒有藥醫，得病的人會被永遠送到摩洛凱島上一個孤單的地方。他再也不能娶柯庫亞了。只剩一個希望：那個瓶子。","worried"],
    ["He searched for days. The bottle had passed from hand to hand, each time a little cheaper, across the islands. At last he found it in [[Honolulu|c:n-honolulu]], with a pale young man who had paid only two cents for it. The young man wanted to get rid of it, but who could he sell it to? There was no coin smaller than one cent. Whoever bought it now could never sell it again.",
     "他找了好幾天。那個瓶子在島嶼之間一手傳過一手，每次都便宜一點。最後，他在檀香山找到了它，在一個臉色蒼白的年輕人手上，他只花了兩分錢就買下了它。年輕人很想擺脫它，可是能賣給誰呢？已經沒有比一分錢更小的硬幣了。現在買下它的人，就永遠賣不掉了。","worried"],
    ["Keawe paid one cent. That night he wished his skin clean, and in the morning, it was. He married Kokua. But he could not smile, he could not sleep, and at night he walked the beach alone. Kokua followed him and made him tell her the truth. When he finished, she did not cry. She thought for a long time. Then she said, “There are other countries with other coins. In France, they have a coin called a [[centime|c:centime]], and five of them make one cent. We will go to [[Tahiti|c:n-tahiti]], where they use French money.”",
     "奇維付了一分錢。那天晚上，他許願讓皮膚恢復乾淨，到了早上，果然好了。他娶了柯庫亞。可是他笑不出來，也睡不著，晚上總是一個人在海灘上走。柯庫亞跟在他後面，要他說出實話。他說完以後，她沒有哭。她想了很久，然後說：「別的國家有別的硬幣。法國有一種硬幣叫『生丁』，五個生丁才等於一分錢。我們去大溪地，那裡用的是法國的錢。」","hopeful"],
    ["So they sailed to Tahiti and rented a house. But when they offered the bottle and explained it, nobody wanted to buy it, not even for a few centimes. Soon people crossed the street when they saw Keawe. Each night he sat on the balcony, staring at the sea, as if the bottle were already pulling him down.",
     "於是他們坐船到大溪地，租了一間房子。可是每當他們拿出瓶子、把事情說清楚，就沒有人想買，就算只要幾個生丁也不要。沒多久，大家看到奇維就過馬路躲開。每天晚上，他坐在陽台上盯著大海，好像那個瓶子已經在把他往下拉。","sad"],
    ["Kokua loved him more than she feared the fire. One night, while Keawe slept, she took the bottle and found an old man in the street. She gave him four centimes and asked him to buy the bottle from her husband for that money. Then she bought it back from the old man for three centimes. Now the bottle was hers. She went home and lay down beside her husband, and she did not sleep at all.",
     "柯庫亞愛他，比她害怕地獄之火還要多。某天晚上，趁奇維睡著，她拿著瓶子到街上找了一個老人。她給老人四個生丁，請他用這筆錢向她丈夫買下瓶子。然後她再用三個生丁，從老人那裡把瓶子買回來。現在，瓶子是她的了。她回到家，躺在丈夫身邊，整夜沒有闔眼。","tender"],
    ["In the morning, Keawe found the bottle gone and felt as light as a bird. Then he saw Kokua’s face, pale and afraid, and he understood everything. His heart broke for the second time. He would not let her do this for him. So he made a plan of his own. He found a rough old [[boatswain|c:boatswain]] drinking near the harbor and gave him two centimes. “Buy it from my wife for these,” he said. “Then sell it to me for one.”",
     "早上，奇維發現瓶子不見了，覺得自己輕得像一隻鳥。然後他看到柯庫亞的臉，蒼白又害怕，他一下子全明白了。他的心第二次碎了。他不能讓她為他這麼做。所以他也想了一個計畫。他在港口邊找到一個正在喝酒的粗魯老水手長，給了他兩個生丁。「用這個向我太太買下瓶子，」他說，「然後用一個生丁賣給我。」","sad"],
    ["The boatswain went and came back with the bottle. But when Keawe held out his one centime, the old sailor laughed and put the bottle in his pocket. “I’m going to hell anyway,” he said. “And this thing can get me all the brandy I want. Find your own bottle.” Keawe begged him. “I’m warning you,” Keawe said. “You don’t understand what you’re doing.” “I understand fine,” said the boatswain, and he walked off whistling into the dark.",
     "水手長去了，帶著瓶子回來。可是當奇維拿出他的一個生丁，老水手笑了，把瓶子收進自己口袋。「反正我早就注定要下地獄了，」他說，「而且這東西可以讓我想喝多少白蘭地就喝多少。你自己去找你的瓶子吧。」奇維求他。「我警告你，」奇維說，「你不知道自己在做什麼。」「我清楚得很。」水手長說完，吹著口哨走進了黑夜。","nervous"],
    ["Keawe ran home to Kokua. That night, for the first time since their wedding, the two of them sat on the balcony and laughed. Below them, the sea was dark and quiet, and the lamps of the harbor shone like little stars. The bottle was gone forever. Keawe looked at his wife and thought that no imp in the world could have given him anything better than what he already had.",
     "奇維跑回家找柯庫亞。那天晚上，從結婚到現在第一次，兩個人坐在陽台上笑了。底下的海又暗又安靜，港口的燈火像小星星一樣閃爍。瓶子永遠消失了。奇維看著他的妻子，心想，世界上沒有任何一個妖怪，能給他比他已經擁有的更好的東西。","warm"]
  ],
  quiz:[
    ["What is the rule for getting rid of the bottle?", ["You must throw it into the sea.","You must sell it for less than you paid.","You must give it away for free."], 1, "只能賣掉，而且價錢一定要比買來的時候便宜；丟掉或同價賣出，瓶子都會自己回來。"],
    ["Why did Keawe need the bottle a second time?", ["He wanted a bigger house.","He found he had leprosy and wanted to be cured.","Lopaka asked him to buy it back."], 1, "他發現自己得了痲瘋病，只有瓶子能治好，才能娶柯庫亞。"],
    ["Why did Kokua want to go to Tahiti?", ["They used French centimes there, which are smaller than a cent.","Her family lived there.","Nobody knew about the bottle there."], 0, "生丁比一分錢更小，瓶子才有機會繼續往下賣。"]
  ]
},

{ id:"button", thread:"", kind:"classic", title:"The Curious Case of Benjamin Button", zt:"班傑明的奇幻旅程", voice:"m",
  by:"F. Scott Fitzgerald, 1922 · retold",
  intro:"1860 年，巴爾的摩一家醫院裡，一個嬰兒出生了。他留著白鬍子，看起來七十歲，而且，他會越活越年輕。",
  paras:[
    ["On a September morning in 1860, Mr. Roger Button hurried through the streets of [[Baltimore|c:n-baltimore]] toward the hospital. His wife had just had their first child. He was a respectable man who sold hardware, and he wanted the baby to be a boy, so that he could go to Yale and wear a good suit. When he arrived, the doctor would not look at him. The nurse dropped a tray. “Go and see for yourself,” she said in a strange voice.",
     "1860 年九月的一個早上，羅傑．巴頓先生匆匆穿過巴爾的摩的街道趕往醫院。他太太剛生下他們的第一個孩子。他是個體面的人，做五金批發生意。他希望是個男孩，將來可以去讀耶魯，穿體面的西裝。他到醫院時，醫生不肯看他。護士把托盤掉在地上。「你自己去看吧。」她用一種很奇怪的聲音說。","nervous"],
    ["In the nursery, wrapped in a white blanket that was much too small, sat an old man of about seventy. His hair was thin and white, and a long, dirty-gray beard hung down from his chin. His feet [[stuck out|stick out]] at the end of the hospital cot. He looked at Mr. Button with tired, faded eyes. “Are you my father?” he asked in a cracked voice. “Because if you are, I wish you’d get me out of here. This bed is terribly uncomfortable.”",
     "在育嬰室裡，裹著一條小得可憐的白毯子，坐著一個大約七十歲的老人。他的頭髮稀疏花白，下巴垂著一大把髒髒的灰白鬍子。他的腳從醫院的嬰兒床尾伸了出來。他用疲倦、黯淡的眼睛看著巴頓先生。「你是我爸爸嗎？」他用沙啞的聲音問，「如果是的話，拜託帶我離開這裡。這張床實在太不舒服了。」","surprised"],
    ["Mr. Button was [[horrified]]. What would people say? He hurried to a shop to buy clothes for his son. The shop assistant looked at him strangely when he asked for clothes for a newborn baby, size: old man. In the end, he bought a boy’s costume off a shop-window dummy and cut off most of the beard himself with a pair of hospital scissors. He named his son Benjamin. Then he did his best to pretend nothing was unusual.",
     "巴頓先生嚇壞了。別人會怎麼說？他趕緊去店裡幫兒子買衣服。他說要買新生兒穿的衣服，尺寸是老人，店員用很奇怪的眼神看他。最後，他買下櫥窗假人身上那套男童的化裝舞會服裝，還親手用醫院的剪刀把鬍子剪掉一大截。他給兒子取名叫班傑明。然後，他盡全力假裝一切都很正常。","amused"],
    ["He gave Benjamin a rattle and expected him to play with it. Benjamin shook it politely when someone was watching. Then he went back to reading his father’s encyclopedia, and at night he secretly smoked cigars with his grandfather. The two of them got along wonderfully. They were exactly the same age, after all, at least on the outside.",
     "他給班傑明一個搖鈴，希望他會玩。班傑明在有人看的時候，會很有禮貌地搖一搖。然後他就回去讀他爸爸的百科全書，晚上還偷偷跟祖父一起抽雪茄。他們兩個處得好極了。畢竟，至少從外表看起來，他們的年紀一模一樣。","playful"],
    ["When Benjamin was five, his father sent him to kindergarten. He sat at a tiny table with his dyed hair and his long legs, cutting paper with the other children. He was bored to tears. At the end of the first week, the teacher sent a polite note home. Benjamin, she wrote, was a lovely little boy, but he kept falling asleep during the songs.",
     "班傑明五歲時，爸爸送他去上幼稚園。他頂著染過的頭髮、拖著長長的腿，坐在小小的桌子前，跟其他小朋友一起剪紙。他無聊到快哭了。第一個星期結束時，老師寄了一封很有禮貌的信回家。她寫說，班傑明是個可愛的小男孩，可是他唱歌時一直睡著。","amused"],
    ["Then something strange became clear. Every year, Benjamin looked a little younger. His back straightened. His step grew lighter. At twelve, his hair had turned from white to iron gray. At eighteen, he stood as straight as a man of fifty and decided to [[enroll]] at Yale. When he arrived at the college, the registrar took one look at his gray hair and lost his temper. “This is a college for young men,” he shouted, “not a joke for old fools!” A crowd of students followed Benjamin to the station, laughing.",
     "接著，一件奇怪的事越來越明顯：班傑明每年都看起來更年輕一點。他的背挺直了，腳步也變輕了。十二歲時，他的頭髮已經從白色變成鐵灰色。十八歲時，他站得像個五十歲的男人一樣挺，決定去耶魯註冊。他一到學校，教務主任看了一眼他的灰頭髮，就大發脾氣。「這裡是給年輕人讀的大學，」他大吼，「不是給老糊塗開玩笑的！」一群學生跟著班傑明一路笑到車站。","sad"],
    ["So he joined his father’s hardware business instead. In 1880, at twenty, he went to a dance with his father, and there he met Hildegarde Moncrief, the daughter of a general. She had pale golden hair and a laugh like music. She thought he was his father’s brother, and she liked him at once. “Men your age are so much more interesting,” she told him. “Young men are so silly.” Benjamin fell in love with her on the spot.",
     "於是他改去爸爸的五金公司上班。1880 年，二十歲的他跟爸爸去參加一場舞會，在那裡遇見了一位將軍的女兒，希爾德加德．蒙克里夫。她有一頭淺金色的頭髮，笑聲像音樂一樣。她以為他是他爸爸的弟弟，一下子就喜歡上他了。「你這個年紀的男人有趣多了，」她對他說，「年輕男人都好幼稚。」班傑明當場就愛上了她。","tender"],
    ["They married, and the city talked about nothing else. People said that Hildegarde must have married a rich old man for his money. Others said that Benjamin was older than her father. Nobody believed the true story. But the business did well under Benjamin, and for some years, they were very happy. They had a son, Roscoe, who grew up into a serious, [[ambitious]] young man.",
     "他們結婚了，整座城市都在談這件事。有人說，希爾德加德一定是為了錢才嫁給一個有錢的老頭。也有人說，班傑明比她爸爸年紀還大。沒有人相信真正的故事。不過在班傑明的經營下，生意做得很好，好幾年裡，他們都過得很幸福。他們生了一個兒子，叫羅斯科，長大後成了一個嚴肅又有野心的年輕人。","calm"],
    ["But time ran in opposite directions for the two of them. Each year, Hildegarde grew a little older and quieter, and Benjamin grew a little younger and more restless. He began to go to dances alone. He took up golf and tennis. When war came in 1898, he joined the army, fought bravely and came home a lieutenant colonel with a medal, looking about thirty. His wife stayed at home with her knitting. They no longer had anything to say to each other.",
     "可是對他們兩個人來說，時間是往相反方向走的。每一年，希爾德加德都老一點、安靜一點；班傑明卻年輕一點、靜不下來一點。他開始一個人去跳舞，開始打高爾夫和網球。1898 年戰爭爆發，他從軍，打仗很勇敢，回來時已經是中校，還得了勳章，看起來大約三十歲。他太太待在家裡打毛線。他們之間再也沒有話可說了。","wistful"],
    ["By the time Benjamin was fifty, he looked twenty. He left the business to Roscoe and went to Harvard, where nobody laughed at him this time. In his first year, he was the star of the football team and beat Yale almost by himself, which gave him a quiet [[satisfaction]]. But by his last year, he was so small and thin that the bigger students pushed him around, and he could no longer play.",
     "到了五十歲，班傑明看起來只有二十歲。他把生意交給羅斯科，自己去讀哈佛，這次沒有人笑他了。大一那年，他是美式足球隊的明星，幾乎一個人就打敗了耶魯，心裡有一種默默的滿足。可是到了大四，他變得又小又瘦，大塊頭的學生把他推來推去，他再也不能打球了。","proud"],
    ["He went home to live with Roscoe, who was now a busy businessman with a wife and a little boy. Roscoe was embarrassed by his father. “You’re not a child,” he kept saying. “At least act your age. Behave yourself. And when visitors are here, don’t call me ‘Roscoe.’ Call me ‘Uncle.’” Benjamin tried. It was difficult. He looked fifteen, and he felt fifteen, and the world treated him like a boy.",
     "他回家跟羅斯科住。羅斯科現在是個忙碌的生意人，有太太，還有一個小兒子。羅斯科覺得他爸爸很丟臉。「你又不是小孩，」他一直說，「至少表現得像你的年紀一點，規矩一點。還有，有客人在的時候，不要叫我『羅斯科』，要叫我『叔叔』。」班傑明試了，可是很難。他看起來十五歲，感覺也是十五歲，整個世界都把他當小男孩看待。","deadpan"],
    ["When America joined the great war in Europe, a letter arrived making Benjamin a brigadier general. He had a new uniform made, put it on and went to an army camp to report for duty. The soldiers there laughed so hard that they had to hold on to the desk. A little boy in a uniform that was much too big for him! Someone called his son. Roscoe came to take him home, red in the face, and did not speak to him for a week.",
     "美國加入歐洲大戰時，一封信寄來，任命班傑明為准將。他訂做了一套新軍服，穿上後到軍營去報到。那裡的士兵笑到得扶著桌子才站得住。一個穿著大好幾號軍服的小男孩！有人打電話給他兒子。羅斯科來帶他回家，臉漲得通紅，一整個星期都不跟他說話。","sad"],
    ["After that, Benjamin went to kindergarten with Roscoe’s little son. At first, the two boys were the same size and played together happily. But soon Benjamin was smaller than his grandson. He liked the colored paper and the paste, and he liked it when the teacher said “Good boy.” He did not understand the big words the older children used, and he did not mind.",
     "後來，班傑明跟羅斯科的小兒子一起去上幼稚園。一開始，兩個男孩一樣高，開開心心地一起玩。可是沒多久，班傑明就比他的孫子還矮了。他喜歡色紙和漿糊，喜歡老師說「好乖」。大孩子說的那些長長的字他聽不懂，他也不在意。","gentle"],
    ["His memories began to [[fade]]. He did not remember the war, or Harvard, or the golden hair of Hildegarde. He did not remember being old. His world became small and warm: his nurse, Nana, his bath, his bottle of milk, the shapes of light on the ceiling. He was happy when Nana smiled at him, and he cried when she went away.",
     "他的記憶開始慢慢淡去。他不記得戰爭，不記得哈佛，也不記得希爾德加德的金髮。他不記得自己曾經老過。他的世界變得又小又溫暖：他的保母娜娜、洗澡、他的奶瓶、天花板上光影的形狀。娜娜對他笑，他就開心；娜娜走開，他就哭。","tender"],
    ["Then there were no more memories at all. There was only the soft white of his little bed, the warm milk, and Nana’s voice. And then, slowly, the light and the voice and the warm sweet smell of milk all faded together out of his mind, and there was only quiet, like the end of a long, long day.",
     "後來，連一點記憶都沒有了。只剩下他小床上柔軟的白色、溫熱的牛奶，還有娜娜的聲音。然後，慢慢地，光線、聲音，還有牛奶溫暖甜甜的味道，全都一起從他的腦海裡淡去，只剩下一片寧靜，就像一個長長、長長的一天結束時那樣。","wistful"]
  ],
  quiz:[
    ["What happened when Benjamin first tried to go to Yale at eighteen?", ["He became a football star.","The registrar thought he was an old man playing a joke.","He failed the exam."], 1, "他十八歲時看起來五十歲，教務主任以為他是來開玩笑的老糊塗。"],
    ["Why did Benjamin and Hildegarde drift apart?", ["She grew older while he grew younger.","He lost all his money.","She moved to another city."], 0, "她一年比一年老，他一年比一年年輕，兩人越來越沒有話說。"],
    ["What did Roscoe want Benjamin to call him when visitors were there?", ["Roscoe","Uncle","Mr. Button"], 1, "羅斯科覺得丟臉，要爸爸在客人面前叫他「叔叔」。"]
  ]
},

{ id:"persuasion", thread:"love", kind:"classic", title:"Persuasion", zt:"勸服", voice:"f",
  by:"Jane Austen, 1817 · retold and shortened",
  intro:"八年前，十九歲的安被說服，放棄了她愛的那個身無分文的年輕軍官。八年後，他回來了，成了有錢的艦長。他好像已經忘了她。她卻一天也沒忘記他。",
  paras:[
    ["[[Anne Elliot|c:n-anne]] was twenty-seven, and everyone in her family had stopped noticing her. Her father, [[Sir Walter|c:n-sirwalter]], loved two things: mirrors and his own name in the book of English baronets. Her elder sister, Elizabeth, was beautiful and cold. Her younger sister, Mary, was married and always ill when it was convenient. Anne was kind, clever and quiet, and in that house, quiet meant invisible.",
     "安．艾略特二十七歲，家裡已經沒有人會注意到她了。她爸爸華特爵士愛兩樣東西：鏡子，還有他自己的名字出現在英國準男爵名冊上。她姊姊伊莉莎白漂亮又冷淡。妹妹瑪麗已經嫁人，總是在剛好方便的時候生病。安善良、聰明、安靜，而在那個家裡，安靜就等於隱形。","wistful"],
    ["Eight years earlier, she had been engaged to a young naval officer called [[Frederick Wentworth|c:n-wentworth]]. He had no money and no family name, only courage and a great deal of confidence. Lady Russell, Anne’s godmother and dearest friend, [[persuaded]] her that the match was foolish. He might die at sea. He might never be rich. Anne was nineteen and believed it was her duty to listen. She broke the engagement. He left, angry and hurt, and she had never stopped regretting it.",
     "八年前，她跟一個名叫腓特烈．溫特沃斯的年輕海軍軍官訂過婚。他沒有錢，也沒有家世，只有勇氣和滿滿的自信。安的教母、也是她最親的朋友羅素夫人說服她，這門親事太不明智了：他可能會死在海上，可能永遠不會發財。十九歲的安相信聽話是她的責任，於是解除了婚約。他帶著憤怒和受傷離開，而她從此沒有一天不後悔。","sad"],
    ["Now her father was in [[debt]]. To save money, he rented out the family home, Kellynch Hall, and moved to the fashionable city of [[Bath|c:n-bath]]. The new tenants were Admiral and Mrs. Croft. Mrs. Croft, Anne discovered, had a brother: Captain Frederick Wentworth. The war was over, and he was coming home a rich man, looking for a wife.",
     "現在她爸爸欠了一身債。為了省錢，他把家族的宅邸凱林奇大廳租出去，搬到時髦的城市巴斯。新房客是克羅夫特上將夫婦。安發現，克羅夫特太太有一個弟弟：腓特烈．溫特沃斯上校。戰爭結束了，他發了財回國，正在找一位妻子。","nervous"],
    ["They met again at Mary’s house in the country. It took less than a minute. He bowed. She curtsied. He said a few polite words to her sister, and then he left the room. “Captain Wentworth said you were so altered he should not have known you,” Mary reported later, without any kindness. Anne said nothing. But that night, the words sat on her heart like a stone.",
     "他們在瑪麗鄉下的家重逢了，前後不到一分鐘。他鞠躬，她屈膝回禮。他對她妹妹說了幾句客套話，就離開了房間。「溫特沃斯上校說妳變了好多，他差點認不出妳。」瑪麗事後轉述，口氣一點也不客氣。安什麼也沒說。可是那天晚上，那句話像一顆石頭，壓在她的心上。","sad"],
    ["Over the next weeks, the captain was everywhere: at dinners, at dances, on country walks. He was charming to everyone except Anne. He was especially charming to Mary’s young sisters-in-law, Louisa and Henrietta Musgrove, who were pretty, lively, nineteen and twenty. Everyone wondered which one he would marry. Anne played the piano so that the others could dance, and she watched.",
     "接下來幾個星期，上校無所不在：晚宴上、舞會上、鄉間散步時。他對每個人都很有魅力，除了安。他對瑪麗那兩個年輕的小姑，路易莎和亨麗埃塔．默斯格羅夫，又特別有魅力，她們漂亮、活潑，一個十九歲、一個二十歲。大家都在猜他會娶哪一個。安坐在鋼琴前，彈琴讓大家跳舞，然後看著。","wistful"],
    ["Yet small things happened. Once, Mary’s little boy climbed onto Anne’s back and would not let go. Before she could say a word, someone lifted the child away. It was Captain Wentworth. He did not speak to her, and he did not look at her. Another day, on a long walk, Anne was tired. Without a word, he arranged for her to ride home in his sister’s carriage. He was still cold. But some part of him, she realized, still cared what happened to her.",
     "可是，還是有一些小事發生了。有一次，瑪麗的小兒子爬到安的背上，怎麼都不肯下來。她還來不及開口，就有人把孩子抱走了。是溫特沃斯上校。他沒跟她說話，也沒看她一眼。又有一天，大家走了很長的路，安累了。他一句話也沒說，就安排她坐他姊姊的馬車回家。他還是很冷淡。可是她發現，他心裡還有某個部分，依然在乎她過得好不好。","tender"],
    ["Anne learned to survive those evenings. She talked to the older people, helped Mary with the children and tried not to listen when Louisa laughed at something Wentworth said. Once, she heard him tell Louisa that he admired a woman with a firm mind, who did not let herself be persuaded by others. Anne understood exactly who he was thinking of, and she felt the words go straight into her heart.",
     "安學會了怎麼熬過那些晚上。她陪年長的人聊天，幫瑪麗照顧孩子，路易莎因為溫特沃斯說的話而笑的時候，她試著不去聽。有一次，她聽到他對路易莎說，他欣賞意志堅定的女人，不會輕易被別人說服。安完全明白他心裡想的是誰，那些話直直刺進了她的心。","sad"],
    ["Then a group of them went to see the sea at [[Lyme|c:n-lyme]], where a long stone wall called the Cobb curved out into the waves. Louisa loved to be noticed. She made Captain Wentworth catch her as she jumped down the steep steps of the Cobb. Then she ran up and jumped again, laughing. “I am determined I will!” This time she jumped too soon. He missed her. She fell to the stones and lay as still as death.",
     "後來，一群人去萊姆看海。那裡有一道叫「科布」的長長石堤，彎彎地伸進浪裡。路易莎很愛引人注意，她要溫特沃斯上校接住她，從科布陡峭的石階上跳下來。然後她又跑上去，笑著再跳一次：「我就是要跳！」這一次她跳得太早，他沒接住。她摔在石頭上，一動也不動，像死了一樣。","panicked"],
    ["Everyone screamed. Henrietta fainted. Mary held on to her husband and cried. Captain Wentworth knelt on the stones with Louisa in his arms and looked around wildly, as if for help. It was Anne who stayed calm. She told one man to run for a [[surgeon]], another to bring smelling salts, and she held Louisa’s head. Later, when Louisa had been carried to a house nearby and the doctor said she would live, Anne heard Wentworth say quietly to someone, “There is no one so capable as Anne.”",
     "每個人都在尖叫。亨麗埃塔昏倒了。瑪麗抓著她先生哭。溫特沃斯上校跪在石頭上，抱著路易莎，慌亂地四處張望，好像在找人幫忙。保持冷靜的，是安。她叫一個人跑去找外科醫生，叫另一個人去拿嗅鹽，自己扶著路易莎的頭。後來，路易莎被抬到附近的一間屋子裡，醫生說她會活下來。安聽到溫特沃斯對某人輕聲說：「沒有人比安更能幹了。」","panicked"],
    ["Louisa got better slowly. During her long weeks in bed, a quiet young naval officer, Captain Benwick, read poetry to her, and before anyone knew it, they were engaged. The news reached Anne in Bath. Captain Wentworth was free. And soon, he was in Bath too.",
     "路易莎慢慢康復。在她臥床的那幾個星期裡，一位安靜的年輕海軍軍官，本威克上校，唸詩給她聽，大家還來不及反應，他們就訂婚了。消息傳到巴斯的安那裡。溫特沃斯上校自由了。沒多久，他也來到了巴斯。","hopeful"],
    ["But in Bath, Anne had another admirer. Her cousin, Mr. William Elliot, would one day inherit her father’s title. He was handsome, polite and very interested in Anne. Everyone said what a perfect match it would be, Lady Russell most of all. Anne did not trust him. He was too smooth, too pleasant to everyone. At a concert, Wentworth came to speak to her, saw Mr. Elliot at her side and left early with a dark face. Anne could have cried. He was [[jealous]]. That meant he still cared.",
     "可是在巴斯，安有了另一個愛慕者。她的堂哥威廉．艾略特先生，將來會繼承她爸爸的爵位。他英俊、有禮貌，對安很感興趣。大家都說這是天作之合，羅素夫人說得最起勁。安不相信他。他太圓滑了，對每個人都太好了。在一場音樂會上，溫特沃斯過來找她說話，看到艾略特先生在她身邊，臉一沉就提早走了。安差點哭出來。他在吃醋。那表示，他還在乎。","hopeful"],
    ["Soon after, Anne learned the truth about her cousin from an old school friend, Mrs. Smith, who was poor, ill and living in two small rooms in Bath. Years before, Mr. Elliot had led Mrs. Smith’s husband into debt and then refused to help her when he died. He was charming only when it was useful. Anne was not surprised. She had never trusted a man who never lost his temper and never laughed too loud.",
     "沒多久，安從一位老同學史密斯太太那裡，知道了堂哥的真面目。史密斯太太又窮又病，住在巴斯兩間小小的房間裡。多年前，艾略特先生帶著她先生欠了一身債，等她先生過世，又拒絕幫助她。他只有在有利可圖的時候才迷人。安並不意外。她從來就不相信一個從不發脾氣、也從不放聲大笑的男人。","thoughtful"],
    ["A few days later, Anne sat in a busy hotel room, talking with Wentworth’s friend, Captain Harville. Wentworth sat at a desk nearby, writing a letter. Harville and Anne began to argue gently about whether men or women love longer. “All the privilege I claim for my own sex,” Anne said, and her voice shook a little, “is that of loving longest, when existence or when hope is gone.” At the desk, the scratching of a pen stopped.",
     "幾天後，安坐在一間熱鬧的旅館房間裡，跟溫特沃斯的朋友哈維爾上校聊天。溫特沃斯坐在附近的書桌前寫信。哈維爾和安開始溫和地爭論，到底是男人還是女人愛得比較長久。「我為我們女人所要求的唯一特權，」安說，聲音有一點發抖，「就是在生命或希望都已經消逝之後，還能愛得最久。」書桌那邊，沙沙的寫字聲停了。","tender"],
    ["Wentworth stood, took his gloves and left with Harville. But a moment later he came back into the room, “for his gloves,” he said. He [[slipped]] a folded letter onto the table in front of Anne, looked at her once with burning eyes and was gone.",
     "溫特沃斯站起來，拿了手套，跟哈維爾一起離開。可是過了一會兒，他又走回房間，說是「回來拿手套」。他把一封摺好的信悄悄放在安面前的桌上，用熾熱的眼神看了她一眼，然後就走了。","excited"],
    ["She opened it with shaking hands. “I can listen no longer in silence,” he had written. “I must speak to you by such means as are within my reach. You pierce my soul. I am half agony, half hope. Tell me not that I am too late, that such precious feelings are gone for ever. I offer myself to you again with a heart even more your own than when you almost broke it, eight years and a half ago… I have loved none but you.”",
     "她用顫抖的手打開信。「我再也無法沉默地聽下去了，」他寫道，「我只能用我還做得到的方式跟妳說話。妳刺穿了我的靈魂。我一半是痛苦，一半是希望。別告訴我已經太遲，別告訴我這麼珍貴的感情已經永遠消失。我再一次把自己交給妳，這顆心比八年半前、妳幾乎把它撕碎的時候，更加屬於妳……除了妳，我誰也沒愛過。」","tender"],
    ["Half an hour later, they walked together up a quiet street in Bath, slowly, as if they had all the time in the world. At last they had. They talked about everything that had happened in eight years, every misunderstanding, every lonely evening. This time, nobody could persuade Anne of anything. She already knew exactly what she wanted.",
     "半個小時後，他們一起走在巴斯一條安靜的街上，走得很慢，好像全世界的時間都是他們的。終於，真的是了。他們聊了八年來發生的每一件事，每一個誤會，每一個孤單的夜晚。這一次，沒有人能再說服安任何事了。她已經完全知道自己想要什麼。","warm"]
  ],
  quiz:[
    ["Why did Anne break her engagement eight years earlier?", ["She stopped loving Wentworth.","Lady Russell persuaded her it was unwise.","Wentworth married someone else."], 1, "她的教母羅素夫人說服她，嫁給沒錢的年輕軍官太冒險了。"],
    ["What did Wentworth say about Anne after Louisa’s fall?", ["That she was too quiet.","That there was no one so capable as Anne.","That she had changed too much."], 1, "安在意外中最冷靜能幹，他說：沒有人比安更能幹了。"],
    ["Why did Wentworth write the letter?", ["He heard Anne say women love longest, even when hope is gone.","Harville told him to.","He was leaving Bath forever."], 0, "他在一旁聽到安說女人愛得最久，終於忍不住寫信表白。"]
  ]
},

/* ---------------- 5 ---------------- */
{ id:"lostworld", thread:"", kind:"classic", title:"The Lost World", zt:"失落的世界", voice:"m",
  by:"Arthur Conan Doyle, 1912 · retold and shortened",
  intro:"一個想當英雄的年輕記者，一個脾氣火爆的教授，還有南美洲叢林深處一座與世隔絕的高原。高原上，恐龍還活著。",
  paras:[
    ["It all began because of a girl. Her name was Gladys, and I, [[Edward Malone|c:n-malone]], a young reporter for the Daily Gazette, was in love with her. One evening I finally told her. She shook her head kindly. “I could only love a man who did great things,” she said. “A man who faced danger and was not afraid.” So I walked straight to my newspaper office and asked my editor for the most dangerous job he had.",
     "一切都是因為一個女孩。她叫葛萊蒂絲，而我，愛德華．馬龍，《每日公報》的年輕記者，愛上了她。有一天晚上，我終於向她表白。她溫柔地搖搖頭。「我只會愛上做大事的男人，」她說，「一個面對危險也不害怕的男人。」所以我直接走回報社，向總編輯要他手上最危險的工作。","playful"],
    ["My editor sent me to interview [[Professor Challenger|c:n-challenger]]. “He has broken the noses of the last three reporters who visited him,” he said cheerfully. “Good luck.” The professor was short, with enormous shoulders, a huge black beard and a voice like a bull. Within ten minutes, he had thrown me out of his front door into the street. Then, to my surprise, he invited me back in and showed me something: a sketchbook made by a dead American artist in the jungles of South America. One picture showed a creature like a huge [[lizard]], as tall as a house.",
     "總編輯派我去訪問查林傑教授。「上一個、上上一個、上上上一個去找他的記者，鼻子都被他打斷了，」他開心地說，「祝你好運。」教授個子矮，肩膀卻寬得嚇人，留著一大把黑鬍子，聲音像一頭公牛。不到十分鐘，他就把我從前門丟到了街上。沒想到，他接著又請我進屋，給我看了一樣東西：一本素描本，是一個死在南美洲叢林裡的美國畫家畫的。其中一張圖畫著一種像巨大蜥蜴的生物，跟房子一樣高。","amused"],
    ["Challenger claimed that somewhere in the Amazon there was a high [[plateau]], cut off from the world by cliffs, where creatures from millions of years ago still lived. At a public meeting in London, the audience laughed at him. One scientist, Professor Summerlee, a thin, sharp old man, called it nonsense. Challenger roared that he would prove it. A [[committee]] was formed on the spot: Summerlee would go to check the facts, Lord John Roxton, a famous hunter, would go for the adventure, and I would go for the newspaper. I thought of Gladys and raised my hand first.",
     "查林傑宣稱，亞馬遜某個地方有一座高原，四周被懸崖圍住，與世隔絕，幾百萬年前的生物還活在上面。在倫敦的一場公開演講上，聽眾都在笑他。一位叫薩默李的教授，又瘦又尖酸的老人，說這全是胡說八道。查林傑大吼，說他會證明給大家看。現場馬上組成了一個委員會：薩默李去查證事實，有名的獵人洛克斯頓勳爵去冒險，而我代表報社去。我想到葛萊蒂絲，第一個舉起了手。","excited"],
    ["We sailed to Brazil and traveled for weeks up the great river and its smaller branches, through forests so thick that the sun hardly touched the water. Challenger joined us there, as loud as ever. At last, one morning, we saw it: a long line of red cliffs rising out of the green jungle, hundreds of feet high, and on top, trees we had never seen before. Summerlee was silent for a full minute. Then he said, “Well. Let us see what is up there.”",
     "我們坐船到巴西，沿著大河和它的小支流走了好幾個星期，穿過濃密到陽光幾乎照不到水面的森林。查林傑在那裡跟我們會合，還是一樣大嗓門。終於，某天早上，我們看到了：一長排紅色的懸崖從綠色叢林裡拔地而起，高好幾百英尺，懸崖頂上長著我們從來沒見過的樹。薩默李整整一分鐘沒說話。然後他說：「好吧，我們去看看上面有什麼。」","surprised"],
    ["There was no way up the cliffs. But beside them stood a single tall rock like a tower, and on its top grew a tree. We climbed the rock, cut down the tree, and it fell across the gap like a bridge. One by one, we crossed on hands and knees, with nothing below us but air. We were on the plateau. Then we heard a crash behind us. One of our guides, Gomez, who had secretly hated Lord John for years, had pushed our tree bridge into the [[gorge]]. He shouted that Lord John had killed his brother, and laughed. Lord John’s rifle cracked once, and Gomez was gone. But so was our bridge. We were trapped.",
     "懸崖根本爬不上去。可是懸崖旁邊有一根像塔一樣高的岩柱，柱頂長著一棵樹。我們爬上岩柱，把樹砍倒，樹就橫倒在缺口上，像一座橋。我們一個接一個，手腳並用地爬過去，底下什麼都沒有，只有空氣。我們上了高原。接著，背後傳來一聲巨響。我們的嚮導之一高梅茲，多年來一直暗中痛恨洛克斯頓勳爵，他把我們的樹橋推進了峽谷。他大喊洛克斯頓勳爵殺了他哥哥，接著大笑。洛克斯頓勳爵的步槍響了一聲，高梅茲不見了。可是我們的橋也沒了。我們被困住了。","panicked"],
    ["For a long time nobody spoke. Then Challenger rubbed his hands together. “Gentlemen,” he said, “we have the chance to study a new world. Let us not waste it complaining.” Even Summerlee had to admit that he was right. We made a camp, built a fence of thorns around it and started to explore.",
     "很長一段時間，沒有人說話。然後查林傑搓了搓手。「各位，」他說，「我們有機會研究一個全新的世界，別把時間浪費在抱怨上。」連薩默李都不得不承認他說得對。我們紮了營，在營地四周築了一圈荊棘籬笆，開始探險。","calm"],
    ["On the second day, we crept through the bushes and saw them: five huge creatures, gray and scaly, as big as elephants, walking on their back legs. Their front legs were short, and they were pulling leaves from the trees with their mouths. Summerlee gave a little cry. “[[Iguanodons|c:iguanodon]],” whispered Challenger, his eyes full of tears. “Summerlee, look at them. Do you still say I am a liar?” For once, Summerlee said nothing at all.",
     "第二天，我們悄悄穿過灌木叢，看見了牠們：五隻巨大的生物，灰色，身上長滿鱗片，跟大象一樣大，用後腿走路。牠們的前腿很短，正用嘴從樹上扯葉子吃。薩默李輕輕叫了一聲。「禽龍，」查林傑低聲說，眼裡含著淚水，「薩默李，你看牠們。你還說我是騙子嗎？」難得一次，薩默李什麼話都沒說。","surprised"],
    ["Not every creature was so gentle. In a swamp full of bones, we found a nest of [[pterodactyls|c:pterodactyl]], flying [[reptiles]] with leathery wings as wide as a bus. They smelled terrible and screamed like old doors, and one of them tore Challenger’s hat off his head. At night, something enormous walked around our thorn fence, breathing heavily. In the morning we saw its footprints, deep in the mud, longer than my arm. We kept the fire burning every night after that.",
     "不是每一種生物都這麼溫和。在一片堆滿骨頭的沼澤裡，我們發現了一窩翼手龍，一種飛行的爬蟲類，皮革般的翅膀張開來跟一輛公車一樣寬。牠們臭得要命，叫起來像生鏽的舊門，其中一隻還把查林傑的帽子從頭上扯走了。到了晚上，有個巨大的東西繞著我們的荊棘籬笆走，呼吸聲很重。早上，我們看到牠的腳印深深陷在泥裡，比我的手臂還長。從那以後，我們每天晚上都讓火燒著不熄。","nervous"],
    ["One night, I could not sleep, so I walked alone to a lake in the middle of the plateau. In the moonlight, I saw strange creatures drinking at the edge of the water and a long neck rising out of the lake like a snake. On the way back, I heard heavy steps behind me. Something huge was following me, hopping like a giant bird, with a toad-like face and terrible teeth. I ran faster than I had ever run in my life, fell into a deep pit that hunters had dug, and lay there in the dark until morning, listening to it breathe above me.",
     "有一天晚上，我睡不著，一個人走到高原中央的一座湖邊。月光下，我看到奇怪的生物在水邊喝水，還有一條長長的脖子像蛇一樣從湖裡伸出來。回來的路上，我聽到背後傳來沉重的腳步聲。有個巨大的東西在跟著我，像一隻巨鳥一樣跳著走，長著一張像蟾蜍的臉和可怕的牙齒。我跑得比這輩子任何時候都快，掉進一個獵人挖的深坑裡，在黑暗中躺到天亮，聽著牠在我頭頂上呼吸。","panicked"],
    ["I will not describe all our adventures here. There were ape-men in the trees who captured Summerlee and Challenger, and a terrible night when I was chased through the forest. There was a tribe of people who lived in caves on the plateau and who became our friends after we helped them. In the end, it was they who showed us a secret tunnel through the rock and a way down the cliffs. After months away, we were going home.",
     "我們所有的冒險，我就不在這裡一一描述了。樹上有猿人抓走了薩默李和查林傑，還有一個可怕的夜晚，我被追著跑過整座森林。高原上有一群住在山洞裡的人，在我們幫了他們以後，成了我們的朋友。最後，就是他們帶我們找到一條穿過岩石的秘密地道，還有一條下懸崖的路。離開好幾個月以後，我們終於要回家了。","hopeful"],
    ["In London, the great hall was packed for our report. Thousands of people had come, and many of them had come to laugh. Summerlee spoke first, and they listened politely. Then a man stood up in the crowd. “Photographs can be faked,” he shouted. “Where is your proof?” Others joined in. Soon the whole hall was shouting. Challenger stood quietly on the stage beside a large wooden box.",
     "回到倫敦，大禮堂擠滿了來聽我們報告的人。幾千人到場，其中很多人是來看笑話的。薩默李先上台，大家很有禮貌地聽著。然後，人群中有個男人站起來。「照片是可以造假的，」他大喊，「你們的證據在哪裡？」其他人也跟著喊。沒多久，整個禮堂都在吼叫。查林傑安靜地站在台上，身旁放著一個大木箱。","nervous"],
    ["“You want proof?” he said. He bent down and opened the box. For a moment nothing happened. Then something climbed out and sat on the edge of the box: a creature with a long, cruel beak, red eyes and wings folded like a dirty umbrella. It was a young pterodactyl. A woman screamed. The creature spread its wings, jumped into the air and flew in circles above the heads of the crowd. People fell over chairs. Someone fainted. The smell filled the hall.",
     "「你們要證據？」他說。他彎下腰，打開箱子。一開始什麼事都沒發生。然後，有個東西爬了出來，蹲在箱子邊上：一種長著又長又兇的嘴、紅色的眼睛、翅膀像一把髒雨傘一樣收著的生物。那是一隻年輕的翼手龍。一個女人尖叫起來。那隻生物張開翅膀，跳到空中，在群眾頭頂上一圈一圈地飛。有人被椅子絆倒，有人昏倒了。那股臭味充滿了整個禮堂。","excited"],
    ["Then it found an open window high in the wall and was gone into the London night. It was seen once or twice on London rooftops, flying southwest, and then never again. But nobody in that hall ever laughed at Professor Challenger again, either. The newspapers printed the story the next morning, and my name was on the front page. I bought flowers and ran all the way to Gladys’s house.",
     "然後，牠找到牆上高處一扇開著的窗戶，飛進倫敦的夜色裡，消失了。之後有人在倫敦的屋頂上看過牠一兩次，往西南方飛去，然後就再也沒出現了。不過，那天在禮堂裡的人，也再也沒有人敢笑查林傑教授了。隔天早上，報紙刊出了這個故事，我的名字登在頭版。我買了花，一路跑到葛萊蒂絲家。","triumphant"],
    ["She opened the door with a small, nervous man beside her. “Edward!” she said. “This is my husband, Mr. Potts. He works in a lawyer’s office.” I looked at Mr. Potts. He was short, quiet and very ordinary. “But Gladys,” I said, “you said you could only love a hero.” “Oh, Edward,” she laughed. “I meant someone who was brave enough to marry me.” I walked away, and I did not feel sad for long. Lord John was planning another expedition, and he had asked me to come.",
     "她打開門，身邊站著一個矮小、緊張兮兮的男人。「愛德華！」她說，「這是我先生，波茲先生。他在律師事務所上班。」我看著波茲先生。他又矮又安靜，非常普通。「可是葛萊蒂絲，」我說，「妳說過妳只會愛上英雄。」「喔，愛德華，」她笑著說，「我的意思是，有勇氣娶我的人呀。」我轉身離開，沒有難過太久。洛克斯頓勳爵正在計畫另一次探險，而且他邀我一起去。","amused"]
  ],
  quiz:[
    ["Why did Malone ask for a dangerous job?", ["He needed more money.","He wanted to impress Gladys, who said she could only love a hero.","Challenger asked him to come."], 1, "葛萊蒂絲說她只會愛上做大事、不怕危險的男人，所以他想當英雄。"],
    ["How did the explorers get trapped on the plateau?", ["A storm broke their boat.","Their guide Gomez pushed the tree bridge into the gorge.","They lost their map."], 1, "嚮導高梅茲痛恨洛克斯頓勳爵，把樹橋推下峽谷。"],
    ["What was Challenger’s proof at the meeting in London?", ["A photograph of an iguanodon.","A living young pterodactyl in a box.","A huge footprint."], 1, "他打開木箱，放出一隻活生生的小翼手龍，在禮堂裡飛。"]
  ]
},

/* ---------------- 6 ---------------- */
{ id:"lastdm", thread:"dnd", age:65, kind:"orig", title:"The Last Dungeon Master", zt:"最後的地下城主", voice:"f",
  by:"InkQuest original",
  intro:"林老師教了三十五年國文，退休後的日子安靜得有點太安靜。直到有一天，她的孫子哭喪著臉回家：「我們的地下城主要去讀大學了。我們的遊戲結束了。」",
  paras:[
    ["Every Saturday afternoon for two years, the noise had come from Hao’s bedroom: dice rattling on the desk, four boys shouting at once, and then a terrible silence while someone waited to see if a dragon would eat him. Lin Mei-yu, sixty-five, retired, sat in the living room of their apartment in [[Tainan|c:n-tainan]] with a cup of tea and listened. She did not understand the game. But she understood the sound of children who were completely happy.",
     "兩年來，每個星期六下午，噪音都從小豪的房間傳出來：骰子在書桌上嘩啦啦地滾，四個男孩同時大叫，接著是一陣可怕的沉默，有人在等著看自己會不會被龍吃掉。林美玉，六十五歲，已經退休，端著一杯茶坐在台南公寓的客廳裡聽著。她看不懂這個遊戲，可是她聽得懂，那是孩子們完全快樂時發出的聲音。","warm"],
    ["Then, one Saturday in August, there was no noise at all. Her grandson came out of his room with his shoulders down. “Ah-Kai is going to university in Taichung,” he said. “He was our [[dungeon master|c:dm]]. Nobody else knows how to run the game. So that’s it. Game over.” He dropped onto the sofa as if the dragon had finally eaten him.",
     "然後，八月的某個星期六，一點聲音都沒有。孫子垂著肩膀走出房間。「阿凱要去台中讀大學了，」他說，「他是我們的地下城主。沒有別人會帶這個遊戲。所以就這樣了，遊戲結束。」他倒在沙發上，好像那隻龍終於把他吃掉了。","sad"],
    ["“What does a dungeon master do?” Mei-yu asked. Hao explained, a little impatiently. The dungeon master tells the story. She describes the world, plays every monster and every shopkeeper, makes the rules fair and decides what happens when the players try something crazy. “Like a teacher,” said Mei-yu. “Like a [[narrator]].” “Kind of,” said Hao. “But fun.” She decided not to take that personally.",
     "「地下城主是做什麼的？」美玉問。小豪有點不耐煩地解釋：地下城主負責說故事。她描述整個世界，扮演每一隻怪物、每一個店老闆，讓規則公平，還要決定玩家做出瘋狂舉動時會發生什麼事。「就像老師嘛，」美玉說，「像說故事的人。」「有點像，」小豪說，「可是比較好玩。」她決定不要把這句話往心裡去。","amused"],
    ["That night, after Hao went to bed, Mei-yu put on her reading glasses and opened the thick rulebook he had left on the table. It was in English, full of tables and numbers, and her English was rusty, so she kept a dictionary open beside it. There were spells, monsters, maps and a whole page about what happens when you fall from a great height. She had spent thirty-five years teaching teenagers to love old Chinese poems. She had read harder books than this. At two in the morning, she was still reading, with a pencil in her hand and a list of questions.",
     "那天晚上，等小豪去睡了，美玉戴上老花眼鏡，翻開他留在桌上那本厚厚的規則書。書是英文的，滿滿的表格和數字，她的英文有點生疏了，所以旁邊一直攤著一本字典。書裡有法術、怪物、地圖，還有一整頁在講從高處摔下來會怎樣。她花了三十五年，教青少年愛上古典詩詞。比這更難的書，她都讀過。凌晨兩點，她還在讀，手裡拿著鉛筆，旁邊寫了一張問題清單。","curious"],
    ["The next Saturday, she knocked on Hao’s door. Three boys looked up from their phones. “I’ll be your dungeon master,” she said. There was a long, [[polite]] silence. One of the boys, Wei, coughed. “Grandma Lin,” he said carefully, “it’s quite complicated.” “So is the Book of Songs,” said Mei-yu, and she sat down at the head of the desk. “Roll your dice.”",
     "下一個星期六，她敲了敲小豪的房門。三個男孩從手機上抬起頭。「我來當你們的地下城主。」她說。一陣很長、很有禮貌的沉默。其中一個男孩，阿威，咳了一聲。「林奶奶，」他小心翼翼地說，「這個滿複雜的耶。」「《詩經》也很複雜啊。」美玉說，然後在書桌的主位坐下。「擲骰子吧。」","playful"],
    ["The first game was a disaster. She forgot rules. She looked things up in the book for five minutes at a time. When the boys’ characters walked into a village, she described it so slowly and so beautifully that one of them fell asleep. Hao was [[mortified]]. After the boys left, Mei-yu sat alone at the desk for a long time, looking at her notes. Then she made a new list. At the top, she wrote: Less poetry. More goblins.",
     "第一場遊戲是一場災難。她忘了規則，一查書就是五分鐘。男孩們的角色走進一座村莊時，她描述得又慢又美，結果有一個人睡著了。小豪丟臉死了。男孩們走後，美玉一個人在書桌前坐了很久，看著她的筆記。然後她寫了一張新的清單，最上面寫著：少一點詩，多一點哥布林。","amused"],
    ["The second game was better. By the fourth, something had changed. Mei-yu stopped reading the rules and started reading the boys. She had spent her whole life watching teenagers in classrooms, and she knew exactly when they were bored, when they were afraid and when they were secretly proud of themselves. She gave the shy boy, Chun, a mystery that only he could solve. She gave Wei, who never stopped talking, an [[innkeeper]] who talked even more than he did. She gave every monster a reason, and every reason a voice.",
     "第二場好一點了。到了第四場，有些事情變了。美玉不再讀規則，開始讀這些男孩。她一輩子都在教室裡觀察青少年，她完全知道他們什麼時候無聊、什麼時候害怕、什麼時候偷偷為自己驕傲。她給害羞的阿群一個只有他能解開的謎題。她給話多到停不下來的阿威，安排了一個比他更愛講話的旅店老闆。她讓每一隻怪物都有理由，每一個理由都有自己的聲音。","proud"],
    ["Her goblins had names and complaints. Her dragon was old and lonely and collected teacups. When a boy’s character died in a trap, she did not make him sit out. She made him a ghost who could only speak in riddles, and he had more fun than anyone. The boys started arriving early. They stopped looking at their phones. One Saturday, Wei’s mother called to ask why her son kept saying “By the beard of my grandmother!” at dinner.",
     "她的哥布林有名字，還會抱怨。她的龍又老又寂寞，喜歡收集茶杯。有個男孩的角色死在陷阱裡，她沒有讓他在旁邊乾坐著，而是讓他變成一個只能用謎語說話的鬼魂，結果他玩得比誰都開心。男孩們開始提早到，不再看手機。有一個星期六，阿威的媽媽打電話來問，為什麼她兒子吃晚飯時一直說「以我奶奶的鬍子發誓！」","playful"],
    ["One Saturday, the dragon that collected teacups finally met the players. The boys had planned to fight it. Instead, Chun’s character, the shy one, asked the dragon why it was so lonely. The whole table went quiet. Mei-yu looked at Chun over her glasses, and then, in the dragon’s deep, tired voice, she told them a long, sad story about a dragon who had outlived all its friends. When she finished, Wei whispered, “Can we take it home?” They did. The dragon joined the party.",
     "某個星期六，那隻收集茶杯的龍終於遇上了玩家。男孩們本來打算跟牠打一場。結果，害羞的阿群扮演的角色，開口問龍為什麼那麼寂寞。整張桌子都安靜了下來。美玉從老花眼鏡上方看了阿群一眼，然後用那隻龍低沉、疲憊的聲音，說了一個很長、很悲傷的故事：一隻龍活得比所有朋友都久。她說完以後，阿威小聲地說：「我們可以帶牠回家嗎？」他們真的帶了。那隻龍加入了隊伍。","tender"],
    ["Word spread. A girl from Hao’s class asked if she could join. Then her younger brother. Then, one day, Mr. Huang from the fourth floor, a retired bus driver of seventy, stood shyly at the door. “I used to play this,” he said, “a long time ago, with my son, when he was your age.” By December, there were nine players, two tables and a waiting list. They moved from Hao’s bedroom to the community room on the ground floor, which the building manager agreed to open every Saturday afternoon.",
     "消息傳開了。小豪班上一個女生問能不能加入。然後是她弟弟。然後，有一天，四樓的黃伯伯，一個七十歲的退休公車司機，很害羞地站在門口。「我以前玩過這個，」他說，「很久以前，我兒子跟你們一樣大的時候，我陪他玩過。」到了十二月，已經有九個玩家、兩張桌子，還有一張候補名單。他們從小豪的房間搬到一樓的社區活動室，管理員答應每個星期六下午都幫他們開門。","cheerful"],
    ["Mei-yu ran both tables. She was busier than she had been in years. She had a notebook full of maps, a box of dice from a shop in Taipei and a voice for every kind of monster. Her daughter-in-law said she looked ten years younger. Mei-yu thought that was probably an exaggeration. Five years, maybe.",
     "兩桌都由美玉帶。她比這幾年任何時候都忙。她有一本畫滿地圖的筆記本、一盒在台北買的骰子，還能為每一種怪物配上不同的聲音。她媳婦說她看起來年輕了十歲。美玉覺得這大概有點誇張。五歲吧，也許。","amused"],
    ["One evening, after everyone had gone, Hao helped her stack the chairs. He was quiet for a long time. Then he said, “Grandma, why do you do this? You didn’t even like games.” Mei-yu thought about it. “When I was teaching,” she said, “I told stories, and young people listened. When I [[retired]], the stories stopped. I didn’t know how much I missed it until that rulebook. A good story needs a table, and people around it.” Hao nodded. “You’re our last dungeon master,” he said. “Nobody could replace you.”",
     "某天晚上，大家都走了以後，小豪幫她把椅子疊起來。他安靜了很久，然後說：「阿嬤，妳為什麼要做這個？妳又不喜歡玩遊戲。」美玉想了想。「我教書的時候，」她說，「我說故事，年輕人聽。退休以後，故事就停了。在看到那本規則書以前，我都不知道自己有多想念這件事。一個好故事，需要一張桌子，還有一群圍在桌邊的人。」小豪點點頭。「妳是我們最後的地下城主，」他說，「沒有人可以取代妳。」","tender"],
    ["“Nonsense,” said Mei-yu. “Somebody will have to. I’m sixty-five, not immortal.” She took a thick notebook from her bag and put it in his hands. Inside were all her maps and notes, the lonely dragon and the goblins with complaints. “Next Saturday is my birthday,” she said. “I want a present. I want to play.”",
     "「胡說，」美玉說，「總得有人接手。我六十五歲，又不是長生不老。」她從包包裡拿出一本厚厚的筆記本，放到他手上。裡面是她所有的地圖和筆記，那隻寂寞的龍，還有那些愛抱怨的哥布林。「下星期六是我生日，」她說，「我想要一份禮物。我想當玩家。」","warm"],
    ["Hao stared at the notebook. Then at her. Then he smiled, slowly, the way his grandfather used to smile. That week, he stayed up late every night, reading, writing and drawing maps. On Saturday, the community room was full. There was a cake with sixty-six candles, which the building manager said was a fire risk. And at the head of the table, nervous and proud, sat a fourteen-year-old dungeon master.",
     "小豪盯著筆記本，再盯著她看。然後他慢慢地笑了，笑得就像他爺爺以前那樣。那個星期，他每天晚上都熬夜看書、寫筆記、畫地圖。星期六，社區活動室擠滿了人。有一個插著六十五根蠟燭的蛋糕，管理員說那有火災風險。在桌子的主位上，坐著一個又緊張又驕傲的十四歲地下城主。","proud"],
    ["Mei-yu’s character was an old wizard who had just retired from teaching at a school of magic. She was slow, forgetful and very dangerous. In the first fight, she rolled a twenty, the best roll there is, and the whole room cheered so loudly that a neighbor came down to complain. She laughed until she cried. She had been the last dungeon master, she thought. Now she was the first player of something new. And honestly, she liked it even better.",
     "美玉的角色是一個剛從魔法學校退休的老巫師，動作慢、記性差，而且非常危險。在第一場戰鬥裡，她擲出了二十點，那是最好的點數，整間活動室的人歡呼得太大聲，連鄰居都下樓來抗議。她笑到流眼淚。她心想，她曾經是他們最後的地下城主；現在，她是某個新故事的第一個玩家。而且說實話，她更喜歡這樣。","triumphant"]
  ],
  quiz:[
    ["Why did the boys think their game was over?", ["Hao’s parents said no more games.","Their dungeon master was leaving for university.","They lost their dice."], 1, "原本的地下城主阿凱要去台中讀大學，沒有人會帶遊戲。"],
    ["What did Mei-yu change after her first game went badly?", ["She bought new dice.","She used less poetry and more action, and learned to read her players.","She gave up."], 1, "她寫下「少一點詩，多一點哥布林」，並用教書時觀察學生的經驗來帶玩家。"],
    ["What birthday present did Mei-yu ask for?", ["A new rulebook.","A cake with sixty-six candles.","To play as a player while Hao became dungeon master."], 2, "她把筆記交給小豪，生日時想換她當玩家，讓孫子當地下城主。"]
  ]
},

{ id:"porto", thread:"love", kind:"orig", title:"The 7:42 to Porto", zt:"七點四十二分往波多", voice:"f",
  by:"InkQuest original",
  intro:"在里斯本做翻譯的怡婷，每個星期一都搭同一班火車去波多，坐同一個靠窗的位子。對面的位子上，總是坐著同一個男人，一路畫著窗外的風景，一句話也不說。",
  paras:[
    ["Every Monday morning, at 7:42, Yi-ting stepped onto the train to [[Porto|c:n-porto]] at Lisbon’s Oriente station with a coffee in one hand and a laptop bag in the other. Seat 42, carriage 3, by the window. She had chosen it in her first week because forty-two was the number of her grandmother’s house in Taichung. Three months later, she still chose it every time she booked. Some people collect stamps. Yi-ting collected small, private reasons for things.",
     "每個星期一早上七點四十二分，怡婷都會在里斯本的東方車站踏上開往波多的火車，一手拿著咖啡，一手提著筆電包。三號車廂，四十二號，靠窗。她第一個星期就選了這個位子，因為四十二是她阿嬤在台中的門牌號碼。三個月後，她每次訂票還是選這個位子。有些人收集郵票，怡婷收集的是一些小小的、只有自己知道的理由。","calm"],
    ["She was a translator. She turned Portuguese novels into Chinese for a publisher in Taipei, and every Monday she spent the day with an editor in Porto who helped her with the difficult words. The trip took almost three hours. She usually worked the whole way, with her headphones on and her dictionary open, while Portugal flew past the window like a film she had no time to watch.",
     "她是翻譯。她幫台北一家出版社把葡萄牙小說翻成中文，每個星期一都要花一整天，在波多跟一位編輯討論那些難翻的字。這段車程將近三個小時。她通常整路都在工作，戴著耳機，字典攤開，葡萄牙就在窗外飛快掠過，像一部她沒時間看的電影。","calm"],
    ["Seat 41, across the little table, belonged to a man with paint on his fingers. He was about thirty-five, with untidy dark hair and a gray sweater with a hole in one elbow. He never used a laptop. Instead, he opened a small [[sketchbook]] and drew what he saw through the window: a line of [[cork oaks|c:cork]], a white church on a hill, a heron standing in a rice field. When the train went too fast, he closed his eyes for a moment, as if he were remembering the view, and then drew it anyway.",
     "小桌子對面的四十一號，坐著一個手指上沾著顏料的男人。他大約三十五歲，一頭亂亂的黑髮，灰色毛衣的手肘破了一個洞。他從不用筆電，而是打開一本小小的素描本，把窗外看到的東西畫下來：一排軟木橡樹、山丘上的白色教堂、站在稻田裡的一隻蒼鷺。火車開太快的時候，他會閉上眼睛一下，好像在回想剛才的景色，然後還是把它畫出來。","gentle"],
    ["They never spoke. Lisbon people are polite, and so are people from Taichung. For twelve Mondays, they nodded “[[bom dia|c:bomdia]]” when they sat down and nodded again in Porto when they stood up. Yi-ting knew the shape of his hands and the sound of his pencil better than she knew the faces of her neighbors. She did not know his name.",
     "他們從來沒說過話。里斯本人很有禮貌，台中人也是。十二個星期一，他們坐下時點頭說一聲「早安」，到了波多站起來時再點一次頭。怡婷對他雙手的形狀和鉛筆的聲音，比對她鄰居的臉還熟悉。可是她不知道他叫什麼名字。","wistful"],
    ["On the thirteenth Monday, the train stopped in a field outside Coimbra and did not move. Ten minutes passed, then thirty. A voice announced, first in Portuguese and then in English, that there was a problem with the line ahead and that the [[delay]] would be at least an hour. The carriage filled with sighs. Yi-ting took off her headphones. The man across from her put down his pencil. For the first time, there was nothing to do but look at each other.",
     "第十三個星期一，火車停在科英布拉外的一片田野裡，就不動了。過了十分鐘，然後三十分鐘。廣播先用葡萄牙文、再用英文宣布，前方路段出了問題，至少會延誤一個小時。整節車廂都是嘆氣聲。怡婷拿下耳機。對面的男人放下鉛筆。第一次，他們除了看著對方，沒有別的事可以做。","curious"],
    ["“Well,” he said in English, with an embarrassed smile. “At last, a view that stays still.” His name was [[Tomás|c:n-tomas]]. He restored old [[tiles]], the blue-and-white [[azulejos|c:azulejo]] that cover half the buildings in Portugal. For a year he had been working in Porto, at [[São Bento|c:n-saobento]] station, where about twenty thousand tiles on the walls tell the history of the country in pictures. Some of them were cracked, some were missing, and he was replacing them, one by one, painted by hand.",
     "「嗯，」他用英文說，不好意思地笑了笑，「終於有一片不會跑掉的風景了。」他叫托馬斯，是修復老磁磚的師傅，修的是葡萄牙一半建築上都貼著的那種藍白色花磚「azulejo」。這一年來，他都在波多的聖本篤車站工作。那裡的牆上大約有兩萬片磁磚，用圖畫講述這個國家的歷史。有些裂了，有些不見了，他正一片一片地用手繪的新磁磚把它們補回去。","warm"],
    ["“And you?” he asked. “You always look as if you are fighting with your computer.” She laughed and explained. She told him about the book she was translating, about a sentence she had been stuck on for a week. It was a sentence about the sea, and there was a Portuguese word in it, [[saudade|c:saudade]], that had no word in Chinese. “It means missing something,” she said, “but it’s more than that. It’s missing something that maybe never comes back, and loving the missing.” Tomás nodded slowly. “That’s the most Portuguese word there is.”",
     "「那妳呢？」他問，「妳看起來總像在跟電腦吵架。」她笑了，跟他解釋。她說起她正在翻譯的書，說起一個她卡了一個星期的句子。那是一個關於大海的句子，裡面有一個葡萄牙字「saudade」，中文裡找不到對應的詞。「它的意思是想念，」她說，「可是不只這樣。它是想念某個也許再也不會回來的東西，而且連那份想念都一起愛著。」托馬斯慢慢點頭。「那是最葡萄牙的一個字了。」","thoughtful"],
    ["The train did not move for two hours. They talked about everything: her grandmother’s house with the number forty-two, his grandmother’s kitchen in the Alentejo, the best custard tarts in Lisbon, which they disagreed about completely. He showed her his sketchbook. It was full of the view from seat 41. Then she noticed that on many pages, in the corner, there was a small figure by the window with headphones and a coffee cup. She looked up. He had turned bright red.",
     "火車兩個小時都沒動。他們什麼都聊：她阿嬤那棟門牌四十二號的房子、他阿嬤在阿連特茹的廚房、里斯本最好吃的蛋塔是哪一家（他們的意見完全不同）。他給她看他的素描本，裡面畫滿了從四十一號看出去的風景。然後她發現，很多頁的角落，都有一個小小的人坐在窗邊，戴著耳機，拿著一杯咖啡。她抬起頭。他的臉已經紅透了。","tender"],
    ["“I didn’t think you would ever look,” he said. “You were always working.” Yi-ting did not know what to say. So she said the honest thing. “I looked every week,” she said. “I just pretended not to.” Outside, the train finally began to move. Neither of them noticed.",
     "「我以為妳永遠不會看，」他說，「妳總是在工作。」怡婷不知道該說什麼，所以她說了實話。「我每個星期都在看，」她說，「只是假裝沒有。」窗外，火車終於開始動了。他們兩個都沒有注意到。","tender"],
    ["After that, Mondays changed. She still worked on the train, but only for the first hour. In the second hour, they talked. In the third, they watched the view together while he drew it, and she tried to find Chinese words for the colors. Some Mondays, after work, she went to São Bento and watched him on his ladder in the great hall, painting a missing piece of a battle scene, while tourists took photos of the walls and never noticed the man fixing them.",
     "從那以後，星期一變了。她在火車上還是會工作，但只做第一個小時。第二個小時，他們聊天。第三個小時，他們一起看窗外的風景，他畫，她試著幫那些顏色找中文的詞。有些星期一下班後，她會到聖本篤車站，看他在大廳裡站在梯子上，補畫一幅戰爭場景裡缺掉的一塊，觀光客對著牆壁拍照，從來沒有人注意到那個正在修補它們的人。","warm"],
    ["In March, he took her to the great hall of São Bento early one morning, before the tourists came. He showed her the tiles he had painted himself. They looked exactly like the old ones, except for one small thing. In a corner of a crowded market scene, if you knew where to look, there was a tiny woman by a window, with headphones and a cup of coffee. “Nobody will notice,” he said. “For a hundred years, maybe.” Yi-ting noticed. She thought about it for days.",
     "三月的某個清晨，觀光客還沒來之前，他帶她到聖本篤車站的大廳，給她看他親手畫的磁磚。它們看起來跟舊的一模一樣，只有一個小地方不同：在一幅熱鬧的市集場景角落，如果你知道該看哪裡，會發現一個小小的女人坐在窗邊，戴著耳機，拿著一杯咖啡。「不會有人注意到的，」他說，「大概一百年都不會。」怡婷注意到了。她想了好幾天。","tender"],
    ["Then, in May, an email came from Taipei. The publisher wanted her back in the office, starting in September. It was a good job, a better job, and her mother was getting older. Yi-ting read it on the train on Monday and closed her laptop without answering. Tomás looked at her face. “Saudade,” he said quietly. It was not a question.",
     "然後，五月，台北來了一封 email。出版社希望她九月起回辦公室上班。那是一份好工作，更好的工作，而且她媽媽年紀也越來越大了。星期一，怡婷在火車上讀了那封信，沒有回覆就闔上了筆電。托馬斯看著她的臉。「Saudade。」他輕聲說。那不是一個問句。","sad"],
    ["She did not decide that day, or that week. They did not talk about it. They talked about tiles and words and the heron in the rice field, which had started to appear every Monday as if it had booked a seat. In the end, she said yes to Taipei. And on her last Monday in August, Tomás did not take out his sketchbook. Instead, he put a small package wrapped in newspaper on the table between them.",
     "她那天沒有決定，那個星期也沒有。他們沒有談這件事。他們聊磁磚、聊字詞、聊稻田裡那隻蒼鷺，牠開始每個星期一都出現，好像也訂了位子似的。最後，她答應了台北。到了八月她最後一個星期一，托馬斯沒有拿出素描本。他把一個用報紙包著的小包裹，放在他們之間的小桌上。","nervous"],
    ["Inside was a single blue-and-white tile. He had painted it himself: a train window, a field, a white church on a hill and, in the corner, a heron. Underneath, in small, careful Chinese characters that he must have practiced for weeks, it said: 四十二號. Seat 42. “So you have the view in Taipei,” he said. “Tiles last for hundreds of years. Longer than saudade.”",
     "裡面是一片藍白色的磁磚，他自己畫的：一扇火車的窗、一片田野、山丘上的白色教堂，角落裡還有一隻蒼鷺。底下用小小的、很用心的中文字寫著：四十二號。他一定練習了好幾個星期。「這樣妳在台北也看得到這片風景，」他說，「磁磚可以保存好幾百年，比 saudade 還久。」","tender"],
    ["Yi-ting held the tile in both hands for a long time. Then she took a pen from her bag, opened his sketchbook to a clean page and wrote, in Portuguese, the first sentence she had ever written for herself and not for a book: “Come to Taipei in December. I’ll save you the window seat.” Tomás read it twice. Then he laughed, the way people laugh when something has been lifted off them. Outside, the heron opened its wings and followed the train for a little while, as if it wanted to see the end of the story too.",
     "怡婷用雙手捧著那片磁磚，捧了很久。然後她從包包裡拿出一支筆，把他的素描本翻到空白的一頁，用葡萄牙文寫下了第一個不是為了書、而是為了自己寫的句子：「十二月來台北吧。我幫你留靠窗的位子。」托馬斯讀了兩遍。然後他笑了，像一個人肩上的重擔突然被拿走時那樣笑。窗外，那隻蒼鷺張開翅膀，跟著火車飛了一小段，好像牠也想看看這個故事的結局。","hopeful"]
  ],
  quiz:[
    ["Why did Yi-ting always choose seat 42?", ["It was the cheapest seat.","It was the number of her grandmother’s house in Taichung.","Tomás asked her to sit there."], 1, "四十二是她阿嬤在台中的門牌號碼，是她自己的小小理由。"],
    ["What made Yi-ting and Tomás finally talk?", ["He spilled her coffee.","The train stopped for two hours outside Coimbra.","They met at São Bento station."], 1, "火車在科英布拉外停了兩個小時，他們第一次除了看對方沒別的事可做。"],
    ["What did Yi-ting write in Tomás’s sketchbook at the end?", ["Goodbye forever.","An invitation to visit her in Taipei.","A translation of saudade."], 1, "她已經決定回台北工作，用葡萄牙文邀請他十二月來台北，還說會幫他留靠窗的位子。"]
  ]
},

/* ---------------- 8 ---------------- */
{ id:"lastlight", thread:"static", kind:"orig", title:"The Static: Last Light", zt:"雜訊：最後的光", voice:"f",
  by:"InkQuest original",
  intro:"高雄三部曲完結篇。沒有月亮的晚上，四個朋友帶著海燕阿嬤的先生留下的灰色收音機，爬上旗津的燈塔。燈塔九點關門。他們只有一個半小時。",
  paras:[
    ["Nineteen days is a long time to wait for a moon to disappear. I counted every one of them in my notebook. Tammy spent them taking the gray radio apart on her bedroom floor and putting it back together. Bo spent them asking his grandma questions. Jerry spent them telling everyone at school that he was not scared, which is how we knew he was.",
     "等月亮消失，十九天是很長的時間。我在筆記本裡一天一天地數。譚美把那十九天花在她房間的地板上，把灰色收音機拆開，再裝回去。阿柏把那十九天花在問他阿嬤問題上。傑瑞則把那十九天花在跟學校裡每個人說他不怕，我們就是這樣知道他其實很怕。","playful"],
    ["On the twelfth day, Tammy called us at midnight. “It isn’t just a radio,” she said. “It’s a [[transceiver|c:transceiver]]. There’s a button on the side, under a piece of tape. It can send, not just receive. You can talk back.” Nobody said anything for a long time. Then Jerry said, very quietly, “Talk back to who?”",
     "第十二天，譚美半夜打電話給我們。「它不只是收音機，」她說，「它是無線電收發機。側邊有一個按鈕，用膠帶貼住了。它不只能收，還能發。你可以回話。」很長一段時間，沒有人說話。然後傑瑞非常小聲地說：「回話給誰？」","nervous"],
    ["Bo’s grandma had answers, but not the ones we expected. She had known Hai-yan’s husband for forty years. “Old Lin, the radio man,” she said in Taiwanese, and Bo translated. “On nights with no moon, he used to climb the hill to the [[lighthouse|c:lighthouse]] with a radio in his arms. He said the signals were clearer up there. My husband asked him once what he listened to. He just smiled and said, ‘Children.’ We all thought he meant the ships.”",
     "阿柏的阿嬤有答案，可是跟我們想的不一樣。她認識海燕阿嬤的先生四十年了。「收音機林仔，」她用台語說，阿柏幫我們翻譯，「沒有月亮的晚上，他常常抱著一台收音機爬上燈塔那座山。他說上面的訊號比較清楚。我先生有一次問他在聽什麼，他只是笑一笑說：『囡仔。』我們都以為他講的是船。」","thoughtful"],
    ["The new moon fell on a Friday. After school, at half past six, we took the ferry across the harbor. Bo was waiting at the Cijin pier with the radio in his backpack. The sky over Kaohsiung was turning from orange to purple, and the city lights were coming on one by one behind us. We walked past the temple and the seafood restaurants of the old street and started up the path to the lighthouse. It was steeper than it looked. Jerry complained the whole way, which helped.",
     "新月落在一個星期五。放學後，六點半，我們搭渡輪過港。阿柏在旗津碼頭等我們，收音機放在他的背包裡。高雄上空的天色從橘色變成紫色，背後的城市燈火一盞一盞亮起來。我們走過廟口和老街上的海產店，開始爬往燈塔的步道。坡比看起來陡。傑瑞一路都在抱怨，這反而讓大家輕鬆了一點。","calm"],
    ["We reached the top at half past seven. The lighthouse stood white against the dark sky, eight-sided, with a black roof and a round glass room on top where the great lamp turned. It was more than a hundred years old. Inside the courtyard, people were drinking coffee and taking photos of the harbor. A staff member smiled at us. “We close at nine,” she said. “Don’t miss the last view.” I wrote 9:00 in my notebook and underlined it twice.",
     "我們七點半到了山頂。燈塔白白地立在黑色的天空下，八角形，黑色的屋頂，頂端是一個圓形的玻璃燈室，巨大的燈在裡面轉著。它已經超過一百歲了。庭院裡，有人在喝咖啡，有人在拍港口的照片。一位工作人員對我們笑了笑。「我們九點關門，」她說，「別錯過最後的風景。」我在筆記本上寫下 9:00，劃了兩條線。","curious"],
    ["We sat on the low wall near the old [[sundial]], facing the sea. There was no moon at all, only the ships’ lights far out on the water and, every few seconds, the beam of the lighthouse sweeping over our heads like a slow white hand. Tammy put the radio on her knees and turned it on. The hiss came, the same long shhhhhh we had heard on the night of the static. Eight o’clock passed. Then eight-thirty. People began to leave. Nothing happened.",
     "我們坐在古老日晷旁邊的矮牆上，面向大海。天上一點月亮都沒有，只有遠方海面上船隻的燈光，還有每隔幾秒，燈塔的光束就像一隻緩慢的白色大手，從我們頭頂掃過。譚美把收音機放在膝蓋上，打開。嘶嘶聲出現了，就是雜訊那晚那個長長的沙沙聲。八點過了，八點半也過了。人們開始離開。什麼事都沒發生。","nervous"],
    ["At 8:41, as the beam passed over us, the hiss changed. A man’s voice came through, clear and close, as if he were sitting on the wall beside us. He spoke in Taiwanese. Bo grabbed my arm. “He says, ‘Is anyone there? This is Lin on Cijin Hill. The lighthouse is behind me. I keep hearing children on this frequency. Four of them. Are you there?’” Bo’s voice shook. “And he says the date. He says it’s 1986.”",
     "八點四十一分，光束從我們頭上掃過的時候，嘶嘶聲變了。一個男人的聲音傳了出來，清楚又靠近，好像他就坐在我們旁邊的矮牆上。他說的是台語。阿柏抓住我的手臂。「他說：『有人在嗎？我是旗後山上的林仔，燈塔就在我後面。我一直在這個頻率上聽到囡仔的聲音，四個。你們在嗎？』」阿柏的聲音在發抖。「然後他說了日期。他說現在是 1986 年。」","surprised"],
    ["This was not a recording. It was a conversation. Tammy looked at the tape on the side of the radio. Then she looked at us. I nodded. She peeled off the tape and pressed the button, and Bo leaned toward the radio and said, in his grandma’s Taiwanese, the bravest thing I have ever heard anyone say: “Yes, Uncle Lin. We’re here. We heard you.”",
     "這不是錄音，這是一場對話。譚美看著收音機側邊的膠帶，然後看著我們。我點點頭。她撕下膠帶，按下按鈕，阿柏湊近收音機，用他阿嬤的台語，說了我聽過最勇敢的一句話：「有，林伯伯。我們在這裡。我們聽到你了。」","tender"],
    ["The voice laughed, a surprised, happy laugh, and asked who we were. We told him everything, with Bo translating as fast as he could. We told him about the static at 3:33 and the Morse code under it. We told him about the blue door and the envelope, about a white bridge across the harbor that turned like the hand of a clock, a bridge that would not be built for another thirty-four years. The radio was quiet for a long time. Then he said, “So that is how I find you. I wondered.”",
     "那個聲音笑了，又驚訝又開心地笑了，問我們是誰。我們把一切都告訴他，阿柏拚命地翻譯。我們跟他說了三點三十三分的雜訊，還有雜訊底下的摩斯密碼。我們跟他說了藍色的門和信封，說了一座白色的橋，橫跨港口，轉起來像時鐘的指針，那座橋再過三十四年才會蓋好。收音機安靜了很久。然後他說：「原來是這樣找到你們的。我一直在想。」","excited"],
    ["Tammy understood first. She grabbed my notebook and wrote it all down for him in big letters, and Bo read it out to him slowly: the time, 3:33 in the morning; the message, BLUE DOOR. 3 PM. SAT. Then he described the drawing of the bridge with the moon and the stars. “He has to send it,” Tammy whispered. “Don’t you see? We heard it because he sent it. And he sends it because we told him. It’s a circle.” Jerry put his head in his hands. “My brain hurts,” he said. But he was smiling.",
     "譚美最先想通。她搶過我的筆記本，用大大的字把所有東西寫下來，阿柏慢慢念給他聽：時間，凌晨三點三十三分；訊息，BLUE DOOR. 3 PM. SAT.。接著，他又描述了那張畫著月亮和星星的橋。「他得把它發出去，」譚美小聲說，「你們不懂嗎？我們聽到它，是因為他發了它；而他會發它，是因為我們告訴了他。這是一個圓。」傑瑞抱著頭。「我的腦袋好痛。」他說。可是他在笑。","excited"],
    ["Then I asked the question I had been carrying for nineteen days. “Uncle Lin, why didn’t you just tell Hai-yan yourself? About the fish soup?” Bo translated. For a moment there was only static. Then the voice came back, softer. “Because I am a man who fixes radios,” he said. “I can make any machine speak. But I could never make myself say the things that mattered. So I asked four children to carry them for me. Is she well?” “She’s well,” said Bo. “She laughed and cried. She says you were a good listener.”",
     "然後，我問了那個放在心裡十九天的問題。「林伯伯，你為什麼不自己跟海燕阿嬤說？魚湯的事？」阿柏翻譯了。有那麼一下子，只剩下雜訊。然後那個聲音回來了，更輕了。「因為我是修收音機的，」他說，「我可以讓任何機器說話，可是我從來沒辦法讓自己說出重要的話。所以我拜託四個囡仔幫我帶話。她好嗎？」「她很好，」阿柏說，「她又笑又哭。她說你很會聽。」","tender"],
    ["Behind us, a voice called, “We’re closing now!” It was 8:58. The lighthouse beam swept over us once more, and the signal began to [[fade]]. Through the hiss, we heard him say one more thing, slowly, so that Bo could catch every word. Bo translated it with tears on his face: “Thank you for listening. Now go home, and listen to each other. Don’t wait forty years to say the good things.” Then there was only static, and then not even that.",
     "後面有人喊：「我們要關門囉！」八點五十八分。燈塔的光束又從我們頭上掃過一次，訊號開始變弱。在嘶嘶聲中，我們聽到他又說了一句話，說得很慢，好讓阿柏每個字都聽得清楚。阿柏滿臉是淚地翻譯：「謝謝你們願意聽。現在回家吧，好好聽彼此說話。好聽的話，不要等四十年才說。」然後就只剩下雜訊，然後連雜訊都沒有了。","sad"],
    ["We walked down the hill in the dark without talking. At the bottom, Jerry stopped. “Hey,” he said, and his voice was strange. “I just want to say… you guys are the best friends I’ve ever had. That’s all. I’m not waiting forty years.” Tammy hugged him so hard that his glasses fell off. Bo put his huge arms around all of us at once. I cried a little. I’m the dungeon master, so I’m allowed.",
     "我們在黑暗中走下山，誰也沒說話。到了山腳，傑瑞停了下來。「欸，」他說，聲音怪怪的，「我只是想說……你們是我這輩子最好的朋友。就這樣。我才不要等四十年。」譚美用力抱住他，他的眼鏡都掉了。阿柏張開他粗壯的手臂，一次把我們全部抱住。我哭了一點點。我是地下城主，我可以哭。","warm"],
    ["The next day, we took the ferry back to the blue door and told Hai-yan everything. She listened without saying a word. When we finished, she went into the kitchen. Twenty minutes later, she came out with four bowls of fish soup. “He used to come home from that hill on nights with no moon,” she said, “smiling like a boy, and he never told me why.” She sat down with us. “Eat. It’s perfect. I have it on good authority.”",
     "隔天，我們搭渡輪回到那扇藍色的門，把一切都告訴海燕阿嬤。她聽著，一句話也沒說。我們講完以後，她走進廚房。二十分鐘後，她端出四碗魚湯。「沒有月亮的晚上，他常從那座山上回家，」她說，「笑得像個小男孩，可是從來不跟我說為什麼。」她跟我們一起坐下來。「吃吧。很好喝的。這可是有人掛保證的。」","warm"],
    ["That night, I opened my notebook to a new page and wrote at the top: THE STATIC. THE END. Then I crossed out THE END. On Wednesday, after school, four friends sat down in Room 404 for a new campaign. Tammy’s new character was a wizard who could talk to anything through a crystal radio. Jerry’s bard finally learned to sing in tune. And Bo, the barbarian, said “thank you” to every monster before he fought it, because, he said, you never know who’s listening.",
     "那天晚上，我在筆記本上翻開新的一頁，最上面寫著：雜訊。完。然後我把「完」劃掉了。星期三放學後，四個朋友在 404 教室坐下來，開始一場新的冒險。譚美的新角色是一個能用水晶收音機跟任何東西說話的巫師。傑瑞的吟遊詩人終於學會唱歌不走音了。而阿柏，那個野蠻人，每次跟怪物打架前都會先說一聲「謝謝」，因為他說，你永遠不知道誰在聽。","hopeful"]
  ],
  quiz:[
    ["What did Tammy discover about the gray radio?", ["It was broken.","It could send messages as well as receive them.","It was made in 1986."], 1, "它是無線電收發機，側邊用膠帶貼住的按鈕可以讓人回話。"],
    ["Why did the four friends hear the static at 3:33 in the first place?", ["Old Lin sent it because the friends told him to on the lighthouse night.","A ship was sending signals.","Tammy sent it as a joke."], 0, "是一個圓：他們在燈塔上告訴 1986 年的林伯伯時間和訊息，他才把雜訊發出去。"],
    ["What was Old Lin’s last message to the four friends?", ["Fix more radios.","Listen to each other, and don’t wait forty years to say the good things.","Never come back to the lighthouse."], 1, "他要他們回家好好聽彼此說話，好聽的話不要等四十年才說。"]
  ]
},

/* ---------------- 9 ---------------- */
{ id:"lisbon", thread:"", kind:"guide", title:"Lisbon on Foot", zt:"用雙腳走里斯本", voice:"m",
  by:"InkQuest travel guide",
  intro:"里斯本蓋在七座山丘上，路是石頭鋪的，又陡又滑。最好的看法，就是穿一雙好鞋，慢慢走。這份指南帶你走老城的巷弄、看得到整座城的觀景台，還有一家從 1837 年賣到現在的蛋塔店。",
  paras:[
    ["Lisbon is a city built on seven hills, and you will feel every one of them in your legs. Taxis are cheap and the famous yellow trams are charming, but the best way to understand Lisbon is to walk it, slowly, with a lot of stops for coffee. So before anything else, a word about shoes. Lisbon’s sidewalks are covered in [[calçada|c:calcada]], small white and black stones laid by hand in patterns of waves, stars and ships. They are beautiful, and they are as slippery as ice when it rains. Leave the fashionable shoes at home.",
     "里斯本是一座蓋在七座山丘上的城市，你的腿會感受到每一座。計程車很便宜，有名的黃色電車也很迷人，可是要真正懂里斯本，最好的方法是用走的，慢慢走，常常停下來喝杯咖啡。所以，在一切開始之前，先說鞋子。里斯本的人行道鋪著「calçada」，一顆顆小小的黑白石頭，用手工排成波浪、星星和船的圖案。它們很美，可是一下雨就滑得像冰。好看但不好走的鞋子，就留在家裡吧。","informative"],
    ["Start where the city starts: in [[Alfama|c:n-alfama]], the oldest neighborhood in Lisbon. On November 1, 1755, a terrible [[earthquake]], followed by a tsunami and fires, destroyed much of the city. Alfama, built on solid rock, survived better than most. That is why it still looks the way it did centuries ago, a maze of narrow streets, steep stairs and tiny squares, with laundry hanging between the windows and old women watching the world from their doorsteps.",
     "從這座城市的起點開始：阿爾法瑪，里斯本最古老的街區。1755 年 11 月 1 日，一場可怕的大地震，接著是海嘯和大火，摧毀了這座城市的大部分。阿爾法瑪蓋在堅硬的岩盤上，撐得比大多數地方好。所以它到現在看起來還是幾百年前的樣子：窄窄的街道、陡陡的階梯、小小的廣場組成的迷宮，窗戶之間晾著衣服，老太太坐在門口看著來來往往的世界。","informative"],
    ["Don’t try to follow a map in Alfama. You will get lost, and that is the point. Every wrong turn leads to a staircase, a cat on a wall or a view of the river between two houses. If you visit in June, especially around the twelfth and thirteenth, the whole neighborhood turns into a street party for the city’s favorite saint, Saint Anthony, with music, paper decorations and the smell of grilled sardines everywhere.",
     "在阿爾法瑪不要試著照地圖走。你一定會迷路，而迷路正是重點。每一個轉錯的彎，都會通到一段階梯、一隻趴在牆上的貓，或是兩棟房子之間露出的一片河景。如果你六月來，特別是十二、十三日前後，整個街區會變成一場慶祝城市最愛的聖人聖安東尼的街頭派對，到處都是音樂、紙做的裝飾，還有烤沙丁魚的香味。","cheerful"],
    ["Lisbon’s hills give it something special: [[viewpoints|viewpoint]], which the Portuguese call [[miradouros|c:miradouro]]. Near the top of Alfama, the Miradouro de Santa Luzia has blue-and-white tiles, flowers climbing over the walls and red roofs falling all the way down to the river. Climb higher, to the Miradouro da Senhora do Monte, and you will see almost the whole city at once: the castle, the river, the long red bridge and, if you are lucky, a golden sunset over all of it. Bring water. The climb is worth it, but it is still a climb.",
     "里斯本的山丘給了它一樣特別的東西：觀景台，葡萄牙人叫它「miradouro」。在阿爾法瑪接近山頂的地方，聖露西亞觀景台有藍白色的磁磚、爬滿牆的花，還有一路往下延伸到河邊的紅色屋頂。再往上爬，到山聖母觀景台，你幾乎可以一次看到整座城市：城堡、河、長長的紅色大橋，運氣好的話，還有灑在這一切上面的金色夕陽。記得帶水。爬上去很值得，但還是要爬。","warm"],
    ["That long red bridge, by the way, looks a lot like the Golden Gate Bridge in San Francisco, and many visitors think it was built by the same people. It was not, though an American company did build it. It opened in 1966 and is now called the 25 de Abril Bridge, after the day in 1974 when a peaceful revolution ended almost fifty years of [[dictatorship]] in Portugal. People put red carnations into the soldiers’ guns, and the day became known as the Carnation Revolution.",
     "順帶一提，那座長長的紅色大橋，看起來很像舊金山的金門大橋，很多遊客以為是同一批人蓋的。其實不是，雖然蓋它的確實是一家美國公司。它在 1966 年通車，現在叫做「四二五大橋」，名字來自 1974 年的那一天：一場和平的革命，結束了葡萄牙將近五十年的獨裁統治。人們把紅色康乃馨插進士兵的槍管裡，那一天後來被稱為「康乃馨革命」。","informative"],
    ["Down by the river, the Baixa, or downtown, looks completely different. After the earthquake, the Marquis of Pombal rebuilt it with straight streets in a neat grid, one of the first cities in Europe planned to survive the next earthquake. Walk under the great arch of Rua Augusta into Praça do Comércio, a huge yellow square that opens onto the river. Ships once unloaded gold and spices here. Today, people sit on the steps by the water and watch the light change.",
     "往下走到河邊，下城區看起來完全不一樣。地震以後，彭巴爾侯爵用整整齊齊的棋盤式直街重建了這裡，這是歐洲最早為了「撐過下一次地震」而規劃的城市之一。穿過奧古斯塔街的大拱門，走進商業廣場，一個面對河的巨大黃色廣場。以前，船隻在這裡卸下黃金和香料。現在，人們坐在水邊的階梯上，看著光線變化。","informative"],
    ["Between the Baixa and the hill above it stands the strangest thing in Lisbon: the Elevador de Santa Justa, an iron tower with a lift inside, built in 1902 to carry people up the hill. It looks like something from an old science-fiction novel. The queue can be very long. Here’s a secret: you can walk up the streets behind it in ten minutes and reach the viewing platform at the top for much less money.",
     "在下城區和上方山丘之間，立著里斯本最奇特的東西：聖胡斯塔升降機，一座裡面裝著電梯的鐵塔，1902 年建成，用來把人載上山丘。它看起來像從老科幻小說裡走出來的東西。排隊的人可能非常多。告訴你一個秘密：從它後面的街道往上走，十分鐘就到了，還能用便宜很多的價錢登上頂端的觀景平台。","playful"],
    ["About the trams. Tram 28 is the most famous ride in Lisbon, an old yellow wooden tram that rattles up and down the hills through Alfama and Graça. It is wonderful, and it is also packed with tourists from morning to night, and a favorite place for [[pickpockets]]. If you want to ride it, go early in the morning and keep your bag in front of you. Or do what the locals do and walk the same route. You will see more, and the tram will still pass you on the hill, ringing its bell.",
     "關於電車。28 號電車是里斯本最有名的一條線，一台老式的黃色木頭電車，喀啦喀啦地在阿爾法瑪和格拉薩的山坡上爬上爬下。它很棒，可是也從早到晚擠滿了觀光客，是扒手最愛的地方。如果你想搭，一大早去，把包包背在前面。或者，像當地人一樣，沿著同一條路線用走的。你會看到更多，而且電車還是會在山坡上從你旁邊經過，叮叮噹噹地按著鈴。","informative"],
    ["Now, food. Take a tram or a train west along the river to [[Belém|c:n-belem]]. There, since 1837, a bakery called Pastéis de Belém has been selling custard tarts made from a secret recipe that came from the monks of the monastery next door. The pastry is crisp, the custard is warm, and you eat them with cinnamon and sugar on top. There is always a queue outside. Go inside instead and find a table in one of the back rooms. It is usually faster, and it feels like a secret.",
     "接下來，吃的。搭電車或火車沿著河往西，到貝倫。在那裡，從 1837 年開始，一家叫「貝倫蛋塔」的店就一直在賣蛋塔，祕方來自隔壁修道院的修士。塔皮酥脆，內餡溫熱，上面撒上肉桂粉和糖粉一起吃。店外永遠在排隊。不如直接走進店裡，在後面的房間找張桌子。通常比較快，而且感覺像發現了一個秘密。","cheerful"],
    ["While you are in Belém, visit the monastery itself, the Jerónimos Monastery, with its white stone carved like lace, and the Belém Tower, a small fortress standing in the river. Together they are a UNESCO World Heritage Site. Both were built in the age when Portuguese sailors set out to explore the world, and both are decorated with stone ropes, shells and strange sea creatures, as if the builders could not stop thinking about the ocean.",
     "既然到了貝倫，也去看看那座修道院本身：熱羅尼莫斯修道院，白色的石頭雕得像蕾絲一樣；還有貝倫塔，一座立在河裡的小小堡壘。它們一起被列為聯合國教科文組織世界遺產。兩座建築都建於葡萄牙水手出海探索世界的年代，上面都裝飾著石雕的繩索、貝殼和奇怪的海洋生物，好像建造它們的人怎麼樣都停不下來想著大海。","informative"],
    ["Everywhere you go, look at the walls. Lisbon is covered in [[azulejos|c:azulejo]], painted ceramic tiles, on churches, train stations, shops and ordinary houses. Some are blue and white, some are green or yellow, some show whole stories in pictures. If you love them, the National Tile Museum has hundreds of years of them. But please do not take one home from a building, even if it is loose. Too many have already disappeared that way.",
     "不管走到哪裡，都看看牆壁。里斯本到處都貼著「azulejo」，彩繪的瓷磚，教堂、火車站、商店、普通的民宅上都有。有些是藍白色的，有些是綠色或黃色的，有些用圖畫講完一整個故事。如果你喜歡，國家磁磚博物館裡收藏了好幾百年的磁磚。可是，請不要從建築物上拿一片回家，就算它已經鬆了也不要。已經有太多磁磚就是這樣不見的。","firm"],
    ["When the sun goes down, find a small restaurant in Alfama or the Bairro Alto and listen to [[fado|c:fado]], Lisbon’s own music. A singer stands in front of two guitarists and sings about the sea, lost love and saudade, a kind of sad, sweet longing. In 2011, UNESCO added fado to its list of the world’s Intangible Cultural Heritage. You do not need to understand Portuguese. You will understand anyway. Just remember: during the songs, the room goes completely silent. No talking, no clinking glasses, no phones.",
     "太陽下山以後，在阿爾法瑪或上城區找一家小餐廳，聽一聽法朵，里斯本自己的音樂。一位歌手站在兩位吉他手前面，唱著大海、失去的愛情，還有 saudade，一種既哀傷又甜美的思念。2011 年，聯合國教科文組織把法朵列入人類無形文化遺產。你不需要懂葡萄牙文，你還是會聽懂的。只要記得：唱歌的時候，整個房間會完全安靜。不說話，不碰杯，不滑手機。","tender"],
    ["One last thing. Lisbon has become very popular, and in some old neighborhoods, many homes have been turned into holiday flats. Prices have risen, and some families who lived there for generations have had to leave. You can help a little. Eat in small local places, buy from local shops, say “[[bom dia|c:bomdia]]” and “[[obrigado|c:obrigado]]” or “obrigada,” and be quiet in the streets at night. People live there.",
     "最後一件事。里斯本變得非常熱門，在一些老街區，很多住家被改成了度假公寓。房價漲了，有些在那裡住了好幾代的家庭不得不搬走。你可以幫上一點忙：在當地的小店吃飯、跟在地的店家買東西、說一聲「早安」（bom dia）和「謝謝」（男生說 obrigado，女生說 obrigada），晚上在街上保持安靜。那裡有人住。","thoughtful"],
    ["Lisbon does not reward hurry. It rewards people who stop on a staircase to catch their breath and notice the view, who sit for an hour over one coffee, who get lost in Alfama on purpose. Walk until your legs hurt, eat one more custard tart than you planned, and save your last evening for a miradouro at sunset. You will understand why so many travelers leave Lisbon with saudade of their own.",
     "里斯本不獎勵趕路的人。它獎勵的，是那些停在階梯上喘口氣、順便發現風景的人，是那些一杯咖啡坐一個小時的人，是那些故意在阿爾法瑪迷路的人。走到腿痠，多吃一個本來沒打算吃的蛋塔，把最後一個晚上留給夕陽下的觀景台。你就會明白，為什麼有那麼多旅人離開里斯本時，心裡也帶著屬於自己的 saudade。","warm"]
  ],
  quiz:[
    ["Why does Alfama still look the way it did centuries ago?", ["It was rebuilt after 1755.","Built on solid rock, it survived the 1755 earthquake better than most areas.","Cars are not allowed there."], 1, "阿爾法瑪蓋在堅硬的岩盤上，1755 年大地震時撐得比其他地方好。"],
    ["What advice does the guide give about Tram 28?", ["Ride it at night only.","Go early, watch your bag, or walk the same route instead.","Don’t ride it; it’s closed."], 1, "28 號電車很擠又有扒手，建議一早去、包包放前面，或乾脆沿路線走路。"],
    ["What should you do while a fado singer is singing?", ["Clap along.","Stay completely silent.","Take videos."], 1, "唱法朵的時候整個房間會安靜下來，不說話、不碰杯、不滑手機。"]
  ]
},

/* ---------------- 10 ---------------- */
{ id:"stink", thread:"", kind:"history", title:"The Great Stink of 1858", zt:"1858 倫敦大惡臭", voice:"m",
  by:"InkQuest history",
  intro:"1858 年夏天，倫敦熱到連泰晤士河都在發臭。臭到國會議員受不了，終於批准了一項巨大的工程，從此改變了城市的樣貌，也救了成千上萬條人命。",
  paras:[
    ["In the summer of 1858, London was the largest and richest city in the world. It had more than two and a half million people, railways, factories, gas lamps and the grand new Houses of Parliament standing proudly beside the River [[Thames|c:n-thames]]. It also had a problem that nobody could ignore any longer. The river stank.",
     "1858 年夏天，倫敦是全世界最大、最富有的城市。它有超過兩百五十萬人口，有鐵路、工廠、煤氣路燈，還有一棟嶄新、宏偉的國會大廈，驕傲地立在泰晤士河畔。它也有一個再也沒辦法視而不見的問題：河在發臭。","informative"],
    ["For centuries, Londoners had dropped almost everything into the Thames: kitchen waste, factory [[chemicals]], dead animals and the contents of their toilets. In the 1840s, flushing toilets became popular, and new laws made people connect their homes to the city’s drains. That sounded like progress. But the drains had only one destination: the river. The same river from which many Londoners still got their drinking water.",
     "幾百年來，倫敦人幾乎什麼都往泰晤士河裡丟：廚餘、工廠的化學物質、動物屍體，還有廁所裡的東西。1840 年代，沖水馬桶開始流行，新法律要求大家把房子接上城市的排水溝。這聽起來是進步。可是排水溝只有一個終點：河。而許多倫敦人，還是從這條河裡取喝的水。","informative"],
    ["People had been warning about it for years. In 1855, the famous scientist [[Michael Faraday|c:n-faraday]] took a boat out on the river and dropped pieces of white card into the water to see how deep he could see them. They disappeared almost as soon as they touched the surface. He wrote an angry letter to The Times. The river, he said, had become a brown, [[foul]] liquid. Nobody did very much.",
     "多年來一直有人在警告。1855 年，有名的科學家麥可．法拉第搭船到河上，把一張張白色卡片丟進水裡，想看看能看到多深。卡片幾乎一碰到水面就看不見了。他寫了一封憤怒的信給《泰晤士報》，說這條河已經變成一種褐色、惡臭的液體。可是沒有人採取什麼行動。","informative"],
    ["Then came the summer of 1858. It was one of the hottest summers anyone could remember, with temperatures above thirty degrees for weeks. The sun cooked the river. The smell rose from the water and spread over the whole city: through the streets, into the shops, into the bedrooms. Newspapers called it “The Great Stink.” People said you could not cross a bridge without feeling sick.",
     "接著，1858 年的夏天來了。那是大家記憶中最熱的夏天之一，氣溫連續好幾個星期超過三十度。太陽把河水煮熟了。臭味從水面升起，擴散到整座城市：飄過街道，飄進商店，飄進臥室。報紙稱它為「大惡臭」。人們說，走過任何一座橋都會想吐。","nervous"],
    ["The worst place of all was the Houses of Parliament, which stood right on the riverbank. The members of Parliament tried to work with the windows closed in the heat. Workers hung long curtains soaked in a strong chemical, chloride of lime, to fight the smell. It did not help. Some members ran from the library holding handkerchiefs over their noses. There was serious talk of moving Parliament out of London altogether.",
     "最慘的地方是國會大廈，它就蓋在河岸邊。國會議員在大熱天裡關著窗戶，試著工作。工人掛上一條條浸過一種強烈化學藥劑「漂白粉」的長窗簾，想擋住臭味。沒有用。有些議員拿手帕摀著鼻子，從圖書室逃出來。大家甚至認真討論過，要不要乾脆把國會搬出倫敦。","amused"],
    ["Most people believed that the smell itself was dangerous. This was called the [[miasma theory|c:miasma]]: the idea that diseases like [[cholera]] spread through bad air. Cholera was a terrible disease that could kill a healthy person in a day, and it had killed tens of thousands of Londoners in the past twenty-five years. If bad air caused cholera, people reasoned, then the Great Stink might kill them all.",
     "大多數人相信，臭味本身就很危險。這叫做「瘴氣說」：認為霍亂這類疾病是透過髒空氣傳播的。霍亂是一種可怕的疾病，可以在一天之內奪走一個健康的人的性命，過去二十五年裡，它已經害死了好幾萬個倫敦人。大家心想，如果是髒空氣造成霍亂，那大惡臭說不定會把他們全部害死。","worried"],
    ["One doctor disagreed. Four years earlier, during a cholera [[outbreak]] in the Soho district, Dr. [[John Snow|c:n-snow]] had made a map. On it, he marked every house where someone had died. The deaths gathered around one public water pump on Broad Street. Snow persuaded the local officials to remove the pump’s handle, and the outbreak soon ended. Cholera, he argued, spread through dirty water, not dirty air. Few people believed him at the time. But he was right.",
     "有一位醫生不同意。四年前，蘇活區爆發霍亂時，約翰．斯諾醫生畫了一張地圖。他在地圖上標出每一間有人死亡的房子。死亡案例全部聚集在寬街上的一座公共水泵周圍。斯諾說服地方官員把水泵的把手拆掉，疫情很快就結束了。他主張，霍亂是透過髒水傳播的，不是髒空氣。當時沒什麼人相信他。可是他是對的。","thoughtful"],
    ["In the end, it did not matter who was right about the cause. The smell had done what years of letters and warnings could not: it had reached the noses of the most powerful men in Britain. That summer, Parliament rushed through a new law to pay for a modern sewer system. It took just eighteen days. The job went to the chief engineer of London’s new Metropolitan Board of Works, a small, serious man with a great mustache: [[Joseph Bazalgette|c:n-bazalgette]].",
     "最後，誰對病因說得對，已經不重要了。臭味做到了多年來的信件和警告都做不到的事：它鑽進了全英國最有權力的人的鼻子。那年夏天，國會火速通過一條新法律，撥款興建現代化的下水道系統，只花了十八天。這份工作交給了倫敦新成立的都會工程委員會總工程師，一個個子小小、表情嚴肅、留著一大把鬍子的人：約瑟夫．巴澤爾傑特。","informative"],
    ["Bazalgette’s plan was simple in idea and enormous in size. Instead of letting the drains run into the river in the middle of London, he would build huge new tunnels running alongside the Thames to catch the sewage and carry it far to the east, away from the city. It took about 132 kilometers of these great main sewers, connected to over 1,700 kilometers of smaller street sewers, and around 318 million bricks. Pumping stations, decorated like palaces, lifted the waste so that it could keep flowing.",
     "巴澤爾傑特的計畫，概念很簡單，規模卻很巨大。他不再讓排水溝在倫敦市中心直接流進河裡，而是沿著泰晤士河兩岸，蓋好幾條巨大的新隧道，把污水攔截下來，送到遠遠的東邊，離開城市。這需要大約 132 公里的大型主下水道，連接超過 1,700 公里較小的街道下水道，還有大約三億一千八百萬塊磚。裝飾得像宮殿一樣的抽水站，把污水抽高，讓它能繼續流動。","informative"],
    ["Bazalgette also made one decision that still matters today. When he calculated how big the pipes needed to be, he doubled the size. “We are only going to do this once,” he is reported to have said, “and there is always the unforeseen.” London’s population grew far beyond what anyone in 1858 imagined. Bazalgette’s oversized tunnels coped with it for well over a century.",
     "巴澤爾傑特還做了一個到今天都還很重要的決定。他算出管子需要多大以後，把尺寸加倍。據說他說過：「這種事我們只會做一次，而且總會有預料不到的狀況。」倫敦的人口成長，遠遠超出 1858 年任何人的想像。巴澤爾傑特這些「過大」的隧道，撐了一百多年都還應付得來。","proud"],
    ["The work was dirty, dangerous and slow. Thousands of men dug through London’s mud by hand, often in the dark, while the city carried on above them. Bazalgette checked everything himself. He insisted on a new, stronger kind of cement and had every batch tested before it was used. Many engineers thought he was too careful. His sewers are still working today, which suggests that he was exactly as careful as he needed to be.",
     "這項工程又髒、又危險、又慢。成千上萬的工人用雙手挖過倫敦的爛泥，常常是在黑暗中，而城市就在他們頭頂上照常運轉。巴澤爾傑特每件事都親自檢查。他堅持使用一種新的、更堅固的水泥，每一批在使用前都要先測試。很多工程師覺得他太小心了。他的下水道到今天都還在運作，這說明他的小心，一點也不多餘。","proud"],
    ["Building the sewers changed the shape of the city itself. To hide the new tunnels along the river, Bazalgette built wide stone walls called [[embankments|embankment]] and filled the land behind them. On top, there were new roads, gardens and walkways. Under one of them, the Victoria Embankment, he even made room for an underground railway. Today, millions of tourists walk along the Thames on Bazalgette’s embankments without knowing what lies under their feet.",
     "興建下水道，也改變了這座城市本身的樣貌。為了把河邊的新隧道藏起來，巴澤爾傑特蓋了寬闊的石牆，叫做堤岸，再把後面的地填平。上面鋪了新的道路、花園和步道。在其中一道維多利亞堤岸底下，他甚至預留了地鐵的空間。今天，幾百萬觀光客沿著泰晤士河，走在巴澤爾傑特的堤岸上，卻不知道自己腳下有什麼。","informative"],
    ["The main system opened in stages in the 1860s and was completed in 1875. The results were dramatic. In 1866, cholera struck London one more time, but mostly in an area of the East End that was not yet connected. After that, London never had a major cholera outbreak again. The new sewers, built to fight a smell, had defeated a killer. Slowly, people accepted that John Snow had been right about the water all along.",
     "主要系統在 1860 年代分階段啟用，1875 年全部完工。效果非常驚人。1866 年，霍亂最後一次侵襲倫敦，但主要發生在東區一個還沒接上新系統的地方。在那之後，倫敦再也沒有爆發過大規模的霍亂。這些為了對付臭味而蓋的下水道，打敗了一個殺手。慢慢地，大家終於接受，斯諾醫生對水的看法從頭到尾都是對的。","proud"],
    ["Of course, the story did not end there. The sewage now flowed into the Thames further east, and it took many more years before London learned to clean it properly first. And in the twenty-first century, even Bazalgette’s great tunnels were full. When heavy rain fell, they overflowed into the river again. So London built a new “super sewer,” the Thames Tideway Tunnel, twenty-five kilometers long and deep under the river. It was completed in 2025, almost exactly 150 years after Bazalgette finished his.",
     "當然，故事並沒有在那裡結束。污水改成流進更東邊的泰晤士河，倫敦又花了很多年，才學會先把它處理乾淨。到了二十一世紀，連巴澤爾傑特的大隧道也滿了。大雨一來，污水又會滿出來流進河裡。所以倫敦蓋了一條新的「超級下水道」，泰晤士潮汐隧道，長二十五公里，深埋在河底下。它在 2025 年完工，幾乎剛好是巴澤爾傑特完成他的系統的一百五十年後。","informative"],
    ["Today, on the Victoria Embankment, there is a small memorial to Joseph Bazalgette. Most people walk past it without looking. The words on it are in Latin and mean “He put the river in chains.” It is not the most beautiful monument in London. But few people in history have saved more lives, and he did it with bricks, a great deal of patience and a terrible smell that finally made the powerful pay attention.",
     "今天，在維多利亞堤岸上，有一座小小的巴澤爾傑特紀念碑。大部分人走過去都不會多看一眼。上面的字是拉丁文，意思是「他為河流套上了鎖鏈」。它不是倫敦最美的紀念碑。可是，歷史上很少有人救過比他更多的人命，而他靠的是磚塊、無比的耐心，還有一股終於讓有權有勢的人不得不注意的可怕臭味。","warm"]
  ],
  quiz:[
    ["Why did Parliament finally act in 1858?", ["Faraday’s letter convinced them.","The smell from the river reached them in the Houses of Parliament.","The Queen ordered it."], 1, "國會大廈就在河邊，臭味讓議員們受不了，十八天內就通過了法律。"],
    ["What did Dr. John Snow show with his map?", ["That cholera spread through bad air.","That cholera deaths gathered around one water pump.","Where to build the sewers."], 1, "他標出死亡案例，發現都集中在寬街的一座水泵周圍，證明霍亂透過髒水傳播。"],
    ["Why did Bazalgette double the size of his sewer pipes?", ["Bricks were cheap.","He expected the unexpected and wanted to do the job only once.","Parliament asked him to."], 1, "他說這種事只會做一次，而且總有預料不到的狀況，所以把管徑加倍，撐了一百多年。"]
  ]
}

   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(LEVEL.prefix+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(LEVEL.prefix+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(LEVEL.prefix+k); }catch(e){} }
};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const pad = n => String(n).padStart(2,"0");
const RX = /\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g;
const plain = s => String(s).replace(RX,"$1");
const keyOf = (disp, key) => key || disp.toLowerCase();
function mk(s){
  return esc(s).replace(RX,(m,disp,key)=>{
    key = keyOf(disp, key);
    return `<span class="g ${key.startsWith("c:") ? "cu" : "vo"}" role="button" tabindex="0" data-k="${esc(key)}">${disp}</span>`;
  });
}
const CEFR = {A1:1,A2:2,B1:3,B2:4,C1:5,C2:6};
const THREAD = {dnd:"🎲 龍與地下城", women:"✨ 自信女性", love:"💕 輕鬆愛情", static:"📡 高雄三部曲"};

const KIND_EN = {orig:"ORIGINAL", classic:"CLASSIC", guide:"GUIDE", history:"HISTORY"};

/* word counts and which story each note first appears in */
S.forEach((s,i)=>{
  s.i = i;
  s.words = s.paras.reduce((n,p)=>n + (plain(p[0]).match(/[A-Za-z0-9’'-]+/g) || []).length, 0);
  s.mins = Math.max(1, Math.round(s.words / 110));
  s.keys = [];
  s.paras.forEach(p=>{ for(const m of p[0].matchAll(RX)){ const k = keyOf(m[1], m[2]); if(!s.keys.includes(k)) s.keys.push(k);
    const e = k.startsWith("c:") ? CULT[k] : VOCAB[k]; if(e && e.s === undefined) e.s = i; } });
});

function pix(id){
  const rows = LEVEL.icons[id]; if(!rows) return "";
  let r = "";
  rows.forEach((row,y)=>{ let x = 0;
    while(x < row.length){ const c = row[x]; if(c === "."){ x++; continue; }
      let w = 1; while(row[x+w] === c) w++;
      r += `<rect x="${x}" y="${y}" width="${w}" height="1" fill="${PAL[c]}"/>`; x += w; } });
  return `<svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

  const img = x.createImageData(W,H), d = img.data;
  const put = (px,py,c)=>{ if(px<0||py<0||px>=W||py>=H) return; const i=(py*W+px)*4; d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; d[i+3]=255; };
  const rect = (x0,y0,w,h,c)=>{ c=hex(c); for(let yy=y0;yy<y0+h;yy++) for(let xx=x0;xx<x0+w;xx++) put(xx,yy,c); };
  const vgrad = (x0,y0,w,h,cols)=>{ const cs=cols.map(hex), n=cs.length-1;
    for(let yy=0;yy<h;yy++){ const t=yy/(h-1)*n, k=Math.min(n-1,Math.floor(t)), f=t-k;
      for(let xx=0;xx<w;xx++){ const b=(B4[yy&3][xx&3]+.5)/16; put(x0+xx,y0+yy, f>b?cs[k+1]:cs[k]); } } };

/* ---------------- FM music ---------------- */
const Music = (()=>{
  let ctx=null, bus, out, timer=null, cur=-1, step=0, nextT=0, keeper=null, ducked=false;
  let vol = store.get("vol", 42) / 100;

    ep:   {mods:[{r:1,i:1.6,d:.9},{r:14,i:.5,d:.07}], a:.004, dec:2.2, sus:0, g:.16, lp:3200},
    bell: {mods:[{r:3.5,i:2.6,d:1.6}], a:.002, dec:2.6, sus:0, g:.10, lp:6000},
    bass: {mods:[{r:1,i:2.2,d:.22}], a:.005, dec:.9, sus:.35, g:.24, lp:900},
    pad:  {mods:[{r:2,i:.7,d:9}], a:.9, dec:4, sus:.8, g:.07, lp:2400, det:6},
    mar:  {mods:[{r:4,i:2.4,d:.09}], a:.002, dec:.55, sus:0, g:.13, lp:4200}
  };
  function parse(str){ const t=str.split(/\s+/).filter(z=>z&&z!=="|"), ev={}; let last=null;
    t.forEach((k,i)=>{ if(k==="-"){last=null;return;} if(k==="_"){ if(last) last.len++; return; } last={ms:k.split("+").map(midi),len:1}; ev[i]=last; });
    return {n:t.length, ev}; }
  const TR = LEVEL.tracks; TR.forEach(t=>t.parts.forEach(p=>p.q=parse(p.s)));
  function silentWav(){
    const n = 4000, buf = new ArrayBuffer(44+n), v = new DataView(buf), w = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
    w(0,"RIFF"); v.setUint32(4,36+n,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,"data"); v.setUint32(40,n,true);
    for(let i=0;i<n;i++) v.setUint8(44+i,128);

  /* iOS: play through the silent switch, and keep the session alive */
  function unlockIOS(){
    try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}
    try{ if(!keeper){ keeper = new Audio(silentWav()); keeper.loop = true; keeper.setAttribute("playsinline",""); keeper.volume = 0.01; }
      const pr = keeper.play(); if(pr && pr.catch) pr.catch(()=>{}); }catch(e){}

    const rev=ctx.createConvolver(); rev.buffer=impulse(3); const rg=ctx.createGain(); rg.gain.value=.32;

    bus.connect(dly); dly.connect(dlp); dlp.connect(fb); fb.connect(dly); dlp.connect(dg); dg.connect(comp);

  }
  function applyVol(){ if(out) out.gain.setTargetAtTime(cur < 0 ? 0 : vol*(ducked?.3:1), ctx.currentTime, .08); }
  function voice(t, m, dur, p, vel){
    const f=hz(m), amp=ctx.createGain(), lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=p.lp;
    const carriers=[f]; if(p.det) carriers.push(f*Math.pow(2,p.det/1200));

    carriers.forEach(cf=>{
      const c=ctx.createOscillator(); c.frequency.value=cf;

  function play(i){
    if(!ctx && !init()){ toast("這個瀏覽器無法播放音樂"); return; }

    const r = ctx.resume(); if(r && r.catch) r.catch(()=>{});
    setTimeout(()=>{ if(cur >= 0 && ctx.state !== "running") toast("瀏覽器擋住了音樂：請再點一下 ♪，並確認手機沒有開靜音"); }, 700);
    clearInterval(timer); cur=i; step=0; nextT=ctx.currentTime+.1; applyVol();
    tick(); timer=setInterval(tick,40); store.set("trk", i); ui();
  }
  function stop(){ clearInterval(timer); timer=null; cur=-1; if(ctx) applyVol(); if(keeper) keeper.pause(); ui(); }
  function wake(){ if(ctx && cur >= 0 && ctx.state !== "running"){ unlockIOS(); ctx.resume(); } }
  function ui(){
    $("#musicBtn").classList.toggle("on", cur >= 0);
    $$(".trk").forEach(b=>{ const on = +b.dataset.t === cur; b.classList.toggle("on", on); b.querySelector(".pl").textContent = on ? "❚❚" : "▶"; });
    const cm = $("#coverMusic"); if(cm){ cm.classList.toggle("on", cur >= 0); cm.setAttribute("aria-pressed", cur >= 0); }
  }
  document.addEventListener("visibilitychange", ()=>{
    if(!ctx || cur < 0) return;
    if(document.hidden){ clearInterval(timer); ctx.suspend(); }
    else ctx.resume().then(()=>{ nextT = ctx.currentTime + .05; clearInterval(timer); timer = setInterval(tick,40); });
  });
  return { TR, play, stop, wake, ui,
    get cur(){ return cur; }, get state(){ return ctx ? ctx.state : "none"; },
    setVol(v){ vol=v; store.set("vol", Math.round(v*100)); if(ctx) applyVol(); }, get vol(){ return vol; },
    duck(on){ ducked=on; if(ctx) applyVol(); } };
})();

/* ---------------- speech ----------------

const MOOD = {
  cheerful:[1.05,1.12], excited:[1.12,1.2], panicked:[1.16,1.16], bright:[1.03,1.08], friendly:[1.0,1.05],
  warm:[0.95,1.0], gentle:[0.9,0.98], tender:[0.86,0.95], nostalgic:[0.87,0.95], wistful:[0.86,0.92], sad:[0.84,0.9],
  hopeful:[0.93,1.05], playful:[1.05,1.1], teasing:[1.0,1.08], amused:[1.0,1.08], deadpan:[0.92,0.9],
  curious:[1.0,1.1], surprised:[1.08,1.2], calm:[0.95,1.0], proud:[1.0,1.06], triumphant:[1.06,1.15],
  thoughtful:[0.9,0.97], nervous:[1.04,1.05], tired:[0.88,0.94], informative:[0.97,1.0], worried:[1.02,1.03], shy:[0.95,1.05], annoyed:[1.06,0.95]

const SYN = window.speechSynthesis || null;
let qid = 0, Q = null;
let rate = store.get("rate", .85);
let voiceURI = store.get("voiceURI", "");
const VOICES = {all:[], f:[], m:[], main:null};
const FEM = /Samantha|Ava|Allison|Susan|Zira|Aria|Jenny|Michelle|Emma|Joanna|Salli|Kendra|Kimberly|Ivy|Karen|Moira|Tessa|Victoria|Serena|Kate|Fiona|Veena|Libby|Sonia|Natasha|Nicky|Sara|Female|Google US English/i;
const MAL = /Alex|Daniel|Tom|Aaron|Arthur|Rishi|David|Mark|Guy|Ryan|Eric|Christopher|Matthew|Joey|Justin|Brian|Oliver|Gordon|Lee|Evan|Nathan|Male/i;
const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Ralph|Fred|Kathy|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
function vq(v){ const s = (v.voiceURI || "") + " " + v.name;
  if(/premium|高品質|優質/i.test(s)) return 2; if(/enhanced|增強|加強|Natural|Neural|Online/i.test(s)) return 1; return 0; }
const QLABEL = ["一般音質","增強音質","高品質"];
function pickVoice(){
  if(!SYN) return;
  const us = v => /^en[-_]US/i.test(v.lang) ? 0 : 1, hq = v => 2 - vq(v);
  const vs = SYN.getVoices().filter(v=>/^en/i.test(v.lang) && !NOVELTY.test(v.name)).sort((a,b)=>us(a)-us(b) || hq(a)-hq(b));
  VOICES.all = vs; VOICES.f = vs.filter(v=>FEM.test(v.name)); VOICES.m = vs.filter(v=>!FEM.test(v.name) && MAL.test(v.name));
  VOICES.main = vs.find(v=>v.voiceURI === voiceURI)
    || vs.find(v=>us(v)===0 && /Samantha|Google US English|Aria|Jenny|Ava|Allison/i.test(v.name)) || VOICES.f[0] || vs[0] || null;
  fillVoiceSel();
}
/* a story told by a man uses a male voice, unless the reader picked a voice by hand */
function narrator(s){
  if(voiceURI || !s || s.voice !== "m") return VOICES.main;
  return VOICES.m.find(v=>v.lang === (VOICES.main && VOICES.main.lang)) || VOICES.m[0] || VOICES.main;
}
if(SYN){ pickVoice(); SYN.onvoiceschanged = pickVoice; }
const sayAs = t => Object.entries(LEVEL.sayAs || {}).reduce((x,[w,r])=>x.split(w).join(r), t);  /* voice-only respellings */
const speakable = t => plain(t).replace(/[“”]/g,'"').replace(/[’‘]/g,"'").replace(/…/g,"...").replace(/—/g,", ").replace(/\$(\d+)/g,"$1 dollars");
/* ---------------- foreign words ----------------
   LEVEL.foreign = {"fado":["pt-PT","fah doo"], "dàn bǐng":["zh-TW","dahn bing","蛋餅"]}
   [language, English-voice respelling, optional text for the native voice].
   If the device has a voice for that language, the word is spoken by it (mid-sentence too);
   otherwise the English voice reads the respelling. Matching ignores case. */
const FOREIGN = {};
Object.entries(LEVEL.foreign || {}).forEach(([k,v])=>{ FOREIGN[k.toLowerCase()] = {lang:v[0], en:v[1], nat:v[2] || k}; });
const FRX = Object.keys(FOREIGN).length ? new RegExp("(^|[^\\p{L}])(" + Object.keys(FOREIGN).sort((a,b)=>b.length-a.length)
  .map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")(?![\\p{L}])", "giu") : null;

  if(!SYN || !lang) return null; const L = lang.toLowerCase(), base = L.split("-")[0];

  const best = a => a.slice().sort((x,y)=>vq(y)-vq(x))[0];

/* split a (sayAs-processed) sentence into parts: [{t, nv}] where nv is a native voice, or absent for the English voice */
function speakParts(s){

    while((m = FRX.exec(s))){ const st = m.index + m[1].length;
      if(st > i) raw.push({t:s.slice(i, st)}); raw.push({t:m[2], f:FOREIGN[m[2].toLowerCase()]}); i = st + m[2].length; FRX.lastIndex = i; }
    if(i < s.length) raw.push({t:s.slice(i)});

  const parts = [];
  raw.forEach(p=>{ const nv = p.f && nativeVoice(p.f.lang);
    if(nv){ parts.push({t:p.f.nat, nv}); return; }
    const t = p.f ? p.f.en : sayAs(p.t), last = parts[parts.length-1];
    if(last && !last.nv) last.t += t; else parts.push({t}); });
  return parts.filter(p=>p.nv || /[\p{L}\p{N}]/u.test(p.t));
}
function sentences(t){
  const s = speakable(t).replace(/\b([ap])\.m\./g,"$1_m_").replace(/\b(Mr|Mrs|Ms|Dr|St)\./g,"$1_");
  return (s.match(/[^.!?]+(?:[.!?]+["']?|$)/g) || [s]).map(x=>x.replace(/([ap])_m_/g,"$1.m.").replace(/\b(Mr|Mrs|Ms|Dr|St)_/g,"$1.").trim()).filter(Boolean);
}
function prosody(sent, mood){
  const m = MOOD[mood] || [1,1];

}
function pushTTS(q, it){
  const ss = sentences(it.text), v = narrator(S[cur]);
  ss.forEach((s,n)=>{ const pr = prosody(s, it.mood), last = n === ss.length-1;
    const gap = last ? 450 : /\.\.\.["']?$/.test(s) ? 450 : /\?["']?$/.test(s) ? 320 : 260;
    const ps = speakParts(s);
    ps.forEach((p,m)=>q.push({text:p.t, el:it.el, gap: m === ps.length-1 ? gap : 40, voice:p.nv || v, rate:p.nv ? Math.min(pr.rate, .95) : pr.rate, pitch:p.nv ? 1 : pr.pitch})); });
}
const CLIPS = new Set();
const player = new Audio(); player.preload = "auto";
try{ fetch(LEVEL.audio + "manifest.json", {cache:"no-cache"}).then(r=>r.ok ? r.json() : null).then(j=>{
  if(j) (Array.isArray(j) ? j : (j.files || [])).forEach(f=>CLIPS.add(String(f).replace(/\.mp3$/i,""))); }).catch(()=>{}); }catch(e){}
function clearSpeaking(){ $$(".speaking").forEach(e=>e.classList.remove("speaking")); }
function stopSpeech(){ qid++; if(SYN) SYN.cancel(); try{ player.pause(); }catch(e){} clearSpeaking(); Q = null; Music.duck(false); playBtns(); }
function pauseSpeech(){ if(!Q || Q.paused) return; qid++; Q.paused = true; Q.k = Math.max(0, Q.k-1); if(SYN) SYN.cancel(); try{ player.pause(); }catch(e){} Music.duck(false); playBtns(); }
function resumeSpeech(){ if(Q && Q.paused){ Q.paused = false; runQueue(); } }
function sayQueue(items, mode){
  const hasClip = items.some(it=>it.clip && CLIPS.has(it.clip));
  if(!SYN && !hasClip){ toast("這個瀏覽器不支援朗讀功能"); return; }
  stopSpeech();
  const q = [];
  items.forEach(it=>{ if(it.clip && CLIPS.has(it.clip)) q.push({audio:it.clip, el:it.el, gap:450, it}); else pushTTS(q, it); });
  Q = {q, k:0, mode, paused:false}; runQueue();
}
function runQueue(){
  const my = ++qid, S_ = Q, q = S_.q;
  playBtns(); Music.duck(true);
  const next = ()=>{
    if(my !== qid) return;
    if(S_.k >= q.length){ clearSpeaking(); Q = null; Music.duck(false); playBtns(); return; }
    const x = q[S_.k++];
    if(x.el && !x.el.classList.contains("speaking")){ clearSpeaking(); x.el.classList.add("speaking"); if(q.length > 1) x.el.scrollIntoView({block:"center", behavior:"smooth"}); }
    if(x.audio){
      let failed = false;
      const fail = ()=>{ if(failed || my !== qid) return; failed = true; const sub = []; pushTTS(sub, x.it); q.splice(S_.k, 0, ...sub); next(); };
      player.onended = ()=>{ if(my === qid) setTimeout(next, x.gap); }; player.onerror = fail;
      player.src = `${LEVEL.audio}${x.audio}.mp3`; player.playbackRate = rate < .8 ? .85 : 1;
      const pr = player.play(); if(pr && pr.catch) pr.catch(fail); return;
    }
    if(!SYN){ next(); return; }
    const u = new SpeechSynthesisUtterance(x.text);
    if(x.voice){ u.voice = x.voice; u.lang = x.voice.lang; } else u.lang = "en-US";
    u.rate = x.rate; u.pitch = x.pitch;
    u.onend = ()=>{ if(my === qid) setTimeout(next, x.gap); };
    u.onerror = ()=>{ if(my === qid) setTimeout(next, 50); };

}
function sayWord(t, lang){ if(!SYN) return; stopSpeech();
  const nv = nativeVoice(lang);  /* a note with its own lang (a Portuguese name card) is read whole by that voice */
  (nv ? [{t:speakable(t), nv}] : speakParts(speakable(t))).forEach(p=>{ const u = new SpeechSynthesisUtterance(p.t), v = p.nv || VOICES.main;
    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = "en-US"; u.rate = Math.min(p.nv ? .9 : 1, rate); SYN.speak(u); }); }
let speechUnlocked = false;
function unlockSpeech(){ if(speechUnlocked || !SYN) return; speechUnlocked = true;
  try{ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; u.lang = "en-US"; SYN.speak(u); }catch(e){} }
["touchend","click","keydown"].forEach(t=>document.addEventListener(t, unlockSpeech, true));
function fillVoiceSel(){
  const s = $("#voiceSel"); if(!s) return;
  if(!VOICES.all.length){ s.innerHTML = `<option>（這個瀏覽器沒有英文語音）</option>`; s.disabled = true; return; }
  s.disabled = false;
  s.innerHTML = `<option value="">自動（依故事選男聲或女聲）</option>` + VOICES.all.map((v,i)=>`<option value="${i}"${voiceURI && v === VOICES.main ? " selected" : ""}>${esc(v.name)} · ${esc(v.lang)} · ${QLABEL[vq(v)]}</option>`).join("");
  const m = VOICES.main; if(m) $("#voiceNow").innerHTML = `目前主要聲音：<b>${esc(m.name)}（${QLABEL[vq(m)]}）</b>`;
}
function playBtns(){

  if(b){ const mine = Q && Q.mode === "all";
    b.innerHTML = !mine ? SVGI.play + "<span>Listen 朗讀全文</span>" : Q.paused ? SVGI.play + "<span>Resume 繼續</span>" : SVGI.pause + "<span>Pause 暫停</span>";

}

    <div class="libh"><b>Library Card</b><span>借書證・讀完一篇就蓋一個章</span></div>
    <div class="stamps">${S.map((s,i)=>`<button class="st${read[s.id] ? " on" : ""}${fresh === s.id ? " new" : ""}" data-go="${i}" data-sid="${s.id}" aria-label="${esc(s.title)}${read[s.id] ? "（已讀）" : ""}">${read[s.id] ? pix(s.id) : pad(i+1)}</button>`).join("")}</div>
    <div class="libs"><span><b>${n}</b>/ ${S.length} 篇讀完</span><span><b>${wordsRead().toLocaleString()}</b>個英文字</span><span><b>${perfect}</b>篇小測驗全對</span></div>
  </section>`;
}
function renderHome(){
  stopSpeech(); cur = -1; store.set("pos", -1);
  $("#main").innerHTML = libHTML() + `<h2 class="hh">Stories 故事</h2><div class="cards">` + S.map((s,i)=>`
    <button class="card" data-go="${i}">
      <span class="ico">${pix(s.id)}</span>
      <span><span class="cn">${pad(i+1)}. ${esc(s.title)}</span><span class="cz2">${esc(s.zt)}</span><span class="tags">${tagHTML(s)}</span></span>
      <span class="cr">${read[s.id] ? '<span class="ok">✓</span>' : ""}${s.words} words<br>${s.mins} min</span>
    </button>`).join("") + `</div>`;
  buildToc(); window.scrollTo(0,0);
}
/* each story has its own song (LEVEL.storyTracks): opening a story switches to it, but only if music is already on */
let musicStory = -1;
function storyTrack(i){ const t = (LEVEL.storyTracks||[])[i]; return (i >= 0 && t != null && t < LEVEL.tracks.length) ? t : (store.get("trk", 0) || 0); }
function musicFor(i){ if(i === musicStory) return; musicStory = i; const t = storyTrack(i); if(Music.cur >= 0 && Music.cur !== t) Music.play(t); }
function renderStory(i, para){
  stopSpeech(); closePop(); cur = i; store.set("pos", i); musicFor(i);
  const s = S[i], prev = S[i-1], next = S[i+1], a = quiz[s.id] || [];
  $("#main").innerHTML = `<article class="story">
    <p class="sk">STORY ${pad(i+1)} · ${KIND_EN[s.kind]}</p>
    <h1>${esc(s.title)}</h1>
    <p class="szt">${esc(s.zt)}</p>
    <div class="meta">${tagHTML(s)}<span class="tag">${s.words} words · 約 ${s.mins} 分鐘</span></div>
    <div class="intro">${esc(s.intro)}<span class="by">${esc(s.by)}</span></div>
    <div class="tools">
      <button class="pb" id="playAll"></button>
      <button class="pb" id="playRe" hidden>${SVGI.restart}<span>從頭</span></button>
      <button class="pb${showZh ? " sel" : ""}" id="zhBtn" aria-pressed="${showZh}">${showZh ? "隱藏中文" : "顯示中文"}</button>
    </div>
    ${s.paras.map((p,k)=>`<div class="pp" id="p${k}"><button class="pspk" data-p="${k}" aria-label="聽這一段">${SVGI.spk}</button><p class="en"><span class="t">${mk(p[0])}</span></p><p class="zh">${esc(p[1])}</p></div>`).join("")}
    <p class="end">~ THE END ~</p>
    <section class="box" id="quiz">
      <p class="bh">Did you get it?</p><p class="bz">小測驗・三題，可以跳過</p>
      ${s.quiz.map((q,k)=>`<div class="q" data-q="${k}"><p class="qt">${k+1}. ${esc(q[0])}</p><div class="qo">${q[1].map((o,j)=>`<button data-o="${j}">${esc(o)}</button>`).join("")}</div><p class="qx" hidden></p></div>`).join("")}
    </section>
    <section class="box done" id="done"></section>
    <nav class="nav">
      ${prev ? `<button data-go="${i-1}"><small>← 上一篇</small><span>${esc(prev.title)}</span></button>` : `<button data-home><small>←</small><span>Contents 目錄</span></button>`}
      ${next ? `<button data-go="${i+1}"><small>下一篇 →</small><span>${esc(next.title)}</span></button>` : `<button data-home><small>→</small><span>Contents 目錄</span></button>`}
    </nav>
  </article>`;
  a.forEach((x,k)=>{ if(x !== undefined && x !== null) answer(k, x, true); });
  doneBox(); playBtns(); buildToc();
  if(para !== undefined){ const el = $("#p"+para); if(el){ el.scrollIntoView({block:"center"}); el.querySelector(".en").classList.add("flash"); } }
  else window.scrollTo(0,0);
}
function doneBox(){
  const s = S[cur], d = read[s.id];
  $("#done").innerHTML = d
    ? `<button class="bigst" disabled>✓ READ · ${esc(d)}</button><small>已經蓋在借書證上了。想再讀一次，隨時歡迎。</small>`
    : `<button class="bigst" id="stampBtn">I finished! 我讀完了</button><small>按下去，就會在借書證上蓋一個章。</small>`;
}
function answer(k, j, quiet){
  const s = S[cur], q = s.quiz[k], box = $(`.q[data-q="${k}"]`); if(!box) return;
  const ok = j === q[2];
  box.querySelectorAll(".qo button").forEach((b,n)=>{ b.classList.toggle("right", ok && n === j); b.classList.toggle("wrong", !ok && n === j); });
  const x = box.querySelector(".qx"); x.hidden = false;
  x.innerHTML = ok ? `<b>答對了！</b>${esc(q[3])}` : `<b>再想想看。</b>回到故事裡找找線索，再選一次。`;
  if(!quiet){ const a = quiz[s.id] || []; a[k] = j; quiz[s.id] = a; store.set("quiz", quiz); }
}
function stamp(){
  const s = S[cur]; if(read[s.id]) return;
  read[s.id] = today(); store.set("read", read); fresh = s.id; doneBox();
  const n = readCount();
  toast(n === S.length ? `十篇全部讀完了！你讀了 ${wordsRead().toLocaleString()} 個英文字 🎉` : `蓋章！借書證上已經有 ${n} 個章了`);
  buildToc();
}

/* ---------------- popover ---------------- */
const pop = $("#pop");
function popHTML(k){
  if(k.startsWith("c:")){ const c = CULT[k]; if(!c) return "";
    const pk = c.kk ? `<span class="pk">${esc(c.kk)}</span>` : "";
    return `<div class="ph"><span class="pw">${esc(c.h)}</span>${pk}<span class="lvb">${c.name ? "名字發音" : "文化小知識"}</span><span class="px2"><button class="ib" data-say="${esc(c.speak || c.h)}"${c.lang ? ` data-lang="${esc(c.lang)}"` : ""} aria-label="聽發音">${SVGI.spk}</button><button class="ib" data-close aria-label="關閉"><svg viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg></button></span></div>
      <p class="pz">${esc(c.zh)}</p>${c.say ? `<p class="pd">念起來像 <b>${esc(c.say)}</b></p>` : ""}<p class="pd">${esc(c.d)}</p>`; }
  const v = VOCAB[k]; if(!v) return "";
  const hi = (CEFR[v.lv] || 1) > LEVEL.rank, st = stars.includes(k);
  return `<div class="ph"><span class="pw">${esc(v.w)}</span><span class="pk">${esc(v.kk)}</span><span class="lvb${hi ? " hi" : ""}">${esc(v.lv)}${hi ? " · 超出本級" : ""}</span>
      <span class="px2"><button class="ib" data-say="${esc(v.w)}" aria-label="聽發音">${SVGI.spk}</button><button class="ib star${st ? " on" : ""}" data-star="${esc(k)}" aria-label="${st ? "取消收藏" : "收藏"}">${st ? SVGI.star : SVGI.starO}</button><button class="ib" data-close aria-label="關閉"><svg viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg></button></span></div>
    <p class="pz"><span class="lvb">${esc(v.pos)}</span> ${esc(v.zh)}</p><p class="pd">${esc(v.d)}</p>${v.s !== undefined ? `<p class="pn">出自第 ${v.s+1} 篇〈${esc(S[v.s].title)}〉</p>` : ""}`;
}
function openPop(k){ const h = popHTML(k); if(!h) return; $("#popIn").innerHTML = h; pop.classList.add("on"); pop.setAttribute("aria-hidden","false"); pop.dataset.k = k; }
function closePop(){ pop.classList.remove("on"); pop.setAttribute("aria-hidden","true"); }

/* ---------------- drawer ---------------- */
function openDrawer(p){ $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); switchPane(p || "toc"); }
function closeDrawer(){ $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); }
function switchPane(p){
  $$("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.p === p));
  $$(".pane").forEach(x=>x.hidden = x.id !== "p-"+p);
  if(p === "words") buildWords(); if(p === "about") buildAbout(); if(p === "find") setTimeout(()=>$("#q").focus(), 250);
}
function buildToc(){
  $("#toc").innerHTML = `<a data-home class="${cur < 0 ? "cur" : ""}"><span></span><span><span class="n">Contents & Library Card</span><span class="z">目錄與借書證</span></span><span></span></a>` +
    S.map((s,i)=>`<a data-go="${i}" class="${i === cur ? "cur" : ""}">${pix(s.id)}<span><span class="n">${pad(i+1)}. ${esc(s.title)}</span><span class="z">${esc(s.zt)}</span></span><span class="ok">${read[s.id] ? "✓" : ""}</span></a>`).join("");
}
function snip(t, q){ const i = t.toLowerCase().indexOf(q.toLowerCase()); if(i < 0) return esc(t.slice(0,80));
  const a = Math.max(0, i-40), b = Math.min(t.length, i+q.length+50);
  return (a ? "…" : "") + esc(t.slice(a,i)) + "<mark>" + esc(t.slice(i,i+q.length)) + "</mark>" + esc(t.slice(i+q.length,b)) + (b < t.length ? "…" : ""); }
function search(){
  const q = $("#q").value.trim(), res = $("#res");
  if(q.length < 2 && !/[一-鿿]/.test(q)){ res.innerHTML = `<p class="hint">可以搜尋故事內容、中文翻譯和詞彙。</p>`; return; }
  const out = [], ql = q.toLowerCase();
  Object.keys(VOCAB).forEach(k=>{ const v = VOCAB[k]; if(v.w.toLowerCase().includes(ql) || v.zh.includes(q)) out.push(`<a data-pop="${esc(k)}"><small>WORD 詞彙</small><b>${esc(v.w)}</b>　${esc(v.zh)}</a>`); });
  Object.keys(CULT).forEach(k=>{ const c = CULT[k]; if(c.h.toLowerCase().includes(ql) || c.zh.includes(q)) out.push(`<a data-pop="${esc(k)}"><small>CULTURE 文化</small><b>${esc(c.h)}</b>　${esc(c.zh)}</a>`); });
  S.forEach((s,i)=>s.paras.forEach((p,k)=>{ const en = plain(p[0]);
    if(en.toLowerCase().includes(ql)) out.push(`<a data-go="${i}" data-para="${k}"><small>STORY ${pad(i+1)} · ${esc(s.title)}</small>${snip(en,q)}</a>`);
    else if(p[1].includes(q)) out.push(`<a data-go="${i}" data-para="${k}"><small>STORY ${pad(i+1)} · ${esc(s.zt)}</small>${snip(p[1],q)}</a>`); }));
  res.innerHTML = out.length ? `<p class="hint">找到 ${out.length} 筆</p>` + out.slice(0,60).join("") : `<p class="hint">找不到「${esc(q)}」。</p>`;
}
let wmode = "all";
function buildWords(){
  $$("#wseg button").forEach(b=>b.classList.toggle("on", b.dataset.w === wmode));
  const row = k=>{ const v = VOCAB[k], c = CULT[k]; if(!v && !c) return "";
    return `<a data-pop="${esc(k)}"><b>${esc(v ? v.w : c.h)}</b><span>${esc(v ? v.zh : c.zh)}</span>${stars.includes(k) ? "<i>★</i>" : ""}</a>`; };
  if(wmode === "star"){
    $("#wl").innerHTML = stars.length ? stars.map(row).join("") : `<p class="hint">還沒有收藏。讀故事時點一下有虛線的字，再按 ☆ 就能收藏。</p>`; return; }
  $("#wl").innerHTML = S.map((s,i)=>`<h4>${pad(i+1)}. ${esc(s.title)}</h4>` + s.keys.filter(k=>(VOCAB[k] || CULT[k]) && (VOCAB[k] || CULT[k]).s === i).map(row).join("")).join("");
}
function buildAbout(){
  $("#p-about").innerHTML = `<p class="big">InkQuest</p><p class="mot">Every quest begins with a story.</p>
    <p><b>Lamplight Readers 燈下小書</b><br>${esc(LEVEL.zh)}（${LEVEL.cefr}）・${S.length} 篇故事<br>版本 ${esc(LEVEL.version)}</p>
    <p>《窗邊英文》的姊妹讀本，給想自己多讀一點的人。每篇都可以朗讀、點字看解釋；讀完蓋個章，看看自己讀了多少英文。</p>
    <p>目前進度：讀完 ${readCount()} 篇，共 ${wordsRead().toLocaleString()} 個英文字。</p>
    <p><b>經典故事來源</b>（皆為公有領域作品，由 InkQuest 改寫為 ${LEVEL.cefr} 程度）</p>
    <ul>${LEVEL.credits.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
    ${(LEVEL.notes || []).map(n=>`<p style="font-size:13px">${esc(n)}</p>`).join("")}
    <p>字型：Jersey 15、Literata（SIL Open Font License）。音樂為瀏覽器即時 FM 合成。</p>
    <p>Created with Claude.</p>
    <p>© 2026 Wen-Hung Fang. All rights reserved.</p>`;
}

/* ---------------- settings ---------------- */
let fs = store.get("fs", 19);
function applyFs(){ document.documentElement.style.setProperty("--fs", fs+"px"); $$("#sizes button").forEach(b=>b.classList.toggle("on", +b.dataset.v === fs)); }
function applyRate(){ $$("#rates button").forEach(b=>b.classList.toggle("on", +b.dataset.v === rate)); }
function applyZhDef(){ const d = !!store.get("zhdef", false); $$("#zhset button").forEach(b=>b.classList.toggle("on", !!+b.dataset.v === d)); }
function applyTheme(){ const t = store.get("theme", "auto"); if(t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  $$("#themes button").forEach(b=>b.classList.toggle("on", b.dataset.v === t)); }
function setZh(on){ showZh = on; document.body.classList.toggle("showzh", on); const b = $("#zhBtn"); if(b){ b.textContent = on ? "隱藏中文" : "顯示中文"; b.classList.toggle("sel", on); b.setAttribute("aria-pressed", on); } }

/* ---------------- toast ---------------- */
const toastQ = []; let toastBusy = false;
function toast(m){ if(toastQ[toastQ.length-1] !== m) toastQ.push(m); if(!toastBusy) toastNext(); }
function toastNext(){ const m = toastQ.shift(); if(m === undefined){ toastBusy = false; return; } toastBusy = true;
  const t = $("#toast"); t.textContent = m; t.classList.add("on"); setTimeout(()=>{ t.classList.remove("on"); setTimeout(toastNext, 300); }, 2600); }

/* ---------------- events ---------------- */
document.addEventListener("click", e=>{
  const t = e.target;
  const g = t.closest(".g"); if(g){ openPop(g.dataset.k); return; }
  const go = t.closest("[data-go]");
  if(go){ const para = go.dataset.para; closeDrawer(); renderStory(+go.dataset.go, para === undefined ? undefined : +para); return; }
  if(t.closest("[data-home]")){ closeDrawer(); renderHome(); return; }
  const pp = t.closest("[data-pop]"); if(pp){ openPop(pp.dataset.pop); return; }
  const sp = t.closest(".pspk");
  if(sp){ const k = +sp.dataset.p; if(Q && Q.mode === "p"+k){ stopSpeech(); return; }
    const s = S[cur]; sayQueue([{text:s.paras[k][0], mood:s.paras[k][2], el:$("#p"+k), clip:`s${pad(cur+1)}-${pad(k+1)}`}], "p"+k); return; }
  if(t.closest("#playAll")){
    if(Q && Q.mode === "all"){ Q.paused ? resumeSpeech() : pauseSpeech(); return; }
    const s = S[cur]; sayQueue(s.paras.map((p,k)=>({text:p[0], mood:p[2], el:$("#p"+k), clip:`s${pad(cur+1)}-${pad(k+1)}`})), "all"); return; }
  if(t.closest("#playRe")){ const s = S[cur]; sayQueue(s.paras.map((p,k)=>({text:p[0], mood:p[2], el:$("#p"+k), clip:`s${pad(cur+1)}-${pad(k+1)}`})), "all"); return; }
  if(t.closest("#zhBtn")){ setZh(!showZh); return; }
  const qo = t.closest(".qo button"); if(qo){ answer(+qo.closest(".q").dataset.q, +qo.dataset.o); return; }
  if(t.closest("#stampBtn")){ stamp(); return; }
  const say = t.closest("[data-say]"); if(say){ sayWord(say.dataset.say, say.dataset.lang); return; }
  const star = t.closest("[data-star]");
  if(star){ const k = star.dataset.star, i = stars.indexOf(k); if(i < 0) stars.push(k); else stars.splice(i,1); store.set("stars", stars);
    openPop(k); toast(i < 0 ? "收藏到詞彙的「我的收藏」" : "取消收藏"); if(!$("#p-words").hidden) buildWords(); return; }
  if(t.closest("[data-close]")){ closePop(); return; }
  if(pop.classList.contains("on") && !t.closest("#pop")) closePop();
  if(!$("#mp").hidden && !t.closest("#mp") && !t.closest("#musicBtn")) $("#mp").hidden = true;
});
document.addEventListener("keydown", e=>{
  if((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("g")){ e.preventDefault(); openPop(e.target.dataset.k); }
  if(e.key === "Escape"){ closePop(); closeDrawer(); $("#mp").hidden = true; }
});
$("#menuBtn").onclick = ()=>openDrawer("toc");
$("#setBtn").onclick = ()=>openDrawer("set");
$("#dClose").onclick = closeDrawer;
$("#scrim").onclick = closeDrawer;
$("#brand").onclick = ()=>renderHome();
$("#tabs").onclick = e=>{ const b = e.target.closest("button"); if(b) switchPane(b.dataset.p); };
$("#q").addEventListener("input", search);
$("#wseg").onclick = e=>{ const b = e.target.closest("button"); if(b){ wmode = b.dataset.w; buildWords(); } };
$("#sizes").onclick = e=>{ const b = e.target.closest("button"); if(b){ fs = +b.dataset.v; store.set("fs", fs); applyFs(); } };
$("#rates").onclick = e=>{ const b = e.target.closest("button"); if(b){ rate = +b.dataset.v; store.set("rate", rate); applyRate(); } };
$("#zhset").onclick = e=>{ const b = e.target.closest("button"); if(b){ store.set("zhdef", !!+b.dataset.v); applyZhDef(); setZh(!!+b.dataset.v); } };
$("#themes").onclick = e=>{ const b = e.target.closest("button"); if(b){ store.set("theme", b.dataset.v); applyTheme(); } };
$("#voiceSel").onchange = e=>{
  const v = e.target.value === "" ? null : VOICES.all[+e.target.value];
  voiceURI = v ? v.voiceURI : ""; store.set("voiceURI", voiceURI); pickVoice();
  if(v && SYN){ SYN.cancel(); const u = new SpeechSynthesisUtterance("Hello! Shall we read a story?"); u.voice = v; u.lang = v.lang; u.rate = rate; SYN.speak(u); }
};
let resetArm = 0;
$("#resetBtn").onclick = ()=>{
  if(Date.now() - resetArm > 4000){ resetArm = Date.now(); $("#resetBtn").textContent = "確定要清除嗎？再按一次"; setTimeout(()=>{ $("#resetBtn").textContent = "清除閱讀紀錄"; }, 4000); return; }
  read = {}; quiz = {}; stars = []; ["read","quiz","stars","pos"].forEach(store.del); resetArm = 0;
  $("#resetBtn").textContent = "清除閱讀紀錄"; toast("閱讀紀錄已清除"); closeDrawer(); renderHome();
};
/* music panel */
$("#tracks").innerHTML = Music.TR.map((t,i)=>`<button class="trk" data-t="${i}"><span class="pl">▶</span><span><span class="tn">${esc(t.n)}</span><span class="tz">${esc(t.z)}</span></span></button>`).join("");
$("#tracks").onclick = e=>{ const b = e.target.closest(".trk"); if(!b) return; const i = +b.dataset.t; if(Music.cur === i) Music.stop(); else Music.play(i); };
$("#musicBtn").onclick = ()=>{ $("#mp").hidden = !$("#mp").hidden; };
$("#mStop").onclick = ()=>Music.stop();
$("#vol").value = Math.round(Music.vol*100);
$("#vol").addEventListener("input", e=>Music.setVol(e.target.value/100));

/* ---------------- cover ---------------- */
function leaveCover(){ document.body.classList.remove("cover"); Scene.stop(); }
/* cover: START = music on + open the book where the reader left off; MUSIC = toggle music, stay on the cover */
$("#goBtn").onclick = e=>{ e.stopPropagation(); if(Music.cur < 0) Music.play(storyTrack(cur)); leaveCover(); };
$("#coverMusic").onclick = e=>{ e.stopPropagation(); if(Music.cur < 0) Music.play(storyTrack(cur)); else Music.stop(); };
["touchend","click"].forEach(t=>document.addEventListener(t, ()=>Music.wake(), true));

/* ---------------- boot ---------------- */
function boot(){
  $("#cvK").textContent = LEVEL.kicker; $("#cvZ").textContent = LEVEL.zh; $("#brandLv").textContent = `L${LEVEL.n} · ${LEVEL.cefr}`;
  applyFs(); applyRate(); applyZhDef(); applyTheme(); setZh(showZh); Music.ui();
  const p = store.get("pos", -1);
  if(p >= 0 && p < S.length) renderStory(p); else renderHome();
  document.body.classList.add("cover"); Scene.start();
}
boot();

</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kettlebrook · Player's Book</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#15111f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Jersey+15&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15111f; --bg2:#1b1528; --panel:#221a31; --panel2:#2b2140; --ink:#f3eadb; --muted:#ab9fc0; --line:#3d3156; --line2:#54466f;
  --gold:#f4c542; --gold2:#e0952f; --red:#e0604f; --green:#7cc58a; --blue:#86b6ff; --purple:#b48cff; --shadow:rgba(0,0,0,.45);
  --on-gold:#1d1426;
  --f-px:'Jersey 15',"PingFang TC","Noto Sans TC",monospace;
  --f-body:'Atkinson Hyperlegible',"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-zh:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --fs:17px;
}
:root[data-theme="light"]{
  --bg:#efe4cc; --bg2:#e7dabd; --panel:#fbf4e4; --panel2:#f1e5c9; --ink:#2a2032; --muted:#6c607c; --line:#d4c29c; --line2:#bca77c;
  --gold:#a8740f; --gold2:#b8591c; --red:#b6402f; --green:#2f7a42; --blue:#2f5fb0; --purple:#6a3fb0; --shadow:rgba(80,50,20,.25);
  --on-gold:#fff8e6;
}
html,body{background:var(--bg) !important;}
*{box-sizing:border-box;}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
a{color:var(--blue);}
.px{font-family:var(--f-px);font-weight:400;letter-spacing:.03em;}
.zh{font-family:var(--f-zh);color:var(--muted);font-size:.86em;line-height:1.55;}
body.nozh .zh{display:none !important;}
.muted{color:var(--muted);}
.hide{display:none !important;}
h1,h2,h3{font-family:var(--f-px);font-weight:400;letter-spacing:.03em;line-height:1.05;margin:0;}
h2{font-size:30px;} h3{font-size:22px;}
.gold{color:var(--gold);}

/* ---------- title ---------- */
#title{position:fixed;inset:0;z-index:50;background:#0c0816;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px;overflow:hidden;}
body:not(.titled) #title{display:none;}
#title .stage{width:min(96vw,calc(62vh * 16 / 9),960px);aspect-ratio:16/9;position:relative;box-shadow:0 0 0 3px #3a2a52,0 0 0 6px #120a1e,0 18px 50px rgba(0,0,0,.6);}
#title canvas{width:100%;height:100%;image-rendering:pixelated;display:block;}
#title h1{font-size:clamp(44px,10vw,84px);color:#f4c542;text-shadow:3px 3px 0 #7a2a1a,6px 6px 0 #1a0e24;text-align:center;margin-top:6px;}
#title .sub{font-family:var(--f-zh);color:#e8dcc6;letter-spacing:.3em;font-size:15px;margin-top:-4px;}
#title .kick{font-family:var(--f-px);color:#b99be0;letter-spacing:.16em;font-size:16px;}
#title .go{font-family:var(--f-px);font-size:26px;background:#f4c542;color:#1d1426;border:0;padding:8px 30px 10px;box-shadow:0 5px 0 #9a6a14,0 5px 0 3px #1a0e24;border-radius:4px;margin-top:6px;}
#title .go:active{transform:translateY(4px);box-shadow:0 1px 0 #9a6a14;}
#title .tap{font-family:var(--f-px);color:#8f7fb0;font-size:15px;letter-spacing:.12em;animation:blink 1.4s steps(2) infinite;}
#title .cc{font-size:11px;color:#6d5f86;text-align:center;max-width:560px;}
/* title screen on short screens (laptops): never cut off the Open button; scroll if it still doesn't fit */
#title{overflow-y:auto;justify-content:flex-start;overscroll-behavior:contain;}
body.titled{overflow:hidden;} #title{scrollbar-width:thin;scrollbar-color:#3a2a52 transparent;}
#title > :first-child{margin-top:auto;} #title > :last-child{margin-bottom:auto;}
#title > *{flex:none;}
@media (max-height:1000px){
  #title{gap:6px;padding:10px 16px;}
  #title .stage{width:min(96vw,calc(40vh * 16 / 9),960px);}
  #title .kick{line-height:1.3;}
  #title .tap{font-size:13px;}
  #title h1{font-size:clamp(30px,6.4vh,56px) !important;margin-top:2px;}
  #title .kick{font-size:14px;}
  #title .go{font-size:22px;padding:6px 26px 8px;}
}
@media (max-height:560px){ #title .stage{width:min(96vw,calc(34vh * 16 / 9),960px);} #title .kick{font-size:12px;letter-spacing:.1em;} }
@keyframes blink{50%{opacity:.35}}

/* ---------- toolbar ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--bg2);border-bottom:3px solid var(--line);display:flex;align-items:center;gap:6px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));}
.bar .logo{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;}
.bar .logo canvas{width:86px;height:36px;image-rendering:pixelated;border:2px solid var(--line2);border-radius:3px;flex:none;background:#0c0816;}
.bar .logo b{font-family:var(--f-px);font-weight:400;font-size:24px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ib{width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--line);background:var(--panel);border-radius:6px;padding:0;font-size:20px;line-height:1;flex:none;box-shadow:0 3px 0 var(--shadow);}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow);}
.ib.on{border-color:var(--gold);color:var(--gold);}
.ib svg{width:22px;height:22px;fill:currentColor;}

main{max-width:780px;margin:0 auto;padding:14px 16px 110px;}
.crumbs{display:flex;gap:6px;align-items:center;margin:0 0 10px;flex-wrap:wrap;}

/* ---------- panels & buttons ---------- */
.panel{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:14px;box-shadow:4px 4px 0 var(--shadow);margin:0 0 14px;}
.panel.tight{padding:10px 12px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-px);font-size:21px;line-height:1;padding:9px 16px 11px;border:2px solid var(--line2);background:var(--panel2);border-radius:5px;box-shadow:0 4px 0 var(--shadow);min-height:44px;}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow);}
.btn.pri{background:var(--gold);color:var(--on-gold);border-color:var(--gold);}
.btn.red{background:transparent;color:var(--red);border-color:var(--red);}
.btn.sm{font-size:17px;padding:6px 11px 7px;min-height:36px;}
.btn[disabled]{opacity:.45;pointer-events:none;}
.btn small{font-family:var(--f-zh);font-size:13px;opacity:.85;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.row.end{justify-content:flex-end;}
.row.sp{justify-content:space-between;}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}

/* choice cards */
.card{position:relative;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px 12px;box-shadow:0 3px 0 var(--shadow);display:block;width:100%;}
.card:hover{border-color:var(--line2);}
.card.sel{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 0 2px var(--gold) inset,0 3px 0 var(--shadow);}
.card .t{font-family:var(--f-px);font-size:22px;line-height:1.05;display:flex;align-items:center;gap:8px;}
.card .t .ico{width:28px;height:28px;flex:none;image-rendering:pixelated;}
.card .d{font-size:14.5px;margin-top:4px;line-height:1.45;}
.card .zh{font-size:13px;margin-top:2px;display:block;}
.card .badge{display:inline-block;margin:0 0 6px;}
.card .t .badge{margin:0 0 0 4px;}
.badge{font-family:var(--f-px);font-size:14px;line-height:1;padding:3px 7px 4px;border-radius:3px;background:var(--gold);color:var(--on-gold);}
.badge.soft{background:var(--panel2);color:var(--muted);border:1px solid var(--line2);}
.stars{font-family:var(--f-px);color:var(--gold);font-size:15px;letter-spacing:1px;}

/* term chips (tap to explain) */
.term{border-bottom:2px dotted var(--gold2);cursor:help;}
.info{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--gold2);color:var(--gold2);font-size:12px;line-height:1;cursor:help;vertical-align:middle;font-family:var(--f-body);font-weight:700;}
.info:active{transform:scale(.9);}
.say{border:0;background:none;padding:0 2px;font-size:.95em;line-height:1;cursor:pointer;vertical-align:baseline;filter:saturate(.8);}
.say:active{transform:scale(.9);}

/* steps */
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 12px;}
.steps button{font-family:var(--f-px);font-size:15px;border:2px solid var(--line);background:var(--panel);border-radius:4px;padding:3px 8px 4px;color:var(--muted);}
.steps button.on{border-color:var(--gold);color:var(--gold);}
.steps button.ok{color:var(--green);}
.tip{display:flex;gap:10px;background:var(--panel2);border:2px dashed var(--line2);border-radius:6px;padding:10px 12px;margin:0 0 14px;font-size:15px;}
.tip .i{font-size:22px;line-height:1;}
.tip p{margin:0;}
.tip .zh{display:block;}
.tip .ico{width:30px;height:30px;image-rendering:pixelated;}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg2);border-top:3px solid var(--line);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));}
.navbar .in{max-width:780px;margin:0 auto;display:flex;gap:10px;align-items:center;}
.navbar .in .grow{flex:1;min-width:0;font-size:14px;color:var(--muted);text-align:center;}

/* ability boxes */
.abgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
@media (min-width:620px){ .abgrid{grid-template-columns:repeat(6,1fr);} }
.ab{background:var(--panel);border:2px solid var(--line);border-radius:6px;text-align:center;padding:8px 4px 10px;position:relative;}
button.ab{width:100%;}
.ab.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;}
.ab .n{font-family:var(--f-px);font-size:17px;color:var(--muted);line-height:1;}
.ab .m{font-family:var(--f-px);font-size:38px;line-height:.95;margin:4px 0 2px;}
.ab .v{display:inline-block;font-family:var(--f-px);font-size:17px;border:2px solid var(--line2);border-radius:20px;padding:0 10px 1px;}
.ab .plus{font-family:var(--f-px);font-size:14px;color:var(--green);}
.ab.prim::after{content:"★";position:absolute;top:3px;right:6px;color:var(--gold);font-size:13px;}

/* sheet */
.stat3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:6px;text-align:center;padding:6px 4px 8px;}
.stat .k{font-family:var(--f-px);font-size:15px;color:var(--muted);line-height:1.1;}
.stat .val{font-family:var(--f-px);font-size:32px;line-height:1;}
.hpbox{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;}
.hpbar{height:18px;background:var(--bg);border:2px solid var(--line2);border-radius:3px;overflow:hidden;position:relative;}
.hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--red),#f08a5b);transition:width .3s;}
.hpbar i.tmp{background:var(--blue);opacity:.7;}
.hpnum{font-family:var(--f-px);font-size:34px;line-height:1;}
.hpnum small{font-size:20px;color:var(--muted);}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;border-bottom:3px solid var(--line);}
.tabs::-webkit-scrollbar{display:none;}
.tabwrap{position:relative;}
.tabarrow{position:absolute;top:0;bottom:15px;width:34px;border:0;padding:0;color:var(--gold);font-size:14px;display:grid;place-items:center;z-index:2;}
.tabarrow[hidden]{display:none;}
.tabarrow.l{left:0;background:linear-gradient(to right,var(--bg) 55%,transparent);justify-content:start;padding-left:2px;}
.tabarrow.r{right:0;background:linear-gradient(to left,var(--bg) 55%,transparent);justify-content:end;padding-right:2px;}
.tabs button{font-family:var(--f-px);font-size:19px;border:0;background:none;color:var(--muted);padding:6px 10px 7px;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap;}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold);}
.list{display:grid;gap:6px;}
.li{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:5px;padding:7px 10px;}
.li .main{flex:1;min-width:0;}
.li .main b{font-weight:700;}
.li .main .zh{display:block;}
.li .num{font-family:var(--f-px);font-size:22px;min-width:40px;text-align:center;}
button.li{width:100%;text-align:left;}
.pip{width:22px;height:22px;border:2px solid var(--line2);border-radius:4px;background:var(--bg);display:inline-block;vertical-align:middle;padding:0;}
.pip.on{background:var(--gold);border-color:var(--gold);}
.pip.x{background:var(--red);border-color:var(--red);}
.pips{display:flex;gap:5px;flex-wrap:wrap;}
.skill{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:5px 8px;border-radius:4px;background:none;border:0;width:100%;text-align:left;}
.skill:nth-child(odd){background:var(--panel);}
.skill .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);}
.skill .dot.p{background:var(--gold);border-color:var(--gold);}
.skill .dot.e{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--gold);}
.skill .b{font-family:var(--f-px);font-size:20px;}
.skill .ab3{font-family:var(--f-px);font-size:13px;color:var(--muted);margin-left:4px;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;}
.kv dt{color:var(--muted);}
.kv dd{margin:0;}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--bg);border:2px solid var(--line2);border-radius:5px;padding:8px 10px;}
textarea{min-height:70px;resize:vertical;}
label.fl{display:block;font-weight:700;margin:10px 0 4px;}
label.fl .zh{font-weight:400;margin-left:6px;}

/* roster */
.slot{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;text-align:left;}
.por{width:64px;height:64px;flex:none;image-rendering:pixelated;background:var(--bg);border:2px solid var(--line2);border-radius:4px;padding:6px;}
.slotsfree{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;padding:8px 12px;border:2px dashed var(--line);border-radius:6px;color:var(--muted);font-size:14px;letter-spacing:2px;}
.slotsfree span{letter-spacing:0;}
.howcard{display:block;width:100%;text-align:left;margin-top:12px;border-color:var(--gold);} .howcard .t{font-family:var(--f-px);font-size:21px;color:var(--gold);} .howcard .d{font-size:15px;margin-top:4px;}
.pillars{margin-top:10px;} .pillars .card{text-align:left;} .pillars .t{font-family:var(--f-px);font-size:20px;}
.pillars .d{font-size:15px;margin-top:6px;}
.abhelp{margin:6px 0 0;padding-left:20px;} .abhelp li{margin-bottom:8px;} .abhelp .zh{display:block;}
.slot.empty{border-style:dashed;color:var(--muted);grid-template-columns:1fr;text-align:center;padding:18px;}
.slot .nm{font-family:var(--f-px);font-size:25px;line-height:1;}

/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:rgba(8,5,14,.72);display:none;align-items:flex-end;justify-content:center;}
.ov.on{display:flex;}
.sheet{background:var(--panel);border:3px solid var(--line2);border-bottom:0;border-radius:10px 10px 0 0;width:min(100%,640px);max-height:88vh;overflow:auto;padding:14px 16px;padding-bottom:max(18px,env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.4);}
@media (min-width:700px){ .ov{align-items:center;} .sheet{border-radius:10px;border-bottom:3px solid var(--line2);} }
.sheet .hd{display:flex;align-items:center;gap:10px;margin:0 0 10px;}
.sheet .hd h3{flex:1;}
.pop h3{font-size:28px;color:var(--gold);}
.pop .zhbig{font-family:var(--f-zh);font-size:18px;margin:2px 0 8px;}

/* dice */
.dice{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.die{aspect-ratio:1;border:2px solid var(--line2);background:var(--panel2);border-radius:6px;display:grid;place-items:center;padding:2px;box-shadow:0 3px 0 var(--shadow);}
.die svg{width:78%;height:78%;}
.die span{font-family:var(--f-px);font-size:16px;line-height:1;margin-top:-4px;}
.die.on{border-color:var(--gold);}
.tray{min-height:120px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:10px;margin:10px 0;}
.rd{width:58px;height:58px;display:grid;place-items:center;position:relative;}
.rd svg{position:absolute;inset:0;width:100%;height:100%;}
.rd b{position:relative;font-family:var(--f-px);font-weight:400;font-size:26px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.5);}
.rd.drop{opacity:.35;}
.rd.spin{animation:spin .5s steps(6) infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.total{font-family:var(--f-px);font-size:54px;line-height:1;text-align:center;}
.total.crit{color:var(--gold);text-shadow:0 0 12px var(--gold);}
.total.fail{color:var(--red);}
.hist{font-size:13.5px;color:var(--muted);max-height:120px;overflow:auto;}
.seg{display:inline-flex;border:2px solid var(--line2);border-radius:5px;overflow:hidden;}
.seg button{border:0;background:var(--panel);padding:6px 10px;font-family:var(--f-px);font-size:17px;}
.seg button.on{background:var(--gold);color:var(--on-gold);}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;transition:all .25s;z-index:60;background:var(--ink);color:var(--bg);font-size:15px;padding:9px 16px;border-radius:6px;max-width:90vw;text-align:center;pointer-events:none;}
#toast.on{opacity:1;transform:translate(-50%,0);}
#mp{position:fixed;top:58px;right:10px;z-index:35;width:min(92vw,21rem);max-height:calc(100vh - 72px);max-height:calc(100dvh - 72px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--panel);border:3px solid var(--line2);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.35);padding:10px;}
.trk{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;}
.trk:hover{background:var(--panel2);}
.trk .pl{width:36px;height:36px;border-radius:4px;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-size:13px;}
.trk.on{border-color:var(--gold);}
.trk .tn{font-family:var(--f-px);font-size:19px;display:block;line-height:1.1;}
.trk .tz{font-family:var(--f-zh);font-size:12.5px;color:var(--muted);display:block;}
.vol{display:flex;align-items:center;gap:10px;margin:8px 4px 2px;font-size:13px;color:var(--muted);}
.vol input{flex:1;accent-color:var(--gold);}
.lvup{animation:glow 1.2s ease-in-out 2;}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--gold),0 0 24px var(--gold);}}
.qopt{display:grid;gap:8px;}
.qopt .card{padding:12px 14px;}
.hero-toggle{font-size:14px;margin:8px 0 0;}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line2);border-radius:20px;padding:3px 10px;font-size:14px;background:var(--panel);margin:2px;}
.chip.sel{border-color:var(--gold);background:var(--gold);color:var(--on-gold);}
.chip.sel .zh{color:inherit;opacity:.85;}
.lock{border:2px solid var(--line2);background:var(--panel2);border-radius:5px;width:36px;height:36px;display:grid;place-items:center;font-size:17px;padding:0;}
.lock.on{border-color:var(--gold);background:var(--gold);}
.rev{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--line);}
.rev:last-child{border-bottom:0;}
.rev .k{font-family:var(--f-px);font-size:15px;color:var(--muted);line-height:1;}
.rev .v{font-size:16px;}
.rev .v b{font-family:var(--f-px);font-weight:400;font-size:22px;}
.rev .act{display:flex;gap:6px;}

    mar:  {mods:[{r:4,i:2.4,d:.09}], a:.002, dec:.55, sus:0, g:.13, lp:4200},

    const n = 4000, buf = new ArrayBuffer(44+n), v = new DataView(buf), w = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };

    s.connect(f); f.connect(g); g.connect(dest); s.onended=()=>{ s.disconnect(); f.disconnect(); g.disconnect(); }; s.start(t, Math.random()*.5); s.stop(t+1.2);
  }
  function tick(){
    const T=TRACKS[cur], sd=60/T.bpm/2;
    while(nextT < ctx.currentTime+.25){
      const sw = step%2 ? sd*T.swing : 0;
      T.parts.forEach(pt=>{ const e=pt.q.ev[step%pt.q.n]; if(!e) return;

        e.ms.forEach((m,k)=>voice(nextT+sw+(pt.strum||0)*k, m, e.len*sd*.96, P[pt.p], pt.vel)); });

  function stop(){ clearInterval(timer); timer=null; cur=-1; if(ctx) applyVol(); ui(); }
  function ui(){
    const b = $("#musicBtn"); if(b) b.classList.toggle("on", cur >= 0);
    $$(".trk").forEach(b=>{ const on = +b.dataset.trk === cur; b.classList.toggle("on", on); b.querySelector(".pl").textContent = on ? "❚❚" : "▶"; });
    const c = $("#coverMusic"); if(c) c.textContent = cur >= 0 ? "♪ " + TRACKS[cur].n.toUpperCase() + " · " + TRACKS[cur].z.split("・")[0] : "♪ TAP FOR MUSIC 點一下播放音樂";
  }
  document.addEventListener("visibilitychange", ()=>{
    if(!ctx || cur < 0) return;
    if(document.hidden){ clearInterval(timer); ctx.suspend(); }
    else ctx.resume().then(()=>{ nextT = ctx.currentTime + .05; clearInterval(timer); timer = setInterval(tick,40); });
  });
  /* ---- sound effects ---- */
  const N = n => midi(n);
  function sfx(kind){
    if(sfxVol <= 0 || !start()) return;
    const t = ctx.currentTime + .02;
    if(kind === "roll"){ for(let i=0;i<7;i++) drum(t+i*.05+Math.random()*.02, i%2?"h":"s", .5 + Math.random()*.3, fx); }
    else if(kind === "crit"){ ["C5","E5","G5","C6","E6","G6"].forEach((n,i)=>voice(t+i*.07, N(n), .25, P.bell, 1.4, fx)); voice(t+.45, N("C4"), .8, P.brass, 1.6, fx); voice(t+.45, N("G4"), .8, P.brass, 1.4, fx); voice(t+.45, N("C5"), .8, P.brass, 1.4, fx); }
    else if(kind === "fail"){ ["G3","F#3","F3","E3"].forEach((n,i)=>voice(t+i*.22, N(n), i===3?.6:.18, P.brass, 1.3, fx)); }
    else if(kind === "click"){ voice(t, N("E6"), .03, P.mar, .6, fx); }
    else if(kind === "ok"){ voice(t, N("C6"), .06, P.bell, .9, fx); voice(t+.08, N("G6"), .1, P.bell, .9, fx); }
    else if(kind === "save"){ ["G5","C6","E6"].forEach((n,i)=>voice(t+i*.09, N(n), .2, P.bell, 1.1, fx)); }
    else if(kind === "heal"){ ["C6","E6","G6","B6"].forEach((n,i)=>voice(t+i*.06, N(n), .2, P.bell, .8, fx)); }
    else if(kind === "hurt"){ drum(t, "k", 1, fx); drum(t+.02, "s", .6, fx); }
    else if(kind === "level"){ ["C5","E5","G5","C6"].forEach((n,i)=>voice(t+i*.12, N(n), .12, P.brass, 1.4, fx)); voice(t+.5, N("C6"), .9, P.brass, 1.5, fx); voice(t+.5, N("E5"), .9, P.brass, 1.3, fx); voice(t+.5, N("G5"), .9, P.brass, 1.3, fx); drum(t+.5, "c", 1, fx); }
    else if(kind === "page"){ const s=ctx.createBufferSource(); s.buffer=noise; const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.setValueAtTime(900,t); f.frequency.linearRampToValueAtTime(3000,t+.15); const g=ctx.createGain(); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.2); s.connect(f); f.connect(g); g.connect(fx); s.onended=()=>{ s.disconnect(); f.disconnect(); g.disconnect(); }; s.start(t); s.stop(t+.25); }
  }
  /* one struck bell (used by the Kettlebrook bell door): the note plus a soft octave below */
  function ring(n, vel){ if(sfxVol <= 0 || !start()) return; const t = ctx.currentTime + .02, v = vel || 1;
    voice(t, N(n), .5, P.bell, 1.5*v, fx); voice(t, N(n)-12, 1.2, P.bell, .7*v, fx); voice(t+.01, N(n)+12, .15, P.mar, .25*v, fx); }
  function noise2(t, f0, f1, dur, g){ const s=ctx.createBufferSource(); s.buffer=noise; const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.setValueAtTime(f0,t); f.frequency.linearRampToValueAtTime(f1,t+dur); const gg=ctx.createGain(); gg.gain.setValueAtTime(g,t); gg.gain.exponentialRampToValueAtTime(.001,t+dur); s.connect(f); f.connect(gg); gg.connect(fx); s.onended=()=>{ s.disconnect(); f.disconnect(); gg.disconnect(); }; s.start(t, Math.random()*.5); s.stop(t+dur+.05); }
  function sfx2(kind){ if(sfxVol <= 0 || !start()) return; const t = ctx.currentTime + .02;
    if(kind === "clunk"){ drum(t, "t", .8, fx); voice(t, N("C3"), .12, P.mar, 1, fx); }
    else if(kind === "zip"){ noise2(t, 600, 4000, .18, .18); voice(t+.12, N("G6"), .05, P.bell, .7, fx); }
    else if(kind === "door"){ drum(t, "k", 1, fx); noise2(t+.1, 200, 90, 1.6, .22); [0,.25,.5,.75,1].forEach((d,i)=>voice(t+.2+d, N(["C4","G3","C4","G3","C3"][i]), .1, P.mar, .9, fx)); ["G4","C5","E5","G5","C6"].forEach((n,i)=>voice(t+1.4+i*.1, N(n), .5, P.bell, 1.1, fx)); }
  }
  function addTrack(tr){ tr.parts.forEach(p=>p.q=parse(p.s)); TRACKS.push(tr); return TRACKS.length - 1; }
  return { play, stop, ui, sfx, start, ring, sfx2, addTrack,
    get cur(){ return cur; },
    setVol(v){ vol=v; store.set("vol", Math.round(v*100)); if(ctx) applyVol(); }, get vol(){ return vol; },
    setSfx(v){ sfxVol=v; store.set("sfx", Math.round(v*100)); if(fx) fx.gain.value=v; }, get sfxVol(){ return sfxVol; },
    duck(on){ ducked=on; if(ctx) applyVol(); } };
})();

const SYN = window.speechSynthesis || null;
let rate = store.get("rate", .85);
let voiceURI = store.get("voiceURI", "");
const VOICES = {all:[], main:null};
const FEM = /Samantha|Ava|Allison|Susan|Zira|Aria|Jenny|Michelle|Emma|Joanna|Salli|Kendra|Kimberly|Ivy|Karen|Moira|Tessa|Victoria|Serena|Kate|Fiona|Veena|Libby|Sonia|Natasha|Nicky|Sara|Female|Google US English/i;
const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Ralph|Fred|Kathy|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
/* 0 normal, 1 enhanced, 2 premium — iPhone gives enhanced voices the same name, so read the voiceURI too */
function vq(v){ const s = (v.voiceURI || "") + " " + v.name;
  if(/premium|高品質|優質/i.test(s)) return 2; if(/enhanced|增強|加強|Natural|Neural|Online/i.test(s)) return 1; return 0; }
const QLABEL = ["一般音質","增強音質","高品質"];
function pickVoice(){
  if(!SYN) return;
  const us = v => /^en[-_]US/i.test(v.lang) ? 0 : 1, hq = v => 2 - vq(v);
  const vs = SYN.getVoices().filter(v=>/^en/i.test(v.lang) && !NOVELTY.test(v.name)).sort((a,b)=>us(a)-us(b) || hq(a)-hq(b));
  VOICES.all = vs;
  VOICES.main = vs.find(v=>v.voiceURI === voiceURI)
    || vs.find(v=>us(v)===0 && /Samantha|Google US English|Aria|Jenny|Ava|Allison/i.test(v.name)) || vs.find(v=>FEM.test(v.name)) || vs[0] || null;
}
if(SYN){ pickVoice(); SYN.onvoiceschanged = pickVoice; }
let sayId = 0;
function say(text, btn){
  if(!SYN){ toast("This browser can't read aloud. 這個瀏覽器不支援朗讀"); return; }
  const my = ++sayId; SYN.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/[’‘]/g,"'").replace(/×/g," times ").replace(/\bd(\d+)\b/g,"d $1").replace(/\bAC\b/g,"A C").replace(/\bHP\b/g,"H P").replace(/\bDC\b/g,"D C").replace(/\bDM\b/g,"D M").replace(/\bXP\b/g,"X P"));
  const v = VOICES.main; if(v){ u.voice = v; u.lang = v.lang; } else u.lang = "en-US";  /* iOS ignores a voice whose lang doesn't match */
  u.rate = rate; Music.duck(true);
  if(btn) btn.classList.add("live");
  const end = ()=>{ if(my === sayId){ Music.duck(false); } if(btn) btn.classList.remove("live"); };
  u.onend = end; u.onerror = end; SYN.speak(u);
}
/* iOS unlocks speech only when speak() runs inside a tap */
let speechUnlocked = false;
function unlockSpeech(){ if(speechUnlocked || !SYN) return; speechUnlocked = true;
  try{ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; u.lang = "en-US"; SYN.speak(u); }catch(e){} }
["touchend","click","keydown"].forEach(t=>document.addEventListener(t, unlockSpeech, true));

const NUMW = ["twelve","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];

  do { h = 1 + rnd(12); m = C.hard ? rnd(12)*5 : [0,30,15,45][rnd(4)]; } while(h === C.h && m === C.m);
  C.h = h; C.m = m; }
clockNew();
function clockWords(h, m){
  const next = h % 12 + 1;
  let en, en2 = `${NUMW[h]} ${m === 0 ? "o'clock" : m < 10 ? "oh " + ["","","","","","five"][m] : ({15:"fifteen",30:"thirty",45:"forty-five",10:"ten",20:"twenty",25:"twenty-five",35:"thirty-five",40:"forty",50:"fifty",55:"fifty-five"})[m]}`;
  if(m === 0) en = `${NUMW[h]} o'clock`;
  else if(m === 15) en = `quarter past ${NUMW[h]}`;
  else if(m === 30) en = `half past ${NUMW[h]}`;
  else if(m === 45) en = `quarter to ${NUMW[next]}`;
  else if(m < 30) en = `${({5:"five",10:"ten",20:"twenty",25:"twenty-five"})[m]} past ${NUMW[h]}`;
  else en = `${({35:"twenty-five",40:"twenty",50:"ten",55:"five"})[m]} to ${NUMW[next]}`;
  const zhN = ["十二","一","二","三","四","五","六","七","八","九","十","十一","十二"];
  const zm = {5:"零五",10:"十",15:"十五",20:"二十",25:"二十五",35:"三十五",40:"四十",45:"四十五",50:"五十",55:"五十五"};

    ${ticks}${nums}

const msame = (a,b) => a.s === b.s && a.c === b.c && a.p === b.p;
const mdiff = (a,b) => (a.s !== b.s) + (a.c !== b.c) + (a.p !== b.p);
function marbleDeal(){ const M = MARB, cols = Object.keys(MCOL), pats = Object.keys(MPAT), pile = [], used = [];
  const rand = () => ({s: rnd(2) ? "big" : "small", c: cols[rnd(cols.length)], p: pats[rnd(pats.length)]});
  const RED = {s:"big", c:"red", p:"starry"};   /* the fifth royal marble rolled away: never in the pit */
  const ok = m => !MROYAL.some(r=>msame(r,m)) && !msame(RED,m) && !used.some(u=>msame(u,m));

const MIMG = {};

const KScene = (()=>{

    for(let yy=cy-r;yy<=cy+r;yy++) for(let xx=cx-r;xx<=cx+r;xx++){ if(xx<0||yy<0||xx>=W||yy>=H) continue;
      const dd=Math.hypot(xx-cx,(yy-cy)*1.1)/r; if(dd>1) continue; const t=(1-dd)*(1-dd)*str, b=(B4[yy&3][xx&3]+.5)/16;
      const i=(yy*W+xx)*4, a = t>b ? .5 : t>b*.5 ? .22 : 0; if(a){ d[i]+=(c[0]-d[i])*a; d[i+1]+=(c[1]-d[i+1])*a; d[i+2]+=(c[2]-d[i+2])*a; } } };
  function Layer(){ const a = new Uint8Array(W*H);

      get(px,py){ if(px<0||py<0||px>=W||py>=H) return 0; return a[py*W+px]; },

      line(x0,y0,x1,y1,c){ const n=Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0)))||1; for(let i=0;i<=n;i++) L.set(x0+(x1-x0)*i/n, y0+(y1-y0)*i/n, c); } };

    const c = document.createElement("canvas"); c.width = PW; c.height = PH; const g = c.getContext("2d"), im = g.createImageData(PW,PH), q = im.data;

ng people · 形容人","list":[["loud / quiet","大聲的／安靜的"],["meek ★","溫順的、軟弱的"],["grumpy ★","脾氣不好的"],["huffy ★","氣呼呼的"],["proud","驕傲的"],["nervous","緊張的"],["hungry","餓的"],["professional ★","專業的"]]},{"h":"Sounds · 聲音","list":[["to ring","（鐘）響；敲鐘"],["BONG","噹（鐘聲）"],["to honk","（鵝）呱呱叫"],["to shout","大喊"],["to whisper","小聲說"],["to hum","哼歌"],["a lullaby ★","搖籃曲"]]},{"h":"Animals & magic · 動物與魔法","list":[["a beast ★","野獸、動物"],["to change shape ★","變身、變形"],["a familiar ★","魔寵"],["a wing","翅膀"],["a beak","鳥嘴"],["a feather","羽毛"],["to swim","游泳"],["to fly","飛"],["Honk!","呱！（鵝叫聲）"],["Be nice!","乖一點！"],["Good goose!","好鵝！乖鵝！"]]},{"h":"Useful phrases · 實用句子","list":[["It's not fair!","這不公平！"],["Lost and found","失物招領"],["Please ring for service.","需要服務請按鈴。"],["What do you do?","你要做什麼？"],["Where did you go last night?","你昨晚去了哪裡？"],["Can I roll Investigation?","我可以擲調查檢定嗎？"]]},{"idiom":1,"en":"to lose your temper","zh":"發脾氣、失去冷靜","ex":"The Mayor never loses his temper. Not anymore.","exz":"鎮長再也不發脾氣了。現在不會了。","note":"Your *temper* is your mood: how calm or angry you are. When you *lose your temper*, your calm is gone, and you suddenly get very angry and shout. English uses *lose* for lots of things you can't hold in your hand: you can lose your temper, your way (get lost), your nerve (get scared), or your marbles (go a little crazy). In Kettlebrook, some of those things might end up somewhere very strange...","nz":"temper 是你的脾氣、心情：你有多冷靜或多生氣。lose your temper 就是你的冷靜不見了，你突然非常生氣、大吼大叫。英文很多摸不到的東西也可以用 lose（弄丟）：lose your temper（發脾氣）、lose your way（迷路）、lose your nerve（失去勇氣、害怕）、lose your marbles（有點瘋了）。在凱托溪鎮，這些東西有些可能會跑到很奇怪的地方去……"}],"2":[{"h":"Counting and order · 數字與順序","list":[["one, two, three, four, five","一、二、三、四、五"],["first, second, third, fourth, fifth","第一、第二、第三、第四、第五"],["last","最後的"],["next","下一個"],["in the right order","照正確的順序"],["Which one is first?","哪一個是第一個？"]]},{"h":"Songs and sounds · 歌與聲音","list":[["a song / to sing","歌／唱歌"],["a line (of a song) ★","（歌的）一句"],["a rhyme ★","押韻的詩；童謠"],["high / low","高的／低的（聲音）"],["soft / deep","輕柔的／低沉的"],["to chant ★","有節奏地唸"],["to jump rope","跳繩"],["to glow ★","發光"]]},{"h":"The Lost-and-Found · 失物招領處","list":[["a notice board ★","公告欄"],["lost / found","遺失的／找到的"],["a counter","櫃台"],["a drawer","抽屜"],["a cabinet ★","櫃子"],["a shelf / shelves","架子（單數／複數）"],["a key","鑰匙"],["to wind up ★","上發條"],["clockwork ★","發條裝置"],["a clerk ★","辦事員"],["a form","表格"],["a stamp","印章"],["a ticket","票；單子"],["to return","歸還"]]},{"h":"Socks · 襪子","list":[["a sock / a pair of socks","一隻襪子／一雙襪子"],["striped","條紋的"],["spotted","有圓點的"],["starry","有星星的"],["plain","素面的"],["zigzag","鋸齒紋的"],["They match!","它們是一對！"]]},{"h":"Things people lost · 大家弄丟的東西","list":[["a wedding ring","結婚戒指"],["a spoon","湯匙"],["an ear trumpet ★","助聽喇叭"],["a wedding","婚禮"],["a cousin","表／堂兄弟姊妹"],["a recipe ★","食譜"],["cabbage","高麗菜"]]},{"h":"Useful phrases · 實用句子","list":[["Please ring for service.","需要服務請按鈴。"],["Next, please.","下一位。"],["What did you lose?","你弄丟了什麼？"],["When did you lose it?","你什麼時候弄丟的？"],["Does that ring a bell?","有印象嗎？（聽起來耳熟嗎？）"],["I forgot what I was saying.","我忘了我要說什麼。"],["Please, I am a friend.","拜託，我是朋友。"],["What does he say?","他說什麼？"]]},{"idiom":1,"en":"to lose your train of thought","zh":"忘了自己要說什麼、思路中斷","ex":"Barty lost his train of thought. Twelve years later, Tock found it.","exz":"巴提忘了他要說什麼。十二年後，托克找到了他的思路列車。","note":"A *train* is a line of cars, one after another. A *train of thought* is a line of ideas, one after another, like those cars. If you *lose your train of thought*, the line breaks, and you forget what you were going to say. In the Lost-and-Found, it became a real toy train.","nz":"train 是一節接一節的火車車廂。train of thought（思路）就是一個接一個的想法，像一列火車。lose your train of thought 就是這串想法斷掉了，你忘了自己本來要說什麼。在失物招領處裡，它變成了一列真的玩具火車。"},{"idiom":1,"en":"to ring a bell","zh":"聽起來耳熟、有印象","ex":"\"Does 'One for Dora' ring a bell?\" \"RING A BELL? I RING FIVE!\"","exz":"「『一是朵拉』有沒有讓你想起什麼？」「想起什麼？我每天敲五口鐘！」","note":"A bell rings to remind you of something, like a school bell or a doorbell. If a name or a face *rings a bell*, it reminds you of something: you remember it a little, but not everything. Gus is a bell-ringer, so he takes it very personally.","nz":"鈴聲會提醒你某件事，像學校的鐘聲或門鈴。如果一個名字或一張臉 rings a bell，就是它讓你想起了什麼：你記得一點點，但不是全部。格斯是敲鐘的人，所以他對這句話特別有感覺。"}],"3":[{"h":"Telling the time · 看時間","list":[["What time is it?","現在幾點？"],["It's three o'clock.","三點整。"],["It's quarter past three.","三點十五分。"],["It's half past three.","三點半。"],["It's quarter to four.","三點四十五分（差十五分四點）。"],["It's ten past three.","三點十分。"],["It's twenty to four.","三點四十分（差二十分四點）。"],["midnight / noon","午夜／中午"],["a minute / a second / an hour","一分鐘／一秒／一小時"],["late / on time / early","遲到的／準時的／早到的"]]},{"h":"Days · 日子","list":[["Friday / Saturday","星期五／星期六"],["yesterday / today / tomorrow","昨天／今天／明天"],["again","又；再一次"],["the same day","同一天"],["every day","每天"],["a wedding","婚禮"]]},{"h":"The Time Department · 時間部","list":[["a clock / a clock face","時鐘／鐘面"],["the hands (of a clock)","（時鐘的）指針"],["a pendulum ★","鐘擺"],["a gear ★","齒輪"],["an hourglass ★","沙漏"],["sand","沙子"],["a track ★","軌道"],["a bridge","橋"],["a sprite ★","小精靈"],["a cuckoo clock ★","布穀鳥鐘"]]},{"h":"Useful phrases · 實用句子","list":[["I've been here before.","我來過這裡。"],["It happened again!","又發生了！"],["Hurry up!","快一點！"],["We're running out of time.","我們快沒時間了。"],["Just in time!","剛好來得及！"],["Can I try again?","我可以再試一次嗎？"]]},{"idiom":1,"en":"to lose track of time","zh":"忘了時間、沒注意到時間過了多久","ex":"The twins lost track of time jumping rope. The spell took their track.","exz":"雙胞胎跳繩跳到忘了時間。咒語就把他們的「軌道」拿走了。","note":"A *track* is a path, like a railway track. To *keep track* of something means to follow it, so you always know where it is or how it's changing. When you *lose track of time*, you stop following the clock, because you are busy or happy, and you don't know what time it is anymore. In the Lost-and-Found, the \"track\" became a real piece of railway track.","nz":"track 是一條路，像鐵軌（railway track）。keep track of 某件事，就是一直跟著它，所以你總是知道它在哪裡、怎麼變化。lose track of time 就是你因為太忙或太開心，不再注意時鐘，已經不知道現在幾點了。在失物招領處裡，這個 track 變成了一段真的鐵軌。"},{"idiom":1,"en":"to lose your marbles","zh":"（口語）瘋了、失去理智","ex":"\"My king has lost his marbles!\"","exz":"「我的國王失去了他的彈珠！」（也就是：我的國王瘋了！）","note":"*Marbles* are small glass balls children play with. In old American slang, your *marbles* were your good sense. So if someone has *lost their marbles*, they have lost their good sense: they are acting a little crazy. What happens when the Lost-and-Found takes that literally? Chapter 4.","nz":"marbles 是小孩玩的小玻璃彈珠。在老式的美國俚語裡，你的 marbles 指的是你的理智。所以如果有人 lost their marbles，就是他失去了理智：行為有點瘋瘋的。如果失物招領處把這句話當真，會發生什麼事？請看第四章。"}],"4":[{"h":"Describing things · 形容東西","list":[["big / small","大的／小的"],["gold / blue / green / purple / red","金色／藍色／綠色／紫色／紅色"],["striped","有條紋的"],["spotted","有圓點的"],["swirly ★","有漩渦紋的"],["starry","有星星的"],["plain","素面的、沒有花紋的"],["a big gold swirly marble","一顆大的金色漩渦紋彈珠"]]},{"h":"Under the ground · 地底下","list":[["a mine","礦坑"],["a tunnel ★","隧道"],["a hole","洞"],["to dig / dug","挖／挖了"],["a cave","洞穴"],["stone / marble ★","石頭／大理石"],["a lamp / a lantern ★","燈／燈籠"],["to crawl","爬"]]},{"h":"Lost Luggage · 遺失行李","list":[["luggage ★","行李"],["a suitcase","行李箱"],["a bag","袋子、包包"],["a trunk ★","大皮箱"],["a hatbox ★","帽盒"],["a label","標籤"],["Do not open.","請勿打開。"],["a mimic ★","擬態怪"]]},{"h":"Making peace · 和平相處","list":[["We come in peace.","我們是帶著和平來的。"],["Please stop!","請停下來！"],["Let's talk.","我們談談吧。"],["I'm sorry.","對不起。"],["It's a deal.","一言為定。"],["Who are you?","你是誰？"],["I promise.","我保證。"],["Thank you for telling me.","謝謝你告訴我。"]]},{"h":"Useful phrases · 實用句子","list":[["Which way is the Marble Mine?","彈珠礦坑往哪邊走？"],["Is it far?","很遠嗎？"],["Where is the king?","國王在哪裡？"],["We're here to help.","我們是來幫忙的。"],["Have you seen a red marble?","你有看到一顆紅色彈珠嗎？"],["It rolled down the stairs.","它滾下樓梯了。"],["Please let us through. ★","請讓我們過去。"]]},{"idiom":1,"en":"to lose your marbles","zh":"（口語）瘋了、失去理智","ex":"\"My king has lost his marbles!\"","exz":"「我的國王失去了他的彈珠！」（也就是：我的國王瘋了！）","note":"*Marbles* are small glass balls. In old American slang, your *marbles* were your good sense, so someone who has *lost their marbles* is acting a little crazy. King Clattertail lost five real ones: his Memory, Manners, Good Sense, Dignity, and Good Aim.","nz":"marbles 是小玻璃彈珠。在老式的美國俚語裡，你的 marbles 指的是你的理智，所以 lost their marbles 的人，行為有點瘋瘋的。叮噹尾國王弄丟了五顆真的彈珠：他的記性、禮貌、判斷力、尊嚴，還有準頭。"},{"idiom":1,"en":"to lose your temper","zh":"發脾氣、生氣失控","ex":"Fifty years ago, Horace lost his temper at the Pie Fair.","exz":"五十年前，霍瑞斯在派餅市集上發了脾氣。","note":"Your *temper* is your mood: how calm or angry you are. When you *lose your temper*, your calm is gone. You suddenly get very angry and shout. Most people get their temper back a minute later. Horace never did. It's still in Deep Storage.","nz":"temper 是你的脾氣、心情：你有多冷靜或多生氣。lose your temper 就是你的冷靜不見了，你突然非常生氣、大吼大叫。大部分的人一分鐘後就會把脾氣找回來。霍瑞斯從來沒有。它還在深層倉庫裡。"}],"5":[{"h":"Saying no, kindly · 溫和地說不","list":[["No.","不。"],["No, thank you.","不了，謝謝。"],["I was wrong to promise.","我不該答應的。"],["That isn't mine to give.","那不是我可以送人的。"],["But I can...","但是我可以……"],["May I borrow it? ★","我可以借它嗎？"],["I'm sorry about your chimney.","你家煙囪的事，對不起。"]]},{"h":"Jokes and riddles · 笑話與謎語","list":[["a joke","笑話"],["a riddle ★","謎語"],["funny","好笑的"],["to laugh / a laugh","笑（動詞／名詞）"],["boring","無聊的"],["Knock, knock. / Who's there?","叩叩叩。／是誰？"],["I don't get it!","我聽不懂笑點！"]]},{"h":"Dragons · 龍","list":[["a dragon","龍"],["wings / a tail / claws ★","翅膀／尾巴／爪子"],["treasure ★","寶藏"],["to fly / flew","飛／飛了"],["to sulk ★","生悶氣"],["copper ★","銅"]]},{"h":"Feelings · 感覺","list":[["calm","平靜的"],["angry","生氣的"],["brave ★","勇敢的"],["scared","害怕的"],["proud","驕傲的"],["upset","難過的、不高興的"]]},{"h":"Useful phrases · 實用句子","list":[["Are you OK?","你還好嗎？"],["Do you want to hear a joke?","你想聽一個笑話嗎？"],["Let me tell you a story.","讓我說個故事給你聽。"],["Here's a gift for you.","這是送你的禮物。"],["It was my fault. ★","是我的錯。"],["This is mine. I lost it.","這是我的。是我弄丟的。"],["I'd like to claim this, please. ★","我想認領這個，麻煩你。"]]},{"idiom":1,"en":"to keep your temper","zh":"保持冷靜、不發脾氣","ex":"\"You're not twenty-two anymore. You can keep your temper this time.\"","exz":"「你已經不是二十二歲了。這次你可以留住你的脾氣。」（也就是：這次你可以保持冷靜。）","note":"To *keep your temper* means to stay calm, even when you're angry. In Kettlebrook it means two things: stay calm, and hold on to your temper so you don't lose it again.","nz":"keep your temper 就是即使生氣也保持冷靜。在凱托溪鎮，它有兩個意思：保持冷靜，還有緊緊抓住你的脾氣，別再把它弄丟了。"},{"idiom":1,"en":"a storm in a teacup","zh":"茶杯裡的風暴（小題大作）","ex":"\"All that noise, and it was only a storm in a teacup.\"","exz":"「吵成那樣，結果只是茶杯裡的風暴。」（也就是：小事一樁，大驚小怪。）","note":"A storm is huge, and a teacup is tiny. A *storm in a teacup* is a lot of anger or worry about something very small. In Deep Storage, the Mayor's temper is a real storm in a real teacup.","nz":"暴風雨很大，茶杯很小。a storm in a teacup（茶杯裡的風暴）就是為了一件很小的事大發脾氣或大驚小怪。在深層倉庫裡，鎮長的脾氣真的是一個真茶杯裡的真風暴。"},{"idiom":1,"en":"fair and square","zh":"公平公正、光明正大","ex":"\"Let's settle it fair and square: three riddles each.\"","exz":"「我們公平公正地解決吧：各出三題謎語。」","note":"*Fair* means everyone gets the same chance. *Square* is an old word for honest: a *square deal* is an honest deal. The two words rhyme, so people say them together: *fair and square* means honestly, with no tricks. Penny and Rowan need a fair and square way to settle the harp.","nz":"fair 是公平，每個人都有一樣的機會。square 是「誠實」的老說法：a square deal 就是一筆誠實的交易。這兩個字押韻，所以大家把它們放在一起說：fair and square 就是光明正大、沒有耍花招。小銅和羅雯需要一個公平公正的方法來解決豎琴的事。"},{"idiom":1,"en":"I'm losing it!","zh":"我快抓狂了！（我快弄丟它了！）","ex":"\"Oh no, I'm losing it!\"","exz":"「糟了，我快抓不住了！」","note":"Usually, *it* means your calm. People say *I'm losing it!* when they're about to get very angry or upset. Penny meant something else: her harp, really slipping out of her claws. The spell heard the words, and took the harp.","nz":"通常這裡的 it 指的是你的冷靜。快要非常生氣或崩潰的時候，大家會說 I'm losing it!（我快抓狂了！）。小銅的意思不一樣：她指的是她的豎琴，真的正從她的爪子間滑走。咒語聽到了這句話，就把豎琴收走了。"}]}};
const PLAYER_LOCKED_GROUPS = ["4|Lost Luggage · 遺失行李"];
/* =========================================================
   KETTLEBROOK · PLAYER'S BOOK — handouts, puzzles and words for the players.
   No DM text: everything here comes from PLAYER_DATA, which build_player.py
   pulls from the DM guide's chapter data, so the two never drift apart.
   Locked items open with one tap, when the DM says so.
   ========================================================= */
const D = PLAYER_DATA;
/* ---------- state ---------- */
let opened = store.get("open", {});
let curCh = store.get("ch", 0);
const isOpen = id => !!opened[id];

/* ---------- locks ---------- */
const lockBox = (id, en, zh) => `<button class="plock" data-act="unlock" data-id="${id}">
  <span class="lk">🔒</span><span class="lt"><b>${esc(en)}</b><span class="zh">${esc(zh)}</span>
  <span class="small muted">Open it when your DM says. <span class="zh tr">主持人說可以時再打開。</span></span></span></button>`;
ACTS.unlock = b => { opened[b.dataset.id] = 1; store.set("open", opened); Music.sfx("click"); render(); };

/* ---------- pieces ---------- */
const PUZ = {
  bells:  {en:"The bell door", zh:"鐘門", how:"Ring the five bells in the right order.", hz:"照正確的順序敲響五口鐘。"},
  socks:  {en:"The odd-sock pile", zh:"單隻襪子堆", how:"Find two socks that match. Say what they look like!", hz:"找出兩隻一樣的襪子，說說看它們長什麼樣子！"},
  clock:  {en:"What time is it?", zh:"現在幾點？", how:"Look at the clock. Say the time in English.", hz:"看時鐘，用英文說出時間。"},
  marbles:{en:"The Marble Pit", zh:"彈珠池", how:"Find the king's marbles. Read the list, then look carefully.", hz:"找出國王的彈珠。先讀清單，再仔細找。"}
};
const widget = t => t === "bells" ? bellsHTML(true) : t === "socks" ? socksHTML(true) : t === "clock" ? clockHTML(true) : marblesHTML(true);
function puzzleTools(t){
  const full = `<button class="btn sm" data-act="full" data-t="${t}">⛶ Full screen 全螢幕</button>`;
  if(t === "bells") return `<button class="btn sm${BELL.glow ? " on" : ""}" data-act="pSing">🎵 We sing the song 我們唱歌</button><button class="btn sm" data-act="pBellReset">↺ Start again 重來</button>${full}`;
  if(t === "socks") return `<button class="btn sm" data-act="sockDeal">↺ New pile 新的一堆</button>${full}`;
  if(t === "clock"){ const W = clockWords(CLOCK.h, CLOCK.m);
    return `<button class="btn sm" data-act="clockNew">🎲 New time 換時間</button><button class="btn sm${CLOCK.shown ? " on" : ""}" data-act="clockShow">✓ Check 對答案</button><button class="btn sm${CLOCK.hard ? " on" : ""}" data-act="clockHard">${CLOCK.hard ? "Hard: every 5 minutes 難" : "Easy: o'clock, quarter, half 簡單"}</button>${full}
      <div class="pans">${CLOCK.shown ? `<b class="okc">${esc(W.en)}</b> ${SAY(W.en)}${W.en2 ? `<div class="muted small">or: ${esc(W.en2)} ${SAY(W.en2)}</div>` : ""}<div class="zh">${esc(W.zh)}</div>` : ""}</div>`; }
  return `<button class="btn sm" data-act="marbleDeal">↺ New pile 新的一堆</button><button class="btn sm${MARB.hard ? " on" : ""}" data-act="marbleHard">${MARB.hard ? "Hard: almost the same 難" : "Easy: clearly different 簡單"}</button>${full}`;
}
function puzzleHTML(t){ const P = PUZ[t];
  return `<div class="pz" data-pz="${t}"><h4 class="px gold">${esc(P.en)} <span class="zh">${esc(P.zh)}</span></h4>
    <p class="small">${esc(P.how)} <span class="zh tr">${esc(P.hz)}</span></p>
    <div class="pzw">${widget(t)}</div><div class="row wbtns ptools">${puzzleTools(t)}</div></div>`; }
/* the DM-guide widgets redraw themselves; the player's buttons sit outside them, so refresh those too */
const toolsRefresh = () => $$(".pz").forEach(p=>{ const b = p.querySelector(".ptools"); if(b) b.innerHTML = puzzleTools(p.dataset.pz); });
["clockNew","clockShow","clockHard","marbleHard","sockDeal","marbleDeal"].forEach(k=>{ const f = ACTS[k]; ACTS[k] = b => { f(b); toolsRefresh(); }; });
ACTS.pSing = () => { BELL.glow = !BELL.glow; store.set("kb-glow", BELL.glow); bellsRefresh(); toolsRefresh(); };
ACTS.pBellReset = () => { ACTS.bellReset(); toolsRefresh(); };
ACTS.full = b => { const P = $("#present"); P.innerHTML = widget(b.dataset.t); P.classList.add("on"); document.body.classList.add("presenting"); };
function endPresent(){ const P = $("#present"); P.classList.remove("on"); P.innerHTML = ""; document.body.classList.remove("presenting"); }

function handoutHTML(h, i){
  return `<div class="hwrap"><div class="showable" data-act="showH" data-i="${i}" role="button" tabindex="0" title="Show big 放大"><div class="handout">${hlines(h.x)}</div></div>
    <div class="mapcap">${esc(h.cap)} <span class="small muted">(tap to see it big 點一下放大)</span>${h.zh ? `<span class="zh tr">${esc(h.zh)}</span>` : ""}</div></div>`; }
ACTS.showH = b => { const h = D.handouts[+b.dataset.i]; const P = $("#present");
  P.innerHTML = `<div class="handout big">${hlines(h.x)}</div>`; P.classList.add("on"); document.body.classList.add("presenting");
  const H = P.querySelector(".handout"); let f = 12; H.style.fontSize = f + "px";
  const fits = ()=>[...H.querySelectorAll(".hl span")].every(l=>l.offsetWidth <= H.clientWidth * .86) && H.offsetHeight < innerHeight * .9;
  while(f < 64 && fits()){ f += 1; H.style.fontSize = f + "px"; } H.style.fontSize = (f - 1) + "px"; };

const wordsHTML = list => `<div class="wlist">${list.map(w=>`<div class="li"><div class="main"><b>${esc(w[0])}</b> ${SAY(w[0].replace(/ ★$/,""))}<span class="zh">${esc(w[1])}</span></div></div>`).join("")}</div>`;
const idiomHTML = b => `<div class="idiom"><div class="px gold" style="font-size:24px">${esc(b.en)} ${SAY(b.en)}</div><div class="zh">${esc(b.zh)}</div>
  <p><i>${esc(b.ex)}</i> ${SAY(b.ex)}<span class="zh">${esc(b.exz)}</span></p><p class="small">${mdi(b.note)}</p>${b.nz ? `<p class="zh small">${esc(b.nz)}</p>` : ""}</div>`;
/* word groups that would give away a surprise stay locked, like the handouts */
const LOCKED_GROUPS = PLAYER_LOCKED_GROUPS;

/* ---------- pages ---------- */
function home(){
  return `<div class="ptitle"><div class="kick px">PLAYER'S BOOK · 玩家手冊</div><h2 class="gold">The Lost-and-Found of Kettlebrook</h2><div class="zh">凱托溪鎮的失物招領處</div></div>
  <div class="dm"><p>Handouts, puzzles and words for your adventure. Pick the chapter you're playing. Some things are 🔒 locked: open them when your DM says.</p>
  <div class="zh">冒險要用的講義、謎題和單字。選你正在玩的章節。有些東西上了 🔒 鎖：主持人說可以時再打開。</div></div>
  <div class="chlist">${D.chapters.map(c=>`<button class="chcard" data-act="goCh" data-ch="${c.n}"><span class="px num">${c.n}</span><span><b>${esc(c.t)}</b><span class="zh">${esc(c.z)}</span></span></button>`).join("")}</div>
  <p class="small muted">Tap 🔊 to hear a word. Tap ⚙️ to hide the Chinese, change the text size, or slow down the voice. <span class="zh tr">點 🔊 聽發音。點 ⚙️ 可以隱藏中文、調整文字大小，或放慢朗讀速度。</span></p>`; }
function chapter(n){
  const C = D.chapters[n-1];
  const hs = D.handouts.map((h,i)=>[h,i]).filter(([h])=>h.ch === n);
  const pz = D.puzzles.filter(p=>p.ch === n);
  let k = 0, out = `<div class="ptitle"><div class="kick px">CHAPTER ${n} · 第 ${n} 章</div><h2 class="gold">${esc(C.t)}</h2><div class="zh">${esc(C.z)}</div></div>`;
  if(hs.length) out += `<h3 class="bh">📜 Handouts <span class="zh">講義</span></h3>` + hs.map(([h,i],j)=>{ const id = "h" + i; return isOpen(id) ? handoutHTML(h,i) : lockBox(id, `Handout ${j+1}`, `講義 ${j+1}`); }).join("");
  if(pz.length) out += `<h3 class="bh">🧩 Puzzles <span class="zh">謎題</span></h3>` + pz.map((p,j)=>{ const id = "p" + p.t; return isOpen(id) ? puzzleHTML(p.t) : lockBox(id, `Puzzle ${j+1}`, `謎題 ${j+1}`); }).join("");
  out += `<h3 class="bh">✏️ My notes <span class="zh">我的筆記</span></h3>
    <textarea class="notes" data-ch="${n}" placeholder="Names, clues, words to remember… 名字、線索、想記住的字……">${esc(store.get("notes" + n, ""))}</textarea>`;
  const W = D.words[n] || [];
  out += `<h3 class="bh">📖 Words <span class="zh">單字</span></h3><p class="small muted">★ = a harder word. <span class="zh tr">★ = 比較難的字。</span></p>`;
  W.forEach(g=>{ if(g.idiom){ const id = `i${n}-${k++}`;
      out += isOpen(id) ? `<h4 class="wh">💬 Idiom <span class="zh">慣用語</span></h4>` + idiomHTML(g) : lockBox(id, `Idiom ${k}`, `慣用語 ${k}`);
    } else { const id = `w${n}-${g.h}`;
      out += `<h4 class="wh">${esc(g.h)}</h4>` + (LOCKED_GROUPS.includes(`${n}|${g.h}`) && !isOpen(id) ? lockBox(id, "More words", "更多單字") : wordsHTML(g.list)); } });
  out += `<div class="row chnav">${n > 1 ? `<button class="btn" data-act="goCh" data-ch="${n-1}">◀ Chapter ${n-1}</button>` : ""}<button class="btn" data-act="goCh" data-ch="0">☰ All chapters 全部章節</button>${n < 5 ? `<button class="btn" data-act="goCh" data-ch="${n+1}">Chapter ${n+1} ▶</button>` : ""}</div>`;
  return out; }
function render(){ const y = window.scrollY; $("#main").innerHTML = curCh ? chapter(curCh) : home(); fitHandouts($("#main")); window.scrollTo(0, y); }
ACTS.goCh = b => { curCh = +b.dataset.ch; store.set("ch", curCh); render(); window.scrollTo(0, 0); };
document.addEventListener("input", e=>{ const t = e.target.closest(".notes"); if(t) store.set("notes" + t.dataset.ch, t.value); });

/* ---------- settings ---------- */
let fs = store.get("fs", 17);
function applyPrefs(){ document.documentElement.style.setProperty("--fs", fs + "px");
  if(store.get("theme", "dark") === "light") document.documentElement.setAttribute("data-theme","light"); else document.documentElement.removeAttribute("data-theme");
  document.body.classList.toggle("nozh", !store.get("zh", 1)); }
function openSettings(){
  const seg = (act, vals, cur) => `<div class="seg">${vals.map(([v,l])=>`<button data-act="${act}" data-v="${v}" class="${String(cur)===String(v)?"on":""}">${l}</button>`).join("")}</div>`;
  $("#ovIn").innerHTML = `<div class="hd"><h3>⚙️ Settings 設定</h3><button class="ib" data-act="closeOv" aria-label="Close 關閉">✕</button></div>
    <label class="fl">Chinese <span class="zh">中文</span></label>${seg("setZh", [[1,"Show 顯示"],[0,"Hide 隱藏"]], store.get("zh",1))}
    <label class="fl">Text size <span class="zh">文字大小</span></label>${seg("setFs", [[15,"S"],[17,"M"],[19,"L"],[21,"XL"]], fs)}
    <label class="fl">Look <span class="zh">外觀</span></label>${seg("setTheme", [["dark","Night 夜晚"],["light","Day 白天"]], store.get("theme","dark"))}
    <label class="fl">Reading speed <span class="zh">朗讀速度</span></label>${seg("setRate", [[.7,"Slow 慢"],[.85,"A bit slow 稍慢"],[1,"Normal 正常"]], rate)}
    <label class="fl">Sound effects <span class="zh">音效</span></label>${seg("setSfx", [[1,"On 開"],[0,"Off 關"]], Music.sfxVol > 0 ? 1 : 0)}
    <hr class="hr"><p class="small">New players? Lock everything again, clear the notes and reset the puzzles.<span class="zh tr">換新玩家了嗎？重新上鎖、清除筆記，並重設所有謎題。</span></p>
    <button class="btn sm red" data-act="resetBook">↺ Reset this book 重設手冊</button>`;
  $("#ov").classList.add("on"); }
ACTS.closeOv = () => $("#ov").classList.remove("on");
ACTS.setZh = b => { store.set("zh", +b.dataset.v); applyPrefs(); openSettings(); };
ACTS.setFs = b => { fs = +b.dataset.v; store.set("fs", fs); applyPrefs(); fitHandouts(); openSettings(); };
ACTS.setTheme = b => { store.set("theme", b.dataset.v); applyPrefs(); openSettings(); };
ACTS.setRate = b => { rate = +b.dataset.v; store.set("rate", rate); openSettings(); say("What time is it?"); };
ACTS.setSfx = b => { Music.setSfx(+b.dataset.v ? .7 : 0); openSettings(); };
ACTS.resetBook = () => { opened = {}; store.set("open", opened); [1,2,3,4,5].forEach(n=>store.set("notes" + n, ""));
  ACTS.bellReset(); BELL.glow = false; store.set("kb-glow", false); sockDeal(); marbleDeal(); clockNew(); CLOCK.shown = false;
  curCh = 0; store.set("ch", 0); ACTS.closeOv(); render(); toast("The book is ready for new players. 手冊已重設。"); };
$("#ov").addEventListener("click", e=>{ if(e.target === $("#ov")) ACTS.closeOv(); });

/* ---------- clicks ---------- */
document.addEventListener("click", e=>{
  const s = e.target.closest("[data-say]"); if(s){ e.preventDefault(); e.stopPropagation(); say(s.dataset.say, s); return; }
  const a = e.target.closest("[data-act]"); if(a && ACTS[a.dataset.act]){ e.preventDefault(); ACTS[a.dataset.act](a, e); return; }
});
document.addEventListener("keydown", e=>{ if(e.key === "Escape"){ if(document.body.classList.contains("presenting")) endPresent(); else ACTS.closeOv(); }
  if((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-say],[data-act]:not(button)")){ e.preventDefault(); e.target.click(); } });
$("#present").addEventListener("click", e=>{ if(e.target.closest(".wdg") && !e.target.closest(".wclose")) return; endPresent(); });
$("#setBtn").addEventListener("click", openSettings);
$("#homeBtn").addEventListener("click", ()=>{ curCh = 0; store.set("ch", 0); render(); window.scrollTo(0,0); });
$("#goBtn").addEventListener("click", e=>{ e.stopPropagation(); document.body.classList.remove("titled"); KScene.stop(); render(); });
applyPrefs(); KScene.start(); render();

</script>
</body>
</html>
